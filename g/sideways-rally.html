<script>
/*! © 2026 Asaf. All rights reserved. Free to play; not to be copied or claimed as your own. */
(function () {
  'use strict';
  var CFG = {"id": "sideways-rally", "owner": "Asaf", "year": 2026, "mark": "bl", "dx": 0, "dy": 0, "mount": null, "hubCss": null};
  var NOTICE = '© ' + CFG.year + ' ' + CFG.owner;

  // Inside Asaf's Arcade the game runs in a frame of the arcade page: borrow its cloud saves, let it show the notice.
  var hub = null;
  try {
    var P = window.parent;
    if (P && P !== window && P.__ASAF_ARCADE__ && P.__ASAF_ARCADE__.v === 1) hub = P.__ASAF_ARCADE__;
  } catch (e) { hub = null; }
  window.__ASAF_HUB__ = !!hub;
  if (hub) {
    window.__asafClaude = makeClaude(hub, CFG.id);
    if (CFG.hubCss) {
      var hs = document.createElement('style');
      hs.textContent = CFG.hubCss;
      (document.head || document.documentElement).appendChild(hs);
    }
    return;
  }

  // ---- played on its own: a small permanent tag plus a short notice when the game opens
  var css = '' +
    '#asaf-cr{all:initial;position:fixed;z-index:2147483646;display:block;box-sizing:border-box;pointer-events:none;user-select:none;-webkit-user-select:none;' +
    'font:600 10px/1 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;letter-spacing:.04em;color:rgba(255,255,255,.88);' +
    'background:rgba(6,6,16,.52);padding:4px 8px;border-radius:999px;white-space:nowrap;opacity:.82;transition:opacity .7s ease}' +
    '#asaf-cr.asaf-busy{opacity:.14}' +
    '#asaf-cr-toast{all:initial;position:fixed;z-index:2147483647;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));display:block;box-sizing:border-box;' +
    'transform:translateX(-50%);pointer-events:none;user-select:none;-webkit-user-select:none;width:max-content;max-width:min(90vw,430px);' +
    'font:500 12.5px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#fff;text-align:center;' +
    'background:rgba(8,8,20,.9);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:9px 15px;box-shadow:0 10px 30px rgba(0,0,0,.5);' +
    'opacity:0;animation:asafCrIn .45s ease .6s forwards,asafCrOut .6s ease 5.2s forwards}' +
    '#asaf-cr-toast b{all:unset;font-weight:800}' +
    '#asaf-cr-toast i{all:unset;display:block;margin-top:2px;font-size:11.5px;opacity:.78}' +
    '@keyframes asafCrIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}' +
    '@keyframes asafCrOut{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,0)}}';
  var st = document.createElement('style');
  st.id = 'asaf-cr-style';
  st.textContent = css;
  (document.head || document.documentElement).appendChild(st);

  var dx = 6 + (CFG.dx || 0), dy = 6 + (CFG.dy || 0);
  var T = 'top:calc(' + dy + 'px + env(safe-area-inset-top,0px));';
  var B = 'bottom:calc(' + dy + 'px + env(safe-area-inset-bottom,0px));';
  var L = 'left:calc(' + dx + 'px + env(safe-area-inset-left,0px));';
  var R = 'right:calc(' + dx + 'px + env(safe-area-inset-right,0px));';
  var C = 'left:50%;transform:translateX(-50%);';
  var POS = { tl: T + L, tr: T + R, bl: B + L, br: B + R, tc: T + C, bc: B + C };

  var tag = document.createElement('div');
  tag.id = 'asaf-cr';
  tag.setAttribute('role', 'note');
  tag.setAttribute('aria-label', NOTICE + '. All rights reserved.');
  tag.textContent = NOTICE;
  tag.style.cssText = POS[CFG.mark] || POS.br;

  var toast = document.createElement('div');
  toast.id = 'asaf-cr-toast';
  toast.setAttribute('aria-hidden', 'true');
  var b = document.createElement('b'); b.textContent = NOTICE + ' · All rights reserved';
  var i = document.createElement('i'); i.textContent = 'Free to play. Please don’t copy it or claim it as your own.';
  toast.appendChild(b); toast.appendChild(i);
  setTimeout(function () { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 6200);

  function home() {
    if (CFG.mount) { var m = document.querySelector(CFG.mount); if (m) return m; }
    return document.documentElement;
  }
  function mount() {
    var h = home();
    if (tag.parentNode !== h) h.appendChild(tag);
  }
  function start() {
    mount();
    home().appendChild(toast);
    setInterval(mount, 2500);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();

  // fade the tag while someone is actively playing, bring it back when they pause
  var idle = 0;
  function busy() {
    tag.classList.add('asaf-busy');
    clearTimeout(idle);
    idle = setTimeout(function () { tag.classList.remove('asaf-busy'); }, 2600);
  }
  ['pointerdown', 'keydown', 'touchstart', 'wheel'].forEach(function (ev) {
    window.addEventListener(ev, busy, { capture: true, passive: true });
  });

  // ---- cloud saves through the arcade page (strings only cross between the two pages)
  function makeClaude(H, gid) {
    var cache = {};
    function fail(code) { var e = new Error(code || 'unavailable'); e.code = code || 'unavailable'; return e; }
    function call(fn, args) {
      return new Promise(function (res, rej) {
        var p;
        try { p = H[fn].apply(null, [gid].concat(args || [])); } catch (e) { rej(fail('unavailable')); return; }
        Promise.resolve(p).then(function (s) {
          var r;
          try { r = JSON.parse(s); } catch (e) { rej(fail('internal')); return; }
          if (r && r.ok) res(r.v); else rej(fail(r && r.code));
        }, function () { rej(fail('unavailable')); });
      });
    }
    function snap(path, v) {
      var parts = path.split('/');
      return { id: parts[parts.length - 1], exists: v !== null && v !== undefined,
        data: function () { return v === null || v === undefined ? undefined : JSON.parse(JSON.stringify(v)); } };
    }
    function doc(path) {
      return {
        id: path.split('/').pop(), path: path,
        get: function () { return call('get', [path]).then(function (v) { return snap(path, v); }); },
        set: function (data) { return call('set', [path, JSON.stringify(data)]).then(function () {}); }
      };
    }
    function query(path, lim) {
      return {
        path: path,
        limit: function (n) { return query(path, n); },
        doc: function (id) { return doc(path + '/' + id); },
        onSnapshot: function (next, error) {
          var dead = false, off = null;
          function onErr(code) { if (!dead && typeof error === 'function') error(fail(code)); }
          try {
            off = H.watch(gid, path, lim || 0, function (s) {
              if (dead) return;
              var rows; try { rows = JSON.parse(s); } catch (e) { return; }
              var docs = rows.map(function (d) { return snap(path + '/' + d.id, d.v); });
              next({ docs: docs, size: docs.length, empty: !docs.length, forEach: function (f) { docs.forEach(f); } });
            }, onErr);
          } catch (e) { setTimeout(function () { onErr('unavailable'); }, 0); }
          return function () { dead = true; try { if (off) off(); } catch (e) { /* page gone */ } };
        }
      };
    }
    var db = { doc: doc, collection: function (p) { return query(p, 0); } };
    var user = {
      id: function () { return call('uid', []); },
      me: function () { return call('uid', []).then(function (id) { return { id: id }; }); },
      can: function (n) { return call('can', [String(n)]); },
      profiles: function (ids) { return call('profiles', [JSON.stringify(ids || [])]); },
      isOwner: function () { return false; },
      canEdit: function () { return false; }
    };
    return {
      use: function (name) {
        if (!cache[name]) {
          cache[name] = call('ready', [String(name)]).then(function (ok) {
            if (!ok) return null;
            return name === 'db' ? db : name === 'user' ? user : null;
          }, function () { return null; });
        }
        return cache[name];
      }
    };
  }
})();
</script>

:root {
  --bg: #12122b; --panel: #1c1c40; --panel2: #262659; --ink: #0b0b1c; --orange: #ff6a1f; --yellow: #ffd21f; --cyan: #3ee8ff; --pink: #ff4fa3; --green: #33d17a;
  --text: #ffffff; --dim: #a9a9d6;
  --race: 'Racing Sans One', 'Arial Black', Impact, sans-serif;
  --body: 'Rubik', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; }
body { font: 500 15px/1.4 var(--body); touch-action: none; user-select: none; -webkit-user-select: none; overscroll-behavior: none; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
#cv { position: fixed; inset: 0; display: block; touch-action: none; }

/* touch zones */
.tz { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); width: 74px; height: 74px; border-radius: 50%; display: grid; place-items: center; font-size: 26px; color: rgba(255,255,255,.55);
  background: rgba(11,11,28,.28); border: 2px solid rgba(255,255,255,.18); pointer-events: none; opacity: 0; transition: opacity .2s, transform .08s, background .08s; z-index: 5; }
.tz.l { left: calc(18px + env(safe-area-inset-left, 0px)); } .tz.r { right: calc(18px + env(safe-area-inset-right, 0px)); }
body.racing .tz { opacity: 1; }
.tz.on { background: rgba(255,106,31,.55); color: #fff; transform: scale(.92); border-color: rgba(255,210,31,.8); }
@media (hover: hover) and (pointer: fine) { .tz { display: none; } }

/* HUD */
#hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) 0 env(safe-area-inset-left, 0px); }
#hud[hidden] { display: none; }
.hl { position: absolute; left: calc(12px + env(safe-area-inset-left, 0px)); top: calc(8px + env(safe-area-inset-top, 0px)); }
.pos { font: 400 50px/0.9 var(--race); color: var(--yellow); text-shadow: 0 3px 0 var(--ink), 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 -2px 0 var(--ink); }
.pos span { font-size: 24px; margin-left: 2px; }
.pos small { font: 700 15px var(--body); color: #fff; margin-left: 4px; text-shadow: 0 2px 0 var(--ink); }
body.solo .pos { display: none; }
.lap { margin-top: 4px; font: 700 13px var(--body); letter-spacing: .08em; text-shadow: 0 2px 0 var(--ink); }
.lap b { font: 400 22px var(--race); color: #fff; margin-left: 4px; }
.hc { position: absolute; left: 50%; top: calc(10px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); text-align: center; }
.hc b { display: block; font: 700 24px/1 var(--body); font-variant-numeric: tabular-nums; text-shadow: 0 2px 0 var(--ink), 0 0 12px rgba(0,0,0,.5); }
.hc small { display: block; margin-top: 3px; font: 700 12px var(--body); color: var(--cyan); letter-spacing: .06em; text-shadow: 0 2px 0 var(--ink); font-variant-numeric: tabular-nums; }
#pauseBtn { pointer-events: auto; position: absolute; right: calc(10px + env(safe-area-inset-right, 0px)); top: calc(8px + env(safe-area-inset-top, 0px)); width: 44px; height: 44px; border-radius: 12px;
  background: rgba(11,11,28,.55); border: 2px solid rgba(255,255,255,.25); display: grid; place-items: center; color: #fff; }
#meter { position: absolute; left: 50%; bottom: calc(26px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: flex; gap: 4px; align-items: center; opacity: .35; transition: opacity .15s; }
#meter.on { opacity: 1; }
#meter i { position: relative; width: 34px; height: 10px; border-radius: 5px; background: rgba(11,11,28,.6); border: 2px solid rgba(255,255,255,.5); overflow: hidden; }
#meter i::after { content: ''; position: absolute; inset: 0; transform-origin: left; transform: scaleX(var(--f, 0)); background: #5ecbff; }
#meter i:nth-child(2)::after { background: #ffa630; } #meter i:nth-child(3)::after { background: #ff4dff; }
#meter.l1 i:nth-child(1), #meter.l2 i:nth-child(2), #meter.l3 i:nth-child(3) { box-shadow: 0 0 12px currentColor; }
#meter.l1 i:nth-child(1) { color: #5ecbff; } #meter.l2 i:nth-child(2) { color: #ffa630; } #meter.l3 i:nth-child(3) { color: #ff4dff; }
#meter span { font: 400 14px var(--race); margin-left: 4px; text-shadow: 0 2px 0 var(--ink); }
@media (min-width: 960px) and (min-height: 640px) {
  .hl { transform: scale(1.3); transform-origin: top left; }
  .hc { transform: translateX(-50%) scale(1.3); transform-origin: top center; }
  #pauseBtn { transform: scale(1.12); transform-origin: top right; }
  #meter { transform: translateX(-50%) scale(1.45); transform-origin: bottom center; }
}
#wrong { position: absolute; left: 50%; top: 36%; transform: translate(-50%, -50%) scale(.9); font: 400 34px var(--race); color: #fff; background: #e8202f; padding: 6px 18px; border-radius: 10px; border: 3px solid var(--ink);
  box-shadow: 0 5px 0 var(--ink); opacity: 0; transition: opacity .15s, transform .15s; }
#wrong.on { opacity: 1; transform: translate(-50%, -50%) scale(1); animation: blink .5s steps(2) infinite; }
@keyframes blink { 50% { opacity: .55; } }

#count { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%); z-index: 12; font: 400 120px/1 var(--race); pointer-events: none; opacity: 0; text-shadow: 0 6px 0 var(--ink), 4px 0 0 var(--ink), -4px 0 0 var(--ink), 0 -4px 0 var(--ink); }
#count.on { opacity: 1; } #count.n { color: #ffffff; } #count.go { color: var(--green); }
#count.pop { animation: pop .6s cubic-bezier(.2, 1.6, .4, 1) both; }
@keyframes pop { 0% { transform: translate(-50%, -50%) scale(2.2); opacity: 0; } 30% { opacity: 1; } 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; } }

#toast { position: fixed; left: 50%; top: calc(196px + env(safe-area-inset-top, 0px)); transform: translate(-50%, -8px); z-index: 12; text-align: center; pointer-events: none; opacity: 0; transition: opacity .2s, transform .2s;
  background: rgba(11,11,28,.78); border: 2px solid rgba(255,255,255,.2); border-radius: 14px; padding: 8px 16px; width: max-content; max-width: 90vw; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }
@media (orientation: landscape) { #toast { top: calc(70px + env(safe-area-inset-top, 0px)); } }
#toast b { display: block; font: 400 22px/1.1 var(--race); }
#toast small { display: block; margin-top: 2px; color: var(--dim); font-weight: 600; }

function mergeSaves(a, b) {
  const out = JSON.parse(JSON.stringify((b.updated || 0) > (a.updated || 0) ? b : a));
  out.cars = Object.assign({}, a.cars, b.cars);
  out.cups = {};
  for (const k of new Set(Object.keys(a.cups).concat(Object.keys(b.cups)))) { const x = a.cups[k] || 0, y = b.cups[k] || 0; out.cups[k] = x && y ? Math.min(x, y) : x || y; } // 1 = gold, best (lowest) wins
  for (const key of ['best', 'laps']) {
    out[key] = {};
    for (const k of new Set(Object.keys(a[key]).concat(Object.keys(b[key])))) { const x = a[key][k] || 0, y = b[key][k] || 0; out[key][k] = x && y ? Math.min(x, y) : x || y; }

  for (const k of ['races', 'wins', 'drifts', 'boosts', 'coinsTotal']) out.stats[k] = Math.max(a.stats[k] || 0, b.stats[k] || 0);

// The game defines SAVE_KEY, defaultSave() and mergeSaves(a, b) before this file.
function deepFill(t, d) {

}

  load() {

  persistLocal() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(this.data)); } catch (e) { /* ignore */ } },
  persist() { this.data.updated = Date.now(); this.persistLocal(); clearTimeout(this._t); this._t = setTimeout(() => this.cloudWrite(), 900); },
  async cloudInit() {

      const [db, user] = await Promise.all([cl.use('db'), cl.use('user')]);
      if (!db || !user) return;
      const id = await user.id();
      if (!id) return;
      const ref = db.doc('data/users/' + id + '/save');
      let timer = 0;
      const snap = await Promise.race([ref.get(), new Promise((_, rej) => { timer = setTimeout(() => rej(new Error('timeout')), 10000); })]);
      clearTimeout(timer);

      if (snap && snap.exists) {

        if (body && body.save) {

// Each field is [name, bits]. The code carries an 11-bit checksum, so a typo or a made-up code is rejected.
const B32 = '0123456789ABCDEFGHJKMNPQRSTVWXYZ'; // no I, L, O, U: easy to read out loud

      case 'crash': if (a === P) { Sfx.crash(c); G.shake = Math.max(G.shake, Math.min(12, c / 30)); vibrate(35); } break;
      case 'lap': Sfx.lap(); UI.toast(b ? 'Best lap ' + fmtTime(b) : 'Lap ' + fmtTime(b), c ? 'New personal best!' : '', c ? 'gold' : ''); break;
      case 'finalLap': Sfx.finalLap(); UI.toast('Final lap!', '', 'hot'); break;
      case 'finish': Sfx.finish(a.place); this.confetti(); break;
    }
  },
  confetti() {
    const P = G.player;
    for (let i = 0; i < 90; i++) {
      const a = Math.random() * TAU, s = 120 + Math.random() * 380;
      G.fx.push({ k: 'confetti', x: P.x, y: P.y, vx: Math.cos(a) * s + P.vx * 0.5, vy: Math.sin(a) * s + P.vy * 0.5, life: 1.8, max: 1.8, size: 7, col: ['#ff3b3b', '#ffd21f', '#2fd36b', '#3d7bff', '#ff5fd2', '#ffffff'][i % 6], rot: Math.random() * 6 });
    }
  },

  finish() {
    G.over = true;
    const P = G.player, total = P.finishT;
    // anyone still driving gets a projected time
    const avgLap = total / LAPS;
    const rows = G.order.map((c) => ({
      name: c.name, car: c.def.id, color: c.color, player: c.player, place: c.place, best: c.best,
      time: c.finished ? c.finishT : total + Math.max(0.3, (LAPS + 1 - c.prog)) * avgLap * (1.02 + 0.03 * (c.place - P.place)),
    }));
    rows.sort((a, b) => a.time - b.time);
    rows.forEach((r, k) => { r.place = k + 1; });
    const me = rows.find((r) => r.player);
    G.results = { mode: G.mode, def: G.def, rows, place: me.place, time: total, best: P.best, laps: P.laps.slice(), solo: !G.cars.some((c) => c.ai) };
    Meta.raceDone(G.results);
  },
};

// best-lap ghosts live on this device only (they are big)
const Ghosts = {
  key(id) { return 'sidewaysrally.ghost.' + id; },
  load(id) {
    try {
      const raw = localStorage.getItem(this.key(id));
      if (!raw) return null;
      const o = JSON.parse(raw), bin = atob(o.d), n = bin.length / 2, a = new Float32Array(n);
      for (let i = 0; i < n; i++) { let v = bin.charCodeAt(i * 2) | (bin.charCodeAt(i * 2 + 1) << 8); if (v > 32767) v -= 65536; a[i] = v; }
      for (let i = 2; i < n; i += 3) a[i] = a[i] / 5000 + Math.PI;
      return { time: o.t, frames: a };
    } catch (e) { return null; }
  },
  save(id, g) {
    try {
      let s = '';
      for (let i = 0; i < g.frames.length; i++) { let v = Math.round(i % 3 === 2 ? (((g.frames[i] % TAU) + TAU) % TAU - Math.PI) * 5000 : g.frames[i]); v = clamp(v, -32768, 32767); if (v < 0) v += 65536; s += String.fromCharCode(v & 255, v >> 8); }

    } catch (e) { /* storage full: no ghost */ }
  },
};

  startEngine() {
    if (!Snd.mx || this.eng) return;
    const ac = Snd.ac, mx = Snd.mx;
    const out = ac.createGain(); out.gain.value = 0; out.connect(mx.sfx);
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900; lp.Q.value = 2; lp.connect(out);
    const o1 = ac.createOscillator(); o1.type = 'sawtooth'; o1.frequency.value = 60; o1.connect(lp);
    const o2 = ac.createOscillator(); o2.type = 'square'; o2.frequency.value = 30; const g2 = ac.createGain(); g2.gain.value = 0.5; o2.connect(g2); g2.connect(lp);
    const sq = ac.createGain(); sq.gain.value = 0; sq.connect(mx.sfx);
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1500; bp.Q.value = 3; bp.connect(sq);
    const nz = ac.createBufferSource(); nz.buffer = mx.noise; nz.loop = true; nz.connect(bp);
    o1.start(); o2.start(); nz.start();
    this.eng = { out, lp, o1, o2, sq, bp, nz };
  },
  stopEngine() {
    const e = this.eng; if (!e) return;
    const t = Snd.ac.currentTime;
    e.out.gain.setTargetAtTime(0, t, 0.05); e.sq.gain.setTargetAtTime(0, t, 0.05);
    setTimeout(() => { try { e.o1.stop(); e.o2.stop(); e.nz.stop(); e.out.disconnect(); e.sq.disconnect(); } catch (er) { /* gone */ } }, 300);
    this.eng = null;
  },
  frame() {
    const e = this.eng;
    if (!e) return;
    const t = Snd.ac.currentTime, P = G && G.player;
    const live = P && !G.paused && !G.demo && Save.data.settings.sound;
    if (!live) { e.out.gain.setTargetAtTime(0, t, 0.08); e.sq.gain.setTargetAtTime(0, t, 0.05); return; }
    const sp = clamp(P.spd / P.def.top, 0, 1.4), gear = (sp * 4) % 1, f = 48 + sp * 70 + gear * 34 + (P.boostT > 0 ? 25 : 0);
    e.o1.frequency.setTargetAtTime(f, t, 0.05); e.o2.frequency.setTargetAtTime(f / 2, t, 0.05);
    e.lp.frequency.setTargetAtTime(500 + sp * 1600, t, 0.08);
    e.out.gain.setTargetAtTime(G.state === 'count' ? 0.05 : 0.07 + sp * 0.05, t, 0.08);
    const sl = P.skidOn && P.onTrack ? clamp(Math.abs(P.vl) / 260, 0.2, 1) : 0;
    e.sq.gain.setTargetAtTime(sl * 0.1, t, 0.04); e.bp.frequency.setTargetAtTime(1300 + sl * 600, t, 0.05);
  },
  beep(go) { Snd.play('beep', 0, (m, t, S) => { m.osc(t, 'square', go ? 880 : 440, go ? 0.5 : 0.22, 0.12, 0.004, S); m.osc(t, 'sine', go ? 1760 : 880, go ? 0.4 : 0.15, 0.05, 0.004, S); }, true); },
  driftOn() { Snd.play('dOn', 0.2, (m, t, S) => m.nz(t, 0.12, 'bandpass', 2200, 2, 0.08, 0.01, S, 1400)); },
  level(n) { Snd.play('lv', 0.05, (m, t, S) => { const f = [660, 880, 1175][n - 1]; m.osc(t, 'triangle', f, 0.14, 0.12, 0.003, S, f * 1.5); m.osc(t + 0.05, 'sine', f * 2, 0.1, 0.05, 0.003, S); }); },
  boost(p) { Snd.play('bst', 0.15, (m, t, S) => { m.nz(t, 0.5, 'bandpass', 600, 0.8, 0.22 * (0.6 + p * 0.5), 0.02, S, 3200); m.osc(t, 'sawtooth', 120, 0.4, 0.08, 0.01, S, 380); }); },
  bump(v) { Snd.play('bump', 0.12, (m, t, S) => { m.nz(t, 0.12, 'lowpass', 900, 0.8, Math.min(0.35, 0.1 + v / 900), 0.002, S, 200); m.osc(t, 'sine', 120, 0.12, 0.18, 0.002, S, 60); }); },
  crash(v) { Snd.play('crash', 0.15, (m, t, S) => { m.nz(t, 0.3, 'lowpass', 1500, 0.6, Math.min(0.45, 0.15 + v / 700), 0.002, S, 120); m.osc(t, 'sine', 90, 0.25, 0.25, 0.002, S, 40); }); },

// race music: four-on-the-floor in E minor, Em C G D
const SONG_RACE = {
  bpm: 132, div: 4, PROG: [[52, 55, 59], [48, 52, 55], [55, 59, 62], [50, 54, 57]],
  RIFF: [76, null, 74, 76, null, 79, null, 76, 74, null, 71, null, 74, null, 71, 69],
  play(mx, t, step, spb) {
    const s = step % 16, bar = Math.floor(step / 16) % 4, ch = this.PROG[bar], sec = Math.floor(step / 64) % 4;
    if (s % 4 === 0) mx.kick(t, 0.85);
    if (s === 4 || s === 12) mx.clap(t, 0.7);
    if (s % 2 === 1) mx.hat(t, 0.55, s % 4 === 3);
    if (s % 2 === 0) mx.bass(t, mtof(ch[0] - 24 + (s % 8 === 6 ? 12 : 0)), spb * 1.6, 0.85, 1800);
    if (sec >= 1) { const n = ch[(s >> 1) % 3] + 24; if (s % 2 === 0) mx.lead(t, mtof(n), spb * 0.9, 0.45, 'sawtooth'); }
    if (sec >= 2) { const r = this.RIFF[s]; if (r && bar % 2 === 0) mx.lead(t, mtof(r), spb * 1.8, 0.7, 'square'); }
    if (s === 0) mx.pad(t, ch.map((n) => mtof(n + 12)), spb * 15, 0.6);
  },
};
const SONG_MENU = {
  bpm: 100, div: 4, PROG: [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]],
  play(mx, t, step, spb) {
    const s = step % 16, bar = Math.floor(step / 16) % 4, ch = this.PROG[bar];
    if (s === 0 || s === 10) mx.kick(t, 0.5);
    if (s === 4 || s === 12) mx.snare(t, 0.35);
    if (s % 4 === 2) mx.hat(t, 0.4);
    if (s % 4 === 0) mx.bass(t, mtof(ch[0] - 24), spb * 3, 0.6, 900);
    if (s % 2 === 0) mx.bell(t, mtof(ch[(s / 2) % 3] + 12 + (s >= 8 ? 12 : 0)), spb * 2, 0.5);
    if (s === 0) mx.pad(t, ch.map((n) => mtof(n)), spb * 16, 0.8);
  },
};

// ---------------------------------------------------------------- meta.js (coins, records, cups, daily rally, brag codes)
const CODEC = makeCodec('sideways-rally', [['v', 2], ['mode', 2], ['day', 12], ['track', 5], ['car', 3], ['time', 17], ['lap', 15], ['place', 3]]);
const Meta = {
  cupUnlocked(cup) { return !cup.need || !!Save.data.cups[cup.need]; },
  trackUnlocked(id) { return this.cupUnlocked(cupOfTrack(id)); },
  dailyDef() { return dailyTrack(dayIndex()); },
  dailyState() {
    const d = Save.data.daily, idx = dayIndex();
    if (d.idx !== idx) { d.idx = idx; d.best = 0; d.lap = 0; d.tries = 0; d.paid = false; }
    return d;
  },
  startCup(cup) {
    const S = Save.data, drivers = makeDrivers(cup.skill, hash32(cup.id + Date.now()), S.car), pts = { You: 0 };
    for (const d of drivers) pts[d.name] = 0;
    S.cupRun = { cup: cup.id, race: 0, car: S.car, drivers, pts };
    Save.persist();
  },
  raceDone(res) {
    const S = Save.data, id = res.def.id;
    S.stats.races++;
    let coins = 0;
    res.newLap = false; res.newBest = false; res.newDaily = false;
    if (res.best && (!S.laps[id] || res.best < S.laps[id])) { if (S.laps[id]) res.newLap = true; S.laps[id] = res.best; }
    if (res.mode === 'cup' || res.mode === 'quick') { coins += RACE_COINS[res.place - 1] || 30; if (res.place === 1) S.stats.wins++; }
    if (res.mode === 'trial') { coins += 25; if (!S.best[id] || res.time < S.best[id]) { if (S.best[id]) res.newBest = true; S.best[id] = res.time; coins += res.newBest ? 25 : 0; } }
    if (res.mode === 'daily') {
      const d = this.dailyState();
      d.tries++;
      if (!d.best || res.time < d.best) { res.newDaily = !!d.best; d.best = res.time; d.lap = res.best; d.car = S.car; }
      if (!d.paid) { coins += 80; d.paid = true; } else if (res.newDaily) coins += 25;
    }
    if (res.mode === 'cup' && S.cupRun) {
      const run = S.cupRun;
      for (const r of res.rows) { const k = r.player ? 'You' : r.name; run.pts[k] = (run.pts[k] || 0) + (POINTS[r.place - 1] || 0); }
      run.race++;
      const stand = Object.keys(run.pts).map((k) => ({ name: k, pts: run.pts[k], player: k === 'You' })).sort((a, b) => b.pts - a.pts || (a.player ? -1 : b.player ? 1 : 0));
      res.cup = { id: run.cup, race: run.race, stand, done: run.race >= 4 };
      if (res.cup.done) {
        const place = stand.findIndex((s) => s.player) + 1;
        res.cup.place = place;
        if (place <= 3) { S.cups[run.cup] = S.cups[run.cup] ? Math.min(S.cups[run.cup], place) : place; coins += CUP_BONUS[place - 1]; }
        if (run.cup === 'legend' && place === 1 && !S.cars.phantom) { S.cars.phantom = true; res.cup.unlock = 'phantom'; }
        S.cupRun = null;
      }
    }
    S.coins += coins; S.stats.coinsTotal += coins; res.coins = coins;
    res.car = S.car;
    Save.persist();
    UI.results(res);
  },
  code(res) {
    const ti = TRACKS.findIndex((t) => t.id === res.def.id);
    return CODEC.encode({ v: 1, mode: res.mode === 'daily' ? 0 : res.mode === 'trial' ? 1 : 2, day: res.def.daily !== undefined ? res.def.daily : dayIndex(), track: ti < 0 ? 31 : ti,
      car: CARS.findIndex((c) => c.id === res.car), time: Math.round(res.time * 100), lap: Math.round((res.best || 0) * 100), place: res.place || 1 });
  },
  decode(code) {
    const f = CODEC.decode(code);
    if (!f || f.v !== 1 || f.car >= CARS.length || (f.track > 11 && f.track !== 31)) return null;
    const def = f.track === 31 ? dailyTrack(f.day) : TRACKS[f.track];
    return { mode: ['daily', 'trial', 'race'][f.mode] || 'race', day: f.day, def, car: CARS[f.car], time: f.time / 100, best: f.lap / 100, place: f.place };
  },
  brag(res) {
    const car = CARS.find((c) => c.id === res.car) || CARS[0], code = this.code(res);
    let head;
    if (res.mode === 'daily') head = '🏁 Sideways Rally · Daily #' + (res.def.daily + 1) + ' (' + dayLabel(res.def.daily) + ')';
    else if (res.mode === 'trial') head = '⏱️ Sideways Rally · Time trial · ' + res.def.name;
    else head = '🏆 Sideways Rally · ' + ordinal(res.place) + ' place · ' + res.def.name;
    return head + '\n🚗 ' + car.name + ' · ' + fmtTime(res.time) + ' · best lap ' + fmtTime(res.best) + '\nBeat my time: ' + code;
  },
};

// ---------------------------------------------------------------- input.js (hold left / right half of the screen; both = brake; keyboard too)
const Input = {
  keys: {}, ptrs: new Map(), active: false, bot: null, zl: null, zr: null,
  init(target) {
    this.zl = document.getElementById('zl'); this.zr = document.getElementById('zr');
    const K = { ArrowLeft: 'l', KeyA: 'l', ArrowRight: 'r', KeyD: 'r', ArrowDown: 'b', KeyS: 'b', Space: 'd', ShiftLeft: 'd', ShiftRight: 'd' };
    window.addEventListener('keydown', (e) => {
      if (K[e.code]) { this.keys[K[e.code]] = true; if (this.active) e.preventDefault(); }
      if ((e.code === 'Escape' || e.code === 'KeyP') && this.active && !e.repeat) { UI.pauseMenu(); e.preventDefault(); }
    });
    window.addEventListener('keyup', (e) => { if (K[e.code]) this.keys[K[e.code]] = false; });
    window.addEventListener('blur', () => { this.keys = {}; this.ptrs.clear(); this.show(); });
    const side = (e) => (e.clientX < window.innerWidth / 2 ? -1 : 1);
    target.addEventListener('pointerdown', (e) => {
      if (!this.active || (e.pointerType === 'mouse' && e.button !== 0)) return;
      this.ptrs.set(e.pointerId, side(e));
      try { target.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      Snd.init(); this.show(); e.preventDefault();
    });
    target.addEventListener('pointermove', (e) => { if (this.ptrs.has(e.pointerId)) { this.ptrs.set(e.pointerId, side(e)); this.show(); } });
    const up = (e) => { if (this.ptrs.delete(e.pointerId)) this.show(); };
    target.addEventListener('pointerup', up); target.addEventListener('pointercancel', up); target.addEventListener('lostpointercapture', up);
  },
  reset() { this.keys = {}; this.ptrs.clear(); this.show(); },
  show() {
    let l = false, r = false;
    for (const s of this.ptrs.values()) { if (s < 0) l = true; else r = true; }
    if (this.zl) { this.zl.classList.toggle('on', l); this.zr.classList.toggle('on', r); }
  },
  read(inp) {
    const k = this.keys;
    let s = (k.r ? 1 : 0) - (k.l ? 1 : 0), brake = !!k.b, drift = !!k.d;
    let l = false, r = false;
    for (const v of this.ptrs.values()) { if (v < 0) l = true; else r = true; }
    if (l && r) brake = true; else if (l) s -= 1; else if (r) s += 1;
    inp.s = clamp(s, -1, 1); inp.brake = brake; inp.drift = drift; inp.gas = 1;
    if (this.bot) this.bot(inp);
  },
};

// ---------------------------------------------------------------- render.js (chase camera, track, scenery, cars, smoke, night lights, minimap)
const Render = {
  cv: null, ctx: null, dpr: 1, W: 0, H: 0, quality: 1, pats: {}, glows: {}, lines: [],
  init(cv) {
    this.cv = cv; this.ctx = cv.getContext('2d', { alpha: false });
    for (const id in THEMES) { this.pats['g_' + id] = this.ctx.createPattern(SPR['ground_' + id], 'repeat'); this.pats['a_' + id] = this.ctx.createPattern(SPR.asphalt[id], 'repeat'); }
    const tint = (col) => { const s = SPR.glow, c = document.createElement('canvas'); c.width = s.c.width; c.height = s.c.height; const g = c.getContext('2d'); g.drawImage(s.c, 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = col; g.fillRect(0, 0, c.width, c.height); return { c, w: s.w, h: s.h }; };
    this.glows = { warm: tint('#ffcf7a'), pink: tint('#ff3ea5'), cyan: tint('#3ee8ff'), red: tint('#ff3b3b'), white: tint('#ffffff') };
    for (let i = 0; i < 16; i++) this.lines.push({ a: Math.random() * TAU, r: Math.random(), l: 0.3 + Math.random() * 0.5 });
  },
  resize() {
    const W = window.innerWidth, H = window.innerHeight;
    this.W = W; this.H = H;
    this.dpr = Math.min(window.devicePixelRatio || 1, 2) * this.quality;
    this.cv.width = Math.round(W * this.dpr); this.cv.height = Math.round(H * this.dpr);
    this.cv.style.width = W + 'px'; this.cv.style.height = H + 'px';
  },
  baseZoom() { const W = this.W, H = this.H; return clamp(Math.min(W, H) / (W < H ? 560 : 650), 0.5, 1.6); },
  camera(dt) {
    const cam = G.cam, t = G.camTarget || G.player || G.cars[0];
    if (!t) return;
    const chase = Save.data.settings.cam !== 'fixed';
    const dirA = t.spd > 80 ? Math.atan2(t.vy, t.vx) : t.a;
    if (!cam.init) { cam.x = t.x; cam.y = t.y; cam.a = t.a; cam.k = this.baseZoom(); cam.init = true; }
    cam.a += angDiff(cam.a, dirA) * Math.min(1, dt * 3.6);
    if (chase) { cam.x = t.x; cam.y = t.y; }
    else { cam.x += (t.x + t.vx * 0.38 - cam.x) * Math.min(1, dt * 4); cam.y += (t.y + t.vy * 0.38 - cam.y) * Math.min(1, dt * 4); }
    const kz = this.baseZoom() * (1 - 0.13 * clamp((t.spd - 320) / 300, 0, 1)) * (G.over ? 1.15 : 1);
    cam.k += (kz - cam.k) * Math.min(1, dt * 1.8);
    cam.chase = chase;
  },
  // world -> screen (for labels)
  toScreen(x, y) {
    const cam = G.cam, k = cam.k, dx = x - cam.x, dy = y - cam.y;
    if (!cam.chase) return [this.W / 2 + dx * k, this.H / 2 + dy * k];
    const r = -cam.a - Math.PI / 2, c = Math.cos(r), s = Math.sin(r);
    return [this.W / 2 + (dx * c - dy * s) * k, this.H * this.ay + (dx * s + dy * c) * k];
  },
  frame(dt) {
    const c = this.ctx, W = this.W, H = this.H, d = this.dpr;
    c.setTransform(d, 0, 0, d, 0, 0);
    if (!G) { c.fillStyle = '#1b1d2c'; c.fillRect(0, 0, W, H); return; }
    this.camera(dt);
    const T = G.T, th = T.theme, cam = G.cam, k = cam.k, tm = performance.now() / 1000;
    let sx = 0, sy = 0;
    if (G.shake > 0) { sx = (Math.random() - 0.5) * G.shake; sy = (Math.random() - 0.5) * G.shake; }
    this.ay = cam.chase ? (G.demo ? 0.5 : 0.7) : 0.5;
    c.translate(W / 2 + sx, H * this.ay + sy);
    if (cam.chase) c.rotate(-cam.a - Math.PI / 2);
    c.scale(k, k);
    c.translate(-cam.x, -cam.y);
    // the view, as a square around its middle
    const R = Math.hypot(W, H) / k * 0.62 + 60, ahead = cam.chase ? H * (this.ay - 0.5) / k : 0;
    const vx = cam.x + Math.cos(cam.a) * ahead, vy = cam.y + Math.sin(cam.a) * ahead;
    const x0 = vx - R, y0 = vy - R, x1 = vx + R, y1 = vy + R;
    c.fillStyle = this.pats['g_' + T.def.theme]; c.fillRect(x0, y0, x1 - x0, y1 - y0);
    // ground patches
    c.fillStyle = th.night ? 'rgba(0,0,0,.18)' : 'rgba(0,0,0,.05)';
    for (const p of T.decals) { if (p.x < x0 - 200 || p.x > x1 + 200 || p.y < y0 - 200 || p.y > y1 + 200) continue; c.beginPath(); c.ellipse(p.x, p.y, p.r, p.r * p.sx, p.a, 0, TAU); c.fill(); }
    this.drawTrack(c, T, th, tm);
    // props by layer
    const L = { ground: [], mid: [], top: [] }, PC = T.PC;
    for (let gx = Math.floor(x0 / PC) - 1; gx <= Math.floor(x1 / PC) + 1; gx++) for (let gy = Math.floor(y0 / PC) - 1; gy <= Math.floor(y1 / PC) + 1; gy++) {
      const lst = T.pgrid.get(gx + ',' + gy);
      if (lst) for (const p of lst) L[p.layer].push(p);
    }
    for (const p of L.ground) this.prop(c, p, th);
    for (const p of L.mid) this.propShadow(c, p);
    for (const p of L.top) this.propShadow(c, p);
    for (const p of L.mid) this.prop(c, p, th);
    // cars
    for (const car of G.cars) this.carShadow(c, car);
    if (G.ghostCar && G.ghostCar.vis) this.car(c, G.ghostCar, tm);
    for (const car of G.cars) this.car(c, car, tm);
    this.particles(c);
    for (const p of L.top) this.prop(c, p, th);
    if (th.night) this.nightLights(c, L, tm);
    // screen space
    c.setTransform(d, 0, 0, d, 0, 0);
    const P = G.player;
    if (P && P.boostT > 0) this.speedLines(c, W, H, P.boostP);
    if (!G.demo && !G.over) { this.labels(c); this.minimap(c, T); }
  },
  drawTrack(c, T, th, tm) {
    c.lineJoin = 'round'; c.lineCap = 'round';
    c.strokeStyle = th.night ? '#191a26' : 'rgba(0,0,0,.16)'; c.lineWidth = T.W + 46; c.stroke(T.pCenter);
    c.strokeStyle = th.border; c.lineWidth = T.W + 28; c.stroke(T.pCenter);
    c.strokeStyle = this.pats['a_' + T.def.theme]; c.lineWidth = T.W; c.stroke(T.pCenter);
    c.strokeStyle = 'rgba(0,0,0,.10)'; c.lineWidth = T.W * 0.34; c.stroke(T.pGroove);
    // skid marks
    if (G.skidN) {
      const s = G.skids; c.beginPath();
      for (let i = 0; i < G.skidN; i++) { const k = i * 5; c.moveTo(s[k], s[k + 1]); c.lineTo(s[k + 2], s[k + 3]); }
      c.strokeStyle = th.night ? 'rgba(0,0,0,.38)' : 'rgba(25,22,30,.3)'; c.lineWidth = 4.5; c.stroke();
    }
    if (th.night) { c.strokeStyle = 'rgba(62,232,255,.22)'; c.lineWidth = 12; c.stroke(T.pEdgeA); c.stroke(T.pEdgeB); }
    c.strokeStyle = th.line; c.globalAlpha = 0.85; c.lineWidth = 3; c.stroke(T.pEdgeA); c.stroke(T.pEdgeB); c.globalAlpha = 1;
    c.lineCap = 'butt'; c.lineWidth = 15; c.strokeStyle = th.curbB; c.stroke(T.pCurbs);
    c.setLineDash([15, 15]); c.strokeStyle = th.curbA; c.stroke(T.pCurbs); c.setLineDash([]); c.lineCap = 'round';
    // start line: chequered across the track
    const i = 0, tx = T.tx[i], ty = T.ty[i], nx = T.nx[i], ny = T.ny[i], cols = 14, sw = T.W / cols, sh = 9;
    for (let r = 0; r < 2; r++) for (let q = 0; q < cols; q++) {
      const ox = T.px[i] + nx * (-T.W / 2 + q * sw) + tx * (r - 1) * sh, oy = T.py[i] + ny * (-T.W / 2 + q * sw) + ty * (r - 1) * sh;
      c.fillStyle = (r + q) % 2 ? '#111111' : '#ffffff';
      c.beginPath(); c.moveTo(ox, oy); c.lineTo(ox + nx * sw, oy + ny * sw); c.lineTo(ox + nx * sw + tx * sh, oy + ny * sw + ty * sh); c.lineTo(ox + tx * sh, oy + ty * sh); c.fill();
    }
    // grid boxes
    c.strokeStyle = 'rgba(255,255,255,.7)'; c.lineWidth = 2.5;
    for (let s = 0; s < 6; s++) {
      const g = gridSlot(T, s), ca = Math.cos(g.a), sa = Math.sin(g.a);
      c.save(); c.translate(g.x, g.y); c.rotate(g.a); c.beginPath(); c.moveTo(30, -16); c.lineTo(-28, -16); c.moveTo(30, 16); c.lineTo(-28, 16); c.moveTo(30, -16); c.lineTo(30, 16); c.stroke(); c.restore();
      void ca; void sa;
    }
    // boost pads
    for (const p of T.pads) {
      c.save(); c.translate(p.x, p.y); c.rotate(p.a);
      c.fillStyle = '#2a1d3a'; c.beginPath(); c.roundRect(-40, -26, 80, 52, 8); c.fill();
      c.strokeStyle = '#ffe14d'; c.lineWidth = 2.5; c.stroke();
      for (let q = 0; q < 3; q++) {
        const on = (Math.floor(tm * 8) - q) % 3 === 0;
        c.fillStyle = on ? '#fff3a0' : '#ff9a1f';
        const x = -22 + q * 18;
        c.beginPath(); c.moveTo(x, -16); c.lineTo(x + 12, 0); c.lineTo(x, 16); c.lineTo(x - 6, 16); c.lineTo(x + 6, 0); c.lineTo(x - 6, -16); c.closePath(); c.fill();
      }
      c.restore();
    }
  },
  propShadow(c, p) {
    if (p.type === 'flowers' || p.type === 'drift' || p.type === 'weed') return;
    c.fillStyle = 'rgba(0,0,0,.2)';
    if (p.box) { c.save(); c.translate(p.x + 10, p.y + 14); c.rotate(p.a); c.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); c.restore(); return; }
    const r = p.type === 'palm' || p.type === 'pine' ? p.s * 0.42 : p.type === 'mesa' ? p.s * 0.48 : p.s * 0.42;
    c.beginPath(); c.ellipse(p.x + r * 0.22, p.y + r * 0.3, r, r * 0.85, 0, 0, TAU); c.fill();
  },
  prop(c, p, th) {
    const spr = (s, size) => { c.save(); c.translate(p.x, p.y); c.rotate(p.rot); c.drawImage(s.c, -size / 2, -size / 2 * s.h / s.w, size, size * s.h / s.w); c.restore(); };
    switch (p.type) {
      case 'palm': spr(SPR.palm, p.s * 1.05); break;
      case 'pine': spr(SPR.pine, p.s * 1.05); break;
      case 'bush': spr(SPR.bush, p.s); break;
      case 'flowers': spr(SPR.flowers, p.s); break;
      case 'rock': spr(SPR['rock' + p.seed % 3], p.s); break;
      case 'boulder': spr(SPR['boulder' + p.seed % 3], p.s); break;
      case 'icerock': spr(SPR['ice' + p.seed % 3], p.s); break;
      case 'mesa': spr(SPR.mesa, p.s); break;
      case 'cactus': spr(SPR.cactus, p.s * 1.25); break;
      case 'weed': spr(SPR.weed, p.s); break;
      case 'snowman': spr(SPR.snowman, p.s * 1.3); break;
      case 'drift': spr(SPR.drift, p.s * 1.4); break;
      case 'cone': spr(SPR.cone, 20); break;
      case 'lamp': spr(SPR.lamp, 22); break;
      case 'tire': spr(SPR['tire' + (p.ci || 0)], 30); break;
      case 'building': this.building(c, p); break;
      case 'stand': this.stand(c, p); break;
    }
  },
  building(c, p) {
    const roofs = ['#3b3f5c', '#46405e', '#35485c', '#4a3d52'], neon = ['#ff3ea5', '#3ee8ff', '#ffd21f', '#8b5cff'][p.hue];
    c.save(); c.translate(p.x, p.y); c.rotate(p.a);
    const w = p.w, h = p.h;
    c.fillStyle = roofs[p.hue]; c.fillRect(-w / 2, -h / 2, w, h);
    c.strokeStyle = '#1a1b28'; c.lineWidth = 5; c.strokeRect(-w / 2 + 2.5, -h / 2 + 2.5, w - 5, h - 5);
    const r = makeRng(p.seed);
    c.fillStyle = 'rgba(255,255,255,.08)';
    for (let i = 0; i < 4; i++) { const bw = r.range(16, 34), bh = r.range(12, 26); c.fillRect(r.range(-w / 2 + 10, w / 2 - 10 - bw), r.range(-h / 2 + 10, h / 2 - 10 - bh), bw, bh); }
    c.strokeStyle = neon; c.globalAlpha = 0.35; c.lineWidth = 9; c.strokeRect(-w / 2 + 6, -h / 2 + 6, w - 12, h - 12);
    c.globalAlpha = 1; c.lineWidth = 2.5; c.strokeRect(-w / 2 + 6, -h / 2 + 6, w - 12, h - 12);
    c.restore();
  },
  stand(c, p) {
    if (!p.cv) {
      const s = 2, cv = document.createElement('canvas'); cv.width = p.w * s; cv.height = p.h * s;
      const g = cv.getContext('2d'); g.scale(s, s);
      g.fillStyle = '#d8d3e0'; g.fillRect(0, 0, p.w, p.h);
      const r = makeRng(p.seed), cols = ['#ff3b3b', '#ffd21f', '#3d7bff', '#2fd36b', '#ff8a1f', '#ffffff', '#b05cff', '#ff5fa2'];
      for (let row = 0; row < 5; row++) {
        g.fillStyle = row % 2 ? '#bdb6c9' : '#cbc5d6'; g.fillRect(6, 8 + row * 15, p.w - 12, 13);
        for (let x = 10; x < p.w - 10; x += 8) if (r() < 0.82) { g.fillStyle = r.pick(cols); g.beginPath(); g.arc(x + r() * 2, 14 + row * 15, 3, 0, TAU); g.fill(); }
      }
      g.fillStyle = '#ff3b3b'; for (let x = 0; x < p.w; x += 24) g.fillRect(x, 0, 12, 6);
      g.strokeStyle = INK; g.lineWidth = 3; g.strokeRect(1.5, 1.5, p.w - 3, p.h - 3);
      p.cv = cv;
    }
    c.save(); c.translate(p.x, p.y); c.rotate(p.a); c.drawImage(p.cv, -p.w / 2, -p.h / 2, p.w, p.h); c.restore();
  },
  carShadow(c, car) {
    if (car.respawnT > 0 && Math.floor(car.respawnT * 10) % 2) return;
    c.save(); c.translate(car.x + 4, car.y + 7); c.rotate(car.a);
    c.fillStyle = 'rgba(0,0,0,.28)'; c.beginPath(); c.roundRect(-car.def.len / 2 - 1, -car.def.wid / 2 - 1, car.def.len + 2, car.def.wid + 2, 9); c.fill();
    c.restore();
  },
  car(c, car, tm) {
    if (car.respawnT > 0 && Math.floor(car.respawnT * 10) % 2) return;
    const s = carSprite(car.def, car.color, car.accent);
    c.save(); c.translate(car.x, car.y); c.rotate(car.a);
    if (car.ghost) c.globalAlpha = 0.42;
    if (car.boostT > 0) {
      const f = 0.75 + Math.random() * 0.5, fl = SPR.flame, sz = 24 + 18 * car.boostP;
      c.globalCompositeOperation = 'lighter';
      for (const sy of [-car.def.wid * 0.22, car.def.wid * 0.22]) c.drawImage(fl.c, -car.def.len / 2 - sz * f + 4, sy - 6 * f, sz * f, 12 * f);
      c.globalCompositeOperation = 'source-over';
    }
    c.drawImage(s.c, -s.w / 2, -s.h / 2, s.w, s.h);
    c.restore();
    c.globalAlpha = 1;
  },
  particles(c) {
    const fx = G.fx;
    for (const f of fx) {
      const a = f.life / f.max;
      if (f.k === 'smoke' || f.k === 'dust') { c.globalAlpha = a * (f.k === 'smoke' ? 0.45 : 0.5); c.fillStyle = f.col; c.beginPath(); c.arc(f.x, f.y, f.size, 0, TAU); c.fill(); }
    }
    c.globalCompositeOperation = 'lighter';
    for (const f of fx) if (f.k === 'spark') { c.globalAlpha = Math.min(1, a(f) * 1.5); c.strokeStyle = f.col; c.lineWidth = f.size; c.beginPath(); c.moveTo(f.x, f.y); c.lineTo(f.x - f.vx * 0.03, f.y - f.vy * 0.03); c.stroke(); }
    c.globalCompositeOperation = 'source-over';
    for (const f of fx) if (f.k === 'confetti') { c.globalAlpha = Math.min(1, f.life); c.fillStyle = f.col; c.save(); c.translate(f.x, f.y); c.rotate(f.rot); c.fillRect(-4, -2.5, 8, 5); c.restore(); }
    c.globalAlpha = 1;
    function a(f) { return f.life / f.max; }
  },
  nightLights(c, L, tm) {
    c.globalCompositeOperation = 'lighter';
    for (const p of L.mid) if (p.type === 'lamp') { c.globalAlpha = 0.55; const g = this.glows.warm; c.drawImage(g.c, p.x - 90, p.y - 90, 180, 180); }
    for (const car of G.cars) {
      if (car.respawnT > 0) continue;
      c.save(); c.translate(car.x, car.y); c.rotate(car.a); c.globalAlpha = 0.32;
      c.drawImage(SPR.cone_light.c, car.def.len / 2 - 4, -70, 220, 140);
      c.globalAlpha = 0.5; const r = this.glows.red; c.drawImage(r.c, -car.def.len / 2 - 22, -22, 44, 44);
      c.restore();
    }
    c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
  },
  speedLines(c, W, H, p) {
    c.strokeStyle = 'rgba(255,255,255,' + (0.18 + 0.2 * p) + ')'; c.lineWidth = 2;
    const cx = W / 2, cy = H * 0.55, R = Math.hypot(W, H) / 2;
    c.beginPath();
    for (const l of this.lines) {
      l.r += 0.06; if (l.r > 1) { l.r = 0.55; l.a = Math.random() * TAU; l.l = 0.15 + Math.random() * 0.3; }
      const r0 = R * l.r, r1 = R * (l.r + l.l);
      c.moveTo(cx + Math.cos(l.a) * r0, cy + Math.sin(l.a) * r0); c.lineTo(cx + Math.cos(l.a) * r1, cy + Math.sin(l.a) * r1);
    }
    c.stroke();
  },
  labels(c) {
    c.font = '700 12px Rubik, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
    const P = G.player, placed = [];
    const list = G.cars.filter((q) => q.ai && q.respawnT <= 0).sort((a, b) => dist2(a.x, a.y, P.x, P.y) - dist2(b.x, b.y, P.x, P.y));
    for (const car of list) {
      const [x, y] = this.toScreen(car.x, car.y);
      if (x < -30 || x > this.W + 30 || y < -30 || y > this.H + 30) continue;
      const t = car.place + ' ' + car.name, w = c.measureText(t).width + 12;
      const box = [x - w / 2, y - 38, w, 18];
      if (placed.some((b) => box[0] < b[0] + b[2] + 2 && b[0] < box[0] + box[2] + 2 && box[1] < b[1] + b[3] + 2 && b[1] < box[1] + box[3] + 2)) continue;
      placed.push(box);
      c.fillStyle = 'rgba(20,18,30,.62)'; c.beginPath(); c.roundRect(x - w / 2, y - 38, w, 18, 9); c.fill();
      c.fillStyle = car.color === '#26232e' ? '#ffbf2e' : car.color; c.fillRect(x - w / 2 + 3, y - 34, 3, 10);
      c.fillStyle = '#ffffff'; c.fillText(t, x + 2, y - 29);
    }
  },
  minimap(c, T) {
    const m = T.mini, r = 54, cx = this.W - r - 12, cy = 64 + r + Math.max(0, UI.safeTop || 0);
    c.save(); c.translate(cx, cy);
    c.fillStyle = 'rgba(16,14,26,.55)'; c.beginPath(); c.arc(0, 0, r + 6, 0, TAU); c.fill();
    c.lineJoin = 'round'; c.strokeStyle = 'rgba(0,0,0,.5)'; c.lineWidth = 6; c.stroke(m.path);
    c.strokeStyle = '#ffffff'; c.lineWidth = 3; c.stroke(m.path);
    const sx = (T.px[0] - m.ox) * m.s, sy = (T.py[0] - m.oy) * m.s; c.fillStyle = '#ffd21f'; c.fillRect(sx - 3, sy - 3, 6, 6);
    if (G.ghostCar && G.ghostCar.vis) { c.fillStyle = 'rgba(160,240,255,.8)'; c.beginPath(); c.arc((G.ghostCar.x - m.ox) * m.s, (G.ghostCar.y - m.oy) * m.s, 3.5, 0, TAU); c.fill(); }
    for (const car of G.cars) {
      if (car.player) continue;
      c.fillStyle = car.color === '#26232e' ? '#ffbf2e' : car.color; c.strokeStyle = '#000'; c.lineWidth = 1.5;
      c.beginPath(); c.arc((car.x - m.ox) * m.s, (car.y - m.oy) * m.s, 3.6, 0, TAU); c.fill(); c.stroke();
    }
    const P = G.player;
    if (P) { c.fillStyle = '#ffffff'; c.strokeStyle = '#ff2d55'; c.lineWidth = 2.5; c.beginPath(); c.arc((P.x - m.ox) * m.s, (P.y - m.oy) * m.s, 5, 0, TAU); c.fill(); c.stroke(); }
    c.restore();
  },
};

  code(prefill) {
    this.cur = 'code';
    this.show(this.top('title') + '<h2>Friend\'s code</h2><p class="sub">Paste the code from the group chat to see their run.</p>' +
      '<input class="codein" id="codein" maxlength="20" placeholder="XXXX-XXXX-XXXX-XX" autocomplete="off" autocapitalize="characters" spellcheck="false" value="' + esc(prefill || '') + '">' +
      '<button class="big" data-a="check">Check</button><div id="codeout"></div>', 'dim');
  },
  settings(back) {
    this.cur = 'settings';
    const s = Save.data.settings, row = (k, label, on) => '<button class="toggle' + (on ? ' on' : '') + '" data-a="set" data-v="' + k + '"><span>' + label + '</span><i></i></button>';
    this.show(this.top(back || 'title') + '<h2>Settings</h2>' + row('sound', 'Sound effects', s.sound) + row('music', 'Music', s.music) + row('haptics', 'Vibration', s.haptics) +
      row('cam', 'Camera turns with the car', s.cam !== 'fixed') + '<p class="sub">Controls: hold the left or right half of the screen to steer. Hold a turn to drift, let go to boost. Hold both sides to brake. Keyboard: arrows or A/D, Down to brake, Space to drift instantly.</p>' +
      '<p class="foot">© 2026 Asaf. All rights reserved.</p>', 'dim');
  },

  // ---------- racing
  startRace(mode, def, opts) {
    this.hide(); this.cur = 'race';
    Race.start(mode, def, opts);
    this.lastRace = { mode, def, opts };
    Input.reset(); Input.active = true; this.hud.hidden = false; document.body.classList.add('racing');
    this.h.of.textContent = '/' + G.cars.length;
    document.body.classList.toggle('solo', G.cars.length === 1);
    Music.stop(); Snd.init(); Sfx.startEngine();
    if (!Save.data.seen.tip) { this.toast('Hold left or right to steer', 'Hold a turn to drift · let go to BOOST', 'tip', 4.2); Save.data.seen.tip = true; Save.persist(); }
  },
  countdown(n) {
    const e = this.countEl;
    e.textContent = n ? String(n) : 'GO!';
    e.className = 'on ' + (n ? 'n' : 'go');
    void e.offsetWidth; e.classList.add('pop');
    clearTimeout(this._ct); this._ct = setTimeout(() => { e.className = ''; }, n ? 900 : 700);
  },
  toast(t, sub, cls, dur) {
    const e = this.toastEl;
    e.className = cls || ''; e.innerHTML = '<b>' + esc(t) + '</b>' + (sub ? '<small>' + esc(sub) + '</small>' : '');
    void e.offsetWidth; e.classList.add('on');
    clearTimeout(this._tt); this._tt = setTimeout(() => e.classList.remove('on'), (dur || 1.8) * 1000);
  },
  frameHud() {
    if (!G || G.demo || this.hud.hidden) return;
    const P = G.player, h = this.h;
    if (!P) return;
    const pos = P.place;
    h.pos.textContent = pos; h.suf.textContent = ordinal(pos).replace(/\d+/, '');
    h.lap.textContent = Math.min(LAPS, Math.max(1, P.lap)) + '/' + LAPS;
    const t = P.finished ? P.finishT : Math.max(0, G.t);
    h.time.textContent = fmtTime(t);
    h.lapT.textContent = P.best ? 'BEST ' + fmtTime(P.best) : (G.ghost ? 'GHOST ' + fmtTime(G.ghost.time) : '');
    const lv = P.drifting ? P.dLevel : 0, ch = P.drifting ? P.dCharge : 0;
    h.meter.className = P.drifting ? 'on l' + lv : '';
    this.segs.forEach((s, i) => { const lo = i ? DRIFT_LV[i - 1] : 0, hi = DRIFT_LV[i]; s.style.setProperty('--f', clamp((ch - lo) / (hi - lo), 0, 1).toFixed(2)); });
    h.wrong.classList.toggle('on', P.wrongT > 0.9);
  },
  pauseMenu() {
    if (!G || G.demo || G.over || this.cur !== 'race') return;
    G.paused = true; Input.reset(); Input.active = false; document.body.classList.remove('racing');
    const s = Save.data.settings;
    this.show('<div class="panel"><h2>Paused</h2><p class="sub">' + MODE_LABEL[G.mode] + ' · ' + G.def.name + '</p>' +
      '<button class="big" data-a="resume">Resume</button><button class="mid" data-a="restart">Restart</button>' +
      '<div class="row2"><button class="toggle' + (s.sound ? ' on' : '') + '" data-a="set" data-v="sound"><span>Sound</span><i></i></button><button class="toggle' + (s.music ? ' on' : '') + '" data-a="set" data-v="music"><span>Music</span><i></i></button></div>' +
      '<button class="toggle' + (s.cam !== 'fixed' ? ' on' : '') + '" data-a="set" data-v="cam"><span>Camera turns with the car</span><i></i></button>' +
      '<button class="link" data-a="quit">Quit to menu</button></div>', 'dim pause');
    this.cur = 'pause';
  },
  resume() { if (!G) return; this.hide(); this.cur = 'race'; G.paused = false; Input.reset(); Input.active = true; document.body.classList.add('racing'); },

  results(res) {
    this.cur = 'results'; Input.active = false; Input.reset(); document.body.classList.remove('racing');
    setTimeout(() => {
      this.hud.hidden = true; Sfx.stopEngine();
      if (Snd.mx) Music.start(SONG_MENU);
      const solo = res.solo, me = res.rows.find((r) => r.player);
      let head = solo ? '<h2 class="big1">' + fmtTime(res.time) + '</h2><p class="sub">' + MODE_LABEL[res.mode] + ' · ' + res.def.name + '</p>'
        : '<h2 class="big1 p' + Math.min(4, res.place) + '">' + (res.place === 1 ? '1st place!' : ordinal(res.place) + ' place') + '</h2><p class="sub">' + MODE_LABEL[res.mode] + ' · ' + res.def.name + ' · ' + fmtTime(res.time) + '</p>';
      let rows = '';
      if (!solo) {
        rows = '<div class="rtable">' + res.rows.map((r) => '<div class="rrow' + (r.player ? ' me' : '') + '"><b>' + r.place + '</b><i style="background:' + (r.color === '#26232e' ? '#ffbf2e' : r.color) + '"></i><span>' + esc(r.name) + '</span><small>' +
          (r.place === 1 ? fmtTime(r.time) : '+' + (r.time - res.rows[0].time).toFixed(2)) + '</small>' + (res.mode === 'cup' ? '<em>+' + (POINTS[r.place - 1] || 0) + '</em>' : '') + '</div>').join('') + '</div>';
      }
      const laps = '<div class="laps">' + res.laps.map((l, i) => '<span' + (l === res.best ? ' class="pb"' : '') + '>Lap ' + (i + 1) + ' <b>' + fmtTime(l) + '</b></span>').join('') + '</div>';
      const badges = (res.newLap ? '<span class="badge">New best lap!</span>' : '') + (res.newBest ? '<span class="badge">New track record!</span>' : '') + (res.newDaily ? '<span class="badge">New daily best!</span>' : '');
      let cup = '';
      if (res.cup) {
        const c = CUPS.find((x) => x.id === res.cup.id);
        cup = '<div class="stand"><b>' + c.name + ' · ' + (res.cup.done ? 'final standings' : 'after race ' + res.cup.race + ' of 4') + '</b>' +
          res.cup.stand.map((s, i) => '<div class="srow2' + (s.player ? ' me' : '') + '"><span>' + (i + 1) + '. ' + esc(s.name) + '</span><b>' + s.pts + '</b></div>').join('') + '</div>';
        if (res.cup.done) cup += res.cup.place <= 3 ? '<div class="trophybox">' + ['🥇', '🥈', '🥉'][res.cup.place - 1] + '<b>' + ordinal(res.cup.place) + ' in the ' + c.name + '!</b><small>+' + CUP_BONUS[res.cup.place - 1] + ' bonus coins' + (res.cup.unlock ? ' · the Phantom is yours!' : '') + '</small></div>'
          : '<div class="trophybox">😤<b>' + ordinal(res.cup.place) + ' overall</b><small>Finish on the podium to unlock the next cup.</small></div>';
      }
      const canShare = res.mode === 'daily' || res.mode === 'trial' || res.place <= 3;
      const next = res.cup && !res.cup.done ? '<button class="big" data-a="cupGo">Next race ▶</button>' : '<button class="big" data-a="retry">' + (res.mode === 'cup' ? 'New cup' : 'Race again') + '</button>';
      this.show('<div class="panel results">' + head + badges + rows + laps + cup +
        '<div class="earn">+' + coinHtml(res.coins) + ' <small>coins</small></div>' + next +
        (canShare ? '<button class="mid" data-a="share">Copy brag for the group chat</button><div id="brag"></div>' : '') +
        '<button class="link" data-a="menu">Menu</button></div>', 'dim');
      this.lastRes = res;
      if (res.coins) Sfx.coin();
    }, res.solo ? 900 : 1400);
  },

  acts: {
    title() { this.title(); },
    menu() { this.title(); },
    cups() { this.cups(); },
    tracks(mode) { this.tracks(mode); },
    garage() { this.garage(); },
    daily() { this.daily(); },
    code() { this.code(); },
    settings() { this.settings(this.cur === 'pause' ? null : 'title'); },
    cupNew(id) { Meta.startCup(CUPS.find((c) => c.id === id)); this.acts.cupGo.call(this); },
    cupGo() {
      const run = Save.data.cupRun; if (!run) return this.cups();
      const cup = CUPS.find((c) => c.id === run.cup), def = TRACK_BY_ID[cup.tracks[run.race]];
      if (Save.data.car !== run.car && Save.data.cars[run.car]) Save.data.car = run.car;
      this.startRace('cup', def, { drivers: run.drivers, round: run.race, skill: cup.skill });
    },
    go(v) {
      const [mode, id] = v.split(':');
      if (mode === 'daily') return this.startRace('daily', Meta.dailyDef(), {});
      this.startRace(mode, TRACK_BY_ID[id], {});
    },
    retry() {
      const r = this.lastRace; if (!r) return this.title();
      if (r.mode === 'cup') return this.cups();
      this.startRace(r.mode, r.mode === 'daily' ? Meta.dailyDef() : r.def, r.opts);
    },
    restart() {
      const r = this.lastRace; if (!r) return;
      if (r.mode === 'cup' && Save.data.cupRun) { G = null; return this.acts.cupGo.call(this); }
      this.startRace(r.mode, r.mode === 'daily' ? Meta.dailyDef() : r.def, r.opts);
    },
    resume() { this.resume(); },
    quit() { Sfx.stopEngine(); G = null; this.title(); },
    pick(id) { Save.data.car = id; Save.persist(); this.garage(); },
    buy(id) {
      const c = CARS.find((x) => x.id === id), S = Save.data;
      if (S.cars[id] || S.coins < c.cost) { this.toast('Not enough coins yet', 'Race to earn more', '', 1.4); return; }
      S.coins -= c.cost; S.cars[id] = true; S.car = id; Save.persist(); Sfx.buy(); this.garage();
    },
    set(k) {
      const s = Save.data.settings;
      if (k === 'cam') s.cam = s.cam === 'fixed' ? 'chase' : 'fixed'; else s[k] = !s[k];
      Save.persist(); Snd.apply();
      if (k === 'music') { if (s.music && Snd.mx && this.cur !== 'pause') Music.start(SONG_MENU); }
      const b = this.screen.querySelector('[data-v="' + k + '"]');
      if (b) b.classList.toggle('on', k === 'cam' ? s.cam !== 'fixed' : s[k]);
    },
    async share() {
      const t = Meta.brag(this.lastRes), ok = await copyText(t), out = document.getElementById('brag');
      if (out) out.innerHTML = '<pre class="bragtxt">' + esc(t) + '</pre><p class="sub">' + (ok ? 'Copied! Paste it in the group chat.' : 'Copy the text above.') + '</p>';
    },
    async shareDaily() {
      const d = Meta.dailyState(), def = Meta.dailyDef();
      const res = { mode: 'daily', def, car: d.car, time: d.best, best: d.lap, place: 1 };
      const t = Meta.brag(res), ok = await copyText(t);
      this.toast(ok ? 'Copied!' : 'Copy failed', ok ? 'Paste it in the group chat' : '', '', 1.6);
    },
    check() {
      const v = document.getElementById('codein').value, r = Meta.decode(v), out = document.getElementById('codeout');
      if (!r) { out.innerHTML = '<p class="bad">That code doesn\'t look right. Check for typos.</p>'; return; }
      const S = Save.data;
      let mine = null, label = '';
      if (r.mode === 'daily') { const d = Meta.dailyState(); label = 'Daily Rally #' + (r.day + 1) + ' · ' + dayLabel(r.day) + (r.day === dayIndex() ? ' (today)' : ''); if (r.day === dayIndex() && d.best) mine = d.best; }
      else { label = (r.mode === 'trial' ? 'Time trial' : ordinal(r.place) + ' place') + ' · ' + r.def.name; mine = r.mode === 'trial' ? S.best[r.def.id] : null; }
      const cmp = mine ? (mine < r.time ? '<p class="win">You\'re ahead by ' + (r.time - mine).toFixed(2) + ' s 😎</p>' : mine > r.time ? '<p class="lose">They\'re ' + (mine - r.time).toFixed(2) + ' s faster. Time for revenge!</p>' : '<p>Dead heat!</p>') : '';
      out.innerHTML = '<div class="dcard"><b>' + fmtTime(r.time) + '</b><small>' + label + '</small><small>' + r.car.name + ' · best lap ' + fmtTime(r.best) + '</small></div>' + cmp +
        (r.mode === 'daily' && r.day === dayIndex() ? '<button class="big" data-a="go" data-v="daily:">Race today\'s track</button>' : '');
    },
  },
};

// the title-screen race: six AI cars, camera on the leader
const Demo = {
  n: 0,
  start() {
    const opts = TRACKS.filter((t) => Meta.trackUnlocked(t.id));
    const def = opts[(this.n++ + Math.floor(Math.random() * 99)) % opts.length];
    Race.start('demo', def, {});
    G.camTarget = G.cars[0];
  },
  next() { this.start(); },
  frame() {
    if (!G || !G.demo) return;
    // follow whoever leads, switching smoothly
    const lead = G.order && G.order[0];
    if (lead && lead !== G.camTarget && G.t > 3) G.camTarget = lead;
  },
};

// ---------------------------------------------------------------- main.js (boot + fixed-step loop)
const STEP = 1 / 60;
const Perf = {
  acc: 0, n: 0, level: 0,
  sample(dt) {
    if (!G || G.demo || G.paused) { this.acc = 0; this.n = 0; return; }
    this.acc += dt; this.n++;
    if (this.n >= 150) {
      const avg = this.acc / this.n; this.acc = 0; this.n = 0;
      if (avg > 0.024 && this.level < 2) { this.level++; Render.quality = this.level === 1 ? 0.8 : 0.62; Render.resize(); }
    }
  },
};
function boot() {
  Save.load();
  buildSprites();
  const cv = document.getElementById('cv');
  Render.init(cv); Render.resize();
  Input.init(cv);
  UI.init();
  Snd.muted = () => !G || G.demo;
  window.addEventListener('resize', () => Render.resize());
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { Save.persistLocal(); if (G && !G.demo && !G.over && !G.paused && UI.cur === 'race') UI.pauseMenu(); if (Snd.ac) Snd.ac.suspend().catch(() => {}); }
    else if (Snd.ac) Snd.ac.resume().catch(() => {});
  });
  const wake = () => { Snd.init(); if (!Music.on && UI.cur !== 'race' && UI.cur !== 'pause') Music.start(SONG_MENU); };
  window.addEventListener('pointerdown', wake, { capture: true });
  window.addEventListener('keydown', wake, { capture: true });
  Save.onRemote = () => { if (UI.cur === 'title') UI.title(); };
  Save.cloudInit();
  UI.title();
  let last = performance.now(), acc = 0;
  function loop(now) {
    const dt = Math.max(0, Math.min(0.1, (now - last) / 1000));
    last = now;
    if (G && !G.paused) {
      acc += dt;
      let n = 0;
      while (acc >= STEP && n < 4) { Race.update(STEP); acc -= STEP; n++; }
      if (n === 4) acc = 0;
    } else acc = 0;
    Demo.frame();
    Render.frame(dt);
    UI.frameHud(dt);
    Sfx.frame();
    Music.pump();
    Perf.sample(dt);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

})();</script>
