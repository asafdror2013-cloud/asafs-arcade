<title>Court Crew Shootaround</title>

<style>
/* Layout: one full-screen court canvas with a floating HUD, in the Court Crew palette (deep navy, basketball orange, electric blue). Deliberately a single dark arcade look. */
/* Court Crew — mobile-first sports-gaming look: deep navy, basketball orange, electric blue. */
:root {
  --bg: #070f22;
  --bg-2: #0b1733;
  --card: #111f40;
  --card-2: #162a55;
  --line: #233a6e;
  --text: #f3f6ff;
  --muted: #9fb0d3;
  --dim: #6c7fa8;
  --orange: #ff7a1a;
  --orange-2: #ff9a3d;
  --blue: #2ec5ff;
  --green: #2fd67b;
  --red: #ff4d5e;
  --gold: #ffcc33;
  --purple: #9b6bff;
  --radius: 18px;
  --radius-sm: 12px;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  --font: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', 'Noto Sans Hebrew', Arial, sans-serif;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: radial-gradient(1200px 600px at 50% -200px, #18306a 0%, transparent 60%), var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: none;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--blue); }
h1, h2, h3 { margin: 0; line-height: 1.15; letter-spacing: -0.01em; }
h1 { font-size: 1.7rem; font-weight: 900; }
h2 { font-size: 1.2rem; font-weight: 800; }
h3 { font-size: 1rem; font-weight: 800; }
p { margin: 0; }
.hidden { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--muted); }
.dim { color: var(--dim); }
.small { font-size: 0.85rem; }
.tiny { font-size: 0.75rem; }
.center { text-align: center; }
.grow { flex: 1; min-width: 0; }
.row { display: flex; align-items: center; gap: 10px; }
.row.wrap { flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack.tight { gap: 6px; }
.stack.loose { gap: 18px; }
.num { font-variant-numeric: tabular-nums; }
.nowrap { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; border-radius: 8px; }

/* ---------- app shell ---------- */
#app { min-height: 100%; }
.shell { max-width: 680px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; }
.app-header {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 12px;
  padding: calc(10px + var(--safe-t)) 16px 10px;
  background: linear-gradient(180deg, rgba(7, 15, 34, 0.98), rgba(7, 15, 34, 0.86));
  backdrop-filter: blur(8px);
  border-bottom: 1px solid rgba(35, 58, 110, 0.6);
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 900; font-size: 1.15rem; letter-spacing: 0.01em; min-width: 0; }
.brand-ball { width: 30px; height: 30px; flex: none; }
.brand .nowrap { max-width: 52vw; }
.app-main { flex: 1; padding: 16px 16px calc(96px + var(--safe-b)); }
.bottom-nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: flex; justify-content: center;
  background: rgba(9, 18, 40, 0.97);
  border-top: 1px solid var(--line);
  padding: 6px 8px calc(6px + var(--safe-b));
}
.bottom-nav .inner { display: flex; width: 100%; max-width: 680px; }
.nav-btn {

  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 6px 0; border-radius: 12px; color: var(--muted); font-size: 0.72rem; font-weight: 700;
}
.nav-btn .ico { font-size: 1.35rem; line-height: 1; }
.nav-btn[aria-current='page'] { color: var(--text); background: rgba(46, 197, 255, 0.1); }
.nav-btn .badge-count { position: absolute; top: 2px; left: calc(50% + 6px); }
.room-bar {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(70px + var(--safe-b)); z-index: 29;
  width: min(648px, calc(100% - 24px));
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; border-radius: 16px;
  background: linear-gradient(90deg, #ff7a1a, #ff4d8a); color: #fff; font-weight: 800;
  box-shadow: var(--shadow); border: 0; text-align: left;
}
.has-room-bar .app-main { padding-bottom: calc(160px + var(--safe-b)); }
.has-room-bar .chat-full { height: calc(100dvh - 262px - var(--safe-b) - var(--safe-t)); }
.practice-nav { display: flex; align-items: center; gap: 6px; }
.practice-nav .hud-pill { border: 0; color: #fff; font-size: 0.8rem; min-height: 40px; padding: 6px 10px; }
.practice-nav .exit-btn { width: 36px; }
.conn-banner {
  position: fixed; top: calc(8px + var(--safe-t)); left: 50%; transform: translateX(-50%); z-index: 100;
  background: #3a2a0a; color: #ffd27a; border: 1px solid #6b4d12;
  padding: 6px 14px; border-radius: 999px; font-size: 0.85rem; font-weight: 700;
}

/* ---------- cards, buttons, inputs ---------- */
.card {
  background: linear-gradient(180deg, var(--card-2), var(--card));
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18);
}
.card.flat { box-shadow: none; }
.card-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.section-title { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 800; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 0 18px; border-radius: 14px;
  border: 1px solid var(--line); background: var(--card-2); color: var(--text);
  font-weight: 800; letter-spacing: 0.01em; text-decoration: none;
  transition: transform 0.08s ease, filter 0.15s ease, background 0.15s ease;
  user-select: none;
}
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
.btn-primary { background: linear-gradient(180deg, var(--orange-2), var(--orange)); border-color: transparent; color: #1b0d00; box-shadow: 0 6px 18px rgba(255, 122, 26, 0.35); }
.btn-blue { background: linear-gradient(180deg, #5fd6ff, var(--blue)); border-color: transparent; color: #001a26; }
.btn-green { background: linear-gradient(180deg, #5ee69a, var(--green)); border-color: transparent; color: #00230f; }
.btn-danger { background: transparent; border-color: rgba(255, 77, 94, 0.55); color: #ff8d98; }
.btn-ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn-small { min-height: 36px; padding: 0 12px; border-radius: 10px; font-size: 0.88rem; }
.btn-block { width: 100%; }
.btn-xl { min-height: 60px; font-size: 1.1rem; border-radius: 16px; }
.icon-btn {
  width: 44px; height: 44px; flex: none; border-radius: 12px; border: 1px solid var(--line);
  background: var(--card); display: inline-flex; align-items: center; justify-content: center; font-size: 1.2rem; position: relative;
}
.icon-btn.plain { border-color: transparent; background: transparent; }
.badge-count {
  min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
  background: var(--red); color: #fff; font-size: 0.7rem; font-weight: 800;
  display: inline-flex; align-items: center; justify-content: center;
}
.icon-btn .badge-count { position: absolute; top: -4px; right: -4px; }

label.field { display: flex; flex-direction: column; gap: 6px; font-weight: 700; font-size: 0.9rem; }
.input, select.input, textarea.input {
  width: 100%; min-height: 48px; padding: 10px 14px; border-radius: 12px;
  border: 1px solid var(--line); background: #0a1630; color: var(--text); font-size: 1rem;
}
.input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(46, 197, 255, 0.2); }
.input.code { text-transform: uppercase; letter-spacing: 0.12em; font-weight: 800; text-align: center; font-size: 1.15rem; }
.field-error { color: #ff8d98; font-size: 0.85rem; font-weight: 600; min-height: 1em; }
.hint { color: var(--muted); font-size: 0.82rem; font-weight: 500; }

.segmented { display: flex; background: #0a1630; border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
.segmented button {
  flex: 1; min-height: 40px; border: 0; border-radius: 9px; background: transparent; color: var(--muted);
  font-weight: 800; font-size: 0.9rem; padding: 0 8px;
}
.segmented button[aria-pressed='true'] { background: var(--card-2); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
.segmented button:disabled { opacity: 0.5; }

.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; }
.switch input { appearance: none; width: 52px; height: 30px; border-radius: 15px; background: #2a3b63; position: relative; flex: none; transition: background 0.15s; cursor: pointer; }
.switch input::after { content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform 0.15s; }
.switch input:checked { background: var(--green); }
.switch input:checked::after { transform: translateX(22px); }

.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: #0a1630; border: 1px solid var(--line); font-size: 0.8rem; font-weight: 700; color: var(--muted); }
.chip.orange { color: #ffb57a; border-color: rgba(255, 122, 26, 0.45); }
.chip.blue { color: #8fe0ff; border-color: rgba(46, 197, 255, 0.45); }
.chip.green { color: #8ff0b8; border-color: rgba(47, 214, 123, 0.45); }
.chip.red { color: #ff9aa4; border-color: rgba(255, 77, 94, 0.45); }
.chip.gold { color: #ffe089; border-color: rgba(255, 204, 51, 0.5); }

/* ---------- avatars ---------- */
.avatar {
  --size: 44px; --jersey: var(--orange);
  width: var(--size); height: var(--size); flex: none; position: relative;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 25%, rgba(255, 255, 255, 0.35), transparent 45%), var(--jersey);
  display: inline-flex; align-items: center; justify-content: center;
  font-size: calc(var(--size) * 0.55); line-height: 1;
  box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.18), 0 0 0 2px rgba(255, 255, 255, 0.08);
}
.avatar .num {
  position: absolute; bottom: -3px; right: -5px;
  min-width: calc(var(--size) * 0.42); height: calc(var(--size) * 0.36); padding: 0 3px;
  border-radius: 7px; background: #0b1733; border: 2px solid var(--jersey);

  display: flex; align-items: center; justify-content: center;
}

.avatar.sm { --size: 34px; }
.avatar.lg { --size: 64px; }
.avatar.xl { --size: 96px; }
.dot.online { background: var(--green) !important; }

.dot.playing { background: var(--orange) !important; }
.dot.offline { background: #4b5878 !important; }
.status-text.online { color: var(--green); }

.list { display: flex; flex-direction: column; }

.list-item.button { background: none; border-left: 0; border-right: 0; border-top: 0; width: 100%; text-align: left; color: inherit; }
.empty { padding: 26px 10px; text-align: center; color: var(--muted); }
.empty .big { font-size: 2.2rem; display: block; margin-bottom: 6px; }

  }
  onKeyUp(e) {
    if ((e.key === ' ' || e.key === 'Enter') && this.charge) {
      const power = this.chargePower();
      this.charge = null;
      if (this.inputEnabled && power >= MIN_POWER && this.onShoot) this.onShoot(power, this.keyAim);
      e.preventDefault();
    }
  }
  chargePower() {
    if (!this.charge) return 0;
    const t = ((performance.now() - this.charge.t0) / 1600) % 2; // 0→1→0 every 3.2s
    return t <= 1 ? t : 2 - t;
  }
  aimState() {
    if (this.drag) return { power: this.drag.power, aim: this.drag.aim };
    if (this.charge) return { power: this.chargePower(), aim: this.keyAim };
    return null;
  }

  // ------------------------------------------------------------- frame
  frame(now) {
    if (!this.running) return;
    const dt = Math.min(0.05, (now - this.time) / 1000);
    this.time = now;
    try {
      this.draw(now, dt);
    } catch (err) {
      console.error('[court] draw failed', err);
    }
    requestAnimationFrame(this.frame);
  }

  draw(now, dt) {
    const ctx = this.ctx;
    const W = this.W;
    const H = this.H;
    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    if (this.shake > 0 && !state.prefs.reduceMotion) {
      ctx.translate((Math.random() - 0.5) * this.shake, (Math.random() - 0.5) * this.shake);
    }
    this.shake = Math.max(0, this.shake - dt * 30);
    this.netPulse = Math.max(0, this.netPulse - dt * 1.6);
    this.rimShake = Math.max(0, this.rimShake - dt * 3);
    const cam = cameraFor(this.currentSpot(), W, H);
    this.cam = cam;
    const th = this.theme;

    this.drawSky(ctx, cam, th);
    this.drawFloor(ctx, cam, th);
    this.drawWall(ctx, cam, th);
    this.drawPole(ctx, cam, th);

    // Balls in flight, with their place in front of / behind the hoop.
    const hoop = project(cam, HOOP_X, RIM_Y, HOOP_Z);
    const board = toCam(cam, HOOP_X, RIM_Y, BOARD.z).z;
    const live = [];
    for (const b of this.balls) {
      const p = this.ballPos(b, now);
      if (!p) continue;
      for (const ev of b.events) {
        if (!ev.done && p.t >= ev.t) {
          ev.done = true;
          this.ballEvent(b, ev, p);
        }
      }
      const pc = toCam(cam, p.x, p.y, p.z);
      if (pc.z < NEAR) continue;
      const sp = projCam(cam, pc);
      let layer = 3;
      if (pc.z > board) layer = 0;
      else if (hoop && pc.z > hoop.d + RIM_R * 0.55) layer = 1;
      else if (hoop && pc.z > hoop.d - RIM_R) {
        const inside = Math.hypot(p.x - HOOP_X, p.z - HOOP_Z) < RIM_R + BALL_R && p.y < RIM_Y + 0.05;
        layer = inside ? 2 : 3;
      }
      live.push({ b, p, sp, layer, alpha: p.alpha });
      this.drawShadow(ctx, cam, p);
    }
    this.balls = this.balls.filter((b) => !b.gone);
    live.sort((a, b) => b.sp.d - a.sp.d);
    const drawLayer = (n) => {
      for (const l of live) if (l.layer === n) this.drawBall(ctx, l.sp.x, l.sp.y, BALL_R * l.sp.s, l.b.skin, l.b.spin + (now - l.b.start) / 90, l.alpha);
    };
    drawLayer(0);
    this.drawBoard(ctx, cam, th);
    drawLayer(1);
    const rim = this.rimGeometry(cam);
    if (rim) this.drawRimHalf(ctx, rim, th, true);
    drawLayer(2);
    if (rim) this.drawNet(ctx, rim, th, now);
    if (rim) this.drawRimHalf(ctx, rim, th, false);
    drawLayer(3);

    // Ball in hand.
    if (this.hand) {
      const sp = this.currentSpot();
      const aim = this.aimState();
      const pull = aim ? aim.power * 0.12 : 0;
      const bob = Math.sin(now / 380) * 0.015;
      const p = project(cam, sp.x, RELEASE_H - pull + bob, sp.z);
      if (p) {
        const age = this.hand.since ? Math.min(1, (now - this.hand.since) / 180) : 1;
        this.drawBall(ctx, p.x, p.y + (1 - age) * 60, BALL_R * p.s, this.hand.skin, now / 1400, age);
        this.handScreen = p;
      }
    }
    this.drawAim(ctx, cam);
    this.drawParticles(ctx, dt);
    this.drawTexts(ctx, now);
  }

  ballPos(b, now) {
    const t = (now - b.start) / 1000;
    if (t < 0) return null;
    const idx = t * 60;
    const last = b.n - 1;
    let alpha = 1;
    if (idx >= last) {
      const fade = (idx - last) / 15;
      if (fade >= 1) {
        b.gone = true;
        return null;
      }
      alpha = 1 - fade;
    }
    const i = Math.min(last, Math.floor(idx));
    const j = Math.min(last, i + 1);
    const f = Math.min(1, idx - i);
    const P = b.path;
    return {
      x: P[i * 3] + (P[j * 3] - P[i * 3]) * f,
      y: P[i * 3 + 1] + (P[j * 3 + 1] - P[i * 3 + 1]) * f,
      z: P[i * 3 + 2] + (P[j * 3 + 2] - P[i * 3 + 2]) * f,
      t,
      alpha,
    };
  }

  ballEvent(b, ev, p) {
    const sp = this.cam ? project(this.cam, p.x, p.y, p.z) : null;
    if (ev.e === 'rim') {
      sfx.rim();
      this.rimShake = 1;
      this.shake = Math.max(this.shake, 3);
    } else if (ev.e === 'board') {
      sfx.board();
      this.shake = Math.max(this.shake, 2);
    } else if (ev.e === 'floor') {
      if (b.floorSounds++ < 2) sfx.bounce();
    } else if (ev.e === 'score') {
      sfx.swish();
      this.netPulse = 1;
      if (sp) this.confetti(sp.x, sp.y + 10, 18);
      haptic(25);
      if (b.onScore) b.onScore(sp);
    }
    if (b.onEvent) b.onEvent(ev.e, sp);
  }

  // ------------------------------------------------------------- drawing
  drawSky(ctx, cam, th) {
    const { W, H } = this;
    const horizon = Math.max(0, Math.min(H, cam.cy));
    const g = ctx.createLinearGradient(0, 0, 0, horizon + 1);
    g.addColorStop(0, th.sky[0]);
    g.addColorStop(1, th.sky[1]);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, horizon + 1);
    if (th.stars) {
      ctx.fillStyle = '#ffffff';
      for (const [sx, sy, sz] of STARS) {
        ctx.globalAlpha = 0.35 + 0.25 * sz;
        ctx.fillRect(sx * W, sy * horizon, sz * 0.8, sz * 0.8);
      }
      ctx.globalAlpha = 1;
    }
    if (th.planet) {
      const px = W * 0.82;
      const py = horizon * 0.35;
      const pr = Math.min(W, H) * 0.09;
      const pg = ctx.createRadialGradient(px - pr * 0.4, py - pr * 0.4, pr * 0.1, px, py, pr);
      pg.addColorStop(0, '#ffb57a');
      pg.addColorStop(1, '#8a3d9e');
      ctx.fillStyle = pg;
      ctx.beginPath();
      ctx.arc(px, py, pr, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,220,180,0.6)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(px, py, pr * 1.7, pr * 0.45, -0.3, 0, Math.PI * 2);
      ctx.stroke();
    }
    if (th.sun) {
      const sg = ctx.createRadialGradient(W * 0.15, horizon * 0.3, 2, W * 0.15, horizon * 0.3, Math.min(W, H) * 0.12);
      sg.addColorStop(0, 'rgba(255,255,220,1)');
      sg.addColorStop(1, 'rgba(255,255,220,0)');
      ctx.fillStyle = sg;
      ctx.fillRect(0, 0, W, horizon);
    }
    if (th.sea) {
      ctx.fillStyle = th.sea;
      ctx.fillRect(0, horizon - H * 0.035, W, H * 0.035 + 1);
    }
    if (th.spotlights) {
      for (const sx of [0.1, 0.9]) {
        const lg = ctx.createRadialGradient(W * sx, 0, 0, W * sx, 0, H * 0.7);
        lg.addColorStop(0, 'rgba(120,200,255,0.22)');
        lg.addColorStop(1, 'rgba(120,200,255,0)');
        ctx.fillStyle = lg;
        ctx.fillRect(0, 0, W, H);
      }
    }
  }

  polyFloor(ctx, cam, pts, fill) {
    const camPts = clipPoly(pts.map(([x, z]) => toCam(cam, x, 0, z)));
    if (camPts.length < 3) return;
    ctx.beginPath();
    camPts.forEach((p, i) => {
      const s = projCam(cam, p);
      if (i === 0) ctx.moveTo(s.x, s.y);
      else ctx.lineTo(s.x, s.y);
    });
    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.fill();
  }

  strokeFloor(ctx, cam, pts, color, width) {
    ctx.strokeStyle = color;
    ctx.lineCap = 'round';
    let prev = null;
    for (const [x, z] of pts) {
      const c = toCam(cam, x, 0, z);
      if (prev && prev.z >= NEAR && c.z >= NEAR) {
        const a = projCam(cam, prev);
        const b = projCam(cam, c);
        ctx.lineWidth = Math.max(1, Math.min(8, width * ((a.s + b.s) / 2)));
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
      }
      prev = c;
    }
  }

  drawFloor(ctx, cam, th) {
    const { W, H } = this;
    const horizon = Math.max(0, cam.cy);
    ctx.fillStyle = th.outer;
    ctx.fillRect(0, horizon, W, H - horizon + 2);
    this.polyFloor(ctx, cam, COURT_POLY, th.floor);
    if (th.plank) for (const p of PLANKS) this.strokeFloor(ctx, cam, p, th.plank, 0.02);
    this.polyFloor(ctx, cam, KEY_POLY, th.paint);
    for (const l of LINES) this.strokeFloor(ctx, cam, l, th.line, 0.05);
    // Soft vignette toward the horizon.
    const g = ctx.createLinearGradient(0, horizon, 0, horizon + H * 0.18);
    g.addColorStop(0, 'rgba(0,0,0,0.35)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, horizon, W, H * 0.18);
  }

  drawWall(ctx, cam, th) {
    const w = th.wall;
    if (!w) return;
    // Side walls first, so corners look closed from the wings and corners.
    for (const sx of [-12, 12]) {
      const side = clipPoly([toCam(cam, sx, 0, -20), toCam(cam, sx, 0, w.z), toCam(cam, sx, w.h, w.z), toCam(cam, sx, w.h, -20)]);
      if (side.length < 3) continue;
      ctx.beginPath();
      side.forEach((p, i) => {
        const q = projCam(cam, p);
        if (i) ctx.lineTo(q.x, q.y);
        else ctx.moveTo(q.x, q.y);
      });
      ctx.closePath();
      ctx.fillStyle = w.bottom;
      ctx.fill();
    }
    const corners = [
      toCam(cam, -200, 0, w.z),
      toCam(cam, 200, 0, w.z),
      toCam(cam, 200, w.h, w.z),
      toCam(cam, -200, w.h, w.z),
    ];
    const pts = clipPoly(corners);
    if (pts.length < 3) return;
    const sp = pts.map((p) => projCam(cam, p));
    const top = Math.min(...sp.map((p) => p.y));
    const bottom = Math.max(...sp.map((p) => p.y));
    ctx.save();
    ctx.beginPath();
    sp.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
    ctx.closePath();
    const g = ctx.createLinearGradient(0, top, 0, bottom);
    g.addColorStop(0, w.top);
    g.addColorStop(1, w.bottom);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.clip();
    if (w.stripes) {
      ctx.strokeStyle = w.stripes;
      for (let y = 0.6; y < w.h; y += 0.55) {
        const a = project(cam, -200, y, w.z) || project(cam, -3, y, w.z);
        const b = project(cam, 200, y, w.z) || project(cam, 3, y, w.z);
        if (!a || !b) continue;
        ctx.lineWidth = Math.max(1, 0.12 * a.s);
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
      }
    }
    if (w.fence) {
      ctx.strokeStyle = 'rgba(210,220,235,0.35)';
      ctx.lineWidth = 1;
      const step = 22;
      for (let x = -this.H; x < this.W + this.H; x += step) {
        ctx.beginPath();
        ctx.moveTo(x, top);
        ctx.lineTo(x + (bottom - top), bottom);
        ctx.moveTo(x, bottom);
        ctx.lineTo(x + (bottom - top), top);
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  drawPole(ctx, cam, th) {
    const a = project(cam, 0, 3.2, BOARD.z + 0.08);
    const b = project(cam, 0, 3.2, BOARD.z + 1.35);
    const c = project(cam, 0, 0, BOARD.z + 1.35);
    if (!a || !b || !c) return;
    ctx.strokeStyle = th.pole;
    ctx.lineCap = 'round';
    ctx.lineWidth = Math.max(3, 0.13 * b.s);
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.lineTo(c.x, c.y);
    ctx.stroke();
  }

  drawBoard(ctx, cam, th) {
    const q = (x, y) => project(cam, x, y, BOARD.z);
    const c = [q(BOARD.xMin, BOARD.yMin), q(BOARD.xMax, BOARD.yMin), q(BOARD.xMax, BOARD.yMax), q(BOARD.xMin, BOARD.yMax)];
    if (c.some((p) => !p)) return;
    ctx.beginPath();
    c.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
    ctx.closePath();
    ctx.fillStyle = th.board;
    ctx.fill();
    ctx.strokeStyle = th.boardEdge;
    ctx.lineWidth = Math.max(2, 0.045 * c[0].s);
    ctx.stroke();
    const s = [q(-0.295, RIM_Y + 0.02), q(0.295, RIM_Y + 0.02), q(0.295, RIM_Y + 0.47), q(-0.295, RIM_Y + 0.47)];
    ctx.beginPath();
    s.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
    ctx.closePath();
    ctx.lineWidth = Math.max(1.5, 0.035 * s[0].s);
    ctx.stroke();
  }

  rimGeometry(cam) {
    const c = project(cam, HOOP_X, RIM_Y, HOOP_Z);
    if (!c) return null;
    const near = project(cam, HOOP_X - cam.fx * RIM_R, RIM_Y, HOOP_Z - cam.fz * RIM_R);
    const far = project(cam, HOOP_X + cam.fx * RIM_R, RIM_Y, HOOP_Z + cam.fz * RIM_R);
    const rx = RIM_R * c.s;
    const trueRy = near && far ? Math.abs(near.y - far.y) / 2 : 0;
    const ry = Math.max(trueRy, rx * 0.26);
    const wobble = this.rimShake * Math.sin(performance.now() / 18) * 1.5;
    return { x: c.x, y: c.y + wobble, rx, ry, s: c.s };
  }

  drawRimHalf(ctx, rim, th, back) {
    ctx.strokeStyle = th.rim;
    ctx.lineWidth = Math.max(2.5, 0.025 * rim.s);
    ctx.beginPath();
    if (back) ctx.ellipse(rim.x, rim.y, rim.rx, rim.ry, 0, Math.PI, Math.PI * 2);
    else ctx.ellipse(rim.x, rim.y, rim.rx, rim.ry, 0, 0, Math.PI);
    ctx.stroke();
  }

  drawNet(ctx, rim, th, now) {
    const pulse = this.netPulse;
    const len = 0.44 * rim.s * (1 + 0.35 * pulse);
    const sway = Math.sin(now / 70) * pulse * rim.rx * 0.12;
    const rings = [
      { r: 1, y: 0 },
      { r: 0.82 - 0.1 * pulse, y: len * 0.5 },
      { r: 0.62 - 0.18 * pulse, y: len },
    ];
    const N = 12;
    const pt = (ring, k) => {
      const a = (k / N) * Math.PI * 2;
      return [rim.x + Math.cos(a) * rim.rx * ring.r + (ring.y ? sway : 0), rim.y + Math.sin(a) * rim.ry * ring.r + ring.y];
    };
    ctx.strokeStyle = th.net;
    ctx.lineWidth = Math.max(1, 0.008 * rim.s);
    ctx.beginPath();
    for (let k = 0; k < N; k++) {
      for (let r = 0; r < rings.length - 1; r++) {
        const a = pt(rings[r], k + (r % 2) * 0.5);
        const b1 = pt(rings[r + 1], k + ((r + 1) % 2) * 0.5);
        const b2 = pt(rings[r + 1], k - 1 + ((r + 1) % 2) * 0.5);
        ctx.moveTo(a[0], a[1]);
        ctx.lineTo(b1[0], b1[1]);
        ctx.moveTo(a[0], a[1]);
        ctx.lineTo(b2[0], b2[1]);
      }
    }
    ctx.stroke();
  }

  drawShadow(ctx, cam, p) {
    const s = project(cam, p.x, 0, p.z);
    if (!s) return;
    const r = BALL_R * s.s;
    const lift = Math.min(1, p.y / 4);
    ctx.fillStyle = `rgba(0,0,0,${(0.32 * (1 - lift) * p.alpha).toFixed(3)})`;
    ctx.beginPath();
    ctx.ellipse(s.x, s.y, r * (1.1 + lift), r * 0.35 * (1 + lift), 0, 0, Math.PI * 2);
    ctx.fill();
  }

  drawBall(ctx, x, y, r, skinId, spin, alpha = 1) {
    if (r < 0.5) return;
    const sk = BALL_SKINS[skinId] || BALL_SKINS.classic;
    ctx.save();
    ctx.globalAlpha = alpha;
    if (sk.glow) {
      ctx.shadowColor = sk.glow;
      ctx.shadowBlur = r * 0.9;
    }
    const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.1, x, y, r);
    g.addColorStop(0, sk.light);
    g.addColorStop(0.55, sk.base);
    g.addColorStop(1, sk.dark);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.clip();
    if (sk.stripe) {
      ctx.fillStyle = sk.stripe;
      ctx.globalAlpha = alpha * 0.85;
      ctx.beginPath();
      ctx.ellipse(x, y + Math.sin(spin) * r * 0.5, r * 1.1, r * 0.32, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = alpha;
    }
    if (sk.stars) {
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      for (let i = 0; i < 6; i++) {
        const a = spin * 0.6 + i * 1.7;
        ctx.fillRect(x + Math.cos(a) * r * 0.6, y + Math.sin(a * 1.3) * r * 0.6, Math.max(1, r * 0.08), Math.max(1, r * 0.08));
      }
    }
    ctx.strokeStyle = sk.seam;
    ctx.lineWidth = Math.max(1, r * 0.075);
    const c = Math.cos(spin);
    ctx.beginPath();
    ctx.moveTo(x, y - r);
    ctx.lineTo(x, y + r);
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(x, y, r, Math.max(0.5, r * Math.abs(c)), 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(x - r * 1.05, y, r * 0.62, r * 1.05, 0, -0.9, 0.9);
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(x + r * 1.05, y, r * 0.62, r * 1.05, 0, Math.PI - 0.9, Math.PI + 0.9);
    ctx.stroke();
    ctx.restore();
  }

  drawAim(ctx, cam) {
    const aim = this.aimState();
    if (!aim || !this.hand || !this.handScreen) return;
    const spot = this.currentSpot();
    const hs = this.handScreen;
    const zone = this.guide !== 'none' ? sweetZone(spot) : null;
    const inZone = zone && aim.power >= zone[0] && aim.power <= zone[1];
    // Arrow
    const ang = aim.aim * 0.55;
    const len = 50 + aim.power * Math.min(160, this.H * 0.22);
    const ex = hs.x + Math.sin(ang) * len;
    const ey = hs.y - BALL_R * hs.s - Math.cos(ang) * len;
    ctx.save();
    ctx.strokeStyle = inZone ? '#2fd67b' : '#ffffff';
    ctx.globalAlpha = 0.9;
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    ctx.setLineDash([2, 12]);
    ctx.beginPath();
    ctx.moveTo(hs.x, hs.y - BALL_R * hs.s);
    ctx.lineTo(ex, ey);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = ctx.strokeStyle;
    ctx.beginPath();
    ctx.arc(ex, ey, 7, 0, Math.PI * 2);
    ctx.fill();
    // Short preview arc
    if (this.guide === 'arc') {
      const pts = previewArc(spot, aim.power, aim.aim, 12);
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      for (let i = 0; i < pts.length; i += 3) {
        const p = project(cam, pts[i], pts[i + 1], pts[i + 2]);
        if (p) {
          ctx.beginPath();
          ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }
    // Power meter
    const mx = this.W - 30;
    const top = this.H * 0.4;
    const bottom = this.H * 0.84;
    const hgt = bottom - top;
    ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(5,11,24,0.75)';
    roundRect(ctx, mx - 11, top - 6, 22, hgt + 12, 11);
    ctx.fill();
    if (zone) {
      ctx.fillStyle = 'rgba(47,214,123,0.55)';
      ctx.fillRect(mx - 7, bottom - zone[1] * hgt, 14, (zone[1] - zone[0]) * hgt);
    }
    const pg = ctx.createLinearGradient(0, bottom, 0, top);
    pg.addColorStop(0, '#2ec5ff');
    pg.addColorStop(0.6, '#ffcc33');
    pg.addColorStop(1, '#ff4d5e');
    ctx.fillStyle = pg;
    ctx.fillRect(mx - 5, bottom - aim.power * hgt, 10, aim.power * hgt);
    ctx.restore();
  }

  drawParticles(ctx, dt) {
    for (const p of this.particles) {
      p.age += dt;
      p.vy += 520 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
