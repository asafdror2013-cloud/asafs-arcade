<script>
/*! © 2026 Asaf. All rights reserved. Free to play; not to be copied or claimed as your own. */
(function () {
  'use strict';
  var CFG = {"id": "fold-and-fly", "owner": "Asaf", "year": 2026, "mark": "bl", "dx": 0, "dy": 0, "mount": null, "hubCss": null};
  var NOTICE = '© ' + CFG.year + ' ' + CFG.owner;

  // Inside Asaf's Arcade the game runs in a frame of the arcade page: borrow its cloud saves, let it show the notice.
  var hub = null;
  try {
    var P = window.parent;
    if (P && P !== window && P.__ASAF_ARCADE__ && P.__ASAF_ARCADE__.v === 1) hub = P.__ASAF_ARCADE__;
  } catch (e) { hub = null; }
  window.__ASAF_HUB__ = !!hub;
  if (hub) {
    window.__asafClaude = makeClaude(hub, CFG.id);
    if (CFG.hubCss) {
      var hs = document.createElement('style');
      hs.textContent = CFG.hubCss;
      (document.head || document.documentElement).appendChild(hs);
    }
    return;
  }

  // ---- played on its own: a small permanent tag plus a short notice when the game opens
  var css = '' +
    '#asaf-cr{all:initial;position:fixed;z-index:2147483646;display:block;box-sizing:border-box;pointer-events:none;user-select:none;-webkit-user-select:none;' +
    'font:600 10px/1 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;letter-spacing:.04em;color:rgba(255,255,255,.88);' +
    'background:rgba(6,6,16,.52);padding:4px 8px;border-radius:999px;white-space:nowrap;opacity:.82;transition:opacity .7s ease}' +
    '#asaf-cr.asaf-busy{opacity:.14}' +
    '#asaf-cr-toast{all:initial;position:fixed;z-index:2147483647;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));display:block;box-sizing:border-box;' +
    'transform:translateX(-50%);pointer-events:none;user-select:none;-webkit-user-select:none;width:max-content;max-width:min(90vw,430px);' +
    'font:500 12.5px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#fff;text-align:center;' +
    'background:rgba(8,8,20,.9);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:9px 15px;box-shadow:0 10px 30px rgba(0,0,0,.5);' +
    'opacity:0;animation:asafCrIn .45s ease .6s forwards,asafCrOut .6s ease 5.2s forwards}' +
    '#asaf-cr-toast b{all:unset;font-weight:800}' +
    '#asaf-cr-toast i{all:unset;display:block;margin-top:2px;font-size:11.5px;opacity:.78}' +
    '@keyframes asafCrIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}' +
    '@keyframes asafCrOut{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,0)}}';
  var st = document.createElement('style');
  st.id = 'asaf-cr-style';
  st.textContent = css;
  (document.head || document.documentElement).appendChild(st);

  var dx = 6 + (CFG.dx || 0), dy = 6 + (CFG.dy || 0);
  var T = 'top:calc(' + dy + 'px + env(safe-area-inset-top,0px));';
  var B = 'bottom:calc(' + dy + 'px + env(safe-area-inset-bottom,0px));';
  var L = 'left:calc(' + dx + 'px + env(safe-area-inset-left,0px));';
  var R = 'right:calc(' + dx + 'px + env(safe-area-inset-right,0px));';
  var C = 'left:50%;transform:translateX(-50%);';
  var POS = { tl: T + L, tr: T + R, bl: B + L, br: B + R, tc: T + C, bc: B + C };

  var tag = document.createElement('div');
  tag.id = 'asaf-cr';
  tag.setAttribute('role', 'note');
  tag.setAttribute('aria-label', NOTICE + '. All rights reserved.');
  tag.textContent = NOTICE;
  tag.style.cssText = POS[CFG.mark] || POS.br;

  var toast = document.createElement('div');
  toast.id = 'asaf-cr-toast';
  toast.setAttribute('aria-hidden', 'true');
  var b = document.createElement('b'); b.textContent = NOTICE + ' · All rights reserved';
  var i = document.createElement('i'); i.textContent = 'Free to play. Please don’t copy it or claim it as your own.';
  toast.appendChild(b); toast.appendChild(i);
  setTimeout(function () { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 6200);

  function home() {
    if (CFG.mount) { var m = document.querySelector(CFG.mount); if (m) return m; }
    return document.documentElement;
  }
  function mount() {
    var h = home();
    if (tag.parentNode !== h) h.appendChild(tag);
  }
  function start() {
    mount();
    home().appendChild(toast);
    setInterval(mount, 2500);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();

  // fade the tag while someone is actively playing, bring it back when they pause
  var idle = 0;
  function busy() {
    tag.classList.add('asaf-busy');
    clearTimeout(idle);
    idle = setTimeout(function () { tag.classList.remove('asaf-busy'); }, 2600);
  }
  ['pointerdown', 'keydown', 'touchstart', 'wheel'].forEach(function (ev) {
    window.addEventListener(ev, busy, { capture: true, passive: true });
  });

  // ---- cloud saves through the arcade page (strings only cross between the two pages)
  function makeClaude(H, gid) {
    var cache = {};
    function fail(code) { var e = new Error(code || 'unavailable'); e.code = code || 'unavailable'; return e; }
    function call(fn, args) {
      return new Promise(function (res, rej) {
        var p;
        try { p = H[fn].apply(null, [gid].concat(args || [])); } catch (e) { rej(fail('unavailable')); return; }
        Promise.resolve(p).then(function (s) {
          var r;
          try { r = JSON.parse(s); } catch (e) { rej(fail('internal')); return; }
          if (r && r.ok) res(r.v); else rej(fail(r && r.code));
        }, function () { rej(fail('unavailable')); });
      });
    }
    function snap(path, v) {
      var parts = path.split('/');
      return { id: parts[parts.length - 1], exists: v !== null && v !== undefined,
        data: function () { return v === null || v === undefined ? undefined : JSON.parse(JSON.stringify(v)); } };
    }
    function doc(path) {
      return {
        id: path.split('/').pop(), path: path,
        get: function () { return call('get', [path]).then(function (v) { return snap(path, v); }); },
        set: function (data) { return call('set', [path, JSON.stringify(data)]).then(function () {}); }
      };
    }
    function query(path, lim) {
      return {
        path: path,
        limit: function (n) { return query(path, n); },
        doc: function (id) { return doc(path + '/' + id); },
        onSnapshot: function (next, error) {
          var dead = false, off = null;
          function onErr(code) { if (!dead && typeof error === 'function') error(fail(code)); }
          try {
            off = H.watch(gid, path, lim || 0, function (s) {
              if (dead) return;
              var rows; try { rows = JSON.parse(s); } catch (e) { return; }
              var docs = rows.map(function (d) { return snap(path + '/' + d.id, d.v); });
              next({ docs: docs, size: docs.length, empty: !docs.length, forEach: function (f) { docs.forEach(f); } });
            }, onErr);
          } catch (e) { setTimeout(function () { onErr('unavailable'); }, 0); }
          return function () { dead = true; try { if (off) off(); } catch (e) { /* page gone */ } };
        }
      };
    }
    var db = { doc: doc, collection: function (p) { return query(p, 0); } };
    var user = {
      id: function () { return call('uid', []); },
      me: function () { return call('uid', []).then(function (id) { return { id: id }; }); },
      can: function (n) { return call('can', [String(n)]); },
      profiles: function (ids) { return call('profiles', [JSON.stringify(ids || [])]); },
      isOwner: function () { return false; },
      canEdit: function () { return false; }
    };
    return {
      use: function (name) {
        if (!cache[name]) {
          cache[name] = call('ready', [String(name)]).then(function (ok) {
            if (!ok) return null;
            return name === 'db' ? db : name === 'user' ? user : null;
          }, function () { return null; });
        }
        return cache[name];
      }
    };
  }
})();
</script>

:root { --ink: #2f3550; --paper: #fffdf7; --coral: #ff7a59; --coral2: #e35b3a; --mint: #3fcf9f; --mint2: #23a77b; --sun: #ffd34d; --sky: #86cdf9; --lav: #b48cff;
  --ui: 'Fredoka', 'Trebuchet MS', sans-serif; --hand: 'Patrick Hand', 'Comic Sans MS', cursive; --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px); }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #86cdf9; color: var(--ink); font-family: var(--ui); user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; overscroll-behavior: none; }
canvas#c { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; }
canvas#fx { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; pointer-events: none; z-index: 30; }
#ui { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
#ui > * { pointer-events: auto; }
.hidden { display: none !important; }
button { font-family: var(--ui); color: inherit; cursor: pointer; border: 0; touch-action: manipulation; }

/* paper buttons */
.btn { position: relative; border-radius: 14px; padding: 12px 18px; font-size: 17px; font-weight: 700; letter-spacing: 0.02em; background: var(--paper); color: var(--ink);
  box-shadow: 0 4px 0 rgba(47, 53, 80, 0.25), 0 8px 18px rgba(47, 53, 80, 0.12); transition: transform 0.06s; }
.btn:active:not([disabled]) { transform: translateY(3px); box-shadow: 0 1px 0 rgba(47, 53, 80, 0.25); }
.btn[disabled] { opacity: 0.45; cursor: default; }
.btn.go { background: linear-gradient(180deg, #ff9a7c, var(--coral)); color: #fff; box-shadow: 0 5px 0 var(--coral2), 0 10px 22px rgba(227, 91, 58, 0.3); text-shadow: 0 2px 0 rgba(0, 0, 0, 0.12); }
.btn.buy { background: linear-gradient(180deg, #ffe17a, var(--sun)); color: #5a4300; box-shadow: 0 5px 0 #d9a91f; }
.btn.ghost { background: var(--paper); }
.btn.small { padding: 8px 12px; font-size: 14px; border-radius: 11px; }
.btn.huge { font-size: 30px; padding: 14px 0; width: min(78vw, 320px); border-radius: 20px; letter-spacing: 0.04em; }
.round { width: 42px; height: 42px; border-radius: 50%; background: var(--paper); font-size: 20px; box-shadow: 0 3px 0 rgba(47, 53, 80, 0.22); }

/* top bar */
#top { position: absolute; top: calc(var(--safe-t) + 10px); left: 10px; right: 10px; display: flex; gap: 8px; align-items: center; pointer-events: none; }
#top > * { pointer-events: auto; }
#top .round { margin-left: auto; }
#top .gift:not(.hidden) + .round { margin-left: 0; }
.pill { display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border-radius: 20px; background: var(--paper); font-weight: 700; font-size: 18px; box-shadow: 0 3px 0 rgba(47, 53, 80, 0.2); }
.pill .st { color: #f2b51f; font-size: 20px; }
.pill.lvl { font-size: 14px; } .pill.lvl b { font-size: 18px; }
.pill .xp { width: 54px; height: 7px; border-radius: 4px; background: #e9e4d8; overflow: hidden; display: block; margin-left: 4px; }
.pill .xp i { display: block; height: 100%; width: 0; background: var(--mint); }
.bump { animation: bump 0.3s ease-out; }

/* hangar */
#hangar { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding: calc(var(--safe-t) + 60px) 14px calc(var(--safe-b) + 14px); pointer-events: none; }
#hangar > * { pointer-events: auto; }
.logo { font-family: var(--ui); font-weight: 700; font-size: clamp(48px, 15vw, 84px); line-height: 0.9; color: #fff; text-align: center; transform: rotate(-3deg); filter: drop-shadow(0 5px 0 rgba(47, 53, 80, 0.25)); pointer-events: none; }
.logo span { display: inline-block; padding: 2px 10px 6px; background: var(--paper); color: var(--coral); border-radius: 6px; box-shadow: 4px 4px 0 rgba(47, 53, 80, 0.15); }
.logo .w1 { transform: rotate(-4deg); }
.logo .w2 { transform: rotate(3deg) translateY(4px); color: #2f8fd8; }
.logo .amp { background: none; box-shadow: none; color: #fff; padding: 0 4px; font-size: 0.7em; vertical-align: middle; }
.spacer { flex: 1; min-height: 120px; pointer-events: none !important; }
.pinfo { text-align: center; margin-bottom: 6px; pointer-events: none; }
.pinfo b { display: block; font-size: 22px; color: #fff; text-shadow: 0 2px 0 rgba(47, 53, 80, 0.3); }
.pinfo span { font-family: var(--hand); font-size: 17px; color: #fff; text-shadow: 0 1px 0 rgba(47, 53, 80, 0.4); }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 5px 14px; width: min(86vw, 340px); margin-bottom: 12px; pointer-events: none; }
.sbar { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: #fff; text-shadow: 0 1px 0 rgba(47, 53, 80, 0.35); }
.sbar span { width: 50px; }
.sbar i { flex: 1; height: 8px; border-radius: 4px; background: rgba(255, 255, 255, 0.45); overflow: hidden; }
.sbar b { display: block; height: 100%; border-radius: 4px; }
.sbar.c1 b { background: #ffd34d; } .sbar.c2 b { background: #7bd389; } .sbar.c3 b { background: #ff8fb1; } .sbar.c4 b { background: #b48cff; }
.row4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: min(92vw, 400px); margin: 12px 0; }
.btn.tile { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 9px 2px 8px; font-size: 13px; border-radius: 13px; }
.btn.tile i { font-style: normal; font-size: 20px; }

// ---------------------------------------------------------------- save.js (local + cloud)
const SAVE_KEY = 'foldfly.save.v1';
function defaultSave() {
  return {
    v: 1, stars: 0, best: 0, level: 1, xp: 0,
    up: { band: 0, crease: 0, wax: 0, fins: 0, gust: 0, magnet: 0 },
    planes: { dart: true }, papers: { white: true, sakura: true },
    sel: { plane: 'dart', paper: 'sakura' },
    folds: {}, missions: [], mtiers: {},
    stats: { flights: 0, dist: 0, stars: 0, loops: 0, drafts: 0, bounces: 0, perfect: 0, crashes: 0, bestFold: 0 },
    gift: '', seen: {},
    settings: { sound: true, music: true, haptics: true },
    updated: 0,
  };
}
function deepFill(t, d) {
  for (const k in d) {
    if (t[k] === undefined || t[k] === null) t[k] = JSON.parse(JSON.stringify(d[k]));
    else if (d[k] && typeof d[k] === 'object' && !Array.isArray(d[k]) && typeof t[k] === 'object') deepFill(t[k], d[k]);
  }
  return t;
}
function mergeSaves(a, b) {
  a = deepFill(JSON.parse(JSON.stringify(a)), defaultSave());
  b = deepFill(JSON.parse(JSON.stringify(b)), defaultSave());
  const newer = (b.updated || 0) > (a.updated || 0) ? b : a;
  const out = JSON.parse(JSON.stringify(newer));
  out.best = Math.max(a.best, b.best);
  for (const k in out.up) out.up[k] = Math.max(a.up[k] || 0, b.up[k] || 0);
  out.planes = Object.assign({}, a.planes, b.planes);
  out.papers = Object.assign({}, a.papers, b.papers);
  for (const k in out.stats) out.stats[k] = Math.max(a.stats[k] || 0, b.stats[k] || 0);
  if (b.level > a.level || (b.level === a.level && b.xp > a.xp)) { out.level = b.level; out.xp = b.xp; } else { out.level = a.level; out.xp = a.xp; }
  out.updated = Math.max(a.updated || 0, b.updated || 0);
  return out;
}
const Save = {
  data: defaultSave(),
  cloud: { ref: null, ready: false, writing: false, pending: false, lastJson: '', failed: 0 },
  onRemote: null,
  load() {
    try { const raw = localStorage.getItem(SAVE_KEY); if (raw) this.data = deepFill(JSON.parse(raw), defaultSave()); } catch (e) { /* storage unavailable */ }
  },
  persistLocal() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(this.data)); } catch (e) { /* ignore */ } },
  persist() {
    this.data.updated = Date.now();
    this.persistLocal();
    clearTimeout(this._t);
    this._t = setTimeout(() => this.cloudWrite(), 600);
  },
  async cloudInit() {
    try {
      const cl = window.__asafClaude || window.claude;
      if (!cl || typeof cl.use !== 'function') return;
      const [db, user] = await Promise.all([cl.use('db'), cl.use('user')]);
      if (!db || !user) return;
      const id = await user.id();
      if (!id) return;
      const ref = db.doc('data/users/' + id + '/save');
      let timer = 0;
      const snap = await Promise.race([ref.get(), new Promise((_, rej) => { timer = setTimeout(() => rej(new Error('timeout')), 10000); })]);
      clearTimeout(timer);
      this.cloud.ref = ref;
      if (snap && snap.exists) {
        const body = snap.data();
        if (body && body.save && typeof body.save === 'object') {
          const remote = JSON.parse(JSON.stringify(body.save));
          this.cloud.lastJson = JSON.stringify(remote);
          this.data = mergeSaves(this.data, remote);
          this.persistLocal();
          if (this.onRemote) this.onRemote();
        }
      }
      this.cloud.ready = true;
      this.cloudWrite();
    } catch (e) { console.warn('[plane] cloud save unavailable:', e && (e.code || e.message)); }
  },
  cloudWrite() {
    const c = this.cloud;
    if (!c.ref || !c.ready) return;
    if (c.writing) { c.pending = true; return; }
    const json = JSON.stringify(this.data);
    if (json === c.lastJson) return;
    c.writing = true;
    c.ref.set({ save: JSON.parse(json) })
      .then(() => { c.lastJson = json; c.failed = 0; })
      .catch((e) => { const code = e && e.code; c.failed++; if (code === 'unavailable' && c.failed < 3) setTimeout(() => this.cloudWrite(), 2000); else if (code && code !== 'unavailable' && code !== 'resource_exhausted') c.ref = null; })
      .finally(() => { c.writing = false; if (c.pending) { c.pending = false; this.cloudWrite(); } });
  },
};

// ---------------------------------------------------------------- sound.js (synth core shared with Afterimage)
const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);

const Sound = {
  ac: null, ok: false,
  master: null, musicBus: null, musicLP: null, pump: null, drums: null, sfx: null, revIn: null, delIn: null, noise: null,
  musicOn: true, sfxOn: true, detune: 0, last: {},

  ensure() {
    if (this.ac) {
      if (this.ac.state === 'suspended') this.ac.resume().catch(() => {});
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { this.ac = new AC({ latencyHint: 'interactive' }); } catch (e) {
      try { this.ac = new AC(); } catch (e2) { return; }
    }
    try { this.build(); this.ok = true; } catch (e) { console.warn('[plane] audio off', e); this.ok = false; }
    if (this.ac.state === 'suspended') this.ac.resume().catch(() => {});
    if (this.ok) this.setDelayTime(60 / 96);
  },

  build() {
    const ac = this.ac;
    this.master = ac.createGain();
    this.master.gain.value = 0.9;
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 14; comp.ratio.value = 4;
    comp.attack.value = 0.003; comp.release.value = 0.18;
    this.master.connect(comp);
    comp.connect(ac.destination);

    this.musicBus = ac.createGain();
    this.musicBus.gain.value = 0.38;
    this.musicLP = ac.createBiquadFilter();
    this.musicLP.type = 'lowpass';
    this.musicLP.frequency.value = 18000;
    this.musicLP.Q.value = 0.8;
    this.musicBus.connect(this.musicLP);
    this.musicLP.connect(this.master);
    this.pump = ac.createGain();
    this.pump.connect(this.musicBus);
    this.drums = ac.createGain();
    this.drums.connect(this.musicBus);

    this.sfx = ac.createGain();
    this.sfx.gain.value = 0.75;
    this.sfx.connect(this.master);

    const rev = ac.createConvolver();
    rev.buffer = this.impulse(2.6, 2.4);
    this.revIn = ac.createGain();
    this.revIn.connect(rev);
    const revOut = ac.createGain();
    revOut.gain.value = 0.34;
    rev.connect(revOut);
    revOut.connect(this.master);

    const dl = ac.createDelay(1.5);
    dl.delayTime.value = 0.375;
    const fb = ac.createGain();
    fb.gain.value = 0.36;
    const dlp = ac.createBiquadFilter();
    dlp.type = 'lowpass';
    dlp.frequency.value = 2400;
    this.delIn = ac.createGain();
    this.delIn.connect(dl);
    dl.connect(dlp);
    dlp.connect(fb);
    fb.connect(dl);
    const dOut = ac.createGain();
    dOut.gain.value = 0.3;
    dlp.connect(dOut);
    dOut.connect(this.musicBus);
    this.delayNode = dl;

    const len = ac.sampleRate;
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.noise = buf;
    this.applySettings();
  },

  impulse(dur, decay) {
    const ac = this.ac, rate = ac.sampleRate, len = Math.floor(rate * dur);
    const buf = ac.createBuffer(2, len, rate);
    for (let c = 0; c < 2; c++) {
      const d = buf.getChannelData(c);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
    return buf;
  },

  applySettings() {
    const s = Save.data.settings;
    this.musicOn = !!(s.music && s.sound);
    this.sfxOn = !!s.sound;
    if (!this.ac || !this.musicBus) return;
    const t = this.ac.currentTime;
    this.musicBus.gain.setTargetAtTime(this.musicOn ? 0.38 : 0, t, 0.05);
    this.sfx.gain.setTargetAtTime(this.sfxOn ? 0.75 : 0, t, 0.05);
  },

  setDelayTime(beatLen) {
    if (this.delayNode) this.delayNode.delayTime.setTargetAtTime(beatLen * 0.75, this.ac.currentTime, 0.05);
  },

  musicFilter(freq, tc) {
    if (!this.ac) return;
    this.musicLP.frequency.setTargetAtTime(freq, this.ac.currentTime, tc || 0.08);
  },

  rate(name, gap) {
    const n = performance.now();
    if ((this.last[name] || 0) + gap * 1000 > n) return false;
    this.last[name] = n;
    return true;
  },

  can() { return this.ok && this.ac && this.ac.state === 'running'; },

  tone(o) {
    const ac = this.ac;
    const t = o.t !== undefined ? o.t : ac.currentTime;
    const osc = ac.createOscillator();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.f, t);
    if (o.f2) osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.f2), t + (o.slide || o.dur));
    if (o.detune) osc.detune.setValueAtTime(o.detune, t);
    const g = ac.createGain();
    const a = o.a || 0.004, dur = o.dur, peak = o.g === undefined ? 0.3 : o.g;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t + a);
    if (o.hold) g.gain.setValueAtTime(Math.max(0.0002, peak), t + a + o.hold);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    let node = osc;
    if (o.lp) {
      const f = ac.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.setValueAtTime(o.lp, t);
      if (o.lp2) f.frequency.exponentialRampToValueAtTime(o.lp2, t + dur);
      f.Q.value = o.q || 0.9;
      node.connect(f);
      node = f;
    }
    node.connect(g);
    g.connect(o.dest || this.sfx);
    if (o.rev) { const s = ac.createGain(); s.gain.value = o.rev; g.connect(s); s.connect(this.revIn); }
    if (o.del) { const s = ac.createGain(); s.gain.value = o.del; g.connect(s); s.connect(this.delIn); }
    osc.start(t);
    osc.stop(t + dur + 0.05);
  },

  hiss(o) {
    const ac = this.ac;
    const t = o.t !== undefined ? o.t : ac.currentTime;
    const src = ac.createBufferSource();
    src.buffer = this.noise;
    const f = ac.createBiquadFilter();
    f.type = o.type || 'bandpass';
    f.frequency.setValueAtTime(o.f || 1000, t);
    if (o.f2) f.frequency.exponentialRampToValueAtTime(o.f2, t + o.dur);
    f.Q.value = o.q || 0.9;
    const g = ac.createGain();
    const a = o.a || 0.002;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, o.g === undefined ? 0.3 : o.g), t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
    src.connect(f);
    f.connect(g);
    g.connect(o.dest || this.sfx);
    if (o.rev) { const s = ac.createGain(); s.gain.value = o.rev; g.connect(s); s.connect(this.revIn); }
    src.start(t, Math.random() * 0.4, o.dur + 0.06);
  },
};


// ---------------------------------------------------------------- music.js (breezy marimba music, wind bed, sfx)
const SCALES = { garden: [60, 62, 64, 67, 69], street: [62, 64, 66, 69, 71], park: [57, 60, 62, 64, 67], city: [63, 65, 67, 70, 72], sky: [65, 67, 69, 72, 74], calm: [60, 62, 64, 67, 69] };
const CHORDS = [[0, 4, 7], [-3, 0, 4], [-7, -3, 0], [-5, -1, 2]];

const Music = {
  on: false, mode: 'calm', step: 0, next: 0, timer: 0, bar: 0, bpm: 104, energy: 0.4,
  start() {
    if (!Sound.ok || this.on) return;
    this.on = true;
    this.next = Sound.ac.currentTime + 0.1;
    this.timer = setInterval(() => this.tick(), 30);
  },
  setMode(m) { if (SCALES[m]) this.mode = m; },
  tick() {
    if (!this.on || !Sound.can()) return;
    const ac = Sound.ac;
    if (this.next < ac.currentTime - 0.3) this.next = ac.currentTime + 0.05;
    while (this.next < ac.currentTime + 0.16) {
      this.play(this.step, this.next);
      this.next += 60 / this.bpm / 2;
      this.step++;
      if (this.step % 16 === 0) this.bar++;
    }
  },
  play(step, t) {
    if (!Sound.musicOn) return;
    const sc = SCALES[this.mode], s16 = step % 16, ch = CHORDS[this.bar % 4];
    const root = sc[0] - 12;
    // soft pad on each bar
    if (s16 === 0) for (const iv of ch) Sound.tone({ f: mtof(root + 12 + iv), type: 'triangle', dur: 2.2, g: 0.022, a: 0.35, t, dest: Sound.musicBus, rev: 0.5 });
    // bass on 1 and the "and" of 3
    if (s16 === 0 || s16 === 10) Sound.tone({ f: mtof(root + ch[0] - 12), type: 'sine', dur: 0.5, g: 0.12, a: 0.01, t, dest: Sound.musicBus });
    // marimba arpeggio, sparser when calm
    const dens = this.mode === 'calm' ? 0.42 : 0.5 + this.energy * 0.4;
    const r = hashStr(this.mode + ':' + this.bar + ':' + s16) % 1000 / 1000;
    if (s16 % 2 === 0 || r < dens * 0.4) {
      if (r < dens) {
        const n = sc[(hashStr('n' + this.bar + s16) % sc.length)] + (s16 % 8 === 0 ? 0 : 12 * ((s16 >> 2) & 1));
        const f = mtof(n);
        Sound.tone({ f, type: 'sine', dur: 0.4, g: 0.07, a: 0.003, t, dest: Sound.musicBus, rev: 0.25 });
        Sound.tone({ f: f * 4, type: 'sine', dur: 0.06, g: 0.025, a: 0.001, t, dest: Sound.musicBus });
      }
    }
    // shaker
    if (this.mode !== 'calm' && s16 % 2 === 1) Sound.hiss({ f: 7000, q: 1, type: 'highpass', dur: 0.05, g: 0.025 + this.energy * 0.02, t, dest: Sound.drums });
    if (this.mode !== 'calm' && (s16 === 0 || s16 === 8)) Sound.tone({ f: 90, f2: 50, dur: 0.18, g: 0.09, t, dest: Sound.drums });
  },
};

const Wind = {
  src: null, filt: null, gain: null,
  start() {
    if (!Sound.ok || this.src) return;
    const ac = Sound.ac;
    this.src = ac.createBufferSource();
    this.src.buffer = Sound.noise;
    this.src.loop = true;
    this.filt = ac.createBiquadFilter();
    this.filt.type = 'bandpass';
    this.filt.frequency.value = 600;
    this.filt.Q.value = 0.6;
    this.gain = ac.createGain();
    this.gain.gain.value = 0;
    this.src.connect(this.filt); this.filt.connect(this.gain); this.gain.connect(Sound.sfx);
    this.src.start();
  },
  set(speed, on) {
    if (!this.gain || !Sound.ac) return;
    const t = Sound.ac.currentTime;
    const v = on && Sound.sfxOn ? clamp((speed - 4) / 30, 0, 1) : 0;
    this.gain.gain.setTargetAtTime(v * 0.22, t, 0.12);
    this.filt.frequency.setTargetAtTime(400 + v * 1600, t, 0.12);
  },
};

// ---------------------------------------------------------------- paper.js (fold geometry + paper patterns)
const Geo = {
  // split a polygon by the line through (mx,my) with normal (nx,ny): [front (>=0), back (<0)]
  split(poly, mx, my, nx, ny) {
    const A = [], B = [], eps = 1e-9;
    const n = poly.length;
    for (let i = 0; i < n; i++) {
      const p = poly[i], q = poly[(i + 1) % n];
      const dp = (p.x - mx) * nx + (p.y - my) * ny;
      const dq = (q.x - mx) * nx + (q.y - my) * ny;
      if (dp >= -eps) A.push(p);
      if (dp <= eps) B.push(p);
      if ((dp > eps && dq < -eps) || (dp < -eps && dq > eps)) {
        const t = dp / (dp - dq);
        const r = { x: p.x + (q.x - p.x) * t, y: p.y + (q.y - p.y) * t, u: p.u + (q.u - p.u) * t, v: p.v + (q.v - p.v) * t };
        A.push(r);
        B.push(r);
      }
    }
    return [A.length >= 3 && Math.abs(Geo.area(A)) > 1e-6 ? A : null, B.length >= 3 && Math.abs(Geo.area(B)) > 1e-6 ? B : null];
  },
  area(p) { let s = 0; for (let i = 0; i < p.length; i++) { const a = p[i], b = p[(i + 1) % p.length]; s += a.x * b.y - b.x * a.y; } return s / 2; },
  crease(C, T) {
    const mx = (C.x + T.x) / 2, my = (C.y + T.y) / 2;
    let nx = T.x - C.x, ny = T.y - C.y;
    const l = Math.hypot(nx, ny);
    if (l < 1e-4) return null;
    nx /= l; ny /= l;
    return { mx, my, nx, ny };
  },
};

class Sheet {
  constructor() {
    const W = SHEET_W, H = SHEET_H;
    this.layers = [{ pts: [{ x: 0, y: 0, u: 0, v: 0 }, { x: W, y: 0, u: W, v: 0 }, { x: W, y: H, u: W, v: H }, { x: 0, y: H, u: 0, v: H }], back: false }];
    this.creases = [];
  }
  clone() { const s = new Sheet(); s.layers = JSON.parse(JSON.stringify(this.layers)); s.creases = this.creases.slice(); return s; }
  verts() {
    const out = [];
    for (const L of this.layers) for (const p of L.pts) if (!out.some((q) => Math.abs(q.x - p.x) < 1e-3 && Math.abs(q.y - p.y) < 1e-3)) out.push({ x: p.x, y: p.y });
    return out;
  }
  // the outermost vertex near an expected position (copes with imperfect earlier folds)
  nearest(x, y) {
    let best = null, bd = 1e9;
    for (const p of this.verts()) { const d = Math.hypot(p.x - x, p.y - y); if (d < bd) { bd = d; best = p; } }
    return best;
  }
  split(C, T) {
    const cr = Geo.crease(C, T);
    if (!cr) return null;
    const keep = [], flap = [];
    for (const L of this.layers) {
      const [a, b] = Geo.split(L.pts, cr.mx, cr.my, cr.nx, cr.ny);
      if (a) keep.push({ pts: a, back: L.back });
      if (b) flap.push({ pts: b, back: L.back });
    }
    return { cr, keep, flap };
  }
  fold(C, T) {
    const s = this.split(C, T);
    if (!s || !s.flap.length) return false;
    const { cr } = s;
    const refl = (p) => { const w = (p.x - cr.mx) * cr.nx + (p.y - cr.my) * cr.ny; return { x: p.x - 2 * w * cr.nx, y: p.y - 2 * w * cr.ny, u: p.u, v: p.v }; };
    this.layers = s.keep.concat(s.flap.reverse().map((L) => ({ pts: L.pts.map(refl).reverse(), back: !L.back })));
    this.creases.push(cr);
    return true;
  }
  bounds() {
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (const L of this.layers) for (const p of L.pts) { x0 = Math.min(x0, p.x); y0 = Math.min(y0, p.y); x1 = Math.max(x1, p.x); y1 = Math.max(y1, p.y); }
    return { x0, y0, x1, y1 };
  }
}

// ------------------------------------------------ paper textures
const TEX_W = 320, TEX_H = 452;
const PaperTex = {
  cache: {},
  get(id) {
    if (this.cache[id]) return this.cache[id];
    const P = PAPER[id] || PAPER.white;
    const c = document.createElement('canvas');
    c.width = TEX_W; c.height = TEX_H;
    const g = c.getContext('2d');
    this.paint(g, P);
    this.grain(g, 0.06);
    this.cache[id] = c;
    return c;
  },
  back() {
    if (this.cache.__back) return this.cache.__back;
    const c = document.createElement('canvas');
    c.width = TEX_W; c.height = TEX_H;
    const g = c.getContext('2d');
    g.fillStyle = '#f7f4ec'; g.fillRect(0, 0, TEX_W, TEX_H);
    this.grain(g, 0.07);
    this.cache.__back = c;
    return c;
  },
  grain(g, a) {
    const r = new RNG(77);
    g.save();
    for (let i = 0; i < 2600; i++) {
      g.globalAlpha = a * r.range(0.3, 1);
      g.fillStyle = r.chance(0.5) ? '#000' : '#fff';
      g.fillRect(r.range(0, TEX_W), r.range(0, TEX_H), r.range(0.6, 2.2), r.range(0.6, 1.4));
    }
    g.globalAlpha = a * 0.6;
    g.strokeStyle = '#8a7f6a';
    g.lineWidth = 0.6;
    for (let i = 0; i < 40; i++) { const x = r.range(0, TEX_W), y = r.range(0, TEX_H); g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + r.range(-8, 8), y + r.range(-8, 8), x + r.range(-14, 14), y + r.range(-14, 14)); g.stroke(); }
    g.restore();
  },
  paint(g, P) {
    const W = TEX_W, H = TEX_H, c = P.c;
    const r = new RNG(hashStr(P.id));
    g.fillStyle = c[0]; g.fillRect(0, 0, W, H);
    switch (P.kind) {
      case 'plain': break;
      case 'lined':
        g.strokeStyle = c[1]; g.lineWidth = 1.4;
        for (let y = 46; y < H; y += 17) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
        g.strokeStyle = c[2]; g.lineWidth = 1.6; g.beginPath(); g.moveTo(44, 0); g.lineTo(44, H); g.stroke();
        break;
      case 'grid':
        g.strokeStyle = c[1]; g.lineWidth = 0.8;
        for (let x = 0; x < W; x += 13) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); }
        for (let y = 0; y < H; y += 13) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
        g.lineWidth = 1.5;
        for (let x = 0; x < W; x += 65) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); }
        for (let y = 0; y < H; y += 65) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
        break;
      case 'news': {
        g.fillStyle = c[1];
        g.font = '900 34px Georgia, serif'; g.textAlign = 'center';
        g.fillText('THE DAILY FOLD', W / 2, 42);
        g.fillRect(14, 52, W - 28, 3);
        for (let col = 0; col < 3; col++) {
          const x0 = 14 + col * ((W - 28) / 3), cw = (W - 28) / 3 - 10;
          let y = 72;
          if (col === 1) { g.globalAlpha = 0.35; g.fillRect(x0, y, cw, 70); g.globalAlpha = 1; y += 80; }
          while (y < H - 12) { g.globalAlpha = r.range(0.45, 0.8); g.fillRect(x0, y, cw * r.range(0.6, 1), 3); y += 8; if (r.chance(0.08)) y += 10; }
          g.globalAlpha = 1;
        }
        break;
      }
      case 'sakura':
        for (let i = 0; i < 46; i++) {
          const x = r.range(0, W), y = r.range(0, H), s = r.range(7, 15), a0 = r.range(0, TAU);

          for (let k = 0; k < 5; k++) { const a = a0 + (k * TAU) / 5; g.beginPath(); g.ellipse(x + Math.cos(a) * s * 0.6, y + Math.sin(a) * s * 0.6, s * 0.55, s * 0.36, a, 0, TAU); g.fill(); }
          g.fillStyle = '#ffe27a'; g.beginPath(); g.arc(x, y, s * 0.2, 0, TAU); g.fill();
        }

      }
      case 'stars':
        for (let i = 0; i < 160; i++) { g.fillStyle = r.chance(0.2) ? c[2] : '#ffffff'; g.globalAlpha = r.range(0.3, 1); g.beginPath(); g.arc(r.range(0, W), r.range(0, H), r.range(0.5, 1.8), 0, TAU); g.fill(); }
        g.globalAlpha = 1;

        g.strokeStyle = c[1]; g.lineWidth = 2; g.beginPath(); g.arc(64, 70, 26, 0, TAU); g.stroke();
