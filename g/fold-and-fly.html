    }).join('');
    const box = this.modal('<div class="mt">Workshop</div><div class="sub">★ ' + fmtNum(S.stars) + ' to spend</div><div class="ulist">' + rows + '</div><div class="mrow"><button class="btn ghost" id="mX">Done</button></div>', 'paper');
    box.querySelectorAll('[data-up]').forEach((b) => (b.onclick = () => { Game.buyUpgrade(b.dataset.up); this.showWorkshop(); }));
    box.querySelector('#mX').onclick = () => { this.close(); this.showHangar(); };
  },
  planeThumb(design, paper, size) {
    const c = document.createElement('canvas');
    const d = Math.min(window.devicePixelRatio || 1, 2);
    c.width = size * d; c.height = size * 0.62 * d;
    const g = c.getContext('2d');
    g.scale(d, d);
    Plane3D.draw(g, design, paper, size / 2, size * 0.31, size * 0.16, 0.1, -0.2, 0.75, 0.55, 1);
    c.style.width = size + 'px';
    return c;
  },
  showPlanes() {
    const S = Save.data;
    const box = this.modal('<div class="mt">Plane designs</div><div class="sub">★ ' + fmtNum(S.stars) + '</div><div class="plist"></div><div class="mrow"><button class="btn ghost" id="mX">Done</button></div>', 'paper');
    const list = box.querySelector('.plist');
    for (const P of PLANES) {
      const own = !!S.planes[P.id], sel = S.sel.plane === P.id;
      const row = el('div', 'prow' + (sel ? ' sel' : ''));
      row.appendChild(this.planeThumb(P, S.sel.paper, 110));
      const info = el('div', 'pi', '<b>' + P.name + '</b><span>' + P.desc + '</span><em>' + P.steps.length + ' folds' + (S.folds[P.id] !== undefined ? ' · folded ' + Math.round(S.folds[P.id] * 100) + '%' : '') + '</em>');
      row.appendChild(info);
      const btn = el('button', 'btn small ' + (own ? (sel ? 'ghost' : 'go') : 'buy'), own ? (sel ? 'Selected' : 'Select') : P.cost + '★');
      if (sel || (!own && S.stars < P.cost)) btn.disabled = true;
      btn.onclick = () => { Game.planeButton(P.id); };
      row.appendChild(btn);
      list.appendChild(row);
    }
    box.querySelector('#mX').onclick = () => { this.close(); this.showHangar(); };
  },
  showPapers() {
    const S = Save.data;
    const owned = PAPERS.filter((p) => S.papers[p.id]).length;
    const box = this.modal('<div class="mt">Paper collection</div><div class="sub">' + owned + ' / ' + PAPERS.length + ' collected</div><div class="glist"></div>' +
      (owned < PAPERS.length ? '<button class="btn buy" id="mPack"' + (S.stars < Game.packCost() ? ' disabled' : '') + '>Paper Pack · ' + Game.packCost() + '★</button>' : '') +
      '<div class="mrow"><button class="btn ghost" id="mX">Done</button></div>', 'paper');
    const list = box.querySelector('.glist');
    for (const P of PAPERS) {
      const own = !!S.papers[P.id];
      const it = el('button', 'sw' + (S.sel.paper === P.id ? ' sel' : '') + (own ? '' : ' locked'));
      if (own) {
        const tex = PaperTex.get(P.id);
        const c = document.createElement('canvas'); c.width = 80; c.height = 80;
        c.getContext('2d').drawImage(tex, 40, 60, 160, 160, 0, 0, 80, 80);
        it.appendChild(c);
      } else it.appendChild(el('div', 'q', '?'));
      it.appendChild(el('span', '', own ? P.name : '???'));
      it.onclick = () => { if (own) { Game.selectPaper(P.id); this.showPapers(); } else Sfx.deny(); };
      list.appendChild(it);
    }
    const pk = box.querySelector('#mPack');
    if (pk) pk.onclick = () => Game.buyPack();
    box.querySelector('#mX').onclick = () => { this.close(); this.showHangar(); };
  },
  packReveal(id) {
    const P = PAPER[id];
    const box = this.modal('<div class="mt">New paper!</div><div class="reveal"></div><div class="big small">' + P.name + '</div>' + (P.rare ? '<div class="sub">A rare one!</div>' : '') +
      '<div class="mrow"><button class="btn ghost" id="mOk">Nice</button><button class="btn go" id="mUse">Use it</button></div>', 'paper');
    const tex = PaperTex.get(id);
    const c = document.createElement('canvas'); c.width = 160; c.height = 226;
    c.getContext('2d').drawImage(tex, 0, 0, 160, 226);
    box.querySelector('.reveal').appendChild(c);
    FX.confetti(window.innerWidth / 2, window.innerHeight * 0.35, 50);
    box.querySelector('#mOk').onclick = () => this.showPapers();
    box.querySelector('#mUse').onclick = () => { Game.selectPaper(id); this.close(); this.showHangar(); };
  },
  showSettings() {
    const S = Save.data.settings;
    const row = (k, label) => '<div class="trow"><span>' + label + '</span><button data-k="' + k + '" class="tog' + (S[k] ? ' on' : '') + '">' + (S[k] ? 'On' : 'Off') + '</button></div>';
    const box = this.modal('<div class="mt">Settings</div>' + row('sound', 'Sound') + row('music', 'Music') + row('haptics', 'Vibration') +
      '<p class="note">Fold the corner onto the target, then pull back to launch. Hold to climb, let go to glide, and tap the cloud for a gust.</p><div class="mrow"><button class="btn ghost" id="mX">Done</button></div>', 'paper');
    box.querySelectorAll('[data-k]').forEach((b) => (b.onclick = () => { S[b.dataset.k] = !S[b.dataset.k]; Save.persist(); Sound.applySettings(); this.showSettings(); }));
    box.querySelector('#mX').onclick = () => this.close();
  },
  pauseMenu() {
    const box = this.modal('<div class="mt">Paused</div><div class="mrow col"><button class="btn go" id="mR">Resume</button><button class="btn ghost" id="mQ">End flight</button></div>', 'paper');
    box.querySelector('#mR').onclick = () => { this.close(); Game.paused = false; };
    box.querySelector('#mQ').onclick = () => { this.close(); Game.paused = false; Flight.state === 'aim' ? Game.toHangar() : Flight.finish(); };
  },

  modal(html, cls) {
    const M = this.E.modal;
    M.className = '';
    M.innerHTML = '<div class="box ' + (cls || '') + '">' + html + '</div>';
    return M.firstChild;
  },
  close() { this.E.modal.className = 'hidden'; this.E.modal.innerHTML = ''; },
  isOpen() { return !this.E.modal.classList.contains('hidden'); },
  toast(text) {
    const T = this.E.toast;
    T.textContent = text;
    T.classList.remove('on'); void T.offsetWidth; T.classList.add('on');
  },
};

// ---------------------------------------------------------------- game.js (flow, economy, missions)
const Game = {
  scene: 'hangar', paused: false, ht: 0, spin: 0,

  toHangar() {
    this.scene = 'hangar';
    Music.setMode('calm');
    Wind.set(0, false);
    this.ensureMissions();
    UI.showHangar();
  },
  flyButton() {
    Sfx.button();
    const S = Save.data;
    if (S.folds[S.sel.plane] === undefined) this.startFold(S.sel.plane);
    else this.fly();
  },
  startFold(id) {
    if (!Save.data.planes[id]) return;
    this.scene = 'fold';
    UI.close();
    UI.showFold();
    Music.setMode('calm');
    Fold.layout(App.W, App.H);
    Fold.deskC = null;
    Fold.start(id, Save.data.sel.paper, (acc) => this.foldDone(id, acc));
  },
  foldDone(id, acc) {
    const S = Save.data;
    S.folds[id] = acc;
    S.stats.bestFold = Math.max(S.stats.bestFold, acc);
    if (acc >= 0.995) S.stats.perfect++;
    // fold missions complete on the spot
    for (const m of S.missions) {
      if (m.done || m.type !== 'fold') continue;
      const T = MT.fold, goal = T.goals[Math.min(m.tier, T.goals.length - 1)];
      if (acc * 100 >= goal) { m.done = true; S.stars += T.reward(goal); S.mtiers.fold = (S.mtiers.fold || 0) + 1; UI.toast('Mission complete! +' + T.reward(goal) + '★'); Sfx.mission(); }
    }
    Save.persist();
    UI.foldResult(acc, PLANE[id]);
  },
  fly() {
    const S = Save.data;
    const id = S.sel.plane;
    if (S.folds[id] === undefined) return this.startFold(id);
    this.scene = 'flight';
    UI.close();
    UI.showHud();
    Flight.layout(App.W, App.H);
    Flight.start(id, S.sel.paper, S.folds[id], S.up, (Math.random() * 1e9) | 0, S.best);
    Music.setMode('garden');
    Wind.start();
    this.paused = false;
  },
  pause() {
    if (this.scene !== 'flight') return;
    this.paused = true;
    Flight.input = false;
    UI.pauseMenu();
  },

  flightOver() {
    if (this.scene !== 'flight') return;
    const S = Save.data, R = Flight.run;
    const dist = R.dist;
    const prevBest = S.best;
    const newBest = dist > S.best + 0.5;
    if (newBest) S.best = dist;
    const distStars = Math.floor(dist / 8);
    const caught = R.stars;
    let total = distStars + caught + R.bonus;
    // missions
    const done = [];
    for (const m of S.missions) {
      if (m.done) continue;
      const T = MT[m.type], goal = T.goals[Math.min(m.tier, T.goals.length - 1)];
      const v = { dist: dist, stars: caught, loops: R.loops, drafts: R.drafts, bounces: R.bounces, near: R.near, nogust: R.gustUsed === 0 ? dist : 0, zone: R.zone, fold: -1 }[m.type];
      if (v >= goal) { m.done = true; S.mtiers[m.type] = (S.mtiers[m.type] || 0) + 1; total += T.reward(goal); done.push({ text: T.text(goal), reward: T.reward(goal) }); }
    }
    S.stars += total;
    const st = S.stats;
    st.flights++; st.dist += Math.round(dist); st.stars += total; st.loops += R.loops; st.drafts += R.drafts; st.bounces += R.bounces; if (R.crashed) st.crashes++;
    // xp + levels
    S.xp += Math.round(dist) + done.length * 40;
    let levelUp = 0;
    while (S.xp >= LEVEL_XP(S.level)) { S.xp -= LEVEL_XP(S.level); S.level++; levelUp += 40 + S.level * 20; }
    if (levelUp) { S.stars += levelUp; setTimeout(() => Sfx.level(), 500); }
    this.ensureMissions();
    Save.persist();
    Wind.set(0, false);
    if (done.length) setTimeout(() => Sfx.mission(), 250);
    UI.showResults({ dist, prevBest, newBest, distStars, caught, bonus: R.bonus, bonusList: R.bonusList, missions: done, total, crashed: R.crashed, landed: R.landed, levelUp });
    UI.renderTop();
  },

  ensureMissions() {
    const S = Save.data;
    S.missions = S.missions.filter((m) => !m.done && MT[m.type]);
    const active = new Set(S.missions.map((m) => m.type));
    const pool = MISSION_TYPES.map((t) => t.id).filter((id) => !active.has(id) && (id !== 'zone' || (S.mtiers.zone || 0) < 4) && (id !== 'fold' || (S.mtiers.fold || 0) < 4));
    const r = new RNG(hashStr(todayKey() + ':' + S.stats.flights + ':' + S.missions.length));
    while (S.missions.length < 3 && pool.length) {
      const k = r.int(0, pool.length - 1);
      const id = pool.splice(k, 1)[0];
      S.missions.push({ type: id, tier: Math.min(S.mtiers[id] || 0, MT[id].goals.length - 1), done: false });
    }
  },

  // ------------------------------------------------ economy
  buyUpgrade(id) {
    const S = Save.data, U = UPG[id], lv = S.up[id];
    if (lv >= U.max || S.stars < U.costs[lv]) { Sfx.deny(); return; }
    S.stars -= U.costs[lv];
    S.up[id]++;
    Sfx.buy();
    Save.persist();
    UI.renderTop();
  },
  planeButton(id) {
    const S = Save.data, P = PLANE[id];
    if (!S.planes[id]) {
      if (S.stars < P.cost) { Sfx.deny(); return; }
      S.stars -= P.cost;
      S.planes[id] = true;
      Sfx.buy();
      FX.confetti(window.innerWidth / 2, window.innerHeight * 0.4, 40);
    }
    S.sel.plane = id;
    Save.persist();
    UI.renderTop();
    if (S.folds[id] === undefined) { UI.close(); this.startFold(id); }
    else UI.showPlanes();
  },
  selectPaper(id) { Save.data.sel.paper = id; Save.persist(); Sfx.tick(); },
  packCost() { const n = Object.keys(Save.data.papers).length; return 80 + (n - 1) * 30; },
  buyPack() {
    const S = Save.data, cost = this.packCost();
    const left = PAPERS.filter((p) => !S.papers[p.id]);
    if (!left.length || S.stars < cost) { Sfx.deny(); return; }
    S.stars -= cost;
    const r = new RNG(Date.now() & 0xffffffff);
    const pick = r.weighted(left, (p) => (p.rare ? 0.25 : 1));
    S.papers[pick.id] = true;
    Save.persist();
    Sfx.ta();
    UI.renderTop();
    UI.packReveal(pick.id);
  },
  claimGift() {
    const S = Save.data;
    if (S.gift === todayKey()) return;
    S.gift = todayKey();
    const amt = 60 + S.level * 10;
    S.stars += amt;
    Save.persist();
    Sfx.mission();
    FX.confetti(window.innerWidth / 2, window.innerHeight * 0.8, 40);
    UI.toast('Daily gift: +' + amt + '★');
    UI.showHangar();
  },

  // ------------------------------------------------ hangar scene drawing
  drawHangar(g, W, H, dt) {
    this.ht += dt;
    const sk = g.createLinearGradient(0, 0, 0, H);
    sk.addColorStop(0, '#86cdf9'); sk.addColorStop(1, '#e6f6ff');
    g.fillStyle = sk; g.fillRect(0, 0, W, H);
    g.fillStyle = '#fff1a8'; g.beginPath(); g.arc(W * 0.82, H * 0.14, 36, 0, TAU); g.fill();
    for (let k = 0; k < 6; k++) {
      const r = new RNG(900 + k);
      const x = ((r.range(0, W + 300) + this.ht * (8 + k * 3)) % (W + 300)) - 150, y = r.range(H * 0.08, H * 0.6);
      World.cloud(g, x, y, r.range(18, 34), 0.9, r);
    }
    // rolling paper hills
    g.fillStyle = 'rgba(0,0,0,0.08)';
    for (const [col, h, ph] of [['#a9d9a0', 0.8, 0.3], ['#79c27a', 0.88, 1.7]]) {
      g.fillStyle = col;
      g.beginPath(); g.moveTo(0, H);
      for (let x = 0; x <= W + 20; x += 20) g.lineTo(x, H * h + Math.sin(x * 0.01 + ph) * 18);
      g.lineTo(W, H); g.closePath(); g.fill();
    }
    const S = Save.data, P = PLANE[S.sel.plane];
    const cx = W / 2, cy = H * 0.4 + Math.sin(this.ht * 1.4) * 8;
    this.spin *= 1 - Math.min(1, dt * 1.5);
    const sc = Math.min(W, H) * 0.075;
    g.fillStyle = 'rgba(0,0,0,0.1)';
    g.beginPath(); g.ellipse(cx, H * 0.4 + sc * 3.2, sc * 2.4, sc * 0.35, 0, 0, TAU); g.fill();
    Plane3D.draw(g, P, S.sel.paper, cx, cy, sc, 0.1 + Math.sin(this.ht * 0.9) * 0.08, Math.sin(this.ht * 0.7) * 0.2, 0.7 + Math.sin(this.ht * 0.35) * 0.35 + this.spin, 0.45, 1);
  },
};

// ---------------------------------------------------------------- main.js (boot, loop, input)
const App = {
  c: null, g: null, W: 1, H: 1, dpr: 1, last: 0, fxc: null, fxg: null,
  layout() {
    const W = window.innerWidth, H = window.innerHeight, dpr = Math.min(window.devicePixelRatio || 1, 2);
    this.W = W; this.H = H; this.dpr = dpr;
    this.c.width = Math.round(W * dpr); this.c.height = Math.round(H * dpr);
    this.fxc.width = Math.round(W * dpr); this.fxc.height = Math.round(H * dpr);
    Fold.layout(W, H); Fold.deskC = null;
    Flight.layout(W, H);
  },
  frame(now) {
    const dt = Math.min(0.05, (now - (this.last || now)) / 1000);
    this.last = now;
    const g = this.g, W = this.W, H = this.H;
    g.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    if (Game.scene === 'fold') { Fold.update(dt); Fold.render(g, W, H); }
    else if (Game.scene === 'flight') {
      if (!Game.paused) Flight.update(dt);
      Flight.render(g, W, H);
      UI.hudTick();
      const p = Flight.p;
      if (p) {
        Wind.set(Math.hypot(p.vx, p.vy), Flight.state === 'fly');
        if (Flight.state === 'fly') { Music.setMode(ZONES[zoneIndex(p.x)].id); Music.energy = clamp(Math.hypot(p.vx, p.vy) / 30, 0.2, 1); }
      }
    } else Game.drawHangar(g, W, H, dt);
    const f = this.fxg;
    f.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    f.clearRect(0, 0, W, H);
    FX.update(dt);
    FX.render(f);
  },
  loop() { const step = (t) => { this.frame(t); requestAnimationFrame(step); }; requestAnimationFrame(step); },
};

function bootInput() {
  const c = App.c;
  const pos = (e) => ({ x: e.clientX, y: e.clientY });
  let down = false;
  c.addEventListener('pointerdown', (e) => {
    Sound.ensure();
    if (Sound.ok && Save.data.settings.music && !Music.on) Music.start();
    down = true;
    try { c.setPointerCapture(e.pointerId); } catch (er) { /* ignore */ }
    const p = pos(e);
    if (Game.scene === 'fold') Fold.down(p.x, p.y);
    else if (Game.scene === 'flight' && !Game.paused) Flight.down(p.x, p.y);
    else if (Game.scene === 'hangar') { Game.spin += 2.5; Sfx.whoosh(0.4); }
  });
  c.addEventListener('pointermove', (e) => {
    if (!down) return;
    const p = pos(e);
    if (Game.scene === 'fold') Fold.move(p.x, p.y);
    else if (Game.scene === 'flight') Flight.move(p.x, p.y);
  });
  const up = () => { if (!down) return; down = false; if (Game.scene === 'fold') Fold.up(); else if (Game.scene === 'flight') Flight.up(); };
  c.addEventListener('pointerup', up);
  c.addEventListener('pointercancel', up);
  document.addEventListener('keydown', (e) => {
    if (e.repeat) return;
    Sound.ensure();
    if (Game.scene !== 'flight' || Game.paused) return;
    if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
      e.preventDefault();
      if (Flight.state === 'aim') Flight.launch(0.5, 0.9);
      else Flight.input = true;
    } else if (e.key === 'g' || e.key === 'G' || e.key === 'Shift') { if (Flight.gust()) UI.hudGust(); }
    else if (e.key === 'Escape') Game.pause();
  });
  document.addEventListener('keyup', (e) => { if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') Flight.input = false; });
  window.addEventListener('resize', () => App.layout());
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { if (Game.scene === 'flight' && Flight.state === 'fly') Game.pause(); if (Sound.ac) Sound.ac.suspend().catch(() => {}); }
    else if (Sound.ac) Sound.ac.resume().catch(() => {});
  });
}

function boot() {
  Save.load();
  App.c = document.getElementById('c');
  App.g = App.c.getContext('2d');
  App.fxc = document.getElementById('fx');
  App.fxg = App.fxc.getContext('2d');
  UI.init();
  App.layout();
  Sound.applySettings();
  bootInput();
  Save.onRemote = () => { if (Game.scene === 'hangar' && !UI.isOpen()) UI.showHangar(); };
  Game.toHangar();
  App.loop();
  Save.cloudInit();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

})();</script>
