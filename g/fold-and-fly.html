        g.fillStyle = gr; g.fillRect(0, 0, W, H);
        for (let i = 0; i < 70; i++) { g.fillStyle = 'rgba(255,255,240,' + r.range(0.2, 0.7) + ')'; star5(g, r.range(0, W), r.range(0, H), r.range(1.5, 4), 0.4); }
        break;
      }
    }
  },
};

function star5(g, x, y, R, k) {
  g.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + (i * Math.PI) / 5, rr = i % 2 ? R * k : R; const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr; if (i) g.lineTo(px, py); else g.moveTo(px, py); }
  g.closePath();
  g.fill();
}

// draw polygon `scr` (screen pts) textured with `tex` using its sheet uv coords (affine per polygon)
function texPoly(g, scr, uv, tex, shade) {
  const n = scr.length;
  if (n < 3) return;
  // choose the best-conditioned triangle
  let bi = [0, 1, 2], ba = 0;
  for (let i = 1; i < n - 1; i++) {
    const a = Math.abs((uv[i].u - uv[0].u) * (uv[i + 1].v - uv[0].v) - (uv[i + 1].u - uv[0].u) * (uv[i].v - uv[0].v));
    if (a > ba) { ba = a; bi = [0, i, i + 1]; }
  }
  g.save();
  g.beginPath();
  g.moveTo(scr[0].x, scr[0].y);
  for (let i = 1; i < n; i++) g.lineTo(scr[i].x, scr[i].y);
  g.closePath();
  if (ba > 1e-7) {
    const [i0, i1, i2] = bi;
    const u0 = uv[i0].u, v0 = uv[i0].v, u1 = uv[i1].u, v1 = uv[i1].v, u2 = uv[i2].u, v2 = uv[i2].v;
    const x0 = scr[i0].x, y0 = scr[i0].y, x1 = scr[i1].x, y1 = scr[i1].y, x2 = scr[i2].x, y2 = scr[i2].y;
    const den = (u0 - u2) * (v1 - v2) - (u1 - u2) * (v0 - v2);
    const a = ((x0 - x2) * (v1 - v2) - (x1 - x2) * (v0 - v2)) / den;
    const c = ((x1 - x2) * (u0 - u2) - (x0 - x2) * (u1 - u2)) / den;
    const e = x2 - a * u2 - c * v2;
    const b = ((y0 - y2) * (v1 - v2) - (y1 - y2) * (v0 - v2)) / den;
    const d = ((y1 - y2) * (u0 - u2) - (y0 - y2) * (u1 - u2)) / den;
    const f = y2 - b * u2 - d * v2;
    g.save();
    g.clip();
    g.transform(a, b, c, d, e, f);
    g.scale(SHEET_W / TEX_W, SHEET_H / TEX_H);
    g.drawImage(tex, 0, 0);
    g.restore();
  }
  if (shade) { g.fillStyle = shade; g.fill(); }
  g.restore();
}

// ---------------------------------------------------------------- plane3d.js (parametric paper plane mesh, projected in Canvas2D)
const Plane3D = {
  cache: {},
  mesh(design) {
    if (this.cache[design.id]) return this.cache[design.id];
    const s = design.shape, L = s.len, S = s.span, K = s.keel;
    const half = S / 2, nose = s.nose * 0.5, dih = s.dihedral;
    const wing = (sg) => {
      const pts = [
        [L / 2, 0, sg * nose * 0.35],
        [L / 2 - L * 0.52 * s.sweep, 0, sg * half],
        [-L / 2, 0, sg * half * 0.82],
      ];
      if (s.notch > 0) pts.push([-L / 2 + L * 0.22 * s.notch, 0, sg * half * 0.42]);
      pts.push([-L / 2, 0, sg * 0.04]);
      if (nose > 0.01) pts.unshift([L / 2, 0, sg * 0.02]);
      return pts.map((p) => [p[0], p[1] + Math.abs(p[2]) * dih, p[2]]);
    };
    const keel = (sg) => [[L / 2, 0, sg * 0.01], [-L / 2, 0, sg * 0.03], [-L / 2 + L * 0.16, -K, sg * 0.05], [L / 2 - L * 0.42, -K * 0.62, sg * 0.03]];
    const m = { faces: [{ pts: keel(-1), side: 'keel' }, { pts: keel(1), side: 'keel' }, { pts: wing(-1), side: 'top' }, { pts: wing(1), side: 'top' }], L, S };
    this.cache[design.id] = m;
    return m;
  },
  // draw centred at (cx,cy). pitch: nose up positive. bank/yaw add life. view: elevation of the camera
  draw(g, design, paperId, cx, cy, scale, pitch, bank, yaw, view, alpha) {
    const m = this.mesh(design);
    const cp = Math.cos(pitch), sp = Math.sin(pitch), cb = Math.cos(bank), sb = Math.sin(bank), cyw = Math.cos(yaw), syw = Math.sin(yaw);
    const ce = Math.cos(view), se = Math.sin(view);
    const tf = (p) => {
      let [x, y, z] = p;
      // bank (roll about x)
      let y1 = y * cb - z * sb, z1 = y * sb + z * cb;
      // pitch (about z)
      let x2 = x * cp - y1 * sp, y2 = x * sp + y1 * cp;
      // yaw (about y) for a 3/4 view
      let x3 = x2 * cyw + z1 * syw, z3 = -x2 * syw + z1 * cyw;
      // camera elevation (tilt about x)
      let y4 = y2 * ce - z3 * se, z4 = y2 * se + z3 * ce;
      return [x3, y4, z4];
    };
    const faces = m.faces.map((f) => {
      const P = f.pts.map(tf);
      let zs = 0;
      for (const p of P) zs += p[2];
      // normal for shading
      const a = P[0], b = P[1], c = P[2];
      const ux = b[0] - a[0], uy = b[1] - a[1], uz = b[2] - a[2], vx = c[0] - a[0], vy = c[1] - a[1], vz = c[2] - a[2];
      let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
      const nl = Math.hypot(nx, ny, nz) || 1;
      nx /= nl; ny /= nl; nz /= nl;
      return { P, z: zs / P.length, side: f.side, light: Math.abs(nx * -0.35 + ny * 0.75 + nz * 0.55) };
    });
    faces.sort((a, b) => a.z - b.z);
    const tex = PaperTex.get(paperId);
    if (!this.pat || this.patId !== paperId) { this.pat = g.createPattern(tex, 'repeat'); this.patId = paperId; this.patCtx = g; }
    g.save();
    g.globalAlpha = alpha === undefined ? 1 : alpha;
    g.lineJoin = 'round';
    for (const f of faces) {
      g.beginPath();
      f.P.forEach((p, i) => { const X = cx + p[0] * scale, Y = cy - p[1] * scale; if (i) g.lineTo(X, Y); else g.moveTo(X, Y); });
      g.closePath();
      if (f.side === 'top' && this.pat) {
        try { this.pat.setTransform(new DOMMatrix([scale * 0.012, 0, 0, scale * 0.012, cx, cy]).rotate(-pitch * 57.3)); } catch (e) { /* old browsers */ }
        g.fillStyle = this.pat;
      } else g.fillStyle = '#f4f1e8';
      g.fill();
      g.fillStyle = 'rgba(30,25,20,' + (0.32 - f.light * 0.3).toFixed(3) + ')';
      g.fill();
      g.strokeStyle = 'rgba(60,50,40,0.35)';
      g.lineWidth = Math.max(1, scale * 0.025);
      g.stroke();
    }
    g.restore();
  },
};

// ---------------------------------------------------------------- fold.js (the folding mini-game)
const COS_T = 0.9, SIN_T = 0.44;

const Fold = {
  sheet: null, design: null, paper: 'white', step: 0, accs: [], undo: [], state: 'idle',
  drag: null, anim: null, t: 0, idleT: 0, s: 200, ox: 0, oy: 0, W: 1, H: 1, msg: null, onDone: null,

  start(designId, paperId, onDone) {
    this.design = PLANE[designId];
    this.paper = paperId;
    this.sheet = new Sheet();
    this.step = 0;
    this.accs = [];
    this.undo = [];
    this.state = 'idle';
    this.drag = null;
    this.anim = null;
    this.idleT = 0;
    this.msg = null;
    this.reveal = 0;
    this.onDone = onDone;
    UI.foldStep();
  },

  layout(W, H) {
    this.W = W; this.H = H;
    const top = 120, bottom = 150;
    const s = Math.min(W * 0.72, (H - top - bottom) / (SHEET_H * COS_T));
    this.s = s;
    this.ox = W / 2 - s * 0.5;
    this.oy = top + (H - top - bottom - SHEET_H * COS_T * s) / 2;
  },
  P(x, y, z) { return { x: this.ox + x * this.s, y: this.oy + (y * COS_T - (z || 0) * SIN_T) * this.s }; },
  inv(X, Y) { return { x: (X - this.ox) / this.s, y: (Y - this.oy) / (this.s * COS_T) }; },

  cur() { return this.design.steps[this.step]; },
  corner() { const st = this.cur(); return st ? this.sheet.nearest(st.from[0], st.from[1]) : null; },

  // ------------------------------------------------ input
  down(X, Y) {
    if (this.state !== 'idle') return;
    const C = this.corner();
    if (!C) return;
    const c = this.P(C.x, C.y);
    if (Math.hypot(X - c.x, Y - c.y) > Math.max(46, this.s * 0.2)) { this.idleT = 3; Sfx.tick(); return; }
    this.state = 'drag';
    this.drag = { C, T: { x: C.x, y: C.y } };
    Sfx.pick();
  },
  move(X, Y) {
    if (this.state !== 'drag') return;
    const p = this.inv(X, Y);
    const st = this.cur();
    const d = Math.hypot(p.x - st.to[0], p.y - st.to[1]);
    const snap = d < 0.022;
    const T = snap ? { x: st.to[0], y: st.to[1] } : p;
    if (snap && !this.drag.snap) { Sfx.snap(); vibrate(6); }
    this.drag.snap = snap;
    this.drag.T = T;
    if (Sound.rate('slide', 0.09)) Sfx.slide();
  },
  up() {
    if (this.state !== 'drag') return;
    const { C, T } = this.drag;
    if (Math.hypot(T.x - C.x, T.y - C.y) < 0.05) { this.state = 'idle'; this.drag = null; return; }
    const st = this.cur();
    const d = Math.hypot(T.x - st.to[0], T.y - st.to[1]);
    const acc = d < 0.022 ? 1 : clamp(1 - (d - 0.022) / 0.13, 0, 1);
    this.state = 'settle';
    this.anim = { t: 0, dur: 0.16, C, T, acc };
  },

  autoFold() {
    if (this.state !== 'idle') return;
    const st = this.cur();
    const C = this.corner();
    this.state = 'settle';
    this.anim = { t: 0, dur: 0.3, C, T: { x: st.to[0], y: st.to[1] }, acc: 0.85, auto: true, from: 0.2 };
  },

  undoStep() {
    if (this.state !== 'idle' || !this.undo.length) return;
    this.sheet = this.undo.pop();
    this.accs.pop();
    this.step--;
    Sfx.unfold();
    UI.foldStep();
  },

  commit() {
    const a = this.anim;
    this.undo.push(this.sheet.clone());
    this.sheet.fold(a.C, a.T);
    this.accs.push(a.acc);
    this.step++;
    Sfx.crease(a.acc);
    const rating = a.acc >= 0.97 ? 'Perfect!' : a.acc >= 0.88 ? 'Great!' : a.acc >= 0.75 ? 'Good' : a.acc >= 0.5 ? 'Okay' : 'Wobbly…';
    this.msg = { text: rating, sub: Math.round(a.acc * 100) + '%', t: 0, good: a.acc >= 0.88 };
    if (a.acc >= 0.97) { const p = this.P(a.T.x, a.T.y); FX.burst(p.x, p.y, 18, ['#ffe27a', '#ffffff', '#ff8fb1']); vibrate(12); }
    this.anim = null;
    if (this.step >= this.design.steps.length) {
      this.state = 'half';
      this.anim = { t: 0, dur: 0.95 };
      setTimeout(() => Sfx.whoosh(0.5), 120);
    } else this.state = 'idle';
    UI.foldStep();
  },

  accuracy() { if (!this.accs.length) return 0; return this.accs.reduce((a, b) => a + b, 0) / this.accs.length; },

  // ------------------------------------------------ update/render
  update(dt) {
    this.t += dt;
    if (this.msg) { this.msg.t += dt; if (this.msg.t > 1.4) this.msg = null; }
    if (this.state === 'idle') this.idleT += dt; else this.idleT = 0;
    if (this.anim) {
      this.anim.t += dt;
      if (this.state === 'settle' && this.anim.t >= this.anim.dur) this.commit();
      else if (this.state === 'half' && this.anim.t >= this.anim.dur) { this.state = 'reveal'; this.anim = { t: 0, dur: 1.1 }; Sfx.ta(); }
      else if (this.state === 'reveal' && this.anim.t >= this.anim.dur) {
        this.state = 'done';
        this.anim = null;
        if (this.onDone) this.onDone(this.accuracy());
      }
    }
  },

  render(g, W, H) {
    this.drawDesk(g, W, H);
    const st = this.state;
    let alpha = 1;
    if (st === 'reveal') alpha = 1 - easeOutCubic(Math.min(1, this.anim.t / 0.5));
    if (st !== 'done' && alpha > 0.01) {
      g.save();
      g.globalAlpha = alpha;
      if (st === 'drag') this.drawSplit(this.drag.C, this.drag.T, Math.PI, true);
      else if (st === 'settle') {
        const a = this.anim, k = easeOutCubic(Math.min(1, a.t / a.dur));
        this.drawSplit(a.C, a.T, lerp(a.from !== undefined ? a.from : Math.PI * 0.82, Math.PI, k), false);
      } else if (st === 'half' || st === 'reveal') {
        const k = st === 'half' ? easeInOutSine(Math.min(1, this.anim.t / this.anim.dur)) : 1;
        const y = SHEET_H * 0.5;
        this.drawSplit({ x: 0, y }, { x: 1, y }, k * Math.PI, false);
      } else this.drawLayers(this.sheet.layers, null);
      g.restore();
    }
    if (st === 'idle') this.drawGuide(g);
    if (st === 'drag') this.drawTarget(g, true);
    if (st === 'reveal' || st === 'done') this.drawReveal(g, W, H);
    if (this.msg) {
      const m = this.msg, a = m.t < 0.15 ? m.t / 0.15 : m.t > 1.1 ? 1 - (m.t - 1.1) / 0.3 : 1;
      g.save();
      g.globalAlpha = clamp(a, 0, 1);
      g.textAlign = 'center';
      g.font = '700 30px Fredoka, sans-serif';
      g.lineWidth = 6; g.strokeStyle = 'rgba(60,40,20,0.55)';
      const y = this.oy - 24 - m.t * 10;
      g.strokeText(m.text, W / 2, y);
      g.fillStyle = m.good ? '#ffe27a' : '#fff6e8';
      g.fillText(m.text, W / 2, y);
      g.font = '600 15px Fredoka, sans-serif';
      g.fillStyle = '#fff6e8';
      g.fillText(m.sub, W / 2, y + 20);
      g.restore();
    }
  },

  drawDesk(g, W, H) {
    if (!this.deskC || this.deskC.width !== Math.round(W) || this.deskC.height !== Math.round(H)) this.deskC = this.paintDesk(Math.round(W), Math.round(H));
    g.drawImage(this.deskC, 0, 0, W, H);
  },
  paintDesk(W, H) {
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const g = c.getContext('2d');
    const gr = g.createLinearGradient(0, 0, W, H);
    gr.addColorStop(0, '#b9875a'); gr.addColorStop(1, '#8d6340');
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
    const r = new RNG(5);
    g.globalAlpha = 0.18;
    for (let i = 0; i < 60; i++) {
      g.strokeStyle = r.chance(0.5) ? '#6b4527' : '#d4a578';
      g.lineWidth = r.range(1, 3);
      const y = r.range(0, H);
      g.beginPath(); g.moveTo(0, y);
      for (let x = 0; x <= W; x += 40) g.lineTo(x, y + Math.sin(x * 0.01 + i) * r.range(2, 9));
      g.stroke();
    }
    g.globalAlpha = 1;
    // cutting mat
    const mx = this.ox - 30, my = this.oy - 40, mw = this.s + 60, mh = SHEET_H * COS_T * this.s + 80;
    g.fillStyle = 'rgba(0,0,0,0.25)';
    roundRect(g, mx + 6, my + 8, mw, mh, 14); g.fill();
    g.fillStyle = '#2f7d5b';
    roundRect(g, mx, my, mw, mh, 14); g.fill();
    g.save();
    roundRect(g, mx, my, mw, mh, 14); g.clip();
    const step = this.s / 10;
    g.strokeStyle = 'rgba(220,255,235,0.22)'; g.lineWidth = 1;
    for (let x = this.ox - step * 3; x < mx + mw; x += step) { g.beginPath(); g.moveTo(x, my); g.lineTo(x, my + mh); g.stroke(); }
    for (let y = this.oy - step * 3; y < my + mh; y += step * COS_T) { g.beginPath(); g.moveTo(mx, y); g.lineTo(mx + mw, y); g.stroke(); }
    g.strokeStyle = 'rgba(255,240,120,0.35)'; g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(this.ox + this.s / 2, my); g.lineTo(this.ox + this.s / 2, my + mh); g.stroke();
    g.restore();
    // a pencil
    g.save();
    g.translate(mx + mw + 24, my + 60); g.rotate(0.35);
    g.fillStyle = 'rgba(0,0,0,0.2)'; g.fillRect(4, 6, 16, 160);
    g.fillStyle = '#ffcf3f'; g.fillRect(0, 0, 16, 140);
    g.fillStyle = '#f0b52c'; g.fillRect(10, 0, 6, 140);
    g.fillStyle = '#ff8fa3'; g.fillRect(0, -16, 16, 16);
    g.fillStyle = '#c9c9c9'; g.fillRect(0, -4, 16, 5);
    g.fillStyle = '#f2d2a7'; g.beginPath(); g.moveTo(0, 140); g.lineTo(16, 140); g.lineTo(8, 166); g.closePath(); g.fill();
    g.fillStyle = '#333'; g.beginPath(); g.moveTo(5, 158); g.lineTo(11, 158); g.lineTo(8, 166); g.closePath(); g.fill();
    g.restore();
    return c;
  },

  // project a layer polygon, optionally rotating flap points about crease cr by phi
  proj(pts, cr, phi, zb) {
    return pts.map((p) => {
      if (!cr) return this.P(p.x, p.y, zb);
      const w = (p.x - cr.mx) * cr.nx + (p.y - cr.my) * cr.ny;
      const k = Math.cos(phi) - 1;
      return this.P(p.x + w * k * cr.nx, p.y + w * k * cr.ny, -w * Math.sin(phi) + zb);
    });
  },
  drawLayers(layers, cr, phi, isFlap) {
    const g = App.g;
    const tex = PaperTex.get(this.paper), back = PaperTex.back();
    layers.forEach((L, i) => {
      const zb = i * 0.0025;
      const scr = this.proj(L.pts, cr, phi || 0, zb);
      let showBack = L.back;
      if (isFlap && Math.cos(phi) < 0) showBack = !showBack;
      const tilt = isFlap ? Math.abs(Math.sin(phi)) : 0;
      const shade = tilt > 0.02 ? 'rgba(40,30,20,' + (0.05 + 0.25 * tilt * (Math.cos(phi) < 0 ? 0.6 : 1)).toFixed(3) + ')' : null;
      texPoly(g, scr, L.pts, showBack ? back : tex, shade);
      g.strokeStyle = 'rgba(80,70,55,0.35)';
      g.lineWidth = 1;
      g.beginPath();
      scr.forEach((p, k) => (k ? g.lineTo(p.x, p.y) : g.moveTo(p.x, p.y)));
      g.closePath();
      g.stroke();
    });
  },
  drawShadowSheet() {
    const g = App.g;
    g.fillStyle = 'rgba(0,0,0,0.22)';
    for (const L of this.sheet.layers) {
      g.beginPath();
      L.pts.forEach((p, k) => { const q = this.P(p.x, p.y); if (k) g.lineTo(q.x + 5, q.y + 7); else g.moveTo(q.x + 5, q.y + 7); });
      g.closePath(); g.fill();
    }
  },
  drawSplit(C, T, phi, live) {
    const sp = this.sheet.split(C, T);
    this.drawShadowSheet();
    if (!sp) { this.drawLayers(this.sheet.layers); return; }
    this.drawLayers(sp.keep);
    const g = App.g;
    // the flap's shadow on the paper below
    g.fillStyle = 'rgba(30,20,10,' + (0.12 + 0.1 * Math.sin(phi)).toFixed(3) + ')';
    for (const L of sp.flap) {
      const scr = L.pts.map((p) => {
        const w = (p.x - sp.cr.mx) * sp.cr.nx + (p.y - sp.cr.my) * sp.cr.ny, k = Math.cos(phi) - 1, z = -w * Math.sin(phi);
        return this.P(p.x + w * k * sp.cr.nx + z * 0.12, p.y + w * k * sp.cr.ny + z * 0.16, 0);
      });
      g.beginPath(); scr.forEach((p, k) => (k ? g.lineTo(p.x, p.y) : g.moveTo(p.x, p.y))); g.closePath(); g.fill();
    }
    this.drawLayers(sp.flap.slice().reverse(), sp.cr, phi, true);
    if (live) {
      // dashed crease
      const cr = sp.cr, dx = -cr.ny, dy = cr.nx;
      const a = this.P(cr.mx - dx * 2, cr.my - dy * 2), b = this.P(cr.mx + dx * 2, cr.my + dy * 2);
      g.save();
      g.setLineDash([7, 6]);
      g.strokeStyle = 'rgba(255,255,255,0.7)';
      g.lineWidth = 2;
      g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.stroke();
      g.restore();
    }
  },
  drawTarget(g, dragging) {
    const st = this.cur();
    if (!st) return;
    const t = this.P(st.to[0], st.to[1]);
    const pulse = 0.5 + 0.5 * Math.sin(this.t * 6);
    let close = 0;
    if (dragging && this.drag) close = clamp(1 - Math.hypot(this.drag.T.x - st.to[0], this.drag.T.y - st.to[1]) / 0.15, 0, 1);
    g.save();
    g.strokeStyle = close > 0.85 ? '#f2b51f' : '#ff5c8a';
    g.lineWidth = 3;
    g.setLineDash([5, 5]);
    g.beginPath(); g.arc(t.x, t.y, 13 + pulse * 3, 0, TAU); g.stroke();
    g.setLineDash([]);
    g.fillStyle = close > 0.85 ? '#f2b51f' : '#ff5c8a';
    g.beginPath(); g.arc(t.x, t.y, 4, 0, TAU); g.fill();
    g.restore();
  },
  drawGuide(g) {
    const C = this.corner();
    if (!C) return;
    const c = this.P(C.x, C.y);
    this.drawTarget(g, false);
    const pulse = 0.5 + 0.5 * Math.sin(this.t * 5);
    g.save();
    g.fillStyle = 'rgba(255,143,177,' + (0.35 + 0.3 * pulse) + ')';
    g.beginPath(); g.arc(c.x, c.y, 16 + pulse * 6, 0, TAU); g.fill();
    g.fillStyle = '#ff5c8a';
    g.beginPath(); g.arc(c.x, c.y, 8, 0, TAU); g.fill();
    g.strokeStyle = '#fff'; g.lineWidth = 2.5; g.stroke();
    // ghost finger showing the motion
    if (this.idleT > 1.2 || this.step === 0) {
      const st = this.cur(), t = this.P(st.to[0], st.to[1]);
      const k = ((this.t * 0.6) % 1);
      const e = easeInOutSine(Math.min(1, k * 1.4));
      const x = lerp(c.x, t.x, e), y = lerp(c.y, t.y, e);
      g.globalAlpha = k < 0.85 ? 0.9 : (1 - k) / 0.15 * 0.9;
      g.strokeStyle = 'rgba(255,255,255,0.6)'; g.setLineDash([3, 6]); g.lineWidth = 2;
      g.beginPath(); g.moveTo(c.x, c.y); g.lineTo(x, y); g.stroke(); g.setLineDash([]);
      g.fillStyle = '#ffffff';
      g.beginPath(); g.arc(x, y, 11, 0, TAU); g.fill();
      g.fillStyle = 'rgba(0,0,0,0.15)'; g.beginPath(); g.arc(x + 3, y + 4, 11, 0, TAU); g.fill();
    }
    g.restore();
  },
  drawReveal(g, W, H) {
    const k = this.state === 'done' ? 1 : easeOutBack(Math.min(1, this.anim.t / this.anim.dur));
    const sc = Math.min(W, H) * 0.075 * k;
    const cx = W / 2, cy = this.oy + SHEET_H * COS_T * this.s * 0.42;
    const t = this.t;
    g.save();
    g.fillStyle = 'rgba(255,240,200,' + (0.18 * k) + ')';
    g.beginPath(); g.arc(cx, cy, sc * 5.5, 0, TAU); g.fill();
    g.restore();
    Plane3D.draw(g, this.design, this.paper, cx, cy, sc, 0.12 + Math.sin(t * 1.3) * 0.08, Math.sin(t * 0.9) * 0.25, 0.6 + Math.sin(t * 0.5) * 0.25, 0.5, Math.min(1, k * 1.5));
  },
};

function roundRect(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

// ---------------------------------------------------------------- world.js (procedural course + papercraft rendering)
const World = {
  objs: [], genX: 0, seed: 1, rng: null, cloudCache: new Map(), bgCache: new Map(),

  reset(seed) {
    this.seed = seed;
    this.rng = new RNG(seed);
    this.objs = [];
    this.genX = 14;
    // the launch garden: a guiding arc of stars, an early updraft and an umbrella
    for (let i = 0; i < 7; i++) this.add({ t: 'star', x: 8 + i * 3.2, y: 8.4 + Math.sin(i / 6 * Math.PI) * 3 });
    this.add({ t: 'updraft', x: 40, w: 4.4, top: 26, str: 32, src: 'grill' });
    for (let i = 0; i < 6; i++) this.add({ t: 'star', x: 40, y: 9 + i * 2.6 });
    this.add({ t: 'umbrella', x: 64, y: 3.2, w: 3.4, c: '#ff8fb1' });
    this.genX = 72;
  },
  add(o) { o.id = this.objs.length + ':' + o.t; this.objs.push(o); return o; },

  // generate content ahead of x
  ensure(x) {
    while (this.genX < x) this.segment();
    // drop far-behind objects
    if (this.objs.length > 400) this.objs = this.objs.filter((o) => (o.x2 || o.x) > x - 220);
  },
  segment() {
    const r = this.rng, x0 = this.genX;
    const z = zoneAt(x0), d = x0;
    const len = r.range(26, 38);
    const hard = clamp(d / 3000, 0, 1);
    const P = (p) => r.chance(p);
    // updrafts: generous early, sparser later
    const draftEvery = lerp(0.62, 0.38, hard);
    if (P(draftEvery)) {
      const src = { garden: ['grill', 'thermal', 'thermal'], street: ['chimney', 'chimney', 'vent'], park: ['fountain', 'thermal', 'thermal'], city: ['vent', 'vent', 'thermal'], sky: ['cloud', 'cloud', 'thermal'] }[z.id];
      const s = r.pick(src);
      const top = s === 'cloud' ? r.range(40, 70) : r.range(22, 46);
      const ux = x0 + r.range(6, len - 6);
      this.add({ t: 'updraft', x: ux, w: r.range(3.6, 5.2), top, str: r.range(26, 36), src: s, y0: s === 'cloud' ? r.range(14, 26) : 0 });
      if (s === 'chimney') this.add({ t: 'house', x: ux - 2, w: r.range(8, 11), h: r.range(6, 8), roof: r.range(3, 4.5), chim: true, c: r.pick(['#f2c6a0', '#c9dff2', '#f7e3a3', '#e8c3d9']) });
      if (s === 'vent' && z.id === 'city') this.add({ t: 'building', x: ux - 1, w: r.range(9, 13), h: r.range(10, 18), c: r.pick(['#b7aed3', '#d6c4b0', '#a9c4cf']), vent: true });
      // a column of stars rewards riding it
      if (P(0.75)) for (let i = 0; i < 5; i++) this.add({ t: 'star', x: ux + r.range(-1, 1), y: (s === 'cloud' ? 16 : 10) + i * 3 });
    }
    // bouncers
    if (P(z.id === 'garden' || z.id === 'park' ? 0.32 : z.id === 'street' ? 0.3 : 0.16)) {
      const bx = x0 + r.range(4, len - 4);
      if (z.id === 'street' || z.id === 'city') this.add({ t: 'awning', x: bx, y: r.range(3, 5), w: r.range(3, 4.5), c: r.pick(['#ff6b6b', '#4fb3ff', '#ffc94d', '#7bd389']) });
      else this.add({ t: 'umbrella', x: bx, y: r.range(3, 4), w: r.range(3, 4), c: r.pick(['#ff8fb1', '#ffc94d', '#5cc8ff', '#7bd389']) });
    }
    if (P(z.id === 'park' || z.id === 'sky' ? 0.22 : 0.08) && d > 200) this.add({ t: 'balloon', x: x0 + r.range(6, len - 6), y: r.range(16, 32), r: 3.2, c: r.pick(['#ff6b6b', '#ffc94d', '#b48cff', '#4fd1c5']), bob: r.range(0, TAU) });
    // star patterns
    if (P(0.7)) {
      const kind = r.int(0, 2), sx = x0 + r.range(2, 10), sy = r.range(6, 22) + (z.id === 'sky' ? 6 : 0);
      for (let i = 0; i < 6; i++) {
        if (kind === 0) this.add({ t: 'star', x: sx + i * 2.4, y: sy + Math.sin((i / 5) * Math.PI) * 4 });
        else if (kind === 1) this.add({ t: 'star', x: sx + i * 2.4, y: sy - i * 1.2 });
        else this.add({ t: 'star', x: sx + Math.cos((i / 6) * TAU) * 3, y: sy + 4 + Math.sin((i / 6) * TAU) * 3 });
      }
    }
    if (P(0.06 + hard * 0.04)) this.add({ t: 'bigstar', x: x0 + r.range(5, len - 5), y: r.range(14, 34) });
    if (P(0.18)) this.add({ t: 'ring', x: x0 + r.range(5, len - 5), y: r.range(7, 22) });
    // obstacles (density grows with distance)
    const obs = lerp(0.22, 0.75, hard);
    if (P(obs)) {
      const ox = x0 + r.range(3, len - 3);
      const pick = r.next();
      if (z.id === 'garden' || z.id === 'park') {
        if (pick < 0.55) this.add({ t: 'tree', x: ox, h: r.range(3, 5.5), r: r.range(2.6, 4.2), c: r.pick(['#5fae6b', '#7cc36a', '#4f9e68', '#9ccf6a']) });
        else if (pick < 0.75 && z.id === 'park') this.add({ t: 'kite', x: ox, y: r.range(12, 22), c: r.pick(['#ff6b6b', '#ffc94d', '#5cc8ff']) });
        else this.add({ t: 'bird', x: ox + 20, y: r.range(8, 22), vx: -r.range(2, 4.5), ph: r.range(0, TAU), c: '#5b5f7a' });
      } else if (z.id === 'street') {
        if (pick < 0.4) this.add({ t: 'house', x: ox, w: r.range(8, 11), h: r.range(6, 8.5), roof: r.range(3, 4.5), c: r.pick(['#f2c6a0', '#c9dff2', '#f7e3a3', '#e8c3d9', '#cde8c6']) });
        else if (pick < 0.7) { const span = r.range(14, 22); this.add({ t: 'wire', x: ox, x2: ox + span, y: r.range(8, 11), sag: 1.4 }); }
        else this.add({ t: 'bird', x: ox + 20, y: r.range(9, 20), vx: -r.range(2.5, 5), ph: r.range(0, TAU), c: '#4a4e66' });
      } else if (z.id === 'city') {
        if (pick < 0.55) this.add({ t: 'building', x: ox, w: r.range(9, 15), h: r.range(11, 15 + hard * 11), c: r.pick(['#b7aed3', '#d6c4b0', '#a9c4cf', '#c9b8a6', '#9fb1d6']) });
        else if (pick < 0.8) this.add({ t: 'bird', x: ox + 20, y: r.range(12, 34), vx: -r.range(3, 6), ph: r.range(0, TAU), c: '#6a6e88' });
        else { const span = r.range(16, 24); this.add({ t: 'wire', x: ox, x2: ox + span, y: r.range(10, 16), sag: 1.8 }); }
      } else {
        if (pick < 0.5) this.add({ t: 'bird', x: ox + 24, y: r.range(14, 50), vx: -r.range(4, 7), ph: r.range(0, TAU), c: '#4f5b7a', flock: P(0.4) });
        else if (pick < 0.8) this.add({ t: 'storm', x: ox, y: r.range(26, 44), w: r.range(5, 8) });
        else this.add({ t: 'tree', x: ox, h: r.range(3, 5), r: r.range(2.6, 4), c: '#6fbf6a' });
      }
      // a second obstacle late in the run
      if (hard > 0.4 && P(hard * 0.5)) this.add({ t: 'bird', x: x0 + len + 10, y: r.range(10, 30), vx: -r.range(3, 6), ph: r.range(0, TAU), c: '#5b5f7a' });
    }
    this.genX = x0 + len;
  },

  // ------------------------------------------------ queries
  updraftAt(x, y) {
    let a = 0, which = null;
    for (const o of this.objs) {
      if (o.t !== 'updraft' || Math.abs(x - o.x) > o.w) continue;
      const y0 = o.y0 || 0;
      if (y < y0 - 2 || y > o.top) continue;
      const fall = clamp((o.top - y) / (o.top * 0.3), 0, 1) * (1 - Math.abs(x - o.x) / o.w * 0.35);
      if (fall > 0) { a += o.str * fall; which = o; }
    }
    return { a, which };
  },

  // ------------------------------------------------ rendering
  draw(g, cam, W, H, t) {
    const z = cam.z;
    const zi = zoneIndex(cam.x + W / z * 0.4);
    const Z = ZONES[zi];
    const N = ZONES[Math.min(ZONES.length - 1, zi + 1)];
    const blend = N !== Z ? clamp((cam.x + W / z * 0.4 - (N.from - 60)) / 60, 0, 1) : 0;
    const col = (k) => (blend > 0 ? mixHex(Z[k], N[k], blend) : Z[k]);
    // sky
    const sk = g.createLinearGradient(0, 0, 0, H);
    sk.addColorStop(0, blend > 0 ? mixHex(Z.sky[0], N.sky[0], blend) : Z.sky[0]);
    sk.addColorStop(1, blend > 0 ? mixHex(Z.sky[1], N.sky[1], blend) : Z.sky[1]);
    g.fillStyle = sk;
    g.fillRect(0, 0, W, H);
    // paper sun
    const sunX = W * 0.8, sunY = H * 0.16 + cam.y * z * 0.03;
    g.fillStyle = 'rgba(255,255,255,0.35)'; g.beginPath(); g.arc(sunX + 4, sunY + 5, 34, 0, TAU); g.fill();
    g.fillStyle = Z.id === 'city' ? '#ffcf7a' : '#fff1a8'; g.beginPath(); g.arc(sunX, sunY, 34, 0, TAU); g.fill();
    const gy = (wy) => H - (wy - cam.y) * z; // world y -> screen
    const sx = (wx, par) => (wx - cam.x * par) * z;
    // drifting clouds (far)
    this.drawClouds(g, cam, W, H, 0.12, 0.55, t);
    // far hills / skyline
    this.drawRidge(g, cam, W, H, 0.18, col('far'), Z.id, 1);
    this.drawRidge(g, cam, W, H, 0.4, col('mid'), Z.id, 2);
    this.drawClouds(g, cam, W, H, 0.3, 0.85, t);
    // ground
    const groundY = gy(0);
    if (groundY < H + 40) {
      g.fillStyle = 'rgba(0,0,0,0.12)';
      g.fillRect(0, groundY - 4, W, H - groundY + 4);
      g.fillStyle = col('ground');
      g.fillRect(0, groundY, W, H - groundY);
      // ground details (grass tufts / paving)
      const step = 3;
      const start = Math.floor(cam.x / step) * step;
      for (let wx = start; wx < cam.x + W / z + step; wx += step) {
        const h = hashStr('g' + wx) % 100;
        const X = sx(wx, 1);
        if (Z.id === 'street' || Z.id === 'city') {
          g.fillStyle = 'rgba(255,255,255,0.12)'; g.fillRect(X, groundY + 6, step * z * 0.45, 3);
        } else if (h < 40) {
          g.fillStyle = mixHex(col('ground'), '#2f6b3a', 0.25);
          g.beginPath(); g.moveTo(X, groundY + 1); g.lineTo(X + 4, groundY - 6 - (h % 5)); g.lineTo(X + 8, groundY + 1); g.fill();
        } else if (h < 46) {
          g.fillStyle = Z.accent; g.beginPath(); g.arc(X + 3, groundY - 3, 3, 0, TAU); g.fill();
        }
      }
    }
    // the house you launch from
    if (cam.x < 30) this.drawHome(g, cam, W, H, z, gy, sx);
    // best-distance flag
    if (Flight.best > 20) {
      const bx = sx(Flight.best, 1);
      if (bx > -40 && bx < W + 40) {
        g.fillStyle = 'rgba(0,0,0,0.15)'; g.fillRect(bx + 3, groundY - 5.6 * z + 3, 3, 5.6 * z);
        g.fillStyle = '#7a5a3a'; g.fillRect(bx, groundY - 5.6 * z, 3, 5.6 * z);
        g.fillStyle = '#ff5c8a';
        g.beginPath(); g.moveTo(bx + 3, groundY - 5.6 * z); g.lineTo(bx + 3 + 2.6 * z, groundY - 4.9 * z); g.lineTo(bx + 3, groundY - 4.2 * z); g.closePath(); g.fill();
        g.fillStyle = '#fff'; g.font = '600 12px Fredoka, sans-serif'; g.textAlign = 'center';
        g.fillText('BEST ' + Math.round(Flight.best) + 'm', bx, groundY - 5.9 * z);
      }
    }
    // gameplay objects
    for (const o of this.objs) {
      const X = sx(o.x, 1);
      const X2 = o.x2 !== undefined ? sx(o.x2, 1) : X;
      if (X2 < -120 || X > W + 120) continue;
      this.drawObj(g, o, X, gy, z, t);
    }
  },

  drawClouds(g, cam, W, H, par, a, t) {
    const z = cam.z, span = 60;
    const k0 = Math.floor((cam.x * par) / span) - 1, k1 = k0 + Math.ceil(W / z / span) + 3;
    for (let k = k0; k <= k1; k++) {
      const r = new RNG(hashStr('cl' + par + ':' + k));
      if (!r.chance(0.7)) continue;
      const wx = k * span + r.range(0, span) + t * 0.6 * par, wy = r.range(18, 60) + (par > 0.2 ? 0 : 20);
      const X = (wx - cam.x * par) * z, Y = H - (wy - cam.y * par * 0.6) * z;
      const s = r.range(2.4, 4.2) * z * (0.7 + par);
      this.cloud(g, X, Y, s, a, r);
    }
  },
  cloud(g, X, Y, s, a, r) {
    const blobs = [[0, 0, 1], [0.9, 0.15, 0.75], [-0.9, 0.2, 0.7], [0.4, -0.45, 0.8], [-0.35, -0.35, 0.65]];
    g.fillStyle = 'rgba(70,90,120,' + 0.12 * a + ')';
    for (const [bx, by, br] of blobs) { g.beginPath(); g.arc(X + bx * s + 4, Y + by * s + 6, br * s, 0, TAU); g.fill(); }
    g.fillStyle = 'rgba(255,255,255,' + a + ')';
    for (const [bx, by, br] of blobs) { g.beginPath(); g.arc(X + bx * s, Y + by * s, br * s, 0, TAU); g.fill(); }
  },
  drawRidge(g, cam, W, H, par, color, zid, layer) {
    const z = cam.z;
    const base = H - (0 - cam.y * par * 0.7) * z;
    const xs = cam.x * par;
    g.fillStyle = 'rgba(0,0,0,0.1)';
    const pts = [];
    const step = layer === 1 ? 6 : 4;
    const x0 = Math.floor(xs / step) * step - step;
    for (let wx = x0; wx < xs + W / z + step * 2; wx += step) {
      const n = Math.sin(wx * 0.05 + layer) * 0.5 + Math.sin(wx * 0.013 + layer * 3) * 0.8 + Math.sin(wx * 0.11) * 0.2;
      let h;
      if (zid === 'city' || zid === 'street') {
        const b = Math.floor(wx / (layer === 1 ? 9 : 7));
        const hh = (hashStr(zid + layer + ':' + b) % 100) / 100;
        h = zid === 'city' ? (layer === 1 ? 12 + hh * 16 : 7 + hh * 10) : (layer === 1 ? 9 + hh * 6 : 6 + hh * 5);
      } else if (zid === 'sky') h = (layer === 1 ? 8 : 4) + n * 2;
      else h = (layer === 1 ? 14 : 7) + n * (layer === 1 ? 6 : 3);
      pts.push([(wx - xs) * z, base - h * z]);
    }
    // shadow then fill
    for (const off of [[5, 6, 'rgba(0,0,0,0.1)'], [0, 0, color]]) {
      g.fillStyle = off[2];
      g.beginPath();
      g.moveTo(-10, H + 10);
      if (zid === 'city' || zid === 'street') {
        let px = pts[0][0];
        for (const [x, y] of pts) { g.lineTo(px + off[0], y + off[1]); g.lineTo(x + off[0], y + off[1]); px = x; }
      } else for (const [x, y] of pts) g.lineTo(x + off[0], y + off[1]);
      g.lineTo(W + 10, H + 10);
      g.closePath();
      g.fill();
    }
    // windows on far buildings
    if (zid === 'city' && layer === 2) {
      g.fillStyle = 'rgba(255,240,180,0.35)';
      for (let i = 0; i < pts.length - 1; i += 1) {
        const [x, y] = pts[i];
        for (let wy = y + 8; wy < base - 6; wy += 14) if ((i * 7 + wy) % 3 < 1.2) g.fillRect(x + 6, wy, 5, 6);
      }
    }
  },
  drawHome(g, cam, W, H, z, gy, sx) {
    const x0 = sx(-12, 1), x1 = sx(0.6, 1), top = gy(13), base = gy(0);
    g.fillStyle = 'rgba(0,0,0,0.15)'; g.fillRect(x0 + 6, top + 6, x1 - x0, base - top);
    g.fillStyle = '#f6d7b0'; g.fillRect(x0, top, x1 - x0, base - top);
    g.fillStyle = '#d9785b';
    g.beginPath(); g.moveTo(x0 - 1 * z, top); g.lineTo(x1 + 1 * z, top); g.lineTo(x1 - 3 * z, top - 4 * z); g.lineTo(x0 + 2 * z, top - 4 * z); g.closePath(); g.fill();
    // the window
    const wx0 = sx(-2.6, 1), wx1 = sx(0.6, 1), wy0 = gy(10.6), wy1 = gy(7.2);
    g.fillStyle = '#ffe9b8'; g.fillRect(wx0, wy0, wx1 - wx0, wy1 - wy0);
    g.fillStyle = '#ffffff'; g.fillRect(wx0 - 3, wy1, wx1 - wx0 + 8, 6);
    g.strokeStyle = '#ffffff'; g.lineWidth = 3; g.strokeRect(wx0, wy0, wx1 - wx0, wy1 - wy0);
    // door
    g.fillStyle = '#7fb3e0'; g.fillRect(sx(-8, 1), gy(3.4), 2.4 * z, 3.4 * z);
    g.fillStyle = '#ffe27a'; g.beginPath(); g.arc(sx(-6.1, 1), gy(1.7), 2.5, 0, TAU); g.fill();
  },

  drawObj(g, o, X, gy, z, t) {
    const sh = 'rgba(0,0,0,0.14)';
    switch (o.t) {
      case 'star': {
        if (o.got) return;
        const Y = gy(o.y), s = 0.75 * z, wob = Math.sin(t * 3 + o.x) * 0.15;
        g.save(); g.translate(X, Y); g.rotate(wob);
        g.fillStyle = sh; star5(g, 2, 3, s, 0.5);
        g.fillStyle = '#ffd34d'; star5(g, 0, 0, s, 0.5);
        g.fillStyle = 'rgba(255,255,255,0.55)'; star5(g, -s * 0.12, -s * 0.15, s * 0.45, 0.5);
        g.restore();
        return;
      }
      case 'bigstar': {
        if (o.got) return;
        const Y = gy(o.y), s = 1.5 * z;
        g.save(); g.translate(X, Y); g.rotate(t * 1.5);
        g.fillStyle = 'rgba(255,255,255,0.35)'; g.beginPath(); g.arc(0, 0, s * 1.5, 0, TAU); g.fill();
        g.fillStyle = sh; star5(g, 3, 4, s, 0.5);
        g.fillStyle = 'hsl(' + ((t * 120) % 360) + ',90%,65%)'; star5(g, 0, 0, s, 0.5);
        g.fillStyle = '#fff'; star5(g, 0, 0, s * 0.45, 0.5);
        g.restore();
        return;
      }
      case 'ring': {
        if (o.got) return;
        const Y = gy(o.y), r = 1.8 * z;
        g.save();
        g.lineWidth = 4; g.strokeStyle = 'rgba(255,255,255,0.85)';
        g.setLineDash([6, 5]); g.lineDashOffset = -t * 30;
        g.beginPath(); g.ellipse(X, Y, r * 0.55, r, 0, 0, TAU); g.stroke();
        g.setLineDash([]);
        g.strokeStyle = 'rgba(92,200,255,0.8)'; g.lineWidth = 2;
        g.beginPath(); g.ellipse(X, Y, r * 0.4, r * 0.85, 0, 0, TAU); g.stroke();
        g.restore();
        return;
      }
      case 'updraft': {
        const y0 = gy(o.y0 || 0), y1 = gy(o.top);
        g.save();
        g.strokeStyle = o.src === 'cloud' ? 'rgba(255,255,255,0.5)' : 'rgba(255,255,255,0.42)';
        g.lineWidth = 2;
        for (let k = 0; k < 4; k++) {
          const lx = X + (k - 1.5) * o.w * 0.45 * z;
          g.beginPath();
          for (let yy = y0; yy > y1; yy -= 8) {
            const ph = (t * 3 + k * 1.7 + yy * 0.03);
            const xx = lx + Math.sin(ph) * 5;
            if (yy === y0) g.moveTo(xx, yy); else g.lineTo(xx, yy);
          }
          g.globalAlpha = 0.6;
          g.stroke();
        }
        g.globalAlpha = 1;
        // drifting puffs (smoke/leaves)
        for (let k = 0; k < 6; k++) {
          const ph = ((t * 0.35 + k / 6 + (o.x % 1)) % 1);
          const yy = lerp(y0, y1, ph), xx = X + Math.sin(ph * 9 + k) * o.w * 0.3 * z;
          g.fillStyle = o.src === 'chimney' || o.src === 'grill' || o.src === 'vent' ? 'rgba(235,235,240,' + (0.55 * (1 - ph)) + ')' : o.src === 'fountain' ? 'rgba(140,210,255,' + (0.6 * (1 - ph)) + ')' : 'rgba(255,255,255,' + (0.45 * (1 - ph)) + ')';
          g.beginPath(); g.arc(xx, yy, (0.5 + ph * 1.2) * z, 0, TAU); g.fill();
        }
        // the source
        const base = gy(0);
        if (o.src === 'grill') {
          g.fillStyle = sh; g.fillRect(X - 1.1 * z + 3, base - 1.6 * z + 3, 2.2 * z, 1 * z);
          g.fillStyle = '#3a3a44'; g.beginPath(); g.arc(X, base - 1.6 * z, 1.1 * z, 0, Math.PI); g.fill();
          g.strokeStyle = '#3a3a44'; g.lineWidth = 3; g.beginPath(); g.moveTo(X - 0.7 * z, base - 1.2 * z); g.lineTo(X - 0.9 * z, base); g.moveTo(X + 0.7 * z, base - 1.2 * z); g.lineTo(X + 0.9 * z, base); g.stroke();
        } else if (o.src === 'fountain') {
          g.fillStyle = '#c9c4bd'; g.fillRect(X - 1.8 * z, base - 1 * z, 3.6 * z, 1 * z);
          g.fillStyle = '#7fd0ff'; g.fillRect(X - 1.5 * z, base - 1 * z, 3 * z, 0.35 * z);
        } else if (o.src === 'thermal') {
          g.fillStyle = 'rgba(255,240,170,0.35)'; g.beginPath(); g.ellipse(X, base, o.w * z, 0.8 * z, 0, 0, TAU); g.fill();
        } else if (o.src === 'cloud') {
          const cy = gy((o.y0 || 0) + 2);
          this.cloud(g, X, cy, 2.2 * z, 0.95, new RNG(hashStr('u' + o.x)));
        }
        g.restore();
        return;
      }
      case 'tree': {
        const base = gy(0), top = gy(o.h), cy = gy(o.h + o.r * 0.7);
        g.fillStyle = sh; g.beginPath(); g.arc(X + 4, cy + 5, o.r * z, 0, TAU); g.fill();
        g.fillStyle = '#8a6142'; g.fillRect(X - 0.35 * z, top, 0.7 * z, base - top);
        g.fillStyle = o.c; g.beginPath(); g.arc(X, cy, o.r * z, 0, TAU); g.fill();
        g.fillStyle = 'rgba(255,255,255,0.18)'; g.beginPath(); g.arc(X - o.r * 0.3 * z, cy - o.r * 0.35 * z, o.r * 0.45 * z, 0, TAU); g.fill();
        return;
      }
      case 'house': {
        const x0 = X - (o.w / 2) * z, x1 = X + (o.w / 2) * z, base = gy(0), top = gy(o.h), peak = gy(o.h + o.roof);
        g.fillStyle = sh; g.fillRect(x0 + 5, top + 5, x1 - x0, base - top);
        g.fillStyle = o.c; g.fillRect(x0, top, x1 - x0, base - top);
        g.fillStyle = '#c96a55';
        g.beginPath(); g.moveTo(x0 - 0.6 * z, top); g.lineTo(X, peak); g.lineTo(x1 + 0.6 * z, top); g.closePath(); g.fill();
        if (o.chim) { g.fillStyle = '#a9563f'; g.fillRect(X + 1.4 * z, gy(o.h + o.roof * 0.9), 1.2 * z, gy(o.h + o.roof * 0.3) - gy(o.h + o.roof * 0.9) + 2); }
        g.fillStyle = '#fff6d8';
        g.fillRect(x0 + 1.2 * z, gy(o.h * 0.7), 1.6 * z, 1.6 * z);
        g.fillRect(x1 - 2.8 * z, gy(o.h * 0.7), 1.6 * z, 1.6 * z);
        g.fillStyle = '#8c6a54'; g.fillRect(X - 0.7 * z, gy(2.3), 1.4 * z, 2.3 * z);
        return;
      }
      case 'building': {
        const x0 = X - (o.w / 2) * z, x1 = X + (o.w / 2) * z, base = gy(0), top = gy(o.h);
        g.fillStyle = sh; g.fillRect(x0 + 6, top + 6, x1 - x0, base - top);
        g.fillStyle = o.c; g.fillRect(x0, top, x1 - x0, base - top);
        g.fillStyle = 'rgba(255,250,220,0.55)';
        for (let wy = o.h - 2; wy > 1.5; wy -= 2.6) for (let wx = -o.w / 2 + 1.2; wx < o.w / 2 - 1; wx += 2.4) if ((hashStr(o.x + ':' + wx + ':' + wy) & 3) !== 0) g.fillRect(X + wx * z, gy(wy), 1.1 * z, 1.4 * z);
        if (o.vent) { g.fillStyle = '#7a7d8c'; g.fillRect(X - 0.8 * z, top - 1.2 * z, 1.6 * z, 1.2 * z); }
        return;
      }
      case 'bird': {
        const Y = gy(o.y + Math.sin(t * 2 + o.ph) * 0.6), s = z * 0.9, flap = Math.sin(t * 12 + o.ph);
        g.save(); g.translate(X, Y);
        g.fillStyle = sh; g.beginPath(); g.ellipse(3, 4, s, s * 0.45, 0, 0, TAU); g.fill();
        g.fillStyle = o.c; g.beginPath(); g.ellipse(0, 0, s, s * 0.45, 0, 0, TAU); g.fill();
        g.beginPath(); g.moveTo(-s * 0.2, 0); g.lineTo(s * 0.4, -s * 1.1 * flap); g.lineTo(s * 0.6, 0); g.fill();
        g.fillStyle = '#ffb34d'; g.beginPath(); g.moveTo(-s, 0); g.lineTo(-s * 1.45, s * 0.12); g.lineTo(-s, s * 0.22); g.fill();
        g.fillStyle = '#fff'; g.beginPath(); g.arc(-s * 0.6, -s * 0.1, s * 0.12, 0, TAU); g.fill();
        g.restore();
        return;
      }
      case 'umbrella': case 'awning': {
        const Y = gy(o.y), base = gy(0), w = o.w * z;
        g.fillStyle = '#6b5a4a';
        g.fillRect(X - 1.5, Y, 3, base - Y);
        g.fillStyle = sh;
        g.beginPath(); g.ellipse(X + 4, Y + 5, w, w * 0.45, 0, Math.PI, 0); g.fill();
        g.fillStyle = o.c;
        if (o.t === 'umbrella') { g.beginPath(); g.ellipse(X, Y, w, w * 0.45, 0, Math.PI, 0); g.closePath(); g.fill(); }
        else { g.beginPath(); g.moveTo(X - w, Y); g.lineTo(X + w, Y); g.lineTo(X + w * 0.8, Y - w * 0.35); g.lineTo(X - w * 0.8, Y - w * 0.35); g.closePath(); g.fill(); }
        g.fillStyle = 'rgba(255,255,255,0.45)';
        for (let k = -2; k <= 2; k += 2) { g.beginPath(); g.moveTo(X + k * w * 0.2, Y); g.lineTo(X + k * w * 0.12, Y - w * 0.42); g.lineTo(X + (k + 1) * w * 0.2, Y - w * 0.38); g.lineTo(X + (k + 1) * w * 0.3, Y); g.fill(); }
        if (o.boing) { const a = 1 - o.boing; g.strokeStyle = 'rgba(255,255,255,' + a + ')'; g.lineWidth = 3; g.beginPath(); g.ellipse(X, Y - w * 0.3, w * (1 + o.boing * 0.4), w * 0.25, 0, Math.PI, 0); g.stroke(); }
        return;
      }
      case 'balloon': {
        const Y = gy(o.y + Math.sin(t * 0.8 + o.bob) * 0.7), r = o.r * z;
        g.fillStyle = sh; g.beginPath(); g.ellipse(X + 4, Y + 5, r * 0.9, r, 0, 0, TAU); g.fill();
        g.fillStyle = o.c; g.beginPath(); g.ellipse(X, Y, r * 0.9, r, 0, 0, TAU); g.fill();
        g.fillStyle = 'rgba(255,255,255,0.3)'; g.beginPath(); g.ellipse(X, Y, r * 0.35, r, 0, 0, TAU); g.fill();
        g.strokeStyle = '#6b5a4a'; g.lineWidth = 1.5; g.beginPath(); g.moveTo(X - r * 0.4, Y + r * 0.9); g.lineTo(X - r * 0.25, Y + r * 1.4); g.moveTo(X + r * 0.4, Y + r * 0.9); g.lineTo(X + r * 0.25, Y + r * 1.4); g.stroke();
        g.fillStyle = '#a77b52'; g.fillRect(X - r * 0.28, Y + r * 1.4, r * 0.56, r * 0.4);
        return;
      }
      case 'kite': {
        const Y = gy(o.y + Math.sin(t * 1.5 + o.x) * 0.8), s = 1.5 * z;
        g.strokeStyle = 'rgba(80,70,60,0.55)'; g.lineWidth = 1;
        g.beginPath(); g.moveTo(X, Y + s); g.quadraticCurveTo(X - 4 * z, gy(o.y * 0.5), X - 9 * z, gy(0)); g.stroke();
        g.fillStyle = sh; g.beginPath(); g.moveTo(X + 3, Y - s + 4); g.lineTo(X + s * 0.75 + 3, Y + 4); g.lineTo(X + 3, Y + s + 4); g.lineTo(X - s * 0.75 + 3, Y + 4); g.fill();
        g.fillStyle = o.c; g.beginPath(); g.moveTo(X, Y - s); g.lineTo(X + s * 0.75, Y); g.lineTo(X, Y + s); g.lineTo(X - s * 0.75, Y); g.fill();
        g.strokeStyle = 'rgba(255,255,255,0.7)'; g.lineWidth = 1.5; g.beginPath(); g.moveTo(X, Y - s); g.lineTo(X, Y + s); g.moveTo(X - s * 0.75, Y); g.lineTo(X + s * 0.75, Y); g.stroke();
        return;
      }
      case 'wire': {
        const X2 = (o.x2 - (o.x - X / z)) * z, Y = gy(o.y), base = gy(0);
        g.fillStyle = '#7a5f48';
        g.fillRect(X - 2, Y - 4, 4, base - Y + 4); g.fillRect(X2 - 2, Y - 4, 4, base - Y + 4);
        g.fillRect(X - 10, Y - 3, 20, 3); g.fillRect(X2 - 10, Y - 3, 20, 3);
        g.strokeStyle = '#3d3d48'; g.lineWidth = 2;
        g.beginPath(); g.moveTo(X, Y); g.quadraticCurveTo((X + X2) / 2, Y + o.sag * z * 2, X2, Y); g.stroke();
        g.beginPath(); g.moveTo(X, Y + 6); g.quadraticCurveTo((X + X2) / 2, Y + 6 + o.sag * z * 2, X2, Y + 6); g.stroke();
        return;
      }
      case 'storm': {
        const Y = gy(o.y), s = o.w * 0.5 * z;
        this.cloud(g, X, Y, s, 1, new RNG(hashStr('s' + o.x)));
        g.fillStyle = 'rgba(80,90,120,0.55)';
        const blobs = [[0, 0, 1], [0.9, 0.15, 0.75], [-0.9, 0.2, 0.7], [0.4, -0.45, 0.8], [-0.35, -0.35, 0.65]];
        for (const [bx, by, br] of blobs) { g.beginPath(); g.arc(X + bx * s, Y + by * s, br * s, 0, TAU); g.fill(); }
        if (Math.sin(t * 2.3 + o.x) > 0.93) { g.strokeStyle = '#fff7a8'; g.lineWidth = 3; g.beginPath(); g.moveTo(X, Y + s * 0.6); g.lineTo(X - s * 0.2, Y + s * 1.3); g.lineTo(X + s * 0.1, Y + s * 1.3); g.lineTo(X - s * 0.15, Y + s * 2.1); g.stroke(); }
        return;
      }
    }
  },
};

// ---------------------------------------------------------------- flight.js (launch, aerodynamics, collisions, camera)
const PHYS = { g: 9.8, CLa: 5.0, aMax: 0.27, aUp: 0.22, aTrim: 0.05, CD0: 0.03, kInd: 0.09, liftK: 0.46, dragK: 0.36, resp: 5.5, vStall: 5.5 };
const LAUNCH = { x: 0.6, y: 7.7 };

const Flight = {
  state: 'idle', p: null, S: null, run: null, input: false, cam: { x: -6, y: -1.5, z: 12 }, t: 0, best: 0,
  aim: null, trail: [], msgs: [], design: null, paper: 'white', W: 1, H: 1, endT: 0,

  statsFor(designId, up, acc) {
    const st = PLANE[designId].stats;
    const q = 0.88 + 0.17 * acc;
    return {
      liftK: PHYS.liftK * st.lift * (1 + 0.06 * up.crease) * q,
      dragK: PHYS.dragK * st.drag * (1 - 0.06 * up.wax) * (1.06 - 0.06 * acc),
      resp: PHYS.resp * st.agility * (0.9 + 0.1 * acc),
      mass: st.mass,
      v0: 14 + 2.4 * up.band,
      fins: 1 + 0.14 * up.fins,
      gusts: up.gust + st.gust,
      magnet: 1.3 + 0.75 * up.magnet,
    };
  },

  start(designId, paperId, acc, up, seed, best) {
    this.design = PLANE[designId];
    this.paper = paperId;
    this.S = this.statsFor(designId, up, acc);
    this.best = best || 0;
    this.p = { x: LAUNCH.x, y: LAUNCH.y, vx: 0, vy: 0, th: 0.18, bank: 0, spin: 0, gam: 0, loopAcc: 0, stall: 0, draft: null, onGround: false };
    this.run = { dist: 0, stars: 0, bonus: 0, loops: 0, drafts: 0, bounces: 0, near: 0, gustsLeft: this.S.gusts, gustUsed: 0, zone: 0, maxAlt: 0, rings: 0, landed: false, crashed: false, time: 0, seen: {}, bonusList: [] };
    World.reset(seed);
    this.state = 'aim';
    this.trail = [];
    this.msgs = [];
    this.aim = null;
    this.input = false;
    this.t = 0;
    this.cam.x = -9; this.cam.y = -1.5;
  },

  layout(W, H) {
    this.W = W; this.H = H;
    this.cam.z = clamp(Math.sqrt(W * H) / 46, 8, 20);
  },

  // ------------------------------------------------ input
  down(X, Y) {
    if (this.state === 'aim') { this.aim = { sx: X, sy: Y, x: X, y: Y, power: 0, ang: 0.3 }; Sfx.stretch(0); return; }
    if (this.state === 'fly') this.input = true;
  },
  move(X, Y) {
    if (this.state !== 'aim' || !this.aim) return;
    const a = this.aim;
    a.x = X; a.y = Y;
    const dx = a.sx - X, dy = a.sy - Y;
    const len = Math.hypot(dx, dy);
    const maxL = Math.min(this.W, this.H) * 0.34;
    const pw = clamp(len / maxL, 0, 1);
    if (Math.round(pw * 8) !== Math.round(a.power * 8)) Sfx.stretch(pw);
    a.power = pw;
    a.ang = clamp(Math.atan2(-dy, dx), -0.35, 1.25);
    if (len < 8) a.ang = 0.3;
  },
  up() {
    if (this.state === 'aim') {
      const a = this.aim;
      this.aim = null;
      if (!a || a.power < 0.08) return;
      this.launch(a.ang, a.power);
      return;
    }
    this.input = false;
  },
  launch(ang, power) {
    const v = this.S.v0 * (0.35 + 0.65 * power);
    this.p.vx = Math.cos(ang) * v;
    this.p.vy = Math.sin(ang) * v;
    this.p.th = ang;
    this.p.gam = ang;
    this.state = 'fly';
    Sfx.launch(power);
    UI.flightStart();
    if ((Save.data.stats.flights || 0) < 3) UI.flightHint('Hold to climb · let go to glide');
  },
  gust() {
    if (this.state !== 'fly' || this.run.gustsLeft <= 0) return false;
    this.run.gustsLeft--;
    this.run.gustUsed++;
    const p = this.p, v = Math.hypot(p.vx, p.vy) || 1;
    const dirx = Math.cos(p.th), diry = Math.sin(p.th);
    p.vx += dirx * 9; p.vy += diry * 9 + 1.5;
    Sfx.gust();
    this.say('Gust!', '#bfe9ff');
    FX.burst(this.sx(p.x) - 20, this.sy(p.y), 16, ['#ffffff', '#bfe9ff']);
    return true;
  },

  // ------------------------------------------------ physics
  aero(p, holding, dt) {
    const S = this.S;
    const V = Math.hypot(p.vx, p.vy);
    const gam = Math.atan2(p.vy, p.vx);
    let aCmd = holding ? PHYS.aUp : PHYS.aTrim;
    if (p.stall > 0) { p.stall -= dt; aCmd = -0.18; }
    else if (holding && V < PHYS.vStall && p.y > 1.5 && this.state === 'fly') { p.stall = 0.6; this.say('Stall!', '#ffd1d1'); Sfx.stall(); }
    let target = gam + aCmd;
    // pitch tracks the flight path + commanded angle of attack (wrap-safe)
    let d = target - p.th;
    while (d > Math.PI) d -= TAU;
    while (d < -Math.PI) d += TAU;
    p.th += d * Math.min(1, dt * S.resp);
    let a = p.th - gam;
    while (a > Math.PI) a -= TAU;
    while (a < -Math.PI) a += TAU;
    let CL = PHYS.CLa * clamp(a, -PHYS.aMax, PHYS.aMax);
    if (Math.abs(a) > PHYS.aMax) CL *= Math.max(0.25, 1 - (Math.abs(a) - PHYS.aMax) * 3);
    const q = 0.5 * V * V;
    const L = (S.liftK * q * CL) / S.mass;
    const D = (S.dragK * q * (PHYS.CD0 + PHYS.kInd * CL * CL)) / S.mass;
    const cg = V > 1e-4 ? p.vx / V : 1, sg = V > 1e-4 ? p.vy / V : 0;
    return { ax: -D * cg - L * sg, ay: -D * sg + L * cg - PHYS.g, V, gam };
  },

  step(dt) {
    const p = this.p, R = this.run;
    if (this.state === 'aim' || this.state === 'end') return;
    R.time += dt;
    if (this.state === 'crash') {
      p.vy -= PHYS.g * dt; p.vx *= 1 - 0.6 * dt; p.vy *= 1 - 0.2 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.th += dt * 7; p.bank += dt * 5;
      if (p.y <= 0.3) { p.y = 0.3; this.finish(); }
      return;
    }
    if (this.state === 'slide') {
      p.vx *= Math.max(0, 1 - 2.6 * dt); p.x += p.vx * dt; p.th += (0 - p.th) * Math.min(1, dt * 8);
      if (p.vx < 0.4) this.finish();
      return;
    }
    const f = this.aero(p, this.input, dt);
    // updrafts
    const u = World.updraftAt(p.x, p.y);
    let ay = f.ay, ax = f.ax;
    if (u.a > 0) {
      ay += u.a * this.S.fins;
      if (u.which && !R.seen[u.which.id]) { R.seen[u.which.id] = 1; R.drafts++; this.say('Updraft!', '#ffffff'); Sfx.updraft(); }
    }
    // storm downdrafts
    for (const o of World.objs) if (o.t === 'storm' && Math.abs(p.x - o.x) < o.w * 0.6 && p.y < o.y && p.y > o.y - 18) { ay -= 9; if (!R.seen[o.id]) { R.seen[o.id] = 1; this.say('Downdraft!', '#c9d4ff'); Sfx.thunder(); } }
    p.vx += ax * dt; p.vy += ay * dt;
    // keep moving forward (paper planes don't fly backwards)
    if (p.vx < 0.5) p.vx += (0.5 - p.vx) * Math.min(1, dt * 3);
    p.x += p.vx * dt; p.y += p.vy * dt;
    // loops: count continuous nose-over rotation of the flight path
    let dg = f.gam - p.gam;
    while (dg > Math.PI) dg -= TAU;
    while (dg < -Math.PI) dg += TAU;
    p.gam = f.gam;
    p.loopAcc = Math.max(0, p.loopAcc + dg);
    if (p.loopAcc >= TAU - 0.15) {
      p.loopAcc = 0;
      R.loops++;
      const b = 5 * R.loops;
      R.bonus += b;
      R.bonusList.push('Loop ×' + R.loops);
      this.say('Loop-the-loop! +' + b + '★', '#ffe27a', true);
      Sfx.loop(R.loops);
    }
    p.bank += ((this.input ? -0.25 : 0.12) - p.bank) * Math.min(1, dt * 3);
    R.maxAlt = Math.max(R.maxAlt, p.y);
    R.dist = Math.max(R.dist, p.x - LAUNCH.x);
    // zones
    const zi = zoneIndex(p.x);
    if (zi > R.zone) {
      R.zone = zi;
      R.bonus += 10 * zi;
      R.bonusList.push(ZONES[zi].name);
      UI.zoneToast(ZONES[zi].name, 10 * zi);
      Sfx.zone();
    }
    this.collide(dt);
    // ground
    if (p.y <= 0.35 && this.state === 'fly') {
      p.y = 0.35;
      const V = Math.hypot(p.vx, p.vy);
      if (Math.abs(f.gam) < 0.3 && V < 15) { R.landed = true; R.bonus += 5; R.bonusList.push('Smooth landing'); this.say('Smooth landing! +5★', '#ffe27a'); Sfx.land(true); }
      else Sfx.land(false);
      p.vy = 0;
      this.state = 'slide';
    }
  },

  collide(dt) {
    const p = this.p, R = this.run, mag = this.S.magnet;
    for (const o of World.objs) {
      const dx = p.x - o.x;
      if (dx < -40 || dx > 40) { if (o.t !== 'wire' || p.x > o.x2 + 2 || p.x < o.x - 2) continue; }
      switch (o.t) {
        case 'star': case 'bigstar':
          if (!o.got) {
            const d = Math.hypot(dx, p.y - o.y);
            if (d < mag + (o.t === 'bigstar' ? 1 : 0)) {
              o.got = true;
              const v = o.t === 'bigstar' ? 10 : 1;
              R.stars += v;
              this.combo = (this.combo || 0) + 1;
              this.comboT = 0.9;
              Sfx.star(this.combo, o.t === 'bigstar');
              FX.burst(this.sx(o.x), this.sy(o.y), o.t === 'bigstar' ? 22 : 6, ['#ffd34d', '#fff3b0', '#ffffff']);
              if (o.t === 'bigstar') this.say('+10★', '#ffe27a', true);
            } else if (d < mag + 2.5) { o.x += (p.x - o.x) * Math.min(1, dt * 6); o.y += (p.y - o.y) * Math.min(1, dt * 6); }
          }
          break;
        case 'ring':
          if (!o.got && Math.abs(dx) < 1.2 && Math.abs(p.y - o.y) < 2) {
            o.got = true; R.rings++;
            const V = Math.hypot(p.vx, p.vy) || 1;
            p.vx += (p.vx / V) * 6; p.vy += (p.vy / V) * 6;
            this.say('Whoosh!', '#bfe9ff'); Sfx.gust();
          }
          break;
        case 'tree': {
          const cy = o.h + o.r * 0.7;
          if (Math.hypot(dx, p.y - cy) < o.r * 0.85 + 0.6 || (Math.abs(dx) < 0.6 && p.y < o.h)) return this.crash(o);
          this.nearCheck(o, Math.hypot(dx, p.y - cy) - o.r * 0.85);
          break;
        }
        case 'house': {
          const inBody = Math.abs(dx) < o.w / 2 + 0.4 && p.y < o.h + 0.4;
          const roofH = o.h + o.roof * (1 - Math.abs(dx) / (o.w / 2 + 0.6));
          if (inBody || (Math.abs(dx) < o.w / 2 + 0.6 && p.y < roofH + 0.3)) return this.crash(o);
          this.nearCheck(o, Math.min(p.y - roofH, Math.abs(dx) - o.w / 2));
          break;
        }
        case 'building':
          if (Math.abs(dx) < o.w / 2 + 0.4 && p.y < o.h + 0.4) return this.crash(o);
          this.nearCheck(o, Math.max(p.y - o.h, Math.abs(dx) - o.w / 2));
          break;
        case 'bird': {
          o.x += o.vx * dt;
          const by = o.y + Math.sin(this.t * 2 + o.ph) * 0.6;
          const d = Math.hypot(dx, p.y - by);
          if (d < 1.4) return this.crash(o);
          this.nearCheck(o, d - 1.4);
          break;
        }
        case 'kite': {
          const d = Math.hypot(dx, p.y - o.y);
          if (d < 1.7) return this.crash(o);
          this.nearCheck(o, d - 1.7);
          break;
        }
        case 'umbrella': case 'awning':
          if (o.boing) { o.boing += dt * 2.5; if (o.boing > 1) o.boing = 0; }
          if (Math.abs(dx) < o.w + 0.5 && p.y < o.y + 0.9 && p.y > o.y - 1 && p.vy < 0) {
            p.vy = Math.abs(p.vy) * 0.55 + 10.5;
            p.vx *= 1.04;
            p.y = o.y + 1;
            o.boing = 0.01;
            R.bounces++;
            R.bonus += 2;
            this.say('Boing! +2★', '#ffffff');
            Sfx.boing();
            vibrate(10);
          }
          break;
        case 'balloon': {
          const by = o.y, d = Math.hypot(dx / 0.9, p.y - by);
          if (d < o.r + 0.6) {
            const nx = dx / (d || 1), ny = (p.y - by) / (d || 1);
            const V = Math.hypot(p.vx, p.vy);
            p.vx = Math.max(2, nx * V * 0.6 + p.vx * 0.5); p.vy = ny * V * 0.7 + 7;
            p.x = o.x + nx * (o.r + 0.7) * 0.9; p.y = by + ny * (o.r + 0.7);
            R.bounces++; R.bonus += 3;
            this.say('Bounce! +3★', '#ffffff'); Sfx.boing();
          }
          break;
        }
        case 'wire':
          if (p.x > o.x - 0.3 && p.x < o.x2 + 0.3) {
            const k = (p.x - o.x) / (o.x2 - o.x);
            const wy = o.y - 4 * o.sag * k * (1 - k) * 0.5;
            if (Math.abs(p.y - wy) < 0.55 || ((Math.abs(p.x - o.x) < 0.3 || Math.abs(p.x - o.x2) < 0.3) && p.y < o.y)) return this.crash(o);
            if (!o.passed && p.x > (o.x + o.x2) / 2) { o.passed = true; this.nearCheck(o, Math.abs(p.y - wy) - 0.55, true); }
          }
          break;
      }
    }
    if (this.comboT > 0) { this.comboT -= dt; if (this.comboT <= 0) this.combo = 0; }
  },
  nearCheck(o, gap, force) {
    if (o.nearDone) return;
    if (gap < 0) return;
    if (gap < 1.7) o.nearMin = Math.min(o.nearMin === undefined ? 99 : o.nearMin, gap);
    if (force || (this.p.x > o.x + 1 && o.nearMin !== undefined)) {
      o.nearDone = true;
      if (o.nearMin !== undefined && o.nearMin < 1.5) {
        this.run.near++;
        this.run.bonus += 2;
        this.say('Close call! +2★', '#ffd1e6');
        Sfx.near();
      }
    }
  },
  crash(o) {
    if (this.state !== 'fly') return;
    this.state = 'crash';
    this.run.crashed = true;
    this.p.vx *= 0.35;
    this.p.vy = Math.min(this.p.vy, 2);
    Sfx.crash();
    vibrate([20, 40, 20]);
    const t = { tree: 'Into the leaves!', house: 'Bonk!', building: 'Splat!', bird: 'Bird strike!', kite: 'Tangled!', wire: 'Zap!' }[o.t] || 'Crunch!';
    this.say(t, '#ffd1d1', true);
    FX.burst(this.sx(this.p.x), this.sy(this.p.y), 20, ['#ffffff', '#f4f1e8', '#d9d2c4']);
  },
  finish() {
    if (this.state === 'end') return;
    this.state = 'end';
    this.endT = 0;
    setTimeout(() => Game.flightOver(), 900);
  },

  say(text, color, big) {
    this.msgs.push({ text, color, big, t: 0, x: this.sx(this.p.x), y: this.sy(this.p.y) - 40 });
    if (this.msgs.length > 6) this.msgs.shift();
  },

  // ------------------------------------------------ frame
  update(dt) {
    this.t += dt;
    if (this.state === 'fly' || this.state === 'crash' || this.state === 'slide') {
      const n = Math.ceil(dt / (1 / 120));
      for (let i = 0; i < n; i++) this.step(dt / n);
      World.ensure(this.p.x + 260);
      this.trail.push({ x: this.p.x, y: this.p.y });
      if (this.trail.length > 40) this.trail.shift();
    }
    if (this.state === 'end') this.endT += dt;
    // camera
    const z = this.cam.z, vw = this.W / z, vh = this.H / z;
    let tx, ty;
    if (this.state === 'aim') { tx = -vw * 0.42; ty = -1.5; }
    else { tx = this.p.x - vw * 0.3; ty = Math.max(-1.5, this.p.y - vh * 0.45); }
    const k = this.state === 'aim' ? 1 : Math.min(1, dt * 4);
    this.cam.x += (tx - this.cam.x) * (this.state === 'aim' ? 1 : Math.min(1, dt * 8));
    this.cam.y += (ty - this.cam.y) * k;
    for (const m of this.msgs) m.t += dt;
    this.msgs = this.msgs.filter((m) => m.t < 1.3);
  },
  sx(wx) { return (wx - this.cam.x) * this.cam.z; },
  sy(wy) { return this.H - (wy - this.cam.y) * this.cam.z; },

  render(g, W, H) {
    World.draw(g, this.cam, W, H, this.t);
    const p = this.p, z = this.cam.z;
    // paper-streamer trail
    if (this.trail.length > 2 && this.state !== 'aim') {
      g.save();
      g.lineCap = 'round';
      for (let i = 1; i < this.trail.length; i++) {
        const a = this.trail[i - 1], b = this.trail[i];
        g.strokeStyle = 'rgba(255,255,255,' + (i / this.trail.length) * 0.45 + ')';
        g.lineWidth = (i / this.trail.length) * 4;
        g.beginPath(); g.moveTo(this.sx(a.x), this.sy(a.y)); g.lineTo(this.sx(b.x), this.sy(b.y)); g.stroke();
      }
      g.restore();
    }
    // launch aim: rubber band + preview
    if (this.state === 'aim') this.drawAim(g);
    // plane
    const X = this.sx(p.x), Y = this.sy(p.y);
    const sc = z * 1.18;
    let px = X, py = Y;
    if (this.state === 'aim' && this.aim) { px -= Math.cos(this.aim.ang) * this.aim.power * 22; py += Math.sin(this.aim.ang) * this.aim.power * 22; }
    g.fillStyle = 'rgba(0,0,0,0.12)';
    g.beginPath(); g.ellipse(px, this.sy(0) - 2, sc * 2 * clamp(1 - p.y / 40, 0.2, 1), sc * 0.35, 0, 0, TAU); g.fill();
    Plane3D.draw(g, this.design, this.paper, px, py, sc, this.state === 'aim' ? (this.aim ? this.aim.ang : 0.18) : p.th, p.bank, 0.35, 0.28, 1);
    // floating messages
    for (const m of this.msgs) {
      const a = m.t < 0.12 ? m.t / 0.12 : 1 - Math.max(0, m.t - 0.8) / 0.5;
      g.save();
      g.globalAlpha = clamp(a, 0, 1);
      g.font = (m.big ? '700 26px' : '600 19px') + ' Fredoka, sans-serif';
      g.textAlign = 'center';
      g.lineWidth = 5; g.strokeStyle = 'rgba(40,40,70,0.5)';
      const yy = m.y - m.t * 34;
      g.strokeText(m.text, m.x, yy);
      g.fillStyle = m.color; g.fillText(m.text, m.x, yy);
      g.restore();
    }
    // speed lines
    const V = p ? Math.hypot(p.vx, p.vy) : 0;
    if (V > 24 && this.state === 'fly') {
      g.save();
      g.strokeStyle = 'rgba(255,255,255,' + clamp((V - 24) / 20, 0, 0.5) + ')';
      g.lineWidth = 2;
      for (let i = 0; i < 8; i++) {
        const yy = (hashStr('sl' + i) % H), xx = W - ((this.t * 900 + i * 173) % (W + 200));
        g.beginPath(); g.moveTo(xx, yy); g.lineTo(xx + 80, yy); g.stroke();
      }
      g.restore();
    }
  },

  drawAim(g) {
    const p = this.p, z = this.cam.z;
    const a1 = { x: this.sx(-2.6), y: this.sy(9.2) }, a2 = { x: this.sx(0.6), y: this.sy(9.2) };
    let X = this.sx(p.x), Y = this.sy(p.y);
    const aim = this.aim;
    if (aim) { X -= Math.cos(aim.ang) * aim.power * 22; Y += Math.sin(aim.ang) * aim.power * 22; }
    g.save();
    g.strokeStyle = '#d65a5a'; g.lineWidth = 3;
    g.beginPath(); g.moveTo(a1.x, a1.y); g.lineTo(X - 2 * z, Y); g.lineTo(a2.x, a2.y); g.stroke();
    if (aim && aim.power > 0.05) {
      // dotted preview of the first moments of flight
      const sim = { x: p.x, y: p.y, vx: 0, vy: 0, th: aim.ang, stall: 0 };
      const v = this.S.v0 * (0.35 + 0.65 * aim.power);
      sim.vx = Math.cos(aim.ang) * v; sim.vy = Math.sin(aim.ang) * v;
      g.fillStyle = 'rgba(255,255,255,0.9)';
      for (let i = 0; i < 70; i++) {
        const f = this.aero(sim, false, 1 / 30);
        sim.vx += f.ax / 30; sim.vy += f.ay / 30; sim.x += sim.vx / 30; sim.y += sim.vy / 30;
        if (i % 3 === 0) { g.globalAlpha = 1 - i / 70; g.beginPath(); g.arc(this.sx(sim.x), this.sy(sim.y), 3, 0, TAU); g.fill(); }
        if (sim.y < 0) break;
      }
      g.globalAlpha = 1;
      g.fillStyle = '#fff';
      g.font = '700 16px Fredoka, sans-serif'; g.textAlign = 'center';
      g.fillText(Math.round(aim.power * 100) + '%', X, Y - 34);
    }
    g.restore();
  },
};

// ---------------------------------------------------------------- ui.js (DOM screens)
const FX = {
  parts: [],
  burst(x, y, n, cols) {
    for (let i = 0; i < n; i++) {
      const a = rnd(0, TAU), s = rnd(60, 260);
      this.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, life: 0, max: rnd(0.5, 1.1), c: cols[i % cols.length], r: rnd(0, TAU), vr: rnd(-10, 10), s: rnd(3, 7) });
    }
    if (this.parts.length > 500) this.parts.splice(0, this.parts.length - 500);
  },
  confetti(x, y, n) { this.burst(x, y, n, ['#ff8fb1', '#ffd34d', '#5cc8ff', '#7bd389', '#b48cff', '#ffffff']); },
  update(dt) {
    for (const p of this.parts) { p.life += dt; p.vy += 420 * dt; p.vx *= 1 - 1.5 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt; }
    this.parts = this.parts.filter((p) => p.life < p.max);
  },
  render(g) {
    for (const p of this.parts) {
      g.save();
      g.globalAlpha = 1 - p.life / p.max;
      g.translate(p.x, p.y); g.rotate(p.r); g.scale(1, Math.cos(p.r * 1.3));
      g.fillStyle = p.c; g.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
      g.restore();
    }
  },
};

const UI = {
  E: {},
  init() {
    for (const id of ['top', 'tStars', 'tLevel', 'tXp', 'bSet', 'hangar', 'hName', 'hFold', 'hStats', 'bFly', 'bFold', 'bShop', 'bPlanes', 'bPapers', 'missions', 'bGift',
      'foldui', 'fStep', 'fHint', 'fDots', 'fBack', 'fUndo', 'fAuto', 'hud', 'dDist', 'dBest', 'dStars', 'dHint', 'bGust', 'gN', 'bPause', 'modal', 'toast', 'zone']) this.E[id] = document.getElementById(id);
    const E = this.E;
    E.bFly.onclick = () => Game.flyButton();
    E.bFold.onclick = () => { Sfx.button(); Game.startFold(Save.data.sel.plane); };
    E.bShop.onclick = () => { Sfx.button(); this.showWorkshop(); };
    E.bPlanes.onclick = () => { Sfx.button(); this.showPlanes(); };
    E.bPapers.onclick = () => { Sfx.button(); this.showPapers(); };
    E.bGift.onclick = () => Game.claimGift();
    E.bSet.onclick = () => { Sfx.button(); this.showSettings(); };
    E.fBack.onclick = () => { Sfx.button(); Game.toHangar(); };
    E.fUndo.onclick = () => Fold.undoStep();
    E.fAuto.onclick = () => Fold.autoFold();
    const gust = (e) => { e.preventDefault(); e.stopPropagation(); if (Flight.gust()) this.hudGust(); else Sfx.deny(); };
    E.bGust.addEventListener('pointerdown', gust);
    E.bPause.addEventListener('pointerdown', (e) => { e.stopPropagation(); Game.pause(); });
  },
  show(id, on) { this.E[id].classList.toggle('hidden', !on); },

  // ------------------------------------------------ top bar
  renderTop() {
    const S = Save.data, E = this.E;
    E.tStars.textContent = fmtNum(S.stars);
    E.tLevel.textContent = S.level;
    E.tXp.style.width = Math.min(100, (100 * S.xp) / LEVEL_XP(S.level)) + '%';
  },
  bump(el) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); },

  // ------------------------------------------------ hangar
  showHangar() {
    const S = Save.data, E = this.E, P = PLANE[S.sel.plane];
    this.show('hangar', true); this.show('foldui', false); this.show('hud', false); this.show('top', true);
    E.hName.textContent = P.name;
    const acc = S.folds[P.id];
    E.hFold.textContent = acc === undefined ? 'Not folded yet' : 'Folded · ' + Math.round(acc * 100) + '% accuracy';
    E.bFly.innerHTML = acc === undefined ? 'Fold & fly' : 'Fly!';
    const st = Flight.statsFor(P.id, S.up, acc === undefined ? 0.85 : acc);
    const bar = (label, v, max, cls) => '<div class="sbar ' + cls + '"><span>' + label + '</span><i><b style="width:' + clamp((100 * v) / max, 4, 100) + '%"></b></i></div>';
    E.hStats.innerHTML = bar('Lift', st.liftK, 1.1, 'c1') + bar('Glide', 1 / st.dragK, 6.5, 'c2') + bar('Launch', st.v0, 30, 'c3') + bar('Agility', st.resp, 9, 'c4');
    this.renderMissions();
    E.bGift.classList.toggle('hidden', S.gift === todayKey());
    this.renderTop();
  },
  renderMissions() {
    const S = Save.data;
    this.E.missions.innerHTML = '<div class="mh">Missions</div>' + S.missions.map((m) => {
      const T = MT[m.type], goal = T.goals[Math.min(m.tier, T.goals.length - 1)];
      return '<div class="mi' + (m.done ? ' done' : '') + '"><i>' + (m.done ? '✓' : '○') + '</i><span>' + T.text(goal) + '</span><b>+' + T.reward(goal) + '★</b></div>';
    }).join('');
  },

  // ------------------------------------------------ fold
  showFold() { this.show('hangar', false); this.show('hud', false); this.show('foldui', true); this.show('top', false); },
  foldStep() {
    const E = this.E, F = Fold, n = F.design.steps.length;
    const done = F.step >= n;
    E.fStep.textContent = done ? 'Folding it in half…' : 'Step ' + (F.step + 1) + ' of ' + n;
    E.fHint.textContent = done ? 'Here comes your plane!' : F.design.steps[F.step].hint;
    E.fDots.innerHTML = F.design.steps.map((s, i) => '<i class="' + (i < F.step ? (F.accs[i] >= 0.97 ? 'p' : F.accs[i] >= 0.75 ? 'g' : 'w') : i === F.step ? 'c' : '') + '"></i>').join('');
    E.fUndo.disabled = !F.undo.length || done;
    E.fAuto.disabled = done;
  },
  foldResult(acc, design) {
    const S = Save.data;
    const pct = Math.round(acc * 100);
    const grade = pct >= 97 ? 'Masterful folding!' : pct >= 90 ? 'Beautiful folds!' : pct >= 78 ? 'Nice and neat' : pct >= 60 ? 'A little wobbly' : 'Rough around the edges';
    const box = this.modal('<div class="mt">' + design.name + '</div><div class="big">' + pct + '%</div><div class="sub">' + grade + '</div>' +
      '<p class="note">Neater folds give more lift and steadier flight. You can refold any time.</p>' +
      '<div class="mrow"><button class="btn ghost" id="mRe">Refold</button><button class="btn go" id="mFly">Fly it!</button></div>', 'paper');
    box.querySelector('#mRe').onclick = () => { this.close(); Game.startFold(design.id); };
    box.querySelector('#mFly').onclick = () => { this.close(); Game.fly(); };
  },

  // ------------------------------------------------ flight HUD
  flightStart() {
    this.E.dHint.classList.add('hidden');
    this.hudGust();
  },
  flightHint(text) {
    const h = this.E.dHint;
    h.textContent = text;
    h.classList.remove('hidden');
    clearTimeout(this._fh);
    this._fh = setTimeout(() => h.classList.add('hidden'), 3800);
  },
  showHud() {
    this.show('hangar', false); this.show('foldui', false); this.show('hud', true); this.show('top', false);
    this.E.dHint.classList.remove('hidden');
    this.E.dHint.textContent = 'Pull back anywhere and let go to launch';
    this.E.dBest.textContent = Save.data.best ? 'Best ' + fmtNum(Math.round(Save.data.best)) + ' m' : '';
    this.hudGust();
  },
  hudGust() {
    const n = Flight.run ? Flight.run.gustsLeft : 0;
    this.E.gN.textContent = n;
    this.E.bGust.classList.toggle('hidden', !Flight.S || Flight.S.gusts <= 0);
    this.E.bGust.classList.toggle('empty', n <= 0);
  },
  hudTick() {
    const R = Flight.run;
    if (!R) return;
    const d = Math.round(R.dist);
    if (d !== this._d) { this._d = d; this.E.dDist.textContent = fmtNum(d); }
    const s = R.stars;
    if (s !== this._s) { this._s = s; this.E.dStars.textContent = s; this.bump(this.E.dStars.parentNode); }
  },
  zoneToast(name, bonus) {
    const Z = this.E.zone;
    Z.innerHTML = '<small>Welcome to</small>' + name + '<i>+' + bonus + '★</i>';
    Z.classList.remove('on'); void Z.offsetWidth; Z.classList.add('on');
  },

  // ------------------------------------------------ results
  showResults(r) {

    if (r.bonus) rows += '<div class="rrow"><span>Tricks & bonuses<small>' + r.bonusList.slice(0, 4).join(' · ') + '</small></span><b>+' + r.bonus + '★</b></div>';
    for (const m of r.missions) rows += '<div class="rrow mission"><span>✓ ' + m.text + '</span><b>+' + m.reward + '★</b></div>';
    const box = this.modal('<div class="mt">' + (r.newBest ? 'New best!' : r.crashed ? 'Crash landing!' : r.landed ? 'Smooth landing!' : 'Touchdown!') + '</div>' +
      '<div class="big">' + fmtNum(Math.round(r.dist)) + '<small> m</small></div><div class="sub">' + (r.newBest ? 'Previous best ' + fmtNum(Math.round(r.prevBest)) + ' m' : 'Best ' + fmtNum(Math.round(S.best)) + ' m') + '</div>' +

  showWorkshop() {
