<script>
/*! © 2026 Asaf. All rights reserved. Free to play; not to be copied or claimed as your own. */
(function () {
  'use strict';
  var CFG = {"id": "bug-blockade", "owner": "Asaf", "year": 2026, "mark": "tr", "dx": 0, "dy": 58, "mount": null, "hubCss": null};
  var NOTICE = '© ' + CFG.year + ' ' + CFG.owner;

  // Inside Asaf's Arcade the game runs in a frame of the arcade page: borrow its cloud saves, let it show the notice.
  var hub = null;
  try {
    var P = window.parent;
    if (P && P !== window && P.__ASAF_ARCADE__ && P.__ASAF_ARCADE__.v === 1) hub = P.__ASAF_ARCADE__;
  } catch (e) { hub = null; }
  window.__ASAF_HUB__ = !!hub;
  if (hub) {
    window.__asafClaude = makeClaude(hub, CFG.id);
    if (CFG.hubCss) {
      var hs = document.createElement('style');
      hs.textContent = CFG.hubCss;
      (document.head || document.documentElement).appendChild(hs);
    }
    return;
  }

  // ---- played on its own: a small permanent tag plus a short notice when the game opens
  var css = '' +
    '#asaf-cr{all:initial;position:fixed;z-index:2147483646;display:block;box-sizing:border-box;pointer-events:none;user-select:none;-webkit-user-select:none;' +
    'font:600 10px/1 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;letter-spacing:.04em;color:rgba(255,255,255,.88);' +
    'background:rgba(6,6,16,.52);padding:4px 8px;border-radius:999px;white-space:nowrap;opacity:.82;transition:opacity .7s ease}' +
    '#asaf-cr.asaf-busy{opacity:.14}' +
    '#asaf-cr-toast{all:initial;position:fixed;z-index:2147483647;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));display:block;box-sizing:border-box;' +
    'transform:translateX(-50%);pointer-events:none;user-select:none;-webkit-user-select:none;width:max-content;max-width:min(90vw,430px);' +
    'font:500 12.5px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#fff;text-align:center;' +
    'background:rgba(8,8,20,.9);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:9px 15px;box-shadow:0 10px 30px rgba(0,0,0,.5);' +
    'opacity:0;animation:asafCrIn .45s ease .6s forwards,asafCrOut .6s ease 5.2s forwards}' +
    '#asaf-cr-toast b{all:unset;font-weight:800}' +
    '#asaf-cr-toast i{all:unset;display:block;margin-top:2px;font-size:11.5px;opacity:.78}' +
    '@keyframes asafCrIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}' +
    '@keyframes asafCrOut{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,0)}}';
  var st = document.createElement('style');
  st.id = 'asaf-cr-style';
  st.textContent = css;
  (document.head || document.documentElement).appendChild(st);

  var dx = 6 + (CFG.dx || 0), dy = 6 + (CFG.dy || 0);
  var T = 'top:calc(' + dy + 'px + env(safe-area-inset-top,0px));';
  var B = 'bottom:calc(' + dy + 'px + env(safe-area-inset-bottom,0px));';
  var L = 'left:calc(' + dx + 'px + env(safe-area-inset-left,0px));';
  var R = 'right:calc(' + dx + 'px + env(safe-area-inset-right,0px));';
  var C = 'left:50%;transform:translateX(-50%);';
  var POS = { tl: T + L, tr: T + R, bl: B + L, br: B + R, tc: T + C, bc: B + C };

  var tag = document.createElement('div');
  tag.id = 'asaf-cr';
  tag.setAttribute('role', 'note');
  tag.setAttribute('aria-label', NOTICE + '. All rights reserved.');
  tag.textContent = NOTICE;
  tag.style.cssText = POS[CFG.mark] || POS.br;

  var toast = document.createElement('div');
  toast.id = 'asaf-cr-toast';
  toast.setAttribute('aria-hidden', 'true');
  var b = document.createElement('b'); b.textContent = NOTICE + ' · All rights reserved';
  var i = document.createElement('i'); i.textContent = 'Free to play. Please don’t copy it or claim it as your own.';
  toast.appendChild(b); toast.appendChild(i);
  setTimeout(function () { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 6200);

  function home() {
    if (CFG.mount) { var m = document.querySelector(CFG.mount); if (m) return m; }
    return document.documentElement;
  }
  function mount() {
    var h = home();
    if (tag.parentNode !== h) h.appendChild(tag);
  }
  function start() {
    mount();
    home().appendChild(toast);
    setInterval(mount, 2500);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();

  // fade the tag while someone is actively playing, bring it back when they pause
  var idle = 0;
  function busy() {
    tag.classList.add('asaf-busy');
    clearTimeout(idle);
    idle = setTimeout(function () { tag.classList.remove('asaf-busy'); }, 2600);
  }
  ['pointerdown', 'keydown', 'touchstart', 'wheel'].forEach(function (ev) {
    window.addEventListener(ev, busy, { capture: true, passive: true });
  });

  // ---- cloud saves through the arcade page (strings only cross between the two pages)
  function makeClaude(H, gid) {
    var cache = {};
    function fail(code) { var e = new Error(code || 'unavailable'); e.code = code || 'unavailable'; return e; }
    function call(fn, args) {
      return new Promise(function (res, rej) {
        var p;
        try { p = H[fn].apply(null, [gid].concat(args || [])); } catch (e) { rej(fail('unavailable')); return; }
        Promise.resolve(p).then(function (s) {
          var r;
          try { r = JSON.parse(s); } catch (e) { rej(fail('internal')); return; }
          if (r && r.ok) res(r.v); else rej(fail(r && r.code));
        }, function () { rej(fail('unavailable')); });
      });
    }
    function snap(path, v) {
      var parts = path.split('/');
      return { id: parts[parts.length - 1], exists: v !== null && v !== undefined,
        data: function () { return v === null || v === undefined ? undefined : JSON.parse(JSON.stringify(v)); } };
    }
    function doc(path) {
      return {
        id: path.split('/').pop(), path: path,
        get: function () { return call('get', [path]).then(function (v) { return snap(path, v); }); },
        set: function (data) { return call('set', [path, JSON.stringify(data)]).then(function () {}); }
      };
    }
    function query(path, lim) {
      return {
        path: path,
        limit: function (n) { return query(path, n); },
        doc: function (id) { return doc(path + '/' + id); },
        onSnapshot: function (next, error) {
          var dead = false, off = null;
          function onErr(code) { if (!dead && typeof error === 'function') error(fail(code)); }
          try {
            off = H.watch(gid, path, lim || 0, function (s) {
              if (dead) return;
              var rows; try { rows = JSON.parse(s); } catch (e) { return; }
              var docs = rows.map(function (d) { return snap(path + '/' + d.id, d.v); });
              next({ docs: docs, size: docs.length, empty: !docs.length, forEach: function (f) { docs.forEach(f); } });
            }, onErr);
          } catch (e) { setTimeout(function () { onErr('unavailable'); }, 0); }
          return function () { dead = true; try { if (off) off(); } catch (e) { /* page gone */ } };
        }
      };
    }
    var db = { doc: doc, collection: function (p) { return query(p, 0); } };
    var user = {
      id: function () { return call('uid', []); },
      me: function () { return call('uid', []).then(function (id) { return { id: id }; }); },
      can: function (n) { return call('can', [String(n)]); },
      profiles: function (ids) { return call('profiles', [JSON.stringify(ids || [])]); },
      isOwner: function () { return false; },
      canEdit: function () { return false; }
    };
    return {
      use: function (name) {
        if (!cache[name]) {
          cache[name] = call('ready', [String(name)]).then(function (ok) {
            if (!ok) return null;
            return name === 'db' ? db : name === 'user' ? user : null;
          }, function () { return null; });
        }
        return cache[name];
      }
    };
  }
})();
</script>

:root {
  --ink: #2a2238; --cream: #fff8ec; --cream2: #f6ead2; --red: #e8303f; --pink: #ff8fc7; --yellow: #ffd21f; --green: #3fbf4f; --green2: #2a9a3c; --sky: #2f9bff; --purple: #8a4fd6;
  --dim: #7a6f86; --grass: #7fd35b;
  --head: 'Lilita One', 'Arial Black', Impact, sans-serif;
  --body: 'Baloo 2', 'Rubik', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--grass); color: var(--ink); overflow: hidden; }
body { font: 600 15px/1.35 var(--body); touch-action: none; user-select: none; -webkit-user-select: none; overscroll-behavior: none; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
#cv { position: fixed; inset: 0; display: block; touch-action: none; }
#safeT, #safeB { position: fixed; left: 0; width: 1px; visibility: hidden; pointer-events: none; }
#safeT { top: 0; height: env(safe-area-inset-top, 0px); } #safeB { bottom: 0; height: env(safe-area-inset-bottom, 0px); }
#safeL, #safeR { top: 0; height: 1px; } #safeL { left: 0; width: env(safe-area-inset-left, 0px); } #safeR { right: 0; left: auto; width: env(safe-area-inset-right, 0px); }

/* HUD */
#hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
#hud[hidden] { display: none; }
.hbar { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; gap: 6px; padding: calc(8px + env(safe-area-inset-top, 0px)) calc(8px + env(safe-area-inset-right, 0px)) 0 calc(8px + env(safe-area-inset-left, 0px)); }
.stat { display: inline-flex; align-items: center; gap: 5px; height: 40px; padding: 0 12px 0 6px; border-radius: 99px; background: var(--cream); border: 3px solid var(--ink); box-shadow: 0 3px 0 var(--ink); font: 400 21px/1 var(--head); }
.stat img { width: 30px; height: 30px; }
.stat.lives { color: #d81b60; } .stat.coins { color: #a86a00; padding-left: 8px; } .stat.wave { padding-left: 12px; } .stat.wave small { font: 800 11px var(--body); color: var(--dim); letter-spacing: .06em; }
.stat.lives.hit { animation: hit .45s; }
@keyframes hit { 0%, 100% { transform: none; } 20% { transform: translateX(-5px) scale(1.08); background: #ffd0dc; } 50% { transform: translateX(4px); } 75% { transform: translateX(-2px); } }
.modtag { font: 800 12px/1.2 var(--body); color: #fff; background: var(--purple); border: 2.5px solid var(--ink); border-radius: 99px; padding: 3px 10px; box-shadow: 0 2px 0 var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 30vw; }
#pauseBtn { pointer-events: auto; margin-left: auto; }
.iconbtn { width: 44px; height: 44px; border-radius: 13px; background: var(--cream); border: 3px solid var(--ink); box-shadow: 0 3px 0 var(--ink); font: 400 24px/1 var(--head); display: grid; place-items: center; color: var(--ink); }
.iconbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.wavebtn { pointer-events: auto; min-width: 128px; min-height: 54px; padding: 4px 14px; border-radius: 18px; background: linear-gradient(#5ed86a, var(--green2)); color: #fff; border: 3px solid var(--ink); box-shadow: inset 0 3px 0 rgba(255,255,255,.45), 0 5px 0 var(--ink);
  display: flex; flex-direction: column; align-items: center; justify-content: center; text-shadow: 0 2px 0 rgba(0,0,0,.25); }
.wavebtn b { font: 400 23px/1 var(--head); } .wavebtn small { font: 800 12px/1.2 var(--body); opacity: .95; margin-top: 2px; }
.wavebtn:disabled { background: linear-gradient(#d7cdbd, #b9ad9a); color: #5f5668; text-shadow: none; cursor: default; }
.wavebtn.hot { animation: pulse 1.1s ease-in-out infinite; }
.wavebtn:not(:disabled):active { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink); }
@keyframes pulse { 50% { transform: scale(1.06); } }
.speed { pointer-events: auto; width: 50px; height: 50px; flex: none; border-radius: 15px; background: var(--cream); border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink); font: 400 21px var(--head); }
.speed.fast { background: var(--yellow); }
.speed:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--ink); }
@media (max-width: 440px) { .modtag { display: none; } }

@media (max-width: 360px) { .wavebtn { min-width: 160px; } .stat { padding-right: 9px; font-size: 19px; } }

/* phone held sideways: stats down the left, buttons down the right */
body.side .hbar { flex-direction: column; align-items: stretch; right: auto; bottom: 0; width: calc(116px + env(safe-area-inset-left, 0px)); padding: 8px 0 8px calc(8px + env(safe-area-inset-left, 0px)); gap: 7px; }
body.side .stat { height: 38px; font-size: 19px; }
body.side .modtag { display: none; }
body.side #pauseBtn { margin: auto 0 0; }

body.side #toast { top: 8px; max-width: 48vw; padding: 5px 10px; } body.side #toast b { font-size: 16px; } body.side #toast small { font-size: 12px; } body.side #toast img { width: 30px; height: 30px; }
body.side #banner b { font-size: 34px; } body.side #banner small { font-size: 15px; }

.coin { display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff6b0, #ffd21f 45%, #d99a00); border: 1.5px solid #8a5a00; vertical-align: -2px; flex: none; }
.stat .coin { width: 22px; height: 22px; border-width: 2px; }
.stars { display: inline-flex; gap: 1px; } .stars i { font-style: normal; color: #d8cdb8; } .stars i.on { color: #ffb400; text-shadow: 0 1px 0 var(--ink); }

/* banner and toast */
#banner { position: fixed; left: 50%; top: 32%; z-index: 12; transform: translate(-50%, -50%); text-align: center; pointer-events: none; opacity: 0; }
#banner.on { animation: ban 1.8s ease-out both; }
#banner b { display: block; font: 400 46px/1 var(--head); color: #fff; text-shadow: 0 4px 0 var(--ink), 3px 0 0 var(--ink), -3px 0 0 var(--ink), 0 -3px 0 var(--ink); white-space: nowrap; }
#banner small { display: block; margin-top: 6px; font: 800 18px var(--body); color: #fff; text-shadow: 0 2px 0 var(--ink), 0 0 8px rgba(0,0,0,.5); }
#banner.boss b { color: #ff5a5a; } #banner.gold b { color: var(--yellow); }
@keyframes ban { 0% { opacity: 0; transform: translate(-50%, -50%) scale(1.8); } 15% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -60%); } }
#toast { position: fixed; left: 50%; top: calc(62px + env(safe-area-inset-top, 0px)); transform: translate(-50%, -8px); z-index: 14; display: flex; align-items: center; gap: 10px; pointer-events: none; opacity: 0; transition: opacity .2s, transform .2s;
  background: var(--cream); border: 3px solid var(--ink); border-radius: 16px; padding: 7px 14px 7px 10px; width: max-content; max-width: min(92vw, 420px); box-shadow: 0 4px 0 var(--ink); }
#toast.on { opacity: 1; transform: translate(-50%, 0); }
#toast img { width: 40px; height: 40px; flex: none; }
#toast b { display: block; font: 400 19px/1.1 var(--head); } #toast small { display: block; margin-top: 1px; color: #4a4058; font-weight: 700; font-size: 13px; line-height: 1.25; }
#toast.tip { border-color: var(--sky); box-shadow: 0 4px 0 var(--sky); } #toast.gold b { color: #b07000; } #toast.boss { border-color: var(--red); box-shadow: 0 4px 0 var(--red); } #toast.boss b { color: var(--red); }

/* screens */
#screen { position: fixed; inset: 0; z-index: 20; display: none; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y;
  padding: calc(12px + env(safe-area-inset-top, 0px)) calc(14px + env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) calc(14px + env(safe-area-inset-left, 0px)); }
#screen.on { display: flex; flex-direction: column; align-items: center; gap: 12px; }

}

      case 'flare': {

        if (b) {
          G.flare = { x: b.x, y: b.y, life: 0.9 };
          const bx = b.x, by = b.y;
          this.hurt(b, 3000 * sc, 'beam', t);
          for (const o of G.bugs) if (!o.dead && dist2(o.x, o.y, bx, by) < (2 * CELL) ** 2) { this.hurt(o, 400 * sc, 'beam', t); if (!o.dead) o.burn = { dps: 50 * sc, t: 3, src: t, spread: false }; }
          G.flash = 0.25;
        }
        break;
      }
      case 'party': G.partyT = 10; burst(t.x, t.y, 30, '#ffd21f', 320, 'star'); break;
    }
    G.shake = Math.max(G.shake, 6);
    onEvent('ability', t);
    return true;
  },
  swat(x, y) {
    if (!G || G.over || G.swats <= 0) return false;
    G.swats--;
    const sc = 1 + 0.05 * G.wave;
    for (const b of G.bugs.slice()) {
      if (b.dead || dist2(b.x, b.y, x, y) > 78 * 78) continue;
      this.hurt(b, 320 * sc, 'swat', null);
      if (!b.dead && !b.def.boss) { b.stun = Math.max(b.stun, 0.7); b.stunKind = 'daze'; }
    }
    G.swatFx = { x, y, t: 0.45 };
    G.shake = Math.max(G.shake, 12);
    burst(x, y, 16, '#9be15d', 220, 'goo');
    onEvent('swat');
    return true;
  },

  // ---------- the loop
  update(dt) {
    if (!G || G.paused || G.over) return;
    G.t += dt;
    if (G.partyT > 0) G.partyT -= dt;
    while (G.queue.length && G.queue[0].t <= G.t) {
      const q = G.queue.shift();
      const wi = G.waveInfo[q.wave]; if (wi) wi.left--;
      const b = this.spawnBug(q.type, q.trail, q.wave, 0);
      if (b.def.boss) onEvent('boss', b);
    }
    for (let i = 0; i < G.bugs.length; i++) {
      const b = G.bugs[i];
      if (b.dead) continue;
      let v = b.spd * CELL;
      if (b.slowT > 0) { b.slowT -= dt; v *= 1 - b.slow; if (b.slowT <= 0) b.slow = 0; }
      if (b.def.hop) { b.hopT += dt; const ph = b.hopT % 1.25; b.hopZ = ph < 0.42 ? Math.sin(ph / 0.42 * Math.PI) : 0; v *= ph < 0.42 ? 2.7 : 0.45; }
      if (b.stun > 0) { b.stun -= dt; v = 0; if (b.stun <= 0) { b.stunKind = ''; b.iceVuln = false; } }
      b.d += v * dt; b.ph += v * dt;
      this.place(b);
      if (b.hit > 0) b.hit -= dt;
      if (b.burn && b.burn.t > 0) { b.burn.t -= dt; this.hurt(b, b.burn.dps * dt, 'fire', b.burn.src); if (b.dead) continue; }
      if (b.fizz && b.fizz.t > 0) { b.fizz.t -= dt; this.hurt(b, b.fizz.dps * dt, 'acid', b.fizz.src); if (b.dead) continue; }
      if (b.def.spawn) { b.spawnT -= dt; if (b.spawnT <= 0 && b.d > 80) { b.spawnT = 3.4; for (let k = 0; k < 2; k++) { const a = this.spawnBug(b.def.spawn, b.trail, b.wave, Math.max(0, b.d - 26 - k * 16)); a.off = (k ? 1 : -1) * 14; } onEvent('lay', b); } }
      if (b.rem < 44) this.leak(b);
      if (G.over) return;
    }
    if (G.bugs.some((b) => b.dead)) G.bugs = G.bugs.filter((b) => !b.dead);
    for (const t of G.towers) this.towerStep(t, dt);
    if (G.shots.length) G.shots = G.shots.filter((s) => !this.shotStep(s, dt));
    // water balloons from the barrage
    for (const w of G.balloons) {
      w.t -= dt;
      if (w.t > 0) continue;
      for (const b of G.bugs) if (!b.dead && dist2(b.x, b.y, w.x, w.y) < w.R * w.R) this.hurt(b, w.dmg, 'water', w.src);
      G.rings.push({ x: w.x, y: w.y, r0: 10, r1: w.R, life: 0.35, max: 0.35, c: 'rgba(120,200,255,' });
      burst(w.x, w.y, 8, '#8fd3ff', 170, 'drop');
    }
    if (G.balloons.length) G.balloons = G.balloons.filter((w) => w.t > 0);
    // waves cleared pay a bonus
    for (const k in G.waveInfo) {
      const wi = G.waveInfo[k];
      if (!wi.done && wi.left <= 0 && wi.alive <= 0) {
        wi.done = true; G.cleared++;
        const bonus = 8 + 2 * +k;
        G.coins += bonus;
        onEvent('cleared', +k, bonus);
      }
    }
    // next wave countdown
    if (G.wave > 0 && G.queue.length === 0 && (!G.waves || G.wave < G.waves) && Save.data.settings.auto !== false) {
      if (G.nextT < 0) G.nextT = 14;
      if (G.bugs.length === 0) G.nextT = Math.min(G.nextT, 8);
      G.nextT -= dt;
      if (G.nextT <= 0) { G.nextT = -1; this.callWave(); }
    }
    if (G.waves && G.wave >= G.waves && G.queue.length === 0 && G.bugs.length === 0) this.finish(true);
    stepFx(dt);
  },
  finish(won) {
    if (G.over) return;
    G.over = true; G.state = won ? 'won' : 'lost';
    onEvent('over', won);
  },
};

// ---------- little effects (kept in the game so the fast-forward tests see them too)
const SPLAT = { ant: '#b9e35b', lady: '#ffd36b', hopper: '#9be15d', beetle: '#7fe0c8', snail: '#d6f07a', slug: '#ffcf8a', wasp: '#ffe066', moth: '#e9d7a8', stick: '#c9e07a',
  cat1: '#b6f06a', cat2: '#b6f06a', cat4: '#b6f06a', queen: '#b9e35b', stag: '#7fe0c8', hornet: '#ffe066' };
function fxPush(p) { G.fx.push(p); if (G.fx.length > 420) G.fx.splice(0, G.fx.length - 420); }
function burst(x, y, n, c, sp, k) {
  for (let i = 0; i < n; i++) {
    const a = G.rng() * TAU, v = sp * (0.35 + G.rng() * 0.65);
    fxPush({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - (k === 'drop' || k === 'goo' ? 60 : 0), life: 0.5 + G.rng() * 0.3, max: 0.8, c, s: k === 'star' ? 6 : k === 'goo' ? 5 + G.rng() * 4 : 3 + G.rng() * 3, k });
  }
}
function stepFx(dt) {
  for (const p of G.fx) {
    p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt;
    const drag = p.k === 'smoke' ? 0.98 : 0.9;
    p.vx *= Math.pow(drag, dt * 60); p.vy *= Math.pow(drag, dt * 60);
    if (p.k === 'drop' || p.k === 'goo' || p.k === 'dust') p.vy += 260 * dt;
  }
  if (G.fx.length) G.fx = G.fx.filter((p) => p.life > 0);
  for (const t of G.texts) { t.life -= dt; t.y -= 34 * dt; }
  if (G.texts.length) G.texts = G.texts.filter((t) => t.life > 0);
  for (const s of G.splats) s.life -= dt;
  if (G.splats.length && G.splats[0].life <= 0) G.splats = G.splats.filter((s) => s.life > 0);
  for (const z of G.zaps) z.life -= dt;
  if (G.zaps.length) G.zaps = G.zaps.filter((z) => z.life > 0);
  for (const r of G.rings) r.life -= dt;
  if (G.rings.length) G.rings = G.rings.filter((r) => r.life > 0);
  for (const b of G.bolts) { if (b.delay > 0) b.delay -= dt; else b.life -= dt; }
  if (G.bolts.length) G.bolts = G.bolts.filter((b) => b.life > 0);
  for (const t of G.tracers) t.life -= dt;
  if (G.tracers.length) G.tracers = G.tracers.filter((t) => t.life > 0);
  if (G.flare) { G.flare.life -= dt; if (G.flare.life <= 0) G.flare = null; }
  if (G.swatFx) { G.swatFx.t -= dt; if (G.swatFx.t <= -0.6) G.swatFx = null; }
  G.rain = Math.max(0, G.rain - dt); G.flash = Math.max(0, G.flash - dt);
  G.shake = Math.max(0, G.shake - dt * 30); G.cakeHit = Math.max(0, G.cakeHit - dt);
}

// ---------- a robot player: plays the title-screen demo, and the tests use it to check every level can be won
const Bot = {
  cache: new Map(),
  // good places to stand: open grass that sees a lot of trail
  spots(range) {
    const key = G.L.id + ':' + (G.L.daily || 0) + ':' + range.toFixed(1);
    if (this.cache.has(key)) return this.cache.get(key);
    const out = [], R2 = (range * CELL) ** 2;
    for (let y = 20; y < FH; y += 20) for (let x = 20; x < FW; x += 20) {
      if (!maskFree(G.M, x, y)) continue;
      let n = 0;
      for (const T of G.M.trails) for (let i = 0; i < T.n; i += 3) { const dx = T.x[i] - x, dy = T.y[i] - y; if (dx * dx + dy * dy < R2) n++; }
      out.push([x, y, n]);
    }
    out.sort((a, b) => b[2] - a[2]);
    this.cache.set(key, out);
    return out;
  },
  spotFor(type) {
    const T = TOWERS[type];
    if (T.farm) { const l = this.spots(1.0); for (let i = l.length - 1; i >= 0; i--) if (Game.canPlace(l[i][0], l[i][1])) return l[i]; return null; }
    for (const s of this.spots(Math.round(T.base.range * 10) / 10)) if (Game.canPlace(s[0], s[1])) return s;
    return null;
  },
  PLAN: {
    squirt: [[0, 1], [0, 2], [1, 1], [0, 3], [1, 2], [0, 4]], sling: [[1, 1], [1, 2], [0, 1], [0, 2], [1, 3], [1, 4]],
    sprinkler: [[2, 1], [2, 2], [0, 1], [0, 2], [0, 3], [0, 4]], bubble: [[0, 1], [0, 2], [1, 1], [1, 2], [0, 3], [0, 4]],
    zapper: [[1, 1], [1, 2], [2, 1], [2, 2], [1, 3], [1, 4]], sun: [[1, 1], [1, 2], [0, 1], [0, 2], [1, 3], [1, 4]], lemon: [[0, 1], [0, 2], [2, 1], [2, 2], [0, 3], [0, 4]],
  },
  ORDER: ['squirt', 'sling', 'squirt', 'sprinkler', 'bubble', 'zapper', 'sun', 'sling', 'zapper', 'squirt', 'sun', 'sprinkler', 'sling', 'zapper', 'sun', 'bubble'],
  nextOf(t) { for (const [p, tier] of this.PLAN[t.type]) if (t.path[p] < tier) return pathOpen(t.path, p) ? p : -1; return -1; },
  think(skill) {
    if (!G || G.over) return;
    skill = skill || 1;
    const L = G.L, avail = L.towers, w = Math.max(1, G.wave), live = G.bugs.filter((b) => !b.dead);
    if (G.wave === 0 && G.towers.length && G.t > 4) Game.callWave();
    for (const t of G.towers) if (t.ab && t.ab.cd <= 0 && (live.length >= 10 || live.some((b) => b.def.boss))) Game.useAbility(t);
    if (G.swats > 0) { const b = live.find((x) => x.def.boss && x.rem < 300) || (G.lives < 8 && live.find((x) => x.rem < 220)); if (b) Game.swat(b.x, b.y); }
    const has = (k) => G.towers.filter((t) => t.type === k).length;
    const fighters = G.towers.filter((t) => !TOWERS[t.type].farm);
    // hidden bugs on the way: make sure something can see them
    const camoSoon = Object.keys(L.bugs).some((k) => BUGS[k].camo && L.bugs[k] <= w + 2);
    if (camoSoon && !G.towers.some((t) => t.S.camo || t.camoBuff)) {
      if (avail.indexOf('sun') >= 0 && G.coins >= TOWERS.sun.cost) { const s = this.spotFor('sun'); if (s) { Game.build('sun', s[0], s[1]); return; } }
      const sq = G.towers.find((t) => t.type === 'squirt' && pathOpen(t.path, 1) && t.path[1] < 2);
      if (sq) { if (G.coins >= nextUp(sq, 1).cost) Game.upgrade(sq, 1); return; }
      if (avail.indexOf('squirt') >= 0 && G.coins >= 50) { const s = this.spotFor('squirt'); if (s) Game.build('squirt', s[0], s[1]); return; }
    }
    // flyers need gadgets that reach the air
    const flyers = Object.keys(L.bugs).some((k) => BUGS[k].fly && L.bugs[k] <= w + 2);
    const air = fighters.filter((t) => t.S.air).length, needAir = flyers ? Math.min(4, 1 + Math.floor(w / 5)) : 0;
    // a lemonade stand or two pays for itself
    const farms = has('lemon'), wantFarms = avail.indexOf('lemon') >= 0 && w >= 3 ? (w >= 14 ? 3 : w >= 8 ? 2 : 1) : 0;
    if (farms < wantFarms && fighters.length >= 3) { if (G.coins >= TOWERS.lemon.cost) { const s = this.spotFor('lemon'); if (s) { Game.build('lemon', s[0], s[1]); return; } } else if (G.queue.length || G.bugs.length < 12) return; }
    const want = Math.min(12, Math.round((2 + w * 0.35) * skill));
    let type = null;
    if (needAir > air) type = ['squirt', 'zapper', 'bubble', 'sun'].find((k) => avail.indexOf(k) >= 0 && (k !== 'sun' || G.coins > 200));
    else if (fighters.length < want) {
      const counts = {};
      for (const t of fighters) counts[t.type] = (counts[t.type] || 0) + 1;
      const used = {};
      for (const k of this.ORDER) { if (avail.indexOf(k) < 0) continue; used[k] = (used[k] || 0) + 1; if ((counts[k] || 0) < used[k]) { type = k; break; } }
      if (!type) type = this.ORDER.filter((k) => avail.indexOf(k) >= 0)[fighters.length % 4];
    }
    if (type) {
      const s = this.spotFor(type);
      if (s && G.coins >= TOWERS[type].cost) { Game.build(type, s[0], s[1]); return; }
      if (s && fighters.length < 2) return;
    }
    // otherwise buy the next upgrade that gives the most for its price
    let best = null, bp = -1, bv = 0;
    for (const t of G.towers) {
      const p = this.nextOf(t);
      if (p < 0) continue;
      const u = nextUp(t, p);
      if (u.cost > G.coins) continue;
      const cov = TOWERS[t.type].farm ? 60 : (this.spots(Math.round(t.S.range * 10) / 10).find((s) => Math.abs(s[0] - t.x) < 11 && Math.abs(s[1] - t.y) < 11) || [0, 0, 40])[2];
      // bigger upgrades are worth more than their price suggests
      const v = (cov + 20) * (1 + t.path[p] * 0.9) / u.cost;
      if (v > bv) { bv = v; best = t; bp = p; }
    }
    if (best && (!type || G.coins > 400)) Game.upgrade(best, bp);
    const cheapest = Math.min(...avail.filter((k) => !TOWERS[k].farm).map((k) => TOWERS[k].cost));
    if (G.wave === 0 && (fighters.length >= 2 || G.coins < cheapest)) Game.callWave();
  },
};

// ---------------------------------------------------------------- sprites.js (bugs, towers, scenery and icons, all drawn in code)
// Everything is seen from above. Bugs face right (+x) and are turned to their heading when drawn.
const INK = '#2a2238', RS = 2;
const SPR = { bug: {}, flash: {}, base: {}, turret: {}, deco: {}, icon: {}, icon2: {}, bugIcon: {} };
function mkS(w, h, fn) {
  const c = document.createElement('canvas');
  c.width = Math.ceil(w * RS); c.height = Math.ceil(h * RS);
  const g = c.getContext('2d');
  g.scale(RS, RS); g.translate(w / 2, h / 2); g.lineJoin = 'round'; g.lineCap = 'round';
  fn(g);
  return { c, w, h };
}
function ell(g, x, y, rx, ry, fill, lw, rot) {
  g.beginPath(); g.ellipse(x, y, rx, ry, rot || 0, 0, TAU);
  if (fill) { g.fillStyle = fill; g.fill(); }
  if (lw !== 0) { g.lineWidth = lw || 2.4; g.strokeStyle = INK; g.stroke(); }
}
function circ(g, x, y, r, fill, lw) { ell(g, x, y, r, r, fill, lw); }
function rrect(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function line(g, pts, w, col, ink) {
  g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]);
  if (ink) { g.lineWidth = w + 2.6; g.strokeStyle = INK; g.stroke(); }
  g.lineWidth = w; g.strokeStyle = col; g.stroke();
}
function shine(g, x, y, rx, ry, a) { g.save(); g.globalAlpha = a || 0.45; ell(g, x, y, rx, ry, '#fff', 0); g.restore(); }

// ---------- bugs
// six legs from the middle, swinging in a tripod gait (f = 0..3)
function legs(g, f, xs, reach, w, col) {
  const sw = Math.sin(f / 4 * TAU);
  for (let i = 0; i < 3; i++) for (const s of [-1, 1]) {
    const sg = (i % 2 ? 1 : -1) * s * sw, bx = xs[i];
    const kx = bx + (i - 1) * 3 + sg * 3, fx = bx + (i - 1) * 7 + sg * 6;
    line(g, [[bx, s * 2], [kx, s * reach * 0.62], [fx, s * reach]], w || 2, col || INK, false);
  }
}
function antenna(g, x, y, len, spread, w) {
  for (const s of [-1, 1]) { g.beginPath(); g.moveTo(x, y + s * 2); g.quadraticCurveTo(x + len * 0.6, y + s * spread * 0.2, x + len, y + s * spread); g.lineWidth = w || 1.8; g.strokeStyle = INK; g.stroke(); }
}
function crown(g, x, y, s) {
  g.save(); g.translate(x, y); g.scale(s, s); g.rotate(Math.PI / 2);
  g.beginPath(); g.moveTo(-7, 3); g.lineTo(-7, -4); g.lineTo(-3.5, 0); g.lineTo(0, -6); g.lineTo(3.5, 0); g.lineTo(7, -4); g.lineTo(7, 3); g.closePath();
  g.fillStyle = '#ffd21f'; g.fill(); g.lineWidth = 1.6; g.strokeStyle = INK; g.stroke();
  circ(g, 0, 0.5, 1.4, '#ff4fa3', 0);
  g.restore();
}
function drawAnt(g, f, o) {
  const k = o.k || 1, body = o.body || '#5b2a1e', hi = o.hi || '#b0583f';
  g.save(); g.scale(k, k);
  legs(g, f, [5, 2, -1], 13, 1.8);
  antenna(g, 13, 0, 9, 8, 1.5);
  ell(g, -10, 0, 9.5, 7.2, body);
  shine(g, -12, -3, 4, 2, 0.3);
  ell(g, -1.5, 0, 2.2, 1.6, body, 1.6);
  ell(g, 3, 0, 5.2, 4, body);
  circ(g, 11, 0, 5.6, body);
  shine(g, 12, -2.2, 1.8, 1.2, 0.55);
  if (o.crown) crown(g, 11, 0, 0.62);
  g.restore();
}
function drawLady(g, f) {
  legs(g, f, [6, 1, -4], 14, 1.8);
  circ(g, 11, 0, 7, '#2a2238', 2);
  circ(g, 14, -3.4, 1.6, '#fff', 0); circ(g, 14, 3.4, 1.6, '#fff', 0);
  circ(g, -1, 0, 14.5, '#ff3b30');
  g.beginPath(); g.moveTo(-15.5, 0); g.lineTo(12.5, 0); g.lineWidth = 2; g.strokeStyle = INK; g.stroke();
  for (const [x, y, r] of [[-7, -7.5, 3.2], [-7, 7.5, 3.2], [3, -8.4, 2.8], [3, 8.4, 2.8], [-12.2, -3.4, 2], [-12.2, 3.4, 2]]) circ(g, x, y, r, INK, 0);
  shine(g, 2, -6, 5, 2.4, 0.45);
}
function drawHopper(g, f, up) {

}
function drawBeetle(g, f, o) {
  const k = o.k || 1, shell = o.shell || '#2f7fa3', dark = o.dark || '#1f5670';
  g.save(); g.scale(k, k);

    for (const s of [-1, 1]) {

  shine(g, -5, -6.5, 7, 2.6, 0.5); shine(g, -5, 6.5, 7, 2.6, 0.2);

function drawSnail(g, f) {

function buildSprites() {
  for (const type in BUG_ART) {
    const [w, h, fn] = BUG_ART[type];
    const frames = type === 'hopper' ? 8 : 4;
    SPR.bug[type] = []; SPR.flash[type] = [];
    for (let f = 0; f < frames; f++) {
      const s = mkS(w, h, (g) => fn(g, f % 4 + (type === 'hopper' && f >= 4 ? 4 : 0)));
      SPR.bug[type].push(s);
      const fl = mkS(w, h, (g) => { g.drawImage(s.c, -w / 2, -h / 2, w, h); g.globalCompositeOperation = 'source-atop'; g.fillStyle = 'rgba(255,255,255,.6)'; g.fillRect(-w / 2, -h / 2, w, h); });
      SPR.flash[type].push(fl);
    }
    SPR.bugIcon[type] = mkS(w, h, (g) => { g.rotate(-Math.PI / 2); fn(g, 1); }).c.toDataURL();
  }
  for (const type of TOWER_IDS) {
    SPR.base[type] = []; SPR.turret[type] = [];
    const top = type !== 'zapper' && type !== 'lemon';
    for (let lv = 0; lv < 3; lv++) {
      SPR.base[type].push(mkS(72, 72, (g) => drawBase(g, type, lv)));
      if (top) SPR.turret[type].push(mkS(type === 'bubble' ? 96 : 72, 72, (g) => drawTurret(g, type, lv, 0)));
    }
    SPR.icon[type] = mkS(72, 72, (g) => { drawBase(g, type, 0); if (top) { g.rotate(-Math.PI / 4); drawTurret(g, type, 0, 0); } }).c.toDataURL();
    SPR.icon2[type] = mkS(72, 72, (g) => { drawBase(g, type, 2); if (top) { g.rotate(-Math.PI / 4); drawTurret(g, type, 2, 0); } }).c.toDataURL();
  }
  for (const type in DECO_SIZE) { const s = DECO_SIZE[type]; SPR.deco[type] = []; for (let k = 0; k < 3; k++) SPR.deco[type].push(mkS(s, s, (g) => drawDeco(g, type, 1 + k * 977))); }
  SPR.cakeIcon = mkS(48, 48, (g) => drawCake(g, 0, 0, 1, 1, 0.5)).c.toDataURL();
  SPR.swatter = mkS(150, 70, (g) => drawSwatter(g));
  SPR.swatIcon = mkS(64, 64, (g) => { g.rotate(-0.8); g.scale(0.5, 0.5); drawSwatter(g); }).c.toDataURL();
}

// ---------- the cake (drawn live: slices vanish as bugs take bites)
function drawCake(g, x, y, frac, k, wob) {
  g.save(); g.translate(x, y); g.scale(k, k);
  ell(g, 0, 4, 36, 34, 'rgba(0,0,0,.18)', 0);
  circ(g, 0, 0, 34, '#ffffff', 2.4);
  circ(g, 0, 0, 29, '#e9eef7', 0);
  const n = 8, left = Math.max(0, Math.ceil(frac * n - 1e-6));
  if (left > 0) {
    const a0 = -Math.PI / 2, a1 = a0 + left / n * TAU;
    const wedge = (r) => { g.beginPath(); if (left < n) g.moveTo(0, 0); g.arc(0, 0, r, a0, a1); if (left < n) g.closePath(); };
    wedge(26); g.fillStyle = '#ff8fc7'; g.fill(); g.lineWidth = 2.4; g.strokeStyle = INK; g.stroke();
    wedge(20); g.fillStyle = '#ffb6dc'; g.fill();
    // cream blobs and cherries on what's left
    for (let i = 0; i < n * 2; i++) {
      const a = a0 + (i + 0.5) / (n * 2) * TAU;
      if (a > a1 - 0.05) break;
      circ(g, Math.cos(a) * 23, Math.sin(a) * 23, 3.6, '#fff', 1.2);
    }
    for (let i = 0; i < n; i++) {
      const a = a0 + (i + 0.5) / n * TAU;
      if (a > a1) break;
      if (i % 2 === 0) { circ(g, Math.cos(a) * 13, Math.sin(a) * 13, 4.2, '#e8202f', 1.6); shine(g, Math.cos(a) * 13 - 1.2, Math.sin(a) * 13 - 1.4, 1.2, 0.8, 0.8); }
    }
    if (left === n) { circ(g, 0, 0, 5, '#ffd21f', 1.6); g.save(); g.globalAlpha = 0.6 + 0.3 * Math.sin(wob * 10); circ(g, 0, -2, 2.4, '#ff8a1f', 0); g.restore(); }
  }
  g.restore();
}

// the fly swatter: a mesh paddle on a long handle (drawn pointing right, paddle at the origin)
function drawSwatter(g) {
  rrect(g, 20, -5, 52, 10, 5); g.fillStyle = '#ff5f7e'; g.fill(); g.lineWidth = 2.6; g.strokeStyle = INK; g.stroke();
  rrect(g, -30, -28, 52, 56, 12); g.fillStyle = '#3aa0ff'; g.fill(); g.lineWidth = 3; g.strokeStyle = INK; g.stroke();
  g.save(); rrect(g, -26, -24, 44, 48, 9); g.clip();
  g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = 1.6;
  for (let i = -30; i < 30; i += 7) { g.beginPath(); g.moveTo(i, -30); g.lineTo(i, 30); g.stroke(); g.beginPath(); g.moveTo(-30, i); g.lineTo(30, i); g.stroke(); }
  g.restore();
}

// the battle tune: a bouncy picnic march in C
const SONG_PLAY = {
  bpm: 112, div: 4, PROG: [[48, 52, 55], [53, 57, 60], [55, 59, 62], [48, 52, 55], [45, 48, 52], [53, 57, 60], [50, 53, 57], [55, 59, 62]],
  MEL: [72, null, 76, 79, null, 76, 74, null, 72, null, 74, 76, null, 74, 72, null],
  play(mx, t, step, spb) {
    const s = step % 16, bar = Math.floor(step / 16) % 8, ch = this.PROG[bar], sec = Math.floor(step / 128) % 2;
    if (s % 8 === 0) mx.kick(t, 0.7);
    if (s % 8 === 4) mx.snare(t, 0.4);
    if (s % 2 === 1) mx.hat(t, 0.35);
    if (s % 4 === 0) mx.bass(t, mtof(ch[0] - 12), spb * 1.6, 0.8, 1200);
    if (s % 4 === 2) mx.bass(t, mtof(ch[2] - 12), spb * 1.4, 0.6, 1200);
    if (s % 4 === 2) mx.bell(t, mtof(ch[1] + 12), spb * 1.2, 0.25);
    const n = this.MEL[s];
    if (n && (sec || bar % 2 === 0)) mx.bell(t, mtof(n + (bar >= 4 ? -3 : 0) + (sec ? 12 : 0) * 0), spb * 2, 0.55);
  },
};
// bosses get something darker
const SONG_BOSS = {
  bpm: 128, div: 4, PROG: [[45, 48, 52], [41, 45, 48], [43, 47, 50], [40, 44, 47]],
  play(mx, t, step, spb) {
    const s = step % 16, bar = Math.floor(step / 16) % 4, ch = this.PROG[bar];
    if (s % 4 === 0) mx.kick(t, 0.9);
    if (s === 4 || s === 12) mx.snare(t, 0.55);
    if (s % 2 === 1) mx.hat(t, 0.4, s === 15);
    mx.bass(t, mtof(ch[0] - 12 + (s % 4 === 3 ? 12 : 0)), spb * 0.9, 0.75, 900);
    if (s % 4 === 0) mx.lead(t, mtof(ch[(s / 4) % 3] + 24), spb * 1.8, 0.35, 'square');
  },
};
const SONG_MENU = {
  bpm: 96, div: 4, PROG: [[48, 52, 55], [45, 48, 52], [53, 57, 60], [55, 59, 62]],
  play(mx, t, step, spb) {
    const s = step % 16, bar = Math.floor(step / 16) % 4, ch = this.PROG[bar];
    if (s === 0 || s === 10) mx.kick(t, 0.45);
    if (s === 4 || s === 12) mx.snare(t, 0.3);
    if (s % 4 === 2) mx.hat(t, 0.3);
    if (s % 4 === 0) mx.bass(t, mtof(ch[0] - 12), spb * 3, 0.55, 800);
    if (s % 2 === 0) mx.bell(t, mtof(ch[(s / 2) % 3] + 12 + (s >= 8 ? 12 : 0)), spb * 2, 0.4);
    if (s === 0) mx.pad(t, ch.map((n) => mtof(n + 12)), spb * 16, 0.6);
  },
};

// ---------------------------------------------------------------- meta.js (stars, perks, records, daily siege, brag codes)
const CODEC = makeCodec('bug-blockade', [['v', 2], ['mode', 2], ['day', 12], ['map', 5], ['wave', 7], ['cake', 6], ['kills', 14], ['stars', 2]]);
const Meta = {
  levelIndex(id) { return LEVELS.findIndex((l) => l.id === id); },
  unlocked(i) { return i === 0 || (Save.data.stars[LEVELS[i - 1].id] || 0) > 0; },
  starsTotal() { let n = 0; for (const L of LEVELS) n += Save.data.stars[L.id] || 0; return n; },
  starsSpent() { let n = 0; for (const p of PERKS) for (let k = 0; k < (Save.data.perks[p.id] || 0); k++) n += PERK_COST[k]; return n; },
  starsFree() { return this.starsTotal() - this.starsSpent(); },
  buyPerk(id) {
    const p = PERKS.find((x) => x.id === id), lv = Save.data.perks[id] || 0;
    if (!p || lv >= p.max || this.starsFree() < PERK_COST[lv]) return false;
    Save.data.perks[id] = lv + 1; Save.data.perksAt = Date.now(); Save.persist();
    return true;
  },
  resetPerks() { Save.data.perks = {}; Save.data.perksAt = Date.now(); Save.persist(); },
  dailyDef() { return dailyLevel(dayIndex()); },
  dailyState() {
    const d = Save.data.daily, idx = dayIndex();
    if (d.idx !== idx) { d.idx = idx; d.best = 0; d.kills = 0; d.tries = 0; d.paid = false; }
    return d;
  },
  starsFor(lives, max) { return lives >= max * 0.9 ? 3 : lives >= max * 0.5 ? 2 : 1; },
  // the battle is over: record it and work out what to show
  finish() {
    const S = Save.data, L = G.L, won = G.state === 'won';
    const res = { mode: G.mode, won, L, wave: G.wave, cleared: G.cleared, kills: G.kills, lives: G.lives, max: G.maxLives, bosses: G.bossKills, stars: 0, newStars: 0, newBest: false };
    S.stats.games++; S.stats.kills += G.kills; S.stats.bosses += G.bossKills; S.stats.towers += G.built; S.stats.waves += G.cleared;
    if (G.mode === 'level') {
      if (won) {
        S.stats.wins++;
        res.stars = this.starsFor(G.lives, G.maxLives);
        const old = S.stars[L.id] || 0;
        if (res.stars > old) { res.newStars = res.stars - old; S.stars[L.id] = res.stars; }
        if (G.lives > (S.cake[L.id] || 0)) S.cake[L.id] = G.lives;
        const i = this.levelIndex(L.id);
        res.next = i + 1 < LEVELS.length ? LEVELS[i + 1] : null;
        res.firstClear = old === 0;
      }
    } else if (G.mode === 'endless') {
      if (G.cleared > (S.endless[L.id] || 0)) { res.newBest = !!S.endless[L.id]; S.endless[L.id] = G.cleared; }
      res.best = S.endless[L.id];
    } else if (G.mode === 'daily') {
      const d = this.dailyState();
      d.tries++;
      if (G.cleared > d.best || (G.cleared === d.best && G.kills > d.kills)) { res.newBest = d.best > 0; d.best = G.cleared; d.kills = G.kills; }
      res.best = d.best;
    }
    Save.persist();
    res.code = this.code(res);
    return res;
  },
  code(res) {
    const mode = res.mode === 'daily' ? 0 : res.mode === 'level' ? 1 : 2;
    const map = res.mode === 'daily' ? 31 : this.levelIndex(res.L.id);
    return CODEC.encode({ v: 1, mode, day: res.mode === 'daily' ? res.L.daily : dayIndex(), map, wave: Math.min(127, res.mode === 'level' ? res.wave : res.cleared), cake: res.lives, kills: Math.min(16383, res.kills), stars: res.stars });
  },
  decode(code) {
    const f = CODEC.decode(code);
    if (!f || f.v !== 1 || f.mode > 2 || (f.map > 8 && f.map !== 31) || (f.mode === 0) !== (f.map === 31)) return null;
    const L = f.map === 31 ? dailyLevel(f.day) : LEVELS[f.map];
    return { mode: ['daily', 'level', 'endless'][f.mode], day: f.day, L, wave: f.wave, cake: f.cake, kills: f.kills, stars: f.stars };
  },
  brag(res) {
    const code = res.code;
    if (res.mode === 'daily') return '🐜 Bug Blockade · Daily Siege #' + (res.L.daily + 1) + ' (' + dayLabel(res.L.daily) + ')\n🎂 Held off ' + res.cleared + ' waves · ' + fmtInt(res.kills) + ' bugs squashed\nBeat me: ' + code;
    if (res.mode === 'endless') return '🐜 Bug Blockade · Endless on ' + res.L.name + '\n🎂 Held off ' + res.cleared + ' waves · ' + fmtInt(res.kills) + ' bugs squashed\nBeat me: ' + code;
    return '🐜 Bug Blockade · Level ' + (this.levelIndex(res.L.id) + 1) + ' ' + res.L.name + ' ' + '⭐'.repeat(res.stars) + '\n🎂 Saved the cake with ' + res.lives + '/' + res.max + ' bites left\nBeat me: ' + code;
  },
};

// ---------------------------------------------------------------- input.js (drag gadgets from the bar, tap to select, keys)
const Input = {
  down: null, drag: null, active: false,
  init(cv) {
    cv.addEventListener('pointerdown', (e) => {
      if (!this.active || (e.pointerType === 'mouse' && e.button !== 0)) return;
      this.down = { x: e.clientX, y: e.clientY, t: performance.now(), id: e.pointerId };
      Snd.init();
    });
    cv.addEventListener('pointermove', (e) => {
      if (!this.active || !G || this.drag) return;
      if (e.pointerType === 'mouse') UI.hover(e.clientX, e.clientY);
    });
    const up = (e) => {
      const d = this.down;
      this.down = null;
      if (!d || d.id !== e.pointerId || !this.active || this.drag) return;
      if (Math.hypot(e.clientX - d.x, e.clientY - d.y) > 14 || performance.now() - d.t > 700) return;
      UI.tap(e.clientX, e.clientY);
    };
    cv.addEventListener('pointerup', up);
    cv.addEventListener('pointercancel', () => { this.down = null; });
    // the gadget bar: press and drag onto the grass, or tap it and then tap the grass
    const bar = document.getElementById('tbar');
    bar.addEventListener('pointerdown', (e) => {
      const b = e.target.closest('.tb');
      if (!b || !this.active || !G || G.demo || G.over) return;
      Snd.init();
      const id = b.dataset.id;
      if (b.classList.contains('locked')) {
        Sfx.nope();
        const at = LEVELS.findIndex((L) => L.towers.indexOf(id) >= 0);
        UI.toast(TOWERS[id].name, G.L.ban === id ? 'Out of order today!' : 'Unlocks in level ' + (at + 1), '', 1.8, SPR.icon[id]);
        return;
      }
      e.preventDefault();
      const wasArmed = UI.armed === id;
      UI.arm(id);
      this.drag = { id: e.pointerId, type: id, x: e.clientX, y: e.clientY, moved: false, touch: e.pointerType !== 'mouse', wasArmed };

// ---------------------------------------------------------------- render.js (camera, background, bugs, towers, effects)
// The field is 9 x 14 cells. Tall screens show it upright; wide screens show it turned a quarter to the left.
const Render = {
  cv: null, ctx: null, dpr: 1, W: 0, H: 0, quality: 1, v: { s: 0.5, ox: 0, oy: 0, rot: false }, bg: null, bgFor: null, bgDirty: true,
  hudTop: 58, hudBot: 78, sel: null, preview: null, t: 0,
  init(cv) { this.cv = cv; this.ctx = cv.getContext('2d', { alpha: false }); },
  resize() {

    const st = px('safeT', 'offsetHeight'), sb = px('safeB', 'offsetHeight'), sl = px('safeL', 'offsetWidth'), sr = px('safeR', 'offsetWidth');
    const big = this.W >= 1000 && this.H >= 700, rot = this.W > this.H * 1.08, side = rot, z = side && big ? 1.2 : 1;

  },
  // the field direction that shows as "up" on screen (the field is turned on wide screens)
  upX() { return this.v.rot ? 1 : 0; }, upY() { return this.v.rot ? 0 : -1; },
  toScreen(fx, fy) { const v = this.v; return v.rot ? [v.ox + fy * v.s, v.oy + (FW - fx) * v.s] : [v.ox + fx * v.s, v.oy + fy * v.s]; },

  // the part of the field (and around it) that is on screen

  },

  // ---------- the ground, trails and scenery, drawn once per map and screen size
  renderBg(M) {

    const g = c.getContext('2d'), th = M.theme, B = this.fieldBox(), r = makeRng(M.L.seed * 31 + 7);

    g.lineJoin = 'round'; g.lineCap = 'round';

    g.save(); g.translate(5, 6); rrect(g, bx, by, bw, bh, 10); g.fillStyle = 'rgba(0,0,0,.16)'; g.fill(); g.restore();
    g.save(); rrect(g, bx, by, bw, bh, 10); g.fillStyle = '#fff6f0'; g.fill(); g.clip();

  frame(dt) {

  frameHud(dt) {

    if (this.bannerT > 0) { this.bannerT -= dt; if (this.bannerT <= 0) this.bannerEl.className = ''; }

    const cs = fmtInt(G.coins); if (h.coins.textContent !== cs) h.coins.textContent = cs;
    const wv = G.waves ? Math.max(1, G.wave) + '/' + G.waves : String(Math.max(1, G.wave)); if (h.wave.textContent !== wv) h.wave.textContent = wv;

    let label, sub = '', on = true, hot = false;

// ---------- what the game tells the screen and the speakers
function onEvent(name, a, b) {
  if (!G || G.demo) return;
  switch (name) {
    case 'fire': Sfx.fire(a); break;
    case 'kill': Sfx.squish(a); if (a.def.boss) { vibrate(60); UI.banner(a.def.name + ' squashed!', '+' + Math.round(a.def.reward * G.rewardMul) + ' coins', 'gold', 1.8); if (Snd.mx && Save.data.settings.music && !G.bugs.some((x) => x.def.boss && !x.dead)) Music.start(SONG_PLAY); } break;
    case 'leak': Sfx.chomp(); if (Save.data.settings.haptics) vibrate(a.def.boss ? 120 : 35); UI.h.livesBox.classList.remove('hit'); void UI.h.livesBox.offsetWidth; UI.h.livesBox.classList.add('hit'); break;
    case 'build': Sfx.build(); break;
    case 'ability': Sfx.ability(a.ab.id); UI.banner(ABILITIES[a.ab.id].name + '!', '', 'gold', 1.4); if (Save.data.settings.haptics) vibrate(40); break;
    case 'swat': Sfx.swat(); if (Save.data.settings.haptics) vibrate(50); break;
    case 'income': Sfx.coins(); break;
    case 'upgrade': Sfx.upgrade(); break;
    case 'sell': Sfx.sell(); break;
    case 'lay': Sfx.lay(); break;
    case 'early': UI.toast('+' + a + ' coins', 'for calling the wave early', 'gold', 1.4); Sfx.coins(); break;
    case 'cleared': Sfx.coins(); G.texts.push({ x: G.M.cakeX, y: G.M.cakeY - 50, s: 'Wave ' + a + ' cleared +' + b, c: '#ffffff', life: 1.6, max: 1.6 }); break;
    case 'wave': {
      Sfx.wave();
      const bosses = b.bosses || [];
      if (bosses.length) UI.banner('Wave ' + a, 'Boss: ' + bosses.map((k) => BUGS[k].name).join(' + ') + '!', 'boss', 2.4);
      else UI.banner('Wave ' + a + (G.waves && a === G.waves ? ' · last one!' : ''), '', '', 1.5);
      const fresh = (b.fresh || []).filter((k) => BUG_TIPS[k] && !BUGS[k].boss);
      if (fresh.length) setTimeout(() => UI.toast('New bug: ' + BUGS[fresh[0]].name, BUG_TIPS[fresh[0]], 'tip', 5, SPR.bugIcon[fresh[0]]), 1300);
      break;
    }
    case 'boss': Sfx.boss(); if (Snd.mx && Save.data.settings.music) Music.start(SONG_BOSS); setTimeout(() => G && UI.toast(a.def.name, BUG_TIPS[a.type], 'boss', 4.5, SPR.bugIcon[a.type]), 200); break;
    case 'over':
      if (a) Sfx.win(); else Sfx.lose();
      if (Save.data.settings.haptics) vibrate(a ? [30, 40, 30] : 200);
      UI.closePop(); Input.active = false;
      UI.banner(a ? 'Cake saved!' : 'Oh no, the cake!', '', a ? 'gold' : 'boss', 1.6);
      setTimeout(() => { if (G && G.over && UI.cur === 'game') UI.results(Meta.finish()); }, 1700);
      break;
  }
}

// ---------- the title screen's demo battle

    const L = LEVELS[[0, 2, 4, 6][this.i++ % 4]];

    for (let k = 0; k < 4; k++) Bot.think(0.9);

    if (!G || !G.demo) return;

    if (G.wave > 0 && G.queue.length === 0 && G.nextT > 3) G.nextT = 3;

  },

// a little picture of a map's trails for the menus
const MINI = {};
function miniMap(L) {
  const key = L.id + ':' + (L.daily || 0);
  if (MINI[key]) return MINI[key];
  const c = document.createElement('canvas'), s = 0.16, th = THEMES[L.theme];
  c.width = Math.round(FW * s * 2); c.height = Math.round(FH * s * 2);
  const g = c.getContext('2d'); g.scale(s * 2, s * 2);
  g.fillStyle = th.g1; g.fillRect(0, 0, FW, FH);
  g.fillStyle = th.g2; for (let x = 1; x < COLS; x += 2) g.fillRect(x * CELL, 0, CELL, FH);
  g.lineJoin = 'round'; g.lineCap = 'round';
  for (const [w, col] of [[74, th.edge], [60, th.dirt]]) for (const p of L.paths) {
    g.beginPath(); p.forEach(([x, y], i) => { const [px, py] = cellCenter(x, y); if (i) g.lineTo(px, py); else g.moveTo(px, py); }); g.lineWidth = w; g.strokeStyle = col; g.stroke();
  }
  const e = L.paths[0][L.paths[0].length - 1], [cx, cy] = cellCenter(e[0], e[1]);
  g.beginPath(); g.arc(cx, cy, 44, 0, TAU); g.fillStyle = '#ff8fc7'; g.fill(); g.lineWidth = 10; g.strokeStyle = '#fff'; g.stroke();
  MINI[key] = c.toDataURL();
  return MINI[key];
}

// ---------------------------------------------------------------- main.js (boot + fixed-step loop with 1x/2x/3x speed)
const STEP = 1 / 60;
const Perf = {
  acc: 0, n: 0, level: 0,
  sample(dt) {
    if (!G || G.demo || G.paused) { this.acc = 0; this.n = 0; return; }
    this.acc += dt; this.n++;
    if (this.n >= 150) {
      const avg = this.acc / this.n; this.acc = 0; this.n = 0;
      if (avg > 0.024 && this.level < 2) { this.level++; Render.quality = this.level === 1 ? 0.8 : 0.62; Render.resize(); }
    }
  },
};
function boot() {
  Save.load();
  buildSprites();
  const cv = document.getElementById('cv');
  Render.init(cv); Render.resize();
  Input.init(cv);
  UI.init();
  Snd.muted = () => !G || G.demo;
  window.addEventListener('resize', () => { Render.resize(); if (UI.popKind) UI.closePop(); });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { Save.persistLocal(); if (G && !G.demo && !G.over && UI.cur === 'game') UI.pauseMenu(); if (Snd.ac) Snd.ac.suspend().catch(() => {}); }
    else if (Snd.ac) Snd.ac.resume().catch(() => {});
  });
  const wake = () => { Snd.init(); if (!Music.on && Snd.mx) Music.start(UI.cur === 'game' || UI.cur === 'pause' ? SONG_PLAY : SONG_MENU); };
  window.addEventListener('pointerdown', wake, { capture: true });
  window.addEventListener('keydown', wake, { capture: true });
  Save.onRemote = () => { if (UI.cur === 'title') UI.title(); };
  Save.cloudInit();
  UI.title();
  let last = performance.now(), acc = 0;
  function loop(now) {
    const dt = Math.max(0, Math.min(0.1, (now - last) / 1000));
    last = now;
    if (G && !G.paused && !G.over) {
      acc += dt * (G.speed || 1);
      let n = 0;
      while (acc >= STEP && n < 12) { Game.update(STEP); acc -= STEP; n++; }
      if (n === 12) acc = 0;
    } else { acc = 0; if (G && G.over) stepFx(dt); }
    Demo.frame(dt);
    Render.frame(dt);
    UI.frameHud(dt);
    Sfx.frame();
    Music.pump();
    Perf.sample(dt);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

})();</script>
