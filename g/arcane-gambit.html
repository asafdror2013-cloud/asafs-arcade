// ---------------------------------------------------------------- trials.js (Arcane Trials: checkmate puzzles + a daily trial)
const CHAPTER_NAMES = ['Novice', 'Adept', 'Magus', 'Archmage'];
const Trials = {
  decode(code) {
    const [bs, side, cw, cb, gw, gb] = code.split(' ');
    const map = { P: 1, N: 2, B: 3, R: 4, Q: 5, K: 6, A: 1 | ASC, G: 2 | ASC, C: 3 | ASC, M: 4 | ASC, E: 5 | ASC };
    const S = Chess.fromFEN('8/8/8/8/8/8/8/8 w - - 0 1', { asc: true, arc: true });
    for (let i = 0; i < 64; i++) {
      const ch = bs[i];
      if (ch === '.') { S.b[i] = 0; continue; }
      const up = ch.toUpperCase();
      S.b[i] = map[up] | (ch === up ? 0 : BLK) | MOVED;
    }
    for (let s = 0; s < 64; s++) if (ptype(S.b[s]) === KING) S.kings[pcolor(S.b[s])] = s;
    S.side = side === 'b' ? 1 : 0;
    S.cards = [cw === '-' ? [] : cw.split(','), cb === '-' ? [] : cb.split(',')];
    const g = (x) => (x === '-' ? [] : x.split('').map((c) => 'PNBRQ'.indexOf(c) + 1));
    S.graves = [g(gw), g(gb)];
    S.hist = [Chess.key(S)];
    return S;
  },
  get(ch, i) {
    const r = ch < 0 ? TRIAL_DAILY[i] : TRIAL_CHAPTERS[ch][i];
    return { code: r[0], theme: r[1], sol: { card: r[2] || undefined, f: r[3] < 0 ? undefined : r[3], t: r[4] < 0 ? undefined : r[4], promo: r[5] || undefined }, depth: r[6], ch, idx: i };
  },
  key(ch, i) { return ch + '-' + i; },
  data() { return Save.data.trials; },
  solved(ch, i) { return this.data().solved[this.key(ch, i)] || 0; },
  count(ch) { let n = 0; for (let i = 0; i < TRIAL_CHAPTERS[ch].length; i++) if (this.solved(ch, i)) n++; return n; },
  total() { let n = 0, all = 0; for (let c = 0; c < TRIAL_CHAPTERS.length; c++) { n += this.count(c); all += TRIAL_CHAPTERS[c].length; } return [n, all]; },
  unlocked(ch) { return ch === 0 || this.count(ch - 1) >= Math.min(8, TRIAL_CHAPTERS[ch - 1].length); },
  today() { const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); },
  dayNum() { const d = new Date(); return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5); },
  dailyIdx() { const n = TRIAL_DAILY.length; return ((this.dayNum() * 7) % n + n) % n; },
  dailyDone() { return this.data().daily.last === this.today(); },
  next(t) {
    if (t.ch < 0) return null;
    if (t.idx + 1 < TRIAL_CHAPTERS[t.ch].length) return [t.ch, t.idx + 1];
    if (t.ch + 1 < TRIAL_CHAPTERS.length && this.unlocked(t.ch + 1)) return [t.ch + 1, 0];
    return null;
  },
  label(t) { return t.ch < 0 ? 'Daily Trial' : 'Trial ' + ['I', 'II', 'III', 'IV'][t.ch] + '·' + (t.idx + 1); },
  start(ch, i) {
    const t = this.get(ch, i);
    t.tries = 0; t.hinted = false;
    Game.startTrial(t);
  },
  // called by Game.apply after every action in a trial
  after(m) {
    const G = Game, t = G.trial, S = G.S;
    if (G.over) return;
    const mover = S.side ^ 1;
    if (mover !== G.humanSide) return;           // the defender just replied: the player moves next
    if (t.depth === 2 && G.actions.length === 1 && sameAction(m, t.sol)) {
      // correct first move of a mate in two: the defender picks the reply that leaves the fewest mates
      G.aiBusy = true; UI.updateStatus(); UI.updatePanels();
      G.later(() => {
        if (G.trial !== t) return;
        const reply = this.defend(S);
        G.aiBusy = false;
        if (reply) G.apply(reply); else G.refresh();
      }, 750);
      return;
    }
    this.fail();
  },
  defend(S) {
    let best = null, bestN = Infinity;
    for (const b of Chess.legal(S, true)) {
      const u = Chess.make(S, b);
      let n = 0;
      for (const c of Chess.legal(S, true)) { const u2 = Chess.make(S, c); if (Chess.inCheck(S, S.side) && Chess.legal(S, true).length === 0) n++; Chess.unmake(S, c, u2); }
      Chess.unmake(S, b, u);
      if (n < bestN || (n === bestN && Math.random() < 0.4)) { bestN = n; best = b; }
    }
    return best;
  },
  fail() {
    const G = Game, t = G.trial;
    t.tries++;
    Sfx.deny();
    UI.toast(G.st && G.st.check ? 'Check — but not mate. Try again.' : 'Not checkmate. Try again.', { ms: 1600 });
    G.aiBusy = true;
    G.later(() => { if (G.trial === t) { G.aiBusy = false; G.resetTrial(); } }, 1500);
  },
  win() {
    const G = Game, t = G.trial, d = this.data();
    const flawless = t.tries === 0 && !t.hinted;
    if (t.ch < 0) {
      if (!this.dailyDone()) {
        const y = new Date(); y.setDate(y.getDate() - 1);
        const yk = y.getFullYear() + '-' + pad2(y.getMonth() + 1) + '-' + pad2(y.getDate());
        d.daily.streak = d.daily.last === yk ? d.daily.streak + 1 : 1;
        d.daily.best = Math.max(d.daily.best || 0, d.daily.streak);
        d.daily.last = this.today();
      }
    } else {
      const k = this.key(t.ch, t.idx);
      d.solved[k] = Math.max(d.solved[k] || 0, flawless ? 2 : 1);
    }
    if (this.total()[0] >= 12) Prog.ach('trials');
    if ((d.daily.streak || 0) >= 3) Prog.ach('daily');
    Save.persist();
    return flawless;
  },
  hint() {
    const G = Game, t = G.trial, S = G.S;
    if (!t || G.over) return;
    let m = null;
    if (G.actions.length === 0) m = G.legal.find((x) => sameAction(x, t.sol));
    else for (const x of G.legal) { const u = Chess.make(S, x); const mate = Chess.inCheck(S, S.side) && Chess.legal(S, true).length === 0; Chess.unmake(S, x, u); if (mate) { m = x; break; } }
    if (!m) return;
    t.hinted = true;
    Render.hint = m.card ? (m.f !== undefined ? [m.f] : m.t !== undefined ? [m.t] : []) : [m.f];
    Render.hintT = 0;
    const what = m.card ? 'Cast <b class="sn">' + SPELLS[m.card].name + '</b>' + (m.f !== undefined || m.t !== undefined ? ' — start from the glowing square' : '') : 'Move the glowing piece';
    UI.toast('<span class="tic">' + ICON.crown + '</span><span>' + what + '</span>', { cls: 'spell', color: m.card ? SPELLS[m.card].color : '#7be38f', ms: 3200 });
  },
};

// ---------------------------------------------------------------- game.js (controller: draft, turns, spells, AI, clocks, saves)
const DRAFT_ORDER = [0, 1, 1, 0, 0, 1];
const LEVEL_ELO = { novice: 800, adept: 1300, archmage: 1800 };
const RANKS = [[0, 'Apprentice'], [900, 'Initiate'], [1150, 'Adept'], [1450, 'Magus'], [1750, 'Archmage']];
const MAT = [0, 1, 3, 3, 5, 9, 0];
function rankName(r) { let n = RANKS[0][1]; for (const [v, s] of RANKS) if (r >= v) n = s; return n; }
function compact(m) { const a = {}; if (m.card) a.card = m.card; if (m.f !== undefined) a.f = m.f; if (m.t !== undefined) a.t = m.t; if (m.promo) a.promo = m.promo; return a; }
function sameAction(m, a) {
  if (!m || !a) return false;
  if ((m.card || '') !== (a.card || '')) return false;
  const f1 = m.f === undefined ? -1 : m.f, f2 = a.f === undefined ? -1 : a.f, t1 = m.t === undefined ? -1 : m.t, t2 = a.t === undefined ? -1 : a.t;
  if (m.card === 'swap') return (f1 === f2 && t1 === t2) || (f1 === t2 && t1 === f2);
  return f1 === f2 && t1 === t2 && (m.promo || 0) === (a.promo || 0);
}

// Runs the engine search in a Web Worker so the board keeps animating; falls back to the main thread.
const AIRunner = {
  w: null, id: 0, cb: null, timer: 0, busy: false,
  init() {
    if (this.w) return;
    try {
      const url = URL.createObjectURL(new Blob([WORKER_SRC], { type: 'text/javascript' }));
      const w = new Worker(url);
      w.onmessage = (e) => {
        const d = e.data;
        if (d.id !== this.id || !this.cb) return;
        clearTimeout(this.timer);
        const cb = this.cb; this.cb = null; this.busy = false;
        cb(d.m);
      };
      w.onerror = (e) => { console.warn('[chess] worker failed, using main thread', e && e.message); this.kill(); this.w = false; };
      this.w = w;
    } catch (e) { console.warn('[chess] no worker:', e && e.message); this.w = false; }
  },
  kill() { if (this.w) { try { this.w.terminate(); } catch (e) { /* ignore */ } } this.w = null; },
  choose(S, level, cb) {
    const id = ++this.id;
    const state = Chess.clone(S);
    state.hist = [];
    this.busy = true;
    if (this.w === null) this.init();
    if (this.w) {
      this.cb = cb;
      this.w.postMessage({ id, S: state, level });
      clearTimeout(this.timer);
      this.timer = setTimeout(() => {
        if (this.id !== id || !this.cb) return;
        const c = this.cb; this.cb = null;
        console.warn('[chess] worker timeout');
        this.kill(); this.w = false;
        this.sync(id, state, level, c);
      }, 9000);
      return;
    }
    this.sync(id, state, level, cb);
  },
  sync(id, S, level, cb) {
    setTimeout(() => {
      if (id !== this.id) return;
      let m = null;
      try { m = AI.choose(S, level); } catch (e) { console.warn('[chess] ai error', e); }
      this.busy = false;
      if (id === this.id) cb(m && compact(m));
    }, 40);
  },
  cancel() {
    this.id++;
    clearTimeout(this.timer);
    if (this.cb && this.w) { this.kill(); }   // abandon the running search; a fresh worker starts next time
    this.cb = null; this.busy = false;
  },
};

const Game = {
  S: null, cfg: null, phase: 'idle', demo: false, humanSide: 0, deal: [], picks: [[], []], actions: [], legal: [], st: null, over: null,
  notes: [], sel: -1, armed: null, armFirst: -1, armOpts: [], promo: null, aiBusy: false, aiToken: 0, clock: null, manualFlip: false, timers: [], caption: '', drafting: false,

  init() { AIRunner.init(); },
  later(fn, ms) { const id = setTimeout(() => { this.timers = this.timers.filter((x) => x !== id); fn(); }, ms); this.timers.push(id); return id; },
  clearTimers() { for (const id of this.timers) clearTimeout(id); this.timers = []; },

  human(side) { if (this.demo || !this.cfg) return false; return this.cfg.mode === 'pvp' || side === this.humanSide; },
  isTrial() { return !!this.cfg && this.cfg.mode === 'trial'; },
  v2() { return !!this.cfg && this.cfg.v === 2; },
  vsAI() { return !!this.cfg && (this.cfg.mode === 'ai' || this.cfg.mode === 'spire' || this.cfg.mode === 'duel' || this.cfg.mode === 'ranked'); },
  aiName() { const c = this.cfg; return c.v === 2 && c.mage ? MAGES[c.mage].name : LEVELS[c.level] ? LEVELS[c.level].name : 'Computer'; },
  aiSpec() { const c = this.cfg; return this.demo ? { tier: 'apprentice', pers: 'balanced' } : c.v === 2 ? { tier: c.tier, pers: c.pers } : c.level; },
  playerName(side) {
    if (this.demo || !this.cfg) return side ? 'Black' : 'White';
    if (this.v2() && this.vsAI()) return side === this.humanSide ? 'You' : this.aiName();
    if (this.cfg.mode === 'ai') return side === this.humanSide ? 'You' : LEVELS[this.cfg.level].name;
    if (this.cfg.mode === 'trial') return side === this.humanSide ? 'You' : 'Defender';
    return side ? 'Black' : 'White';
  },
  canAct() { return this.phase === 'play' && !this.over && !this.aiBusy && !this.promo && !!this.S && this.human(this.S.side) && !UI.paused; },
  material(side) { let n = 0; for (const p of this.S.b) if (p && pcolor(p) === side) n += MAT[ptype(p)]; return n; },

  // ------------------------------------------------ lifecycle
  start(cfg, demo) {
    this.halt();
    this.demo = !!demo;
    if (!demo) Prog.begin();
    this.cfg = JSON.parse(JSON.stringify(cfg));
    if (!this.cfg.seat) this.cfg.seat = 'side';
    this.humanSide = this.vsAI() ? (this.cfg.side === 'b' ? 1 : this.cfg.side === 'r' ? (Math.random() < 0.5 ? 0 : 1) : 0) : 0;
    this.undoUsed = false;
    if (this.v2() && this.vsAI() && this.cfg.mine) {
      // cfg.mine / cfg.theirs: the schools by role; place them by colour
      const s = [this.cfg.mine, this.cfg.theirs];
      this.cfg.schools = this.humanSide === 0 ? s : [s[1], s[0]];
    }
    const ids = CARD_IDS.slice();
    for (let i = ids.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = ids[i]; ids[i] = ids[j]; ids[j] = t; }
    this.deal = this.cfg.arc && !this.v2() ? ids.slice(0, 6) : [];
    this.picks = [[], []];
    const ck = this.cfg.mode === 'pvp' && !this.demo ? CLOCKS[this.cfg.clock] : null;
    this.clock = ck ? { t: [ck[0], ck[0]], inc: ck[1] } : null;
    this.manualFlip = false;
    this.rebuild([]);
    this.begin();
  },
  resume() {
    const rec = Save.data.game;
    if (!rec || !rec.cfg) { UI.showTitle(); return; }
    this.halt();
    Prog.begin();
    this.demo = false;
    this.cfg = JSON.parse(JSON.stringify(rec.cfg));
    if (!this.cfg.seat) this.cfg.seat = 'side';
    this.humanSide = rec.humanSide || 0;
    this.undoUsed = !!rec.undoUsed;
    this.deal = (rec.deal || []).slice();
    this.picks = (rec.picks || [[], []]).map((p) => p.slice());
    const ck = this.cfg.mode === 'pvp' ? CLOCKS[this.cfg.clock] : null;
    this.clock = ck ? { t: rec.clock ? rec.clock.slice() : [ck[0], ck[0]], inc: ck[1] } : null;
    this.manualFlip = false;
    this.rebuild(rec.actions || []);
    this.begin();
  },
  startTrial(t) {
    this.halt();
    Prog.begin();
    this.demo = false;
    this.trial = t;
    this.cfg = { mode: 'trial', level: 'adept', side: 'w', asc: true, arc: true, clock: 'off', seat: 'side' };
    const S = Trials.decode(t.code);
    this.humanSide = S.side;
    this.picks = [S.cards[0].slice(), S.cards[1].slice()];
    this.deal = [];
    this.clock = null;
    this.manualFlip = false;
    Render.hint = [];
    this.rebuild([]);
    this.begin();
    UI.toast(t.depth === 2 ? 'Checkmate in <b>two</b> moves. The defender will reply.' : 'Find the move that gives <b>checkmate</b>.', { ms: 2200 });
  },
  resetTrial() {
    if (!this.isTrial()) return;
    this.halt();
    Render.hint = [];
    this.rebuild([]);
    this.begin();
  },
  halt() {
    this.clearTimers();
    this.aiToken++;
    AIRunner.cancel();
    this.aiBusy = false;
    this.over = null;
  },
  quit() {
    // leave to the title; an unfinished game stays saved for "Continue"
    this.persist();
    this.halt();
    this.phase = 'idle';
    this.demo = false;
    UI.hidePrompts();
    UI.showTitle();
  },
  startState() {
    if (this.isTrial()) return Trials.decode(this.trial.code);
    const S = Chess.newGame({ asc: this.cfg.asc, arc: this.cfg.arc });
    if (this.v2()) { Chess.setup(S, ARENA[this.cfg.arena] || {}, this.cfg.arc ? this.cfg.schools : null); return S; }
    S.cards = [this.picks[0].slice(), this.picks[1].slice()];
    return S;
  },
  rebuild(acts) {
    const S = this.startState();
    const done = [], notes = [];
    for (const a of acts) {
      const L = Chess.legal(S, true);
      const m = L.find((x) => sameAction(x, a));
      if (!m) { console.warn('[chess] replay stopped at', a); break; }
      const n = this.notation(S, m, L);
      Chess.play(S, m);
      if (Chess.inCheck(S, S.side)) n.t += '+';
      done.push(compact(m)); notes.push(n);
    }
    this.S = S;
    this.actions = done;
    this.notes = notes;
    UI.updateLog();
    const last = done[done.length - 1];
    Render.last = last ? this.lastSquares(last) : null;
  },
  begin() {
    this.over = null; this.sel = -1; this.promo = null; this.aiBusy = false; this.caption = ''; this.drafting = false;
    this.armed = null; this.armFirst = -1; this.armOpts = [];
    Render.sel = -1; Render.targets = []; Render.spellTargets = []; Render.spellPick = []; Render.drag = null; Render.checkSq = -1;
    UI.hidePrompts();
    this.flipUpdate();
    Render.reset(this.S);
    const n = this.picks[0].length + this.picks[1].length;
    if (this.cfg.arc && n < 6 && !this.isTrial() && !this.v2()) {
      this.phase = 'draft';
      if (this.demo) {
        for (let i = n; i < 6; i++) this.picks[DRAFT_ORDER[i]].push(this.aiDraft());
        this.S.cards = [this.picks[0].slice(), this.picks[1].slice()];
      } else {
        UI.updatePanels(); UI.updateStatus();
        UI.showDraft();
        this.persist();
        this.draftNext();
        return;
      }
    }
    this.phase = 'play';
    this.persist();
    this.refresh();
    if (!this.over) this.maybeAI();
    if (this.v2() && this.cfg.arc && !this.demo && Save.data.settings.hints && !Save.data.seen.mana) {
      Save.data.seen.mana = 1; Save.persist();
      this.later(() => UI.toast('You gain <b>1 mana</b> every turn. Tap a spell in your panel to cast it — casting uses your turn.', { ms: 5200 }), 700);
    }
  },

  // ------------------------------------------------ draft
  avail() { return this.deal.filter((id) => this.picks[0].indexOf(id) < 0 && this.picks[1].indexOf(id) < 0); },
  aiDraft() { const av = this.avail(); return Math.random() < 0.25 ? av[Math.floor(Math.random() * av.length)] : AI.draftPick(av); },
  draftNext() {
    const n = this.picks[0].length + this.picks[1].length;
    UI.updateDraft();
    UI.updatePanels();
    if (n >= 6) {
      this.later(() => {
        UI.close();
        this.S.cards = [this.picks[0].slice(), this.picks[1].slice()];
        this.phase = 'play';
        this.persist();
        this.refresh();
        this.maybeAI();
        this.firstTips();
      }, 900);
      return;
    }
    const who = DRAFT_ORDER[n];
    if (!this.human(who)) this.later(() => this.draftPick(who, this.aiDraft()), 1000);
  },
  draftTap(id) {
    const n = this.picks[0].length + this.picks[1].length, who = DRAFT_ORDER[n];
    if (this.phase !== 'draft' || n >= 6 || this.drafting || !this.human(who) || this.avail().indexOf(id) < 0) return;
    this.draftPick(who, id);
  },
  draftPick(who, id) {
    this.picks[who].push(id);
    Sfx.draft();
    vibrate(10);
    this.persist();
    this.drafting = true;
    UI.updateDraft(id);
    this.later(() => { this.drafting = false; this.draftNext(); }, 420);
  },
  firstTips() {
    if (!Save.data.settings.hints || Save.data.seen.cards) return;
    Save.data.seen.cards = 1; Save.persist();
    this.later(() => UI.toast('Tap a spell in your panel to cast it. Casting uses your turn.', { ms: 4200 }), 600);
  },

  // ------------------------------------------------ turn flow
  refresh() {
    const S = this.S;
    this.legal = Chess.legal(S, true);
    this.st = Chess.status(S);
    Render.checkSq = this.st.check ? S.kings[S.side] : -1;
    UI.updatePanels();
    UI.updateStatus();
    if (this.st.over && this.phase === 'play') this.finish(this.st);
  },
  // short algebraic notation (with spells) for the chronicle
  notation(S, m, L) {
    const side = S.side, sq = Chess.sqName;
    if (m.card) {
      const nm = SPELLS[m.card].name;
      let t = nm;
      if (m.card === 'leap' || m.card === 'tele') t = nm + ' ' + sq(m.f) + (m.cap ? '×' : '→') + sq(m.t);
      else if (m.card === 'swap') t = nm + ' ' + sq(m.f) + '⇄' + sq(m.t);
      else if (m.t !== undefined) t = nm + ' ' + sq(m.t);
      return { side, t, card: m.card };
    }
    const pt = ptype(m.pc);
    let t;
    if (m.k === 3) t = 'O-O';
    else if (m.k === 4) t = 'O-O-O';
    else {
      let pre = '';
      if (pt === PAWN) pre = m.cap ? 'abcdefgh'[m.f & 7] : '';
      else {
        pre = 'NBRQK'[pt - 2];
        const rivals = L.filter((x) => !x.card && x.t === m.t && x.f !== m.f && x.pc === m.pc);
        if (rivals.length) {
          const sameFile = rivals.some((x) => (x.f & 7) === (m.f & 7)), sameRank = rivals.some((x) => (x.f >> 3) === (m.f >> 3));
          pre += !sameFile ? 'abcdefgh'[m.f & 7] : !sameRank ? String((m.f >> 3) + 1) : sq(m.f);
        }
      }
      t = pre + (m.cap ? '×' : '') + sq(m.t) + (m.promo ? '=' + 'NBRQ'[m.promo - 2] : '');
    }
    const asc = S.opts.asc && m.cap && pt !== KING && !(m.pc & ASC);
    return { side, t, asc };
  },
  lastSquares(a) {
    if (!a.card) return [a.f, a.t];
    if (a.f !== undefined) return [a.f, a.t];
    if (a.t !== undefined) return [a.t];
    return null;
  },
  apply(m, drop) {
    const S = this.S, side = S.side, before = S.b.slice();
    this.armed = null; this.armFirst = -1; this.armOpts = []; this.promo = null;
    this.sel = -1; this.caption = '';
    Render.sel = -1; Render.targets = []; Render.spellTargets = []; Render.spellPick = []; Render.spellArea = []; Render.drag = null; Render.hint = [];
    UI.hidePrompts();
    if (drop && m.f !== undefined) { const sp = Render.spr.get(m.f); if (sp) { sp.x = drop.x; sp.y = drop.y; } }
    const note = this.notation(S, m, this.legal);
    Chess.play(S, m);
    const a = compact(m);
    this.actions.push(a);
    this.notes.push(note);
    Render.animate(S, m, before);
    Render.last = this.lastSquares(a);
    if (m.card) {
      Sfx.cast(SPELLS[m.card].color);
      if (m.card === 'freeze') Sfx.freeze();
      else if (m.card === 'shield') Sfx.shield();
      else if (m.card === 'smite' || m.card === 'inferno') this.later(() => Sfx.smite(), 90);
      else if (m.card === 'wall' || m.card === 'blizzard') Sfx.freeze();
      else if (m.card === 'tele' || m.card === 'rebirth') this.later(() => Sfx.place(false), 200);
      else if (m.card === 'leap') this.later(() => (m.cap ? Sfx.capture() : Sfx.place(false)), 240);
      else if (m.card === 'swap' || m.card === 'rally') this.later(() => Sfx.place(false), 240);
      if (!this.demo) {
        if (this.human(side)) { Save.data.stats.spells++; if (ULTS[m.card] && S.opts.mana) Prog.ach('ult'); }
        if (this.cfg.mode === 'pvp' || !this.human(side)) this.announce(side, m);
      }
    } else if (m.cap) Sfx.capture();
    else Sfx.place(ptype(m.pc) >= ROOK);
    // ascension?
    const src = m.card ? (m.card === 'leap' || m.card === 'tele' ? m.f : m.card === 'ascend' ? m.t : -1) : m.f;
    if (src >= 0 && m.t !== undefined && (S.b[m.t] & ASC) && !(before[src] & ASC)) {
      this.later(() => Sfx.ascend(), m.card === 'ascend' ? 60 : 200);
      if (!this.demo) {
        this.ascNote(side, before[src], S.b[m.t], S.tile[m.t] === TILE_ALTAR && !m.cap);
        if (this.human(side) && S.tile[m.t] === TILE_ALTAR) Prog.ach('altar');
      }
    }
    if (!this.demo && S.opts.mana && this.human(side ^ 1) && S.mana[side ^ 1] >= 6) Prog.ach('full');
    if (this.clock) this.clock.t[side] += this.clock.inc;
    if (!this.demo && App.unlocked) vibrate(m.cap ? 18 : 9);
    if (this.demo && this.actions.length > 220) { this.later(() => this.startDemo(), 1500); this.aiToken++; this.persist(); return; }
    this.persist();
    this.refresh();
    if (this.st.check) note.t += this.st.over && this.st.result === 'checkmate' ? '#' : '+';
    UI.updateLog();
    if (this.over) return;
    if (this.st.check) { this.later(() => Sfx.check(), 180); if (this.human(S.side)) vibrate([0, 25, 40, 25]); }
    if (!this.demo && this.cfg.mode === 'pvp' && this.cfg.seat === 'pass') this.later(() => this.flipUpdate(), 700);
    if (this.isTrial()) { Trials.after(m); return; }
    this.maybeAI();
  },
  announce(side, m) {
    const sp = SPELLS[m.card];
    let what = '';
    const p = m.t !== undefined ? this.S.b[m.t] : 0;
    const nm = (q) => ((q & ASC) ? ASC_NAMES : PIECE_NAMES)[ptype(q)].toLowerCase();
    if (m.card === 'smite') what = ' on a pawn';
    else if (m.card === 'freeze' && p) what = ' on ' + (this.vsAI() ? 'your ' : '') + nm(p);
    else if (m.card === 'shield' && p) what = ' on ' + (this.vsAI() ? 'its ' : '') + nm(p);
    else if ((m.card === 'recall' || m.card === 'rebirth') && p) what = ' — a ' + PIECE_NAMES[ptype(p)].toLowerCase() + ' returns';
    else if (m.card === 'inferno') what = ' and burns a piece';
    else if (m.card === 'shatter') what = ' — frozen pieces break apart';
    else if (m.card === 'wall') what = ' on ' + Chess.sqName(m.t);
    else if (m.card === 'tele' && p) what = ' — ' + nm(p) + ' to ' + Chess.sqName(m.t);
    UI.toast('<span class="tic">' + ICON[m.card] + '</span><span><b>' + this.playerName(side) + '</b> ' + (this.playerName(side) === 'You' ? 'cast' : 'casts') + ' <b class="sn">' + sp.name + '</b>' + what + '</span>', { cls: 'spell', color: sp.color, ms: 2600 });
  },
  ascNote(side, from, to, altar) {
    const t = ptype(to);
    if (this.human(side)) Save.data.stats.asc++;
    UI.toast('<span class="tic">' + ICON.crown + '</span><span>' + (this.vsAI() ? (this.human(side) ? 'Your ' : 'Enemy ') : (side ? 'Black ' : 'White ')) + PIECE_NAMES[ptype(from)].toLowerCase() + (altar ? ' reaches the altar — ' : ' ascends — ') + '<b class="sn">' + ASC_NAMES[t] + '</b></span>', { cls: 'spell', color: '#ffd55c', ms: 2600 });
    if (Save.data.settings.hints && !Save.data.seen.asc) {
      Save.data.seen.asc = 1;
      this.later(() => UI.toast('A piece ascends the first time it captures. The ' + ASC_NAMES[t] + ' ' + ASC_DESC[t] + '.', { ms: 5200 }), 900);
    }
  },
  maybeAI() {
    if (this.phase !== 'play' || this.over || this.human(this.S.side)) return;
    const token = ++this.aiToken, t0 = performance.now();
    this.aiBusy = true;
    UI.updatePanels(); UI.updateStatus();
    const level = this.aiSpec();
    AIRunner.choose(this.S, level, (mv) => {
      if (token !== this.aiToken) return;
      const wait = Math.max(0, (this.demo ? 1200 : 520) - (performance.now() - t0));
      this.later(() => {
        if (token !== this.aiToken || this.over) return;
        this.aiBusy = false;
        const m = (mv && this.legal.find((x) => sameAction(x, mv))) || this.legal[0];
        if (m) this.apply(m); else this.refresh();
      }, wait);
    });
  },
  finish(st) {
    if (this.over) return;
    this.over = st;
    this.phase = 'over';
    this.aiToken++; AIRunner.cancel(); this.aiBusy = false;
    this.armed = null; this.sel = -1; this.promo = null; this.caption = '';
    Render.sel = -1; Render.targets = []; Render.spellTargets = []; Render.spellPick = [];
    UI.hidePrompts();
    UI.updatePanels(); UI.updateStatus();
    if (this.demo) { this.later(() => this.startDemo(), 3500); return; }
    if (this.isTrial()) {
      if (st.result === 'checkmate' && st.winner === this.humanSide) {
        const flawless = Trials.win();
        this.later(() => Sfx.win(), 300);
        vibrate([0, 40, 60, 80]);
        this.later(() => { if (this.over === st) UI.showTrialWin(this.trial, flawless); }, 1100);
      } else { this.over = null; this.phase = 'play'; }   // Trials.after() reports the miss
      return;
    }
    const info = this.record(st);
    Save.data.game = null;
    Save.persist();
    const res = info.res;
    const lost = res === 'loss';
    this.later(() => (lost ? Sfx.lose() : res === 'draw' ? Sfx.draw() : Sfx.win()), 350);
    if (st.result === 'checkmate') vibrate([0, 40, 60, 80]);
    this.later(() => { if (this.over === st) UI.showOver(st, info); }, 1300);
  },
  // cosmetics that are open right now (to report new unlocks after a game)
  looksOpen() { return BOARDS.filter((b) => Prog.boardOpen(b)).map((b) => b.name + ' board').concat(SETS.filter((x) => Prog.setOpen(x)).map((x) => x.name + ' pieces')).concat(SCHOOL_IDS.filter((id) => Prog.schoolOpen(id)).map((id) => SCHOOLS[id].name + ' school')); },
  record2(st, winner) {
    const c = this.cfg, D = Save.data, s = D.stats, S = this.S, me = this.humanSide;
    const before = this.looksOpen();
    if (c.mode === 'pvp') {
      const rec = s.pvp;
      rec[winner === 0 ? 0 : winner === 1 ? 1 : 2]++;
      Prog.ach('pvp');
      return { res: winner === 0 ? 'w' : winner === 1 ? 'b' : 'draw', rec: rec.slice(), unlocks: [] };
    }
    const res = winner === null ? 'draw' : winner === me ? 'win' : 'loss';
    const moves = Math.ceil(this.actions.length / 2), info = { res, moves };
    if (res === 'win') {
      D.wins = (D.wins || 0) + 1;
      Prog.ach('first');
      if (c.arc && SCHOOLS[c.mine]) Prog.ach(c.mine);
      if (moves <= 25) Prog.ach('quick');
      if (!S.graves[me].length) Prog.ach('flawless');
      if (c.tier === 'archmage') Prog.ach('giant');
      const last = this.actions[this.actions.length - 1];
      if (st.result === 'checkmate' && last && last.card) Prog.ach('spellmate');
    }
    if (c.mode === 'spire') {
      const F = SPIRE[c.floor], prev = D.spire.stars[c.floor] || 0;
      let bits = 0;
      if (res === 'win') { bits = 1; if (moves <= F.par) bits |= 2; if (!this.undoUsed) bits |= 4; }
      D.spire.stars[c.floor] = prev | bits;
      Object.assign(info, { floor: c.floor, stars: bits, prevStars: prev });
      if (res === 'win' && D.spire.cleared <= c.floor) { D.spire.cleared = c.floor + 1; info.cleared = true; }
      if (D.spire.cleared >= 4) Prog.ach('floor4');
      if (D.spire.cleared >= 8) Prog.ach('floor8');
      if (D.spire.cleared >= 12) Prog.ach('spire');
      if (Prog.stars() >= 36) Prog.ach('stars');
    } else if (c.mode === 'duel') {
      const r = D.duels[c.mage] || [0, 0, 0];
      r[res === 'win' ? 0 : res === 'loss' ? 1 : 2]++;
      D.duels[c.mage] = r; info.rec = r.slice();
    } else if (c.mode === 'ranked') {
      const R = s.rating || 1000, E = 1 / (1 + Math.pow(10, (TIER_INFO[c.tier].elo - R) / 400));
      const d = Math.round(32 * ((res === 'win' ? 1 : res === 'draw' ? 0.5 : 0) - E));
      s.rating = Math.max(100, R + d);
      s.streak = res === 'win' ? (s.streak || 0) + 1 : 0;
      s.best = Math.max(s.best || 0, s.streak);
      D.ranked.games = (D.ranked.games || 0) + 1;
      D.ranked.peak = Math.max(D.ranked.peak || 0, s.rating);
      if (s.rating >= 1450) Prog.ach('magus');
      Object.assign(info, { d, rating: s.rating, prevRating: R, streak: s.streak });
    }
    const after = this.looksOpen();
    info.unlocks = after.filter((x) => before.indexOf(x) < 0);
    return info;
  },
  record(st) {
    const s = Save.data.stats;
    s.games++;
    const winner = st.winner === 0 || st.winner === 1 ? st.winner : null;
    if (this.v2()) return this.record2(st, winner);
    if (this.cfg.mode === 'ai') {
      const res = winner === null ? 'draw' : winner === this.humanSide ? 'win' : 'loss';
      const rec = s[this.cfg.level];
      rec[res === 'win' ? 0 : res === 'loss' ? 1 : 2]++;
      const R = s.rating || 1000, E = 1 / (1 + Math.pow(10, (LEVEL_ELO[this.cfg.level] - R) / 400));
      const d = Math.round(32 * ((res === 'win' ? 1 : res === 'draw' ? 0.5 : 0) - E));
      s.rating = Math.max(100, R + d);
      s.streak = res === 'win' ? (s.streak || 0) + 1 : 0;
      s.best = Math.max(s.best || 0, s.streak);
      return { res, d, rating: s.rating, rec: rec.slice(), streak: s.streak };
    }
    const rec = s.pvp;
    rec[winner === 0 ? 0 : winner === 1 ? 1 : 2]++;
    return { res: winner === 0 ? 'w' : winner === 1 ? 'b' : 'draw', rec: rec.slice() };
  },
  resign() {
    if (this.phase !== 'play' || this.over) return;
    const loser = this.cfg.mode === 'ai' ? this.humanSide : this.S.side;
    this.finish({ over: true, result: 'resign', winner: loser ^ 1 });
  },
  canUndo() {
    if (this.phase !== 'play' || this.over || this.demo || !this.actions.length || !this.cfg) return false;
    if (this.isTrial()) return !this.aiBusy;
    if (this.cfg.mode === 'pvp') return true;
    for (let k = this.actions.length - 1; k >= 0; k--) if (k % 2 === this.humanSide) return true;
    return false;
  },
  undo() {
    if (!this.canUndo()) { Sfx.deny(); return; }
    if (this.isTrial()) { this.resetTrial(); return; }
    this.halt();
    this.undoUsed = true;
    let k = this.actions.length - 1;
    if (this.cfg.mode === 'ai') while (k >= 0 && k % 2 !== this.humanSide) k--;
    this.rebuild(this.actions.slice(0, k));
    this.sel = -1; this.armed = null; this.armFirst = -1; this.armOpts = []; this.promo = null; this.caption = '';
    Render.sel = -1; Render.targets = []; Render.spellTargets = []; Render.spellPick = []; Render.drag = null;
    UI.hidePrompts();
    this.flipUpdate();
    Render.reset(this.S);
    this.phase = 'play';
    this.persist();
    this.refresh();
    this.maybeAI();
    Sfx.select();
  },
  persist() {
    if (this.demo || !this.cfg || this.isTrial()) return;
    if (this.over || this.phase === 'idle') { if (this.over) Save.data.game = null; }
    else Save.data.game = { cfg: this.cfg, humanSide: this.humanSide, undoUsed: !!this.undoUsed, deal: this.deal, picks: this.picks, actions: this.actions, clock: this.clock ? this.clock.t.map((x) => Math.round(x * 10) / 10) : null };
    Save.persist();
  },
  tick(dt) {
    const c = this.clock;
    if (!c || this.phase !== 'play' || this.over || !this.actions.length || UI.paused || App.hidden) return;
    const side = this.S.side, before = c.t[side];
    c.t[side] -= dt;
    if (before >= 10 && c.t[side] < 10) Sfx.tick();
    if (c.t[side] < 10 && Math.floor(before) !== Math.floor(c.t[side])) Sfx.tick();
    if (c.t[side] <= 0) { c.t[side] = 0; this.finish({ over: true, result: 'time', winner: side ^ 1 }); }
    UI.clocks();
  },
  flipUpdate() {
    let f = false;
    if (!this.demo && this.cfg) {
      if (this.cfg.mode === 'ai' || this.cfg.mode === 'trial') f = this.humanSide === 1;
      else if (this.cfg.seat === 'pass') f = this.S.side === 1;
    }
    if (this.manualFlip) f = !f;
    if (f !== Render.flip) {
      Render.flip = f;
      Render.boardC = null;
      App.layout();
      UI.hidePrompts();
      if (this.armed) this.armView();
      UI.updatePanels();
    }
  },
  startDemo() {
    if (!UI.atTitle) return;
    const pick = (a) => a[Math.floor(Math.random() * a.length)];
    this.start({ v: 2, mode: 'duel', mage: 'pip', tier: 'apprentice', pers: 'balanced', side: 'w', asc: true, arc: true, clock: 'off', seat: 'side', arena: pick(['ley', 'ruins', 'altar', 'spire']), schools: [pick(SCHOOL_IDS), pick(SCHOOL_IDS)] }, true);
  },

  // ------------------------------------------------ input
  down(x, y, touch) {
    if (!this.canAct()) return;
    const sq = Render.sqAt(x, y);
    if (this.armed) { if (sq >= 0) this.spellTap(sq); return; }
    if (sq < 0) { this.deselect(); return; }
    const S = this.S, p = S.b[sq];
    if (this.sel >= 0 && sq !== this.sel && Render.targets.some((t) => t.sq === sq)) { this.tryMove(this.sel, sq); return; }
    if (p && pcolor(p) === S.side) {
      const wasSel = this.sel === sq;
      if (!wasSel) this.select(sq);
      Render.drag = { sq, x, y, x0: x, y0: y, moved: false, wasSel, oy: touch ? -Render.sq * 0.6 : 0 };
      return;
    }
    this.deselect();
  },
  move(x, y) {
    const d = Render.drag;
    if (!d) return;
    d.x = x; d.y = y;
    if (!d.moved && Math.hypot(x - d.x0, y - d.y0) > Math.max(6, Render.sq * 0.2)) d.moved = true;
  },
  up(x, y) {
    const d = Render.drag;
    Render.drag = null;
    if (!d) return;
    if (!d.moved) { if (d.wasSel) this.deselect(); return; }
    const sq = Render.sqAt(x, y + d.oy);
    if (sq >= 0 && sq !== d.sq && Render.targets.some((t) => t.sq === sq)) this.tryMove(d.sq, sq, { x, y: y + d.oy });
  },
  select(sq) {
    const S = this.S, p = S.b[sq];
    this.sel = sq; Render.sel = sq;
    const seen = {};
    Render.targets = [];
    for (const m of this.legal) if (!m.card && m.f === sq && !seen[m.t]) { seen[m.t] = 1; Render.targets.push({ sq: m.t, cap: !!m.cap, asc: S.opts.asc && !!m.cap && !(p & ASC) && ptype(p) !== KING }); }
    if (Render.targets.length) Sfx.select(); else Sfx.deny();
    this.caption = this.pieceCaption(sq);
    UI.updateStatus();
  },
  deselect() {
    if (this.sel < 0 && !this.caption) return;
    this.sel = -1; Render.sel = -1; Render.targets = []; this.caption = '';
    UI.updateStatus();
  },
  pieceCaption(sq) {
    const S = this.S, p = S.b[sq], t = ptype(p);
    if (S.freeze[sq] >= S.ply) return '<span class="cap frz">Frozen</span> — ' + (S.opts.mana ? 'it can’t move, defend or give check' : 'it can’t move this turn');
    if (!Save.data.settings.hints) return '';
    if (p & ASC) return '<b class="gold">' + ASC_NAMES[t] + '</b> — ' + PIECE_NAMES[t].toLowerCase() + ' that ' + ASC_DESC[t];
    if (t !== KING && S.opts.asc) return PIECE_NAMES[t] + ' · its first capture makes it a <b class="gold">' + ASC_NAMES[t] + '</b>';
    return '';
  },
  tryMove(f, t, drop) {
    const ms = this.legal.filter((m) => !m.card && m.f === f && m.t === t);
    if (!ms.length) return;
    if (ms.length > 1 && ms[0].promo) { this.askPromo(ms); return; }
    this.apply(ms[0], drop);
  },
  askPromo(ms) {
    const side = this.S.side, asc = !!(ms[0].pc & ASC) || (this.S.opts.asc && !!ms[0].cap);
    this.promo = ms;
    Render.drag = null;
    UI.promoPicker(side, asc, (pt) => { const m = ms.find((x) => x.promo === pt); this.promo = null; if (m) this.apply(m); }, () => { this.promo = null; UI.hidePrompt(side); });
  },

  // ------------------------------------------------ spells
  cardTap(side, id) {
    App.unlock();
    const S = this.S, own = this.phase === 'play' && !this.over && S.side === side && this.human(side) && !this.aiBusy && !UI.paused;
    const inHand = S.opts.mana ? (SCHOOL_BOOK[S.school[side]] || []).indexOf(id) >= 0 && !(ULTS[id] && S.ult[side]) : S.cards[side].indexOf(id) >= 0;
    if (!own || !inHand || this.promo) { UI.cardInfo(side, id); return; }
    if (S.opts.mana && S.mana[side] < SPELL_COST[id]) {
      Sfx.deny();
      UI.prompt(side, '<span class="pic">' + ICON[id] + '</span><span><b>' + SPELLS[id].name + '</b> needs <b>' + SPELL_COST[id] + ' mana</b>. You have ' + S.mana[side] + ' — you gain 1 every turn.</span>', [{ label: 'OK', cls: 'ghost', fn: () => UI.hidePrompt(side) }], { color: SPELLS[id].color, auto: 3000 });
      return;
    }
    if (this.armed === id) { this.disarm(); Sfx.select(); return; }
    this.arm(id);
  },
  arm(id) {
    const side = this.S.side, opts = this.legal.filter((m) => m.card === id);
    this.sel = -1; Render.sel = -1; Render.targets = []; this.caption = ''; UI.updateStatus();
    if (!opts.length) {
      Sfx.deny();
      UI.prompt(side, '<span class="pic">' + ICON[id] + '</span><span><b>' + SPELLS[id].name + '</b> has no valid target right now.</span>', [{ label: 'OK', cls: 'ghost', fn: () => UI.hidePrompt(side) }], { color: SPELLS[id].color, auto: 2600 });
      return;
    }
    this.armed = id; this.armFirst = -1; this.armOpts = opts;
    Sfx.select();
    this.armView();
    UI.updatePanels();
  },
  armView() {
    const id = this.armed, sp = SPELLS[id], side = this.S.side, opts = this.armOpts;
    Render.spellColor = sp.color;
    const uniq = (a) => Array.from(new Set(a));
    Render.spellPick = this.armFirst >= 0 && id !== 'blizzard' ? [this.armFirst] : [];
    Render.spellArea = [];
    let text;
    const btns = [];
    if (sp.steps === 0) {
      const m = opts[0];
      if (id === 'shatter') {
        const S = this.S, foes = [];
        for (let q = 0; q < 64; q++) { const p = S.b[q]; if (p && pcolor(p) !== side && ptype(p) !== KING && ptype(p) !== QUEEN && S.freeze[q] >= S.ply && S.shield[q] < S.ply) foes.push(q); }
        Render.spellTargets = foes;
        text = 'Every frozen enemy piece shatters (' + foes.length + ').';
      } else if (id === 'rally') {
        const S = this.S, before = S.b.slice(), u = Chess.make(S, m), dest = [];
        for (let s = 0; s < 64; s++) if (S.b[s] && !before[s]) dest.push(s);
        Chess.unmake(S, m, u);
        Render.spellTargets = dest;
        text = 'Every pawn with a free square ahead steps forward.';
      } else {
        Render.spellTargets = [m.t];
        text = 'Your ' + PIECE_NAMES[m.pt].toLowerCase() + ' returns to ' + Chess.sqName(m.t) + '.';
      }
      btns.push({ label: 'Cast', cls: 'gold', fn: () => this.apply(m) });
    } else if (id === 'blizzard') {
      const S = this.S, foes = [];
      for (let q = 0; q < 64; q++) if (S.b[q] && pcolor(S.b[q]) !== side && ptype(S.b[q]) !== KING) foes.push(q);
      if (this.armFirst < 0) { Render.spellTargets = foes; text = 'Tap the centre of the storm. Every enemy piece in the 3×3 area freezes.'; }
      else {
        const c = this.armFirst, area = [];
        for (let dr = -1; dr <= 1; dr++) for (let df = -1; df <= 1; df++) { const f = (c & 7) + df, r = (c >> 3) + dr; if (f >= 0 && f < 8 && r >= 0 && r < 8) area.push(r * 8 + f); }
        Render.spellArea = area; Render.spellTargets = [];
        const m = opts.find((x) => x.t === c);
        text = 'Freeze ' + m.n + ' piece' + (m.n > 1 ? 's' : '') + ' here? Tap again or press Cast.';
        btns.push({ label: 'Cast', cls: 'gold', fn: () => this.apply(m) });
      }
    } else if (sp.steps === 1) {
      Render.spellTargets = uniq(opts.map((m) => m.t));
      text = { shield: 'Choose one of your pieces to shield.', freeze: 'Choose an enemy piece to freeze.', ascend: 'Choose one of your pieces to ascend.', smite: 'Choose an enemy pawn to destroy.', inferno: 'Choose an enemy piece you are attacking.', wall: 'Choose an empty square for the wall.' }[id];
    } else if (this.armFirst < 0) {
      Render.spellTargets = id === 'swap' ? uniq([].concat.apply([], opts.map((m) => [m.f, m.t]))) : uniq(opts.map((m) => m.f));
      text = id === 'leap' ? 'Choose a piece to leap.' : id === 'tele' ? 'Choose a piece to teleport.' : 'Choose the first piece to swap.';
    } else {
      const a = this.armFirst;
      Render.spellTargets = id === 'swap' ? opts.filter((m) => m.f === a || m.t === a).map((m) => (m.f === a ? m.t : m.f)) : opts.filter((m) => m.f === a).map((m) => m.t);
      text = id === 'leap' ? 'Now choose where it lands.' : id === 'tele' ? 'Now choose where it appears.' : 'Now choose the piece to swap with.';
    }
    btns.push({ label: ICON.close, cls: 'ghost icon', fn: () => { this.disarm(); Sfx.select(); } });
    UI.prompt(side, '<span class="pic">' + ICON[id] + '</span><span><b>' + sp.name + '</b> ' + text + '</span>', btns, { color: sp.color });
  },
  spellTap(sq) {
    const id = this.armed, sp = SPELLS[id], opts = this.armOpts;
    if (sp.steps === 0) { if (Render.spellTargets.indexOf(sq) >= 0) this.apply(opts[0]); else Sfx.deny(); return; }
    if (id === 'blizzard') {
      const m = opts.find((x) => x.t === sq);
      if (!m) { Sfx.deny(); return; }
      if (this.armFirst === sq) { this.apply(m); return; }
      this.armFirst = sq; Sfx.select(); this.armView(); return;
    }
    if (sp.steps === 1) { const m = opts.find((x) => x.t === sq); if (m) this.apply(m); else Sfx.deny(); return; }
    const firsts = id === 'swap' ? [].concat.apply([], opts.map((m) => [m.f, m.t])) : opts.map((m) => m.f);
    if (this.armFirst < 0) {
      if (firsts.indexOf(sq) < 0) { Sfx.deny(); return; }
      this.armFirst = sq; Sfx.select(); this.armView(); return;
    }
    const a = this.armFirst;
    if (sq === a) { this.armFirst = -1; Sfx.select(); this.armView(); return; }
    const m = id === 'swap' ? opts.find((x) => (x.f === a && x.t === sq) || (x.t === a && x.f === sq)) : opts.find((x) => x.f === a && x.t === sq);
    if (m) { this.apply(m); return; }
    if (firsts.indexOf(sq) >= 0) { this.armFirst = sq; Sfx.select(); this.armView(); return; }
    Sfx.deny();
  },
  disarm() {
    this.armed = null; this.armFirst = -1; this.armOpts = [];
    Render.spellTargets = []; Render.spellPick = []; Render.spellArea = [];
    UI.hidePrompts();
    UI.updatePanels();
  },
};

// ---------------------------------------------------------------- main.js (boot, canvas, input, loop)
const App = {
  dpr: 1, W: 0, H: 0, unlocked: false, hidden: false, last: 0,
  boot() {
    Save.load();
    Sound.applySettings();
    this.cv = $('#cv');
    this.g = this.cv.getContext('2d');
    Render.init(this.g);
    UI.init();
    Game.init();
    const slot = $('#boardSlot');
    slot.addEventListener('pointerdown', (e) => {
      this.unlock();
      if (e.button > 0) return;
      try { slot.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      Game.down(e.clientX, e.clientY, e.pointerType === 'touch' || e.pointerType === 'pen');
      e.preventDefault();
    });
    slot.addEventListener('pointermove', (e) => Game.move(e.clientX, e.clientY));
    slot.addEventListener('pointerup', (e) => Game.up(e.clientX, e.clientY));
    slot.addEventListener('pointercancel', () => { Render.drag = null; });
    slot.addEventListener('contextmenu', (e) => e.preventDefault());
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (Game.armed) Game.disarm();
        else if (Game.sel >= 0) Game.deselect();
        else if (UI.paused) UI.close();
        else if (!UI.atTitle && Game.phase !== 'idle' && !Game.demo && !UI.ov.classList.contains('on')) UI.showPause();
      }
      if ((e.key === 'z' || e.key === 'Z') && (e.ctrlKey || e.metaKey)) { e.preventDefault(); Game.undo(); }
    });
    window.addEventListener('resize', () => this.layout());
    if (window.visualViewport) window.visualViewport.addEventListener('resize', () => this.layout());
    if (window.ResizeObserver) new ResizeObserver(() => this.layout()).observe(slot);
    document.addEventListener('visibilitychange', () => {
      this.hidden = document.hidden;
      if (document.hidden) Game.persist();
      this.last = performance.now();
    });
    window.addEventListener('pagehide', () => Game.persist());
    document.addEventListener('pointerdown', () => this.unlock(), { capture: true, passive: true });
    Save.onRemote = () => { Sound.applySettings(); Render.boardC = null; if (UI.atTitle && !UI.ov.querySelector('.modal')) UI.showTitle(); };
    Save.cloudInit();
    this.layout();
    UI.showTitle();
    this.last = performance.now();
    requestAnimationFrame((t) => this.loop(t));
  },
  unlock() {
    if (this.unlocked) { if (Sound.ac && Sound.ac.state === 'suspended') Sound.ac.resume().catch(() => {}); return; }
    this.unlocked = true;
    Sound.ensure();
    Sound.applySettings();
    Music.start();
  },
  layout() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    const W = window.innerWidth, H = window.innerHeight;
    if (W !== this.W || H !== this.H || dpr !== this.dpr) {
      this.W = W; this.H = H; this.dpr = dpr;
      this.cv.width = Math.round(W * dpr); this.cv.height = Math.round(H * dpr);
      Render.boardC = null;
    }
    const r = $('#boardSlot').getBoundingClientRect();
    const rect = { left: r.left, top: r.top, width: Math.max(80, r.width), height: Math.max(80, r.height) };
    if (UI.atTitle && W > H && H < 560) {
      // landscape phone: the menu takes the left half, the demo board the right
      const s = Math.min(W * 0.44, H * 0.92);
      rect.left = W * 0.74 - s / 2; rect.top = (H - s) / 2; rect.width = rect.height = s;
    } else if (UI.atTitle) {
      // the demo game sits behind the title, between the logo and the menu
      const lg = $('.title .logo'), mn = $('.title .menu');
      let top = H * 0.2, bot = H * 0.75;
      if (lg && mn) { top = lg.getBoundingClientRect().bottom + 6; bot = mn.getBoundingClientRect().top - 6; }
      const s = Math.max(Math.min(W * 0.96, H * 0.5), Math.min(W * 0.96, bot - top));
      rect.left = (W - s) / 2; rect.top = Math.max(top, (top + bot) / 2 - s / 2); rect.width = rect.height = s;
      if (rect.top + s > H) rect.top = Math.max(0, H - s);
    }
    const key = [rect.left, rect.top, rect.width, rect.height, Render.flip].map((v) => (typeof v === 'number' ? Math.round(v) : v)).join();
    if (key !== this.lkey) { this.lkey = key; Render.boardC = null; }
    Render.layout(W, H, rect);
    UI.place();
  },
  loop(t) {
    requestAnimationFrame((tt) => this.loop(tt));
    const dt = Math.min(0.05, Math.max(0, (t - this.last) / 1000));
    this.last = t;
    if (this.hidden) return;
    Render.update(dt);
    Game.tick(dt);
    const g = this.g;
    g.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    g.clearRect(0, 0, this.W, this.H);
    if (Game.S) Render.draw(Game.S);
  },
};
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => App.boot());
else App.boot();

})();</script>
