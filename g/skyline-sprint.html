<script>
/*! © 2026 Asaf. All rights reserved. Free to play; not to be copied or claimed as your own. */
(function () {
  'use strict';
  var CFG = {"id": "skyline-sprint", "owner": "Asaf", "year": 2026, "mark": "br", "dx": 0, "dy": 0, "mount": null, "hubCss": null};
  var NOTICE = '© ' + CFG.year + ' ' + CFG.owner;

  // Inside Asaf's Arcade the game runs in a frame of the arcade page: borrow its cloud saves, let it show the notice.
  var hub = null;
  try {
    var P = window.parent;
    if (P && P !== window && P.__ASAF_ARCADE__ && P.__ASAF_ARCADE__.v === 1) hub = P.__ASAF_ARCADE__;
  } catch (e) { hub = null; }
  window.__ASAF_HUB__ = !!hub;
  if (hub) {
    window.__asafClaude = makeClaude(hub, CFG.id);
    if (CFG.hubCss) {
      var hs = document.createElement('style');
      hs.textContent = CFG.hubCss;
      (document.head || document.documentElement).appendChild(hs);
    }
    return;
  }

  // ---- played on its own: a small permanent tag plus a short notice when the game opens
  var css = '' +
    '#asaf-cr{all:initial;position:fixed;z-index:2147483646;display:block;box-sizing:border-box;pointer-events:none;user-select:none;-webkit-user-select:none;' +
    'font:600 10px/1 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;letter-spacing:.04em;color:rgba(255,255,255,.88);' +
    'background:rgba(6,6,16,.52);padding:4px 8px;border-radius:999px;white-space:nowrap;opacity:.82;transition:opacity .7s ease}' +
    '#asaf-cr.asaf-busy{opacity:.14}' +
    '#asaf-cr-toast{all:initial;position:fixed;z-index:2147483647;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));display:block;box-sizing:border-box;' +
    'transform:translateX(-50%);pointer-events:none;user-select:none;-webkit-user-select:none;width:max-content;max-width:min(90vw,430px);' +
    'font:500 12.5px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#fff;text-align:center;' +
    'background:rgba(8,8,20,.9);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:9px 15px;box-shadow:0 10px 30px rgba(0,0,0,.5);' +
    'opacity:0;animation:asafCrIn .45s ease .6s forwards,asafCrOut .6s ease 5.2s forwards}' +
    '#asaf-cr-toast b{all:unset;font-weight:800}' +
    '#asaf-cr-toast i{all:unset;display:block;margin-top:2px;font-size:11.5px;opacity:.78}' +
    '@keyframes asafCrIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}' +
    '@keyframes asafCrOut{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,0)}}';
  var st = document.createElement('style');
  st.id = 'asaf-cr-style';
  st.textContent = css;
  (document.head || document.documentElement).appendChild(st);

  var dx = 6 + (CFG.dx || 0), dy = 6 + (CFG.dy || 0);
  var T = 'top:calc(' + dy + 'px + env(safe-area-inset-top,0px));';
  var B = 'bottom:calc(' + dy + 'px + env(safe-area-inset-bottom,0px));';
  var L = 'left:calc(' + dx + 'px + env(safe-area-inset-left,0px));';
  var R = 'right:calc(' + dx + 'px + env(safe-area-inset-right,0px));';
  var C = 'left:50%;transform:translateX(-50%);';
  var POS = { tl: T + L, tr: T + R, bl: B + L, br: B + R, tc: T + C, bc: B + C };

  var tag = document.createElement('div');
  tag.id = 'asaf-cr';
  tag.setAttribute('role', 'note');
  tag.setAttribute('aria-label', NOTICE + '. All rights reserved.');
  tag.textContent = NOTICE;
  tag.style.cssText = POS[CFG.mark] || POS.br;

  var toast = document.createElement('div');
  toast.id = 'asaf-cr-toast';
  toast.setAttribute('aria-hidden', 'true');
  var b = document.createElement('b'); b.textContent = NOTICE + ' · All rights reserved';
  var i = document.createElement('i'); i.textContent = 'Free to play. Please don’t copy it or claim it as your own.';
  toast.appendChild(b); toast.appendChild(i);
  setTimeout(function () { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 6200);

  function home() {
    if (CFG.mount) { var m = document.querySelector(CFG.mount); if (m) return m; }
    return document.documentElement;
  }
  function mount() {
    var h = home();
    if (tag.parentNode !== h) h.appendChild(tag);
  }
  function start() {
    mount();
    home().appendChild(toast);
    setInterval(mount, 2500);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();

  // fade the tag while someone is actively playing, bring it back when they pause
  var idle = 0;
  function busy() {
    tag.classList.add('asaf-busy');
    clearTimeout(idle);
    idle = setTimeout(function () { tag.classList.remove('asaf-busy'); }, 2600);
  }
  ['pointerdown', 'keydown', 'touchstart', 'wheel'].forEach(function (ev) {
    window.addEventListener(ev, busy, { capture: true, passive: true });
  });

  // ---- cloud saves through the arcade page (strings only cross between the two pages)
  function makeClaude(H, gid) {
    var cache = {};
    function fail(code) { var e = new Error(code || 'unavailable'); e.code = code || 'unavailable'; return e; }
    function call(fn, args) {
      return new Promise(function (res, rej) {
        var p;
        try { p = H[fn].apply(null, [gid].concat(args || [])); } catch (e) { rej(fail('unavailable')); return; }
        Promise.resolve(p).then(function (s) {
          var r;
          try { r = JSON.parse(s); } catch (e) { rej(fail('internal')); return; }
          if (r && r.ok) res(r.v); else rej(fail(r && r.code));
        }, function () { rej(fail('unavailable')); });
      });
    }
    function snap(path, v) {
      var parts = path.split('/');
      return { id: parts[parts.length - 1], exists: v !== null && v !== undefined,
        data: function () { return v === null || v === undefined ? undefined : JSON.parse(JSON.stringify(v)); } };
    }
    function doc(path) {
      return {
        id: path.split('/').pop(), path: path,
        get: function () { return call('get', [path]).then(function (v) { return snap(path, v); }); },
        set: function (data) { return call('set', [path, JSON.stringify(data)]).then(function () {}); }
      };
    }
    function query(path, lim) {
      return {
        path: path,
        limit: function (n) { return query(path, n); },
        doc: function (id) { return doc(path + '/' + id); },
        onSnapshot: function (next, error) {
          var dead = false, off = null;
          function onErr(code) { if (!dead && typeof error === 'function') error(fail(code)); }
          try {
            off = H.watch(gid, path, lim || 0, function (s) {
              if (dead) return;
              var rows; try { rows = JSON.parse(s); } catch (e) { return; }
              var docs = rows.map(function (d) { return snap(path + '/' + d.id, d.v); });
              next({ docs: docs, size: docs.length, empty: !docs.length, forEach: function (f) { docs.forEach(f); } });
            }, onErr);
          } catch (e) { setTimeout(function () { onErr('unavailable'); }, 0); }
          return function () { dead = true; try { if (off) off(); } catch (e) { /* page gone */ } };
        }
      };
    }
    var db = { doc: doc, collection: function (p) { return query(p, 0); } };
    var user = {
      id: function () { return call('uid', []); },
      me: function () { return call('uid', []).then(function (id) { return { id: id }; }); },
      can: function (n) { return call('can', [String(n)]); },
      profiles: function (ids) { return call('profiles', [JSON.stringify(ids || [])]); },
      isOwner: function () { return false; },
      canEdit: function () { return false; }
    };
    return {
      use: function (name) {
        if (!cache[name]) {
          cache[name] = call('ready', [String(name)]).then(function (ok) {
            if (!ok) return null;
            return name === 'db' ? db : name === 'user' ? user : null;
          }, function () { return null; });
        }
        return cache[name];
      }
    };
  }
})();
</script>

:root {
  --bg: #1a0f3a; --panel: #24164f; --panel2: #2f1e66; --ink: #0d0820; --pink: #ff4fa3; --cyan: #29d3ff; --yellow: #ffd21f; --orange: #ff8a3d; --green: #3ee08f;
  --text: #ffffff; --dim: #b9a8e6;
  --head: 'Bebas Neue', Impact, 'Arial Narrow', sans-serif;
  --body: 'Rubik', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; }
body { font: 500 15px/1.4 var(--body); touch-action: none; user-select: none; -webkit-user-select: none; overscroll-behavior: none; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--cyan); outline-offset: 2px; }
#cv { position: fixed; inset: 0; display: block; touch-action: none; }

/* HUD */
#hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
#hud[hidden] { display: none; }
.hbar { position: absolute; left: 0; right: 0; top: 0; display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; padding: calc(10px + env(safe-area-inset-top, 0px)) calc(10px + env(safe-area-inset-right, 0px)) 0 calc(10px + env(safe-area-inset-left, 0px)); }
.chip { justify-self: start; display: inline-flex; align-items: center; gap: 7px; height: 40px; padding: 0 14px 0 8px; border-radius: 12px; background: rgba(13,8,32,.62); border: 2px solid rgba(255,210,31,.6); font: 400 26px/1 var(--head); color: var(--yellow); letter-spacing: .03em; }
.dist { text-align: center; }
.dist b { display: block; font: 400 46px/0.95 var(--head); letter-spacing: .03em; text-shadow: 0 3px 0 var(--ink), 0 0 18px rgba(255,79,163,.65); font-variant-numeric: tabular-nums; }
#pows { display: flex; gap: 6px; justify-content: center; margin-top: 6px; }
.pw { position: relative; width: 40px; height: 40px; border-radius: 12px; background: rgba(13,8,32,.65); border: 2px solid var(--c); overflow: hidden; display: grid; place-items: center; }
.pw img { width: 30px; height: 30px; } .pw i { position: absolute; left: 0; bottom: 0; height: 4px; background: var(--c); }
#pauseBtn { pointer-events: auto; justify-self: end; }
.iconbtn { width: 44px; height: 44px; border-radius: 12px; background: rgba(13,8,32,.62); border: 2px solid rgba(255,255,255,.3); font-size: 24px; display: grid; place-items: center; color: #fff; }
#slideBtn { pointer-events: auto; position: absolute; left: calc(16px + env(safe-area-inset-left, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); width: 76px; height: 76px; border-radius: 50%; color: #fff;
  background: rgba(13,8,32,.45); border: 3px solid rgba(41,211,255,.65); display: grid; place-items: center; touch-action: none; }
#slideBtn.on { background: rgba(41,211,255,.55); transform: scale(.94); }
@media (hover: hover) and (pointer: fine) { #slideBtn { display: none; } }
#hint { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); text-align: center; opacity: 0; transition: opacity .25s; }
#hint.on { opacity: 1; animation: breathe 1.4s ease-in-out infinite; }
#hint b { display: block; font: 400 58px/1 var(--head); letter-spacing: .06em; text-shadow: 0 4px 0 var(--ink), 0 0 22px rgba(41,211,255,.8); }
#hint small { display: block; margin-top: 4px; font-weight: 700; text-shadow: 0 2px 4px rgba(0,0,0,.8); }
@keyframes breathe { 50% { transform: translate(-50%, -50%) scale(1.06); } }
#toast { position: fixed; left: 50%; top: calc(118px + env(safe-area-inset-top, 0px)); transform: translate(-50%, -8px); z-index: 12; text-align: center; pointer-events: none; opacity: 0; transition: opacity .2s, transform .2s;
  background: rgba(13,8,32,.82); border: 2px solid rgba(255,255,255,.25); border-radius: 14px; padding: 7px 16px; width: max-content; max-width: 90vw; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }
#toast b { display: block; font: 400 26px/1.05 var(--head); letter-spacing: .03em; } #toast small { display: block; margin-top: 2px; color: var(--dim); font-weight: 600; }
#toast.gold b { color: var(--yellow); } #toast.hot b { color: var(--orange); } #toast.tip { border-color: var(--cyan); } #toast.tip b { color: var(--cyan); }
@media (orientation: landscape) and (max-height: 520px) { .dist b { font-size: 38px; } #toast { top: calc(96px + env(safe-area-inset-top, 0px)); } }

/* screens */
#screen { position: fixed; inset: 0; z-index: 20; display: none; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y;
  padding: calc(12px + env(safe-area-inset-top, 0px)) calc(14px + env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) calc(14px + env(safe-area-inset-left, 0px)); }
#screen.on { display: flex; flex-direction: column; align-items: center; gap: 12px; }
#screen.dim { background: rgba(16,8,40,.78); -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px); }
#screen.dim > * { width: min(560px, 100%); }
#screen.titlescr { background: linear-gradient(rgba(16,8,40,.35), rgba(16,8,40,0) 32%, rgba(16,8,40,0) 48%, rgba(16,8,40,.85)); }
.topbar { display: flex; justify-content: space-between; align-items: center; width: 100%; }
.pill { display: inline-flex; align-items: center; gap: 7px; padding: 5px 14px 5px 8px; border-radius: 99px; background: rgba(13,8,32,.7); border: 2px solid rgba(255,210,31,.55); font: 400 24px/1 var(--head); color: var(--yellow); letter-spacing: .03em; }
.coin { display: inline-block; width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff6b0, #ffd21f 45%, #d99a00); border: 1.5px solid #8a5a00; vertical-align: -3px; flex: none; }
.chip .coin { width: 24px; height: 24px; }
h2 { margin: 4px 0 0; font: 400 46px/1 var(--head); letter-spacing: .03em; color: #fff; text-shadow: 0 3px 0 var(--ink), 0 0 16px rgba(255,79,163,.6); }
.sub { margin: 0; color: var(--dim); font-size: 14px; }
.big { min-height: 62px; width: 100%; border-radius: 16px; padding: 8px 18px; font: 400 34px/1 var(--head); letter-spacing: .04em; color: #fff; background: linear-gradient(100deg, var(--pink), #ff7a59); border: 2px solid rgba(255,255,255,.35);
  box-shadow: 0 0 24px rgba(255,79,163,.45), 0 5px 0 var(--ink); display: flex; align-items: center; justify-content: space-between; gap: 10px; text-align: left; text-shadow: 0 2px 0 rgba(0,0,0,.25); }
.big span { display: flex; flex-direction: column; } .big small, .mid small { font: 600 13px/1.2 var(--body); letter-spacing: 0; opacity: .9; margin-top: 2px; text-shadow: none; }
.big:active, .mid:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink); }
.mid { min-height: 52px; width: 100%; border-radius: 14px; padding: 6px 14px; font: 400 25px/1.05 var(--head); letter-spacing: .04em; background: linear-gradient(#34226e, #26185a); border: 2px solid rgba(41,211,255,.4); box-shadow: 0 4px 0 var(--ink);
  display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.mid span { display: flex; flex-direction: column; text-align: left; }
.mid.daily { align-items: flex-start; background: linear-gradient(90deg, #2a5bd6, #6a2fc4); border-color: rgba(255,255,255,.35); }
.mid.small { min-height: 38px; width: auto; padding: 4px 16px; font-size: 21px; }
.pmini { color: var(--yellow); opacity: 1 !important; }
.link { color: var(--dim); text-decoration: underline; text-underline-offset: 3px; padding: 8px; font-weight: 600; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
.title { width: min(520px, 100%); min-height: 100%; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
.brand { display: flex; flex-direction: column; align-items: center; }
.logo { margin-top: 4vh; display: flex; flex-direction: column; align-items: center; line-height: .82; }
.logo .l1 { font: 400 clamp(64px, 20vw, 118px) var(--head); letter-spacing: .06em; color: #fff; text-shadow: 0 0 2px #fff, 0 0 16px var(--pink), 0 0 34px var(--pink), 0 5px 0 var(--ink); }
.logo .l2 { font: 400 clamp(52px, 16vw, 96px) var(--head); letter-spacing: .3em; margin-left: .3em; color: var(--cyan); text-shadow: 0 0 14px rgba(41,211,255,.9), 0 4px 0 var(--ink); }
.tag { margin: 14px 0 0; font-weight: 600; font-size: 14px; text-shadow: 0 2px 4px #000; }
.menu { width: 100%; display: flex; flex-direction: column; gap: 10px; margin-top: auto; }
.foot { margin: 0; color: var(--dim); font-size: 12px; text-shadow: 0 1px 2px #000; }
@media (orientation: landscape) and (max-height: 540px) {
  .title { width: min(900px, 100%); display: grid; grid-template-columns: 1fr minmax(280px, 380px); grid-template-rows: auto 1fr auto; column-gap: 24px; align-items: center; }
  .title .topbar, .title .foot { grid-column: 1 / -1; } .brand { grid-column: 1; } .menu { grid-column: 2; margin-top: 0; }
  .logo { margin-top: 0; } .logo .l1 { font-size: clamp(54px, 17vh, 96px); } .logo .l2 { font-size: clamp(42px, 13vh, 76px); }
}
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 4px; border-radius: 14px; background: rgba(13,8,32,.6); }
.tabs button { min-height: 40px; border-radius: 10px; font: 400 22px var(--head); letter-spacing: .04em; color: var(--dim); }
.tabs button.on { background: var(--panel2); color: #fff; box-shadow: inset 0 0 0 2px var(--pink); }
.skins { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
@media (min-width: 560px) { .skins { grid-template-columns: repeat(3, 1fr); } }
.skin { display: flex; flex-direction: column; align-items: center; gap: 3px; text-align: center; padding: 10px 8px; border-radius: 16px; background: var(--panel); border: 2px solid rgba(255,255,255,.1); }
.skin.sel { border-color: var(--yellow); box-shadow: 0 0 16px rgba(255,210,31,.3); }
.skin img { width: 80px; height: 90px; } .skin b { font: 400 25px var(--head); letter-spacing: .04em; } .skin small { color: var(--dim); font-size: 12px; min-height: 32px; }
.tag2 { font: 400 20px var(--head); color: var(--yellow); letter-spacing: .04em; }
.buy { display: inline-flex; align-items: center; gap: 6px; min-height: 38px; padding: 0 14px 0 10px; border-radius: 12px; background: linear-gradient(#ffd94a, #ffb21f); color: #2b1a00; font: 700 15px var(--body); border: 2px solid var(--ink); box-shadow: 0 3px 0 var(--ink); }
.buy.poor { background: #3a2c6a; color: #8f80c0; box-shadow: none; }
.ups { display: grid; gap: 10px; }
.up { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 16px; background: var(--panel); }

<script>(function () {

// ---------------------------------------------------------------- kit/util.js (math, seeded random, dates, DOM helpers)
const TAU = Math.PI * 2;

function makeRng(seed) {

}

// missions: three at a time; finishing one pays coins and brings the next, harder one
const MISSIONS = {
  dist: { text: 'Run {n} m in one run', tiers: [300, 600, 1000, 1500, 2200, 3000, 4000, 5500] },

const SAVE_KEY = 'skylinesprint.save.v1';
function defaultSave() {
  return {
    v: 1, coins: 0, skin: 'dash', skins: { dash: true }, upg: { magnet: 0, glider: 0, rocket: 0, double: 0 }, best: 0, bestCoins: 0,
    daily: { idx: -1, best: 0, coins: 0, tries: 0, paid: false },
    mis: { slots: ['dist', 'coins', 'jumps'], tier: {}, done: 0 },
    stats: { runs: 0, meters: 0, coins: 0, jumps: 0, powers: 0 },
    settings: { sound: true, music: true, haptics: true }, seen: {}, updated: 0,

}
function mergeSaves(a, b) {
  const newer = (a.updated || 0) >= (b.updated || 0) ? a : b, older = newer === a ? b : a;
  const out = JSON.parse(JSON.stringify(newer));
  out.best = Math.max(a.best || 0, b.best || 0); out.bestCoins = Math.max(a.bestCoins || 0, b.bestCoins || 0);
  for (const k in older.skins) if (older.skins[k]) out.skins[k] = true;
  for (const k in older.upg) out.upg[k] = Math.max(out.upg[k] || 0, older.upg[k] || 0);
  for (const k in older.stats) out.stats[k] = Math.max(out.stats[k] || 0, older.stats[k] || 0);
  for (const k in older.seen) out.seen[k] = true;

}

// ---------------------------------------------------------------- kit/store.js (localStorage + a cloud copy for the signed-in viewer)
// The game defines SAVE_KEY, defaultSave() and mergeSaves(a, b) before this file.
function deepFill(t, d) {
  for (const k in d) {
    if (t[k] === undefined || t[k] === null) t[k] = JSON.parse(JSON.stringify(d[k]));
    else if (d[k] && typeof d[k] === 'object' && !Array.isArray(d[k]) && typeof t[k] === 'object') deepFill(t[k], d[k]);

}
const Save = {
  data: null, cloud: { ref: null, ready: false, writing: false, pending: false, lastJson: '', failed: 0 }, onRemote: null,
  load() {

  },
  persistLocal() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(this.data)); } catch (e) { /* ignore */ } },
  persist() { this.data.updated = Date.now(); this.persistLocal(); clearTimeout(this._t); this._t = setTimeout(() => this.cloudWrite(), 900); },
  async cloudInit() {

      const [db, user] = await Promise.all([cl.use('db'), cl.use('user')]);
      if (!db || !user) return;
      const id = await user.id();
      if (!id) return;
      const ref = db.doc('data/users/' + id + '/save');
      let timer = 0;
      const snap = await Promise.race([ref.get(), new Promise((_, rej) => { timer = setTimeout(() => rej(new Error('timeout')), 10000); })]);
      clearTimeout(timer);
      this.cloud.ref = ref;

        const body = snap.data();
        if (body && body.save) {
          const remote = deepFill(JSON.parse(JSON.stringify(body.save)), defaultSave());
          this.cloud.lastJson = JSON.stringify(body.save);
          this.data = mergeSaves(deepFill(this.data, defaultSave()), remote); this.persistLocal();

  },
  cloudWrite() {
    const c = this.cloud;
    if (!c.ref || !c.ready) return;
    if (c.writing) { c.pending = true; return; }
    const json = JSON.stringify(this.data);
    if (json === c.lastJson) return;
    c.writing = true;
    c.ref.set({ save: JSON.parse(json) }).then(() => { c.lastJson = json; c.failed = 0; })
      .catch((e) => { const code = e && e.code; c.failed++; if (code === 'unavailable' && c.failed < 3) setTimeout(() => this.cloudWrite(), 2000); else if (code && code !== 'unavailable' && code !== 'resource_exhausted') c.ref = null; })
      .finally(() => { c.writing = false; if (c.pending) { c.pending = false; this.cloudWrite(); } });
  },
};

// ---------------------------------------------------------------- kit/codes.js (short brag codes you can paste in a group chat)
// Each field is [name, bits]. The code carries an 11-bit checksum, so a typo or a made-up code is rejected.
const B32 = '0123456789ABCDEFGHJKMNPQRSTVWXYZ'; // no I, L, O, U: easy to read out loud
function makeCodec(salt, fields) {
  const bits = fields.reduce((s, f) => s + f[1], 0) + 11, chars = Math.ceil(bits / 5);
  const rawOf = (f) => { let raw = ''; for (const [k] of fields) raw += f[k] + '.'; return raw; };
  return {
    chars,
    encode(obj) {
      let n = 0n;
      const f = {};
      for (const [k, b] of fields) { f[k] = clamp(Math.floor(obj[k] || 0), 0, (1 << b) - 1); n = (n << BigInt(b)) | BigInt(f[k]); }
      n = (n << 11n) | BigInt(hash32(salt + '|' + rawOf(f)) & 0x7FF);
      let s = '';
      for (let i = 0; i < chars; i++) { s = B32[Number(n & 31n)] + s; n >>= 5n; }
      const parts = [];
      for (let i = 0; i < s.length; i += 4) parts.push(s.slice(i, i + 4));
      return parts.join('-');
    },
    decode(code) {
      const s = String(code || '').toUpperCase().replace(/[^0-9A-Z]/g, '').replace(/O/g, '0').replace(/[IL]/g, '1');
      if (s.length !== chars) return null;
      let n = 0n;
      for (const ch of s) { const v = B32.indexOf(ch); if (v < 0) return null; n = (n << 5n) | BigInt(v); }
      const chk = Number(n & 0x7FFn); n >>= 11n;
      const f = {};
      for (let i = fields.length - 1; i >= 0; i--) { const [k, b] = fields[i]; f[k] = Number(n & BigInt((1 << b) - 1)); n >>= BigInt(b); }
      if ((hash32(salt + '|' + rawOf(f)) & 0x7FF) !== chk) return null;
      return f;
    },
  };
}

// ---------------------------------------------------------------- kit/audio.js (synth mixer, sound-effect gate, step sequencer for music)
class Mixer {
  constructor(ac) {
    this.ac = ac;
    const m = (this.master = ac.createGain());
    m.gain.value = 0.8;
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 10; comp.ratio.value = 4; comp.attack.value = 0.004; comp.release.value = 0.16;
    m.connect(comp); comp.connect(ac.destination);
    this.music = ac.createGain(); this.music.gain.value = 0.5; this.music.connect(m);
    this.drums = ac.createGain(); this.drums.gain.value = 0.8; this.drums.connect(this.music);
    this.inst = ac.createGain(); this.inst.gain.value = 0.8; this.inst.connect(this.music);
    this.sfx = ac.createGain(); this.sfx.gain.value = 0.9; this.sfx.connect(m);
    const rev = ac.createConvolver();
    const n = Math.floor(ac.sampleRate * 1.8), buf = ac.createBuffer(2, n, ac.sampleRate);
    for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3); }
    rev.buffer = buf;
    this.revIn = ac.createGain(); const ro = ac.createGain(); ro.gain.value = 0.28;
    this.revIn.connect(rev); rev.connect(ro); ro.connect(m);
    const nb = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate), nd = nb.getChannelData(0);
    for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    this.noise = nb;
  }
  env(g, t, peak, a, d, hold) {
    const p = g.gain;
    p.setValueAtTime(0.0001, t);
    p.exponentialRampToValueAtTime(Math.max(0.0002, peak), t + a);
    if (hold) p.setValueAtTime(Math.max(0.0002, peak), t + a + hold);
    p.exponentialRampToValueAtTime(0.0001, t + a + (hold || 0) + d);
  }
  nz(t, dur, filt, f, q, peak, a, dest, f2) {

}
const OBS_BOX = { ac: [70, 56], vent: [44, 40], crate: [56, 56], crates: [60, 104], chimney: [52, 92], dish: [66, 74], sign: [140, 310], line: [196, 92] };

// ---------- coins, power-ups, birds
function drawCoin(g) {
  g.beginPath(); g.arc(0, 0, 13, 0, TAU); fillInk(g, '#ffd21f', 2.4);
  g.beginPath(); g.arc(0, 0, 9, 0, TAU); g.strokeStyle = '#e8a400'; g.lineWidth = 2; g.stroke();
  star(g, 0, 0.5, 5.6, '#fff3a6');
  g.beginPath(); g.arc(-4, -5, 3, 0, TAU); g.fillStyle = 'rgba(255,255,255,.7)'; g.fill();
}
function star(g, x, y, r, col) {
  g.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i / 10 * TAU, rr2 = i % 2 ? r * 0.45 : r; g.lineTo(x + Math.cos(a) * rr2, y + Math.sin(a) * rr2); }
  g.closePath(); g.fillStyle = col; g.fill();
}
function drawPow(g, type, bubble) {
  if (bubble) { g.beginPath(); g.arc(0, 0, 24, 0, TAU); g.fillStyle = 'rgba(255,255,255,.22)'; g.fill(); g.lineWidth = 3; g.strokeStyle = POWERS[type].color; g.stroke(); g.beginPath(); g.arc(-8, -9, 5, 0, TAU); g.fillStyle = 'rgba(255,255,255,.65)'; g.fill(); }
  if (type === 'magnet') {
    g.beginPath(); g.arc(0, -1, 10, Math.PI, 0); g.lineTo(10, 9); g.lineTo(4, 9); g.lineTo(4, -1); g.arc(0, -1, 4, 0, Math.PI, true); g.lineTo(-4, 9); g.lineTo(-10, 9); g.closePath(); fillInk(g, '#ff4d5e', 2);
    g.fillStyle = '#e8eef7'; g.fillRect(-10, 4, 6, 5); g.fillRect(4, 4, 6, 5);
  } else if (type === 'glider') {
    g.beginPath(); g.moveTo(-13, 2); g.lineTo(14, -8); g.lineTo(-4, 10); g.closePath(); fillInk(g, '#e8f6ff', 2);
    g.beginPath(); g.moveTo(-4, 10); g.lineTo(-2, 2); g.lineTo(14, -8); g.fillStyle = '#9fdcff'; g.fill(); g.lineWidth = 1.6; g.strokeStyle = INK; g.stroke();
  } else if (type === 'shield') {
    g.beginPath(); g.moveTo(0, -12); g.lineTo(11, -7); g.lineTo(9, 5); g.lineTo(0, 12); g.lineTo(-9, 5); g.lineTo(-11, -7); g.closePath(); fillInk(g, '#7c6bff', 2.2);
    g.beginPath(); g.moveTo(0, -7); g.lineTo(0, 7); g.moveTo(-6, -1); g.lineTo(6, -1); g.lineWidth = 2.4; g.strokeStyle = '#fff'; g.stroke();
  } else if (type === 'rocket') {
    g.beginPath(); g.moveTo(-12, 6); g.lineTo(-20, 0); g.lineTo(-12, -2); g.fillStyle = '#ffb21f'; g.fill();
    rr(g, -12, -4, 22, 10, 4); fillInk(g, '#ff8a1f', 2); rr(g, -4, -11, 11, 9, 3); fillInk(g, '#ff8a1f', 2);
    g.fillStyle = '#fff'; g.fillRect(-10, 3, 19, 3);
  } else if (type === 'double') {
    g.beginPath(); g.arc(-2, 0, 11, 0, TAU); fillInk(g, '#ffd21f', 2);
    g.font = '800 13px Rubik, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = INK; g.fillText('x2', -2, 1);
  }
}
function drawPigeon(g, f) {
  g.beginPath(); g.ellipse(0, 0, 13, 9, 0, 0, TAU); fillInk(g, '#9aa3b8', 2);
  g.beginPath(); g.arc(11, -6, 6, 0, TAU); fillInk(g, '#7b84a0', 2);
  g.beginPath(); g.moveTo(16, -6); g.lineTo(21, -4); g.lineTo(16, -3); g.fillStyle = '#ffb21f'; g.fill();
  g.beginPath(); g.arc(12.5, -7.5, 1.5, 0, TAU); g.fillStyle = '#ff4d5e'; g.fill();
  g.beginPath(); g.moveTo(-12, -2); g.lineTo(-20, -6); g.lineTo(-18, 2); g.closePath(); fillInk(g, '#7b84a0', 1.8);
  g.save(); g.translate(-2, -4); g.rotate(f ? -0.9 : 0.5);
  g.beginPath(); g.ellipse(-4, -6, 11, 5, 0.3, 0, TAU); fillInk(g, '#c3cad9', 1.8);
  g.restore();
}

function buildSprites() {
  for (const t in OBS_BOX) {
    const [w, h] = OBS_BOX[t];
    SPR.obs[t] = [];
    for (let k = 0; k < (t === 'sign' ? 4 : 1); k++) SPR.obs[t].push(mkS(w, h, (g) => drawObs(g, t, k), 3, h - 3));
  }
  SPR.coin = mkS(32, 32, drawCoin);
  for (const p of POWER_IDS) { SPR.pow[p] = mkS(56, 56, (g) => drawPow(g, p, true)); SPR.icon[p] = mkS(40, 40, (g) => drawPow(g, p, false)).c.toDataURL(); }
  SPR.pigeon = [mkS(48, 36, (g) => drawPigeon(g, 0)), mkS(48, 36, (g) => drawPigeon(g, 1))];
  for (const s of SKINS) SPR.skin[s.id] = mkS(90, 100, (g) => drawRunner(g, s, { mode: 'run', phase: 1.1, t: 0.3, vy: 0 }), 45, 92).c.toDataURL();
}

// ---------------------------------------------------------------- meta.js (missions, shop, records, daily dash, brag codes)
const CODEC = makeCodec('skyline-sprint', [['v', 2], ['mode', 2], ['day', 12], ['dist', 17], ['coins', 14], ['skin', 3]]);
const Meta = {
  dailyState() {
    const d = Save.data.daily, idx = dayIndex();
    if (d.idx !== idx) { d.idx = idx; d.best = 0; d.coins = 0; d.tries = 0; d.paid = false; }
    return d;
  },
  dailySeed(idx) { return hash32('skyline-daily-' + idx); },
  // ---------- missions
  target(type) {
    const M = MISSIONS[type], tier = Save.data.mis.tier[type] || 0, L = M.tiers;
    return tier < L.length ? L[tier] : Math.round(L[L.length - 1] * Math.pow(1.4, tier - L.length + 1) / 10) * 10;
  },
  reward(type) { return 60 + 40 * Math.min(10, Save.data.mis.tier[type] || 0); },
  label(type) { return MISSIONS[type].text.replace('{n}', fmtInt(this.target(type))); },
  value(type) {
    if (!G) return 0;
    switch (type) {
      case 'dist': return G.dist; case 'coins': return G.coins; case 'jumps': return G.st.jumps; case 'doubles': return G.st.doubles;
      case 'slides': return G.st.slides; case 'powers': return G.st.powers; case 'clean': return G.st.cleanBest; case 'total': return Save.data.stats.coins + G.coins;
    }
    return 0;
  },
  // called during a run: any mission that is done pays out right away
  checkMissions(force) {
    if (!G || G.demo || (G.over && !force)) return;
    const m = Save.data.mis;
    for (let i = 0; i < m.slots.length; i++) {
      const type = m.slots[i];
      if (this.value(type) < this.target(type)) continue;
      const pay = this.reward(type), text = this.label(type);
      Save.data.coins += pay; m.done++;
      m.tier[type] = (m.tier[type] || 0) + 1;
      G.missions = (G.missions || []).concat([{ text, pay }]);
      // the next mission in line that is not already showing
      let k = MISSION_ORDER.indexOf(type);
      for (let j = 1; j <= MISSION_ORDER.length; j++) { const nx = MISSION_ORDER[(k + j) % MISSION_ORDER.length]; if (m.slots.indexOf(nx) < 0 || nx === type) { m.slots[i] = nx; break; } }
      Save.persist();
      onEvent('mission', type, pay);
    }
  },
  // ---------- the run is over
  finish() {
    this.checkMissions(true);
    const S = Save.data, dist = Math.floor(G.dist);
    const res = { mode: G.mode, dist, coins: G.coins, cause: G.cause, newBest: false, best: 0, missions: G.missions || [], skin: G.skin.id, bonus: 0 };
    S.stats.runs++; S.stats.meters += dist; S.stats.coins += G.coins; S.stats.jumps += G.st.jumps; S.stats.powers += G.st.powers;
    S.coins += G.coins;
    if (G.mode === 'run') {
      if (dist > S.best) { res.newBest = S.best > 0; S.best = dist; }
      S.bestCoins = Math.max(S.bestCoins, G.coins);
      res.best = S.best;
    } else if (G.mode === 'daily') {
      const d = this.dailyState();
      d.tries++;
      if (dist > d.best) { res.newBest = d.best > 0; d.best = dist; d.coins = G.coins; }
      if (!d.paid) { d.paid = true; S.coins += 100; res.bonus = 100; }
      res.best = d.best; res.day = d.idx;
    }
    Save.persist();
    res.code = this.code(res);
    return res;
  },
  code(res) {
    return CODEC.encode({ v: 1, mode: res.mode === 'daily' ? 0 : 1, day: res.mode === 'daily' ? res.day : dayIndex(), dist: Math.min(131071, res.dist), coins: Math.min(16383, res.coins), skin: Math.max(0, SKINS.findIndex((s) => s.id === res.skin)) });
  },
  decode(code) {
    const f = CODEC.decode(code);
    if (!f || f.v !== 1 || f.mode > 1 || f.skin >= SKINS.length) return null;
    return { mode: f.mode === 0 ? 'daily' : 'run', day: f.day, dist: f.dist, coins: f.coins, skin: SKINS[f.skin] };
  },
  brag(res) {
    const head = res.mode === 'daily' ? '🏙️ Skyline Sprint · Daily Dash #' + (res.day + 1) + ' (' + dayLabel(res.day) + ')' : '🏙️ Skyline Sprint · ' + (res.newBest ? 'new best!' : 'endless run');
    return head + '\n🏃 ' + fmtInt(res.dist) + ' m · 🪙 ' + fmtInt(res.coins) + ' coins · ' + SKIN_BY_ID[res.skin].name + '\nBeat me: ' + res.code;
  },
  // ---------- shop
  buySkin(id) {
    const s = SKIN_BY_ID[id], S = Save.data;
    if (S.skins[id]) { S.skin = id; Save.persist(); return true; }
    if (S.coins < s.cost) return false;
    S.coins -= s.cost; S.skins[id] = true; S.skin = id; Save.persist();
    return true;
  },
  buyUpgrade(id) {
    const S = Save.data, lv = S.upg[id] || 0;
    if (lv >= UP_COST.length || S.coins < UP_COST[lv]) return false;
    S.coins -= UP_COST[lv]; S.upg[id] = lv + 1; Save.persist();
    return true;
  },
};

// ---------------------------------------------------------------- input.js (tap = jump, hold = higher, swipe down or the button = slide)
const Input = {
  active: false, ptr: null,
  init(cv) {
    cv.addEventListener('pointerdown', (e) => {
      if (!this.active || (e.pointerType === 'mouse' && e.button !== 0)) return;
      Snd.init();
      this.ptr = { id: e.pointerId, y: e.clientY, x: e.clientX, t: performance.now(), swiped: false, jumpT: G ? G.t : 0, wasGround: G ? G.ground : true };
      Game.press();
      try { cv.setPointerCapture(e.pointerId); } catch (er) { /* fine */ }
      e.preventDefault();
    });
    cv.addEventListener('pointermove', (e) => {
      const p = this.ptr;
      if (!p || p.id !== e.pointerId || p.swiped || !this.active || !G) return;
      if (e.clientY - p.y > 34 && e.clientY - p.y > Math.abs(e.clientX - p.x) && performance.now() - p.t < 350) {
        p.swiped = true;
        // a swipe starts with a press, so undo the little hop it made
        if (p.wasGround && !G.ground && G.t - p.jumpT < 0.25 && G.vy < 0) { G.st.jumps = Math.max(0, G.st.jumps - 1); }
        Game.release(); Game.slide(true); Game.slide(false);
      }
    });
    const up = (e) => { if (this.ptr && this.ptr.id === e.pointerId) { this.ptr = null; Game.release(); } };
    cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up); cv.addEventListener('lostpointercapture', up);
    const sb = document.getElementById('slideBtn');
    sb.addEventListener('pointerdown', (e) => { if (!this.active) return; Snd.init(); Game.slide(true); sb.classList.add('on'); e.preventDefault(); try { sb.setPointerCapture(e.pointerId); } catch (er) { /* fine */ } });
    const sup = () => { Game.slide(false); sb.classList.remove('on'); };
    sb.addEventListener('pointerup', sup); sb.addEventListener('pointercancel', sup); sb.addEventListener('lostpointercapture', sup);
    window.addEventListener('keydown', (e) => {
      if (!this.active) return;
      if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') { if (!e.repeat) { Snd.init(); Game.press(); } e.preventDefault(); }
      else if (e.code === 'ArrowDown' || e.code === 'KeyS') { if (!e.repeat) Game.slide(true); e.preventDefault(); }
      else if ((e.code === 'Escape' || e.code === 'KeyP') && !e.repeat) { UI.pauseMenu(); e.preventDefault(); }
    });
    window.addEventListener('keyup', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') Game.release();
      else if (e.code === 'ArrowDown' || e.code === 'KeyS') Game.slide(false);
    });
    window.addEventListener('blur', () => { this.ptr = null; Game.release(); if (G) G.slideHeld = false; });
  },
};

// ---------------------------------------------------------------- render.js (sunset-to-night sky, skyline layers, rooftops, the runner)
const STYLES = [['#3b2a6b', '#2a1d52', '#5a4790'], ['#2f3f7a', '#1f2c5c', '#4b5fa3'], ['#5a2f5f', '#41203f', '#7d4a80'], ['#2e4d6b', '#1f3650', '#4a7193'], ['#4a2f7a', '#331f58', '#6a4ca0']];
const SKY = [[[42, 22, 96], [162, 59, 140], [255, 154, 90]], [[22, 14, 66], [72, 36, 128], [214, 84, 122]], [[5, 8, 24], [20, 26, 68], [44, 40, 96]]];
const Render = {
  cv: null, ctx: null, dpr: 1, W: 0, H: 0, s: 1, quality: 1, lead: 200, anchor: 0, t: 0, far: null, mid: null, farLit: null, midLit: null, clouds: [],
  init(cv) {
    this.cv = cv; this.ctx = cv.getContext('2d', { alpha: false });
    const r = makeRng(77);
    this.far = this.strip(r, 2400, 460, 60, 150, 300, '#2b1a55', 0.5);
    this.mid = this.strip(r, 2400, 420, 90, 110, 260, '#1d1240', 0.6);
    for (let i = 0; i < 7; i++) this.clouds.push({ x: r.range(0, 3000), y: r.range(-420, -180), w: r.range(160, 340), s: r.range(0.03, 0.07) });
  },
  // a long strip of building silhouettes with a separate layer of lit windows
  strip(r, w, h, minW, minH, maxH, col, k) {
    const mk = () => { const c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k); const g = c.getContext('2d'); g.scale(k, k); return [c, g]; };
    const [c, g] = mk(), [cl, gl] = mk();
    g.fillStyle = col; gl.fillStyle = '#ffd27a';
    for (let x = 0; x < w;) {
      const bw = r.range(minW, minW * 2.4), bh = r.range(minH, maxH), y = h - bh;
      g.fillRect(x, y, bw, bh + 2);
      if (r.chance(0.3)) g.fillRect(x + bw * 0.4, y - r.range(20, 60), 4, 60);
      if (r.chance(0.25)) { g.fillRect(x + bw * 0.15, y - 18, bw * 0.3, 18); }
      for (let wy = y + 12; wy < h - 8; wy += 16) for (let wx = x + 7; wx < x + bw - 8; wx += 13) if (r.chance(0.16)) gl.fillRect(wx, wy, 5, 7);
      x += bw + r.range(0, 14);
    }
    return { c, cl, w, h };
  },
  resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5) * this.quality;
    this.dpr = dpr; this.W = window.innerWidth; this.H = window.innerHeight;
    this.cv.width = Math.round(this.W * dpr); this.cv.height = Math.round(this.H * dpr);
    this.cv.style.width = this.W + 'px'; this.cv.style.height = this.H + 'px';
    // tall phones zoom in a little and keep the runner near the left edge so there is still room to see ahead
    const tall = this.W < this.H;

    const vw = this.W / this.s;

    this.anchor = this.H * (tall ? 0.62 : 0.62);
  },
  skyCol(p, i) {
    const a = p < 0.5 ? SKY[0][i] : SKY[1][i], b = p < 0.5 ? SKY[1][i] : SKY[2][i], f = p < 0.5 ? p * 2 : (p - 0.5) * 2;
    return 'rgb(' + Math.round(lerp(a[0], b[0], f)) + ',' + Math.round(lerp(a[1], b[1], f)) + ',' + Math.round(lerp(a[2], b[2], f)) + ')';
  },
  frame(dt) {
    const g = this.ctx, W = this.W, H = this.H, k = this.dpr, s = this.s;
    this.t += dt;
    if (!G) { g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = '#2a1660'; g.fillRect(0, 0, this.cv.width, this.cv.height); return; }
    const p = clamp(G.dist / 2600, 0, 1), camX = G.camX, camY = G.camY, A = this.anchor;
    const toY = (wy) => (wy - camY) * s + A;
    // sky
    g.setTransform(k, 0, 0, k, 0, 0);
    const key = Math.round(p * 60) + ':' + H;

        const x = (hash2(i, 1, 9) * W * 1.3 - (camX * 0.01) % W + W) % W, y = hash2(i, 2, 9) * horizon * 0.85, tw = 0.5 + 0.5 * Math.sin(this.t * 2 + i);

      g.globalAlpha = 1 - smoothstep(0.35, 0.55, p);
      const sg = g.createRadialGradient(sx, sy, r * 0.2, sx, sy, r * 2.2); sg.addColorStop(0, 'rgba(255,220,140,.55)'); sg.addColorStop(1, 'rgba(255,160,90,0)');
      g.fillStyle = sg; g.fillRect(sx - r * 2.2, sy - r * 2.2, r * 4.4, r * 4.4);
      g.beginPath(); g.arc(sx, sy, r, 0, TAU); g.fillStyle = '#ffd58a'; g.fill();
      g.fillStyle = 'rgba(255,140,90,.55)'; for (let i = 0; i < 4; i++) g.fillRect(sx - r, sy + r * (0.15 + i * 0.22), r * 2, r * 0.07);
      g.globalAlpha = 1;
    }
    if (p > 0.5) {
      const ma = smoothstep(0.5, 0.8, p), mx = W * 0.78, my = horizon * 0.35, r = 34 * s;
      g.globalAlpha = ma; g.beginPath(); g.arc(mx, my, r, 0, TAU); g.fillStyle = '#f4f1ff'; g.fill();
      g.beginPath(); g.arc(mx + r * 0.4, my - r * 0.25, r * 0.85, 0, TAU); g.fillStyle = this.skyCol(p, 0); g.fill(); g.globalAlpha = 1;
    }
    // clouds drift slowly
    g.fillStyle = 'rgba(255,190,200,' + (0.18 * (1 - p) + 0.05) + ')';
    for (const c of this.clouds) {
      const x = ((c.x - camX * c.s) % 3000 + 3000) % 3000 - 300, y = toY(c.y) - camY * s * -0.1;
      g.beginPath(); g.ellipse(x * s * 0.6, y, c.w * s * 0.5, 18 * s, 0, 0, TAU); g.ellipse(x * s * 0.6 + c.w * s * 0.18, y - 12 * s, c.w * s * 0.28, 16 * s, 0, 0, TAU); g.fill();

    g.fillStyle = 'rgba(40,20,80,.25)'; g.fillRect(0, horizon + 150 * s - 4, W, H);

    g.fillStyle = '#140b2c'; g.fillRect(0, horizon + 300 * s - 2, W, H);

    const vx0 = camX - 40, vx1 = camX + W / s + 40, bottom = camY + (H - A) / s + 20;
    for (const b of World.b) if (b.x1 > vx0 && b.x0 < vx1) this.building(g, b, bottom, p);
    // best distance marker
    const bx = G.best * PX_M;
    if (G.best > 50 && bx > vx0 && bx < vx1) {
      const bb = World.at(bx), top = bb ? bb.top : 0;
      g.setLineDash([10, 8]); g.beginPath(); g.moveTo(bx, top); g.lineTo(bx, top - 260); g.lineWidth = 3; g.strokeStyle = 'rgba(255,255,255,.7)'; g.stroke(); g.setLineDash([]);
      rr(g, bx, top - 262, 92, 30, 6); g.fillStyle = '#ffd21f'; g.fill(); g.lineWidth = 2.4; g.strokeStyle = INK; g.stroke();
      g.font = '400 24px "Bebas Neue", Impact, sans-serif'; g.textBaseline = 'middle'; g.fillStyle = INK; g.fillText((G.mode === 'daily' ? 'TODAY ' : 'BEST ') + Math.floor(G.best), bx + 8, top - 246);
    }
    // coins and power-ups
    const cs = SPR.coin;
    for (const c of World.coins) {
      if (c.taken || c.x < vx0 || c.x > vx1) continue;

    }
    for (const q of World.pows) {
      if (q.taken || q.x < vx0 || q.x > vx1) continue;
      const ps = SPR.pow[q.type], bob = Math.sin(this.t * 4 + q.x) * 6;
      g.globalAlpha = 0.35 + 0.2 * Math.sin(this.t * 6); g.beginPath(); g.arc(q.x, q.y + bob, 34, 0, TAU); g.fillStyle = POWERS[q.type].color; g.fill(); g.globalAlpha = 1;

      for (const q of G.pigeons) {

        const x = G.over ? G.x + q.ox * 0.4 + Math.sin(this.t * 9 + q.ph) * 10 : base + q.ox, y = (G.over ? G.y - 40 : G.y - 30) + q.oy + Math.sin(this.t * 8 + q.ph) * 8;

    }
    // dust, stars, flames
    for (const q of G.fx) {
      const a = clamp(q.life / q.max, 0, 1);
      if (q.k === 'ring') { g.globalAlpha = a; g.beginPath(); g.arc(q.x, q.y, 14 + (1 - a) * 22, 0, TAU); g.lineWidth = 3; g.strokeStyle = '#fff3a6'; g.stroke(); continue; }

    const fast = clamp((speedAt(G.x) - 600) / 200, 0, 1) + (G.pw.rocket > 0 ? 1 : 0);

      g.setTransform(k, 0, 0, k, 0, 0); g.strokeStyle = 'rgba(255,255,255,' + (0.18 * Math.min(1, fast)) + ')'; g.lineWidth = 2;
      for (let i = 0; i < 9; i++) { const y = hash2(i, Math.floor(this.t * 9), 3) * H, x = W - ((this.t * 2400 + i * 300) % (W + 400)); g.beginPath(); g.moveTo(x, y); g.lineTo(x + 120 + 80 * fast, y); g.stroke(); }
    }
  },
  building(g, b, bottom, p) {
    const st = STYLES[b.style], w = b.x1 - b.x0, top = b.top;
    // props behind the parapet
    for (const q of b.props) {
      if (q.type === 'tower') {
        const x = q.x;
        g.fillStyle = INK; g.fillRect(x + 8, top - 70, 5, 70); g.fillRect(x + 57, top - 70, 5, 70);
        rr(g, x, top - 150, 70, 84, 10); g.fillStyle = '#8a5a3a'; g.fill(); g.lineWidth = 2.6; g.strokeStyle = INK; g.stroke();
        g.fillStyle = 'rgba(0,0,0,.18)'; for (let i = 1; i < 4; i++) g.fillRect(x + 2, top - 150 + i * 21, 66, 3);
        g.beginPath(); g.moveTo(x - 4, top - 148); g.lineTo(x + 35, top - 178); g.lineTo(x + 74, top - 148); g.closePath(); g.fillStyle = '#6b3f26'; g.fill(); g.stroke();
      } else if (q.type === 'antenna') {
        g.fillStyle = INK; g.fillRect(q.x, top - 120, 4, 120); g.fillRect(q.x - 14, top - 96, 32, 3); g.fillRect(q.x - 9, top - 76, 22, 3);
        const blink = Math.sin(this.t * 4 + q.x) > 0.3;
        g.beginPath(); g.arc(q.x + 2, top - 124, 5, 0, TAU); g.fillStyle = blink ? '#ff4d5e' : '#7a2030'; g.fill();
        if (blink) { g.globalAlpha = 0.3; g.beginPath(); g.arc(q.x + 2, top - 124, 14, 0, TAU); g.fill(); g.globalAlpha = 1; }
      }
    }
    // the wall with its windows
    g.fillStyle = st[0]; g.fillRect(b.x0, top, w, bottom - top);
    g.fillStyle = st[1]; g.fillRect(b.x0, top, 12, bottom - top);
    const r0 = Math.max(0, Math.floor((G.camY - 400 - top) / 46)), r1 = Math.ceil((bottom - top) / 46);
    const cols = Math.floor((w - 40) / 38), ox = b.x0 + (w - cols * 38) / 2 + 8;
    g.beginPath();
    const lit = [];
    for (let r = Math.max(0, r0); r < r1; r++) for (let c = 0; c < cols; c++) {
      const x = ox + c * 38, y = top + 40 + r * 46;
      if (hash2(c + b.seed, r, 5) < 0.28 + p * 0.25) lit.push(x, y); else g.rect(x, y, 20, 26);
    }
    g.fillStyle = 'rgba(14,8,34,.55)'; g.fill();
    g.beginPath(); for (let i = 0; i < lit.length; i += 2) g.rect(lit[i], lit[i + 1], 20, 26);
    g.fillStyle = p > 0.45 ? '#ffd27a' : '#f7b27a'; g.fill();

    g.fillStyle = st[2]; g.fillRect(b.x0 - 4, top - 2, w + 8, 14);
    g.lineWidth = 3; g.strokeStyle = INK; g.strokeRect(b.x0 - 4, top - 2, w + 8, 14);
    g.beginPath(); g.moveTo(b.x0, top + 12); g.lineTo(b.x0, bottom); g.moveTo(b.x1, top + 12); g.lineTo(b.x1, bottom); g.stroke();

        const on = Math.sin(this.t * 3 + q.x) > -0.85;

  },
  runner(g) {
    const P = { mode: 'run', phase: G.anim / 26, t: this.t, vy: G.vy, dbl: 0 };
    if (G.over) P.mode = 'fall';
    else if (G.trip > 0) P.mode = 'trip';
    else if (G.sliding) P.mode = 'slide';
    else if (!G.ground) P.mode = 'air';

  },
};

// ---------------------------------------------------------------- ui.js (menus, shop, missions, HUD, results)
const coinHtml = (n) => '<span class="coin"></span>' + fmtInt(n);
const UI = {
  cur: '', paused: false, toastT: 0, lastRes: null, shopTab: 'skins', bestShown: false,
  init() {

      for (const u of UPGRADES) {
        const lv = S.upg[u.id] || 0, cost = UP_COST[lv], can = cost && S.coins >= cost;
        let pips = ''; for (let i = 0; i < UP_COST.length; i++) pips += '<i class="' + (i < lv ? 'on' : '') + '"></i>';
        h += '<div class="up"><img src="' + SPR.icon[u.id] + '" alt=""><span class="uinfo"><b>' + u.name + '</b><small>' + POWERS[u.id].blurb + ' · ' + upLen(u.id, lv) + 's' + (cost ? ' → ' + upLen(u.id, lv + 1) + 's' : '') + '</small><span class="pips">' + pips + '</span></span>' +
          (cost ? '<button class="buy' + (can ? '' : ' poor') + '" data-a="upg" data-v="' + u.id + '">' + coinHtml(cost) + '</button>' : '<span class="maxed">MAX</span>') + '</div>';
      }
      h += '</div><p class="sub">Shields last until they save you once.</p>';
    }
    this.show(h, 'dim');
  },
  missions() {
    this.cur = 'missions';
    const m = Save.data.mis;
    let h = this.top('title') + '<h2>Missions</h2><p class="sub">Finish a mission in any run to get coins. A new one takes its place.</p><div class="mis">';
    for (const type of m.slots) {
      const tot = type === 'total', prog = tot ? Save.data.stats.coins : 0, tg = Meta.target(type);
      h += '<div class="mission"><b>' + Meta.label(type) + '</b>' + (tot ? '<span class="bar"><i style="width:' + Math.min(100, prog / tg * 100) + '%"></i></span>' : '') + '<span class="pay">' + coinHtml(Meta.reward(type)) + '</span></div>';
    }
    h += '</div><p class="sub">' + m.done + ' missions done so far.</p>';
    this.show(h, 'dim');
  },
  code(prefill) {
    this.cur = 'code';
    this.show(this.top('title') + '<h2>Friend\'s code</h2><p class="sub">Paste the code from the group chat to see their run.</p>' +
      '<input id="codeIn" class="codein" maxlength="24" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX-XXXX-X" value="' + esc(prefill || '') + '">' +
      '<button class="big" data-a="checkCode"><span>Check</span></button><div id="codeOut"></div>', 'dim');
  },
  settings(back) {
    this.cur = 'settings';
    const s = Save.data.settings, row = (k, label, on) => '<button class="toggle' + (on ? ' on' : '') + '" data-a="toggle" data-v="' + k + '"><span>' + label + '</span><i></i></button>';
    this.show(this.top(back || 'title') + '<h2>Settings</h2>' + row('sound', 'Sound effects', s.sound) + row('music', 'Music', s.music) + row('haptics', 'Vibration', s.haptics) +
      '<p class="sub">Tap anywhere to jump, tap again in the air to double jump, hold for a higher jump. Swipe down or hold the slide button to slide under signs and washing lines. Keyboard: Space or Up to jump, Down to slide, P to pause.</p>' +
      '<p class="foot">© 2026 Asaf. All rights reserved.</p>', 'dim');
  },

  // ---------- running
  startRun(mode) {
    this.hide();
    const seed = mode === 'daily' ? Meta.dailySeed(dayIndex()) : (Math.random() * 4294967296) >>> 0;
    Game.start(mode, seed);
    this.cur = 'game'; this.paused = false; Input.active = true; this.hud.hidden = false; this.bestShown = false; this.signTip = false;
    this.h.hint.className = 'on'; this.h.hint.innerHTML = '<b>TAP TO RUN</b><small>' + (mode === 'daily' ? 'Daily Dash · same course for everyone' : 'Tap to jump · tap again to double jump') + '</small>';
    if (Snd.mx) Music.start(SONG_RUN);
  },
  frameHud(dt) {
    if (this.toastT > 0) { this.toastT -= dt; if (this.toastT <= 0) this.toastEl.classList.remove('on'); }
    if (!G || G.demo || this.hud.hidden) return;
    const d = fmtInt(G.dist) + ' m'; if (this.h.dist.textContent !== d) this.h.dist.textContent = d;
    const c = fmtInt(G.coins); if (this.h.coins.textContent !== c) this.h.coins.textContent = c;
    let ph = '';
    for (const k of ['magnet', 'glider', 'rocket', 'double']) if (G.pw[k] > 0) ph += '<span class="pw" style="--c:' + POWERS[k].color + '"><img src="' + SPR.icon[k] + '" alt=""><i style="width:' + Math.round(clamp(G.pw[k] / (G.pwMax[k] || 1), 0, 1) * 100) + '%"></i></span>';
    if (G.pw.shield) ph += '<span class="pw" style="--c:' + POWERS.shield.color + '"><img src="' + SPR.icon.shield + '" alt=""></span>';
    if (this.pwKey !== ph) { this.pwKey = ph; this.h.pows.innerHTML = ph; }
    if (G.started && this.h.hint.className) this.h.hint.className = '';
    if (!this.bestShown && G.best > 50 && G.dist > G.best && !G.over) { this.bestShown = true; this.toast(G.mode === 'daily' ? 'Beat your best today!' : 'New best!', 'Keep going!', 'gold', 2); Sfx.record(); }
    // show a slide tip the first time a sign comes up
    if (!this.signTip && !Save.data.seen.slide) {
      const b = World.at(G.x + 520) || World.at(G.x + 300);
      if (b && b.obs.some((o) => OBS[o.type].high && o.x > G.x + 150 && o.x < G.x + 700)) { this.signTip = true; Save.data.seen.slide = true; Save.persist(); this.toast('Swipe down to slide!', 'Or hold the ⬇ button, or press Down', 'tip', 3.5); }
    }
  },
  toast(t, sub, cls, dur) {
    const e = this.toastEl;
    e.className = 'on ' + (cls || ''); e.innerHTML = '<b>' + esc(t) + '</b>' + (sub ? '<small>' + esc(sub) + '</small>' : '');
    this.toastT = dur || 2.4;
  },
  pauseMenu() {
    if (!G || G.demo || G.over || this.cur !== 'game') return;
    this.paused = true; this.cur = 'pause'; Input.active = false; Game.release();
    this.show('<div class="panel"><h2>Paused</h2><p class="sub">' + fmtInt(G.dist) + ' m · ' + fmtInt(G.coins) + ' coins</p>' +
      '<button class="big" data-a="resume"><span>Keep running</span><b>▶</b></button>' +
      '<div class="row2"><button class="mid" data-a="restart">Restart</button><button class="mid" data-a="settings">Settings</button></div>' +
      '<button class="link" data-a="quit">Quit to menu</button></div>', 'dim');
  },
  resume() { this.hide(); this.cur = 'game'; this.paused = false; Input.active = true; },
  results(res) {
    this.cur = 'results'; Input.active = false; this.lastRes = res;
    Music.stop();
    const why = { fell: 'Down the gap!', wall: 'Bonk! Hit a wall', caught: 'The pigeons got you!' }[res.cause] || 'Run over';
    let h = '<div class="panel results"><h2 class="big1">' + why + '</h2><div class="bignum"><b>' + fmtInt(res.dist) + '<span> m</span></b>' +
      (res.newBest ? '<small class="nb">NEW BEST!</small>' : res.best ? '<small>' + (res.mode === 'daily' ? 'Best today: ' : 'Best: ') + fmtInt(res.best) + ' m</small>' : '') + '</div>' +
      '<p class="earn">+' + coinHtml(res.coins) + (res.bonus ? ' <small>+' + res.bonus + ' daily bonus</small>' : '') + '</p>';
    if (res.missions.length) {
      const ms = res.missions, more = ms.length - 3;
      h += '<div class="mdone">' + ms.slice(0, more > 0 ? 2 : 3).map((m) => '<div>✔ ' + esc(m.text) + ' <b>+' + m.pay + '</b></div>').join('') +
        (more > 0 ? '<div>✔ and ' + (more + 1) + ' more missions <b>+' + ms.slice(2).reduce((a, m) => a + m.pay, 0) + '</b></div>' : '') + '</div>';
    }
    h += '<button class="big" data-a="' + (res.mode === 'daily' ? 'playDaily' : 'run') + '"><span>Run again</span><b>▶</b></button>' +
      '<div class="row2"><button class="mid" data-a="brag">Copy brag</button><button class="mid" data-a="shop">Shop</button></div><div id="bragOut"></div>' +
      '<button class="link" data-a="title">Menu</button></div>';
    this.show(h, 'dim');
  },
  acts: {
    title() { this.title(); },
    run() { this.startRun('run'); },
    daily() { this.daily(); },
    playDaily() { this.startRun('daily'); },
    shop() { this.shop(); },
    shopTab(t) { this.shop(t); },
    missions() { this.missions(); },
    code() { this.code(); },
    settings() { this.settings(this.cur === 'pause' ? 'pauseBack' : 'title'); },
    pauseBack() { this.cur = 'game'; this.paused = true; this.pauseMenu(); },
    resume() { this.resume(); },
    restart() { this.startRun(G.mode); },
    quit() { this.title(); },
    skin(id) { const was = Save.data.skins[id]; if (Meta.buySkin(id)) { if (was) Sfx.click(); else Sfx.buy(); this.shop(); } else { Sfx.nope(); } },
    upg(id) { if (Meta.buyUpgrade(id)) { Sfx.buy(); this.shop(); } else Sfx.nope(); },
    toggle(k) { const s = Save.data.settings; s[k] = !s[k]; Save.persist(); Snd.apply(); if (k === 'music' && s.music && !Music.on) Music.start(SONG_MENU); this.settings(this.paused ? 'pauseBack' : 'title'); },
    async brag() {
      const res = this.lastRes; if (!res) return;
      const txt = Meta.brag(res), ok = await copyText(txt), out = document.getElementById('bragOut');
      if (out) out.innerHTML = '<p class="' + (ok ? 'win' : 'sub') + '">' + (ok ? 'Copied! Paste it in the group chat.' : 'Copy this:') + '</p><pre class="bragtxt">' + esc(txt) + '</pre>';
    },
    checkCode() {
      const r = Meta.decode(document.getElementById('codeIn').value), out = document.getElementById('codeOut');
      if (!r) { out.innerHTML = '<p class="bad">That code doesn\'t look right. Check for typos.</p>'; Sfx.nope(); return; }
      const today = r.mode === 'daily' && r.day === dayIndex();
      let h = '<div class="dcard row"><img src="' + SPR.skin[r.skin.id] + '" alt=""><div><b>' + fmtInt(r.dist) + ' m</b><small>' + (r.mode === 'daily' ? 'Daily Dash #' + (r.day + 1) + ' · ' + dayLabel(r.day) + (today ? ' (today)' : '') : 'Endless run') + ' · ' + fmtInt(r.coins) + ' coins · ' + r.skin.name + '</small></div></div>';
      if (today) h += '<button class="big" data-a="playDaily"><span>Race them on today\'s dash</span><b>▶</b></button>';
      else if (r.mode === 'daily') h += '<p class="sub">That dash was on another day. Today has new rooftops!</p>';
      else h += '<button class="big" data-a="run"><span>Try to beat it</span><b>▶</b></button>';
      out.innerHTML = h;
    },
  },
};

function onEvent(name, a, b) {
  if (!G || G.demo) return;
  switch (name) {
    case 'jump': Sfx.jump(); break;
    case 'djump': Sfx.djump(); break;
    case 'land': if (a > 300) Sfx.land(a); break;
    case 'slide': Sfx.slide(); break;
    case 'coin': Sfx.coin(a); break;
    case 'power': Sfx.power(); UI.toast(POWERS[a].name + '!', POWERS[a].blurb, 'gold', 1.6); if (Save.data.settings.haptics) vibrate(20); break;
    case 'shield': Sfx.shield(); UI.toast('Shield saved you!', '', 'tip', 1.4); break;
    case 'pwEnd': Sfx.pwEnd(); break;
    case 'trip': Sfx.trip(); if (Save.data.settings.haptics) vibrate(60); UI.toast('Pigeons!', 'Trip again soon and they catch you', 'hot', 2); break;
    case 'mission': { Sfx.mission(); const m = G.missions[G.missions.length - 1]; UI.toast('Mission done! +' + b + ' coins', m ? m.text : '', 'gold', 2.6); break; }
    case 'over':
      if (a === 'caught') Sfx.caught(); else Sfx.fall();
      if (Save.data.settings.haptics) vibrate(a === 'caught' ? [40, 40, 40] : 150);
      Input.active = false;
      setTimeout(() => { if (G && G.over && UI.cur === 'game') UI.results(Meta.finish()); }, 1400);
      break;
  }
}

// ---------- the title screen's demo runner
const Demo = {
  over: 0,
  start() { Game.start('demo', (Math.random() * 1e9) >>> 0); G.started = true; this.over = 0; },
  frame(dt) {
    if (!G || !G.demo) return;
    if (G.over) { this.over += dt; if (this.over > 1.6) this.start(); }
  },
};

// ---------------------------------------------------------------- main.js (boot + fixed-step loop)
const STEP = 1 / 120;
const Perf = {
  acc: 0, n: 0, level: 0,
  sample(dt) {
    if (!G || G.demo || UI.paused) { this.acc = 0; this.n = 0; return; }
    this.acc += dt; this.n++;
    if (this.n >= 150) {
      const avg = this.acc / this.n; this.acc = 0; this.n = 0;
      if (avg > 0.024 && this.level < 2) { this.level++; Render.quality = this.level === 1 ? 0.8 : 0.62; Render.resize(); }
    }
  },
};
async function boot() {
  Save.load();
  // signs are painted with the display font, so wait (briefly) for it
  try { await Promise.race([Promise.all([document.fonts.load('400 40px "Bebas Neue"'), document.fonts.load('700 14px Rubik')]), new Promise((r) => setTimeout(r, 600))]); } catch (e) { /* draw with a fallback */ }
  buildSprites();
  const cv = document.getElementById('cv');
  Render.init(cv); Render.resize();
  Input.init(cv);
  UI.init();
  Snd.muted = () => !G || G.demo;
  window.addEventListener('resize', () => Render.resize());
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { Save.persistLocal(); if (G && !G.demo && !G.over && UI.cur === 'game') UI.pauseMenu(); if (Snd.ac) Snd.ac.suspend().catch(() => {}); }
    else if (Snd.ac) Snd.ac.resume().catch(() => {});
  });
  const wake = () => { Snd.init(); if (!Music.on && Snd.mx) Music.start(UI.cur === 'game' ? SONG_RUN : SONG_MENU); };
  window.addEventListener('pointerdown', wake, { capture: true });
  window.addEventListener('keydown', wake, { capture: true });
  Save.onRemote = () => { if (UI.cur === 'title') UI.title(); };
  Save.cloudInit();
  UI.title();
  let last = performance.now(), acc = 0, mt = 0;
  function loop(now) {
    const dt = Math.max(0, Math.min(0.1, (now - last) / 1000));
    last = now;
    if (G && !UI.paused) {
      acc += dt;
      let n = 0;
      while (acc >= STEP && n < 10) {
        if (G.demo) Bot.think(1);
        Game.update(STEP); acc -= STEP; n++;
      }
      if (n === 10) acc = 0;
      mt += dt; if (mt > 0.25) { mt = 0; Meta.checkMissions(); }
    } else acc = 0;
    Demo.frame(dt);
    Render.frame(dt);
    UI.frameHud(dt);
    Sfx.frame();
    Music.pump();
    Perf.sample(dt);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

})();</script>
