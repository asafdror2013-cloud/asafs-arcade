<script>
/*! © 2026 Asaf. All rights reserved. Free to play; not to be copied or claimed as your own. */
(function () {
  'use strict';
  var CFG = {"id": "skyline-sprint", "owner": "Asaf", "year": 2026, "mark": "bc", "dx": 0, "dy": 0, "mount": null, "hubCss": null};
  var NOTICE = '© ' + CFG.year + ' ' + CFG.owner;

  // Inside Asaf's Arcade the game runs in a frame of the arcade page: borrow its cloud saves, let it show the notice.
  var hub = null;
  try {
    var P = window.parent;
    if (P && P !== window && P.__ASAF_ARCADE__ && P.__ASAF_ARCADE__.v === 1) hub = P.__ASAF_ARCADE__;
  } catch (e) { hub = null; }
  window.__ASAF_HUB__ = !!hub;
  if (hub) {
    window.__asafClaude = makeClaude(hub, CFG.id);
    if (CFG.hubCss) {
      var hs = document.createElement('style');
      hs.textContent = CFG.hubCss;
      (document.head || document.documentElement).appendChild(hs);
    }
    return;
  }

  // ---- played on its own: a small permanent tag plus a short notice when the game opens
  var css = '' +
    '#asaf-cr{all:initial;position:fixed;z-index:2147483646;display:block;box-sizing:border-box;pointer-events:none;user-select:none;-webkit-user-select:none;' +
    'font:600 10px/1 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;letter-spacing:.04em;color:rgba(255,255,255,.88);' +
    'background:rgba(6,6,16,.52);padding:4px 8px;border-radius:999px;white-space:nowrap;opacity:.82;transition:opacity .7s ease}' +
    '#asaf-cr.asaf-busy{opacity:.14}' +
    '#asaf-cr-toast{all:initial;position:fixed;z-index:2147483647;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));display:block;box-sizing:border-box;' +
    'transform:translateX(-50%);pointer-events:none;user-select:none;-webkit-user-select:none;width:max-content;max-width:min(90vw,430px);' +
    'font:500 12.5px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#fff;text-align:center;' +
    'background:rgba(8,8,20,.9);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:9px 15px;box-shadow:0 10px 30px rgba(0,0,0,.5);' +
    'opacity:0;animation:asafCrIn .45s ease .6s forwards,asafCrOut .6s ease 5.2s forwards}' +
    '#asaf-cr-toast b{all:unset;font-weight:800}' +
    '#asaf-cr-toast i{all:unset;display:block;margin-top:2px;font-size:11.5px;opacity:.78}' +
    '@keyframes asafCrIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}' +
    '@keyframes asafCrOut{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,0)}}';
  var st = document.createElement('style');
  st.id = 'asaf-cr-style';
  st.textContent = css;
  (document.head || document.documentElement).appendChild(st);

  var dx = 6 + (CFG.dx || 0), dy = 6 + (CFG.dy || 0);
  var T = 'top:calc(' + dy + 'px + env(safe-area-inset-top,0px));';
  var B = 'bottom:calc(' + dy + 'px + env(safe-area-inset-bottom,0px));';
  var L = 'left:calc(' + dx + 'px + env(safe-area-inset-left,0px));';
  var R = 'right:calc(' + dx + 'px + env(safe-area-inset-right,0px));';
  var C = 'left:50%;transform:translateX(-50%);';
  var POS = { tl: T + L, tr: T + R, bl: B + L, br: B + R, tc: T + C, bc: B + C };

  var tag = document.createElement('div');
  tag.id = 'asaf-cr';
  tag.setAttribute('role', 'note');
  tag.setAttribute('aria-label', NOTICE + '. All rights reserved.');
  tag.textContent = NOTICE;
  tag.style.cssText = POS[CFG.mark] || POS.br;

  var toast = document.createElement('div');
  toast.id = 'asaf-cr-toast';
  toast.setAttribute('aria-hidden', 'true');
  var b = document.createElement('b'); b.textContent = NOTICE + ' · All rights reserved';
  var i = document.createElement('i'); i.textContent = 'Free to play. Please don’t copy it or claim it as your own.';
  toast.appendChild(b); toast.appendChild(i);
  setTimeout(function () { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 6200);

  function home() {
    if (CFG.mount) { var m = document.querySelector(CFG.mount); if (m) return m; }
    return document.documentElement;
  }
  function mount() {
    var h = home();
    if (tag.parentNode !== h) h.appendChild(tag);
  }
  function start() {
    mount();
    home().appendChild(toast);
    setInterval(mount, 2500);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();

  // fade the tag while someone is actively playing, bring it back when they pause
  var idle = 0;
  function busy() {
    tag.classList.add('asaf-busy');
    clearTimeout(idle);
    idle = setTimeout(function () { tag.classList.remove('asaf-busy'); }, 2600);
  }
  ['pointerdown', 'keydown', 'touchstart', 'wheel'].forEach(function (ev) {
    window.addEventListener(ev, busy, { capture: true, passive: true });
  });

  // ---- cloud saves through the arcade page (strings only cross between the two pages)
  function makeClaude(H, gid) {
    var cache = {};
    function fail(code) { var e = new Error(code || 'unavailable'); e.code = code || 'unavailable'; return e; }
    function call(fn, args) {
      return new Promise(function (res, rej) {
        var p;
        try { p = H[fn].apply(null, [gid].concat(args || [])); } catch (e) { rej(fail('unavailable')); return; }
        Promise.resolve(p).then(function (s) {
          var r;
          try { r = JSON.parse(s); } catch (e) { rej(fail('internal')); return; }
          if (r && r.ok) res(r.v); else rej(fail(r && r.code));
        }, function () { rej(fail('unavailable')); });
      });
    }
    function snap(path, v) {
      var parts = path.split('/');
      return { id: parts[parts.length - 1], exists: v !== null && v !== undefined,
        data: function () { return v === null || v === undefined ? undefined : JSON.parse(JSON.stringify(v)); } };
    }
    function doc(path) {
      return {
        id: path.split('/').pop(), path: path,
        get: function () { return call('get', [path]).then(function (v) { return snap(path, v); }); },
        set: function (data) { return call('set', [path, JSON.stringify(data)]).then(function () {}); }
      };
    }
    function query(path, lim) {
      return {
        path: path,
        limit: function (n) { return query(path, n); },
        doc: function (id) { return doc(path + '/' + id); },
        onSnapshot: function (next, error) {
          var dead = false, off = null;
          function onErr(code) { if (!dead && typeof error === 'function') error(fail(code)); }
          try {
            off = H.watch(gid, path, lim || 0, function (s) {
              if (dead) return;
              var rows; try { rows = JSON.parse(s); } catch (e) { return; }
              var docs = rows.map(function (d) { return snap(path + '/' + d.id, d.v); });
              next({ docs: docs, size: docs.length, empty: !docs.length, forEach: function (f) { docs.forEach(f); } });
            }, onErr);
          } catch (e) { setTimeout(function () { onErr('unavailable'); }, 0); }
          return function () { dead = true; try { if (off) off(); } catch (e) { /* page gone */ } };
        }
      };
    }
    var db = { doc: doc, collection: function (p) { return query(p, 0); } };
    var user = {
      id: function () { return call('uid', []); },
      me: function () { return call('uid', []).then(function (id) { return { id: id }; }); },
      can: function (n) { return call('can', [String(n)]); },
      profiles: function (ids) { return call('profiles', [JSON.stringify(ids || [])]); },
      isOwner: function () { return false; },
      canEdit: function () { return false; }
    };
    return {
      use: function (name) {
        if (!cache[name]) {
          cache[name] = call('ready', [String(name)]).then(function (ok) {
            if (!ok) return null;
            return name === 'db' ? db : name === 'user' ? user : null;
          }, function () { return null; });
        }
        return cache[name];
      }
    };
  }
})();
</script>

:root {
  --bg: #170d34; --panel: rgba(28,17,64,.92); --panel2: #2f1e66; --ink: #0d0820; --pink: #ff4fa3; --cyan: #29d3ff; --yellow: #ffd21f; --orange: #ff8a3d; --green: #3ee08f; --red: #ff5a6a;
  --text: #ffffff; --dim: #b9a8e6;
  --head: 'Bebas Neue', Impact, 'Arial Narrow', sans-serif;
  --body: 'Rubik', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px); --sl: env(safe-area-inset-left, 0px); --sr: env(safe-area-inset-right, 0px);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; }
body { font: 500 15px/1.4 var(--body); touch-action: none; user-select: none; -webkit-user-select: none; overscroll-behavior: none; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--cyan); outline-offset: 2px; }
[hidden] { display: none !important; }
#cv { position: fixed; inset: 0; display: block; touch-action: none; }
.coin { width: 24px; height: 24px; border-radius: 50%; background: radial-gradient(circle at 38% 35%, #fff3b0, #ffd21f 45%, #e0a400); box-shadow: inset 0 0 0 2.5px #7a4a00; flex: none; }

/* ---------- HUD */
#hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
.hbar { position: absolute; left: 0; right: 0; top: 0; display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; padding: calc(10px + var(--st)) calc(10px + var(--sr)) 0 calc(10px + var(--sl)); }
.chip { justify-self: start; display: inline-flex; align-items: center; gap: 7px; height: 40px; padding: 0 14px 0 8px; border-radius: 12px; background: rgba(13,8,32,.62); border: 2px solid rgba(255,210,31,.55); font: 400 26px/1 var(--head); color: var(--yellow); letter-spacing: .03em; }
.hmid { text-align: center; display: flex; flex-direction: column; align-items: center; }
.hmid b { display: block; font: 400 46px/0.95 var(--head); letter-spacing: .03em; text-shadow: 0 3px 0 var(--ink), 0 0 18px rgba(255,79,163,.65); font-variant-numeric: tabular-nums; }
.hmid span { font: 400 20px/1.1 var(--head); letter-spacing: .08em; color: #ffe9a8; text-shadow: 0 2px 0 var(--ink); }
.flowbar { position: relative; width: 150px; height: 12px; margin-top: 6px; border-radius: 6px; background: rgba(13,8,32,.65); border: 2px solid rgba(255,210,31,.45); overflow: hidden; }
.flowbar i { position: absolute; left: 0; top: 0; bottom: 0; width: calc(var(--f, 0) * 100%); background: linear-gradient(90deg, #ff8a3d, #ffd21f); }
.flowbar span { position: absolute; inset: 0; font: 400 11px/9px var(--head); letter-spacing: .2em; text-indent: .2em; color: rgba(255,255,255,.85); text-align: center; }
.flowbar.on { border-color: #fff3b0; box-shadow: 0 0 16px rgba(255,210,31,.8); }
.flowbar.on i { background: linear-gradient(90deg, #fff3b0, #ffd21f, #fff3b0); background-size: 200% 100%; animation: shine .6s linear infinite; }
@keyframes shine { to { background-position: -200% 0; } }
#pauseBtn { pointer-events: auto; justify-self: end; }
.iconbtn { width: 44px; height: 44px; border-radius: 12px; background: rgba(13,8,32,.62); border: 2px solid rgba(255,255,255,.3); display: grid; place-items: center; color: #fff; }
.hleft { position: absolute; left: calc(10px + var(--sl)); top: calc(60px + var(--st)); display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.combo { position: relative; display: flex; align-items: baseline; gap: 8px; padding: 4px 12px 8px; border-radius: 12px; background: rgba(13,8,32,.62); border: 2px solid rgba(41,211,255,.55); opacity: 0; transform: translateX(-12px); transition: opacity .2s, transform .2s; overflow: hidden; }
.combo.on { opacity: 1; transform: none; }
.combo b { font: 400 34px/1 var(--head); color: var(--cyan); text-shadow: 0 2px 0 var(--ink); }
.combo span { font: 400 22px/1 var(--head); letter-spacing: .04em; font-variant-numeric: tabular-nums; }
.combo i { position: absolute; left: 0; bottom: 0; height: 4px; width: calc(var(--f, 0) * 100%); background: var(--cyan); }
.combo.pulse { animation: pulse .3s ease; }
@keyframes pulse { 40% { transform: scale(1.12); } }
.pows { display: flex; gap: 6px; }
.pw { position: relative; width: 40px; height: 40px; border-radius: 12px; background: rgba(13,8,32,.65); border: 2px solid var(--c); overflow: hidden; display: grid; place-items: center; }
.pw canvas { width: 30px; height: 30px; } .pw i { position: absolute; left: 0; bottom: 0; height: 4px; background: var(--c); width: calc(var(--f) * 100%); }
.split { position: absolute; top: calc(118px + var(--st)); left: 50%; transform: translateX(-50%); font: 400 24px/1 var(--head); letter-spacing: .05em; padding: 4px 12px; border-radius: 10px; background: rgba(13,8,32,.7); opacity: 0; transition: opacity .3s; }
.split.on { opacity: 1; } .split.ahead { color: var(--green); } .split.behind { color: var(--red); }
.goal { position: absolute; right: calc(10px + var(--sr)); top: calc(62px + var(--st)); text-align: right; font: 400 20px/1.1 var(--head); letter-spacing: .05em; padding: 6px 12px; border-radius: 10px; background: rgba(13,8,32,.62); border: 2px solid rgba(255,210,31,.4); max-width: 46vw; }
.goal:empty { display: none; }
.goal small { display: block; font: 600 11px/1.2 var(--body); letter-spacing: .02em; color: var(--dim); }
.drone { position: absolute; left: 50%; top: calc(150px + var(--st)); transform: translateX(-50%); font: 400 18px/1 var(--head); letter-spacing: .1em; color: #fff; padding: 6px 14px; border-radius: 999px; background: rgba(200,30,50,.8); opacity: 0; transition: opacity .3s; white-space: nowrap; }
.drone.on { opacity: 1; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { background: rgba(120,20,40,.85); } }
.cue { position: absolute; left: 50%; top: 44%; transform: translate(-50%, 10px); max-width: 88vw; text-align: center; font: 400 24px/1.15 var(--head); letter-spacing: .06em; padding: 10px 18px; border-radius: 14px; background: rgba(13,8,32,.82); border: 2px solid rgba(255,210,31,.6); color: #ffe9a8; opacity: 0; transition: opacity .25s, transform .25s; }
.cue.on { opacity: 1; transform: translate(-50%, 0); }
.banner { position: absolute; left: 0; right: 0; top: 23%; text-align: center; opacity: 0; transform: scale(.9); transition: opacity .4s, transform .4s; }
.banner.on { opacity: 1; transform: none; }
.banner small { display: block; font: 600 13px/1 var(--body); letter-spacing: .3em; color: #ffe9a8; text-transform: uppercase; }

const SAVE_KEY = 'skylinesprint.save.v1';
function defaultSave() {
  return {
    v: 2, coins: 0, skin: 'dash', skins: { dash: true }, trail: 'none', trails: { none: true },
    upg: { magnet: 0, glider: 0, rocket: 0, double: 0, flow: 0 },
    best: 0, bestCoins: 0, bestScore: 0, bestMult: 1,
    daily: { idx: -1, best: 0, coins: 0, tries: 0, paid: false, score: 0, ghost: '' },
    mis: { slots: ['dist', 'vaults', 'coins'], tier: {}, done: 0 },
    stats: { runs: 0, meters: 0, coins: 0, jumps: 0, powers: 0, tricks: 0, walls: 0, vaults: 0, rolls: 0, flows: 0, secrets: 0, zips: 0, gems: 0, trains: 0 },
    districts: { oldtown: true }, start: 'oldtown', trials: {}, chal: {}, ach: {},
    login: { last: -1, streak: 0 },
    settings: { sound: true, music: true, haptics: true, ghost: true }, seen: {}, updated: 0,
  };
}
function mergeSaves(a, b) {
  const newer = (a.updated || 0) >= (b.updated || 0) ? a : b, older = newer === a ? b : a;
  const out = JSON.parse(JSON.stringify(newer));
  for (const k of ['best', 'bestCoins', 'bestScore', 'bestMult']) out[k] = Math.max(a[k] || 0, b[k] || 0);
  for (const k in older.skins) if (older.skins[k]) out.skins[k] = true;
  for (const k in older.trails || {}) if (older.trails[k]) out.trails[k] = true;
  for (const k in older.districts || {}) if (older.districts[k]) out.districts[k] = true;
  for (const k in older.chal || {}) out.chal[k] = true;
  for (const k in older.ach || {}) out.ach[k] = true;
  for (const k in older.upg) out.upg[k] = Math.max(out.upg[k] || 0, older.upg[k] || 0);
  for (const k in older.stats) out.stats[k] = Math.max(out.stats[k] || 0, older.stats[k] || 0);
  for (const k in older.seen) out.seen[k] = true;
  for (const k in older.trials || {}) {
    const o = older.trials[k], n = out.trials[k];
    if (!n || (o.best && (!n.best || o.best < n.best))) out.trials[k] = JSON.parse(JSON.stringify(o));
    if (n && o.medal > (out.trials[k].medal || 0)) out.trials[k].medal = o.medal;
  }
  if ((older.mis.done || 0) > (out.mis.done || 0)) out.mis = JSON.parse(JSON.stringify(older.mis));
  const d1 = out.daily, d2 = older.daily;
  if (d2.idx > d1.idx) out.daily = JSON.parse(JSON.stringify(d2));
  else if (d2.idx === d1.idx) {
    if ((d2.score || 0) > (d1.score || 0)) { d1.score = d2.score; d1.best = d2.best; d1.coins = d2.coins; d1.ghost = d2.ghost; }
    d1.tries = Math.max(d1.tries, d2.tries); d1.paid = d1.paid || d2.paid;
  }
  if ((older.login.last || 0) > (out.login.last || 0)) out.login = JSON.parse(JSON.stringify(older.login));
  return out;
}

function deepFill(t, d) {
  for (const k in d) {
    if (t[k] === undefined || t[k] === null) t[k] = JSON.parse(JSON.stringify(d[k]));
    else if (d[k] && typeof d[k] === 'object' && !Array.isArray(d[k]) && typeof t[k] === 'object') deepFill(t[k], d[k]);
  }
  return t;
}

  },
  persistLocal() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(this.data)); } catch (e) { /* ignore */ } },

  async cloudInit() {

      const [db, user] = await Promise.all([cl.use('db'), cl.use('user')]);
      if (!db || !user) return;
      const id = await user.id();
      if (!id) return;
      const ref = db.doc('data/users/' + id + '/save');
      let timer = 0;
      const snap = await Promise.race([ref.get(), new Promise((_, rej) => { timer = setTimeout(() => rej(new Error('timeout')), 10000); })]);
      clearTimeout(timer);
      this.cloud.ref = ref;
      if (snap && snap.exists) {
        const body = snap.data();
        if (body && body.save) {
          const remote = deepFill(JSON.parse(JSON.stringify(body.save)), defaultSave());
          this.cloud.lastJson = JSON.stringify(body.save);

// ---------------------------------------------------------------- kit/codes.js (short brag codes you can paste in a group chat)
// Each field is [name, bits]. The code carries an 11-bit checksum, so a typo or a made-up code is rejected.
const B32 = '0123456789ABCDEFGHJKMNPQRSTVWXYZ'; // no I, L, O, U: easy to read out loud
function makeCodec(salt, fields) {
  const bits = fields.reduce((s, f) => s + f[1], 0) + 11, chars = Math.ceil(bits / 5);
  const rawOf = (f) => { let raw = ''; for (const [k] of fields) raw += f[k] + '.'; return raw; };
  return {
    chars,
    encode(obj) {
      let n = 0n;
      const f = {};
      for (const [k, b] of fields) { f[k] = clamp(Math.floor(obj[k] || 0), 0, (1 << b) - 1); n = (n << BigInt(b)) | BigInt(f[k]); }
      n = (n << 11n) | BigInt(hash32(salt + '|' + rawOf(f)) & 0x7FF);
      let s = '';
      for (let i = 0; i < chars; i++) { s = B32[Number(n & 31n)] + s; n >>= 5n; }
      const parts = [];
      for (let i = 0; i < s.length; i += 4) parts.push(s.slice(i, i + 4));
      return parts.join('-');
    },
    decode(code) {
      const s = String(code || '').toUpperCase().replace(/[^0-9A-Z]/g, '').replace(/O/g, '0').replace(/[IL]/g, '1');
      if (s.length !== chars) return null;
      let n = 0n;
      for (const ch of s) { const v = B32.indexOf(ch); if (v < 0) return null; n = (n << 5n) | BigInt(v); }
      const chk = Number(n & 0x7FFn); n >>= 11n;
      const f = {};
      for (let i = fields.length - 1; i >= 0; i--) { const [k, b] = fields[i]; f[k] = Number(n & BigInt((1 << b) - 1)); n >>= BigInt(b); }
      if ((hash32(salt + '|' + rawOf(f)) & 0x7FF) !== chk) return null;
      return f;
    },
  };
}

class Mixer {

    if (hold) p.setValueAtTime(Math.max(0.0002, peak), t + a + hold);

const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);

// sound effects pass through here: one AudioContext, opened on the first tap
const Snd = {
  ac: null, mx: null, last: {},
  muted() { return false; }, // a game can silence its attract mode
  init() {
    if (this.ac) { if (this.ac.state === 'suspended') this.ac.resume().catch(() => {}); return; }
    try {
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return;
      this.ac = new C(); this.mx = new Mixer(this.ac);
      this.apply();
      if (this.onInit) this.onInit();
    } catch (e) { this.ac = null; }
  },
  apply() {
    if (!this.mx) return;
    const s = Save.data.settings, t = this.ac.currentTime;
    this.mx.sfx.gain.setTargetAtTime(s.sound ? 0.9 : 0, t, 0.03);
    this.mx.music.gain.setTargetAtTime(s.music ? 0.45 : 0, t, 0.05);
  },
  ready() { return !!this.mx && this.ac.state === 'running'; },
  gap(key, sec) { const n = this.ac.currentTime; if (n - (this.last[key] || 0) < sec) return false; this.last[key] = n; return true; },
  play(key, gap, fn, ui) {
    if (!this.ready() || !Save.data.settings.sound || (!ui && this.muted())) return;
    if (gap && !this.gap(key, gap)) return;
    try { fn(this.mx, this.ac.currentTime + 0.005, this.mx.sfx); } catch (e) { /* audio busy */ }
  },
};

// step sequencer: a song is { bpm, steps (per bar), play(mx, t, step, spb) }
const Music = {
  on: false, song: null, step: 0, next: 0,
  start(song) { if (!Snd.mx) return; if (this.on && this.song === song) return; this.song = song; this.on = true; this.step = 0; this.next = Snd.ac.currentTime + 0.1; if (song.reset) song.reset(); },
  stop() { this.on = false; this.song = null; },
  pump() {
    if (!this.on || !this.song || !Snd.ready()) return;
    const ac = Snd.ac, s = this.song, spb = 60 / s.bpm / (s.div || 4);
    if (this.next < ac.currentTime - 0.3) this.next = ac.currentTime + 0.05;
    while (this.next < ac.currentTime + 0.2) {
      try { s.play(Snd.mx, this.next, this.step, spb); } catch (e) { /* skip a beat */ }
      this.next += spb; this.step++;
    }
  },
};

// ---------------------------------------------------------------- player.js (the runner's body: run, jump, slide, vault, wall run, roll, zipline)
// Pure step function so the bot can look ahead with copies. Events go to R.ev; the game turns them into tricks.
const W2 = RUN_W / 2;
const Run = {
  make(x, y) {
    return {
      x, y, vy: 0, vx: 0, h: RUN_H, st: 'run', ground: true, coyote: 0, buffer: 0, holding: false, hold: 0, air: 0,
      slideT: 0, slideX: 0, slideHeld: false, slideBuf: 0, dive: false, wall: null, wallT: 0, wallDone: -1, wjId: -1, press: null,
      zip: null, zipCd: 0, vault: 0, roll: 0, rollWin: 0, hard: 0, boost: 0, sup: null, lastGroundY: y, t: 0,
      hit: [], under: [], ev: [], glide: false, ventCd: 0, dead: false, landT: 0, airT: 0,
    };
  },
  clone(R) { const c = Object.assign({}, R); c.hit = R.hit.slice(); c.under = R.under.slice(); c.ev = []; return c; },

  // ---------- world queries (W is the World: solids, plats, zips, vents, glass)
  surfaceUnder(R, W, yMin, yMax) {
    // the highest surface under the feet whose top lies in [yMin, yMax]
    const a = R.x - W2 + 3, b = R.x + W2 - 3;
    let best = null, top = Infinity, bdx = 0;
    for (const s of W.solidsIn(a, b)) {
      if (s.broken || s.x1 <= a || s.x0 >= b || s.y0 < yMin || s.y0 > yMax) continue;
      if (R.hit.indexOf(s.id) >= 0 && s.k !== 'bld') continue;
      if (s.y0 < top) { top = s.y0; best = s; bdx = 0; }
    }
    for (const p of W.platsIn(a, b, R.x)) {
      const dx = W.dxOf(p, R.x), px0 = p.x0 + dx, px1 = p.x1 + dx;
      if (px1 <= a || px0 >= b || p.y < yMin || p.y > yMax) continue;
      if (p.y < top) { top = p.y; best = p; bdx = dx; }
    }
    return best ? { s: best, y: top, dx: bdx } : null;
  },
  gapAhead(W, sup, y, rx) {

    for (const p of W.platsIn(x1 + 2, x1 + 30, rx)) { const px0 = p.x0 + W.dxOf(p, rx); if (p !== sup.s && px0 <= x1 + 8 && p.x1 + W.dxOf(p, rx) > x1 + 2 && p.y <= y + 40 && p.y >= y - 200) return false; }
    return true;
  },

  // ---------- actions
  jump(R, W, v, coyote) {
    const sup = R.sup, s = sup && sup.s;
    // vault: a low thing right in front of us
    if (!coyote && R.ground) {
      let vo = null, d = 1e9;
      for (const o of W.solidsIn(R.x, R.x + 200)) {
        if (o.k !== 'obs' || o.broken || R.hit.indexOf(o.id) >= 0) continue;
        const dd = o.x0 - (R.x + W2);
        if (dd >= -2 && dd <= v * 0.19 + 12 && o.y0 >= R.y - 66 && o.y1 >= R.y - 2 && dd < d) { d = dd; vo = o; }
      }
      if (vo) {
        R.takeoff = R.y; R.vy = -VAULT_V; R.holding = false; R.st = 'vault'; R.vault = 0.42; R.boost = Math.max(R.boost, VAULT_BOOST);
        R.ground = false; R.coyote = 0; R.buffer = 0; R.h = RUN_H; R.air = 0;

      }

      for (const vt of W.vents) {
        if (R.x >= vt.x0 - 4 && R.x <= vt.x1 + 4 && Math.abs(R.y - vt.y) < 6) {
          R.takeoff = R.y; R.vy = -VENT_V; R.holding = false; R.st = 'air'; R.ground = false; R.buffer = 0; R.h = RUN_H; R.air = 0; R.ventCd = 0.3;
          R.ev.push({ k: 'launch', vt });

        }

    }

    if (s) {

      else if (e <= 44 && this.gapAhead(W, sup, R.y, R.x)) R.ev.push({ k: 'edge', p: e <= 18 });

  },
  startSlide(R) {

  },
  headroom(R, W, h) {

  },

  // ---------- one step
  step(R, I, dt, W, v) {

      } else {
        // heads up: ceilings
        const a = R.x - W2 + 2, b = R.x + W2 - 2;
        let ceil = -Infinity;
        for (const s of W.solidsIn(a, b)) {
          if (s.broken || s.x1 <= a || s.x0 >= b || R.hit.indexOf(s.id) >= 0) continue;
          if (s.y1 <= y0 - R.h + 0.5 && s.y1 > y1 - R.h) ceil = Math.max(ceil, s.y1);
        }
        if (ceil > -Infinity) { R.y = ceil + R.h; R.vy = 0; } else R.y = y1;
      }
      // reach the top of the wall: climb over
      if (R.st === 'wall' && R.wall && R.y - R.wall.y0 <= 14 && R.y - R.wall.y0 >= -60) {
        R.y = R.wall.y0; R.takeoff = R.y; R.x += 3; R.ground = true; R.vy = 0; R.st = 'run'; R.h = RUN_H; R.air = 0; R.hard = 0.2;
        R.sup = { s: R.wall, y: R.wall.y0 }; R.lastGroundY = R.y; R.wall = null;
        R.ev.push({ k: 'mantle' });
      }
    }

    // ---- states on the ground
    if (R.ground) {
      if (R.st === 'slide') {
        R.slideT -= dt;
        if ((R.slideT <= 0 && !R.slideHeld) || R.slideT < -0.8) { if (this.headroom(R, W, RUN_H)) { R.st = 'run'; R.h = RUN_H; } }
      } else if (R.st === 'roll') {
        R.roll -= dt;
        if (R.roll <= 0) { if (this.headroom(R, W, RUN_H)) { R.st = 'run'; R.h = RUN_H; } else { R.st = 'slide'; R.slideT = 0.2; } }
      } else if (R.st !== 'run') { R.st = 'run'; R.h = RUN_H; }
    }
    // sliding under things
    if (R.st === 'slide' || R.st === 'roll') {
      for (const s of W.solidsIn(R.x - W2, R.x + W2)) {
        if (s.k !== 'high' || s.broken || R.hit.indexOf(s.id) >= 0 || s.x1 < R.x - W2 || s.x0 > R.x + W2) continue;
        if (s.y1 > R.y - SLIDE_H - 2 || s.y1 < R.y - RUN_H - 6) continue;
        if (!R.under.some((u) => u.s === s)) R.under.push({ s, p: s.x0 - R.slideX < v * 0.42 });
      }
    }
    if (R.under.length) {
      for (let i = R.under.length - 1; i >= 0; i--) {
        const u = R.under[i];
        if (R.x - W2 > u.s.x1) { R.ev.push({ k: 'under', p: u.p, s: u.s }); R.under.splice(i, 1); }
      }
    }
    // zipline grab
    if (!R.ground && R.zipCd <= 0 && R.st !== 'wall') {
      for (const z of W.zips) {
        if (R.x < z.x0 || R.x > z.x1 - 40) continue;
        const cy = z.y0 + (z.y1 - z.y0) * (R.x - z.x0) / (z.x1 - z.x0), hand = R.y - 62;
        if (Math.abs(hand - cy) < 16 + Math.abs(R.vy) * dt) {
          R.st = 'zip'; R.zip = z; R.y = cy + 62; R.vy = 0; R.air = 0; R.dive = false; R.holding = false; R.h = RUN_H;
          R.ev.push({ k: 'zip', z });
          break;
        }
      }
    }
    // windows into secret routes
    for (const gl of W.glass) {
      if (gl.taken || R.x + W2 < gl.x0 || R.x - W2 > gl.x1 || R.y < gl.y0 || R.y - R.h > gl.y1) continue;
      R.ev.push({ k: 'secret', g: gl });
    }
    // falling off the world
    if (!R.ground && R.y > R.lastGroundY + 640) { R.dead = true; R.ev.push({ k: 'fall' }); }
  },
  land(R, W, land, v) {
    const impact = R.vy;
    const wasWall = R.st === 'wall' || R.press;
    R.ground = true; R.vy = 0; R.air = 0; R.holding = false; R.sup = land; R.lastGroundY = land.y; R.airT = 0;
    R.ev.push({ k: 'land', v: impact });
    if (land.s.train) R.ev.push({ k: 'train', p: land.s });
    if (wasWall && R.press && R.press.y0 < R.y - STEP) {
      // slid down a wall we could not climb: we are stuck against it
      R.st = 'run'; R.wall = null; R.dive = false;
      R.ev.push({ k: 'crash', s: R.press });
      return;
    }
    R.wall = null;
    const drop = land.y - (R.takeoff === undefined ? land.y : R.takeoff);
    R.takeoff = land.y;
    if (impact >= ROLL_IMPACT && drop >= 110) {
      if (R.dive || R.slideBuf > 0) { R.st = 'roll'; R.roll = 0.36; R.h = SLIDE_H; R.ev.push({ k: 'roll' }); }
      else { R.st = 'run'; R.h = RUN_H; R.hard = 0.42; R.rollWin = 0.13; R.landT = 0.2; R.ev.push({ k: 'hard' }); }
    } else if (R.slideHeld || R.slideBuf > 0) this.startSlide(R);
    else { R.st = 'run'; R.h = RUN_H; R.landT = impact > 500 ? 0.14 : 0; }
    R.dive = false;
    if (R.buffer > 0 && R.st !== 'roll') this.jump(R, W, v, false);
  },
  zipStep(R, dt, W, v) {
    const z = R.zip, slope = (z.y1 - z.y0) / (z.x1 - z.x0);
    const sp = Math.max(v, ZIP_V) * (1 + clamp(slope, 0, 0.5) * 0.5);
    R.vx = sp;
    R.x += sp * dt;
    R.y = z.y0 + slope * (R.x - z.x0) + 62;
    if (R.buffer > 0 && R.x > z.x0 + 30) {
      R.st = 'air'; R.zip = null; R.vy = -DJUMP_V; R.air = 0; R.buffer = 0; R.zipCd = 0.35; R.holding = false; R.takeoff = R.y;
      R.ev.push({ k: 'zipjump' });
    } else if (R.x >= z.x1 - 12) {
      R.st = 'air'; R.zip = null; R.vy = 60; R.zipCd = 0.35; R.takeoff = R.y;
      R.ev.push({ k: 'zipend' });
    }
  },
};

// ---------- jump physics tables (the course generator sizes every gap from these)
const JUMPS = (() => {
  const sim = (dbl, holdT) => {
    // returns [t, height] samples of a jump from flat ground (height up = positive)
    let y = 0, vy = -JUMP_V, t = 0, hold = 0, dj = false;
    const pts = [];
    while (t < 3) {
      let g = GRAV;
      if (vy < 0 && hold < holdT) { g *= HOLD_G; hold += 1 / 240; }
      if (dbl && !dj && vy >= -10) { vy = -DJUMP_V; dj = true; }
      vy = Math.min(vy + g / 240, MAX_FALL); y += vy / 240; t += 1 / 240;
      pts.push([t, -y, vy]);
      if (-y < -900) break;
    }
    return pts;
  };
  const one = sim(false, HOLD_T), two = sim(true, HOLD_T);
  const apex = (p) => p.reduce((m, q) => Math.max(m, q[1]), 0);
  return { one, two, apex1: apex(one), apex2: apex(two) };
})();
// the last moment a jump is still at or above height dh while coming down
function airTimeAbove(dh, dbl) {
  let last = 0;
  for (const [t, h, vy] of (dbl ? JUMPS.two : JUMPS.one)) if (h >= dh) last = t;
  return last;
}
// horizontal reach (runner centre travel from take-off at the very edge) to land dh higher
function reachX(v, dh, dbl) { return v * airTimeAbove(dh + 4, dbl); }

// ---------------------------------------------------------------- level.js (the course: buildings, obstacles, routes, set pieces)
// Low things are jumped or vaulted; high things hang over the roof and are passed by sliding.
const OBS_T = {
  ac: { w: 62, h: 46 }, vent: { w: 40, h: 34 }, crate: { w: 50, h: 50 }, skylight: { w: 84, h: 30 }, pipe: { w: 96, h: 30 },
  box: { w: 46, h: 40 }, tank: { w: 60, h: 52 }, desk: { w: 70, h: 36 }, planter: { w: 70, h: 34 },
};
const HIGH_T = {
  sign: { w: 132, gap: 44, top: 300 }, line: { w: 170, gap: 42, top: 74 }, banner: { w: 150, gap: 44, top: 126 },
  pipeH: { w: 160, gap: 44, top: 72 }, beam: { w: 150, gap: 44, top: 96 },
};
const SET_LOW = { oldtown: ['ac', 'vent', 'crate', 'skylight', 'planter'], neon: ['ac', 'vent', 'crate', 'box'], harbor: ['box', 'crate', 'pipe', 'vent'], heights: ['tank', 'crate', 'pipe', 'box'] };
const SET_HIGH = { oldtown: ['line', 'sign', 'pipeH'], neon: ['sign', 'banner', 'pipeH'], harbor: ['pipeH', 'sign', 'banner'], heights: ['beam', 'sign', 'pipeH'] };
const SIGN_WORDS = ['PIZZA', 'SODA', 'ARCADE', 'TACOS', 'COMICS', 'SKATE', 'BURGER', 'MOVIES', 'NOODLES', 'RECORDS', 'DONUTS', 'HOTEL'];

const World = {
  // opts: { seed, district, mode, len (m, trials), speed (flat speed, trials), d (fixed difficulty) }
  start(opts) {
    this.o = opts; this.rng = makeRng(opts.seed >>> 0);
    this.solids = []; this.plats = []; this.trains = []; this.zips = []; this.vents = []; this.glass = [];
    this.coins = []; this.gems = []; this.pows = []; this.cps = []; this.cues = []; this.regions = []; this.highs = [];
    this.id = 1; this.maxW = 0; this.last = ''; this.big = 0; this.n = 0; this.finish = null; this.done = false;
    this.dIdx = Math.max(0, DISTRICTS.findIndex((d) => d.id === (opts.district || 'oldtown')));
    this.regions.push({ x0: -1e9, id: DISTRICTS[this.dIdx].id });
    this.nextRegion = DISTRICTS[this.dIdx].len * PX_M;
    this.nextPow = PX_M * (opts.mode === 'trial' ? 1e9 : 420 + this.rng.range(0, 200));
    this.nextCp = PX_M * 170;
    this.seen = Save.data ? Save.data.seen : {};
    const b = this.bld(-1200, 1500, 0);
    this.coinLine(700, 1300, 0);
    this.x = 1500; this.top = 0;
  },
  dist(x) { let id = this.regions[0].id; for (const r of this.regions) if (x >= r.x0) id = r.id; return id; },
  speed(x) { return this.o.speed ? this.o.speed : speedAt(x); },
  diff(x) { return this.o.d !== undefined ? this.o.d : clamp(x / PX_M / 2200, 0, 1); },

  // ---------- builders
  push(arr, o) { arr.push(o); return o; },
  bld(x0, x1, top, extra) {
    const s = Object.assign({ id: this.id++, k: 'bld', x0, x1, y0: top, y1: top + 4000, dist: this.cur ? this.cur.id : DISTRICTS[this.dIdx].id, seed: this.rng.int(1e6) }, extra || {});
    this.maxW = Math.max(this.maxW, x1 - x0);
    return this.push(this.solids, s);
  },
  block(x0, x1, y0, y1, extra) { const s = Object.assign({ id: this.id++, k: 'bld', x0, x1, y0, y1, dist: this.cur.id, seed: this.rng.int(1e6) }, extra || {}); this.maxW = Math.max(this.maxW, x1 - x0); return this.push(this.solids, s); },
  low(type, x, top) { const o = OBS_T[type]; return this.push(this.solids, { id: this.id++, k: 'obs', type, x0: x, x1: x + o.w, y0: top - o.h, y1: top, seed: this.rng.int(1e6) }); },
  high(type, x, top) { const o = HIGH_T[type]; return this.push(this.solids, { id: this.id++, k: 'high', type, x0: x, x1: x + o.w, y0: top - o.top, y1: top - o.gap, top, seed: this.rng.int(1e6), word: this.rng.int(SIGN_WORDS.length) }); },
  plat(type, x0, x1, y, extra) { return this.push(this.plats, Object.assign({ id: this.id++, type, x0, x1, y, seed: this.rng.int(1e6) }, extra || {})); },
  coinLine(xa, xb, top, dy) { for (let x = xa; x <= xb; x += 46) this.coins.push({ x, y: top + (dy === undefined ? -36 : dy), taken: false }); },
  coinArc(x0, top, span, peak, dyEnd) {
    const n = Math.max(4, Math.round(span / 46));
    for (let i = 0; i <= n; i++) { const f = i / n; this.coins.push({ x: x0 + span * f, y: top - 36 - Math.sin(f * Math.PI) * peak + (dyEnd || 0) * f, taken: false }); }
  },
  gem(x, y) { this.gems.push({ x, y, taken: false }); },
  cue(x, key, text) { if (this.o.mode === 'trial' || this.seen['cue_' + key] || this.cues.some((c) => c.key === key)) return; this.cues.push({ x, key, text }); },

  // ---------- roof contents
  fill(xs, xe, top, v, d, set) {
    const r = this.rng, lows = set || SET_LOW[this.cur.id], highs = SET_HIGH[this.cur.id];
    let x = xs;
    while (x < xe - 70) {
      const room = xe - x;
      if (r.chance(0.3 + 0.42 * d) && room > 110) {
        const p = r();
        if (p < 0.42) {
          const t = lows[r.int(lows.length)], o = OBS_T[t];
          if (x + o.w > xe) break;
          this.low(t, x, top);
          if (r.chance(0.55)) this.coinArc(x - 70, top, o.w + 150, o.h + 46);
          x += o.w + v * r.range(0.72, 1.15);
        } else if (p < 0.72) {
          const t = highs[r.int(highs.length)], o = HIGH_T[t];
          if (x + o.w > xe) break;
          this.high(t, x, top);
          if (r.chance(0.6)) this.coinLine(x - 30, x + o.w + 20, top, -18);
          x += o.w + v * r.range(0.75, 1.15);
        } else if (p < 0.88 && d > 0.2) {
          // a chain of vaults
          const n = 2 + r.int(2);
          for (let i = 0; i < n; i++) {
            const t = lows[r.int(lows.length)], o = OBS_T[t];
            if (x + o.w > xe) break;
            this.low(t, x, top); if (i < n - 1) this.coinArc(x - 50, top, o.w + 110, o.h + 40);
            x += o.w + v * r.range(0.62, 0.8);
          }
          x += v * 0.25;
        } else {
          // low then high
          const a = lows[r.int(lows.length)], b = highs[r.int(highs.length)];
          if (x + OBS_T[a].w + v * 0.75 + HIGH_T[b].w > xe) { x += v * 0.4; continue; }
          this.low(a, x, top); x += OBS_T[a].w + v * r.range(0.72, 0.86);
          this.high(b, x, top); this.coinLine(x - 20, x + HIGH_T[b].w, top, -18);
          x += HIGH_T[b].w + v * r.range(0.8, 1.1);
        }
      } else {
        const L = v * r.range(0.4, 0.85);
        if (r.chance(0.42)) this.coinLine(x, x + Math.min(L, 330), top, r.chance(0.2) ? -150 : -36);
        x += L;
      }
    }
  },
  roof(x0, len, top, lead, tail, v, d, extra) {
    const b = this.bld(x0, x0 + len, top, extra);
    this.fill(x0 + lead, x0 + len - (tail === undefined ? 90 : tail), top, v, d);
    this.x = x0 + len; this.top = top;
    return b;
  },
  // horizontal room needed to clear a gap of dh (positive = landing higher)
  gapFor(v, dh, k, dbl) { return Math.max(70, (reachX(v, dh, dbl) - RUN_W - 34) * k); },

  // ---------- chunks
  chunk() {
    const r = this.rng, x = this.x, v = this.speed(x) * 0.92, d = this.diff(x), m = x / PX_M;
    // district changes (endless): a new region starts at the next building
    if (this.o.mode !== 'trial' && x >= this.nextRegion) {
      this.dIdx = (this.dIdx + 1) % DISTRICTS.length;
      this.regions.push({ x0: x, id: DISTRICTS[this.dIdx].id });
      this.nextRegion = x + DISTRICTS[this.dIdx].len * PX_M;
    }
    this.cur = DIST_BY_ID[this.dist(x)];
    // trial finish line
    if (this.o.mode === 'trial' && m >= this.o.len) {
      const b = this.roof(x + 90, v * 2.6, this.top, 140, 0, v, 0);
      this.finish = { x: b.x0 + 260, y: b.y0 };
      this.bld(b.x1, b.x1 + 6000, b.y0); this.x = b.x1 + 6000; this.done = true;
      return;
    }
    const W = Object.assign({}, this.cur.chunks);
    if (this.o.only) { for (const k in W) W[k] = this.o.only.includes(k) ? 1 : 0; W.run = this.o.only.includes('run') ? 1 : 0.15; }
    if (m < 140 && !this.o.only) { W.zip = 0; W.high = 0; W.secret = 0; W.train = 0; W.girders = 0; W.stairs *= 0.5; }
    if (this.big > 0) { W.zip = 0; W.high = 0; W.secret = 0; W.train = 0; W.girders = 0; }
    if (this.last && W[this.last]) W[this.last] *= 0.25;
    // keep the rooftops inside a band so every height change stays reachable
    if (this.top > 260) { W.drop = 0; W.zip *= 0.3; }
    if (this.top < -260) { W.wall = 0; W.high = 0; W.secret = 0; }
    let tot = 0; for (const k in W) tot += W[k];
    let p = r() * tot, kind = 'run';
    for (const k in W) { p -= W[k]; if (p <= 0) { kind = k; break; } }
    this.last = kind; this.n++;
    if (this.log) this.log.push({ x, kind, top: this.top, v: Math.round(v), d: +d.toFixed(2) });
    this.big = Math.max(0, this.big - 1);
    this['c_' + kind](v, d);
    let b = null;
    for (let i = this.solids.length - 1; i >= 0 && !b; i--) { const s = this.solids[i]; if (s.k === 'bld' && !s.upper && !s.front && s.x1 >= this.x - 1) b = s; }
    // checkpoints on time-trial courses: at the start of a roof
    if (this.o.mode === 'trial' && this.x >= this.nextCp && b && b.x1 - b.x0 > 360) { this.cps.push({ x: b.x0 + 70, y: b.y0, n: this.cps.length + 1 }); this.nextCp = this.x + PX_M * 170; }
    // power-ups on a quiet roof
    if (this.x > this.nextPow) {
      if (b && b.k === 'bld' && b.x1 - b.x0 > 500) {
        const px = (b.x0 + b.x1) / 2;
        if (!this.solids.some((o) => o.k !== 'bld' && Math.abs((o.x0 + o.x1) / 2 - px) < 160)) {
          const k = r() * 10, type = k < 3 ? 'magnet' : k < 5 ? 'double' : k < 7 ? 'shield' : k < 9 ? 'glider' : 'rocket';
          this.pows.push({ x: px, y: b.y0 - 80, type, taken: false });
          this.nextPow = this.x + PX_M * r.range(420, 780);
        }
      }
    }
  },
  c_run(v, d) {
    const r = this.rng, dh = r.chance(0.5) ? 0 : r.range(-20, 20), gap = r.chance(0.6) ? 0 : r.range(30, 70);
    this.roof(this.x + gap, v * r.range(1.6, 2.8), this.top - dh, gap ? v * 0.5 + 60 : 110, 90, v, d);
  },
  c_rest(v, d) { const b = this.roof(this.x, v * this.rng.range(1.2, 1.6), this.top, 100, 60, v, 0); this.coinLine(b.x0 + 80, b.x1 - 80, b.y0); },
  c_gap(v, d) {
    const r = this.rng, big = d > 0.3 && r.chance(0.3);
    let dh = r.range(-110, big ? 40 : 90);
    const top = clamp(this.top - dh, -420, 420); dh = this.top - top;
    const gap = big ? this.gapFor(v, dh, r.range(0.68, 0.82), true) : this.gapFor(v, dh, r.range(0.45, 0.58 + 0.3 * d), false);
    const x0 = this.x + gap;
    if (big) {
      this.coinArc(this.x - 40, this.top, gap + 80, Math.min(JUMPS.apex2 - 60, 260), -dh);
      if (r.chance(0.6)) this.gem(this.x + gap * 0.5, this.top - JUMPS.apex2 + 20);
      this.cue(this.x - v * 0.6, 'dj', 'TAP AGAIN IN THE AIR TO DOUBLE JUMP');
    } else this.coinArc(this.x - 30, this.top, gap + 60, Math.min(JUMPS.apex1 - 40, 70 + gap * 0.25), -dh);
    this.roof(x0, v * r.range(1.3, 2.4), top, v * 0.8 + 90, 90, v, d);
  },
  c_wall(v, d) {
    const r = this.rng, tall = r.chance(Math.min(0.75, 0.35 + d));
    let H = tall ? r.range(135, 215) : r.range(60, 105);
    H = Math.min(H, this.top + 420);
    if (H < 50) return this.c_run(v, d);
    const top = this.top - H, x0 = this.x;
    if (H < 125) { /* climbs on its own */ } else this.cue(x0 - v * 0.9, 'wall', 'TAP WHEN YOU HIT THE WALL TO WALL JUMP');
    for (let y = this.top - 80; y > top - 10; y -= 46) this.coins.push({ x: x0 - 22, y, taken: false });
    this.roof(x0, v * r.range(1.4, 2.2), top, 150, 90, v, d);
  },
  c_drop(v, d) {
    const r = this.rng, H = Math.min(r.range(170, 320), 420 - this.top), top = this.top + H;
    if (H < 130) return this.c_gap(v, d);
    const gap = Math.min(r.range(40, 220), this.gapFor(v, -H, 0.6, false));
    this.coinArc(this.x - 20, this.top, gap + 160, 60, H * 0.85);
    this.cue(this.x - v * 0.5, 'roll', 'SWIPE DOWN AS YOU LAND TO ROLL');
    this.roof(this.x + gap, v * r.range(1.4, 2.2), top, v * 0.85 + 110, 90, v, d);
  },
  c_stairs(v, d) {
    const r = this.rng, n = 3 + r.int(3), up = r.chance(0.5);
    for (let i = 0; i < n; i++) {
      const dh = (up ? 1 : -1) * r.range(45, 85) * (i % 2 && r.chance(0.3) ? -1 : 1);
      const top = clamp(this.top - dh, -420, 420);
      const gap = this.gapFor(v, this.top - top, r.range(0.32, 0.5), false);
      this.coinArc(this.x - 20, this.top, gap + 50, 60, -(this.top - top));
      const b = this.bld(this.x + gap, this.x + gap + v * r.range(0.55, 0.9), top);
      this.x = b.x1; this.top = top;
    }
    this.roof(this.x, v * r.range(0.9, 1.4), this.top, 120, 80, v, d * 0.6);
  },
  c_laundry(v, d) {
    const r = this.rng, b = this.bld(this.x, this.x + v * 4, this.top);

      if (st % 8 === 4) m.clap(t, 0.7);

      if (st % 4 !== 3) m.bass(t, N(ch[0] - 24 + (st % 4 === 2 ? 12 : 0)), spb * 0.9, 0.55, 1800);
      if (st === 0) m.pad(t, ch.map(N), spb * 15, 0.55);
      if ([2, 5, 7, 10, 13].includes(st)) m.lead(t, N(ch[(st * 7) % 3] + 12), spb * 0.8, 0.35, 'sawtooth');
      if (fl()) m.lead(t, N(ch[st % 3] + 24), spb * 0.4, 0.2, 'square');
    } },
    harbor: { bpm: 116, div: 4, play(m, t, s, spb) {
      const prog = [[50, 53, 57], [46, 50, 53], [48, 52, 55], [45, 48, 52]], bar = Math.floor(s / 16) % 4, st = s % 16, ch = prog[bar];
      if (st % 4 === 0 || st === 10) m.kick(t, 0.9);
      if (st % 8 === 4) m.snare(t, 0.7);
      if (st % 2) m.hat(t, 0.35);
      if (st % 2 === 0) m.bass(t, N(ch[0] - 24), spb * 1.8, 0.6, 900);
      if (st === 0) m.pad(t, ch.map(N), spb * 15, 0.7);
      if (st === 8 || st === 11 || st === 14) m.lead(t, N(ch[st % 3] + 12), spb * 1.6, 0.3, 'sawtooth');
      if (fl() && st % 2 === 0) m.lead(t, N(ch[(st >> 1) % 3] + 24), spb * 0.5, 0.2, 'square');
    } },
    heights: { bpm: 136, div: 4, play(m, t, s, spb) {
      const prog = [[62, 66, 69], [59, 62, 66], [55, 59, 62], [57, 61, 64]], bar = Math.floor(s / 16) % 4, st = s % 16, ch = prog[bar];
      if (st % 4 === 0) m.kick(t, 0.9);
      if (st % 8 === 4) m.snare(t, 0.7);
      m.hat(t, st % 2 ? 0.5 : 0.2);
      m.bass(t, N(ch[0] - 24 + (st % 2 ? 12 : 0)), spb * 0.8, 0.45, 2000);
      if (st % 2 === 0) m.bell(t, N(ch[(st / 2) % 3] + 12), spb, 0.25);
      if ([0, 3, 6, 9, 12].includes(st)) m.lead(t, N(ch[st % 3] + 12), spb * 1.2, 0.3, 'triangle');
      if (fl()) m.lead(t, N(ch[st % 3] + 24), spb * 0.4, 0.2, 'square');
    } },
  };
})();

// ---------------------------------------------------------------- meta.js (missions, achievements, records, medals, daily run, codes, shop)
const CODEC = makeCodec('skyline-sprint-2', [['v', 2], ['mode', 2], ['day', 12], ['dist', 17], ['score', 21], ['extra', 11], ['idx', 4]]);
const Meta = {
  dailyState() {
    const d = Save.data.daily, idx = dayIndex();
    if (d.idx !== idx) { d.idx = idx; d.best = 0; d.coins = 0; d.tries = 0; d.paid = false; d.score = 0; d.ghost = ''; }
    return d;
  },
  dailySeed(idx) { return hash32('skyline-daily-' + idx); },
  dailyDistrict(idx) { return DISTRICTS[((idx % DISTRICTS.length) + DISTRICTS.length) % DISTRICTS.length].id; },
  fixSave() {
    const m = Save.data.mis;
    for (let i = 0; i < m.slots.length; i++) if (!MISSIONS[m.slots[i]]) { const nx = MISSION_ORDER.find((k) => m.slots.indexOf(k) < 0); m.slots[i] = nx; }
    if (!SKIN_BY_ID[Save.data.skin]) Save.data.skin = 'dash';
    if (!TRAIL_BY_ID[Save.data.trail]) Save.data.trail = 'none';
  },
  // ---------- missions
  target(type) {
    const M = MISSIONS[type], tier = Save.data.mis.tier[type] || 0, L = M.tiers;
    return tier < L.length ? L[tier] : Math.round(L[L.length - 1] * Math.pow(1.4, tier - L.length + 1) / 10) * 10;
  },
  reward(type) { return 60 + 40 * Math.min(10, Save.data.mis.tier[type] || 0); },
  label(type) { return MISSIONS[type].text.replace('{n}', fmtInt(this.target(type))); },
  value(type) {
    if (!G) return 0;
    switch (type) {
      case 'dist': return G.dist; case 'coins': return G.coins; case 'vaults': return G.st.vaults; case 'walls': return G.st.walls;
      case 'rolls': return G.st.rolls; case 'combo': return G.bestMult; case 'flows': return G.st.flows; case 'slides': return G.st.unders;
      case 'clean': return G.st.cleanBest; case 'gems': return G.gems; case 'score': return G.score; case 'total': return Save.data.stats.coins + G.coins;
    }
    return 0;
  },
  checkMissions(force) {
    if (!G || G.demo || (G.over && !force)) return;
    const m = Save.data.mis;
    G.misNew = G.misNew || {};
    for (let i = 0; i < m.slots.length; i++) {
      const type = m.slots[i];
      if (G.misNew[i] || this.value(type) < this.target(type)) continue;
      const pay = this.reward(type), text = this.label(type);
      Save.data.coins += pay; m.done++;
      m.tier[type] = (m.tier[type] || 0) + 1;
      G.missions.push({ text, pay });
      const k = MISSION_ORDER.indexOf(type);
      for (let j = 1; j <= MISSION_ORDER.length; j++) { const nx = MISSION_ORDER[(k + j) % MISSION_ORDER.length]; if (m.slots.indexOf(nx) < 0 || nx === type) { m.slots[i] = nx; break; } }
      G.misNew[i] = true;   // the next mission in this slot starts counting on the next run
      Save.persist();
      onEvent('mission', text, pay);
    }
  },
  // ---------- challenges
  chalProgress(ch) {
    if (!G) return 0;
    switch (ch.goal) {
      case 'dist': return G.dist; case 'vaults': return G.st.vaults; case 'walls': return G.st.walls; case 'rolls': return G.st.rolls;
      case 'mult': return G.bestMult; case 'flows': return G.st.flows; case 'secrets': return G.st.secrets; case 'zips': return G.st.zips;
      case 'trains': return G.st.trains; case 'gems': return G.gems; case 'noslide': return G.st.noslideBest; case 'clean': return G.st.cleanBest; case 'coins': return G.coins;
    }
    return 0;
  },
  // ---------- achievements (paid when earned)
  checkAch() {
    const S = Save.data, got = [];
    for (const a of ACHIEVEMENTS) if (!S.ach[a.id] && a.test(S)) { S.ach[a.id] = true; S.coins += a.coins; got.push(a); }
    return got;
  },
  // ---------- trials
  trialOpen(i) {
    if (i < 2) return true;
    const S = Save.data, prev = S.trials[TRIALS[i - 1].id];
    return !!(prev && prev.medal) || !!S.districts[TRIALS[i].district];
  },
  medalFor(tr, time) { let m = 0; for (let i = 0; i < 3; i++) if (time <= tr.medals[i]) m = i + 1; return m; },
  // ---------- daily login gift
  login() {
    const S = Save.data, L = S.login, today = dayIndex();
    if (L.last === today) return null;
    L.streak = L.last === today - 1 ? L.streak + 1 : 1; L.last = today;
    const coins = LOGIN_COINS[(L.streak - 1) % LOGIN_COINS.length];
    S.coins += coins; Save.persist();
    return { day: ((L.streak - 1) % LOGIN_COINS.length) + 1, streak: L.streak, coins };
  },
  // ---------- the run is over
  finish() {
    this.checkMissions(true);
    const S = Save.data, dist = Math.floor(G.dist);
    const res = { mode: G.mode, dist, score: G.score, coins: G.coins, gems: G.gems, mult: G.bestMult, tricks: G.st.tricks, cause: G.cause, won: G.won, newBest: false, best: 0, missions: G.missions, skin: G.skin.id, bonus: 0, time: G.time, st: G.st };
    S.stats.runs++; S.stats.meters += dist; S.stats.coins += G.coins; S.stats.jumps += G.st.jumps; S.stats.powers += G.st.powers;
    for (const k of ['tricks', 'walls', 'vaults', 'rolls', 'flows', 'secrets', 'zips', 'trains']) S.stats[k] = (S.stats[k] || 0) + (G.st[k] || 0);
    S.stats.gems = (S.stats.gems || 0) + G.gems;
    S.coins += G.coins;
    for (const q of World.regions) if (q.x0 <= G.R.x) S.districts[q.id] = true;
    S.bestMult = Math.max(S.bestMult || 1, G.bestMult);
    if (G.mode === 'endless' || G.mode === 'challenge') {
      if (dist > S.best) { res.newBest = S.best > 0; S.best = dist; }
      if (G.score > S.bestScore) { res.newScore = S.bestScore > 0; S.bestScore = G.score; }
      S.bestCoins = Math.max(S.bestCoins, G.coins);
      res.best = S.best; res.bestScore = S.bestScore;
    }
    if (G.mode === 'daily') {
      const d = this.dailyState();
      d.tries++;
      if (G.score > (d.score || 0)) { res.newBest = d.score > 0; d.score = G.score; d.best = dist; d.coins = G.coins; d.ghost = Ghost.encode(G.rec.f.slice(0, 1800)); }
      if (!d.paid) { d.paid = true; S.coins += 100; res.bonus = 100; }
      res.best = d.score; res.day = d.idx;
    }
    if (G.tr) {
      const tr = G.tr, rec = S.trials[tr.id] || (S.trials[tr.id] = { best: 0, medal: 0, ghost: '' });
      res.trial = tr.id;
      if (G.won) {
        const t = Math.round(G.time * 100) / 100, medal = this.medalFor(tr, t), old = rec.medal || 0;
        res.time = t; res.medal = medal;
        if (!rec.best || t < rec.best) { res.newBest = !!rec.best; rec.best = t; rec.ghost = Ghost.encode(G.rec.f); }
        if (medal > old) { const pay = [0, 50, 100, 200]; res.bonus = pay[medal] - pay[old]; S.coins += res.bonus; rec.medal = medal; res.newMedal = true; }
        res.best = rec.best;
      }
    }
    if (G.ch) {
      res.chal = G.ch.id;
      if (G.won && !S.chal[G.ch.id]) { S.chal[G.ch.id] = true; S.coins += G.ch.coins; res.bonus = G.ch.coins; res.firstClear = true; }
    }
    res.ach = this.checkAch();
    Save.persist();
    res.code = this.code(res);
    return res;
  },
  code(res) {
    const tr = res.trial ? TRIALS.findIndex((t) => t.id === res.trial) : -1;
    return CODEC.encode({ v: 2, mode: res.mode === 'daily' ? 0 : tr >= 0 ? 2 : 1, day: res.mode === 'daily' ? res.day : dayIndex(), dist: Math.min(131071, res.dist), score: Math.min(2097151, res.score),
      extra: tr >= 0 ? Math.min(2047, Math.round((res.time || 0) * 10)) : Math.min(2047, res.coins), idx: tr >= 0 ? tr : Math.max(0, SKINS.findIndex((s) => s.id === res.skin)) });
  },
  decode(code) {
    const f = CODEC.decode(code);
    if (!f || f.v !== 2 || f.mode > 2) return null;
    if (f.mode === 2) { if (f.idx >= TRIALS.length) return null; return { mode: 'trial', day: f.day, trial: TRIALS[f.idx], time: f.extra / 10, dist: f.dist, score: f.score }; }
    if (f.idx >= SKINS.length) return null;
    return { mode: f.mode === 0 ? 'daily' : 'endless', day: f.day, dist: f.dist, score: f.score, coins: f.extra, skin: SKINS[f.idx] };
  },
  brag(res) {
    if (res.trial) { const tr = TRIAL_BY_ID[res.trial]; return '🏙️ Skyline Sprint · ' + tr.name + '\n⏱️ ' + res.time.toFixed(2) + ' s' + (res.medal ? ' · ' + MEDALS[res.medal] + ' medal' : '') + '\nBeat my time: ' + res.code; }
    const head = res.mode === 'daily' ? '🏙️ Skyline Sprint · Daily Run #' + (res.day + 1) + ' (' + dayLabel(res.day) + ')' : '🏙️ Skyline Sprint · ' + (res.newScore || res.newBest ? 'new best!' : 'endless run');
    return head + '\n🏃 ' + fmtInt(res.dist) + ' m · ⭐ ' + fmtInt(res.score) + ' pts · x' + res.mult + ' combo\nBeat me: ' + res.code;
  },
  // ---------- shop
  buySkin(id) {
    const s = SKIN_BY_ID[id], S = Save.data;
    if (S.skins[id]) { S.skin = id; Save.persist(); return true; }
    if (S.coins < s.cost) return false;
    S.coins -= s.cost; S.skins[id] = true; S.skin = id; Save.persist(); return true;
  },
  buyTrail(id) {
    const s = TRAIL_BY_ID[id], S = Save.data;
    if (S.trails[id]) { S.trail = id; Save.persist(); return true; }
    if (S.coins < s.cost) return false;
    S.coins -= s.cost; S.trails[id] = true; S.trail = id; Save.persist(); return true;
  },
  buyUpgrade(id) {
    const S = Save.data, lv = S.upg[id] || 0;
    if (lv >= UP_COST.length || S.coins < UP_COST[lv]) return false;
    S.coins -= UP_COST[lv]; S.upg[id] = lv + 1; Save.persist(); return true;
  },
};

// ---------------------------------------------------------------- input.js (tap = jump, hold = higher; slide zone, swipe down or S = slide)
const Input = {
  active: false, ptrs: {}, edge: { jump: false, slide: false }, keyJ: false, keyS: false, swipeCancel: false,
  init(cv) {
    const zoneSlide = (x, y) => x < window.innerWidth * 0.34 && y > window.innerHeight * 0.3 && window.innerWidth < 1000;
    cv.addEventListener('pointerdown', (e) => {
      if (!this.active || (e.pointerType === 'mouse' && e.button !== 0 && e.button !== 2)) return;
      Snd.init();
      const slide = e.button === 2 || (e.pointerType !== 'mouse' && zoneSlide(e.clientX, e.clientY));
      this.ptrs[e.pointerId] = { y: e.clientY, x: e.clientX, t: performance.now(), slide, swiped: false };
      if (slide) { this.edge.slide = true; UI.zone('slide', true); }
      else { this.edge.jump = true; UI.zone('jump', true); }
      if (G && !G.started) Main.go();
      try { cv.setPointerCapture(e.pointerId); } catch (er) { /* fine */ }
      e.preventDefault();
    });
    cv.addEventListener('contextmenu', (e) => e.preventDefault());
    cv.addEventListener('pointermove', (e) => {
      const p = this.ptrs[e.pointerId];
      if (!p || p.swiped || p.slide || !this.active || !G) return;
      if (e.clientY - p.y > 30 && e.clientY - p.y > Math.abs(e.clientX - p.x) && performance.now() - p.t < 350) {
        // a swipe starts with a press: swap the hop it made for a slide
        p.swiped = true; p.slide = true; this.edge.slide = true; this.swipeCancel = true;
      }
    });
    const up = (e) => { if (this.ptrs[e.pointerId]) { delete this.ptrs[e.pointerId]; UI.zone('slide', this.held('slide')); UI.zone('jump', this.held('jump')); } };
    cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up); cv.addEventListener('lostpointercapture', up);
    window.addEventListener('keydown', (e) => {
      if (UI.typing()) return;
      const k = e.code;
      if (k === 'Escape' || k === 'KeyP') { if (!e.repeat && this.active) UI.pause(); e.preventDefault(); return; }
      if (!this.active) return;
      if (k === 'Space' || k === 'ArrowUp' || k === 'KeyW' || k === 'KeyK') { if (!e.repeat) { Snd.init(); this.edge.jump = true; this.keyJ = true; if (G && !G.started) Main.go(); } e.preventDefault(); }
      else if (k === 'ArrowDown' || k === 'KeyS' || k === 'KeyJ') { if (!e.repeat) { this.edge.slide = true; this.keyS = true; if (G && !G.started) Main.go(); } e.preventDefault(); }
    });
    window.addEventListener('keyup', (e) => {
      const k = e.code;
      if (k === 'Space' || k === 'ArrowUp' || k === 'KeyW' || k === 'KeyK') this.keyJ = false;
      else if (k === 'ArrowDown' || k === 'KeyS' || k === 'KeyJ') this.keyS = false;
    });
    window.addEventListener('blur', () => { this.ptrs = {}; this.keyJ = this.keyS = false; });
  },
  held(kind) { for (const id in this.ptrs) if (!!this.ptrs[id].slide === (kind === 'slide')) return true; return false; },
  take() {
    const I = { jump: this.edge.jump, slide: this.edge.slide, jumpHeld: this.keyJ || this.held('jump'), slideHeld: this.keyS || this.held('slide') };
    // undo the hop a swipe began with
    if (this.swipeCancel && G && G.R && !G.R.ground && G.R.vy < 0 && G.R.st === 'air' && G.R.air === 0) { G.R.vy = Math.max(G.R.vy, -120); G.st.jumps = Math.max(0, G.st.jumps - 1); }
    this.swipeCancel = false;
    this.edge.jump = false; this.edge.slide = false;
    return I;
  },
  reset() { this.ptrs = {}; this.edge.jump = this.edge.slide = false; this.keyJ = this.keyS = false; },
};

// ---------------------------------------------------------------- main.js (boot, the title-screen demo, runs, the frame loop, events)
const Main = {
  state: 'title', paused: false, lastCfg: null, res: null, last: 0, overShown: false,
  boot() {
    Save.load(); Meta.fixSave();
    Render.init($('cv')); Render.resize();
    Input.init($('cv')); UI.init();
    Snd.onInit = () => this.music();
    Save.onRemote = () => { Meta.fixSave(); if (this.state === 'title') UI.title(); };
    Save.cloudInit();
    addEventListener('resize', () => Render.resize());
    document.addEventListener('visibilitychange', () => { if (document.hidden && this.state === 'run' && G && G.started && !G.over) UI.pause(); });
    addEventListener('pointerdown', () => Snd.init(), true);
    this.toTitle();
    const gift = Meta.login();
    if (gift) setTimeout(() => UI.loginGift(gift), 500);
    this.last = performance.now();
    requestAnimationFrame((t) => this.frame(t));
  },
  demo() {
    Game.start({ mode: 'demo', district: Save.data.start || 'oldtown' });
    G.started = true;
  },
  toTitle() {
    this.state = 'title'; this.paused = false; Input.active = false; Input.reset();
    UI.hudHide(); this.demo(); UI.title(); this.music();
  },
  play(cfg) {
    this.lastCfg = cfg; this.state = 'run'; this.paused = false; this.overShown = false; this.res = null;
    UI.hide(); UI.close();
    Game.start(cfg);
    Bot.reset();
    Input.reset(); Input.active = true;
    UI.hudStart();
    Game.camera(0, true);
    this.music();
  },
  go() {
    if (!G || G.started) return;
    G.started = true; Sfx.go();
    if (G.tr) UI.banner(DIST_BY_ID[G.tr.district].name.toUpperCase(), G.tr.name.toUpperCase(), 1.8);
    else UI.banner(G.ch ? 'CHALLENGE' : G.mode === 'daily' ? 'DAILY RUN' : 'ENDLESS RUN', DIST_BY_ID[G.district].name.toUpperCase(), 1.8);
  },
  music() {
    if (!Snd.mx) return;
    if (this.state !== 'run') { Music.start(SONGS.menu); return; }
    const id = G ? World.dist(G.R.x) : 'oldtown';
    Music.start(SONGS[id] || SONGS.oldtown);
  },
  over() {
    this.res = Meta.finish();
    Input.active = false;
  },
  frame(now) {
    requestAnimationFrame((t) => this.frame(t));
    let dt = (now - this.last) / 1000; this.last = now;
    if (!(dt > 0)) dt = 0; if (dt > 0.05) dt = 0.05;
    Music.pump();
    if (!this.paused && G) {
      const I = this.state === 'run' ? Input.take() : { jump: false, slide: false, jumpHeld: false, slideHeld: false };
      Game.update(dt, I);
      if (G.demo && (G.over && G.overT > 1.2 || G.dist > 2500)) this.demo();
      if (this.state === 'run' && G.over && G.overT > (G.won ? 1.0 : 1.3) && !this.overShown) {
        this.overShown = true; this.state = 'results'; UI.hudHide(); UI.results(this.res); this.music();
      }
    }
    Render.frame(this.paused ? 0 : dt);
    if (this.state === 'run') UI.hud(dt);
    if (!this.paused && G && !G.demo && G.started && !G.over && Math.floor(G.t * 60) % 30 === 0) Meta.checkMissions();
  },
};
function buzz(ms) { if (Save.data && Save.data.settings.haptics) vibrate(ms); }
// everything the game reports ends up here: sounds, HUD and small reactions
function onEvent(k, a, b) {
  if (!G || G.demo) { if (k === 'thunder' && Main.state === 'run') Sfx.thunder(); return; }
  switch (k) {
    case 'jump': Sfx.jump(); break;
    case 'djump': Sfx.djump(); Render.spin = TAU; Render.spinT = 0.38; break;
    case 'vault': Sfx.vault(true); buzz(10); break;
    case 'wallrun': Sfx.wallrun(); break;
    case 'walljump': Sfx.walljump(); Render.spin = -TAU; Render.spinT = 0.38; buzz(12); break;
    case 'mantle': Sfx.step(); break;
    case 'slide': Sfx.slide(); break;
    case 'roll': Sfx.roll(); buzz(10); break;
    case 'hard': Sfx.hard(); buzz(30); break;
    case 'land': Sfx.land(a); break;
    case 'zip': Sfx.zip(); break;
    case 'launch': Sfx.launch(); break;
    case 'coin': Sfx.coin(a); break;
    case 'gem': Sfx.gem(); buzz(15); break;
    case 'power': Sfx.power(); UI.toast(POWERS[a].name + ': ' + POWERS[a].blurb, 1400); break;
    case 'pwEnd': Sfx.pwEnd(); break;
    case 'trick': Sfx.trick(TRICKS[a].perfect); if (a === 'train' && !Main.hornT) { Sfx.horn(); Main.hornT = 1; setTimeout(() => (Main.hornT = 0), 6000); } break;
    case 'mult': Sfx.mult(a); break;
    case 'bank': Sfx.bank(); break;
    case 'flow': Sfx.flow(); UI.banner('YOU ARE IN THE', 'FLOW', 1.4); buzz(40); break;
    case 'flowEnd': Sfx.flowEnd(); break;
    case 'stumble': Sfx.stumble(); buzz(60); break;
    case 'shield': Sfx.shield(); buzz(30); break;
    case 'secret': Sfx.secret(); buzz(30); break;
    case 'district': Sfx.district(); UI.banner('NOW ENTERING', DIST_BY_ID[a].name.toUpperCase(), 2.4); Save.data.districts[a] = true; Main.music(); break;
    case 'cue': Sfx.cue(); UI.cue(a.text); Save.data.seen['cue_' + a.key] = true; break;
    case 'checkpoint':
      Sfx.checkpoint();
      if (G.ghost) { const gt = Ghost.timeAt(G.ghost, a.x); if (gt !== null) UI.split(G.time - gt); }
      break;
    case 'respawn': Sfx.hard(); buzz(40); break;
    case 'thunder': Sfx.thunder(); break;
    case 'mission': UI.toast('Mission done! ' + a + ' · +' + b + ' coins', 2600); Sfx.reward(); break;
    case 'over':
      if (b) Sfx.finish(); else Sfx.over();
      buzz(b ? 30 : 120);
      Main.over();
      break;
  }
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => Main.boot());
else Main.boot();

})();</script>
