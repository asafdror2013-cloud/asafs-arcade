<script>
/*! © 2026 Asaf. All rights reserved. Free to play; not to be copied or claimed as your own. */
(function () {
  'use strict';
  var CFG = {"id": "mic-clash", "owner": "Asaf", "year": 2026, "mark": "bl", "dx": 0, "dy": 0, "mount": null, "hubCss": null};
  var NOTICE = '© ' + CFG.year + ' ' + CFG.owner;

  // Inside Asaf's Arcade the game runs in a frame of the arcade page: borrow its cloud saves, let it show the notice.
  var hub = null;
  try {
    var P = window.parent;
    if (P && P !== window && P.__ASAF_ARCADE__ && P.__ASAF_ARCADE__.v === 1) hub = P.__ASAF_ARCADE__;
  } catch (e) { hub = null; }
  window.__ASAF_HUB__ = !!hub;
  if (hub) {
    window.__asafClaude = makeClaude(hub, CFG.id);
    if (CFG.hubCss) {
      var hs = document.createElement('style');
      hs.textContent = CFG.hubCss;
      (document.head || document.documentElement).appendChild(hs);
    }
    return;
  }

  // ---- played on its own: a small permanent tag plus a short notice when the game opens
  var css = '' +
    '#asaf-cr{all:initial;position:fixed;z-index:2147483646;display:block;box-sizing:border-box;pointer-events:none;user-select:none;-webkit-user-select:none;' +
    'font:600 10px/1 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;letter-spacing:.04em;color:rgba(255,255,255,.88);' +
    'background:rgba(6,6,16,.52);padding:4px 8px;border-radius:999px;white-space:nowrap;opacity:.82;transition:opacity .7s ease}' +
    '#asaf-cr.asaf-busy{opacity:.14}' +
    '#asaf-cr-toast{all:initial;position:fixed;z-index:2147483647;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));display:block;box-sizing:border-box;' +
    'transform:translateX(-50%);pointer-events:none;user-select:none;-webkit-user-select:none;width:max-content;max-width:min(90vw,430px);' +
    'font:500 12.5px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#fff;text-align:center;' +
    'background:rgba(8,8,20,.9);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:9px 15px;box-shadow:0 10px 30px rgba(0,0,0,.5);' +
    'opacity:0;animation:asafCrIn .45s ease .6s forwards,asafCrOut .6s ease 5.2s forwards}' +
    '#asaf-cr-toast b{all:unset;font-weight:800}' +
    '#asaf-cr-toast i{all:unset;display:block;margin-top:2px;font-size:11.5px;opacity:.78}' +
    '@keyframes asafCrIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}' +
    '@keyframes asafCrOut{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,0)}}';
  var st = document.createElement('style');
  st.id = 'asaf-cr-style';
  st.textContent = css;
  (document.head || document.documentElement).appendChild(st);

  var dx = 6 + (CFG.dx || 0), dy = 6 + (CFG.dy || 0);
  var T = 'top:calc(' + dy + 'px + env(safe-area-inset-top,0px));';
  var B = 'bottom:calc(' + dy + 'px + env(safe-area-inset-bottom,0px));';
  var L = 'left:calc(' + dx + 'px + env(safe-area-inset-left,0px));';
  var R = 'right:calc(' + dx + 'px + env(safe-area-inset-right,0px));';
  var C = 'left:50%;transform:translateX(-50%);';
  var POS = { tl: T + L, tr: T + R, bl: B + L, br: B + R, tc: T + C, bc: B + C };

  var tag = document.createElement('div');
  tag.id = 'asaf-cr';
  tag.setAttribute('role', 'note');
  tag.setAttribute('aria-label', NOTICE + '. All rights reserved.');
  tag.textContent = NOTICE;
  tag.style.cssText = POS[CFG.mark] || POS.br;

  var toast = document.createElement('div');
  toast.id = 'asaf-cr-toast';
  toast.setAttribute('aria-hidden', 'true');
  var b = document.createElement('b'); b.textContent = NOTICE + ' · All rights reserved';
  var i = document.createElement('i'); i.textContent = 'Free to play. Please don’t copy it or claim it as your own.';
  toast.appendChild(b); toast.appendChild(i);
  setTimeout(function () { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 6200);

  function home() {
    if (CFG.mount) { var m = document.querySelector(CFG.mount); if (m) return m; }
    return document.documentElement;
  }
  function mount() {
    var h = home();
    if (tag.parentNode !== h) h.appendChild(tag);
  }
  function start() {
    mount();
    home().appendChild(toast);
    setInterval(mount, 2500);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();

  // fade the tag while someone is actively playing, bring it back when they pause
  var idle = 0;
  function busy() {
    tag.classList.add('asaf-busy');
    clearTimeout(idle);
    idle = setTimeout(function () { tag.classList.remove('asaf-busy'); }, 2600);
  }
  ['pointerdown', 'keydown', 'touchstart', 'wheel'].forEach(function (ev) {
    window.addEventListener(ev, busy, { capture: true, passive: true });
  });

  // ---- cloud saves through the arcade page (strings only cross between the two pages)
  function makeClaude(H, gid) {
    var cache = {};
    function fail(code) { var e = new Error(code || 'unavailable'); e.code = code || 'unavailable'; return e; }
    function call(fn, args) {
      return new Promise(function (res, rej) {
        var p;
        try { p = H[fn].apply(null, [gid].concat(args || [])); } catch (e) { rej(fail('unavailable')); return; }
        Promise.resolve(p).then(function (s) {
          var r;
          try { r = JSON.parse(s); } catch (e) { rej(fail('internal')); return; }
          if (r && r.ok) res(r.v); else rej(fail(r && r.code));
        }, function () { rej(fail('unavailable')); });
      });
    }
    function snap(path, v) {
      var parts = path.split('/');
      return { id: parts[parts.length - 1], exists: v !== null && v !== undefined,
        data: function () { return v === null || v === undefined ? undefined : JSON.parse(JSON.stringify(v)); } };
    }
    function doc(path) {
      return {
        id: path.split('/').pop(), path: path,
        get: function () { return call('get', [path]).then(function (v) { return snap(path, v); }); },
        set: function (data) { return call('set', [path, JSON.stringify(data)]).then(function () {}); }
      };
    }
    function query(path, lim) {
      return {
        path: path,
        limit: function (n) { return query(path, n); },
        doc: function (id) { return doc(path + '/' + id); },
        onSnapshot: function (next, error) {
          var dead = false, off = null;
          function onErr(code) { if (!dead && typeof error === 'function') error(fail(code)); }
          try {
            off = H.watch(gid, path, lim || 0, function (s) {
              if (dead) return;
              var rows; try { rows = JSON.parse(s); } catch (e) { return; }
              var docs = rows.map(function (d) { return snap(path + '/' + d.id, d.v); });
              next({ docs: docs, size: docs.length, empty: !docs.length, forEach: function (f) { docs.forEach(f); } });
            }, onErr);
          } catch (e) { setTimeout(function () { onErr('unavailable'); }, 0); }
          return function () { dead = true; try { if (off) off(); } catch (e) { /* page gone */ } };
        }
      };
    }
    var db = { doc: doc, collection: function (p) { return query(p, 0); } };
    var user = {
      id: function () { return call('uid', []); },
      me: function () { return call('uid', []).then(function (id) { return { id: id }; }); },
      can: function (n) { return call('can', [String(n)]); },
      profiles: function (ids) { return call('profiles', [JSON.stringify(ids || [])]); },
      isOwner: function () { return false; },
      canEdit: function () { return false; }
    };
    return {
      use: function (name) {
        if (!cache[name]) {
          cache[name] = call('ready', [String(name)]).then(function (ok) {
            if (!ok) return null;
            return name === 'db' ? db : name === 'user' ? user : null;
          }, function () { return null; });
        }
        return cache[name];
      }
    };
  }
})();
</script>

:root { --ink: #f6f3ff; --mut: #a9a3c4; --hot1: #ffe14d; --hot2: #ff9f1c; --pink: #ff4fa3; --cyan: #2fd8ff;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px); }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0b14; }
body { color: var(--ink); font: 500 16px/1.3 'Rubik', system-ui, sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
button { font: inherit; color: inherit; cursor: pointer; }
#cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#safe { position: fixed; visibility: hidden; pointer-events: none; padding: var(--sat) var(--sar) var(--sab) var(--sal); }
#pauseBtn { position: fixed; right: calc(var(--sar) + 10px); top: calc(var(--sat) + 10px); z-index: 3; width: 40px; height: 40px; padding: 10px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.25); background: rgba(13, 11, 20, 0.7); color: #fff; display: none; }
#pauseBtn svg { width: 100%; height: 100%; fill: currentColor; display: block; }
body.playing #pauseBtn { display: block; }
#ov { position: fixed; inset: 0; z-index: 5; display: none; align-items: center; justify-content: center; padding: calc(var(--sat) + 10px) 10px calc(var(--sab) + 10px); }
#ov.on { display: flex; }
#ov.dim { background: rgba(8, 6, 14, 0.62); }
#ov.menuov { justify-content: flex-start; padding-left: max(4vw, calc(var(--sal) + 14px)); background: linear-gradient(90deg, rgba(8,6,14,0.88) 0%, rgba(8,6,14,0.55) 42%, rgba(8,6,14,0) 70%); }
.logo { display: flex; flex-direction: column; align-items: center; font: 400 clamp(56px, 13vw, 128px)/0.86 'Bungee', sans-serif; letter-spacing: 0.02em; transform: rotate(-4deg); }
.logo span:first-child { color: var(--cyan); text-shadow: 0 0 24px rgba(47, 216, 255, 0.7), 5px 6px 0 #120f1d; }
.logo span:last-child { color: var(--pink); text-shadow: 0 0 24px rgba(255, 79, 163, 0.7), 5px 6px 0 #120f1d; }
.logo.sm { font-size: clamp(40px, 7vw, 70px); align-items: flex-start; margin: 0 0 14px 6px; }
.title { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; padding: 18px 24px 26px; border-radius: 24px; background: rgba(8, 6, 14, 0.55); backdrop-filter: blur(3px); }
.tag { margin: 6px 0 14px; font: 800 15px 'Rubik'; letter-spacing: 0.4em; text-transform: uppercase; color: #fff; }
.start { border: none; background: none; font: 400 22px 'Bungee', sans-serif; color: var(--hot1); text-shadow: 3px 3px 0 #120f1d; animation: blink 1.1s ease-in-out infinite; }
@keyframes blink { 50% { opacity: 0.35; } }
.mm { display: flex; flex-direction: column; gap: 8px; width: min(420px, 88vw); }
.mbtn { text-align: left; border: none; padding: 10px 18px 11px; border-radius: 16px; background: rgba(20, 16, 34, 0.86); border: 2px solid rgba(255,255,255,0.12); font: 400 clamp(24px, 3.6vw, 34px)/1 'Bungee', sans-serif; color: #fff; transition: transform 0.12s; box-shadow: 4px 5px 0 #120f1d; }
.mbtn small { display: block; margin-top: 4px; font: 500 13px 'Rubik'; color: var(--mut); letter-spacing: 0.02em; }
.mbtn.hot { background: linear-gradient(90deg, rgba(255,79,163,0.92), rgba(255,159,28,0.92)); }
.mbtn.hot small { color: #fff; }
.mbtn.focus, .mbtn:hover { transform: translateX(10px) scale(1.02); border-color: var(--hot1); }
.panel { width: min(560px, 96vw); max-height: 100%; overflow: auto; overscroll-behavior: contain; touch-action: pan-y; padding: 18px 16px 14px; border-radius: 22px; background: rgba(16, 13, 28, 0.96); border: 2px solid rgba(255,255,255,0.12); box-shadow: 6px 8px 0 #120f1d, 0 20px 60px rgba(0,0,0,0.6); animation: pin 0.22s ease-out; }
@keyframes pin { from { opacity: 0; transform: translateY(14px) scale(0.98); } }
.panel h2 { margin: 0 0 10px; text-align: center; font: 400 30px/1 'Bungee', sans-serif; letter-spacing: 0.02em; }
.panel h2.big { font-size: clamp(34px, 7vw, 54px); color: var(--hot1); text-shadow: 4px 4px 0 #120f1d; }
.note { color: var(--mut); font-size: 14.5px; margin: 6px 4px 10px; }
.note b { color: #fff; }
.small { font-size: 13px; }
.center { text-align: center; }
.btn { display: block; width: 100%; margin: 8px 0 0; padding: 12px 16px; border-radius: 14px; border: 2px solid rgba(255,255,255,0.14); background: #241d3d; font: 400 18px 'Bungee', sans-serif; letter-spacing: 0.02em; color: #fff; box-shadow: 3px 4px 0 #120f1d; }
.btn.hot { background: linear-gradient(90deg, var(--pink), var(--hot2)); }
.btn.sm { font-size: 15px; padding: 9px 12px; }
.btn.ghost { background: none; box-shadow: none; border-color: transparent; color: var(--mut); font: 700 14px 'Rubik'; }
.btn.focus { border-color: var(--hot1); }
.btn:active { transform: translate(2px, 2px); box-shadow: 1px 2px 0 #120f1d; }
.row { display: flex; gap: 10px; }
.row .btn { flex: 1; }
.diff { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 0 0 12px; }
.diff .ar { border: none; background: none; font-size: 20px; color: #fff; padding: 4px 10px; }
.dv { min-width: 150px; border: none; border-radius: 12px; padding: 7px 14px; font: 400 20px 'Bungee', sans-serif; box-shadow: 3px 3px 0 #120f1d; }
.d-easy { background: #2bd96b; color: #08210f; } .d-normal { background: #ffd84d; color: #2a2104; } .d-hard { background: #ff4d6d; color: #fff; }
.list { display: flex; flex-direction: column; gap: 7px; }
.week, .song { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 9px 12px; border-radius: 14px; border: 2px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.04); }
.week.focus, .song.focus, .week:hover, .song:hover { border-color: var(--c); background: rgba(255,255,255,0.08); }
.week.locked { opacity: 0.45; }
.ic { flex: 0 0 auto; width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; font: 400 22px 'Bungee'; background: var(--c); color: #120f1d; box-shadow: 2px 3px 0 #120f1d; }
.wt, .st { flex: 1; min-width: 0; }
.wt b, .st b { display: block; font-size: 17px; }
.wt small, .st small { display: block; color: var(--mut); font-size: 13px; }
.wt em { display: block; font-style: normal; color: #d6d0ef; font-size: 12.5px; margin-top: 2px; }
.ws, .sb { font: 700 14px 'Rubik'; white-space: nowrap; color: #fff; }
.sb i { font-style: normal; color: var(--hot1); font-size: 12px; }
.rk { display: inline-block; min-width: 26px; text-align: center; margin-right: 6px; font: 400 15px 'Bungee'; }
.r-Sp, .r-S { color: #7ef0ff; } .r-A { color: #8dff8a; } .r-B { color: #ffd84d; } .r-C { color: #ff9b4d; } .r-D { color: #ff4d6d; }
.tabs { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 8px; margin: 0 -4px 6px; scrollbar-width: none; touch-action: pan-x; }
.tabs button { flex: 0 0 auto; border: none; border-radius: 999px; padding: 6px 12px; background: rgba(255,255,255,0.07); font: 700 13px 'Rubik'; color: var(--mut); }
.tabs button.on { background: var(--hot1); color: #241c00; }
.lb { list-style: none; margin: 0; padding: 0; }
.lb li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; }
.lb li:nth-child(odd) { background: rgba(255,255,255,0.04); }
.lb li.me { background: rgba(255,225,77,0.14); outline: 1px solid rgba(255,225,77,0.5); }
.lb .pos { width: 28px; font: 400 18px 'Bungee'; color: var(--hot1); }
.lb .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
.lb .sc { font-weight: 800; }
.lb i { font-style: normal; color: var(--hot1); font-size: 12px; font-weight: 700; }
.tog { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; margin: 0 0 8px; padding: 10px 12px; text-align: left; border-radius: 14px; border: 2px solid rgba(255,255,255,0.07); background: rgba(255,255,255,0.04); }
.tog b { display: block; font-size: 16px; }
.tog small { display: block; color: var(--mut); font-size: 13px; }
.tog i { position: relative; flex: 0 0 auto; width: 48px; height: 28px; border-radius: 14px; background: #3a3354; }
.tog i::after { content: ''; position: absolute; left: 3px; top: 3px; width: 22px; height: 22px; border-radius: 50%; background: #cfcbe3; transition: transform 0.18s; }
.tog.on i { background: linear-gradient(90deg, var(--pink), var(--hot2)); }
.tog.on i::after { transform: translateX(20px); background: #fff; }
.tog.focus { border-color: var(--hot1); }
.pill { font-style: normal; font-weight: 800; font-size: 13px; padding: 5px 10px; border-radius: 999px; background: rgba(255,255,255,0.1); white-space: nowrap; }
.sld { display: block; margin: 0 0 10px; padding: 8px 12px; border-radius: 14px; background: rgba(255,255,255,0.04); }
.sld span { display: flex; justify-content: space-between; }
.sld b { font-size: 16px; }
.sld em { font-style: normal; font-weight: 800; color: var(--hot1); }
.sld input { width: 100%; accent-color: var(--pink); margin-top: 6px; }
.lane { padding: 2px 8px; border-radius: 8px; color: #120f1d; }
.lane.l0 { background: #ff4fa3; } .lane.l1 { background: #2fd8ff; } .lane.l2 { background: #9dff4f; } .lane.l3 { background: #ffb02e; }
.calpad { display: grid; place-items: center; width: min(260px, 70vw); height: min(260px, 70vw); margin: 10px auto; border-radius: 50%; border: 4px solid var(--pink); background: radial-gradient(circle, #3a1c3a, #1a1028); font: 400 28px 'Bungee'; color: #fff; box-shadow: 0 0 40px rgba(255,79,163,0.4); }
.calpad:active { transform: scale(0.96); }
.res .rbig { text-align: center; font: 400 92px/1 'Bungee', sans-serif; margin: -4px 0 4px; text-shadow: 5px 6px 0 #120f1d; }
.rs { display: flex; gap: 8px; margin: 8px 0 10px; }
.rs > div { flex: 1; text-align: center; padding: 8px 4px; border-radius: 12px; background: rgba(255,255,255,0.05); }
.rs small { display: block; color: var(--mut); font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; }
.rs b { display: block; font: 400 20px/1.2 'Bungee'; }
.rs em { display: block; font-style: normal; font: 700 11px 'Rubik'; color: var(--hot1); letter-spacing: 0.1em; }
.rs i { display: block; font-style: normal; font-size: 11.5px; color: var(--mut); }
.fc { color: var(--hot1); }

function defaultSave() {

    v: 2, best: {}, weeks: {}, stats: { plays: 0, versus: 0, notes: 0 }, seen: {}, updated: 0,
    pc: 'player', stage: 'auto', bosses: {}, tours: {}, endless: { bars: 0, score: 0 }, ach: {},

function deepFill(t, d) { for (const k in d) { if (t[k] === undefined || t[k] === null && d[k] !== null) t[k] = JSON.parse(JSON.stringify(d[k])); else if (d[k] && typeof d[k] === 'object' && !Array.isArray(d[k]) && typeof t[k] === 'object' && t[k]) deepFill(t[k], d[k]); } return t; }
function mergeSaves(a, b) {
  a = deepFill(JSON.parse(JSON.stringify(a)), defaultSave()); b = deepFill(JSON.parse(JSON.stringify(b)), defaultSave());
  const out = JSON.parse(JSON.stringify((b.updated || 0) > (a.updated || 0) ? b : a));
  for (const src of [a.best, b.best]) for (const k in src) if (!out.best[k] || src[k].score > out.best[k].score) out.best[k] = src[k];
  for (const src of [a.weeks, b.weeks]) for (const k in src) { out.weeks[k] = out.weeks[k] || {}; for (const d in src[k]) out.weeks[k][d] = Math.max(out.weeks[k][d] || 0, src[k][d]); }

  for (const src of [a, b]) {
    for (const k in src.bosses) out.bosses[k] = out.bosses[k] || src.bosses[k];
    for (const k in src.ach) out.ach[k] = true;
    for (const k in src.tours) out.tours[k] = Math.max(out.tours[k] || 0, src.tours[k]);
    out.endless.bars = Math.max(out.endless.bars || 0, src.endless.bars || 0); out.endless.score = Math.max(out.endless.score || 0, src.endless.score || 0);

const Save = {
  data: defaultSave(), cloud: { ref: null, ready: false, writing: false, pending: false, lastJson: '' }, onRemote: null,
  load() { try { const raw = localStorage.getItem(SAVE_KEY); if (raw) this.data = deepFill(JSON.parse(raw), defaultSave()); } catch (e) { /* no storage */ } },
  persistLocal() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(this.data)); } catch (e) { /* ignore */ } },
  persist() { this.data.updated = Date.now(); this.persistLocal(); clearTimeout(this._t); this._t = setTimeout(() => this.cloudWrite(), 900); },
  best(id, diff) { return this.data.best[id + ':' + diff] || null; },
  record(id, diff, st) {
    const k = id + ':' + diff, prev = this.data.best[k];
    this.data.stats.plays++;
    this.data.stats.notes += st.notes - st.misses;
    if (!prev || st.score > prev.score) this.data.best[k] = { score: st.score, acc: Math.round(st.acc * 100) / 100, rank: st.rank, fc: st.fc, t: Date.now() };
    else if (st.fc && !prev.fc) prev.fc = true;
    this.persist();
  },
  weekDone(w, diff, score) { const k = WEEKS[w].id; this.data.weeks[k] = this.data.weeks[k] || {}; this.data.weeks[k][diff] = Math.max(this.data.weeks[k][diff] || 0, score); this.persist(); },
  weekUnlocked(w) { return w <= 1 || !!this.data.weeks[WEEKS[w - 1].id]; },
  async cloudInit() {
    try {
      const cl = window.__asafClaude || window.claude;
      if (!cl || typeof cl.use !== 'function') return;
      const [db, user] = await Promise.all([cl.use('db'), cl.use('user')]);
      if (!db || !user) return;
      const id = await user.id();
      if (!id) return;
      const ref = db.doc('data/users/' + id + '/save');
      let timer = 0;
      const snap = await Promise.race([ref.get(), new Promise((_, rej) => { timer = setTimeout(() => rej(new Error('timeout')), 10000); })]);
      clearTimeout(timer);
      this.cloud.ref = ref;
      if (snap && snap.exists) { const body = snap.data(); if (body && body.save) { const remote = JSON.parse(JSON.stringify(body.save)); this.cloud.lastJson = JSON.stringify(remote); this.data = mergeSaves(this.data, remote); this.persistLocal(); if (this.onRemote) this.onRemote(); } }

  cloudWrite() {

    if (c.writing) { c.pending = true; return; }
    const json = JSON.stringify(this.data);
    if (json === c.lastJson) return;
    c.writing = true;
    c.ref.set({ save: JSON.parse(json) }).then(() => { c.lastJson = json; })
      .catch((e) => { const code = e && e.code; if (code && code !== 'unavailable' && code !== 'resource_exhausted') c.ref = null; })
      .finally(() => { c.writing = false; if (c.pending) { c.pending = false; this.cloudWrite(); } });
  },
};

// ---------------------------------------------------------------- progress: fame, unlocks, achievements
const Prog = {
  fresh: { ach: [], unlocks: [] },
  fame() {
    const D = Save.data;
    let f = 0;
    for (const k in D.best) f += GRADE_STARS[D.best[k].rank] || 0;
    f += Object.keys(D.bosses).length * 6;
    for (const d in D.tours) f += Math.min(3, D.tours[d]) * 5;
    f += Object.keys(D.ach).length * 2;
    return f;
  },
  level(f) { let l = 0; for (let i = 0; i < FAME.length; i++) if (f >= FAME[i].at) l = i; return l; },
  singerOpen(s) {
    const D = Save.data;
    if (s.fame) return this.fame() >= s.fame;
    if (s.week) return !!D.weeks[s.week];
    if (s.boss) return !!D.bosses[s.boss];
    return true;
  },
  stageOpen(st) { return !st.week || !!Save.data.weeks[st.week]; },
  bossOpen(b) { return !!Save.data.weeks[b.week]; },
  songOpen(sp) {
    if (sp.boss && sp.id !== 'grand-finale') { const b = BOSSES.find((x) => x.song === sp.id); return b ? this.bossOpen(b) : false; }
    const w = WEEKS.findIndex((wk) => wk.songs.indexOf(sp.id) >= 0);
    return w < 0 || Save.weekUnlocked(w);
  },
  snap() { return SINGERS.filter((s) => this.singerOpen(s)).map((s) => 's:' + s.id).concat(STAGES.filter((s) => this.stageOpen(s)).map((s) => 'g:' + s.id)); },
  begin() { this.fresh = { ach: [], unlocks: [] }; this.before = this.snap(); },
  diffUnlocks() {
    const now = this.snap(), before = this.before || now;
    for (const k of now) if (before.indexOf(k) < 0) {
      const [t, id] = k.split(':');
      this.fresh.unlocks.push(t === 's' ? 'New singer: ' + CHARS[id].name : 'New stage: ' + STAGES.find((x) => x.id === id).name);
      if (t === 's') this.ach('singer');
    }
    this.before = now;
  },
  ach(id) {
    const D = Save.data;
    if (D.ach[id]) return;
    D.ach[id] = true;
    this.fresh.ach.push(ACH_BY_ID[id]);
  },
  song(res) {
    const st = res.st, D = Save.data;
    Save.record(res.songId, res.diff, st);
    Board.submit(res.songId, res.diff, st);
    this.ach('first');
    if (st.fc) this.ach('fc');
    if (st.rank === 'S+') this.ach('splus');
    if (st.maxCombo >= 60) this.ach('x4');
    if (st.maxCombo >= 100) this.ach('c100');
    if (st.maxCombo >= 300) this.ach('c300');
    if (st.peak >= 2) this.ach('hyped');
    if (st.peak >= 4) this.ach('legend');
    if (res.diff === 'expert') this.ach('expert');
    if (res.boss && res.boss.won) {
      const b = BOSSES.find((x) => x.song === res.songId);
      if (b) { D.bosses[b.id] = D.bosses[b.id] || res.diff; this.ach('boss1'); if (BOSSES.every((x) => D.bosses[x.id])) this.ach('boss4'); }
    }
    this.diffUnlocks();
    Save.persist();
  },
  week(w, diff, score) {
    Save.weekDone(w, diff, score);
    if (w >= 1) this.ach('w' + w);
    this.diffUnlocks();
    Save.persist();
  },
  endless(res) {
    const E = Save.data.endless;
    res.prevBars = E.bars; res.prevScore = E.score;
    E.bars = Math.max(E.bars, res.bars); E.score = Math.max(E.score, res.st.score);
    if (res.bars >= 64) this.ach('end60');
    if (res.st.peak >= 2) this.ach('hyped');
    if (res.st.peak >= 4) this.ach('legend');
    this.diffUnlocks();
    Save.persist();
  },
  tourRound(res) {
    const T = res.tour;
    if (res.won && T.round === TOUR_ROUNDS.length - 1) {
      const D = Save.data; D.tours[res.diff] = (D.tours[res.diff] || 0) + 1;
      this.ach('tour'); if (res.diff === 'expert') this.ach('tourx');
      res.champion = true;
      this.diffUnlocks();

    }

// offline render of a song (tests / tuning): returns the AudioBuffer
async function renderSongOffline(spec, diff, seconds) {
  const song = Composer.build(spec, diff);
  const len = Math.min(song.length + 2, seconds || song.length + 2);
  const ac = new OfflineAudioContext(2, Math.ceil(44100 * len), 44100);
  const mx = new Mixer(ac);
  mx.setVolumes(0.8, 1, 0.7);
  const p = new SongPlayer(mx, song, { autoSing: [true, true] });
  p.begin(0.05);
  p.pump(len);
  return ac.startRendering();
}

  // beat: fractional beat; W,H: stage viewport size in px (already inside the camera transform)
  draw(g, W, H, beat, flash) {

        g.beginPath(); g.moveTo(bx, by); g.lineTo(bx + Math.cos(a - 0.06) * H * 1.2, by + Math.sin(a - 0.06) * H * 1.2); g.lineTo(bx + Math.cos(a + 0.06) * H * 1.2, by + Math.sin(a + 0.06) * H * 1.2); g.closePath(); g.fill();

  paint(W, H) {

  // the boombox buddy on its speaker stack (the hype crowd of one)
  buddy(g, x, y, s, beat, hype) {

// ---------------------------------------------------------------- board.js (friends leaderboard on the shared db)
// Each person keeps one document scores/<their id> with their best score per song+difficulty.
const Board = {
  db: null, user: null, me: null, rows: [], names: {}, ready: false, canWrite: null, failed: false, writing: false, queued: null,
  async init() {
    try {
      const cl = window.__asafClaude || window.claude;
      if (!cl || typeof cl.use !== 'function') return;
      const [db, user] = await Promise.all([cl.use('db'), cl.use('user')]);
      if (!db || !user) return;
      this.db = db; this.user = user;
      this.me = await user.id();
      try { this.canWrite = await user.can('data.write'); } catch (e) { this.canWrite = null; }
      let timer = setTimeout(() => { this.failed = !this.ready; UI.boardChanged(); }, 10000);
      db.collection('scores').limit(500).onSnapshot((snap) => {
        clearTimeout(timer);
        this.rows = snap.docs.map((d) => Object.assign({ id: d.id }, d.data()));
        this.ready = true; this.failed = false;
        this.resolveNames();
        UI.boardChanged();
      }, (e) => { clearTimeout(timer); this.failed = true; console.warn('[rhythm] board', e && e.code); UI.boardChanged(); });
    } catch (e) { console.warn('[rhythm] board unavailable', e && e.message); }
  },
  async resolveNames() {
    if (!this.user) return;
    try {
      const ids = this.rows.map((r) => r.id).filter((id) => !(id in this.names));
      if (!ids.length) return;
      const ps = await this.user.profiles(ids);
      for (const id of ids) this.names[id] = (ps && ps[id] && ps[id].name) || '';
      UI.boardChanged();
    } catch (e) { /* names are optional */ }
  },
  name(id) { return id === this.me ? 'You' : (this.names[id] || 'Player'); },
  submit(id, diff, st) {
    if (!this.db || !this.me || this.canWrite === false) return;
    const key = id + ':' + diff;
    const mine = this.rows.find((r) => r.id === this.me) || {};
    const best = Object.assign({}, mine.best || {});
    if (best[key] && best[key].s >= st.score) return;
    best[key] = { s: st.score, a: Math.round(st.acc * 10) / 10, r: st.rank, fc: !!st.fc, t: Date.now() };

    const holdSec = n.hold ? n.end - n.t : 0;
    n.voice = this.player.singNote(side, n, holdSec ? holdSec + 0.02 : 0);
    if (n.hold) n.holding = true;
    sd.glow[n.lane] = 1;
    this.setPose(side, n.lane, n.hold ? holdSec : 0);
    this.pop(side, J.name, J.color, delta, j > 0 && ad > 0.022 ? (delta < 0 ? 'EARLY' : 'LATE') : '');
    if (j === 0) Render.splash(side, n.lane);
    if (j <= 1 && Save.data.settings.haptics) vibrate(4);
  },
  explode(side, n) {
    const sd = this.sides[side];
    n.hit = true; n.done = true; n.boom = true;
    sd.mines++; this.breakCombo(side);
    this.addHealth(side, -0.1); this.crowdAdd(side, -10);
    if (this.boss && side === 1) this.boss.hp = Math.min(1, this.boss.hp + 1 / this.boss.total);
    this.mx.boom(this.mx.ac.currentTime);
    Render.boom(side, n.lane);
    sd.miss = 0.45; sd.pose = -1;
    this.pop(side, 'SPIKE!', '#ff4d6d');
    if (Save.data.settings.haptics) vibrate(40);
  },
  breakCombo(side) {
    const sd = this.sides[side];
    if (sd.combo >= 20) Render.comboBreak(side, sd.combo);
    sd.combo = 0;
  },
  ghost(side) {
    const sd = this.sides[side];
    this.breakCombo(side); sd.misses++;
    this.addHealth(side, -0.02);
    this.mx.miss(this.mx.ac.currentTime);
    sd.miss = 0.35;
  },
  addHealth(side, d) {
    if (this.mode === 'versus') this.health = clamp(this.health + (side === 1 ? d : -d) * 0.6, 0, 2);
    else if (side === 1) this.health = clamp(this.health + d, this.practice ? 0.05 : 0, 2);
  },
  // the crowd follows the player (in versus, both singers)
  crowdAdd(side, d) {
    if (side === 0 && this.mode !== 'versus') return;
    const C = this.crowd;
    C.e = clamp(C.e + d, 0, 100);
    const t = crowdTier(C.e);
    if (t > C.tier) { C.tier = t; if (t > C.peak) { C.peak = t; if (t >= 2) { Render.hype('tier', t); this.mx.cheer(this.mx.ac.currentTime, 0.5 + t * 0.12); } } }
    else if (t < C.tier) C.tier = t;
  },
  setPose(side, lane, hold) { const sd = this.sides[side]; sd.pose = lane; sd.poseT = 0; sd.poseHold = Math.max(0.42, hold || 0); sd.miss = 0; },
  pop(side, text, color, delta, sub) { this.sides[side].pops.push({ text, color, t: 0, delta, sub, combo: this.sides[side].combo }); if (this.sides[side].pops.length > 4) this.sides[side].pops.shift(); },

  // ------------------------------------------------ per frame
  update(dt) {
    if (this.state !== 'play' || this.paused || !this.song) return;
    const ac = this.mx.ac;
    this.player.pump(ac.currentTime + 0.3);
    const pos = Clock.pos(), beat = pos / this.song.spb;
    // the crowd cools off when nothing happens
    const C = this.crowd;
    if (beat > this.fromBeat) { C.e = Math.max(0, C.e - dt * (this.sides[1].combo < 5 ? 1.6 : 0.35)); const t = crowdTier(C.e); if (t < C.tier) C.tier = t; }
    if (this.endless) this.endless.bars = Math.max(this.endless.bars, Math.floor(beat / 4));
    for (let side = 0; side < 2; side++) {
      const sd = this.sides[side], N = sd.notes;
      sd.poseT += dt;
      for (let l = 0; l < 4; l++) { sd.glow[l] = Math.max(0, sd.glow[l] - dt * 4); sd.press[l] = Math.max(0, sd.press[l] - dt * 6); }
      sd.miss = Math.max(0, sd.miss - dt);
      for (const p of sd.pops) p.t += dt;
      sd.pops = sd.pops.filter((p) => p.t < 0.7);
      while (sd.cursor < N.length && (N[sd.cursor].hit || N[sd.cursor].missed || N[sd.cursor].done) && !N[sd.cursor].holding) sd.cursor++;
      if (!this.human[side]) {
        // the computer singer hits everything exactly
        for (let i = sd.cursor; i < N.length; i++) {
          const n = N[i];
          if (n.t > pos) break;
          if (n.mine) { n.done = true; continue; }
          if (!n.hit) { n.hit = true; n.rating = 0; sd.glow[n.lane] = 1; sd.press[n.lane] = 0.6; this.setPose(side, n.lane, n.hold ? n.end - n.t : 0); if (n.hold) n.holding = true; }
          if (n.holding) { sd.glow[n.lane] = Math.max(sd.glow[n.lane], 0.7); if (pos >= n.end) { n.holding = false; n.done = true; } }
        }
        continue;
      }
      for (let i = sd.cursor; i < N.length; i++) {
        const n = N[i];
        if (n.t > pos + 0.2) break;
        if (n.holding) {
          sd.glow[n.lane] = Math.max(sd.glow[n.lane], 0.75);
          sd.score += dt * 160 * multFor(sd.combo);
          this.addHealth(side, dt * 0.06);
          sd.poseT = Math.min(sd.poseT, 0.2);
          if (pos >= n.end) { n.holding = false; n.done = true; }
          continue;
        }
        if (n.mine) { if (!n.done && pos > n.t + 0.1) n.done = true; continue; }
        if (!n.hit && !n.missed && pos > n.t + JUDGE[JUDGE.length - 1].win) {
          n.missed = true; sd.misses++; this.breakCombo(side);
          this.addHealth(side, MISS.hp);
          this.crowdAdd(side, MISS.crowd);
          if (this.boss && side === 1) this.boss.hp = Math.min(1, this.boss.hp + 0.4 / this.boss.total);
          this.mx.miss(ac.currentTime);
          sd.miss = 0.45; sd.pose = -1;
          this.pop(side, 'MISS', MISS.color);
        }
      }
    }
    // death / KO (practice never fails)
    if (this.practice && this.health < 0.05) this.health = 0.05;
    if (this.mode !== 'versus' && this.health <= 0 && !this.demo) { if (this.endless) { this.finish(); return; } this.die(); return; }
    if (this.mode === 'versus' && (this.health <= 0 || this.health >= 2)) { this.finish(this.health <= 0 ? 0 : 1); return; }
    if (pos > this.endT) this.finish();
  },
  die() {
    this.state = 'dead';
    this.player.stop();
    if (this.sides) for (const n of this.sides[1].notes) if (n.voice) this.mx.stopSing(n.voice, this.mx.ac.currentTime);
    const t = this.mx.ac.currentTime;
    this.mx.osc(t, 'sawtooth', 300, 0.9, 0.2, 0.01, this.mx.sfx, 60, 0.9);
    this.mx.nz(t, 0.5, 'lowpass', 2000, 0.6, 0.25, 0.005, this.mx.sfx, 200);
    UI.showDead();
  },
  stats(side) {
    const sd = this.sides[side];
    const judged = sd.accN + sd.misses + sd.drops + sd.mines;
    const acc = judged ? (sd.accSum / judged) * 100 : 0;
    const fc = sd.misses === 0 && sd.drops === 0 && sd.mines === 0;
    const rank = acc >= 99.99 && fc && sd.counts[0] === sd.accN ? 'S+' : acc >= 95 ? 'S' : acc >= 90 ? 'A' : acc >= 80 ? 'B' : acc >= 70 ? 'C' : 'D';
    return { score: Math.round(sd.score), acc, fc, rank, counts: sd.counts.slice(), misses: sd.misses, drops: sd.drops, mines: sd.mines, maxCombo: sd.maxCombo, notes: sd.notes.filter((n) => !n.mine).length, early: sd.early, late: sd.late, deltas: sd.deltas, peak: this.crowd.peak };
  },
  finish(koWinner) {
    if (this.state !== 'play') return;
    this.state = 'results';
    this.player.stop();
    const id = this.song.spec.id, diff = this.diff;
    if (this.demo) { this.state = 'idle'; UI.demoEnded(); return; }
    if (this.mode === 'versus') {
      const a = this.stats(1), b = this.stats(0);
      const winner = koWinner !== undefined ? koWinner : a.score === b.score ? -1 : a.score > b.score ? 1 : 0;
      Save.data.stats.versus++;
      Prog.ach('versus');
      Save.persist();
      UI.showVersusResults({ p1: a, p2: b, winner, ko: koWinner !== undefined });
      return;
    }
    const st = this.stats(1);
    const res = { st, mode: this.mode, songId: id, diff, pc: this.pc };
    if (this.endless) { res.bars = this.endless.bars; Prog.endless(res); UI.showResults(res); return; }
    if (this.practice) { UI.showResults(res); return; }
    res.prev = Save.best(id, diff);
    res.isBest = !res.prev || st.score > res.prev.score;
    if (this.boss) res.boss = { won: this.boss.dead, hp: this.boss.hp };
    if (this.tour) { res.tour = this.tour; res.won = st.acc >= this.tour.target; }
    Prog.song(res);
    if (this.mode === 'story') {
      const s = this.story;
      s.score += st.score; s.misses += st.misses;
      const wk = WEEKS[s.week];
      if (this.boss && !this.boss.dead) { res.bossLost = true; UI.showResults(res); return; }
      if (s.idx + 1 < wk.songs.length) { res.next = true; UI.showResults(res); return; }
      Prog.week(s.week, diff, s.score, res);
      res.weekDone = true; res.weekScore = s.score;
      UI.showResults(res);
      return;
    }
    if (this.tour) Prog.tourRound(res);
    UI.showResults(res);
  },
  nextStorySong() {
    const s = this.story;
    s.idx++;
    this.start({ songId: WEEKS[s.week].songs[s.idx], diff: this.diff, mode: 'story', story: s, pc: this.pc });
  },
};
// an endless track: one key, rising density, every rival takes a turn
function endlessSpec(seed) {
  const r = new RNG(seed);
  const keys = [[52, 'minor'], [55, 'minor'], [57, 'dorian'], [60, 'major']], [root, mode] = keys[r.int(0, 3)];
  const cycle = ' O4A P4A O4B P4B X4A';
  let form = 'I2';
  for (let i = 0; i < 16; i++) form += cycle;
  return { id: 'endless-' + seed, name: 'Endless Rhythm', opp: ['metro', 'vex', 'roxy', 'glitch', 'maestro'][r.int(0, 4)], bpm: 122, root, mode,
    prog: [[0, mode === 'major' ? 'M' : 'm'], [8, 'M'], [3, 'M'], [10, 'M']], progB: [[5, 'm'], [3, 'M'], [10, 'M'], [7, 'M']],
    style: { drums: ['four', 'break', 'rock', 'disco'][r.int(0, 3)], bass: ['808', 'octave', 'rock'][r.int(0, 2)], keys: ['stab', 'power', 'arp'][r.int(0, 2)], lead: true },
    form: form + ' E2', seed, stage: 'arena', ramp: true,
    mech: [{ kind: 'mines', from: 100, to: 400, rate: 0.12 }, { kind: 'speed', from: 140, to: 400, k: 1.25 }] };
}

// ---------------------------------------------------------------- input.js (keyboard lanes, touch zones)
const Input = {
  down: new Set(), touches: new Map(), rebinding: null,
  init(cv) {
    window.addEventListener('keydown', (e) => this.key(e, true));
    window.addEventListener('keyup', (e) => this.key(e, false));
    window.addEventListener('blur', () => this.releaseAll());
    cv.addEventListener('pointerdown', (e) => this.pdown(e), { passive: false });
    cv.addEventListener('pointerup', (e) => this.pup(e));
    cv.addEventListener('pointercancel', (e) => this.pup(e));
    cv.addEventListener('contextmenu', (e) => e.preventDefault());
  },
  // which (side, lane) does a key code drive right now?
  map(code) {
    const G = Game;
    if (G.mode === 'versus') {
      const p1 = ['ArrowLeft', 'ArrowDown', 'ArrowUp', 'ArrowRight'].indexOf(code);
      if (p1 >= 0) return [1, p1];
      const p2 = ['KeyA', 'KeyS', 'KeyW', 'KeyD'].indexOf(code);
      if (p2 >= 0) return [0, p2];
      return null;
    }
    const K = Save.data.keys;
    for (let l = 0; l < 4; l++) if (K[l].indexOf(code) >= 0) return [1, l];
    return null;
  },
  key(e, isDown) {
    if (this.rebinding) { if (isDown) { e.preventDefault(); this.rebinding(e.code); } return; }
    const G = Game;
    if (isDown && (e.code === 'Escape' || e.code === 'Enter' && G.state === 'play' && G.paused)) {
      if (G.state === 'play') { e.preventDefault(); if (G.paused) G.resume(); else G.pause(); return; }
    }
    if (G.state !== 'play' || G.paused) { if (isDown) UI.key(e); return; }
    const m = this.map(e.code);
    if (!m) return;
    e.preventDefault();
    const k = m[0] + ':' + m[1];
    if (isDown) {
      if (this.down.has(k)) return;          // key repeat
      this.down.add(k);
      G.press(m[0], m[1], e.timeStamp);
    } else {
      this.down.delete(k);
      G.release(m[0], m[1], e.timeStamp);
    }
  },
  // touch: the lane under the finger (solo: four columns across the screen; versus: four per half)
  zone(x, y) {
    const G = Game, W = Render.W;
    if (G.mode === 'versus') {
      const side = x >= W / 2 ? 1 : 0, lx = side ? x - W / 2 : x;
      return [side, clamp(Math.floor(lx / (W / 2) * 4), 0, 3)];
    }
    const L = Render.L;
    if (L && L.portrait) return [1, clamp(Math.floor(x / W * 4), 0, 3)];
    // landscape solo: the right half holds the player's lanes; anywhere on the left maps across too
    return [1, clamp(Math.floor(x / W * 4), 0, 3)];
  },
  pdown(e) {
    App.unlock();
    const G = Game;
    if (G.state !== 'play' || G.paused) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    e.preventDefault();
    const z = this.zone(e.clientX, e.clientY);
    this.touches.set(e.pointerId, z);
    Render.touchFx(z[0], z[1]);
    G.press(z[0], z[1], e.timeStamp);
  },
  pup(e) {
    const z = this.touches.get(e.pointerId);
    if (!z) return;
    this.touches.delete(e.pointerId);
    for (const v of this.touches.values()) if (v[0] === z[0] && v[1] === z[1]) return;   // another finger still holds it
    Game.release(z[0], z[1], e.timeStamp);
  },
  releaseAll() {
    const t = performance.now();
    for (const k of this.down) { const [s, l] = k.split(':').map(Number); Game.release(s, l, t); }
    this.down.clear();
    for (const z of this.touches.values()) Game.release(z[0], z[1], t);
    this.touches.clear();
  },
};

const UI = {
  ov: null, atMenu: true, diff: 'normal', boardKey: null, focus: 0, actions: {},
  init() {
    this.ov = $('#ov');
    this.ov.addEventListener('click', (e) => {
      const b = e.target.closest('[data-a]');
      if (!b || b.disabled) return;
      App.unlock();
      this.sfx(1);
      const fn = this.actions[b.dataset.a];
      if (fn) fn(b, e);
    });
    this.ov.addEventListener('input', (e) => { const fn = this.actions['input:' + e.target.dataset.k]; if (fn) fn(e.target); });
    this.diff = Save.data.lastDiff || 'normal';
  },
  sfx(k) { if (Game.mx) Game.mx.ui(Game.mx.ac.currentTime, k); },
  open(html, actions, cls) {
    this.ov.className = 'on ' + (cls || '');
    this.ov.innerHTML = html;
    this.actions = actions || {};
    this.focus = 0;
    this.markFocus();
  },
  close() { this.ov.className = ''; this.ov.innerHTML = ''; this.actions = {}; },
  navs() { return $$('[data-nav]', this.ov).filter((b) => !b.disabled); },
  markFocus() { const n = this.navs(); n.forEach((b, i) => b.classList.toggle('focus', i === this.focus)); },
  key(e) {
    if (this.calKey) { this.calKey(e); return; }
    if (this.dlgKey) { this.dlgKey(e); return; }
    if (!this.ov.classList.contains('on')) return;
    const n = this.navs();
    if (e.code === 'ArrowDown' || e.code === 'KeyS') { this.focus = (this.focus + 1) % Math.max(1, n.length); this.markFocus(); this.sfx(0); e.preventDefault(); }
    else if (e.code === 'ArrowUp' || e.code === 'KeyW') { this.focus = (this.focus - 1 + n.length) % Math.max(1, n.length); this.markFocus(); this.sfx(0); e.preventDefault(); }
    else if (e.code === 'ArrowLeft' || e.code === 'ArrowRight' || e.code === 'KeyA' || e.code === 'KeyD') { const d = $('[data-a="diff"]', this.ov); if (d) { this.cycleDiff(e.code === 'ArrowLeft' || e.code === 'KeyA' ? -1 : 1); e.preventDefault(); } }
    else if (e.code === 'Enter' || e.code === 'Space') { const b = n[this.focus]; if (b) { e.preventDefault(); b.click(); } }
    else if (e.code === 'Escape' || e.code === 'Backspace') { const b = $('[data-a="back"]', this.ov); if (b) { e.preventDefault(); b.click(); } }

  showCalibrate(back) {
    // metronome: tap along; average how late the taps land
    Game.ensureAudio();
    const mx = Game.mx, ac = mx.ac, spb = 0.5;
    App.menuMusic(false);
    const t0 = ac.currentTime + 0.6, taps = [];
    for (let i = 0; i < 24; i++) mx.tick(t0 + i * spb, i % 4 === 0);
    Clock.ac = ac;
    this.open('<div class="panel cal"><h2>Calibrate</h2><p class="note center">Tap the big button (or press any key) on every beat you hear.</p><button class="calpad" data-a="tap"><span id="calv">—</span></button><p class="note center small" id="calN">0 / 16 taps</p><button class="btn" data-a="back">Cancel</button></div>', {
      tap: (b, e) => onTap(e.timeStamp),
      back: () => { this.calKey = null; back(); },
    });
    const onTap = (ts) => {
      const at = Clock.ctxAt(ts) - t0;
      const near = Math.round(at / spb);
      if (near < 2 || near > 23) return;
      taps.push(at - near * spb);
      const avg = taps.slice().sort((a, b) => a - b).slice(Math.floor(taps.length * 0.2), Math.ceil(taps.length * 0.8) || 1).reduce((a, b, i, arr) => a + b / arr.length, 0);
      $('#calv').textContent = (avg >= 0 ? '+' : '') + Math.round(avg * 1000) + ' ms';
      $('#calN').textContent = taps.length + ' / 16 taps';
      if (taps.length >= 16) {
        Save.data.settings.offset = Math.round(avg * 1000 / 5) * 5;
        Save.persist();
        this.calKey = null;
        setTimeout(() => back(), 600);
      }
    };
    this.calKey = (e) => { if (!e.repeat) onTap(e.timeStamp); };
  },

      const msg = T ? 'Knocked out of the tournament in the ' + TOUR_ROUNDS[T.round].toLowerCase() + '.' : Game.boss ? (BOSSES.find((b) => b.song === Game.song.spec.id) || {}).name + ' is too strong this time.' : CHARS[Game.song.spec.opp].name + ' wins this round.';
      this.open('<div class="panel dead"><h2 class="big">MIC DROPPED</h2><p class="note center">' + msg + '</p>' + (T ? '' : '<button class="btn hot" data-a="retry" data-nav>Retry</button>') + '<button class="btn" data-a="quit" data-nav>Exit to menu</button></div>', {
        retry: () => { this.close(); Game.restart(); },
        quit: () => { Game.stop(); this.tourState = null; this.showMain(); },
      }, 'dim');
    }, 900);
  },
  resultLine(res) {
    const st = res.st, name = Game.song.spec.name;
    if (res.mode === 'endless') return 'Mic Clash · Endless — survived ' + res.bars + ' bars · ' + st.score.toLocaleString() + ' pts';
    return name + ' (' + res.diff + ') — ' + st.score.toLocaleString() + ' pts · ' + st.rank + ' · ' + st.acc.toFixed(2) + '%' + (st.fc ? ' · FULL COMBO' : '') + ' — Mic Clash';
  },
  showResults(res) {
    const G = Game, spec = G.song.spec, st = res.st, key = spec.id + ':' + res.diff;
    const rows = JUDGE.map((J, i) => '<tr><th style="color:' + J.color + '">' + J.name[0] + J.name.slice(1).toLowerCase() + '</th><td>' + st.counts[i] + '</td></tr>').join('') +
      '<tr><th style="color:' + MISS.color + '">Miss</th><td>' + (st.misses + st.drops) + '</td></tr>' + (st.mines ? '<tr><th style="color:#ff4d6d">Spikes hit</th><td>' + st.mines + '</td></tr>' : '');
    // timing: early / on the beat / late
    const hits = Math.max(1, st.counts.reduce((a, b) => a + b, 0)), on = Math.max(0, hits - st.early - st.late);
    const avg = st.deltas.length ? st.deltas.reduce((a, b) => a + b, 0) / st.deltas.length * 1000 : 0;
    const pct = (v) => Math.round(v / hits * 100);
    const tip = Math.abs(avg) < 12 ? 'Your timing is spot on.' : avg < 0 ? 'You tend to hit early. Wait for the arrow to touch the target.' : 'You tend to hit late. Try pressing a little sooner.';
    const timing = '<div class="timing"><small>TIMING</small><div class="tbar"><i class="e" style="--f:' + (st.early / hits) + '"></i><i class="o" style="--f:' + (on / hits) + '"></i><i class="l" style="--f:' + (st.late / hits) + '"></i></div><span>' + pct(st.early) + '% early · ' + pct(on) + '% on the beat · ' + pct(st.late) + '% late (avg ' + (avg >= 0 ? '+' : '') + avg.toFixed(0) + ' ms)</span>' + (res.mode !== 'endless' && hits > 8 ? '<em>' + tip + '</em>' : '') + '</div>';
    let head = '', sub = res.diff.toUpperCase() + (st.fc ? ' · <b class="fc">FULL COMBO</b>' : ''), acts = {}, btns = '';
    acts.menu = () => { Game.stop(); this.tourState = null; this.showMain(); };
    acts.retry = () => { this.close(); Game.restart(); };
    acts.copy = (b) => this.copy(this.resultLine(res), b);
    if (res.mode === 'endless') {
      head = '<div class="rbig">' + res.bars + '</div><h2>bars survived</h2>';
      sub = (res.bars > (res.prevBars || 0) ? '<b class="fc">NEW RECORD</b>' : 'record ' + res.prevBars + ' bars');
      btns = '<button class="btn hot" data-a="again" data-nav>Go again</button><button class="btn" data-a="menu" data-nav>Menu</button>';
      acts.again = () => this.play({ spec: endlessSpec((Math.random() * 1e9) | 0), diff: 'normal', mode: 'endless' });
    } else if (res.mode === 'tour') {
      const T = this.tourState;
      head = '<div class="rbig r-' + st.rank.replace('+', 'p') + '">' + st.rank + '</div><h2>' + (res.champion ? 'CHAMPION!' : res.won ? TOUR_ROUNDS[res.tour.round] + ' won' : 'Eliminated') + '</h2>';
      sub = 'You ' + st.acc.toFixed(1) + '% · ' + CHARS[res.tour.opp].name + ' ' + res.tour.target.toFixed(1) + '%';
      if (res.won && !res.champion && T) { T.round++; btns = '<button class="btn hot" data-a="bracket" data-nav>Next round</button><button class="btn" data-a="menu" data-nav>Menu</button>'; acts.bracket = () => { Game.stop(); this.showBracket(); }; }
      else { btns = '<button class="btn hot" data-a="tour" data-nav>New tournament</button><button class="btn" data-a="menu" data-nav>Menu</button>'; acts.tour = () => { Game.stop(); this.tourState = null; this.showTour(); }; }
    } else {
      head = '<div class="rbig r-' + st.rank.replace('+', 'p') + '">' + st.rank + '</div><h2>' + spec.name + '</h2>';
      if (res.boss) sub = (res.boss.won ? '<b class="fc">BOSS DEFEATED</b>' : 'The boss survived with ' + Math.round(res.boss.hp * 100) + '% left') + ' · ' + sub;
      if (res.mode === 'practice') sub = 'PRACTICE · ' + Math.round(G.practice.rate * 100) + '% speed';
      if (res.next) { btns = '<button class="btn hot" data-a="next" data-nav>Next song</button><button class="btn" data-a="menu" data-nav>Menu</button>'; acts.next = () => { this.close(); Game.nextStorySong(); }; }
      else if (res.weekDone) { btns = '<button class="btn hot" data-a="story" data-nav>Story</button><button class="btn" data-a="menu" data-nav>Menu</button>'; acts.story = () => { Game.stop(); this.showStory(); }; }
      else btns = '<button class="btn hot" data-a="retry" data-nav>' + (res.bossLost || (res.boss && !res.boss.won) ? 'Fight again' : 'Play again') + '</button><button class="btn" data-a="menu" data-nav>Menu</button>';
    }
    const rk = res.mode === 'free' || res.mode === 'story' ? Board.rankOf(key) : null;
    const fresh = Prog.fresh, notes = (res.weekDone ? '<div class="newi">Week complete! Week score ' + res.weekScore.toLocaleString() + (G.story && WEEKS[G.story.week + 1] ? ' · ' + WEEKS[G.story.week + 1].name + ' unlocked' : '') + '</div>' : '') +
      fresh.unlocks.map((u) => '<div class="newi gold">🔓 ' + u + '</div>').join('') + (fresh.ach.length ? '<div class="achs">' + fresh.ach.map((a) => '<span title="' + a.text + '">★ ' + a.name + '</span>').join('') + '</div>' : '');
    this.open('<div class="panel res">' + head + '<p class="note center">' + sub + '</p>' +
      '<div class="rs"><div><small>Score</small><b>' + st.score.toLocaleString() + '</b>' + (res.isBest && res.mode !== 'practice' ? '<em>NEW BEST</em>' : res.prev ? '<i>best ' + res.prev.score.toLocaleString() + '</i>' : '') + '</div><div><small>Accuracy</small><b>' + st.acc.toFixed(2) + '%</b></div><div><small>Max combo</small><b>' + st.maxCombo + '</b></div><div><small>Crowd</small><b style="color:' + CROWD[st.peak].color + '">' + CROWD[st.peak].name + '</b></div></div>' +
      '<table class="jt">' + rows + '</table>' + timing + notes +
      (rk ? '<p class="note center">Leaderboard: <b>#' + rk.pos + '</b> of ' + rk.of + ' on this song</p>' : '') +
      '<div class="row">' + btns + '</div><button class="btn ghost" data-a="copy">Copy result to share</button></div>', acts, 'dim');
  },
  showVersusResults(r) {
    const a = r.p1, b = r.p2;
    const head = r.winner === 1 ? 'P1 WINS' : r.winner === 0 ? 'P2 WINS' : 'DRAW';
    const col = (x) => '<div class="vcol"><small>' + x[0] + '</small><b>' + x[1].score.toLocaleString() + '</b><span>' + x[1].acc.toFixed(1) + '% · ' + x[1].rank + '</span><span>' + x[1].misses + ' misses · ' + x[1].maxCombo + ' combo</span></div>';
    this.open('<div class="panel res"><h2 class="big">' + head + (r.ko ? ' <em class="ko">KO!</em>' : '') + '</h2><p class="note center">' + Game.song.spec.name + ' · ' + Game.diff.toUpperCase() + '</p>' +
      '<div class="vs2">' + col(['P2 · WASD', b]) + col(['P1 · Arrows', a]) + '</div>' +
      '<div class="row"><button class="btn hot" data-a="again" data-nav>Rematch</button><button class="btn" data-a="pick" data-nav>Other song</button></div><button class="btn ghost" data-a="menu">Menu</button></div>', {
      again: () => { this.close(); Game.restart(); },
      pick: () => { Game.stop(); this.showVersus(); },
      menu: () => { Game.stop(); this.showMain(); },
    }, 'dim');
  },
  copy(text, btn) {
    const done = () => { btn.textContent = 'Copied!'; };
    try {
      navigator.clipboard.writeText(text).then(done, () => { btn.outerHTML = '<p class="note center small">' + text.replace(/</g, '&lt;') + '</p>'; });
    } catch (e) { btn.outerHTML = '<p class="note center small">' + text.replace(/</g, '&lt;') + '</p>'; }
  },
  demoEnded() {},
};

// ---------------------------------------------------------------- main.js (boot, layout, loop, menu music)
if (typeof CanvasRenderingContext2D !== 'undefined' && !CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) { r = Math.min(r || 0, w / 2, h / 2); this.moveTo(x + r, y); this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r); this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r); this.closePath(); return this; };
}
const MENU_SONG = { id: 'menu', name: 'Menu', opp: 'metro', bpm: 102, root: 57, mode: 'dorian', prog: [[0, 'm7'], [5, 'd7'], [3, 'M7'], [5, 'd7']], style: { drums: 'funk', bass: 'pluck', keys: 'stab', swing: 0.18 }, form: 'O4A O4A', seed: 7, stage: 'studio' };
const App = {
  touch: false, unlocked: false, last: 0, safe: { t: 0, b: 0, l: 0, r: 0 }, menuPlayer: null, menuOn: false,
  boot() {
    Save.load();
    this.touch = (navigator.maxTouchPoints || 0) > 0 && window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
    this.cv = $('#cv');
    Render.init(this.cv);
    UI.init();
    Input.init(this.cv);
    window.addEventListener('resize', () => this.layout());
    if (window.visualViewport) window.visualViewport.addEventListener('resize', () => this.layout());
    document.addEventListener('visibilitychange', () => { if (document.hidden) { Input.releaseAll(); if (Game.state === 'play' && !Game.paused && !Game.demo) Game.pause(); } this.last = performance.now(); });
    document.addEventListener('pointerdown', () => this.unlock(), { capture: true, passive: true });
    document.addEventListener('keydown', () => this.unlock(), { capture: true });
    $('#pauseBtn').addEventListener('click', (e) => { e.stopPropagation(); if (Game.state === 'play') { if (Game.paused) Game.resume(); else Game.pause(); } });
    Save.onRemote = () => { if (UI.refresh) UI.refresh(); };
    Save.cloudInit();
    Board.init();
    Stage.setSong(null);
    this.layout();
    UI.showTitle();
    this.last = performance.now();
    requestAnimationFrame((t) => this.loop(t));
    setInterval(() => this.tickAudio(), 40);
  },
  unlock() {
    if (!Game.ensureAudio()) return;
    if (!this.unlocked) { this.unlocked = true; this.menuMusic(this.menuOn || UI.atMenu); }
  },
  // looping instrumental behind the menus
  menuMusic(on) {
    this.menuOn = on;
    if (!Game.mx || !this.unlocked) return;
    if (on && !this.menuPlayer) {
      const song = Composer.build(MENU_SONG, 'easy');
      const p = new SongPlayer(Game.mx, song, { autoSing: [false, false] });
      p.begin(Game.mx.ac.currentTime + 0.15);
      this.menuPlayer = p;
      this.menuSong = song;
    } else if (!on && this.menuPlayer) { this.menuPlayer.stop(); this.menuPlayer = null; }
  },
  tickAudio() {
    const p = this.menuPlayer;
    if (!p || !Game.mx) return;
    const ac = Game.mx.ac;
    p.pump(ac.currentTime + 0.3);
    if (ac.currentTime > p.start + this.menuSong.length - 0.35) { p.begin(p.start + this.menuSong.length); }
    if (Game.state === 'play' && !Game.paused) Game.player.pump(ac.currentTime + 0.3);
  },
  readSafe() {
    const s = getComputedStyle($('#safe'));
    this.safe = { t: parseFloat(s.paddingTop) || 0, b: parseFloat(s.paddingBottom) || 0, l: parseFloat(s.paddingLeft) || 0, r: parseFloat(s.paddingRight) || 0 };
  },
  layout() {
    this.readSafe();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    Render.layout(window.innerWidth, window.innerHeight, dpr);
  },
  loop(t) {
    requestAnimationFrame((tt) => this.loop(tt));
    const dt = Math.min(0.05, Math.max(0, (t - this.last) / 1000));
    this.last = t;
    if (document.hidden) return;
    Game.update(dt);
    Render.update(dt);
    // menu backdrop beat follows the menu music
    if (this.menuPlayer && Game.mx) Render.menuBeat = (Game.mx.ac.currentTime - this.menuPlayer.start) / this.menuSong.spb;
    Render.frame(dt);
  },
};
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => App.boot());
else App.boot();

})();</script>
