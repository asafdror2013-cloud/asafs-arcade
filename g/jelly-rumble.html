<script>

(function () {
  'use strict';
  var CFG = {"id": "jelly-rumble", "owner": "Asaf", "year": 2026, "mark": "br", "dx": 0, "dy": 0, "mount": null, "hubCss": null};
  var NOTICE = '© ' + CFG.year + ' ' + CFG.owner;

  // Inside Asaf's Arcade the game runs in a frame of the arcade page: borrow its cloud saves, let it show the notice.
  var hub = null;
  try {
    var P = window.parent;
    if (P && P !== window && P.__ASAF_ARCADE__ && P.__ASAF_ARCADE__.v === 1) hub = P.__ASAF_ARCADE__;
  } catch (e) { hub = null; }
  window.__ASAF_HUB__ = !!hub;
  if (hub) {
    window.__asafClaude = makeClaude(hub, CFG.id);
    if (CFG.hubCss) {
      var hs = document.createElement('style');
      hs.textContent = CFG.hubCss;
      (document.head || document.documentElement).appendChild(hs);
    }
    return;
  }

  // ---- played on its own: a small permanent tag plus a short notice when the game opens
  var css = '' +
    '#asaf-cr{all:initial;position:fixed;z-index:2147483646;display:block;box-sizing:border-box;pointer-events:none;user-select:none;-webkit-user-select:none;' +
    'font:600 10px/1 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;letter-spacing:.04em;color:rgba(255,255,255,.88);' +
    'background:rgba(6,6,16,.52);padding:4px 8px;border-radius:999px;white-space:nowrap;opacity:.82;transition:opacity .7s ease}' +
    '#asaf-cr.asaf-busy{opacity:.14}' +
    '#asaf-cr-toast{all:initial;position:fixed;z-index:2147483647;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));display:block;box-sizing:border-box;' +
    'transform:translateX(-50%);pointer-events:none;user-select:none;-webkit-user-select:none;width:max-content;max-width:min(90vw,430px);' +
    'font:500 12.5px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#fff;text-align:center;' +
    'background:rgba(8,8,20,.9);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:9px 15px;box-shadow:0 10px 30px rgba(0,0,0,.5);' +
    'opacity:0;animation:asafCrIn .45s ease .6s forwards,asafCrOut .6s ease 5.2s forwards}' +
    '#asaf-cr-toast b{all:unset;font-weight:800}' +
    '#asaf-cr-toast i{all:unset;display:block;margin-top:2px;font-size:11.5px;opacity:.78}' +
    '@keyframes asafCrIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}' +
    '@keyframes asafCrOut{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,0)}}';
  var st = document.createElement('style');
  st.id = 'asaf-cr-style';
  st.textContent = css;
  (document.head || document.documentElement).appendChild(st);

  var dx = 6 + (CFG.dx || 0), dy = 6 + (CFG.dy || 0);
  var T = 'top:calc(' + dy + 'px + env(safe-area-inset-top,0px));';
  var B = 'bottom:calc(' + dy + 'px + env(safe-area-inset-bottom,0px));';
  var L = 'left:calc(' + dx + 'px + env(safe-area-inset-left,0px));';
  var R = 'right:calc(' + dx + 'px + env(safe-area-inset-right,0px));';
  var C = 'left:50%;transform:translateX(-50%);';
  var POS = { tl: T + L, tr: T + R, bl: B + L, br: B + R, tc: T + C, bc: B + C };

  var tag = document.createElement('div');
  tag.id = 'asaf-cr';
  tag.setAttribute('role', 'note');
  tag.setAttribute('aria-label', NOTICE + '. All rights reserved.');
  tag.textContent = NOTICE;
  tag.style.cssText = POS[CFG.mark] || POS.br;

  var toast = document.createElement('div');
  toast.id = 'asaf-cr-toast';
  toast.setAttribute('aria-hidden', 'true');
  var b = document.createElement('b'); b.textContent = NOTICE + ' · All rights reserved';
  var i = document.createElement('i'); i.textContent = 'Free to play. Please don’t copy it or claim it as your own.';
  toast.appendChild(b); toast.appendChild(i);
  setTimeout(function () { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 6200);

  function home() {
    if (CFG.mount) { var m = document.querySelector(CFG.mount); if (m) return m; }
    return document.documentElement;
  }
  function mount() {
    var h = home();
    if (tag.parentNode !== h) h.appendChild(tag);
  }
  function start() {
    mount();
    home().appendChild(toast);
    setInterval(mount, 2500);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();

  // fade the tag while someone is actively playing, bring it back when they pause
  var idle = 0;
  function busy() {
    tag.classList.add('asaf-busy');
    clearTimeout(idle);
    idle = setTimeout(function () { tag.classList.remove('asaf-busy'); }, 2600);
  }
  ['pointerdown', 'keydown', 'touchstart', 'wheel'].forEach(function (ev) {
    window.addEventListener(ev, busy, { capture: true, passive: true });
  });

  // ---- cloud saves through the arcade page (strings only cross between the two pages)
  function makeClaude(H, gid) {
    var cache = {};
    function fail(code) { var e = new Error(code || 'unavailable'); e.code = code || 'unavailable'; return e; }
    function call(fn, args) {
      return new Promise(function (res, rej) {
        var p;
        try { p = H[fn].apply(null, [gid].concat(args || [])); } catch (e) { rej(fail('unavailable')); return; }
        Promise.resolve(p).then(function (s) {
          var r;
          try { r = JSON.parse(s); } catch (e) { rej(fail('internal')); return; }
          if (r && r.ok) res(r.v); else rej(fail(r && r.code));
        }, function () { rej(fail('unavailable')); });
      });
    }
    function snap(path, v) {
      var parts = path.split('/');
      return { id: parts[parts.length - 1], exists: v !== null && v !== undefined,
        data: function () { return v === null || v === undefined ? undefined : JSON.parse(JSON.stringify(v)); } };
    }
    function doc(path) {
      return {
        id: path.split('/').pop(), path: path,
        get: function () { return call('get', [path]).then(function (v) { return snap(path, v); }); },
        set: function (data) { return call('set', [path, JSON.stringify(data)]).then(function () {}); }
      };
    }
    function query(path, lim) {
      return {
        path: path,
        limit: function (n) { return query(path, n); },
        doc: function (id) { return doc(path + '/' + id); },
        onSnapshot: function (next, error) {
          var dead = false, off = null;
          function onErr(code) { if (!dead && typeof error === 'function') error(fail(code)); }
          try {
            off = H.watch(gid, path, lim || 0, function (s) {
              if (dead) return;
              var rows; try { rows = JSON.parse(s); } catch (e) { return; }
              var docs = rows.map(function (d) { return snap(path + '/' + d.id, d.v); });
              next({ docs: docs, size: docs.length, empty: !docs.length, forEach: function (f) { docs.forEach(f); } });
            }, onErr);
          } catch (e) { setTimeout(function () { onErr('unavailable'); }, 0); }
          return function () { dead = true; try { if (off) off(); } catch (e) { /* page gone */ } };
        }
      };
    }
    var db = { doc: doc, collection: function (p) { return query(p, 0); } };
    var user = {
      id: function () { return call('uid', []); },
      me: function () { return call('uid', []).then(function (id) { return { id: id }; }); },
      can: function (n) { return call('can', [String(n)]); },
      profiles: function (ids) { return call('profiles', [JSON.stringify(ids || [])]); },
      isOwner: function () { return false; },
      canEdit: function () { return false; }
    };
    return {
      use: function (name) {
        if (!cache[name]) {
          cache[name] = call('ready', [String(name)]).then(function (ok) {
            if (!ok) return null;
            return name === 'db' ? db : name === 'user' ? user : null;
          }, function () { return null; });
        }
        return cache[name];
      }
    };
  }
})();
</script>

(function () {
'use strict';
// ---------------------------------------------------------------- util.js (math, colours, little helpers)
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a = 1, b) => (b === undefined ? Math.random() * a : a + Math.random() * (b - a));
const randi = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const sign = (v) => (v < 0 ? -1 : v > 0 ? 1 : 0);
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function approach(v, t, d) { return v < t ? Math.min(v + d, t) : Math.max(v - d, t); }
function norm(x, y) { const d = Math.hypot(x, y); return d > 1e-6 ? { x: x / d, y: y / d } : { x: 0, y: 0 }; }
function gauss() { return (Math.random() + Math.random() + Math.random() - 1.5) / 1.5; }
const ease = {
  outCubic: (t) => 1 - Math.pow(1 - t, 3),
  outBack: (t) => { const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  inOut: (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2),
  outElastic: (t) => (t <= 0 ? 0 : t >= 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (TAU / 3)) + 1),
};
function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function rgbHex(r, g, b) { return '#' + [r, g, b].map((v) => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join(''); }

function randomLoadout() {
  // always at least one attack, usually one way to get around
  const atk = AB_IDS.filter((k) => AB[k].kind === 'attack');
  const mov = AB_IDS.filter((k) => AB[k].kind === 'move' || k === 'wall' || k === 'bubble');
  const out = [pick(atk)];
  if (Math.random() < 0.85) { let m; do { m = pick(mov); } while (out.includes(m)); out.push(m); }
  while (out.length < 3) { const k = pick(AB_IDS); if (!out.includes(k)) out.push(k); }
  return shuffle(out);
}

// ---------------------------------------------------------------- save.js (save format + merge for the cloud copy)
const SAVE_KEY = 'jellyrumble.v1';
function defaultSave() {
  return {
    v: 1, updated: 0,
    settings: { music: 0.55, sfx: 0.9, shake: true, guide: true, rounds: 3, level: 1, arena: -1 },
    stats: { matches: 0, wins: 0, kos: 0, falls: 0, rounds: 0, played: 0 },
    koBy: {},
    gauntlet: { best: 0, clears: 0 },
    seen: { how: false },
    slots: [
      { color: 5, hat: 'party', abil: ['bomb', 'zip', 'bubble'] },
      { color: 0, hat: 'sprout', abil: ['dart', 'warp', 'wall'] },
      { color: 3, hat: 'bow', abil: ['pinwheel', 'lash', 'freeze'] },
      { color: 6, hat: 'none', abil: ['laser', 'zip', 'mine'] },
    ],
  };
}
function mergeSaves(a, b) {
  // keep the newer settings and slots, the bigger of every counter
  const newer = (b.updated || 0) > (a.updated || 0) ? b : a, older = newer === a ? b : a;
  const out = JSON.parse(JSON.stringify(newer));
  for (const k in older.stats) out.stats[k] = Math.max(out.stats[k] || 0, older.stats[k] || 0);
  for (const k in older.koBy) out.koBy[k] = Math.max(out.koBy[k] || 0, older.koBy[k] || 0);
  out.gauntlet.best = Math.max(out.gauntlet.best || 0, older.gauntlet.best || 0);
  out.gauntlet.clears = Math.max(out.gauntlet.clears || 0, older.gauntlet.clears || 0);
  out.seen.how = !!(out.seen.how || older.seen.how);
  return out;
}

// ---------------------------------------------------------------- kit/store.js (localStorage + a cloud copy for the signed-in viewer)
function deepFill(t, d) {
  for (const k in d) {
    if (t[k] === undefined || t[k] === null) t[k] = JSON.parse(JSON.stringify(d[k]));
    else if (d[k] && typeof d[k] === 'object' && !Array.isArray(d[k]) && typeof t[k] === 'object') deepFill(t[k], d[k]);
  }
  return t;
}
const Save = {
  data: null, cloud: { ref: null, ready: false, writing: false, pending: false, lastJson: '', failed: 0 }, onRemote: null,
  load() {
    this.data = defaultSave();
    try { const raw = localStorage.getItem(SAVE_KEY); if (raw) this.data = deepFill(JSON.parse(raw), defaultSave()); } catch (e) { /* no storage */ }
    this.sanitize();
  },
  sanitize() {
    const d = this.data;
    if (!Array.isArray(d.slots) || d.slots.length !== 4) d.slots = defaultSave().slots;
    d.slots.forEach((s, i) => {
      const def = defaultSave().slots[i];
      if (!(s.color >= 0 && s.color < COLORS.length)) s.color = def.color;
      if (HAT_IDX[s.hat] === undefined) s.hat = def.hat;
      if (!Array.isArray(s.abil) || s.abil.length !== 3 || s.abil.some((k) => !AB[k]) || new Set(s.abil).size !== 3) s.abil = def.abil.slice();
    });
    d.settings.rounds = [2, 3, 5, 7].includes(d.settings.rounds) ? d.settings.rounds : 3;
    d.settings.level = clamp(d.settings.level | 0, 0, 2);
    if (!(d.settings.arena >= -1 && d.settings.arena < ARENAS.length)) d.settings.arena = -1;
  },
  persistLocal() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(this.data)); } catch (e) { /* ignore */ } },
  persist() { this.data.updated = Date.now(); this.persistLocal(); clearTimeout(this._t); this._t = setTimeout(() => this.cloudWrite(), 900); },
  async cloudInit() {
    try {
      const cl = window.__asafClaude || window.claude;
      if (!cl || typeof cl.use !== 'function') return;
      const [db, user] = await Promise.all([cl.use('db'), cl.use('user')]);
      if (!db || !user) return;
      const id = await user.id();
      if (!id) return;
      const ref = db.doc('data/users/' + id + '/save');
      let timer = 0;
      const snap = await Promise.race([ref.get(), new Promise((_, rej) => { timer = setTimeout(() => rej(new Error('timeout')), 10000); })]);
      clearTimeout(timer);
      this.cloud.ref = ref;
      if (snap && snap.exists) {
        const body = snap.data();
        if (body && body.save) {
          const remote = deepFill(JSON.parse(JSON.stringify(body.save)), defaultSave());
          this.cloud.lastJson = JSON.stringify(body.save);
          this.data = mergeSaves(deepFill(this.data, defaultSave()), remote); this.sanitize(); this.persistLocal();
          if (this.onRemote) this.onRemote();
        }
      }
      this.cloud.ready = true; this.cloudWrite();
    } catch (e) { console.warn('[save] cloud save unavailable:', e && (e.code || e.message)); }
  },
  cloudWrite() {
    const c = this.cloud;
    if (!c.ref || !c.ready) return;
    if (c.writing) { c.pending = true; return; }
    const json = JSON.stringify(this.data);
    if (json === c.lastJson) return;
    c.writing = true;
    c.ref.set({ save: JSON.parse(json) }).then(() => { c.lastJson = json; c.failed = 0; })
      .catch((e) => { const code = e && e.code; c.failed++; if (code === 'unavailable' && c.failed < 3) setTimeout(() => this.cloudWrite(), 2000); else if (code && code !== 'unavailable' && code !== 'resource_exhausted') console.warn('[save] cloud write failed:', code); })
      .finally(() => { c.writing = false; if (c.pending) { c.pending = false; this.cloudWrite(); } });
  },
};

// ---------------------------------------------------------------- audio.js (synth sound effects and two bouncy tunes)
const Sound = {
  ac: null, master: null, sfxBus: null, musBus: null, noiseBuf: null, ok: false, muted: false,
  last: {}, music: null, hum: null,
  init() {
    if (this.ac) { if (this.ac.state === 'suspended') this.ac.resume().catch(() => {}); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { this.ac = new AC(); } catch (e) { return; }
    const ac = this.ac;
    this.master = ac.createGain(); this.master.gain.value = 0.85;
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -14; comp.knee.value = 8; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.15;
    this.master.connect(comp); comp.connect(ac.destination);
    this.sfxBus = ac.createGain(); this.sfxBus.connect(this.master);
    this.musBus = ac.createGain(); this.musBus.connect(this.master);
    const len = ac.sampleRate * 1.2, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.noiseBuf = buf;
    this.ok = true;
    this.applyVolumes();
  },
  applyVolumes() {
    if (!this.ok) return;
    const s = Save.data.settings, t = this.ac.currentTime;
    this.sfxBus.gain.setTargetAtTime(this.muted ? 0 : s.sfx * 0.9, t, 0.03);
    this.musBus.gain.setTargetAtTime(this.muted ? 0 : s.music * 0.42, t, 0.05);
  },
  suspend() { if (this.ac && this.ac.state === 'running') this.ac.suspend().catch(() => {}); },
  resume() { if (this.ac && this.ac.state === 'suspended') this.ac.resume().catch(() => {}); },
  // one oscillator with a pitch sweep and a quick envelope
  tone(o) {
    const ac = this.ac, t = ac.currentTime + (o.delay || 0);
    const osc = ac.createOscillator(), g = ac.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.f0, t);
    if (o.f1) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.f1), t + (o.sweep || o.dur));
    if (o.detune) osc.detune.value = o.detune;
    const v = o.vol === undefined ? 0.3 : o.vol, a = o.attack || 0.004;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
    let node = osc;
    if (o.lp) { const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp; node.connect(f); node = f; }
    node.connect(g); g.connect(o.bus || this.sfxBus);
    osc.start(t); osc.stop(t + o.dur + 0.05);
  },
  noise(o) {
    const ac = this.ac, t = ac.currentTime + (o.delay || 0);
    const src = ac.createBufferSource(); src.buffer = this.noiseBuf;
    src.playbackRate.value = o.rate || 1;
    const f = ac.createBiquadFilter(); f.type = o.filter || 'lowpass'; f.Q.value = o.q || 0.8;
    f.frequency.setValueAtTime(o.f0 || 2000, t);
    if (o.f1) f.frequency.exponentialRampToValueAtTime(Math.max(30, o.f1), t + o.dur);
    const g = ac.createGain(), v = o.vol === undefined ? 0.3 : o.vol;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v, t + (o.attack || 0.004));
    g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
    src.connect(f); f.connect(g); g.connect(o.bus || this.sfxBus);
    src.start(t, Math.random() * 0.5); src.stop(t + o.dur + 0.05);
  },
  play(name, vol = 1) {
    if (!this.ok || this.muted || !SFX[name]) return;
    const now = this.ac.currentTime;
    if (this.last[name] && now - this.last[name] < 0.035) return; // gate rapid repeats
    this.last[name] = now;
    try { SFX[name](this, vol, 1 + (Math.random() - 0.5) * 0.08); } catch (e) { /* ignore */ }
  },
  humStart() {
    if (!this.ok || this.hum) return;
    const ac = this.ac, o = ac.createOscillator(), o2 = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter();
    o.type = 'sawtooth'; o.frequency.value = 70; o2.type = 'sine'; o2.frequency.value = 140;
    f.type = 'lowpass'; f.frequency.value = 420;
    g.gain.value = 0.0001; g.gain.exponentialRampToValueAtTime(0.09, ac.currentTime + 0.2);

  },
  humStop() {

  fireLaser(j, aim) {
    const segs = [];
    let ox = j.x + aim.x * 16, oy = j.y + aim.y * 16, dx = aim.x, dy = aim.y, bounces = 0;
    const killed = new Set();
    for (let seg = 0; seg < 3; seg++) {
      let best = 1800, nx = 0, ny = 0, hitKind = null, hitJ = null;
      for (const p of this.plats) {
        if (p.thin || p.dead) continue;
        const h = rayRect(ox, oy, dx, dy, p, best);
        if (h && h.t > 0.5 && h.t < best) { best = h.t; nx = h.nx; ny = h.ny; hitKind = 'plat'; }
      }
      // bubbles reflect the beam
      for (const o of this.jellies) {
        if (!o.alive || o.shield <= 0 || (o === j && seg === 0)) continue;
        const fx = o.x - ox, fy = o.y - oy, tca = fx * dx + fy * dy; if (tca < 0) continue;
        const d2 = fx * fx + fy * fy - tca * tca, R = 28; if (d2 > R * R) continue;
        const t = tca - Math.sqrt(R * R - d2);
        if (t > 0.5 && t < best) { best = t; const hx = ox + dx * t, hy = oy + dy * t; const n = norm(hx - o.x, hy - o.y); nx = n.x; ny = n.y; hitKind = 'bubble'; hitJ = o; }
      }
      const ex = ox + dx * best, ey = oy + dy * best;
      segs.push([ox, oy, ex, ey]);
      for (const o of this.jellies) {
        if (!o.alive || killed.has(o) || (o === j && seg === 0) || o === hitJ) continue;
        if (segAabb(ox, oy, ex, ey, o.x, o.y, o.hw + 5, o.hh + 5)) { if (this.hurt(o, { owner: j, cause: 'laser', dx, dy }) === 'kill') killed.add(o); }
      }

    this.addShake(5); this.snd('zap');
  }

  // ---------------------------------------------------------------- projectiles
  stepProj(p, dt) {

        if (p.fuse <= 0) { p.dead = true; this.explode(p.x, p.y, 84, p.owner, 'bomb', { color: '#ff3d55' }); }

            }

          if (o) { if (o.shield > 0) this.reflect(p, o); else { this.hurt(o, { owner: p.owner, cause: 'dart', dx: p.vx, dy: p.vy }); p.dead = true; } }

// ---------- touch controls (screen space)
function drawTouch(ctx, j) {
  const L = TouchPad.layout; if (!L) return;
  Gfx.screen(ctx);
  const st = TouchPad.stick;
  if (st) {
    ctx.fillStyle = 'rgba(255,255,255,0.14)'; ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(st.ox, st.oy, L.stickR, 0, TAU); ctx.fill(); ctx.stroke();
    const dx = st.x - st.ox, dy = st.y - st.oy, d = Math.hypot(dx, dy), m = Math.min(1, L.stickR / Math.max(1, d));
    ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.beginPath(); ctx.arc(st.ox + dx * m, st.oy + dy * m, L.stickR * 0.42, 0, TAU); ctx.fill();
  } else {
    const x = 90 * L.s + (Input.safe.l || 0), y = Gfx.ch - 90 * L.s;
    ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 3; ctx.setLineDash([6, 8]);
    ctx.beginPath(); ctx.arc(x, y, L.stickR, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
    txt(ctx, 'MOVE · AIM', x, y, 13 * L.s, 'rgba(255,255,255,0.75)', 'center', { stroke: 'rgba(40,20,60,0.5)', sw: 3 });
  }
  L.btns.forEach((b, i) => {
    const held = TouchPad.btn[i] !== null;
    ctx.globalAlpha = held ? 0.95 : 0.72;
    ctx.fillStyle = i === 0 ? 'rgba(255,255,255,0.28)' : 'rgba(30,16,46,0.35)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r * (held ? 0.94 : 1), 0, TAU); ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.stroke();
    if (i === 0) txt(ctx, 'JUMP', b.x, b.y + 1, b.r * 0.42, '#fff', 'center', { sw: 4 });
    else if (j) {
      const s = j.abil[i - 1], sz = b.r * 1.15;
      drawIcon(ctx, s.id, b.x, b.y, sz, { dim: s.cd > 0 });
      drawCooldown(ctx, b.x, b.y, sz, s.cd / AB[s.id].cd);
    }
  });

  const p = L.pause;
  ctx.fillStyle = 'rgba(30,16,46,0.45)'; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.fillRect(p.x - p.r * 0.32, p.y - p.r * 0.38, p.r * 0.22, p.r * 0.76); ctx.fillRect(p.x + p.r * 0.1, p.y - p.r * 0.38, p.r * 0.22, p.r * 0.76);
}

// ---------------------------------------------------------------- ui.js (menus, lobby, rounds, swap phase, results, gauntlet)
const UI = {
  btns: [], prevBtns: [], focus: 0, hover: null, downBtn: null, clicked: null,
  begin() { this.prevBtns = this.btns; this.btns = []; },
  // buttons register while drawing; clicks resolve against last frame's buttons
  btn(ctx, id, label, x, y, w, h, o = {}) {
    const b = { id, x, y, w, h, focusable: o.focusable !== false, act: o.act };
    this.btns.push(b);
    const fi = this.btns.filter((q) => q.focusable).length - 1;
    const foc = o.focused !== undefined ? o.focused : (b.focusable && Input.lastKind !== 'ptr' && Input.lastKind !== 'touch' && fi === this.focus);
    const hov = this.hover === id;
    const press = this.downBtn === id && Input.ptr.down;
    const lift = (foc || hov) && !o.disabled ? -3 : 0, sq = press ? 2 : 0;
    const base = o.disabled ? '#6b5c7d' : o.color || '#ffd23a';
    ctx.save(); ctx.translate(x + w / 2, y + h / 2 + lift + sq);
    rr(ctx, -w / 2, -h / 2 + 5, w, h, h * 0.32); ctx.fillStyle = mix(base, INK, 0.55); ctx.fill();
    rr(ctx, -w / 2, -h / 2, w, h, h * 0.32); ctx.fillStyle = base; ctx.fill();
    ctx.save(); rr(ctx, -w / 2, -h / 2, w, h, h * 0.32); ctx.clip(); ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fillRect(-w / 2, -h / 2, w, h * 0.45); ctx.restore();
    rr(ctx, -w / 2, -h / 2, w, h, h * 0.32); ctx.lineWidth = foc || hov ? 4 : 3; ctx.strokeStyle = foc ? '#ffffff' : INK; ctx.stroke();
    if (foc) { rr(ctx, -w / 2 - 5, -h / 2 - 5, w + 10, h + 10, h * 0.4); ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke(); }
    if (o.icon) { drawIcon(ctx, o.icon, -w / 2 + h * 0.55, 0, h * 0.62); }
    const fs = o.size || h * 0.46;
    const sz = fitText(ctx, label, w - (o.icon ? h * 1.3 : 20), fs);
    txt(ctx, label, o.icon ? h * 0.3 : 0, 2, sz, o.textColor || (o.disabled ? '#c9bdd8' : '#ffffff'), 'center', { sw: Math.max(3, sz * 0.2) });
    ctx.restore();
    return b;
  },
  // invisible hit area
  area(id, x, y, w, h, act) { this.btns.push({ id, x, y, w, h, focusable: false, act }); },
  hitAt(x, y) { for (let i = this.prevBtns.length - 1; i >= 0; i--) { const b = this.prevBtns[i]; if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b; } return null; },
  focusables() { return this.prevBtns.filter((b) => b.focusable); },
  navMenu(m) {
    const f = this.focusables(); if (!f.length) return;
    if (m.u || m.l) { this.focus = (this.focus - 1 + f.length) % f.length; Sound.play('blip'); }
    if (m.d || m.r) { this.focus = (this.focus + 1) % f.length; Sound.play('blip'); }
    if (this.focus >= f.length) this.focus = 0;
    if (m.ok && f[this.focus] && f[this.focus].act) { Sound.play('ok'); f[this.focus].act(null); }
  },
};

function dimScreen(ctx, c) { Gfx.screen(ctx); ctx.fillStyle = c; ctx.fillRect(0, 0, Gfx.cw, Gfx.ch); Gfx.world(ctx); }
function panel(ctx, x, y, w, h, fill = '#2d1c48', o = {}) {
  rr(ctx, x, y + 6, w, h, o.r || 18); ctx.fillStyle = 'rgba(20,8,32,0.45)'; ctx.fill();
  rr(ctx, x, y, w, h, o.r || 18); ctx.fillStyle = fill; ctx.fill();
  ctx.lineWidth = o.lw || 3.5; ctx.strokeStyle = o.stroke || INK; ctx.stroke();

const App = {
  screen: 'boot', t: 0, attract: null, attractT: 0, match: null, lobby: null, toasts: [], fade: 0,
  howPage: 0, rotateOk: false, paused: false, pauseFocus: 0,
  go(screen) {
    this.screen = screen; UI.focus = 0; this.fade = 1;
    if (screen === 'title') { Music.play('menu'); if (!this.attract) this.newAttract(); }
  },
  newAttract() {
    const parts = [0, 1, 2, 3].map((i) => mkPart(i, { color: [5, 0, 3, 7][i], hat: pick(['party', 'sprout', 'bow', 'none']), abil: randomLoadout() }, rand() < 0.5 ? 1 : 2, null));
    this.attract = new World(randi(0, ARENAS.length - 1), parts, { quiet: true, intro: 0.3, suddenT: 30 });
    this.attract.jellies.forEach((j) => { j.bot = new Bot(j, j.part.cpu); });
    this.attractT = 0;
  },
  toast(title, sub, hat) { this.toasts.push({ title, sub, hat, t: 0 }); Sound.play('unlock'); },
};

function mkPart(slot, cfg, cpu, dev) {
  return { slot, color: cfg.color, hat: cfg.hat, abil: cfg.abil.slice(), cpu: cpu === undefined || cpu === null ? -1 : cpu, dev: dev || null,
    tag: '', score: 0, kos: 0, falls: 0, uses: {}, koBy: {}, streak: 0 };
}
const colorName = (p) => COLORS[p.color].name;

// ---------------------------------------------------------------- unlocks
function checkUnlocks() {
  const s = Save.data;
  for (const h of HATS) {
    if (!h.test) continue;
    const key = 'hat_' + h.id;
    if (!s.seen[key] && h.test(s)) { s.seen[key] = true; App.toast('New hat!', h.name, h.id); }
  }
  Save.persist();
}
function hatOpen(id) { const h = HATS[HAT_IDX[id]]; return !h.test || h.test(Save.data); }
function openHats() { return HATS.filter((h) => hatOpen(h.id)).map((h) => h.id); }

// ---------------------------------------------------------------- lobby
const ROWS = ['Color', 'Hat', 'Ability 1', 'Ability 2', 'Ability 3', 'Ready'];
function openLobby(mode, devId) {
  const L = { mode, cards: [], barFocus: mode === 'gauntlet' ? 0 : 3, picker: null, msg: '', msgT: 0 };
  for (let i = 0; i < 4; i++) L.cards.push({ i, kind: 'empty', dev: null, row: 0, ready: false, cfg: JSON.parse(JSON.stringify(Save.data.slots[i])), cpu: Save.data.settings.level, bob: rand(TAU) });
  App.lobby = L;
  if (mode === 'gauntlet') joinCard(L.cards[0], devId || defaultDev());
  else if (devId) joinCard(L.cards[0], devId);
  App.go('lobby');
}
function defaultDev() { return Input.lastKind === 'touch' || Input.ptr.kind === 'touch' ? 'touch' : Input.lastKind === 'pad' ? firstPad() || 'kb0' : 'kb0'; }
function firstPad() { const d = Input.devs.find((d) => d.kind === 'pad' && d.connected); return d ? d.id : null; }
function joinCard(c, devId) {
  c.kind = 'human'; c.dev = devId; c.row = 0; c.ready = false;
  fixCfg(c);
  Sound.play('join');
}
function fixCfg(c) {
  const used = App.lobby.cards.filter((o) => o !== c && o.kind !== 'empty').map((o) => o.cfg.color);
  if (used.includes(c.cfg.color)) { for (let k = 0; k < COLORS.length; k++) if (!used.includes(k)) { c.cfg.color = k; break; } }
  if (!hatOpen(c.cfg.hat)) c.cfg.hat = 'none';
}
function addCpu(c) {
  if (!c) c = App.lobby.cards.find((o) => o.kind === 'empty');
  if (!c) return;
  c.kind = 'cpu'; c.dev = null; c.ready = true; c.cpu = Save.data.settings.level;
  c.cfg.abil = randomLoadout(); c.cfg.hat = pick(openHats());
  fixCfg(c); Sound.play('join');
}
function lobbyCycle(c, row, d) {
  const cfg = c.cfg;
  if (row === 0) {
    const used = App.lobby.cards.filter((o) => o !== c && o.kind !== 'empty').map((o) => o.cfg.color);
    let k = cfg.color; for (let n = 0; n < COLORS.length; n++) { k = (k + d + COLORS.length) % COLORS.length; if (!used.includes(k)) break; } cfg.color = k;
  } else if (row === 1) {
    const hs = openHats(); let i = hs.indexOf(cfg.hat); i = (i + d + hs.length) % hs.length; cfg.hat = hs[i];
  } else if (row >= 2 && row <= 4) {
    const si = row - 2; let i = AB_ORDER.indexOf(cfg.abil[si]);
    for (let n = 0; n < AB_ORDER.length; n++) { i = (i + d + AB_ORDER.length) % AB_ORDER.length; if (!cfg.abil.includes(AB_ORDER[i])) break; }
    cfg.abil[si] = AB_ORDER[i];
  } else if (row === 5 && c.kind === 'cpu') { c.cpu = (c.cpu + d + 3) % 3; Save.data.settings.level = c.cpu; }
  Sound.play('tick');
}
function lobbyCanStart(L) {
  const occ = L.cards.filter((c) => c.kind !== 'empty');
  if (L.mode === 'gauntlet') return occ.length === 1;

  M.lastArena = a;

  M.world.jellies.forEach((j) => { if (j.part.cpu >= 0) j.bot = new Bot(j, j.part.cpu); });

    M.sudden -= dt;
    if (w.phase === 'over') {
      M.phase = 'roundEnd'; M.t = 0;
      const win = w.winner ? w.winner.part : null;

// ---------- the ability swap between rounds: everyone who lost the round may trade one ability
function openSwap() {
  const M = App.match;
  const panels = M.parts.map((p) => {
    const lost = p !== M.roundWinner && !(M.mode === 'gauntlet' && p.cpu >= 0);
    if (!lost) return { part: p, done: true, skip: true };
    const pool = shuffle(AB_IDS.filter((k) => !p.abil.includes(k)));
    return { part: p, offers: pool.slice(0, 3), focus: 3, done: false, cpuT: rand(0.8, 2.2) };
  });
  if (panels.every((s) => s.done)) { newRound(); return; }
  M.swap = { panels, t: 10 };
  M.phase = 'swap'; M.t = 0;
}
function chooseSwap(sp, i) {
  if (sp.done) return;
  sp.done = true; sp.choice = i;
  if (i < 3) { sp.part.abil[i] = sp.offers[i]; Sound.play('ok'); } else Sound.play('blip');
}
function updateSwap(dt) {
  const M = App.match, S = M.swap;
  S.t -= dt;
  for (const sp of S.panels) {
    if (sp.done) continue;
    const p = sp.part;
    if (p.cpu >= 0) {
      sp.cpuT -= dt;
      if (sp.cpuT <= 0) {
        // CPUs like having an attack and a way to move
        let best = 3;
        if (Math.random() < 0.65) {
          const hasAtk = (a) => a.some((k) => AB[k].kind === 'attack');
          for (let i = 0; i < 3; i++) { const trial = p.abil.slice(); trial[i] = sp.offers[i]; if (hasAtk(trial)) { best = i; if (Math.random() < 0.5) break; } }
        }
        chooseSwap(sp, best);
      }
      continue;
    }
    const d = p.dev && p.dev !== 'touch' ? Input.dev(p.dev) : null;
    if (d) {
      if (d.nav.u) { sp.focus = (sp.focus + 3) % 4; Sound.play('blip'); }
      if (d.nav.d) { sp.focus = (sp.focus + 1) % 4; Sound.play('blip'); }
      if (d.okP || d.jumpP && d.kind === 'pad') chooseSwap(sp, sp.focus);
    }
  }
  if (S.panels.every((s) => s.done) || S.t <= 0) {

}

function drawLogo(ctx, x, y, s, t) {
  const word1 = 'JELLY', word2 = 'RUMBLE';
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  const cols = ['#ff4d6d', '#ff9a1f', '#ffd83a', '#7ad845', '#2fe0c0', '#4f8dff', '#a565ff', '#ff7bd5'];
  const draw = (word, yy, size, off) => {
    ctx.font = size + 'px ' + HEAD;
    const widths = [...word].map((ch) => ctx.measureText(ch).width), total = widths.reduce((a, b) => a + b, 0) + (word.length - 1) * 4;
    let cx = -total / 2;
    [...word].forEach((ch, i) => {
      const bob = Math.sin(t * 4 + i * 0.7 + off) * 6, sq = 1 + Math.sin(t * 8 + i + off) * 0.04;
      ctx.save(); ctx.translate(cx + widths[i] / 2, yy + bob); ctx.scale(1 / sq, sq); ctx.rotate(Math.sin(t * 3 + i) * 0.05);
      txt(ctx, ch, 0, 6, size, INK, 'center', { stroke: INK, sw: size * 0.22 });

}

function drawHow(ctx) {

// ---------------------------------------------------------------- main.js (pointer + touch routing, screens, the frame loop, boot)
function gesture() {
  Sound.init();
  if (Sound.ok) { Sound.applyVolumes(); if (Music.want && Music.track !== Music.want) { const w = Music.want; Music.track = null; Music.play(w); } }
}
const _musicPlay = Music.play.bind(Music);
Music.play = function (name) { this.want = name; _musicPlay(name); };

function touchControlsLive() {
  const M = App.match;
  return App.screen === 'game' && M && !App.paused && M.phase === 'round' && M.parts.some((p) => p.dev === 'touch');
}
function rotateHint() {
  return !App.rotateOk && Gfx.ch > Gfx.cw * 1.05 && (Input.lastKind === 'touch' || (window.matchMedia && matchMedia('(pointer: coarse)').matches));
}
function setupPointer() {
  const cv = Gfx.cv, P = Input.ptr;
  const pos = (e) => { const l = Gfx.toLogical(e.clientX, e.clientY); P.x = l.x; P.y = l.y; P.sx = e.clientX; P.sy = e.clientY; };
  cv.addEventListener('pointerdown', (e) => {
    gesture();
    P.kind = e.pointerType || 'mouse';
    Input.lastKind = P.kind === 'touch' ? 'touch' : 'ptr';
    if (P.kind === 'touch') TouchPad.used = true;
    pos(e);
    if (rotateHint()) return;
    if (P.kind === 'touch' && touchControlsLive()) { TouchPad.start(e.pointerId, e.clientX, e.clientY); e.preventDefault(); return; }
    P.down = true; P.pressed = true; P.id = e.pointerId;
    const b = UI.hitAt(P.x, P.y); UI.downBtn = b ? b.id : null;
    try { cv.setPointerCapture(e.pointerId); } catch (x) { /* ignore */ }
    e.preventDefault();
  }, { passive: false });
  cv.addEventListener('pointermove', (e) => {
    if (e.pointerType === 'touch' && touchControlsLive()) { TouchPad.move(e.pointerId, e.clientX, e.clientY); return; }
    pos(e); P.moved = true;
    if (e.pointerType !== 'touch') { Input.lastKind = 'ptr'; const b = UI.hitAt(P.x, P.y); UI.hover = b ? b.id : null; if (b && b.focusable) { const f = UI.focusables(); const i = f.indexOf(b); if (i >= 0) UI.focus = i; } }
  });
  const up = (e) => {
    TouchPad.end(e.pointerId);
    if (rotateHint()) { App.rotateOk = true; return; }
    if (P.id !== e.pointerId) return;
    pos(e); P.down = false; P.released = true;
    const b = UI.hitAt(P.x, P.y);
    if (b && UI.downBtn === b.id && b.act) { Sound.play('ok'); b.act(e); }
    UI.downBtn = null;
    if (e.pointerType === 'touch') UI.hover = null;
  };
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', (e) => { TouchPad.end(e.pointerId); P.down = false; UI.downBtn = null; });
  cv.addEventListener('contextmenu', (e) => e.preventDefault());
  window.addEventListener('keydown', () => gesture());
}

let last = 0;
function frame(now) {
  const dt = last ? Math.min(0.05, Math.max(0, (now - last) / 1000)) : 1 / 60;
  last = now; App.t += dt;
  Input.poll(dt);
  if (Input.devs.some((d) => d.kind === 'pad' && (d.jumpP || d.okP))) gesture();
  try {
    if (!rotateHint()) update(dt);
    draw();
  } catch (err) { console.error(err); }
  Input.endFrame();
  requestAnimationFrame(frame);
}
function update(dt) {
  for (const tt of App.toasts) tt.t += dt;
  App.toasts = App.toasts.filter((tt) => tt.t < 3.6);
  App.fade = Math.max(0, App.fade - dt * 4);
  switch (App.screen) {
    case 'title': updateTitle(dt); break;
    case 'lobby': updateLobby(dt); break;
    case 'game': updateGame(dt); break;
    case 'how': case 'settings': case 'wardrobe': updateSimple(dt); break;
  }
}
function draw() {
  const ctx = Gfx.ctx;
  UI.begin();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#2a1838'; ctx.fillRect(0, 0, Gfx.cv.width, Gfx.cv.height);
  switch (App.screen) {
    case 'title': drawTitle(ctx); break;
    case 'lobby': drawLobby(ctx); break;
    case 'game': {
      const M = App.match;
      renderWorld(ctx, M.world, { guides: true, tags: true });
      Gfx.world(ctx);
      if (M.phase === 'round' || M.phase === 'roundEnd') drawHud(ctx);
      if (M.phase === 'swap') drawSwap(ctx);
      if (M.phase === 'results') drawResults(ctx);
      if (App.paused) drawPause(ctx);
      if (touchControlsLive()) { const j = M.world.jellies.find((q) => q.part.dev === 'touch'); drawTouch(ctx, j && j.alive ? j : j); }
      break;
    }
    case 'how': drawHow(ctx); break;
    case 'settings': drawSettings(ctx); break;
    case 'wardrobe': drawWardrobe(ctx); break;
    default: if (App.customDraw) App.customDraw(ctx);
  }
  Gfx.world(ctx);
  drawToasts(ctx);
  if (App.fade > 0) { Gfx.screen(ctx); ctx.fillStyle = rgba('#2a1838', App.fade * 0.8); ctx.fillRect(0, 0, Gfx.cw, Gfx.ch); }
  if (rotateHint()) {
    Gfx.screen(ctx); ctx.fillStyle = 'rgba(30,12,50,0.92)'; ctx.fillRect(0, 0, Gfx.cw, Gfx.ch);
    const cx = Gfx.cw / 2, cy = Gfx.ch / 2, r = Math.sin(App.t * 2) * 0.5 - 0.3;
    ctx.save(); ctx.translate(cx, cy - 60); ctx.rotate(r); rr(ctx, -28, -48, 56, 96, 10); ctx.lineWidth = 5; ctx.strokeStyle = '#fff'; ctx.stroke(); ctx.restore();
    txt(ctx, 'TURN SIDEWAYS', cx, cy + 40, 30, '#ffd23a', 'center', { sw: 7 });
    txt(ctx, 'Jelly Rumble plays best in landscape.', cx, cy + 78, 16, '#fff', 'center', { body: true, weight: 600, stroke: false });
    txt(ctx, 'Tap to play anyway', cx, cy + 104, 14, 'rgba(255,255,255,0.7)', 'center', { body: true, weight: 600, stroke: false });
  }
}

function boot() {
  Save.load();
  Input.init();
  Gfx.init();
  setupPointer();
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { if (App.screen === 'game' && !App.paused && App.match && App.match.phase === 'round' && App.match.parts.some((p) => p.cpu < 0)) togglePause(); Sound.humStop(); Sound.suspend(); }
    else Sound.resume();
  });
  window.addEventListener('pagehide', () => { Sound.humStop(); Sound.suspend(); });
  window.addEventListener('gamepadconnected', () => { Input.lastKind = 'pad'; });
  const fonts = document.fonts ? Promise.all([document.fonts.load('40px "Luckiest Guy"'), document.fonts.load('700 20px Fredoka'), document.fonts.load('600 20px Fredoka')]) : Promise.resolve();
  Promise.race([fonts, new Promise((r) => setTimeout(r, 1500))]).catch(() => {}).then(() => {
    Gfx.bgKey = '';
    App.go('title');
    requestAnimationFrame(frame);
  });
  Save.cloudInit();
}
// hooks for automated checks (only with ?jrtest in the address)
try { if (/[?&]jrtest\b/.test(location.search)) window.__jr = { App, Save, Input, TouchPad, Gfx, startMatch, mkPart, openLobby, newRound, endMatch, openSwap, World, Bot, ARENAS, renderWorld, drawLogo, Sound }; } catch (e) { /* ignore */ }
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

})();
