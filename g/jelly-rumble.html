<script>

(function () {
  'use strict';
  var CFG = {"id": "jelly-rumble", "owner": "Asaf", "year": 2026, "mark": "br", "dx": 0, "dy": 0, "mount": null, "hubCss": null};
  var NOTICE = '© ' + CFG.year + ' ' + CFG.owner;

  // Inside Asaf's Arcade the game runs in a frame of the arcade page: borrow its cloud saves, let it show the notice.
  var hub = null;
  try {
    var P = window.parent;
    if (P && P !== window && P.__ASAF_ARCADE__ && P.__ASAF_ARCADE__.v === 1) hub = P.__ASAF_ARCADE__;
  } catch (e) { hub = null; }
  window.__ASAF_HUB__ = !!hub;
  if (hub) {
    window.__asafClaude = makeClaude(hub, CFG.id);
    if (CFG.hubCss) {
      var hs = document.createElement('style');
      hs.textContent = CFG.hubCss;
      (document.head || document.documentElement).appendChild(hs);
    }
    return;
  }

  // ---- played on its own: a small permanent tag plus a short notice when the game opens
  var css = '' +
    '#asaf-cr{all:initial;position:fixed;z-index:2147483646;display:block;box-sizing:border-box;pointer-events:none;user-select:none;-webkit-user-select:none;' +
    'font:600 10px/1 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;letter-spacing:.04em;color:rgba(255,255,255,.88);' +
    'background:rgba(6,6,16,.52);padding:4px 8px;border-radius:999px;white-space:nowrap;opacity:.82;transition:opacity .7s ease}' +
    '#asaf-cr.asaf-busy{opacity:.14}' +
    '#asaf-cr-toast{all:initial;position:fixed;z-index:2147483647;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));display:block;box-sizing:border-box;' +
    'transform:translateX(-50%);pointer-events:none;user-select:none;-webkit-user-select:none;width:max-content;max-width:min(90vw,430px);' +
    'font:500 12.5px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#fff;text-align:center;' +
    'background:rgba(8,8,20,.9);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:9px 15px;box-shadow:0 10px 30px rgba(0,0,0,.5);' +
    'opacity:0;animation:asafCrIn .45s ease .6s forwards,asafCrOut .6s ease 5.2s forwards}' +
    '#asaf-cr-toast b{all:unset;font-weight:800}' +
    '#asaf-cr-toast i{all:unset;display:block;margin-top:2px;font-size:11.5px;opacity:.78}' +
    '@keyframes asafCrIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}' +
    '@keyframes asafCrOut{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,0)}}';
  var st = document.createElement('style');
  st.id = 'asaf-cr-style';
  st.textContent = css;
  (document.head || document.documentElement).appendChild(st);

  var dx = 6 + (CFG.dx || 0), dy = 6 + (CFG.dy || 0);
  var T = 'top:calc(' + dy + 'px + env(safe-area-inset-top,0px));';
  var B = 'bottom:calc(' + dy + 'px + env(safe-area-inset-bottom,0px));';
  var L = 'left:calc(' + dx + 'px + env(safe-area-inset-left,0px));';
  var R = 'right:calc(' + dx + 'px + env(safe-area-inset-right,0px));';
  var C = 'left:50%;transform:translateX(-50%);';
  var POS = { tl: T + L, tr: T + R, bl: B + L, br: B + R, tc: T + C, bc: B + C };

  var tag = document.createElement('div');
  tag.id = 'asaf-cr';
  tag.setAttribute('role', 'note');
  tag.setAttribute('aria-label', NOTICE + '. All rights reserved.');
  tag.textContent = NOTICE;
  tag.style.cssText = POS[CFG.mark] || POS.br;

  var toast = document.createElement('div');
  toast.id = 'asaf-cr-toast';
  toast.setAttribute('aria-hidden', 'true');
  var b = document.createElement('b'); b.textContent = NOTICE + ' · All rights reserved';
  var i = document.createElement('i'); i.textContent = 'Free to play. Please don’t copy it or claim it as your own.';
  toast.appendChild(b); toast.appendChild(i);
  setTimeout(function () { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 6200);

  function home() {
    if (CFG.mount) { var m = document.querySelector(CFG.mount); if (m) return m; }
    return document.documentElement;
  }
  function mount() {
    var h = home();
    if (tag.parentNode !== h) h.appendChild(tag);
  }
  function start() {
    mount();
    home().appendChild(toast);
    setInterval(mount, 2500);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();

  // fade the tag while someone is actively playing, bring it back when they pause
  var idle = 0;
  function busy() {
    tag.classList.add('asaf-busy');
    clearTimeout(idle);
    idle = setTimeout(function () { tag.classList.remove('asaf-busy'); }, 2600);
  }
  ['pointerdown', 'keydown', 'touchstart', 'wheel'].forEach(function (ev) {
    window.addEventListener(ev, busy, { capture: true, passive: true });
  });

  // ---- cloud saves through the arcade page (strings only cross between the two pages)
  function makeClaude(H, gid) {
    var cache = {};
    function fail(code) { var e = new Error(code || 'unavailable'); e.code = code || 'unavailable'; return e; }
    function call(fn, args) {
      return new Promise(function (res, rej) {
        var p;
        try { p = H[fn].apply(null, [gid].concat(args || [])); } catch (e) { rej(fail('unavailable')); return; }
        Promise.resolve(p).then(function (s) {
          var r;
          try { r = JSON.parse(s); } catch (e) { rej(fail('internal')); return; }
          if (r && r.ok) res(r.v); else rej(fail(r && r.code));
        }, function () { rej(fail('unavailable')); });
      });
    }
    function snap(path, v) {
      var parts = path.split('/');
      return { id: parts[parts.length - 1], exists: v !== null && v !== undefined,
        data: function () { return v === null || v === undefined ? undefined : JSON.parse(JSON.stringify(v)); } };
    }
    function doc(path) {
      return {
        id: path.split('/').pop(), path: path,
        get: function () { return call('get', [path]).then(function (v) { return snap(path, v); }); },
        set: function (data) { return call('set', [path, JSON.stringify(data)]).then(function () {}); }
      };
    }
    function query(path, lim) {
      return {
        path: path,
        limit: function (n) { return query(path, n); },
        doc: function (id) { return doc(path + '/' + id); },
        onSnapshot: function (next, error) {
          var dead = false, off = null;
          function onErr(code) { if (!dead && typeof error === 'function') error(fail(code)); }
          try {
            off = H.watch(gid, path, lim || 0, function (s) {
              if (dead) return;
              var rows; try { rows = JSON.parse(s); } catch (e) { return; }
              var docs = rows.map(function (d) { return snap(path + '/' + d.id, d.v); });
              next({ docs: docs, size: docs.length, empty: !docs.length, forEach: function (f) { docs.forEach(f); } });
            }, onErr);
          } catch (e) { setTimeout(function () { onErr('unavailable'); }, 0); }
          return function () { dead = true; try { if (off) off(); } catch (e) { /* page gone */ } };
        }
      };
    }
    var db = { doc: doc, collection: function (p) { return query(p, 0); } };
    var user = {
      id: function () { return call('uid', []); },
      me: function () { return call('uid', []).then(function (id) { return { id: id }; }); },
      can: function (n) { return call('can', [String(n)]); },
      profiles: function (ids) { return call('profiles', [JSON.stringify(ids || [])]); },
      isOwner: function () { return false; },
      canEdit: function () { return false; }
    };
    return {
      use: function (name) {
        if (!cache[name]) {
          cache[name] = call('ready', [String(name)]).then(function (ok) {
            if (!ok) return null;
            return name === 'db' ? db : name === 'user' ? user : null;
          }, function () { return null; });
        }
        return cache[name];
      }
    };
  }
})();
</script>

:root { --sat: env(safe-area-inset-top, 0px); --sar: env(safe-area-inset-right, 0px); --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px); color-scheme: light; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: #eceef3; overflow: hidden; }
body { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; font-family: 'Rubik', system-ui, sans-serif; }
#cv { position: fixed; inset: 0; display: block; touch-action: none; outline: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
<style>
#cv { z-index: 1; }
#jrvid { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #1b1f2b; z-index: 0; }
#jrvid[hidden] { display: none; }
#jrnet { position: fixed; inset: 0; z-index: 6; display: none; align-items: center; justify-content: center; padding: calc(var(--sat) + 10px) calc(var(--sar) + 10px) calc(var(--sab) + 10px) calc(var(--sal) + 10px); font-family: 'Rubik', system-ui, sans-serif; color: #1f2430; }
#jrnet.on { display: flex; }
.jrdim { position: absolute; inset: 0; background: rgba(236, 238, 243, 0.72); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
.jrcard { position: relative; width: min(560px, 100%); max-height: 100%; overflow: auto; touch-action: pan-y; overscroll-behavior: contain; background: #fff; border: 2.6px solid #1f2430; border-radius: 18px; box-shadow: 0 6px 0 #c6ccd6, 0 18px 40px rgba(20, 26, 40, 0.18); padding: 14px 18px 18px; user-select: text; -webkit-user-select: text; }
.jrcard.wide { width: min(980px, 100%); }
.jrhead { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.jrhead h2 { margin: 0; font-size: 22px; font-weight: 700; flex: 1; }
.jrst { font-size: 12.5px; color: #5d6574; font-weight: 500; white-space: nowrap; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; background: #9aa1ad; vertical-align: 0; }
.dot.on { background: #2fb36e; box-shadow: 0 0 0 3px rgba(47, 179, 110, 0.18); }
.dot.wait { background: #efc140; }
.dot.busy { background: #f5914a; }
.dot.party { background: #3d7bf0; box-shadow: 0 0 0 3px rgba(61, 123, 240, 0.2); }
.jrbtn { font: 700 15px 'Rubik', system-ui, sans-serif; color: #1f2430; background: #fff; border: 2.4px solid #1f2430; border-radius: 12px; padding: 9px 16px; box-shadow: 0 4px 0 #c6ccd6; cursor: pointer; transition: transform 0.06s; white-space: nowrap; touch-action: manipulation; }
.jrbtn:active { transform: translateY(3px); box-shadow: 0 1px 0 #c6ccd6; }
.jrbtn.sm { font-size: 13px; padding: 6px 11px; border-radius: 10px; box-shadow: 0 3px 0 #c6ccd6; }
.jrbtn.big { font-size: 17px; padding: 12px 22px; }
.jrbtn.primary { background: #3d7bf0; color: #fff; box-shadow: 0 4px 0 #26509f; }
.jrbtn.go { background: #2fb36e; color: #fff; box-shadow: 0 4px 0 #1d7547; }
.jrbtn.danger { color: #e5484d; }
.jrbtn.ghost { border-color: #c6ccd6; box-shadow: none; color: #5d6574; }
.jrbtn:disabled { background: #e3e6ec; color: #a3a9b4; box-shadow: 0 4px 0 #c6ccd6; cursor: default; transform: none; }
.jrbtns { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; margin-top: 14px; }
.jrbtns.col { flex-direction: column; align-items: stretch; }
.jrhero { display: flex; gap: 14px; align-items: center; background: #f3f4f7; border-radius: 14px; padding: 10px 14px; }
.jrhero p { margin: 4px 0; }
.jrsmall { font-size: 12.5px; color: #5d6574; margin: 6px 0; line-height: 1.35; }
.jrsmall.center, .center { text-align: center; }
.jrerr { color: #e5484d; font-size: 13px; font-weight: 700; margin: 6px 0; }
.jrlbl { display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #9aa1ad; margin: 14px 0 6px; }
.jrrow { display: flex; gap: 8px; }
.jrrow input { flex: 1; min-width: 0; font: 700 17px 'Rubik', system-ui, sans-serif; color: #1f2430; padding: 9px 12px; border: 2.4px solid #1f2430; border-radius: 12px; background: #fff; outline: none; text-transform: none; }
#jrAdd { text-transform: uppercase; letter-spacing: 0.12em; }
.jrrow input:focus { border-color: #3d7bf0; box-shadow: 0 0 0 3px rgba(61, 123, 240, 0.2); }
.jrme { display: flex; align-items: center; gap: 12px; background: #f3f4f7; border-radius: 14px; padding: 8px 12px; }
.jrme small, .jrcode small { display: block; font-size: 11px; color: #9aa1ad; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
.jrme b { font-size: 17px; }
.jrcode { margin-left: auto; text-align: right; }
.jrcode b { font-size: 22px; letter-spacing: 0.14em; color: #3d7bf0; }
.jrlist { max-height: 46vh; overflow: auto; touch-action: pan-y; }
.jrf { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 12px; }
.jrf:nth-child(even) { background: #f7f8fa; }
.jrf.req { background: rgba(47, 179, 110, 0.1); }
.jrf.out { opacity: 0.75; }
.jrft { flex: 1; min-width: 0; }
.jrft b { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.jrft small { display: block; font-size: 12px; color: #5d6574; }
.jrfb { display: flex; gap: 6px; flex: 0 0 auto; }
.jrempty { color: #9aa1ad; font-size: 13.5px; text-align: center; margin: 10px 0; }
.jrslots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.jrslot { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 8px; border: 2.4px solid #1f2430; border-radius: 14px; background: #fff; box-shadow: 0 4px 0 #c6ccd6; min-width: 0; position: relative; }
.jrslot::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 5px; border-radius: 12px 12px 0 0; background: var(--c); }
.jrslot.mine { box-shadow: 0 4px 0 #c6ccd6, 0 0 0 3px var(--c); }
.jrslot.empty { border-style: dashed; border-color: #c6ccd6; box-shadow: none; justify-content: center; color: #9aa1ad; font-weight: 700; min-height: 220px; gap: 8px; }
.jrslot b { font-size: 15px; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.jrslot b i { font-style: normal; font-size: 11px; color: #fff; background: #3d7bf0; border-radius: 6px; padding: 1px 5px; vertical-align: 2px; }
.jrslot small { font-size: 12px; color: #9aa1ad; font-weight: 700; }
.jrslot small.ok { color: #2f9e68; }
.jrteam { font-style: normal; font-size: 10.5px; font-weight: 700; padding: 1px 7px; border-radius: 6px; color: #fff; }
.jrteam.t0 { background: #4a82ee; } .jrteam.t1 { background: #ef5b5b; }
.jrload { display: flex; flex-direction: column; gap: 4px; width: 100%; margin: 4px 0; }
.jrab { display: flex; align-items: center; gap: 6px; padding: 3px 6px; border-radius: 9px; border: 1.6px solid #e2e5eb; background: #f7f8fa; font: 700 12.5px 'Rubik', system-ui, sans-serif; color: #1f2430; text-align: left; cursor: pointer; min-width: 0; }
.jrab span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.jrab:disabled { cursor: default; color: #5d6574; }
.jrab:not(:disabled):hover { border-color: #3d7bf0; }
.jrset { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }
.jrset b { color: #3d7bf0; margin-left: 4px; }
.jrsub { position: absolute; inset: 0; background: rgba(255, 255, 255, 0.86); display: flex; align-items: center; justify-content: center; padding: 10px; border-radius: 16px; }
.jrsubc { width: min(560px, 100%); max-height: 100%; overflow: auto; background: #fff; border: 2.4px solid #1f2430; border-radius: 16px; padding: 12px 14px; box-shadow: 0 5px 0 #c6ccd6; }
.jrsubc h3 { margin: 2px 0 10px; font-size: 18px; }
.jrgrid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.jrgi { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; border-radius: 10px; border: 1.6px solid #e2e5eb; background: #fff; font: 700 10.5px 'Rubik', system-ui, sans-serif; color: #1f2430; cursor: pointer; min-width: 0; }
.jrgi span { max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.jrgi.on { border-color: #3d7bf0; background: rgba(61, 123, 240, 0.1); }
.jrgi.used { opacity: 0.5; }
.jrcols { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.jrcol { width: 40px; height: 40px; border-radius: 50%; border: 2.4px solid #1f2430; background: var(--c); cursor: pointer; }
.jrcol.on { box-shadow: 0 0 0 3px #fff, 0 0 0 6px var(--c); }
.jrcol:disabled { opacity: 0.25; cursor: default; }
.jrhats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 12px; }
.jrhat { display: flex; flex-direction: column; align-items: center; padding: 4px; border-radius: 10px; border: 1.6px solid #e2e5eb; background: #fff; font: 700 11px 'Rubik', system-ui, sans-serif; color: #1f2430; cursor: pointer; }
.jrhat.on { border-color: #3d7bf0; background: rgba(61, 123, 240, 0.1); }
#jrhud { position: fixed; inset: 0; z-index: 5; pointer-events: none; font-family: 'Rubik', system-ui, sans-serif; }
#jrhud > * { pointer-events: auto; }
#jrWait { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; color: #fff; background: rgba(20, 24, 34, 0.8); padding: 16px 22px; border-radius: 16px; }
#jrWait b { display: block; font-size: 17px; } #jrWait span { font-size: 13px; opacity: 0.8; }
#jrWait[hidden], #jrTap[hidden], #jrBar[hidden], #jrSwap[hidden] { display: none; }
#jrTap { position: absolute; left: calc(var(--sal) + 12px); top: calc(var(--sat) + 60px); font-size: 13px; padding: 7px 12px; }
#jrBar { position: absolute; left: 50%; bottom: calc(var(--sab) + 16px); transform: translateX(-50%); background: rgba(20, 24, 34, 0.82); color: #fff; font-size: 14px; font-weight: 700; padding: 8px 16px; border-radius: 999px; white-space: nowrap; pointer-events: none; }
.jrmini { display: none; position: absolute; top: calc(var(--sat) + 10px); right: calc(var(--sar) + 10px); width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(20, 24, 34, 0.45); color: #fff; font: 700 22px/1 'Rubik', system-ui, sans-serif; cursor: pointer; }
body.jr-view .jrmini { display: block; }
#jrSwap { position: absolute; right: calc(var(--sar) + 12px); top: 50%; transform: translateY(-50%); width: min(320px, 46vw); background: #fff; border: 2.4px solid #1f2430; border-radius: 16px; padding: 10px; box-shadow: 0 5px 0 #c6ccd6, 0 14px 30px rgba(0, 0, 0, 0.3); }
#jrSwap h3 { margin: 0 0 8px; font-size: 16px; }
.jrsw { display: flex; align-items: center; gap: 10px; width: 100%; padding: 6px 8px; margin-bottom: 6px; border-radius: 12px; border: 2px solid #e2e5eb; background: #f7f8fa; font: 700 14px 'Rubik', system-ui, sans-serif; color: #1f2430; text-align: left; cursor: pointer; }
.jrsw small { display: block; font-size: 11.5px; color: #5d6574; font-weight: 500; }
.jrsw.keep { justify-content: center; margin-bottom: 0; }
.jrsw:active { border-color: #3d7bf0; }
#jrToasts { position: fixed; z-index: 8; font-family: 'Rubik', system-ui, sans-serif; color: #1f2430; left: 50%; top: calc(var(--sat) + 10px); transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; width: min(440px, 94vw); pointer-events: none; }
.jrtoast { pointer-events: auto; display: flex; align-items: center; gap: 10px; background: #fff; border: 2.4px solid #1f2430; border-radius: 14px; padding: 8px 12px; box-shadow: 0 4px 0 #c6ccd6, 0 12px 26px rgba(20, 26, 40, 0.2); animation: jrIn 0.25s ease-out; }
.jrtoast > div:first-child { flex: 1; min-width: 0; }
.jrtoast b { display: block; font-size: 14px; } .jrtoast span { display: block; font-size: 12.5px; color: #5d6574; }
.jrtb { display: flex; gap: 6px; }
@keyframes jrIn { from { transform: translateY(-12px); opacity: 0; } }
@media (max-width: 760px) {
  .jrslots { grid-template-columns: repeat(2, 1fr); }
  .jrgrid { grid-template-columns: repeat(5, 1fr); }
}
@media (max-height: 520px) and (orientation: landscape) {
  .jrcard { padding: 8px 12px 10px; }
  .jrhead { margin-bottom: 6px; } .jrhead h2 { font-size: 18px; }
  .jrlbl { margin: 8px 0 4px; }
  .jrme { padding: 4px 10px; } .jrcode b { font-size: 18px; }
  .jrslot canvas.jrj { width: 40px !important; height: 40px !important; }
  .jrslot b { font-size: 13px; }
  .jrab { padding: 2px 5px; font-size: 11.5px; }
  .jrab canvas { width: 22px !important; height: 22px !important; }
  .jrbtn.big { font-size: 15px; padding: 9px 16px; }
  .jrhero canvas { width: 56px !important; height: 56px !important; }
  .jrslots { grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .jrslot { padding: 6px; }
  .jrslot.empty { min-height: 140px; }
  .jrbtns { margin-top: 8px; }
  .jrlist { max-height: 38vh; }
}
</style>

const SAVE_KEY = 'jellyrumble.v1';
function defaultSave() {
  return {
    v: 1, updated: 0,
    settings: { music: 0.55, sfx: 0.9, shake: true, guide: true, rounds: 3, level: 1, arena: -1, teams: 0 },
    stats: { matches: 0, wins: 0, kos: 0, falls: 0, rounds: 0, played: 0 },
    koBy: {},
    gauntlet: { best: 0, clears: 0 },
    seen: { how: false },
    net: { code: '', nick: '', online: true, friends: [] },
    slots: [
      { color: 5, hat: 'band', abil: ['bow', 'dash', 'grenade'] },
      { color: 0, hat: 'beanie', abil: ['missile', 'teleport', 'platform'] },
      { color: 3, hat: 'leaf', abil: ['hook', 'mine', 'push'] },
      { color: 6, hat: 'none', abil: ['beam', 'blink', 'spike'] },
    ],
  };
}
function mergeSaves(a, b) {
  // keep the newer settings and slots, the bigger of every counter
  const newer = (b.updated || 0) > (a.updated || 0) ? b : a, older = newer === a ? b : a;
  const out = JSON.parse(JSON.stringify(newer));
  for (const k in older.stats) out.stats[k] = Math.max(out.stats[k] || 0, older.stats[k] || 0);
  for (const k in older.koBy) out.koBy[k] = Math.max(out.koBy[k] || 0, older.koBy[k] || 0);
  out.gauntlet.best = Math.max(out.gauntlet.best || 0, older.gauntlet.best || 0);
  out.gauntlet.clears = Math.max(out.gauntlet.clears || 0, older.gauntlet.clears || 0);
  out.seen.how = !!(out.seen.how || older.seen.how);
  const on = out.net || (out.net = { code: '', nick: '', online: true, friends: [] }), oo = older.net || {};
  if (!on.code && oo.code) { on.code = oo.code; on.nick = oo.nick; }
  if (!Array.isArray(on.friends)) on.friends = [];
  const have = new Set(on.friends.map((f) => f.code));
  for (const f of oo.friends || []) if (f && f.code && !have.has(f.code)) on.friends.push(f);

}

function deepFill(t, d) {

}

  },
  sanitize() {

    d.slots.forEach((s, i) => {
      const def = defaultSave().slots[i];
      if (!(s.color >= 0 && s.color < COLORS.length)) s.color = def.color;
      if (HAT_IDX[s.hat] === undefined) s.hat = def.hat;
      if (!Array.isArray(s.abil) || s.abil.length !== 3 || s.abil.some((k) => !AB[k]) || new Set(s.abil).size !== 3) s.abil = def.abil.slice();

    d.settings.level = clamp(d.settings.level | 0, 0, 2);

  async cloudInit() {

      const [db, user] = await Promise.all([cl.use('db'), cl.use('user')]);
      if (!db || !user) return;
      const id = await user.id();

    this.dropAll(o);
    const by = this.credit(o, {});
    const y = this.jamY;
    for (let k = 0; k < 16; k++) this.fx.push({ k: 'drop', x: o.x + rand(-12, 12), y, vx: rand(-200, 200), vy: rand(-560, -200), life: rand(0.6, 1.1), max: 1.1, size: rand(4, 9), c: k % 3 ? this.A.jam[0] : o.col.c, g: 1700 });
    this.ring(o.x, y, 50, this.A.jam[0], 0.45, true);
    this.fx.push({ k: 'sink', x: o.x, y, life: 1.1, max: 1.1, col: o.col, size: o.size });
    this.addShake(6); this.hitstop = Math.max(this.hitstop, 0.05);
    this.snd('splash');
    const promoted = this.promote(o);
    this.events.push({ type: 'ko', victim: o, by, cause: 'jam', partial: o.clone || promoted });
  }
  explode(x, y, R, owner, cause, opts = {}) {
    for (const o of this.jellies) {
      if (!o.alive || o.carriedBy) continue;
      const dx = o.x - x, dy = o.y - y, d = Math.max(0, Math.hypot(dx, dy) - 12 * o.size);
      if (d < R) {
        if (opts.selfSafe && o === owner) continue;
        const r = this.hurt(o, { owner, cause, dx, dy });
        if (r !== 'kill') { const n = norm(dx, dy || -1); o.vx += n.x * 380; o.vy += n.y * 380 - 120; this.impact(o); }
      } else if (d < R * 1.9) {
        const n = norm(dx, dy), f = ((1 - (d - R) / (R * 0.9)) * 640) / o.size;
        o.vx += n.x * f; o.vy += n.y * f - 140; o.onGround = false; this.impact(o, 0.8); this.hitstop = Math.max(this.hitstop, 0.035);
        if (owner && o !== owner) { o.lastHit = owner; o.lastHitT = this.t; }
      }
    }
    for (const p of this.projs) {
      if (p.dead || p === opts.src) continue;
      const dx = p.x - x, dy = p.y - y, d = Math.hypot(dx, dy);
      if (p.k === 'cloud') { if (d < R + p.r * 0.7) this.detonateCloud(p, owner); continue; }
      if (d > R * 1.5) continue;
      const n = norm(dx, dy);
      if (p.k === 'grenade') { p.fuse = Math.min(p.fuse, 0.12); p.vx += n.x * 300; p.vy += n.y * 300; }
      else if (p.k === 'mine') { if (p.state !== 'boom') { p.state = 'boom'; p.trig = 0.08; } }
      else if (p.k === 'missile') { p.fuse = 0.04; }
      else if (p.k === 'coil') { if (d < R * 0.9) { p.dead = true; this.burst(p.x, p.y, 10, '#c8ccd6', 220, 'chunk'); } }
      else if (p.k === 'blink' || p.k === 'engineShot' || p.k === 'smokebomb') { p.dead = true; this.poof(p.x, p.y, '#ffffff'); }
      else if (p.k === 'arrow' && !p.stuck) { p.vx += n.x * 500; p.vy += n.y * 500; }
    }
    for (const p of this.plats) {
      if (p.dead) continue;
      if (p.kind === 'wafer' && circRect(x, y, R * 0.9, p)) this.breakWafer(p, true);
      else if (!p.big && circRect(x, y, R, p)) { const n = norm(p.x + p.w / 2 - x, p.y + p.h / 2 - y); p.vx += n.x * 140; p.vy += n.y * 140; p.damp = 2.5; p.mv = null; }
    }
    const col = opts.color || '#f5914a';
    this.fx.push({ k: 'flash', x, y, life: 0.16, max: 0.16, r: R * 1.1 });
    this.fx.push({ k: 'boom', x, y, life: 0.5, max: 0.5, r: R, c: col });
    this.ring(x, y, R * 1.15, '#ffffff', 0.35, true);
    for (let k = 0; k < 8 + R / 16; k++) { const a = rand(TAU), sp = rand(60, 260) * (R / 84); this.fx.push({ k: 'smoke', x: x + Math.cos(a) * rand(0, R * 0.4), y: y + Math.sin(a) * rand(0, R * 0.4), vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60, life: rand(0.5, 0.9), max: 0.9, size: rand(12, 24) * (R / 84), c: k % 3 ? '#ffffff' : '#e7e3dc', drag: 3 }); }
    for (let k = 0; k < 10; k++) { const a = rand(TAU), sp = rand(300, 700); this.fx.push({ k: 'sprinkle', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 100, life: rand(0.4, 0.8), max: 0.8, c: pick(['#ffffff', '#d9dce3', col, col]), rot: rand(TAU), vr: rand(-14, 14), g: 900, drag: 1.5 }); }
    this.addShake(R / 7); this.snd('boom', R > 90 ? 1 : 0.85);
  }
  breakWafer(p, loud) {
    if (p.dead) return;
    p.dead = true;
    for (let k = 0; k < 14; k++) this.fx.push({ k: 'chunk', x: p.x + rand(p.w), y: p.y + rand(p.h), vx: rand(-200, 200), vy: rand(-300, 0), life: rand(0.4, 0.8), max: 0.8, size: rand(4, 8), c: pick(['#d9dde5', '#b8bfcb', '#ffffff']), rot: rand(TAU), vr: rand(-8, 8), g: 1400 });
    for (const j of this.jellies) if (j.ground === p) { j.ground = null; j.onGround = false; }
    this.snd('crumble', loud ? 0.9 : 0.4);
  }
  bumpJellies() {
    const js = this.jellies;
    for (let a = 0; a < js.length; a++) {
      const A = js[a]; if (!A.alive || A.carriedBy || this.isFrozen(A)) continue;
      for (let b = a + 1; b < js.length; b++) {
        const B = js[b]; if (!B.alive || B.carriedBy || this.isFrozen(B)) continue;
        const dx = B.x - A.x, dy = B.y - A.y, ox = A.hw + B.hw - Math.abs(dx), oy = A.hh + B.hh - Math.abs(dy);
        if (ox <= 0 || oy <= 0) continue;
        const fa = A.form(), fb = B.form();
        // spinning ball runs people over
        if (fa === 'roll' || fb === 'roll') {
          const R = fa === 'roll' ? A : B, O = R === A ? B : A;
          if (O.form() !== 'rock' && this.foes(R, O)) { const s = sign(O.x - R.x) || sign(R.vx) || 1; O.vx = s * 1000; O.vy = -520; O.stun = 0.4; O.onGround = false; O.lastHit = R; O.lastHitT = this.t; O.squash(1.4, 0.65); this.impact(O); this.hitstop = Math.max(this.hitstop, 0.05); this.addShake(5, s, -0.5); R.vx *= 0.75; this.snd('thunk'); this.burst(O.x, O.y, 8, '#ffffff', 220, 'dot'); continue; }
        }
        // a falling rock crushes whoever is below
        const top = dy > 0 ? A : B, bot = top === A ? B : A;
        if (top.form() === 'rock' && top.vy > 120 && top.y < bot.y - 6) { this.hurt(bot, { owner: top, cause: 'rock', dx: 0, dy: 1 }); continue; }

        }

        const ma = A.form() === 'rock' ? 0.15 : 1, mb = B.form() === 'rock' ? 0.15 : 1;

        A.vx -= s * 40 * ma; B.vx += s * 40 * mb;
      }
    }
  }

  // ---------------------------------------------------------------- particles
  burst(x, y, n, c, sp, kind) {
    for (let k = 0; k < n; k++) { const a = rand(TAU), v = rand(sp * 0.3, sp); this.fx.push({ k: kind || 'dot', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - sp * 0.2, life: rand(0.25, 0.55), max: 0.55, size: rand(2, 5), c, g: kind === 'shard' || kind === 'chunk' ? 900 : 300, rot: rand(TAU), vr: rand(-10, 10) }); }
  }
  ring(x, y, r, c, life, thick) { this.fx.push({ k: 'ring', x, y, r, c, life, max: life, w: thick ? 6 : 3 }); }
  dust(x, y, n) { for (let k = 0; k < Math.min(n, 5); k++) this.fx.push({ k: 'smoke', x: x + rand(-12, 12), y: y - 3, vx: rand(-130, 130), vy: rand(-50, -10), life: rand(0.2, 0.35), max: 0.35, size: rand(4, 7), c: '#ffffff', drag: 6 }); }
  poof(x, y, c) { for (let k = 0; k < 8; k++) this.fx.push({ k: 'smoke', x, y, vx: rand(-90, 90), vy: rand(-90, 40), life: rand(0.25, 0.45), max: 0.45, size: rand(5, 10), c, drag: 4 }); }
  fizzle(x, s = 1) { for (let k = 0; k < 8 * s; k++) this.fx.push({ k: 'drop', x: x + rand(-6, 6), y: this.jamY, vx: rand(-90, 90), vy: rand(-300, -80), life: 0.5, max: 0.5, size: rand(3, 5), c: this.A.jam[0], g: 1400 }); this.snd('splash', 0.25 * s); }
  warpFx(x1, y1, x2, y2, col) {
    this.ring(x1, y1, 30, col.light, 0.3); this.ring(x2, y2, 30, col.light, 0.3);
    const L = Math.hypot(x2 - x1, y2 - y1);
    for (let k = 0; k < L / 14; k++) { const u = k / (L / 14); this.fx.push({ k: 'star', x: lerp(x1, x2, u) + rand(-5, 5), y: lerp(y1, y2, u) + rand(-5, 5), vx: rand(-20, 20), vy: rand(-20, 20), life: 0.3 + u * 0.2, max: 0.5, size: rand(3, 6), c: pick([col.light, '#ffffff']), rot: rand(TAU), vr: 6 }); }
  }
  splat(o, d) {
    for (let k = 0; k < 15; k++) { const a = Math.atan2(d.y, d.x) + gauss() * 1.4, sp = rand(150, 560); this.fx.push({ k: 'drop', x: o.x, y: o.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 160, life: rand(0.5, 1), max: 1, size: rand(4, 10) * o.size, c: k % 4 ? o.col.c : o.col.light, g: 1500 }); }
    let best = null, by = 1e9;
    for (const p of this.plats) if (!p.dead && o.x > p.x - 8 && o.x < p.x + p.w + 8 && p.y >= o.y - 30 && p.y < by) { by = p.y; best = p; }
    if (best && by - o.y < 260) this.decals.push({ plat: best, ox: clamp(o.x - best.x, 6, best.w - 6), r: rand(16, 24) * o.size, c: o.col.c, seed: randi(1, 1e6) });
    this.ring(o.x, o.y, 44 * o.size, o.col.c, 0.35, true);
  }
  stepFx(dt) {
    for (const f of this.fx) {
      f.life -= dt;
      if (f.k === 'suck') { const u = 1 - f.life / f.max; f.cx = lerp(f.x, f.tx, ease.inOut(u)); f.cy = lerp(f.y, f.ty, ease.inOut(u)); continue; }

        if (f.drag) { const k = Math.exp(-f.drag * dt); f.vx *= k; f.vy *= k; }
        if (f.g) f.vy += f.g * dt;
        f.x += f.vx * dt; f.y += f.vy * dt;
        if (f.vr) f.rot += f.vr * dt;
        if (f.k === 'drop' && f.y > this.jamY + 6) f.life = 0;
      }
    }
    this.fx = this.fx.filter((f) => f.life > 0);
    if (this.fx.length > 1000) this.fx.splice(0, this.fx.length - 1000);
  }
}

const AIMED = new Set(['missile', 'mine', 'tesla', 'drill', 'teleport', 'blink', 'hook', 'engine', 'grow', 'shrink', 'dupe', 'blackhole', 'platform', 'spike', 'smoke', 'gust']);

Object.assign(World.prototype, {
  // ---------------------------------------------------------------- using an ability
  // the button went down: instant abilities fire now, aimed ones start aiming, held ones start drawing/cooking
  useAbility(j, i) {
    const s = j.abil[i], id = s.id;
    if (s.cd > 0 || s.hold || j.aimSlot >= 0) return;
    const st = j.form();
    if (st) {
      if (st === 'rock' && id === 'rock') { this.endRock(j); return; }
      if (st === 'hook' && id === 'hook') { j.state.hook.dead = true; j.state = null; return; }
      return;
    }
    if (j.carry && id !== 'throw') return;
    const inp = j.inp;
    const neutral = inp.aimX === null || inp.aimX === undefined ? Math.hypot(inp.mx, inp.my) < 0.3 : false;
    j.aimDir = { x: j.aim.x, y: j.aim.y }; j.aimTouched = !neutral;
    if (AIMED.has(id)) { j.aimSlot = i; s.aimT = 0; return; }
    this.fireAbility(j, i, neutral);
  },
  steerAim(j, dt) {
    const inp = j.inp;
    if (inp.aimX !== null && inp.aimX !== undefined) { const n = norm(inp.aimX, inp.aimY); if (n.x || n.y) j.aimDir = n; j.aim = j.aimDir; return; }
    const m = Math.hypot(inp.mx, inp.my);
    const s = j.aimSlot >= 0 ? j.abil[j.aimSlot] : j.abil.find((q) => q.hold);
    const early = s && (j.aimSlot >= 0 ? s.aimT || 0 : s.t || 0) < 0.12;
    if (m > 0.3) {
      const tx = inp.mx / m, ty = inp.my / m;
      if (!j.aimTouched || inp.analog || early) j.aimDir = { x: tx, y: ty };
      else {
        const cur = Math.atan2(j.aimDir.y, j.aimDir.x), tgt = Math.atan2(ty, tx);
        let d = tgt - cur; while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU;
        const step = 4.2 * dt, na = Math.abs(d) <= step ? tgt : cur + sign(d) * step;

      j.aimTouched = true;
    }
    j.aim = { x: j.aimDir.x, y: j.aimDir.y };
  },
  teleportDest(j, a) {
    const dist = 210;
    for (let k = 20; k >= 0; k--) {
      const x = j.x + a.x * dist * (k / 20), y = j.y + a.y * dist * (k / 20);
      if (!this.plats.some((p) => !p.thin && !p.dead && overlapBP({ x, y, hw: j.hw, hh: j.hh }, p))) return { x, y };
    }
    return { x: j.x, y: j.y };
  },
  platformRect(j, a, neutral) {
    const horiz = neutral ? !j.onGround : Math.abs(a.y) > 0.62 && !(a.y > 0 && j.onGround);

      case 'magnet': s.hold = true; s.t = 0; used = false; this.snd('magnet'); break;
      case 'throw':
        if (!this.grab(j)) { s.cd = 0.5; return; }

        break;
      case 'missile':
        this.projs.push({ k: 'missile', x: j.x + a.x * 20, y: j.y + a.y * 20, vx: a.x * 320, vy: a.y * 320, dir: { x: a.x, y: a.y }, sp: 320, r: 7, owner: j, t: 0, life: 3, fuse: -1, scale: 1 });

        if (j.onGround && j.ground && (neutral || a.y > 0.5)) { m.state = 'set'; m.plat = j.ground; m.x = j.x; m.y = j.ground.y - (k === 'mine' ? 7 : 2); m.ox = m.x - j.ground.x; m.oy = m.y - j.ground.y; }
        else { m.vx = a.x * 480 + j.vx * 0.3; m.vy = a.y * 480 - 160; m.y -= 6; }

        if (mine.length >= 3) { mine[0].dead = true; this.poof(mine[0].x, mine[0].y, '#c8ccd6'); }

      }
      case 'meteor':
        j.state = { k: 'meteorUp', t: 0.32 }; j.vy = -1050; j.vx *= 0.4; j.invuln = 0.4; j.onGround = false; j.squash(0.7, 1.35); this.snd('rocket');

const FONT = "'Rubik', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif";
const UIC = {
  ink: '#1f2430', sub: '#5d6574', faint: '#9aa1ad', line: '#e2e5eb', surf: '#ffffff', surf2: '#f3f4f7', bg: '#eceef3',

const Gfx = {
  cv: null, ctx: null, dpr: 1, cw: 1, ch: 1, s: 1, ox: 0, oy: 0, bg: null, bgKey: '',

  },
  resize() {

  world(ctx) { ctx.setTransform(this.dpr * this.s, 0, 0, this.dpr * this.s, this.dpr * this.ox, this.dpr * this.oy); },
  screen(ctx) { ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0); },

  px(v) { return v * this.s * this.dpr; }, // logical length in device pixels (for shadows)

// ---------------------------------------------------------------- matches
function startMatch(parts, opts) {
  App.match = {
    mode: opts.mode, parts, rounds: opts.rounds, arenaSel: opts.arena, round: 0, world: null, phase: 'round', t: 0,
    lastArena: -1, swap: null, gauntlet: opts.gauntlet || null, acc: 0, sudden: 0, feed: [], teams: !!opts.teams,
  };
  App.paused = false; TouchPad.reset();

}
function newRound() {
  const M = App.match;

  let a = M.arenaSel;
  if (a < 0) { do { a = randi(0, ARENAS.length - 1); } while (a === M.lastArena && ARENAS.length > 1); }
  M.lastArena = a;
  M.world = new World(a, M.parts, { round: M.round, teams: M.teams });
  M.world.jellies.forEach((j) => { if (j.part.cpu >= 0) j.bot = new Bot(j, j.part.cpu); });
  M.phase = 'round'; M.t = 0; M.acc = 0; M.swap = null; M.sudden = 0; M.feed = [];
  Gfx.bgKey = '';
}
function feedHumans(M) {
  for (const j of M.world.jellies) {
    if (j.bot || !j.part.dev || j.clone) continue;
    const d = Input.dev(j.part.dev), inp = j.inp;
    if (!d) continue;
    inp.mx = d.mx; inp.my = d.my; inp.jump = d.jump; inp.aimX = null; inp.aimY = null; inp.analog = d.kind !== 'kb';
    inp.jumpP = inp.jumpP || d.jumpP; inp.downP = inp.downP || d.downP;
    for (let i = 0; i < 3; i++) { inp.a[i] = d.a[i]; inp.aP[i] = inp.aP[i] || d.aP[i]; inp.aR[i] = inp.aR[i] || d.aR[i]; }
  }
}
function stepWorld(w, dt, isMatch) {
  let scale = 1;

  if (w.hitstop > 0) { w.hitstop -= dt; w.alpha = 1; return; }
  const holder = isMatch ? App.match : App;
  holder.acc = Math.min((holder.acc || 0) + dt * scale, 0.1);
  while (holder.acc >= DT) {
    holder.acc -= DT;
    w.step(DT);
    for (const j of w.jellies) { const inp = j.inp; inp.jumpP = false; inp.downP = false; inp.aP[0] = inp.aP[1] = inp.aP[2] = false; inp.aR[0] = inp.aR[1] = inp.aR[2] = false; }
  }

}
function updateGame(dt) {
  const M = App.match, w = M.world;
  const humans = M.parts.filter((p) => p.cpu < 0);
  for (const p of humans) { const d = Input.dev(p.dev); if (d && d.pauseP) { togglePause(); break; } }
  if (!humans.length && Input.hit('Escape')) togglePause();
  if (App.paused) { updatePause(); return; }
  M.t += dt;
  for (const f of M.feed) f.t += dt;
  M.feed = M.feed.filter((f) => f.t < 4.5);
  if (M.phase === 'round') {
    feedHumans(M);
    for (const j of w.jellies) if (j.bot) j.bot.update(w, dt);
    stepWorld(w, dt, true);
    for (const e of w.events) {
      if (e.type === 'ko') {
        const ab = CAUSE_AB[e.cause] || e.cause;
        if (!e.partial) e.victim.part.falls++;
        if (e.by && e.by.part !== e.victim.part) { e.by.part.kos++; if (AB[ab]) e.by.part.koBy[ab] = (e.by.part.koBy[ab] || 0) + 1; }
        if (e.by && e.by.part.cpu < 0 && !e.by.part.net && e.by.part !== e.victim.part) { Save.data.stats.kos++; if (AB[ab]) Save.data.koBy[ab] = (Save.data.koBy[ab] || 0) + 1; }
        if (e.victim.part.cpu < 0 && !e.victim.part.net && e.cause === 'jam' && !e.partial) Save.data.stats.falls++;
        const sides = new Set(w.alive().map((q) => (M.teams ? 't' + q.team : q.part)));
        if (sides.size <= 1) w.slowmo = 0.85;
        M.feed.unshift({ by: e.by ? e.by.part : null, victim: e.victim.part, cause: e.cause, t: 0 });
        if (M.feed.length > 4) M.feed.length = 4;
      } else if (e.type === 'sudden') M.sudden = 2.6;

    w.events.length = 0;
    M.sudden -= dt;
    if (w.phase === 'over') {

      const win = w.winner ? w.winner.part : null;
      if (win) { for (const p of M.parts) if (p === win || (M.teams && p.team === win.team)) p.score++; Sound.play('roundWin'); } else Sound.play('back');
      M.roundWinner = win;
      Save.data.stats.rounds++;
      checkUnlocks();
    }
  } else if (M.phase === 'roundEnd') {
    stepWorld(w, dt, true);
    w.events.length = 0;
    if (M.t > 2.4) {
      const champ = M.parts.find((p) => p.score >= M.rounds);
      if (champ) endMatch(champ);
      else openSwap();
    }
  } else if (M.phase === 'swap') {
    stepWorld(w, dt * 0.25, true); w.events.length = 0;
    updateSwap(dt);
  } else if (M.phase === 'results') {
    updateResults(dt);
  }
}

// ---------- the ability swap between rounds
function openSwap() {
  const M = App.match;
  const panels = M.parts.map((p) => {
    const lost = p !== M.roundWinner && !(M.mode === 'gauntlet' && p.cpu >= 0);
    if (!lost) return { part: p, done: true, skip: true };
    const pool = shuffle(AB_IDS.filter((k) => !p.abil.includes(k) && k !== 'random' && (M.teams || k !== 'revive')));
    return { part: p, offers: pool.slice(0, 3), focus: 3, done: false, cpuT: rand(0.8, 2.2) };
  });
  if (panels.every((s) => s.done)) { newRound(); return; }
  M.swap = { panels, t: 10 };
  M.phase = 'swap'; M.t = 0;
}
function chooseSwap(sp, i) {
  if (sp.done) return;
  sp.done = true; sp.choice = i;
  if (i < 3) { sp.part.abil[i] = sp.offers[i]; Sound.play('ok'); } else Sound.play('blip');
}
function updateSwap(dt) {
  const M = App.match, S = M.swap;
  S.t -= dt;

    if (sp.done) continue;
    const p = sp.part;
    if (p.cpu >= 0) {
      sp.cpuT -= dt;
      if (sp.cpuT <= 0) {
        let best = 3;
        if (Math.random() < 0.65) {
          const hasAtk = (a) => a.some((k) => AB[k].kind === 'attack');
          for (let i = 0; i < 3; i++) { const trial = p.abil.slice(); trial[i] = sp.offers[i]; if (hasAtk(trial)) { best = i; if (Math.random() < 0.5) break; } }
        }
        chooseSwap(sp, best);
      }
      continue;
    }
    if (p.net && Net.picks[p.net] !== undefined) { const k = Net.picks[p.net]; delete Net.picks[p.net]; chooseSwap(sp, k); continue; }
    const d = p.dev && p.dev !== 'touch' ? Input.dev(p.dev) : null;
    if (d) {
      if (d.nav.u) { sp.focus = (sp.focus + 3) % 4; Sound.play('blip'); }
      if (d.nav.d) { sp.focus = (sp.focus + 1) % 4; Sound.play('blip'); }
      if (d.okP || (d.jumpP && d.kind === 'pad')) chooseSwap(sp, sp.focus);
    }
  }
  if (S.panels.every((s) => s.done) || S.t <= 0) {

}

function gesture() {
  Sound.init();

}
const _musicPlay = Music.play.bind(Music);
Music.play = function (name) { this.want = name; _musicPlay(name); };

function touchControlsLive() {
  if (App.screen === 'remote') return Net.touch();
  const M = App.match;
  return App.screen === 'game' && M && !App.paused && M.phase === 'round' && M.parts.some((p) => p.dev === 'touch');
}

  return !App.rotateOk && Gfx.ch > Gfx.cw * 1.05 && (Input.lastKind === 'touch' || (window.matchMedia && matchMedia('(pointer: coarse)').matches));
}
function setupPointer() {
  const cv = Gfx.cv, P = Input.ptr;
  const pos = (e) => { const l = Gfx.toLogical(e.clientX, e.clientY); P.x = l.x; P.y = l.y; P.sx = e.clientX; P.sy = e.clientY; };
  cv.addEventListener('pointerdown', (e) => {
    gesture();
    P.kind = e.pointerType || 'mouse';
    Input.lastKind = P.kind === 'touch' ? 'touch' : 'ptr';
    if (P.kind === 'touch') TouchPad.used = true;
    pos(e);
    if (rotateHint()) return;
    if (P.kind === 'touch' && touchControlsLive()) { TouchPad.start(e.pointerId, e.clientX, e.clientY); e.preventDefault(); return; }
    P.down = true; P.pressed = true; P.id = e.pointerId;
    const b = UI.hitAt(P.x, P.y); UI.downBtn = b ? b.id : null;
    try { cv.setPointerCapture(e.pointerId); } catch (x) { /* ignore */ }
    e.preventDefault();
  }, { passive: false });
  cv.addEventListener('pointermove', (e) => {
    if (e.pointerType === 'touch' && touchControlsLive()) { TouchPad.move(e.pointerId, e.clientX, e.clientY); return; }
    pos(e); P.moved = true;
    if (e.pointerType !== 'touch') { Input.lastKind = 'ptr'; const b = UI.hitAt(P.x, P.y); UI.hover = b ? b.id : null; if (b && b.focusable) { const f = UI.focusables(); const i = f.indexOf(b); if (i >= 0) UI.focus = i; } }
  });
  const up = (e) => {
    TouchPad.end(e.pointerId);
    if (rotateHint()) { App.rotateOk = true; return; }
    if (P.id !== e.pointerId) return;
    pos(e); P.down = false; P.released = true;
    const b = UI.hitAt(P.x, P.y);
    if (b && UI.downBtn === b.id && b.act) { Sound.play('ok'); b.act(e); }
    UI.downBtn = null;
    if (e.pointerType === 'touch') UI.hover = null;
  };
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', (e) => { TouchPad.end(e.pointerId); P.down = false; UI.downBtn = null; });
  cv.addEventListener('contextmenu', (e) => e.preventDefault());
  window.addEventListener('keydown', () => gesture());
}

let last = 0;
function frame(now) {
  const dt = last ? Math.min(0.05, Math.max(0, (now - last) / 1000)) : 1 / 60;
  last = now; App.t += dt;
  Input.poll(dt);
  if (Input.devs.some((d) => d.kind === 'pad' && (d.jumpP || d.okP))) gesture();
  try {
    if (!rotateHint()) update(dt);
    draw();
  } catch (err) { console.error(err); }
  Input.endFrame();
  requestAnimationFrame(frame);
}
function update(dt) {
  for (const tt of App.toasts) tt.t += dt;
  App.toasts = App.toasts.filter((tt) => tt.t < 3.6);
  App.fade = Math.max(0, App.fade - dt * 4);
  switch (App.screen) {
    case 'title': updateTitle(dt); break;
    case 'lobby': stepAttract(dt); updateLobby(dt); break;
    case 'game': updateGame(dt); break;
    case 'how': case 'settings': case 'wardrobe': stepAttract(dt); updateSimple(dt); break;
    case 'online': stepAttract(dt); break;
    case 'remote': Net.updateRemote(dt); break;
  }
  Net.onFrame(dt);
}
function draw() {
  const ctx = Gfx.ctx;
  UI.begin();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (App.screen !== 'remote') { ctx.fillStyle = UIC.bg; ctx.fillRect(0, 0, Gfx.cv.width, Gfx.cv.height); }
  switch (App.screen) {
    case 'title': drawTitle(ctx); break;
    case 'lobby': drawLobby(ctx); break;
    case 'game': {
      const M = App.match;
      renderWorld(ctx, M.world, { guides: true, tags: true });
      Gfx.world(ctx);
      if (M.phase === 'round' || M.phase === 'roundEnd') drawHud(ctx);
      if (M.phase === 'swap') drawSwap(ctx);
      if (M.phase === 'results') drawResults(ctx);
      if (App.paused) drawPause(ctx);
      Net.capture();
      if (touchControlsLive()) { const j = M.world.jellies.find((q) => q.part.dev === 'touch'); drawTouch(ctx, j && j.alive ? j : j); }

    case 'how': drawHow(ctx); break;
    case 'settings': drawSettings(ctx); break;

    }).join('');
    list += outs.map((f) => row(f, '<button class="jrbtn sm ghost" data-a="rm" data-c="' + f.code + '">Cancel</button>', 'Request sent · they need to open Jelly Rumble and accept', 'out')).join('');
    if (this.addDraft === undefined) this.addDraft = '';
    if (this.hub) {
      return this.head('Friends') +
        '<div class="jrme">' + this.jellyCanvas(Save.data.slots[0], 46) + '<div><small>You are</small><b>' + escH(me.nick) + '</b></div><div class="jrcode"><small>Your friend code</small><b>' + fmtCode(me.code) + '</b></div></div>' +
        '<div class="jrlist">' + list + '</div>' +
        '<p class="jrsmall">Your friends come from your Pocket Arcade profile. Add friends, chat and accept requests with the <b>👥 Friends</b> button.</p>' +
        (this.state === 'error' && (this.why === 'blocked' || (this.why === 'network' && !this.onSite())) ? '<p class="jrerr">Online play couldn’t connect from this page. Open Pocket Arcade on its website (asafdror2013-cloud.github.io/asafs-arcade) to play online.</p>' : '') +
        '<div class="jrbtns"><button class="jrbtn" data-a="hubfr">👥 Friends & chat</button><button class="jrbtn go big" data-a="host"' + (this.state === 'on' ? '' : ' disabled') + '>Host a party</button></div>';
    }
    return this.head('Friends') +
      '<div class="jrme">' + this.jellyCanvas(Save.data.slots[0], 46) + '<div><small>You are</small><b>' + escH(me.nick) + '</b></div><div class="jrcode"><small>Your friend code</small><b>' + fmtCode(me.code) + '</b></div><button class="jrbtn sm" data-a="copy">' + (this.copied ? 'Copied!' : 'Copy') + '</button></div>' +
      '<div class="jrlist">' + list + '</div>' +
      '<label class="jrlbl" for="jrAdd">Add a friend</label><div class="jrrow"><input id="jrAdd" maxlength="9" autocomplete="off" spellcheck="false" placeholder="ABC-123" value="' + escH(this.addDraft) + '" data-enter="add"><button class="jrbtn primary" data-a="add">Add</button></div>' + (this.err ? '<p class="jrerr">' + this.err + '</p>' : '') +
      (this.state === 'error' && (this.why === 'blocked' || (this.why === 'network' && !this.onSite())) ? '<p class="jrerr">Online play couldn’t connect from this page. Open Pocket Arcade on its website (asafdror2013-cloud.github.io/asafs-arcade) to play online.</p>' : '') +
      '<div class="jrbtns"><button class="jrbtn ghost" data-a="offline">Go offline</button><button class="jrbtn" data-a="profile">Edit profile</button><button class="jrbtn go big" data-a="host"' + (this.state === 'on' ? '' : ' disabled') + '>Host a party</button></div>';
  },
  loadoutHtml(cfg, mine) {
    return '<div class="jrload">' + cfg.abil.map((id, i) => '<button class="jrab" data-a="' + (mine ? 'abslot' : 'none') + '" data-i="' + i + '"' + (mine ? '' : ' disabled') + '>' + this.iconCanvas(id, 30) + '<span>' + escH(AB[id] ? AB[id].name : id) + '</span></button>').join('') + '</div>';
  },
  pageParty() {
    const host = this.role === 'host', P = this.party, s = Save.data.settings;
    const set = host ? s : Object.assign({ rounds: 3, arena: -1, teams: 0 }, P.set);
    const meCode = this.me.code;
    const slots = [];
    for (let i = 0; i < NET_MAX; i++) {
      const x = P.members[i];
      if (!x) {
        slots.push('<div class="jrslot empty"><span>Open slot</span>' + (host ? '<button class="jrbtn sm" data-a="pickinv">Invite friend</button><button class="jrbtn sm ghost" data-a="cpu">Add CPU</button>' : '') + '</div>');
        continue;
      }
      const mine = x.code === meCode, cfg = mine && !host ? P.mine : x.cfg;
      const team = set.teams ? '<em class="jrteam t' + TEAM_SPLITS[set.teams][i] + '">' + TEAM_NAMES[TEAM_SPLITS[set.teams][i]] + '</em>' : '';
      slots.push('<div class="jrslot' + (mine ? ' mine' : '') + '" style="--c:' + COLORS[cfg.color].c + '">' + this.jellyCanvas(cfg, 58, x.ready ? 'win' : '') +
        '<b>' + escH(x.cpu >= 0 && x.cpu !== undefined && !x.host && x.code.startsWith('CPU') ? 'CPU · ' + LEVELS[x.cpu].name : x.nick) + (mine ? ' <i>you</i>' : '') + '</b>' + team +
        '<small class="' + (x.ready ? 'ok' : '') + '">' + (x.host ? 'Host' : x.ready ? 'Ready' : 'Choosing…') + '</small>' + this.loadoutHtml(cfg, mine) +
        (mine ? '<button class="jrbtn sm" data-a="look">Colour & hat</button>' : host && !x.host ? '<button class="jrbtn sm ghost" data-a="kick" data-c="' + x.code + '">Remove</button>' : '') + '</div>');
    }
    const arenaName = set.arena < 0 ? 'Mixed' : ARENAS[set.arena] ? ARENAS[set.arena].name : 'Mixed';
    const settings = host
      ? '<div class="jrset"><button class="jrbtn sm" data-a="rounds">First to <b>' + s.rounds + '</b></button><button class="jrbtn sm" data-a="arena">Arena <b>' + arenaName + '</b></button><button class="jrbtn sm" data-a="teams">Teams <b>' + TEAM_LABELS[s.teams] + '</b></button></div>'
      : '<p class="jrsmall center">First to ' + set.rounds + ' · ' + arenaName + ' · Teams ' + (TEAM_LABELS[set.teams] || 'Off') + '</p>';
    const why = host ? this.canStart() : '';
    const btns = host
      ? '<button class="jrbtn danger" data-a="leave">Close party</button><button class="jrbtn go big" data-a="start"' + (why ? ' disabled' : '') + '>Start match</button>'
      : '<button class="jrbtn danger" data-a="leave">Leave party</button><button class="jrbtn ' + (P.ready ? '' : 'go') + ' big" data-a="ready">' + (P.ready ? 'Not ready' : 'I’m ready') + '</button>';
    return this.head(host ? 'Your party' : 'Party', 'pback') +
      '<div class="jrslots">' + slots.join('') + '</div>' + settings +
      (why ? '<p class="jrsmall center">' + why + '</p>' : !host ? '<p class="jrsmall center">' + (P.ready ? 'Waiting for the host to start…' : 'Pick your abilities, then press I’m ready.') + '</p>' : '') +
      '<div class="jrbtns">' + btns + '</div>';
  },
  subHtml() {
    const S = this.sub;
    if (S.kind === 'abil') {
      const cfg = this.editCfg(), cur = cfg.abil[S.i];
      return '<div class="jrsub"><div class="jrsubc"><h3>Choose ability ' + (S.i + 1) + '</h3><div class="jrgrid">' + AB_ORDER.map((id) => '<button class="jrgi' + (id === cur ? ' on' : '') + (cfg.abil.includes(id) && id !== cur ? ' used' : '') + '" data-a="setab" data-v="' + id + '" title="' + escH(AB[id].desc || '') + '">' + this.iconCanvas(id, 34) + '<span>' + escH(AB[id].name) + '</span></button>').join('') + '</div><p class="jrsmall">' + escH(AB[S.focus || cur] ? AB[S.focus || cur].desc || '' : '') + '</p><div class="jrbtns"><button class="jrbtn" data-a="subx">Done</button></div></div></div>';
    }
    if (S.kind === 'look') {
      const cfg = this.editCfg(), used = this.party ? this.party.members.filter((x) => x.code !== this.me.code).map((x) => x.cfg.color) : [];
      return '<div class="jrsub"><div class="jrsubc"><h3>Colour & hat</h3><div class="jrcols">' + COLORS.map((c, k) => '<button class="jrcol' + (cfg.color === k ? ' on' : '') + '" data-a="setcol" data-v="' + k + '" style="--c:' + c.c + '"' + (used.includes(k) ? ' disabled' : '') + ' aria-label="' + c.name + '"></button>').join('') + '</div><div class="jrhats">' + openHats().map((hid) => '<button class="jrhat' + (cfg.hat === hid ? ' on' : '') + '" data-a="sethat" data-v="' + hid + '">' + this.jellyCanvas({ color: cfg.color, hat: hid }, 40) + '<span>' + escH(HATS[HAT_IDX[hid]].name) + '</span></button>').join('') + '</div><div class="jrbtns"><button class="jrbtn" data-a="subx">Done</button></div></div></div>';
    }
    if (S.kind === 'inv') {
      const fr = this.friends().filter((f) => (this.online(f.code) || this.hubOn(f.code)) && !this.member(f.code));
      return '<div class="jrsub"><div class="jrsubc"><h3>Invite a friend</h3>' + (fr.length ? fr.map((f) => '<div class="jrf">' + this.jellyCanvas(f, 40) + '<div class="jrft"><b>' + escH(f.nick) + '</b><small>' + (!this.status[f.code] ? 'In the arcade' : this.status[f.code].busy === 'menu' ? 'Online' : 'Busy') + '</small></div><div class="jrfb"><button class="jrbtn sm primary" data-a="' + (this.online(f.code) ? 'inv' : 'hinv') + '" data-c="' + f.code + '">Invite</button></div></div>').join('') : '<p class="jrempty">None of your friends are online right now. They need to open Jelly Rumble.</p>') + '<div class="jrbtns"><button class="jrbtn" data-a="subx">Close</button></div></div></div>';
    }
    if (S.kind === 'menu') {
      return '<div class="jrsub"><div class="jrsubc"><h3>Menu</h3><div class="jrbtns col"><button class="jrbtn primary big" data-a="subx">Keep playing</button><button class="jrbtn danger" data-a="leave">Leave the party</button></div></div></div>';
    }
    return '';
  },
  editCfg() { return this.role === 'guest' ? this.party.mine : this.role === 'host' ? this.party.members[0].cfg : Save.data.slots[0]; },
  cfgChanged() {
    const cfg = this.editCfg();
    if (this.role === 'host') { Save.data.slots[0] = JSON.parse(JSON.stringify(cfg)); Save.persist(); this.broadcast(); this.sayHello(); }
    else if (this.role === 'guest') { Save.data.slots[0] = JSON.parse(JSON.stringify(cfg)); Save.persist(); this.sendCfg(); }
  },
  showMenu() { if (!this.view) return; this.sub = { kind: 'menu' }; this.open = true; this.root.classList.add('on'); this.page = 'menu'; this.card.innerHTML = this.subHtml(); },
  click(e) {
    const b = e.target.closest('[data-a]');
    if (!b || b.disabled) return;
    this.act(b.dataset.a, b, e);
  },
  act(a, b) {
    const S = Save.data.settings;
    this.err = '';
    Sound.init();
    switch (a) {
      case 'bg': if (this.sub && this.page !== 'menu') { this.sub = null; this.render(); } break;
      case 'close': this.hide(); Sound.play('back'); break;
      case 'pback': this.show('friends'); Sound.play('back'); break;
      case 'dice': this.nickDraft = suggestNick(); this.render(); Sound.play('tick'); break;
      case 'create': {
        const n = cleanNick(this.nickDraft);
        if (!nickOk(n)) { this.err = 'Please pick a different nickname (2–14 letters or numbers).'; this.render(); Sound.play('back'); return; }
        this.me.nick = n; if (!this.me.code) this.me.code = netCode(); this.me.online = true; Save.persist();
        Sound.play('ok');
        if (this.peer) { this.sayHello(); this.show('friends'); } else { this.start(); this.show('friends'); }
        break;
      }
      case 'profile': this.nickDraft = this.me.nick; this.show('setup'); break;
      case 'offline': this.goOffline(); Sound.play('back'); break;
      case 'copy': {
        const t = fmtCode(this.me.code);
        try { navigator.clipboard.writeText(t).catch(() => {}); } catch (x) { /* shown on screen anyway */ }
        this.copied = true; this.render(); setTimeout(() => { this.copied = false; this.refresh(); }, 1600); Sound.play('ok');
        break;
      }
      case 'add': { const r = this.addFriend(this.addDraft); this.err = r; if (!r) { this.addDraft = ''; Sound.play('ok'); this.toast('Request sent', 'Your friend needs to open Jelly Rumble and accept.'); } else Sound.play('back'); this.render(); break; }
      case 'acc': this.accept(b.dataset.c); Sound.play('ok'); break;
      case 'dec': this.decline(b.dataset.c); Sound.play('back'); break;
      case 'rm': this.removeFriend(b.dataset.c); Sound.play('back'); break;
      case 'inv': this.invite(b.dataset.c); this.sub = null; Sound.play('ok'); this.refresh(); break;
      case 'hinv': { const H = this.hubApi(); if (this.role !== 'host') this.host(); if (H) H.invite(b.dataset.c, 'jelly-rumble'); this.sub = null; Sound.play('ok'); this.refresh(); break; }
      case 'hubfr': { const H = this.hubApi(); if (H) H.openFriends(); break; }
      case 'join': this.join(b.dataset.c); Sound.play('ok'); break;
      case 'host': this.host(); Sound.play('ok'); break;
      case 'pickinv': this.sub = { kind: 'inv' }; this.render(); break;
      case 'cpu': this.addCpu(); break;
      case 'kick': { const x = this.member(b.dataset.c); if (x && x.code.startsWith('CPU') && x.cpu !== undefined) { this.party.members.splice(this.party.members.indexOf(x), 1); this.broadcast(); this.refresh(); } else this.kick(b.dataset.c); Sound.play('back'); break; }
      case 'rounds': { const o = [2, 3, 5, 7]; S.rounds = o[(o.indexOf(S.rounds) + 1) % 4]; Save.persist(); this.broadcast(); this.render(); Sound.play('tick'); break; }
      case 'arena': S.arena = ((S.arena + 2) % (ARENAS.length + 1)) - 1; Save.persist(); this.broadcast(); this.render(); Sound.play('tick'); break;
      case 'teams': S.teams = (S.teams + 1) % 4; Save.persist(); this.broadcast(); this.render(); Sound.play('tick'); break;
      case 'start': this.startMatch(); break;
      case 'ready': this.party.ready = !this.party.ready; this.sendCfg(); this.render(); Sound.play(this.party.ready ? 'ok' : 'back'); break;
      case 'leave': this.leaveParty(); this.sub = null; this.show('friends'); Sound.play('back'); break;
      case 'abslot': this.sub = { kind: 'abil', i: +b.dataset.i }; this.render(); Sound.play('blip'); break;
      case 'setab': {
        const cfg = this.editCfg(), i = this.sub.i, id = b.dataset.v, other = cfg.abil.indexOf(id);
        if (other >= 0 && other !== i) cfg.abil[other] = cfg.abil[i];
        cfg.abil[i] = id; this.sub = null; this.cfgChanged(); this.render(); Sound.play('ok');
        break;
      }
      case 'look': this.sub = { kind: 'look' }; this.render(); Sound.play('blip'); break;
      case 'setcol': this.editCfg().color = +b.dataset.v; this.cfgChanged(); this.render(); Sound.play('tick'); break;
      case 'sethat': this.editCfg().hat = b.dataset.v; this.cfgChanged(); this.render(); Sound.play('tick'); break;
      case 'subx': this.sub = null; if (this.page === 'menu') { this.open = false; this.root.classList.remove('on'); } else this.render(); Sound.play('blip'); break;
      case 'tap': this.vid.muted = false; this.vid.play().catch(() => {}); this.el('#jrTap').hidden = true; break;
      case 'menu': this.showMenu(); break;
      case 'swp': this.sendTo(this.party.host, { t: 'pick', i: +b.dataset.i }); this.hideSwap(); Sound.play('ok'); break;
      case 'tjoin': { const code = b.dataset.c; this.dismiss(b); if (this.role === 'guest' && this.party && this.party.host === code) break; this.join(code); this.show('friends'); break; }
      case 'tacc': this.accept(b.dataset.c); this.dismiss(b); break;
      case 'tdec': this.decline(b.dataset.c); this.dismiss(b); break;
      case 'tx': this.dismiss(b); break;
    }
  },
  // ability swap between rounds, on the guest's own screen
  showSwap(m) {
    const box = this.el('#jrSwap');
    const offers = (m.offers || []).filter((k) => AB[k]).slice(0, 3), abil = (m.abil || []).filter((k) => AB[k]);
    if (offers.length !== 3 || abil.length !== 3) return;
    box.innerHTML = '<h3>Change an ability?</h3>' + offers.map((id, i) => '<button class="jrsw" data-a="swp" data-i="' + i + '">' + this.iconCanvas(id, 36) + '<span><b>' + escH(AB[id].name) + '</b><small>replaces ' + escH(AB[abil[i]].name) + '</small></span></button>').join('') + '<button class="jrsw keep" data-a="swp" data-i="3"><span><b>Keep my abilities</b></span></button>';
    box.hidden = false;
    for (const c of box.querySelectorAll('canvas.jri')) { const g = c.getContext('2d'); drawIcon(g, c.dataset.ab, c.width / 2, c.height / 2, c.width * 0.9); }
  },
  hideSwap() { const b = this.el('#jrSwap'); if (b) b.hidden = true; },
  // little cards at the top of the screen: invites, requests, news
  toast(title, sub, o) {
    o = o || {};
    const box = this.toastBox;
    const t = document.createElement('div');
    t.className = 'jrtoast';
    let btns = '';
    if (o.inv) btns = '<button class="jrbtn sm go" data-a="tjoin" data-c="' + o.inv + '">Join</button><button class="jrbtn sm" data-a="tx">Not now</button>';
    else if (o.req) btns = '<button class="jrbtn sm go" data-a="tacc" data-c="' + o.req + '">Accept</button><button class="jrbtn sm" data-a="tdec" data-c="' + o.req + '">No thanks</button>';
    t.innerHTML = '<div><b>' + escH(title) + '</b><span>' + escH(sub) + '</span></div>' + (btns ? '<div class="jrtb">' + btns + '</div>' : '');
    box.appendChild(t);
    Sound.play(btns ? 'unlock' : 'blip');
    setTimeout(() => { if (t.parentNode) t.remove(); }, btns ? 20000 : 3800);
  },
  dismiss(b) { const t = b.closest('.jrtoast'); if (t) t.remove(); },
};

Net.rematch = function (M) {
  M.parts.forEach((p) => { p.score = 0; p.kos = 0; p.falls = 0; p.koBy = {}; });
  const hostDev = M.hostDev;
  startMatch(M.parts, { mode: 'versus', rounds: M.rounds, arena: M.arenaSel, teams: M.teams });
  App.match.online = true; App.match.hostDev = hostDev;
  for (const x of this.party.members) if (!x.host && x.cpu === undefined) { this.sendTo(x.code, { t: 'go' }); this.callGuest(x.code); }
};

// hooks for automated checks (only with ?jrtest in the address)
try { if (/[?&]jrtest\b/.test(location.search)) window.__jr = { Net, Dev, App, Save, Input, TouchPad, Gfx, startMatch, mkPart, openLobby, newRound, endMatch, openSwap, World, Bot, ARENAS, renderWorld, drawLogo, Sound, drawJelly, drawProp, locoPose, LOCO_RUN, LOCO_IDLE, COLORS }; } catch (e) { /* ignore */ }
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

})();
</script>
