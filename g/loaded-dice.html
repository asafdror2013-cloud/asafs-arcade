  showOver(info) {
    const run = G.run;
    const most = Object.keys(run.played).reduce((a, h) => (run.played[h] > run.played[a] ? h : a), 'pair');
    const T = info.table;
    const short = T ? Math.max(0, T.target - T.score) : 0;
    const box = this.modal('<div class="mbody"><div class="over-big">Busted</div>' +
      (T ? '<div class="near">Only <b>' + fmtBig(short) + '</b> short of ' + fmtBig(T.target) + ' at ' + (T.boss ? BOSSES[T.boss].name : TABLE_KINDS[T.tidx].name) + '</div>' : '') +
      (run.tals.length ? '<div class="over-build">' + run.tals.map((t, k) => '<div class="cw" data-ob="' + k + '"></div>').join('') + '</div>' : '') +
      '<div class="stats">' +
      '<div class="stat"><b>' + run.ante + '</b><span>Ante reached</span></div>' +
      '<div class="stat"><b>' + fmtBig(run.stats.best) + '</b><span>Best hand' + (run.stats.bestHand ? ' · ' + HAND[run.stats.bestHand].name : '') + '</span></div>' +
      '<div class="stat"><b>' + run.stats.tables + '</b><span>Tables cleared</span></div>' +
      '<div class="stat"><b>' + HAND[most].name + '</b><span>Most played</span></div>' +
      '</div>' + (info.fresh && info.fresh.length ? '<div class="sec-h">Unlocked</div><div>' + info.fresh.map((f) => '<div class="hist"><div><b>' + (f.kind === 'tal' ? TAL[f.id].name : SETS[f.id].name) + '</b><span>' + (f.kind === 'tal' ? 'talisman' : 'dice set') + '</span></div></div>').join('') + '</div>' : '') +
      '<div class="seedline">Seed ' + run.seed + ' · <a href="#" id="bShare" class="share">Copy result</a></div></div><div class="mfoot"><button class="btn dark" id="bMain">Menu</button><button class="btn red" id="bAgain">New run</button></div>');
    box.querySelector('#bShare').onclick = (e) => { e.preventDefault(); Game.copyResult(); };
    run.tals.forEach((t, k) => { const cw = box.querySelector('[data-ob="' + k + '"]'); if (cw) { const c = this.talCard(t); cw.appendChild(c); c.onclick = () => this.tip(c, { title: this.talName(t), desc: this.talDesc(t) }); } });
    box.querySelector('#bAgain').onclick = () => { this.closeModal(); Game.quickRestart(); };
    box.querySelector('#bMain').onclick = () => { this.closeModal(); Game.toTitle(); };
  },

  showWon(info) {
    const run = G.run;
    const box = this.modal('<div class="mbody"><div class="over-big win">You broke the House</div>' +
      '<div class="near">' + SETS[run.set].name + ' · ' + STAKES[run.stake].name + '</div><div class="stats">' +
      '<div class="stat"><b>' + fmtBig(run.stats.best) + '</b><span>Best hand</span></div>' +
      '<div class="stat"><b>' + run.stats.hands + '</b><span>Hands scored</span></div>' +
      '<div class="stat"><b>$' + run.stats.earned + '</b><span>Money earned</span></div>' +
      '<div class="stat"><b>' + run.stats.rerolls + '</b><span>Rerolls</span></div></div>' +
      (info.fresh && info.fresh.length ? '<div class="sec-h">Unlocked</div>' + info.fresh.map((f) => '<div class="hist"><div><b>' + (f.kind === 'tal' ? TAL[f.id].name : f.kind === 'set' ? SETS[f.id].name : STAKES[f.id].name) + '</b><span>' + (f.kind === 'tal' ? 'talisman' : f.kind === 'set' ? 'dice set' : 'stake') + '</span></div></div>').join('') : '') +
      '<div class="seedline"><a href="#" id="bShare" class="share">Copy result</a></div></div><div class="mfoot"><button class="btn dark" id="bNew">New run</button><button class="btn gold" id="bEndless">Keep rolling</button></div>');
    box.querySelector('#bShare').onclick = (e) => { e.preventDefault(); Game.copyResult(); };
    box.querySelector('#bEndless').onclick = () => { this.closeModal(); Game.endless(); };
    box.querySelector('#bNew').onclick = () => { this.closeModal(); Game.finishWon(); };
  },

  // ------------------------------------------------ title & meta screens
  showTitle() {
    const S = Save.data, T = this.els.title;
    const run = S.run && !S.run.over ? S.run : null;
    const daily = S.daily.date === todayKey() ? S.daily : null;
    T.className = '';
    document.body.classList.add('at-title');
    T.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center"><div class="logo"><img alt="Loaded Dice" src="' + ASSET_DATA.logo + '"></div><div class="tag">Hold · Reroll · Break the House</div></div>' +
      '<div id="titleTray"></div>' +
      '<div class="tmenu">' +
      (run ? '<button class="btn gold" id="tCont">Continue <span class="cont-info">· Ante ' + run.ante + ' · $' + run.money + '</span></button><button class="btn red" id="tNew">New run</button>' : '<button class="btn red" id="tNew">Play</button>') +
      '<div class="row"><button class="btn dark" id="tDaily">Daily</button><button class="btn dark" id="tColl">Collection</button><button class="btn dark" id="tStats">Stats</button></div>' +
      '<div class="tmeta">' + (daily ? 'Today\'s Daily Deal: best ante ' + daily.bestAnte + (daily.won ? ' · broke the House' : '') : 'A new Daily Deal every day') +
      (S.streak.n > 1 && S.streak.last && dayDiff(S.streak.last, todayKey()) <= 1 ? ' · <b style="color:var(--gold2)">' + S.streak.n + '-day streak</b>' + (S.streak.last !== todayKey() ? ': play today to keep it' : '') : '') + '</div></div>';
    const cont = T.querySelector('#tCont');
    if (cont) cont.onclick = () => { Sound.ensure(); Game.continueRun(); };
    T.querySelector('#tNew').onclick = () => { Sound.ensure(); if (!S.stats.runs && !run) Game.newRun({ set: 'casino', stake: 0 }); else this.showSetup(); };
    T.querySelector('#tDaily').onclick = () => { Sound.ensure(); this.showDaily(); };
    T.querySelector('#tColl').onclick = () => { Sound.ensure(); this.showCollection(); };
    T.querySelector('#tStats').onclick = () => { Sound.ensure(); this.showStats(); };
  },
  hideTitle() { this.els.title.className = 'hidden'; this.els.title.innerHTML = ''; document.body.classList.remove('at-title'); },

  showSetup() {
    const S = Save.data;
    let set = setOpen(S.lastSet) ? S.lastSet : 'casino';
    let stake = Math.min(S.lastStake || 0, S.stakeWon + 1);
    const render = () => {
      let sets = '';
      for (const id of SET_IDS) {
        const st = SETS[id], open = setOpen(id);
        sets += '<div class="setc' + (id === set ? ' on' : '') + (open ? '' : ' locked') + '" data-set="' + id + '"><div class="sn">' + st.name + '</div><div class="sd">' + (open ? st.desc : '🔒 ' + st.unlock) + '</div></div>';
      }
      let stakes = '';
      STAKES.forEach((s, i) => {
        const open = i <= S.stakeWon + 1;
        stakes += '<button class="stake' + (i === stake ? ' on' : '') + (open ? '' : ' locked') + '" data-stake="' + i + '"><div class="token" style="--tk:' + s.color + '">' + (open ? '' : svgIcon('b_lock')) + '</div></button>';
      });
      const sd = STAKES[stake];
      const box = this.modal('<div class="mbody"><div class="ptitle">New run</div><div class="sets">' + sets + '</div><div class="sec-h" style="text-align:center">Stake</div><div class="stakes">' + stakes + '</div>' +
        '<div class="stake-desc"><b style="color:var(--gold2)">' + sd.name + '</b><br>' + (stake ? 'All previous stakes, plus: ' : '') + sd.desc + '</div></div>' +
        '<div class="mfoot"><button class="btn dark" id="bBack">Back</button><button class="btn red" id="bGo">Roll the dice</button></div>', 'wide', () => this.closeModal());
      box.querySelectorAll('[data-set]').forEach((b) => (b.onclick = () => { if (setOpen(b.dataset.set)) { set = b.dataset.set; Sfx.tick(); render(); } }));
      box.querySelectorAll('[data-stake]').forEach((b) => (b.onclick = () => { const i = +b.dataset.stake; if (i <= S.stakeWon + 1) { stake = i; Sfx.tick(); render(); } }));
      box.querySelector('#bBack').onclick = () => this.closeModal();
      box.querySelector('#bGo').onclick = () => { this.closeModal(); S.lastSet = set; S.lastStake = stake; Game.newRun({ set, stake }); };
    };
    render();
  },

  showDaily() {
    const S = Save.data, k = todayKey();
    const d = S.daily.date === k ? S.daily : null;
    const box = this.modal('<div class="mbody"><div class="ptitle">Daily Deal<small>' + fmtDate(k) + '</small></div>' +
      '<p class="how" style="text-align:center;color:var(--ivory2);font-size:14px;line-height:1.45">Everyone gets the same dice, shops and bosses today. Casino Set, Green Felt. How far can you get?</p>' +
      '<div class="stats"><div class="stat"><b>' + (d ? d.bestAnte : '—') + '</b><span>Your best ante</span></div><div class="stat"><b>' + (d && d.bestHand ? fmtBig(d.bestHand) : '—') + '</b><span>Best hand</span></div></div></div>' +
      '<div class="mfoot"><button class="btn dark" id="bBack">Back</button><button class="btn gold" id="bGo">Deal me in</button></div>', '', () => this.closeModal());
    box.querySelector('#bBack').onclick = () => this.closeModal();
    box.querySelector('#bGo').onclick = () => { this.closeModal(); Game.newRun({ set: 'casino', stake: 0, daily: k, seed: 'DAY' + k.replace(/-/g, '') }); };
  },

  showCollection() {
    const S = Save.data;
    const total = TALISMANS.length;
    let found = 0;
    let grid = '';
    for (const t of TALISMANS) {
      const disc = !!S.discovered[t.id], open = talOpen(t.id);
      if (disc) found++;
      grid += '<div class="slot" data-t="' + t.id + '">' + (disc ? '' : '<div class="unk' + (open ? '' : ' lock') + '">' + (open ? '?' : '🔒') + '</div>') + '</div>';
    }
    let bosses = '';
    for (const b in BOSSES) bosses += '<div class="hist"><div><b>' + BOSSES[b].name + '</b><span>' + BOSSES[b].desc + '</span></div></div>';
    const box = this.modal('<div class="mbody"><div class="ptitle">Collection</div><div class="prog">' + found + ' / ' + total + ' talismans discovered</div><div class="coll" style="margin-top:10px">' + grid + '</div>' +
      '<div class="sec-h">Bosses</div>' + bosses + '</div><div class="mfoot"><button class="btn dark" id="bBack">Close</button></div>', 'wide', () => this.closeModal());
    box.querySelectorAll('[data-t]').forEach((s) => {
      const id = s.dataset.t, t = TAL[id];
      const disc = !!S.discovered[id], open = talOpen(id);
      if (disc) { const c = this.talCard({ id }); s.appendChild(c); }
      s.onclick = () => {
        if (disc) this.tip(s, { title: t.name, sub: RARITY[t.rar].name, rc: RARITY[t.rar].color, desc: hl(t.desc) });
        else if (!open) this.tip(s, { title: 'Locked', desc: 'Unlock: ' + LOCKS[t.lock] });
        else this.tip(s, { title: 'Undiscovered', desc: t.rar === 'L' ? 'A legendary talisman. Only The Soul can summon it.' : 'Find it in the Bazaar or a Talisman Pack.' });
      };
    });
    box.querySelector('#bBack').onclick = () => this.closeModal();
  },

  showStats() {
    const S = Save.data, st = S.stats;
    const hist = S.history.map((h) => '<div><span>' + (h.won ? '<b style="color:var(--gold2)">Won</b>' : 'Ante ' + h.ante) + ' · ' + (SETS[h.set] ? SETS[h.set].name : '') + (h.daily ? ' · daily' : '') + '</span><b>' + fmtBig(h.best || 0) + '</b></div>').join('');
    const box = this.modal('<div class="mbody"><div class="ptitle">Stats</div><div class="stats">' +
      '<div class="stat"><b>' + st.runs + '</b><span>Runs</span></div><div class="stat"><b>' + st.wins + '</b><span>Wins</span></div>' +
      '<div class="stat"><b>' + st.bestAnte + '</b><span>Best ante</span></div><div class="stat"><b>' + fmtBig(st.bestHand) + '</b><span>Best hand' + (S.bestHandType ? ' · ' + HAND[S.bestHandType].name : '') + '</span></div>' +
      '<div class="stat"><b>' + fmtBig(st.hands) + '</b><span>Hands scored</span></div><div class="stat"><b>' + fmtBig(st.rerolls) + '</b><span>Rerolls</span></div>' +
      '<div class="stat"><b>' + st.bosses + '</b><span>Bosses beaten</span></div><div class="stat"><b>$' + fmtBig(st.earned) + '</b><span>Money earned</span></div>' +
      '</div>' + (hist ? '<div class="sec-h">Recent runs</div><div class="hist">' + hist + '</div>' : '') + '</div><div class="mfoot"><button class="btn dark" id="bBack">Close</button></div>', '', () => this.closeModal());
    box.querySelector('#bBack').onclick = () => this.closeModal();
  },

  // ------------------------------------------------ toasts / banners / coach marks
  toast(icon, label, text) {
    const t = el('div', 'toast deco');
    t.innerHTML = '<div class="ti">' + icon + '</div><div class="tx"><b>' + label + '</b><span>' + text + '</span></div>';
    this.els.toasts.appendChild(t);
    setTimeout(() => t.remove(), 4200);
  },
  banner(text, sub, red) {
    const B = this.els.banner;
    B.className = red ? 'red' : '';
    B.innerHTML = '<div class="bn">' + text + (sub ? '<small>' + sub + '</small>' : '') + '</div>';
    clearTimeout(this._bt);
    this._bt = setTimeout(() => { B.className = 'hidden'; }, 1700);
  },
  coach(key, text, anchor, below) {
    if (Save.data.seen[key] || this.modalOpen()) return false;
    Save.data.seen[key] = 1;
    Save.persist();
    const C = this.els.coach;
    C.className = below ? 'up' : 'down';
    C.textContent = text;
    const r = anchor.getBoundingClientRect();
    const w = Math.min(270, window.innerWidth - 20);
    C.style.width = w + 'px';
    const x = clamp(r.left + r.width / 2 - w / 2, 10, window.innerWidth - w - 10);
    C.style.left = x + 'px';
    C.style.setProperty('--ax', r.left + r.width / 2 - x + 'px');
    const h = C.offsetHeight;
    C.style.top = (below ? r.bottom + 12 : r.top - h - 12) + 'px';
    clearTimeout(this._ct);
    this._ct = setTimeout(() => this.hideCoach(), 6500);
    return true;
  },
  hideCoach() { this.els.coach.className = 'hidden'; },
};

// ---------------------------------------------------------------- game.js (controller + animation sequencing)
const G = { run: null, busy: false, speed: 1, shownMoney: 0, trayMsg: '', title: true, titleNext: 0 };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms / (G.speed * (G.ff ? 4 : 1))));
function waitDice() {
  return new Promise((r) => { const chk = () => (GLX.busy() ? setTimeout(chk, 30) : r()); chk(); });
}

const Game = {
  save() {
    if (G.run && !G.run.over) Save.data.run = G.run;
    Save.persist();
  },
  discover(id) { if (id && !Save.data.discovered[id]) Save.data.discovered[id] = 1; },
  discoverRun() {
    const run = G.run;
    if (!run) return;
    for (const t of run.tals) this.discover(t.id);
    if (run.shop) for (const o of run.shop.offers) if (o.type === 'tal') this.discover(o.id);
    if (run.pack) for (const c of run.pack.choices) if (c.type === 'tal') this.discover(c.id);
  },
  announce(fresh) {
    for (const f of fresh || []) {
      if (f.kind === 'tal') { const c = UI.talCard({ id: f.id }); c.style.position = 'absolute'; UI.toast(c.outerHTML, 'Talisman unlocked', TAL[f.id].name); }
      else if (f.kind === 'set') UI.toast(svgIcon('die'), 'Dice set unlocked', SETS[f.id].name);
      Sfx.unlock();
    }
  },

  // ------------------------------------------------ lifecycle
  toTitle() {
    G.title = true;
    G.busy = false;
    UI.hidePanel();
    UI.closeModal();
    UI.hideCoach();
    UI.showTitle();
    GLX.setTheme('night');
    Music.setMode('lounge');
    G.titleDice = SETS.casino.build();
    G.titleDice[1].faces.forEach((f, i) => { if (i % 2) f.m = 'gild'; });
    G.titleDice[2].faces.forEach((f, i) => { if (i % 2 === 0) f.m = 'glass'; });
    G.titleDice[3].faces[5].m = 'lucky';
    G.titleDice[0].faces[5].m = 'mult';
    GLX.setDice(G.titleDice);
    App.layout();
    for (let i = 0; i < 5; i++) { GLX.dice[i].liftT = 0; GLX.dice[i].glowT = 0; GLX.dice[i].dimT = 0; GLX.dice[i].hidden = false; }
    G.titleNext = 0.3;
  },
  titleThrow() {
    for (let i = 0; i < 5; i++) GLX.launch(i, (Math.random() * 6) | 0, 'throw', i * 0.07, { speed: 1.1 });
    Sfx.rattle();
  },
  leaveTitle() {
    G.title = false;
    UI.hideTitle();
    App.layout();
  },

  newRun(opts) {
    const S = Save.data;
    const run = Run.create({ set: opts.set, stake: opts.stake || 0, seed: opts.seed, daily: opts.daily || null, pool: talPool() });
    G.run = run;
    S.run = run;
    S.stats.runs++;
    if (opts.daily) {
      if (S.daily.date !== opts.daily) S.daily = { date: opts.daily, bestAnte: 0, bestHand: 0, won: false, played: 0 };
      S.daily.played++;
      const st = S.streak;
      if (st.last !== opts.daily) {
        st.n = st.last && dayDiff(st.last, opts.daily) === 1 ? st.n + 1 : 1;
        st.last = opts.daily;
        st.best = Math.max(st.best || 0, st.n);
      }
    }
    G.shownMoney = run.money;
    this.discoverRun();
    this.leaveTitle();
    UI.closeModal();
    GLX.setDice(run.dice);
    GLX.dice.forEach((d) => { d.visible = false; d.anim = null; d.liftT = d.lift = 0; d.glowT = d.glow = 0; d.dimT = 0; d.hidden = false; });
    this.save();
    this.enter();
  },
  continueRun() {
    const run = Save.data.run;
    if (!run) return;
    // migrate runs saved by older builds
    run.tags = run.tags || [];
    run.stats = Object.assign({ skips: 0, bought: 0, levels: 0, sold: 0 }, run.stats);
    if (run.table) { run.table.revealed = run.table.revealed || [true, true, true, true, true]; run.table.kept = run.table.kept || [0, 0, 0, 0, 0]; }
    G.run = run;
    G.shownMoney = run.money;
    this.leaveTitle();
    GLX.setDice(run.dice);
    this.enter(true);
  },
  quickRestart() {
    const S = Save.data;
    const r = G.run;
    this.newRun({ set: r ? r.set : S.lastSet, stake: r ? r.stake : S.lastStake });
  },
  abandon() {
    if (!G.run) return;
    G.run.over = true;
    this.recordRun(false);
    Save.data.run = null;
    Save.persist();
    G.run = null;
    this.toTitle();
  },
  endless() { Run.goEndless(G.run); Sfx.button(); this.save(); this.enter(); },
  finishWon() { Save.data.run = null; Save.persist(); this.toTitle(); UI.showSetup(); },

  recordRun(won) {
    const S = Save.data, run = G.run;
    S.history.unshift({ t: Date.now(), id: run.seed + '-' + run.ante + '-' + run.stats.hands, set: run.set, stake: run.stake, ante: run.ante, won: won || run.won, best: run.stats.best, daily: !!run.daily, seed: run.seed });
    S.history = S.history.slice(0, 12);
    if (run.daily && S.daily.date === run.daily) {
      S.daily.bestAnte = Math.max(S.daily.bestAnte, run.ante);
      S.daily.bestHand = Math.max(S.daily.bestHand, run.stats.best);
      if (run.won) S.daily.won = true;
    }
    if (run.endless) S.stats.endlessAnte = Math.max(S.stats.endlessAnte, run.ante);
  },

  shareText() {
    const run = G.run;
    if (!run) return '';
    const lines = ['🎲 Loaded Dice' + (run.daily ? ' · Daily Deal ' + fmtDate(run.daily) : '')];
    lines.push((run.won ? (run.endless ? 'Broke the House, then reached ante ' + run.ante : 'Broke the House!') : 'Busted at ante ' + run.ante) + ' · ' + SETS[run.set].name + ', ' + STAKES[run.stake].name);
    if (run.stats.best) lines.push('Best hand ' + fmtBig(run.stats.best) + (run.stats.bestHand ? ' (' + HAND[run.stats.bestHand].name + ')' : ''));
    if (run.tals.length) lines.push('Talismans: ' + run.tals.map((t) => TAL[t.id].name).join(', '));
    lines.push('Seed ' + run.seed);
    return lines.join('\n');
  },
  async copyResult() {
    const text = this.shareText();
    let ok = false;
    try { if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(text); ok = true; } } catch (e) { ok = false; }
    if (!ok) {
      try {
        const ta = el('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select(); ok = document.execCommand('copy'); ta.remove();
      } catch (e) { ok = false; }
    }
    UI.toast(svgIcon('die'), ok ? 'Copied' : 'Could not copy', ok ? 'Your result is on the clipboard' : 'Your browser blocked the clipboard');
  },

  // ------------------------------------------------ phase router
  enter(resume) {
    const run = G.run;
    UI.hidePanel();
    UI.hideTip();
    const boss = (run.table ? run.table.tidx : run.tidx) === 2;
    GLX.setTheme(run.phase === 'shop' ? 'shop' : boss ? (run.boss === 'house' ? 'house' : 'boss') : 'felt');
    Music.setMode(boss && run.phase !== 'shop' ? 'boss' : 'lounge');
    UI.renderAll();
    switch (run.phase) {
      case 'select':
        UI.showSelect();
        if (run.pack) UI.showPack(run.pack);
        else if (!Save.data.seen.how) { Save.data.seen.how = 1; Save.persist(); setTimeout(() => UI.showHow(() => UI.closeModal(), true), 350); }
        break;
      case 'play': {
        const T = run.table;
        if (!T.thrown) this.throwHand(true);
        else {
          for (let i = 0; i < 5; i++) { GLX.settle(i, T.top[i]); const d = GLX.dice[i]; d.liftT = d.lift = T.held[i] ? 1 : 0; d.glowT = d.glow = T.held[i] ? 1 : 0; }
          this.updateFog();
          UI.renderPreview(); UI.renderButtons();
        }
        break;
      }
      case 'cashout': UI.showCashout(); break;
      case 'shop':
        UI.showShop();
        if (run.pack) UI.showPack(run.pack);
        if (!resume) setTimeout(() => UI.coach('shop', 'Talismans power up every hand you score. You can own five, and they trigger left to right.', UI.els.tals, true), 500);
        break;
      case 'won': UI.showWon({ fresh: [] }); break;
      default: this.toTitle();
    }
  },

  playTable() {
    const run = G.run;
    if (G.busy || run.phase !== 'select') return;
    Sfx.button();
    const T = Run.startTable(run);
    UI.hidePanel();
    const boss = T.boss;
    GLX.setTheme(boss ? (boss === 'house' ? 'house' : 'boss') : 'felt');
    Music.setMode(boss ? 'boss' : 'lounge');
    if (boss) { Sfx.gong(); UI.banner(BOSSES[boss].name, BOSSES[boss].desc, true); }
    else UI.banner(TABLE_KINDS[T.tidx].name, 'Score ' + fmtBig(T.target));
    UI.renderAll();
    this.save();
    setTimeout(() => this.throwHand(true), 650);
  },

  updateFog() {
    const T = G.run && G.run.table;
    for (let i = 0; i < 5; i++) GLX.dice[i].hidden = !!(T && T.boss === 'fog' && T.thrown && !T.revealed[i] && !T.held[i]);
  },

  async throwHand(first) {
    const run = G.run, T = run.table;
    G.busy = true;
    UI.renderButtons();
    const anyVisible = GLX.dice.some((d) => d.visible);
    if (!first && anyVisible) {
      for (let i = 0; i < 5; i++) if (GLX.dice[i].visible) GLX.exit(i, i * 0.03);
      await waitDice();
    }
    Run.newHand(run);
    G.lastRank = -1;
    GLX.setDice(run.dice);
    for (let i = 0; i < 5; i++) { const d = GLX.dice[i]; d.liftT = 0; d.glowT = 0; d.dimT = 0; }
    this.updateFog();
    Sfx.rattle();
    for (let i = 0; i < 5; i++) GLX.launch(i, T.top[i], 'throw', i * 0.06);
    UI.renderPreview();
    await waitDice();
    this.afterThrow();
    this.save();
  },

  afterThrow() {
    const run = G.run, T = run.table;
    this.updateFog();
    if (T.crooked >= 0) { const s = GLX.dieScreen(T.crooked); if (s) Floats.at(s.x, s.top, 'Crooked!', 't'); }
    const hidden = T.boss === 'fog' && T.revealed.some((r, i) => !r && !T.held[i]);
    if (!hidden) {
      const ev = Rules.evaluateRun(run);
      const rank = HAND[ev.hand].rank;
      if (rank >= HAND.three.rank && rank > (G.lastRank === undefined ? -1 : G.lastRank)) this.callout(ev.hand, rank);
      G.lastRank = rank;
    }
    G.busy = false;
    UI.renderPreview();
    UI.renderButtons();
    if (!Save.data.seen.hold) setTimeout(() => UI.coach('hold', 'Tap dice to hold them, then Reroll the rest. Or Score right away.', UI.els.tray, false), 250);
  },

  callout(hand, rank) {
    const r = UI.els.tray.getBoundingClientRect();
    const big = rank >= HAND.four.rank;
    Floats.at(r.left + r.width / 2, r.top + Math.min(70, r.height * 0.22), HAND[hand].name + '!', 'call' + (big ? ' huge' : ''));
    Sfx.callout(rank);
    if (big) {
      FX.burst(r.left + r.width / 2, r.top + r.height * 0.5, { n: 40, speed: 520, colors: ['#f3d77c', '#fff3c4', '#d4af37'] });
      if (Save.data.settings.shake) GLX.shake = 0.5;
      GLX.pulse = 1;
      vibrate(25);
    }
    if (rank >= HAND.five.rank) FX.confetti(r.left + r.width / 2, r.top + r.height * 0.4, 90);
  },

  toggleHold(i) {
    const run = G.run;
    if (!run || G.busy || run.phase !== 'play' || !run.table.thrown || UI.modalOpen()) return;
    const on = Run.toggleHold(run, i);
    const d = GLX.dice[i];
    d.liftT = on ? 1 : 0;
    d.glowT = on ? 1 : 0;
    this.updateFog();
    Sfx.hold(on);
    vibrate(8);
    UI.renderPreview();
    UI.renderButtons();
    if (Save.data.seen.hold && !Save.data.seen.score) { UI.hideCoach(); setTimeout(() => UI.coach('score', 'Only the dice that make your hand score. Reach the target within your hands to clear the table!', UI.els.bScore, false), 300); }
    clearTimeout(this._hs);
    this._hs = setTimeout(() => this.save(), 400);
  },

  async reroll() {
    const run = G.run;
    if (!run || G.busy || run.phase !== 'play') return;
    if (!Run.canReroll(run)) { Sfx.deny(); if (run.table.held.every((h) => h)) Floats.at(window.innerWidth / 2, UI.els.tray.getBoundingClientRect().top + 30, 'Everything is held', 't'); return; }
    G.busy = true;
    UI.hideCoach();
    const T = run.table;
    const heldN = T.held.filter((h) => h).length;
    const before = run.tals.map((t) => JSON.stringify(t));
    const idx = Run.reroll(run);
    Save.data.stats.rerolls++;
    Save.data.stats.holds += heldN;
    if (T.boss === 'tax') { G.shownMoney = run.money; const r = UI.els.bReroll.getBoundingClientRect(); Floats.at(r.left + r.width / 2, r.top, '−$1', '$'); }
    if (T.boss === 'house') for (let i = 0; i < 5; i++) { GLX.dice[i].liftT = 0; GLX.dice[i].glowT = 0; }
    UI.renderHud();
    UI.renderButtons();
    run.tals.forEach((t, k) => { if (JSON.stringify(t) !== before[k]) { const c = UI.talEl(k); if (c) { c.classList.remove('trig'); void c.offsetWidth; c.classList.add('trig'); } } });
    UI.renderTals();
    idx.forEach((i, j) => GLX.launch(i, T.top[i], 'hop', j * 0.045));
    this.updateFog();
    Sfx.rattle();
    await waitDice();
    this.afterThrow();
    this.save();
  },

  // ------------------------------------------------ scoring
  async score() {
    const run = G.run;
    if (!run || G.busy || run.phase !== 'play' || !run.table.thrown) return;
    G.busy = true;
    UI.hideCoach();
    UI.hideTip();
    const T = run.table;
    const before = { score: T.score, money: run.money };
    for (let i = 0; i < 5; i++) GLX.dice[i].hidden = false;
    UI.renderButtons();
    const res = Run.scoreHand(run);
    if (res.lost) this.recordRun(false);
    if (res.won) { run.lastScore = T.score; run.lastTarget = T.target; }
    if (!res.won && !res.lost) T.thrown = false;
    const fresh = this.metaAfterHand(res);
    this.save();
    G.ff = false;
    G.scoring = true;
    await this.animateScore(res, before, T);
    G.scoring = false;
    G.ff = false;
    this.announce(fresh);
    await this.afterScore(res, T);
  },

  srcPos(src) {
    if (!src) return { x: window.innerWidth / 2, y: window.innerHeight / 2 };
    if (src.k === 'die' || (src.k === 'tal' && src.die !== undefined)) {
      const s = GLX.dieScreen(src.k === 'die' ? src.i : src.die);
      if (s) return { x: s.x, y: s.top - 8 };
    }
    if (src.k === 'tal') {
      const c = UI.talEl(src.slot);
      if (c) { const r = c.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.bottom + 16 }; }
    }
    const e = src.k === 'boss' ? UI.els.tableBar : UI.els.handName;
    const r = e.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  },
  popSrc(src) {
    if (!src) return;
    if (src.k === 'die') GLX.pop(src.i, 1);
    if (src.k === 'tal') {
      const c = UI.talEl(src.slot);
      if (c) { c.classList.remove('trig'); void c.offsetWidth; c.classList.add('trig'); }
      if (src.die !== undefined) GLX.pop(src.die, 0.6);
    }
  },

  async animateScore(res, before, T) {
    const run = G.run;
    const inS = new Set(res.scoring);
    for (let i = 0; i < 5; i++) { const d = GLX.dice[i]; d.dimT = inS.has(i) ? 0 : 0.8; d.liftT = inS.has(i) ? 0.55 : 0; d.glowT = 0; }
    UI.renderHolds();
    UI.els.handName.className = '';
    UI.els.handName.textContent = HAND[res.hand].name;
    UI.els.handLvl.textContent = 'lvl ' + (res.level - res.levelUps);
    await sleep(240);
    let k = 0, nc = 0, nm = 0, nx = 0;
    const shake = Save.data.settings.shake;
    for (const e of res.events) {
      const d = Math.max(105, 390 * Math.pow(0.93, k));
      const p = this.srcPos(e.src);
      switch (e.k) {
        case 'base': UI.setBoxes(e.chips, e.mult, 'c'); Sfx.tick(); await sleep(300); break;
        case 'chips': Floats.at(p.x, p.y, '+' + fmtBig(e.v), 'c'); this.popSrc(e.src); UI.setBoxes(e.chips, e.mult, 'c'); Sfx.chip(nc++); await sleep(d); break;
        case 'mult': Floats.at(p.x, p.y, '+' + fmtMult(e.v) + ' Mult', 'm'); this.popSrc(e.src); UI.setBoxes(e.chips, e.mult, 'm'); Sfx.mult(nm++); await sleep(d); break;
        case 'x':
          Floats.at(p.x, p.y, '×' + fmtX(e.v) + ' Mult', 'x'); this.popSrc(e.src); UI.setBoxes(e.chips, e.mult, 'm'); Sfx.xmult(nx++);
          FX.ring(p.x, p.y, '#ff2e47', 50);
          if (shake) GLX.shake = Math.min(1, 0.35 + nx * 0.08);
          await sleep(d * 1.25); break;
        case 'money':
          Floats.at(p.x, p.y, '+$' + e.v, '$'); this.popSrc(e.src); Sfx.money();
          G.shownMoney += e.v; UI.renderHud(); UI.bumpMoney();
          { const m = UI.els.hMoney.getBoundingClientRect(); FX.coins(p.x, p.y, m.left + m.width / 2, m.top + m.height / 2, Math.min(8, e.v)); }
          await sleep(d); break;
        case 'msg': Floats.at(p.x, p.y, e.text, 't' + (e.cls ? ' ' + e.cls : '')); this.popSrc(e.src); Sfx.tick(); await sleep(d * 0.85); break;
        case 'again': Floats.at(p.x, p.y, 'Again!', 't'); this.popSrc(e.src); Sfx.tick(); await sleep(d * 0.8); break;
        case 'debuff': Floats.at(p.x, p.y, 'Debuffed', 't dim'); Sfx.deny(); await sleep(d * 0.8); break;
        case 'level':
          { const r = UI.els.handName.getBoundingClientRect(); Floats.at(r.left + r.width / 2, r.top, 'Level up!', 't'); }
          UI.els.handLvl.textContent = 'lvl ' + e.v; this.popSrc(e.src); Sfx.level(); await sleep(d); break;
        case 'shatter':
          FX.shards(p.x, p.y + 20); Sfx.shatter(); Floats.at(p.x, p.y, 'Shattered!', 't'); GLX.setDice(run.dice); await sleep(d); break;
        case 'blocked': { const r = UI.els.tableBar.getBoundingClientRect(); Floats.at(r.left + r.width / 2, r.bottom + 10, 'Blocked by The Eye!', 't', true); Sfx.deny(); await sleep(700); break; }
      }
      k++;
    }
    UI.setBoxes(res.chips, res.mult);
    await sleep(160);
    // the total
    const tp = UI.els.totalPop;
    tp.textContent = fmtBig(res.total);
    tp.classList.remove('on'); void tp.offsetWidth; tp.classList.add('on');
    const burn = res.total >= T.target;
    Sfx.total(burn || res.total >= T.target * 0.5);
    if (burn) {
      Sfx.burn();
      FX.flame(UI.els.scoreBox, 1.8);
      UI.els.scoreBox.classList.add('burn');
      if (shake) GLX.shake = 1;
      GLX.pulse = 1;
    }
    if (res.newBest) {
      const r = UI.els.scoreBox.getBoundingClientRect();
      setTimeout(() => { Floats.at(r.left + r.width / 2, r.top - 6, 'New best hand!', 'call'); Sfx.unlock(); }, 260 / G.speed);
    }
    if (res.bull) { const m = UI.els.hMoney.getBoundingClientRect(); Floats.at(m.left + m.width / 2, m.bottom + 14, 'The Bull takes it all', 't'); G.shownMoney = run.money; UI.renderHud(); Sfx.deny(); }
    await sleep(380);
    // count the table score up
    const from = before.score, to = T.score;
    const n = 18;
    for (let i = 1; i <= n; i++) {
      const v = from + ((to - from) * easeOutCubic(i / n));
      UI.renderTableScore(v);
      Sfx.count(i / n);
      await sleep(32);
    }
    UI.renderTableScore(to);
    G.shownMoney = run.money;
    UI.renderHud();
    await sleep(burn ? 520 : 260);
    UI.els.scoreBox.classList.remove('burn');
    for (let i = 0; i < 5; i++) GLX.dice[i].dimT = 0;
  },

  async afterScore(res, T) {
    const run = G.run;
    UI.renderTals();
    UI.renderSide();
    if (res.won) {
      Sfx.win();
      const r = UI.els.scoreBox.getBoundingClientRect();
      FX.confetti(r.left + r.width / 2, r.top + r.height / 2, 80);
      UI.banner(T.boss ? 'Boss beaten' : 'Table cleared', fmtBig(T.score) + ' / ' + fmtBig(T.target));
      if (T.boss) Save.data.stats.bosses++;
      Save.data.stats.tables++;
      Save.persist();
      vibrate(30);
      await sleep(1250);
      for (let i = 0; i < 5; i++) { GLX.dice[i].liftT = 0; GLX.exit(i, i * 0.05); }
      await waitDice();
      G.busy = false;
      UI.renderAll();
      UI.showCashout();
    } else if (res.lost) {
      Sfx.lose();
      UI.banner('Bust', fmtBig(T.target - T.score) + ' short', true);
      for (let i = 0; i < 5; i++) GLX.dice[i].dimT = 0.9;
      vibrate([40, 60, 40]);
      await sleep(1700);
      G.busy = false;
      Save.data.run = null;
      const fresh = checkUnlocks();
      Save.persist();
      this.announce(fresh);
      UI.showOver({ table: T, fresh });
    } else {
      G.busy = false;
      UI.renderHud();
      await this.throwHand(false);
    }
  },

  metaAfterHand(res) {
    const S = Save.data, run = G.run;
    res.newBest = S.stats.bestHand > 0 && res.total > S.stats.bestHand;
    S.stats.hands++;
    S.handsEver[res.hand] = (S.handsEver[res.hand] || 0) + 1;
    if (res.total > S.stats.bestHand) { S.stats.bestHand = res.total; S.bestHandType = res.hand; }
    let ones = 0, sum = 0;
    for (const i of res.scoring) { const v = res.ev.vals[i]; if (v == null) continue; sum += v; if (v === 1) ones++; }
    if (ones >= 2) S.flags.ones = 1;
    if (sum === 21) S.flags.sum21 = 1;
    for (const h in run.levels) S.stats.maxLevel = Math.max(S.stats.maxLevel, run.levels[h]);
    if (run.daily && S.daily.date === run.daily) S.daily.bestHand = Math.max(S.daily.bestHand, res.total);
    return checkUnlocks();
  },
  metaAfterChange() {
    const S = Save.data, run = G.run;
    if (Run.gilded(run) >= 4) S.flags.gild4 = 1;
    if (Run.maxFace(run) >= 7) S.flags.seven = 1;
    if (run.stats.sold >= 3) S.flags.sell3 = 1;
    for (const h in run.levels) S.stats.maxLevel = Math.max(S.stats.maxLevel, run.levels[h]);
    this.announce(checkUnlocks());
  },

  // ------------------------------------------------ cash out & shop
  collect() {
    const run = G.run;
    if (!run || run.phase !== 'cashout' || G.busy) return;
    const btn = UI.els.panel.querySelector('#bCollect');
    const from = btn ? btn.getBoundingClientRect() : { left: window.innerWidth / 2, top: window.innerHeight / 2, width: 0 };
    const m = UI.els.hMoney.getBoundingClientRect();
    FX.coins(from.left + from.width / 2, from.top, m.left + m.width / 2, m.top + m.height / 2, Math.min(14, run.cash.total + 2));
    Sfx.register();
    Run.collect(run);
    if (run.ante > Save.data.stats.bestAnte) Save.data.stats.bestAnte = run.ante;
    setTimeout(() => { G.shownMoney = run.money; UI.renderHud(); UI.bumpMoney(); }, 650);
    if (run.phase === 'won') {
      const S = Save.data;
      S.stats.wins++;
      S.stakeWon = Math.max(S.stakeWon, run.stake);
      S.stats.bestAnte = Math.max(S.stats.bestAnte, 9);
      this.recordRun(true);
      const fresh = checkUnlocks();
      if (run.stake + 1 < STAKES.length && run.stake === S.stakeWon) fresh.push({ kind: 'stake', id: run.stake + 1 });
      this.save();
      UI.hidePanel();
      Sfx.win();
      FX.confetti(window.innerWidth / 2, window.innerHeight * 0.4, 160);
      GLX.setTheme('gold');
      UI.showWon({ fresh: fresh });
      return;
    }
    this.discoverRun();
    this.save();
    GLX.setTheme('shop');
    Music.setMode('lounge');
    UI.renderAll();
    UI.showShop();
    setTimeout(() => UI.coach('shop', 'Talismans power up every hand you score. You can own five, and they trigger left to right.', UI.els.tals, true), 500);
  },

  refreshShop(newUid) {
    G.shownMoney = G.run.money;
    UI.renderHud();
    UI.renderTable();
    UI.renderSide();
    UI.renderTals(newUid);
    UI.renderItems();
    if (G.run.phase === 'shop') UI.showShop();
    else if (G.run.phase === 'select') UI.showSelect();
    this.discoverRun();
    this.save();
  },
  noRoom(what) {
    Sfx.deny();
    const r = (what === 'tal' ? UI.els.tals : UI.els.items).getBoundingClientRect();
    Floats.at(r.left + r.width / 2, r.bottom + 12, what === 'tal' ? 'No room: sell a talisman first' : 'No room: use or sell an item first', 't');
  },

  async buyOffer(i) {
    const run = G.run, o = run.shop && run.shop.offers[i];
    if (!o || o.sold || G.busy) return;
    if (run.money < o.cost) { Sfx.deny(); return; }
    let res;
    if (o.type === 'tal') {
      if (run.tals.length >= run.slots) return this.noRoom('tal');
      res = Run.buyOffer(run, i);
    } else if (o.type === 'die') {
      const sel = await UI.inspect({ mode: 'replace', title: 'Swap in a ' + DICE_KINDS[o.die.kind].name, hint: 'Pick the die it replaces', newDie: o.die, ok: 'Replace ($' + o.cost + ')' });
      if (!sel || !sel.length) return;
      res = Run.buyOffer(run, i, { replace: sel[0].d });
      GLX.setDice(run.dice);
    } else {
      const need = Run.itemNeeds(o.id);
      if (run.items.length < run.islots) res = Run.buyOffer(run, i);
      else if (ITEMS[o.id].kind === 'trick') return this.noRoom('item');
      else {
        let targets = [];
        if (need.sel !== 'none') { targets = await this.pickTargets(o.id); if (!targets) return; }
        res = Run.buyOffer(run, i, { use: true, targets });
        if (res.ok) this.itemFx(o.id, res);
      }
    }
    if (!res || !res.ok) { if (res && res.why === 'slots') this.noRoom('tal'); else Sfx.deny(); return; }
    Sfx.buy();
    run.stats.bought = run.stats.bought || 0;
    this.metaAfterChange();
    this.refreshShop(o.type === 'tal' ? run.tals[run.tals.length - 1].uid : undefined);
  },

  openPack(i) {
    const run = G.run;
    if (G.busy || !run.shop) return;
    const p = run.shop.packs[i];
    if (!p || p.sold) return;
    if (run.money < p.cost) { Sfx.deny(); return; }
    const pk = Run.openPack(run, i);
    if (!pk) return;
    Sfx.pack();
    this.discoverRun();
    this.refreshShop();
    UI.showPack(pk);
  },

  async pickTargets(id) {
    const need = Run.itemNeeds(id);
    const it = ITEMS[id];
    if (need.sel === 'faces') {
      return await UI.inspect({ mode: 'faces', n: need.n, pair: need.pair, title: it.name, ok: it.kind === 'trick' ? 'Turn it up' : undefined, hint: need.pair ? '' : hl(it.desc) + (need.n > 1 ? ' (pick up to ' + need.n + ')' : '') });
    }
    if (need.sel === 'dice') return await UI.inspect({ mode: 'dice', n: need.n, title: it.name, hint: hl(it.desc) + ' (tap a die)' });
    return [];
  },

  async pickPack(k) {
    const run = G.run, pk = run.pack;
    if (!pk) return;
    const ch = pk.choices[k];
    let opt = {};
    if (ch.type === 'tal' && run.tals.length >= run.slots) { this.noRoom('tal'); return; }
    if (ch.type === 'die') {
      const sel = await UI.inspect({ mode: 'replace', title: 'Swap in a ' + DICE_KINDS[ch.die.kind].name, hint: 'Pick the die it replaces', newDie: ch.die, ok: 'Replace' });
      if (!sel || !sel.length) { UI.showPack(pk); return; }
      opt.replace = sel[0].d;
    } else if (ch.type === 'item') {
      const need = Run.itemNeeds(ch.id);
      if (need.sel !== 'none') {
        const t = await this.pickTargets(ch.id);
        if (!t) { UI.showPack(pk); return; }
        opt.targets = t;
      }
    }
    const res = Run.pickPack(run, k, opt);
    if (!res.ok) { if (res.why === 'slots') this.noRoom('tal'); else Sfx.deny(); UI.showPack(pk); return; }
    UI.closeModal();
    Sfx.buy();
    if (ch.type === 'item') this.itemFx(ch.id, res);
    if (ch.type === 'die') GLX.setDice(run.dice);
    this.metaAfterChange();
    this.refreshShop(ch.type === 'tal' ? run.tals[run.tals.length - 1].uid : undefined);
  },
  skipPack() { Run.skipPack(G.run); UI.closeModal(); Sfx.button(); this.save(); if (G.run.phase === 'select') UI.showSelect(); },

  rerollShop() {
    const run = G.run;
    if (G.busy || !Run.rerollShop(run)) { Sfx.deny(); return; }
    Sfx.shuffle();
    this.refreshShop();
  },
  buyVoucher() {
    const run = G.run;
    if (G.busy || !Run.buyVoucher(run)) { Sfx.deny(); return; }
    Sfx.buy();
    UI.toast(svgIcon('voucher'), 'Voucher redeemed', VOUCHERS[run.voucher.id].name + ': ' + VOUCHERS[run.voucher.id].desc);
    this.refreshShop();
  },
  skipTable() {
    const run = G.run;
    if (G.busy || run.phase !== 'select' || run.tidx >= 2) return;
    const res = Run.skip(run);
    if (!res) return;
    Sfx.shuffle();
    UI.toast(UI.tagToken(res.tag, 40), 'Table skipped', TAGS[res.tag].name + ': ' + TAGS[res.tag].desc);
    if (res.money) {
      Sfx.money();
      const m = UI.els.hMoney.getBoundingClientRect();
      FX.coins(window.innerWidth / 2, window.innerHeight * 0.6, m.left + m.width / 2, m.top + m.height / 2, Math.min(12, res.money));
      setTimeout(() => { G.shownMoney = run.money; UI.renderHud(); UI.bumpMoney(); }, 600);
    }
    if (res.voucher) UI.toast(svgIcon('voucher'), 'Voucher redeemed', VOUCHERS[res.voucher].name + ': ' + VOUCHERS[res.voucher].desc);
    this.discoverRun();
    this.save();
    UI.renderAll();
    UI.showSelect();
    if (res.pack) { Sfx.pack(); UI.showPack(run.pack); }
  },

  nextTable() {
    const run = G.run;
    if (G.busy || run.phase !== 'shop') return;
    Sfx.button();
    if (run.pack) Run.skipPack(run);
    const prevAnte = run.ante;
    Run.nextTable(run);
    if (run.ante > Save.data.stats.bestAnte) Save.data.stats.bestAnte = run.ante;
    if (run.ante > prevAnte) { UI.banner('Ante ' + run.ante, run.ante === 8 ? 'The House awaits' : 'The stakes rise'); Sfx.level(); }
    this.announce(checkUnlocks());
    this.save();
    this.enter();
  },

  // ------------------------------------------------ items & talismans
  itemFx(id, res) {
    const it = ITEMS[id], run = G.run;
    if (res.level) {
      Sfx.level();
      if (res.level.all) UI.toast(svgIcon('i_blackhole'), 'Black Hole', 'Every hand levelled up');
      else UI.toast(starMap(res.level.hand), it.name, HAND[res.level.hand].name + ' is now level ' + res.level.to);
    }
    if (res.tal) { this.discover(res.tal); Sfx.unlock(); }
    if (res.changed && res.changed.length) { GLX.setDice(run.dice); Sfx.chip(4); }
    if (res.sleight) { const i = res.sleight.d; GLX.launch(i, run.table.top[i], 'hop', 0, { speed: 0.8 }); this.updateFog(); Sfx.rattle(); setTimeout(() => { UI.renderPreview(); UI.renderButtons(); }, 700); }
    if (res.mat) GLX.setDice(run.dice);
    if (run.phase === 'play') UI.renderPreview();
  },

  async useItem(k) {
    const run = G.run;
    if (G.busy || !run.items[k]) return;
    const id = run.items[k].id;
    const targets = await this.pickTargets(id);
    if (!targets) return;
    const res = Run.useItem(run, k, targets);
    if (!res.ok) { if (res.why === 'slots') this.noRoom('tal'); else if (res.why === 'play') { Sfx.deny(); UI.toast(itemIcon(id), ITEMS[id].name, 'Use it while a hand is on the table'); } else Sfx.deny(); return; }
    this.itemFx(id, res);
    this.metaAfterChange();
    UI.renderAll();
    if (run.phase === 'shop') UI.showShop();
    this.save();
  },
  sellItem(k) {
    const run = G.run;
    if (G.busy) return;
    const v = Run.sellItem(run, k);
    if (!v) return;
    Sfx.sell();
    G.shownMoney = run.money;
    UI.renderAll();
    if (run.phase === 'shop') UI.showShop();
    this.save();
  },
  sellTal(k) {
    const run = G.run;
    if (G.busy) return;
    const c = UI.talEl(k);
    const r = c && c.getBoundingClientRect();
    const v = Run.sell(run, k);
    if (!v) return;
    Sfx.sell();
    if (r) Floats.at(r.left + r.width / 2, r.top + r.height / 2, '+$' + v, '$');
    G.shownMoney = run.money;
    this.metaAfterChange();
    UI.renderAll();
    if (run.phase === 'shop') UI.showShop();
    if (run.phase === 'select') UI.showSelect();
    this.save();
  },
  moveTal(k, dir) {
    if (G.busy) return;
    if (Run.moveTal(G.run, k, dir)) { Sfx.tick(); UI.renderTals(); this.save(); const c = UI.talEl(k + dir); if (c) UI.talTip(k + dir, c); }
  },
};

// ---------------------------------------------------------------- main.js (boot, layout, loop, input)
const Quality = {
  cap: 2, acc: 0, n: 0, slow: 0, enabled: true,
  dprCap() { return this.cap; },
  track(dt) {
    if (!this.enabled) return;
    this.acc += dt; this.n++;
    if (this.acc < 2) return;
    const avg = this.acc / this.n;
    this.acc = 0; this.n = 0;
    if (avg > 0.026 && this.cap > 1) {
      this.slow++;
      if (this.slow >= 2) { this.cap = Math.max(1, this.cap - 0.35); this.slow = 0; App.layout(); }
    } else this.slow = 0;
  },
};

const App = {
  last: 0, idle: 0, fc: 0,
  layout() {
    const w = window.innerWidth, h = window.innerHeight;
    const dpr = Math.min(window.devicePixelRatio || 1, Quality.dprCap());
    GLX.resize(w, h, dpr);
    FX.resize(w, h, Math.min(window.devicePixelRatio || 1, 2));
    const tt = G.title && document.getElementById('titleTray');
    const tray = tt || UI.els.tray;
    if (tray) GLX.setTray(tray.getBoundingClientRect());
    if (!G.title) UI.renderHolds();
    this.redraw();
  },
  redraw() { if (GLX.ok) GLX.render(); },
  frame(now) {
    const dt = Math.min(0.05, (now - (this.last || now)) / 1000);
    this.last = now;
    Quality.track(dt);
    const ds = 1 + (G.speed - 1) * 0.45;
    GLX.update(dt * ds);
    if (G.moneyDisp !== undefined && G.moneyDisp !== G.shownMoney) {
      const d = G.shownMoney - G.moneyDisp;
      G.moneyDisp = Math.abs(d) < 0.6 ? G.shownMoney : G.moneyDisp + d * Math.min(1, dt * 9);
      const v = Math.round(G.moneyDisp);
      if (v !== G.moneyShownInt) { G.moneyShownInt = v; UI.els.hMoney.textContent = '$' + v; if (d > 0) Sfx.count(0.9); }
    }
    if (G.title) {
      G.titleNext -= dt;
      if (G.titleNext <= 0 && !GLX.busy()) { Game.titleThrow(); G.titleNext = 4.2; }
    }
    // when nothing moves, redraw the slow background at a third of the rate to save battery
    const active = G.busy || GLX.busy() || FX.parts.length || FX.emitters.length || GLX.shake > 0 || GLX.dice.some((d) => Math.abs(d.glow - d.glowT) > 0.01 || Math.abs(d.lift - d.liftT) > 0.01 || d.pop > 0 || d.wob > 0);
    this.idle = active ? 0 : this.idle + dt;
    this.fc++;
    if (this.idle < 2 || this.fc % 3 === 0) GLX.render();
    if (FX.parts.length || FX.emitters.length || this.fxDirty) { FX.update(dt); FX.render(); this.fxDirty = FX.parts.length > 0; }
  },
  loop() {
    const step = (t) => { this.frame(t); requestAnimationFrame(step); };
    requestAnimationFrame(step);
  },
};

function bootInput() {
  const tray = UI.els.tray;
  const onTap = (x, y) => {
    if (G.title) return;
    const i = GLX.pick(x, y);
    if (i >= 0) Game.toggleHold(i);
  };
  tray.addEventListener('pointerdown', (e) => { onTap(e.clientX, e.clientY); });
  document.addEventListener('pointerdown', () => {
    App.idle = 0;
    if (G.scoring) G.ff = true;
    Sound.ensure();
    if (Sound.ok && Save.data.settings.music && !Music.on) Music.start();
  }, { passive: true });
  document.addEventListener('keydown', (e) => {
    if (e.repeat) return;
    if (e.key === 'Escape') { if (UI.modalOpen()) UI.closeModal(); else if (G.run && !G.title) UI.showMenu(); return; }
    if (UI.modalOpen() || G.title || !G.run) return;
    Sound.ensure();
    if (e.key >= '1' && e.key <= '5') Game.toggleHold(+e.key - 1);
    else if (e.key === 'r' || e.key === 'R') Game.reroll();
    else if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      const run = G.run;
      if (run.phase === 'play') Game.score();
      else if (run.phase === 'select') Game.playTable();
      else if (run.phase === 'cashout') Game.collect();
    }
  });
  window.addEventListener('resize', () => App.layout());
  if (window.visualViewport) window.visualViewport.addEventListener('resize', () => App.layout());
  if (typeof ResizeObserver !== 'undefined') new ResizeObserver(() => App.layout()).observe(UI.els.tray);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { if (Sound.ac && Sound.ac.state === 'running') Sound.ac.suspend().catch(() => {}); }
    else if (Sound.ac) Sound.ac.resume().catch(() => {});
  });
}

function boot() {
  Save.load();
  G.speed = Save.data.settings.speed || 1;
  UI.init();
  Floats.init();
  FX.init(document.getElementById('fx'));
  const ok = GLX.init(document.getElementById('gl'));
  if (!ok) document.body.style.background = 'radial-gradient(circle at 50% 40%, #134d37, #04100b 70%)';
  GLX.onImpact = (i, n, kind) => {
    Sfx.clack(n === 0 ? 1 : 0.55 / n, kind);
    if (n === 0 && !G.title) {
      const s = GLX.dieScreen(i);
      if (s) FX.burst(s.x, s.y + s.r * 0.75, { n: 7, speed: 110, life: 0.5, size: 3, grav: -30, drag: 3, colors: ['rgba(210,230,215,0.55)', 'rgba(170,200,180,0.45)', 'rgba(243,215,124,0.5)'] });
    }
    if (n === 0 && kind === 'throw' && Save.data.settings.shake && !G.title) GLX.shake = Math.max(GLX.shake, 0.12);
  };
  Save.onRemote = () => { if (G.title) UI.showTitle(), App.layout(); };
  Sound.applySettings();
  bootInput();
  Game.toTitle();
  App.loop();
  Save.cloudInit();
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

})();</script>
