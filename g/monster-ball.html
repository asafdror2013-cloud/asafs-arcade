<script>
/*! © 2026 Asaf. All rights reserved. Free to play; not to be copied or claimed as your own. */
(function () {
  'use strict';
  var CFG = {"id": "monster-ball", "owner": "Asaf", "year": 2026, "mark": "bl", "dx": 0, "dy": 0, "mount": null, "hubCss": null};
  var NOTICE = '© ' + CFG.year + ' ' + CFG.owner;

  // Inside Asaf's Arcade the game runs in a frame of the arcade page: borrow its cloud saves, let it show the notice.
  var hub = null;
  try {
    var P = window.parent;
    if (P && P !== window && P.__ASAF_ARCADE__ && P.__ASAF_ARCADE__.v === 1) hub = P.__ASAF_ARCADE__;
  } catch (e) { hub = null; }
  window.__ASAF_HUB__ = !!hub;
  if (hub) {
    window.__asafClaude = makeClaude(hub, CFG.id);
    if (CFG.hubCss) {
      var hs = document.createElement('style');
      hs.textContent = CFG.hubCss;
      (document.head || document.documentElement).appendChild(hs);
    }
    return;
  }

  // ---- played on its own: a small permanent tag plus a short notice when the game opens
  var css = '' +
    '#asaf-cr{all:initial;position:fixed;z-index:2147483646;display:block;box-sizing:border-box;pointer-events:none;user-select:none;-webkit-user-select:none;' +
    'font:600 10px/1 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;letter-spacing:.04em;color:rgba(255,255,255,.88);' +
    'background:rgba(6,6,16,.52);padding:4px 8px;border-radius:999px;white-space:nowrap;opacity:.82;transition:opacity .7s ease}' +
    '#asaf-cr.asaf-busy{opacity:.14}' +
    '#asaf-cr-toast{all:initial;position:fixed;z-index:2147483647;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));display:block;box-sizing:border-box;' +
    'transform:translateX(-50%);pointer-events:none;user-select:none;-webkit-user-select:none;width:max-content;max-width:min(90vw,430px);' +
    'font:500 12.5px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#fff;text-align:center;' +
    'background:rgba(8,8,20,.9);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:9px 15px;box-shadow:0 10px 30px rgba(0,0,0,.5);' +
    'opacity:0;animation:asafCrIn .45s ease .6s forwards,asafCrOut .6s ease 5.2s forwards}' +
    '#asaf-cr-toast b{all:unset;font-weight:800}' +
    '#asaf-cr-toast i{all:unset;display:block;margin-top:2px;font-size:11.5px;opacity:.78}' +
    '@keyframes asafCrIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}' +
    '@keyframes asafCrOut{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,0)}}';
  var st = document.createElement('style');
  st.id = 'asaf-cr-style';
  st.textContent = css;
  (document.head || document.documentElement).appendChild(st);

  var dx = 6 + (CFG.dx || 0), dy = 6 + (CFG.dy || 0);
  var T = 'top:calc(' + dy + 'px + env(safe-area-inset-top,0px));';
  var B = 'bottom:calc(' + dy + 'px + env(safe-area-inset-bottom,0px));';
  var L = 'left:calc(' + dx + 'px + env(safe-area-inset-left,0px));';
  var R = 'right:calc(' + dx + 'px + env(safe-area-inset-right,0px));';
  var C = 'left:50%;transform:translateX(-50%);';
  var POS = { tl: T + L, tr: T + R, bl: B + L, br: B + R, tc: T + C, bc: B + C };

  var tag = document.createElement('div');
  tag.id = 'asaf-cr';
  tag.setAttribute('role', 'note');
  tag.setAttribute('aria-label', NOTICE + '. All rights reserved.');
  tag.textContent = NOTICE;
  tag.style.cssText = POS[CFG.mark] || POS.br;

  var toast = document.createElement('div');
  toast.id = 'asaf-cr-toast';
  toast.setAttribute('aria-hidden', 'true');
  var b = document.createElement('b'); b.textContent = NOTICE + ' · All rights reserved';
  var i = document.createElement('i'); i.textContent = 'Free to play. Please don’t copy it or claim it as your own.';
  toast.appendChild(b); toast.appendChild(i);
  setTimeout(function () { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 6200);

  function home() {
    if (CFG.mount) { var m = document.querySelector(CFG.mount); if (m) return m; }
    return document.documentElement;
  }
  function mount() {
    var h = home();
    if (tag.parentNode !== h) h.appendChild(tag);
  }
  function start() {
    mount();
    home().appendChild(toast);
    setInterval(mount, 2500);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();

  // fade the tag while someone is actively playing, bring it back when they pause
  var idle = 0;
  function busy() {
    tag.classList.add('asaf-busy');
    clearTimeout(idle);
    idle = setTimeout(function () { tag.classList.remove('asaf-busy'); }, 2600);
  }
  ['pointerdown', 'keydown', 'touchstart', 'wheel'].forEach(function (ev) {
    window.addEventListener(ev, busy, { capture: true, passive: true });
  });

  // ---- cloud saves through the arcade page (strings only cross between the two pages)
  function makeClaude(H, gid) {
    var cache = {};
    function fail(code) { var e = new Error(code || 'unavailable'); e.code = code || 'unavailable'; return e; }
    function call(fn, args) {
      return new Promise(function (res, rej) {
        var p;
        try { p = H[fn].apply(null, [gid].concat(args || [])); } catch (e) { rej(fail('unavailable')); return; }
        Promise.resolve(p).then(function (s) {
          var r;
          try { r = JSON.parse(s); } catch (e) { rej(fail('internal')); return; }
          if (r && r.ok) res(r.v); else rej(fail(r && r.code));
        }, function () { rej(fail('unavailable')); });
      });
    }
    function snap(path, v) {
      var parts = path.split('/');
      return { id: parts[parts.length - 1], exists: v !== null && v !== undefined,
        data: function () { return v === null || v === undefined ? undefined : JSON.parse(JSON.stringify(v)); } };
    }
    function doc(path) {
      return {
        id: path.split('/').pop(), path: path,
        get: function () { return call('get', [path]).then(function (v) { return snap(path, v); }); },
        set: function (data) { return call('set', [path, JSON.stringify(data)]).then(function () {}); }
      };
    }
    function query(path, lim) {
      return {
        path: path,
        limit: function (n) { return query(path, n); },
        doc: function (id) { return doc(path + '/' + id); },
        onSnapshot: function (next, error) {
          var dead = false, off = null;
          function onErr(code) { if (!dead && typeof error === 'function') error(fail(code)); }
          try {
            off = H.watch(gid, path, lim || 0, function (s) {
              if (dead) return;
              var rows; try { rows = JSON.parse(s); } catch (e) { return; }
              var docs = rows.map(function (d) { return snap(path + '/' + d.id, d.v); });
              next({ docs: docs, size: docs.length, empty: !docs.length, forEach: function (f) { docs.forEach(f); } });
            }, onErr);
          } catch (e) { setTimeout(function () { onErr('unavailable'); }, 0); }
          return function () { dead = true; try { if (off) off(); } catch (e) { /* page gone */ } };
        }
      };
    }
    var db = { doc: doc, collection: function (p) { return query(p, 0); } };
    var user = {
      id: function () { return call('uid', []); },
      me: function () { return call('uid', []).then(function (id) { return { id: id }; }); },
      can: function (n) { return call('can', [String(n)]); },
      profiles: function (ids) { return call('profiles', [JSON.stringify(ids || [])]); },
      isOwner: function () { return false; },
      canEdit: function () { return false; }
    };
    return {
      use: function (name) {
        if (!cache[name]) {
          cache[name] = call('ready', [String(name)]).then(function (ok) {
            if (!ok) return null;
            return name === 'db' ? db : name === 'user' ? user : null;
          }, function () { return null; });
        }
        return cache[name];
      }
    };
  }
})();
</script>

:root {
  --ink: #140820; --panel: rgba(22,12,40,.94); --panel2: #2a1a4a; --line: rgba(255,255,255,.14);
  --yellow: #ffcc00; --orange: #ff7a1a; --red: #ff4b33; --green: #3ee08f; --purple: #7c5cff; --pink: #ff4fa3;
  --text: #fff; --dim: #b8a9d9;
  --head: 'Lilita One', 'Arial Black', Impact, sans-serif;
  --body: 'Rubik', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px); --sl: env(safe-area-inset-left, 0px); --sr: env(safe-area-inset-right, 0px);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: #05030c; color: var(--text); overflow: hidden; }
body { font: 500 15px/1.4 var(--body); touch-action: none; user-select: none; -webkit-user-select: none; overscroll-behavior: none; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
[hidden] { display: none !important; }
#cv { position: fixed; inset: 0; display: block; touch-action: none; }

/* ---------- buttons */
.big { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; min-height: 58px; padding: 9px 18px; border-radius: 16px; background: linear-gradient(#3a2766, #251744); border: 2px solid rgba(255,255,255,.16); box-shadow: 0 4px 0 #0c0618; transition: transform .08s; }
.big b { font: 400 25px/1 var(--head); letter-spacing: .03em; }
.big span { font-size: 12.5px; color: var(--dim); margin-top: 3px; }
.big.hot { background: linear-gradient(#ffd84a, #ffb300); border-color: #fff1a8; color: #2a1400; box-shadow: 0 4px 0 #a56a00; }
.big.hot span { color: #6b4500; }
.big:active, .small:active { transform: translateY(2px); }
.small { min-height: 42px; padding: 8px 14px; border-radius: 12px; background: rgba(255,255,255,.08); border: 1.5px solid var(--line); font-weight: 700; font-size: 14px; }
.small.icon { font-size: 19px; min-width: 46px; }
.small.danger { color: #ff9a8a; margin-top: 14px; width: 100%; }
.row { display: flex; gap: 8px; } .row > * { flex: 1; }
.stack { display: flex; flex-direction: column; gap: 9px; margin-top: 14px; }
.pill { font-weight: 800; font-size: 13px; padding: 5px 11px; border-radius: 99px; background: rgba(255,204,0,.14); color: var(--yellow); }

/* ---------- screens */
#screen { position: fixed; inset: 0; z-index: 20; display: flex; overflow: auto; touch-action: pan-y; }
#screen.scr-title { background: linear-gradient(180deg, rgba(10,4,20,.55), rgba(10,4,20,0) 34%, rgba(10,4,20,0) 52%, rgba(10,4,20,.88)); }
#screen.scr-panel { background: rgba(8,4,16,.72); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); align-items: flex-start; justify-content: center; }
.title { width: 100%; min-height: 100%; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: calc(22px + var(--st)) calc(18px + var(--sr)) calc(18px + var(--sb)) calc(18px + var(--sl)); }
.logo { text-align: center; }
.logo small { display: block; font-weight: 800; letter-spacing: .22em; text-transform: uppercase; font-size: 12px; color: #ffe8a8; text-shadow: 0 2px 0 var(--ink); }
.logo h1 { margin: 2px 0 0; font: 400 clamp(52px, 15vw, 96px)/0.86 var(--head); letter-spacing: .02em; color: #fff; text-shadow: 0 5px 0 var(--ink), 0 0 30px rgba(255,122,26,.5); -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; transform: rotate(-3deg); }
.logo h1 span { color: var(--yellow); }
.menu { width: min(100%, 380px); display: flex; flex-direction: column; gap: 9px; }
@media (orientation: landscape) and (max-height: 560px) {
  .title { flex-direction: row; align-items: center; justify-content: space-around; padding-top: calc(12px + var(--st)); padding-bottom: calc(12px + var(--sb)); }
  .logo h1 { font-size: clamp(46px, 11vh, 80px); }
  .menu { width: min(46%, 360px); gap: 7px; } .big { min-height: 50px; } .big b { font-size: 22px; }
}
.panel { width: min(100%, 520px); margin: calc(14px + var(--st)) calc(12px + var(--sr)) calc(14px + var(--sb)) calc(12px + var(--sl)); padding: 16px; border-radius: 22px; background: var(--panel); border: 1.5px solid var(--line); box-shadow: 0 20px 60px rgba(0,0,0,.5); }
header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
header h2 { margin: 0; flex: 1; font: 400 30px/1 var(--head); letter-spacing: .03em; }
header small { display: block; font-weight: 800; letter-spacing: .16em; font-size: 11px; color: var(--dim); }
.back { width: 42px; height: 42px; border-radius: 12px; background: rgba(255,255,255,.08); font-size: 26px; line-height: 1; display: grid; place-items: center; flex: none; }
.back.x { font-size: 17px; order: 3; }
.lead { color: var(--dim); margin: 0 0 12px; font-size: 14px; }
.path { display: flex; flex-direction: column; gap: 10px; }
.mcard { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px; border-radius: 18px; text-align: left; background: linear-gradient(90deg, color-mix(in srgb, var(--c) 30%, #1e1236), #1e1236 70%); border: 2px solid color-mix(in srgb, var(--c) 55%, transparent); }
.mcard canvas { width: 68px; height: 68px; border-radius: 14px; flex: none; border: 2px solid rgba(255,255,255,.2); }
.mcard .mt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.mcard small { font-weight: 800; font-size: 10.5px; letter-spacing: .16em; color: var(--dim); }
.mcard b { font: 400 25px/1 var(--head); letter-spacing: .03em; }
.mcard span { font-size: 13px; color: #e6dcff; }
.mcard em { font-style: normal; margin-top: 2px; font-size: 16px; letter-spacing: 2px; }
.mcard em i { font-style: normal; color: rgba(255,255,255,.2); } .mcard em i.on { color: var(--yellow); }
.mcard em.ok { font-size: 12.5px; letter-spacing: 0; color: var(--green); font-weight: 800; }
.mcard .go { font: 400 18px/1 var(--head); padding: 10px 14px; border-radius: 12px; background: var(--yellow); color: #2a1400; }
.mcard.done .go { background: rgba(255,255,255,.12); color: #fff; }
.mcard.locked { filter: grayscale(.9); opacity: .55; cursor: default; } .mcard.locked .go { background: none; }
.balls { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }
.bcard { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 8px; border-radius: 16px; background: rgba(255,255,255,.05); border: 2px solid var(--line); }
.bcard canvas { width: 72px; height: 72px; }
.bcard b { font-weight: 800; } .bcard small { font-size: 11.5px; color: var(--dim); text-align: center; }
.bcard.sel { border-color: var(--yellow); background: rgba(255,204,0,.1); }
.bcard.locked { cursor: default; }
.how { display: flex; flex-direction: column; gap: 10px; }
.how div { padding: 10px 12px; border-radius: 14px; background: rgba(255,255,255,.05); }
.how b { font: 400 19px/1 var(--head); letter-spacing: .03em; color: var(--yellow); }
.how p { margin: 4px 0 0; font-size: 14px; color: #e6dcff; }
.how i { color: var(--yellow); font-style: normal; font-weight: 800; }
.tog { display: flex; align-items: center; gap: 12px; padding: 11px 4px; border-bottom: 1px solid var(--line); cursor: pointer; }
.tog span { flex: 1; } .tog b { display: block; } .tog small { color: var(--dim); font-size: 12.5px; }
.tog input { position: absolute; opacity: 0; pointer-events: none; }
.tog i { width: 46px; height: 26px; border-radius: 13px; background: rgba(255,255,255,.18); position: relative; flex: none; transition: background .15s; }
.tog i::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .15s; }
.tog input:checked + i { background: var(--green); } .tog input:checked + i::after { transform: translateX(20px); }

/* ---------- modal */
#modal { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: rgba(6,2,14,.62); padding: calc(12px + var(--st)) calc(12px + var(--sr)) calc(12px + var(--sb)) calc(12px + var(--sl)); overflow: auto; touch-action: pan-y; }
.mbox { width: min(100%, 400px); padding: 18px; border-radius: 22px; background: var(--panel); border: 1.5px solid var(--line); box-shadow: 0 20px 60px rgba(0,0,0,.6); animation: pop .22s ease; text-align: center; max-height: 100%; overflow: auto; }
.mbox.wide { width: min(100%, 500px); text-align: left; }
.mbox header { justify-content: center; text-align: center; flex-direction: column; gap: 2px; }
.mbox.wide header { flex-direction: row; text-align: left; }
@keyframes pop { from { transform: scale(.92); opacity: 0; } }
.tip canvas.big { width: 92px; height: 92px; border-radius: 22px; border: 3px solid var(--c); display: block; margin: 0 auto 6px; min-height: 0; padding: 0; box-shadow: none; }
.tip small { font-weight: 800; letter-spacing: .18em; font-size: 11px; color: var(--dim); }
.tip h2 { margin: 2px 0 4px; font: 400 38px/1 var(--head); color: var(--c); letter-spacing: .03em; text-shadow: 0 3px 0 var(--ink); }
q { display: block; font: 400 19px/1.2 var(--head); color: #fff; margin: 8px 0; quotes: '“' '”'; }
.tip ul { text-align: left; margin: 10px 0 6px; padding: 0 0 0 20px; display: flex; flex-direction: column; gap: 7px; font-size: 14.5px; }
.tip b.g, .tip b.y, .tip b.r { font-weight: 800; } .tip b.g { color: var(--green); } .tip b.y { color: var(--yellow); } .tip b.r { color: var(--red); }
.fine { font-size: 12.5px; color: var(--dim); margin: 6px 0 0; }
.stars { font-size: 46px; letter-spacing: 6px; margin: 4px 0; }
.stars i { font-style: normal; color: rgba(255,255,255,.22); display: inline-block; }
.stars i.on { color: var(--yellow); text-shadow: 0 0 18px rgba(255,204,0,.6); animation: star .4s ease both; }
@keyframes star { from { transform: scale(0) rotate(-40deg); } }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 8px; margin: 12px 0 4px; }
.stats div { padding: 8px 4px; border-radius: 12px; background: rgba(255,255,255,.06); }
.stats b { display: block; font: 400 24px/1 var(--head); } .stats small { color: var(--dim); font-size: 11.5px; }
.unlock { color: var(--green); font-weight: 800; margin: 8px 0 0; }
.medal { display: inline-block; margin: 6px auto; padding: 8px 18px; border-radius: 99px; font: 400 24px/1 var(--head); letter-spacing: .06em; color: #1a1022; background: var(--m); box-shadow: 0 0 24px color-mix(in srgb, var(--m) 70%, transparent); }
.resbox h2 { font-size: 34px; }
.resbox.win h2 { color: var(--yellow); }
.resbox.lose h2 { color: #ff8a7a; }

<script>(function () {

// ---------------------------------------------------------------- kit/util.js (math, seeded random, dates, DOM helpers)
const TAU = Math.PI * 2;

// seeded random (mulberry32): daily challenges come from one of these, so everyone gets the same day
function makeRng(seed) {

    a = (a + 0x6D2B79F5) >>> 0;

  r.int = (n) => Math.floor(r() * n);
  r.pick = (arr) => arr[Math.floor(r() * arr.length)];

}

// ---------------------------------------------------------------- data.js (court, monsters, story lines, balls, save shape)

const SAVE_KEY = 'monsterball.v2';
function defaultSave() {
  return {
    v: 1, updated: 0, ball: 'classic',
    story: { tryout: 0, boom: 0, gor: 0, you: 0 },

// ---------------------------------------------------------------- kit/store.js (localStorage + a cloud copy for the signed-in viewer)
// The game defines SAVE_KEY, defaultSave() and mergeSaves(a, b) before this file.
function deepFill(t, d) {

  },

    if (c.writing) { c.pending = true; return; }

    if (json === c.lastJson) return;

  },
};

// ---------------------------------------------------------------- kit/audio.js (synth mixer, sound-effect gate, step sequencer for music)
class Mixer {
  constructor(ac) {

// ------------------------------------------------ BOOM, the anger monster
function drawBoom(c, x, y, s, m, t) {
  const mood = m.mood, rage = mood === 'rage', tired = mood === 'tired', windup = mood === 'windup', ko = m.ko > 0 ? Math.min(1, m.ko / 0.9) : 0;
  c.save(); c.translate(x, y); c.scale(s, s);
  c.translate(0, -(m.jump || 0));

  if (ko) { c.rotate(ko * 0.25); c.globalAlpha = 1 - ko * 0.6; c.scale(1 - ko * 0.15, 1 - ko * 0.4); }
  if (m.hurt > 0) c.translate(Math.sin(t * 60) * 0.03 * m.hurt, 0);
  const sy = (tired ? 0.92 : 1) + breathe + puff, sx = 1 + puff * 0.6 - breathe * 0.5;
  // legs
  c.fillStyle = '#9c2a1c';
  for (const sd of [-1, 1]) { ell(c, sd * 0.36, 0.22, 0.2, 0.26); c.fill(); ink(c); c.fillStyle = '#f4e3c8'; for (let k = -1; k <= 1; k++) { c.beginPath(); c.moveTo(sd * 0.36 + k * 0.08 - 0.03, -0.02); c.lineTo(sd * 0.36 + k * 0.08, 0.04); c.lineTo(sd * 0.36 + k * 0.08 + 0.03, -0.02); c.fill(); } c.fillStyle = '#9c2a1c'; }
  // arms (behind body when down)
  const up = m.arms || 0;
  const arm = (sd) => {
    const sh = [sd * 0.62, 1.9 * sy];
    const hand = [sd * lerp(0.98, 0.55, up), lerp(tired ? 0.62 : 0.85, 3.25, up) * (up > 0.5 ? 1 : sy)];
    limb(c, sh, hand, sd * lerp(-0.18, 0.12, up), 0.34, rage ? '#f0512f' : '#de4430');
    c.fillStyle = rage ? '#f0512f' : '#de4430'; circ(c, hand[0], hand[1], 0.2); c.fill(); ink(c);
    c.fillStyle = '#f4e3c8'; for (let k = -1; k <= 1; k++) { c.beginPath(); const fx = hand[0] + k * 0.09, fy = hand[1] + (up > 0.5 ? 0.17 : -0.17); c.moveTo(fx - 0.03, -(hand[1] + (up > 0.5 ? 0.12 : -0.12))); c.lineTo(fx, -fy); c.lineTo(fx + 0.03, -(hand[1] + (up > 0.5 ? 0.12 : -0.12))); c.fill(); }
  };
  arm(-1); arm(1);
  // body
  const g = c.createRadialGradient(0, -1.5 * sy, 0.2, 0, -1.4 * sy, 1.2);
  g.addColorStop(0, rage ? '#ff6a3d' : '#ee5a3a'); g.addColorStop(1, rage ? '#c8260f' : '#a8301d');
  c.fillStyle = g;
  if (rage) { c.shadowColor = '#ff3b1f'; c.shadowBlur = 0.35 * s; }
  blob(c, [[0, 2.42 * sy], [0.55 * sx, 2.32 * sy], [0.78 * sx, 1.85 * sy], [0.75 * sx, 1.0 * sy], [0.55 * sx, 0.38], [0, 0.32], [-0.55 * sx, 0.38], [-0.75 * sx, 1.0 * sy], [-0.78 * sx, 1.85 * sy], [-0.55 * sx, 2.32 * sy]]);
  c.fill(); c.shadowBlur = 0; ink(c, 0.04);
  // belly
  c.fillStyle = '#f6a06e'; ell(c, 0, 0.95 * sy, 0.42 * sx, 0.5 * sy); c.fill();
  c.strokeStyle = 'rgba(160,50,20,.5)'; c.lineWidth = 0.025; for (let k = 0; k < 3; k++) { c.beginPath(); c.moveTo(-0.25, -(0.72 + k * 0.18) * sy); c.quadraticCurveTo(0, -(0.68 + k * 0.18) * sy, 0.25, -(0.72 + k * 0.18) * sy); c.stroke(); }
  // horns
  c.fillStyle = '#f4e3c8';
  for (const sd of [-1, 1]) { c.beginPath(); c.moveTo(sd * 0.28, -2.36 * sy); c.quadraticCurveTo(sd * 0.5, -2.62 * sy, sd * 0.56, -2.78 * sy); c.quadraticCurveTo(sd * 0.36, -2.6 * sy, sd * 0.14, -2.4 * sy); c.closePath(); c.fill(); ink(c, 0.03); }
  // face
  const ey = 2.0 * sy;

    c.strokeStyle = INK; c.lineWidth = 0.05;
    for (const sd of [-1, 1]) { c.beginPath(); c.arc(sd * 0.24, -ey, 0.1, 0.1 * Math.PI, 0.9 * Math.PI); c.stroke(); }
  } else {
    c.fillStyle = rage ? '#ffe14a' : '#fff';

    for (const sd of [-1, 1]) { ell(c, sd * 0.24, ey, 0.13, 0.11); c.fill(); }
    c.shadowBlur = 0;
    c.fillStyle = rage ? '#b51a00' : INK; for (const sd of [-1, 1]) { circ(c, sd * 0.22, ey - 0.02, rage ? 0.035 : 0.05); c.fill(); }

  }

  c.fillStyle = '#3b0606';
  c.beginPath(); c.moveTo(-0.36, -my); c.quadraticCurveTo(0, -(my + 0.08), 0.36, -my); c.quadraticCurveTo(0, -(my - open * 2), -0.36, -my); c.fill(); ink(c, 0.03);
  c.fillStyle = '#fff';
  for (const sd of [-1, 1]) { c.beginPath(); c.moveTo(sd * 0.26, -(my + 0.03)); c.lineTo(sd * 0.2, -(my - 0.1 - open * 0.3)); c.lineTo(sd * 0.14, -(my + 0.04)); c.fill(); }
  if (tired) { c.fillStyle = '#ff7aa2'; ell(c, 0.05, my - open * 1.2, 0.1, 0.07); c.fill(); }

}

// ------------------------------------------------ GOR, the doubt monster (also the coach at the tryout)
function drawGor(c, x, y, s, m, t, coach) {
  const ko = m && m.ko > 0 ? Math.min(1, m.ko / 0.9) : 0;
  c.save(); c.translate(x, y); c.scale(s, s);

  if (m && m.hurt > 0) c.translate(Math.sin(t * 60) * 0.03 * m.hurt, 0);
  const sway = Math.sin(t * 1.3) * 0.03;

  for (const sd of [-1, 1]) {
    limb(c, [sd * 0.13, 1.25], [sd * 0.2, 0.08], sd * 0.02, 0.15, '#2b2d6e');

  // whistle
  c.strokeStyle = '#ddd'; c.lineWidth = 0.012; c.beginPath(); c.moveTo(-0.12, -2.18); c.quadraticCurveTo(0, -1.85, 0.12, -2.18); c.stroke();
  c.fillStyle = '#c9ced8'; c.fillRect(-0.04, -1.9, 0.09, 0.05);
  // arms: one points, one holds the clipboard
  const point = m && (m.laugh > 0 || m.taunt) ? 1 : 0;
  limb(c, [-0.3, 2.08], [-0.42, 1.35], -0.08, 0.1, '#2b2d6e');
  c.fillStyle = '#8f88b8'; circ(c, -0.42, 1.35, 0.06); c.fill(); ink(c, 0.02);
  c.fillStyle = '#c08a4a'; c.save(); c.translate(-0.5, -1.45); c.rotate(-0.2); c.fillRect(-0.12, -0.17, 0.24, 0.32); c.fillStyle = '#fff'; c.fillRect(-0.1, -0.12, 0.2, 0.25); c.fillStyle = '#9aa'; c.fillRect(-0.04, -0.19, 0.08, 0.05); c.restore();
  limb(c, [0.3, 2.08], point ? [0.75, 2.2] : [0.42, 1.3], point ? -0.05 : 0.08, 0.1, '#2b2d6e');
  c.fillStyle = '#8f88b8'; circ(c, point ? 0.75 : 0.42, point ? 2.2 : 1.3, 0.06); c.fill(); ink(c, 0.02);
  // head
  const hy = 2.52;
  c.fillStyle = '#8f88b8'; ell(c, 0, hy, 0.33, 0.36); c.fill(); ink(c);
  // the eye
  const blink = (t % 4.3) < 0.12 ? 0.2 : 1, ex = 0, ey = hy + 0.04;
  c.fillStyle = '#fffbea'; ell(c, ex, ey, 0.17, 0.15 * blink); c.fill(); ink(c, 0.03);
  if (blink > 0.5) {
    const lx = m && m.lookX !== undefined ? m.lookX : 0;
    const gi = c.createRadialGradient(ex + lx * 0.05, -ey, 0.01, ex + lx * 0.05, -ey, 0.09);
    gi.addColorStop(0, '#fff7a8'); gi.addColorStop(1, coach ? '#4aa36a' : '#c9b81f');
    c.fillStyle = gi; circ(c, ex + lx * 0.05, ey, 0.09); c.fill();
    c.fillStyle = INK; circ(c, ex + lx * 0.055, ey, 0.04); c.fill();
    c.fillStyle = '#fff'; circ(c, ex + lx * 0.05 + 0.03, ey + 0.03, 0.015); c.fill();
  }

  c.beginPath(); c.moveTo(-0.2, -(ey + 0.2)); c.quadraticCurveTo(0, -(ey + (m && m.laugh > 0 ? 0.3 : 0.2)), 0.2, -(ey + 0.15)); c.stroke();
  c.lineWidth = 0.025; c.beginPath(); c.moveTo(-0.12, -(hy - 0.2)); c.quadraticCurveTo(0.02, -(hy - (m && m.laugh > 0 ? 0.28 : 0.23)), 0.15, -(hy - 0.15)); c.stroke();

  c.beginPath(); c.arc(0, -(hy + 0.18), 0.3, Math.PI, 0); c.closePath(); c.fill(); ink(c, 0.03);
  c.fillRect(-0.05, -(hy + 0.2), 0.42, 0.06); c.strokeRect(-0.05, -(hy + 0.2), 0.42, 0.06);
  c.fillStyle = '#fff'; c.textAlign = 'center'; c.textBaseline = 'middle'; textM(c, 'G', 0, -(hy + 0.31), 0.17);

}

// ------------------------------------------------ the shadow (YOU): a towering mirror of Zoom that shrinks as you score
function drawMirror(c, x, y, s, m, t) {
  const k = (m.size || 1) * 1.85, ko = m.ko > 0 ? Math.min(1, m.ko / 1.2) : 0;
  c.save();
  c.globalAlpha = 1 - ko * 0.85;
  // smoke around the edges
  for (let i = 0; i < 10; i++) {
    const a = i / 10 * TAU + t * 0.6, ph = (t * 0.7 + i * 0.13) % 1;
    c.fillStyle = 'rgba(124,92,255,' + (0.18 * (1 - ph)) + ')';
    c.beginPath(); c.arc(x + Math.cos(a) * 0.45 * k * s, y - (0.75 + Math.sin(a) * 0.55 + ph * 0.6) * k * s, (0.1 + ph * 0.14) * k * s, 0, TAU); c.fill();
  }
  c.shadowColor = '#9d7bff'; c.shadowBlur = 18;
  const pose = m.air ? 'block' : m.laugh > 0 ? 'cheer' : 'dribble';
  drawKid(c, x, y, s * k * (1 - ko * 0.3), { front: true, shadow: true, pose, jump: (m.jump || 0) / k, t, handY: 0.8, crouch: m.recover > 0 ? 0.05 : 0 });
  c.restore();
}

// ------------------------------------------------ balls
function drawBall(c, x, y, r, skin, spin, alpha) {
  const B = BALL_BY[skin] || BALLS[0];
  c.save(); c.globalAlpha = alpha === undefined ? 1 : alpha;
  if (B.glow) { c.shadowColor = B.glow; c.shadowBlur = r * 0.7; }
  let g;
  if (B.rainbow) { g = c.createLinearGradient(x - r, y - r, x + r, y + r); g.addColorStop(0, B.a); g.addColorStop(0.5, B.c); g.addColorStop(1, B.b); }
  else { g = c.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.1, x, y, r); g.addColorStop(0, B.a); g.addColorStop(1, B.b); }
  c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill();
  c.shadowBlur = 0;
  if (B.id === 'street') { // red, white and blue panels
    c.save(); c.beginPath(); c.arc(x, y, r, 0, TAU); c.clip();
    c.fillStyle = B.c; c.beginPath(); c.ellipse(x, y, r * 1.1, r * 0.45, spin, 0, TAU); c.fill();
    c.fillStyle = B.b; c.beginPath(); c.ellipse(x + Math.cos(spin) * r * 0.75, y + Math.sin(spin) * r * 0.75, r * 0.5, r * 0.32, spin, 0, TAU); c.fill();
    c.restore();
  }
  if (B.stars) { c.fillStyle = '#fff'; for (let i = 0; i < 6; i++) { const a = spin + i * 1.7, d = r * (0.25 + (i % 3) * 0.22); c.fillRect(x + Math.cos(a) * d, y + Math.sin(a) * d, Math.max(1, r * 0.08), Math.max(1, r * 0.08)); } }
  // seams
  c.strokeStyle = B.line; c.lineWidth = Math.max(1, r * 0.09);
  c.save(); c.beginPath(); c.arc(x, y, r, 0, TAU); c.clip();
  c.beginPath(); c.moveTo(x + Math.cos(spin) * -r, y + Math.sin(spin) * -r); c.lineTo(x + Math.cos(spin) * r, y + Math.sin(spin) * r); c.stroke();
  const a2 = spin + Math.PI / 2, ox = Math.cos(spin), oy = Math.sin(spin);
  c.beginPath(); c.ellipse(x + ox * r * 0.95, y + oy * r * 0.95, r * 0.55, r * 1.05, a2 + Math.PI / 2, 0, TAU); c.stroke();
  c.beginPath(); c.ellipse(x - ox * r * 0.95, y - oy * r * 0.95, r * 0.55, r * 1.05, a2 + Math.PI / 2, 0, TAU); c.stroke();
  c.restore();
  c.strokeStyle = 'rgba(0,0,0,.45)'; c.lineWidth = Math.max(1, r * 0.08); c.beginPath(); c.arc(x, y, r, 0, TAU); c.stroke();
  c.fillStyle = 'rgba(255,255,255,.28)'; c.beginPath(); c.ellipse(x - r * 0.35, y - r * 0.4, r * 0.3, r * 0.18, -0.6, 0, TAU); c.fill();
  c.restore();
}

// portraits for the story scenes: a head-and-shoulders shot on a small canvas
function drawPortrait(cv, who, t) {
  const c = cv.getContext('2d'), w = cv.width, h = cv.height;
  c.clearRect(0, 0, w, h);
  const bg = { zoom: ['#2f6bff', '#123a9a'], gor: ['#6c4bd8', '#2a1660'], boom: ['#ff4b33', '#7a1408'], you: ['#3a2766', '#0d0820'], narr: ['#333', '#111'] }[who] || ['#333', '#111'];
  const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, bg[0]); g.addColorStop(1, bg[1]);
  c.fillStyle = g; c.fillRect(0, 0, w, h);
  const m = { mood: 'calm', jump: 0, arms: 0.2, hurt: 0, laugh: 0, ko: 0, size: 0.75, recover: 0, air: false, taunt: null };
  c.save();
  if (who === 'zoom') drawKid(c, w / 2, h * 1.95, h * 1.35, { front: true, pose: 'dribble', t, smile: true });
  else if (who === 'you') { c.shadowColor = '#9d7bff'; c.shadowBlur = 12; drawKid(c, w / 2, h * 1.95, h * 1.35, { front: true, shadow: true, pose: 'dribble', t }); }
  else if (who === 'gor') drawGor(c, w / 2, h * 3.15, h * 1.15, m, t);
  else if (who === 'boom') { m.mood = 'rage'; drawBoom(c, w / 2, h * 2.35, h * 0.95, m, t); }
  else { c.fillStyle = 'rgba(255,255,255,.85)'; c.font = '700 ' + (h * 0.5) + 'px Rubik, Arial'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('🏀', w / 2, h / 2); }
  c.restore();
}

// ---------------------------------------------------------------- render.js (camera over Zoom's shoulder, the arena, the meter, effects)
const THEMES = {

  boom: { bg: ['#3d0c08', '#100302'], wood: '#c98a4e', woodLine: 'rgba(90,40,15,.3)', apron: '#4d1610', paint: '#d4321e', line: '#ffffff', light: 'rgba(255,110,60,', led: ['#ff4b33', '#ffb02e'], crowd: 1, mood: 'rgba(255,40,0,' },
  gor: { bg: ['#1e1540', '#06051a'], wood: '#a9825d', woodLine: 'rgba(40,20,60,.3)', apron: '#251a48', paint: '#6c4bd8', line: '#ece6ff', light: 'rgba(190,150,255,', led: ['#a77bff', '#29d3ff'], crowd: 1, mood: 'rgba(120,80,255,' },
  you: { bg: ['#140b28', '#020106'], wood: '#5f4e66', woodLine: 'rgba(20,10,40,.35)', apron: '#120a24', paint: '#3a2a7a', line: '#c9b8ff', light: 'rgba(140,110,255,', led: ['#7c5cff', '#ff4fa3'], crowd: 0, mood: 'rgba(80,40,200,' },
  arena: { bg: ['#10213f', '#040914'], wood: '#d89c5c', woodLine: 'rgba(110,60,20,.28)', apron: '#143e80', paint: '#1d6fe0', line: '#ffffff', light: 'rgba(190,225,255,', led: ['#29d3ff', '#ffd21f'], crowd: 1, mood: 'rgba(0,0,0,' },
};
const CROWD_COLS = ['#e94560', '#2f6bff', '#ffd21f', '#3ee08f', '#ff8a3d', '#b48cff', '#f1faee', '#29d3ff'];
const Render = {
  cv: null, c: null, W: 0, H: 0, dpr: 1, f: 500, cx: 0, Y0: 0, parts: [], net: 0, netSide: 0, crowd: null, sx: 0, sy: 0,
  init(cv) {
    this.cv = cv; this.c = cv.getContext('2d');
    const rng = makeRng(7), crowd = [];
    for (let tier = 0; tier < 9; tier++) for (let a = 0; a < TAU; a += 0.034 + tier * 0.001) {
      crowd.push({ a: a + rng() * 0.012, tier, col: CROWD_COLS[rng.int(CROWD_COLS.length)], ph: rng() * TAU, seat: rng(), skin: ['#6b4a35', '#a8714a', '#e0b48a', '#3d2a1e'][rng.int(4)] });
    }

  },
  resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2), W = innerWidth, H = innerHeight;

    this.cv.style.width = W + 'px'; this.cv.style.height = H + 'px';
    this.f = Math.min(0.95 * H, 1.3 * W);
    this.cx = W / 2;
    this.Y0 = Math.min(H < W * 1.4 ? 0.4 * H : 0.355 * H, 0.94 * H - 0.62 * this.f);
    if (W > H * 1.2) this.Y0 = Math.min(this.Y0, 0.36 * H);
  },
  // ------------------------------------------------ camera
  cam() {
    const th = G.camTh, R = G.camR + CAM_BACK;
    this.cs = Math.sin(th); this.cc = Math.cos(th); this.cxw = R * this.cs; this.czw = R * this.cc;
    const sh = Save.data.settings.shake ? G.shake : G.shake * 0.2;
    this.sx = (Math.random() - 0.5) * 14 * sh; this.sy = (Math.random() - 0.5) * 10 * sh;

// music: a boom-bap loop per arena (16 steps per bar)
function boomBap(o) {
  return {
    bpm: o.bpm, div: 4, reset() {},
    play(m, t, step, spb) {
      const s = step % 16, bar = Math.floor(step / 16) % o.chords.length, ch = o.chords[bar];
      const swing = s % 2 ? spb * 0.18 : 0; t += swing;
      if (o.kick.includes(s)) m.kick(t, o.kv || 1);
      if (o.snare.includes(s)) { if (o.clap) m.clap(t, 0.9); else m.snare(t, 0.8); }
      if (s % 2 === 0 || o.hat16) m.hat(t, s % 4 === 2 ? 0.8 : 0.45, o.open && s === 14);
      if (o.bass[s] !== undefined) m.bass(t, mtof(ch[0] + o.bass[s]), spb * 2.5, 0.7, o.bright || 900);
      if (s === 0) m.pad(t, ch.slice(1).map(mtof), spb * 15, o.pad || 0.8);
      if (o.lead && o.lead[s] !== undefined && bar % 2 === 1) m.bell(t, mtof(ch[1] + 12 + o.lead[s]), spb * 2, 0.5);
    },
  };
}

const Input = {
  id: null, x0: 0, y0: 0, t0: 0, lx: 0, ly: 0, mode: 'none', dy: 0, dx: 0, keys: {},
  init(cv) {
    cv.addEventListener('pointerdown', (e) => this.down(e));
    addEventListener('pointermove', (e) => this.move(e));
    addEventListener('pointerup', (e) => this.up(e));
    addEventListener('pointercancel', (e) => this.up(e, true));
    addEventListener('keydown', (e) => this.key(e, true));
    addEventListener('keyup', (e) => this.key(e, false));
    addEventListener('blur', () => { this.keys = {}; if (G) G.keyMove = 0; if (this.mode === 'pending' && G) Game.cancel(); this.mode = 'none'; this.id = null; });
  },
  live() { return Main.state === 'play' && !Main.paused && G && G.started && !G.over; },
  down(e) {
    Snd.init();
    if (!this.live() || this.id !== null) return;
    this.id = e.pointerId; this.x0 = this.lx = e.clientX; this.y0 = this.ly = e.clientY; this.t0 = performance.now(); this.dy = 0; this.dx = 0;
    this.mode = Game.press() ? 'pending' : 'drag';
    if (Main.tutPress) Main.tutPress();
  },
  move(e) {
    if (e.pointerId !== this.id || !G) return;
    const dx = e.clientX - this.lx, dy = e.clientY - this.ly;
    this.lx = e.clientX; this.ly = e.clientY;
    if (this.mode === 'pending') {
      const moved = Math.hypot(e.clientX - this.x0, e.clientY - this.y0), age = performance.now() - this.t0;
      if (moved > 16 && (age < 240 || G.meter.p < 0.3)) { Game.cancel(); this.mode = 'drag'; this.dx = e.clientX - this.x0; this.dy = e.clientY - this.y0; }
      else return;
    } else { this.dx += dx; this.dy += dy; }
    if (this.mode !== 'drag' || !this.live()) return;
    const k = 2.6 / Math.max(320, Math.min(Render.W, 900));
    Game.move(dx * k);
    if (Math.abs(this.dy) > 55 && Math.abs(this.dy) > Math.abs(this.dx) * 1.4) { Game.setRange(this.dy > 0); this.dy = 0; this.dx = 0; }
  },
  up(e, cancel) {
    if (e.pointerId !== this.id) return;
    this.id = null;
    if (this.mode === 'pending' && G) { if (cancel) Game.cancel(); else Game.release(); }
    this.mode = 'none';
  },
  key(e, down) {
    const k = e.code;
    if (down && (k === 'Escape' || k === 'KeyP')) { if (Main.state === 'play' && !G.over) { e.preventDefault(); UI.pause(); } return; }
    if (!G || Main.state !== 'play') return;
    if (['Space', 'Enter', 'KeyJ', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'KeyA', 'KeyD', 'KeyW', 'KeyS', 'KeyF', 'ShiftLeft', 'ShiftRight'].includes(k)) e.preventDefault();
    if (e.repeat) return;
    Snd.init();
    this.keys[k] = down;
    if (!this.live()) { G.keyMove = 0; return; }
    if (k === 'Space' || k === 'Enter' || k === 'KeyJ') { if (down) { if (Game.press() && Main.tutPress) Main.tutPress(); } else Game.release(); }
    if (down && (k === 'KeyF' || k === 'ShiftLeft' || k === 'ShiftRight')) Game.fake();
    if (down && (k === 'ArrowUp' || k === 'KeyW')) Game.setRange(false);
    if (down && (k === 'ArrowDown' || k === 'KeyS')) Game.setRange(true);
    G.keyMove = (this.keys.ArrowRight || this.keys.KeyD ? 1 : 0) - (this.keys.ArrowLeft || this.keys.KeyA ? 1 : 0);
  },
};

      this.set('hHp', 'hp', G.hp, (e, v) => { e.style.width = (v / G.hpMax * 100) + '%'; });
      this.set('hHpT', 'hpt', G.hp, (e, v) => { e.textContent = G.mid === 'tryout' ? (G.hpMax - v) + ' / 3 shots' : v + ' / ' + G.hpMax; });
      const mood = G.mon ? (G.mon.id === 'boom' ? { rage: 'RAGE', tired: 'TIRED', windup: '…', calm: '' }[G.mon.mood] : G.mon.id === 'gor' && G.mon.inBeam ? 'STARING' : G.mon.id === 'you' && (G.mon.air || G.mon.recover > 0) ? 'BIT!' : '') : '';
      this.set('hMood', 'mood', mood, (e, v) => { e.textContent = v; e.className = v ? 'on ' + v.toLowerCase().replace(/[^a-z]/g, '') : ''; });
    }
  },
  hint(t) { if (t === this.hintText) return; this.hintText = t; const e = $('hHint'); e.textContent = t; e.classList.toggle('on', !!t); },
  // ------------------------------------------------ results
  results(r) {
    const stat = (k, v) => `<div><b>${v}</b><small>${k}</small></div>`;
    const stats = `<div class="stats">${stat('Shots made', G.makes + '/' + G.shots)}${stat('Perfect', G.perfects)}${stat('Best streak', G.bestStreak)}${G.threes && G.mode !== 'shoot' ? stat('Threes', G.threes) : ''}</div>`;
    const unlocks = r.unlocks.length ? `<p class="unlock">New ball: <b>${r.unlocks.map((b) => BALL_BY[b].name).join(', ')}</b></p>` : '';
    if (G.mode === 'shoot') {
      const md = medalFor(G.shoot.pts);
      this.modal(`<header><small>SHOOTAROUND</small><h2>${G.shoot.pts} POINTS</h2></header>
        ${md ? '<div class="medal" style="--m:' + md[2] + '">' + md[1].toUpperCase() + '</div>' : '<p class="lead">Bronze at 10 points.</p>'}
        ${r.best ? '<p class="unlock">New best!</p>' : '<p class="lead">Best: ' + Save.data.best.shoot + '</p>'}
        ${stats}${unlocks}
        <div class="stack"><button class="big hot" data-go="restart"><b>AGAIN</b></button><button class="small" data-go="quit">Menu</button></div>`, 'resbox');
      return;
    }
    const M = MONSTERS[G.mid];
    if (G.won) {
      const stars = G.mid === 'tryout' ? '' : '<div class="stars">' + [1, 2, 3].map((k) => '<i class="' + (r.stars >= k ? 'on' : '') + '" style="animation-delay:' + (k * 0.18) + 's">★</i>').join('') + '</div>';
      this.modal(`<header><small>${G.mid === 'tryout' ? 'TRYOUT' : M.title.toUpperCase()}</small><h2>${G.mid === 'tryout' ? 'YOU MADE THE TEAM' : M.name + ' DEFEATED'}</h2></header>
        ${stars}${M.lesson ? '<q>' + M.lesson + '</q>' : ''}${stats}${unlocks}
        <div class="stack"><button class="big hot" data-go="next"><b>CONTINUE</b></button><div class="row"><button class="small" data-go="restart">Replay</button><button class="small" data-go="map">Story</button></div></div>`, 'resbox win');
    } else {
      this.modal(`<header><small>${M.name}</small><h2>KNOCKED DOWN</h2></header>
        <p class="lead">${{ boom: 'Too close to an angry BOOM? Move first, or wait until he’s tired.', gor: 'Inside the stare, listen to the tone: let go just before it peaks.', you: 'Tap to fake first. Shoot while he’s in the air or landing.' }[G.mid]}</p>
        ${stats}
        <div class="stack"><button class="big hot" data-go="restart"><b>GET BACK UP</b></button><button class="small" data-go="map">Story</button></div>`, 'resbox lose');
    }
  },
  ending() {
    this.modal(`<div class="end"><small>THE MONSTER LEAGUE</small><h2>CHAMPION</h2>
      <p>Zoom beat Anger, Doubt and the voice in his own head.</p><q>Courage and practice matter more than size.</q>
      <p class="unlock">${Save.data.story.you ? 'Galaxy ball unlocked' : ''}</p>
      <div class="stack"><button class="big hot" data-go="shoot"><b>SHOOTAROUND</b></button><button class="small" data-go="map">Story</button><button class="small" data-go="quit">Menu</button></div></div>`, 'resbox win');
  },
};

// ---------------------------------------------------------------- main.js (boot, flow between screens, the frame loop, game events)
const Main = {
  state: 'title', paused: false, cfg: null, last: 0, overShown: false, res: null, drib: 0, count: 0,
  boot() {
    Save.load();
    Render.init($('cv')); Render.resize();
    Input.init($('cv')); UI.init();
    Snd.onInit = () => this.music();
    Save.onRemote = () => { if (this.state === 'title' && !$('screen').hidden && $('screen').className === 'scr-title') UI.title(); };
    Save.cloudInit();
    addEventListener('resize', () => Render.resize());
    document.addEventListener('visibilitychange', () => { if (document.hidden && this.state === 'play' && G && G.started && !G.over) UI.pause(); });
    addEventListener('pointerdown', () => Snd.init(), true);
    this.toTitle();
    this.last = performance.now();
    requestAnimationFrame((t) => this.frame(t));
  },
  demoMon() { const s = Save.data.story; const pool = s.you ? ['boom', 'gor', 'you'] : s.gor ? ['boom', 'gor'] : ['boom']; return pool[Math.floor(Math.random() * pool.length)]; },
  toTitle(map) {
    this.state = 'title'; this.paused = false; Sfx.toneStop();
    UI.hudHide(); UI.close(); $('scene').hidden = true;
    Game.start({ mode: 'demo', demoMon: this.demoMon() });
    if (map) UI.story(); else UI.title();
    this.music();
  },
  play(cfg) {
    this.cfg = cfg; UI.hide(); UI.close();
    Game.start(cfg);
    this.state = 'play'; this.paused = false; this.overShown = false; this.res = null;
    UI.hudStart(); this.music();
    if (cfg.mode === 'shoot') this.count = 3.2; else G.started = true;
  },
  story(mid) {
    this.cfg = { mode: 'story', mid };
    UI.hide(); UI.close(); UI.hudHide();
    Game.start(this.cfg);
    this.state = 'scene'; this.paused = false; this.overShown = false;
    this.music();
    UI.scene(SCENES[mid], () => UI.tip(mid, () => this.begin()));
  },
  begin() { this.state = 'play'; G.started = true; UI.hudStart(); this.music(); },
  restart() {
    if (!this.cfg) return this.toTitle();
    if (this.cfg.mode === 'story') { Game.start(this.cfg); this.overShown = false; this.paused = false; this.begin(); }
    else this.play(this.cfg);
  },
  resume() { this.paused = false; },
  afterWin() {
    const mid = this.cfg.mid, i = STORY.indexOf(mid);
    this.state = 'scene'; UI.hudHide();
    UI.scene(SCENES[mid + 'Win'], () => {
      if (mid === 'you') { this.state = 'over'; UI.ending(); Render.confetti(); Sfx.win(); }
      else this.story(STORY[i + 1]);
    });
  },
  music() {
    if (!Snd.mx) return;
    if (this.state === 'title' || !G || G.mode === 'demo') { Music.start(SONGS.menu); return; }
    const key = G.mode === 'shoot' ? 'arena' : G.mode === 'practice' || G.mid === 'tryout' ? 'gym' : G.mid;
    Music.start(SONGS[key] || SONGS.menu);
  },
  over(won) {
    const s = Save.data, before = BALLS.filter((b) => !b.need(s)).map((b) => b.id);
    const r = { stars: 0, unlocks: [], best: false };
    s.stats.games++;
    s.best.streak = Math.max(s.best.streak || 0, G.bestStreak);
    if (G.mode === 'story' && won) { r.stars = G.mid === 'tryout' ? 1 : Math.max(1, G.hearts); s.story[G.mid] = Math.max(s.story[G.mid] || 0, r.stars); }
    if (G.mode === 'shoot' && G.shoot.pts > (s.best.shoot || 0)) { s.best.shoot = G.shoot.pts; r.best = true; }
    r.unlocks = BALLS.filter((b) => !b.need(s) && !before.includes(b.id)).map((b) => b.id);
    Save.persist();
    this.res = r;
  },
  hintFor() {
    if (!G || G.over || !G.started || this.state !== 'play') return '';
    const z = G.z, m = G.mon, since = G.t - (G.relT || -9), r = G.lastRes;
    if (G.mode === 'shoot') return G.shoot.walking ? 'Next rack…' : G.shoot.n === 4 && z.hasBall ? 'Money ball: worth 2!' : G.makes + G.shots === 0 ? 'Hold, then let go in the green' : '';
    if (since < 1.6 && r && !r.made && r.kind !== 'block' && (G.tut >= 0 || G.mode === 'practice')) return r.e < 0 ? 'A bit early. Let go nearer the top.' : 'A bit late. Let go a little sooner.';
    if (G.tut === 0) return 'Hold anywhere to jump · let go in the green';
    if (G.tut === 1) return 'Drag left or right to move around the arc';
    if (G.tut === 2) return 'Swipe down to step back for a three';
    if (G.mode === 'practice') return G.shots === 0 ? 'Hold to shoot · drag to move · swipe down for threes' : '';
    if (!m) return '';
    if (m.id === 'boom') {
      if (m.mood === 'windup') return 'He’s about to blow…';
      if (m.mood === 'rage') return 'RAGE! He blocks everything. Wait.';
      if (m.mood === 'tired') return 'He’s out of breath. Shoot now!';
      return Game.contested() ? 'He’s on you. Drag to get open.' : z.state === 'charge' ? '' : 'Open! Shoot before he catches up.';
    }
    if (m.id === 'gor') return m.inBeam ? 'In his stare: trust the tone' : z.state === 'charge' ? '' : 'Shoot outside his stare';
    if (m.id === 'you') {
      if (m.fog > 0) return 'Shoot through the doubt';
      if (m.air || m.recover > 0) return 'He bit! Shoot now!';
      return Game.contested() ? 'Tap to fake · shoot when he jumps' : '';
    }
    return '';
  },
  tutPress() { /* the first touch is handled by the hint itself */ },
  frame(now) {
    requestAnimationFrame((t) => this.frame(t));
    let dt = (now - this.last) / 1000; this.last = now;
    if (!(dt > 0)) dt = 0; if (dt > 0.05) dt = 0.05;
    Music.pump();
    if (G && !this.paused) {
      if (this.count > 0) {
        const before = Math.ceil(this.count);
        this.count -= dt;
        const after = Math.ceil(this.count);
        if (after !== before && after > 0 && after <= 3) { G.pops.push({ text: String(after), scr: [0.5, 0.38], t: 0, size: 2.2, col: '#ffd21f', life: 0.9 }); Sfx.beep(false); }
        if (this.count <= 0) { G.started = true; G.pops.push({ text: 'GO!', scr: [0.5, 0.38], t: 0, size: 2.4, col: '#3ee08f', life: 0.9 }); Sfx.beep(true); }
      }
      Game.update(dt);
      if (G.meter.on) Sfx.toneSet(G.meter.p);
      // dribble sounds
      const z = G.z, par = Math.floor(z.dribble);
      if (par !== this.drib) { this.drib = par; if (z.hasBall && (z.state === 'idle' || z.state === 'move') && this.state !== 'title' && !G.over) Sfx.dribble(); }
      if (G.mon && G.mon.id === 'gor' && G.mon.inBeam && this.state === 'play') Sfx.whisper();
      if (G.mode === 'demo' && G.t > 30) Game.start({ mode: 'demo', demoMon: this.demoMon() });
      if (G.tut === 1 && Math.abs(G.z.th) > 0.35) G.tut = 2;
      if (this.state === 'play' && G.over && !this.overShown && G.overT > (G.mode === 'shoot' ? 1.4 : G.won ? 2.0 : 1.6)) {
        this.overShown = true; this.state = 'over'; UI.hudHide(); UI.results(this.res);
      }
    }
    Render.frame(this.paused ? 0 : dt);
    if (this.state === 'play') { UI.hud(); UI.hint(this.hintFor()); }
  },
};
function buzz(ms) { if (Save.data && Save.data.settings.haptics) vibrate(ms); }
function pop(text, pos, col, size, sub, life) { G.pops.push({ text, pos, t: 0, col, size, sub, life }); }
const RIM_POP = [0, HOOP_H + 0.75, 0];
function monTop() { const m = G.mon, [x, z] = polar(m.r, m.th); return [x, (m.id === 'boom' ? 2.9 : m.id === 'gor' ? 3.1 : 1.6 * m.size * 1.85) + m.jump, z]; }
// everything the game reports ends up here: sounds, pops, effects
function onEvent(k, a, b) {
  const demo = !G || G.mode === 'demo';
  switch (k) {
    case 'charge': if (!demo) Sfx.toneStart(); break;
    case 'cancel': Sfx.toneStop(); break;
    case 'release': Sfx.toneStop(); Sfx.release(); G.relT = G.t; G.relP = G.meter.p; break;
    case 'fake': Sfx.fake(); break;
    case 'bite': if (!demo) { pop('BIT!', monTop(), '#3ee08f', 0.8); buzz(15); } break;
    case 'range': if (!demo) { UI.toast(a ? 'Behind the line: threes!' : 'Mid-range', 1100); Sfx.squeak(); if (G.tut === 2) G.tut = 3; } break;
    case 'rim': Sfx.rim(); break;
    case 'board': Sfx.board(); break;
    case 'net': Render.net = 1; Sfx.swish(a); break;
    case 'bounce': if (a > 1.5) Sfx.bounce(a); break;
    case 'block': Sfx.block(); G.shake = Math.max(G.shake, 0.5); buzz(60); break;
    case 'catch': case 'pickup': Sfx.catchIt(); break;
    case 'rack': Sfx.squeak(); break;
    case 'make': {
      if (demo) { Sfx.cheer(0.5); G.cheer = 0.7; break; }
      const r = a, words = { swish: 'SWISH!', rollin: 'BUCKET!', rattle: 'IN AND OUT… IN!', bank: 'OFF THE GLASS!' };
      const txt = r.perfect ? 'PERFECT!' : r.money ? 'MONEY!' : words[r.kind];
      pop(txt, RIM_POP, r.perfect ? '#ffd21f' : r.money ? '#ff4fa3' : '#ffffff', r.perfect ? 1.15 : 0.95, '+' + b);
      if (r.perfect) { Sfx.perfect(); G.flash = 0.5; Render.burst([0, HOOP_H, 0], 26, ['#ffd21f', '#fff3b0', '#ffffff'], 260, 4); buzz(25); }
      else { Render.burst([0, HOOP_H - 0.3, 0], 12, ['#ffffff', '#ffd21f'], 160, 3); buzz(12); }
      if (G.mon) { pop('-' + b, monTop(), MONSTERS[G.mon.id].color, 0.75, null, 0.9); Sfx.hit(); }
      Sfx.cheer(r.perfect || G.fire ? 1.2 : 0.8); G.cheer = 1;
      if (G.tut === 0) G.tut = 1; else if (G.tut === 2 && r.three) G.tut = 3;
      break;
    }
    case 'miss': {
      G.lastMissT = G.t;
      if (demo) break;
      const r = a;
      pop(r.kind === 'block' ? 'BLOCKED!' : r.kind === 'air' ? 'AIRBALL!' : 'MISS', r.kind === 'block' ? monTop() : RIM_POP, r.kind === 'block' ? '#ff5a4a' : '#ffb3b3', r.kind === 'block' ? 1.05 : 0.85);
      if (r.kind !== 'block') Sfx.ooh();
      break;
    }
    case 'heart': Sfx.heart(a); if (a > 0) pop('+♥', [polar(G.z.r, G.z.th)[0], 2.2, polar(G.z.r, G.z.th)[1]], '#ff4f6d', 0.8); else buzz(40); break;
    case 'fire': if (!demo) { Sfx.fire(); pop('ON FIRE!', [0, HOOP_H + 1.4, 0], '#ff8a1a', 1.2, '+1 damage', 1.4); } break;
    case 'mood':
      if (demo || !G.started) break;
      if (a === 'windup') { Sfx.roar(); buzz(80); }
      if (a === 'rage') pop('RAGE!', monTop(), '#ff3b1f', 1.1);
      if (a === 'tired') { Sfx.pant(); pop('TIRED', monTop(), '#8fd3ff', 0.9); }
      break;
    case 'stomp': if (!demo) { Sfx.stomp(); buzz(30); } break;
    case 'fog': Sfx.whisper(); break;
    case 'over':
      Sfx.toneStop();
      if (G.mode === 'shoot') Sfx.buzzer();
      else if (a) { Sfx.win(); Render.confetti(); G.cheer = 3; } else Sfx.lose();
      buzz(a ? 40 : 150);
      Main.over(a);
      break;
  }
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => Main.boot());
else Main.boot();

})();</script>
