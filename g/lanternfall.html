        for (let x = 40; x < 300; x += 46) if (rng.chance(0.3)) L.pegSym(x, y + 62);
      }
    },
  },
  spiral: {
    name: 'Whirlpool',
    make(L, rng) {
      const cx = 300, cy = rng.range(470, 500), arms = rng.pick([2, 3]), tight = rng.range(13, 17);
      for (let a = 0; a < arms; a++) {
        const base = (a * TAU) / arms + rng.range(0, 0.4);
        let th = 0.9;
        while (th < 16) {
          const r = 34 + tight * th;
          if (r > 300) break;
          L.peg(cx + r * Math.cos(th + base), cy + r * Math.sin(th + base) * 1.08);
          th += 44 / Math.sqrt(r * r + tight * tight);
        }
      }
      L.peg(cx, cy);
    },
  },
  waves: {
    name: 'River Ripples',
    make(L, rng) {
      const amp = rng.range(18, 32), k = rng.range(0.016, 0.024);
      for (let j = 0; j < 7; j++) {
        const y0 = 224 + j * 90, bars = j % 2 === 1 && rng.chance(0.6);
        for (let x = 300; x > FIELD.x0; x -= 44) {
          const y = y0 + amp * Math.sin((x - 300) * k + j * 1.4);
          if (bars) {
            const x2 = x - 40, y2 = y0 + amp * Math.sin((x2 - 300) * k + j * 1.4);
            if (((300 - x) / 44) % 2 === 0) L.barSym(x2, y2, x, y);
          } else L.pegSym(x, y);
        }
      }
    },
  },
  diamonds: {
    name: 'Kite Market',
    make(L, rng) {
      const centers = [[300, 300], [168, 420], [300, 545], [168, 670], [300, 770]];
      for (const [cx, cy] of centers) {
        L.pegSym(cx, cy);
        for (let i = 0; i < 6; i++) {
          const a = (i * TAU) / 6 + Math.PI / 6;
          L.pegSym(cx + Math.cos(a) * 36, cy + Math.sin(a) * 36);
        }
        if (rng.chance(0.6)) for (let i = 0; i < 4; i++) {
          const a = (i * TAU) / 4 + Math.PI / 4;
          L.pegSym(cx + Math.cos(a) * 66, cy + Math.sin(a) * 66);
        }
      }
    },
  },
  lotus: {
    name: 'Lotus Pond',
    make(L, rng) {
      const cx = 300, cy = rng.range(475, 500), petals = rng.pick([6, 8]), curl = rng.range(0.16, 0.3);
      for (let k = 0; k < petals; k++) {
        const a0 = (k * TAU) / petals + Math.PI / petals;
        for (let s = 0; s < 7; s++) {
          const r = 64 + s * 36, a = a0 + curl * Math.sin(s * 0.8);
          L.peg(cx + Math.cos(a) * r, cy + Math.sin(a) * r * 1.05);
        }
      }
      for (let i = 0; i < 6; i++) L.peg(cx + Math.cos((i * TAU) / 6) * 34, cy + Math.sin((i * TAU) / 6) * 34);
    },
  },
  steps: {
    name: 'Hillside Steps',
    make(L, rng) {
      let x = 44, y = rng.range(214, 250);
      for (let i = 0; i < 7; i++) {
        L.barSym(x, y, x + 64, y + 20);
        L.pegSym(x + 86, y + 36);
        x += rng.range(20, 34);
        y += rng.range(70, 84);
        if (x > 200) x = 44 + rng.range(0, 30);
      }
      for (let y2 = 214; y2 < 790; y2 += 48) L.pegSym(300 - (((y2 / 48) | 0) % 2 ? 0 : 27), y2);
    },
  },
};
const TEMPLATE_KEYS = Object.keys(TEMPLATES);

function sideDeflectors(L, rng) {
  for (const y of [rng.range(320, 380), rng.range(560, 640)]) L.barSym(36, y, 92, y + 34);
}

function fillLattice(L, rng, want) {
  for (let tries = 0; tries < 400 && L.count() < want; tries++) {
    const x = rng.range(50, 300), y = rng.range(190, 790);
    L.pegSym(Math.round(x / 27) * 27, Math.round(y / 23) * 23);
  }
}

const BoardGen = {
  make(n, rng, opts) {
    opts = opts || {};
    const boss = opts.boss !== undefined ? opts.boss : bossFor(n);
    if (boss) return this[boss](n, rng, opts);
    // the first board always uses one of the denser, friendlier layouts
    const key = opts.template || rng.pick(n === 1 ? ['lattice', 'arches', 'columns', 'waves', 'steps'] : TEMPLATE_KEYS);
    const L = new Layout();
    TEMPLATES[key].make(L, rng);
    if (n >= 2 && rng.chance(0.5)) sideDeflectors(L, rng);
    if (L.count() < 62) fillLattice(L, rng, 66);
    while (L.count() > 98) {
      if (L.p.length > 20) L.p.splice(rng.int(0, L.p.length - 1), 1);
      else L.b.splice(rng.int(0, L.b.length - 1), 1);
    }
    const items = L.p.map((p) => new Lantern(p.x, p.y, 'cream')).concat(L.b.map((b) => new Bamboo(b.x1, b.y1, b.x2, b.y2, 'cream')));
    // a moving section from board 6, always from board 9
    if (n >= 9 || (n >= 6 && rng.chance(0.7))) this.addMotion(items, key, rng, n);
    this.assignTypes(items, n, rng, opts);
    return { items, name: TEMPLATES[key].name, template: key, boss: null, reds: items.filter((c) => c.type === 'red').length };
  },

  addMotion(items, key, rng, n) {
    if (key === 'rings' || key === 'lotus' || key === 'spiral') {
      // the whole pattern turns slowly around its middle
      let cx = 0, cy = 0;
      for (const c of items) { cx += c.cx; cy += c.cy; }
      cx /= items.length; cy /= items.length;
      const w = (rng.chance(0.5) ? 1 : -1) * rng.range(0.12, 0.2) * (n >= 9 ? 1.3 : 1);
      for (const c of items) {
        if (Math.hypot(c.cx - cx, c.cy - cy) < 300) c.mover = { type: 'orbit', cx, cy, w };
      }
      return;
    }
    // or two bands slide left and right in opposite directions
    const y0 = rng.range(260, 520), h = rng.range(90, 140);
    for (const [a, b, s] of [[y0, y0 + h, 1], [y0 + h + 90, y0 + h * 2 + 90, -1]]) {
      const ax = rng.range(26, 40) * s;
      for (const c of items) if (c.cy >= a && c.cy < b) c.mover = { type: 'slide', ax, w: rng.range(0.7, 1.0), ph: 0 };
    }
  },

  assignTypes(items, n, rng, opts) {
    const pegs = items.filter((c) => c.kind === 'peg');
    const pool = items.slice();
    // bronze orbs from board 3: they never break
    if (n >= 3) {
      const orbs = Math.min(9, 2 + Math.floor((n - 3) * 0.7));
      for (let i = 0; i < orbs && pegs.length; i++) {
        const c = pegs.splice(rng.int(0, pegs.length - 1), 1)[0];
        c.type = 'orb';
        pool.splice(pool.indexOf(c), 1);
      }
    }
    let reds = clamp(Math.round(pool.length * redShare(n)), 8, redCap(n));
    while (reds > 0 && pool.length) {
      const c = pool.splice(rng.int(0, pool.length - 1), 1)[0];
      c.type = 'red';
      reds--;
    }
    // double-paper lanterns need two hits, from board 5
    if (n >= 5) {
      const share = Math.min(0.3, 0.1 + 0.025 * (n - 5));
      for (const c of items) if (c.type !== 'orb' && rng.chance(share)) c.hp = c.maxHp = 2;
    }
    const creams = items.filter((c) => c.type === 'cream');
    for (let i = 0; i < 2 + (opts.extraJade || 0) && creams.length; i++) creams.splice(rng.int(0, creams.length - 1), 1)[0].type = 'jade';
  },

  // ---- bosses
  dragon(n, rng, opts) {
    const L = new Layout();
    const amp = 196, w = 0.5;
    const path = (t) => [300 + amp * Math.sin(w * t), 482 + 158 * Math.sin(2 * w * t + 0.6)];
    for (let x = 300; x > FIELD.x0; x -= 46) L.pegSym(x, 196 + (((300 - x) / 46) % 2 ? 22 : 0));
    for (let x = 300; x > FIELD.x0; x -= 46) L.pegSym(x, 716 + (((300 - x) / 46) % 2 ? 0 : 26));
    for (let y = 300; y < 680; y += 50) L.pegSym(52, y);
    L.barSym(36, 770, 104, 790);
    const items = L.p.map((p) => new Lantern(p.x, p.y, 'cream')).concat(L.b.map((b) => new Bamboo(b.x1, b.y1, b.x2, b.y2, 'cream')));
    const segs = 10 + Math.floor((n - 4) / 8) * 2;
    const head = new Lantern(300, 400, 'red', { r: 19, hp: 3, big: true, seg: 0, mover: { type: 'path', fn: path, delay: 0 } });
    head.head = true;
    items.push(head);
    for (let i = 1; i <= segs; i++) items.push(new Lantern(300, 400, 'red', { seg: i, mover: { type: 'path', fn: path, delay: i * 0.205 + 0.07 } }));
    const statics = items.filter((c) => !c.mover);
    for (let i = 0; i < 4; i++) statics.splice(rng.int(0, statics.length - 1), 1)[0].type = 'orb';
    const creams = items.filter((c) => c.type === 'cream');
    for (let i = 0; i < 2 + (opts.extraJade || 0); i++) creams.splice(rng.int(0, creams.length - 1), 1)[0].type = 'jade';
    return { items, name: BOSS_INFO.dragon.name, template: 'dragon', boss: 'dragon', reds: segs + 1 };
  },

  wheel(n, rng, opts) {
    const cx = 300, cy = 492, items = [];
    const wo = 0.3 * (n > 8 ? 1.25 : 1), wi = -0.42 * (n > 8 ? 1.25 : 1);
    for (let k = 0; k < 18; k++) {
      const a = (k * TAU) / 18;
      items.push(new Lantern(cx + Math.cos(a) * 180, cy + Math.sin(a) * 180, k % 3 === 1 ? 'cream' : 'red', { mover: { type: 'orbit', cx, cy, w: wo } }));
    }
    for (let k = 0; k < 10; k++) {
      const a = (k * TAU) / 10 + 0.3;
      items.push(new Lantern(cx + Math.cos(a) * 104, cy + Math.sin(a) * 104, k % 3 === 0 ? 'red' : 'cream', { mover: { type: 'orbit', cx, cy, w: wi } }));
    }
    for (let k = 0; k < 6; k++) {
      const a = (k * TAU) / 6 + 0.17;
      items.push(new Bamboo(cx + Math.cos(a) * 126, cy + Math.sin(a) * 126, cx + Math.cos(a) * 156, cy + Math.sin(a) * 156, 'cream', { mover: { type: 'orbit', cx, cy, w: wo } }));
    }
    const moon = new Lantern(cx, cy, 'orb', { r: 42, big: true });
    moon.moon = true;
    items.push(moon);
    const L = new Layout();
    for (const [x0, y0] of [[84, 226], [84, 760]]) {
      L.pegSym(x0, y0);
      for (let i = 0; i < 6; i++) L.pegSym(x0 + Math.cos((i * TAU) / 6) * 36, y0 + Math.sin((i * TAU) / 6) * 36);
    }
    for (let y = 330; y < 700; y += 52) L.pegSym(44, y);
    const side = L.p.map((p) => new Lantern(p.x, p.y, 'cream'));
    for (let i = 0; i < 2; i++) side[rng.int(0, side.length - 1)].type = 'red';
    items.push(...side);
    const creams = items.filter((c) => c.type === 'cream' && c.kind === 'peg');
    for (let i = 0; i < 2 + (opts.extraJade || 0); i++) creams.splice(rng.int(0, creams.length - 1), 1)[0].type = 'jade';
    return { items, name: BOSS_INFO.wheel.name, template: 'wheel', boss: 'wheel', reds: items.filter((c) => c.type === 'red').length };
  },

  kite(n, rng, opts) {
    const items = [], top = [300, 214], hx = 150, hy = 196, cy = top[1] + hy;
    const sway = { type: 'sway', cx: 300, cy: top[1], ax: 52, w: 0.55, rot: 0.1 };
    const corners = [[300, top[1]], [300 + hx, cy], [300, cy + hy], [300 - hx, cy]];
    for (let e = 0; e < 4; e++) {
      const [x1, y1] = corners[e], [x2, y2] = corners[(e + 1) % 4];
      for (let k = 0; k < 6; k++) items.push(new Lantern(lerp(x1, x2, k / 6), lerp(y1, y2, k / 6), 'cream', { mover: sway }));
    }
    items.push(new Bamboo(300, top[1] + 40, 300, cy + hy - 40, 'cream', { mover: sway }));
    items.push(new Bamboo(300 - hx + 40, cy, 300 - 22, cy, 'cream', { mover: sway }));
    items.push(new Bamboo(300 + 22, cy, 300 + hx - 40, cy, 'cream', { mover: sway }));
    for (let k = 1; k <= 7; k++) items.push(new Lantern(300 + 34 * Math.sin(k * 0.95), cy + hy + 10 + k * 25, 'cream', { mover: sway }));
    for (const [x, y] of [[46, 300], [554, 300], [46, 560], [554, 560], [60, 760], [540, 760]]) items.push(new Lantern(x, y, 'orb'));
    for (const [x, y] of [[100, 680], [500, 680], [130, 760], [470, 760], [50, 430], [550, 430], [92, 228], [508, 228]]) items.push(new Lantern(x, y, 'cream'));
    const kiteItems = items.filter((c) => c.mover && c.kind === 'peg');
    let reds = 18;
    while (reds > 0) {
      const c = kiteItems.splice(rng.int(0, kiteItems.length - 1), 1)[0];
      c.type = 'red';
      reds--;
    }
    const creams = items.filter((c) => c.type === 'cream' && c.kind === 'peg');
    for (let i = 0; i < 2 + (opts.extraJade || 0); i++) creams.splice(rng.int(0, creams.length - 1), 1)[0].type = 'jade';
    return { items, name: BOSS_INFO.kite.name, template: 'kite', boss: 'kite', reds: 18, windy: true };
  },
};

// ---------------------------------------------------------------- game.js
const G = {
  state: 'boot', attract: false,
  // screen mapping (set by App.resize): board point (x, y) -> device pixels (bx + x * s, by + y * s)
  pxW: 1, pxH: 1, css: 1, dpr: 1, s: 1, bx: 0, by: 0,
  cam: { x: BOARD_W / 2, y: BOARD_H / 2, z: 1, tx: BOARD_W / 2, ty: BOARD_H / 2, tz: 1 },
  timeR: 0, ts: 1, tsTarget: 1, acc: 0, hitstop: 0, slowAmt: 0,
  run: null, B: null, aim: Math.PI / 2, guide: null, guidePts: [], guideDirty: true, guideFrame: 0,
  embers: [], shot: null, settle: null, fast: false, closeCall: false, closeTarget: null, fireworks: [], fwT: 0,
  demo: null, phaseT: 0,
};

const has = (k) => !!(G.run && G.run.charms[k]);
const emberR = () => PHYS.er * (has('heavy') ? 1.3 : 1);

function newRun(mode, keeper, seed) {
  return {
    mode, keeper, seed, rng: new RNG(seed), board: 0, embers: 10, nextBonus: 0, score: 0, charms: {}, charmList: [],
    sight: 0, fox: 0, blazeNext: 0, twinNext: 0, phoenix: false,
    lit: 0, redsLit: 0, catches: 0, powers: 0, gold: 0, shots: 0, bestShot: 0, bosses: [], won: false, endless: false,
    id: Date.now() + '-' + seed, counted: { lit: 0, reds: 0, catches: 0, powers: 0, gold: 0, shots: 0, run: false },
  };
}

const GameSink = {
  moth: false,
  hit(c, impact, e) { Game.onHit(c, impact, e); },
  wall(e, side) { Game.onWall(e, side); },
  rim(e, imp) { if (imp > 80) Sfx.tap(0.6); },
  boat(e) { Game.onBoat(e); },
  slot(e, i) { Game.onSlot(e, i); },
  out(e) { Game.onOut(e); },
};

const Game = {
  // ------------------------------------------------------------ runs and boards
  startRun(mode, keeper) {
    const seed = mode === 'daily' ? hashStr('lanternfall-' + todayKey()) : (Math.random() * 2 ** 31) >>> 0;
    G.attract = false;
    G.run = newRun(mode, mode === 'daily' ? 'mira' : keeper, seed);
    FX.clear();
    G.fireworks = [];
    Music.setMode('calm');
    UI.onRunStart();
    this.nextBoard();
  },

  nextBoard() {
    const R = G.run;
    R.board++;
    const data = BoardGen.make(R.board, R.rng, { extraJade: has('seal') ? 1 : 0 });
    this.loadBoard(data, R.board);
    if (has('spirit')) setTimeout(() => { if (G.B && G.run === R) this.power(300, 470, null, true); }, 1300);
  },

  loadBoard(data, n) {
    const R = G.run;
    World.reset(data.items);
    const B = World.boat;
    B.halfW = 56 * (has('crane') ? 1.4 : 1);
    B.amp = 300 - B.halfW - 16;
    B.w = Math.min(0.9, 0.48 + 0.03 * (n - 1)) * (has('tortoise') ? 0.6 : 1);
    B.ph = (R ? R.rng.next() : Math.random()) * TAU;
    World.gMul = has('kite') ? 0.8 : 1;
    World.barRest = has('bamboo') ? 0.9 : PHYS.eBar;
    World.setTime(0);
    G.B = {
      n, name: data.name, template: data.template, boss: data.boss, windy: !!data.windy,
      redsTotal: data.reds, redsLeft: data.reds, shots: 0, score: 0, windUsed: false, cleared: false, feverPts: 0, cascadePts: 0,
      golds: [],
    };
    GameSink.moth = has('moth');
    G.embers = [];
    G.shot = null;
    G.settle = null;
    G.closeCall = false;
    G.cam.tx = BOARD_W / 2; G.cam.ty = BOARD_H / 2; G.cam.tz = 1;
    G.ts = G.tsTarget = 1;
    this.placeGold();
    this.newWind();
    G.guideDirty = true;
    if (G.attract) { G.state = 'title'; return; }
    // every board starts with a fresh pouch of embers
    R.embers = (n === 1 ? 12 : 10) + (R.charms.tea || 0) + R.nextBonus;
    R.nextBonus = 0;
    G.state = 'intro';
    G.phaseT = 0;
    const boss = data.boss ? BOSS_INFO[data.boss] : null;
    UI.boardIntro(n, data.name, boss ? boss.sub : data.reds + ' red lanterns', !!boss);
    Music.setMode(boss ? 'boss' : 'calm');
    if (boss) Sfx.boss(); else Sfx.board();
  },

  placeGold() {
    const B = G.B;
    for (const c of B.golds) if (!c.lit && !c.dead && c.type === 'gold') c.type = 'cream';
    B.golds = [];
    const pool = World.items.filter((c) => c.type === 'cream' && !c.lit && !c.dead);
    const rng = G.run ? G.run.rng : null;
    const n = has('rabbit') ? 2 : 1;
    for (let i = 0; i < n && pool.length; i++) {
      const c = pool.splice(Math.floor((rng ? rng.next() : Math.random()) * pool.length), 1)[0];
      c.type = 'gold';
      B.golds.push(c);
    }
  },

  newWind() {
    if (!G.B.windy) { World.wind = 0; return; }
    const rng = G.run ? G.run.rng : null;
    const v = ((rng ? rng.next() : Math.random()) * 2 - 1) * 170;
    World.wind = Math.round(v / 10) * 10;
    G.guideDirty = true;
  },

  mult() {
    const B = G.B, f = (B.redsTotal - B.redsLeft) / Math.max(1, B.redsTotal);
    return f >= 0.88 ? 10 : f >= 0.76 ? 5 : f >= 0.6 ? 3 : f >= 0.4 ? 2 : 1;
  },

  // ------------------------------------------------------------ aiming and firing
  setAim(a) {
    a = clamp(a, LAUNCH.minA, LAUNCH.maxA);
    if (Math.abs(a - G.aim) > 1e-5) { G.aim = a; G.guideDirty = true; }
  },

  guideBounces() {
    const R = G.run;
    if (!R) return 1;
    return 1 + (has('fuse') ? 1 : 0) + (R.sight > 0 ? 2 : 0);
  },

  fire() {
    if (G.state !== 'aim' && !(G.attract && G.state === 'title')) return false;
    const R = G.run, B = G.B, attract = G.attract;
    if (!attract) {
      if (R.embers <= 0) return false;
      R.embers--;
      R.shots++;
      if (R.sight > 0) R.sight--;
    }
    B.shots++;
    const v = World.launchVel(G.aim), m = World.mouth(G.aim);
    const e = new Ember(m[0], m[1], v[0], v[1], emberR());
    G.embers = [e];
    if (!attract && R.blazeNext) { e.blaze = R.blazeNext; R.blazeNext = 0; }
    if (!attract && R.twinNext) {
      for (let i = 0; i < R.twinNext; i++) {
        const a2 = Math.PI - G.aim + (i ? 0.12 : 0), v2 = World.launchVel(a2), m2 = World.mouth(a2);
        G.embers.push(new Ember(m2[0], m2[1], v2[0], v2[1], emberR()));
      }
      R.twinNext = 0;
    }
    G.shot = { points: 0, reds: 0, all: 0, multBonus: 0, bonuses: [], caught: 0, longShot: false, note: 0, t: 0, wallT: -9, firstRed: true, lastRedX: null, lastRedY: null, lit: [], goldHit: 0, slots: [] };
    G.acc = 0;
    G.state = attract ? 'demo-shot' : 'shot';
    G.fast = false;
    FX.burst(m[0], m[1], 14, PAL.ember, 60, 260, 0.45, 2.2);
    G.recoil = 1;
    if (!attract) { Sfx.launch(); Music.setLayer(1); UI.embers(); vibrate(8); }
    return true;
  },

  // ------------------------------------------------------------ the frame
  update(dtR) {
    G.timeR += dtR;
    if (G.state === 'paused' || G.state === 'boot') { FX.update(0, dtR); return; }
    G.ts += (G.tsTarget - G.ts) * Math.min(1, dtR * 10);
    G.slowAmt = sat((1 - G.ts) / 0.75);
    if (G.recoil) G.recoil = Math.max(0, G.recoil - dtR * 5);
    const st = G.state;
    if (st === 'shot' || st === 'demo-shot') this.updateShot(dtR);
    else {
      World.setTime(World.t + dtR);
      if (st === 'aim' || st === 'title') {
        if (G.guideDirty || (World.moving && (++G.guideFrame & 1) === 0)) {
          G.guide = World.predict(G.aim, this.guideBounces(), emberR(), G.guidePts);
          G.guideDirty = false;
        }
      }
      if (st === 'title') this.updateDemo(dtR);
      if (st === 'settle' || st === 'demo-settle') this.updateSettle(dtR);
      if (st === 'intro') { G.phaseT += dtR; if (G.phaseT > 1.5) { G.state = 'aim'; G.guideDirty = true; } }
    }
    this.updateFireworks(dtR);
    const k = Math.min(1, dtR * 4);
    G.cam.x += (G.cam.tx - G.cam.x) * k;
    G.cam.y += (G.cam.ty - G.cam.y) * k;
    G.cam.z += (G.cam.tz - G.cam.z) * k;
    Music.update(dtR);
    FX.update(dtR * G.ts, dtR);
  },

  updateShot(dtR) {
    const S = G.shot, h = PHYS.step;
    let ts = G.ts;
    if (G.fast && !G.closeCall && !G.B.cleared) ts *= 2.6;
    G.acc += Math.min(dtR, 1 / 20) * ts;
    let steps = 0;
    while (G.acc >= h && steps < 600) {
      G.acc -= h;
      steps++;
      World.setTime(World.t + h);
      S.t += h;
      for (let i = 0; i < G.embers.length; i++) {
        const e = G.embers[i];
        if (e.alive) World.step(e, h, GameSink);
      }
    }
    for (const e of G.embers) {
      if (!e.alive) continue;
      e.trail.push(e.x, e.y);
      if (e.trail.length > 28) e.trail.splice(0, 2);
      if (Math.random() < 0.7) FX.part({ type: 'dot', x: e.x + rnd(-3, 3), y: e.y + rnd(-3, 3), vx: rnd(-20, 20), vy: rnd(-40, 0), life: 0.4, size: rnd(1.5, 3), color: e.blaze > 0 ? '#ff7a2a' : PAL.ember, drag: 2 });
      this.checkStuck(e, S);
    }
    if (!G.attract) this.anticipate();
    if (S.t > 40) for (const e of G.embers) e.alive = false;
    if (G.embers.every((e) => !e.alive)) this.endShot();
  },

  checkStuck(e, S) {
    if (S.t - (e.lastSample || 0) < 0.2) return;
    e.lastSample = S.t;
    e.hist.push(e.x, e.y);
    if (e.hist.length > 20) e.hist.splice(0, 2);
    if (e.hist.length < 20) return;
    let mx = 0, my = 0;
    for (let i = 0; i < 20; i += 2) { mx += e.hist[i]; my += e.hist[i + 1]; }
    mx /= 10; my /= 10;
    for (let i = 0; i < 20; i += 2) if (Math.hypot(e.hist[i] - mx, e.hist[i + 1] - my) > 16) return;
    // the ember is resting on something: clear what holds it
    e.hist.length = 0;
    let best = null, bd = 1e9;
    for (const c of World.items) {
      if (c.dead) continue;
      const d = c.kind === 'peg' ? Math.hypot(c.x - e.x, c.y - e.y) - c.r : distToSegment(e.x, e.y, c.x1, c.y1, c.x2, c.y2) - c.r;
      if (d < e.r + 6 && d < bd && c.type !== 'orb') { bd = d; best = c; }
    }
    if (best) {
      if (!best.lit) this.light(best, e, 'stuck');
      this.popItem(best);
    } else {
      e.vy = -220;
      e.vx = rnd(-140, 140);
    }
  },

  // slow motion and a camera push-in when the ember is about to light the last red lantern
  anticipate() {
    const B = G.B;
    if (B.cleared) return;
    if (B.redsLeft !== 1) { if (G.closeCall) this.endCloseCall(false); return; }
    const target = G.closeTarget && !G.closeTarget.lit ? G.closeTarget : World.items.find((c) => c.type === 'red' && !c.lit && !c.dead);
    if (!target) return;
    let near = false, focus = null;
    for (const e of G.embers) {
      if (!e.alive) continue;
      for (let k = 1; k <= 8; k++) {
        const t = k * 0.04;
        const x = e.x + e.vx * t, y = e.y + e.vy * t + 0.5 * PHYS.g * World.gMul * t * t;
        if (Math.hypot(x - target.cx, y - target.cy) < e.r + target.r + 10) { near = true; focus = e; break; }
      }
      if (near) break;
    }
    if (near) {
      if (!G.closeCall) { G.closeCall = true; G.closeTarget = target; Sfx.drumroll(true); }
      G.tsTarget = 0.2;
      G.cam.tz = 1.75;
      G.cam.tx = lerp(focus.x, target.cx, 0.5);
      G.cam.ty = lerp(focus.y, target.cy, 0.5);
    } else if (G.closeCall) this.endCloseCall(true);
  },

  endCloseCall(missed) {
    G.closeCall = false;
    G.closeTarget = null;
    G.tsTarget = 1;
    G.cam.tz = 1; G.cam.tx = BOARD_W / 2; G.cam.ty = BOARD_H / 2;
    Sfx.drumroll(false);
    if (missed && !G.B.cleared) { Sfx.miss(); FX.pop('So close!', G.embers[0] ? G.embers[0].x : 300, 300, { size: 18, color: PAL.rose, life: 1.1, big: true }); }
  },

  // ------------------------------------------------------------ hits
  onHit(c, impact, e) {
    c.hitT = G.timeR;
    c.wob = Math.min(1, (c.wob || 0) + impact / 500);
    if (c.type === 'orb') {
      if (impact > 50) Sfx.orb(impact);
      if (has('breaker') && !G.attract && World.t - (c.lastHitW || -9) > 0.1) {
        c.lastHitW = World.t;
        c.cracks = (c.cracks || 0) + 1;
        if (c.cracks >= 2 && !c.lit) {
          c.lit = true;
          G.shot.lit.push(c);
          this.addPoints(250, c.cx, c.cy, '#d9a441');
          FX.burst(c.cx, c.cy, 18, '#d9a441', 60, 280, 0.6, 3);
          Sfx.shatter();
        }
      }
      return;
    }
    if (c.lit) { if (impact > 70) Sfx.tap(0.5); return; }
    if (World.t - (c.lastHitW || -9) < 0.08) return;
    c.lastHitW = World.t;
    c.hp--;
    if (c.hp > 0) {
      Sfx.crack();
      FX.burst(c.cx, c.cy, 10, PAL.paper, 40, 160, 0.5, 2);
      return;
    }
    this.light(c, e, 'hit');
  },

  light(c, e, how, depth) {
    if (c.lit || c.dead) return;
    const R = G.run, B = G.B, S = G.shot;
    c.lit = true;
    c.litT = G.timeR;
    if (S) S.lit.push(c);
    if (G.attract) {
      if (c.type === 'red') B.redsLeft--;
      Sfx.note(S ? S.note++ : 0, c.type, true);
      FX.burst(c.cx, c.cy, 8, c.type === 'red' ? PAL.red : PAL.cream, 40, 200, 0.5, 2);
      return;
    }
    const base = POINTS[c.type] * (c.kind === 'bar' && has('bamboo') ? 2 : 1) * (has('market') ? 1.5 : 1);
    if (c.type === 'red') { B.redsLeft--; R.redsLit++; if (S) S.reds++; }
    R.lit++;
    if (S) S.all++;
    const mult = this.mult() + (S ? S.multBonus : 0);
    const pts = Math.round(base * mult);
    this.addPoints(pts, c.cx, c.cy, c.type === 'red' ? '#ffb39a' : c.type === 'gold' ? PAL.gold : c.type === 'jade' ? PAL.jade : '#fff1d0', true);
    Sfx.note(S ? S.note++ : 0, c.type, false);
    const col = c.type === 'red' ? PAL.red : c.type === 'gold' ? PAL.gold : c.type === 'jade' ? PAL.jade : PAL.cream;
    FX.burst(c.cx, c.cy, c.type === 'red' ? 14 : 8, col, 40, 230, 0.55, 2.4);
    if (c.type === 'red') FX.ring(c.cx, c.cy, c.r, c.r + 22, 0.35, PAL.red, 2.5);
    if (c.type === 'red') {
      if (S) {
        if (S.lastRedX !== null && !S.longShot && Math.hypot(c.cx - S.lastRedX, c.cy - S.lastRedY) > 320) { S.longShot = true; this.bonus('Long Shot', 2500, c.cx, c.cy); }
        if (how === 'hit' && World.t - S.wallT < 0.4) { S.wallT = -9; this.bonus('Bank Shot', 1000, c.cx, c.cy); }
        S.lastRedX = c.cx;
        S.lastRedY = c.cy;
        if (S.firstRed && has('pearl') && how === 'hit') {
          S.firstRed = false;
          const reds = World.items.filter((o) => o.type === 'red' && !o.lit && !o.dead).sort((a, b) => Math.hypot(a.cx - c.cx, a.cy - c.cy) - Math.hypot(b.cx - c.cx, b.cy - c.cy));
          for (const o of reds.slice(0, 2)) { this.zap(c, o, PAL.gold); this.light(o, e, 'pearl'); }
        }
        S.firstRed = false;
      }
      if (has('cracker') && (depth || 0) < 4) {
        FX.ring(c.cx, c.cy, 6, 48, 0.4, '#ffd35a', 3);
        for (const o of World.items) {
          if (o.lit || o.dead || o.type === 'orb') continue;
          if (Math.hypot(o.cx - c.cx, o.cy - c.cy) < 48) this.light(o, e, 'cracker', (depth || 0) + 1);
        }
      }
      if (B.redsLeft === 0 && !B.cleared) this.lastRed(c, e);
      else if (B.redsLeft <= 3 && B.redsLeft > 0) Music.setLayer(2);
    } else if (c.type === 'jade') this.power(c.cx, c.cy, e);
    else if (c.type === 'gold') {
      R.gold++;
      if (S) S.goldHit++;
      FX.ring(c.cx, c.cy, c.r, c.r + 30, 0.5, PAL.gold, 3);
      Sfx.gold();
      if (has('cat')) this.gainEmber(1, 'Lucky Cat', c.cx, c.cy);
    }
  },

  zap(a, b, color) {
    FX.part({ type: 'zap', x: a.cx, y: a.cy, x2: b.cx, y2: b.cy, life: 0.35, color: color || PAL.gold, w: 3 });
  },

  addPoints(pts, x, y, color, small) {
    const R = G.run, B = G.B, S = G.shot;
    R.score += pts;
    B.score += pts;
    if (S) S.points += pts;
    if (Save.data.settings.numbers !== false) FX.pop(fmtNum(pts), x, y - 14, { size: small ? 12 : 16, color: color || '#fff', life: 0.8, vy: -34 });
  },

  bonus(name, pts, x, y) {
    if (has('fan')) pts *= 2;
    this.addPoints(pts, x, y + 20, PAL.gold);
    G.shot.bonuses.push(name);
    FX.pop(name + '!', x, y - 34, { size: 19, color: '#ffe3a0', life: 1.3, big: true, vy: -26 });
    Sfx.bonus();
  },

  onWall(e, side) {
    if (G.shot) G.shot.wallT = World.t;
    Sfx.wall(Math.abs(e.vx));
    if (has('drum') && G.shot && !G.attract) {
      G.shot.multBonus++;
      FX.pop('+1 Mult', e.x + side * -30, e.y, { size: 14, color: '#ffb39a', life: 0.8, big: true });
    }
  },

  onBoat(e) {
    const W = World.boat;
    FX.burst(e.x, RIVER_Y, 18, '#9fe7ff', 60, 220, 0.6, 2.4);
    FX.burst(e.x, RIVER_Y - 8, 10, PAL.rose, 40, 160, 0.8, 3);
    FX.ring(W.x, RIVER_Y, 10, 70, 0.6, '#ffe3a0', 3);
    if (G.attract) { Sfx.catch(); return; }
    G.shot.caught++;
    G.run.catches++;
    this.gainEmber(has('koi') ? 2 : 1, 'Lotus catch', e.x, RIVER_Y - 40);
    Sfx.catch();
  },

  onOut(e) {
    if (!G.attract && G.run.fox > 0 && !G.B.cleared) {
      G.run.fox--;
      e.alive = true;
      e.y = 14;
      e.vy = 60;
      e.vx *= 0.6;
      e.fox = true;
      e.trail.length = 0;
      FX.burst(e.x, 20, 24, '#ffb347', 60, 240, 0.7, 3);
      FX.pop('Second Fall', e.x, 60, { size: 16, color: '#ffcf8a', life: 1, big: true });
      Sfx.power('kitsu');
      return;
    }
    FX.burst(e.x, RIVER_Y + 10, 14, '#7fb8ff', 40, 180, 0.6, 2);
    FX.ring(e.x, RIVER_Y + 14, 4, 34, 0.6, '#9fd3ff', 2);
    Sfx.splash();
  },

  onSlot(e, i) {
    const v = FEVER_SLOTS[i], x = (i + 0.5) * (BOARD_W / FEVER_SLOTS.length);
    G.B.feverPts += v;
    G.shot.slots.push(i);
    this.addPoints(v, x, RIVER_Y - 30, PAL.gold);
    FX.pop('+' + fmtNum(v), x, RIVER_Y - 70, { size: 26, color: '#fff2c0', life: 1.6, big: true, vy: -20 });
    for (let k = 0; k < 3 + (v >= 50000 ? 4 : v >= 25000 ? 2 : 0); k++) this.launchFirework(rnd(60, 540), rnd(0, 0.6));
    FX.flash(0.3, [1, 0.85, 0.6]);
    Sfx.slot(v);
  },

  // ------------------------------------------------------------ powers
  power(x, y, e, quiet) {
    const R = G.run;
    if (!R || G.attract) { Sfx.power('mira'); return; }
    const k = R.keeper, m = has('echo') ? 2 : 1;
    R.powers++;
    FX.ring(x, y, 10, 120, 0.7, PAL.jade, 4);
    FX.burst(x, y, 24, PAL.jade, 60, 300, 0.7, 2.6);
    Sfx.power(k);
    UI.powerFlash(KEEPERS[k].power);
    if (k === 'mira') { R.sight += 2 * m; G.guideDirty = true; }
    else if (k === 'kenji') {
      if (e && e.alive) e.blaze = 2.5 * m;
      else R.blazeNext = 2.5 * m;
    } else if (k === 'twins') {
      if (e && e.alive) {
        for (let i = 0; i < m; i++) {
          const n = new Ember(x, y - 4, -e.vx * (i ? 0.7 : 1) + rnd(-30, 30), Math.min(e.vy, -120) - i * 40, emberR());
          G.embers.push(n);
        }
      } else R.twinNext = m;
    } else if (k === 'kitsu') R.fox += m;
    else if (k === 'bo') {
      const list = World.items.filter((c) => !c.lit && !c.dead && c.type !== 'orb').sort((a, b) => Math.hypot(a.cx - x, a.cy - y) - Math.hypot(b.cx - x, b.cy - y));
      FX.ring(x, y, 10, 160, 0.8, '#bfffe0', 5);
      const outside = !G.shot;
      if (outside) G.shot = { points: 0, reds: 0, all: 0, multBonus: 0, bonuses: [], caught: 0, longShot: false, note: 0, t: 0, wallT: -9, firstRed: false, lastRedX: null, lastRedY: null, lit: [], goldHit: 0, slots: [] };
      for (const c of list.slice(0, 7 * m)) { c.hp = 1; this.light(c, e, 'toll'); }
      // rung between shots (Spirit Lamp): settle it like a shot of its own
      if (outside) { G.embers = []; this.endShot(); }
    }
    UI.keeper();
  },

  // ------------------------------------------------------------ festival finale
  lastRed(c, e) {
    const B = G.B;
    B.cleared = true;
    G.closeCall = false;
    Sfx.drumroll(false);
    G.tsTarget = 0.18;
    G.cam.tz = 1.45; G.cam.tx = c.cx; G.cam.ty = c.cy;
    setTimeout(() => { G.tsTarget = 1; G.cam.tz = 1; G.cam.tx = BOARD_W / 2; G.cam.ty = BOARD_H / 2; }, 900);
    World.fever = true;
    World.boatOn = false;
    FX.burst(c.cx, c.cy, 60, PAL.red, 80, 420, 1.0, 3.5);
    FX.burst(c.cx, c.cy, 40, '#fff2c0', 60, 300, 0.9, 2.5);
    FX.ring(c.cx, c.cy, 10, 260, 1.0, '#ffe3a0', 6);
    FX.flash(0.5, [1, 0.9, 0.7]);
    FX.wave(c.cx, c.cy, 0.06, 1.2);
    FX.shake(0.5);
    for (let i = 0; i < 6; i++) this.launchFirework(rnd(60, 540), i * 0.25);
    UI.banner('Festival!', 'Land the ember for a bonus', PAL.gold);
    Sfx.festival();
    Music.setMode('fever');
    vibrate([30, 40, 60]);
  },

  launchFirework(x, delay) {
    G.fireworks.push({ x, y: RIVER_Y + 10, vy: -rnd(520, 700), t: -(delay || 0), fuse: rnd(0.75, 1.1), col: ['#ff5a3d', '#ffd35a', '#7fe8ff', '#ff8fb1', '#b9ff8a', '#c9b6ff'][(Math.random() * 6) | 0] });
  },

  updateFireworks(dt) {
    for (const f of G.fireworks) {
      f.t += dt;
      if (f.t < 0) continue;
      if (!f.lit) { f.lit = true; Sfx.rocket(); }
      f.vy += 260 * dt;
      f.y += f.vy * dt;
      if (Math.random() < 0.8) FX.part({ type: 'dot', x: f.x + rnd(-2, 2), y: f.y, vx: rnd(-10, 10), vy: rnd(20, 60), life: 0.5, size: 2, color: '#ffd9a0', drag: 2 });
      if (f.t > f.fuse) {
        f.done = true;
        FX.firework(f.x, f.y, f.col);
        Sfx.firework();
      }
    }
    G.fireworks = G.fireworks.filter((f) => !f.done);
  },

  // ------------------------------------------------------------ end of a shot
  endShot() {
    const S = G.shot, B = G.B;
    Sfx.drumroll(false);
    G.closeCall = false;
    G.tsTarget = 1;
    if (!B.cleared) { G.cam.tz = 1; G.cam.tx = BOARD_W / 2; G.cam.ty = BOARD_H / 2; }
    const queue = S.lit.filter((c) => !c.dead);
    if (B.cleared) {
      // every lantern still dark lights up in a cascade
      const rest = World.items.filter((c) => !c.lit && !c.dead && c.type !== 'orb');
      rest.sort((a, b) => a.cy - b.cy);
      for (const c of rest) queue.push(c);
    }
    G.settle = { queue, i: 0, t: 0, gap: Math.max(0.03, Math.min(0.07, 1.6 / Math.max(1, queue.length))), done: false, wait: 0 };
    G.state = G.attract ? 'demo-settle' : 'settle';
  },

  updateSettle(dt) {
    const T = G.settle;
    if (!T) return;
    T.t += dt;
    while (T.i < T.queue.length && T.t >= T.i * T.gap) {
      const c = T.queue[T.i++];
      if (!c.lit) {
        c.lit = true;
        c.litT = G.timeR;
        if (!G.attract) {
          const pts = POINTS[c.type] * 10;
          G.B.cascadePts += pts;
          this.addPoints(pts, c.cx, c.cy, '#fff1d0', true);
        }
      }
      this.popItem(c, T.i);
    }
    if (T.i >= T.queue.length && !T.done) {
      T.done = true;
      T.wait = G.attract ? 0.6 : this.awards();
    }
    if (T.done) {
      T.wait -= dt;
      if (T.wait <= 0) { G.settle = null; this.afterShot(); }
    }
  },

  popItem(c, i) {
    if (c.dead) return;
    c.dead = true;
    FX.floater(c, G.timeR);
    if (i !== undefined) Sfx.float(i);
  },

  // free embers after a shot; returns how long to linger before the next phase
  awards() {
    const R = G.run, S = G.shot, B = G.B;
    let n = 0, wait = 0.35;
    const big = FREE_AT.filter((v) => S.points >= v).length;
    if (big) { this.gainEmber(big, big > 1 ? 'Huge shot' : 'Big shot', 300, 420); n += big; }
    if (!B.cleared && Math.random() < 0.04 + (has('foxbell') ? 0.08 : 0)) { this.gainEmber(1, 'Lucky!', 300, 470); n++; }
    if (has('wind') && !B.windUsed && !B.cleared && S.reds === 0) { B.windUsed = true; this.gainEmber(1, 'Second Wind', 300, 520); n++; }
    R.bestShot = Math.max(R.bestShot, S.points);
    if (n) wait = 0.9;
    return wait;
  },

  gainEmber(n, label, x, y) {
    const R = G.run;
    R.embers += n;
    FX.pop('+' + n + ' ember' + (n > 1 ? 's' : ''), x, y, { size: 20, color: '#ffcf8a', life: 1.4, big: true, vy: -30 });
    if (label) FX.pop(label, x, y - 28, { size: 14, color: '#fff1d0', life: 1.4, big: true, vy: -30 });
    FX.burst(x, y, 16, PAL.ember, 40, 200, 0.7, 2.5);
    Sfx.ember();
    UI.embers(true);
  },

  afterShot() {
    const R = G.run, B = G.B;
    G.shot = null;
    G.embers = [];
    if (G.attract) { this.afterDemoShot(); return; }
    Music.setLayer(B.redsLeft <= 3 ? 2 : 0);
    if (B.cleared) { this.boardCleared(); return; }
    if (R.embers <= 0) {
      if (has('phoenix') && !R.phoenix) {
        R.phoenix = true;
        this.gainEmber(5, 'Phoenix Feather', 300, 450);
        FX.flash(0.4, [1, 0.6, 0.3]);
      } else { this.gameOver(); return; }
    }
    this.placeGold();
    this.newWind();
    G.state = 'aim';
    G.guideDirty = true;
    UI.hud();
  },

  boardCleared() {
    const R = G.run, B = G.B;
    G.state = 'clear';
    const boss = !!B.boss;
    // every ember left over is worth points
    const spare = R.embers, sparePts = spare * 2000;
    if (sparePts) { R.score += sparePts; B.score += sparePts; }
    if (boss) R.bosses.push(B.boss);
    const S = Save.data;
    S.stats.boards++;
    if (boss) S.bosses[B.boss] = (S.bosses[B.boss] || 0) + 1;
    Save.persist();
    Music.setMode('calm');
    UI.showClear({ n: B.n, name: B.name, boss, shots: B.shots, score: B.score, fever: B.feverPts, cascade: B.cascadePts, spare, sparePts });
  },

  // after the clear card: pick a reward, then the next board
  continueAfterClear() {
    const R = G.run;
    if (R.board === FESTIVAL_LEN && !R.endless) { R.won = true; this.gameOver(true); return; }
    G.state = 'reward';
    UI.showReward(this.rollRewards(!!G.B.boss));
  },

  rollRewards(boss) {
    const R = G.run, S = Save.data, rng = R.rng;
    const avail = CHARM_ORDER.filter((k) => {
      const c = CHARMS[k];
      if (c.unlock && !S.unlocked['charm:' + k]) return false;
      if (!c.stack && !c.instant && R.charms[k]) return false;
      return true;
    });
    const w = boss ? { common: 20, rare: 50, legendary: 30 } : { common: 62, rare: 30, legendary: 8 };
    const out = [];
    while (out.length < 3 && avail.length) {
      let total = 0;
      for (const k of avail) total += w[CHARMS[k].rarity];
      let r = rng.next() * total, pickK = avail[0];
      for (const k of avail) { r -= w[CHARMS[k].rarity]; if (r <= 0) { pickK = k; break; } }
      out.push(pickK);
      avail.splice(avail.indexOf(pickK), 1);
    }
    return out;
  },

  takeCharm(k) {
    const R = G.run, S = Save.data;
    if (k) {
      if (CHARMS[k].instant) R.nextBonus += 5;
      else { R.charms[k] = (R.charms[k] || 0) + 1; R.charmList.push(k); }
      if (!S.discovered[k]) { S.discovered[k] = true; Save.persist(); }
    } else R.nextBonus += 2;
    this.nextBoard();
  },

  continueEndless() {
    const R = G.run;
    R.endless = true;
    G.state = 'reward';
    UI.hide('over');
    UI.show('hud');
    UI.showReward(this.rollRewards(true));
  },

  gameOver(won) {
    const R = G.run, B = G.B, S = Save.data;
    G.state = 'over';
    Music.setMode(won ? 'fever' : 'quiet');
    if (!won) Sfx.over();
    // a festival can end twice (a win, then the endless night), so only new numbers are added
    const st = S.stats, C = R.counted;
    if (!C.run) { st.runs++; C.run = true; }
    st.lit += R.lit - C.lit; st.reds += R.redsLit - C.reds; st.catches += R.catches - C.catches; st.powers += R.powers - C.powers; st.gold += R.gold - C.gold; st.shots += R.shots - C.shots;
    Object.assign(C, { lit: R.lit, reds: R.redsLit, catches: R.catches, powers: R.powers, gold: R.gold, shots: R.shots });
    if (won && !R.countedWin) { st.wins++; R.countedWin = true; }
    const prevBest = S.best.score;
    const isBest = R.score > prevBest;
    S.best.score = Math.max(S.best.score, R.score);
    S.best.board = Math.max(S.best.board, R.board);
    S.best.shot = Math.max(S.best.shot, R.bestShot);
    S.top = S.top.filter((t) => t.id !== R.id);
    S.top.push({ id: R.id, score: R.score, board: R.board, keeper: R.keeper, date: todayKey(), won: !!(won || R.won), daily: R.mode === 'daily' });
    S.top.sort((a, b) => b.score - a.score);
    S.top = S.top.slice(0, 6);
    if (R.mode === 'daily') {
      const k = todayKey();
      if (S.daily.date !== k) { S.daily.date = k; S.daily.best = 0; }
      S.daily.best = Math.max(S.daily.best, R.score);
    }
    const fresh = checkUnlocks();
    Save.persist();
    UI.showOver({ R, B, won: !!won, isBest, prevBest, fresh, redsLeft: B.redsLeft });
  },

  // ------------------------------------------------------------ the title-screen demo
  startDemo() {
    G.attract = true;
    G.run = null;
    FX.clear();
    G.fireworks = [];
    const rng = new RNG((Math.random() * 1e9) | 0);
    const data = BoardGen.make(rng.int(2, 7), rng, { boss: rng.chance(0.25) ? rng.pick(['dragon', 'wheel']) : null });
    this.loadBoard(data, 3);
    G.demo = { t: 0, next: 1.2, target: Math.PI / 2, rng };
    Music.setMode('title');
  },

  updateDemo(dt) {
    const D = G.demo;
    if (!D) return;
    D.t += dt;
    if (!D.chosen && D.t > D.next - 1.1) {
      // pick the best of a handful of angles by simulating them
      let best = Math.PI / 2, bs = -1;
      for (let i = 0; i < 9; i++) {
        const a = D.rng.range(0.35, Math.PI - 0.35), r = World.dryRun(a, PHYS.er, 8);
        const s = r.reds * 3 + r.all + (r.caught ? 4 : 0);
        if (s > bs) { bs = s; best = a; }
      }
      D.target = best;
      D.chosen = true;
    }
    this.setAim(G.aim + (D.target - G.aim) * Math.min(1, dt * 3));
    if (D.chosen && D.t > D.next) {
      D.chosen = false;
      this.fire();
    }
  },

  afterDemoShot() {
    const D = G.demo;
    D.t = 0;
    D.next = 2.2;
    if (G.B.cleared || G.B.redsLeft <= 0 || G.B.shots > 14) { this.startDemo(); return; }
    this.placeGold();
    G.state = 'title';
    G.guideDirty = true;
  },
};

// ---------------------------------------------------------------- render.js
const Assets = { lantern: {}, orb: null, boat: null, hub: null, barrel: null, logo: null };
const LIT_COL = { red: '#ff5a2a', cream: '#ffc870', jade: '#2dff9a', gold: '#ffc23a', orb: '#d9a441' };
const fmod = (a, n) => ((a % n) + n) % n;

function mkCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.ceil(w));
  c.height = Math.max(1, Math.ceil(h));
  return c;
}

function loadImg(src) {
  return new Promise((res) => {
    if (!src) return res(null);
    const i = new Image();
    i.onload = () => res(i);
    i.onerror = () => res(null);
    i.src = src;
  });
}

Assets.load = function () {
  const D = ASSET_DATA, jobs = [];
  const put = (obj, key, src) => jobs.push(loadImg(src).then((im) => { obj[key] = im; }));
  for (const k in D.lanterns) put(Assets.lantern, k, D.lanterns[k]);
  for (const k of ['orb', 'boat', 'hub', 'barrel', 'logo']) put(Assets, k, D[k]);
  return Promise.all(jobs);
};

function glowSprite(color, size, core) {
  const c = mkCanvas(size, size), g = c.getContext('2d'), r = size / 2;
  const gr = g.createRadialGradient(r, r, 0, r, r, r);
  gr.addColorStop(0, rgba(color, 1));
  gr.addColorStop(core || 0.2, rgba(color, 0.45));
  gr.addColorStop(0.55, rgba(color, 0.12));
  gr.addColorStop(1, rgba(color, 0));
  g.fillStyle = gr;
  g.fillRect(0, 0, size, size);
  return c;
}

const BAMBOO = {
  cream: ['#c9d68a', '#7d9a3c', '#4f6b22'],
  red: ['#ff8a6a', '#c8281f', '#6a120c'],
  jade: ['#9fffd2', '#1f9c70', '#0b4a33'],
  gold: ['#fff0b0', '#e2a52c', '#7a5212'],
};

const Render = {
  glows: {}, bars: new Map(),

  init(canvas) {
    this.c = canvas;
    this.ctx = canvas.getContext('2d', { alpha: false });
    this.sky = null;
    this.drift = [];
    for (let i = 0; i < 26; i++) this.drift.push({ u: Math.random(), v: Math.random(), s: rnd(0.5, 1.4), sp: rnd(0.006, 0.016), ph: Math.random() * TAU });
    this.shimmer = [];
    for (let i = 0; i < 70; i++) this.shimmer.push({ u: Math.random(), v: Math.random(), w: rnd(8, 34), ph: Math.random() * TAU, sp: rnd(0.6, 1.6) });
    this.streaks = [];
    for (let i = 0; i < 16; i++) this.streaks.push({ x: Math.random() * BOARD_W, y: rnd(150, 800), len: rnd(40, 110), sp: rnd(0.7, 1.3) });
  },

  glow(color) {
    let g = this.glows[color];
    if (!g) g = this.glows[color] = glowSprite(color, 96);
    return g;
  },

  // ---------------------------------------------------------------- the static night sky
  buildSky() {
    const W = G.pxW, H = G.pxH, c = mkCanvas(W, H), g = c.getContext('2d');
    const riverY = G.by + RIVER_Y * G.s;
    const gr = g.createLinearGradient(0, 0, 0, riverY);
    gr.addColorStop(0, '#04061a');
    gr.addColorStop(0.45, '#0b1140');
    gr.addColorStop(0.8, '#1f1a52');
    gr.addColorStop(1, '#3a2458');
    g.fillStyle = gr;
    g.fillRect(0, 0, W, H);
    const rng = new RNG(11);
    const u = Math.min(W, H);
    for (let i = 0; i < 260; i++) {
      const x = rng.range(0, W), y = rng.range(0, riverY * 0.85), z = rng.range(0.5, 1.6) * (u / 500);
      g.globalAlpha = rng.range(0.2, 0.85) * (1 - y / riverY * 0.6);
      g.fillStyle = rng.chance(0.2) ? '#ffe9c4' : '#dfe8ff';
      g.fillRect(x, y, z, z);
    }
    g.globalAlpha = 1;
    // the moon
    const mx = W * 0.8, my = Math.min(H * 0.16, riverY * 0.25), mr = u * 0.07;
    const halo = g.createRadialGradient(mx, my, mr * 0.8, mx, my, mr * 5);
    halo.addColorStop(0, 'rgba(255,236,190,0.12)');
    halo.addColorStop(1, 'rgba(255,236,190,0)');
    g.fillStyle = halo;
    g.fillRect(mx - mr * 5, my - mr * 5, mr * 10, mr * 10);
    const mg = g.createRadialGradient(mx - mr * 0.3, my - mr * 0.3, mr * 0.1, mx, my, mr);
    mg.addColorStop(0, '#cfc6ae');
    mg.addColorStop(0.7, '#b9ab88');
    mg.addColorStop(1, '#93825c');
    g.fillStyle = mg;
    g.beginPath(); g.arc(mx, my, mr, 0, TAU); g.fill();
    g.globalAlpha = 0.22;
    g.fillStyle = '#a88a52';
    for (const [dx, dy, r] of [[-0.3, 0.1, 0.22], [0.25, -0.25, 0.15], [0.1, 0.35, 0.12], [-0.05, -0.4, 0.09]]) {
      g.beginPath(); g.arc(mx + dx * mr, my + dy * mr, r * mr, 0, TAU); g.fill();
    }
    g.globalAlpha = 1;
    // mountain ridges standing on the river
    const ridge = (base, amp, col, seed, rough) => {
      const r2 = new RNG(seed);
      const pts = [];
      const n = 64;
      let h = 0.5;
      for (let i = 0; i <= n; i++) {
        h += r2.range(-rough, rough);
        h = clamp(h, 0.1, 1);
        pts.push(h);
      }
      g.fillStyle = col;
      g.beginPath();
      g.moveTo(0, riverY + 2);
      for (let i = 0; i <= n; i++) {
        const x = (i / n) * W;
        const y = riverY - amp * (0.35 + 0.65 * pts[i] * (0.6 + 0.4 * Math.sin(i * 0.35 + seed)));
        g.lineTo(x, y);
      }
      g.lineTo(W, riverY + 2);
      g.closePath();
      g.fill();
    };
    ridge(riverY, u * 0.3, '#1d1c55', 3, 0.18);
    ridge(riverY, u * 0.2, '#15154a', 7, 0.22);
    ridge(riverY, u * 0.11, '#0d0e33', 13, 0.25);
    // a soft mist over the water line
    const mist = g.createLinearGradient(0, riverY - u * 0.12, 0, riverY);
    mist.addColorStop(0, 'rgba(120,110,190,0)');
    mist.addColorStop(1, 'rgba(120,110,190,0.18)');
    g.fillStyle = mist;
    g.fillRect(0, riverY - u * 0.12, W, u * 0.12);
    this.sky = c;
    this.skyRiver = riverY;
  },

  // ---------------------------------------------------------------- bamboo bars (cached sprites)
  barSprite(c, lit) {
    const key = c.id + (lit ? 'L' : 'U') + c.type + c.hp;
    let spr = this.bars.get(key);
    if (spr) return spr;
    const len = Math.hypot(c.bx2 - c.bx1, c.by2 - c.by1), k = 3, r = c.r;
    const W = Math.ceil((len + r * 2 + 4) * k), H = Math.ceil((r * 2 + 4) * k);
    const cv = mkCanvas(W, H), g = cv.getContext('2d');
    g.scale(k, k);
    const cols = BAMBOO[c.type] || BAMBOO.cream;
    const y0 = 2, x0 = 2, w = len + r * 2, h = r * 2;
    const gr = g.createLinearGradient(0, y0, 0, y0 + h);
    gr.addColorStop(0, lit ? '#fff4d0' : cols[0]);
    gr.addColorStop(0.45, lit ? LIT_COL[c.type] : cols[1]);
    gr.addColorStop(1, lit ? cols[1] : cols[2]);
    g.fillStyle = gr;
    g.beginPath();
    g.moveTo(x0 + r, y0);
    g.lineTo(x0 + w - r, y0);
    g.arc(x0 + w - r, y0 + r, r, -Math.PI / 2, Math.PI / 2);
    g.lineTo(x0 + r, y0 + h);
    g.arc(x0 + r, y0 + r, r, Math.PI / 2, (Math.PI * 3) / 2);
    g.closePath();
    g.fill();
    g.strokeStyle = lit ? 'rgba(255,255,255,0.5)' : 'rgba(0,0,0,0.35)';
    g.lineWidth = 1.2;
    for (let x = x0 + r + 16; x < x0 + w - r - 6; x += 22) {
      g.beginPath(); g.moveTo(x, y0 + 1); g.lineTo(x, y0 + h - 1); g.stroke();
    }
    g.fillStyle = 'rgba(255,255,255,0.35)';
    g.fillRect(x0 + r * 0.6, y0 + h * 0.22, w - r * 1.2, 1.4);
    if (c.maxHp > 1 && c.hp > 1) {
      g.fillStyle = 'rgba(243,230,200,0.85)';
      g.fillRect(x0 + w / 2 - 7, y0 - 0.5, 14, h + 1);
    }
    spr = { cv, k, len };
    this.bars.set(key, spr);
    return spr;
  },

  // ---------------------------------------------------------------- frame
  draw() {
    const ctx = this.ctx, W = G.pxW, H = G.pxH;
    if (!this.sky || this.sky.width !== W || this.sky.height !== H) this.buildSky();
    const cam = G.cam, sh = FX.shakeOffset(G.timeR);
    const S = G.s * cam.z;
    const cxs = G.bx + (BOARD_W / 2) * G.s + sh[0] * G.s, cys = G.by + (BOARD_H / 2) * G.s + sh[1] * G.s;
    this.S = S;
    this.ox = cxs - cam.x * S;
    this.oy = cys - cam.y * S;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.drawImage(this.sky, 0, 0);
    this.drawDrift();
    this.W();
    this.drawFrame();
    this.drawRiver();
    if (World.wind) this.drawWind();
    this.drawGuide();
    this.drawItems();
    this.drawBoat();
    this.drawLauncher();
    this.drawFloaters();
    this.drawEmbers();
    this.drawFX();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    this.drawPops();
  },

  W() { this.ctx.setTransform(this.S, 0, 0, this.S, this.ox, this.oy); },
  TR(x, y, a, k) {
    const s = this.S * (k || 1), c = Math.cos(a) * s, n = Math.sin(a) * s;
    this.ctx.setTransform(c, n, -n, c, this.ox + x * this.S, this.oy + y * this.S);
  },

  drawDrift() {
    // far-off sky lanterns rising over the mountains
    const ctx = this.ctx, W = G.pxW, top = this.skyRiver, t = G.timeR, g = this.glow('#ffb35a'), u = Math.min(W, G.pxH);
    ctx.globalCompositeOperation = 'lighter';
    for (const d of this.drift) {
      const v = fmod(d.v - t * d.sp, 1);
      const x = d.u * W + Math.sin(t * 0.4 + d.ph) * u * 0.01, y = top * (0.25 + v * 0.75);
      const z = d.s * u * 0.012 * (0.5 + v * 0.5);
      ctx.globalAlpha = 0.5 * Math.min(1, v * 3) * (0.8 + 0.2 * Math.sin(t * 3 + d.ph));
      ctx.drawImage(g, x - z * 3, y - z * 3, z * 6, z * 6);
      ctx.fillStyle = '#ffd9a0';
      ctx.fillRect(x - z * 0.35, y - z * 0.5, z * 0.7, z);
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
  },

  drawFrame() {
    const ctx = this.ctx, t = G.timeR;
    // bamboo poles for walls
    for (const x of [-7, BOARD_W + 7]) {
      const gr = ctx.createLinearGradient(x - 7, 0, x + 7, 0);
      gr.addColorStop(0, '#2e3d16');
      gr.addColorStop(0.5, '#7d9a3c');
      gr.addColorStop(1, '#25330f');
      ctx.fillStyle = gr;
      ctx.fillRect(x - 7, -40, 14, RIVER_Y + 60);
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      for (let y = 30; y < RIVER_Y; y += 96) ctx.fillRect(x - 7, y, 14, 2.5);
    }
    // a garland of small lanterns across the top
    ctx.strokeStyle = 'rgba(40,24,18,0.9)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let i = 0; i <= 30; i++) {
      const x = (i / 30) * BOARD_W, y = 12 + 22 * Math.sin((i / 30) * Math.PI);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    const red = Assets.lantern.red_on, cream = Assets.lantern.cream_on;
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 1; i < 14; i++) {
      if (i === 7) continue;
      const u = i / 14, x = u * BOARD_W, y = 12 + 22 * Math.sin(u * Math.PI) + 9;
      const gl = this.glow(i % 2 ? '#ff5a2a' : '#ffc870');
      ctx.globalAlpha = 0.35 + 0.1 * Math.sin(t * 2 + i);
      ctx.drawImage(gl, x - 16, y - 16, 32, 32);
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    for (let i = 1; i < 14; i++) {
      if (i === 7) continue;
      const u = i / 14, x = u * BOARD_W, y = 12 + 22 * Math.sin(u * Math.PI) + 9;
      const img = i % 2 ? red : cream;
      if (img) ctx.drawImage(img, x - 9, y - 9, 18, 18);
    }
  },

  drawRiver() {
    const ctx = this.ctx, t = G.timeR, x0 = -this.ox / this.S, x1 = (G.pxW - this.ox) / this.S, yb = (G.pxH - this.oy) / this.S;
    const gr = ctx.createLinearGradient(0, RIVER_Y, 0, Math.max(RIVER_Y + 40, yb));
    gr.addColorStop(0, '#1a2a66');
    gr.addColorStop(0.2, '#0f1b4a');
    gr.addColorStop(1, '#050a1e');
    ctx.fillStyle = gr;
    ctx.fillRect(x0, RIVER_Y, x1 - x0, Math.max(60, yb - RIVER_Y));
    ctx.globalCompositeOperation = 'lighter';
    const span = x1 - x0, depth = Math.max(60, yb - RIVER_Y);
    const moonX = x0 + span * 0.8;
    for (const s of this.shimmer) {
      const y = RIVER_Y + 4 + s.v * depth;
      const nearMoon = s.u > 0.62;
      const x = nearMoon ? moonX + (s.u - 0.81) * span * 0.6 + Math.sin(t * s.sp + s.ph) * 6 : x0 + s.u * span + Math.sin(t * s.sp + s.ph) * 10;
      const a = (nearMoon ? 0.35 : 0.14) * (0.5 + 0.5 * Math.sin(t * s.sp * 2 + s.ph)) * (1 - s.v * 0.7);
      ctx.fillStyle = nearMoon ? 'rgba(255,236,190,' + a.toFixed(3) + ')' : 'rgba(150,190,255,' + a.toFixed(3) + ')';
      ctx.fillRect(x - s.w / 2, y, s.w * (1 - s.v * 0.5), 1.6);
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(190,210,255,0.25)';
    ctx.fillRect(x0, RIVER_Y, span, 1.5);
  },

  drawWind() {
    const ctx = this.ctx, w = World.wind, t = G.timeR;
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = 'rgba(190,220,255,0.35)';
    ctx.lineCap = 'round';
    ctx.lineWidth = 1.5;
    for (const s of this.streaks) {
      const x = fmod(s.x + t * w * s.sp * 1.6, BOARD_W + 200) - 100;
      ctx.globalAlpha = Math.min(1, Math.abs(w) / 120);
      ctx.beginPath();
      ctx.moveTo(x, s.y);
      ctx.lineTo(x - Math.sign(w) * s.len * (Math.abs(w) / 170), s.y + Math.sin(t + s.y) * 3);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  },

  drawGuide() {
    const st = G.state;
    if (!(st === 'aim' || st === 'title') || !G.guide) return;
    const ctx = this.ctx, pts = G.guide.pts, n = pts.length / 2;
    if (n < 2) return;
    const long = G.run && G.run.sight > 0, fade = G.aimCancel ? 0.25 : 1;
    ctx.fillStyle = long ? '#bfffe0' : '#fff1d0';
    if (G.aimCancel) {
      ctx.font = '700 15px "Zen Kaku Gothic New", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Release to cancel', LAUNCH.x, LAUNCH.y + 52);
    }
    for (let i = 1; i < n; i++) {
      const a = ((1 - i / n) * (st === 'title' ? 0.35 : 0.85) + 0.12) * fade;
      ctx.globalAlpha = a;
      const r = 2.3 - (i / n) * 0.9;
      ctx.beginPath();
      ctx.arc(pts[i * 2], pts[i * 2 + 1], r, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (G.guide.hitX !== null && st === 'aim') {
      ctx.strokeStyle = long ? 'rgba(191,255,224,0.8)' : 'rgba(255,241,208,0.75)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(G.guide.hitX, G.guide.hitY, emberR(), 0, TAU);
      ctx.stroke();
    }
  },

  drawItems() {
    const ctx = this.ctx, t = G.timeR, B = G.B;
    if (!B) return;
    const few = B.redsLeft > 0 && B.redsLeft <= 3 && !G.attract;
    // glow pass
    ctx.globalCompositeOperation = 'lighter';
    for (const c of World.items) {
      if (c.dead) continue;
      let a = 0, col = LIT_COL[c.type], size = c.r * 4.6;
      if (c.lit) a = 0.85 + 0.15 * Math.sin(t * 6 + c.ph);
      else if (c.type === 'red' && few) a = 0.45 + 0.35 * Math.sin(t * 5 + c.ph);
      else if (c.type === 'gold') { a = 0.35 + 0.15 * Math.sin(t * 4 + c.ph); }
      else if (c.type === 'jade') a = 0.25 + 0.1 * Math.sin(t * 3 + c.ph);
      if (c.type === 'orb') a = 0;
      if (a <= 0) continue;
      const g = this.glow(col);
      ctx.globalAlpha = a;
      if (c.kind === 'peg') ctx.drawImage(g, c.x - size / 2, c.y - size / 2, size, size);
      else {
        const L = Math.hypot(c.x2 - c.x1, c.y2 - c.y1);
        this.TR(c.cx, c.cy, Math.atan2(c.y2 - c.y1, c.x2 - c.x1));
        ctx.drawImage(g, -L / 2 - 16, -22, L + 32, 44);
        this.W();
      }
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    // bamboo
    for (const c of World.items) {
      if (c.dead || c.kind !== 'bar') continue;
      const spr = this.barSprite(c, c.lit), a = Math.atan2(c.y2 - c.y1, c.x2 - c.x1);
      this.TR(c.cx, c.cy, a);
      const w = spr.cv.width / spr.k, h = spr.cv.height / spr.k;
      ctx.drawImage(spr.cv, -w / 2, -h / 2, w, h);
    }
    this.W();
    // lanterns and orbs
    for (const c of World.items) {
      if (c.dead || c.kind !== 'peg') continue;
      const img = c.type === 'orb' ? Assets.orb : Assets.lantern[c.type + (c.lit ? '_on' : '_off')];
      if (!img) continue;
      const dt = t - c.hitT;
      const wob = dt < 1.2 ? Math.exp(-dt * 4) * Math.sin(dt * 22) * 0.32 * Math.min(1, (c.wob || 0.6) + 0.3) : 0;
      if (dt > 1.2) c.wob = 0;
      const S = c.r * 2.7;
      if (c.type === 'orb') {
        if (c.moon) this.drawMoonOrb(c);
        else ctx.drawImage(img, c.x - S / 2, c.y - S / 2, S, S);
        if (c.cracks && !c.lit) {
          ctx.strokeStyle = 'rgba(255,220,160,0.7)';
          ctx.lineWidth = 1.2;
          ctx.beginPath(); ctx.moveTo(c.x - 6, c.y - 8); ctx.lineTo(c.x + 1, c.y - 1); ctx.lineTo(c.x - 3, c.y + 7); ctx.stroke();
        }
        continue;
      }
      const pulse = c.lit ? 1 + 0.06 * Math.exp(-(t - (c.litT || 0)) * 6) : 1;
      if (wob) {
        // lanterns swing on their string when struck
        this.TR(c.x, c.y - c.r, wob);
        ctx.drawImage(img, -S / 2 * pulse, (c.r - S / 2) * pulse, S * pulse, S * pulse);
        this.W();
      } else ctx.drawImage(img, c.x - (S / 2) * pulse, c.y - (S / 2) * pulse, S * pulse, S * pulse);
      if (c.maxHp > 1 && c.hp > 1) {
        ctx.strokeStyle = 'rgba(243,230,200,0.85)';
        ctx.lineWidth = 1.6;
        ctx.setLineDash([3, 3]);
        ctx.beginPath(); ctx.arc(c.x, c.y, c.r + 3.5, 0, TAU); ctx.stroke();
        ctx.setLineDash([]);
      }
      if (c.head) this.drawDragonHead(c);
    }
    if (B.boss === 'dragon') this.drawDragonRibbon();
  },

  drawMoonOrb(c) {
    const ctx = this.ctx, g = this.glow('#fff1c7');
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.22;
    ctx.drawImage(g, c.x - c.r * 2.4, c.y - c.r * 2.4, c.r * 4.8, c.r * 4.8);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    const gr = ctx.createRadialGradient(c.x - c.r * 0.3, c.y - c.r * 0.3, c.r * 0.1, c.x, c.y, c.r);
    gr.addColorStop(0, '#dcd2b8');
    gr.addColorStop(0.75, '#c4b48c');
    gr.addColorStop(1, '#9c8556');
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(120,96,56,0.3)';
    for (const [dx, dy, r] of [[-0.35, 0.15, 0.22], [0.3, -0.2, 0.16], [0.05, 0.4, 0.12]]) {
      ctx.beginPath(); ctx.arc(c.x + dx * c.r, c.y + dy * c.r, r * c.r, 0, TAU); ctx.fill();
    }
  },

  drawDragonRibbon() {
    const ctx = this.ctx, segs = World.items.filter((c) => c.seg >= 0 && !c.dead).sort((a, b) => a.seg - b.seg);
    if (segs.length < 2) return;
    ctx.strokeStyle = 'rgba(255,200,90,0.55)';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    for (let i = 1; i < segs.length; i++) {
      const a = segs[i - 1], b = segs[i];
      if (b.seg - a.seg !== 1) continue;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.quadraticCurveTo((a.x + b.x) / 2 + (b.y - a.y) * 0.25, (a.y + b.y) / 2 - (b.x - a.x) * 0.25, b.x, b.y);
      ctx.stroke();
    }
  },

  drawDragonHead(c) {
    const ctx = this.ctx, t = G.timeR, a = Math.atan2(c.vy, c.vx);
    this.TR(c.x, c.y, a);
    ctx.strokeStyle = '#ffd35a';
    ctx.lineWidth = 2.2;
    ctx.lineCap = 'round';
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(6, s * 10);
      ctx.quadraticCurveTo(20, s * 22, 30 + Math.sin(t * 4) * 3, s * (28 + Math.sin(t * 5 + s) * 4));
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-8, s * 14);
      ctx.lineTo(-20, s * 26);
      ctx.stroke();
    }
    ctx.fillStyle = '#fff2c0';
    for (const s of [-1, 1]) { ctx.beginPath(); ctx.arc(8, s * 7, 3, 0, TAU); ctx.fill(); }
    ctx.fillStyle = '#1a0a06';
    for (const s of [-1, 1]) { ctx.beginPath(); ctx.arc(9, s * 7, 1.4, 0, TAU); ctx.fill(); }
    if (c.hp > 1) {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      const sx = this.ox + c.x * this.S, sy = this.oy + (c.y - c.r - 12) * this.S;
      for (let i = 0; i < c.maxHp; i++) {
        ctx.fillStyle = i < c.hp ? '#ffd35a' : 'rgba(255,255,255,0.2)';
        ctx.fillRect(sx + (i - c.maxHp / 2) * 7 * this.S, sy, 5 * this.S, 3 * this.S);
      }
    }
    this.W();
  },

  drawBoat() {
    const ctx = this.ctx, t = G.timeR;
    if (World.fever) { this.drawSlots(); return; }
    if (!World.boatOn || !Assets.boat) return;
    const B = World.boat, k = B.halfW / 52, w = 141 * k, h = 70 * k;
    const bob = Math.sin(t * 2.2) * 1.5;
    const g = this.glow('#ffb35a');
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.45 + 0.1 * Math.sin(t * 7);
    ctx.drawImage(g, B.x - 40 * k, RIVER_Y - 52 * k, 80 * k, 80 * k);
    ctx.globalAlpha = 0.22;
    ctx.drawImage(g, B.x - 50 * k, RIVER_Y + 4, 100 * k, 40);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.drawImage(Assets.boat, B.x - w / 2, RIVER_Y + 2 + bob - h * (102 / 144), w, h);
  },

  drawSlots() {
    const ctx = this.ctx, n = FEVER_SLOTS.length, w = BOARD_W / n, t = G.timeR;
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < n; i++) {
      const v = FEVER_SLOTS[i], x = i * w, hot = v >= 50000 ? 1 : v >= 25000 ? 0.6 : 0.35;
      const gr = ctx.createLinearGradient(0, RIVER_Y - 40, 0, RIVER_Y + 30);
      gr.addColorStop(0, 'rgba(255,200,90,0)');
      gr.addColorStop(1, 'rgba(255,200,90,' + (0.25 * hot * (0.8 + 0.2 * Math.sin(t * 6 + i))).toFixed(3) + ')');
      ctx.fillStyle = gr;
      ctx.fillRect(x + 4, RIVER_Y - 40, w - 8, 70);
    }
    ctx.globalCompositeOperation = 'source-over';
    for (let i = 1; i < n; i++) {
      const x = i * w;
      ctx.fillStyle = '#d9a441';
      ctx.fillRect(x - 3, RIVER_Y - 26, 6, 40);
      ctx.beginPath(); ctx.arc(x, RIVER_Y - 26, 5, 0, TAU); ctx.fill();
    }
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (let i = 0; i < n; i++) {
      const v = FEVER_SLOTS[i];
      ctx.font = '800 ' + (v >= 50000 ? 21 : 16) + 'px "Shippori Mincho B1", Georgia, serif';
      ctx.fillStyle = v >= 50000 ? '#ffe38a' : '#fff1d0';
      ctx.fillText(fmtNum(v), (i + 0.5) * w, RIVER_Y + 16);
    }
  },

  drawLauncher() {
    const ctx = this.ctx, t = G.timeR, a = G.aim, rec = (G.recoil || 0) * 6;
    if (Assets.barrel) {
      const k = 0.376;
      this.TR(LAUNCH.x - Math.cos(a) * rec, LAUNCH.y - Math.sin(a) * rec, a);
      ctx.drawImage(Assets.barrel, -12.3 * k, -40 * k, 160 * k, 80 * k);
      this.W();
    }
    const ready = G.state === 'aim' || G.state === 'title';
    if (ready) {
      const m = World.mouth(a), g = this.glow(PAL.ember);
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.7 + 0.2 * Math.sin(t * 8);
      ctx.drawImage(g, m[0] - 18, m[1] - 18, 36, 36);
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
    }
    if (Assets.hub) ctx.drawImage(Assets.hub, LAUNCH.x - 25, LAUNCH.y - 25, 50, 50);
  },

  drawEmbers() {
    const ctx = this.ctx, t = G.timeR;
    if (!G.embers.length) return;
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    for (const e of G.embers) {
      if (!e.alive) continue;
      const tr = e.trail, hot = e.blaze > 0;
      ctx.strokeStyle = hot ? '#ff5a1a' : '#ff9a3a';
      for (let i = 2; i < tr.length; i += 2) {
        const k = i / tr.length;
        ctx.globalAlpha = 0.55 * k;
        ctx.lineWidth = e.r * 1.6 * k * (hot ? 1.6 : 1);
        ctx.beginPath();
        ctx.moveTo(tr[i - 2], tr[i - 1]);
        ctx.lineTo(tr[i], tr[i + 1]);
        ctx.stroke();
      }
      const g = this.glow(hot ? '#ff5a1a' : PAL.ember), z = e.r * (hot ? 7 + Math.sin(t * 30) : 5);
      ctx.globalAlpha = 0.9;
      ctx.drawImage(g, e.x - z, e.y - z, z * 2, z * 2);
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    for (const e of G.embers) {
      if (!e.alive) continue;
      const gr = ctx.createRadialGradient(e.x - e.r * 0.3, e.y - e.r * 0.3, 0, e.x, e.y, e.r);
      gr.addColorStop(0, '#ffffff');
      gr.addColorStop(0.5, '#fff0b0');
      gr.addColorStop(1, e.blaze > 0 ? '#ff6a1a' : '#ffb347');
      ctx.fillStyle = gr;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r, 0, TAU);
      ctx.fill();
    }
  },

  drawFloaters() {
    const ctx = this.ctx;
    for (const f of FX.floats) {
      const k = f.t / f.life, a = 1 - k;
      if (f.kind === 'bar') {
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = a * 0.9;
        const g = this.glow(LIT_COL[f.type] || '#ffc870'), L = Math.hypot(f.dx, f.dy);
        this.TR(f.x, f.y, Math.atan2(f.dy, f.dx));
        ctx.drawImage(g, -L / 2 - 10, -14, L + 20, 28);
        this.W();
        ctx.globalCompositeOperation = 'source-over';
        continue;
      }
      const img = f.type === 'orb' ? Assets.orb : Assets.lantern[f.type + '_on'];
      if (!img) continue;
      const S = f.r * 2.7 * (1 - k * 0.45);
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = a * 0.7;
      const g = this.glow(LIT_COL[f.type] || '#ffc870');
      ctx.drawImage(g, f.x - S, f.y - S, S * 2, S * 2);
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = Math.min(1, a * 1.4);
      this.TR(f.x, f.y, f.rot * 0.3);
      ctx.drawImage(img, -S / 2, -S / 2, S, S);
      this.W();
    }
    ctx.globalAlpha = 1;
  },

  drawFX() {
    const ctx = this.ctx, t = G.timeR;
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    for (const p of FX.pool) {
      if (!p.on) continue;
      const k = p.t / p.life;
      let a = 1 - k;
      if (p.tw) a *= 0.6 + 0.4 * Math.sin(t * 40 + p.x);
      ctx.globalAlpha = a;
      if (p.type === 'ring') {
        ctx.strokeStyle = p.color;
        ctx.lineWidth = p.w * (1 - k * 0.7);
        ctx.beginPath();
        ctx.arc(p.x, p.y, lerp(p.r0, p.r1, easeOutCubic(k)), 0, TAU);
        ctx.stroke();
      } else if (p.type === 'zap') {
        ctx.strokeStyle = p.color;
        ctx.lineWidth = p.w * (1 - k);
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        for (let i = 1; i < 5; i++) ctx.lineTo(lerp(p.x, p.x2, i / 5) + rnd(-6, 6), lerp(p.y, p.y2, i / 5) + rnd(-6, 6));
        ctx.lineTo(p.x2, p.y2);
        ctx.stroke();
      } else if (p.type === 'spark') {
        ctx.strokeStyle = p.color;
        ctx.lineWidth = p.size * (1 - k * 0.5);
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x - p.vx * 0.03, p.y - p.vy * 0.03);
        ctx.stroke();
      } else {
        const z = p.size * (1 - k * 0.5);
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - z / 2, p.y - z / 2, z, z);
      }
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
  },

  drawPops() {
    const ctx = this.ctx, dpr = G.dpr;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    for (const q of FX.pops) {
      const sx = this.ox + q.x * this.S, sy = this.oy + q.y * this.S;
      const k = q.t / q.life, a = k > 0.7 ? (1 - k) / 0.3 : 1;
      const sc = q.t < 0.09 ? 1 + (1 - q.t / 0.09) * 0.6 : 1;
      const px = Math.max(9, Math.round(q.size * dpr * sc * Math.max(0.8, Math.min(1.3, G.css * 1.25))));
      ctx.font = q.big ? '800 ' + px + 'px "Shippori Mincho B1", Georgia, serif' : '700 ' + px + 'px "Zen Kaku Gothic New", system-ui, sans-serif';
      ctx.globalAlpha = a;
      ctx.lineWidth = Math.max(2, px * 0.2);
      ctx.strokeStyle = 'rgba(8,8,26,0.85)';
      ctx.strokeText(q.text, sx, sy);
      ctx.fillStyle = q.color;
      ctx.fillText(q.text, sx, sy);
    }
    ctx.globalAlpha = 1;
  },

  // post-processing ripple centres, in uv
  writeWaves(arr) {
    arr.fill(0);
    for (let i = 0; i < FX.waves.length && i < 3; i++) {
      const w = FX.waves[i], k = w.t / 0.9;
      arr[i * 4] = (this.ox + w.x * this.S) / G.pxW;
      arr[i * 4 + 1] = 1 - (this.oy + w.y * this.S) / G.pxH;
      arr[i * 4 + 2] = w.t * w.v * 0.6;
      arr[i * 4 + 3] = w.s * (1 - k) * (1 - k);
    }
  },
};

  foxbell: '<path d="M6 15c0-5 2.5-9 6-9s6 4 6 9z" fill="currentColor" fill-opacity=".25"/><path d="M4.5 15h15M12 6V3.5M10.5 18.5a1.6 1.6 0 0 0 3 0"/>',
