  moth: '<path d="M12 7v12M12 9c-3-4-8-4-8.5 0S7 15 12 13M12 9c3-4 8-4 8.5 0S17 15 12 13" fill="currentColor" fill-opacity=".22"/><path d="M11 6 9 3.5M13 6l2-2.5"/>',
  spirit: '<path d="M8 21h8l-1-6H9z" fill="currentColor" fill-opacity=".25"/><path d="M12 15c-2.5 0-3.5-1.7-3.5-3.5C8.5 9 12 7 12 3c2 2.2 3.5 4.5 3.5 7.5 0 2.5-1.5 4.5-3.5 4.5z"/>',
  pearl: '<circle cx="12" cy="13" r="6" fill="currentColor" fill-opacity=".3"/><path d="M10 10.5a2.5 2.5 0 0 1 2.5-1.5M19 3l.8 2 2 .8-2 .8L19 8.6l-.8-2-2-.8 2-.8z"/>',
  phoenix: '<path d="M5 21C7 12 12 5 20 3c-1 7-5 12-11 14" fill="currentColor" fill-opacity=".25"/><path d="M5 21l5-6M9.5 12l3.5 1M12.5 8.5l4 .5"/>',
  echo: '<circle cx="12" cy="12" r="2.2" fill="currentColor"/><path d="M7.5 7.5a6.4 6.4 0 0 0 0 9M16.5 7.5a6.4 6.4 0 0 1 0 9M4.6 4.6a10.5 10.5 0 0 0 0 14.8M19.4 4.6a10.5 10.5 0 0 1 0 14.8"/>',
};
function icon(k, cls) {
  return '<svg class="' + (cls || 'ic') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONS[k] || '') + '</svg>';
}
const LOCK_SVG = '<svg class="lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2" fill="currentColor" fill-opacity=".2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';

const UI = {
  e: {}, cache: {}, hintTimer: 0, guardUntil: 0, sheetKind: null, resetArmed: false, rewardCards: [], rewardLock: 0, shownScore: 0,

  init() {
    const ids = ['hud', 'h-score', 'h-board', 'h-bname', 'b-pause', 'h-embers', 'h-emb', 'h-reds', 'h-red', 'h-mult', 'h-mul', 'h-wind', 'h-windv', 'dock', 'd-keeper', 'd-charms',
      'banner', 'powerflash', 'hint', 'toasts', 'title', 'logo', 't-keepers', 't-kdesc', 'b-play', 'play-sub', 'b-daily', 'b-book', 'b-records', 'b-help', 'b-settings',
      'clear', 'c-kicker', 'c-name', 'c-shots', 'c-score', 'c-fever', 'c-cascade', 'c-gain', 'b-next', 'reward', 'r-cards', 'b-skip',
      'over', 'o-head', 'o-score', 'o-near', 'o-board', 'o-lit', 'o-catch', 'o-shot', 'o-charms', 'o-unlocks', 'b-again', 'b-menu', 'b-endless',
      'pause', 'b-resume', 'b-restart', 'b-quit', 'p-charms', 'pause-toggles', 'sheet', 'sheet-title', 'sheet-body', 'sheet-close'];
    for (const id of ids) this.e[id] = document.getElementById(id);
    const E = this.e;
    if (ASSET_DATA.logo) E.logo.src = ASSET_DATA.logo;
    const click = (node, fn, quiet) => node.addEventListener('click', (ev) => {
      ev.preventDefault();
      Sound.ensure();
      if (performance.now() < this.guardUntil) return;
      if (!quiet) Sfx.ui();
      fn(ev);
    });
    click(E['b-play'], () => this.play('run'));
    click(E['b-daily'], () => this.play('daily'));
    click(E['b-book'], () => this.openSheet('book'));
    click(E['b-records'], () => this.openSheet('records'));
    click(E['b-help'], () => this.openSheet('help'));
    click(E['b-settings'], () => this.openSheet('settings'));
    click(E['b-next'], () => { this.hide('clear'); Game.continueAfterClear(); });
    click(E['b-skip'], () => this.pickReward(-1));
    click(E['b-again'], () => this.play(G.run ? G.run.mode : 'run'));
    click(E['b-menu'], () => this.toMenu());
    click(E['b-endless'], () => Game.continueEndless());
    click(E['b-pause'], () => this.pause());
    click(E['b-resume'], () => this.resume());
    click(E['b-restart'], () => { this.hide('pause'); this.play(G.run.mode); });
    click(E['b-quit'], () => { this.hide('pause'); this.toMenu(); });
    click(E['sheet-close'], () => this.closeSheet());
    E.sheet.addEventListener('click', (ev) => { if (ev.target === E.sheet) this.closeSheet(); });
    E['d-charms'].addEventListener('click', (ev) => {
      const b = ev.target.closest('[data-k]');
      if (b) this.toast(CHARMS[b.dataset.k].name + ': ' + CHARMS[b.dataset.k].desc);
    });
    E['d-keeper'].addEventListener('click', () => {
      if (G.run) { const k = KEEPERS[G.run.keeper]; this.toast(k.power + ': ' + k.desc); }
    });
    this.buildKeepers();
    this.refreshTitle();
  },

  show(id) { this.e[id].hidden = false; },
  hide(id) { this.e[id].hidden = true; },

  play(mode) {
    Sound.ensure();
    this.closeSheet();
    for (const id of ['over', 'pause', 'clear', 'reward']) this.hide(id);
    Game.startRun(mode, Save.data.keeper);
  },

  toMenu() {
    for (const id of ['over', 'pause', 'hud', 'dock', 'clear', 'reward']) this.hide(id);
    this.hideHint();
    this.refreshTitle();
    this.show('title');
    Game.startDemo();
    App.measureFocus();
  },

  pause() {
    const st = G.state;
    if (!(st === 'aim' || st === 'shot' || st === 'settle' || st === 'intro')) return;
    this.pausedFrom = st;
    G.state = 'paused';
    Input.release();
    Sound.musicFilter(700, 0.1);
    this.renderCharmList(this.e['p-charms']);
    this.renderToggles(this.e['pause-toggles'], ['sound', 'music', 'shake', 'numbers']);
    this.show('pause');
  },

  resume() {
    if (G.state !== 'paused') return;
    this.hide('pause');
    G.state = this.pausedFrom || 'aim';
    Sound.musicFilter(18000, 0.1);
  },

  onRunStart() {
    for (const id of ['title', 'over', 'pause', 'clear', 'reward']) this.hide(id);
    this.closeSheet();
    this.show('hud');
    this.show('dock');
    this.cache = {};
    this.shownScore = 0;
    this.e.toasts.innerHTML = '';
    this.hideHint();
    this.keeper();
    this.charms();
    if (!Save.data.seen.howto) {
      Save.data.seen.howto = true;
      setTimeout(() => this.hint(isTouchDevice ? 'Drag to aim, release to fire. Light every red lantern.' : 'Move to aim, click to fire. Light every red lantern.', 5), 1600);
    }
  },

  // ---------------------------------------------------------- HUD
  frame(dt) {
    const R = G.run;
    if (!R || G.attract) return;
    const E = this.e, C = this.cache, B = G.B;
    if (this.shownScore !== R.score) {
      this.shownScore += Math.max(1, Math.ceil((R.score - this.shownScore) * Math.min(1, dt * 10)));
      if (this.shownScore > R.score) this.shownScore = R.score;
      E['h-score'].textContent = fmtNum(this.shownScore);
    }
    if (C.emb !== R.embers) {
      const up = C.emb !== undefined && R.embers > C.emb;
      C.emb = R.embers;
      E['h-emb'].textContent = R.embers;
      E['h-embers'].classList.toggle('low', R.embers <= 2);
      if (up) this.bump(E['h-embers']);
    }
    if (B) {
      if (C.red !== B.redsLeft) { C.red = B.redsLeft; E['h-red'].textContent = Math.max(0, B.redsLeft); this.bump(E['h-reds']); }
      const m = B.cleared ? 10 : Game.mult() + (G.shot ? G.shot.multBonus : 0);
      if (C.mul !== m) { C.mul = m; E['h-mul'].textContent = '×' + m; E['h-mult'].dataset.m = Math.min(m, 10); if (m > 1) this.bump(E['h-mult']); }
      const w = World.wind;
      if (C.wind !== w) {
        C.wind = w;
        E['h-wind'].hidden = !B.windy;
        E['h-windv'].textContent = w === 0 ? 'Calm' : (w < 0 ? '← ' : '') + 'Wind ' + Math.abs(Math.round(w / 17)) + (w > 0 ? ' →' : '');
      }
      if (C.board !== B.n + B.name) {
        C.board = B.n + B.name;
        E['h-board'].textContent = B.boss ? 'Boss · board ' + B.n : 'Board ' + B.n;
        E['h-bname'].textContent = B.name;
      }
    }
    const sight = R.sight, ks = sight + '|' + R.fox + '|' + R.blazeNext + '|' + R.twinNext;
    if (C.ks !== ks) { C.ks = ks; this.keeper(); }
  },

  hud() { this.cache = Object.assign({}, this.cache, { red: -1, mul: -1 }); },
  embers(bump) { if (bump) this.cache.emb = -1; },

  bump(node) {
    node.classList.remove('bump');
    void node.offsetWidth;
    node.classList.add('bump');
  },

  keeper() {
    const R = G.run;
    if (!R) return;
    const k = KEEPERS[R.keeper];
    let status = 'Jade lanterns: ' + k.power;
    if (R.keeper === 'mira' && R.sight > 0) status = 'Long Sight · ' + R.sight + ' shot' + (R.sight > 1 ? 's' : '');
    if (R.keeper === 'kitsu' && R.fox > 0) status = 'Second Fall ready' + (R.fox > 1 ? ' ×' + R.fox : '');
    if (R.keeper === 'kenji' && R.blazeNext) status = 'Blaze on your next shot';
    if (R.keeper === 'twins' && R.twinNext) status = 'Twin Spark on your next shot';
    const box = this.e['d-keeper'];
    box.style.setProperty('--kc', k.color);
    box.innerHTML = '<span class="k-ic">' + icon(R.keeper) + '</span><span class="k-txt"><b></b><span></span></span>';
    box.querySelector('b').textContent = k.name;
    box.querySelector('.k-txt span').textContent = status;
  },

  charms() {
    const R = G.run, box = this.e['d-charms'];
    box.innerHTML = '';
    if (!R) return;
    for (const k of Object.keys(R.charms)) {
      const b = el('button', 'd-charm ' + CHARMS[k].rarity);
      b.type = 'button';
      b.dataset.k = k;
      b.innerHTML = icon(k) + (R.charms[k] > 1 ? '<i>' + R.charms[k] + '</i>' : '');
      b.setAttribute('aria-label', CHARMS[k].name);
      box.appendChild(b);
    }
  },

  boardIntro(n, name, sub, boss) {
    this.banner(boss ? name : 'Board ' + n, boss ? sub : name + ' · ' + sub, boss ? '#ff6a4a' : '#ffe3a0');
    this.cache.board = null;
  },

  banner(main, sub, color) {
    const b = this.e.banner;
    b.querySelector('.b-main').textContent = main;
    b.querySelector('.b-sub').textContent = sub || '';
    b.style.color = color || '#ffe3a0';
    b.classList.remove('on');
    void b.offsetWidth;
    b.classList.add('on');
  },

  powerFlash(name) {
    const p = this.e.powerflash;
    p.textContent = name;
    p.style.color = KEEPERS[G.run.keeper].color;
    p.classList.remove('on');
    void p.offsetWidth;
    p.classList.add('on');
  },

  hint(text, dur) {
    const h = this.e.hint;
    h.querySelector('.hint-text').textContent = text;
    h.classList.add('on');
    clearTimeout(this.hintTimer);
    if (dur) this.hintTimer = setTimeout(() => this.hideHint(), dur * 1000);
  },

  hideHint() {
    clearTimeout(this.hintTimer);
    this.e.hint.classList.remove('on');
  },

  toast(text, kind) {
    const t = el('div', 'toast' + (kind ? ' ' + kind : ''));
    t.textContent = text;
    const box = this.e.toasts;
    box.appendChild(t);
    while (box.children.length > 3) box.removeChild(box.firstChild);
    setTimeout(() => t.remove(), 3200);
  },

  // ---------------------------------------------------------- between boards
  showClear(o) {
    const E = this.e;
    this.hideHint();
    E['c-kicker'].textContent = o.boss ? 'Boss defeated' : 'Board ' + o.n + ' cleared';
    E['c-name'].textContent = o.name;
    E['c-shots'].textContent = o.shots;
    E['c-score'].textContent = fmtNum(o.score);
    E['c-fever'].textContent = fmtNum(o.fever);
    E['c-cascade'].textContent = fmtNum(o.cascade);
    E['c-gain'].innerHTML = o.spare ? '<i class="ember-ico"></i> ' + o.spare + ' spare ember' + (o.spare > 1 ? 's' : '') + ' · +' + fmtNum(o.sparePts) : 'Not an ember to spare';
    const last = G.run.board === FESTIVAL_LEN && !G.run.endless;
    E['b-next'].querySelector('.play-label').textContent = last ? 'Finish the festival' : 'Choose a charm';
    setTimeout(() => { if (G.state === 'clear') { this.show('clear'); Sfx.clear(); this.guardUntil = performance.now() + 450; } }, 700);
  },

  showReward(keys) {
    const E = this.e, box = E['r-cards'];
    box.innerHTML = '';
    this.rewardCards = keys;
    keys.forEach((k, i) => {
      const c = CHARMS[k], b = el('button', 'card ' + c.rarity);
      b.type = 'button';
      const owned = G.run.charms[k];
      b.innerHTML = '<span class="c-ic">' + icon(k) + '</span><span class="c-body"><span class="c-name"></span><span class="c-desc"></span></span><span class="c-tag"></span><span class="c-key">' + (i + 1) + '</span>';
      b.querySelector('.c-name').textContent = c.name + (owned ? ' ×' + (owned + 1) : '');
      b.querySelector('.c-desc').textContent = c.desc;
      b.querySelector('.c-tag').textContent = Save.data.discovered[k] ? c.rarity : 'New · ' + c.rarity;
      b.addEventListener('click', (ev) => { ev.preventDefault(); this.pickReward(i); });
      box.appendChild(b);
    });
    this.show('reward');
    this.rewardLock = performance.now() + 420;
    E.reward.classList.add('locked');
    setTimeout(() => E.reward.classList.remove('locked'), 420);
  },

  pickReward(i) {
    if (G.state !== 'reward' || performance.now() < this.rewardLock) return;
    const k = i >= 0 ? this.rewardCards[i] : null;
    if (i >= 0 && !k) return;
    this.hide('reward');
    if (k) Sfx.card(CHARMS[k].rarity); else Sfx.ui();
    Game.takeCharm(k);
    this.charms();
    this.keeper();
  },

  // ---------------------------------------------------------- run over
  showOver(o) {
    const { R, B, won, isBest, prevBest, fresh } = o;
    const E = this.e;
    this.hide('hud');
    this.hide('dock');
    this.hideHint();
    E['o-head'].textContent = won ? 'The festival is complete' : isBest ? 'New best festival' : 'The lanterns go dark';
    E['o-head'].classList.toggle('best', won || isBest);
    E['o-score'].textContent = fmtNum(R.score);
    let near = '';
    if (won) near = 'All twelve boards lit. The river is full of lanterns.';
    else if (o.redsLeft > 0) near = o.redsLeft === 1 ? 'Just 1 red lantern left on ' + (B.boss ? B.name : 'board ' + B.n) : o.redsLeft + ' red lanterns left on ' + (B.boss ? B.name : 'board ' + B.n);
    if (!won && isBest && prevBest > 0) near += ' · beat your best by ' + fmtNum(R.score - prevBest);
    else if (!won && !isBest && prevBest > 0) near += ' · best ' + fmtNum(prevBest);
    E['o-near'].textContent = near;
    E['o-near'].classList.toggle('hot', won || isBest || o.redsLeft <= 2);
    E['o-board'].textContent = R.board;
    E['o-lit'].textContent = fmtNum(R.lit);
    E['o-catch'].textContent = R.catches;
    E['o-shot'].textContent = fmtNum(R.bestShot);
    this.renderCharmRow(E['o-charms']);
    const un = E['o-unlocks'];
    un.innerHTML = '';
    for (const f of fresh) {
      const d = el('div', 'unlock');
      const name = f.kind === 'keeper' ? KEEPERS[f.id].name + ', ' + KEEPERS[f.id].title : CHARMS[f.id].name;
      d.innerHTML = '<span class="u-ic">' + icon(f.id) + '</span><span class="u-txt"><b>' + (f.kind === 'keeper' ? 'New keeper' : 'New charm in the festival') + '</b><span></span></span>';
      d.querySelector('.u-txt span').textContent = name;
      un.appendChild(d);
    }
    un.hidden = !fresh.length;
    E['b-endless'].hidden = !won;
    E['b-again'].querySelector('.play-label').textContent = R.mode === 'daily' ? 'Daily again' : 'Again';
    setTimeout(() => {
      this.show('over');
      this.guardUntil = performance.now() + 600;
      if (won || isBest) Sfx.best();
    }, won ? 400 : 1100);
    if (fresh.length) this.buildKeepers();
  },

  renderCharmRow(box) {
    const R = G.run;
    box.innerHTML = '';
    if (!R) return;
    for (const k of Object.keys(R.charms)) {
      const s = el('span', 'charm-chip ' + CHARMS[k].rarity);
      s.innerHTML = icon(k);
      s.title = CHARMS[k].name;
      box.appendChild(s);
    }
    box.hidden = !box.children.length;
  },

  renderCharmList(box) {
    const R = G.run;
    box.innerHTML = '';
    if (!R || !Object.keys(R.charms).length) { box.hidden = true; return; }
    box.hidden = false;
    for (const k of Object.keys(R.charms)) {
      const d = el('div', 'p-charm ' + CHARMS[k].rarity);
      d.innerHTML = icon(k) + '<span><b></b><span></span></span>';
      d.querySelector('b').textContent = CHARMS[k].name + (R.charms[k] > 1 ? ' ×' + R.charms[k] : '');
      d.querySelector('span span').textContent = CHARMS[k].desc;
      box.appendChild(d);
    }
  },

  // ---------------------------------------------------------- title
  buildKeepers() {
    const box = this.e['t-keepers'];
    box.innerHTML = '';
    for (const id of KEEPER_ORDER) {
      const k = KEEPERS[id], b = el('button', 'keeper');
      b.type = 'button';
      b.dataset.id = id;
      b.setAttribute('role', 'radio');
      b.style.setProperty('--kc', k.color);
      b.innerHTML = '<span class="k-disc">' + icon(id) + LOCK_SVG + '</span><span class="k-name"></span>';
      b.querySelector('.k-name').textContent = k.name;
      b.addEventListener('click', () => { Sound.ensure(); this.pickKeeper(id); });
      box.appendChild(b);
    }
  },

  pickKeeper(id) {
    const k = KEEPERS[id];
    if (!keeperOpen(id)) {
      this.toast(k.name + ', ' + k.title + ' · Unlock: ' + k.unlock.label, 'lock');
      Sfx.ui();
      return;
    }
    Save.data.keeper = id;
    Save.persist();
    Sfx.card('common');
    this.refreshTitle();
  },

  refreshTitle() {
    const S = Save.data, E = this.e;
    if (!E['t-keepers']) return;
    for (const b of E['t-keepers'].children) {
      const id = b.dataset.id, open = keeperOpen(id);
      b.classList.toggle('locked', !open);
      b.setAttribute('aria-checked', String(S.keeper === id));
      b.setAttribute('aria-label', KEEPERS[id].name + (open ? '' : ' (locked)'));
    }
    const k = KEEPERS[S.keeper];
    E['t-kdesc'].innerHTML = '<b></b> <span></span>';
    E['t-kdesc'].querySelector('b').textContent = k.power + ':';
    E['t-kdesc'].querySelector('span').textContent = k.desc;
    E['t-kdesc'].style.setProperty('--kc', k.color);
    E['play-sub'].textContent = S.best.score > 0 ? 'Best ' + fmtNum(S.best.score) + ' · reached board ' + S.best.board : 'Twelve boards, three nights, three bosses';
    const today = todayKey(), played = S.daily.date === today && S.daily.best > 0;
    E['b-daily'].innerHTML = '<span class="d-name">Daily festival</span><span class="d-sub"></span>';
    E['b-daily'].querySelector('.d-sub').textContent = fmtDate(today) + (played ? ' · today’s best ' + fmtNum(S.daily.best) : ' · same boards for everyone today');
  },

  // ---------------------------------------------------------- sheets
  openSheet(kind) {
    const E = this.e;
    this.sheetKind = kind;
    this.resetArmed = false;
    E.sheet.hidden = false;
    const titles = { book: 'Charm book', records: 'Records', help: 'How to play', settings: 'Settings' };
    E['sheet-title'].textContent = titles[kind];
    const body = E['sheet-body'];
    body.innerHTML = '';
    if (kind === 'book') this.renderBook(body);
    else if (kind === 'records') this.renderRecords(body);
    else if (kind === 'help') this.renderHelp(body);
    else this.renderSettings(body);
    setTimeout(() => E['sheet-close'].focus({ preventScroll: true }), 30);
  },

  closeSheet() {
    if (!this.e.sheet || this.e.sheet.hidden) return;
    this.e.sheet.hidden = true;
    this.sheetKind = null;
    this.refreshTitle();
  },

  renderBook(body) {
    const S = Save.data;
    const found = CHARM_ORDER.filter((k) => S.discovered[k]).length;
    body.appendChild(el('p', 'note top', found + ' of ' + CHARM_ORDER.length + ' charms found. Charms turn up between boards.'));
    const grid = el('div', 'book');
    for (const k of CHARM_ORDER) {
      const c = CHARMS[k], seen = S.discovered[k], open = charmOpen(k);
      const d = el('div', 'b-item ' + c.rarity + (seen ? '' : ' unseen'));
      d.innerHTML = '<span class="b-ic">' + (seen ? icon(k) : open ? '<span class="q">?</span>' : LOCK_SVG) + '</span><span class="b-txt"><b></b><span></span></span>';
      d.querySelector('b').textContent = seen ? c.name : open ? 'Not found yet' : 'Locked';
      d.querySelector('.b-txt span').textContent = seen ? c.desc : open ? c.rarity[0].toUpperCase() + c.rarity.slice(1) + ' charm' : 'Unlock: ' + c.unlock.label;
      grid.appendChild(d);
    }
    body.appendChild(grid);
  },

  renderRecords(body) {
    const S = Save.data, st = S.stats;
    const kv = (items) => {
      const d = el('dl', 'kv');
      for (const [k, v] of items) {
        const div = el('div');
        div.innerHTML = '<dt></dt><dd></dd>';
        div.firstChild.textContent = k;
        div.lastChild.textContent = v;
        d.appendChild(div);
      }
      return d;
    };
    body.appendChild(el('p', 'label sec', 'Bests'));
    body.appendChild(kv([['Score', fmtNum(S.best.score)], ['Board', S.best.board], ['One shot', fmtNum(S.best.shot)]]));
    body.appendChild(el('p', 'label sec', 'All festivals'));
    body.appendChild(kv([['Festivals', fmtNum(st.runs)], ['Completed', fmtNum(st.wins)], ['Boards', fmtNum(st.boards)], ['Lanterns', fmtNum(st.lit)], ['Boat catches', fmtNum(st.catches)], ['Powers', fmtNum(st.powers)]]));
    body.appendChild(el('p', 'label sec', 'Bosses'));
    body.appendChild(kv([['Dragon', S.bosses.dragon], ['Moon Wheel', S.bosses.wheel], ['Thunder Kite', S.bosses.kite]]));
    body.appendChild(el('p', 'label sec', 'Top festivals'));
    if (!S.top.length) { body.appendChild(el('p', 'note', 'No festivals yet.')); return; }
    const tb = el('table', 'records');
    tb.innerHTML = '<thead><tr><th>Score</th><th>Board</th><th>Keeper</th><th>Date</th></tr></thead>';
    const tbody = el('tbody');
    for (const r of S.top) {
      const tr = el('tr');
      for (const v of [fmtNum(r.score) + (r.won ? ' ★' : ''), r.board, (KEEPERS[r.keeper] || KEEPERS.mira).name, fmtDate(r.date) + (r.daily ? ' · daily' : '')]) {
        const td = el('td');
        td.textContent = v;
        tr.appendChild(td);
      }
      tbody.appendChild(tr);
    }
    tb.appendChild(tbody);
    body.appendChild(tb);
  },

  renderHelp(body) {
    const aim = isTouchDevice ? 'Drag anywhere to aim, and lift your finger to fire' : 'Move the mouse to aim and click to fire (or use the arrow keys and Space)';
    body.innerHTML = '<ol class="help">' +
      '<li><b>' + aim + '.</b> The dotted line shows where the ember will first bounce.</li>' +
      '<li>Light every <b>red lantern</b> to clear the board. The more reds you light, the higher your multiplier climbs.</li>' +
      '<li>You get <b>10 embers</b> per board. Catch one in the <b>lotus boat</b> or score big in one shot to earn more. Spare embers turn into points when you clear the board.</li>' +
      '<li><b>Jade lanterns</b> wake your keeper’s power. <b>Gold lanterns</b> are worth 500 and move every shot.</li>' +
      '<li>The last red lantern slows time. Then land the ember in the river for a festival bonus.</li>' +
      '<li>After each board you choose a <b>charm</b>. Every fourth board is a boss.</li>' +
      '<li>Bronze orbs never break, and double-paper lanterns need two hits. Hold the screen during a shot to speed it up.</li>' +
      '</ol>';
  },

  renderSettings(body) {
    const box = el('div', 'toggles');
    this.renderToggles(box, ['sound', 'music', 'shake', 'flashes', 'haptics', 'numbers']);
    body.appendChild(box);
    const reset = el('button', 'btn ghost danger-btn', 'Reset all progress');
    reset.type = 'button';
    reset.addEventListener('click', () => {
      if (!this.resetArmed) { this.resetArmed = true; reset.textContent = 'Tap again to erase everything'; return; }
      const settings = Save.data.settings;
      Save.data = defaultSave();
      Save.data.settings = settings;
      Save.sanitize();
      Save.persist();
      reset.textContent = 'Progress erased';
      this.resetArmed = false;
      this.buildKeepers();
    });
    body.appendChild(reset);
    body.appendChild(el('p', 'note', Save.cloud.ready ? 'Progress saves to your account and follows you across devices.' : 'Progress saves in this browser.'));
  },

  renderToggles(box, keys) {
    const labels = { sound: 'Sound', music: 'Music', shake: 'Screen shake', flashes: 'Flashes', haptics: 'Vibration', numbers: 'Score numbers' };
    box.innerHTML = '';
    for (const k of keys) {
      const b = el('button', 'switch');
      b.type = 'button';
      b.setAttribute('role', 'switch');
      b.setAttribute('aria-checked', String(!!Save.data.settings[k]));
      b.innerHTML = '<span></span><span class="knob"></span>';
      b.firstChild.textContent = labels[k];
      b.addEventListener('click', () => {
        Save.data.settings[k] = !Save.data.settings[k];
        b.setAttribute('aria-checked', String(Save.data.settings[k]));
        Sound.ensure();
        Sound.applySettings();
        Save.persist();
        Sfx.ui();
      });
      box.appendChild(b);
    }
  },
};

// ---------------------------------------------------------------- input.js
// Touch: drag anywhere to aim, lift to fire (drag back up to the launcher to cancel).
// Mouse: move to aim, click to fire. Keys: arrows to aim, Space to fire.
const Input = {
  id: null, aiming: false, cancel: false, keys: new Set(),

  init(stage) {
    this.stage = stage;
    stage.addEventListener('pointerdown', (e) => this.down(e));
    window.addEventListener('pointermove', (e) => this.move(e));
    window.addEventListener('pointerup', (e) => this.up(e));
    window.addEventListener('pointercancel', (e) => this.up(e, true));
    window.addEventListener('keydown', (e) => this.key(e, true));
    window.addEventListener('keyup', (e) => this.key(e, false));
    window.addEventListener('blur', () => { this.keys.clear(); this.release(); });
    stage.addEventListener('contextmenu', (e) => e.preventDefault());
  },

  toBoard(cx, cy) {
    return [(cx * G.dpr - Render.ox) / Render.S, (cy * G.dpr - Render.oy) / Render.S];
  },

  aimAt(cx, cy) {
    const [x, y] = this.toBoard(cx, cy);
    this.cancel = y < LAUNCH.y + 26;
    G.aimCancel = this.cancel && this.aiming;
    if (this.cancel) return;
    Game.setAim(Math.atan2(y - LAUNCH.y, x - LAUNCH.x));
  },

  down(e) {
    Sound.ensure();
    if (e.button > 0) return;
    if (G.state === 'shot') {
      this.id = e.pointerId;
      G.fast = true;
      return;
    }
    if (G.state !== 'aim' || this.id !== null) return;
    e.preventDefault();
    this.id = e.pointerId;
    this.aiming = true;
    try { this.stage.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    this.aimAt(e.clientX, e.clientY);
  },

  move(e) {
    if (this.id === null) {
      if (e.pointerType === 'mouse' && G.state === 'aim') this.aimAt(e.clientX, e.clientY);
      return;
    }
    if (e.pointerId !== this.id) return;
    if (this.aiming && G.state === 'aim') this.aimAt(e.clientX, e.clientY);
  },

  up(e, cancelled) {
    if (e.pointerId !== this.id) return;
    if (G.state === 'shot') G.fast = false;
    else if (this.aiming && G.state === 'aim' && !this.cancel && !cancelled) Game.fire();
    this.release();
  },

  release() {
    this.id = null;
    this.aiming = false;
    this.cancel = false;
    G.aimCancel = false;
    G.fast = false;
  },

  poll(dt) {
    if (G.state !== 'aim') return;
    const K = this.keys, d = (K.has('ArrowRight') || K.has('KeyD') ? 1 : 0) - (K.has('ArrowLeft') || K.has('KeyA') ? 1 : 0);
    if (d) Game.setAim(G.aim - d * dt * (K.has('ShiftLeft') || K.has('ShiftRight') ? 0.12 : 0.85));
  },

  key(e, down) {
    const c = e.code;
    if (['ArrowLeft', 'ArrowRight', 'KeyA', 'KeyD', 'ShiftLeft', 'ShiftRight'].includes(c)) {
      if (down) this.keys.add(c); else this.keys.delete(c);
      if (c.startsWith('Arrow') && (G.state === 'aim' || G.state === 'shot')) e.preventDefault();
      return;
    }
    if (c === 'Space' && G.state === 'shot') { G.fast = down; e.preventDefault(); return; }
    if (!down || e.repeat) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    Sound.ensure();
    if (UI.sheetKind) { if (c === 'Escape') UI.closeSheet(); return; }
    const st = G.state;
    if (st === 'aim') {
      if (c === 'Space' || c === 'Enter') { e.preventDefault(); Game.fire(); }
      else if (c === 'Escape' || c === 'KeyP') UI.pause();
    } else if (st === 'shot' || st === 'settle' || st === 'intro') {
      if (c === 'Escape' || c === 'KeyP') UI.pause();
    } else if (st === 'paused') {
      if (c === 'Escape' || c === 'KeyP') UI.resume();
    } else if (st === 'reward') {
      const i = ['Digit1', 'Digit2', 'Digit3'].indexOf(c);
      if (i >= 0) UI.pickReward(i);
    } else if (st === 'clear') {
      if ((c === 'Enter' || c === 'Space') && !UI.e.clear.hidden) { e.preventDefault(); UI.hide('clear'); Game.continueAfterClear(); }
    } else if (st === 'over') {
      if (performance.now() < UI.guardUntil || UI.e.over.hidden) return;
      if (c === 'Enter') { e.preventDefault(); UI.play(G.run.mode); }
      else if (c === 'Escape') UI.toMenu();
    } else if (st === 'title') {
      if (c === 'Enter') { e.preventDefault(); UI.play('run'); }
    }
  },
};

// ---------------------------------------------------------------- main.js
const Quality = {
  level: 0, acc: 0, n: 0, lastChange: 0,
  dprCap() { return [2, 1.6, 1.25, 1][this.level]; },
  track(dt) {
    if (G.state === 'paused' || G.state === 'boot') { this.acc = 0; this.n = 0; return; }
    this.acc += dt;
    this.n++;
    if (this.n < 90) return;
    const avg = this.acc / this.n;
    this.acc = 0;
    this.n = 0;
    const now = performance.now();
    if (avg > 0.024 && this.level < 3 && now - this.lastChange > 3000) {
      this.level++;
      this.lastChange = now;
      if (this.level >= 2) Post.p.lite = true;
      App.resize();
      App.redraw();
    }
  },
};

const App = {
  last: 0,

  boot() {
    Save.load();
    FX.init();
    this.glCanvas = document.getElementById('gl');
    this.scene = document.getElementById('scene');
    const ok = Post.init(this.glCanvas);
    if (ok) this.scene.style.display = 'none';
    else this.glCanvas.style.display = 'none';
    Post.p.bloom = 0.75;
    Post.p.lo = 0.6;
    Post.p.hi = 0.98;
    Render.init(this.scene);
    UI.init();
    Input.init(document.getElementById('stage'));
    this.resize();
    window.addEventListener('resize', () => this.resize());
    window.addEventListener('orientationchange', () => setTimeout(() => this.resize(), 120));
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        UI.pause();
        if (Sound.ac) Sound.ac.suspend().catch(() => {});
      } else if (Sound.ac) Sound.ac.resume().catch(() => {});
    });
    Assets.load().then(() => {
      Game.startDemo();
      this.measureFocus();
      document.getElementById('app').classList.add('ready');
    });
    requestAnimationFrame((t) => this.frame(t));
    Save.cloudInit();
    try { if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({ v: 1 })); } catch (e) { /* ignore */ }
  },

  // the board is a fixed 600 x 920 world, scaled to fit between the HUD rows
  resize() {
    const app = document.getElementById('app');
    const cw = Math.max(1, app.clientWidth), ch = Math.max(1, app.clientHeight);
    const dpr = Math.min(window.devicePixelRatio || 1, Quality.dprCap());
    const safeTop = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sat')) || 0;
    const top = safeTop + (cw >= 720 ? 92 : 86), bottom = cw >= 720 ? 70 : 64;
    const avail = Math.max(200, ch - top - bottom);
    const sc = Math.min(cw / BOARD_W, avail / BOARD_H);
    const bxc = (cw - BOARD_W * sc) / 2, byc = top + (avail - BOARD_H * sc) / 2;
    const pw = Math.round(cw * dpr), ph = Math.round(ch * dpr);
    for (const c of [this.glCanvas, this.scene]) {
      if (c.width !== pw) c.width = pw;
      if (c.height !== ph) c.height = ph;
    }
    G.pxW = pw; G.pxH = ph; G.dpr = dpr; G.css = sc;
    G.s = sc * dpr;
    G.bx = bxc * dpr;
    G.by = byc * dpr;
    G.cssW = cw; G.cssH = ch;
    document.documentElement.style.setProperty('--board-top', byc.toFixed(1) + 'px');
    document.documentElement.style.setProperty('--board-bottom', (byc + BOARD_H * sc).toFixed(1) + 'px');
    document.documentElement.style.setProperty('--board-left', bxc.toFixed(1) + 'px');
    document.documentElement.style.setProperty('--board-w', (BOARD_W * sc).toFixed(1) + 'px');
    if (Post.ok) Post.resize(pw, ph);
    Render.sky = null;
    this.measureFocus();
    if (G.state !== 'boot' && G.B) this.redraw();
  },

  measureFocus() { /* the demo board fills the screen; nothing to aim the camera at */ },

  // draw at once after a resize so the cleared canvases never show a blank frame
  redraw() {
    try {
      Render.draw();
      if (Post.ok && !Post.lost) Post.present(this.scene, G.timeR);
    } catch (e) { /* the next frame will try again */ }
  },

  frame(now) {
    requestAnimationFrame((t) => this.frame(t));
    const dt = this.last ? Math.min(0.05, Math.max(0, (now - this.last) / 1000)) : 0.016;
    this.last = now;
    try {
      Input.poll(dt);
      Game.update(dt);
      Render.draw();
      if (Post.ok && !Post.lost) {
        const P = Post.p;
        P.ca = Math.min(2, FX.ca * 0.8 + G.slowAmt * 0.4);
        P.flash = FX.flashA;
        P.flashCol = FX.flashCol;
        P.slow = G.slowAmt * 0.5;
        P.vig = 0.5 + 0.35 * G.slowAmt;
        Render.writeWaves(P.waves);
        Post.present(this.scene, G.timeR);
      }
      UI.frame(dt);
    } catch (err) {
      if (!this.errLogged) { this.errLogged = true; console.error('[lanternfall]', err); }
    }
    Quality.track(dt);
  },
};

function start() {
  App.boot();
}

if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
else start();

})();
</script>
