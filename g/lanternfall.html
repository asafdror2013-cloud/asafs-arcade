<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070a1f">
<title>Lanternfall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Lantern festival: indigo night, vermilion lacquer, gold leaf, paper cream; a Mincho serif for display */
  --night: #070a1f;
  --panel: #11133a;
  --panel-2: #181a48;
  --vermilion: #e8321f;
  --red: #ff4a2e;
  --gold: #ffc23a;
  --paper: #f3e6c8;
  --jade: #2dff9a;
  --sky: #8fd3ff;
  --text: #fbf3e4;
  --muted: #b3a9c9;
  --line: rgba(255, 194, 58, 0.32);
  --display: "Shippori Mincho B1", "Hiragino Mincho ProN", Georgia, serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", system-ui, sans-serif;
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;
}

html, body {
  height: 100%;
  margin: 0;
  background: var(--night);
  color: var(--text);
  font-family: var(--body);
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
}
#app { position: fixed; inset: 0; overflow: hidden; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
#gl, #scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#stage { position: absolute; inset: 0; touch-action: none; }
.num { font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }
#app:not(.ready) #title { opacity: 0; }
#title { transition: opacity 0.6s ease; }

/* ---------------------------------------------------------- buttons */
.btn { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
.btn:focus-visible, .icon-btn:focus-visible, .card:focus-visible, .keeper:focus-visible, .switch:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

.btn.play {
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  width: 100%;
  min-height: 62px;
  border-radius: 14px;
  border: 1.5px solid var(--gold);
  background: linear-gradient(180deg, #f0472c, #b31d12 70%, #8a140c);
  box-shadow: 0 0 26px rgba(255, 74, 46, 0.35), inset 0 1px 0 rgba(255, 220, 160, 0.5), inset 0 -10px 18px rgba(60, 0, 0, 0.35);
  transition: transform 0.12s ease;
}
.btn.play:active { transform: scale(0.98); }
.btn.play::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(100deg, transparent 30%, rgba(255, 236, 190, 0.28) 50%, transparent 70%);
  transform: translateX(-100%);
  animation: sheen 3.8s ease-in-out infinite;
  pointer-events: none;
}
@keyframes sheen { 0%, 62% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
.play-label { font-family: var(--display); font-weight: 800; font-size: 21px; letter-spacing: 0.08em; color: #fff3dc; text-shadow: 0 1px 0 rgba(90, 10, 4, 0.8), 0 0 14px rgba(255, 190, 120, 0.6); }
.play-sub { font-size: 12.5px; color: rgba(255, 236, 210, 0.8); letter-spacing: 0.02em; }

.btn.daily {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
  width: 100%;
  padding: 10px 12px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: rgba(255, 194, 58, 0.06);
}
.d-name { font-family: var(--display); font-weight: 700; font-size: 15px; color: var(--gold); letter-spacing: 0.04em; }
.d-sub { font-size: 12px; color: var(--muted); }
.btn.daily.endless { color: var(--gold); font-family: var(--display); font-weight: 700; font-size: 16px; }

.btn.ghost { padding: 10px 12px; border-radius: 10px; color: var(--muted); font-size: 14px; font-weight: 500; }
.btn.ghost:hover { color: var(--text); background: rgba(255, 255, 255, 0.05); }

.icon-btn {
  font: inherit;
  color: var(--text);
  background: rgba(17, 19, 58, 0.7);
  border: 1px solid var(--line);
  border-radius: 10px;
  width: 38px;
  height: 38px;
  display: inline-grid;
  place-items: center;
  cursor: pointer;
  padding: 0;
}
#b-pause { display: inline-flex; gap: 4px; justify-content: center; align-items: center; pointer-events: auto; }
#b-pause span { width: 3px; height: 12px; border-radius: 2px; background: var(--text); }
.icon-btn.close { font-size: 22px; line-height: 1; }

.ember-ico { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff, #ffe0a0 35%, #ff9a3a 70%, #c85a10); box-shadow: 0 0 10px rgba(255, 154, 58, 0.9); flex: none; }
.red-ico { display: inline-block; width: 11px; height: 13px; border-radius: 45%; background: radial-gradient(circle at 40% 35%, #ff9a7a, var(--red) 55%, #8a140c); box-shadow: 0 0 8px rgba(255, 74, 46, 0.7); flex: none; position: relative; }
.red-ico::before, .red-ico::after { content: ""; position: absolute; left: 2px; right: 2px; height: 2px; background: #3a1208; border-radius: 1px; }
.red-ico::before { top: -1px; }
.red-ico::after { bottom: -1px; }

.label { margin: 0; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
.kicker { margin: 0; text-align: center; font-size: 11.5px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--gold); }

/* ---------------------------------------------------------- screens */
.screen { position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column; overflow-y: auto; touch-action: pan-y; -webkit-overflow-scrolling: touch; }
.screen.center { align-items: center; justify-content: center; background: rgba(5, 6, 22, 0.6); }
.screen.overlay { background: radial-gradient(120% 90% at 50% 45%, rgba(20, 16, 50, 0.82), rgba(5, 6, 22, 0.94)); }
.slab {
  box-sizing: border-box;
  width: 100%;
  max-width: 540px;
  margin: 0 auto;
  display: grid;
  gap: 12px;
  padding: 16px 16px max(16px, var(--sab));
  border-radius: 22px 22px 0 0;
  border-top: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(17, 19, 58, 0.82), rgba(7, 8, 28, 0.97));
}

/* title */
.title-top { padding: max(16px, calc(var(--sat) + 10px), 3vh) 14px 0; text-align: center; background: linear-gradient(180deg, rgba(5, 6, 22, 0.85), rgba(5, 6, 22, 0)); }
#logo { display: block; width: min(92vw, 540px); height: auto; margin: 0 auto; filter: drop-shadow(0 0 16px rgba(255, 110, 50, 0.45)); }
.tag { margin: 4px 0 0; font-family: var(--display); font-weight: 700; font-size: clamp(11px, 3.4vw, 14px); letter-spacing: 0.22em; padding-left: 0.22em; color: var(--paper); opacity: 0.85; text-transform: uppercase; white-space: nowrap; }
.title-mid { flex: 1; min-height: 120px; }
.keepers { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.keeper { font: inherit; color: var(--text); background: none; border: 0; padding: 2px 0; display: grid; justify-items: center; gap: 5px; cursor: pointer; }
.k-disc { position: relative; width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center; color: var(--kc); border: 1px solid rgba(255, 255, 255, 0.14); background: radial-gradient(circle, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.01) 70%); transition: box-shadow 0.2s, border-color 0.2s; }
.k-disc .ic { width: 26px; height: 26px; }
.k-disc .lock { display: none; position: absolute; width: 18px; height: 18px; right: -2px; bottom: -2px; color: var(--muted); background: var(--panel); border-radius: 50%; padding: 2px; }
.k-name { font-family: var(--display); font-weight: 700; font-size: 12px; color: var(--muted); white-space: nowrap; }
.keeper[aria-checked="true"] .k-disc { border-color: var(--kc); box-shadow: 0 0 0 1px var(--kc) inset, 0 0 20px -2px var(--kc); }
.keeper[aria-checked="true"] .k-name { color: var(--text); }
.keeper.locked .k-disc { color: rgba(255, 255, 255, 0.25); }
.keeper.locked .k-disc .lock { display: block; }
.keeper.locked .k-name { opacity: 0.55; }
.kdesc { margin: -2px 0 0; min-height: 2.7em; text-align: center; font-size: 13px; line-height: 1.4; color: var(--muted); }
.kdesc b { color: var(--kc); font-weight: 700; }
.foot { display: grid; grid-template-columns: repeat(4, auto); justify-content: space-between; gap: 2px; margin: -4px -8px 0; }
.foot .btn.ghost { font-size: 13px; padding: 9px 6px; }

/* ---------------------------------------------------------- HUD */
#hud { position: absolute; top: 0; left: 0; right: 0; z-index: 5; padding: calc(var(--sat) + 8px) 12px 0; pointer-events: none; }
.hud-top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; max-width: 640px; margin: 0 auto; }
.h-score { display: flex; flex-direction: column; line-height: 1.05; }
.h-label { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
#h-score { font-family: var(--display); font-weight: 800; font-size: 24px; color: #fff1d0; text-shadow: 0 0 12px rgba(255, 180, 90, 0.45); }
.h-board { display: flex; flex-direction: column; align-items: center; text-align: center; line-height: 1.15; }
#h-board { font-size: 10.5px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold); }
.h-bname { font-family: var(--display); font-weight: 700; font-size: 15px; white-space: nowrap; }
.hud-top .icon-btn { justify-self: end; }
.hud-row { display: flex; justify-content: center; gap: 8px; margin-top: 8px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px; border-radius: 99px; background: rgba(13, 14, 44, 0.78); border: 1px solid rgba(255, 255, 255, 0.1); font-size: 13px; }
.pill b { font-size: 16px; font-weight: 700; }
.pill span { color: var(--muted); font-size: 12px; }
.pill.embers { border-color: rgba(255, 154, 58, 0.5); }
.pill.embers.low { border-color: var(--red); box-shadow: 0 0 14px rgba(255, 74, 46, 0.5); animation: lowpulse 1s ease-in-out infinite; }
@keyframes lowpulse { 50% { box-shadow: 0 0 4px rgba(255, 74, 46, 0.2); } }
.pill.reds { border-color: rgba(255, 74, 46, 0.45); }
.pill.mult b { color: #ffcf8a; }
.pill.mult[data-m="2"] { border-color: rgba(255, 207, 138, 0.5); }
.pill.mult[data-m="3"] { border-color: rgba(255, 170, 90, 0.7); }
.pill.mult[data-m="5"] { border-color: var(--red); box-shadow: 0 0 12px rgba(255, 90, 50, 0.5); }
.pill.mult[data-m="10"] { border-color: var(--gold); box-shadow: 0 0 16px rgba(255, 194, 58, 0.7); }
.pill.wind { border-color: rgba(143, 211, 255, 0.5); color: var(--sky); }
.pill.wind span { color: var(--sky); font-weight: 700; }
.bump { animation: bump 0.35s cubic-bezier(0.2, 1.6, 0.4, 1); }
@keyframes bump { 0% { transform: scale(1.25); } 100% { transform: scale(1); } }

#dock { position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 12px max(10px, var(--sab)); max-width: 640px; margin: 0 auto; pointer-events: none; }
.d-keeper { display: flex; align-items: center; gap: 8px; pointer-events: auto; cursor: pointer; min-width: 0; }
.k-ic { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--kc); border: 1px solid var(--kc); background: rgba(13, 14, 44, 0.8); box-shadow: 0 0 14px -4px var(--kc); flex: none; }
.k-ic .ic { width: 20px; height: 20px; }
.k-txt { display: grid; line-height: 1.2; min-width: 0; }
.k-txt b { font-family: var(--display); font-size: 13px; }
.k-txt span { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.d-charms { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px; max-width: 55%; pointer-events: auto; }
.d-charm { position: relative; width: 28px; height: 28px; padding: 0; border-radius: 8px; display: grid; place-items: center; color: var(--paper); background: rgba(13, 14, 44, 0.8); border: 1px solid rgba(243, 230, 200, 0.25); cursor: pointer; }
.d-charm .ic { width: 17px; height: 17px; }
.d-charm i { position: absolute; right: -4px; top: -5px; font-style: normal; font-size: 9px; font-weight: 700; background: var(--gold); color: #2a1606; border-radius: 99px; padding: 0 4px; }
.d-charm.rare { color: var(--sky); border-color: rgba(143, 211, 255, 0.45); }
.d-charm.legendary { color: var(--gold); border-color: var(--gold); }

/* ---------------------------------------------------------- overlays */
#banner { position: absolute; left: 0; right: 0; top: 36%; z-index: 6; text-align: center; pointer-events: none; opacity: 0; padding: 0 12px; }
#banner .b-main { font-family: var(--display); font-weight: 800; font-size: clamp(26px, 8vw, 44px); letter-spacing: 0.06em; line-height: 1.1; text-shadow: 0 2px 0 rgba(40, 6, 2, 0.8), 0 0 26px currentColor; }
#banner .b-sub { margin-top: 8px; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--paper); text-shadow: 0 1px 6px rgba(0, 0, 0, 0.8); }
#banner.on { animation: banner 1.9s ease-out forwards; }
@keyframes banner { 0% { opacity: 0; transform: scale(1.15); } 10% { opacity: 1; transform: scale(1); } 78% { opacity: 1; } 100% { opacity: 0; transform: scale(0.98); } }
#powerflash { position: absolute; left: 0; right: 0; bottom: calc(var(--sab) + 70px); z-index: 6; text-align: center; font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: 0.08em; pointer-events: none; opacity: 0; text-shadow: 0 0 18px currentColor, 0 2px 0 rgba(0, 0, 0, 0.6); }
#powerflash.on { animation: banner 1.4s ease-out forwards; }
#hint { position: absolute; left: 50%; bottom: calc(var(--sab) + 96px); z-index: 6; transform: translateX(-50%); width: max-content; max-width: min(86vw, 420px); padding: 10px 16px; border-radius: 14px; background: rgba(17, 19, 58, 0.9); border: 1px solid var(--line); pointer-events: none; opacity: 0; transition: opacity 0.25s ease; }
#hint.on { opacity: 1; }
.hint-text { margin: 0; font-size: 15px; line-height: 1.4; text-align: center; }
#toasts { position: absolute; top: calc(var(--sat) + 96px); left: 0; right: 0; z-index: 7; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; padding: 0 12px; }
.toast { max-width: min(92vw, 460px); box-sizing: border-box; text-align: center; padding: 7px 14px; border-radius: 14px; background: rgba(17, 19, 58, 0.94); border: 1px solid var(--line); font-size: 13px; line-height: 1.35; animation: toast 3.2s ease forwards; }
.toast.lock { border-color: rgba(201, 182, 255, 0.5); }
@keyframes toast { 0% { opacity: 0; transform: translateY(-8px); } 8%, 85% { opacity: 1; transform: none; } 100% { opacity: 0; } }

/* ---------------------------------------------------------- clear & rewards */
.panel { box-sizing: border-box; width: min(92vw, 400px); display: grid; gap: 14px; padding: 20px; border-radius: 20px; background: linear-gradient(180deg, rgba(24, 26, 72, 0.97), rgba(13, 14, 44, 0.97)); border: 1px solid var(--line); box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5); }
.clear-panel { animation: rise 0.4s cubic-bezier(0.2, 0.9, 0.3, 1); }
@keyframes rise { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
.clear-name { margin: -6px 0 0; text-align: center; font-family: var(--display); font-weight: 800; font-size: 28px; color: #fff1d0; text-shadow: 0 0 20px rgba(255, 150, 80, 0.45); }
.c-rows { margin: 0; display: grid; gap: 6px; }
.c-rows > div { display: flex; justify-content: space-between; padding: 7px 2px; border-bottom: 1px solid rgba(255, 255, 255, 0.07); font-size: 14px; }
.c-rows dt { color: var(--muted); }
.c-rows dd { margin: 0; font-weight: 700; }
.c-gain { margin: 0; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: var(--display); font-weight: 800; font-size: 20px; color: #ffcf8a; }
.reward-wrap { box-sizing: border-box; width: min(94vw, 520px); display: grid; gap: 10px; padding: 16px; }
.r-title { margin: -2px 0 6px; text-align: center; font-family: var(--display); font-weight: 800; font-size: 30px; color: #fff1d0; }
#reward.locked .card { pointer-events: none; }
.cards { display: grid; gap: 10px; }
.card {
  --rc: var(--paper);
  position: relative;
  display: grid;
  grid-template-columns: 52px 1fr;
  column-gap: 13px;
  align-items: center;
  padding: 14px 14px;
  border-radius: 16px;
  border: 1px solid rgba(243, 230, 200, 0.2);
  background: linear-gradient(160deg, rgba(30, 30, 80, 0.97), rgba(14, 14, 44, 0.97));
  color: var(--text);
  font: inherit;
  text-align: left;
  cursor: pointer;
  animation: deal 0.42s cubic-bezier(0.2, 1.3, 0.4, 1) backwards;
}
.card:nth-child(2) { animation-delay: 0.07s; }
.card:nth-child(3) { animation-delay: 0.14s; }
@keyframes deal { from { transform: translateY(24px) scale(0.94); opacity: 0; } to { transform: none; opacity: 1; } }
.card:active { transform: scale(0.98); }
.card.rare { --rc: var(--sky); border-color: rgba(143, 211, 255, 0.45); }
.card.legendary { --rc: var(--gold); border-color: var(--gold); box-shadow: 0 0 28px rgba(255, 194, 58, 0.3); background: linear-gradient(160deg, rgba(60, 36, 14, 0.97), rgba(20, 14, 34, 0.97)); }
.c-ic { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; color: var(--rc); border: 1px solid var(--rc); background: radial-gradient(circle, rgba(255, 255, 255, 0.08), transparent 70%); box-shadow: 0 0 16px -4px var(--rc); }
.c-ic .ic { width: 30px; height: 30px; }
.c-body { display: grid; gap: 3px; min-width: 0; }
.c-name { font-family: var(--display); font-weight: 800; font-size: 17px; }
.c-desc { font-size: 14px; line-height: 1.38; color: #d9d0e8; }
.c-tag { position: absolute; top: -9px; right: 14px; padding: 2px 9px; border-radius: 99px; font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #120c20; background: var(--rc); }
.c-key { position: absolute; bottom: 8px; right: 12px; font-size: 11px; color: var(--muted); opacity: 0.6; }
@media (hover: none) { .c-key { display: none; } }
#b-skip { justify-self: center; }

/* ---------------------------------------------------------- run over */
#over { justify-content: flex-end; pointer-events: none; }
#over .over-slab { pointer-events: auto; }
.over-slab { gap: 12px; animation: rise 0.4s cubic-bezier(0.2, 0.9, 0.3, 1); }
.o-head { margin: 0; text-align: center; font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: 0.1em; color: var(--muted); }
.o-head.best { color: var(--gold); text-shadow: 0 0 16px rgba(255, 194, 58, 0.7); }
.o-score { margin: -4px 0 0; text-align: center; font-family: var(--display); font-weight: 800; font-size: clamp(46px, 14vw, 68px); line-height: 1; color: #fff1d0; text-shadow: 0 0 26px rgba(255, 140, 70, 0.45); }
.o-near { margin: 0; text-align: center; font-size: 14px; line-height: 1.4; color: var(--muted); min-height: 1.4em; }
.o-near.hot { color: #ffcf8a; }
.o-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 0; }
.o-stats > div { padding: 8px 4px; border-radius: 10px; background: rgba(255, 255, 255, 0.04); text-align: center; }
.o-stats dt { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.o-stats dd { margin: 3px 0 0; font-size: 18px; font-weight: 700; }
.o-charms { display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; }
.charm-chip { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: var(--paper); border: 1px solid rgba(243, 230, 200, 0.25); }
.charm-chip .ic { width: 18px; height: 18px; }
.charm-chip.rare { color: var(--sky); border-color: rgba(143, 211, 255, 0.45); }
.charm-chip.legendary { color: var(--gold); border-color: var(--gold); }
.o-unlocks { display: grid; gap: 8px; }
.unlock { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; border: 1px solid var(--gold); background: radial-gradient(120% 140% at 0% 0%, rgba(255, 194, 58, 0.18), rgba(255, 194, 58, 0.03)); animation: rise 0.5s cubic-bezier(0.2, 1.4, 0.4, 1); }
.u-ic { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: var(--gold); border: 1px solid var(--gold); flex: none; }
.u-ic .ic { width: 22px; height: 22px; }
.u-txt { display: grid; gap: 1px; }
.u-txt b { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); }
.u-txt span { font-family: var(--display); font-weight: 700; font-size: 16px; }
.o-actions { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: stretch; }

/* ---------------------------------------------------------- pause & sheets */
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.p-charms { display: grid; gap: 8px; max-height: 30vh; overflow-y: auto; }
.p-charm { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; color: var(--paper); }
.p-charm .ic { width: 20px; height: 20px; flex: none; margin-top: 1px; }
.p-charm b { display: block; font-size: 13.5px; }
.p-charm span span { color: var(--muted); }
.p-charm.rare .ic { color: var(--sky); }
.p-charm.legendary .ic { color: var(--gold); }
.toggles { display: grid; gap: 2px; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; padding: 11px 2px; font: inherit; font-size: 15px; color: var(--text); background: none; border: 0; border-bottom: 1px solid rgba(255, 255, 255, 0.06); cursor: pointer; text-align: left; }
.switch .knob { position: relative; width: 40px; height: 22px; border-radius: 99px; background: rgba(255, 255, 255, 0.14); transition: background 0.2s; flex: none; }
.switch .knob::after { content: ""; position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform 0.2s; }
.switch[aria-checked="true"] .knob { background: var(--vermilion); }
.switch[aria-checked="true"] .knob::after { transform: translateX(18px); }
.sheet { position: absolute; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; background: rgba(5, 6, 22, 0.66); }
.sheet-card { box-sizing: border-box; width: 100%; max-width: 540px; max-height: 88%; overflow-y: auto; padding: 16px 16px max(18px, var(--sab)); border-radius: 22px 22px 0 0; border: 1px solid var(--line); border-bottom: 0; background: var(--panel); touch-action: pan-y; animation: rise 0.28s cubic-bezier(0.2, 0.9, 0.3, 1); }
.sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.sheet-head h2 { margin: 0; font-family: var(--display); font-size: 21px; font-weight: 800; color: #fff1d0; }
.sec { margin: 18px 0 8px; }
.book { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.b-item { display: grid; justify-items: center; align-content: start; gap: 7px; padding: 12px 8px; text-align: center; border-radius: 12px; border: 1px solid rgba(243, 230, 200, 0.14); background: rgba(255, 255, 255, 0.03); }
.b-ic { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; color: var(--paper); border: 1px solid rgba(243, 230, 200, 0.3); flex: none; }
.b-ic .ic, .b-ic .lock { width: 22px; height: 22px; }
.b-ic .q { font-family: var(--display); font-weight: 800; font-size: 20px; color: var(--muted); }
.b-txt { display: grid; gap: 3px; min-width: 0; justify-items: center; }
.b-txt b { font-family: var(--display); font-size: 14px; line-height: 1.2; }
.b-txt span { font-size: 12px; color: var(--muted); line-height: 1.35; }
.b-item.rare .b-ic { color: var(--sky); border-color: rgba(143, 211, 255, 0.45); }
.b-item.legendary .b-ic { color: var(--gold); border-color: var(--gold); }
.b-item.unseen { opacity: 0.6; }
.help { margin: 0; padding: 0 0 0 18px; display: grid; gap: 10px; font-size: 14px; line-height: 1.5; }
.help b { color: #ffcf8a; }
.records { width: 100%; border-collapse: collapse; font-size: 14px; }
.records th { text-align: left; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 500; padding: 6px 4px; }
.records td { padding: 8px 4px; border-top: 1px solid rgba(255, 255, 255, 0.06); font-variant-numeric: tabular-nums; }
.records td:first-child { font-weight: 700; color: #fff1d0; }
.kv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0; }
.kv div { padding: 10px; border-radius: 12px; background: rgba(255, 255, 255, 0.04); }
.kv dt { font-size: 11px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
.kv dd { margin: 4px 0 0; font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
.danger-btn { color: var(--red) !important; margin-top: 10px; }
.note { font-size: 12.5px; color: var(--muted); margin: 10px 0 0; line-height: 1.45; }
.note.top { margin: 0 0 12px; }

@media (min-width: 720px) {
  #hud { padding: calc(var(--sat) + 12px) 22px 0; }
  #h-score { font-size: 28px; }
}
@media (max-height: 680px) {
  .kdesc { display: none; }
  .title-mid { min-height: 60px; }
}
@media (prefers-reduced-motion: reduce) {
  .btn.play::after { animation: none; display: none; }
  .clear-panel, .over-slab, .sheet-card, .card, .unlock { animation: none; }
}

</style>
</head>
<body>
<div id="app">
  <canvas id="gl" aria-hidden="true"></canvas>
  <canvas id="scene" aria-hidden="true"></canvas>
  <div id="stage" aria-label="Board: drag to aim, release to fire"></div>

  <div id="hud" hidden>
    <div class="hud-top">
      <div class="h-score"><span class="h-label">Score</span><b id="h-score" class="num">0</b></div>
      <div class="h-board"><span id="h-board">Board 1</span><span id="h-bname" class="h-bname"></span></div>
      <button id="b-pause" class="icon-btn" type="button" aria-label="Pause"><span></span><span></span></button>
    </div>
    <div class="hud-row">
      <div id="h-embers" class="pill embers" aria-label="Embers left"><i class="ember-ico"></i><b id="h-emb" class="num">10</b></div>
      <div id="h-reds" class="pill reds" aria-label="Red lanterns left"><i class="red-ico"></i><b id="h-red" class="num">12</b><span>left</span></div>
      <div id="h-mult" class="pill mult" aria-label="Multiplier"><b id="h-mul" class="num">×1</b></div>
      <div id="h-wind" class="pill wind" hidden><span id="h-windv"></span></div>
    </div>
  </div>

  <div id="dock" hidden>
    <div id="d-keeper" class="d-keeper"></div>
    <div id="d-charms" class="d-charms"></div>
  </div>

  <div id="banner" aria-live="polite"><div class="b-main"></div><div class="b-sub"></div></div>
  <div id="powerflash" aria-live="polite"></div>
  <div id="hint" role="status"><p class="hint-text"></p></div>
  <div id="toasts" aria-live="polite"></div>

  <section id="title" class="screen">
    <header class="title-top">
      <img id="logo" alt="Lanternfall">
      <p class="tag">Light every red lantern</p>
    </header>
    <div class="title-mid"></div>
    <div class="slab">
      <div id="t-keepers" class="keepers" role="radiogroup" aria-label="Choose your lantern keeper"></div>
      <p id="t-kdesc" class="kdesc"></p>
      <button id="b-play" class="btn play" type="button"><span class="play-label">Begin the festival</span><span id="play-sub" class="play-sub"></span></button>
      <button id="b-daily" class="btn daily" type="button"></button>
      <nav class="foot">
        <button id="b-book" class="btn ghost" type="button">Charm book</button>
        <button id="b-records" class="btn ghost" type="button">Records</button>
        <button id="b-help" class="btn ghost" type="button">How to play</button>
        <button id="b-settings" class="btn ghost" type="button">Settings</button>
      </nav>
    </div>
  </section>

  <section id="clear" class="screen center overlay" hidden>
    <div class="panel clear-panel">
      <p id="c-kicker" class="kicker">Board cleared</p>
      <h2 id="c-name" class="clear-name"></h2>
      <dl class="c-rows">
        <div><dt>Shots</dt><dd id="c-shots" class="num">0</dd></div>
        <div><dt>Board score</dt><dd id="c-score" class="num">0</dd></div>
        <div><dt>Festival bonus</dt><dd id="c-fever" class="num">0</dd></div>
        <div><dt>Last lanterns</dt><dd id="c-cascade" class="num">0</dd></div>
      </dl>
      <p id="c-gain" class="c-gain"></p>
      <button id="b-next" class="btn play" type="button"><span class="play-label">Choose a charm</span></button>
    </div>
  </section>

  <section id="reward" class="screen center overlay" hidden>
    <div class="reward-wrap">
      <p class="kicker">A gift from the festival</p>
      <h2 class="r-title">Choose a charm</h2>
      <div id="r-cards" class="cards"></div>
      <button id="b-skip" class="btn ghost" type="button">Skip: +2 embers on the next board</button>
    </div>
  </section>

  <section id="over" class="screen" hidden>
    <div class="slab over-slab">
      <p id="o-head" class="o-head">The lanterns go dark</p>
      <p id="o-score" class="o-score num">0</p>
      <p id="o-near" class="o-near"></p>
      <dl class="o-stats">
        <div><dt>Board</dt><dd id="o-board" class="num">1</dd></div>
        <div><dt>Lit</dt><dd id="o-lit" class="num">0</dd></div>
        <div><dt>Catches</dt><dd id="o-catch" class="num">0</dd></div>
        <div><dt>Best shot</dt><dd id="o-shot" class="num">0</dd></div>
      </dl>
      <div id="o-charms" class="o-charms"></div>
      <div id="o-unlocks" class="o-unlocks"></div>
      <div class="o-actions">
        <button id="b-again" class="btn play" type="button"><span class="play-label">Again</span></button>
        <button id="b-menu" class="btn ghost" type="button">Menu</button>
      </div>
      <button id="b-endless" class="btn daily endless" type="button" hidden>Continue into the night</button>
    </div>
  </section>

  <section id="pause" class="screen center" hidden>
    <div class="panel">
      <p class="kicker">Paused</p>
      <button id="b-resume" class="btn play" type="button"><span class="play-label">Resume</span></button>
      <div class="row2">
        <button id="b-restart" class="btn ghost" type="button">Restart</button>
        <button id="b-quit" class="btn ghost" type="button">Quit to menu</button>
      </div>
      <div id="p-charms" class="p-charms"></div>
      <div id="pause-toggles" class="toggles"></div>
    </div>
  </section>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-head"><h2 id="sheet-title"></h2><button id="sheet-close" class="icon-btn close" type="button" aria-label="Close">×</button></div>
      <div id="sheet-body"></div>
    </div>
  </div>
</div>
<script>

// ---------------------------------------------------------------- util.js
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const sat = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);
const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
const easeInCubic = (t) => t * t * t;
const easeOutQuad = (t) => 1 - (1 - t) * (1 - t);
const easeInOutSine = (t) => -(Math.cos(Math.PI * t) - 1) / 2;
const easeOutBack = (t) => {
  const c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
};
const easeOutElastic = (t) => {
  if (t <= 0) return 0;
  if (t >= 1) return 1;
  return Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (TAU / 3)) + 1;
};

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

class RNG {
  constructor(seed) { this.f = mulberry32(seed >>> 0); }
  next() { return this.f(); }
  range(a, b) { return a + (b - a) * this.f(); }
  int(a, b) { return Math.floor(a + (b - a + 1) * this.f()); }
  pick(arr) { return arr[Math.floor(this.f() * arr.length)]; }
  chance(p) { return this.f() < p; }
  sign() { return this.f() < 0.5 ? -1 : 1; }
  weighted(items, wf) {
    let total = 0;
    for (const it of items) total += Math.max(0, wf(it));
    if (total <= 0) return items[0];
    let r = this.f() * total;
    for (const it of items) {
      r -= Math.max(0, wf(it));
      if (r <= 0) return it;
    }
    return items[items.length - 1];
  }
}

const rnd = (a, b) => a + (b - a) * Math.random();
const rndi = (a, b) => Math.floor(a + (b - a + 1) * Math.random());

function dist(ax, ay, bx, by) { return Math.hypot(ax - bx, ay - by); }

function distToSegment(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  const l2 = dx * dx + dy * dy;
  let t = l2 > 0 ? ((px - ax) * dx + (py - ay) * dy) / l2 : 0;
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
}

// distance from point to infinite line through (x0,y0) with unit direction (ux,uy)
function distToLine(px, py, x0, y0, ux, uy) {
  return Math.abs((px - x0) * uy - (py - y0) * ux);
}

function angDiff(a, b) {
  let d = (b - a) % TAU;
  if (d > Math.PI) d -= TAU;
  if (d < -Math.PI) d += TAU;
  return d;
}

// clip infinite line (point + unit dir) to rectangle, returns [x1,y1,x2,y2] or null
function clipLineToRect(x0, y0, ux, uy, minX, minY, maxX, maxY) {
  let t0 = -1e9, t1 = 1e9;
  const clipAxis = (p, d, lo, hi) => {
    if (Math.abs(d) < 1e-9) return p >= lo && p <= hi;
    let a = (lo - p) / d, b = (hi - p) / d;
    if (a > b) { const t = a; a = b; b = t; }
    t0 = Math.max(t0, a);
    t1 = Math.min(t1, b);
    return t0 <= t1;
  };
  if (!clipAxis(x0, ux, minX, maxX)) return null;
  if (!clipAxis(y0, uy, minY, maxY)) return null;
  return [x0 + ux * t0, y0 + uy * t0, x0 + ux * t1, y0 + uy * t1];
}

function pad2(n) { return n < 10 ? '0' + n : '' + n; }

function todayKey(d) {
  d = d || new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}

function keyToDate(k) {
  const [y, m, d] = k.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function dayDiff(a, b) {
  // whole days from key a to key b
  return Math.round((keyToDate(b) - keyToDate(a)) / 86400000);
}

function dailyNumber(k) {
  return dayDiff('2026-11-01', k) + 1;
}

function fmtNum(n) {
  return Math.floor(n).toLocaleString('en-US');
}

function fmtTime(s) {
  s = Math.max(0, s);
  const m = Math.floor(s / 60);
  const sec = s - m * 60;
  return m + ':' + (sec < 10 ? '0' : '') + sec.toFixed(1);
}

function fmtDate(k) {
  const d = keyToDate(k);
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

// ---- colour helpers
const _rgbCache = new Map();
function hexRgb(hex) {
  let c = _rgbCache.get(hex);
  if (c) return c;
  const h = hex.replace('#', '');
  c = [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
  _rgbCache.set(hex, c);
  return c;
}
function rgba(hex, a) {
  const c = hexRgb(hex);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + (a < 0 ? 0 : a > 1 ? 1 : a).toFixed(3) + ')';
}
function mixHex(a, b, t) {
  const x = hexRgb(a), y = hexRgb(b);
  const r = Math.round(lerp(x[0], y[0], t)), g = Math.round(lerp(x[1], y[1], t)), bl = Math.round(lerp(x[2], y[2], t));
  return '#' + ((1 << 24) | (r << 16) | (g << 8) | bl).toString(16).slice(1);
}
function hsl(h, s, l, a) {
  return 'hsla(' + (((h % 360) + 360) % 360).toFixed(1) + ',' + s + '%,' + l + '%,' + (a === undefined ? 1 : a) + ')';
}

const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}

const prefersReducedMotion = (() => {

// ---------------------------------------------------------------- save.js
const SAVE_KEY = 'lanternfall.save.v1';

function defaultSave() {
  return {
    v: 1,
    keeper: 'mira',
    best: { score: 0, board: 0, shot: 0 },
    stats: { runs: 0, wins: 0, boards: 0, lit: 0, reds: 0, catches: 0, powers: 0, gold: 0, shots: 0 },
    bosses: { dragon: 0, wheel: 0, kite: 0 },
    discovered: {},
    unlocked: {},
    top: [],
    daily: { date: '', best: 0 },
    seen: {},
    settings: { sound: true, music: true, shake: !prefersReducedMotion, flashes: !prefersReducedMotion, haptics: true, numbers: true },
    updated: 0,
  };
}

function deepFill(target, defaults) {
  for (const k in defaults) {
    const dv = defaults[k];
    if (target[k] === undefined || target[k] === null) target[k] = dv === null ? null : JSON.parse(JSON.stringify(dv));
    else if (dv && typeof dv === 'object' && !Array.isArray(dv) && typeof target[k] === 'object') deepFill(target[k], dv);
  }
  return target;
}

function mergeSaves(a, b) {
  a = deepFill(JSON.parse(JSON.stringify(a)), defaultSave());
  b = deepFill(JSON.parse(JSON.stringify(b)), defaultSave());
  const newer = (b.updated || 0) > (a.updated || 0) ? b : a;
  const out = JSON.parse(JSON.stringify(newer));
  for (const k in out.best) out.best[k] = Math.max(a.best[k] || 0, b.best[k] || 0);
  for (const k in out.stats) out.stats[k] = Math.max(a.stats[k] || 0, b.stats[k] || 0);
  for (const k in out.bosses) out.bosses[k] = Math.max(a.bosses[k] || 0, b.bosses[k] || 0);
  out.discovered = Object.assign({}, a.discovered, b.discovered);
  out.unlocked = Object.assign({}, a.unlocked, b.unlocked);
  out.seen = Object.assign({}, a.seen, b.seen);
  if (a.daily.date === b.daily.date) out.daily.best = Math.max(a.daily.best, b.daily.best);
  const seenTop = new Set();
  out.top = a.top.concat(b.top).filter((r) => {
    const key = r.id || r.score + '|' + r.date + '|' + r.board;
    if (seenTop.has(key)) return false;
    seenTop.add(key);
    return true;
  }).sort((x, y) => y.score - x.score).slice(0, 6);
  out.updated = Math.max(a.updated || 0, b.updated || 0);
  return out;
}

const Save = {
  data: defaultSave(),
  cloud: { ref: null, ready: false, writing: false, pending: false, lastJson: '', failed: 0 },

  load() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (raw) this.data = deepFill(JSON.parse(raw), defaultSave());
    } catch (e) { /* storage unavailable */ }
    this.sanitize();
  },

  sanitize() {
    checkUnlocks();
    if (!keeperOpen(this.data.keeper)) this.data.keeper = 'mira';
  },

  persistLocal() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(this.data)); } catch (e) { /* ignore */ }
  },

  persist() {
    this.data.updated = Date.now();
    this.persistLocal();
    this.cloudWrite();
  },

  async cloudInit() {
    try {
      const cl = window.__asafClaude || window.claude;
      if (!cl || typeof cl.use !== 'function') return;
      const [db, user] = await Promise.all([cl.use('db'), cl.use('user')]);
      if (!db || !user) return;
      const id = await user.id();
      if (!id) return;
      const ref = db.doc('data/users/' + id + '/save');
      let timer = 0;
      const snap = await Promise.race([
        ref.get(),
        new Promise((_, rej) => { timer = setTimeout(() => rej(new Error('timeout')), 10000); }),
      ]);
      clearTimeout(timer);
      this.cloud.ref = ref;
      if (snap && snap.exists) {
        const body = snap.data();
        if (body && body.save && typeof body.save === 'object') {
          const remote = JSON.parse(JSON.stringify(body.save));
          this.cloud.lastJson = JSON.stringify(remote);
          this.data = mergeSaves(this.data, remote);
          this.sanitize();
          this.persistLocal();
          if (typeof UI !== 'undefined' && UI.refreshTitle) UI.refreshTitle();
        }
      }
      this.cloud.ready = true;
      this.cloudWrite();
    } catch (e) {
      console.warn('[lanternfall] cloud save unavailable:', e && (e.code || e.message));
    }
  },

  cloudWrite() {
    const c = this.cloud;
    if (!c.ref || !c.ready) return;
    if (c.writing) { c.pending = true; return; }
    const json = JSON.stringify(this.data);
    if (json === c.lastJson) return;
    c.writing = true;
    c.ref.set({ save: JSON.parse(json) })
      .then(() => { c.lastJson = json; c.failed = 0; })
      .catch((e) => {
        const code = e && e.code;
        c.failed++;
        if (code === 'unavailable' && c.failed < 3) setTimeout(() => this.cloudWrite(), 1500 + Math.random() * 1500);
        else if (code && code !== 'unavailable' && code !== 'resource_exhausted') c.ref = null;
      })
      .finally(() => {
        c.writing = false;
        if (c.pending) { c.pending = false; this.cloudWrite(); }
      });
  },
};

function keeperOpen(id) {
  const k = KEEPERS[id];
  return !!k && (!k.unlock || !!Save.data.unlocked['keeper:' + id]);
}

function charmOpen(id) {
  const c = CHARMS[id];
  return !!c && (!c.unlock || !!Save.data.unlocked['charm:' + id]);
}

// returns the keepers and charms that just became available
function checkUnlocks() {
  const S = Save.data, fresh = [];
  for (const id of KEEPER_ORDER) {
    const k = KEEPERS[id];
    if (!k.unlock || S.unlocked['keeper:' + id]) continue;
    if (k.unlock.check(S)) { S.unlocked['keeper:' + id] = true; fresh.push({ kind: 'keeper', id }); }
  }
  for (const id of CHARM_ORDER) {
    const c = CHARMS[id];
    if (!c.unlock || S.unlocked['charm:' + id]) continue;
    if (c.unlock.check(S)) { S.unlocked['charm:' + id] = true; fresh.push({ kind: 'charm', id }); }
  }
  return fresh;
}

// ---------------------------------------------------------------- sound.js (synth core shared with Afterimage)
const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);

const Sound = {
  ac: null, ok: false,
  master: null, musicBus: null, musicLP: null, pump: null, drums: null, sfx: null, revIn: null, delIn: null, noise: null,
  musicOn: true, sfxOn: true, detune: 0, last: {},

  ensure() {
    if (this.ac) {
      if (this.ac.state === 'suspended') this.ac.resume().catch(() => {});
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { this.ac = new AC({ latencyHint: 'interactive' }); } catch (e) {
      try { this.ac = new AC(); } catch (e2) { return; }
    }
    try { this.build(); this.ok = true; } catch (e) { console.warn('[lanternfall] audio off', e); this.ok = false; }
    if (this.ac.state === 'suspended') this.ac.resume().catch(() => {});
    if (this.ok) this.setDelayTime(60 / 88);
  },

  build() {
    const ac = this.ac;
    this.master = ac.createGain();
    this.master.gain.value = 0.9;
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 14; comp.ratio.value = 4;
    comp.attack.value = 0.003; comp.release.value = 0.18;
    this.master.connect(comp);
    comp.connect(ac.destination);

    this.musicBus = ac.createGain();
    this.musicBus.gain.value = 0.48;
    this.musicLP = ac.createBiquadFilter();
    this.musicLP.type = 'lowpass';
    this.musicLP.frequency.value = 18000;
    this.musicLP.Q.value = 0.8;
    this.musicBus.connect(this.musicLP);
    this.musicLP.connect(this.master);
    this.pump = ac.createGain();
    this.pump.connect(this.musicBus);
    this.drums = ac.createGain();
    this.drums.connect(this.musicBus);

    this.sfx = ac.createGain();
    this.sfx.gain.value = 0.75;
    this.sfx.connect(this.master);

    const rev = ac.createConvolver();
    rev.buffer = this.impulse(2.6, 2.4);
    this.revIn = ac.createGain();
    this.revIn.connect(rev);
    const revOut = ac.createGain();
    revOut.gain.value = 0.34;
    rev.connect(revOut);
    revOut.connect(this.master);

    const dl = ac.createDelay(1.5);
    dl.delayTime.value = 0.375;
    const fb = ac.createGain();
    fb.gain.value = 0.36;
    const dlp = ac.createBiquadFilter();
    dlp.type = 'lowpass';
    dlp.frequency.value = 2400;
    this.delIn = ac.createGain();
    this.delIn.connect(dl);
    dl.connect(dlp);
    dlp.connect(fb);
    fb.connect(dl);
    const dOut = ac.createGain();
    dOut.gain.value = 0.3;
    dlp.connect(dOut);
    dOut.connect(this.musicBus);
    this.delayNode = dl;

    const len = ac.sampleRate;
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.noise = buf;
    this.applySettings();
  },

  impulse(dur, decay) {
    const ac = this.ac, rate = ac.sampleRate, len = Math.floor(rate * dur);
    const buf = ac.createBuffer(2, len, rate);
    for (let c = 0; c < 2; c++) {
      const d = buf.getChannelData(c);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
    return buf;
  },

  applySettings() {
    const s = Save.data.settings;
    this.musicOn = !!(s.music && s.sound);
    this.sfxOn = !!s.sound;
    if (!this.ac || !this.musicBus) return;
    const t = this.ac.currentTime;
    this.musicBus.gain.setTargetAtTime(this.musicOn ? 0.48 : 0, t, 0.05);
    this.sfx.gain.setTargetAtTime(this.sfxOn ? 0.75 : 0, t, 0.05);
  },

  setDelayTime(beatLen) {
    if (this.delayNode) this.delayNode.delayTime.setTargetAtTime(beatLen * 0.75, this.ac.currentTime, 0.05);
  },

  musicFilter(freq, tc) {
    if (!this.ac) return;
    this.musicLP.frequency.setTargetAtTime(freq, this.ac.currentTime, tc || 0.08);
  },

  rate(name, gap) {
    const n = performance.now();
    if ((this.last[name] || 0) + gap * 1000 > n) return false;
    this.last[name] = n;
    return true;
  },

  can() { return this.ok && this.ac && this.ac.state === 'running'; },

  tone(o) {
    const ac = this.ac;
    const t = o.t !== undefined ? o.t : ac.currentTime;
    const osc = ac.createOscillator();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.f, t);
    if (o.f2) osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.f2), t + (o.slide || o.dur));
    if (o.detune) osc.detune.setValueAtTime(o.detune, t);
    const g = ac.createGain();
    const a = o.a || 0.004, dur = o.dur, peak = o.g === undefined ? 0.3 : o.g;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t + a);
    if (o.hold) g.gain.setValueAtTime(Math.max(0.0002, peak), t + a + o.hold);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    let node = osc;
    if (o.lp) {
      const f = ac.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.setValueAtTime(o.lp, t);
      if (o.lp2) f.frequency.exponentialRampToValueAtTime(o.lp2, t + dur);
      f.Q.value = o.q || 0.9;
      node.connect(f);
      node = f;
    }
    node.connect(g);
    g.connect(o.dest || this.sfx);
    if (o.rev) { const s = ac.createGain(); s.gain.value = o.rev; g.connect(s); s.connect(this.revIn); }
    if (o.del) { const s = ac.createGain(); s.gain.value = o.del; g.connect(s); s.connect(this.delIn); }
    osc.start(t);
    osc.stop(t + dur + 0.05);
  },

  hiss(o) {
    const ac = this.ac;
    const t = o.t !== undefined ? o.t : ac.currentTime;
    const src = ac.createBufferSource();
    src.buffer = this.noise;
    const f = ac.createBiquadFilter();
    f.type = o.type || 'bandpass';
    f.frequency.setValueAtTime(o.f || 1000, t);
    if (o.f2) f.frequency.exponentialRampToValueAtTime(o.f2, t + o.dur);
    f.Q.value = o.q || 0.9;
    const g = ac.createGain();
    const a = o.a || 0.002;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, o.g === undefined ? 0.3 : o.g), t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
    src.connect(f);
    f.connect(g);
    g.connect(o.dest || this.sfx);
    if (o.rev) { const s = ac.createGain(); s.gain.value = o.rev; g.connect(s); s.connect(this.revIn); }
    src.start(t, Math.random() * 0.4, o.dur + 0.06);
  },
};

const Music = {
  mode: 'title', layer: 0, bpm: 88, step: 0, nextT: 0, roll: false, rollT: 0, rollN: 0,

  setMode(m) {
    if (m === this.mode) return;
    this.mode = m;
    this.bpm = m === 'fever' ? 120 : m === 'boss' ? 96 : 88;
    if (m === 'fever') this.step = Math.ceil(this.step / 16) * 16;
    if (Sound.ac) Sound.musicFilter(m === 'quiet' ? 900 : 18000, 0.4);
  },

  setLayer(l) { this.layer = l; },

  update() {
    if (!Sound.can()) return;
    const ac = Sound.ac, now = ac.currentTime;
    if (this.roll) {
      while (this.rollT < now + 0.1) {
        if (this.rollT < now) this.rollT = now;
        this.rollN++;
        const g = Math.min(0.32, 0.08 + this.rollN * 0.006);
        Sound.hiss({ t: this.rollT, type: 'bandpass', f: 380 + this.rollN * 3, q: 1.2, dur: 0.07, g, dest: Sound.sfx });
        Sound.tone({ t: this.rollT, type: 'sine', f: 95, f2: 70, dur: 0.08, g: g * 0.9, dest: Sound.sfx });
        this.rollT += Math.max(0.045, 0.09 - this.rollN * 0.002);
      }
    }
    if (!Sound.musicOn) { this.nextT = 0; return; }
    if (this.nextT < now) this.nextT = now + 0.05;
    while (this.nextT < now + 0.12) {
      this.play(this.step, this.nextT);
      this.step++;
      this.nextT += 60 / this.bpm / 4;
    }
  },

  play(n, t) {
    const S = Sound, s16 = n % 16, bar = Math.floor(n / 16), m = this.mode, L = this.layer;
    const prog = m === 'boss' ? PROG_BOSS : PROG;
    const ch = prog[bar % 4];
    const barDur = (60 / this.bpm) * 4;
    if (s16 === 0) {
      for (const p of ch.pad) for (const d of [-6, 6]) {
        S.tone({ t, type: m === 'boss' ? 'sawtooth' : 'triangle', f: mtof(p), detune: d, a: 0.6, hold: barDur * 0.55, dur: barDur * 1.05, g: m === 'quiet' ? 0.035 : 0.028, lp: m === 'boss' ? 1100 : 1500, dest: S.pump, rev: 0.6 });
      }
    }
    if (m === 'quiet') return;
    // koto-like plucks
    const dense = m === 'fever' || L >= 2 || m === 'boss';
    const arpHit = dense ? s16 % 2 === 0 : [0, 3, 6, 10, 12].includes(s16);
    if (arpHit && (m !== 'title' || s16 % 4 !== 2)) {
      const k = (s16 / 2 + bar * 3) % ch.arp.length;
      const note = ch.arp[Math.floor(k)] + (m === 'fever' ? 12 : 0);
      this.pluck(t, note, m === 'title' ? 0.045 : 0.05);
    }
    // a wind chime now and then on the title screen
    if (m === 'title' && s16 === 8 && bar % 2 === 1) this.pluck(t, CHIME[8 + ((bar * 5) % 6)], 0.03, true);
    if (m === 'title') return;
    // bass
    if ((L >= 1 || m !== 'calm') && (s16 === 0 || s16 === 8 || (m === 'fever' && s16 % 4 === 0))) {
      S.tone({ t, type: 'triangle', f: mtof(ch.bass + 12), dur: 0.5, g: 0.16, lp: 900, dest: S.pump });
      S.tone({ t, type: 'sine', f: mtof(ch.bass), dur: 0.6, g: 0.2, dest: S.pump });
    }
    // taiko and shaker
    const taiko = m === 'fever' ? s16 % 4 === 0 || s16 === 14 : m === 'boss' ? s16 === 0 || s16 === 6 || s16 === 8 || s16 === 12 : L >= 1 ? s16 === 0 || s16 === 8 || (L >= 2 && s16 === 14) : false;
    if (taiko) {
      S.tone({ t, type: 'sine', f: 120, f2: 52, slide: 0.12, dur: 0.42, g: m === 'fever' ? 0.75 : 0.5, dest: S.drums });
      S.hiss({ t, type: 'lowpass', f: 900, dur: 0.12, g: 0.18, dest: S.drums });
    }
    if ((L >= 1 || m === 'fever' || m === 'boss') && (m === 'fever' || s16 % 2 === 0)) {
      S.hiss({ t, type: 'highpass', f: 7000, dur: 0.035, g: s16 % 4 === 2 ? 0.06 : 0.03, dest: S.drums });
    }
    if (m === 'fever') {
      const note = FEVER_TUNE[n % FEVER_TUNE.length];
      if (note) this.flute(t, note, (60 / this.bpm / 4) * 1.8);
    }
  },

  pluck(t, note, g, high) {
    const S = Sound, f = mtof(note);
    S.tone({ t, type: 'triangle', f: f * 1.012, f2: f, slide: 0.03, dur: high ? 1.4 : 0.9, g, dest: S.pump, rev: 0.35, del: high ? 0.4 : 0.2 });
    S.tone({ t, type: 'sine', f: f * 2, dur: 0.25, g: g * 0.35, dest: S.pump });
    S.hiss({ t, type: 'bandpass', f: 3200, q: 2, dur: 0.02, g: g * 0.6, dest: S.pump });
  },

  flute(t, note, dur) {
    const S = Sound, f = mtof(note);
    S.tone({ t, type: 'sine', f, a: 0.02, dur: dur + 0.1, g: 0.06, dest: S.musicBus, rev: 0.4 });
    S.tone({ t, type: 'triangle', f: f * 2, a: 0.02, dur: dur, g: 0.012, dest: S.musicBus });
    S.hiss({ t, type: 'bandpass', f: f * 2, q: 4, dur: dur * 0.6, g: 0.02, dest: S.musicBus });
  },
};

const Sfx = {

// ---------------------------------------------------------------- post.js
// WebGL post-processing: bloom, chromatic aberration, shock ripples, slow-mo grade.
const VS = 'attribute vec2 p;varying vec2 uv;void main(){uv=p*0.5+0.5;gl_Position=vec4(p,0.0,1.0);}';
const FS_BRIGHT = `precision mediump float;varying vec2 uv;uniform sampler2D t;uniform vec2 texel;uniform float lo;uniform float hi;
void main(){vec2 s=vec2(uv.x,1.0-uv.y);
vec3 c=texture2D(t,s+texel*vec2(-1.0,-1.0)).rgb+texture2D(t,s+texel*vec2(1.0,-1.0)).rgb+texture2D(t,s+texel*vec2(-1.0,1.0)).rgb+texture2D(t,s+texel*vec2(1.0,1.0)).rgb;
c*=0.25;float m=max(c.r,max(c.g,c.b));c*=smoothstep(lo,hi,m);gl_FragColor=vec4(c,1.0);}`;
const FS_BLUR = `precision mediump float;varying vec2 uv;uniform sampler2D t;uniform vec2 dir;
void main(){vec3 c=texture2D(t,uv).rgb*0.227027;
c+=(texture2D(t,uv+dir*1.384615).rgb+texture2D(t,uv-dir*1.384615).rgb)*0.316216;
c+=(texture2D(t,uv+dir*3.230769).rgb+texture2D(t,uv-dir*3.230769).rgb)*0.070270;
gl_FragColor=vec4(c,1.0);}`;
const FS_COPY = 'precision mediump float;varying vec2 uv;uniform sampler2D t;void main(){gl_FragColor=texture2D(t,uv);}';
const FS_FINAL = `precision mediump float;varying vec2 uv;
uniform sampler2D scene;uniform sampler2D b1;uniform sampler2D b2;
uniform float bloom;uniform float ca;uniform float vig;uniform float flash;uniform vec3 flashCol;uniform float slow;uniform float grain;uniform float time;uniform float aspect;
uniform vec4 waves[3];
void main(){
  vec2 u=uv;
  for(int i=0;i<3;i++){vec4 w=waves[i];if(w.w>0.0){vec2 d=u-w.xy;d.x*=aspect;float r=length(d);float k=r-w.z;float a=w.w*exp(-k*k*700.0);vec2 n=d/(r+0.0001);n.x/=aspect;u-=n*a;}}
  vec2 c=u-0.5;
  vec2 s=vec2(u.x,1.0-u.y);
  vec2 o=vec2(c.x,-c.y)*ca*0.012;
  vec3 col=vec3(texture2D(scene,s+o).r,texture2D(scene,s).g,texture2D(scene,s-o).b);
  vec3 b=texture2D(b1,u).rgb+texture2D(b2,u).rgb*0.9;
  col+=b*bloom;
  float l=dot(col,vec3(0.299,0.587,0.114));
  col=mix(col,vec3(l)*vec3(0.78,0.82,1.3),slow*0.5);
  vec2 vc=c;vc.x*=min(aspect,1.0)/max(aspect,1.0)+0.4;
  float v=smoothstep(0.98,0.28,length(vc)*1.15);
  col*=mix(1.0,v,vig);
  col*=0.975+0.025*sin(gl_FragCoord.y*3.14159);
  col=mix(col,flashCol,flash);
  col+=(fract(sin(dot(gl_FragCoord.xy+time,vec2(12.9898,78.233)))*43758.5453)-0.5)*grain;
  gl_FragColor=vec4(col,1.0);
}`;

const Post = {
  gl: null, ok: false, lost: false, W: 0, H: 0, prog: {}, tex: null, T: {}, bound: false,
  p: { bloom: 0.85, ca: 0, vig: 0.55, flash: 0, flashCol: [1, 1, 1], slow: 0, grain: 0.03, waves: new Float32Array(12), lite: false, lo: 0.2, hi: 0.78 },

  init(canvas) {
    let gl = null;
    try {
      gl = canvas.getContext('webgl', { alpha: false, antialias: false, depth: false, stencil: false, premultipliedAlpha: false, preserveDrawingBuffer: false, powerPreference: 'high-performance' });
    } catch (e) { gl = null; }
    if (!gl) return false;
    this.gl = gl;
    this.canvas = canvas;
    try {
      this.prog.bright = this.program(FS_BRIGHT);
      this.prog.blur = this.program(FS_BLUR);
      this.prog.copy = this.program(FS_COPY);
      this.prog.final = this.program(FS_FINAL);
    } catch (e) {
      console.warn('[lanternfall] post shaders failed', e);
      return false;
    }
    this.buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, this.buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    this.tex = this.texture();
    if (!this.bound) {
      this.bound = true;
      canvas.addEventListener('webglcontextlost', (e) => { e.preventDefault(); this.ok = false; this.lost = true; });
      canvas.addEventListener('webglcontextrestored', () => {
        this.lost = false;
        this.T = {};
        if (this.init(canvas)) this.resize(this.W, this.H);
      });
    }
    this.ok = true;
    return true;
  },

  program(fs) {
    const gl = this.gl;
    const mk = (type, src) => {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
      return s;
    };
    const p = gl.createProgram();
    gl.attachShader(p, mk(gl.VERTEX_SHADER, VS));
    gl.attachShader(p, mk(gl.FRAGMENT_SHADER, fs));
    gl.bindAttribLocation(p, 0, 'p');
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    const loc = {};
    const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < n; i++) {
      const info = gl.getActiveUniform(p, i);
      const name = info.name.replace('[0]', '');
      loc[name] = gl.getUniformLocation(p, name);
    }
    return { p, loc };
  },

  texture() {
    const gl = this.gl;
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    return t;
  },

  target(w, h) {
    const gl = this.gl;
    const tex = this.texture();
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    const fb = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return { tex, fb, w, h };
  },

  resize(w, h) {
    this.W = w;
    this.H = h;
    if (!this.ok) return;
    const gl = this.gl;
    for (const k in this.T) {
      gl.deleteTexture(this.T[k].tex);
      gl.deleteFramebuffer(this.T[k].fb);
    }
    const q = Math.max(1, Math.round(w / 4)), r = Math.max(1, Math.round(h / 4));
    const q2 = Math.max(1, Math.round(w / 10)), r2 = Math.max(1, Math.round(h / 10));
    this.T = { A: this.target(q, r), B: this.target(q, r), C: this.target(q2, r2), D: this.target(q2, r2) };
  },

  pass(prog, tgt, texs, uni) {
    const gl = this.gl;
    gl.useProgram(prog.p);
    if (tgt) { gl.bindFramebuffer(gl.FRAMEBUFFER, tgt.fb); gl.viewport(0, 0, tgt.w, tgt.h); }
    else { gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, this.W, this.H); }
    let unit = 0;
    for (const name in texs) {
      gl.activeTexture(gl.TEXTURE0 + unit);
      gl.bindTexture(gl.TEXTURE_2D, texs[name]);
      gl.uniform1i(prog.loc[name], unit);
      unit++;
    }
    for (const name in uni) {
      const v = uni[name], l = prog.loc[name];
      if (l === undefined || l === null) continue;
      if (typeof v === 'number') gl.uniform1f(l, v);
      else if (v.length === 2) gl.uniform2fv(l, v);
      else if (v.length === 3) gl.uniform3fv(l, v);
      else gl.uniform4fv(l, v);
    }
    gl.bindBuffer(gl.ARRAY_BUFFER, this.buf);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  },

  present(src, time) {
    if (!this.ok || this.lost) return;
    const gl = this.gl, T = this.T, P = this.p;
    gl.disable(gl.BLEND);
    gl.bindTexture(gl.TEXTURE_2D, this.tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src);
    if (!P.lite) {
      this.pass(this.prog.bright, T.A, { t: this.tex }, { texel: [1.5 / this.W, 1.5 / this.H], lo: P.lo, hi: P.hi });
      this.pass(this.prog.blur, T.B, { t: T.A.tex }, { dir: [1 / T.A.w, 0] });
      this.pass(this.prog.blur, T.A, { t: T.B.tex }, { dir: [0, 1 / T.A.h] });
      this.pass(this.prog.copy, T.C, { t: T.A.tex }, {});
      this.pass(this.prog.blur, T.D, { t: T.C.tex }, { dir: [1 / T.C.w, 0] });
      this.pass(this.prog.blur, T.C, { t: T.D.tex }, { dir: [0, 1 / T.C.h] });
    }
    this.pass(this.prog.final, null, { scene: this.tex, b1: T.A.tex, b2: T.C.tex }, {
      bloom: P.lite ? 0 : P.bloom, ca: P.ca, vig: P.vig, flash: P.flash, flashCol: P.flashCol, slow: P.slow,
      grain: P.grain, time: time % 100, aspect: this.W / this.H, waves: P.waves,
    });
  },
};

// ---------------------------------------------------------------- fx.js
const FX = {
  pool: [], head: 0, MAX: 1000,
  pops: [], floats: [],
  trauma: 0, flashA: 0, flashCol: [1, 1, 1], ca: 0, waves: [],

  init() {
    this.pool = [];
    for (let i = 0; i < this.MAX; i++) this.pool.push({ on: false });
  },

  clear() {
    for (const p of this.pool) p.on = false;
    this.pops.length = 0;
    this.floats.length = 0;
    this.waves.length = 0;
    this.trauma = 0; this.flashA = 0; this.ca = 0;
  },

  part(o) {
    const p = this.pool[this.head];
    this.head = (this.head + 1) % this.MAX;
    p.on = true;
    p.type = o.type || 'dot';
    p.x = o.x; p.y = o.y;
    p.x2 = o.x2; p.y2 = o.y2;
    p.vx = o.vx || 0; p.vy = o.vy || 0;
    p.life = o.life || 0.5; p.t = 0;
    p.size = o.size || 3;
    p.color = o.color || PAL.white;
    p.drag = o.drag === undefined ? 3 : o.drag;
    p.g = o.g || 0;
    p.r0 = o.r0 || 0; p.r1 = o.r1 || 40;
    p.w = o.w || 2;
    p.tw = !!o.tw;
    p.real = !!o.real;
    return p;
  },

  burst(x, y, n, color, sp0, sp1, life, size, type) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, s = rnd(sp0, sp1);
      this.part({ type: type || 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: life * rnd(0.6, 1.2), size: size * rnd(0.6, 1.3), color, drag: 4 });
    }
  },

  ring(x, y, r0, r1, life, color, w) {
    this.part({ type: 'ring', x, y, r0, r1, life, color, w: w || 3 });
  },

  firework(x, y, color) {
    const n = 70, kind = Math.random();
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU + Math.random() * 0.1;
      const s = kind < 0.5 ? rnd(170, 250) : rnd(60, 260);
      this.part({ type: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rnd(1.0, 1.6), size: rnd(1.6, 2.6), color, drag: 1.7, g: 110, tw: true });
    }
    for (let i = 0; i < 18; i++) {
      const a = Math.random() * TAU, s = rnd(20, 120);
      this.part({ type: 'dot', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rnd(0.5, 1.0), size: 2.4, color: '#ffffff', drag: 2.5, g: 60, tw: true });
    }
    this.ring(x, y, 4, 70, 0.45, '#ffffff', 2);
  },

  // a lit lantern lifts off into the night sky
  floater(c, t) {
    const f = { type: c.type, kind: c.kind, x: c.cx, y: c.cy, r: c.r, big: c.big, head: !!c.head, t: 0, life: 1.7, vx: rnd(-14, 14), vy: -rnd(60, 95), rot: 0, vr: rnd(-0.5, 0.5), sway: Math.random() * TAU };
    if (c.kind === 'bar') { f.dx = c.x2 - c.x1; f.dy = c.y2 - c.y1; f.life = 0.8; }
    this.floats.push(f);
    if (this.floats.length > 160) this.floats.shift();
  },

  pop(text, x, y, o) {
    o = o || {};
    this.pops.push({ text, x, y, t: 0, life: o.life || 0.9, size: o.size || 16, color: o.color || PAL.white, vy: o.vy === undefined ? -36 : o.vy, big: !!o.big });
    if (this.pops.length > 40) this.pops.shift();
  },

  shake(a) {
    if (!Save.data.settings.shake) return;
    this.trauma = Math.min(1, this.trauma + a);
  },

  flash(a, col) {
    if (!Save.data.settings.flashes) a *= 0.25;
    this.flashA = Math.max(this.flashA, a);
    this.flashCol = col || [1, 1, 1];
  },

  wave(x, y, strength, speed) {
    this.waves.push({ x, y, t: 0, s: strength || 0.03, v: speed || 1.1 });
    if (this.waves.length > 3) this.waves.shift();
  },

  update(dtW, dtR) {
    for (const p of this.pool) {
      if (!p.on) continue;
      const dt = p.real ? dtR : dtW;
      p.t += dt;
      if (p.t >= p.life) { p.on = false; continue; }
      const k = Math.exp(-p.drag * dt);
      p.vx *= k; p.vy *= k;
      p.vy += p.g * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
    }
    for (let i = this.pops.length - 1; i >= 0; i--) {
      const q = this.pops[i];
      q.t += dtR;
      q.y += q.vy * dtR * (1 - q.t / q.life);
      if (q.t >= q.life) this.pops.splice(i, 1);
    }
    for (let i = this.floats.length - 1; i >= 0; i--) {
      const f = this.floats[i];
      f.t += dtR;
      f.vy -= 30 * dtR;
      f.x += (f.vx + Math.sin(f.t * 2.4 + f.sway) * 16) * dtR;
      f.y += f.vy * dtR;
      f.rot += f.vr * dtR;
      if (f.t >= f.life) this.floats.splice(i, 1);
    }
    this.trauma = Math.max(0, this.trauma - dtR * 1.6);
    this.flashA = Math.max(0, this.flashA - dtR * 3);
    this.ca = Math.max(0, this.ca - dtR * 2.2);
    for (let i = this.waves.length - 1; i >= 0; i--) {
      const w = this.waves[i];
      w.t += dtR;
      if (w.t > 0.9) this.waves.splice(i, 1);
    }
  },

  shakeOffset(time) {
    const s = this.trauma * this.trauma * 12;
    if (s < 0.01) return [0, 0];
    return [s * (Math.sin(time * 61.3) * 0.6 + Math.sin(time * 23.7 + 1.3) * 0.4), s * (Math.sin(time * 53.1 + 2.1) * 0.6 + Math.sin(time * 31.9) * 0.4)];
  },
};

// ---------------------------------------------------------------- physics.js
// Deterministic ember physics: fixed 1/480 s steps, circles (lanterns, orbs) and capsules (bamboo).
// The aim guide and the real shot run the same step function, so the guide never lies.
let ITEM_ID = 0;

class Lantern {
  constructor(x, y, type, o) {
    o = o || {};
    this.id = ++ITEM_ID;
    this.kind = 'peg';
    this.x = this.bx = x;
    this.y = this.by = y;
    this.vx = 0;
    this.vy = 0;
    this.r = o.r || PEG_R;
    this.type = type;
    this.hp = this.maxHp = o.hp || 1;
    this.lit = false;
    this.dead = false;
    this.mover = o.mover || null;
    this.hitT = -9;
    this.big = !!o.big;
    this.seg = o.seg === undefined ? -1 : o.seg;
    this.ph = Math.random() * TAU;
  }
  get cx() { return this.x; }
  get cy() { return this.y; }
}

class Bamboo {
  constructor(x1, y1, x2, y2, type, o) {
    o = o || {};
    this.id = ++ITEM_ID;
    this.kind = 'bar';
    this.x1 = this.bx1 = x1;
    this.y1 = this.by1 = y1;
    this.x2 = this.bx2 = x2;
    this.y2 = this.by2 = y2;
    this.v1x = this.v1y = this.v2x = this.v2y = 0;
    this.r = BAR_R;
    this.type = type;
    this.hp = this.maxHp = o.hp || 1;
    this.lit = false;
    this.dead = false;
    this.mover = o.mover || null;
    this.hitT = -9;
    this.ph = Math.random() * TAU;
  }
  get cx() { return (this.x1 + this.x2) / 2; }
  get cy() { return (this.y1 + this.y2) / 2; }
}

const Movers = {
  pos(m, bx, by, t) {
    if (m.type === 'orbit') {
      const a = m.w * t, c = Math.cos(a), s = Math.sin(a), dx = bx - m.cx, dy = by - m.cy;
      return [m.cx + dx * c - dy * s, m.cy + dx * s + dy * c];
    }
    if (m.type === 'slide') {
      const k = Math.sin(m.w * t + m.ph);
      return [bx + m.ax * k, by + (m.ay || 0) * k];
    }
    if (m.type === 'path') return m.fn(t - m.delay);
    if (m.type === 'sway') {
      const k = Math.sin(m.w * t), a = m.rot * k, c = Math.cos(a), s = Math.sin(a), dx = bx - m.cx, dy = by - m.cy;
      return [m.cx + dx * c - dy * s + m.ax * k, m.cy + dx * s + dy * c];
    }
    return [bx, by];
  },
};

class Ember {
  constructor(x, y, vx, vy, r) {
    this.x = x;
    this.y = y;
    this.vx = vx;
    this.vy = vy;
    this.r = r;
    this.alive = true;
    this.blaze = 0;
    this.t = 0;
    this.trail = [];
    this.lastWall = -9;
    this.hist = [];
    this.fox = false;
  }
}

const World = {
  items: [], t: 0, wind: 0, gMul: 1, moving: false, fever: false, boatOn: true,
  boat: { x: 300, vx: 0, halfW: 52, amp: 225, w: 0.55, ph: 0 },
  barRest: PHYS.eBar,

  reset(items) {
    this.items = items;
    this.t = 0;
    this.wind = 0;
    this.fever = false;
    this.boatOn = true;
    this.moving = items.some((c) => c.mover);
    this.setTime(0);
  },

  setTime(t) {
    this.t = t;
    const B = this.boat;
    B.x = 300 + B.amp * Math.sin(B.w * t + B.ph);
    B.vx = B.amp * B.w * Math.cos(B.w * t + B.ph);
    if (!this.moving) return;
    const eps = 1 / 240;
    for (const c of this.items) {
      if (!c.mover || c.dead) continue;
      if (c.kind === 'peg') {
        const p = Movers.pos(c.mover, c.bx, c.by, t), q = Movers.pos(c.mover, c.bx, c.by, t + eps);
        c.x = p[0]; c.y = p[1];
        c.vx = (q[0] - p[0]) / eps; c.vy = (q[1] - p[1]) / eps;
      } else {
        const a = Movers.pos(c.mover, c.bx1, c.by1, t), b = Movers.pos(c.mover, c.bx2, c.by2, t);
        const a2 = Movers.pos(c.mover, c.bx1, c.by1, t + eps), b2 = Movers.pos(c.mover, c.bx2, c.by2, t + eps);
        c.x1 = a[0]; c.y1 = a[1]; c.x2 = b[0]; c.y2 = b[1];
        c.v1x = (a2[0] - a[0]) / eps; c.v1y = (a2[1] - a[1]) / eps;
        c.v2x = (b2[0] - b[0]) / eps; c.v2y = (b2[1] - b[1]) / eps;
      }
    }
  },

  rest(c) {
    if (c.type === 'orb') return PHYS.eOrb;
    return c.kind === 'bar' ? this.barRest : PHYS.eLantern;
  },

  // one fixed step for one ember; the sink decides what hits mean
  step(e, h, sink) {
    e.t += h;
    e.vy += PHYS.g * this.gMul * h;
    e.vx += this.wind * h;
    if (sink.moth) {
      let best = null, bd = 170 * 170;
      for (const c of this.items) {
        if (c.dead || c.lit || c.type !== 'red') continue;
        const dx = c.cx - e.x, dy = c.cy - e.y, d2 = dx * dx + dy * dy;
        if (d2 < bd) { bd = d2; best = c; }
      }
      if (best) {
        const dx = best.cx - e.x, dy = best.cy - e.y, d = Math.sqrt(bd) || 1;
        e.vx += (dx / d) * 300 * h;
        e.vy += (dy / d) * 300 * h;
      }
    }
    const sp = Math.hypot(e.vx, e.vy);
    if (sp > PHYS.maxV) { const k = PHYS.maxV / sp; e.vx *= k; e.vy *= k; }
    if (e.blaze > 0) e.blaze -= h;
    e.x += e.vx * h;
    e.y += e.vy * h;
    if (e.x < e.r) { e.x = e.r; if (e.vx < 0) { e.vx = -e.vx * PHYS.eWall; sink.wall(e, -1); } }
    else if (e.x > BOARD_W - e.r) { e.x = BOARD_W - e.r; if (e.vx > 0) { e.vx = -e.vx * PHYS.eWall; sink.wall(e, 1); } }
    if (e.y < e.r) { e.y = e.r; if (e.vy < 0) e.vy = -e.vy * 0.5; }
    const items = this.items;
    for (let i = 0; i < items.length; i++) {
      const c = items[i];
      if (c.dead) continue;
      let cx, cy, cvx, cvy;
      const R = e.r + c.r;
      if (c.kind === 'peg') {
        cx = c.x; cy = c.y;
        const dx = e.x - cx, dy = e.y - cy;
        if (dx > R || dx < -R || dy > R || dy < -R || dx * dx + dy * dy >= R * R) continue;
        cvx = c.vx; cvy = c.vy;
      } else {
        const sx = c.x2 - c.x1, sy = c.y2 - c.y1, L2 = sx * sx + sy * sy || 1;
        let u = ((e.x - c.x1) * sx + (e.y - c.y1) * sy) / L2;
        u = u < 0 ? 0 : u > 1 ? 1 : u;
        cx = c.x1 + sx * u; cy = c.y1 + sy * u;
        const dx = e.x - cx, dy = e.y - cy;
        if (dx > R || dx < -R || dy > R || dy < -R || dx * dx + dy * dy >= R * R) continue;
        cvx = c.v1x + (c.v2x - c.v1x) * u; cvy = c.v1y + (c.v2y - c.v1y) * u;
      }
      if (e.blaze > 0 && c.type !== 'orb') { sink.hit(c, 0, e); continue; }
      this.bounce(e, c, cx, cy, R, cvx, cvy, this.rest(c), sink);
    }
    if (this.boatOn && !this.fever) {
      const B = this.boat;
      for (let s = -1; s <= 1; s += 2) {
        const rx = B.x + s * B.halfW, ry = RIVER_Y - 6, R = e.r + 8;
        const dx = e.x - rx, dy = e.y - ry;
        if (dx * dx + dy * dy < R * R) this.bounce(e, null, rx, ry, R, B.vx, 0, 0.6, sink);
      }
      if (e.vy > 0 && e.y > RIVER_Y - 10 && e.y < RIVER_Y + 16 && Math.abs(e.x - B.x) < B.halfW - 7) {
        e.alive = false;
        sink.boat(e);
        return;
      }
    }
    if (this.fever && e.y > RIVER_Y + 4) {
      e.alive = false;
      sink.slot(e, clamp(Math.floor(e.x / (BOARD_W / FEVER_SLOTS.length)), 0, FEVER_SLOTS.length - 1));
      return;
    }
    if (e.y > OUT_Y) { e.alive = false; sink.out(e); }
  },

  bounce(e, c, cx, cy, R, cvx, cvy, rest, sink) {
    let dx = e.x - cx, dy = e.y - cy, d = Math.hypot(dx, dy);
    if (d < 1e-6) { dx = 0; dy = -1; d = 1; }
    const nx = dx / d, ny = dy / d;
    e.x = cx + nx * R;
    e.y = cy + ny * R;
    let rvx = e.vx - cvx, rvy = e.vy - cvy;
    const vn = rvx * nx + rvy * ny;
    if (vn < 0) {
      rvx -= (1 + rest) * vn * nx;
      rvy -= (1 + rest) * vn * ny;
      const vt = -rvx * ny + rvy * nx, loss = (1 - PHYS.tanKeep) * vt;
      rvx += loss * ny;
      rvy -= loss * nx;
      e.vx = rvx + cvx;
      e.vy = rvy + cvy;
      if (c) sink.hit(c, -vn, e);
      else sink.rim(e, -vn);
    }
  },

  launchVel(angle) {
    return [Math.cos(angle) * PHYS.speed, Math.sin(angle) * PHYS.speed];
  },

  mouth(angle) {
    return [LAUNCH.x + Math.cos(angle) * LAUNCH.len, LAUNCH.y + Math.sin(angle) * LAUNCH.len];
  },

  // aim guide: the path until the n-th distinct collision (or the river)
  predict(angle, bounces, r, out) {
    const t0 = this.t, m = this.mouth(angle), v = this.launchVel(angle);
    const e = new Ember(m[0], m[1], v[0], v[1], r);
    const pts = out || [];
    pts.length = 0;
    pts.push(e.x, e.y);
    let n = 0, last = null, stop = false, hitX = null, hitY = null, cool = 0, hitC = null;
    const sink = {
      moth: false,
      hit: (c) => {
        if (c === last && cool > 0) return;
        last = c;
        cool = 0.05;
        n++;
        if (n === 1) hitC = c;
        if (n >= bounces) { stop = true; hitX = e.x; hitY = e.y; }
      },
      wall: () => {},
      rim: () => { stop = true; },
      boat: () => { stop = true; },
      slot: () => { stop = true; },
      out: () => { stop = true; },
    };
    const h = PHYS.step, max = 2.6;
    let k = 0;
    while (!stop && e.t < max && e.alive) {
      this.setTime(t0 + e.t + h);
      this.step(e, h, sink);
      cool -= h;
      if (++k % 6 === 0) pts.push(e.x, e.y);
    }
    pts.push(e.x, e.y);
    this.setTime(t0);
    return { pts, hitX, hitY, hitC };
  },

  // the whole shot without side effects, for the demo pilot and the test bots
  dryRun(angle, r, maxT) {
    const t0 = this.t, m = this.mouth(angle), v = this.launchVel(angle);
    const e = new Ember(m[0], m[1], v[0], v[1], r);
    const touched = new Set();
    let caught = false, reds = 0, all = 0, hits = 0;
    const sink = {
      moth: false,
      hit: (c) => {
        hits++;
        if (touched.has(c) || c.lit || c.type === 'orb') return;
        touched.add(c);
        all++;
        if (c.type === 'red') reds++;
      },
      wall: () => {}, rim: () => {}, slot: () => {}, out: () => {},
      boat: () => { caught = true; },
    };
    const h = PHYS.step;
    let stuck = 0, lx = e.x, ly = e.y;
    while (e.alive && e.t < (maxT || 12)) {
      this.setTime(t0 + e.t + h);
      this.step(e, h, sink);
      if (((e.t * 480) | 0) % 240 === 0) {
        if (Math.hypot(e.x - lx, e.y - ly) < 6) stuck++;
        lx = e.x; ly = e.y;
        if (stuck > 3) break;
      }
    }
    this.setTime(t0);
    return { reds, all, caught, hits, t: e.t };
  },
};

// ---------------------------------------------------------------- boardgen.js
// Procedural boards: a symmetric layout template, then lantern types, hazards and movement by board number.
class Layout {
  constructor() { this.p = []; this.b = []; }

  free(x, y, rad) {
    if (x < FIELD.x0 || x > FIELD.x1 || y < FIELD.y0 || y > FIELD.y1) return false;
    if (Math.hypot(x - LAUNCH.x, y - LAUNCH.y) < 128) return false;
    for (const p of this.p) if (Math.hypot(p.x - x, p.y - y) < (rad || 31)) return false;
    for (const b of this.b) if (distToSegment(x, y, b.x1, b.y1, b.x2, b.y2) < 26) return false;
    return true;
  }

  peg(x, y) {
    if (!this.free(x, y)) return false;
    this.p.push({ x, y });
    return true;
  }

  pegSym(x, y) {
    if (Math.abs(x - 300) < 16) return this.peg(300, y);
    if (!this.free(x, y) || !this.free(600 - x, y)) return false;
    this.p.push({ x, y }, { x: 600 - x, y });
    return true;
  }

  barOk(x1, y1, x2, y2) {
    for (let k = 0; k <= 4; k++) {
      const x = lerp(x1, x2, k / 4), y = lerp(y1, y2, k / 4);
      if (x < FIELD.x0 - 4 || x > FIELD.x1 + 4 || y < FIELD.y0 || y > FIELD.y1) return false;
      if (Math.hypot(x - LAUNCH.x, y - LAUNCH.y) < 128) return false;
      for (const p of this.p) if (Math.hypot(p.x - x, p.y - y) < 24) return false;
      for (const b of this.b) if (distToSegment(x, y, b.x1, b.y1, b.x2, b.y2) < 21) return false;
    }
    return true;
  }

  bar(x1, y1, x2, y2) {
    if (!this.barOk(x1, y1, x2, y2)) return false;
    this.b.push({ x1, y1, x2, y2 });
    return true;
  }

  barSym(x1, y1, x2, y2) {
    if (!this.barOk(x1, y1, x2, y2)) return false;
    const m = [600 - x1, y1, 600 - x2, y2];
    if (Math.min(x1, x2) < 300 && Math.max(x1, x2) > 300) return this.bar(x1, y1, x2, y2);
    if (!this.barOk(...m)) return false;
    this.b.push({ x1, y1, x2, y2 }, { x1: m[0], y1: m[1], x2: m[2], y2: m[3] });
    return true;
  }

  count() { return this.p.length + this.b.length; }
}

const TEMPLATES = {
  lattice: {
    name: 'Paper Lattice',
    make(L, rng) {
      const shape = rng.pick(['oval', 'hourglass', 'funnel', 'diamond', 'band']);
      const inside = (x, y) => {
        const u = (x - 300) / 268, v = (y - 485) / 305;
        if (shape === 'oval') return u * u + v * v < 1;
        if (shape === 'hourglass') return Math.abs(u) < 0.32 + 0.68 * Math.abs(v) && Math.abs(v) < 1;
        if (shape === 'funnel') return Math.abs(u) < 0.2 + 0.8 * (1 - (v + 1) / 2) && Math.abs(v) < 1;
        if (shape === 'diamond') return Math.abs(u) + Math.abs(v) < 1.06;
        return Math.abs(v) < 0.62;
      };
      const dx = 54, dy = 46;
      for (let row = 0; row < 14; row++) {
        const y = 200 + row * dy, off = row % 2 ? dx / 2 : 0;
        for (let k = 0; k < 6; k++) {
          const x = 300 - off - k * dx;
          if (x < FIELD.x0 || !inside(x, y) || rng.chance(0.1)) continue;
          L.pegSym(x, y);
        }
      }
    },
  },
  arches: {
    name: 'Bridge Arches',
    make(L, rng) {
      const cy = rng.range(70, 130);
      for (let R = 200; R < 680; R += rng.range(68, 80)) {
        const bars = rng.chance(0.35);
        const step = bars ? 66 : 44;
        for (let s = R < 260 ? 0 : step / 2; s < R * 1.6; s += step) {
          const th = s / R, x = 300 + R * Math.sin(th), y = cy + R * Math.cos(th);
          if (y < FIELD.y0) break;
          if (bars) {
            const th2 = (s + 48) / R;
            L.barSym(600 - x, y, 600 - (300 + R * Math.sin(th2)), cy + R * Math.cos(th2));
          } else L.pegSym(600 - x, y);
        }
      }
    },
  },
  rings: {
    name: 'Moon Gate',
    make(L, rng) {
      const cx = 300, cy = rng.range(470, 510), gap = rng.range(0.3, 0.6), g0 = rng.range(0, Math.PI / 2);
      for (const R of [72, 140, 208, 276]) {
        const n = Math.max(6, Math.round((Math.PI * R) / 44) * 2);
        for (let k = 0; k < n / 2; k++) {
          const a = -Math.PI / 2 + ((k + 0.5) * TAU) / n;
          const da = Math.abs(angDiff(a, g0 + R * 0.004));
          if (R > 100 && da < gap) continue;
          L.pegSym(cx + Math.cos(a) * R, cy + Math.sin(a) * R);
        }
      }
    },
  },
  columns: {
    name: 'Rain Curtain',
    make(L, rng) {
      for (let i = 0; i < 5; i++) {
        const x = 271 - i * 58;
        for (let j = 0; j < 10; j++) {
          const y = 206 + j * 62 + (i % 2 ? 31 : 0);
          if (rng.chance(0.14)) continue;
          L.pegSym(x, y);
          if (rng.chance(0.12)) L.barSym(x - 26, y + 26, x + 14, y + 40);
        }
      }
    },
  },
  chevrons: {
    name: 'Crane Wings',
    make(L, rng) {
      for (let r = 0; r < 5; r++) {
        const y = 236 + r * 128, dir = r % 2 ? -1 : 1;
        for (let k = 0; k < 3; k++) {
          const cx = 300 - k * 136 - (r % 2 ? 68 : 0);
          if (cx < 70) continue;
          L.barSym(cx - 44, y - 24 * dir, cx - 4, y + 18 * dir);
          L.barSym(cx + 4, y + 18 * dir, cx + 44, y - 24 * dir);
          L.pegSym(cx, y - 32 * dir);
          L.pegSym(cx - 58, y + 26 * dir);
        }
