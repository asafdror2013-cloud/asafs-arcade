<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#04050d">
<title>Orrery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Celestial brass: deep-space ink, engraved serif display type, brass hairlines like an astrolabe */
  --space: #04050d;
  --panel: #0b0f22;
  --panel-2: #121734;
  --sun: #ffb347;
  --brass: #d9b16a;
  --danger: #ff2a55;
  --dust: #8fe3ff;
  --lilac: #b9a6ff;
  --heal: #7dffb2;
  --text: #f4efe6;
  --muted: #a39cb8;
  --line: rgba(217, 177, 106, 0.3);
  --display: "Cinzel", "Trajan Pro", Georgia, serif;
  --body: "Jost", "Futura", "Century Gothic", system-ui, sans-serif;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;
}

html, body {
  height: 100%;
  margin: 0;
  background: var(--space);
  color: var(--text);
  font-family: var(--body);
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
}

#app {
  position: fixed;
  inset: 0;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}
#gl, #scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#stage { position: absolute; inset: 0; touch-action: none; }
.num { font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }
#app:not(.ready) #title { opacity: 0; }
#title { transition: opacity 0.5s ease; }

/* ---------------------------------------------------------- buttons */
.btn {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
}
.btn:focus-visible, .icon-btn:focus-visible, .chip:focus-visible, .switch:focus-visible, .card:focus-visible, .star-btn:focus-visible { outline: 2px solid var(--sun); outline-offset: 3px; }

.btn.play {
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  width: 100%;
  min-height: 64px;
  border-radius: 14px;
  border: 1.5px solid var(--sun);
  background: linear-gradient(180deg, rgba(255, 179, 71, 0.26), rgba(255, 179, 71, 0.06));
  box-shadow: 0 0 28px rgba(255, 179, 71, 0.22), inset 0 0 22px rgba(255, 179, 71, 0.12);
  transition: transform 0.12s ease;
}
.btn.play:active { transform: scale(0.98); }
.btn.play::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(100deg, transparent 30%, rgba(255, 240, 210, 0.2) 50%, transparent 70%);
  transform: translateX(-100%);
  animation: sheen 3.6s ease-in-out infinite;
  pointer-events: none;
}
@keyframes sheen { 0%, 62% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
.play-label {
  font-family: var(--display);
  font-weight: 700;
  font-size: 22px;
  letter-spacing: 0.3em;
  padding-left: 0.3em;
  text-transform: uppercase;
  color: #ffe3b3;
  text-shadow: 0 0 16px rgba(255, 179, 71, 0.8);
}
.play-sub { font-size: 13px; color: var(--muted); letter-spacing: 0.02em; }
.btn.play.small { min-height: 52px; width: auto; padding: 0 30px; }
.btn.play.small .play-label { font-size: 17px; }

.btn.ghost {
  padding: 10px 12px;
  border-radius: 10px;
  color: var(--muted);
  font-size: 14px;
  font-weight: 500;
  letter-spacing: 0.02em;
}
.btn.ghost:hover { color: var(--text); background: rgba(255, 255, 255, 0.05); }

.icon-btn {
  font: inherit;
  color: var(--text);
  background: rgba(11, 15, 34, 0.6);
  border: 1px solid var(--line);
  border-radius: 10px;
  width: 38px;
  height: 38px;
  display: inline-grid;
  place-items: center;
  cursor: pointer;
  padding: 0;
}
#b-pause { display: inline-flex; gap: 4px; justify-content: center; align-items: center; pointer-events: auto; }
#b-pause span { width: 3px; height: 12px; border-radius: 2px; background: var(--text); }
.icon-btn.close { font-size: 22px; line-height: 1; }

.dust-ico {
  display: inline-block;
  width: 9px;
  height: 9px;
  transform: rotate(45deg);
  border-radius: 1.5px;
  background: linear-gradient(135deg, #ffffff, var(--dust) 50%, #2b6fd6);
  box-shadow: 0 0 8px rgba(143, 227, 255, 0.85);
  flex: none;
}
.dust-ico.big { width: 14px; height: 14px; }

.chip {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font: inherit;
  font-size: 14px;
  font-weight: 600;
  color: #1a1206;
  background: linear-gradient(180deg, #ffd38c, var(--sun));
  border: 0;
  border-radius: 99px;
  padding: 8px 14px;
  cursor: pointer;
  white-space: nowrap;
}
.chip .dust-ico { background: linear-gradient(135deg, #ffffff, #2b6fd6); box-shadow: none; }
.chip:disabled { background: rgba(255, 255, 255, 0.1); color: var(--muted); cursor: default; }
.chip:disabled .dust-ico { opacity: 0.6; }

.label, .u-label {
  margin: 0;
  font-size: 11px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted);
}

.pips { display: inline-flex; gap: 4px; }
.pips i { width: 7px; height: 7px; transform: rotate(45deg); border: 1px solid rgba(217, 177, 106, 0.55); border-radius: 1px; }
.pips i.on { background: var(--brass); border-color: var(--brass); }
.pips i.nx { background: var(--sun); border-color: var(--sun); box-shadow: 0 0 8px var(--sun); animation: nx 0.9s ease-in-out infinite; }
@keyframes nx { 50% { opacity: 0.45; } }

/* ---------------------------------------------------------- screens */
.screen {
  position: absolute;
  inset: 0;
  z-index: 10;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  touch-action: pan-y;
  -webkit-overflow-scrolling: touch;
}
.screen.center { align-items: center; justify-content: center; background: rgba(4, 5, 13, 0.6); }
.screen.overlay { background: radial-gradient(120% 90% at 50% 45%, rgba(10, 12, 32, 0.78), rgba(4, 5, 13, 0.92)); }

.slab {
  box-sizing: border-box;
  width: 100%;
  max-width: 540px;
  margin: 0 auto;
  display: grid;
  gap: 14px;
  padding: 18px 16px max(18px, var(--safe-b));
  border-radius: 24px 24px 0 0;
  border-top: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(11, 15, 34, 0.78), rgba(6, 8, 20, 0.96));
}
.slab::before {
  content: "";
  justify-self: center;
  width: 46px;
  height: 2px;
  margin-top: -8px;
  border-radius: 2px;
  background: linear-gradient(90deg, transparent, var(--brass), transparent);
  opacity: 0.7;
}

/* title */
.title-top {
  padding: max(18px, calc(var(--safe-t) + 10px), 4vh) 16px 0;
  text-align: center;
  background: linear-gradient(180deg, rgba(4, 5, 13, 0.85), rgba(4, 5, 13, 0));
}
.logo-wrap { width: min(90vw, 520px); margin: 0 auto; }
#logo { display: block; width: 100%; height: auto; filter: drop-shadow(0 0 18px rgba(255, 179, 71, 0.35)); }
.tag {
  margin: 6px 0 0;
  font-family: var(--display);
  font-size: clamp(9.5px, 2.9vw, 12px);
  letter-spacing: 0.24em;
  padding-left: 0.24em;
  white-space: nowrap;
  text-transform: uppercase;
  color: var(--brass);
  opacity: 0.85;
}
.title-mid { flex: 1; min-height: 150px; }

.stars-pick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.star-btn {
  font: inherit;
  color: var(--text);
  background: none;
  border: 0;
  padding: 4px 0;
  display: grid;
  justify-items: center;
  gap: 6px;
  cursor: pointer;
}
.s-disc {
  position: relative;
  width: 54px;
  height: 54px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  border: 1px solid rgba(217, 177, 106, 0.22);
  background: radial-gradient(circle, rgba(255, 255, 255, 0.04), transparent 70%);
  transition: border-color 0.2s, box-shadow 0.2s;
}
.s-disc img { width: 64px; height: 64px; margin: -5px; filter: drop-shadow(0 0 8px var(--glow)); }
.s-name { font-family: var(--display); font-size: 12px; font-weight: 600; letter-spacing: 0.06em; color: var(--muted); }
.star-btn[aria-checked="true"] .s-disc { border-color: var(--sun); box-shadow: 0 0 0 1px var(--sun) inset, 0 0 22px rgba(255, 179, 71, 0.35); }
.star-btn[aria-checked="true"] .s-name { color: var(--text); }
.s-lock { display: none; position: absolute; inset: 0; place-items: center; color: var(--text); }
.s-lock svg { width: 20px; height: 20px; }
.star-btn.locked .s-disc img { filter: grayscale(1) brightness(0.35); }
.star-btn.locked .s-lock { display: grid; }
.star-btn.locked .s-name { opacity: 0.55; }
.star-desc { margin: -4px 0 0; min-height: 2.6em; text-align: center; font-size: 13px; line-height: 1.35; color: var(--muted); }
.next-star { margin: -8px 0 0; display: flex; justify-content: center; align-items: center; gap: 5px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.next-star b { color: var(--lilac); font-weight: 600; }
.lock-ic { display: inline-grid; width: 13px; height: 13px; color: var(--lilac); }
.lock-ic svg { width: 100%; height: 100%; }

.foot { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px 2px; margin: -2px -8px 0; }
.foot .btn.ghost { font-size: 13px; padding: 9px 4px; text-align: center; }
.foot .shop-btn { grid-column: 1 / -1; margin: 0 8px 2px; justify-content: center; padding: 11px 12px; border: 1px solid var(--line); border-radius: 12px; background: rgba(143, 227, 255, 0.04); font-family: var(--display); font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; font-size: 13px; }
.shop-btn { display: inline-flex; align-items: center; gap: 9px; position: relative; color: var(--text) !important; }
.shop-btn .dust-pill { font-family: var(--body); letter-spacing: 0; text-transform: none; }
.dust-pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px 2px 7px; border-radius: 99px; background: rgba(143, 227, 255, 0.1); border: 1px solid rgba(143, 227, 255, 0.3); font-size: 12px; font-weight: 600; color: var(--dust); }
.shop-btn.alert::after { content: ""; position: absolute; top: 8px; right: 10px; width: 7px; height: 7px; border-radius: 50%; background: var(--sun); box-shadow: 0 0 8px var(--sun); animation: nx 1.2s ease-in-out infinite; }

/* ---------------------------------------------------------- HUD */
#hud {
  position: absolute;
  top: 0; left: 0; right: 0;
  z-index: 5;
  padding: calc(var(--safe-t) + 10px) 12px 0;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(4, 5, 13, 0.55), rgba(4, 5, 13, 0));
}
.hud-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
.hp { display: flex; align-items: center; gap: 6px; }
.hp > svg { width: 18px; height: 18px; flex: none; fill: #ff5a7d; filter: drop-shadow(0 0 4px rgba(255, 90, 125, 0.7)); }
.hp-bar { position: relative; width: min(30vw, 140px); height: 14px; border-radius: 99px; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 90, 125, 0.35); overflow: hidden; }
.hp-bar i { position: absolute; inset: 0 auto 0 0; width: 100%; border-radius: inherit; }
.hp-bar .lag { background: rgba(255, 255, 255, 0.55); transition: width 0.5s ease 0.25s; }
.hp-bar .fill { background: linear-gradient(90deg, #c2183f, #ff5a7d 60%, #ff9db2); transition: width 0.1s linear; }
.hp-bar b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 10.5px; font-weight: 700; line-height: 1; letter-spacing: 0.04em; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8); }
.hp.hit .hp-bar { animation: hpshake 0.3s ease; }
@keyframes hpshake { 25% { transform: translateX(-3px); } 50% { transform: translateX(3px); } 75% { transform: translateX(-2px); } }
.hp.low > svg { animation: beat 0.8s ease-in-out infinite; }
.hp.low .hp-bar { border-color: var(--danger); box-shadow: 0 0 12px rgba(255, 42, 85, 0.5); }
@keyframes beat { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.25); } 30% { transform: scale(1); } 45% { transform: scale(1.15); } }
.h-time { font-family: var(--display); font-weight: 700; font-size: 26px; letter-spacing: 0.04em; text-shadow: 0 0 14px rgba(255, 179, 71, 0.35); }
.h-time.best { color: var(--sun); }
.hud-r { display: flex; justify-content: flex-end; }
.hud-row2 { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 9px; margin-top: 8px; }
.lv-pill { font-family: var(--display); font-weight: 700; font-size: 12px; letter-spacing: 0.06em; color: #ffe3b3; padding: 2px 9px; border-radius: 99px; border: 1px solid var(--line); background: rgba(11, 15, 34, 0.7); }
.xp { position: relative; height: 8px; border-radius: 99px; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(143, 227, 255, 0.18); overflow: hidden; }
.xp > i { position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(90deg, #2b6fd6, var(--dust) 70%, #ffffff); box-shadow: 0 0 10px rgba(143, 227, 255, 0.8); transition: width 0.12s linear; }
.kills { display: inline-flex; align-items: center; gap: 5px; font-weight: 600; font-size: 14px; }
.kills svg { width: 15px; height: 15px; fill: rgba(255, 42, 85, 0.25); stroke: var(--danger); stroke-width: 1.6; stroke-linejoin: round; }

#boss { margin: 12px auto 0; width: min(74vw, 340px); text-align: center; }
.boss-name { margin-bottom: 5px; font-family: var(--display); font-weight: 700; font-size: 13px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--danger); text-shadow: 0 0 10px rgba(255, 42, 85, 0.7); }
.boss-bar { height: 7px; border-radius: 99px; overflow: hidden; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 42, 85, 0.45); }
.boss-bar > i { display: block; width: 100%; height: 100%; background: linear-gradient(90deg, #a3122f, var(--danger), #ff8aa5); transition: width 0.2s ease; }

/* joystick */
#joy { position: absolute; left: 0; top: 0; z-index: 4; pointer-events: none; opacity: 0; transition: opacity 0.15s ease; }
#joy.on { opacity: 1; transition: none; }
.j-base { position: absolute; left: -54px; top: -54px; width: 108px; height: 108px; border-radius: 50%; border: 1.5px solid rgba(217, 177, 106, 0.4); background: radial-gradient(circle, rgba(217, 177, 106, 0.06), rgba(217, 177, 106, 0.14)); }
.j-knob { position: absolute; left: -21px; top: -21px; width: 42px; height: 42px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff1d4, var(--brass) 55%, #7a5a26); box-shadow: 0 0 16px rgba(255, 179, 71, 0.45); opacity: 0.85; }

/* supernova */
.nova-btn {
  --k: 0;
  position: absolute;
  right: 16px;
  bottom: max(22px, calc(var(--safe-b) + 12px));
  z-index: 6;
  width: 80px;
  height: 80px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  cursor: pointer;
  touch-action: none;
  background: conic-gradient(var(--sun) calc(var(--k) * 360deg), rgba(255, 255, 255, 0.1) 0);
  display: grid;
  place-items: center;
  opacity: 0.8;
  transition: opacity 0.2s;
}
.nova-core { width: 70px; height: 70px; border-radius: 50%; display: grid; place-content: center; gap: 1px; background: radial-gradient(circle, rgba(30, 22, 10, 0.9), rgba(6, 8, 20, 0.95) 72%); }
.nova-label { font-family: var(--display); font-weight: 700; font-size: 13px; letter-spacing: 0.18em; padding-left: 0.18em; text-transform: uppercase; color: var(--muted); }
.nova-key { font-size: 10px; color: var(--muted); opacity: 0.7; text-align: center; }
.nova-btn.ready { opacity: 1; animation: novapulse 1s ease-in-out infinite; }
.nova-btn.ready .nova-core { background: radial-gradient(circle, rgba(255, 179, 71, 0.55), rgba(40, 24, 6, 0.95) 72%); }
.nova-btn.ready .nova-label { color: #fff3dc; text-shadow: 0 0 10px var(--sun); }
@keyframes novapulse { 50% { transform: scale(1.07); box-shadow: 0 0 34px rgba(255, 179, 71, 0.7); } }

/* ---------------------------------------------------------- overlays */
#banner { position: absolute; left: 0; right: 0; top: 30%; z-index: 6; text-align: center; pointer-events: none; opacity: 0; padding: 0 12px; }
#banner .b-main { font-family: var(--display); font-weight: 700; font-size: clamp(20px, 6vw, 38px); letter-spacing: 0.1em; padding-left: 0.1em; line-height: 1.15; text-transform: uppercase; text-shadow: 0 0 24px currentColor; }
#banner .b-sub { margin-top: 8px; font-size: 12px; letter-spacing: 0.22em; padding-left: 0.22em; text-transform: uppercase; color: var(--muted); }
#banner.on { animation: banner 2s ease-out forwards; }
@keyframes banner {
  0% { opacity: 0; transform: scale(1.18); }
  10% { opacity: 1; transform: scale(1); }
  78% { opacity: 1; }
  100% { opacity: 0; transform: scale(0.98); }
}

#hint {
  position: absolute;
  left: 50%;
  top: 24%;
  z-index: 6;
  transform: translateX(-50%);
  width: max-content;
  max-width: min(86vw, 420px);
  padding: 10px 16px;
  border-radius: 14px;
  background: rgba(11, 15, 34, 0.86);
  border: 1px solid var(--line);
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.25s ease;
}
#hint.on { opacity: 1; }
.hint-text { margin: 0; font-size: 15px; line-height: 1.4; text-align: center; }

#toasts { position: absolute; top: calc(var(--safe-t) + 132px); left: 0; right: 0; z-index: 7; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; padding: 0 12px; }
.toast { max-width: 92vw; box-sizing: border-box; text-align: center; padding: 6px 14px; border-radius: 99px; background: rgba(11, 15, 34, 0.9); border: 1px solid var(--line); font-size: 13px; font-weight: 500; animation: toast 2.6s ease forwards; }
.toast.evo { border-color: var(--sun); color: #ffe3b3; box-shadow: 0 0 20px rgba(255, 179, 71, 0.35); }
.toast.best { border-color: var(--sun); color: var(--sun); }
.toast.lock { border-color: rgba(185, 166, 255, 0.5); }
@keyframes toast { 0% { opacity: 0; transform: translateY(-8px); } 10%, 82% { opacity: 1; transform: none; } 100% { opacity: 0; } }

/* ---------------------------------------------------------- level-up */
#levelup { z-index: 12; }
#levelup.locked .card { pointer-events: none; }
.lv-wrap { box-sizing: border-box; width: min(94vw, 520px); display: grid; gap: 10px; padding: 16px; }
.lv-head { margin: 0; display: flex; justify-content: center; align-items: baseline; gap: 10px; font-family: var(--display); text-transform: uppercase; animation: rise 0.35s cubic-bezier(0.2, 0.9, 0.3, 1); }
.lv-head span { font-size: 15px; letter-spacing: 0.3em; color: var(--brass); }
.lv-head b { font-size: 40px; font-weight: 700; color: #ffe3b3; text-shadow: 0 0 22px rgba(255, 179, 71, 0.7); }
.lv-sub { margin: -6px 0 4px; text-align: center; font-size: 13px; color: var(--muted); letter-spacing: 0.08em; }
.cards { display: grid; gap: 10px; }
.card {
  --rc: var(--dust);
  position: relative;
  display: grid;
  grid-template-columns: 50px 1fr;
  column-gap: 13px;
  align-items: center;
  padding: 13px 14px;
  border-radius: 16px;
  border: 1px solid rgba(255, 255, 255, 0.12);
  background: linear-gradient(160deg, rgba(18, 23, 52, 0.97), rgba(9, 12, 28, 0.97));
  color: var(--text);
  font: inherit;
  text-align: left;
  cursor: pointer;
  animation: deal 0.42s cubic-bezier(0.2, 1.3, 0.4, 1) backwards;
  transition: transform 0.12s ease, border-color 0.15s ease;
}
.card:nth-child(2) { animation-delay: 0.07s; }
.card:nth-child(3) { animation-delay: 0.14s; }
@keyframes deal { from { transform: translateY(24px) scale(0.94); opacity: 0; } to { transform: none; opacity: 1; } }
.card:hover { border-color: var(--rc); }
.card:active { transform: scale(0.98); }
.card.rare { --rc: var(--lilac); border-color: rgba(185, 166, 255, 0.38); }
.card.legendary { --rc: var(--sun); border-color: var(--sun); box-shadow: 0 0 28px rgba(255, 179, 71, 0.3); background: linear-gradient(160deg, rgba(48, 32, 12, 0.97), rgba(14, 12, 26, 0.97)); }
.c-ic { width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center; color: var(--rc); border: 1px solid var(--rc); background: radial-gradient(circle, rgba(255, 255, 255, 0.08), transparent 70%); box-shadow: 0 0 16px -4px var(--rc); }
.c-ic .ic { width: 28px; height: 28px; }
.c-body { display: grid; gap: 3px; min-width: 0; }
.c-name { font-family: var(--display); font-weight: 700; font-size: 16px; letter-spacing: 0.03em; }
.c-desc { font-size: 14px; line-height: 1.35; color: #cfc8de; }
.c-body .pips { margin-top: 4px; }
.c-recipe { font-size: 12px; color: var(--sun); opacity: 0.85; }
.c-tag { position: absolute; top: -9px; right: 14px; padding: 2px 9px; border-radius: 99px; font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #06121a; background: var(--dust); }
.c-tag.evo { background: var(--sun); color: #1a1206; }
.c-key { position: absolute; bottom: 9px; right: 12px; font-size: 11px; color: var(--muted); opacity: 0.6; }
.reroll { justify-self: center; color: var(--lilac) !important; }
@media (hover: none) { .c-key { display: none; } }

/* ---------------------------------------------------------- chest */
#chest { z-index: 12; cursor: pointer; }
.chest-wrap { box-sizing: border-box; width: min(94vw, 520px); display: grid; justify-items: center; gap: 14px; padding: 16px; }
.chest-stage { position: relative; width: 170px; height: 170px; display: grid; place-items: center; }
#chest-img { position: relative; width: 150px; height: 150px; filter: drop-shadow(0 0 18px rgba(255, 179, 71, 0.45)); }
.chest-rays { position: absolute; inset: -60px; border-radius: 50%; opacity: 0; background: repeating-conic-gradient(rgba(255, 210, 140, 0.32) 0 9deg, transparent 9deg 24deg); -webkit-mask-image: radial-gradient(circle, #000 18%, transparent 68%); mask-image: radial-gradient(circle, #000 18%, transparent 68%); }
#chest.shaking #chest-img { animation: shake 0.75s ease-in both; }
@keyframes shake {
  0% { transform: scale(0.6); opacity: 0; }
  20% { transform: scale(1); opacity: 1; }
  30%, 50%, 70%, 90% { transform: rotate(-5deg) scale(1.02); }
  40%, 60%, 80% { transform: rotate(5deg) scale(1.04); }
  100% { transform: scale(1.1); }
}
#chest.open #chest-img { animation: burst 0.5s ease-out forwards; }
@keyframes burst { 0% { transform: scale(1.1); filter: brightness(3) drop-shadow(0 0 40px #ffd38c); } 100% { transform: scale(0.82); filter: drop-shadow(0 0 18px rgba(255, 179, 71, 0.45)); } }
#chest.open .chest-rays { opacity: 1; animation: spin 9s linear infinite; }
#chest.open.n5 .chest-rays { background: repeating-conic-gradient(rgba(185, 166, 255, 0.4) 0 9deg, rgba(255, 210, 140, 0.32) 9deg 18deg, transparent 18deg 26deg); }
@keyframes spin { to { transform: rotate(360deg); } }
.chest-head { margin: 0; min-height: 1.3em; font-family: var(--display); font-weight: 700; font-size: 18px; letter-spacing: 0.2em; padding-left: 0.2em; text-transform: uppercase; color: #ffe3b3; text-shadow: 0 0 18px rgba(255, 179, 71, 0.7); }
.chest-items { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.slot {
  --rc: rgba(255, 255, 255, 0.3);
  width: 92px;
  display: grid;
  justify-items: center;
  gap: 6px;
  padding: 10px 4px;
  border-radius: 14px;
  border: 1px solid rgba(255, 255, 255, 0.1);
  background: rgba(11, 15, 34, 0.9);
  text-align: center;
}
.chest-items.n1 .slot { width: 150px; }
.s-ic { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; color: var(--rc); border: 1px solid var(--rc); }
.s-ic .ic { width: 26px; height: 26px; }
.slot.spin .s-ic { opacity: 0.55; animation: flick 0.12s steps(2) infinite; }
@keyframes flick { 50% { transform: translateY(-2px); } }
.s-name { min-height: 2.5em; font-size: 12px; font-weight: 600; line-height: 1.25; }
.slot.landed { animation: land 0.35s cubic-bezier(0.2, 1.6, 0.4, 1); border-color: var(--rc); }
.slot.landed.common { --rc: var(--dust); }
.slot.landed.rare { --rc: var(--lilac); box-shadow: 0 0 18px -4px var(--lilac); }
.slot.landed.legendary { --rc: var(--sun); box-shadow: 0 0 26px -2px var(--sun); }
@keyframes land { from { transform: scale(1.25); } to { transform: none; } }

/* ---------------------------------------------------------- game over */
#over { justify-content: flex-end; pointer-events: none; }
#over .over-slab { pointer-events: auto; }
.over-slab { gap: 12px; animation: rise 0.4s cubic-bezier(0.2, 0.9, 0.3, 1); }
@keyframes rise { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.o-head { margin: 0; text-align: center; font-family: var(--display); font-weight: 600; font-size: 13px; letter-spacing: 0.28em; padding-left: 0.28em; text-transform: uppercase; color: var(--muted); }
.o-head.best { color: var(--sun); text-shadow: 0 0 16px rgba(255, 179, 71, 0.8); }
.o-time { margin: -4px 0 0; text-align: center; font-family: var(--display); font-weight: 700; font-size: clamp(48px, 15vw, 70px); line-height: 1; color: #ffe9c4; text-shadow: 0 0 28px rgba(255, 179, 71, 0.45); }
.o-near { margin: 0; text-align: center; font-size: 14px; min-height: 1.3em; color: var(--muted); }
.o-near.hot { color: var(--sun); }
.o-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 0; }
.o-stats > div { padding: 8px 4px; border-radius: 10px; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.05); text-align: center; }
.o-stats dt { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.o-stats dd { margin: 3px 0 0; font-size: 18px; font-weight: 600; }
.build { display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; }
.bchip { display: inline-flex; align-items: center; gap: 3px; padding: 3px 7px 3px 4px; border-radius: 99px; border: 1px solid rgba(143, 227, 255, 0.3); color: var(--dust); font-family: var(--display); font-size: 11px; font-weight: 700; }
.bchip .ic { width: 16px; height: 16px; }
.bchip.rare { border-color: rgba(185, 166, 255, 0.4); color: var(--lilac); }
.bchip.legendary { border-color: var(--sun); color: var(--sun); }
.o-earn { display: grid; gap: 4px; }
.u-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 13px; }
.u-row.small { font-size: 12px; color: var(--muted); }
.o-gain { display: inline-flex; align-items: center; gap: 7px; font-size: 18px; font-weight: 700; color: var(--dust); }
.o-breakdown { min-width: 0; }
#o-bank { white-space: nowrap; color: var(--dust); }
.o-unlock { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; border: 1px solid var(--sun); background: radial-gradient(120% 140% at 0% 0%, rgba(255, 179, 71, 0.18), rgba(255, 179, 71, 0.03)); animation: pop 0.5s cubic-bezier(0.2, 1.5, 0.4, 1); }
@keyframes pop { from { transform: scale(0.85); opacity: 0; } to { transform: none; opacity: 1; } }
.o-unlock img { width: 48px; height: 48px; flex: none; }
.u-txt { flex: 1; min-width: 0; }
.u-title { font-family: var(--display); font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--sun); }
.u-what { font-weight: 600; font-size: 16px; }
.u-desc { font-size: 12px; color: var(--muted); }
.o-next { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; border: 1px solid rgba(143, 227, 255, 0.22); background: rgba(143, 227, 255, 0.04); }
.o-next.ready { border-color: rgba(255, 179, 71, 0.55); background: rgba(255, 179, 71, 0.06); }
.n-txt { display: grid; gap: 2px; min-width: 0; }
.n-txt b { font-family: var(--display); font-size: 15px; }
.n-desc { font-size: 12px; color: var(--muted); }
.bar { position: relative; height: 5px; margin-top: 5px; border-radius: 99px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
.bar > i { position: absolute; inset: 0 auto 0 0; border-radius: inherit; background: linear-gradient(90deg, #2b6fd6, var(--dust)); }
.o-actions { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: stretch; }

/* ---------------------------------------------------------- pause & sheets */
.panel { box-sizing: border-box; width: min(92vw, 380px); display: grid; gap: 14px; padding: 20px; border-radius: 20px; background: rgba(11, 15, 34, 0.96); border: 1px solid var(--line); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.toggles { display: grid; gap: 2px; }
.switch {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  width: 100%;
  padding: 11px 2px;
  font: inherit;
  font-size: 15px;
  color: var(--text);
  background: none;
  border: 0;
  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  cursor: pointer;
  text-align: left;
}
.switch .knob { position: relative; width: 40px; height: 22px; border-radius: 99px; background: rgba(255, 255, 255, 0.14); transition: background 0.2s; flex: none; }
.switch .knob::after { content: ""; position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform 0.2s; }
.switch[aria-checked="true"] .knob { background: var(--sun); }
.switch[aria-checked="true"] .knob::after { transform: translateX(18px); }

.sheet { position: absolute; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; background: rgba(4, 5, 13, 0.66); }
.sheet-card {
  box-sizing: border-box;
  width: 100%;
  max-width: 540px;
  max-height: 88%;
  overflow-y: auto;
  padding: 16px 16px max(18px, var(--safe-b));
  border-radius: 22px 22px 0 0;
  border: 1px solid var(--line);
  border-bottom: 0;
  background: var(--panel);
  touch-action: pan-y;
  animation: rise 0.28s cubic-bezier(0.2, 0.9, 0.3, 1);
}
.sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.sheet-head h2 { margin: 0; font-family: var(--display); font-size: 17px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #ffe3b3; }
.sec { margin: 18px 0 8px; }
.sec:first-child { margin-top: 0; }
.bank { display: flex; align-items: center; gap: 9px; margin-bottom: 14px; font-size: 14px; color: var(--muted); }
.bank b { font-size: 26px; font-weight: 600; color: var(--dust); }
.shop { display: grid; gap: 8px; }
.shop-row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.08); background: rgba(255, 255, 255, 0.03); }
.shop-row.maxed { opacity: 0.6; }
.sr-txt { display: grid; gap: 3px; min-width: 0; }
.sr-txt b { font-family: var(--display); font-size: 15px; }
.sr-desc { font-size: 13px; color: var(--muted); }
.sr-txt .pips { margin-top: 3px; }
.help { margin: 0; padding: 0 0 0 18px; display: grid; gap: 10px; font-size: 14px; line-height: 1.5; }
.help b { color: var(--sun); font-weight: 600; }
.evos { display: grid; gap: 8px; }
.evo { display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 12px; border: 1px solid rgba(255, 179, 71, 0.3); color: var(--sun); }
.evo .ic { width: 26px; height: 26px; flex: none; }
.evo div { display: grid; gap: 2px; }
.evo b { font-family: var(--display); font-size: 14px; }
.evo span { font-size: 12px; color: var(--muted); }
.records { width: 100%; border-collapse: collapse; font-size: 14px; }
.records th { text-align: left; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 500; padding: 6px 4px; }
.records td { padding: 8px 4px; border-top: 1px solid rgba(255, 255, 255, 0.06); font-variant-numeric: tabular-nums; }
.records td:first-child { font-weight: 700; color: #ffe3b3; }
.kv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0; }
.kv div { padding: 10px; border-radius: 12px; background: rgba(255, 255, 255, 0.04); }
.kv dt { font-size: 11px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
.kv dd { margin: 4px 0 0; font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
.danger-btn { color: var(--danger) !important; margin-top: 10px; }
.note { font-size: 12px; color: var(--muted); margin: 10px 0 0; line-height: 1.45; }

@media (min-width: 720px) {
  #hud { padding: calc(var(--safe-t) + 16px) 22px 0; }
  .h-time { font-size: 30px; }
  .hud-row2 { max-width: 560px; margin-left: auto; margin-right: auto; }
  .cards { gap: 12px; }
}
@media (max-height: 660px) {
  .title-mid { min-height: 70px; }
  .star-desc, .next-star { display: none !important; }
  .tag { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .btn.play::after { animation: none; display: none; }
  .over-slab, .sheet-card, .o-unlock, .card, .slot.landed, .lv-head { animation: none; }
  .nova-btn.ready, .pips i.nx { animation: none; }
  #chest.open .chest-rays { animation: none; }
}

</style>
</head>
<body>
<div id="app">
  <canvas id="gl" aria-hidden="true"></canvas>
  <canvas id="scene" aria-hidden="true"></canvas>
  <div id="stage" aria-label="Play area"></div>
  <div id="joy" aria-hidden="true"><div class="j-base"></div><div id="j-knob" class="j-knob"></div></div>

  <div id="hud" hidden>
    <div class="hud-row">
      <div id="h-hp" class="hp" aria-label="Health"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.8-4.8-9.6-9.7C1.2 8 3.4 4.2 7 4.2c2.1 0 3.8 1.2 5 3.1 1.2-1.9 2.9-3.1 5-3.1 3.6 0 5.8 3.8 4.6 7.1C19.8 16.2 12 21 12 21z"/></svg><div class="hp-bar"><i id="h-hplag" class="lag"></i><i id="h-hpfill" class="fill"></i><b id="h-hptxt" class="num">100</b></div></div>
      <div id="h-time" class="h-time num">0:00</div>
      <div class="hud-r"><button id="b-pause" class="icon-btn" type="button" aria-label="Pause"><span></span><span></span></button></div>
    </div>
    <div class="hud-row2">
      <span id="h-lv" class="lv-pill num">Lv 1</span>
      <div class="xp"><i id="h-xp"></i></div>
      <span class="kills" aria-label="Destroyed"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5 19 12l-7 9.5L5 12z"/><path d="M12 6.5 10.4 11l3 2-1.4 4.5" fill="none"/></svg><span id="h-kills" class="num">0</span></span>
    </div>
    <div id="boss" hidden><div class="boss-name"></div><div class="boss-bar"><i></i></div></div>
  </div>

  <button id="b-nova" class="nova-btn" type="button" hidden aria-label="Supernova"><span class="nova-core"><span class="nova-label">Nova</span><span class="nova-key"></span></span></button>
  <div id="banner" aria-live="polite"><div class="b-main"></div><div class="b-sub"></div></div>
  <div id="hint" role="status"><p class="hint-text"></p></div>
  <div id="toasts" aria-live="polite"></div>

  <section id="title" class="screen">
    <header class="title-top">
      <div class="logo-wrap"><img id="logo" alt="Orrery"></div>
      <p class="tag">Gather moons · Hold back the dark</p>
    </header>
    <div class="title-mid"></div>
    <div class="slab">
      <div id="t-stars" class="stars-pick" role="radiogroup" aria-label="Choose your star"></div>
      <p id="t-star-desc" class="star-desc"></p>
      <p id="t-next" class="next-star" hidden></p>
      <button id="b-play" class="btn play" type="button"><span class="play-label">Play</span><span id="play-sub" class="play-sub"></span></button>
      <nav class="foot">
        <button id="b-shop" class="btn ghost shop-btn" type="button">Observatory <span id="t-dust" class="dust-pill num"></span></button>
        <button id="b-records" class="btn ghost" type="button">Records</button>
        <button id="b-help" class="btn ghost" type="button">How to play</button>
        <button id="b-settings" class="btn ghost" type="button">Settings</button>
      </nav>
    </div>
  </section>

  <section id="levelup" class="screen center overlay" hidden>
    <div class="lv-wrap">
      <p class="lv-head"><span>Level</span><b id="lv-n" class="num">2</b></p>
      <p class="lv-sub">Choose one</p>
      <div id="lv-cards" class="cards"></div>
      <button id="b-reroll" class="btn ghost reroll" type="button" hidden>Reroll</button>
    </div>
  </section>

  <section id="chest" class="screen center overlay" hidden>
    <div class="chest-wrap">
      <div class="chest-stage"><div class="chest-rays"></div><img id="chest-img" alt=""></div>
      <p id="chest-head" class="chest-head"></p>
      <div id="chest-items" class="chest-items"></div>
      <button id="b-collect" class="btn play small" type="button" hidden><span class="play-label">Collect</span></button>
    </div>
  </section>

  <section id="over" class="screen" hidden>
    <div class="slab over-slab">
      <p id="o-head" class="o-head">Your star collapsed</p>
      <p id="o-time" class="o-time num">0:00</p>
      <p id="o-near" class="o-near"></p>
      <dl class="o-stats">

// ---------------------------------------------------------------- util.js
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const sat = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);
const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
const easeInCubic = (t) => t * t * t;
const easeOutQuad = (t) => 1 - (1 - t) * (1 - t);
const easeInOutSine = (t) => -(Math.cos(Math.PI * t) - 1) / 2;
const easeOutBack = (t) => {
  const c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
};
const easeOutElastic = (t) => {
  if (t <= 0) return 0;
  if (t >= 1) return 1;
  return Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (TAU / 3)) + 1;
};

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

class RNG {
  constructor(seed) { this.f = mulberry32(seed >>> 0); }
  next() { return this.f(); }
  range(a, b) { return a + (b - a) * this.f(); }
  int(a, b) { return Math.floor(a + (b - a + 1) * this.f()); }
  pick(arr) { return arr[Math.floor(this.f() * arr.length)]; }
  chance(p) { return this.f() < p; }
  sign() { return this.f() < 0.5 ? -1 : 1; }
  weighted(items, wf) {
    let total = 0;
    for (const it of items) total += Math.max(0, wf(it));
    if (total <= 0) return items[0];
    let r = this.f() * total;
    for (const it of items) {
      r -= Math.max(0, wf(it));
      if (r <= 0) return it;
    }
    return items[items.length - 1];
  }
}

const rnd = (a, b) => a + (b - a) * Math.random();
const rndi = (a, b) => Math.floor(a + (b - a + 1) * Math.random());

function dist(ax, ay, bx, by) { return Math.hypot(ax - bx, ay - by); }

function distToSegment(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  const l2 = dx * dx + dy * dy;
  let t = l2 > 0 ? ((px - ax) * dx + (py - ay) * dy) / l2 : 0;
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
}

// distance from point to infinite line through (x0,y0) with unit direction (ux,uy)
function distToLine(px, py, x0, y0, ux, uy) {
  return Math.abs((px - x0) * uy - (py - y0) * ux);
}

function angDiff(a, b) {
  let d = (b - a) % TAU;
  if (d > Math.PI) d -= TAU;
  if (d < -Math.PI) d += TAU;
  return d;
}

// clip infinite line (point + unit dir) to rectangle, returns [x1,y1,x2,y2] or null
function clipLineToRect(x0, y0, ux, uy, minX, minY, maxX, maxY) {
  let t0 = -1e9, t1 = 1e9;
  const clipAxis = (p, d, lo, hi) => {
    if (Math.abs(d) < 1e-9) return p >= lo && p <= hi;
    let a = (lo - p) / d, b = (hi - p) / d;
    if (a > b) { const t = a; a = b; b = t; }
    t0 = Math.max(t0, a);
    t1 = Math.min(t1, b);
    return t0 <= t1;
  };
  if (!clipAxis(x0, ux, minX, maxX)) return null;
  if (!clipAxis(y0, uy, minY, maxY)) return null;
  return [x0 + ux * t0, y0 + uy * t0, x0 + ux * t1, y0 + uy * t1];
}

function pad2(n) { return n < 10 ? '0' + n : '' + n; }

function todayKey(d) {
  d = d || new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}

function keyToDate(k) {
  const [y, m, d] = k.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function dayDiff(a, b) {
  // whole days from key a to key b
  return Math.round((keyToDate(b) - keyToDate(a)) / 86400000);
}

function dailyNumber(k) {
  return dayDiff('2026-11-01', k) + 1;
}

function fmtNum(n) {
  return Math.floor(n).toLocaleString('en-US');
}

function fmtTime(s) {
  s = Math.max(0, s);
  const m = Math.floor(s / 60);
  const sec = s - m * 60;
  return m + ':' + (sec < 10 ? '0' : '') + sec.toFixed(1);
}

function fmtDate(k) {
  const d = keyToDate(k);
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

const _rgbCache = new Map();
function hexRgb(hex) {
  let c = _rgbCache.get(hex);
  if (c) return c;
  const h = hex.replace('#', '');
  c = [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
  _rgbCache.set(hex, c);
  return c;
}
function rgba(hex, a) {
  const c = hexRgb(hex);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + (a < 0 ? 0 : a > 1 ? 1 : a).toFixed(3) + ')';
}
function mixHex(a, b, t) {
  const x = hexRgb(a), y = hexRgb(b);
  const r = Math.round(lerp(x[0], y[0], t)), g = Math.round(lerp(x[1], y[1], t)), bl = Math.round(lerp(x[2], y[2], t));
  return '#' + ((1 << 24) | (r << 16) | (g << 8) | bl).toString(16).slice(1);
}
function hsl(h, s, l, a) {
  return 'hsla(' + (((h % 360) + 360) % 360).toFixed(1) + ',' + s + '%,' + l + '%,' + (a === undefined ? 1 : a) + ')';
}

const $ = (sel, root) => (root || document).querySelector(sel);

}

const SAVE_KEY = 'orrery.save.v1';

function defaultSave() {
  return {
    v: 1,
    dust: 0,
    dustTotal: 0,
    shop: {},
    star: 'sol',
    stars: { sol: true },
    best: { time: 0, kills: 0, level: 1 },
    stats: { runs: 0, kills: 0, time: 0, bosses: 0, chests: 0, evolutions: 0 },
    top: [],
    seen: {},
    settings: { sound: true, music: true, shake: !prefersReducedMotion, flashes: !prefersReducedMotion, haptics: true, numbers: true },
    updated: 0,
  };
}

function deepFill(target, defaults) {
  for (const k in defaults) {
    const dv = defaults[k];
    if (target[k] === undefined || target[k] === null) target[k] = dv === null ? null : JSON.parse(JSON.stringify(dv));
    else if (dv && typeof dv === 'object' && !Array.isArray(dv) && typeof target[k] === 'object') deepFill(target[k], dv);
  }
  return target;
}

function mergeSaves(a, b) {
  a = deepFill(JSON.parse(JSON.stringify(a)), defaultSave());
  b = deepFill(JSON.parse(JSON.stringify(b)), defaultSave());
  const newer = (b.updated || 0) > (a.updated || 0) ? b : a;
  const out = JSON.parse(JSON.stringify(newer)); // spendable dust and the shop follow the newest device
  out.dustTotal = Math.max(a.dustTotal, b.dustTotal);
  out.stars = Object.assign({}, a.stars, b.stars);
  out.seen = Object.assign({}, a.seen, b.seen);
  for (const k in out.best) out.best[k] = Math.max(a.best[k] || 0, b.best[k] || 0);
  for (const k in out.stats) out.stats[k] = Math.max(a.stats[k] || 0, b.stats[k] || 0);
  const seenTop = new Set();
  out.top = a.top.concat(b.top).filter((r) => {
    const key = r.time + '|' + r.date + '|' + r.kills;
    if (seenTop.has(key)) return false;
    seenTop.add(key);
    return true;
  }).sort((x, y) => y.time - x.time).slice(0, 5);
  out.updated = Math.max(a.updated || 0, b.updated || 0);
  return out;
}

const Save = {
  data: defaultSave(),
  cloud: { ref: null, ready: false, writing: false, pending: false, lastJson: '', failed: 0 },

  load() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (raw) this.data = deepFill(JSON.parse(raw), defaultSave());
    } catch (e) { /* storage unavailable */ }
    this.sanitize();
  },

  sanitize() {
    const d = this.data;
    if (!STARS[d.star] || !d.stars[d.star]) d.star = 'sol';
    checkStarUnlocks();
  },

  persistLocal() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(this.data)); } catch (e) { /* ignore */ }
  },

  persist() {
    this.data.updated = Date.now();
    this.persistLocal();
    this.cloudWrite();
  },

  async cloudInit() {
    try {
      const cl = window.__asafClaude || window.claude;
      if (!cl || typeof cl.use !== 'function') return;
      const [db, user] = await Promise.all([cl.use('db'), cl.use('user')]);
      if (!db || !user) return;
      const id = await user.id();
      if (!id) return;
      const ref = db.doc('data/users/' + id + '/save');
      let timer = 0;
      const snap = await Promise.race([
        ref.get(),
        new Promise((_, rej) => { timer = setTimeout(() => rej(new Error('timeout')), 10000); }),
      ]);
      clearTimeout(timer);
      this.cloud.ref = ref;
      if (snap && snap.exists) {
        const body = snap.data();
        if (body && body.save && typeof body.save === 'object') {
          const remote = JSON.parse(JSON.stringify(body.save));
          this.cloud.lastJson = JSON.stringify(remote);
          this.data = mergeSaves(this.data, remote);
          this.sanitize();
          this.persistLocal();
          if (typeof UI !== 'undefined' && UI.refreshTitle) UI.refreshTitle();
        }
      }
      this.cloud.ready = true;
      this.cloudWrite();
    } catch (e) {
      console.warn('[orrery] cloud save unavailable:', e && (e.code || e.message));
    }
  },

  cloudWrite() {
    const c = this.cloud;
    if (!c.ref || !c.ready) return;
    if (c.writing) { c.pending = true; return; }
    const json = JSON.stringify(this.data);
    if (json === c.lastJson) return;
    c.writing = true;
    c.ref.set({ save: JSON.parse(json) })
      .then(() => { c.lastJson = json; c.failed = 0; })
      .catch((e) => {
        const code = e && e.code;
        c.failed++;
        if (code === 'unavailable' && c.failed < 3) setTimeout(() => this.cloudWrite(), 1500 + Math.random() * 1500);
        else if (code && code !== 'unavailable' && code !== 'resource_exhausted') c.ref = null;
      })
      .finally(() => {
        c.writing = false;
        if (c.pending) { c.pending = false; this.cloudWrite(); }
      });
  },
};

  const d = Save.data;

function checkStarUnlocks() {
  const fresh = [];
  for (const id of STAR_ORDER) {
    const s = STARS[id];
    if (Save.data.stars[id] || !s.unlock) continue;
    if (starStat(s.unlock.stat) >= s.unlock.n) { Save.data.stars[id] = true; fresh.push(id); }
  }
  return fresh;
}

// ---------------------------------------------------------------- sound.js (synth core shared with Afterimage)
const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);

const Sound = {
  ac: null, ok: false,
  master: null, musicBus: null, musicLP: null, pump: null, drums: null, sfx: null, revIn: null, delIn: null, noise: null,
  musicOn: true, sfxOn: true, detune: 0, last: {},

  ensure() {
    if (this.ac) {
      if (this.ac.state === 'suspended') this.ac.resume().catch(() => {});
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { this.ac = new AC({ latencyHint: 'interactive' }); } catch (e) {
      try { this.ac = new AC(); } catch (e2) { return; }
    }
    try { this.build(); this.ok = true; } catch (e) { console.warn('[afterimage] audio off', e); this.ok = false; }
    if (this.ac.state === 'suspended') this.ac.resume().catch(() => {});
    if (this.ok && Music.playing) {
      this.setDelayTime(60 / Music.bpm);
      this.musicFilter(Music.level === 0 ? 2600 : 18000, 0.05);
    }
  },

  build() {
    const ac = this.ac;
    this.master = ac.createGain();
    this.master.gain.value = 0.9;
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 14; comp.ratio.value = 4;
    comp.attack.value = 0.003; comp.release.value = 0.18;
    this.master.connect(comp);
    comp.connect(ac.destination);

    this.musicBus = ac.createGain();
    this.musicBus.gain.value = 0.48;
    this.musicLP = ac.createBiquadFilter();
    this.musicLP.type = 'lowpass';
    this.musicLP.frequency.value = 18000;
    this.musicLP.Q.value = 0.8;
    this.musicBus.connect(this.musicLP);
    this.musicLP.connect(this.master);
    this.pump = ac.createGain();
    this.pump.connect(this.musicBus);
    this.drums = ac.createGain();
    this.drums.connect(this.musicBus);

    this.sfx = ac.createGain();
    this.sfx.gain.value = 0.75;
    this.sfx.connect(this.master);

    const rev = ac.createConvolver();
    rev.buffer = this.impulse(2.6, 2.4);
    this.revIn = ac.createGain();
    this.revIn.connect(rev);
    const revOut = ac.createGain();
    revOut.gain.value = 0.34;
    rev.connect(revOut);
    revOut.connect(this.master);

    const dl = ac.createDelay(1.5);
    dl.delayTime.value = 0.375;
    const fb = ac.createGain();
    fb.gain.value = 0.36;
    const dlp = ac.createBiquadFilter();
    dlp.type = 'lowpass';
    dlp.frequency.value = 2400;
    this.delIn = ac.createGain();
    this.delIn.connect(dl);
    dl.connect(dlp);
    dlp.connect(fb);
    fb.connect(dl);
    const dOut = ac.createGain();
    dOut.gain.value = 0.3;
    dlp.connect(dOut);
    dOut.connect(this.musicBus);
    this.delayNode = dl;

    const len = ac.sampleRate;
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.noise = buf;
    this.applySettings();
  },

  impulse(dur, decay) {
    const ac = this.ac, rate = ac.sampleRate, len = Math.floor(rate * dur);
    const buf = ac.createBuffer(2, len, rate);
    for (let c = 0; c < 2; c++) {
      const d = buf.getChannelData(c);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
    return buf;
  },

  applySettings() {
    const s = Save.data.settings;
    this.musicOn = !!(s.music && s.sound);
    this.sfxOn = !!s.sound;
    if (!this.ac || !this.musicBus) return;
    const t = this.ac.currentTime;
    this.musicBus.gain.setTargetAtTime(this.musicOn ? 0.48 : 0, t, 0.05);
    this.sfx.gain.setTargetAtTime(this.sfxOn ? 0.75 : 0, t, 0.05);
  },

  setDelayTime(beatLen) {
    if (this.delayNode) this.delayNode.delayTime.setTargetAtTime(beatLen * 0.75, this.ac.currentTime, 0.05);
  },

  musicFilter(freq, tc) {
    if (!this.ac) return;
    this.musicLP.frequency.setTargetAtTime(freq, this.ac.currentTime, tc || 0.08);
  },

  rate(name, gap) {
    const n = performance.now();
    if ((this.last[name] || 0) + gap * 1000 > n) return false;
    this.last[name] = n;
    return true;
  },

  can() { return this.ok && this.ac && this.ac.state === 'running'; },

  tone(o) {
    const ac = this.ac;
    const t = o.t !== undefined ? o.t : ac.currentTime;
    const osc = ac.createOscillator();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.f, t);
    if (o.f2) osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.f2), t + (o.slide || o.dur));
    if (o.detune) osc.detune.setValueAtTime(o.detune, t);
    const g = ac.createGain();
    const a = o.a || 0.004, dur = o.dur, peak = o.g === undefined ? 0.3 : o.g;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t + a);
    if (o.hold) g.gain.setValueAtTime(Math.max(0.0002, peak), t + a + o.hold);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    let node = osc;
    if (o.lp) {
      const f = ac.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.setValueAtTime(o.lp, t);
      if (o.lp2) f.frequency.exponentialRampToValueAtTime(o.lp2, t + dur);
      f.Q.value = o.q || 0.9;
      node.connect(f);
      node = f;
    }
    node.connect(g);
    g.connect(o.dest || this.sfx);
    if (o.rev) { const s = ac.createGain(); s.gain.value = o.rev; g.connect(s); s.connect(this.revIn); }
    if (o.del) { const s = ac.createGain(); s.gain.value = o.del; g.connect(s); s.connect(this.delIn); }
    osc.start(t);
    osc.stop(t + dur + 0.05);
  },

  hiss(o) {
    const ac = this.ac;
    const t = o.t !== undefined ? o.t : ac.currentTime;
    const src = ac.createBufferSource();
    src.buffer = this.noise;
    const f = ac.createBiquadFilter();
    f.type = o.type || 'bandpass';
    f.frequency.setValueAtTime(o.f || 1000, t);
    if (o.f2) f.frequency.exponentialRampToValueAtTime(o.f2, t + o.dur);
    f.Q.value = o.q || 0.9;
    const g = ac.createGain();
    const a = o.a || 0.002;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, o.g === undefined ? 0.3 : o.g), t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
    src.connect(f);
    f.connect(g);
    g.connect(o.dest || this.sfx);
    if (o.rev) { const s = ac.createGain(); s.gain.value = o.rev; g.connect(s); s.connect(this.revIn); }
    src.start(t, Math.random() * 0.4, o.dur + 0.06);
  },
};

const O_CHORDS = [
  { bass: 38, tones: [53, 57, 60, 64] }, // Dm9
  { bass: 46, tones: [58, 62, 65, 69] }, // Bbmaj7
  { bass: 41, tones: [53, 57, 60, 64] }, // Fmaj7
  { bass: 48, tones: [55, 60, 62, 64] }, // Cadd9
];
const O_BOSS = [
  { bass: 38, tones: [50, 53, 57, 62] }, // Dm
  { bass: 46, tones: [53, 58, 62, 65] }, // Bb
  { bass: 43, tones: [55, 58, 62, 67] }, // Gm
  { bass: 45, tones: [57, 61, 64, 69] }, // A
];
const PENTA = [74, 77, 79, 81, 84, 86, 89, 91, 93, 96];
const BELL_ARP = [0, 2, 1, 3, 2, 4, 3, 5, 4, 3, 2, 1, 2, 3, 1, 0];

const Music = {
  playing: false, bpm: 112, stepLen: 60 / 112 / 4, nextStep: 0, nextStepTime: 0, level: 0, boss: false,
  queued: 0, noteIdx: 0, lastNoteR: 0,

  start(songTime, bpm, level) {
    this.bpm = bpm;
    this.stepLen = 60 / bpm / 4;
    this.level = level;
    this.playing = true;
    this.resync(songTime);
    if (Sound.ac) {
      Sound.setDelayTime(60 / bpm);
      Sound.musicFilter(level === 0 ? 3000 : 18000, 0.3);
      Sound.musicBus.gain.setTargetAtTime(Sound.musicOn ? 0.48 : 0, Sound.ac.currentTime, 0.1);
    }
  },
  stop() { this.playing = false; },
  resync(songTime) {
    this.nextStep = Math.max(0, Math.ceil(songTime / this.stepLen - 1e-6));
    this.nextStepTime = this.nextStep * this.stepLen;
  },
  update(songTime, ws) {
    if (!this.playing) return;
    if (!Sound.can() || !Sound.musicOn) { this.resync(songTime); this.queued = 0; return; }
    if (ws < 0.01) return;
    if (this.nextStepTime < songTime - 0.3) this.resync(songTime);
    const now = Sound.ac.currentTime;
    let guard = 0;
    while (this.nextStepTime < songTime + 0.1 * ws && guard++ < 16) {
      const at = now + Math.max(0, (this.nextStepTime - songTime) / ws);
      this.step(this.nextStep, at, ws);
      this.nextStep++;
      this.nextStepTime = this.nextStep * this.stepLen;
    }
  },

  // kills become notes on the next sixteenth
  note() {
    this.queued = Math.min(this.queued + 1, 4);
  },

  step(n, t, ws) {
    const S = Sound, L = this.level, s16 = n % 16, bar = Math.floor(n / 16);
    const ch = (this.boss ? O_BOSS : O_CHORDS)[bar % 4];
    const det = S.detune;
    const stretch = Math.min(2.5, 1 / Math.max(ws, 0.4));
    const barDur = Math.min(5, (this.stepLen * 16) / Math.max(ws, 0.25));

    if (this.queued > 0 && S.sfxOn) {
      const k = Math.min(2, this.queued);
      this.queued = 0;
      const nowR = performance.now();
      if (nowR - this.lastNoteR > 900) this.noteIdx = 0;
      this.lastNoteR = nowR;
      for (let i = 0; i < k; i++) {
        const m = PENTA[this.noteIdx % PENTA.length] + (this.noteIdx >= PENTA.length ? 0 : 0);
        this.noteIdx = (this.noteIdx + 1) % (PENTA.length * 2);
        S.tone({ t, type: 'triangle', f: mtof(m - (i ? 12 : 0)), dur: 0.32, g: 0.07, rev: 0.45, dest: S.sfx, detune: det });
        S.tone({ t, type: 'sine', f: mtof(m + 12), dur: 0.14, g: 0.025, dest: S.sfx });
      }
    }

    let kick = false;
    if (L === 1 || L === 2) kick = s16 === 0 || s16 === 8;
    else if (L >= 3) kick = s16 % 4 === 0 || (this.boss && s16 === 14);
    if (kick) {
      S.tone({ t, type: 'sine', f: 130, f2: 42, slide: 0.1, dur: 0.38 * stretch, g: L >= 3 ? 0.9 : 0.6, dest: S.drums, detune: det });
      const pg = S.pump.gain;
      pg.cancelScheduledValues(t);
      pg.setValueAtTime(0.45, t);
      pg.linearRampToValueAtTime(1, t + 0.26 * stretch);
    }
    if (L >= 3 && (s16 === 4 || s16 === 12)) {
      S.hiss({ t, type: 'bandpass', f: 1500, q: 0.6, dur: 0.16 * stretch, g: 0.22, dest: S.drums, rev: 0.35 });
      S.hiss({ t: t + 0.012, type: 'bandpass', f: 2100, q: 0.9, dur: 0.1, g: 0.12, dest: S.drums });
    }
    if (L >= 2 && (L >= 4 || s16 % 2 === 0)) S.hiss({ t, type: 'highpass', f: 9000, dur: 0.03, g: s16 % 4 === 2 ? 0.075 : 0.035, dest: S.drums });

    if (L >= 2) {
      const pattern = L >= 3 ? s16 % 2 === 0 : s16 % 4 === 0;
      if (pattern) {
        const m = ch.bass + (L >= 4 && s16 % 8 === 6 ? 12 : 0);
        S.tone({ t, type: 'sawtooth', f: mtof(m), dur: 0.22 * stretch, g: 0.16, lp: 700, lp2: 220, dest: S.pump, detune: det });
        S.tone({ t, type: 'sine', f: mtof(m - 12), dur: 0.26 * stretch, g: 0.22, dest: S.pump, detune: det });
      }
    }
    if (s16 === 0) {
      for (const m of ch.tones) {
        for (const d of [-7, 7]) {
          S.tone({ t, type: 'sawtooth', f: mtof(m), detune: d + det, a: 0.5, hold: barDur * 0.6, dur: barDur * 1.05, g: L === 0 ? 0.045 : 0.032, lp: this.boss ? 1700 : 1300, dest: S.pump, rev: 0.6 });
        }
      }
    }
    if (s16 % 2 === 0 || L >= 4) {
      const tones = ch.tones.concat(ch.tones.map((x) => x + 12));
      const m = tones[BELL_ARP[s16] % tones.length] + 12;
      const g = L === 0 ? 0.03 : 0.038;
      S.tone({ t, type: 'sine', f: mtof(m), dur: 0.5 * stretch, g, dest: S.pump, del: 0.45, rev: 0.4, detune: det });
      S.tone({ t, type: 'sine', f: mtof(m) * 3.01, dur: 0.18, g: g * 0.25, dest: S.pump, detune: det });
    }
    if (L >= 4 && (s16 === 6 || s16 === 14)) {
      const m = ch.tones[(bar + s16) % ch.tones.length] + 24;
      S.tone({ t, type: 'square', f: mtof(m), dur: 0.16, g: 0.03, lp: 2600, dest: S.musicBus, del: 0.4 });
    }
  },
};

const Sfx = {

// ---------------------------------------------------------------- post.js
// WebGL post-processing: bloom, chromatic aberration, shock ripples, slow-mo grade.
const VS = 'attribute vec2 p;varying vec2 uv;void main(){uv=p*0.5+0.5;gl_Position=vec4(p,0.0,1.0);}';
const FS_BRIGHT = `precision mediump float;varying vec2 uv;uniform sampler2D t;uniform vec2 texel;
void main(){vec2 s=vec2(uv.x,1.0-uv.y);
vec3 c=texture2D(t,s+texel*vec2(-1.0,-1.0)).rgb+texture2D(t,s+texel*vec2(1.0,-1.0)).rgb+texture2D(t,s+texel*vec2(-1.0,1.0)).rgb+texture2D(t,s+texel*vec2(1.0,1.0)).rgb;
c*=0.25;float m=max(c.r,max(c.g,c.b));c*=smoothstep(0.2,0.78,m);gl_FragColor=vec4(c,1.0);}`;
const FS_BLUR = `precision mediump float;varying vec2 uv;uniform sampler2D t;uniform vec2 dir;
void main(){vec3 c=texture2D(t,uv).rgb*0.227027;
c+=(texture2D(t,uv+dir*1.384615).rgb+texture2D(t,uv-dir*1.384615).rgb)*0.316216;
c+=(texture2D(t,uv+dir*3.230769).rgb+texture2D(t,uv-dir*3.230769).rgb)*0.070270;
gl_FragColor=vec4(c,1.0);}`;
const FS_COPY = 'precision mediump float;varying vec2 uv;uniform sampler2D t;void main(){gl_FragColor=texture2D(t,uv);}';
const FS_FINAL = `precision mediump float;varying vec2 uv;
uniform sampler2D scene;uniform sampler2D b1;uniform sampler2D b2;
uniform float bloom;uniform float ca;uniform float vig;uniform float flash;uniform vec3 flashCol;uniform float slow;uniform float grain;uniform float time;uniform float aspect;
uniform vec4 waves[3];
void main(){
  vec2 u=uv;
  for(int i=0;i<3;i++){vec4 w=waves[i];if(w.w>0.0){vec2 d=u-w.xy;d.x*=aspect;float r=length(d);float k=r-w.z;float a=w.w*exp(-k*k*700.0);vec2 n=d/(r+0.0001);n.x/=aspect;u-=n*a;}}
  vec2 c=u-0.5;
  vec2 s=vec2(u.x,1.0-u.y);
  vec2 o=vec2(c.x,-c.y)*ca*0.012;
  vec3 col=vec3(texture2D(scene,s+o).r,texture2D(scene,s).g,texture2D(scene,s-o).b);
  vec3 b=texture2D(b1,u).rgb+texture2D(b2,u).rgb*0.9;
  col+=b*bloom;
  float l=dot(col,vec3(0.299,0.587,0.114));
  col=mix(col,vec3(l)*vec3(0.78,0.82,1.3),slow*0.5);
  vec2 vc=c;vc.x*=min(aspect,1.0)/max(aspect,1.0)+0.4;
  float v=smoothstep(0.98,0.28,length(vc)*1.15);
  col*=mix(1.0,v,vig);
  col*=0.975+0.025*sin(gl_FragCoord.y*3.14159);
  col=mix(col,flashCol,flash);
  col+=(fract(sin(dot(gl_FragCoord.xy+time,vec2(12.9898,78.233)))*43758.5453)-0.5)*grain;
  gl_FragColor=vec4(col,1.0);
}`;

const Post = {
  gl: null, ok: false, lost: false, W: 0, H: 0, prog: {}, tex: null, T: {}, bound: false,
  p: { bloom: 0.85, ca: 0, vig: 0.55, flash: 0, flashCol: [1, 1, 1], slow: 0, grain: 0.03, waves: new Float32Array(12), lite: false },

  init(canvas) {
    let gl = null;
    try {
      gl = canvas.getContext('webgl', { alpha: false, antialias: false, depth: false, stencil: false, premultipliedAlpha: false, preserveDrawingBuffer: false, powerPreference: 'high-performance' });
    } catch (e) { gl = null; }
    if (!gl) return false;
    this.gl = gl;
    this.canvas = canvas;
    try {
      this.prog.bright = this.program(FS_BRIGHT);
      this.prog.blur = this.program(FS_BLUR);
      this.prog.copy = this.program(FS_COPY);
      this.prog.final = this.program(FS_FINAL);
    } catch (e) {
      console.warn('[afterimage] post shaders failed', e);
      return false;
    }
    this.buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, this.buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    this.tex = this.texture();
    if (!this.bound) {
      this.bound = true;
      canvas.addEventListener('webglcontextlost', (e) => { e.preventDefault(); this.ok = false; this.lost = true; });
      canvas.addEventListener('webglcontextrestored', () => {
        this.lost = false;
        this.T = {};
        if (this.init(canvas)) this.resize(this.W, this.H);
      });
    }
    this.ok = true;
    return true;
  },

  program(fs) {
    const gl = this.gl;
    const mk = (type, src) => {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
      return s;
    };
    const p = gl.createProgram();
    gl.attachShader(p, mk(gl.VERTEX_SHADER, VS));
    gl.attachShader(p, mk(gl.FRAGMENT_SHADER, fs));
    gl.bindAttribLocation(p, 0, 'p');
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    const loc = {};
    const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < n; i++) {
      const info = gl.getActiveUniform(p, i);
      const name = info.name.replace('[0]', '');
      loc[name] = gl.getUniformLocation(p, name);
    }
    return { p, loc };
  },

  texture() {
    const gl = this.gl;
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    return t;
  },

  target(w, h) {
    const gl = this.gl;
    const tex = this.texture();
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    const fb = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return { tex, fb, w, h };
  },

  resize(w, h) {
    this.W = w;
    this.H = h;
    if (!this.ok) return;
    const gl = this.gl;
    for (const k in this.T) {
      gl.deleteTexture(this.T[k].tex);
      gl.deleteFramebuffer(this.T[k].fb);
    }
    const q = Math.max(1, Math.round(w / 4)), r = Math.max(1, Math.round(h / 4));
    const q2 = Math.max(1, Math.round(w / 10)), r2 = Math.max(1, Math.round(h / 10));
    this.T = { A: this.target(q, r), B: this.target(q, r), C: this.target(q2, r2), D: this.target(q2, r2) };
  },

  pass(prog, tgt, texs, uni) {
    const gl = this.gl;
    gl.useProgram(prog.p);
    if (tgt) { gl.bindFramebuffer(gl.FRAMEBUFFER, tgt.fb); gl.viewport(0, 0, tgt.w, tgt.h); }
    else { gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, this.W, this.H); }
    let unit = 0;
    for (const name in texs) {
      gl.activeTexture(gl.TEXTURE0 + unit);
      gl.bindTexture(gl.TEXTURE_2D, texs[name]);
      gl.uniform1i(prog.loc[name], unit);
      unit++;
    }
    for (const name in uni) {
      const v = uni[name], l = prog.loc[name];
      if (l === undefined || l === null) continue;
      if (typeof v === 'number') gl.uniform1f(l, v);
      else if (v.length === 2) gl.uniform2fv(l, v);
      else if (v.length === 3) gl.uniform3fv(l, v);
      else gl.uniform4fv(l, v);
    }
    gl.bindBuffer(gl.ARRAY_BUFFER, this.buf);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  },

  present(src, time) {
    if (!this.ok || this.lost) return;
    const gl = this.gl, T = this.T, P = this.p;
    gl.disable(gl.BLEND);
    gl.bindTexture(gl.TEXTURE_2D, this.tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src);
    if (!P.lite) {
      this.pass(this.prog.bright, T.A, { t: this.tex }, { texel: [1.5 / this.W, 1.5 / this.H] });
      this.pass(this.prog.blur, T.B, { t: T.A.tex }, { dir: [1 / T.A.w, 0] });
      this.pass(this.prog.blur, T.A, { t: T.B.tex }, { dir: [0, 1 / T.A.h] });
      this.pass(this.prog.copy, T.C, { t: T.A.tex }, {});
      this.pass(this.prog.blur, T.D, { t: T.C.tex }, { dir: [1 / T.C.w, 0] });
      this.pass(this.prog.blur, T.C, { t: T.D.tex }, { dir: [0, 1 / T.C.h] });
    }
    this.pass(this.prog.final, null, { scene: this.tex, b1: T.A.tex, b2: T.C.tex }, {
      bloom: P.lite ? 0 : P.bloom, ca: P.ca, vig: P.vig, flash: P.flash, flashCol: P.flashCol, slow: P.slow,
      grain: P.grain, time: time % 100, aspect: this.W / this.H, waves: P.waves,
    });
  },
};

// ---------------------------------------------------------------- fx.js
const FX = {
  pool: [], head: 0, MAX: 720,
  pops: [],
  trauma: 0, flashA: 0, flashCol: [1, 1, 1], ca: 0, waves: [],

  init() {
    this.pool = [];
    for (let i = 0; i < this.MAX; i++) this.pool.push({ on: false });
  },

  clear() {
    for (const p of this.pool) p.on = false;
    this.pops.length = 0;
    this.waves.length = 0;
    this.trauma = 0; this.flashA = 0; this.ca = 0;
  },

  part(o) {
    const p = this.pool[this.head];
    this.head = (this.head + 1) % this.MAX;
    p.on = true;
    p.type = o.type || 'dot';
    p.x = o.x; p.y = o.y;
    p.vx = o.vx || 0; p.vy = o.vy || 0;
    p.life = o.life || 0.5; p.t = 0;
    p.size = o.size || 3;
    p.color = o.color || PAL.white;
    p.drag = o.drag === undefined ? 3 : o.drag;
    p.r0 = o.r0 || 0; p.r1 = o.r1 || 40;
    p.w = o.w || 2;
    p.rot = o.rot || 0; p.vr = o.vr || 0;
    p.real = !!o.real;
    p.add = o.add !== false;
    return p;
  },

  burst(x, y, n, color, sp0, sp1, life, size, type) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, s = rnd(sp0, sp1);
      this.part({ type: type || 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: life * rnd(0.6, 1.2), size: size * rnd(0.6, 1.3), color, drag: 4 });
    }
  },

  ring(x, y, r0, r1, life, color, w) {
    this.part({ type: 'ring', x, y, r0, r1, life, color, w: w || 3 });
  },

  pop(text, x, y, o) {
    o = o || {};
    this.pops.push({ text, x, y, t: 0, life: o.life || 0.9, size: o.size || 18, color: o.color || PAL.white, vy: o.vy === undefined ? -38 : o.vy, big: !!o.big });
    if (this.pops.length > 24) this.pops.shift();
  },

  shake(a) {
    if (!Save.data.settings.shake) return;
    this.trauma = Math.min(1, this.trauma + a);
  },

  flash(a, col) {
    if (!Save.data.settings.flashes) a *= 0.25;
    this.flashA = Math.max(this.flashA, a);
    this.flashCol = col || [1, 1, 1];
  },

  wave(x, y, strength, speed) {
    this.waves.push({ x, y, t: 0, s: strength || 0.03, v: speed || 1.1 });
    if (this.waves.length > 3) this.waves.shift();
  },

  update(dtW, dtR) {
    for (const p of this.pool) {
      if (!p.on) continue;
      const dt = p.real ? dtR : dtW;
      p.t += dt;
      if (p.t >= p.life) { p.on = false; continue; }
      const k = Math.exp(-p.drag * dt);
      p.vx *= k; p.vy *= k;
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.rot += p.vr * dt;
    }
    for (let i = this.pops.length - 1; i >= 0; i--) {
      const q = this.pops[i];
      q.t += dtR;
      q.y += q.vy * dtR * (1 - q.t / q.life);
      if (q.t >= q.life) this.pops.splice(i, 1);
    }
    this.trauma = Math.max(0, this.trauma - dtR * 1.5);
    this.flashA = Math.max(0, this.flashA - dtR * 3.2);
    this.ca = Math.max(0, this.ca - dtR * 2.2);
    for (let i = this.waves.length - 1; i >= 0; i--) {
      const w = this.waves[i];
      w.t += dtR;
      if (w.t > 0.9) this.waves.splice(i, 1);
    }
  },

  shakeOffset(time) {
    const s = this.trauma * this.trauma * 16;
    if (s < 0.01) return [0, 0];
    return [s * (Math.sin(time * 61.3) * 0.6 + Math.sin(time * 23.7 + 1.3) * 0.4), s * (Math.sin(time * 53.1 + 2.1) * 0.6 + Math.sin(time * 31.9) * 0.4)];
  },

  // post uniforms: wave centres in uv space
  writeWaves(arr) {
    arr.fill(0);
    for (let i = 0; i < this.waves.length && i < 3; i++) {
      const w = this.waves[i];
      const sx = (G.offX + w.x * G.s) / G.pxW, sy = 1 - (G.offY + w.y * G.s) / G.pxH;
      const k = w.t / 0.9;
      arr[i * 4] = sx;
      arr[i * 4 + 1] = sy;
      arr[i * 4 + 2] = w.t * w.v * 0.6;
      arr[i * 4 + 3] = w.s * (1 - k) * (1 - k);
    }
  },
};


// ---------------------------------------------------------------- entities.js
const HASH_CELL = 48;

const Hash = {
  map: new Map(),
  key(cx, cy) { return cx * 73856093 ^ cy * 19349663; },
  build(list) {
    this.map.clear();
    for (const e of list) {
      if (e.dead) continue;
      const k = this.key(Math.floor(e.x / HASH_CELL), Math.floor(e.y / HASH_CELL));
      let a = this.map.get(k);
      if (!a) { a = []; this.map.set(k, a); }
      a.push(e);
    }
  },
  query(x, y, r, out) {
    out.length = 0;
    const x0 = Math.floor((x - r) / HASH_CELL), x1 = Math.floor((x + r) / HASH_CELL);
    const y0 = Math.floor((y - r) / HASH_CELL), y1 = Math.floor((y + r) / HASH_CELL);
    for (let cx = x0; cx <= x1; cx++) {
      for (let cy = y0; cy <= y1; cy++) {
        const a = this.map.get(this.key(cx, cy));
        if (a) for (const e of a) if (!e.dead) out.push(e);
      }
    }
    return out;
  },
};

class Enemy {
  constructor(type, x, y, o) {
    o = o || {};
    const d = ENEMIES[type];
    this.type = type;
    this.d = d;
    this.x = x;
    this.y = y;
    this.elite = !!o.elite;
    this.r = d.r * (this.elite ? 1.4 : 1);
    const run = !G.attract && G.run;
    this.maxHp = this.hp = d.hp * (o.hpScale || 1) * (this.elite ? 5 : 1);
    this.speed = d.speed * (o.speedMul || 1) * (this.elite ? 0.9 : 1) * (run ? Game.speedScale() : 1);
    this.mass = d.mass * (this.elite ? 3 : 1) * (run ? Game.massScale() : 1);
    this.kx = 0;
    this.ky = 0;
    this.ang = Math.atan2(G.player.y - y, G.player.x - x);
    this.flash = 0;
    this.hitCD = 0;
    this.burnCD = 0;
    this.slowUntil = 0;
    this.state = 'walk';
    this.tm = rnd(1.2, 2.6);
    this.lx = 0;
    this.ly = 0;
    this.phase = Math.random() * TAU;
    this.dead = false;
    this.born = G.timeW;
  }

  update(dt, t) {
    const P = G.player;
    const dx = P.x - this.x, dy = P.y - this.y, d = Math.hypot(dx, dy) || 1;
    const slowed = this.slowUntil > t;
    let sp = this.speed * (slowed ? (G.run.up.frost >= 2 ? 0.45 : 0.6) : 1);
    let mx = dx / d, my = dy / d;
    if (this.type === 'wisp') {
      const s = Math.sin(t * 4.2 + this.phase) * 0.75;
      const nx = -my, ny = mx;
      mx += nx * s; my += ny * s;
    } else if (this.type === 'spitter') {
      if (d < 230) {
        const side = Math.sin(this.phase) > 0 ? 1 : -1;
        const tx = -my * side, ty = mx * side;
        mx = -mx * 0.35 + tx * 0.9;
        my = -my * 0.35 + ty * 0.9;
      }
      this.tm -= dt;
      if (this.tm <= 0 && d < 430) {
        this.tm = rnd(2.3, 3.0);
        const sp2 = 130;
        G.shots.push({ x: this.x + mx * this.r, y: this.y + my * this.r, vx: (dx / d) * sp2, vy: (dy / d) * sp2, r: 6, life: 5 });
        if (!G.attract) Sfx.spit();
      }
    } else if (this.type === 'lancer') {
      if (this.state === 'walk') {
        if (d < 290) this.tm -= dt;
        if (this.tm <= 0) {
          this.state = 'aim';
          this.tm = 0.9;
          if (!G.attract) Sfx.lancer();
        }
      } else if (this.state === 'aim') {
        sp = 0;
        if (this.tm > 0.25) { this.lx = dx / d; this.ly = dy / d; }
        this.tm -= dt;
        if (this.tm <= 0) { this.state = 'dash'; this.tm = 0.45; }
      } else {
        mx = this.lx; my = this.ly;
        sp = 380 * (slowed ? 0.6 : 1);
        this.tm -= dt;
        if (this.tm <= 0) { this.state = 'walk'; this.tm = rnd(2.2, 3.2); }
      }
    }
    const ml = Math.hypot(mx, my) || 1;
    mx /= ml; my /= ml;
    this.x += (mx * sp + this.kx) * dt;
    this.y += (my * sp + this.ky) * dt;
    const k = Math.exp(-7 * dt);
    this.kx *= k;
    this.ky *= k;
    if (sp > 1) {
      const want = this.state === 'dash' || this.state === 'aim' ? Math.atan2(this.ly, this.lx) : Math.atan2(my, mx);
      this.ang += angDiff(this.ang, want) * Math.min(1, dt * 8);
    } else if (this.state === 'aim') this.ang += angDiff(this.ang, Math.atan2(this.ly, this.lx)) * Math.min(1, dt * 10);
    this.flash = Math.max(0, this.flash - dt * 9);
  }
}

const BOSS_NAMES = ['The Eclipse', 'The Umbra', 'The Penumbra'];

class Eclipse {
  constructor(n) {
    this.n = n;
    this.boss = true;
    this.type = 'boss';
    this.r = 42;
    this.mass = 40;
    const scale = (1 + 0.8 * (n - 1)) * (1 + G.run.time / 600);
    this.maxHp = this.hp = 900 * scale;
    this.life = 0;
    const a = Math.random() * TAU, R0 = viewRadius() + 70;
    this.x = G.player.x + Math.cos(a) * R0;
    this.y = G.player.y + Math.sin(a) * R0;
    this.speed = 32 + 4 * n;
    this.kx = 0; this.ky = 0;
    this.flash = 0;
    this.hitCD = 0;
    this.burnCD = 0;
    this.slowUntil = 0;
    this.spin = 0;
    this.tm = 2.5;
    this.pat = 0;
    this.state = 'walk';
    this.lx = 0; this.ly = 0;
    this.moons = [];
    this.moonT = 0;
    this.mhit = {};
    this.name = BOSS_NAMES[(n - 1) % BOSS_NAMES.length] + (n > 3 ? ' ' + n : '');
    this.dead = false;
  }

  update(dt, t) {
    const P = G.player;
    const dx = P.x - this.x, dy = P.y - this.y, d = Math.hypot(dx, dy) || 1;
    this.spin += dt * 0.6;
    this.flash = Math.max(0, this.flash - dt * 6);
    let sp = this.speed * (this.slowUntil > t ? 0.75 : 1), mx = dx / d, my = dy / d;
    if (this.state === 'aim') {
      sp = 0;
      if (this.tm > 0.3) { this.lx = mx; this.ly = my; }
    } else if (this.state === 'charge') {
      mx = this.lx; my = this.ly; sp = 330;
    }
    this.x += (mx * sp + this.kx) * dt;
    this.y += (my * sp + this.ky) * dt;
    this.kx *= Math.exp(-5 * dt);
    this.ky *= Math.exp(-5 * dt);
    this.tm -= dt;
    if (this.tm <= 0) {
      if (this.state === 'aim') { this.state = 'charge'; this.tm = 0.75; }
      else if (this.state === 'charge') { this.state = 'walk'; this.tm = 1.6; }
      else this.attack();
    }
    if (this.moonT > 0) {
      this.moonT -= dt;
      if (this.moonT <= 0) this.moons = [];
    }
    for (let i = 0; i < this.moons.length; i++) {
      const m = this.moons[i];
      const a = this.spin * 2.2 + (i * TAU) / this.moons.length;
      m.x = this.x + Math.cos(a) * 82;
      m.y = this.y + Math.sin(a) * 82;
    }
  }

  attack() {
    const pats = ['burst', 'summon', 'charge', 'moons', 'burst', 'charge'];
    const p = pats[this.pat++ % pats.length];
    const P = G.player;
    if (p === 'burst') {
      const n = 14 + 2 * this.n, a0 = Math.random() * TAU;
      for (let i = 0; i < n; i++) {
        const a = a0 + (i * TAU) / n;
        G.shots.push({ x: this.x + Math.cos(a) * this.r, y: this.y + Math.sin(a) * this.r, vx: Math.cos(a) * 115, vy: Math.sin(a) * 115, r: 7, life: 6 });
      }
      Sfx.spit();
      FX.ring(this.x, this.y, this.r, this.r + 60, 0.4, PAL.danger, 4);
      this.tm = 2.6;
    } else if (p === 'summon') {
      for (let i = 0; i < 6 + this.n; i++) {
        const a = (i * TAU) / (6 + this.n);
        if (G.enemies.length < 320) G.enemies.push(new Enemy('mite', this.x + Math.cos(a) * 70, this.y + Math.sin(a) * 70, { hpScale: Game.hpScale() }));
      }
      FX.ring(this.x, this.y, 20, 110, 0.5, PAL.danger, 3);
      this.tm = 2.4;
    } else if (p === 'charge') {
      this.state = 'aim';
      this.tm = 1.0;
      this.lx = (P.x - this.x) / (Math.hypot(P.x - this.x, P.y - this.y) || 1);
      this.ly = (P.y - this.y) / (Math.hypot(P.x - this.x, P.y - this.y) || 1);
      Sfx.lancer();
    } else {
      this.moons = [];
      for (let i = 0; i < 3 + this.n; i++) this.moons.push({ x: this.x, y: this.y, r: 11 });
      this.moonT = 8;
      this.tm = 2.6;
    }
  }
}

  timeR: 0, timeW: 0, songT: 0, focusY: 0, ws: 1, hitstop: 0, slow: null, slowAmt: 0, deathT: 0, vacuumT: 0,

  dust_s: { name: 'Stardust Cache', desc: '25 extra stardust when the run ends.', rarity: 'common', max: 99 },
};
function upInfo(k) { return UPGRADES[k] || FILLERS[k]; }

function xpNeed(L) { return Math.floor(3 + 3.5 * (L - 1) + 0.62 * Math.pow(L - 1, 1.85)); }

function startSlow(scale, dur) { G.slow = { start: G.timeR, end: G.timeR + dur, scale }; }
function slowScale() {
  if (!G.slow) return 1;
  const now = G.timeR;
  if (now >= G.slow.end) { G.slow = null; return 1; }
  const k = Math.min(1, (now - G.slow.start) / 0.05, (G.slow.end - now) / 0.3);
  return lerp(1, G.slow.scale, easeOutCubic(sat(k)));
}

const Game = {

    const st = STARS[G.run.star];
    G.player = { x: 0, y: 0, vx: 0, vy: 0, r: 13 * (st.size > 1 ? 1.1 : 1), alive: true, inv: 0, stillT: 1, wideK: 1, a1: 0, a2: 0, novaT: 0, hurt: 0 };
    G.cam.x = 0; G.cam.y = 0;
    G.state = G.attract ? 'title' : 'play';
