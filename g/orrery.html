      box.querySelector('.boss-name').textContent = b.name;
    }
    const w = Math.round(Math.max(0, b.hp / b.maxHp) * 200) / 2;
    if (this.cache.boss !== w) { this.cache.boss = w; box.querySelector('i').style.width = w + '%'; }
  },

  banner(main, sub, color) {
    const b = this.e.banner;
    b.querySelector('.b-main').textContent = main;
    b.querySelector('.b-sub').textContent = sub || '';
    b.style.color = color || PAL.sun;
    b.classList.remove('on');
    void b.offsetWidth;
    b.classList.add('on');
  },

  hint(text, dur) {
    const h = this.e.hint;
    h.querySelector('.hint-text').textContent = text;
    h.classList.add('on');
    clearTimeout(this.hintTimer);
    if (dur) this.hintTimer = setTimeout(() => this.hideHint(), dur * 1000);
  },

  hideHint() {
    clearTimeout(this.hintTimer);
    this.e.hint.classList.remove('on');
  },

  toast(text, kind) {
    const t = el('div', 'toast' + (kind ? ' ' + kind : ''));
    t.textContent = text;
    const box = this.e.toasts;
    box.appendChild(t);
    while (box.children.length > 3) box.removeChild(box.firstChild);
    setTimeout(() => t.remove(), 2600);
  },

  joy(on, x, y, dx, dy) {
    const j = this.e.joy;
    if (!on) { j.classList.remove('on'); return; }
    j.classList.add('on');
    j.style.transform = 'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px)';
    this.e['j-knob'].style.transform = 'translate(' + dx.toFixed(1) + 'px,' + dy.toFixed(1) + 'px)';
  },

  // ---------------------------------------------------------- level-up cards
  showLevelUp(cards) {
    const R = G.run, E = this.e;
    this.hideHint();
    Input.release();
    E['lv-n'].textContent = R.level - R.pending;
    const box = E['lv-cards'];
    box.innerHTML = '';
    this.lvCards = cards;
    cards.forEach((k, i) => box.appendChild(this.card(k, i)));
    E['b-reroll'].hidden = R.rerolls <= 0;
    E['b-reroll'].textContent = 'Reroll · ' + R.rerolls + ' left';
    this.show('levelup');
    E.levelup.classList.add('locked');
    this.lvLockUntil = performance.now() + 380;
    clearTimeout(this.lvTimer);
    this.lvTimer = setTimeout(() => E.levelup.classList.remove('locked'), 380);
  },

  card(k, i) {
    const R = G.run, u = upInfo(k), lvl = R.up[k] || 0, real = !!UPGRADES[k];
    const b = el('button', 'card ' + u.rarity);
    b.type = 'button';
    let pips = '';
    if (real && u.max > 1) for (let j = 0; j < u.max; j++) pips += '<i class="' + (j < lvl ? 'on' : j === lvl ? 'nx' : '') + '"></i>';
    const tag = u.rarity === 'legendary' ? '<span class="c-tag evo">Evolution</span>' : real && lvl === 0 ? '<span class="c-tag">New</span>' : '';
    b.innerHTML = '<span class="c-ic">' + icon(k) + '</span><span class="c-body"><span class="c-name"></span><span class="c-desc"></span>' +
      (pips ? '<span class="pips">' + pips + '</span>' : '') + (u.needs ? '<span class="c-recipe"></span>' : '') + '</span>' + tag + '<span class="c-key">' + (i + 1) + '</span>';
    b.querySelector('.c-name').textContent = u.name;
    b.querySelector('.c-desc').textContent = u.desc;
    if (u.needs) b.querySelector('.c-recipe').textContent = recipeText(k);
    b.addEventListener('click', (ev) => { ev.preventDefault(); this.pickCard(i); });
    return b;
  },

  pickCard(i) {
    if (G.state !== 'levelup' || performance.now() < this.lvLockUntil) return;
    const k = this.lvCards[i];
    if (k) Game.choose(k);
  },

  hideLevelUp() { this.hide('levelup'); },

  // ---------------------------------------------------------- chests
  showChest(items, done) {
    const E = this.e;
    this.hideHint();
    Input.release();
    const box = E['chest-items'];
    box.innerHTML = '';
    const lv = Object.assign({}, G.run.up);
    const slots = items.map((k) => {
      const s = el('div', 'slot');
      s.innerHTML = '<span class="s-ic"></span><span class="s-name"></span>';
      box.appendChild(s);
      if (UPGRADES[k]) lv[k] = (lv[k] || 0) + 1;
      return { k, node: s, lvl: lv[k] || 0, landed: false, fake: null };
    });
    box.className = 'chest-items n' + items.length;
    this.chestState = { done, slots, t0: performance.now(), opened: false, finished: false };
    E['chest-head'].textContent = '';
    E['b-collect'].hidden = true;
    E.chest.classList.remove('open', 'shaking', 'n1', 'n3', 'n5');
    this.show('chest');
    void E.chest.offsetWidth;
    E.chest.classList.add('shaking');
    requestAnimationFrame(() => this.chestTick());
  },

  openChestNow() {
    const C = this.chestState, E = this.e, n = C.slots.length;
    if (C.opened) return;
    C.opened = true;
    C.openAt = performance.now();
    E.chest.classList.remove('shaking');
    E.chest.classList.add('open', 'n' + (n >= 5 ? 5 : n >= 3 ? 3 : 1));
    E['chest-head'].textContent = n >= 5 ? 'Jackpot · five treasures' : n >= 3 ? 'Three treasures' : 'Treasure';
    Sfx.chest(n);
    vibrate(25);
  },

  chestTick() {
    const C = this.chestState;
    if (!C || C.finished) return;
    const t = (performance.now() - C.t0) / 1000, n = C.slots.length;
    if (!C.opened && t > 0.75) this.openChestNow();
    if (C.opened) {
      const ts = (performance.now() - C.openAt) / 1000;
      const pool = Object.keys(UPGRADES).filter((k) => !UPGRADES[k].needs);
      C.slots.forEach((s, i) => {
        if (s.landed) return;
        if (ts >= 0.35 + i * (n >= 5 ? 0.3 : 0.42)) this.landSlot(s, i);
        else {
          const fake = pool[(Math.floor(ts * 16) + i * 5) % pool.length];
          if (s.fake !== fake) {
            s.fake = fake;
            s.node.querySelector('.s-ic').innerHTML = icon(fake);
            s.node.classList.add('spin');
          }
        }
      });
      if (C.slots.every((s) => s.landed)) { this.finishChest(); return; }
    }
    requestAnimationFrame(() => this.chestTick());
  },

  landSlot(s, i) {
    s.landed = true;
    const u = upInfo(s.k);
    s.node.className = 'slot landed ' + u.rarity;
    s.node.querySelector('.s-ic').innerHTML = icon(s.k);
    s.node.querySelector('.s-name').textContent = u.name + (UPGRADES[s.k] && u.max > 1 ? ' ' + roman(s.lvl) : '');
    Sfx.tick(i);
  },

  finishChest() {
    const C = this.chestState;
    C.finished = true;
    const rar = (r) => C.slots.some((s) => upInfo(s.k).rarity === r);
    Sfx.card(rar('legendary') ? 'legendary' : rar('rare') ? 'rare' : 'common');
    C.readyAt = performance.now();
    this.e['b-collect'].hidden = false;
  },

  skipChest() {
    const C = this.chestState;
    if (!C || performance.now() - C.t0 < 250) return;
    if (C.finished) { if (performance.now() - C.readyAt > 300) this.collectChest(); return; }
    this.openChestNow();
    C.slots.forEach((s, i) => { if (!s.landed) this.landSlot(s, i); });
    this.finishChest();
  },

  collectChest() {
    const C = this.chestState;
    if (!C || !C.finished) return;
    this.chestState = null;
    Sfx.ui();
    this.hide('chest');
    C.done();
  },

  // ---------------------------------------------------------- run over
  showOver(res) {
    const { R, earned, prev, isBest, freshStars } = res;
    const E = this.e, S = Save.data;
    this.hide('hud');
    this.hide('levelup');
    this.hide('chest');
    this.e['b-nova'].hidden = true;
    this.bossBar(null);
    this.hideHint();
    E['o-head'].textContent = isBest ? 'New record' : 'Your star collapsed';
    E['o-head'].classList.toggle('best', isBest);
    E['o-time'].textContent = fmtClock(R.time);
    let near;
    if (isBest && prev.time > 0) near = 'Beat your best by ' + fmtGap(R.time - prev.time);
    else if (isBest) near = 'Your first record. Now beat it.';
    else {
      const gap = prev.time - R.time;
      near = gap < 30 ? 'Just ' + fmtGap(gap) + ' short of your best' : 'Your best is ' + fmtClock(prev.time);
    }
    E['o-near'].textContent = near;
    E['o-near'].classList.toggle('hot', isBest || prev.time - R.time < 30);
    E['o-kills'].textContent = fmtNum(R.kills);
    E['o-level'].textContent = R.level;
    E['o-bosses'].textContent = R.bosses;
    E['o-chests'].textContent = R.chests;
    this.renderBuild(E['o-build']);
    const parts = [];
    if (R.kills) parts.push('Kills ' + fmtNum(R.kills / 6));
    parts.push('Time ' + fmtNum(R.time / 3));
    if (R.level > 1) parts.push('Levels ' + fmtNum((R.level - 1) * 4));
    if (R.bosses) parts.push('Bosses ' + fmtNum(R.bosses * 60));
    if (shopLevel('greed')) parts.push('Greed +' + shopLevel('greed') * 10 + '%');
    E['o-breakdown'].textContent = parts.join(' · ');
    E['o-dust'].textContent = '+' + fmtNum(earned);
    E['o-bank'].textContent = 'Total ' + fmtNum(S.dust);
    const un = E['o-unlock'];
    if (freshStars && freshStars.length) {
      const id = freshStars[0], st = STARS[id];
      un.hidden = false;
      un.innerHTML = '<img alt=""><div class="u-txt"><div class="u-title">New star unlocked</div><div class="u-what"></div><div class="u-desc"></div></div><button class="chip" type="button">Use it</button>';
      un.querySelector('img').src = ASSET_DATA.stars[id];
      un.querySelector('.u-what').textContent = st.name;
      un.querySelector('.u-desc').textContent = st.desc;
      const chip = un.querySelector('.chip');
      chip.addEventListener('click', () => {
        S.star = id;
        Save.persist();
        chip.textContent = 'Selected';
        chip.disabled = true;
        Sfx.card('rare');
      });
    } else un.hidden = true;
    this.renderNext(E['o-next']);
    this.show('over');
    this.guardUntil = performance.now() + 650;
    if (isBest) setTimeout(() => Sfx.best(), 350);
  },

  renderNext(box) {
    const S = Save.data;
    let best = null;
    for (const id of SHOP_ORDER) {
      const it = SHOP[id], lv = shopLevel(id);
      if (lv >= it.costs.length) continue;
      const cost = it.costs[lv];
      if (!best || cost < best.cost) best = { id, cost, lv };
    }
    box.innerHTML = '';
    if (!best) { box.hidden = true; return; }
    box.hidden = false;
    const it = SHOP[best.id], can = S.dust >= best.cost;
    box.classList.toggle('ready', can);
    box.innerHTML = '<div class="n-txt"><span class="u-label"></span><b></b><span class="n-desc"></span>' + (can ? '' : '<div class="bar"><i></i></div>') + '</div><button class="chip" type="button"></button>';
    box.querySelector('.u-label').textContent = can ? 'Ready in the Observatory' : 'Next in the Observatory';
    box.querySelector('b').textContent = it.name + (it.costs.length > 1 ? ' ' + roman(best.lv + 1) : '');
    box.querySelector('.n-desc').textContent = it.desc;
    const chip = box.querySelector('.chip');
    chip.innerHTML = '<span class="dust-ico"></span>' + fmtNum(best.cost);
    chip.disabled = !can;
    if (!can) box.querySelector('.bar i').style.width = Math.min(100, (100 * S.dust) / best.cost).toFixed(1) + '%';
    chip.addEventListener('click', () => {
      if (!this.buy(best.id)) return;
      Sfx.chest(1);
      this.toast(it.name + ' upgraded');
      this.e['o-bank'].textContent = 'Total ' + fmtNum(S.dust);
      this.renderNext(box);
    });
  },

  buy(id) {
    const S = Save.data, it = SHOP[id], lv = shopLevel(id);
    if (lv >= it.costs.length) return false;
    const cost = it.costs[lv];
    if (S.dust < cost) return false;
    S.dust -= cost;
    S.shop[id] = lv + 1;
    Save.persist();
    return true;
  },

  canAffordAny() {
    const S = Save.data;
    return SHOP_ORDER.some((id) => {
      const it = SHOP[id], lv = shopLevel(id);
      return lv < it.costs.length && S.dust >= it.costs[lv];
    });
  },

  renderBuild(box) {
    const R = G.run;
    box.innerHTML = '';
    const keys = R ? Object.keys(R.up).filter((k) => R.up[k] > 0 && UPGRADES[k]) : [];
    for (const k of keys) {
      const u = UPGRADES[k], c = el('span', 'bchip ' + u.rarity);
      c.innerHTML = icon(k) + '<span></span>';
      c.lastChild.textContent = u.max > 1 ? roman(R.up[k]) : '';
      c.title = u.name;
      box.appendChild(c);
    }
    box.hidden = !keys.length;
  },

  // ---------------------------------------------------------- title
  buildStars() {
    const box = this.e['t-stars'];
    box.innerHTML = '';
    for (const id of STAR_ORDER) {
      const b = el('button', 'star-btn');
      b.type = 'button';
      b.dataset.id = id;
      b.setAttribute('role', 'radio');
      b.innerHTML = '<span class="s-disc"><img alt=""><span class="s-lock">' + LOCK_SVG + '</span></span><span class="s-name"></span>';
      b.querySelector('img').src = ASSET_DATA.stars[id];
      b.querySelector('.s-name').textContent = STARS[id].name;
      b.style.setProperty('--glow', STARS[id].glow);
      b.addEventListener('click', () => { Sound.ensure(); this.pickStar(id); });
      box.appendChild(b);
    }
  },

  pickStar(id) {
    const S = Save.data, st = STARS[id];
    if (!S.stars[id]) {
      this.toast(st.name + ': ' + st.unlock.label + ' (' + unlockProgress(st.unlock) + ')', 'lock');
      Sfx.ui();
      return;
    }
    if (S.star === id) return;
    S.star = id;
    Save.persist();
    Sfx.card('common');
    this.refreshTitle();
  },

  refreshTitle() {
    const S = Save.data, E = this.e;
    if (!E['t-stars']) return;
    for (const b of E['t-stars'].children) {
      const id = b.dataset.id;
      b.classList.toggle('locked', !S.stars[id]);
      b.setAttribute('aria-checked', String(S.star === id));
      b.setAttribute('aria-label', STARS[id].name + (S.stars[id] ? '' : ' (locked)'));
    }
    E['t-star-desc'].textContent = STARS[S.star].desc;
    // the next locked star is always in view, with how close it is
    const next = STAR_ORDER.find((id) => !S.stars[id]);
    E['t-next'].hidden = !next;
    if (next) {
      const u = STARS[next].unlock;
      E['t-next'].innerHTML = '<span class="lock-ic">' + LOCK_SVG + '</span><b></b><span></span>';
      E['t-next'].querySelector('b').textContent = STARS[next].name + ':';
      E['t-next'].querySelector('span:last-child').textContent = ' ' + u.label.toLowerCase() + ' (' + unlockProgress(u) + ')';
    }
    E['play-sub'].textContent = S.best.time > 0 ? 'Best ' + fmtClock(S.best.time) + ' · ' + fmtNum(S.best.kills) + ' destroyed' : 'Survive as long as you can';
    E['t-dust'].innerHTML = '<span class="dust-ico"></span>' + fmtNum(S.dust);
    E['b-shop'].classList.toggle('alert', this.canAffordAny());
  },

  // ---------------------------------------------------------- sheets
  openSheet(kind) {
    const E = this.e;
    this.sheetKind = kind;
    this.resetArmed = false;
    E.sheet.hidden = false;
    const titles = { shop: 'Observatory', records: 'Records', help: 'How to play', settings: 'Settings' };
    E['sheet-title'].textContent = titles[kind];
    const body = E['sheet-body'];
    body.innerHTML = '';
    if (kind === 'shop') this.renderShop(body);
    else if (kind === 'records') this.renderRecords(body);
    else if (kind === 'help') this.renderHelp(body);
    else this.renderSettings(body);
    setTimeout(() => E['sheet-close'].focus({ preventScroll: true }), 30);
  },

  closeSheet() {
    if (!this.e.sheet || this.e.sheet.hidden) return;
    this.e.sheet.hidden = true;
    this.sheetKind = null;
    this.refreshTitle();
  },

  renderShop(body) {
    const S = Save.data;
    const head = el('div', 'bank');
    head.innerHTML = '<span class="dust-ico big"></span><b class="num"></b><span>stardust</span>';
    head.querySelector('b').textContent = fmtNum(S.dust);
    body.appendChild(head);
    const list = el('div', 'shop');
    for (const id of SHOP_ORDER) {
      const it = SHOP[id], lv = shopLevel(id), max = it.costs.length;
      const row = el('div', 'shop-row' + (lv >= max ? ' maxed' : ''));
      let pips = '';
      for (let j = 0; j < max; j++) pips += '<i class="' + (j < lv ? 'on' : '') + '"></i>';
      row.innerHTML = '<div class="sr-txt"><b></b><span class="sr-desc"></span><span class="pips">' + pips + '</span></div><button class="chip" type="button"></button>';
      row.querySelector('b').textContent = it.name;
      row.querySelector('.sr-desc').textContent = it.desc;
      const chip = row.querySelector('.chip');
      if (lv >= max) { chip.textContent = 'Max'; chip.disabled = true; }
      else {
        chip.innerHTML = '<span class="dust-ico"></span>' + fmtNum(it.costs[lv]);
        chip.disabled = S.dust < it.costs[lv];
      }
      chip.addEventListener('click', () => {
        if (!this.buy(id)) return;
        Sfx.chest(1);
        body.innerHTML = '';
        this.renderShop(body);
      });
      list.appendChild(row);
    }
    body.appendChild(list);
    body.appendChild(el('p', 'note', 'Every run earns stardust: for creatures destroyed, time survived, levels reached and bosses defeated.'));
  },

  renderRecords(body) {
    const S = Save.data, st = S.stats;
    const kv = (items) => {
      const d = el('dl', 'kv');
      for (const [k, v] of items) {
        const div = el('div');
        div.innerHTML = '<dt></dt><dd></dd>';
        div.firstChild.textContent = k;
        div.lastChild.textContent = v;
        d.appendChild(div);
      }
      return d;
    };
    body.appendChild(el('p', 'label sec', 'Bests'));
    body.appendChild(kv([['Survived', fmtClock(S.best.time)], ['Destroyed', fmtNum(S.best.kills)], ['Level', S.best.level]]));
    body.appendChild(el('p', 'label sec', 'All time'));
    body.appendChild(kv([['Runs', fmtNum(st.runs)], ['Destroyed', fmtNum(st.kills)], ['Played', fmtHours(st.time)], ['Bosses', fmtNum(st.bosses)], ['Chests', fmtNum(st.chests)], ['Evolutions', fmtNum(st.evolutions)]]));
    body.appendChild(el('p', 'label sec', 'Top runs'));
    if (!S.top.length) { body.appendChild(el('p', 'note', 'No runs yet.')); return; }
    const tb = el('table', 'records');
    tb.innerHTML = '<thead><tr><th>Time</th><th>Destroyed</th><th>Level</th><th>Star</th><th>Date</th></tr></thead>';
    const tbody = el('tbody');
    for (const r of S.top) {
      const tr = el('tr');
      for (const v of [fmtClock(r.time), fmtNum(r.kills), r.level, (STARS[r.star] || STARS.sol).name, fmtDate(r.date)]) {
        const td = el('td');
        td.textContent = v;
        tr.appendChild(td);
      }
      tbody.appendChild(tr);
    }
    tb.appendChild(tbody);
    body.appendChild(tb);
  },

  renderHelp(body) {
    const move = isTouchDevice ? 'Drag anywhere' : 'Use WASD, the arrow keys, or drag with the mouse';
    const nova = isTouchDevice ? 'tap NOVA' : 'press Space';
    body.innerHTML = '<ol class="help">' +
      '<li><b>' + move + '</b> to move your star. Your moons orbit it and smash whatever they touch.</li>' +
      '<li><b>Stand still</b> and the orbit swings wide and spins faster. Move again to pull it in tight.</li>' +
      '<li>Destroyed creatures drop <b>stardust</b>. Fill the bar to level up and choose an upgrade.</li>' +
      '<li>Max out the right pairs of upgrades to unlock an <b>Evolution</b>.</li>' +
      '<li>Kills charge <b>Supernova</b>: ' + nova + ' to fling your moons outward and turn invulnerable for a moment.</li>' +
      '<li>Golden elites drop <b>chests</b> holding one, three or five upgrades. A boss arrives every two minutes.</li>' +
      '<li>Spend stardust in the <b>Observatory</b> on permanent upgrades, and unlock new stars as you go.</li>' +
      '</ol>';
    body.appendChild(el('p', 'label sec', 'Evolutions'));
    const list = el('div', 'evos');
    for (const k of ['binary', 'tesla', 'meteor']) {
      const r = el('div', 'evo');
      r.innerHTML = icon(k) + '<div><b></b><span></span></div>';
      r.querySelector('b').textContent = UPGRADES[k].name;
      r.querySelector('span').textContent = recipeText(k);
      list.appendChild(r);
    }
    body.appendChild(list);
  },

  renderSettings(body) {
    const box = el('div', 'toggles');
    this.renderToggles(box, ['sound', 'music', 'shake', 'flashes', 'haptics', 'numbers']);
    body.appendChild(box);
    const reset = el('button', 'btn ghost danger-btn', 'Reset all progress');
    reset.type = 'button';
    reset.addEventListener('click', () => {
      if (!this.resetArmed) { this.resetArmed = true; reset.textContent = 'Tap again to erase everything'; return; }
      const settings = Save.data.settings;
      Save.data = defaultSave();
      Save.data.settings = settings;
      Save.sanitize();
      Save.persist();
      reset.textContent = 'Progress erased';
      this.resetArmed = false;
    });
    body.appendChild(reset);
    body.appendChild(el('p', 'note', Save.cloud.ready ? 'Progress saves to your account and follows you across devices.' : 'Progress saves in this browser.'));
  },

  renderToggles(box, keys) {
    const labels = { sound: 'Sound', music: 'Music', shake: 'Screen shake', flashes: 'Flashes', haptics: 'Vibration', numbers: 'Damage numbers' };
    box.innerHTML = '';
    for (const k of keys) {
      const b = el('button', 'switch');
      b.type = 'button';
      b.setAttribute('role', 'switch');
      b.setAttribute('aria-checked', String(!!Save.data.settings[k]));
      b.innerHTML = '<span></span><span class="knob"></span>';
      b.firstChild.textContent = labels[k];
      b.addEventListener('click', () => {
        Save.data.settings[k] = !Save.data.settings[k];
        b.setAttribute('aria-checked', String(Save.data.settings[k]));
        Sound.ensure();
        Sound.applySettings();
        Save.persist();
        Sfx.ui();
      });
      box.appendChild(b);
    }
  },
};

// ---------------------------------------------------------------- input.js
// A floating joystick: press anywhere, drag to steer. Lift the finger to stand still.
const MOVE_KEYS = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'KeyW', 'KeyA', 'KeyS', 'KeyD'];

const Input = {
  id: null, ox: 0, oy: 0, R: 54, keys: new Set(),

  init(stage) {
    this.stage = stage;
    stage.addEventListener('pointerdown', (e) => this.down(e));
    window.addEventListener('pointermove', (e) => this.move(e));
    window.addEventListener('pointerup', (e) => this.up(e));
    window.addEventListener('pointercancel', (e) => this.up(e));
    window.addEventListener('keydown', (e) => this.key(e, true));
    window.addEventListener('keyup', (e) => this.key(e, false));
    window.addEventListener('blur', () => { this.keys.clear(); this.release(); });
    stage.addEventListener('contextmenu', (e) => e.preventDefault());
  },

  down(e) {
    Sound.ensure();
    if (G.state !== 'play' || this.id !== null) return;
    if (e.button > 0) return;
    e.preventDefault();
    this.id = e.pointerId;
    this.ox = e.clientX;
    this.oy = e.clientY;
    try { this.stage.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    this.set(0, 0);
  },

  move(e) {
    if (e.pointerId !== this.id || G.state !== 'play') return;
    let dx = e.clientX - this.ox, dy = e.clientY - this.oy;
    const d = Math.hypot(dx, dy), R = this.R;
    if (d > R) {
      // the base follows the finger so steering never runs out of room
      const k = (d - R) / d;
      this.ox += dx * k;
      this.oy += dy * k;
      dx = e.clientX - this.ox;
      dy = e.clientY - this.oy;
    }
    this.set(dx, dy);
  },

  set(dx, dy) {
    const d = Math.hypot(dx, dy), dead = 5;
    if (d < dead) { G.input.x = 0; G.input.y = 0; }
    else {
      const m = Math.min(1, (d - dead) / (this.R * 0.45));
      G.input.x = (dx / d) * m;
      G.input.y = (dy / d) * m;
    }
    UI.joy(true, this.ox, this.oy, dx, dy);
  },

  up(e) {
    if (e.pointerId !== this.id) return;
    this.release();
  },

  release() {
    this.id = null;
    G.input.x = 0;
    G.input.y = 0;
    UI.joy(false);
  },

  // keys steer whenever no finger is down
  poll() {
    if (this.id !== null || G.state !== 'play') return;
    const K = this.keys;
    const x = (K.has('ArrowRight') || K.has('KeyD') ? 1 : 0) - (K.has('ArrowLeft') || K.has('KeyA') ? 1 : 0);
    const y = (K.has('ArrowDown') || K.has('KeyS') ? 1 : 0) - (K.has('ArrowUp') || K.has('KeyW') ? 1 : 0);
    const d = Math.hypot(x, y) || 1;
    G.input.x = x / d;
    G.input.y = y / d;
  },

  key(e, down) {
    const c = e.code;
    if (MOVE_KEYS.includes(c)) {
      if (down) this.keys.add(c); else this.keys.delete(c);
      if (c.startsWith('Arrow') && G.state === 'play') e.preventDefault();
      return;
    }
    if (!down || e.repeat) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    Sound.ensure();
    if (UI.sheetKind) { if (c === 'Escape') UI.closeSheet(); return; }
    const st = G.state;
    if (st === 'play') {
      if (c === 'Space' || c === 'KeyE' || c === 'KeyQ') { e.preventDefault(); Game.nova(); }
      else if (c === 'Escape' || c === 'KeyP') UI.pause();
    } else if (st === 'paused') {
      if (c === 'Escape' || c === 'KeyP') UI.resume();
    } else if (st === 'levelup') {
      const i = ['Digit1', 'Digit2', 'Digit3'].indexOf(c), j = ['Numpad1', 'Numpad2', 'Numpad3'].indexOf(c);
      if (i >= 0 || j >= 0) UI.pickCard(Math.max(i, j));
      else if (c === 'KeyR') Game.reroll();
    } else if (st === 'chest') {
      if (c === 'Enter' || c === 'Space') { e.preventDefault(); UI.skipChest(); }
    } else if (st === 'over') {
      if (performance.now() < UI.guardUntil) return;
      if (c === 'Enter' || c === 'Space' || c === 'KeyR') { e.preventDefault(); UI.retry(); }
      else if (c === 'Escape') UI.toMenu();
    } else if (st === 'title') {
      if (c === 'Enter') { e.preventDefault(); UI.play(); }
    }
  },
};

// ---------------------------------------------------------------- main.js
const Quality = {
  level: 0, acc: 0, n: 0, lastChange: 0,
  dprCap() { return [2, 1.6, 1.25, 1][this.level]; },
  track(dt) {
    if (G.state !== 'play' && G.state !== 'title') { this.acc = 0; this.n = 0; return; }
    this.acc += dt;
    this.n++;
    if (this.n < 90) return;
    const avg = this.acc / this.n;
    this.acc = 0;
    this.n = 0;
    const now = performance.now();
    if (avg > 0.024 && this.level < 3 && now - this.lastChange > 3000) {
      this.level++;
      this.lastChange = now;
      if (this.level >= 2) Post.p.lite = true;
      App.resize();
    }
  },
};

const App = {
  last: 0,

  boot() {
    Save.load();
    FX.init();
    this.glCanvas = document.getElementById('gl');
    this.scene = document.getElementById('scene');
    const ok = Post.init(this.glCanvas);
    if (ok) this.scene.style.display = 'none';
    else this.glCanvas.style.display = 'none';
    Render.init(this.scene);
    UI.init();
    Input.init(document.getElementById('stage'));
    this.resize();
    window.addEventListener('resize', () => this.resize());
    window.addEventListener('orientationchange', () => setTimeout(() => this.resize(), 120));
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        if (G.state === 'play') UI.pause();
        if (Sound.ac) Sound.ac.suspend().catch(() => {});
      } else if (Sound.ac) Sound.ac.resume().catch(() => {});
    });
    Assets.load().then(() => {
      Game.start('attract');
      this.measureFocus();
      document.getElementById('app').classList.add('ready');
    });
    requestAnimationFrame((t) => this.frame(t));
    Save.cloudInit();
    try { if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({ v: 1 })); } catch (e) { /* ignore */ }
  },

  resize() {
    const app = document.getElementById('app');
    const cw = Math.max(1, app.clientWidth), ch = Math.max(1, app.clientHeight);
    // the short side of the screen always shows the same stretch of space
    const SHORT = clamp(Math.min(cw, ch) * 0.7, 500, 640);
    const css = Math.min(cw, ch) / SHORT;
    const dpr = Math.min(window.devicePixelRatio || 1, Quality.dprCap());
    G.css = css;
    G.W = cw / css;
    G.H = ch / css;
    const pw = Math.round(cw * dpr), ph = Math.round(ch * dpr);
    for (const c of [this.glCanvas, this.scene]) {
      if (c.width !== pw) c.width = pw;
      if (c.height !== ph) c.height = ph;
    }
    G.pxW = pw;
    G.pxH = ph;
    G.s = css * dpr;
    if (Post.ok) Post.resize(pw, ph);
    this.measureFocus();
    UI.measureHud();
  },

  // the open band of sky between the logo and the menu on the title screen
  measureFocus() {
    const t = document.getElementById('title'), mid = t && t.querySelector('.title-mid');
    if (!mid || t.hidden) return;
    const r = mid.getBoundingClientRect();
    if (r.height > 0) G.focusY = clamp((r.top + r.height * 0.5) / G.css, 110, G.H - 90);
  },

  frame(now) {
    requestAnimationFrame((t) => this.frame(t));
    const dt = this.last ? Math.min(0.05, Math.max(0, (now - this.last) / 1000)) : 0.016;
    this.last = now;
    try {
      Input.poll();
      Game.update(dt);
      Render.draw();
      if (Post.ok && !Post.lost) {
        const P = Post.p;
        P.ca = Math.min(2, FX.ca * 0.8 + G.slowAmt * 0.3);
        P.flash = FX.flashA;
        P.flashCol = FX.flashCol;
        P.slow = G.slowAmt;
        P.vig = 0.55 + 0.3 * G.slowAmt;
        FX.writeWaves(P.waves);
        Post.present(this.scene, G.timeR);
      }
      UI.frame(dt);
    } catch (err) {
      if (!this.errLogged) { this.errLogged = true; console.error('[orrery]', err); }
    }
    Quality.track(dt);
  },
};

function start() {
  App.boot();
}

if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
else start();

})();
</script>
