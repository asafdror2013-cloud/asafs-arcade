      }
    }
  },

  update(dtR) {
    G.timeR += dtR;
    const frozen = G.state === 'paused' || G.state === 'boot' || G.state === 'levelup' || G.state === 'chest';
    if (frozen) {
      // the music keeps playing (muffled) while a card or chest is open
      if (G.state === 'levelup' || G.state === 'chest') { G.songT += dtR; Music.update(G.songT, 1); }
      FX.update(0, dtR);
      return;
    }
    const R = G.run, P = G.player;
    const sl = slowScale();
    G.slowAmt = sat((1 - sl) / 0.7);
    let ws = sl;
    if (G.hitstop > 0) { G.hitstop -= dtR; ws = 0; }
    if (G.state === 'dying') ws = Math.min(ws, 0.3);
    if (G.state === 'over') ws = 0.15;
    G.ws = ws;
    Sound.detune = -300 * G.slowAmt;
    const dt = Math.min(dtR * ws, 1 / 30);
    if (dt > 0) this.step(dt);
    if (G.state === 'play' && R.pending > 0 && P.alive) this.openLevelUp();
    if (G.state === 'dying' && G.timeR - G.deathT > 1.3) this.end();
    if (G.attract && G.timeW > 70) this.start('attract');
    if (!G.attract && G.state === 'play') Music.level = G.boss ? 5 : R.time < 30 ? 1 : R.time < 90 ? 2 : R.time < 180 ? 3 : 4;
    G.songT += dtR * ws;
    Music.update(G.songT, ws);
    FX.update(dt, dtR);
    const k = Math.min(1, dtR * 9);
    // on the title screen the star sits in the open band between the logo and the menu
    const fy = G.attract && G.focusY ? G.focusY - G.H / 2 : 0;
    G.cam.x += (P.x - G.cam.x) * k;
    G.cam.y += (P.y - fy - G.cam.y) * k;
  },

  step(dt) {
    G.timeW += dt;
    const R = G.run, P = G.player, t = G.timeW;
    const playing = G.state === 'play';
    if (playing && !G.attract) R.time += dt;
    if (P.alive) this.movePlayer(dt);
    this.updateOrbit(dt);
    if (playing || G.attract) this.spawner(dt);
    for (const e of G.enemies) if (!e.dead) e.update(dt, t);
    const B = G.boss;
    if (B && !B.dead) {
      B.update(dt, t);
      // a boss that is ignored for too long slips away, taking its chest with it
      B.life += dt;
      if (!G.attract && !B.warned && B.life > 60) { B.warned = true; UI.toast(B.name + ' begins to fade'); }
      if (B.life > 75) this.bossLeaves(B);
    }
    Hash.build(G.enemies);
    this.separate();
    this.recycle();
    if (P.alive) {
      this.moonHits(t);
      this.weapons(dt, t);
    }
    for (const s of G.shots) {
      s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
      if (s.life <= 0) s.dead = true;
    }
    if (P.alive && playing) this.contact(t);
    this.updatePickups(dt);
    for (const b of G.bolts) b.t += dt;
    G.enemies = G.enemies.filter((e) => !e.dead);
    G.shots = G.shots.filter((s) => !s.dead);
    G.falls = G.falls.filter((f) => !f.dead);
    G.bolts = G.bolts.filter((b) => b.t < b.life);
    P.hurt = Math.max(0, P.hurt - dt * 3);
  },

  // ---- the star
  aiInput() {
    const P = G.player;
    if (!this.ai) this.ai = { tx: 0, ty: 0, until: 0, stop: true };
    const A = this.ai;
    if (G.timeR > A.until) {
      A.until = G.timeR + rnd(1.2, 2.6);
      A.stop = Math.random() < 0.45;
      const a = Math.random() * TAU, d = rnd(30, 150);
      A.tx = Math.cos(a) * d;
      A.ty = Math.sin(a) * d;
    }
    if (A.stop) return { x: 0, y: 0 };
    const dx = A.tx - P.x, dy = A.ty - P.y, d = Math.hypot(dx, dy);
    if (d < 12) return { x: 0, y: 0 };
    return { x: (dx / d) * 0.6, y: (dy / d) * 0.6 };
  },

  movePlayer(dt) {
    const P = G.player;
    const inp = G.attract ? this.aiInput() : G.input;
    const sp = Stats.speed();
    const k = Math.min(1, dt * 12);
    P.vx += (inp.x * sp - P.vx) * k;
    P.vy += (inp.y * sp - P.vy) * k;
    P.x += P.vx * dt;
    P.y += P.vy * dt;
    if (Math.hypot(inp.x, inp.y) < 0.15) P.stillT += dt; else P.stillT = 0;
    const want = P.stillT > 0.18 ? 1 : 0;
    P.wideK += (want - P.wideK) * Math.min(1, dt * (want ? 4 : 7));
  },

  orbit() {
    const R = G.run, P = G.player, u = R.up, st = STARS[R.star];
    const base = 52 * (1 + 0.18 * (u.wide || 0));
    let nova = 1;
    if (P.novaT > 0) {
      const k = 1 - P.novaT / NOVA_DUR;
      nova = 1 + 2.8 * Math.sin(Math.PI * Math.min(1, k * 1.1));
    }
    const r1 = base * lerp(1, 1.62, P.wideK) * nova;
    const spin = 3 * (1 + 0.2 * (u.swift || 0)) * (st.spin || 1) * (u.binary ? 2 : 1) * (1 + 0.25 * P.wideK) * (P.novaT > 0 ? 2.2 : 1);
    const size = 9 * (1 + 0.22 * (u.giant || 0)) * (st.size || 1);
    const dmg = 14 * (1 + 0.3 * (u.heavy || 0)) * Stats.dmg() * (u.binary ? 1.5 : 1) * (P.novaT > 0 ? 3 : 1);
    return { r1, r2: r1 * 1.72, spin, size, n1: R.baseMoons + (u.moon || 0), n2: u.ring2 ? 1 + u.ring2 : 0, dmg };
  },

  updateOrbit(dt) {
    const R = G.run, P = G.player;
    const O = (G.orbit = this.orbit());
    P.a1 += O.spin * dt;
    P.a2 -= O.spin * 0.82 * dt;
    if (P.novaT > 0) P.novaT = Math.max(0, P.novaT - dt);
    G.moons.length = 0;
    for (let i = 0; i < O.n1; i++) {
      const a = P.a1 + (i * TAU) / O.n1;
      G.moons.push({ x: P.x + Math.cos(a) * O.r1, y: P.y + Math.sin(a) * O.r1, r: O.size, ring: 1, k: i, skin: MOON_SKINS[i % MOON_SKINS.length] });
    }
    for (let i = 0; i < O.n2; i++) {
      const a = P.a2 + (i * TAU) / O.n2;
      G.moons.push({ x: P.x + Math.cos(a) * O.r2, y: P.y + Math.sin(a) * O.r2, r: O.size * 0.85, ring: 2, k: 100 + i, skin: MOON_SKINS[(i + 2) % MOON_SKINS.length] });
    }
    if (R.up.comet) {
      R.tm.trail += dt;
      const life = 0.4 + 0.15 * R.up.comet;
      if (R.tm.trail > 0.035) {
        R.tm.trail = 0;
        for (const m of G.moons) {
          let tr = R.trails.get(m.k);
          if (!tr) { tr = []; R.trails.set(m.k, tr); }
          tr.push({ x: m.x, y: m.y, t: G.timeW });
        }
      }
      for (const tr of R.trails.values()) while (tr.length && G.timeW - tr[0].t > life) tr.shift();
    }
  },

  moonHits(t) {
    const P = G.player, O = G.orbit;
    for (const m of G.moons) {
      Hash.query(m.x, m.y, m.r + 26, NEAR);
      for (const e of NEAR) {
        if (e.hitCD > t || e.dead) continue;
        const rr = m.r + e.r, dx = e.x - m.x, dy = e.y - m.y;
        if (dx * dx + dy * dy > rr * rr) continue;
        e.hitCD = t + 0.14;
        const px = e.x - P.x, py = e.y - P.y, pd = Math.hypot(px, py) || 1;
        const kb = 230 / e.mass;
        e.kx += (px / pd) * kb;
        e.ky += (py / pd) * kb;
        this.damage(e, O.dmg * (m.ring === 2 ? 0.85 : 1), 'moon', m);
      }
      const b = G.boss;
      if (b && !b.dead && (b.mhit[m.k] || 0) <= t && Math.hypot(b.x - m.x, b.y - m.y) < m.r + b.r) {
        b.mhit[m.k] = t + 0.25;
        this.damage(b, O.dmg, 'moon', m);
      }
      for (const s of G.shots) {
        if (s.dead) continue;
        if (Math.hypot(s.x - m.x, s.y - m.y) < m.r + s.r) {
          s.dead = true;
          FX.burst(s.x, s.y, 6, '#ffffff', 40, 160, 0.3, 2);
          if (!G.attract) Sfx.parry();
        }
      }
    }
  },

  damage(e, dmg, src, m) {
    if (e.dead) return;
    const R = G.run;
    e.hp -= dmg;
    e.flash = 1;
    if (src === 'moon' || src === 'fall') {
      if (R.up.frost) e.slowUntil = G.timeW + 2;
      if (!G.attract) Sfx.hit();
      if (m) FX.burst(lerp(m.x, e.x, 0.5), lerp(m.y, e.y, 0.5), 3, '#ffe0c0', 40, 140, 0.25, 2);
    }
    if (src === 'moon' && R.up.chain && Math.random() < 0.55) this.chain(e, dmg * 0.5, 1 + R.up.chain);
    if (Save.data.settings.numbers && !G.attract && FX.pops.length < 16 && Math.random() < (e.boss || e.elite ? 0.6 : 0.3)) {
      FX.pop(String(Math.round(dmg)), e.x + rnd(-6, 6), e.y - e.r - 4, { size: Math.min(15, 9 + dmg / 10), color: src === 'burn' ? '#ffbe9a' : src === 'chain' ? '#c8ecff' : '#ffffff', life: 0.5, vy: -46 });
    }
    if (e.boss) UI.bossBar(e);
    if (e.hp <= 0) { if (e.boss) this.killBoss(e); else this.kill(e); }
  },

  chain(src, dmg, n) {
    Hash.query(src.x, src.y, 130, NEAR2);
    const list = NEAR2.filter((e) => e !== src && !e.dead).map((e) => [e, (e.x - src.x) ** 2 + (e.y - src.y) ** 2]).filter((p) => p[1] < 130 * 130).sort((a, b) => a[1] - b[1]);
    let last = src, k = 0;
    for (const [e] of list) {
      this.bolt(last.x, last.y, e.x, e.y, 0.16);
      this.damage(e, dmg, 'chain');
      last = e;
      if (++k >= n) break;
    }
    if (k && !G.attract) Sfx.zap();
  },

  bolt(x1, y1, x2, y2, life) {
    const pts = [x1, y1];
    const nx = -(y2 - y1), ny = x2 - x1, l = Math.hypot(nx, ny) || 1;
    for (let i = 1; i < 6; i++) {
      const k = i / 6, o = rnd(-9, 9);
      pts.push(lerp(x1, x2, k) + (nx / l) * o, lerp(y1, y2, k) + (ny / l) * o);
    }
    pts.push(x2, y2);
    G.bolts.push({ pts, t: 0, life: life || 0.16 });
  },

  kill(e) {
    e.dead = true;
    const R = G.run;
    if (!G.attract) R.kills++;
    this.dropGem(e.x, e.y, e.d.xp * (e.elite ? 10 : 1));
    if (e.elite) G.drops.push({ kind: 'chest', x: e.x, y: e.y, t: G.timeW });
    else if (!G.attract) {
      const r = Math.random();
      if (r < 1 / 150 && R.time > R.nextHeart) { R.nextHeart = R.time + rnd(40, 65); G.drops.push({ kind: 'heart', x: e.x, y: e.y, t: G.timeW }); }
      else if (r > 1 - 1 / 300 && R.time > R.nextVac) { R.nextVac = R.time + rnd(70, 110); G.drops.push({ kind: 'vacuum', x: e.x, y: e.y, t: G.timeW }); }
    }
    if (e.type === 'splitter' && G.enemies.length < 320) {
      for (let i = 0; i < 3; i++) {
        const a = (i * TAU) / 3 + Math.random();
        G.enemies.push(new Enemy('mite', e.x + Math.cos(a) * 16, e.y + Math.sin(a) * 16, { hpScale: this.hpScale() * 0.7 }));
      }
    }
    this.addNova(e.elite ? 0.12 : 0.011);
    FX.burst(e.x, e.y, e.elite ? 26 : 7 + Math.floor(e.r / 3), PAL.danger, 60, 240, 0.45, 2.5);
    FX.burst(e.x, e.y, 3, '#ffd0dc', 40, 160, 0.3, 2);
    if (e.elite) { FX.ring(e.x, e.y, 10, 90, 0.5, PAL.sun, 4); FX.shake(0.2); }
    if (!G.attract) Sfx.kill();
  },

  dropGem(x, y, v) {
    if (G.gems.length > 360) {
      let far = -1, fd = 0;
      for (let i = 0; i < G.gems.length; i += 7) {
        const g = G.gems[i], d = Math.hypot(g.x - G.player.x, g.y - G.player.y);
        if (d > fd && !g.pulled) { fd = d; far = i; }
      }
      if (far >= 0) { G.bank += G.gems[far].v; G.gems.splice(far, 1); }
    }
    while (v > 0) {
      const part = v >= 25 ? 25 : v >= 5 ? 5 : 1;
      v -= part;
      G.gems.push({ x: x + rnd(-6, 6), y: y + rnd(-6, 6), v: part, kind: part >= 25 ? 2 : part >= 5 ? 1 : 0, vx: rnd(-40, 40), vy: rnd(-40, 40), pulled: false, ps: 0, spin: Math.random() * TAU });
      if (G.gems.length > 420) break;
    }
  },

  updatePickups(dt) {
    const P = G.player, R = G.run;
    if (!P.alive) return;
    const pr = Stats.pick(), pr2 = pr * pr, vac = G.vacuumT > G.timeW;
    for (const g of G.gems) {
      if (g.dead) continue;
      const dx = P.x - g.x, dy = P.y - g.y, d2 = dx * dx + dy * dy;
      if (!g.pulled && (d2 < pr2 || vac)) g.pulled = true;
      if (g.pulled) {
        const d = Math.sqrt(d2) || 1;
        g.ps += dt * 1100;
        const sp = Math.min(1100, 160 + g.ps);
        g.x += (dx / d) * sp * dt;
        g.y += (dy / d) * sp * dt;
        if (d < P.r + 8) {
          g.dead = true;
          if (!G.attract) this.addXp(g.v + G.bank);
          G.bank = 0;
          R.gemStreak = G.timeR - R.lastGemR < 0.5 ? R.gemStreak + 1 : 0;
          R.lastGemR = G.timeR;
          if (!G.attract) Sfx.gem(R.gemStreak);
        }
      } else {
        g.x += g.vx * dt; g.y += g.vy * dt;
        g.vx *= Math.exp(-5 * dt); g.vy *= Math.exp(-5 * dt);
      }
    }
    G.gems = G.gems.filter((g) => !g.dead);
    for (const d of G.drops) {
      if (d.dead) continue;
      if (Math.hypot(P.x - d.x, P.y - d.y) < P.r + 18) {
        d.dead = true;
        if (G.attract) continue;
        if (d.kind === 'heart') {
          this.heal(30);
          Sfx.heal();
        } else if (d.kind === 'vacuum') {
          G.vacuumT = G.timeW + 2;
          Sfx.level();
          FX.ring(P.x, P.y, 10, 600, 0.8, PAL.dust, 4);
          UI.toast('Starlight: all stardust comes to you');
        } else if (d.kind === 'chest' && G.state === 'play') this.openChest(d);
      }
    }
    G.drops = G.drops.filter((d) => !d.dead);
  },

  addXp(v) {
    const R = G.run;
    R.xp += v * Stats.xp();
    while (R.xp >= R.xpNext) {
      R.xp -= R.xpNext;
      R.level++;
      R.xpNext = xpNeed(R.level);
      R.pending++;
    }
  },

  // ---- weapons beyond the plain orbit
  weapons(dt, t) {
    const R = G.run, P = G.player, u = R.up, O = G.orbit;
    if (u.comet) {
      R.tm.burn += dt;
      if (R.tm.burn > 0.2) {
        R.tm.burn = 0;
        for (const tr of R.trails.values()) {
          for (let i = 0; i < tr.length; i += 2) {
            const p = tr[i];
            Hash.query(p.x, p.y, 30, NEAR);
            for (const e of NEAR) {
              if (e.burnCD > t) continue;
              if (Math.hypot(e.x - p.x, e.y - p.y) < 10 + e.r) { e.burnCD = t + 0.3; this.damage(e, 3 + 3 * u.comet, 'burn'); }
            }
          }
        }
      }
    }
    if (u.corona) {
      R.tm.corona += dt;
      if (R.tm.corona > 0.35) {
        R.tm.corona = 0;
        const rad = P.r + 14 + 7 * u.corona;
        Hash.query(P.x, P.y, rad + 24, NEAR);
        for (const e of NEAR) if (Math.hypot(e.x - P.x, e.y - P.y) < rad + e.r) this.damage(e, 5 * u.corona, 'burn');
        const b = G.boss;
        if (b && !b.dead && Math.hypot(b.x - P.x, b.y - P.y) < rad + b.r) this.damage(b, 5 * u.corona, 'burn');
      }
    }
    if (u.well) {
      const reach = O.r1 * 1.9 + 24;
      Hash.query(P.x, P.y, reach, NEAR);
      for (const e of NEAR) {
        const dx = P.x - e.x, dy = P.y - e.y, d = Math.hypot(dx, dy) || 1;
        if (d > O.r1 * 0.9 && d < reach) {
          const f = (30 + 22 * u.well) / Math.sqrt(e.mass);
          e.x += (dx / d) * f * dt;
          e.y += (dy / d) * f * dt;
        }
      }
    }
    if (u.moonfall) {
      R.tm.moonfall += dt;
      const period = Math.max(1.6, 4.2 - 0.9 * (u.moonfall - 1));
      if (R.tm.moonfall >= period) { R.tm.moonfall = 0; this.launchFalls(u.meteor ? 3 : 1); }
    }
    this.updateFalls(dt, t);
    if (u.tesla) {
      R.tm.tesla += dt;
      if (R.tm.tesla > 0.22) {
        R.tm.tesla = 0;
        const ring = G.moons.filter((m) => m.ring === 1);
        if (ring.length > 1) {
          Hash.query(P.x, P.y, O.r1 + 30, NEAR);
          for (const e of NEAR) {
            for (let k = 0; k < ring.length; k++) {
              const a = ring[k], b = ring[(k + 1) % ring.length];
              if (distToSegment(e.x, e.y, a.x, a.y, b.x, b.y) < e.r + 5) { this.damage(e, 7, 'chain'); break; }
            }
          }
        }
      }
    }
    if (u.fusion && R.hp < R.maxHp && G.state === 'play') {
      R.hp = Math.min(R.maxHp, R.hp + 0.8 * u.fusion * dt);
      R.tm.fusion += dt;
      if (R.tm.fusion > 1.2) { R.tm.fusion = 0; FX.ring(P.x, P.y, P.r, P.r + 16, 0.5, PAL.heal, 1.5); }
    }
  },

  launchFalls(n) {
    const P = G.player, O = G.orbit;
    for (let i = 0; i < n; i++) {
      const m = G.moons[Math.floor(Math.random() * G.moons.length)] || { x: P.x + 1, y: P.y, skin: 'lava' };
      let a = Math.atan2(m.y - P.y, m.x - P.x);
      if (n > 1) a += (i - (n - 1) / 2) * 0.55;
      G.falls.push({ x: m.x, y: m.y, vx: Math.cos(a) * 540, vy: Math.sin(a) * 540, t: 0, r: O.size * 1.45, hit: new Set(), skin: m.skin, back: false, trail: [], burn: !!(G.run.up.meteor || G.run.up.comet) });
    }
    if (!G.attract) Sfx.moonfall();
  },

  updateFalls(dt, t) {
    const P = G.player;
    for (const f of G.falls) {
      f.t += dt;
      if (f.t < 0.55) { const k = Math.exp(-2.2 * dt); f.vx *= k; f.vy *= k; }
      else {
        if (!f.back) { f.back = true; f.hit.clear(); }
        const dx = P.x - f.x, dy = P.y - f.y, d = Math.hypot(dx, dy) || 1;
        const sp = 300 + (f.t - 0.55) * 900;
        f.vx = (dx / d) * sp; f.vy = (dy / d) * sp;
        if (d < 18) f.dead = true;
      }
      f.x += f.vx * dt; f.y += f.vy * dt;
      f.trail.push(f.x, f.y);
      if (f.trail.length > 24) f.trail.splice(0, 2);
      Hash.query(f.x, f.y, f.r + 26, NEAR);
      for (const e of NEAR) {
        if (f.hit.has(e) || Math.hypot(e.x - f.x, e.y - f.y) > f.r + e.r) continue;
        f.hit.add(e);
        e.kx += (f.vx / 540) * 160 / e.mass;
        e.ky += (f.vy / 540) * 160 / e.mass;
        this.damage(e, G.orbit.dmg * 2, 'fall', f);
      }
      const b = G.boss;
      if (b && !b.dead && !f.hit.has(b) && Math.hypot(b.x - f.x, b.y - f.y) < f.r + b.r) { f.hit.add(b); this.damage(b, G.orbit.dmg * 2, 'fall', f); }
      if (f.t > 3) f.dead = true;
    }
  },

  separate() {
    for (const e of G.enemies) {
      if (e.dead) continue;
      Hash.query(e.x, e.y, e.r + 20, NEAR);
      for (const o of NEAR) {
        if (o === e) continue;
        const dx = e.x - o.x, dy = e.y - o.y, rr = e.r + o.r, d2 = dx * dx + dy * dy;
        if (d2 >= rr * rr || d2 < 0.01) continue;
        const d = Math.sqrt(d2), push = (rr - d) * 0.5 * (o.mass / (e.mass + o.mass));
        e.x += (dx / d) * push;
        e.y += (dy / d) * push;
      }
    }
  },

  recycle() {
    const P = G.player, lim = viewRadius() * 1.75;
    for (const e of G.enemies) {
      if (Math.hypot(e.x - P.x, e.y - P.y) > lim) {
        const p = this.spawnPos();
        e.x = p.x; e.y = p.y; e.kx = 0; e.ky = 0;
      }
    }
  },

  contact(t) {
    const P = G.player;
    if (P.inv > t || P.novaT > 0) return;
    Hash.query(P.x, P.y, P.r + 40, NEAR);
    for (const e of NEAR) {
      if (Math.hypot(e.x - P.x, e.y - P.y) < P.r * 0.75 + e.r * 0.8) {
        const k = e.type === 'lancer' && e.state === 'dash' ? 'dash' : e.type;
        this.hurt(HURT[k] * (e.elite ? 1.5 : 1), e.elite ? 'elite' : k, e);
        return;
      }
    }
    const b = G.boss;
    if (b && !b.dead) {
      if (Math.hypot(b.x - P.x, b.y - P.y) < P.r * 0.8 + b.r * 0.85) {
        const k = b.state === 'charge' ? 'charge' : 'boss';
        this.hurt(HURT[k], k, b);
        // the boss recoils after a hit instead of grinding the star down
        const dx = b.x - P.x, dy = b.y - P.y, d = Math.hypot(dx, dy) || 1;
        b.kx += (dx / d) * 260; b.ky += (dy / d) * 260;
        if (b.state === 'charge') { b.state = 'walk'; b.tm = 1.6; }
        return;
      }
      for (const m of b.moons) if (Math.hypot(m.x - P.x, m.y - P.y) < P.r * 0.8 + m.r) { this.hurt(HURT.bossMoon, 'bossMoon', m); return; }
    }
    for (const s of G.shots) {
      if (!s.dead && Math.hypot(s.x - P.x, s.y - P.y) < P.r * 0.7 + s.r) { s.dead = true; this.hurt(HURT.shot, 'shot', s); return; }
    }
  },

  hurt(base, cause, src) {
    const R = G.run, P = G.player;
    if (G.attract) return;
    const dmg = Math.round(base * (1 + R.time / 300));
    R.hp -= dmg;
    R.hits++;
    (R.hurtLog = R.hurtLog || []).push(Math.round(R.time) + ':' + cause);
    P.inv = G.timeW + 0.35 + Math.min(0.9, (dmg / R.maxHp) * 3);
    P.hurt = 1;
    const big = dmg >= R.maxHp * 0.12;
    G.hitstop = big ? 0.07 : 0.035;
    FX.flash(big ? 0.3 : 0.16, [1, 0.2, 0.35]);
    FX.shake(big ? 0.45 : 0.25);
    FX.ca = big ? 1.3 : 0.8;
    if (big) FX.wave(P.x, P.y, 0.035, 1.0);
    FX.pop('-' + dmg, P.x + rnd(-8, 8), P.y - P.r - 10, { size: 15, color: '#ff6a8a', life: 0.7, vy: -50 });
    if (src) { const a = Math.atan2(src.y - P.y, src.x - P.x); FX.burst(P.x + Math.cos(a) * P.r, P.y + Math.sin(a) * P.r, 8, PAL.danger, 60, 240, 0.4, 2.5); }
    Sfx.hurt(big);
    vibrate(big ? 40 : 20);
    Hash.query(P.x, P.y, 130, NEAR);
    for (const e of NEAR) {
      const dx = e.x - P.x, dy = e.y - P.y, d = Math.hypot(dx, dy) || 1;
      e.kx += (dx / d) * 300 / e.mass;
      e.ky += (dy / d) * 300 / e.mass;
    }
    UI.health();
    if (R.hp <= 0) this.die();
  },

  heal(n) {
    const R = G.run, P = G.player;
    if (R.hp >= R.maxHp) return;
    const got = Math.min(R.maxHp - R.hp, n);
    R.hp += got;
    FX.ring(P.x, P.y, 8, 60, 0.5, PAL.heal, 3);
    FX.pop('+' + Math.round(got), P.x, P.y - P.r - 12, { size: 14, color: PAL.heal, life: 0.8, vy: -45 });
    UI.health();
  },

  die() {
    const R = G.run, P = G.player;
    if (R.rebirth) {
      R.rebirth = false;
      R.hp = R.maxHp;
      P.inv = G.timeW + 2.5;
      this.novaBlast();
      UI.health();
      UI.banner('Rebirth', 'Full health. Once per run.');
      return;
    }
    P.alive = false;
    G.state = 'dying';
    G.deathT = G.timeR;
    G.hitstop = 0.15;
    FX.burst(P.x, P.y, 40, STARS[R.star].glow, 100, 520, 1.0, 4);
    FX.burst(P.x, P.y, 24, '#ffffff', 60, 380, 0.8, 3);
    FX.ring(P.x, P.y, 10, 260, 1.0, STARS[R.star].glow, 6);
    FX.flash(0.5, [1, 0.6, 0.4]);
    FX.wave(P.x, P.y, 0.07, 1.0);
    Sfx.death();
    Sound.musicFilter(220, 0.3);
    UI.onDeath();
  },

  // ---- Supernova
  addNova(a) {
    const R = G.run;
    if (G.attract || G.state !== 'play') return;
    const was = R.nova;
    R.nova = Math.min(1, R.nova + a * (1 + 0.35 * (R.up.nova || 0)));
    if (was < 1 && R.nova >= 1) {
      Sfx.novaReady();
      UI.novaReady(true);
      if (!Save.data.seen.nova) {
        Save.data.seen.nova = true;
        UI.hint(isTouchDevice ? 'Supernova is ready. Tap NOVA to fling your moons across the screen.' : 'Supernova is ready. Press Space to fling your moons across the screen.', 3.5);
      }
    }
  },

  nova() {
    const R = G.run, P = G.player;
    if (!R || G.state !== 'play' || R.nova < 1 || !P.alive) return false;
    R.nova = 0;
    R.novas++;
    UI.novaReady(false);
    this.novaBlast();
    return true;
  },

  novaBlast() {
    const P = G.player;
    P.novaT = NOVA_DUR;
    P.inv = Math.max(P.inv, G.timeW + NOVA_DUR + 0.3);
    for (const s of G.shots) s.dead = true;
    startSlow(0.35, 0.45);
    FX.flash(0.45, [1, 0.85, 0.55]);
    FX.shake(0.6);
    FX.wave(P.x, P.y, 0.08, 1.4);
    FX.ring(P.x, P.y, 20, 560, 1.0, '#ffe7b0', 8);
    FX.ca = 1.6;
    Sfx.nova();
    vibrate(40);
  },

  // ---- spawning
  hpScale() {
    const R = G.run, t = R.time, late = Math.max(0, (t - 300) / 80);
    return 1 + t / 150 + (t / 220) * (t / 220) + Math.pow(late, 2.4) + R.sp.bossN * 0.2;
  },
  // later creatures shrug off knockback and move faster
  massScale() { return 1 + G.run.time / 240; },
  speedScale() { return 1 + Math.min(1, G.run.time / 700); },

  spawner(dt) {
    const R = G.run, S = R.sp, t = R.time;
    const rate = G.attract ? 1.8 : Math.min(16, 1 + t * 0.012 + Math.pow(t / 90, 1.7) * 0.3) * (G.boss ? 0.6 : 1);
    S.acc += rate * dt;
    while (S.acc >= 1) {
      S.acc -= 1;
      if (G.enemies.length < 260) this.spawnEnemy(G.attract ? (Math.random() < 0.8 ? 'mite' : 'wisp') : this.pickType(t));
    }
    if (G.attract) return;
    if (t >= S.nextStream) { S.nextStream = t + rnd(38, 55); this.stream(); }
    if (t >= S.nextRing) { S.nextRing += 120; this.ringSwarm(26 + 6 * S.rings++); }
    if (t >= S.nextElite) { S.nextElite = t + (t < 600 ? rnd(50, 65) : rnd(25, 35)); this.spawnEnemy(this.pickType(t, true), { elite: true }); }
    if (t >= S.nextBoss && !G.boss) { S.nextBoss = t + (t < 600 ? 120 : 90); this.spawnBoss(); }
  },

  pickType(t, elite) {
    const opts = [['mite', elite ? 3 : 10], ['wisp', t > 30 ? 4 : 0], ['brute', t > 45 ? 2 + t / 120 : 0], ['lancer', t > 75 ? 2.4 : 0], ['spitter', t > 90 ? 2.2 : 0], ['splitter', t > 150 ? 2.2 : 0]];
    let total = 0;
    for (const o of opts) total += o[1];
    let r = Math.random() * total;
    for (const o of opts) { r -= o[1]; if (r <= 0) return o[0]; }
    return 'mite';
  },

  spawnPos() {
    const P = G.player, R0 = viewRadius() + 40;
    let a = Math.random() * TAU;
    if (Math.hypot(P.vx, P.vy) > 30 && Math.random() < 0.55) a = Math.atan2(P.vy, P.vx) + rnd(-1, 1);
    return { x: P.x + Math.cos(a) * R0, y: P.y + Math.sin(a) * R0 };
  },

  spawnEnemy(type, o) {
    if (G.enemies.length >= 320) return;
    const p = this.spawnPos();
    G.enemies.push(new Enemy(type, p.x, p.y, Object.assign({ hpScale: G.attract ? 1 : this.hpScale() }, o || {})));
  },

  stream() {
    const P = G.player, a = Math.random() * TAU, R0 = viewRadius() + 40;
    for (let i = 0; i < 12; i++) {
      const off = (i % 4 - 1.5) * 16, back = Math.floor(i / 4) * 26;
      G.enemies.push(new Enemy('wisp', P.x + Math.cos(a) * (R0 + back) - Math.sin(a) * off, P.y + Math.sin(a) * (R0 + back) + Math.cos(a) * off, { hpScale: this.hpScale() }));
    }
  },

  ringSwarm(n) {
    const P = G.player, R0 = viewRadius() + 10;
    for (let i = 0; i < n; i++) {
      const a = (i * TAU) / n;
      G.enemies.push(new Enemy('mite', P.x + Math.cos(a) * R0, P.y + Math.sin(a) * R0, { hpScale: this.hpScale(), speedMul: 0.85 }));
    }
    UI.banner('The swarm closes in', 'Stand still and let your orbit sweep');
  },

  spawnBoss() {
    const S = G.run.sp;
    S.bossN++;
    G.boss = new Eclipse(S.bossN);
    UI.banner(G.boss.name, 'A boss approaches', PAL.danger);
    UI.bossBar(G.boss);
    Sfx.bossWarn();
    Music.boss = true;
    FX.shake(0.3);
  },

  bossLeaves(b) {
    b.dead = true;
    FX.burst(b.x, b.y, 40, '#2a0614', 60, 300, 1.0, 5);
    FX.ring(b.x, b.y, b.r, b.r * 4, 0.9, PAL.danger, 4);
    UI.bossBar(null);
    UI.banner(b.name + ' escaped', 'Grind it with your moons next time', PAL.lilac);
    Music.boss = false;
    G.boss = null;
  },

  killBoss(b) {
    b.dead = true;
    const R = G.run;
    R.bosses++;
    for (let i = 0; i < 20; i++) this.dropGem(b.x + rnd(-50, 50), b.y + rnd(-50, 50), 25);
    G.drops.push({ kind: 'chest', x: b.x, y: b.y, t: G.timeW, boss: true });
    FX.flash(0.6, [1, 0.8, 0.6]);
    FX.shake(0.9);
    FX.wave(b.x, b.y, 0.09, 1.2);
    FX.ring(b.x, b.y, 20, 420, 1.1, '#ffffff', 9);
    FX.burst(b.x, b.y, 60, PAL.danger, 120, 560, 1.1, 4);
    startSlow(0.3, 0.8);
    Sfx.bossDown();
    vibrate([30, 30, 60]);
    UI.bossBar(null);
    UI.banner('Boss destroyed', 'It left a chest behind', PAL.sun);
    Music.boss = false;
    G.boss = null;
  },

  // ---- level-ups and chests
  rollCards(n, exclude) {
    const R = G.run, out = [];
    exclude = exclude || [];
    const evo = Object.keys(UPGRADES).filter((k) => {
      const u = UPGRADES[k];
      return u.needs && !R.up[k] && !exclude.includes(k) && Object.keys(u.needs).every((q) => (R.up[q] || 0) >= u.needs[q]);
    });
    if (evo.length) out.push(evo[0]);
    const pool = Object.keys(UPGRADES).filter((k) => !UPGRADES[k].needs && (R.up[k] || 0) < UPGRADES[k].max && !out.includes(k) && !exclude.includes(k));
    while (out.length < n && pool.length) {
      let total = 0;
      for (const k of pool) total += UPGRADES[k].w;
      let r = Math.random() * total, pick = pool[0];
      for (const k of pool) { r -= UPGRADES[k].w; if (r <= 0) { pick = k; break; } }
      out.push(pick);
      pool.splice(pool.indexOf(pick), 1);
    }
    if (!out.length) return exclude.length ? [] : ['heal_s', 'dust_s'];
    return out;
  },

  openLevelUp() {
    const R = G.run, P = G.player;
    R.pending--;
    const cards = this.rollCards(3);
    G.state = 'levelup';
    G.input.x = 0; G.input.y = 0;
    Sfx.level();
    FX.ring(P.x, P.y, 10, 130, 0.6, PAL.sun, 4);
    Sound.musicFilter(900, 0.12);
    UI.showLevelUp(cards);
  },

  choose(k) {
    if (G.state !== 'levelup') return;
    this.applyUpgrade(k);
    Sfx.card(upInfo(k).rarity);
    G.state = 'play';
    Sound.musicFilter(18000, 0.1);
    UI.hideLevelUp();
  },

  reroll() {
    const R = G.run;
    if (G.state !== 'levelup' || R.rerolls <= 0) return;
    R.rerolls--;
    UI.showLevelUp(this.rollCards(3));
  },

  applyUpgrade(k, i) {
    const R = G.run, P = G.player;
    if (k === 'heal_s') { this.heal(40); return; }
    if (k === 'dust_s') { R.bonusDust += 25; return; }
    const u = UPGRADES[k];
    R.up[k] = (R.up[k] || 0) + 1;
    R.upList.push(k);
    if (k === 'heart') { R.maxHp += 20; this.heal(20); UI.health(); }
    if (u.rarity === 'legendary') {
      R.evolutions++;
      FX.flash(0.3, [1, 0.9, 0.6]);
      FX.ring(P.x, P.y, 10, 200, 0.8, PAL.lilac, 6);
      UI.toast('Evolution · ' + u.name, 'evo');
    }
    FX.pop(u.name.toUpperCase(), P.x, P.y - 44 - (i || 0) * 20, { size: 13, big: true, color: u.rarity === 'legendary' ? PAL.sun : u.rarity === 'rare' ? PAL.lilac : '#ffe3b3', life: 1.1 + (i || 0) * 0.15 });
  },

  openChest(d) {
    const R = G.run;
    R.chests++;
    const r = Math.random();
    let n = r < 0.03 ? 5 : r < 0.2 ? 3 : 1;
    if (d.boss) n = r < 0.2 ? 5 : 3;
    const items = [];
    for (let i = 0; i < n; i++) {
      const c = this.rollCards(1, items);
      if (!c.length) break;
      items.push(c[0]);
    }
    if (!items.length) items.push('dust_s');
    G.state = 'chest';
    G.input.x = 0; G.input.y = 0;
    Sound.musicFilter(900, 0.12);
    UI.showChest(items, () => {
      items.forEach((k, i) => this.applyUpgrade(k, i));
      G.state = 'play';
      Sound.musicFilter(18000, 0.1);
    });
  },

  // ---- end of a run
  end() {
    const R = G.run, S = Save.data;
    G.state = 'over';
    Music.stop();
    if (Sound.ac && Sound.musicBus) Sound.musicBus.gain.setTargetAtTime(0, Sound.ac.currentTime, 0.4);
    UI.bossBar(null);
    UI.novaReady(false);
    const time = R.time;
    const base = R.kills / 6 + time / 3 + (R.level - 1) * 4 + R.bosses * 60;
    const earned = Math.floor(base * (1 + 0.1 * shopLevel('greed'))) + R.bonusDust;
    S.dust += earned;
    S.dustTotal += earned;
    const prev = { time: S.best.time, kills: S.best.kills, level: S.best.level };
    const isBest = time > S.best.time && time > 1;
    S.best.time = Math.max(S.best.time, Math.round(time * 10) / 10);
    S.best.kills = Math.max(S.best.kills, R.kills);
    S.best.level = Math.max(S.best.level, R.level);
    const st = S.stats;
    st.runs++; st.kills += R.kills; st.time += time; st.bosses += R.bosses; st.chests += R.chests; st.evolutions += R.evolutions;
    S.top.push({ time: Math.round(time * 10) / 10, kills: R.kills, level: R.level, date: todayKey(), star: R.star });
    S.top.sort((a, b) => b.time - a.time);
    S.top = S.top.slice(0, 5);
    const freshStars = checkStarUnlocks();
    Save.persist();
    UI.showOver({ R, earned, prev, isBest, freshStars });
  },
};

// ---------------------------------------------------------------- render.js
const Assets = { stars: {}, planets: {}, enemies: {}, white: {}, chest: null, logo: null };
const SKIN_GLOW = { lava: '#ff7a2e', ice: '#9fd8ff', gas: '#f0b27a', verdant: '#5fe08a', amethyst: '#b48cff' };
const fmod = (a, n) => ((a % n) + n) % n;

function mkCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.ceil(w));
  c.height = Math.max(1, Math.ceil(h));
  return c;
}

function loadImg(src) {
  return new Promise((res) => {
    if (!src) return res(null);
    const i = new Image();
    i.onload = () => res(i);
    i.onerror = () => res(null);
    i.src = src;
  });
}

function silhouette(img, color) {
  const c = mkCanvas(img.width, img.height), g = c.getContext('2d');
  g.drawImage(img, 0, 0);
  g.globalCompositeOperation = 'source-in';
  g.fillStyle = color;
  g.fillRect(0, 0, c.width, c.height);
  return c;
}

Assets.load = function () {
  const D = ASSET_DATA, jobs = [];
  const put = (obj, key, src) => jobs.push(loadImg(src).then((im) => { obj[key] = im; }));
  put(Assets, 'logo', D.logo);
  put(Assets, 'chest', D.chest);
  for (const k in D.stars) put(Assets.stars, k, D.stars[k]);
  for (const k in D.planets) put(Assets.planets, k, D.planets[k]);
  for (const k in D.enemies) put(Assets.enemies, k, D.enemies[k]);
  return Promise.all(jobs).then(() => {
    for (const k in Assets.enemies) if (Assets.enemies[k]) Assets.white[k] = silhouette(Assets.enemies[k], '#ffffff');
    for (const k in Assets.stars) if (Assets.stars[k]) Assets.white['star_' + k] = silhouette(Assets.stars[k], '#ff3d64');
  });
};

function glowSprite(color, size, core) {
  const c = mkCanvas(size, size), g = c.getContext('2d'), r = size / 2;
  const gr = g.createRadialGradient(r, r, 0, r, r, r);
  gr.addColorStop(0, rgba(color, 1));
  gr.addColorStop(core || 0.22, rgba(color, 0.42));
  gr.addColorStop(0.6, rgba(color, 0.1));
  gr.addColorStop(1, rgba(color, 0));
  g.fillStyle = gr;
  g.fillRect(0, 0, size, size);
  return c;
}

function gemSprite(color, deep) {
  const S = 48, c = mkCanvas(S, S), g = c.getContext('2d');
  const gl = g.createRadialGradient(24, 24, 0, 24, 24, 24);
  gl.addColorStop(0, rgba(color, 0.42));
  gl.addColorStop(0.45, rgba(color, 0.1));
  gl.addColorStop(1, rgba(color, 0));
  g.fillStyle = gl;
  g.fillRect(0, 0, S, S);
  g.translate(24, 24);
  g.beginPath();
  g.moveTo(0, -11); g.lineTo(7.5, 0); g.lineTo(0, 11); g.lineTo(-7.5, 0);
  g.closePath();
  const lg = g.createLinearGradient(-7, -11, 7, 11);
  lg.addColorStop(0, '#ffffff');
  lg.addColorStop(0.45, color);
  lg.addColorStop(1, deep);
  g.fillStyle = lg;
  g.fill();
  g.beginPath();
  g.moveTo(0, -11); g.lineTo(7.5, 0); g.lineTo(0, 0);
  g.closePath();
  g.fillStyle = 'rgba(255,255,255,0.55)';
  g.fill();
  return c;
}

function heartPath(g, s) {
  g.beginPath();
  g.moveTo(0, 0.42 * s);
  g.bezierCurveTo(-0.16 * s, 0.28 * s, -0.5 * s, 0.08 * s, -0.5 * s, -0.16 * s);
  g.bezierCurveTo(-0.5 * s, -0.42 * s, -0.16 * s, -0.52 * s, 0, -0.26 * s);
  g.bezierCurveTo(0.16 * s, -0.52 * s, 0.5 * s, -0.42 * s, 0.5 * s, -0.16 * s);
  g.bezierCurveTo(0.5 * s, 0.08 * s, 0.16 * s, 0.28 * s, 0, 0.42 * s);
  g.closePath();
}

const Render = {
  glows: {},

  init(canvas) {
    this.c = canvas;
    this.ctx = canvas.getContext('2d', { alpha: false });
    this.buildSprites();
    this.buildSky();
  },

  glow(color) {
    let g = this.glows[color];
    if (!g) g = this.glows[color] = glowSprite(color, 96);
    return g;
  },

  buildSprites() {
    this.gemSpr = [gemSprite(PAL.dust, '#2b6fd6'), gemSprite(PAL.lilac, '#5b3fd0'), gemSprite('#ffcf6a', '#d9661a')];
    // enemy shots
    let c = mkCanvas(48, 48), g = c.getContext('2d');
    let gr = g.createRadialGradient(24, 24, 0, 24, 24, 24);
    gr.addColorStop(0, '#ffffff');
    gr.addColorStop(0.18, '#ffd0dc');
    gr.addColorStop(0.32, rgba(PAL.danger, 0.95));
    gr.addColorStop(0.6, rgba(PAL.danger, 0.25));
    gr.addColorStop(1, rgba(PAL.danger, 0));
    g.fillStyle = gr;
    g.fillRect(0, 0, 48, 48);
    this.shotSpr = c;
    // heart pickup
    c = mkCanvas(64, 64); g = c.getContext('2d');
    g.drawImage(glowSprite('#ff5a7d', 64), 0, 0);
    g.translate(32, 33);
    heartPath(g, 30);
    const hg = g.createLinearGradient(-14, -14, 14, 14);
    hg.addColorStop(0, '#ffd2dc');
    hg.addColorStop(0.4, '#ff5a7d');
    hg.addColorStop(1, '#c2183f');
    g.fillStyle = hg;
    g.fill();
    g.lineWidth = 1.5;
    g.strokeStyle = 'rgba(255,255,255,0.8)';
    g.stroke();
    this.heartSpr = c;
    // starlight pickup (pulls in all stardust)
    c = mkCanvas(64, 64); g = c.getContext('2d');
    g.drawImage(glowSprite(PAL.dust, 64), 0, 0);
    g.translate(32, 32);
    g.strokeStyle = '#e6fbff';
    g.lineWidth = 2.5;
    g.beginPath(); g.arc(0, 0, 13, 0, TAU); g.stroke();
    g.fillStyle = '#ffffff';
    g.beginPath();
    for (let i = 0; i < 8; i++) {
      const a = (i * TAU) / 8 - Math.PI / 2, r = i % 2 ? 3 : 9;
      g.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    g.closePath();
    g.fill();
    this.lightSpr = c;
    // the boss's dark moons
    c = mkCanvas(64, 64); g = c.getContext('2d');
    g.drawImage(glowSprite(PAL.danger, 64, 0.5), 0, 0);
    gr = g.createRadialGradient(26, 26, 2, 32, 32, 17);
    gr.addColorStop(0, '#2a0614');
    gr.addColorStop(0.8, '#05010a');
    gr.addColorStop(1, '#000000');
    g.fillStyle = gr;
    g.beginPath(); g.arc(32, 32, 17, 0, TAU); g.fill();
    g.strokeStyle = '#ff6a8c';
    g.lineWidth = 2;
    g.stroke();
    this.darkSpr = c;
    // a soft lens-flare ray
    c = mkCanvas(256, 24); g = c.getContext('2d');
    const lg = g.createLinearGradient(0, 0, 256, 0);
    lg.addColorStop(0, 'rgba(255,255,255,0)');
    lg.addColorStop(0.5, 'rgba(255,255,255,0.9)');
    lg.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = lg;
    for (let i = 0; i < 12; i++) {
      g.globalAlpha = 0.09 + (i === 11 ? 0.5 : 0);
      const h = 24 - i * 2;
      g.fillRect(0, 12 - h / 2, 256, h);
    }
    this.raySpr = c;
    // the golden light column above a chest
    c = mkCanvas(32, 256); g = c.getContext('2d');
    const bg = g.createLinearGradient(0, 256, 0, 0);
    bg.addColorStop(0, 'rgba(255,200,110,0.85)');
    bg.addColorStop(0.35, 'rgba(255,180,80,0.3)');
    bg.addColorStop(1, 'rgba(255,180,80,0)');
    g.fillStyle = bg;
    for (let i = 0; i < 8; i++) {
      g.globalAlpha = 0.18;
      const w = 32 - i * 4;
      g.fillRect(16 - w / 2, 0, w, 256);
    }
    this.beamSpr = c;
  },

  buildSky() {
    const N = 512, c = mkCanvas(N, N), g = c.getContext('2d');
    g.fillStyle = PAL.space;
    g.fillRect(0, 0, N, N);
    g.globalCompositeOperation = 'lighter';
    const rng = new RNG(20261114);
    const blobs = [['#2a1c78', 9, 0.16], ['#0b4f63', 7, 0.13], ['#5c1650', 6, 0.12], ['#47300f', 3, 0.09]];
    for (const [col, n, amax] of blobs) {
      for (let i = 0; i < n; i++) {
        const x = rng.range(0, N), y = rng.range(0, N), r = rng.range(70, 210), a = rng.range(amax * 0.5, amax);
        for (const ox of [-N, 0, N]) {
          for (const oy of [-N, 0, N]) {
            const cx = x + ox, cy = y + oy;
            if (cx + r < 0 || cx - r > N || cy + r < 0 || cy - r > N) continue;
            const gr = g.createRadialGradient(cx, cy, 0, cx, cy, r);
            gr.addColorStop(0, rgba(col, a));
            gr.addColorStop(1, rgba(col, 0));
            g.fillStyle = gr;
            g.fillRect(cx - r, cy - r, r * 2, r * 2);
          }
        }
      }
    }
    this.neb = c;
    const cols = ['#ffffff', '#cfe2ff', '#ffe9c4', '#b9c8ff'];
    const layer = (n, par, T, z0, z1, a0, a1, tw) => {
      const groups = cols.map((color) => ({ color, stars: [] }));
      for (let i = 0; i < n; i++) {
        groups[rng.int(0, cols.length - 1)].stars.push({ u: rng.next(), v: rng.next(), z: rng.range(z0, z1), a: rng.range(a0, a1), tw: tw ? rng.range(1.5, 4) : 0, ph: rng.range(0, TAU) });
      }
      return { par, T, groups };
    };
    this.layers = [layer(120, 0.05, 800, 0.7, 1.3, 0.25, 0.7, false), layer(55, 0.16, 760, 1.0, 1.8, 0.4, 0.9, true), layer(22, 0.38, 720, 1.6, 2.5, 0.55, 1, true)];
    this.dust = layer(40, 1, 560, 1.2, 2.2, 0.07, 0.18, false);
  },

  // ---------------------------------------------------------------- frame
  draw() {
    const ctx = this.ctx;
    if (!G.player) return;
    const s = G.s;
    const sh = FX.shakeOffset(G.timeR);
    G.offX = G.pxW / 2 - (G.cam.x + sh[0]) * s;
    G.offY = G.pxH / 2 - (G.cam.y + sh[1]) * s;
    this.ox = G.offX;
    this.oy = G.offY;
    const hw = G.W / 2 + 70, hh = G.H / 2 + 70;
    this.bx0 = G.cam.x - hw; this.bx1 = G.cam.x + hw;
    this.by0 = G.cam.y - hh; this.by1 = G.cam.y + hh;
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    this.drawSky();
    this.W();
    this.drawBeams();
    this.drawGems();
    ctx.globalCompositeOperation = 'lighter';
    this.drawTrails();
    this.drawAuras();
    this.drawTelegraphs();
    ctx.globalCompositeOperation = 'source-over';
    this.drawOrbitRings();
    this.drawEnemies();
    this.drawBoss();
    this.drawShots();
    this.drawMoons();
    this.drawLinks();
    this.drawFalls();
    this.drawPlayer();
    this.drawDrops();
    this.drawFX();
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    this.drawScreen();
  },

  W() { this.ctx.setTransform(G.s, 0, 0, G.s, this.ox, this.oy); },
  TR(x, y, a) {
    const s = G.s, c = Math.cos(a) * s, n = Math.sin(a) * s;
    this.ctx.setTransform(c, n, -n, c, this.ox + x * s, this.oy + y * s);
  },
  vis(x, y, m) { return x > this.bx0 - m && x < this.bx1 + m && y > this.by0 - m && y < this.by1 + m; },

  drawSky() {
    const ctx = this.ctx, s = G.s, W = G.pxW, H = G.pxH;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    const NT = 1500 * s, npar = 0.04;
    const nx = fmod(W / 2 - G.cam.x * npar * s, NT) - NT, ny = fmod(H / 2 - G.cam.y * npar * s, NT) - NT;
    for (let x = nx; x < W; x += NT) for (let y = ny; y < H; y += NT) ctx.drawImage(this.neb, x, y, NT + 1, NT + 1);
    const dpr = G.s / G.css, t = G.timeR;
    const all = this.layers.concat([this.dust]);
    for (let li = 0; li < all.length; li++) {
      const L = all[li], T = L.T * s;
      const bx = W / 2 - G.cam.x * L.par * s, by = H / 2 - G.cam.y * L.par * s;
      for (const grp of L.groups) {
        ctx.fillStyle = grp.color;
        for (const st of grp.stars) {
          const x0 = fmod(bx + st.u * T, T), y0 = fmod(by + st.v * T, T);
          let a = st.a;
          if (st.tw) a *= 0.6 + 0.4 * Math.sin(t * st.tw + st.ph);
          ctx.globalAlpha = a;
          const z = st.z * (li === 3 ? s : dpr);
          for (let x = x0; x < W; x += T) for (let y = y0; y < H; y += T) ctx.fillRect(x - z / 2, y - z / 2, z, z);
        }
      }
    }
    // a soft halo on the nearest layer of stars
    const L = this.layers[2], T = L.T * s, g = this.glow('#cfe2ff');
    const bx = W / 2 - G.cam.x * L.par * s, by = H / 2 - G.cam.y * L.par * s;
    ctx.globalCompositeOperation = 'lighter';
    for (const grp of L.groups) {
      for (const st of grp.stars) {
        const x0 = fmod(bx + st.u * T, T), y0 = fmod(by + st.v * T, T), z = st.z * dpr * 7;
        ctx.globalAlpha = st.a * 0.35;
        for (let x = x0; x < W; x += T) for (let y = y0; y < H; y += T) ctx.drawImage(g, x - z / 2, y - z / 2, z, z);
      }
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
  },

  drawBeams() {
    const ctx = this.ctx, t = G.timeR;
    ctx.globalCompositeOperation = 'lighter';
    for (const d of G.drops) {
      if (d.kind !== 'chest' || !this.vis(d.x, d.y, 200)) continue;
      ctx.globalAlpha = 0.55 + 0.2 * Math.sin(t * 3);
      ctx.drawImage(this.beamSpr, d.x - 14, d.y - 150, 28, 160);
      const g = this.glow(PAL.sun);
      ctx.globalAlpha = 0.45;
      ctx.drawImage(g, d.x - 40, d.y - 30, 80, 60);
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
  },

  drawGems() {
    const ctx = this.ctx, sz = [13, 18, 26], spr = this.gemSpr;
    for (const g of G.gems) {
      if (g.x < this.bx0 || g.x > this.bx1 || g.y < this.by0 || g.y > this.by1) continue;
      const S = sz[g.kind];
      ctx.drawImage(spr[g.kind], g.x - S / 2, g.y - S / 2, S, S);
    }
  },

  drawTrails() {
    const ctx = this.ctx, R = G.run;
    if (!R || !R.up.comet || !G.player.alive) return;
    const now = G.timeW, life = 0.4 + 0.15 * R.up.comet;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#ff8a3d';
    const w = 4 + 2 * R.up.comet;
    for (const tr of R.trails.values()) {
      for (let i = 1; i < tr.length; i++) {
        const p = tr[i], q = tr[i - 1], k = 1 - (now - p.t) / life;
        if (k <= 0) continue;
        ctx.globalAlpha = 0.4 * k;
        ctx.lineWidth = w * (0.4 + 0.6 * k);
        ctx.beginPath();
        ctx.moveTo(q.x, q.y);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
  },

  drawAuras() {
    const ctx = this.ctx, R = G.run, P = G.player, O = G.orbit, t = G.timeR;
    if (!R || !P.alive || !O) return;
    if (R.up.corona) {
      const rad = P.r + 14 + 7 * R.up.corona;
      const g = this.glow('#ff6a2a'), f = 1 + 0.08 * Math.sin(t * 17) + 0.05 * Math.sin(t * 7.3);
      ctx.globalAlpha = 0.5;
      const S = rad * 2.6 * f;
      ctx.drawImage(g, P.x - S / 2, P.y - S / 2, S, S);
      ctx.strokeStyle = '#ffb26a';
      ctx.lineWidth = 2;
      ctx.globalAlpha = 0.35;
      ctx.setLineDash([5, 7]);
      ctx.lineDashOffset = -t * 30;
      ctx.beginPath();
      ctx.arc(P.x, P.y, rad, 0, TAU);
      ctx.stroke();
      ctx.setLineDash([]);
    }
    if (R.up.well) {
      const reach = O.r1 * 1.9 + 24;
      ctx.strokeStyle = PAL.lilac;
      ctx.lineWidth = 2;
      for (let i = 0; i < 3; i++) {
        const a = -t * 1.4 + (i * TAU) / 3;
        ctx.globalAlpha = 0.2;
        ctx.beginPath();
        ctx.arc(P.x, P.y, reach, a, a + 1.1);
        ctx.stroke();
        ctx.globalAlpha = 0.12;
        ctx.beginPath();
        ctx.arc(P.x, P.y, reach * 0.8, a + 0.6, a + 1.4);
        ctx.stroke();
      }
    }
    if (P.novaT > 0) {
      const k = P.novaT / NOVA_DUR, g = this.glow('#ffe7b0'), S = O.r1 * 2.6;
      ctx.globalAlpha = 0.5 * k;
      ctx.drawImage(g, P.x - S / 2, P.y - S / 2, S, S);
    }
    ctx.globalAlpha = 1;
  },

  drawTelegraphs() {
    const ctx = this.ctx, t = G.timeR;
    ctx.lineCap = 'round';
    for (const e of G.enemies) {
      if (!this.vis(e.x, e.y, 320)) continue;
      if (e.type === 'lancer' && e.state === 'aim') {
        const k = 1 - e.tm / 0.9, locked = e.tm <= 0.25;
        const len = 300 * Math.min(1, k * 2.2);
        ctx.strokeStyle = locked ? '#ffd0dc' : PAL.danger;
        ctx.globalAlpha = locked ? 0.65 + 0.35 * Math.sin(t * 60) : 0.18 + 0.4 * k;
        ctx.lineWidth = locked ? 3 : 1.6;
        ctx.beginPath();
        ctx.moveTo(e.x + e.lx * e.r, e.y + e.ly * e.r);
        ctx.lineTo(e.x + e.lx * len, e.y + e.ly * len);
        ctx.stroke();
      } else if (e.type === 'lancer' && e.state === 'dash') {
        ctx.strokeStyle = PAL.danger;
        ctx.globalAlpha = 0.5;
        ctx.lineWidth = e.r * 1.2;
        ctx.beginPath();
        ctx.moveTo(e.x, e.y);
        ctx.lineTo(e.x - e.lx * 60, e.y - e.ly * 60);
        ctx.stroke();
      } else if (e.type === 'spitter' && e.tm < 0.45) {
        const g = this.glow(PAL.danger), S = 14 + 30 * (1 - e.tm / 0.45);
        const mx = e.x + Math.cos(e.ang) * e.r, my = e.y + Math.sin(e.ang) * e.r;
        ctx.globalAlpha = 0.8;
        ctx.drawImage(g, mx - S / 2, my - S / 2, S, S);
      }
      if (e.elite) {
        const g = this.glow(PAL.sun), S = e.d.size * 1.4 * 2.1;
        ctx.globalAlpha = 0.5 + 0.15 * Math.sin(t * 5 + e.phase);
        ctx.drawImage(g, e.x - S / 2, e.y - S / 2, S, S);
      }
      if (e.slowUntil > G.timeW) {
        const g = this.glow(PAL.frost), S = e.d.size * 1.6;
        ctx.globalAlpha = 0.4;
        ctx.drawImage(g, e.x - S / 2, e.y - S / 2, S, S);
      }
    }
    const b = G.boss;
    if (b && !b.dead) {
      if (b.state === 'aim') {
        const k = 1 - b.tm / 1.0, len = 700;
        this.TR(b.x, b.y, Math.atan2(b.ly, b.lx));
        ctx.fillStyle = PAL.danger;
        ctx.globalAlpha = 0.08 + 0.22 * k + (b.tm < 0.3 ? 0.2 * Math.sin(t * 50) : 0);
        ctx.fillRect(0, -b.r, len, b.r * 2);
        ctx.globalAlpha = 0.5 + 0.4 * k;
        ctx.fillRect(0, -1.5, len * Math.min(1, k * 1.5), 3);
        this.W();
      }
      const g = this.glow(PAL.danger), S = b.r * 4.2;
      ctx.globalAlpha = 0.55 + 0.1 * Math.sin(t * 4);
      ctx.drawImage(g, b.x - S / 2, b.y - S / 2, S, S);
    }
    ctx.globalAlpha = 1;
  },

  drawOrbitRings() {
    const ctx = this.ctx, P = G.player, O = G.orbit;
    if (!O || !P.alive) return;
    ctx.strokeStyle = PAL.brass;
    const ring = (r, rot, alpha) => {
      ctx.lineWidth = 1.2;
      ctx.globalAlpha = alpha;
      ctx.beginPath();
      ctx.arc(P.x, P.y, r, 0, TAU);
      ctx.stroke();
      ctx.beginPath();
      const n = 48;
      for (let i = 0; i < n; i++) {
        const a = rot + (i * TAU) / n, L = i % 4 === 0 ? 5 : 2.2;
        const c = Math.cos(a), s = Math.sin(a);
        ctx.moveTo(P.x + c * (r - L), P.y + s * (r - L));
        ctx.lineTo(P.x + c * (r + L), P.y + s * (r + L));
      }
      ctx.globalAlpha = alpha * 0.8;
      ctx.stroke();
    };
    const a = 0.12 + 0.2 * P.wideK;
    ring(O.r1, P.a1 * 0.12, a);
    if (O.n2) ring(O.r2, P.a2 * 0.12, a * 0.8);
    ctx.globalAlpha = 1;
  },

  drawEnemies() {
    const ctx = this.ctx, t = G.timeW;
    for (const e of G.enemies) {
      if (e.x < this.bx0 || e.x > this.bx1 || e.y < this.by0 || e.y > this.by1) continue;
      const img = Assets.enemies[e.type];
      if (!img) continue;
      let S = e.d.size * (e.elite ? 1.4 : 1);
      if (e.type === 'mite' || e.type === 'splitter') S *= 1 + 0.06 * Math.sin(t * 9 + e.phase);
      this.TR(e.x, e.y, e.ang);
      ctx.drawImage(img, -S / 2, -S / 2, S, S);
      if (e.flash > 0.04) {
        ctx.globalAlpha = Math.min(1, e.flash) * 0.5;
        ctx.drawImage(Assets.white[e.type], -S / 2, -S / 2, S, S);
        ctx.globalAlpha = 1;
      }
    }
    this.W();
    // health bars on elites
    for (const e of G.enemies) {
      if (!e.elite || e.hp >= e.maxHp || !this.vis(e.x, e.y, 20)) continue;
      const w = 34, y = e.y - e.r - 12;
      ctx.fillStyle = 'rgba(4,5,13,0.8)';
      ctx.fillRect(e.x - w / 2 - 1, y - 1, w + 2, 5);
      ctx.fillStyle = PAL.sun;
      ctx.fillRect(e.x - w / 2, y, w * Math.max(0, e.hp / e.maxHp), 3);
    }
  },

  drawBoss() {
    const ctx = this.ctx, b = G.boss;
    if (!b || b.dead) return;
    for (const m of b.moons) ctx.drawImage(this.darkSpr, m.x - 26, m.y - 26, 52, 52);
    const img = Assets.enemies.boss;
    if (!img) return;
    const S = b.r * 2.3;
    this.TR(b.x, b.y, b.spin);
    ctx.drawImage(img, -S / 2, -S / 2, S, S);
    if (b.flash > 0.04) {
      ctx.globalAlpha = Math.min(1, b.flash) * 0.35;
      ctx.drawImage(Assets.white.boss, -S / 2, -S / 2, S, S);
      ctx.globalAlpha = 1;
    }
    this.W();
  },

  drawShots() {
    const ctx = this.ctx;
    if (!G.shots.length) return;
    ctx.globalCompositeOperation = 'lighter';
    for (const s of G.shots) {
      if (!this.vis(s.x, s.y, 20)) continue;
      const S = s.r * 4.2;
      ctx.drawImage(this.shotSpr, s.x - S / 2, s.y - S / 2, S, S);
    }
    ctx.globalCompositeOperation = 'source-over';
  },

  drawMoons() {
    const ctx = this.ctx, P = G.player, O = G.orbit;
    if (!O || !P.alive || !G.moons.length) return;
    const nova = P.novaT > 0;
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    const segs = 6;
    for (const m of G.moons) {
      const r = m.ring === 1 ? O.r1 : O.r2, dir = m.ring === 1 ? 1 : -1;
      const a = Math.atan2(m.y - P.y, m.x - P.x);
      const n = m.ring === 1 ? O.n1 : O.n2;
      const span = Math.min(0.5, O.spin * (m.ring === 1 ? 1 : 0.82) * 0.11, 2.6 / n);
      ctx.strokeStyle = SKIN_GLOW[m.skin];
      for (let j = 0; j < segs; j++) {
        const a0 = a - (dir * span * j) / segs, a1 = a - (dir * span * (j + 1)) / segs;
        ctx.globalAlpha = (nova ? 0.55 : 0.24) * (1 - j / segs);
        ctx.lineWidth = m.r * 1.5 * (1 - j / (segs + 1));
        ctx.beginPath();
        ctx.arc(P.x, P.y, r, Math.min(a0, a1), Math.max(a0, a1));
        ctx.stroke();
      }
      const g = this.glow(SKIN_GLOW[m.skin]), S = m.r * (nova ? 6 : 3.6);
      ctx.globalAlpha = nova ? 0.9 : 0.42;
      ctx.drawImage(g, m.x - S / 2, m.y - S / 2, S, S);
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    for (const m of G.moons) {
      const img = Assets.planets[m.skin];
      if (!img) continue;
      const S = m.r * 2.29;
      ctx.drawImage(img, m.x - S / 2, m.y - S / 2, S, S);
    }
  },

  drawLinks() {
    const ctx = this.ctx, R = G.run, P = G.player;
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    if (R && R.up.tesla && P.alive) {
      const ring = G.moons.filter((m) => m.ring === 1);
      if (ring.length > 1) {
        ctx.strokeStyle = '#bfe9ff';
        for (let k = 0; k < ring.length; k++) {
          const a = ring[k], b = ring[(k + 1) % ring.length];
          ctx.globalAlpha = 0.5 + 0.4 * Math.random();
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          const nx = -(b.y - a.y), ny = b.x - a.x, l = Math.hypot(nx, ny) || 1;
          for (let i = 1; i < 5; i++) {
            const q = i / 5, o = rnd(-6, 6);
            ctx.lineTo(lerp(a.x, b.x, q) + (nx / l) * o, lerp(a.y, b.y, q) + (ny / l) * o);
          }
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }
      }
    }
    for (const b of G.bolts) {
      const k = 1 - b.t / b.life;
      ctx.strokeStyle = '#c8ecff';
      ctx.globalAlpha = k;
      ctx.lineWidth = 1 + 2.5 * k;
      ctx.beginPath();
      ctx.moveTo(b.pts[0], b.pts[1]);
      for (let i = 2; i < b.pts.length; i += 2) ctx.lineTo(b.pts[i], b.pts[i + 1]);
      ctx.stroke();
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
  },

  drawFalls() {
    const ctx = this.ctx;
    if (!G.falls.length) return;
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    for (const f of G.falls) {
      const tr = f.trail;
      ctx.strokeStyle = f.burn ? '#ff8a3d' : SKIN_GLOW[f.skin];
      for (let i = 2; i < tr.length; i += 2) {
        const k = i / tr.length;
        ctx.globalAlpha = 0.5 * k;
        ctx.lineWidth = f.r * 1.6 * k;
        ctx.beginPath();
        ctx.moveTo(tr[i - 2], tr[i - 1]);
        ctx.lineTo(tr[i], tr[i + 1]);
        ctx.stroke();
      }
      const g = this.glow(f.burn ? '#ff8a3d' : SKIN_GLOW[f.skin]), S = f.r * 4;
      ctx.globalAlpha = 0.7;
      ctx.drawImage(g, f.x - S / 2, f.y - S / 2, S, S);
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    for (const f of G.falls) {
      const img = Assets.planets[f.skin];
      if (!img) continue;
      const S = f.r * 2.29;
      this.TR(f.x, f.y, f.t * 9);
      ctx.drawImage(img, -S / 2, -S / 2, S, S);
    }
    this.W();
  },

  drawPlayer() {
    const ctx = this.ctx, P = G.player, R = G.run;
    if (!P.alive) return;
    const st = STARS[R.star], img = Assets.stars[R.star], t = G.timeR, r = P.r;
    const blink = P.inv > G.timeW && P.novaT <= 0 && ((t * 12) | 0) % 2 === 0;
    ctx.globalCompositeOperation = 'lighter';
    const pulse = 1 + 0.06 * Math.sin(t * 3.1);
    const g = this.glow(st.glow);
    let S = r * 10 * pulse;
    ctx.globalAlpha = 0.6;
    ctx.drawImage(g, P.x - S / 2, P.y - S / 2, S, S);
    const rl = r * 7.5;
    for (let i = 0; i < 2; i++) {
      this.TR(P.x, P.y, t * 0.22 + i * Math.PI / 2 + Math.PI / 4);
      ctx.globalAlpha = 0.32;
      ctx.drawImage(this.raySpr, -rl / 2, -2.5, rl, 5);
    }
    this.TR(P.x, P.y, -t * 0.15);
    ctx.globalAlpha = 0.18;
    ctx.drawImage(this.raySpr, -rl * 0.35, -1.5, rl * 0.7, 3);
    this.W();
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = blink ? 0.4 : 1;
    S = r * 2.84;
    if (img) ctx.drawImage(img, P.x - S / 2, P.y - S / 2, S, S);
    if (P.hurt > 0.02 && Assets.white['star_' + R.star]) {
      ctx.globalAlpha = P.hurt * 0.85;
      ctx.drawImage(Assets.white['star_' + R.star], P.x - S / 2, P.y - S / 2, S, S);
    }
    ctx.globalAlpha = 1;
    // a small health bar under the star once it has taken damage
    if (!G.attract && R.hp < R.maxHp) {
      const w = 34, y = P.y + r + 9, k = Math.max(0, R.hp / R.maxHp);
      ctx.fillStyle = 'rgba(4,5,13,0.75)';
      ctx.fillRect(P.x - w / 2 - 1, y - 1, w + 2, 5);
      ctx.fillStyle = k < 0.3 ? '#ff2a55' : '#ff7a95';
      ctx.fillRect(P.x - w / 2, y, w * k, 3);
    }
  },

  drawDrops() {
    const ctx = this.ctx, t = G.timeR;
    for (const d of G.drops) {
      if (!this.vis(d.x, d.y, 30)) continue;
      const bob = Math.sin(t * 3 + d.x * 0.01) * 3;
      if (d.kind === 'chest') {
        const S = d.boss ? 56 : 46;
        if (Assets.chest) ctx.drawImage(Assets.chest, d.x - S / 2, d.y - S / 2 + bob - 4, S, S);
      } else if (d.kind === 'heart') {
        ctx.drawImage(this.heartSpr, d.x - 16, d.y - 16 + bob, 32, 32);
      } else {
        this.TR(d.x, d.y + bob, t * 1.5);
        ctx.drawImage(this.lightSpr, -17, -17, 34, 34);
        this.W();
      }
    }
  },

  drawFX() {
    const ctx = this.ctx;
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    for (const p of FX.pool) {
      if (!p.on) continue;
      const k = p.t / p.life;
      if (p.type === 'ring') {
        const r = lerp(p.r0, p.r1, easeOutCubic(k));
        ctx.globalAlpha = (1 - k) * 0.9;
        ctx.strokeStyle = p.color;
        ctx.lineWidth = p.w * (1 - k * 0.7);
        ctx.beginPath();
        ctx.arc(p.x, p.y, r, 0, TAU);
        ctx.stroke();
        continue;
      }
      if (p.x < this.bx0 || p.x > this.bx1 || p.y < this.by0 || p.y > this.by1) continue;
      ctx.globalAlpha = 1 - k;
      if (p.type === 'spark') {
        ctx.strokeStyle = p.color;
        ctx.lineWidth = p.size * (1 - k * 0.6);
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x - p.vx * 0.035, p.y - p.vy * 0.035);
        ctx.stroke();
      } else {
        const z = p.size * (1 - k * 0.5);
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - z / 2, p.y - z / 2, z, z);
      }
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
  },

  // ---------------------------------------------------------------- screen space
  drawScreen() {
    const ctx = this.ctx, dpr = G.s / G.css, s = G.s;
    // floating numbers and words
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    for (const q of FX.pops) {
      const sx = this.ox + q.x * s, sy = this.oy + q.y * s;
      const k = q.t / q.life;
      const a = k > 0.7 ? (1 - k) / 0.3 : 1;
      const sc = q.t < 0.08 ? 1 + (1 - q.t / 0.08) * 0.6 : 1;
      const px = Math.max(8, Math.round(q.size * dpr * sc));
      ctx.font = q.big ? '600 ' + px + 'px Cinzel, Georgia, serif' : '700 ' + px + 'px Jost, system-ui, sans-serif';
      ctx.globalAlpha = a;
      ctx.lineWidth = Math.max(2, px * 0.22);
      ctx.strokeStyle = 'rgba(4,5,13,0.85)';
      ctx.strokeText(q.text, sx, sy);
      ctx.fillStyle = q.color;
      ctx.fillText(q.text, sx, sy);
    }
    ctx.globalAlpha = 1;
    if (!G.run || G.attract || !G.player.alive) return;
    // arrows toward off-screen chests and bosses
    const targets = [];
    for (const d of G.drops) if (d.kind === 'chest') targets.push([d.x, d.y, PAL.sun, true]);
    if (G.boss && !G.boss.dead) targets.push([G.boss.x, G.boss.y, PAL.danger, false]);
    const pad = 26 * dpr, padTop = (UI.hudBottom || 80) * dpr + 14 * dpr;
    for (const [x, y, col, chest] of targets) {
      const sx = this.ox + x * s, sy = this.oy + y * s;
      if (sx > 0 && sx < G.pxW && sy > padTop - 20 * dpr && sy < G.pxH) continue;
      const cx = G.pxW / 2, cy = G.pxH / 2, dx = sx - cx, dy = sy - cy;
      let k = Infinity;
      if (dx > 0) k = Math.min(k, (G.pxW - pad - cx) / dx); else if (dx < 0) k = Math.min(k, (pad - cx) / dx);
      if (dy > 0) k = Math.min(k, (G.pxH - pad - cy) / dy); else if (dy < 0) k = Math.min(k, (padTop - cy) / dy);
      if (!isFinite(k)) continue;
      const ix = cx + dx * k, iy = cy + dy * k, a = Math.atan2(dy, dx), c = Math.cos(a), n = Math.sin(a);
      const bob = 1 + 0.12 * Math.sin(G.timeR * 6);
      ctx.setTransform(c * dpr * bob, n * dpr * bob, -n * dpr * bob, c * dpr * bob, ix, iy);
      ctx.globalAlpha = 0.95;
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.moveTo(11, 0); ctx.lineTo(-7, -9); ctx.lineTo(-3, 0); ctx.lineTo(-7, 9);
      ctx.closePath();
      ctx.fill();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      if (chest && Assets.chest) {
        const z = 26 * dpr;
        ctx.drawImage(Assets.chest, ix - c * 20 * dpr - z / 2, iy - n * 20 * dpr - z / 2, z, z);
      }
    }
    // the edges glow red when health runs low
    if (G.run.hp < G.run.maxHp * 0.3 && G.state === 'play') {
      const W = G.pxW, H = G.pxH, a = 0.22 + 0.14 * Math.sin(G.timeR * 5);
      const gr = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
      gr.addColorStop(0, 'rgba(255,42,85,0)');
      gr.addColorStop(1, 'rgba(255,42,85,' + a.toFixed(3) + ')');
      ctx.fillStyle = gr;
      ctx.fillRect(0, 0, W, H);
    }
    ctx.globalAlpha = 1;
  },
};

const UI = {
  e: {}, cache: {}, hintTimer: 0, guardUntil: 0, sheetKind: null, resetArmed: false, hudBottom: 80,
  lvCards: [], lvLockUntil: 0, chestState: null, runBest: 0, passedBest: false,

  init() {
    const ids = ['hud', 'h-hp', 'h-hpfill', 'h-hplag', 'h-hptxt', 'h-time', 'h-lv', 'h-xp', 'h-kills', 'b-pause', 'boss', 'b-nova', 'banner', 'hint', 'toasts', 'joy', 'j-knob',

    click(E['b-play'], () => this.play());
    click(E['b-shop'], () => this.openSheet('shop'));
    click(E['b-records'], () => this.openSheet('records'));
    click(E['b-help'], () => this.openSheet('help'));
    click(E['b-settings'], () => this.openSheet('settings'));
    click(E['b-retry'], () => this.retry());
    click(E['b-menu'], () => this.toMenu());
    click(E['b-pause'], () => this.pause());
    click(E['b-resume'], () => this.resume());
    click(E['b-restart'], () => { this.hide('pause'); this.play(); });
    click(E['b-quit'], () => { this.hide('pause'); this.toMenu(); });

  show(id) { this.e[id].hidden = false; },

    for (const id of ['over', 'pause', 'hud', 'levelup', 'chest']) this.hide(id);

  onRunStart() {

    this.e['b-nova'].hidden = false;

  // ---------------------------------------------------------- HUD
  frame() {
    const R = G.run;
    if (!R || G.attract) return;
    const st = G.state;
    if (st === 'play' || st === 'dying' || st === 'paused' || st === 'levelup' || st === 'chest') this.updateHud();
  },

  updateHud() {
    const R = G.run, E = this.e, C = this.cache;
    const t = Math.floor(R.time);
    if (C.t !== t) {
      C.t = t;
      E['h-time'].textContent = fmtClock(t);

        E['h-time'].classList.add('best');

  },

  health() {
    const R = G.run;

    const hp = Math.max(0, Math.ceil(R.hp)), key = hp + '/' + R.maxHp;
    if (this.cache.hp === key) return;
    const prev = this.cache.hpN, E = this.e;
    this.cache.hp = key;
    this.cache.hpN = hp;
    const w = ((100 * Math.max(0, R.hp)) / R.maxHp).toFixed(1) + '%';
    E['h-hpfill'].style.width = w;
    E['h-hplag'].style.width = w;
    E['h-hptxt'].textContent = hp;

  novaReady(on) { this.e['b-nova'].classList.toggle('ready', !!on); },

  bossBar(b) {
