<script>
/*! © 2026 Asaf. All rights reserved. Free to play; not to be copied or claimed as your own. */
(function () {
  'use strict';
  var CFG = {"id": "nightmare-sleepover", "owner": "Asaf", "year": 2026, "mark": "br", "dx": 0, "dy": 0, "mount": null, "hubCss": null};
  var NOTICE = '© ' + CFG.year + ' ' + CFG.owner;

  // Inside Asaf's Arcade the game runs in a frame of the arcade page: borrow its cloud saves, let it show the notice.
  var hub = null;
  try {
    var P = window.parent;
    if (P && P !== window && P.__ASAF_ARCADE__ && P.__ASAF_ARCADE__.v === 1) hub = P.__ASAF_ARCADE__;
  } catch (e) { hub = null; }
  window.__ASAF_HUB__ = !!hub;
  if (hub) {
    window.__asafClaude = makeClaude(hub, CFG.id);
    if (CFG.hubCss) {
      var hs = document.createElement('style');
      hs.textContent = CFG.hubCss;
      (document.head || document.documentElement).appendChild(hs);
    }
    return;
  }

  // ---- played on its own: a small permanent tag plus a short notice when the game opens
  var css = '' +
    '#asaf-cr{all:initial;position:fixed;z-index:2147483646;display:block;box-sizing:border-box;pointer-events:none;user-select:none;-webkit-user-select:none;' +
    'font:600 10px/1 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;letter-spacing:.04em;color:rgba(255,255,255,.88);' +
    'background:rgba(6,6,16,.52);padding:4px 8px;border-radius:999px;white-space:nowrap;opacity:.82;transition:opacity .7s ease}' +
    '#asaf-cr.asaf-busy{opacity:.14}' +
    '#asaf-cr-toast{all:initial;position:fixed;z-index:2147483647;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));display:block;box-sizing:border-box;' +
    'transform:translateX(-50%);pointer-events:none;user-select:none;-webkit-user-select:none;width:max-content;max-width:min(90vw,430px);' +
    'font:500 12.5px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#fff;text-align:center;' +
    'background:rgba(8,8,20,.9);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:9px 15px;box-shadow:0 10px 30px rgba(0,0,0,.5);' +
    'opacity:0;animation:asafCrIn .45s ease .6s forwards,asafCrOut .6s ease 5.2s forwards}' +
    '#asaf-cr-toast b{all:unset;font-weight:800}' +
    '#asaf-cr-toast i{all:unset;display:block;margin-top:2px;font-size:11.5px;opacity:.78}' +
    '@keyframes asafCrIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}' +
    '@keyframes asafCrOut{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,0)}}';
  var st = document.createElement('style');
  st.id = 'asaf-cr-style';
  st.textContent = css;
  (document.head || document.documentElement).appendChild(st);

  var dx = 6 + (CFG.dx || 0), dy = 6 + (CFG.dy || 0);
  var T = 'top:calc(' + dy + 'px + env(safe-area-inset-top,0px));';
  var B = 'bottom:calc(' + dy + 'px + env(safe-area-inset-bottom,0px));';
  var L = 'left:calc(' + dx + 'px + env(safe-area-inset-left,0px));';
  var R = 'right:calc(' + dx + 'px + env(safe-area-inset-right,0px));';
  var C = 'left:50%;transform:translateX(-50%);';
  var POS = { tl: T + L, tr: T + R, bl: B + L, br: B + R, tc: T + C, bc: B + C };

  var tag = document.createElement('div');
  tag.id = 'asaf-cr';
  tag.setAttribute('role', 'note');
  tag.setAttribute('aria-label', NOTICE + '. All rights reserved.');
  tag.textContent = NOTICE;
  tag.style.cssText = POS[CFG.mark] || POS.br;

  var toast = document.createElement('div');
  toast.id = 'asaf-cr-toast';
  toast.setAttribute('aria-hidden', 'true');
  var b = document.createElement('b'); b.textContent = NOTICE + ' · All rights reserved';
  var i = document.createElement('i'); i.textContent = 'Free to play. Please don’t copy it or claim it as your own.';
  toast.appendChild(b); toast.appendChild(i);
  setTimeout(function () { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 6200);

  function home() {
    if (CFG.mount) { var m = document.querySelector(CFG.mount); if (m) return m; }
    return document.documentElement;
  }
  function mount() {
    var h = home();
    if (tag.parentNode !== h) h.appendChild(tag);
  }
  function start() {
    mount();
    home().appendChild(toast);
    setInterval(mount, 2500);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();

  // fade the tag while someone is actively playing, bring it back when they pause
  var idle = 0;
  function busy() {
    tag.classList.add('asaf-busy');
    clearTimeout(idle);
    idle = setTimeout(function () { tag.classList.remove('asaf-busy'); }, 2600);
  }
  ['pointerdown', 'keydown', 'touchstart', 'wheel'].forEach(function (ev) {
    window.addEventListener(ev, busy, { capture: true, passive: true });
  });

  // ---- cloud saves through the arcade page (strings only cross between the two pages)
  function makeClaude(H, gid) {
    var cache = {};
    function fail(code) { var e = new Error(code || 'unavailable'); e.code = code || 'unavailable'; return e; }
    function call(fn, args) {
      return new Promise(function (res, rej) {
        var p;
        try { p = H[fn].apply(null, [gid].concat(args || [])); } catch (e) { rej(fail('unavailable')); return; }
        Promise.resolve(p).then(function (s) {
          var r;
          try { r = JSON.parse(s); } catch (e) { rej(fail('internal')); return; }
          if (r && r.ok) res(r.v); else rej(fail(r && r.code));
        }, function () { rej(fail('unavailable')); });
      });
    }
    function snap(path, v) {
      var parts = path.split('/');
      return { id: parts[parts.length - 1], exists: v !== null && v !== undefined,
        data: function () { return v === null || v === undefined ? undefined : JSON.parse(JSON.stringify(v)); } };
    }
    function doc(path) {
      return {
        id: path.split('/').pop(), path: path,
        get: function () { return call('get', [path]).then(function (v) { return snap(path, v); }); },
        set: function (data) { return call('set', [path, JSON.stringify(data)]).then(function () {}); }
      };
    }
    function query(path, lim) {
      return {
        path: path,
        limit: function (n) { return query(path, n); },
        doc: function (id) { return doc(path + '/' + id); },
        onSnapshot: function (next, error) {
          var dead = false, off = null;
          function onErr(code) { if (!dead && typeof error === 'function') error(fail(code)); }
          try {
            off = H.watch(gid, path, lim || 0, function (s) {
              if (dead) return;
              var rows; try { rows = JSON.parse(s); } catch (e) { return; }
              var docs = rows.map(function (d) { return snap(path + '/' + d.id, d.v); });
              next({ docs: docs, size: docs.length, empty: !docs.length, forEach: function (f) { docs.forEach(f); } });
            }, onErr);
          } catch (e) { setTimeout(function () { onErr('unavailable'); }, 0); }
          return function () { dead = true; try { if (off) off(); } catch (e) { /* page gone */ } };
        }
      };
    }
    var db = { doc: doc, collection: function (p) { return query(p, 0); } };
    var user = {
      id: function () { return call('uid', []); },
      me: function () { return call('uid', []).then(function (id) { return { id: id }; }); },
      can: function (n) { return call('can', [String(n)]); },
      profiles: function (ids) { return call('profiles', [JSON.stringify(ids || [])]); },
      isOwner: function () { return false; },
      canEdit: function () { return false; }
    };
    return {
      use: function (name) {
        if (!cache[name]) {
          cache[name] = call('ready', [String(name)]).then(function (ok) {
            if (!ok) return null;
            return name === 'db' ? db : name === 'user' ? user : null;
          }, function () { return null; });
        }
        return cache[name];
      }
    };
  }
})();
</script>

:root {
  /* Look: spooky cartoon. Chunky ink outlines, dark plum panels, slime-green headings, pumpkin buttons, a touch of neon */
  --ink: #0b0612;
  --ol: #12081c;
  --panel: #170d22;
  --panel2: #221333;
  --panel3: #2c1a42;
  --slime: #8bff3d;
  --pink: #ff3ea5;
  --cyan: #34e7ff;
  --pumpkin: #ff8a1f;
  --gold: #ffd23f;
  --red: #ff2d55;
  --text: #f6f0ff;
  --dim: #b4a7cf;
  --moon: var(--gold);
  --teal: var(--cyan);
  --title: 'Luckiest Guy', 'Arial Black', Impact, sans-serif;
  --scary: 'Creepster', 'Luckiest Guy', Impact, sans-serif;
  --body: 'Fredoka', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --outline: 0 3px 0 var(--ol), 2px 0 0 var(--ol), -2px 0 0 var(--ol), 0 -2px 0 var(--ol), 2px 2px 0 var(--ol), -2px 2px 0 var(--ol), 2px -2px 0 var(--ol), -2px -2px 0 var(--ol);
  --outline-s: 0 2px 0 var(--ol), 1.5px 0 0 var(--ol), -1.5px 0 0 var(--ol), 0 -1.5px 0 var(--ol), 1.5px 1.5px 0 var(--ol), -1.5px 1.5px 0 var(--ol);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--ink); color: var(--text); overflow: hidden; }
body { font: 500 15px/1.4 var(--body); touch-action: none; user-select: none; -webkit-user-select: none; overscroll-behavior: none; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--slime); outline-offset: 2px; }
img { -webkit-user-drag: none; }
#cv { position: fixed; inset: 0; display: block; touch-action: none; }

/* ---------- thumb stick */
#stick { position: fixed; left: 0; top: 0; width: 112px; height: 112px; border-radius: 50%; border: 3px solid rgba(18, 8, 28, .8); box-shadow: inset 0 0 0 2px rgba(139, 255, 61, .3), 0 0 18px rgba(139, 255, 61, .15); background: radial-gradient(circle, rgba(139, 255, 61, .07), rgba(11, 6, 18, .25) 70%); pointer-events: none; opacity: 0; transition: opacity .12s; z-index: 5; }
#stick.on { opacity: 1; }
#knob { position: absolute; left: 31px; top: 31px; width: 44px; height: 44px; border-radius: 50%; border: 3px solid var(--ol); background: radial-gradient(circle at 35% 30%, #f2ffe0, #8bff3d 55%, #2c9c2a); box-shadow: 0 4px 0 rgba(0, 0, 0, .45), 0 0 16px rgba(139, 255, 61, .55); }

/* ---------- HUD */
#hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) 0 env(safe-area-inset-left, 0px); }
#hud[hidden] { display: none; }
.xpbar { position: relative; height: 18px; margin: 6px 58px 0 8px; border-radius: 99px; background: #1b0f28; border: 3px solid var(--ol); box-shadow: 0 3px 0 rgba(0, 0, 0, .45), 0 0 12px rgba(139, 255, 61, .18); overflow: hidden; }

/* ---------- title */

}

@media (min-width: 720px) { .cards { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); } }
.card { --c: var(--pumpkin); position: relative; display: grid; grid-template-columns: 60px 1fr; grid-template-rows: auto auto auto; column-gap: 12px; text-align: left; padding: 12px 14px; border-radius: 20px; background: linear-gradient(165deg, #2c1a42, #1a0e27 70%); border: 3px solid var(--ol); box-shadow: inset 0 0 0 2px var(--c), 0 6px 0 rgba(0, 0, 0, .5); box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--c) 70%, transparent), 0 6px 0 rgba(0, 0, 0, .5), 0 0 22px color-mix(in srgb, var(--c) 22%, transparent); animation: rise .3s both cubic-bezier(.2, 1.3, .4, 1); transition: transform .1s, box-shadow .1s; }

.card.new { --c: var(--pink); }
.card.treat { --c: var(--cyan); }
.card.treat.new { --c: var(--slime); }
.card.evo { --c: var(--gold); background: linear-gradient(165deg, #5a3a10, #2a1433 70%); }
.card b { font: 400 20px/1.1 var(--title); letter-spacing: .03em; margin-top: 5px; text-shadow: var(--outline-s); }
.card small { color: #e2d9ff; font-size: 13.5px; line-height: 1.3; }

.card .hint img { grid-row: auto; width: 16px; height: 16px; filter: none; }
.card kbd { position: absolute; right: 10px; top: 8px; font: 400 12px/1 var(--title); color: rgba(255, 255, 255, .35); }
@media (min-width: 720px) {

  .card .hint { justify-content: center; }
}
.lvbtns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.lvbtns .mid { min-width: 120px; }

/* ---------- chest */
.chestbox { margin: auto; width: min(520px, 100%); display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
.chestimg { position: relative; width: 150px; height: 150px; display: grid; place-items: center; animation: shake 1.2s ease-in both; }
.chestimg::before { content: ''; position: absolute; inset: -60px; background: repeating-conic-gradient(from 0deg, rgba(255, 210, 63, .38) 0 10deg, transparent 10deg 26deg); -webkit-mask: radial-gradient(circle, #000, transparent 65%); mask: radial-gradient(circle, #000, transparent 65%); animation: spin 8s linear infinite, fadein .3s 1.15s both; }
.chestimg img { position: relative; width: 150px; height: 150px; }
.citems { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.citem { width: 122px; padding: 10px 8px; border-radius: 18px; display: flex; flex-direction: column; align-items: center; gap: 3px; animation: pop .35s both cubic-bezier(.2, 1.6, .4, 1); }
.citem.evo { box-shadow: inset 0 0 0 2px var(--gold), 0 0 22px rgba(255, 210, 63, .5); }
.citem img { width: 56px; height: 56px; }
.citem b { font-size: 14px; line-height: 1.15; }
.citem small { color: var(--cyan); font-weight: 700; }
.cstars { animation: fadein .3s both; color: var(--gold); font-weight: 700; }

/* ---------- results */
.results.won h2 { color: var(--gold); text-shadow: var(--outline), 0 0 24px rgba(255, 210, 63, .5); }
.results.lost h2 { font-family: var(--scary); letter-spacing: .05em; color: #c98bff; text-shadow: var(--outline), 0 0 24px rgba(180, 90, 255, .5); }
.rstats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.rstats div { padding: 10px 4px; border-radius: 16px; text-align: center; }
.rstats b { display: block; font: 400 19px/1.1 var(--title); letter-spacing: .03em; }
.rstats small { color: var(--dim); font-size: 11.5px; }
.score { text-align: center; color: var(--dim); font-weight: 700; }
.score b { font: 400 36px/1 var(--title); color: var(--gold); margin-left: 6px; text-shadow: var(--outline), 0 0 18px rgba(255, 210, 63, .4); }
.earn { display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: 700; color: var(--gold); }
.earn img { width: 24px; height: 24px; }
.earn small { color: var(--dim); font-weight: 500; }
.newach { text-align: center; font-size: 14px; color: #f2e6ff; }
.newach b { color: var(--gold); }
.dmg { display: grid; gap: 5px; }
.drow { display: grid; grid-template-columns: 28px 1fr 1.2fr auto; align-items: center; gap: 8px; font-size: 13px; }
.drow img { width: 28px; height: 28px; }
.drow .bar { height: 10px; border-radius: 99px; background: #120a1c; border: 2px solid var(--ol); overflow: hidden; }
.drow .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--pumpkin), var(--gold)); transform-origin: left; }
.drow small { color: var(--dim); font-variant-numeric: tabular-nums; }
.brag { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.brag code { font: 700 17px/1 var(--body); letter-spacing: .12em; color: #fff; padding: 9px 12px; border-radius: 12px; background: #0f0818; border: 2.5px solid var(--ol); box-shadow: inset 0 0 0 1.5px rgba(52, 231, 255, .45); user-select: text; -webkit-user-select: text; }
.rbtns { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; }

@keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes rise { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
@keyframes spin { to { transform: rotate(360deg); } }

@media (prefers-reduced-motion: reduce) { *, *::before { animation-duration: .01s !important; animation-iteration-count: 1 !important; transition: none !important; } }

const SAVE_KEY = 'nightmaresleepover.save.v1';
function defaultSave() {

function deepFill(t, d) {
  for (const k in d) {
    if (t[k] === undefined || t[k] === null) t[k] = JSON.parse(JSON.stringify(d[k]));
    else if (d[k] && typeof d[k] === 'object' && !Array.isArray(d[k]) && typeof t[k] === 'object') deepFill(t[k], d[k]);
  }

}
function mergeSaves(a, b) {
  a = deepFill(JSON.parse(JSON.stringify(a)), defaultSave());
  b = deepFill(JSON.parse(JSON.stringify(b)), defaultSave());
  const out = JSON.parse(JSON.stringify((b.updated || 0) > (a.updated || 0) ? b : a));
  for (const k of ['heroes', 'achs']) out[k] = Object.assign({}, a[k], b[k]);
  for (const k of ['kills', 'runs', 'wins', 'starsTotal', 'bestTime', 'bestKills', 'bestLevel', 'bestScore', 'bosses']) out.stats[k] = Math.max(a.stats[k] || 0, b.stats[k] || 0);
  out.stats.evolved = Object.assign({}, a.stats.evolved, b.stats.evolved);
  out.stats.sunrise = Object.assign({}, a.stats.sunrise, b.stats.sunrise);
  for (const s of SHOP) out.shop[s.id] = Math.max(a.shop[s.id] || 0, b.shop[s.id] || 0);
  return out;
}
const Save = {
  data: defaultSave(), cloud: { ref: null, ready: false, writing: false, pending: false, lastJson: '', failed: 0 }, onRemote: null,
  load() { try { const raw = localStorage.getItem(SAVE_KEY); if (raw) this.data = deepFill(JSON.parse(raw), defaultSave()); } catch (e) { /* no storage */ } },
  persistLocal() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(this.data)); } catch (e) { /* ignore */ } },
  persist() { this.data.updated = Date.now(); this.persistLocal(); clearTimeout(this._t); this._t = setTimeout(() => this.cloudWrite(), 900); },
  async cloudInit() {
    try {
      const cl = window.__asafClaude || window.claude;
      if (!cl || typeof cl.use !== 'function') return;
      const [db, user] = await Promise.all([cl.use('db'), cl.use('user')]);
      if (!db || !user) return;
      const id = await user.id();
      if (!id) return;
      const ref = db.doc('data/users/' + id + '/save');
      let timer = 0;
      const snap = await Promise.race([ref.get(), new Promise((_, rej) => { timer = setTimeout(() => rej(new Error('timeout')), 10000); })]);
      clearTimeout(timer);
      this.cloud.ref = ref;
      if (snap && snap.exists) {
        const body = snap.data();
        if (body && body.save) {
          const remote = JSON.parse(JSON.stringify(body.save));
          this.cloud.lastJson = JSON.stringify(remote);
          this.data = mergeSaves(this.data, remote); this.persistLocal();
          if (this.onRemote) this.onRemote();

      }
      this.cloud.ready = true; this.cloudWrite();
    } catch (e) { console.warn('[sleepover] cloud save unavailable:', e && (e.code || e.message)); }
  },
  cloudWrite() {
    const c = this.cloud;
    if (!c.ref || !c.ready) return;
    if (c.writing) { c.pending = true; return; }
    const json = JSON.stringify(this.data);
    if (json === c.lastJson) return;
    c.writing = true;
    c.ref.set({ save: JSON.parse(json) }).then(() => { c.lastJson = json; c.failed = 0; })
      .catch((e) => { const code = e && e.code; c.failed++; if (code === 'unavailable' && c.failed < 3) setTimeout(() => this.cloudWrite(), 2000); else if (code && code !== 'unavailable' && code !== 'resource_exhausted') c.ref = null; })
      .finally(() => { c.writing = false; if (c.pending) { c.pending = false; this.cloudWrite(); } });
  },
  weaponUnlocked(id) { const a = LOCKED_WEAPONS[id]; return !a || !!this.data.achs[a]; },
  heroUnlocked(id) { return !!this.data.heroes[id]; },
};

  // ---- stats: base -> shop (not in the daily) -> hero perk -> passives -> daily twist

  musicLevel() {

  dropPickup(type, x, y, o) {

  // ---------------------------------------------------------------- enemy bullets

  // ---------------------------------------------------------------- level-up cards

    // evolutions first: max-level toy + its passive

            G.P.push({ k: 'band', id: SHOT_ID++, x: p.x, y: p.y, vx: Math.cos(a) * s.speed, vy: Math.sin(a) * s.speed, life: 1.1, bounces: s.bounces, range: s.range, dmg: s.dmg, r: 6, kb: s.kb, src: w.id, last: null, crit: s.crit || 0, delay: i * 0.07 });
          }
          Snd.shoot(w.id);
        }
        break;
      }
      case 'bubbles': case 'foam': {
        w.t -= dt;
        if (w.t <= 0) {
          w.t = s.cd;
          const nb = nearest(p.x, p.y, 1, 320)[0];
          const base = nb ? Math.atan2(nb.y - p.y, nb.x - p.x) : Math.atan2(p.ay, p.ax), n = s.amount, spread = w.id === 'foam' ? 0.7 : 0.32;
          for (let i = 0; i < n; i++) {
            const a = base + (i - (n - 1) / 2) * spread + (Math.random() - 0.5) * 0.12;
            G.P.push({ k: w.id === 'foam' ? 'foam' : 'bubble', id: SHOT_ID++, x: p.x + Math.cos(a) * 14, y: p.y + Math.sin(a) * 14, vx: Math.cos(a) * s.speed, vy: Math.sin(a) * s.speed, life: s.life, max: s.life, r: s.size, dmg: s.dmg, trap: s.trap, slow: s.slow, tick: s.tick, tt: 0, src: w.id, wob: Math.random() * TAU });
          }

        break;
      }
      case 'ball': case 'meteor': {
        w.t -= dt;
        if (w.t <= 0) {
          w.t = s.cd;

            const a = G.rng() * TAU;
            G.P.push({ k: 'ball', id: SHOT_ID++, x: p.x, y: p.y, vx: Math.cos(a) * s.speed, vy: Math.sin(a) * s.speed, life: s.life, r: s.size, dmg: s.dmg, kb: s.kb, hitcd: s.hitcd, src: w.id, trail: s.trail || 0, tt: 0, spin: 0 });

        }
        break;
      }
      case 'flash': case 'lighthouse': {
        const rt = w.rt;
        rt.rot = (rt.rot || 0) + (s.rot || 0) * dt;
        rt.tick = (rt.tick || 0) - dt;
        const doDmg = rt.tick <= 0;
        if (doDmg) rt.tick = s.tick;
        const beams = [];
        beams.push(aimAt(w, dt, s.length + 140, 7));
        if (w.id === 'lighthouse') for (let i = 0; i < 2; i++) beams.push(rt.rot + i * Math.PI);
        rt.beams = beams;
        const L = s.length, half = s.angle / 2;
        Grid.query(p.x, p.y, L + 30, (e) => {
          if (e.hp <= 0) return false;
          const dx = e.x - p.x, dy = e.y - p.y, d = Math.sqrt(dx * dx + dy * dy);
          if (d > L + e.r) return false;
          const ea = Math.atan2(dy, dx), pad = Math.atan2(e.r, Math.max(1, d));
          for (const b of beams) {
            if (Math.abs(angDiff(b, ea)) < half + pad) {
              if (s.slow > e.slow) e.slow = s.slow;
              if (doDmg) Game.hurtEnemy(e, s.dmg, 18, dx, dy, w.id);
              break;
            }
          }
          return false;
        });
        break;
      }
      case 'rockets': case 'fireworks': {
        w.t -= dt;
        if (w.t <= 0) {
          w.t = s.cd;
          const cand = nearest(p.x, p.y, 24, Game.view.r);
          const big = G.E.find((e) => (e.boss || e.elite) && e.hp > 0 && dist2(e.x, e.y, p.x, p.y) < Game.view.r * Game.view.r * 0.6);
          for (let i = 0; i < s.amount; i++) {
            const tg = i === 0 && big ? big : cand.length ? cand[(G.rng() * cand.length) | 0] : null;
            const tx = tg ? tg.x : p.x + p.ax * 200, ty = tg ? tg.y : p.y + p.ay * 200;
            const a = Math.atan2(ty - p.y, tx - p.x) + (G.rng() - 0.5) * 1.2;
            G.P.push({ k: 'rocket', id: SHOT_ID++, x: p.x, y: p.y, a, sp: s.speed, tx, ty, tg, life: 2.2, dmg: s.dmg, blast: s.blast, kb: s.kb, src: w.id, shards: s.shards || 0, delay: i * 0.12 });
          }
          Snd.shoot(w.id);
        }
        break;
      }
      case 'pillow': case 'fort': {
        w.t -= dt;
        if (w.id === 'fort') {
          w.rt.tick = (w.rt.tick || 0) - dt;
          if (w.rt.tick <= 0) {
            w.rt.tick = s.tick;
            eachInCircle(p.x, p.y, s.radius, (e) => { Game.hurtEnemy(e, s.dmg, s.kb, e.x - p.x, e.y - p.y, w.id); });
          }
        }
        if (w.t <= 0) {
          w.t = s.cd;
          const R = s.radius * (w.id === 'fort' ? 1.25 : 1), dmg = w.id === 'fort' ? s.pulse * G.st.might : s.dmg;
          eachInCircle(p.x, p.y, R, (e) => { Game.hurtEnemy(e, dmg, s.kb, e.x - p.x, e.y - p.y, w.id); });
          // the pillow also swats enemy bullets out of the air
          const B = G.B;
          for (let i = B.length - 1; i >= 0; i--) if (dist2(B[i].x, B[i].y, p.x, p.y) < R * R) B.splice(i, 1);
          G.rings.push({ x: p.x, y: p.y, r0: 12, r1: R, t: 0, dur: 0.28, col: w.id === 'fort' ? '#fff6ff' : '#d9d4ff', follow: true });

      }
    }
  },

  updateShots(dt) {
    const P = G.P, p = G.p;
    let j = 0;
    for (let i = 0; i < P.length; i++) {
      const s = P[i];
      if (s.delay > 0) { s.delay -= dt; s.x = p.x; s.y = p.y; P[j++] = s; continue; }
      s.life -= dt;
      let keep = s.life > 0;
      if (keep) switch (s.k) {
        case 'plane': {
          if (s.tg && s.tg.hp > 0) {
            const ta = Math.atan2(s.tg.y - s.y, s.tg.x - s.x);
            s.a += clamp(angDiff(s.a, ta), -s.turn * dt, s.turn * dt);
          } else if (Math.random() < 0.1) { const n = nearest(s.x, s.y, 1, 260, (e) => s.hit.indexOf(e.id) >= 0); s.tg = n[0] || null; }
          s.x += Math.cos(s.a) * s.sp * dt; s.y += Math.sin(s.a) * s.sp * dt;
          eachInCircle(s.x, s.y, s.r, (e) => {
            if (s.hit.indexOf(e.id) >= 0) return false;
            s.hit.push(e.id);
            Game.hurtEnemy(e, s.dmg, s.kb, Math.cos(s.a), Math.sin(s.a), s.src);
            s.pierce--; s.tg = null;
            if (s.pierce < 0) { keep = false; return true; }
            return false;
          });
          break;
        }
        case 'band': {
          s.x += s.vx * dt; s.y += s.vy * dt;
          eachInCircle(s.x, s.y, s.r, (e) => {
            if (e === s.last) return false;
            Game.hurtEnemy(e, s.dmg, s.kb, s.vx, s.vy, s.src, s.crit);
            s.last = e;
            if (s.bounces-- <= 0) { keep = false; return true; }
            const nx = nearest(s.x, s.y, 1, s.range, (o) => o === e)[0];
            if (nx) { const a = Math.atan2(nx.y - s.y, nx.x - s.x), sp = len(s.vx, s.vy); s.vx = Math.cos(a) * sp; s.vy = Math.sin(a) * sp; s.life = Math.max(s.life, 0.6); }
            return true;
          });
          break;
        }
        case 'bubble': {
          s.wob += dt * 5;
          s.x += (s.vx + Math.cos(s.wob) * 18) * dt; s.y += (s.vy + Math.sin(s.wob * 1.3) * 18) * dt;
          s.vx *= 1 - dt * 0.5; s.vy *= 1 - dt * 0.5;
          eachInCircle(s.x, s.y, s.r * 0.8, (e) => {
            Game.hurtEnemy(e, s.dmg, 0, 0, 0, s.src);
            if (!e.boss) e.trap = Math.max(e.trap, s.trap);
            Fx.burst(s.x, s.y, 8, '#bff3ff', 120, 0.35, 2.4);
            keep = false; return true;
          });
          break;
        }
        case 'foam': {
          s.x += s.vx * dt; s.y += s.vy * dt; s.vx *= 1 - dt * 0.8; s.vy *= 1 - dt * 0.8;
          s.tt -= dt;
          const tick = s.tt <= 0;
          if (tick) s.tt = s.tick;
          eachInCircle(s.x, s.y, s.r, (e) => { if (s.slow > e.slow) e.slow = s.slow; if (tick) Game.hurtEnemy(e, s.dmg, 0, 0, 0, s.src); return false; });
          break;
        }
        case 'ball': {
          s.x += s.vx * dt; s.y += s.vy * dt; s.spin += dt * 8;
          const hw = Game.view.w / 2 - s.r, hh = Game.view.h / 2 - s.r;
          if (s.x < p.x - hw) { s.x = p.x - hw; s.vx = Math.abs(s.vx); } else if (s.x > p.x + hw) { s.x = p.x + hw; s.vx = -Math.abs(s.vx); }
          if (s.y < p.y - hh) { s.y = p.y - hh; s.vy = Math.abs(s.vy); } else if (s.y > p.y + hh) { s.y = p.y + hh; s.vy = -Math.abs(s.vy); }
          eachInCircle(s.x, s.y, s.r, (e) => { if (canHit(e, 'b' + s.id, s.hitcd)) Game.hurtEnemy(e, s.dmg, s.kb, e.x - s.x, e.y - s.y, s.src); return false; });
          if (s.trail) { s.tt -= dt; if (s.tt <= 0) { s.tt = 0.09; G.P.push({ k: 'fire', id: SHOT_ID++, x: s.x, y: s.y, life: 1.3, max: 1.3, r: s.r * 0.75, dmg: s.trail * G.st.might, tick: 0.3, tt: 0, src: s.src }); } }
          break;
        }
        case 'fire': {
          s.tt -= dt;
          if (s.tt <= 0) { s.tt = s.tick; eachInCircle(s.x, s.y, s.r, (e) => { if (canHit(e, 'fire', 0.28)) Game.hurtEnemy(e, s.dmg, 0, 0, 0, s.src); return false; }); }
          break;
        }
        case 'rocket': {
          if (s.tg && s.tg.hp > 0) { s.tx = s.tg.x; s.ty = s.tg.y; }
          const ta = Math.atan2(s.ty - s.y, s.tx - s.x);
          s.a += clamp(angDiff(s.a, ta), -6 * dt, 6 * dt);
          s.sp = Math.min(s.sp + 500 * dt, 700);
          s.x += Math.cos(s.a) * s.sp * dt; s.y += Math.sin(s.a) * s.sp * dt;
          if (Math.random() < 0.6 && G.FX.length < 650) G.FX.push({ x: s.x - Math.cos(s.a) * 8, y: s.y - Math.sin(s.a) * 8, vx: 0, vy: 0, life: 0.3, max: 0.3, size: 3, col: '#ffb347' });
          let boom = dist2(s.x, s.y, s.tx, s.ty) < 14 * 14;
          if (!boom) eachInCircle(s.x, s.y, 6, () => { boom = true; return true; });
          if (boom) { this.explode(s.x, s.y, s.blast, s.dmg, s.kb, s.src); if (s.shards) for (let k = 0; k < s.shards; k++) { const a = k / s.shards * TAU; G.P.push({ k: 'shard', id: SHOT_ID++, x: s.x, y: s.y, vx: Math.cos(a) * 260, vy: Math.sin(a) * 260, life: 0.55, dmg: s.dmg * 0.4, src: s.src }); } keep = false; }
          break;
        }
        case 'shard': {
          s.x += s.vx * dt; s.y += s.vy * dt;
          eachInCircle(s.x, s.y, 5, () => { this.explode(s.x, s.y, 32 * G.st.area, s.dmg, 60, s.src); keep = false; return true; });
          if (!keep) break;
          if (s.life <= dt) this.explode(s.x, s.y, 30 * G.st.area, s.dmg, 60, s.src);
          break;
        }
      }
      if (keep) P[j++] = s;
    }
    P.length = j;
    if (P.length > 600) P.splice(0, P.length - 600);
  },
  explode(x, y, r, dmg, kb, src) {
    eachInCircle(x, y, r, (e) => { Game.hurtEnemy(e, dmg, kb, e.x - x, e.y - y, src); return false; });
    G.rings.push({ x, y, r0: r * 0.3, r1: r, t: 0, dur: 0.3, col: src === 'fireworks' ? '#ff9ae8' : '#ffcf6b', fill: true });
    Fx.burst(x, y, 10, src === 'fireworks' ? '#ffd1f5' : '#ffd27a', r * 3, 0.4, 3);
    Snd.boom(false);
    G.shake = Math.max(G.shake, 2.5);
  },
};

// ---------------------------------------------------------------- meta.js (achievements, stars, unlocks, end of the night)
const Ach = {
  newly: [],
  give(id) {
    if (Save.data.achs[id] || (G && G.demo)) return;
    const a = ACHS.find((x) => x.id === id);
    if (!a) return;
    Save.data.achs[id] = Date.now();
    if (a.stars) Save.data.stars += a.stars;
    this.newly.push(id);
    UI.achToast(a);
    Save.persist();
  },
  bossDown(n) { this.give('boss' + n); if (G) Save.data.stats.bosses = (Save.data.stats.bosses || 0) + 1; },
  evolved(to) {
    Save.data.stats.evolved[to] = 1;
    this.give('evo1');
    if (Object.keys(Save.data.stats.evolved).length >= 4) this.give('evo4');
  },
  level(L) { if (L >= 20) this.give('lv20'); if (L >= 40) this.give('lv40'); },
  kills() { const k = Save.data.stats.kills + (G ? G.kills : 0); if (k >= 1000) this.give('kills1k'); if (k >= 10000) this.give('kills10k'); },
};
Game.achTime = function (hour) {
  if (hour >= 2) { Ach.give('midnight'); if (G.hurtFree) Ach.give('untouched'); }
  if (hour >= 4) Ach.give('two_am');
};

const Meta = {
  finish() {
    const r = Game.summary(), sd = Save.data, st = sd.stats;
    const earned = Math.round(G.stars * G.st.starMul) + (r.won ? 50 : 0);
    sd.stars += earned; st.starsTotal += earned;
    st.kills += G.kills; st.runs++; if (r.won) st.wins++;
    st.bestTime = Math.max(st.bestTime, r.time); st.bestKills = Math.max(st.bestKills, r.kills);
    st.bestLevel = Math.max(st.bestLevel, r.level); st.bestScore = Math.max(st.bestScore, r.score);
    if (r.won) { st.sunrise[r.hero] = 1; Ach.give('sunrise'); if (Object.keys(st.sunrise).length >= 4) Ach.give('sunrise4'); }
    Ach.kills();
    let dailyBest = false;
    if (G.daily) {
      const d = sd.daily;
      if (d.idx !== G.daily.idx) { d.idx = G.daily.idx; d.best = null; d.tries = 0; }
      d.tries++;
      if (!d.best || r.score > d.best.score) { d.best = r; dailyBest = true; }
      Ach.give('daily');
    }
    Save.persist();
    return { run: r, earned, dailyBest };
  },
  heroState(h) {
    if (Save.heroUnlocked(h.id)) return { ok: true };
    const wOk = Save.weaponUnlocked(h.weapon);
    if (!wOk) { const a = ACHS.find((x) => x.id === LOCKED_WEAPONS[h.weapon]); return { ok: false, need: 'Unlock the ' + WEAPONS[h.weapon].name + ': ' + a.desc.toLowerCase() }; }
    return { ok: false, cost: h.cost };
  },
  buyHero(id) {
    const h = HEROES.find((x) => x.id === id), s = this.heroState(h);
    if (s.ok || !s.cost || Save.data.stars < s.cost) return false;
    Save.data.stars -= s.cost; Save.data.heroes[id] = true;
    if (HEROES.every((x) => Save.data.heroes[x.id])) Ach.give('friends');
    Save.persist();
    return true;
  },
  shopCost(it) { const n = Save.data.shop[it.id] || 0; return n >= it.costs.length ? null : it.costs[n]; },
  buy(id) {
    const it = SHOP.find((x) => x.id === id), c = this.shopCost(it);
    if (c === null || Save.data.stars < c) return false;
    Save.data.stars -= c; Save.data.shop[id] = (Save.data.shop[id] || 0) + 1;
    Save.persist();
    return true;
  },
  refund() {
    let back = 0;
    for (const it of SHOP) { const n = Save.data.shop[it.id] || 0; for (let i = 0; i < n; i++) back += it.costs[i]; Save.data.shop[it.id] = 0; }
    Save.data.stars += back; Save.persist();
    return back;
  },
};

// ---------------------------------------------------------------- input.js (floating thumb-stick anywhere on screen, WASD / arrows)
const Input = {
  keys: {}, touch: null, active: false, R: 46, v: { x: 0, y: 0 }, stickEl: null, knobEl: null,
  init(target) {
    this.stickEl = document.getElementById('stick'); this.knobEl = document.getElementById('knob');
    const K = { ArrowUp: 'u', KeyW: 'u', ArrowDown: 'd', KeyS: 'd', ArrowLeft: 'l', KeyA: 'l', ArrowRight: 'r', KeyD: 'r' };
    window.addEventListener('keydown', (e) => {
      if (K[e.code]) { this.keys[K[e.code]] = true; if (this.active) e.preventDefault(); }
      if ((e.code === 'Escape' || e.code === 'KeyP') && this.active && !e.repeat) { UI.togglePause(); e.preventDefault(); }
    });
    window.addEventListener('keyup', (e) => { if (K[e.code]) this.keys[K[e.code]] = false; });
    window.addEventListener('blur', () => { this.keys = {}; this.release(); });
    target.addEventListener('pointerdown', (e) => {
      if (!this.active || this.touch || (e.pointerType === 'mouse' && e.button !== 0)) return;
      this.touch = { id: e.pointerId, ox: e.clientX, oy: e.clientY, x: e.clientX, y: e.clientY };
      try { target.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      this.showStick();
      Snd.init();
      e.preventDefault();
    });
    target.addEventListener('pointermove', (e) => {
      const t = this.touch; if (!t || e.pointerId !== t.id) return;
      t.x = e.clientX; t.y = e.clientY;
      // drag the stick along when the thumb runs past its edge, so it never "sticks"
      const dx = t.x - t.ox, dy = t.y - t.oy, d = Math.sqrt(dx * dx + dy * dy);
      if (d > this.R * 1.4) { t.ox = t.x - dx / d * this.R * 1.4; t.oy = t.y - dy / d * this.R * 1.4; }
      this.showStick();
    });
    const up = (e) => { if (this.touch && e.pointerId === this.touch.id) this.release(); };
    target.addEventListener('pointerup', up); target.addEventListener('pointercancel', up); target.addEventListener('lostpointercapture', up);
  },
  release() { this.touch = null; if (this.stickEl) this.stickEl.classList.remove('on'); },
  showStick() {
    const t = this.touch, s = this.stickEl;
    if (!s || !t) return;
    s.classList.add('on');
    s.style.transform = 'translate(' + (t.ox - 56) + 'px,' + (t.oy - 56) + 'px)';
    const dx = t.x - t.ox, dy = t.y - t.oy, d = Math.sqrt(dx * dx + dy * dy), m = Math.min(d, this.R) / (d || 1);
    this.knobEl.style.transform = 'translate(' + dx * m + 'px,' + dy * m + 'px)';
  },
  vec() {
    const v = this.v; v.x = 0; v.y = 0;
    if (this.bot) return this.bot(G, v);
    if (!this.active) return v;
    const t = this.touch;
    if (t) {
      const dx = t.x - t.ox, dy = t.y - t.oy, d = Math.sqrt(dx * dx + dy * dy), dead = 7;
      if (d > dead) { const m = clamp((d - dead) / (this.R - dead), 0, 1); v.x = dx / d * m; v.y = dy / d * m; }
      return v;
    }
    const k = this.keys;
    v.x = (k.r ? 1 : 0) - (k.l ? 1 : 0); v.y = (k.d ? 1 : 0) - (k.u ? 1 : 0);
    if (v.x && v.y) { v.x *= Math.SQRT1_2; v.y *= Math.SQRT1_2; }
    return v;
  },
};

// ---------------------------------------------------------------- share.js (brag codes for the group chat)
const B32 = '0123456789ABCDEFGHJKMNPQRSTVWXYZ'; // no I, L, O, U: easy to read out loud
const CODE_FIELDS = [['v', 2], ['daily', 1], ['day', 12], ['hero', 3], ['time', 9], ['kills', 17], ['level', 7], ['bosses', 2], ['won', 1]];
const Share = {
  encode(r) {
    const f = { v: 1, daily: r.daily >= 0 ? 1 : 0, day: Math.max(0, r.daily), hero: Math.max(0, HEROES.findIndex((h) => h.id === r.hero)), time: Math.min(511, Math.floor(r.time)),
      kills: Math.min(131071, r.kills), level: Math.min(127, r.level), bosses: Math.min(3, r.bosses), won: r.won ? 1 : 0 };
    let n = 0n, raw = '';
    for (const [k, bits] of CODE_FIELDS) { n = (n << BigInt(bits)) | BigInt(f[k] & ((1 << bits) - 1)); raw += f[k] + '.'; }
    n = (n << 11n) | BigInt(hash32('ns|' + raw + '|sleepy') & 0x7FF);
    let s = '';
    for (let i = 0; i < 13; i++) { s = B32[Number(n & 31n)] + s; n >>= 5n; }
    return s.slice(0, 5) + '-' + s.slice(5, 9) + '-' + s.slice(9);
  },
  decode(code) {
    const s = String(code || '').toUpperCase().replace(/[^0-9A-Z]/g, '').replace(/O/g, '0').replace(/[IL]/g, '1');
    if (s.length !== 13) return null;
    let n = 0n;
    for (const ch of s) { const v = B32.indexOf(ch); if (v < 0) return null; n = (n << 5n) | BigInt(v); }
    const chk = Number(n & 0x7FFn); n >>= 11n;
    const f = {};
    for (let i = CODE_FIELDS.length - 1; i >= 0; i--) { const [k, bits] = CODE_FIELDS[i]; f[k] = Number(n & BigInt((1 << bits) - 1)); n >>= BigInt(bits); }

        case 'band': { const a = Math.atan2(s.vy, s.vx); c.beginPath(); c.ellipse(s.x, s.y, 8, 3.5, a, 0, TAU); c.strokeStyle = INK; c.lineWidth = 4.4; c.stroke(); c.strokeStyle = s.src === 'storm' ? '#ffd23f' : '#ff8a1f'; c.lineWidth = 2.4; c.stroke(); break; }
        case 'bubble': this.spr(SPR.bubble, s.x, s.y, s.r * 2.2, s.r * 2.2); break;
        case 'ball': {
          if (s.src === 'meteor') { c.globalCompositeOperation = 'lighter'; c.globalAlpha = 0.6; this.spr(this.glowGold, s.x, s.y, s.r * 5, s.r * 5); c.globalAlpha = 1; c.globalCompositeOperation = 'source-over'; }
          const sp = SPR[s.src === 'meteor' ? 'meteor' : 'ball'], sz = s.r * 2.3; c.save(); c.translate(s.x, s.y); c.rotate(s.spin); c.drawImage(sp.c, -sz / 2, -sz / 2, sz, sz); c.restore(); break;
        }
        case 'rocket': { const sp = SPR.rocket; c.globalCompositeOperation = 'lighter'; c.globalAlpha = 0.45; this.spr(this.glowPink, s.x - Math.cos(s.a) * 8, s.y - Math.sin(s.a) * 8, 26, 26); c.globalAlpha = 1; c.globalCompositeOperation = 'source-over'; c.save(); c.translate(s.x, s.y); c.rotate(s.a); c.drawImage(sp.c, -sp.w / 2, -sp.h / 2, sp.w, sp.h); c.restore(); break; }
        case 'shard': { c.globalCompositeOperation = 'lighter'; this.spr(this.glowPink, s.x, s.y, 22, 22); c.globalCompositeOperation = 'source-over'; this.spr(SPR.spark, s.x, s.y); break; }

  },
  ring(c, r) {
    const f = r.t / r.dur;
    if (r.line) {
      c.globalAlpha = 0.25 + 0.35 * Math.abs(Math.sin(r.t * 18)); c.strokeStyle = r.col; c.lineWidth = 34; c.lineCap = 'round';

    }
    const x = r.follow ? G.p.x : r.x, y = r.follow ? G.p.y : r.y, rad = lerp(r.r0, r.r1, easeOut(f));
    if (r.warn) { c.globalAlpha = 0.55 + 0.3 * Math.sin(r.t * 20); c.strokeStyle = r.col; c.lineWidth = 3.4; c.setLineDash([8, 6]); c.beginPath(); c.arc(x, y, r.r1, 0, TAU); c.stroke(); c.setLineDash([]); c.globalAlpha = 0.22; c.fillStyle = r.col; c.beginPath(); c.arc(x, y, r.r1 * f, 0, TAU); c.fill(); c.globalAlpha = 1; return; }

  darkAlpha(t) {
    if (t < 300) return 0.62 + t / 300 * 0.2;

  },
  darkness(c, px, py, W, H, k, T) {
    const t = G.t, dk = this.dark, a = this.darkAlpha(t);
    let rgb = '10,4,20';
    if (t > 420) { const f = clamp((t - 420) / 60, 0, 1); rgb = Math.round(lerp(10, 70, f)) + ',' + Math.round(lerp(4, 22, f)) + ',' + Math.round(lerp(20, 40, f)); }
    const gr = c.createRadialGradient(px, py, dk.inner, px, py, dk.outer);
    gr.addColorStop(0, 'rgba(' + rgb + ',0)'); gr.addColorStop(0.4, 'rgba(' + rgb + ',' + (a * 0.62).toFixed(3) + ')'); gr.addColorStop(1, 'rgba(' + rgb + ',' + a.toFixed(3) + ')');
    c.fillStyle = gr; c.fillRect(0, 0, W, H);
    if (t > 420) { const f = clamp((t - 420) / 60, 0, 1); c.fillStyle = 'rgba(255,150,90,' + (f * 0.12).toFixed(3) + ')'; c.fillRect(0, 0, W, H); }

    c.globalCompositeOperation = 'lighter'; c.globalAlpha = 0.13; this.spr(this.glowGold, px, py, dk.inner * 2.3, dk.inner * 2.3); c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
  },
  // light sources and eyes, drawn on top of the darkness
  glows(c, ox, oy, k, px, py, T) {
    const dk = this.dark, span = dk.outer - dk.inner, Lt = this.lights;
    c.globalCompositeOperation = 'lighter';
    for (let i = 0; i < Lt.length; i += 3) {
      const x = ox + Lt[i] * k, y = oy + Lt[i + 1] * k, type = Lt[i + 2];
      const dd = Math.hypot(x - px, y - py), f = 0.35 + 0.65 * smooth(dk.inner * 0.6, dk.outer, dd);
      if (type === 0) { const fl = 0.75 + 0.25 * Math.sin(T * 13 + Lt[i]) * Math.sin(T * 7.3 + Lt[i + 1]); c.globalAlpha = 0.5 * f * fl; this.spr(this.glowCandle, x, y, 110 * k, 110 * k); c.globalAlpha = 0.8 * f * fl; this.spr(this.glowCandle, x, y, 22 * k, 22 * k); }
      else if (type === 1) { c.globalAlpha = (0.32 + 0.12 * Math.sin(T * 2 + Lt[i])) * f; this.spr(this.glowGreen, x, y, 70 * k, 50 * k); }
      else { c.globalAlpha = (0.35 + 0.15 * Math.sin(T * 5)) * f; this.spr(this.glowGold, x, y, 80 * k, 80 * k); }
    }
    // the eyes of the nightmares
    for (let i = 0; i < this.nEyes; i++) {
      const o = this.eyes[i], e = o.e, d = o.d, wx = ox + e.x * k, wy = oy + o.cy * k;
      const dd = Math.hypot(wx - px, wy - py), f = e.boss ? 0.55 + 0.45 * smooth(dk.inner * 0.5, dk.outer, dd) : smooth(dk.inner * 0.85, dk.inner + span * 0.7, dd);
      if (f < 0.04) continue;
      const s = this.eyeGlow(d.col), sz = (e.boss ? 15 : 10) * Math.abs(o.f) * k;
      c.globalAlpha = Math.min(1, f * 1.1);
      for (const pt of d.pts) c.drawImage(s.c, wx + pt[0] * o.f * k - sz / 2, wy + pt[1] * Math.abs(o.f) * k - sz / 2, sz, sz);
    }
    c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
  },
  // pairs of eyes that watch you from the dark, blink, and shy away from the light
  ambient(c, ox, oy, k, px, py, W, H, T, dt) {
    const A = this.amb, dk = this.dark, need = G.demo ? 5 : 4;
    if (A.length < need && Math.random() < dt * 1.5) {
      for (let tries = 0; tries < 8; tries++) {
        const sx = 30 + Math.random() * (W - 60), sy = 60 + Math.random() * (H - 90), dd = Math.hypot(sx - px, sy - py);

      const blink = ((a.t + a.ph) % 3.4) < 0.13 ? 0.08 : 1, al = clamp(a.fade, 0, 1) * blink * smooth(dk.inner, dk.outer, dd) * 0.9;
      if (al < 0.02) continue;

  },
  lowHp(c, px, py, W, H, T) {

  },

// ---------------------------------------------------------------- ui.js (DOM: menus, HUD, level-up cards, chests, results)
const UI = {

  init() {
    this.scr = document.getElementById('screen');

      const b = e.target.closest('[data-a]');
      if (!b || b.disabled) return;
      const fn = this.acts[b.dataset.a];
      if (!fn) return;
      Snd.init(); Snd.ui(b.dataset.a === 'back');
      fn(b.dataset.v, b, e);
    });
    document.getElementById('pauseBtn').addEventListener('click', () => { Snd.init(); this.togglePause(); });
    window.addEventListener('keydown', (e) => {
      if (this.cur === 'level' && /^Digit[1-4]$/.test(e.code)) { const b = this.scr.querySelectorAll('.card')[+e.code.slice(5) - 1]; if (b) b.click(); }
      if ((this.cur === 'chest' || this.cur === 'results') && (e.code === 'Enter' || e.code === 'Space')) { const b = this.scr.querySelector('.primary'); if (b && !b.disabled) { b.click(); e.preventDefault(); } }
    });
  },
  show(html, cls) { this.scr.innerHTML = html; this.scr.className = 'on ' + (cls || ''); this.scr.scrollTop = 0; },
  hide() { this.scr.className = ''; this.scr.innerHTML = ''; this.cur = null; },
  stars() { return '<div class="pill star"><img src="' + ICON.star + '" alt="">' + fmtInt(Save.data.stars) + '</div>'; },

  // ---------------------------------------------------------------- title

      '<div class="title">' +
      '<div class="topbar">' + this.stars() + '<button class="iconbtn" data-a="settings" aria-label="Settings">' + gearSvg() + '</button></div>' +

const Demo = {
  on: false, t: 0,
  start(force) {
    if (!force && this.on && G && G.demo) return;

    G.demo = true; G.t = 75; G.hourShown = 1; G.nextEvent = G.events.findIndex((e) => e.t > 75);
    if (G.nextEvent < 0) G.nextEvent = G.events.length;

    G.nextEvent = G.events.findIndex((e) => e.t > 75); if (G.nextEvent < 0) G.nextEvent = G.events.length;
    for (let i = 0; i < 6; i++) { G.pending++; }
    for (let i = 0; i < 34; i++) { const a = Math.random() * TAU, d = 160 + Math.random() * 420; Enemies.spawn(['blob', 'dust', 'sock', 'dust', 'blob'][i % 5], Math.cos(a) * d, Math.sin(a) * d); }

  stop() { this.on = false; },
  vec() {

};

// ---------------------------------------------------------------- main.js (boot + fixed-step loop)
const STEP = 1 / 60;
const Perf = {
  acc: 0, n: 0, level: 0,
  sample(dt) {
    if (!G || G.demo || G.paused || G.over) { this.acc = 0; this.n = 0; return; }
    this.acc += dt; this.n++;
    if (this.n >= 120) {
      const avg = this.acc / this.n;
      this.acc = 0; this.n = 0;
      // phone struggling: render fewer pixels first, then cap the horde a little
      if (avg > 0.024 && this.level < 2) {
        this.level++;
        Render.quality = this.level === 1 ? 0.75 : 0.6;
        Game.maxAlive = this.level === 1 ? 260 : 210;
        Render.resize();
      }
    }
  },
};

  Save.load();
  buildSprites();
  const cv = document.getElementById('cv');
  Render.init(cv); Render.resize();
  Input.init(cv);
  UI.init();
  window.addEventListener('resize', () => Render.resize());
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { Save.persistLocal(); if (G && !G.demo && !G.over && !G.paused) UI.pauseMenu(); if (Snd.ac) Snd.ac.suspend().catch(() => {}); }
    else if (Snd.ac) Snd.ac.resume().catch(() => {});
  });
  // the first tap anywhere wakes the audio up (browsers need a gesture)
  const wake = () => { Snd.init(); if (!Music.on && UI.cur === 'title') Music.start(0); };
  window.addEventListener('pointerdown', wake, { capture: true });
  window.addEventListener('keydown', wake, { capture: true });
  Save.onRemote = () => { if (UI.cur === 'title') UI.title(); };
  Save.cloudInit();
  UI.title();
  let last = performance.now(), acc = 0;
  function loop(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (G && !G.paused && !G.over) {
      acc += dt;
      let n = 0;
      while (acc >= STEP && n < 4) { Game.update(STEP); acc -= STEP; n++; }
      if (n === 4) acc = 0;
    } else if (G && G.over) { acc = 0; Game.updateFx(dt); }
    if (G && G.demo && G.t > 330) Demo.start(true);
    Music.pump();
    Render.frame(now);
    UI.frameHud(dt);
    Perf.sample(dt);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

})();</script>
