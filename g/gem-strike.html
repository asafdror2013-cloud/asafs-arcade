  // ---- cloud saves through the arcade page (strings only cross between the two pages)
  function makeClaude(H, gid) {
    var cache = {};
    function fail(code) { var e = new Error(code || 'unavailable'); e.code = code || 'unavailable'; return e; }
    function call(fn, args) {
      return new Promise(function (res, rej) {
        var p;
        try { p = H[fn].apply(null, [gid].concat(args || [])); } catch (e) { rej(fail('unavailable')); return; }
        Promise.resolve(p).then(function (s) {
          var r;
          try { r = JSON.parse(s); } catch (e) { rej(fail('internal')); return; }
          if (r && r.ok) res(r.v); else rej(fail(r && r.code));
        }, function () { rej(fail('unavailable')); });
      });
    }
    function snap(path, v) {
      var parts = path.split('/');
      return { id: parts[parts.length - 1], exists: v !== null && v !== undefined,
        data: function () { return v === null || v === undefined ? undefined : JSON.parse(JSON.stringify(v)); } };
    }
    function doc(path) {
      return {
        id: path.split('/').pop(), path: path,
        get: function () { return call('get', [path]).then(function (v) { return snap(path, v); }); },
        set: function (data) { return call('set', [path, JSON.stringify(data)]).then(function () {}); }
      };
    }
    function query(path, lim) {
      return {
        path: path,
        limit: function (n) { return query(path, n); },
        doc: function (id) { return doc(path + '/' + id); },
        onSnapshot: function (next, error) {
          var dead = false, off = null;
          function onErr(code) { if (!dead && typeof error === 'function') error(fail(code)); }
          try {
            off = H.watch(gid, path, lim || 0, function (s) {
              if (dead) return;
              var rows; try { rows = JSON.parse(s); } catch (e) { return; }
              var docs = rows.map(function (d) { return snap(path + '/' + d.id, d.v); });
              next({ docs: docs, size: docs.length, empty: !docs.length, forEach: function (f) { docs.forEach(f); } });
            }, onErr);
          } catch (e) { setTimeout(function () { onErr('unavailable'); }, 0); }
          return function () { dead = true; try { if (off) off(); } catch (e) { /* page gone */ } };
        }
      };
    }
    var db = { doc: doc, collection: function (p) { return query(p, 0); } };
    var user = {
      id: function () { return call('uid', []); },
      me: function () { return call('uid', []).then(function (id) { return { id: id }; }); },
      can: function (n) { return call('can', [String(n)]); },
      profiles: function (ids) { return call('profiles', [JSON.stringify(ids || [])]); },
      isOwner: function () { return false; },
      canEdit: function () { return false; }

      use: function (name) {

            if (!ok) return null;
            return name === 'db' ? db : name === 'user' ? user : null;
          }, function () { return null; });
        }
        return cache[name];
      }
    };
  }
})();

/* ---------------------------------------------------------------- style.css (Gem Strike: dark glass, cut corners, neon accents) */
:root { --bg: #070b14; --glass: rgba(12,18,32,.84); --glass2: rgba(20,30,52,.9); --line: rgba(130,190,255,.22); --line2: rgba(130,190,255,.4);
  --cyan: #39e1ff; --mag: #ff3d8b; --gold: #ffc53a; --green: #3dffa8; --red: #ff4d5e; --violet: #b25cff; --text: #e8f0ff; --muted: #8b98b8;
  --display: 'Oxanium', 'Rajdhani', 'Arial Narrow', sans-serif; --body: 'Rajdhani', 'Arial Narrow', system-ui, sans-serif; --cut: 12px; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; }
body { font: 600 16px/1.25 var(--body); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: none; }
button { font: inherit; color: inherit; cursor: pointer; }
#app { position: fixed; inset: 0; }
.stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.tx { text-shadow: 0 1px 0 rgba(0,0,0,.65); }
.cut { clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut)); }
.lbl { font: 700 11px/1 var(--display); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }

/* ---------------------------------------------------------------- buttons */
.btn { position: relative; border: 0; padding: 14px 24px; font: 800 20px/1 var(--display); letter-spacing: .12em; text-transform: uppercase; color: #0a0e18;
  background: linear-gradient(180deg, #ffe07a, #ffbf1f); clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px);
  box-shadow: inset 0 -4px 0 rgba(120,70,0,.35), inset 0 2px 0 rgba(255,255,255,.5); }
.btn:active { filter: brightness(.9); transform: translateY(1px); }
.btn.ghost { color: var(--text); background: linear-gradient(180deg, rgba(30,46,78,.95), rgba(14,22,40,.95)); box-shadow: inset 0 0 0 1px var(--line2); }
.btn.cyan { background: linear-gradient(180deg, #7cefff, #19b8e0); }
.btn.green { background: linear-gradient(180deg, #8bffc9, #1fd389); }
.btn[disabled] { filter: grayscale(1) brightness(.6); }

/* ---------------------------------------------------------------- brawl HUD */
.hud { position: absolute; inset: 0; pointer-events: none; }
.hud > * { pointer-events: auto; }
.score { position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); display: flex; align-items: stretch; }
.score .side { min-width: 62px; display: grid; place-items: center; font: 800 30px/1 var(--display); padding: 0 12px; }
.score .s0 { background: linear-gradient(180deg, rgba(58,160,255,.95), rgba(20,90,200,.95)); clip-path: polygon(12px 0, 100% 0, 100% 100%, 0 100%, 0 12px); }
.score .s1 { background: linear-gradient(180deg, rgba(255,90,110,.95), rgba(200,30,60,.95)); clip-path: polygon(0 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%); }
.score .mid { padding: 7px 16px 6px; background: rgba(8,12,22,.92); text-align: center; box-shadow: inset 0 0 0 1px var(--line); }
.score .mid b { display: block; font: 700 10px/1.2 var(--display); letter-spacing: .2em; color: var(--muted); }
.score .mid span { display: block; font: 800 24px/1 var(--display); letter-spacing: .04em; }
.squad { position: absolute; top: calc(76px + env(safe-area-inset-top, 0px)); left: 10px; display: flex; flex-direction: column; gap: 12px; }
.pfp { position: relative; width: 56px; height: 56px; padding: 0; border: 0; background: rgba(10,16,30,.9); clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%); }
.pfp img { position: absolute; left: 4px; top: 6px; width: 48px; height: 48px; }
.pfp .hpring { position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: linear-gradient(90deg, var(--c, #3dffa8) calc(var(--hp, 1) * 100%), rgba(255,255,255,.12) 0); }
.pfp.on { background: linear-gradient(180deg, rgba(61,255,168,.35), rgba(10,16,30,.95)); }
.pfpwrap { position: relative; }
.pfpwrap .lv { position: absolute; right: -6px; top: -4px; min-width: 20px; height: 20px; display: grid; place-items: center; font: 800 12px/1 var(--display); background: #15112a; color: #e6c9ff; box-shadow: inset 0 0 0 1px var(--violet); clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%); padding: 0 4px; }
.pfpwrap.on::after { content: ""; position: absolute; left: 62px; top: 22px; border: 6px solid transparent; border-left: 8px solid var(--green); }
.pausebtn { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: 12px; width: 44px; height: 44px; border: 0; background: var(--glass); box-shadow: inset 0 0 0 1px var(--line); display: grid; place-items: center; clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); }
.pausebtn i { width: 14px; height: 14px; border-left: 4px solid #fff; border-right: 4px solid #fff; }
.stick { position: absolute; width: 128px; height: 128px; border-radius: 50%; border: 1.5px solid rgba(160,210,255,.45); background: radial-gradient(circle, rgba(57,225,255,.06), rgba(8,12,24,.35)); }
.stick::before { content: ""; position: absolute; inset: 14px; border-radius: 50%; border: 1px dashed rgba(160,210,255,.2); }
.stick .knob { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, rgba(255,255,255,.9), rgba(150,190,230,.75)); box-shadow: 0 0 18px rgba(57,225,255,.35); }
.stick.move { left: calc(22px + env(safe-area-inset-left, 0px)); bottom: calc(26px + env(safe-area-inset-bottom, 0px)); }
.stick.fire { right: calc(22px + env(safe-area-inset-right, 0px)); bottom: calc(26px + env(safe-area-inset-bottom, 0px)); border-color: rgba(255,120,140,.6); background: radial-gradient(circle, rgba(255,77,94,.08), rgba(8,12,24,.35)); }
.stick.fire .knob { background: radial-gradient(circle at 40% 35%, #ff9aa6, #e0283f); display: grid; place-items: center; box-shadow: 0 0 20px rgba(255,77,94,.5); }
.stick.fire .knob svg { width: 28px; height: 28px; }
.superbtn { position: absolute; right: calc(150px + env(safe-area-inset-right, 0px)); bottom: calc(126px + env(safe-area-inset-bottom, 0px)); width: 76px; height: 76px; border: 0; padding: 0; display: grid; place-items: center;
  background: conic-gradient(var(--gold) calc(var(--ch, 1) * 360deg), rgba(255,255,255,.1) 0); clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%); }
.superbtn::before { content: ""; position: absolute; inset: 5px; background: radial-gradient(circle at 45% 35%, #3a2c10, #120c02); clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%); }
.superbtn.ready::before { background: radial-gradient(circle at 45% 35%, #ffe07a, #e09a00); }
.superbtn.ready { filter: drop-shadow(0 0 12px rgba(255,197,58,.8)); animation: superglow 1s ease-in-out infinite; }
@keyframes superglow { 50% { filter: drop-shadow(0 0 22px rgba(255,197,58,1)); } }
.superbtn svg { position: relative; width: 34px; height: 34px; }
.killfeed { position: absolute; top: calc(70px + env(safe-area-inset-top, 0px)); right: 10px; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
.killfeed div { display: flex; align-items: center; gap: 8px; padding: 4px 10px 4px 4px; background: var(--glass); box-shadow: inset 0 0 0 1px var(--line); font: 700 12px/1 var(--display); letter-spacing: .1em; }
.killfeed img { width: 28px; height: 28px; }
.killfeed .x { color: var(--red); }

/* ---------------------------------------------------------------- Gem Rush */
.rush { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding: calc(10px + env(safe-area-inset-top, 0px)) 12px calc(12px + env(safe-area-inset-bottom, 0px));
  background: radial-gradient(110% 60% at 50% 0%, #1b2450 0%, #0b1022 50%, #05070f 100%); }
.rush::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .5;
  background-image: linear-gradient(rgba(57,225,255,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(57,225,255,.06) 1px, transparent 1px); background-size: 32px 32px;
  -webkit-mask: linear-gradient(#000, transparent 75%); mask: linear-gradient(#000, transparent 75%); }
.rush-top { position: relative; width: 100%; max-width: 440px; display: flex; align-items: center; gap: 12px; }
.race { flex: 1; display: flex; flex-direction: column; gap: 6px; }
.lane { display: grid; grid-template-columns: 58px 1fr 32px; align-items: center; gap: 8px; font: 700 12px/1 var(--display); letter-spacing: .14em; }
.lane .bar { height: 10px; background: rgba(255,255,255,.08); clip-path: polygon(4px 0, 100% 0, calc(100% - 4px) 100%, 0 100%); }
.lane .bar i { display: block; height: 100%; width: calc(var(--f) * 100%); }
.lane.me .bar i { background: linear-gradient(90deg, #1fd389, #3dffa8); box-shadow: 0 0 10px #3dffa8; }
.lane.foe .bar i { background: linear-gradient(90deg, #c0203a, #ff4d5e); }
.lane span { font-size: 17px; text-align: right; letter-spacing: 0; }
.lane.me b { color: var(--green); } .lane.foe b { color: #ff8a98; }
.clock { min-width: 94px; padding: 10px 0 8px; text-align: center; font: 800 32px/1 var(--display); background: var(--glass); box-shadow: inset 0 0 0 1px var(--line2); clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); }
.clock small { display: block; font: 700 9px/1 var(--display); letter-spacing: .24em; color: var(--muted); margin-bottom: 4px; }
.clock.low { color: var(--red); }
.rush-mid { position: relative; flex: 1; width: 100%; max-width: 440px; display: flex; flex-direction: column; justify-content: center; padding-bottom: 3vh; }
.cards { position: relative; width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.hcard { position: relative; height: 116px; overflow: hidden; background: linear-gradient(180deg, rgba(var(--rgb), .28), rgba(10,15,28,.95) 70%); box-shadow: inset 0 0 0 1px rgba(var(--rgb), .55), inset 0 3px 0 rgb(var(--rgb));
  clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); }
.hcard.c0 { --rgb: 255,59,84; } .hcard.c1 { --rgb: 47,139,255; } .hcard.c2 { --rgb: 47,224,138; }
.hcard img.face { position: absolute; left: 50%; top: 10px; width: 78px; height: 78px; margin-left: -39px; }
.hcard .gemtag { position: absolute; left: 6px; top: 8px; width: 22px; height: 22px; }
.hcard .lvl { position: absolute; right: 6px; top: 8px; min-width: 28px; height: 28px; display: grid; place-items: center; font: 800 16px/1 var(--display); color: #fff; background: #15112a; box-shadow: inset 0 0 0 1.5px var(--violet); clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%); }
.hcard .lvl.pop { animation: lvpop .45s ease-out; }
@keyframes lvpop { 30% { transform: scale(1.5); box-shadow: inset 0 0 0 2px #fff; } }
.hcard .nm { position: absolute; left: 0; right: 0; bottom: 22px; text-align: center; font: 800 13px/1 var(--display); letter-spacing: .14em; text-transform: uppercase; }
.hcard .pbar { position: absolute; left: 8px; right: 8px; bottom: 9px; height: 6px; background: rgba(255,255,255,.1); }
.hcard .pbar i { display: block; height: 100%; width: calc(var(--f) * 100%); background: rgb(var(--rgb)); box-shadow: 0 0 8px rgb(var(--rgb)); }
.hcard.glow { animation: cardglow .35s ease-out; }
@keyframes cardglow { 0% { filter: brightness(1.8); } 100% { filter: none; } }
.boardwrap { position: relative; width: 100%; aspect-ratio: 1; margin-top: 12px; background: rgba(6,10,20,.92); box-shadow: inset 0 0 0 1px var(--line2), 0 0 40px rgba(57,225,255,.08);
  clip-path: polygon(18px 0, 100% 0, 100% calc(100% - 18px), calc(100% - 18px) 100%, 0 100%, 0 18px); }
.boardwrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

<script>(function () {

// ---------------------------------------------------------------- save
function defaultSave() {
  const heroes = {};
  for (const h of HEROES) heroes[h.id] = { owned: START_HEROES.includes(h.id), lvl: 1, pp: 0 };
  return {
    v: 1, coins: 100, trophies: 0, best: 0, xp: 0, heroes, squad: START_HEROES.slice(), mode: 'knockout',
    boosters: { rocket: 1, bomb: 1, time: 1 }, armed: { rocket: false, bomb: false, time: false },
    crates: [], winMeter: 0, wins: 0, streak: 0, bestStreak: 0, road: 0, firstWin: -1,
    adv: { stars: {}, chests: {} },
    quests: { day: -1, list: [], bonus: false },
    daily: { day: -1, best: 0, plays: 0, code: '' },
    stats: { games: 0, wins: 0, kos: 0, dmg: 0, supers: 0, bombs: 0, rockets: 0, prisms: 0, fevers: 0, goals: 0 },
    settings: { sound: true, music: true, vibrate: true, shake: true },
    seen: {}, updated: 0,
  };
}
function progressScore(s) {
  let p = (s.trophies || 0) * 3 + (s.stats && s.stats.games || 0);
  for (const id in (s.heroes || {})) { const h = s.heroes[id]; if (h.owned) p += 40 + h.lvl * 25; }
  for (const k in ((s.adv && s.adv.stars) || {})) p += s.adv.stars[k] * 10;
  return p;
}
function mergeSaves(a, b) {
  const pa = progressScore(a), pb = progressScore(b);
  const win = pa > pb || (pa === pb && (a.updated || 0) >= (b.updated || 0)) ? a : b, lose = win === a ? b : a;
  win.best = Math.max(win.best || 0, lose.best || 0);
  if (lose.daily && win.daily && lose.daily.day === win.daily.day) win.daily.best = Math.max(win.daily.best, lose.daily.best);
  for (const k in ((lose.adv && lose.adv.stars) || {})) win.adv.stars[k] = Math.max(win.adv.stars[k] || 0, lose.adv.stars[k]);
  return win;
}

// The game defines SAVE_KEY, defaultSave() and mergeSaves(a, b) before this file.
function deepFill(t, d) {
  for (const k in d) {
    if (t[k] === undefined || t[k] === null) t[k] = JSON.parse(JSON.stringify(d[k]));
    else if (d[k] && typeof d[k] === 'object' && !Array.isArray(d[k]) && typeof t[k] === 'object') deepFill(t[k], d[k]);
  }

}
const Save = {
  data: null, cloud: { ref: null, ready: false, writing: false, pending: false, lastJson: '', failed: 0 }, onRemote: null,
  load() {
    this.data = defaultSave();

  },
  persistLocal() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(this.data)); } catch (e) { /* ignore */ } },
  persist() { this.data.updated = Date.now(); this.persistLocal(); clearTimeout(this._t); this._t = setTimeout(() => this.cloudWrite(), 900); },
  async cloudInit() {
    try {
      const cl = window.__asafClaude || window.claude;
      if (!cl || typeof cl.use !== 'function') return;
      const [db, user] = await Promise.all([cl.use('db'), cl.use('user')]);
      if (!db || !user) return;
      const id = await user.id();
      if (!id) return;
      const ref = db.doc('data/users/' + id + '/save');
      let timer = 0;
      const snap = await Promise.race([ref.get(), new Promise((_, rej) => { timer = setTimeout(() => rej(new Error('timeout')), 10000); })]);
      clearTimeout(timer);
      this.cloud.ref = ref;
      if (snap && snap.exists) {
        const body = snap.data();
        if (body && body.save) {
          const remote = deepFill(JSON.parse(JSON.stringify(body.save)), defaultSave());
          this.cloud.lastJson = JSON.stringify(body.save);
          this.data = mergeSaves(deepFill(this.data, defaultSave()), remote); this.persistLocal();

    if (c.writing) { c.pending = true; return; }

    if (json === c.lastJson) return;
    c.writing = true;
    c.ref.set({ save: JSON.parse(json) }).then(() => { c.lastJson = json; c.failed = 0; })

// ---------------------------------------------------------------- kit/codes.js (short brag codes you can paste in a group chat)
// Each field is [name, bits]. The code carries an 11-bit checksum, so a typo or a made-up code is rejected.
const B32 = '0123456789ABCDEFGHJKMNPQRSTVWXYZ'; // no I, L, O, U: easy to read out loud

      for (let i = 0; i < s.length; i += 4) parts.push(s.slice(i, i + 4));

      if ((hash32(salt + '|' + rawOf(f)) & 0x7FF) !== chk) return null;
      return f;

}

const BW = 7, BH = 7, PRISM_K = 6;

    const find = (i) => (parent[i] === i ? i : (parent[i] = find(parent[i])));
    const key = (c) => c[0] + ',' + c[1];
    for (let i = 0; i < rs.length; i++) for (let j = i + 1; j < rs.length; j++) {
      if (rs[i].k !== rs[j].k) continue;
      const s = new Set(rs[i].cells.map(key));
      if (rs[j].cells.some((c) => s.has(key(c)))) parent[find(j)] = find(i);
    }
    const map = new Map();
    rs.forEach((r, i) => { const p = find(i); if (!map.has(p)) map.set(p, []); map.get(p).push(r); });
    const groups = [];
    for (const list of map.values()) {
      const cells = new Map();
      for (const r of list) for (const c of r.cells) cells.set(key(c), c);
      const longest = list.reduce((m, r) => Math.max(m, r.cells.length), 0);
      const hasH = list.some((r) => r.dir === 'h'), hasV = list.some((r) => r.dir === 'v');
      let make = 0;
      if (longest >= 5) make = SPECIALS.prism;
      else if (hasH && hasV) make = SPECIALS.bomb;
      else if (longest === 4) make = list[0].dir === 'h' ? SPECIALS.rocketV : SPECIALS.rocketH;
      let at = null;
      if (make) {
        const arr = [...cells.values()];
        if (prefer) at = arr.find((c) => prefer.some((p) => p && p[0] === c[0] && p[1] === c[1])) || null;
        if (!at && make === SPECIALS.bomb) { // the corner/crossing cell
          const cnt = new Map(); for (const r of list) for (const c of r.cells) cnt.set(key(c), (cnt.get(key(c)) || 0) + 1);
          for (const [k2, n] of cnt) if (n > 1) { at = cells.get(k2); break; }
        }
        if (!at) { const lr = list.find((r) => r.cells.length === longest); at = lr.cells[Math.floor(lr.cells.length / 2)]; }
      }
      groups.push({ k: list[0].k, cells: [...cells.values()], make, at });
    }
    return groups;
  }

  // ---------------------------------------------------------------- clearing (with special chain reactions)
  // seeds: [{x,y,why}] specials to set off; groups: matched groups. Builds this.clearing and effect list.
  beginClear(groups, extra) {
    const clear = new Map(), made = [], fx = [];
    const key = (x, y) => x + ',' + y;
    const queue = [];
    const add = (x, y, delay) => {
      const c = this.at(x, y); if (!c) return;
      const kk = key(x, y);
      if (clear.has(kk)) return;
      clear.set(kk, { x, y, delay: delay || 0 });
      if (c.sp && !c.fired) { c.fired = true; queue.push({ x, y, c, delay: (delay || 0) + 0.06 }); }
    };
    for (const gr of groups) {
      for (const [x, y] of gr.cells) {
        if (gr.make && gr.at && gr.at[0] === x && gr.at[1] === y) continue;
        add(x, y, 0);
      }
      if (gr.make) {
        const c = this.at(gr.at[0], gr.at[1]);
        if (c && c.sp && !c.fired) { c.fired = true; queue.push({ x: gr.at[0], y: gr.at[1], c, delay: 0.06 }); clear.set(key(gr.at[0], gr.at[1]), { x: gr.at[0], y: gr.at[1], delay: 0 }); }
        else made.push({ x: gr.at[0], y: gr.at[1], sp: gr.make, k: gr.k });
      }
    }
    if (extra) extra(add, fx, queue);
    let guard = 0;
    while (queue.length && guard++ < 200) {
      const s = queue.shift(), d = s.delay;
      this.fire(s.x, s.y, s.c.sp, s.c.k, d, add, fx);
    }
    // don't clear a cell where a new special is being made
    for (const m of made) clear.delete(key(m.x, m.y));
    this.clearing = [...clear.values()];
    this.made = made; this.fx.push(...fx);
    let maxD = 0; for (const c of this.clearing) maxD = Math.max(maxD, c.delay);
    this.phase = 'clear'; this.t = 0.16 + maxD; this.clearT = 0;
    for (const c of this.clearing) { const g = this.at(c.x, c.y); if (g) g.popAt = c.delay; }
    if (this.ev.clear) this.ev.clear(this.clearing.length, this.chain, made);
  }
  fire(x, y, sp, k, d, add, fx) {
    if (sp === SPECIALS.rocketH) { fx.push({ t: 'row', y, x, d }); for (let i = 0; i < BW; i++) add(i, y, d + Math.abs(i - x) * 0.025); }
    else if (sp === SPECIALS.rocketV) { fx.push({ t: 'col', x, y, d }); for (let j = 0; j < BH; j++) add(x, j, d + Math.abs(j - y) * 0.025); }
    else if (sp === SPECIALS.bomb) { fx.push({ t: 'bomb', x, y, r: 2, d }); for (let j = -2; j <= 2; j++) for (let i = -2; i <= 2; i++) if (Math.abs(i) + Math.abs(j) <= 2) add(x + i, y + j, d + (Math.abs(i) + Math.abs(j)) * 0.03); }
    else if (sp === SPECIALS.prism) { const kk = this.commonKind(); this.prismKind(x, y, kk, d, add, fx); }
    if (this.ev.fire) this.ev.fire(sp);
  }
  commonKind() { const n = [0, 0, 0, 0, 0, 0]; for (let y = 0; y < BH; y++) for (let x = 0; x < BW; x++) { const c = this.g[y][x]; if (c && c.k < PRISM_K) n[c.k]++; } let b = 0; for (let i = 1; i < 6; i++) if (n[i] > n[b]) b = i; return b; }
  prismKind(x, y, kk, d, add, fx) {
    const targets = [];
    for (let j = 0; j < BH; j++) for (let i = 0; i < BW; i++) { const c = this.g[j][i]; if (c && c.k === kk) targets.push([i, j]); }
    fx.push({ t: 'prism', x, y, k: kk, targets, d });
    add(x, y, d);
    targets.forEach(([i, j], n) => add(i, j, d + 0.05 + n * 0.02));
  }

  // two specials (or a prism) swapped into each other
  comboSwap(a, b, ax, ay, bx, by) {
    const self = this;
    a.fired = true; b.fired = true;
    this.beginClear([], (add, fx, queue) => {
      const P = SPECIALS.prism, B = SPECIALS.bomb, isR = (s) => s === SPECIALS.rocketH || s === SPECIALS.rocketV;
      add(ax, ay, 0); add(bx, by, 0);
      if (a.sp === P && b.sp === P) {
        fx.push({ t: 'nova', x: bx, y: by, d: 0 });
        for (let j = 0; j < BH; j++) for (let i = 0; i < BW; i++) add(i, j, 0.05 + (Math.abs(i - bx) + Math.abs(j - by)) * 0.03);
      } else if (a.sp === P || b.sp === P) {
        const other = a.sp === P ? b : a, kk = other.k;
        if (other.sp) { // every gem of that colour becomes the other special and goes off
          const targets = [];
          for (let j = 0; j < BH; j++) for (let i = 0; i < BW; i++) { const c = self.g[j][i]; if (c && c.k === kk && !c.fired) { c.sp = other.sp === B ? B : (self.rng() < 0.5 ? SPECIALS.rocketH : SPECIALS.rocketV); targets.push([i, j]); } }
          fx.push({ t: 'prism', x: bx, y: by, k: kk, targets, d: 0 });
          targets.forEach(([i, j], n) => add(i, j, 0.2 + n * 0.05));
          self.fire(bx, by, other.sp, kk, 0.1, add, fx);
        } else self.prismKind(bx, by, kk, 0, add, fx);
      } else if (isR(a.sp) && isR(b.sp)) {
        self.fire(bx, by, SPECIALS.rocketH, a.k, 0, add, fx); self.fire(bx, by, SPECIALS.rocketV, a.k, 0, add, fx);
      } else if ((isR(a.sp) && b.sp === B) || (a.sp === B && isR(b.sp))) {
        for (let o = -1; o <= 1; o++) { if (by + o >= 0 && by + o < BH) self.fire(bx, by + o, SPECIALS.rocketH, a.k, 0.04, add, fx); if (bx + o >= 0 && bx + o < BW) self.fire(bx + o, by, SPECIALS.rocketV, a.k, 0.04, add, fx); }
      } else if (a.sp === B && b.sp === B) {
        fx.push({ t: 'bomb', x: bx, y: by, r: 3, d: 0 });
        for (let j = -3; j <= 3; j++) for (let i = -3; i <= 3; i++) if (Math.abs(i) + Math.abs(j) <= 4) add(bx + i, by + j, 0.03 * (Math.abs(i) + Math.abs(j)));
      }
      if (self.ev.combo) self.ev.combo(a.sp, b.sp);
    });
  }

  // ---------------------------------------------------------------- per-frame update
  update(dt) {
    // ease visual offsets of settled gems back to zero (swap animation)
    if (this.phase === 'swap' || this.phase === 'unswap' || this.phase === 'idle') {
      for (let y = 0; y < BH; y++) for (let x = 0; x < BW; x++) { const c = this.g[y][x]; if (!c) continue; const k = Math.min(1, dt * 18); c.ox -= c.ox * k; c.oy -= c.oy * k; if (Math.abs(c.ox) < 0.002) c.ox = 0; if (Math.abs(c.oy) < 0.002) c.oy = 0; }
    }
    for (let y = 0; y < BH; y++) for (let x = 0; x < BW; x++) { const c = this.g[y][x]; if (c && c.s < 1 && !c.popping) c.s = Math.min(1, c.s + dt * 5); }
    for (let i = this.fx.length - 1; i >= 0; i--) { const f = this.fx[i]; f.age = (f.age || 0) + dt; if (f.age > (f.d || 0) + 0.7) this.fx.splice(i, 1); }
    if (this.phase === 'idle') {
      this.idleT += dt;
      if (this.idleT > 3 && !this.hint) this.hint = this.findMove();
      return;
    }
    this.t -= dt;
    if (this.phase === 'swap') {
      if (this.t > 0) return;
      const [bx, by] = this.swapA, [ax, ay] = this.swapB, a = this.at(bx, by), b = this.at(ax, ay);
      for (const c of [a, b]) { c.ox = 0; c.oy = 0; }
      // a = the gem the player dragged (now at bx,by), b = the one it swapped with (now at ax,ay)
      if ((a.sp && b.sp) || a.sp === SPECIALS.prism || b.sp === SPECIALS.prism) { this.comboSwap(b, a, ax, ay, bx, by); return; }
      const gs = this.groups([[bx, by], [ax, ay]]);
      if (gs.length) { this.beginClear(gs); return; }
      // no match: swap back
      this.g[by][bx] = b; this.g[ay][ax] = a;
      a.ox = bx - ax; a.oy = by - ay; b.ox = ax - bx; b.oy = ay - by;
      this.phase = 'unswap'; this.t = 0.14;
      if (this.ev.bad) this.ev.bad();
    } else if (this.phase === 'unswap') {
      if (this.t <= 0) this.phase = 'idle';
    } else if (this.phase === 'clear') {
      this.clearT += dt;
      for (const cl of this.clearing) { const c = this.at(cl.x, cl.y); if (!c) continue; if (this.clearT >= cl.delay) { if (!c.popping) { c.popping = true; if (this.ev.collect) this.ev.collect(c.k, cl.x, cl.y, this.chain, c.sp); } c.pop = Math.min(1, (this.clearT - cl.delay) / 0.16); c.s = 1 + c.pop * 0.25; } }
      if (this.t > 0) return;
      for (const cl of this.clearing) { const c = this.at(cl.x, cl.y); if (c && !c.popping && this.ev.collect) this.ev.collect(c.k, cl.x, cl.y, this.chain, c.sp); this.g[cl.y][cl.x] = null; }
      for (const m of this.made) { const c = this.at(m.x, m.y); if (c) { c.sp = m.sp; if (m.sp === SPECIALS.prism) c.k = PRISM_K; c.s = 0.4; c.fired = false; } if (this.ev.made) this.ev.made(m.sp, m.x, m.y); }
      this.clearing = []; this.made = [];
      this.gravity();
      this.phase = 'fall';
    } else if (this.phase === 'fall') {
      let moving = false;
      for (let y = 0; y < BH; y++) for (let x = 0; x < BW; x++) {
        const c = this.g[y][x]; if (!c || c.oy >= 0) continue;
        c.vy = Math.min(c.vy + dt * 70, 22); c.oy += c.vy * dt;
        if (c.oy >= 0) { c.oy = 0; c.bounce = 1; c.vy = 0; } else moving = true;
      }
      if (moving) return;
      if (this.noMatchAfterFall) { this.noMatchAfterFall = false; this.phase = 'idle'; return; }
      const gs = this.groups(null);
      if (gs.length) { this.chain++; if (this.ev.cascade) this.ev.cascade(this.chain); this.beginClear(gs); return; }
      this.phase = 'idle'; this.idleT = 0;
      if (!this.findMove()) this.shuffle();
    }
  }
  gravity() {
    for (let x = 0; x < BW; x++) {
      let write = BH - 1;
      for (let y = BH - 1; y >= 0; y--) { const c = this.g[y][x]; if (c) { if (write !== y) { this.g[write][x] = c; this.g[y][x] = null; c.oy -= write - y; c.vy = 0; } write--; } }
      const missing = write + 1;
      for (let y = write; y >= 0; y--) { const c = this.gem(this.randKind()); c.oy = -missing - 0.35; c.vy = 0; this.g[y][x] = c; }
    }
  }

  // ---------------------------------------------------------------- moves, hints, shuffles
  findMove() {
    const k = (x, y) => this.kind(x, y);
    const isSp = (x, y) => { const c = this.at(x, y); return c && c.sp; };
    const test = (x1, y1, x2, y2) => {
      if (!this.at(x2, y2)) return false;
      if (k(x1, y1) === PRISM_K || k(x2, y2) === PRISM_K || (isSp(x1, y1) && isSp(x2, y2))) return true;
      const swap = (x, y) => (x === x1 && y === y1 ? k(x2, y2) : x === x2 && y === y2 ? k(x1, y1) : k(x, y));
      for (const [cx, cy] of [[x1, y1], [x2, y2]]) {
        const kk = swap(cx, cy);
        let h = 1, v = 1;
        for (let i = cx - 1; i >= 0 && swap(i, cy) === kk; i--) h++;
        for (let i = cx + 1; i < BW && swap(i, cy) === kk; i++) h++;
        for (let j = cy - 1; j >= 0 && swap(cx, j) === kk; j--) v++;
        for (let j = cy + 1; j < BH && swap(cx, j) === kk; j++) v++;
        if (h >= 3 || v >= 3) return true;
      }
      return false;
    };
    for (let y = 0; y < BH; y++) for (let x = 0; x < BW; x++) {
      if (test(x, y, x + 1, y)) return [[x, y], [x + 1, y]];
      if (test(x, y, x, y + 1)) return [[x, y], [x, y + 1]];
    }
    return null;
  }
  shuffle() {
    const list = [];
    for (let y = 0; y < BH; y++) for (let x = 0; x < BW; x++) list.push(this.g[y][x]);
    for (let tries = 0; tries < 60; tries++) {
      for (let i = list.length - 1; i > 0; i--) { const j = Math.floor(this.rng() * (i + 1)); [list[i], list[j]] = [list[j], list[i]]; }
      for (let y = 0; y < BH; y++) for (let x = 0; x < BW; x++) { this.g[y][x] = list[y * BW + x]; }
      if (!this.groups(null).length && this.findMove()) break;
    }
    if (!this.findMove() || this.groups(null).length) this.fill();
    for (let y = 0; y < BH; y++) for (let x = 0; x < BW; x++) { const c = this.g[y][x]; c.s = 0.2; c.ox = 0; c.oy = 0; }
    if (this.ev.shuffle) this.ev.shuffle();
  }
  // Overdrive: set off every special left on the board, one after another
  overdrive() {
    const list = [];
    for (let y = 0; y < BH; y++) for (let x = 0; x < BW; x++) { const c = this.g[y][x]; if (c && c.sp) list.push([x, y]); }
    if (!list.length || this.phase !== 'idle') return false;
    this.chain = 0;
    this.beginClear([], (add) => { list.forEach(([x, y], i) => add(x, y, i * 0.12)); });
    return true;
  }
  settled() { return this.phase === 'idle'; }
}

// ---------------------------------------------------------------- rush.js (Gem Rush: the 30-second power-up board before each battle)
const Rush = {
  on: false, b: null, phase: 'off', t: 0, dur: RUSH_TIME, heat: 0, multI: 0, fever: false,
  power: [0, 0, 0], lvl: [0, 0, 0], superCh: 0, shield: 0, credits: 0, score: 0, made: { beam: 0, pulse: 0, nova: 0 }, fevers: 0, combos: 0,
  foeTotal: 30, foeCur: 0, opts: null, fly: [], parts: [], sel: null, drag: null, banner: '', bannerT: 0, comboT: 0, comboTxt: '', comboSub: '',
  cv: null, ctx: null, cs: 40, pad: 8, W: 0, bg: null, dpr: 1, ticked: -1,

  init() {
    this.cv = document.getElementById('board'); this.ctx = this.cv.getContext('2d');
    this.flyCv = document.getElementById('flyCv'); this.fctx = this.flyCv.getContext('2d');
    const cv = this.cv;
    cv.addEventListener('pointerdown', (e) => this.down(e));
    cv.addEventListener('pointermove', (e) => this.move(e));
    window.addEventListener('pointerup', (e) => this.up(e));
    window.addEventListener('pointercancel', () => { this.drag = null; });
  },
  // opts: { squad: [3 ids], seed, foeTotal, boosters: {rocket, bomb, time}, onDone(result) }
  start(opts) {
    this.opts = opts; this.on = true;
    this.dur = RUSH_TIME + (opts.boosters && opts.boosters.time ? 5 : 0);
    this.t = this.dur; this.heat = 0; this.multI = 0; this.fever = false;
    this.power = [0, 0, 0]; this.lvl = [0, 0, 0]; this.superCh = 0; this.shield = 0; this.credits = 0; this.score = 0;
    this.made = { beam: 0, pulse: 0, nova: 0 }; this.fevers = 0; this.combos = 0; this.foeTotal = opts.foeTotal; this.foeCur = 0;
    this.fly = []; this.parts = []; this.sel = null; this.drag = null; this.ticked = -1; this.comboT = 0; this.odDone = false; this.played = 0;
    const rng = makeRng(opts.seed >>> 0);
    this.b = new Board(rng, this.events());
    if (opts.boosters) {
      const spots = [[1, 5], [5, 1], [3, 3]];
      if (opts.boosters.rocket) { this.b.place(1, 5, SPECIALS.rocketH); this.b.place(5, 1, SPECIALS.rocketV); }
      if (opts.boosters.bomb) this.b.place(3, 3, SPECIALS.bomb);
      void spots;
    }
    this.b.dropIn(); this.b.locked = true;
    this.phase = 'intro'; this.introT = 1.5; this.say('READY', 1.1);
    // cards
    opts.squad.forEach((id, i) => {
      const c = document.getElementById('rc' + i), h = HERO_BY_ID[id];
      c.querySelector('img.face').src = bustURL(id, 78);
      c.querySelector('.nm').textContent = h.name;
      c.querySelector('img.gemtag').src = gemURL(i, 22);
    });
    this.dom();
    this.resize();
  },
  events() {
    const R = this;
    return {
      swap() { Sfx.swap(); },
      bad() { Sfx.bad(); buzz(15); },
      clear(n, chain, made) {
        R.heat = Math.min(1.25, R.heat + 0.17 + 0.05 * chain + (made.length ? 0.08 : 0));
        Sfx.match(chain);
        if (chain >= 2) R.combo(['', '', 'NICE', 'GREAT', 'AMAZING', 'UNSTOPPABLE'][Math.min(5, chain)] || 'UNSTOPPABLE', 'CHAIN ×' + chain);
      },
      cascade() { },
      made(sp, x, y) {
        const c = R.b.at(x, y), k = c ? c.k : 0;
        if (sp === SPECIALS.prism) R.made.nova++; else if (sp === SPECIALS.bomb) R.made.pulse++; else R.made.beam++;
        if (k < 3) R.power[k] += 2;
        R.score += 40; Sfx.made(sp);
        R.burst(x, y, '#ffffff', 10);
      },
      fire(sp) { Sfx.special(sp); if (sp === SPECIALS.bomb || sp === SPECIALS.prism) { R.shake = 0.25; buzz(25); } },
      combo() { R.combos++; R.score += 150; R.combo('COMBO', 'SPECIALS FUSED'); buzz(40); },
      shuffle() { R.say('SHUFFLE', 0.8); },
      collect(k, x, y, chain, sp) { R.collect(k, x, y, chain, sp); },
    };
  },
  mult() { return RUSH_MULTS[this.multI]; },
  collect(k, x, y, chain, sp) {
    const m = this.mult();
    if (k < 3) this.power[k] += m;
    else if (k === 3) this.superCh = Math.min(1, this.superCh + 0.03 * m);
    else if (k === 4) this.shield = Math.min(0.45, this.shield + 0.012 * m);
    else if (k === 5) this.credits += m;
    else if (k === 6) for (let i = 0; i < 3; i++) this.power[i] += 1;
    this.score += Math.round(10 * m * (1 + 0.25 * chain));
    this.burst(x, y, GEM_COL[Math.min(5, k)] || '#ffffff', 5);
    if (this.fly.length < 34 && k < 6) this.fly.push({ k, x, y, t: 0, dur: 0.42 + Math.random() * 0.18, wob: (Math.random() - 0.5) * 120 });
  },
  burst(x, y, col, n) {
    for (let i = 0; i < n && this.parts.length < 180; i++) { const a = Math.random() * TAU, s = 2 + Math.random() * 5; this.parts.push({ x: x + 0.5, y: y + 0.5, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.35 + Math.random() * 0.3, t: 0, col }); }
  },
  say(txt, t) { this.banner = txt; this.bannerT = t; const el = document.getElementById('rcBanner'); el.textContent = txt; el.classList.remove('show'); void el.offsetWidth; el.classList.add('show'); },
  combo(txt, sub) { this.comboTxt = txt; this.comboSub = sub; this.comboT = 1.0; const el = document.getElementById('rcCombo'); el.innerHTML = txt + '<small>' + sub + '</small>'; el.classList.remove('show'); void el.offsetWidth; el.classList.add('show'); },

  // ---------------------------------------------------------------- input
  cellAt(e) {
    const r = this.cv.getBoundingClientRect(), x = (e.clientX - r.left - this.pad) / this.cs, y = (e.clientY - r.top - this.pad) / this.cs;
    return [x, y];
  },
  down(e) {
    if (!this.on || this.phase !== 'play') return;
    Snd.init();
    const [fx, fy] = this.cellAt(e), x = Math.floor(fx), y = Math.floor(fy);
    if (x < 0 || y < 0 || x >= BW || y >= BH) return;
    this.drag = { x, y, fx, fy, moved: false, id: e.pointerId };
    try { this.cv.setPointerCapture(e.pointerId); } catch (err) { /* old browser */ }
  },
  move(e) {
    const d = this.drag; if (!d || d.moved) return;
    const [fx, fy] = this.cellAt(e), dx = fx - d.fx, dy = fy - d.fy;

  // ---------------------------------------------------------------- per-step update

// ---------------------------------------------------------------- boss mechs: telegraphed attacks you can dodge
const BossAI = {
  step(B, u, dt) {
    if (u.stunT > 0) return;
    const foes = B.units.filter((e) => e.alive && e.team !== u.team);
    if (!foes.length) return;
    const t = foes.reduce((a, e) => (dist2(e.x, e.y, u.x, u.y) < dist2(a.x, a.y, u.x, u.y) ? e : a), foes[0]);
    const d = Math.hypot(t.x - u.x, t.y - u.y);
    u.bossPhase = u.hp < u.max * 0.5 ? 1 : 0;
    if (u.charge) {
      const ch = u.charge; ch.t += dt;
      if (ch.t > ch.wind) {
        const sp = 11;
        B.moveUnit(u, Math.cos(ch.ang) * sp * dt, Math.sin(ch.ang) * sp * dt); u.run = 1;
        for (const e of foes) if (!ch.hit.has(e) && Math.hypot(e.x - u.x, e.y - u.y) < u.r + e.r) { ch.hit.add(e); B.hurt(e, 1700 * u.dmgK, u); if (e.alive) B.knock(e, Math.cos(ch.ang + Math.PI / 2), Math.sin(ch.ang + Math.PI / 2), 1.8); }
        if (ch.t > ch.wind + 0.65) { u.charge = null; B.emit({ t: 'boom', x: u.x, y: u.y, big: true }); }
      }
      return;
    }
    // walk toward the nearest agent, keep a little distance
    const want = 3.2;
    if (d > want) { const k = Math.min(1, (d - want)); B.moveUnit(u, (t.x - u.x) / d * u.B.spd * k * dt, (t.y - u.y) / d * u.B.spd * k * dt); u.run = Math.min(1, u.run + dt * 4); }
    else u.run = Math.max(0, u.run - dt * 4);
    u.ang = turnTo(u.ang, Math.atan2(t.y - u.y, t.x - u.x), dt * 3);
    u.bossCd -= dt * (u.bossPhase ? 1.45 : 1.1);
    if (u.bossCd > 0) return;
    const pat = this.patterns[u.boss], pick = pat[Math.floor(B.rng() * pat.length)];
    u.bossCd = pick(B, u, t, foes) || 2.4;
  },
  warn(B, u, x, y, r, delay, dmg, extra) { B.areas.push(Object.assign({ kind: 'warn', team: u.team, owner: u, x, y, r, t: 0, delay, dmg: dmg * u.dmgK * 1.6 }, extra || {})); },
  ring(B, u, n, look, dmg, slow) {
    for (let i = 0; i < n; i++) { const a = i / n * TAU + B.t; B.shots.push({ team: u.team, owner: u, x: u.x, y: u.y, vx: Math.cos(a) * 8, vy: Math.sin(a) * 8, left: 11, range: 11, dmg: dmg * u.dmgK * 1.5, r: 0.22, look, big: true, slow, slowT: slow ? 1.5 : 0, hits: null }); }
    B.emit({ t: 'bossfire', x: u.x, y: u.y });
  },
  patterns: {
    sentinel: [
      (B, u) => { BossAI.ring(B, u, u.bossPhase ? 16 : 12, 'boss', 420); return 2.2; },
      (B, u, t) => { const a = Math.atan2(t.y - u.y, t.x - u.x); BossAI.warn(B, u, u.x, u.y, 0.65, 0.9, 950, { line: true, x2: u.x + Math.cos(a) * 14, y2: u.y + Math.sin(a) * 14, col: '#ff3d5a' }); return 2.4; },
      (B, u, t, foes) => { for (const e of foes) BossAI.warn(B, u, e.x + (e.vx || 0) * 0.6, e.y + (e.vy || 0) * 0.6, 1.3, 1.1, 800); return 2.6; },
    ],
    titan: [
      (B, u, t) => { const a = Math.atan2(t.y - u.y, t.x - u.x); u.charge = { t: 0, wind: 0.75, ang: a, hit: new Set() }; BossAI.warn(B, u, u.x, u.y, 1.1, 0.75, 0, { line: true, x2: u.x + Math.cos(a) * 7.5, y2: u.y + Math.sin(a) * 7.5, col: '#ff8a1f' }); return 2.6; },
      (B, u) => { BossAI.warn(B, u, u.x, u.y, 3.2, 1.0, 1000, { col: '#ff8a1f' }); return 2.4; },
      (B, u, t, foes) => { for (let i = 0; i < (u.bossPhase ? 7 : 5); i++) { const e = foes[i % foes.length]; BossAI.warn(B, u, e.x + (B.rng() - 0.5) * 4, e.y + (B.rng() - 0.5) * 4, 1.2, 1.2 + i * 0.08, 900, { col: '#ff8a1f' }); } return 2.8; },
    ],
    colossus: [
      (B, u, t, foes) => { for (const e of foes) BossAI.warn(B, u, e.x + (e.vx || 0) * 0.8, e.y + (e.vy || 0) * 0.8, 1.5, 1.0, 950, { slow: 0.5, col: '#36e6ff' }); return 2.3; },
      (B, u) => { BossAI.ring(B, u, u.bossPhase ? 18 : 14, 'shard', 380, 0.4); return 2.2; },
      (B, u, t) => { const a = Math.atan2(t.y - u.y, t.x - u.x); u.charge = { t: 0, wind: 0.7, ang: a, hit: new Set() }; BossAI.warn(B, u, u.x, u.y, 1.2, 0.7, 0, { line: true, x2: u.x + Math.cos(a) * 7.5, y2: u.y + Math.sin(a) * 7.5, col: '#36e6ff' }); return 2.5; },
    ],
  },
};

// ---------------------------------------------------------------- render.js (draws the battle; camera, layers, effects, boss mechs)
const Render = {
  cv: null, ctx: null, W: 0, H: 0, dpr: 1, T: 34, cam: [0, 0], ground: null, gVer: -1, gT: 0, pops: [], shakeA: 0, t: 0,
  init() { this.cv = document.getElementById('cv'); this.ctx = this.cv.getContext('2d'); this.resize(); },
  resize() {

    const port = this.H > this.W;
    this.T = port ? clamp(this.W / 11.2, 26, 48) : this.W < 1000 ? clamp(this.H / 10.5, 26, 46) : clamp(Math.min(this.W / 21, this.H / 12.5), 30, 56);

  },
  shake(a) { if (Save.data.settings.shake) this.shakeA = Math.max(this.shakeA, a); },
  pop(x, y, txt, col, big, key, n) {
    if (key) { const p = this.pops.find((q) => q.key === key && q.age < 0.45); if (p) { p.n += n; p.txt = fmtInt(p.n); p.x = x; p.y = y; p.age = Math.min(p.age, 0.12); p.big = p.big || big; return; } }
    if (this.pops.length < 40) this.pops.push({ x: x + (key ? 0 : (Math.random() - 0.5) * 0.4), y, txt, col, age: 0, big, key, n: n || 0 }); },
  camTarget(B) {
    const me = B.me;
    if (!me) return [B.M.W / 2, B.M.H / 2];
    let x = me.alive ? me.x : me.spawn[0], y = me.alive ? me.y : me.spawn[1];
    const la = Input.aiming ? 1.6 : 0.6;
    if (me.alive) { x += Math.cos(me.ang) * la; y += Math.sin(me.ang) * la; }
    y -= 1.2;
    const vw = this.W / this.T, vh = this.H / this.T, M = B.M;
    x = vw >= M.W + 1 ? M.W / 2 : clamp(x, vw / 2 - 0.6, M.W - vw / 2 + 0.6);
    const below = this.H > this.W ? 150 / this.T + 0.6 : document.body.classList.contains('desk') ? 0.8 : 2.2;  // leave room under the arena for the thumb sticks
    y = vh >= M.H + 3 + below ? M.H / 2 + below / 2 : clamp(y, vh / 2 - 1.2, M.H - vh / 2 + below);
    return [x, y];
  },
  draw(B, dt) {
    this.t += dt;
    const ctx = this.ctx, T = this.T, M = B.M, W = this.W, H = this.H, t = this.t;
    if (this.gVer !== M.ver || this.gT !== T) { this.ground = renderGround(M, T * this.dpr); this.gVer = M.ver; this.gT = T; }
    const [tx, ty] = this.camTarget(B);
    if (this.snap) { this.cam = [tx, ty]; this.snap = false; }
    const k = Math.min(1, dt * 6); this.cam[0] += (tx - this.cam[0]) * k; this.cam[1] += (ty - this.cam[1]) * k;

    let sx = 0, sy = 0;
    if (this.shakeA > 0) { sx = (Math.random() - 0.5) * this.shakeA * T * 0.5; sy = (Math.random() - 0.5) * this.shakeA * T * 0.5; this.shakeA = Math.max(0, this.shakeA - dt * 3); }
    const ox = Math.round(W / 2 - this.cam[0] * T + sx), oy = Math.round(H / 2 - this.cam[1] * T + sy);
    ctx.translate(ox, oy);
    drawArenaBorder(ctx, M, T, t);
    // visible tile window

      const A = me.h.atk;
      if (Input.aimSuper && me.sup >= 1) { const S = me.h.sup, r = S.range || S.dist || 5; drawAimGuide(ctx, me.x * T, me.y * T, T, Input.aimAng, Math.min(r, Input.aimDist || r), S.kind === 'volley' ? S.spread / 2 : 0, 'rgba(255,197,58,.22)'); }
      else if (A.lob) { const dd = Math.min(A.range, Input.aimDist || A.range); ctx.beginPath(); ctx.arc((me.x + Math.cos(Input.aimAng) * dd) * T, (me.y + Math.sin(Input.aimAng) * dd) * T, (A.splash || 1) * T, 0, TAU); ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fill(); ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 1.5; ctx.stroke(); }

      const kk = M.t[y * M.W + x];

      if (u.dropT > 0) continue;

    for (let i = this.pops.length - 1; i >= 0; i--) { this.pops[i].age += dt; if (this.pops[i].age > 0.9) this.pops.splice(i, 1); }
  },
  drawUnit(ctx, B, u, T, t) {

    const x = u.x * T, y = u.y * T, z = (u.z || 0) * T;
    if (u.dropT > 0) { // beaming in at the start

      ctx.save(); ctx.globalCompositeOperation = 'lighter'; const g = ctx.createLinearGradient(0, y - T * 6, 0, y); g.addColorStop(0, hexA(TEAM_COL[u.team], 0)); g.addColorStop(1, hexA(TEAM_COL[u.team], 0.7 * (1 - k)));
      ctx.fillStyle = g; ctx.fillRect(x - T * 0.4, y - T * 6, T * 0.8, T * 6); ctx.restore();

    drawTeamRing(ctx, x, y, T, u.team, u === B.me, u.sup >= 1, t);
    const inB = B.inBush(u);

    if (u.slowT > 0) { ctx.strokeStyle = 'rgba(160,240,255,.7)'; ctx.lineWidth = T * 0.04; ctx.beginPath(); ctx.arc(x, y, T * 0.6, 0, TAU); ctx.stroke(); }

  },
  drawShotFull(ctx, s, T, t) {

      ctx.beginPath(); ctx.arc(s.tx * T, s.ty * T, (s.splash || 1) * T, 0, TAU); ctx.strokeStyle = hexA((SHOT_LOOK[s.look] || SHOT_LOOK.bolt)[0], 0.5); ctx.setLineDash([T * 0.15, T * 0.12]); ctx.lineWidth = T * 0.04; ctx.stroke(); ctx.setLineDash([]);

  },
  drawArea(ctx, a, T, t) {

      if (a.line) {
        const x2 = a.x2 * T, y2 = a.y2 * T, ang = Math.atan2(y2 - y, x2 - x), L = Math.hypot(x2 - x, y2 - y);
        ctx.translate(x, y); ctx.rotate(ang);

  },
  drawZone(ctx, B, T, t) {

    const g = ctx.createRadialGradient(x, y - T * 0.15, 0, x, y - T * 0.15, T * 0.8); g.addColorStop(0, 'rgba(61,255,168,.55)'); g.addColorStop(1, 'rgba(61,255,168,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y - T * 0.15, T * 0.8, 0, TAU); ctx.fill();
    ctx.restore();
    ctx.beginPath(); ctx.arc(x, y - T * 0.15, T * 0.3, 0, TAU); ctx.fillStyle = '#dfffee'; ctx.fill(); ctx.strokeStyle = '#3dffa8'; ctx.lineWidth = T * 0.05; ctx.stroke();

    const x = tu.x * T, y = tu.y * T;
    drawShadow(ctx, x, y, T, 0.8);
    drawTeamRing(ctx, x, y, T * 0.8, tu.team, false, false, t);
    ctx.save(); ctx.translate(x, y);
    ctx.beginPath(); for (let i = 0; i < 6; i++) { const a = i / 6 * TAU; ctx.lineTo(Math.cos(a) * T * 0.36, Math.sin(a) * T * 0.36); } ctx.closePath();
    ctx.fillStyle = tu.hitT > 0 ? '#ffffff' : '#3a332c'; ctx.fill(); ctx.strokeStyle = '#ff8a1f'; ctx.lineWidth = T * 0.04; ctx.stroke();
    ctx.rotate(tu.ang); ctx.fillStyle = '#1b2030'; ctx.fillRect(0, -T * 0.08, T * 0.5, T * 0.16); ctx.fillStyle = '#ff8a1f'; ctx.fillRect(T * 0.4, -T * 0.05, T * 0.12, T * 0.1);
    ctx.restore();
    const f = clamp(tu.hp / tu.max, 0, 1), w = T * 0.8; ctx.fillStyle = 'rgba(0,0,0,.7)'; ctx.fillRect(x - w / 2, y - T * 0.7, w, T * 0.08); ctx.fillStyle = TEAM_COL[tu.team]; ctx.fillRect(x - w / 2, y - T * 0.7, w * f, T * 0.08);
    const lf = 1 - tu.t / tu.dur; ctx.fillStyle = '#ffb43a'; ctx.fillRect(x - w / 2, y - T * 0.6, w * lf, T * 0.04);
  },
  drawFx(ctx, f, T, t) {
    const x = f.x * T, y = f.y * T;
    switch (f.t) {
      case 'spark': drawSpark(ctx, x, y, T, f.age, f.col); break;
      case 'poof': drawPoof(ctx, x, y, T, f.age, f.col); break;
      case 'podhit': drawSpark(ctx, x, y - T * 0.2, T, f.age, '#d0b0ff'); break;
      case 'blast': {
        const k = clamp(f.age / 0.45, 0, 1), r = f.r * T * (0.4 + k * 0.7);

        const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, 'rgba(255,255,255,.8)'); g.addColorStop(0.4, hexA(f.col, 0.6)); g.addColorStop(1, hexA(f.col, 0));
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
        ctx.strokeStyle = f.col; ctx.lineWidth = T * 0.08 * (1 - k); ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke();
        ctx.restore(); break;
      }
      case 'beam': {
        const k = clamp(f.age / 0.6, 0, 1);
        ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 1 - k;
        const g = ctx.createLinearGradient(0, y - T * 5, 0, y); g.addColorStop(0, hexA(f.col, 0)); g.addColorStop(1, hexA(f.col, 0.8));
        ctx.fillStyle = g; ctx.fillRect(x - T * 0.35 * (1 - k), y - T * 5, T * 0.7 * (1 - k), T * 5); ctx.restore(); break;
      }
      case 'blink': {
        const k = clamp(f.age / 0.4, 0, 1);
        ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 1 - k; ctx.strokeStyle = '#ff3dc8'; ctx.lineWidth = T * 0.12 * (1 - k);
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(f.x2 * T, f.y2 * T); ctx.stroke(); ctx.restore(); break;
      }
      case 'debris': {
        const k = clamp(f.age / 0.7, 0, 1);
        ctx.save(); ctx.globalAlpha = 1 - k;
        for (let i = 0; i < 8; i++) { const a = i / 8 * TAU + 0.3, dd = T * (0.2 + k * 1.1); ctx.fillStyle = i % 2 ? f.col : '#2c3a58'; ctx.fillRect(x + Math.cos(a) * dd - T * 0.08, y + Math.sin(a) * dd - T * 0.08 - k * T * 0.3, T * 0.16, T * 0.16); }
        ctx.restore(); break;
      }
    }
  },
  // ---------------------------------------------------------------- boss mechs (top-down)
  drawBoss(ctx, B, u, T, t) {
    const x = u.x * T, y = u.y * T, s = T * u.r / 30;
    drawShadow(ctx, x, y, T, u.r * 2.4);
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    const hit = u.hitT > 0, A = u.boss, run = u.run || 0, ph = t * 9;
    const metal = hit ? '#ffffff' : '#2a3142', plate = hit ? '#ffffff' : '#46506a', ac = A === 'titan' ? '#ff8a1f' : A === 'colossus' ? '#36e6ff' : '#ff3d5a';
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    if (A === 'sentinel') {
      for (let i = 0; i < 6; i++) { // legs
        const a = (i / 6) * TAU + Math.PI / 6, w = Math.sin(ph + i * 1.7) * 0.18 * run;
        const k1x = Math.cos(a + w) * 34, k1y = Math.sin(a + w) * 34, k2x = Math.cos(a + w * 0.5) * 52, k2y = Math.sin(a + w * 0.5) * 52;
        ctx.strokeStyle = OUT; ctx.lineWidth = 10; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(k1x, k1y); ctx.lineTo(k2x, k2y); ctx.stroke();
        ctx.strokeStyle = plate; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(k1x, k1y); ctx.lineTo(k2x, k2y); ctx.stroke();
        ctx.fillStyle = ac; ctx.beginPath(); ctx.arc(k2x, k2y, 3, 0, TAU); ctx.fill();
      }
      ctx.rotate(u.ang);
      ctx.beginPath(); for (let i = 0; i < 6; i++) { const a = i / 6 * TAU; ctx.lineTo(Math.cos(a) * 30, Math.sin(a) * 30); } ctx.closePath();
      ctx.fillStyle = hit ? '#fff' : grad(ctx, -30, -30, 30, 30, ['#4d5876', '#232a3a']); ctx.fill(); ctx.strokeStyle = OUT; ctx.lineWidth = 3; ctx.stroke();
      ctx.strokeStyle = hexA(ac, 0.8); ctx.lineWidth = 2; ctx.beginPath(); for (let i = 0; i < 6; i++) { const a = i / 6 * TAU; ctx.lineTo(Math.cos(a) * 22, Math.sin(a) * 22); } ctx.closePath(); ctx.stroke();
      ctx.fillStyle = '#1b2030'; ctx.fillRect(14, -6, 26, 12); ctx.fillStyle = ac; ctx.fillRect(36, -3, 6, 6);
      glowDot(ctx, 0, 0, 22, hexA(ac, 0.9)); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, 6, 0, TAU); ctx.fill();
    } else if (A === 'titan') {
      ctx.rotate(u.ang);
      for (const sy of [-1, 1]) { // treads
        ctx.fillStyle = '#15181f'; ctx.fillRect(-34, sy * 22 - 9, 64, 18); ctx.strokeStyle = OUT; ctx.lineWidth = 3; ctx.strokeRect(-34, sy * 22 - 9, 64, 18);
        ctx.fillStyle = '#3a3f4c'; for (let i = 0; i < 8; i++) ctx.fillRect(-32 + ((i * 8 + t * 40 * run) % 64), sy * 22 - 8, 3, 16);
      }
      ctx.fillStyle = hit ? '#fff' : grad(ctx, -30, -20, 30, 20, ['#5c534a', '#2e2924']); ctx.beginPath(); rrect(ctx, -30, -20, 56, 40, 8); ctx.fill(); ctx.strokeStyle = OUT; ctx.lineWidth = 3; ctx.stroke();
      ctx.save(); ctx.translate(30, 0); ctx.rotate(t * 8); // drill
      ctx.fillStyle = '#9aa3b5'; ctx.beginPath(); ctx.moveTo(0, -16); ctx.lineTo(34, 0); ctx.lineTo(0, 16); ctx.closePath(); ctx.fill(); ctx.strokeStyle = OUT; ctx.lineWidth = 2.5; ctx.stroke();
      ctx.strokeStyle = '#5c6478'; ctx.lineWidth = 2; for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.moveTo(6 + i * 9, -12 + i * 4); ctx.lineTo(10 + i * 9, 12 - i * 4); ctx.stroke(); }
      ctx.restore();
      for (let i = 0; i < 3; i++) { ctx.fillStyle = hexA(ac, 0.9); ctx.fillRect(-20 + i * 12, -4, 6, 8); }
      glowDot(ctx, -16, 0, 18, hexA(ac, 0.6));
    } else {
      ctx.rotate(u.ang);
      for (const sy of [-1, 1]) { const st = Math.sin(ph + (sy > 0 ? Math.PI : 0)) * 6 * run; ctx.fillStyle = metal; ctx.beginPath(); rrect(ctx, -14 + st, sy * 18 - 8, 24, 16, 7); ctx.fill(); ctx.strokeStyle = OUT; ctx.lineWidth = 3; ctx.stroke(); }
      ctx.fillStyle = hit ? '#fff' : rgrad(ctx, -6, -8, 4, 36, ['#e8f6ff', '#9fc4dc', '#4a6a86']); ctx.beginPath(); ctx.arc(0, 0, 30, 0, TAU); ctx.fill(); ctx.strokeStyle = OUT; ctx.lineWidth = 3; ctx.stroke();
      for (const sy of [-1, 1]) { ctx.fillStyle = hit ? '#fff' : '#cfeaff'; ctx.beginPath(); poly(ctx, [-12, sy * 22, 14, sy * 20, 20, sy * 36, -10, sy * 40]); ctx.fill(); ctx.strokeStyle = OUT; ctx.lineWidth = 2.5; ctx.stroke(); }
      ctx.fillStyle = '#2b3a4c'; ctx.beginPath(); ctx.arc(12, 0, 11, 0, TAU); ctx.fill(); ctx.strokeStyle = OUT; ctx.stroke();
      ctx.strokeStyle = ac; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(12, 0, 7, -0.9, 0.9); ctx.stroke();
      glowDot(ctx, 0, 0, 28, hexA(ac, 0.45));
    }
    ctx.restore();
  },
};

// music: lobby (calm pulse), rush (fast arps), battle (driving), boss (heavy)
const SONGS = (() => {
  const N = (n) => mtof(n);
  const prog = [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]];
  return {
    lobby: { bpm: 96, div: 4, play(m, t, s, spb) {
      const bar = Math.floor(s / 16) % 4, st = s % 16, ch = prog[bar];
      if (st === 0) m.pad(t, ch.map((n) => N(n)), spb * 15, 0.8);
      if (st % 4 === 0) m.bass(t, N(ch[0] - 24), spb * 2, 0.5, 600);
      if (st % 2 === 0) m.bell(t, N(ch[(st / 2) % 3] + 12), spb * 1.5, 0.35);
      if (st === 4 || st === 12) m.hat(t, 0.6);
    } },
    rush: { bpm: 150, div: 4, play(m, t, s, spb) {
      const bar = Math.floor(s / 16) % 4, st = s % 16, ch = prog[bar];
      if (st % 4 === 0) m.kick(t, 0.8);
      if (st % 8 === 4) m.clap(t, 0.8);
      m.hat(t, st % 2 ? 0.5 : 0.9);
      if (st % 2 === 0) m.bass(t, N(ch[0] - 24 + (st % 4 === 2 ? 12 : 0)), spb * 1.6, 0.55, 1800);
      m.lead(t, N(ch[st % 3] + 12 + (st % 6 === 5 ? 12 : 0)), spb * 0.8, 0.45, 'square');
    } },
    battle: { bpm: 128, div: 4, play(m, t, s, spb) {
      const bar = Math.floor(s / 16) % 4, st = s % 16, ch = prog[bar];
      if (st % 4 === 0) m.kick(t, 0.9);
      if (st % 8 === 4) m.snare(t, 0.8);
      if (st % 2) m.hat(t, 0.5);
      if (st % 4 !== 1) m.bass(t, N(ch[0] - 24 + (st === 14 ? 7 : 0)), spb * 1.2, 0.6, 1400);
      if (st === 0) m.pad(t, ch.map((n) => N(n)), spb * 14, 0.6);
      if ([0, 3, 6, 10, 12].includes(st)) m.lead(t, N(ch[(st >> 1) % 3] + 12), spb * 1.4, 0.35, 'sawtooth');
    } },
    boss: { bpm: 112, div: 4, play(m, t, s, spb) {
      const bar = Math.floor(s / 16) % 4, st = s % 16, root = [45, 45, 46, 43][bar];
      if (st % 4 === 0 || st === 14) m.kick(t, 1);
      if (st % 8 === 4) m.snare(t, 1);
      m.hat(t, st % 2 ? 0.35 : 0.6);
      if (st % 2 === 0) m.bass(t, N(root - 12), spb * 1.8, 0.7, 900);
      if (st === 0) m.pad(t, [N(root), N(root + 3), N(root + 7)], spb * 15, 0.7);
      if (st === 8 || st === 11) m.lead(t, N(root + 15), spb * 2, 0.35, 'sawtooth');
    } },
  };
})();

// ---------------------------------------------------------------- meta.js (progression: trophies, upgrades, caches, quests, sectors, daily strike)
const CODEC = makeCodec('gemstrike', [['v', 2], ['day', 12], ['score', 17], ['win', 1], ['cap', 3]]);
const Meta = {
  d() { return Save.data; },
  name() { return (this.d().name || 'YOU').toUpperCase(); },
  rank() { return Math.floor(Math.sqrt((this.d().xp || 0) / 30)) + 1; },
  owned(id) { return !!this.d().heroes[id].owned; },
  hero(id) { return this.d().heroes[id]; },
  ownedList() { return HEROES.filter((h) => this.owned(h.id)).map((h) => h.id); },
  modeOpen(m) { return this.d().trophies >= (MODE_UNLOCK[m] || 0) || (this.d().unlockedModes || []).includes(m); },
  upgradeCost(id) { const h = this.hero(id); return h.lvl >= MAX_LEVEL ? null : { pp: LVL_PP[h.lvl], coins: LVL_COINS[h.lvl] }; },
  canUpgrade(id) { const c = this.upgradeCost(id), h = this.hero(id); return !!c && h.owned && h.pp >= c.pp && this.d().coins >= c.coins; },
  upgrade(id) {
    if (!this.canUpgrade(id)) return false;
    const c = this.upgradeCost(id), h = this.hero(id);
    h.pp -= c.pp; this.d().coins -= c.coins; h.lvl++; Save.persist(); return true;
  },
  setSquad(slot, id) {
    const sq = this.d().squad, j = sq.indexOf(id);

  unlock(id) { const h = this.hero(id); if (h.owned) return false; h.owned = true; Save.persist(); return true; },

  // ---------------------------------------------------------------- caches
  addCache(type) { this.d().crates.push(type); Save.persist(); },
  openCache(type, rng) {
    rng = rng || Math.random;
    const C = CRATES[type], loot = [], d = this.d();
    const coins = Math.round(C.coins[0] + rng() * (C.coins[1] - C.coins[0]));
    d.coins += coins; loot.push({ k: 'coins', n: coins });
    // a new agent?
    const locked = HEROES.filter((h) => !d.heroes[h.id].owned);
    if (locked.length && rng() < C.newHero) {

    }

    const own = this.ownedList().filter((id) => d.heroes[id].lvl < MAX_LEVEL);
    const pool = own.length ? own : this.ownedList();
    const total = Math.round(C.pp[0] + rng() * (C.pp[1] - C.pp[0]));
    const picks = [];
    for (let i = 0; i < C.heroes && pool.length; i++) { const id = i === 0 && pool.includes(d.squad[0]) && rng() < 0.5 ? d.squad[0] : pool[Math.floor(rng() * pool.length)]; if (!picks.includes(id)) picks.push(id); }
    picks.forEach((id, i) => { const n = i === picks.length - 1 ? total - picks.slice(0, -1).reduce((s, _, j) => s + Math.round(total / picks.length), 0) : Math.round(total / picks.length); d.heroes[id].pp += n; loot.push({ k: 'pp', id, n }); });

  // ---------------------------------------------------------------- daily quests
  quests() {
    const d = this.d(), day = dayIndex();

  },
  questText(q) { return QUESTS.find((x) => x.id === q.id).text(q.n); },
  questCoins(q) { return QUESTS.find((x) => x.id === q.id).coins; },
  progress(id, n) { const Q = this.quests(); for (const q of Q.list) if (q.id === id && !q.claimed) q.prog = Math.min(q.n, q.prog + n); },
  claim(i) {
    const Q = this.quests(), q = Q.list[i]; if (!q || q.claimed || q.prog < q.n) return null;
    q.claimed = true; this.d().coins += this.questCoins(q);
    let cache = null;
    if (!Q.bonus && Q.list.every((x) => x.claimed)) { Q.bonus = true; cache = 'silver'; this.addCache('silver'); }

  },
  questsReady() { return this.quests().list.filter((q) => !q.claimed && q.prog >= q.n).length; },

  // ---------------------------------------------------------------- Trophy Road
  roadNext() { return ROAD.find((r) => r.t > this.d().trophies) || null; },
  roadPending() { const d = this.d(); return ROAD.filter((r, i) => i >= d.road && r.t <= d.trophies); },
  claimRoad() {
    const d = this.d(), got = [];
    while (d.road < ROAD.length && ROAD[d.road].t <= d.trophies) {
      const r = ROAD[d.road].r; d.road++;
      if (r.coins) { d.coins += r.coins; got.push({ k: 'coins', n: r.coins }); }
      if (r.crate) { this.addCache(r.crate); got.push({ k: 'cache', id: r.crate }); }
      if (r.hero) { if (this.unlock(r.hero)) got.push({ k: 'hero', id: r.hero }); else { d.coins += 300; got.push({ k: 'coins', n: 300 }); } }
      if (r.mode) { d.unlockedModes = d.unlockedModes || []; if (!d.unlockedModes.includes(r.mode)) d.unlockedModes.push(r.mode); got.push({ k: 'mode', id: r.mode }); }
    }
    Save.persist(); return got;
  },

  // ---------------------------------------------------------------- battle setups
  squadSpec(lvlOverride) {
    const d = this.d();
    return d.squad.map((id) => ({ id, lvl: lvlOverride || d.heroes[id].lvl }));
  },
  arena(mode) {
    const d = this.d(), tr = d.trophies, rng = makeRng((Date.now() ^ (tr * 7919)) >>> 0);
    const skill = clamp(0.2 + tr / 1500, 0.2, 0.85), lvl = clamp(Math.round(1 + tr / 150 + (rng() - 0.5)), 1, 9);
    const pool = HEROES.filter((h) => h.rarity <= (tr < 120 ? 0 : tr < 400 ? 1 : tr < 800 ? 2 : 3)).map((h) => h.id);
    const foes = [0, 1, 2].map(() => pool[Math.floor(rng() * pool.length)]);
    const maps = ARENA_MAPS[mode], map = maps[Math.floor(rng() * maps.length)];

  },
  sector(si, gi) {
    const isl = ISLANDS[si], st = isl.stages[gi];
    const base = { kind: 'sector', si, gi, map: st.map, theme: st.theme || isl.theme, skill: st.skill, allySkill: 0.5, mod: st.mod, seed: hash32(isl.id + gi), foePower: Math.round(12 + st.skill * 38) };
    if (st.boss) return Object.assign(base, { mode: 'boss', boss: st.boss, bossLvl: st.lvl, foes: [] });
    return Object.assign(base, { mode: st.mode, foes: st.foe.map((id) => ({ id, lvl: st.lvl })) });
  },
  sectorKey(si, gi) { return ISLANDS[si].id + ':' + gi; },
  stars(si, gi) { return this.d().adv.stars[this.sectorKey(si, gi)] || 0; },
  sectorStars(si) { let n = 0; for (let g = 0; g < ISLANDS[si].stages.length; g++) n += this.stars(si, g); return n; },
  sectorOpen(si, gi) {

    return gi === 0 || this.stars(si, gi - 1) > 0;
  },
  // which of the three stars a battle earned
  earn(cfg, res, rush) {
    const st = ISLANDS[cfg.si].stages[cfg.gi], got = [res.winner === 0, false, false];
    if (!got[0]) return got;

      else if (k === 'kos') ok = res.myKos >= v;
      else if (k === 'noko') ok = res.capDeaths === 0;

  },
  daily(day) {
    day = day === undefined ? dayIndex() : day;
    const rng = makeRng(hash32('daily' + day));
    const ids = HEROES.map((h) => h.id), pick = () => ids[Math.floor(rng() * ids.length)];
    const squad = []; while (squad.length < 3) { const id = pick(); if (!squad.includes(id)) squad.push(id); }
    const mode = ['knockout', 'zone', 'goal'][Math.floor(rng() * 3)], map = ARENA_MAPS[mode][Math.floor(rng() * 2)];
    const theme = ['neon', 'foundry', 'station'][Math.floor(rng() * 3)];
    return { kind: 'daily', day, mode, map, theme, squad: squad.map((id) => ({ id, lvl: 6 })), foes: [pick(), pick(), pick()].map((id) => ({ id, lvl: 6 })), skill: 0.6, allySkill: 0.6, foePower: 36, seed: hash32('dseed' + day) };
  },
  dailyScore(res, rush) {
    let s = Math.round(rush.score / 10) + res.kos * 350 + Math.round(res.dmg / 20) + res.goals * 800 + Math.round(res.zoneT * 10);
    if (res.winner === 0) s += 3000 + Math.max(0, Math.round((150 - res.time) * 10));
    return clamp(s, 0, 131071);
  },
  dailyCode(score, win, cap) { return CODEC.encode({ v: 1, day: dayIndex() & 4095, score, win: win ? 1 : 0, cap: HEROES.findIndex((h) => h.id === cap) }); },
  readCode(code) { const f = CODEC.decode(code); if (!f) return null; return { day: f.day, score: f.score, win: !!f.win, cap: HEROES[f.cap] ? HEROES[f.cap].name : '?', today: f.day === (dayIndex() & 4095) }; },

  // ---------------------------------------------------------------- after a battle
  finish(cfg, res, rush) {
    const d = this.d(), out = { trophies: 0, coins: 0, cache: null, stars: null, xp: 0, first: false, streak: 0 };
    const win = res.winner === 0, draw = res.winner === -1;

    d.stats.bombs += rush.made.pulse; d.stats.rockets += rush.made.beam; d.stats.prisms += rush.made.nova; d.stats.fevers += rush.fevers;

      const day = dayIndex(); if (d.firstWin !== day) { d.firstWin = day; out.first = true; out.coins *= 2; out.coins += 20; }
      out.coins += 20;
    } else if (!draw) d.streak = 0;
    if (cfg.kind === 'arena') {
      if (win) out.trophies = 8 + Math.min(4, Math.max(0, d.streak - 2));
      else if (!draw) out.trophies = -Math.min(d.trophies, d.trophies < 100 ? 2 : 4);
      d.trophies += out.trophies; d.best = Math.max(d.best, d.trophies);

    } else if (cfg.kind === 'sector') {

      out.stars = got; out.newStars = Math.max(0, n - had);
      if (n > had) d.adv.stars[key] = n;
      if (win && !had) {
        const st = ISLANDS[cfg.si].stages[cfg.gi];
        out.coins += 40 + cfg.gi * 15 + cfg.si * 40;
        if (st.boss) { const rw = BOSSES[st.boss].reward; if (CRATES[rw]) { this.addCache(rw); out.cache = rw; } else if (this.unlock(rw)) out.hero = rw; else { this.addCache('gold'); out.cache = 'gold'; } }
      }
      // star chests
      const total = this.sectorStars(cfg.si);
      STAR_CHEST.forEach((need, i) => { const k = ISLANDS[cfg.si].id + ':' + i; if (total >= need && !d.adv.chests[k]) { d.adv.chests[k] = 1; const c = ['wood', 'silver', 'gold'][i]; this.addCache(c); out.chest = c; } });
    } else if (cfg.kind === 'daily') {
      const score = this.dailyScore(res, rush); out.score = score;
      if (d.daily.day !== cfg.day) d.daily = { day: cfg.day, best: 0, plays: 0, code: '' };
      d.daily.plays++;
      if (score > d.daily.best) { d.daily.best = score; d.daily.code = this.dailyCode(score, win, cfg.squad[0].id); out.best = true; }
      out.code = this.dailyCode(score, win, cfg.squad[0].id);
      if (d.daily.plays === 1) { out.coins += 60; }
    }
    out.xp = 10 + (win ? 6 : 0); d.xp += out.xp;
    d.coins += out.coins;
    // quests
    if (win) this.progress('win', 1);
    this.progress('ko', res.kos); this.progress('dmg', res.dmg); this.progress('super', res.supers); this.progress('goal', res.goals); this.progress('zone', res.zoneT);
    this.progress('bomb', rush.made.pulse); this.progress('rocket', rush.made.beam); this.progress('fever', rush.fevers); this.progress('coins', rush.credits);
    Save.persist();
    return out;
  },
};

// ---------------------------------------------------------------- input.js (twin sticks on touch; WASD + mouse on desktop)
const Input = {
  on: false, keys: {}, move: [0, 0], aiming: false, aimAng: 0, aimDist: 0, aimSuper: false, mouse: null, mouseUsed: false,
  touches: {}, fireQ: null, supQ: null, R: 52,
  init() {

    hud.addEventListener('touchcancel', (e) => this.tEnd(e), opt);

    window.addEventListener('keyup', (e) => this.key(e, false));

    hud.addEventListener('mousedown', (e) => {

    });
    hud.addEventListener('contextmenu', (e) => e.preventDefault());

    window.addEventListener('blur', () => { this.keys = {}; });
  },
  reset() { this.keys = {}; this.move = [0, 0]; this.aiming = false; this.touches = {}; this.fireQ = this.supQ = null; this.stickUI(); },
  key(e, down) {
    const k = e.key.toLowerCase();
    if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(k) && this.on) e.preventDefault();
    this.keys[k] = down;
    if (!down || !this.on) return;
    if (k === ' ') this.fireQ = { manual: !!this.mouseUsed };
    if (k === 'e' || k === 'shift') this.supQ = { manual: !!this.mouseUsed };
    if (k === 'q' || k === 'tab') { e.preventDefault(); UI.swapNext(); }
    if (k === '1' || k === '2' || k === '3') UI.swapSlot(+k - 1);
    if (k === 'escape' || k === 'p') UI.pause();
  },
  // ---------------------------------------------------------------- touch
  side(x, y) {
    const sb = document.getElementById('superBtn').getBoundingClientRect();
    if (x >= sb.left - 10 && x <= sb.right + 10 && y >= sb.top - 10 && y <= sb.bottom + 10) return 'super';
    return x < window.innerWidth * 0.45 ? 'move' : 'fire';
  },
  tStart(e) {
    if (!this.on) return;
    this.lastTouch = performance.now();
    if (e.target.closest('.pfp, .pausebtn, #pausebtn')) return;
    e.preventDefault(); Snd.init();
    for (const t of e.changedTouches) {
      const s = this.side(t.clientX, t.clientY);
      if (Object.values(this.touches).some((o) => o.s === s)) continue;
      this.touches[t.identifier] = { s, x0: t.clientX, y0: t.clientY, x: t.clientX, y: t.clientY, moved: false };
    }
    this.stickUI();
  },
  tMove(e) {

    for (const t of e.changedTouches) { const o = this.touches[t.identifier]; if (!o) continue; o.x = t.clientX; o.y = t.clientY; if (Math.hypot(o.x - o.x0, o.y - o.y0) > 14) o.moved = true; }

  },
  tEnd(e) {

  },
  stickUI() {

      if (!isFire || o.s === 'fire') knob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
    };
    place(mv, m, false); place(fr, f && f.s === 'fire' ? f : null, true);
    const sb = document.getElementById('superBtn'); sb.classList.toggle('aiming', !!(f && f.s === 'super'));
  },
  // ---------------------------------------------------------------- per frame: write the controlled agent's command
  update(B) {
    const u = B.me; if (!u) return;

    const A = u.h.atk;

      const dx = o.x - o.x0, dy = o.y - o.y0;
      this.aiming = true; this.aimSuper = o.s === 'super'; this.aimAng = Math.atan2(dy, dx);
      const rng = this.aimSuper ? (u.h.sup.range || u.h.sup.dist || 5) : A.range;

    }

    }

    if (this.fireQ) { const q = this.fireQ; this.fireQ = null; const p = this.targetPoint(B, u, q, false); if (p) { c.fire = true; c.tx = p[0]; c.ty = p[1]; } }
    if (this.supQ) { const q = this.supQ; this.supQ = null; if (u.sup >= 1 || (B.ball && B.ball.holder === u)) { const p = this.targetPoint(B, u, q, true); if (p) { c.sup = true; c.sx = p[0]; c.sy = p[1]; } } }

  },
  toWorld(p) { return [Render.cam[0] + (p[0] - Render.W / 2) / Render.T, Render.cam[1] + (p[1] - Render.H / 2) / Render.T]; },
  targetPoint(B, u, q, sup) {
    const A = u.h.atk, rng = sup ? (u.h.sup.range || u.h.sup.dist || 5) : A.range;
    if (q.manual && this.mouse) return this.toWorld(this.mouse);
    if (q.ang !== undefined) { const d = (A.lob || sup) ? q.k * rng : rng; return [u.x + Math.cos(q.ang) * d, u.y + Math.sin(q.ang) * d]; }

    if (B.ball && B.ball.holder === u) { const my = u.team === 0 ? 0.5 : B.M.H - 0.5; return [B.M.W / 2, my]; }
    if (sup && u.h.sup.kind === 'bloom') { const hurt = B.units.filter((v) => v.alive && v.team === u.team).sort((a, b) => a.hp / a.max - b.hp / b.max)[0]; return [hurt.x, hurt.y]; }
    let best = null, bd = 1e9;
    for (const e of B.units) {
      if (!e.alive || e.team === u.team || !B.visibleTo(e, u.team)) continue;
      const d = Math.hypot(e.x - u.x, e.y - u.y); if (d > rng * 1.15) continue;
      const s = d + (A.lob || B.clearShot(u.x, u.y, e.x, e.y) ? 0 : 4);

    }
    if (best) { const d = Math.hypot(best.x - u.x, best.y - u.y), lead = A.lob ? A.flight || 0.6 : d / (A.speed || 14); return [best.x + (best.vx || 0) * lead * 0.6, best.y + (best.vy || 0) * lead * 0.6]; }
    return [u.x + Math.cos(u.ang) * rng, u.y + Math.sin(u.ang) * rng];
  },
};

// ---------------------------------------------------------------- ui.js (screens, panels and the battle HUD)
const $ = (id) => document.getElementById(id);
const rgbOf = (h) => { const n = parseInt(h.slice(1), 16); return (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255); };
const UI = {

    const on = (id, fn) => $(id).addEventListener('click', (e) => { Snd.init(); Sfx.click(); fn(e); });
    on('playBtn', () => Game.play());
    on('eventBtn', () => this.modePicker());
    on('bAgents', () => this.agents());
    on('bSectors', () => this.sectors(this.firstOpenSector()));
    on('bQuests', () => this.questsPanel());
    on('bDaily', () => this.dailyPanel());
    on('bCaches', () => this.openNextCache('lobby'));
    on('roadBar', () => this.roadPanel());
    on('setBtn', () => this.settings());
    on('meChip', () => this.settings());
    on('pauseBtn', () => this.pause());

    $('modal').addEventListener('click', (e) => { if (e.target === $('modal') && !this.modalLocked) this.close(); });
    $('scrCache').addEventListener('click', () => this.cacheTap());

  },
  show(name) {
    this.scr = name;
    const map = { lobby: 'scrLobby', rush: 'scrRush', battle: 'scrBattle', results: 'scrResults', cache: 'scrCache', sectors: 'scrSectors', agents: 'scrAgents' };
    for (const k in map) $(map[k]).classList.toggle('on', k === name);
    document.body.classList.toggle('inlobby', name === 'lobby');
    $('toast').classList.remove('show');
  },
  toast(msg, ms) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(this._tt); this._tt = setTimeout(() => t.classList.remove('show'), ms || 2200); },
  modal(html, mount, locked) {
    $('mbox').innerHTML = (locked ? '' : '<button class="close" aria-label="Close">✕</button>') + html; $('modal').hidden = false; this.modalLocked = !!locked;
    const c = $('mbox').querySelector('.close'); if (c) c.addEventListener('click', () => { Sfx.click(); this.close(); });
    if (mount) mount($('mbox'));
  },
  close() { $('modal').hidden = true; $('mbox').innerHTML = ''; if (this.onClose) { const f = this.onClose; this.onClose = null; f(); } },

  // ---------------------------------------------------------------- lobby

    $('capImg').src = bustURL(cap, 240);
    $('capName').innerHTML = '<div class="capname">' + h.name.toUpperCase() + '<small>' + ROLES[h.role].name.toUpperCase() + ' · LEVEL ' + d.heroes[cap].lvl + '</small></div>';
    $('squadRow').innerHTML = [1, 0, 2].map((i) => { const id = d.squad[i], hh = HERO_BY_ID[id]; return '<button class="sq' + (i === 0 ? ' cap' : '') + '" data-slot="' + i + '"><img src="' + bustURL(id, 56) + '" alt=""><b>' + hh.name + '</b><span>' + (i === 0 ? 'Captain · ' : '') + 'Lv ' + d.heroes[id].lvl + '</span></button>'; }).join('');
    $('squadRow').querySelectorAll('[data-slot]').forEach((b) => b.addEventListener('click', () => { Sfx.click(); this.squadPicker(+b.dataset.slot); }));
    const qn = Meta.questsReady(); $('qBadge').hidden = !qn; $('qBadge').textContent = qn;
    const cn = d.crates.length; $('cBadge').hidden = !cn; $('cBadge').textContent = cn;
    $('agBadge').hidden = !Meta.ownedList().some((id) => Meta.canUpgrade(id));
    const dd = d.daily.day === dayIndex() ? d.daily : null;
    $('dailyTag').textContent = dd && dd.best ? 'best ' + fmtInt(dd.best) : 'new today';
    const md = MODES[d.mode] && Meta.modeOpen(d.mode) ? d.mode : 'knockout'; d.mode = md;
    $('evMode').textContent = MODES[md].name.toUpperCase(); $('evDesc').textContent = MODES[md].desc; $('evIcon').src = iconURL(MODES[md].icon, 60);
    // Trophy Road progress
    const nx = Meta.roadNext(), prevT = [...ROAD].reverse().find((r) => r.t <= d.trophies);
    $('troN').textContent = fmtInt(d.trophies);
    const lo = prevT ? prevT.t : 0, hi = nx ? nx.t : lo + 1;

    $('roadNext').innerHTML = Meta.roadPending().length ? '<b style="color:var(--gold)">CLAIM!</b>' : nx ? nx.t + '<img src="' + this.rewardIcon(nx.r) + '" alt="">' : 'MAX';
    // boosters
    $('boosts').innerHTML = Object.keys(BOOSTERS).map((k) => '<button class="boost' + (d.armed[k] && d.boosters[k] ? ' on' : '') + '" data-b="' + k + '"' + (d.boosters[k] ? '' : ' disabled') + '><img src="' + (k === 'time' ? iconURL('daily', 40, '#39e1ff') : gemURL(k === 'rocket' ? 0 : 2, 40, k === 'rocket' ? SPECIALS.rocketH : SPECIALS.bomb)) + '" alt="">' + BOOSTERS[k].name.split(' ')[0].toUpperCase() + ' <b>' + d.boosters[k] + '</b></button>').join('');
    $('boosts').querySelectorAll('[data-b]').forEach((b) => b.addEventListener('click', () => { const k = b.dataset.b; if (!d.boosters[k]) return; d.armed[k] = !d.armed[k]; Save.persist(); Sfx.click(); this.toast(d.armed[k] ? BOOSTERS[k].desc : BOOSTERS[k].name + ' off'); this.lobby(); }));
    this.layoutLobby();
  },
  layoutLobby() {
    const W = innerWidth, H = innerHeight, land = matchMedia('(orientation: landscape) and (max-height: 560px)').matches;
    const im = $('capImg'), nm = $('capName'), sq = $('squadRow'), bot = document.querySelector('.lobby-bottom').getBoundingClientRect();
    let x, py, s;
    if (land) {
      x = (90 + (W - 360)) / 2; py = H * 0.68; s = clamp(Math.min(200, H * 0.44), 110, 200);
      sq.style.top = '';
    } else {
      const sqH = sq.offsetHeight || 92, sqTop = bot.top - sqH - 12;
      sq.style.top = sqTop + 'px';
      x = W / 2; py = sqTop - 64; s = clamp(Math.min(270, (py - 74) / 0.98, W * 0.64), 110, 270);
    }
    this.lobbyPy = py; this.lobbyX = x; this.lobbyS = s;
    im.style.width = im.style.height = s + 'px'; im.style.left = (x - s / 2) + 'px'; im.style.marginLeft = '0'; im.style.top = (py - s * 0.98) + 'px';
    nm.style.left = (x - 170) + 'px'; nm.style.right = 'auto'; nm.style.width = '340px'; nm.style.top = (py + 12) + 'px';
  },
  drawLobby(t) {
    const cv = $('lobbyCv'), d = Math.min(2, devicePixelRatio || 1), W = innerWidth, H = innerHeight;
    if (cv.width !== Math.round(W * d) || cv.height !== Math.round(H * d)) { cv.width = Math.round(W * d); cv.height = Math.round(H * d); this.layoutLobby(); }
    const ctx = cv.getContext('2d'); ctx.setTransform(d, 0, 0, d, 0, 0);
    const col = HERO_BY_ID[Save.data.squad[0]].color;
    drawLobbyScene(ctx, W, H, t, col);
    drawPlatform(ctx, this.lobbyX || W / 2, this.lobbyPy || H * 0.5, Math.min(120, (this.lobbyS || 200) * 0.5), col, t);
  },
  rewardIcon(r) { return r.coins ? iconURL('credit', 40) : r.crate ? iconURL(CRATES[r.crate].icon, 40) : r.hero ? bustURL(r.hero, 40) : iconURL(MODES[r.mode].icon, 40); },
  rewardText(r) { return r.coins ? fmtInt(r.coins) + ' credits' : r.crate ? CRATES[r.crate].name : r.hero ? 'Agent: ' + HERO_BY_ID[r.hero].name : 'Mode: ' + MODES[r.mode].name; },

    this.modal('<h2>Choose mode</h2><p class="sub">Win to climb Trophy Road.</p><div class="list">' + ['knockout', 'zone', 'goal'].map((m) => {

    }).join('') + '</div>', (box) => box.querySelectorAll('[data-m]').forEach((b) => b.addEventListener('click', () => { const m = b.dataset.m; if (!Meta.modeOpen(m)) { this.toast('Reach ' + MODE_UNLOCK[m] + ' trophies to unlock'); return; } Sfx.click(); d.mode = m; Save.persist(); this.close(); this.lobby(); })));

  squadPicker(slot) {
