    }).join('') + '</div>', (box) => box.querySelectorAll('[data-h]').forEach((b) => b.addEventListener('click', () => { const id = b.dataset.h; if (!Meta.owned(id)) { this.toast('Recruit ' + HERO_BY_ID[id].name + ' from caches or Trophy Road'); return; } Sfx.click(); Meta.setSquad(slot, id); this.close(); this.lobby(); })));
  },

  // ---------------------------------------------------------------- agents
  agents() {
    const d = Save.data; this.show('agents');
    $('agSub').textContent = Meta.ownedList().length + ' OF ' + HEROES.length + ' RECRUITED'; $('agCred').textContent = fmtInt(d.coins);
    const how = (id) => { const r = ROAD.find((x) => x.r.hero === id); const b = Object.keys(BOSSES).find((k) => BOSSES[k].reward === id); return b ? 'Beat ' + BOSSES[b].name : r ? 'Trophy Road ' + r.t : 'Caches'; };
    $('agGrid').innerHTML = HEROES.map((h) => {
      const o = d.heroes[h.id], c = Meta.upgradeCost(h.id);
      return '<button class="hc' + (o.owned ? '' : ' locked') + '" data-h="' + h.id + '" style="--rgb:' + rgbOf(h.color) + '"><img class="art" src="' + bustURL(h.id, 116) + '" alt=""><div class="nm">' + h.name + '</div><div class="role">' + ROLES[h.role].name + '</div>' +
        (o.owned ? '<div class="lv">LV ' + o.lvl + '</div>' + (c ? '<div class="pp" style="--f:' + clamp(o.pp / c.pp, 0, 1) + '"><i></i></div>' : '') + (Meta.canUpgrade(h.id) ? '<div class="new">UPGRADE</div>' : '') : '<div class="how"><img src="' + iconURL('lock', 36) + '" alt="">' + how(h.id) + '</div>') + '</button>';

  agentDetail(id) {
    const h = HERO_BY_ID[id], o = Save.data.heroes[id], c = Meta.upgradeCost(id), k = lvlMul(o.lvl);
    const nk = c ? lvlMul(o.lvl + 1) : k;
    const stat = (label, v, nv) => '<div class="stat">' + label + '<b>' + fmtInt(v) + (c && o.owned ? ' <span style="color:var(--green);font-size:12px">+' + fmtInt(nv - v) + '</span>' : '') + '</b></div>';
    const dmg = Math.round(h.atk.dmg * (h.atk.n || 1) * (h.atk.shots || 1) * DMG_SCALE);
    this.modal('<img class="bust" src="' + bustURL(id, 150) + '" alt=""><h2 style="text-align:center;color:' + h.color + '">' + h.name + '</h2><p class="sub" style="text-align:center">' + ROLES[h.role].name + ' · ' + h.tag + (o.owned ? ' · Level ' + o.lvl : ' · Locked') + '</p>' +
      '<div class="grid3">' + stat('HEALTH', h.hp * k * HP_SCALE, h.hp * nk * HP_SCALE) + stat('DAMAGE', dmg * k, dmg * nk) + '<div class="stat">RANGE<b>' + h.atk.range + '</b></div></div>' +
      '<div class="ability"><small>ATTACK</small><b>' + h.attack.name + '</b><span>' + h.attack.desc + '</span></div>' +
      '<div class="ability"><small>SUPER</small><b>' + h.super.name + '</b><span>' + h.super.desc + '</span></div>' +
      '<div class="ability"><small>STAR POWER · LEVEL 9</small><b>' + h.star.name + '</b><span>' + h.star.desc + (o.lvl >= MAX_LEVEL ? ' <b style="color:var(--gold)">ACTIVE</b>' : '') + '</span></div>' +
      (o.owned ? (c ? '<div class="ability"><small>NEXT LEVEL</small><span>Power points ' + o.pp + ' / ' + c.pp + ' · ' + fmtInt(c.coins) + ' credits</span><div class="prog" style="--f:' + clamp(o.pp / c.pp, 0, 1) + '"><i></i></div></div><button class="btn' + (Meta.canUpgrade(id) ? '' : '" disabled="') + '" id="upBtn">UPGRADE</button>' : '<p class="sub" style="text-align:center;margin-top:10px">MAX LEVEL</p>') +

    (box) => {
      const up = box.querySelector('#upBtn'); if (up) up.addEventListener('click', () => { if (Meta.upgrade(id)) { Sfx.unlock(); this.toast(h.name + ' reached level ' + Save.data.heroes[id].lvl); this.agentDetail(id); this.agents(); } else this.toast('Need more power points or credits'); });

    }).join('') + '</div>', (box) => { const b = box.querySelector('#claimRoad'); if (b) b.addEventListener('click', () => { const got = Meta.claimRoad(); Sfx.unlock(); this.toast(got.map((g) => g.k === 'coins' ? '+' + g.n + ' credits' : g.k === 'cache' ? CRATES[g.id].name : g.k === 'hero' ? 'New agent: ' + HERO_BY_ID[g.id].name : MODES[g.id].name + ' unlocked').join(' · '), 3500); this.roadPanel(); this.lobby(); }); });

      (today.code ? '<button class="btn ghost" id="copyCode">COPY BRAG CODE</button>' : '') +

  // ---------------------------------------------------------------- caches
  openNextCache(back) {
    const d = Save.data;
    if (!d.crates.length) { this.toast('No caches yet. Win battles, finish quests and climb Trophy Road.'); return; }
    this.cache = { type: d.crates[0], step: 'closed', loot: null, i: 0, back: back || 'lobby' };
    this.show('cache'); Game.state = 'cache';
    const C = CRATES[this.cache.type];
    $('cacheStage').innerHTML = '<div class="cachebox" id="cbox"><img src="' + iconURL(C.icon, 300) + '" alt=""></div><div class="cachename">' + C.name.toUpperCase() + '</div>';
    $('cacheTap').textContent = 'TAP TO OPEN';
  },
  cacheTap() {
    const c = this.cache; if (!c) return;
    Snd.init();
    if (c.step === 'closed') {
      c.step = 'shaking'; $('cbox').classList.add('shake'); Sfx.open(); buzz(40);
      setTimeout(() => { Save.data.crates.shift(); c.loot = Meta.openCache(c.type); c.step = 'loot'; c.i = 0; this.showLoot(); }, 700);

  swapNext() { const B = Brawl; if (Game.state !== 'battle') return; const mine = B.units.filter((u) => u.team === 0 && !u.boss); const i = mine.indexOf(B.me); for (let k = 1; k <= mine.length; k++) { const u = mine[(i + k) % mine.length]; if (u.alive && B.swapTo(u)) { Sfx.click(); return; } } },
  swapSlot(i) { if (Game.state !== 'battle') return; const u = Brawl.units.filter((v) => v.team === 0)[i]; if (u && Brawl.swapTo(u)) Sfx.click(); else if (u && !u.alive) this.toast('That agent is redeploying'); },

// ---------------------------------------------------------------- main.js (boot, game flow, frame loop)
const Game = {
  state: 'boot', paused: false, cfg: null, rush: null, acc: 0, last: 0, endT: 0, done: false, t: 0,

  boot() {
    Save.load(); Meta.quests();
    if (!('ontouchstart' in window) && matchMedia('(pointer: fine)').matches) document.body.classList.add('desk');
    UI.init(); Rush.init(); Render.init(); Input.init();
    Snd.onInit = () => this.music();
    Save.onRemote = () => { if (this.state === 'lobby') UI.lobby(); };
    Save.cloudInit();
    const wake = () => Snd.init();
    addEventListener('pointerdown', wake, true); addEventListener('keydown', wake, true);
    addEventListener('resize', () => this.resize());
    document.addEventListener('visibilitychange', () => { if (document.hidden && (this.state === 'battle' || this.state === 'rush') && !this.paused) UI.pause(); });
    this.toLobby();
    if (!Save.data.seen.intro) this.welcome();
    this.last = performance.now();
    requestAnimationFrame((t) => this.frame(t));
  },
  welcome() {
    UI.modal('<h2>Welcome, pilot</h2><p class="sub">Every match has two halves.</p>' +
      '<div class="ability"><small>1 · GEM RUSH · 30 SECONDS</small><b>Power up your squad</b><span>Swap cores to match three or more. Red, blue and green level up your three agents. Chain matches fast to reach Fever.</span></div>' +
      '<div class="ability"><small>2 · BATTLE · 3 VS 3</small><b>Win the fight</b><span>Your powered-up squad drops into the arena. Move with your left thumb, aim and fire with your right, and switch agents any time.</span></div>' +
      '<button class="btn" id="wGo">LET\'S GO</button>', (box) => box.querySelector('#wGo').addEventListener('click', () => { Sfx.click(); UI.close(); }));
    UI.onClose = () => { Save.data.seen.intro = 1; Save.persist(); };
  },
  resize() {
    Render.resize();
    if (this.state === 'rush') Rush.resize();
    if (this.state === 'lobby') UI.layoutLobby();
    if (this.state === 'sectors') UI.drawSectors();
  },
  music() {
    if (!Snd.mx) return;
    const s = this.state;
    const song = s === 'rush' ? SONGS.rush : s === 'battle' ? (this.cfg && this.cfg.boss ? SONGS.boss : SONGS.battle) : SONGS.lobby;
    Music.start(song);
  },

  // ---------------------------------------------------------------- flow
  toLobby() {
    if (Rush.on) Rush.stop();
    Input.on = false;
    this.state = 'lobby'; this.paused = false;
    UI.lobby(); this.music();
    if (Meta.roadPending().length) setTimeout(() => UI.toast('Trophy Road reward ready. Tap the trophy bar.'), 400);
  },
  play() { this.startMatch(Meta.arena(Save.data.mode)); },
  startMatch(cfg) {
    const d = Save.data;
    cfg.squad = cfg.squad || Meta.squadSpec();
    cfg.theme = cfg.theme || MAP_BY_ID[cfg.map].theme;
    let boosters = null;
    if (cfg.kind !== 'daily') {
      boosters = {};
      for (const k in BOOSTERS) if (d.armed[k] && d.boosters[k] > 0) { boosters[k] = true; d.boosters[k]--; if (!d.boosters[k]) d.armed[k] = false; }
      Save.persist();
    }
    this.cfg = cfg; this.rush = null;
    this.state = 'rush'; this.paused = false;
    UI.show('rush');
    Rush.start({ squad: cfg.squad.map((s) => s.id), seed: cfg.kind === 'daily' ? cfg.seed : (Math.random() * 4294967295) >>> 0, foeTotal: cfg.foePower, boosters, onDone: (r) => this.toBattle(r) });
    this.music();
    if (!d.seen.rush) { d.seen.rush = 1; Save.persist(); setTimeout(() => UI.toast('Swap cores to match 3 or more. Each color powers one agent.', 3600), 300); }
  },
  toBattle(r) {
    const cfg = this.cfg;
    this.rush = r;
    const fl = powerLevel(cfg.foePower / 3), sk = cfg.skill;
    const squad = cfg.squad.map((s, i) => ({ id: s.id, lvl: s.lvl, plvl: r.lvl[i], sup: r.superCh, shield: r.shield }));
    const foes = (cfg.foes || []).map((f) => ({ id: f.id, lvl: f.lvl, plvl: fl, sup: 0.15 + sk * 0.35, shield: 0.05 + sk * 0.12 }));
    Brawl.start({ map: cfg.map, theme: cfg.theme, mode: cfg.mode, squad, foes, skill: sk, allySkill: cfg.allySkill, boss: cfg.boss, bossLvl: cfg.bossLvl, mod: cfg.mod, seed: cfg.seed });
    Input.reset(); Input.on = true; Render.snap = true; Render.pops = []; Render.shakeA = 0;
    this.acc = 0; this.endT = 0; this.done = false;
    this.state = 'battle';
    UI.hudBuild(Brawl); UI.show('battle'); UI._score = '';
    const md = MODES[Brawl.mode];
    UI.center(cfg.boss ? BOSSES[cfg.boss].name.toUpperCase() : md.name.toUpperCase(), cfg.boss ? md.desc : cfg.mode === 'knockout' ? 'First team to ' + Brawl.target + ' knockouts wins.' : md.desc);
    this.music();
  },
  finishBattle() {
    if (this.done) return;
    this.done = true; Input.on = false; Input.reset();
    const res = Brawl.result(), out = Meta.finish(this.cfg, res, this.rush);
    this.res = res; this.out = out;
    this.state = 'results';
    if (res.winner === 0) Sfx.win(); else Sfx.lose();
    UI.results(this.cfg, res, this.rush, out);
    this.music();
  },
  afterResults() {
    const cfg = this.cfg;
    if (Save.data.crates.length) { UI.openNextCache(cfg.kind === 'sector' ? 'sector' : 'results'); return; }
    if (cfg.kind === 'sector') { UI.sectors(cfg.si); return; }
    if (cfg.kind === 'daily') { this.startMatch(Meta.daily()); return; }
    this.play();
  },
  forfeit() {
    if (this.state === 'rush') { this.toLobby(); return; }
    if (this.state === 'battle') { if (!Brawl.over) Brawl.end(1); Brawl.ev.length = 0; this.finishBattle(); }
  },

  // ---------------------------------------------------------------- battle events → sound, shake, popups, HUD
  events(B) {
    for (const e of B.ev) {
      switch (e.t) {
        case 'hit':
          if (e.src || e.me || e.boss) Render.pop(e.x, e.y - 0.7, fmtInt(e.n), e.me ? '#ff6b7a' : e.src ? '#ffffff' : '#c9d4ea', e.src && e.n > 1500, (e.src ? 's' : e.me ? 'm' : 'b') + (e.v ? e.v.team + ':' + e.v.slot : ''), e.n);
          if (e.src || e.me) Sfx.hit(e.me, e.boss);
          if (e.me) { Render.shake(0.22); buzz(8); }
          break;
        case 'heal': if (e.n >= 200) Render.pop(e.x, e.y - 0.7, '+' + fmtInt(e.n), '#3dffa8'); break;
        case 'ko':
          Sfx.ko(e.byMe); UI.killfeed(e, B);
          if (e.me) { UI.center('KNOCKED OUT', B.mode === 'knockout' && B.sudden ? 'No redeploys in sudden death' : 'Switching to a teammate', '#ff4d5a'); Render.shake(0.6); buzz(60); }
          else if (e.byMe) { Render.pop(e.x, e.y - 1.1, 'KNOCKOUT', '#ffc53a', true); Render.shake(0.35); buzz(25); }
          break;
        case 'fire': Sfx.fire(e.kind, e.u === B.me); break;
        case 'super': Sfx.superCast(e.kind); if (e.u === B.me) Render.shake(0.25); break;
        case 'boom': Sfx.boom(e.big); Render.shake(e.big ? 0.45 : 0.18); break;
        case 'bossfire': Sfx.boom(true); Render.shake(0.3); break;
        case 'pod': case 'wall': Sfx.wall(); break;
        case 'kick': Sfx.kick(); break;
        case 'grab': if (e.u.team === 0) Sfx.tap(); break;
        case 'goal':
          Sfx.goal(e.team === 0); Render.shake(0.6); buzz(50);
          UI.center(e.team === 0 ? 'GOAL' : 'ENEMY GOAL', B.score[0] + ' – ' + B.score[1], TEAM_COL[e.team]);
          break;
        case 'spawn': if (e.u === B.me) Sfx.spawn(); break;
        case 'power': if (e.u.team === 0) { Sfx.power(); Render.pop(e.u.x, e.u.y - 1, 'POWER +1', '#ffc53a', true); } break;
        case 'sudden': UI.center('SUDDEN DEATH', B.mode === 'knockout' ? 'No more redeploys' : 'Next goal wins', '#ffc53a'); Sfx.timeUp(); break;
        case 'swap': if (e.u === B.me) Render.snap = false; break;
        case 'end':
          UI.center(e.winner === 0 ? 'VICTORY' : e.winner === 1 ? 'DEFEAT' : 'DRAW', '', e.winner === 0 ? '#3dffa8' : e.winner === 1 ? '#ff4d5a' : '#ffffff');
          break;
      }
    }
    B.ev.length = 0;
  },

  // ---------------------------------------------------------------- loop
  frame(now) {
    requestAnimationFrame((t) => this.frame(t));
    let dt = (now - this.last) / 1000; this.last = now;
    if (!(dt > 0)) dt = 0; if (dt > 0.1) dt = 0.1;
    this.t += dt;
    Music.pump();
    const s = this.state;
    if (s === 'lobby') UI.drawLobby(this.t);
    else if (s === 'cache') UI.drawCache(this.t);
    else if (s === 'rush') {
      if (!this.paused) Rush.update(dt);
      Rush.draw(this.t);
    } else if (s === 'battle') {
      const B = Brawl;
      if (!this.paused) {
        let sd = dt;
        if (B.slowmo > 0) { B.slowmo -= dt; sd = dt * 0.35; }
        Input.update(B);
        this.acc += sd; let n = 0;
        while (this.acc >= STEP && n < 8) { B.step(STEP); this.acc -= STEP; n++; }
        if (n >= 8) this.acc = 0;
        this.events(B);
        if (B.over) { this.endT += dt; if (this.endT > 2.6) this.finishBattle(); }
      }
      if (this.state === 'battle') { Render.draw(B, this.paused ? 0 : dt); UI.hud(B); }
    }
  },
};
const G = Game;
function buzz(ms) { if (Save.data && Save.data.settings.vibrate) vibrate(ms); }

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => Game.boot());
else Game.boot();

})();</script>
