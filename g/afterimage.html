// ---------------------------------------------------------------- post.js
// WebGL post-processing: bloom, chromatic aberration, shock ripples, slow-mo grade.
const VS = 'attribute vec2 p;varying vec2 uv;void main(){uv=p*0.5+0.5;gl_Position=vec4(p,0.0,1.0);}';
const FS_BRIGHT = `precision mediump float;varying vec2 uv;uniform sampler2D t;uniform vec2 texel;
void main(){vec2 s=vec2(uv.x,1.0-uv.y);
vec3 c=texture2D(t,s+texel*vec2(-1.0,-1.0)).rgb+texture2D(t,s+texel*vec2(1.0,-1.0)).rgb+texture2D(t,s+texel*vec2(-1.0,1.0)).rgb+texture2D(t,s+texel*vec2(1.0,1.0)).rgb;
c*=0.25;float m=max(c.r,max(c.g,c.b));c*=smoothstep(0.2,0.78,m);gl_FragColor=vec4(c,1.0);}`;
const FS_BLUR = `precision mediump float;varying vec2 uv;uniform sampler2D t;uniform vec2 dir;
void main(){vec3 c=texture2D(t,uv).rgb*0.227027;
c+=(texture2D(t,uv+dir*1.384615).rgb+texture2D(t,uv-dir*1.384615).rgb)*0.316216;
c+=(texture2D(t,uv+dir*3.230769).rgb+texture2D(t,uv-dir*3.230769).rgb)*0.070270;
gl_FragColor=vec4(c,1.0);}`;
const FS_COPY = 'precision mediump float;varying vec2 uv;uniform sampler2D t;void main(){gl_FragColor=texture2D(t,uv);}';
const FS_FINAL = `precision mediump float;varying vec2 uv;
uniform sampler2D scene;uniform sampler2D b1;uniform sampler2D b2;
uniform float bloom;uniform float ca;uniform float vig;uniform float flash;uniform vec3 flashCol;uniform float slow;uniform float grain;uniform float time;uniform float aspect;
uniform vec4 waves[3];
void main(){
  vec2 u=uv;
  for(int i=0;i<3;i++){vec4 w=waves[i];if(w.w>0.0){vec2 d=u-w.xy;d.x*=aspect;float r=length(d);float k=r-w.z;float a=w.w*exp(-k*k*700.0);vec2 n=d/(r+0.0001);n.x/=aspect;u-=n*a;}}
  vec2 c=u-0.5;
  vec2 s=vec2(u.x,1.0-u.y);
  vec2 o=vec2(c.x,-c.y)*ca*0.012;
  vec3 col=vec3(texture2D(scene,s+o).r,texture2D(scene,s).g,texture2D(scene,s-o).b);
  vec3 b=texture2D(b1,u).rgb+texture2D(b2,u).rgb*0.9;
  col+=b*bloom;
  float l=dot(col,vec3(0.299,0.587,0.114));
  col=mix(col,vec3(l)*vec3(0.78,0.82,1.3),slow*0.5);
  vec2 vc=c;vc.x*=min(aspect,1.0)/max(aspect,1.0)+0.4;
  float v=smoothstep(0.98,0.28,length(vc)*1.15);
  col*=mix(1.0,v,vig);
  col*=0.975+0.025*sin(gl_FragCoord.y*3.14159);
  col=mix(col,flashCol,flash);
  col+=(fract(sin(dot(gl_FragCoord.xy+time,vec2(12.9898,78.233)))*43758.5453)-0.5)*grain;
  gl_FragColor=vec4(col,1.0);
}`;

const Post = {
  gl: null, ok: false, lost: false, W: 0, H: 0, prog: {}, tex: null, T: {}, bound: false,
  p: { bloom: 1.05, ca: 0, vig: 0.55, flash: 0, flashCol: [1, 1, 1], slow: 0, grain: 0.03, waves: new Float32Array(12), lite: false },

  init(canvas) {
    let gl = null;
    try {
      gl = canvas.getContext('webgl', { alpha: false, antialias: false, depth: false, stencil: false, premultipliedAlpha: false, preserveDrawingBuffer: false, powerPreference: 'high-performance' });
    } catch (e) { gl = null; }
    if (!gl) return false;
    this.gl = gl;
    this.canvas = canvas;
    try {
      this.prog.bright = this.program(FS_BRIGHT);
      this.prog.blur = this.program(FS_BLUR);
      this.prog.copy = this.program(FS_COPY);
      this.prog.final = this.program(FS_FINAL);
    } catch (e) {
      console.warn('[afterimage] post shaders failed', e);
      return false;
    }
    this.buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, this.buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    this.tex = this.texture();
    if (!this.bound) {
      this.bound = true;
      canvas.addEventListener('webglcontextlost', (e) => { e.preventDefault(); this.ok = false; this.lost = true; });
      canvas.addEventListener('webglcontextrestored', () => {
        this.lost = false;
        this.T = {};
        if (this.init(canvas)) this.resize(this.W, this.H);
      });
    }
    this.ok = true;
    return true;
  },

  program(fs) {
    const gl = this.gl;
    const mk = (type, src) => {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
      return s;
    };
    const p = gl.createProgram();
    gl.attachShader(p, mk(gl.VERTEX_SHADER, VS));
    gl.attachShader(p, mk(gl.FRAGMENT_SHADER, fs));
    gl.bindAttribLocation(p, 0, 'p');
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    const loc = {};
    const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < n; i++) {
      const info = gl.getActiveUniform(p, i);
      const name = info.name.replace('[0]', '');
      loc[name] = gl.getUniformLocation(p, name);
    }
    return { p, loc };
  },

  texture() {
    const gl = this.gl;
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    return t;
  },

  target(w, h) {
    const gl = this.gl;
    const tex = this.texture();
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    const fb = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return { tex, fb, w, h };
  },

  resize(w, h) {
    this.W = w;
    this.H = h;
    if (!this.ok) return;
    const gl = this.gl;
    for (const k in this.T) {
      gl.deleteTexture(this.T[k].tex);
      gl.deleteFramebuffer(this.T[k].fb);
    }
    const q = Math.max(1, Math.round(w / 4)), r = Math.max(1, Math.round(h / 4));
    const q2 = Math.max(1, Math.round(w / 10)), r2 = Math.max(1, Math.round(h / 10));
    this.T = { A: this.target(q, r), B: this.target(q, r), C: this.target(q2, r2), D: this.target(q2, r2) };
  },

  pass(prog, tgt, texs, uni) {
    const gl = this.gl;
    gl.useProgram(prog.p);
    if (tgt) { gl.bindFramebuffer(gl.FRAMEBUFFER, tgt.fb); gl.viewport(0, 0, tgt.w, tgt.h); }
    else { gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, this.W, this.H); }
    let unit = 0;
    for (const name in texs) {
      gl.activeTexture(gl.TEXTURE0 + unit);
      gl.bindTexture(gl.TEXTURE_2D, texs[name]);
      gl.uniform1i(prog.loc[name], unit);
      unit++;
    }
    for (const name in uni) {
      const v = uni[name], l = prog.loc[name];
      if (l === undefined || l === null) continue;
      if (typeof v === 'number') gl.uniform1f(l, v);
      else if (v.length === 2) gl.uniform2fv(l, v);
      else if (v.length === 3) gl.uniform3fv(l, v);
      else gl.uniform4fv(l, v);
    }
    gl.bindBuffer(gl.ARRAY_BUFFER, this.buf);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  },

  present(src, time) {
    if (!this.ok || this.lost) return;
    const gl = this.gl, T = this.T, P = this.p;
    gl.disable(gl.BLEND);
    gl.bindTexture(gl.TEXTURE_2D, this.tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src);
    if (!P.lite) {
      this.pass(this.prog.bright, T.A, { t: this.tex }, { texel: [1.5 / this.W, 1.5 / this.H] });
      this.pass(this.prog.blur, T.B, { t: T.A.tex }, { dir: [1 / T.A.w, 0] });
      this.pass(this.prog.blur, T.A, { t: T.B.tex }, { dir: [0, 1 / T.A.h] });
      this.pass(this.prog.copy, T.C, { t: T.A.tex }, {});
      this.pass(this.prog.blur, T.D, { t: T.C.tex }, { dir: [1 / T.C.w, 0] });
      this.pass(this.prog.blur, T.C, { t: T.D.tex }, { dir: [0, 1 / T.C.h] });
    }
    this.pass(this.prog.final, null, { scene: this.tex, b1: T.A.tex, b2: T.C.tex }, {
      bloom: P.lite ? 0 : P.bloom, ca: P.ca, vig: P.vig, flash: P.flash, flashCol: P.flashCol, slow: P.slow,
      grain: P.grain, time: time % 100, aspect: this.W / this.H, waves: P.waves,
    });
  },
};

// ---------------------------------------------------------------- fx.js
const FX = {
  pool: [], head: 0, MAX: 720,
  pops: [],
  trauma: 0, flashA: 0, flashCol: [1, 1, 1], ca: 0, waves: [],

  init() {
    this.pool = [];
    for (let i = 0; i < this.MAX; i++) this.pool.push({ on: false });
  },

  clear() {
    for (const p of this.pool) p.on = false;
    this.pops.length = 0;
    this.waves.length = 0;
    this.trauma = 0; this.flashA = 0; this.ca = 0;
  },

  part(o) {
    const p = this.pool[this.head];
    this.head = (this.head + 1) % this.MAX;
    p.on = true;
    p.type = o.type || 'dot';
    p.x = o.x; p.y = o.y;
    p.vx = o.vx || 0; p.vy = o.vy || 0;
    p.life = o.life || 0.5; p.t = 0;
    p.size = o.size || 3;
    p.color = o.color || PAL.white;
    p.drag = o.drag === undefined ? 3 : o.drag;
    p.r0 = o.r0 || 0; p.r1 = o.r1 || 40;
    p.w = o.w || 2;
    p.rot = o.rot || 0; p.vr = o.vr || 0;
    p.real = !!o.real;
    p.add = o.add !== false;
    return p;
  },

  burst(x, y, n, color, sp0, sp1, life, size, type) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, s = rnd(sp0, sp1);
      this.part({ type: type || 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: life * rnd(0.6, 1.2), size: size * rnd(0.6, 1.3), color, drag: 4 });
    }
  },

  ring(x, y, r0, r1, life, color, w) {
    this.part({ type: 'ring', x, y, r0, r1, life, color, w: w || 3 });
  },

  pop(text, x, y, o) {
    o = o || {};
    this.pops.push({ text, x, y, t: 0, life: o.life || 0.9, size: o.size || 18, color: o.color || PAL.white, vy: o.vy === undefined ? -38 : o.vy, big: !!o.big });
    if (this.pops.length > 24) this.pops.shift();
  },

  shake(a) {
    if (!Save.data.settings.shake) return;
    this.trauma = Math.min(1, this.trauma + a);
  },

  flash(a, col) {
    if (!Save.data.settings.flashes) a *= 0.25;
    this.flashA = Math.max(this.flashA, a);
    this.flashCol = col || [1, 1, 1];
  },

  wave(x, y, strength, speed) {
    this.waves.push({ x, y, t: 0, s: strength || 0.03, v: speed || 1.1 });
    if (this.waves.length > 3) this.waves.shift();
  },

  update(dtW, dtR) {
    for (const p of this.pool) {
      if (!p.on) continue;
      const dt = p.real ? dtR : dtW;
      p.t += dt;
      if (p.t >= p.life) { p.on = false; continue; }
      const k = Math.exp(-p.drag * dt);
      p.vx *= k; p.vy *= k;
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.rot += p.vr * dt;
    }
    for (let i = this.pops.length - 1; i >= 0; i--) {
      const q = this.pops[i];
      q.t += dtR;
      q.y += q.vy * dtR * (1 - q.t / q.life);
      if (q.t >= q.life) this.pops.splice(i, 1);
    }
    this.trauma = Math.max(0, this.trauma - dtR * 1.5);
    this.flashA = Math.max(0, this.flashA - dtR * 3.2);
    this.ca = Math.max(0, this.ca - dtR * 2.2);
    for (let i = this.waves.length - 1; i >= 0; i--) {
      const w = this.waves[i];
      w.t += dtR;
      if (w.t > 0.9) this.waves.splice(i, 1);
    }
  },

  shakeOffset(time) {
    const s = this.trauma * this.trauma * 16;
    if (s < 0.01) return [0, 0];
    return [s * (Math.sin(time * 61.3) * 0.6 + Math.sin(time * 23.7 + 1.3) * 0.4), s * (Math.sin(time * 53.1 + 2.1) * 0.6 + Math.sin(time * 31.9) * 0.4)];
  },

  // post uniforms: wave centres in uv space
  writeWaves(arr) {
    arr.fill(0);
    for (let i = 0; i < this.waves.length && i < 3; i++) {
      const w = this.waves[i];
      const sx = (G.offX + w.x * G.s) / G.pxW, sy = 1 - (G.offY + w.y * G.s) / G.pxH;
      const k = w.t / 0.9;
      arr[i * 4] = sx;
      arr[i * 4 + 1] = sy;
      arr[i * 4 + 2] = w.t * w.v * 0.6;
      arr[i * 4 + 3] = w.s * (1 - k) * (1 - k);
    }
  },
};

// ---- Geometry Wars style spring grid
const Grid = {
  sp: 40, nx: 0, ny: 0, ox: null, oy: null, x: null, y: null, vx: null, vy: null, energy: null,

  build(W, H) {
    this.nx = Math.ceil(W / this.sp) + 1;
    this.ny = Math.ceil(H / this.sp) + 1;
    const n = this.nx * this.ny;
    this.ox = new Float32Array(n); this.oy = new Float32Array(n);
    this.x = new Float32Array(n); this.y = new Float32Array(n);
    this.vx = new Float32Array(n); this.vy = new Float32Array(n);
    const offX = (W - (this.nx - 1) * this.sp) / 2, offY = (H - (this.ny - 1) * this.sp) / 2;
    for (let j = 0; j < this.ny; j++) {
      for (let i = 0; i < this.nx; i++) {
        const k = j * this.nx + i;
        this.ox[k] = this.x[k] = offX + i * this.sp;
        this.oy[k] = this.y[k] = offY + j * this.sp;
      }
    }
  },

  impulse(x, y, radius, strength) {
    if (!this.x) return;
    const r2 = radius * radius;
    for (let k = 0; k < this.x.length; k++) {
      const dx = this.x[k] - x, dy = this.y[k] - y;
      const d2 = dx * dx + dy * dy;
      if (d2 > r2 || d2 < 1) continue;
      const d = Math.sqrt(d2);
      const f = strength * (1 - d / radius);
      this.vx[k] += (dx / d) * f;
      this.vy[k] += (dy / d) * f;
    }
  },

  lineImpulse(x0, y0, ux, uy, width, strength) {
    if (!this.x) return;
    for (let k = 0; k < this.x.length; k++) {
      const dx = this.x[k] - x0, dy = this.y[k] - y0;
      const side = dx * uy - dy * ux;
      const ad = Math.abs(side);
      if (ad > width) continue;
      const f = strength * (1 - ad / width) * (side < 0 ? -1 : 1);
      this.vx[k] += uy * f;
      this.vy[k] += -ux * f;
    }
  },

  update(dt) {
    if (!this.x || dt <= 0) return;
    const steps = dt > 1 / 50 ? 2 : 1;
    const h = dt / steps;
    const nx = this.nx, ny = this.ny, K = 52, C = 150, D = 5.2;
    for (let s = 0; s < steps; s++) {
      for (let j = 1; j < ny - 1; j++) {
        for (let i = 1; i < nx - 1; i++) {
          const k = j * nx + i;
          const dx = this.x[k] - this.ox[k], dy = this.y[k] - this.oy[k];
          const ax = (this.x[k - 1] - this.ox[k - 1] + this.x[k + 1] - this.ox[k + 1] + this.x[k - nx] - this.ox[k - nx] + this.x[k + nx] - this.ox[k + nx]) * 0.25;
          const ay = (this.y[k - 1] - this.oy[k - 1] + this.y[k + 1] - this.oy[k + 1] + this.y[k - nx] - this.oy[k - nx] + this.y[k + nx] - this.oy[k + nx]) * 0.25;
          this.vx[k] += (-K * dx + C * (ax - dx) - D * this.vx[k]) * h;
          this.vy[k] += (-K * dy + C * (ay - dy) - D * this.vy[k]) * h;
          if (this.vx[k] > 900) this.vx[k] = 900; else if (this.vx[k] < -900) this.vx[k] = -900;
          if (this.vy[k] > 900) this.vy[k] = 900; else if (this.vy[k] < -900) this.vy[k] = -900;
        }
      }
      for (let j = 1; j < ny - 1; j++) {
        for (let i = 1; i < nx - 1; i++) {
          const k = j * nx + i;
          this.x[k] += this.vx[k] * h;
          this.y[k] += this.vy[k] * h;
        }
      }
    }
  },
};

// ---------------------------------------------------------------- hazards.js
// Every hazard is a pure function of world time where possible, so the
// attract-mode AI and the perfect-dodge check can ask "would this hit me at t?".
let HAZARD_SEQ = 0;

class Hazard {
  constructor(kind, born, fireW) {
    this.kind = kind;
    this.id = ++HAZARD_SEQ;
    this.born = born;
    this.fireW = fireW;
    this.dead = false;
    this.grazed = false;
    this.creditedBy = 0;
    this.harmless = false;
    this.harmlessUntil = -1;
    this.fired = false;
    this.load = 2;
  }
  prog(t) { return sat((t - this.born) / Math.max(0.001, this.fireW - this.born)); }
  canHurt(t) { return !this.harmless && t >= this.harmlessUntil && !this.dead; }
  hitsAt() { return false; }
  update() {}
  draw() {}
}

function glowOn(ctx, color, blur) {
  if (Post.ok) return;
  ctx.shadowColor = color;
  ctx.shadowBlur = blur * G.s;
}
function glowOff(ctx) {
  if (Post.ok) return;
  ctx.shadowBlur = 0;
}

function beam(ctx, x1, y1, x2, y2, w, alpha) {
  ctx.lineCap = 'round';
  ctx.globalAlpha = alpha * 0.22;
  ctx.strokeStyle = G.col.danger;
  ctx.lineWidth = w * 2.2;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  ctx.globalAlpha = alpha;
  glowOn(ctx, G.col.danger, 14);
  ctx.lineWidth = w;
  ctx.stroke();
  glowOff(ctx);
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = Math.max(1.5, w * 0.32);
  ctx.stroke();
  ctx.globalAlpha = 1;
}

// ---- laser: telegraph edges converge onto the beam exactly at fire time
class Laser extends Hazard {
  constructor(o) {
    super('laser', o.born, o.fireW);
    this.x = o.x; this.y = o.y;
    this.ux = Math.cos(o.ang); this.uy = Math.sin(o.ang);
    this.w = o.w || 18;
    this.active = 0.15;
    this.fade = 0.22;
    this.load = 2;
    this.seg = clipLineToRect(this.x, this.y, this.ux, this.uy, -40, -40, G.W + 40, G.H + 40) || [this.x, this.y, this.x, this.y];
  }
  update(t) {
    if (!this.fired && t >= this.fireW) {
      this.fired = true;
      Game.onHazardFire(this);
    }
    if (t > this.fireW + this.active + this.fade) this.dead = true;
  }
  hitsAt(x, y, rad, t) {
    return t >= this.fireW && t < this.fireW + this.active && distToLine(x, y, this.x, this.y, this.ux, this.uy) < this.w / 2 + rad;
  }
  draw(ctx, layer, t) {
    const [x1, y1, x2, y2] = this.seg;
    if (layer === 0 && t < this.fireW) {
      const p = this.prog(t);
      const nx = -this.uy, ny = this.ux;
      const d = this.w / 2 + 52 * (1 - p);
      ctx.strokeStyle = G.col.danger;
      ctx.lineWidth = 1.3;
      ctx.globalAlpha = 0.18 + 0.3 * p;
      ctx.setLineDash([7, 9]);
      ctx.lineDashOffset = -t * 40;
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 0.3 + 0.6 * p * p;
      ctx.lineWidth = 1.6 + p * 1.4;
      ctx.beginPath();
      ctx.moveTo(x1 + nx * d, y1 + ny * d); ctx.lineTo(x2 + nx * d, y2 + ny * d);
      ctx.moveTo(x1 - nx * d, y1 - ny * d); ctx.lineTo(x2 - nx * d, y2 - ny * d);
      ctx.stroke();
      ctx.globalAlpha = 1;
    } else if (layer === 1 && t >= this.fireW) {
      const e = t - this.fireW;
      let w = this.w, a = 1;
      if (e > this.active) {
        const k = sat((e - this.active) / this.fade);
        w = this.w * (1 - k * 0.85);
        a = 1 - k;
      } else {
        w = this.w * (1 + 0.5 * (1 - e / this.active));
      }
      if (this.harmless) a *= 0.55;
      beam(ctx, x1, y1, x2, y2, w, a);
    }
  }
}

// ---- ring: a shockwave you dash through as it reaches you
class Ring extends Hazard {
  constructor(o) {
    super('ring', o.born, o.fireW);
    this.x = o.x; this.y = o.y;
    this.speed = o.speed;
    this.th = o.th || 12;
    this.gaps = o.gaps || null;
    this.maxR = Math.hypot(G.W, G.H) + 60;
    this.load = 2;
  }
  r(t) { return (t - this.fireW) * this.speed; }
  update(t) {
    if (!this.fired && t >= this.fireW) {
      this.fired = true;
      Game.onHazardFire(this);
    }
    if (this.fired && this.r(t) > this.maxR) this.dead = true;
  }
  inGap(x, y, rad) {
    if (!this.gaps) return false;
    const d = Math.hypot(x - this.x, y - this.y);
    const a = Math.atan2(y - this.y, x - this.x);
    const pad = Math.asin(Math.min(1, rad / Math.max(d, rad + 1)));
    for (const g of this.gaps) if (Math.abs(angDiff(g.a, a)) < g.half - pad) return true;
    return false;
  }
  hitsAt(x, y, rad, t) {
    if (t < this.fireW) return false;
    const r = this.r(t);
    const d = Math.hypot(x - this.x, y - this.y);
    if (Math.abs(d - r) >= this.th / 2 + rad) return false;
    return !this.inGap(x, y, rad);
  }
  draw(ctx, layer, t) {
    if (layer === 0 && t < this.fireW) {
      const p = this.prog(t);
      ctx.strokeStyle = G.col.danger;
      for (let i = 0; i < 3; i++) {
        const k = (t * 1.6 + i / 3) % 1;
        ctx.globalAlpha = (1 - k) * (0.25 + 0.5 * p);
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(this.x, this.y, 8 + k * 34 * (1 - p * 0.5), 0, TAU); ctx.stroke();
      }
      ctx.globalAlpha = 0.5 + 0.5 * p;
      ctx.fillStyle = G.col.danger;
      ctx.beginPath(); ctx.arc(this.x, this.y, 4 + 5 * p, 0, TAU); ctx.fill();
      if (this.gaps) {
        ctx.globalAlpha = 0.6 * p;
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        for (const g of this.gaps) {
          ctx.beginPath(); ctx.arc(this.x, this.y, 26, g.a - g.half, g.a + g.half); ctx.stroke();
        }
      }
      ctx.globalAlpha = 1;
    } else if (layer === 1 && t >= this.fireW) {
      const r = this.r(t);
      if (r <= 0) return;
      const a = this.harmless ? 0.5 : 1;
      const arcs = [];
      if (this.gaps) {
        const gs = this.gaps.map((g) => [g.a - g.half, g.a + g.half]).sort((p, q) => p[0] - q[0]);
        for (let i = 0; i < gs.length; i++) {
          const s = gs[i][1], e = gs[(i + 1) % gs.length][0] + (i === gs.length - 1 ? TAU : 0);
          arcs.push([s, e]);
        }
      } else arcs.push([0, TAU]);
      ctx.strokeStyle = G.col.danger;
      ctx.lineCap = 'round';
      ctx.globalAlpha = 0.2 * a;
      ctx.lineWidth = this.th * 2.2;
      ctx.beginPath();
      for (const [s, e] of arcs) { ctx.moveTo(this.x + Math.cos(s) * r, this.y + Math.sin(s) * r); ctx.arc(this.x, this.y, r, s, e); }
      ctx.stroke();
      ctx.globalAlpha = a;
      ctx.lineWidth = this.th;
      glowOn(ctx, G.col.danger, 12);
      ctx.stroke();
      glowOff(ctx);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = this.th * 0.3;
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }
}

// ---- bomb: an approach circle closes on the blast radius at detonation
class Bomb extends Hazard {
  constructor(o) {
    super('bomb', o.born, o.fireW);
    this.x = o.x; this.y = o.y; this.R = o.R || 64;
    this.active = 0.12;
    this.load = 2;
  }
  update(t) {
    if (!this.fired && t >= this.fireW) {
      this.fired = true;
      Game.onHazardFire(this);
    }
    if (t > this.fireW + 0.45) this.dead = true;
  }
  hitsAt(x, y, rad, t) {
    return t >= this.fireW && t < this.fireW + this.active && Math.hypot(x - this.x, y - this.y) < this.R + rad;
  }
  draw(ctx, layer, t) {
    if (layer === 0 && t < this.fireW) {
      const p = this.prog(t);
      ctx.fillStyle = G.col.danger;
      ctx.globalAlpha = 0.05 + 0.17 * p;
      ctx.beginPath(); ctx.arc(this.x, this.y, this.R, 0, TAU); ctx.fill();
      ctx.strokeStyle = G.col.danger;
      ctx.globalAlpha = 0.45;
      ctx.lineWidth = 1.3;
      ctx.stroke();
      ctx.globalAlpha = 0.35 + 0.6 * p;
      ctx.lineWidth = 2.2 + 1.5 * p;
      ctx.beginPath(); ctx.arc(this.x, this.y, this.R * (1 + 1.35 * (1 - p)), 0, TAU); ctx.stroke();
      ctx.globalAlpha = 0.6;
      ctx.lineWidth = 1.5;
      const c = 7;
      ctx.beginPath();
      ctx.moveTo(this.x - c, this.y); ctx.lineTo(this.x + c, this.y);
      ctx.moveTo(this.x, this.y - c); ctx.lineTo(this.x, this.y + c);
      ctx.stroke();
      ctx.globalAlpha = 1;
    } else if (layer === 1 && t >= this.fireW) {
      const k = sat((t - this.fireW) / 0.45);
      const a = (1 - k) * (this.harmless ? 0.5 : 1);
      ctx.globalAlpha = a * a * 0.9;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(this.x, this.y, this.R * (0.85 + 0.2 * k), 0, TAU); ctx.fill();
      ctx.globalAlpha = a;
      ctx.strokeStyle = G.col.danger;
      ctx.lineWidth = 9 * (1 - k) + 1;
      glowOn(ctx, G.col.danger, 16);
      ctx.beginPath(); ctx.arc(this.x, this.y, this.R * (1 + 0.45 * k), 0, TAU); ctx.stroke();
      glowOff(ctx);
      ctx.globalAlpha = 1;
    }
  }
}

// ---- bullets and the turrets that fire them on the beat
class Bullet extends Hazard {
  constructor(x, y, vx, vy, t) {
    super('bullet', t, t);
    this.x = x; this.y = y; this.vx = vx; this.vy = vy;
    this.r = 6.5;
    this.fired = true;
    this.load = 0;
  }
  update(t, dt) {
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    if (this.x < -40 || this.y < -40 || this.x > G.W + 40 || this.y > G.H + 40) this.dead = true;
  }
  hitsAt(x, y, rad, t) {
    const d = t - G.timeW;
    return Math.hypot(x - (this.x + this.vx * d), y - (this.y + this.vy * d)) < this.r + rad;
  }
  draw(ctx, layer) {
    if (layer !== 1) return;
    const a = this.harmless ? 0.45 : 1;
    const sp = Math.hypot(this.vx, this.vy) || 1;
    ctx.globalAlpha = 0.5 * a;
    ctx.strokeStyle = G.col.danger;
    ctx.lineWidth = this.r * 1.2;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(this.x, this.y);
    ctx.lineTo(this.x - (this.vx / sp) * 16, this.y - (this.vy / sp) * 16);
    ctx.stroke();
    ctx.globalAlpha = a;
    Render.glowSprite(ctx, G.col.danger, this.x, this.y, this.r * 4.2, 0.8 * a);
    ctx.fillStyle = G.col.danger;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(this.x, this.y, this.r * 0.5, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
  }
}

class Turret extends Hazard {
  // shots: [{t, aimed:bool, ang, spread, n, speed}]
  constructor(o) {
    super('turret', o.born, o.shots[0].t);
    this.x = o.x; this.y = o.y;
    this.shots = o.shots;
    this.next = 0;
    this.aim = Math.atan2(G.player.y - this.y, G.player.x - this.x);
    this.load = o.load || 3;
    this.spin = o.spin || 0;
  }
  update(t) {
    if (this.next < this.shots.length) this.aim = Math.atan2(G.player.y - this.y, G.player.x - this.x);
    while (this.next < this.shots.length && t >= this.shots[this.next].t) {
      const s = this.shots[this.next++];
      const base = s.aimed ? this.aim : s.ang;
      const n = s.n || 1;
      for (let i = 0; i < n; i++) {
        const a = base + (n > 1 ? (i / (n - 1) - 0.5) * s.spread : 0);
        G.hazards.push(new Bullet(this.x, this.y, Math.cos(a) * s.speed, Math.sin(a) * s.speed, t));
      }
      this.fired = true;
      Sfx.bullet();
      FX.ring(this.x, this.y, 6, 26, 0.25, G.col.danger, 2);
    }
    const last = this.shots[this.shots.length - 1].t;
    if (t > last + 0.45) this.dead = true;
  }
  draw(ctx, layer, t) {
    if (layer !== 0) return;
    const last = this.shots[this.shots.length - 1].t;
    const fade = t > last ? 1 - sat((t - last) / 0.45) : 1;
    const p = this.prog(t);
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.globalAlpha = fade;
    Render.glowSprite(ctx, G.col.danger, 0, 0, 46, 0.25 + 0.4 * p);
    ctx.rotate(this.aim);
    ctx.strokeStyle = G.col.danger;
    ctx.fillStyle = PAL.ink;
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = i * TAU / 6 + t * this.spin;
      const r = 12;
      if (i === 0) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r); else ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(6, 0); ctx.lineTo(19, 0); ctx.stroke();
    if (t < this.fireW) {
      ctx.globalAlpha = fade;
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(0, 0, 18, -Math.PI / 2, -Math.PI / 2 + TAU * p); ctx.stroke();
    }
    ctx.fillStyle = '#ffffff';
    ctx.globalAlpha = fade * (0.4 + 0.6 * p);
    ctx.beginPath(); ctx.arc(0, 0, 4, 0, TAU); ctx.fill();
    ctx.restore();
  }
}

// ---- wall: a bar sweeping across the arena, sometimes with a gap
class Wall extends Hazard {
  constructor(o) {
    super('wall', o.born, o.fireW);
    this.axis = o.axis; // 'y': horizontal bar moving along y
    this.p0 = o.p0; this.v = o.v;
    this.th = o.th || 26;
    this.gap = o.gap || null;
    this.load = 3;
  }
  pos(t) { return this.p0 + this.v * Math.max(0, t - this.fireW); }
  update(t) {
    if (!this.fired && t >= this.fireW) { this.fired = true; Game.onHazardFire(this); }
    const p = this.pos(t), lim = this.axis === 'y' ? G.H : G.W;
    if ((this.v > 0 && p > lim + this.th) || (this.v < 0 && p < -this.th)) this.dead = true;
  }
  hitsAt(x, y, rad, t) {
    if (t < this.fireW) return false;
    const p = this.pos(t);
    const along = this.axis === 'y' ? y : x, across = this.axis === 'y' ? x : y;
    if (Math.abs(along - p) >= this.th / 2 + rad) return false;
    if (this.gap && Math.abs(across - this.gap.c) < this.gap.w / 2 - rad) return false;
    return true;
  }
  rects(p) {
    const len = this.axis === 'y' ? G.W : G.H;
    const segs = this.gap ? [[-20, this.gap.c - this.gap.w / 2], [this.gap.c + this.gap.w / 2, len + 20]] : [[-20, len + 20]];
    return segs.map(([a, b]) => (this.axis === 'y' ? [a, p - this.th / 2, b - a, this.th] : [p - this.th / 2, a, this.th, b - a]));
  }
  draw(ctx, layer, t) {
    if (layer === 0 && t < this.fireW) {
      const p = this.prog(t);
      const dir = Math.sign(this.v);
      const edge = this.v > 0 ? 14 : (this.axis === 'y' ? G.H : G.W) - 14;
      const len = this.axis === 'y' ? G.W : G.H;
      ctx.strokeStyle = G.col.danger;
      ctx.lineWidth = 3;
      ctx.lineJoin = 'round';
      const blink = 0.35 + 0.65 * (Math.sin(t * 18) * 0.5 + 0.5) * p + 0.2 * p;
      ctx.globalAlpha = Math.min(1, blink);
      for (let c = 1; c <= 5; c++) {
        const across = (len * c) / 6;
        if (this.gap && Math.abs(across - this.gap.c) < this.gap.w / 2) continue;
        for (let k = 0; k < 2; k++) {
          const o = edge + dir * k * 9;
          if (this.axis === 'y') {
            ctx.beginPath(); ctx.moveTo(across - 9, o - dir * 6); ctx.lineTo(across, o); ctx.lineTo(across + 9, o - dir * 6); ctx.stroke();
          } else {
            ctx.beginPath(); ctx.moveTo(o - dir * 6, across - 9); ctx.lineTo(o, across); ctx.lineTo(o - dir * 6, across + 9); ctx.stroke();
          }
        }
      }
      if (this.gap) {
        ctx.strokeStyle = '#ffffff';
        ctx.globalAlpha = 0.5 * p;
        ctx.lineWidth = 2;
        ctx.setLineDash([4, 6]);
        ctx.beginPath();
        for (const s of [-1, 1]) {
          const c = this.gap.c + (s * this.gap.w) / 2;
          if (this.axis === 'y') { ctx.moveTo(c, 0); ctx.lineTo(c, G.H); } else { ctx.moveTo(0, c); ctx.lineTo(G.W, c); }
        }
        ctx.stroke();
        ctx.setLineDash([]);
      }
      ctx.globalAlpha = 1;
    } else if (layer === 1 && t >= this.fireW) {
      const p = this.pos(t);
      const a = this.harmless ? 0.5 : 1;
      for (const [x, y, w, h] of this.rects(p)) {
        ctx.globalAlpha = 0.2 * a;
        ctx.fillStyle = G.col.danger;
        ctx.fillRect(x - 6, y - 6, w + 12, h + 12);
        ctx.globalAlpha = 0.92 * a;
        glowOn(ctx, G.col.danger, 14);
        ctx.fillRect(x, y, w, h);
        glowOff(ctx);
        ctx.save();
        ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
        ctx.strokeStyle = '#ffffff';
        ctx.globalAlpha = 0.28 * a;
        ctx.lineWidth = 5;
        const off = (t * 60) % 24;
        ctx.beginPath();
        if (this.axis === 'y') for (let s = x - 40 + off; s < x + w + 40; s += 24) { ctx.moveTo(s, y + h); ctx.lineTo(s + h, y); }
        else for (let s = y - 40 + off; s < y + h + 40; s += 24) { ctx.moveTo(x, s); ctx.lineTo(x + w, s + w); }
        ctx.stroke();
        ctx.restore();
        ctx.globalAlpha = a;
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        if (this.axis === 'y') { ctx.moveTo(x, y); ctx.lineTo(x + w, y); ctx.moveTo(x, y + h); ctx.lineTo(x + w, y + h); }
        else { ctx.moveTo(x, y); ctx.lineTo(x, y + h); ctx.moveTo(x + w, y); ctx.lineTo(x + w, y + h); }
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
  }
}

// ---- sweeper: a beam rotating around a pivot
class Sweeper extends Hazard {
  constructor(o) {
    super('sweeper', o.born, o.fireW);
    this.px = o.px; this.py = o.py;
    this.a0 = o.a0; this.dir = o.dir; this.omega = o.omega; this.arc = o.arc;
    this.len = Math.hypot(G.W, G.H) + 40;
    this.w = o.w || 14;
    this.endW = this.fireW + this.arc / this.omega;
    this.load = 4;
  }
  angAt(t) { return this.a0 + this.dir * this.omega * clamp(t - this.fireW, 0, this.arc / this.omega); }
  update(t) {
    if (!this.fired && t >= this.fireW) { this.fired = true; Game.onHazardFire(this); }
    if (t > this.endW + 0.3) this.dead = true;
  }
  hitsAt(x, y, rad, t) {
    if (t < this.fireW || t > this.endW) return false;
    const a = this.angAt(t);
    return distToSegment(x, y, this.px, this.py, this.px + Math.cos(a) * this.len, this.py + Math.sin(a) * this.len) < this.w / 2 + rad;
  }
  draw(ctx, layer, t) {
    if (layer === 0 && t < this.fireW) {
      const p = this.prog(t);
      ctx.strokeStyle = G.col.danger;
      ctx.globalAlpha = 0.25 + 0.5 * p;
      ctx.lineWidth = 2;
      ctx.setLineDash([5, 7]);
      const s = this.a0, e = this.a0 + this.dir * this.arc;
      ctx.beginPath(); ctx.arc(this.px, this.py, 62, Math.min(s, e), Math.max(s, e)); ctx.stroke();
      ctx.setLineDash([]);
      const ax = this.px + Math.cos(e) * 62, ay = this.py + Math.sin(e) * 62;
      const tang = e + (this.dir * Math.PI) / 2;
      ctx.fillStyle = G.col.danger;
      ctx.beginPath();
      ctx.moveTo(ax + Math.cos(tang) * 9, ay + Math.sin(tang) * 9);
      ctx.lineTo(ax + Math.cos(tang + 2.5) * 7, ay + Math.sin(tang + 2.5) * 7);
      ctx.lineTo(ax + Math.cos(tang - 2.5) * 7, ay + Math.sin(tang - 2.5) * 7);
      ctx.fill();
      ctx.globalAlpha = 0.15 + 0.45 * p;
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(this.px, this.py); ctx.lineTo(this.px + Math.cos(s) * this.len, this.py + Math.sin(s) * this.len); ctx.stroke();
      ctx.globalAlpha = 1;
      Render.glowSprite(ctx, G.col.danger, this.px, this.py, 40, 0.3 + 0.5 * p);
    } else if (layer === 1 && t >= this.fireW && t <= this.endW + 0.3) {
      const a = this.angAt(t);
      const fade = t > this.endW ? 1 - (t - this.endW) / 0.3 : 1;
      ctx.globalAlpha = 0.08 * fade;
      ctx.fillStyle = G.col.danger;
      ctx.beginPath();
      ctx.moveTo(this.px, this.py);
      ctx.arc(this.px, this.py, this.len, a - this.dir * 0.22, a, this.dir < 0);
      ctx.closePath();
      ctx.fill();
      ctx.globalAlpha = 1;
      beam(ctx, this.px, this.py, this.px + Math.cos(a) * this.len, this.py + Math.sin(a) * this.len, this.w, fade * (this.harmless ? 0.5 : 1));
      Render.glowSprite(ctx, '#ffffff', this.px, this.py, 30, 0.8 * fade);
    }
  }
}

// ---- seeker: homes in, then detonates on the beat
class Seeker extends Hazard {
  constructor(o) {
    super('seeker', o.born, o.fireW);
    this.x = o.x; this.y = o.y;
    this.ang = Math.atan2(G.player.y - o.y, G.player.x - o.x);
    this.sp = 0; this.max = o.speed || 125; this.turn = o.turn || 2.2;
    this.armW = o.armW; this.R = o.R || 50;
    this.exploded = false; this.killed = false;
    this.r = 10;
    this.load = 4;
  }
  update(t, dt) {
    if (this.killed) { this.dead = true; return; }
    if (!this.exploded && t >= this.fireW) {
      const want = Math.atan2(G.player.y - this.y, G.player.x - this.x);
      const d = angDiff(this.ang, want);
      this.ang += clamp(d, -this.turn * dt, this.turn * dt);
      this.sp = Math.min(this.max, this.sp + 220 * dt);
      this.x += Math.cos(this.ang) * this.sp * dt;
      this.y += Math.sin(this.ang) * this.sp * dt;
      this.x = clamp(this.x, 8, G.W - 8);
      this.y = clamp(this.y, 8, G.H - 8);
    }
    if (!this.exploded && t >= this.armW) {
      this.exploded = true;
      this.fired = true;
      Game.onHazardFire(this);
    }
    if (this.exploded && t > this.armW + 0.45) this.dead = true;
  }
  hitsAt(x, y, rad, t) {
    if (this.killed) return false;
    if (t < this.armW) {
      if (t < this.fireW) return false;
      const d = t - G.timeW;
      const bx = this.x + Math.cos(this.ang) * this.sp * d, by = this.y + Math.sin(this.ang) * this.sp * d;
      return Math.hypot(x - bx, y - by) < this.r + rad;
    }
    return t < this.armW + 0.12 && Math.hypot(x - this.x, y - this.y) < this.R + rad;
  }
  kill() {
    this.killed = true;
    FX.burst(this.x, this.y, 18, G.col.danger, 80, 260, 0.5, 3);
    for (let i = 0; i < 3; i++) Game.spawnShard(this.x, this.y, { burst: true, home: true });
  }
  draw(ctx, layer, t) {
    if (layer !== 1 || this.killed) return;
    if (!this.exploded) {
      const toArm = this.armW - t;
      const beatLen = Director.beatLen;
      if (toArm < beatLen * 2.5) {
        const p = 1 - toArm / (beatLen * 2.5);
        ctx.strokeStyle = G.col.danger;
        ctx.globalAlpha = 0.25 + 0.6 * p;
        ctx.lineWidth = 2.2;
        ctx.beginPath(); ctx.arc(this.x, this.y, this.R * (1 + 1.2 * (1 - p)), 0, TAU); ctx.stroke();
        ctx.globalAlpha = 0.12 * p;
        ctx.fillStyle = G.col.danger;
        ctx.beginPath(); ctx.arc(this.x, this.y, this.R, 0, TAU); ctx.fill();
        ctx.globalAlpha = 1;
      }
      const a = t < this.fireW ? 0.5 + 0.5 * this.prog(t) : 1;
      Render.glowSprite(ctx, G.col.danger, this.x, this.y, 44, 0.7 * a);
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(t * 5);
      ctx.globalAlpha = a;
      ctx.fillStyle = G.col.danger;
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, -this.r * 1.3); ctx.lineTo(this.r, 0); ctx.lineTo(0, this.r * 1.3); ctx.lineTo(-this.r, 0);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.restore();
      ctx.globalAlpha = 1;
    } else {
      const k = sat((t - this.armW) / 0.45);
      ctx.globalAlpha = (1 - k) * (1 - k) * 0.9;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(this.x, this.y, this.R * (0.85 + 0.2 * k), 0, TAU); ctx.fill();
      ctx.globalAlpha = 1 - k;
      ctx.strokeStyle = G.col.danger;
      ctx.lineWidth = 9 * (1 - k) + 1;
      ctx.beginPath(); ctx.arc(this.x, this.y, this.R * (1 + 0.45 * k), 0, TAU); ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }
}

// ---------------------------------------------------------------- boss.js
// Every fifth phase a boss takes over the beat. Your PERFECT dodges launch
// sparks that home in on it; Burst hits it hard. It has its own RNG stream so
// the Daily schedule stays identical no matter how fast you kill it.
const BOSS_NAMES = ['The Conductor', 'The Metronome', 'The Crescendo', 'The Downbeat'];

function polygon(ctx, n, r) {
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const a = -Math.PI / 2 + (i * TAU) / n;
    if (i === 0) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r); else ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
  }
  ctx.closePath();
}

class BossCore extends Hazard {
  constructor(ph) {
    super('boss', G.timeW, G.timeW + Director.beatLen * 3);
    this.lv = Math.max(1, Math.floor(ph / 5));
    const round = Math.floor((this.lv - 1) / BOSS_NAMES.length);
    this.name = BOSS_NAMES[(this.lv - 1) % BOSS_NAMES.length] + (round > 0 ? ' +' + round : '');
    this.maxHp = 100;
    this.hp = 100;
    this.x = G.W / 2;
    this.y = -70;
    this.ty = G.top + 80;
    this.r = 30;
    this.load = 0;
    this.fired = true;
    this.grazed = true;
    this.rng = new RNG((G.run.seed ^ Math.imul(ph, 2654435761)) >>> 0);
    this.leaving = false;
    this.dying = 0;
    this.flash = 0;
    this.spin = 0;
    this.pulse = 0;
    this.nextAttack = 0;
  }

  canHurt(t) { return !this.dead && !this.dying && !this.leaving && t >= this.harmlessUntil; }

  hitsAt(x, y, rad, t) {
    if (this.dying || this.leaving || t < this.fireW) return false;
    return Math.hypot(x - this.x, y - this.y) < this.r + rad;
  }

  update(t, dt) {
    this.spin += dt * (1.1 + 0.25 * this.lv);
    this.flash = Math.max(0, this.flash - dt * 5);
    this.pulse = Math.max(0, this.pulse - dt * 4);
    if (this.dying) {
      this.dying += dt;
      if (this.dying > 1.3) this.dead = true;
      return;
    }
    if (this.leaving) {
      this.y -= 260 * dt;
      if (this.y < -90) this.dead = true;
      return;
    }
    this.y += (this.ty - this.y) * Math.min(1, dt * 2.5);
    this.x = G.W / 2 + Math.sin(t * 0.6) * G.W * 0.16;
  }

  onBeat(b) {
    if (this.dying || this.leaving || G.timeW < this.fireW - 0.01) return;
    this.pulse = 1;
    if (b < this.nextAttack) return;
    const P = { tele: this.lv >= 2 ? 1.5 : 2, speed: 1 + 0.1 * this.lv, gap: Math.max(2, 4 - 0.5 * (this.lv - 1)) };
    const pats = ['fan', 'rings', 'spiral', 'bombs', 'sweep'];
    const pat = pats[Math.floor(this.rng.next() * pats.length)];
    this[pat](b, P);
    this.nextAttack = b + P.gap + (pat === 'spiral' ? 2 : 0);
  }

  at(b, beats) { return Director.beatTime(b + beats); }

  fan(b, P) {
    const p = G.player, base = Math.atan2(p.y - this.y, p.x - this.x);
    const n = 3 + Math.min(2, this.lv - 1);
    const f = this.at(b, P.tele);
    for (let i = 0; i < n; i++) {
      const a = base + (i - (n - 1) / 2) * 0.42;
      G.hazards.push(new Laser({ born: G.timeW, fireW: f + (i % 2) * Director.beatLen * 0.5, x: this.x, y: this.y, ang: a, w: 16 }));
    }
  }

  rings(b, P) {
    const p = G.player, d = Math.hypot(p.x - this.x, p.y - this.y);
    for (let i = 0; i < 3; i++) {
      G.hazards.push(new Ring({ born: G.timeW, fireW: this.at(b, P.tele + i), x: this.x, y: this.y, speed: ringSpeed(d, P, 190), th: 12 }));
    }
  }

  spiral(b, P) {
    const a0 = this.rng.range(0, TAU), dir = this.rng.next() < 0.5 ? -1 : 1;
    const t0 = this.at(b, P.tele), bl = Director.beatLen, shots = [];
    for (let i = 0; i < 16; i++) shots.push({ t: t0 + i * 0.25 * bl, aimed: false, ang: a0 + dir * i * 0.38, n: 4, spread: TAU * 0.75, speed: 140 * P.speed });
    G.hazards.push(new Turret({ born: G.timeW, x: this.x, y: this.y, shots, load: 0, spin: dir * 3 }));
  }

  bombs(b, P) {
    const p = G.player;
    for (let i = 0; i < 3; i++) {
      const a = this.rng.range(0, TAU), d = i === 0 ? 0 : this.rng.range(40, 90);
      G.hazards.push(new Bomb({ born: G.timeW, fireW: this.at(b, Math.max(1.5, P.tele) + i * 0.5), x: clamp(p.x + Math.cos(a) * d, 24, G.W - 24), y: clamp(p.y + Math.sin(a) * d, G.top, G.H - 24), R: 60 }));
    }
  }

  sweep(b, P) {
    const p = G.player, pa = Math.atan2(p.y - this.y, p.x - this.x);
    const dir = this.rng.next() < 0.5 ? -1 : 1, lead = this.rng.range(0.7, 1.1);
    const omega = clamp(lead / (Director.beatLen * 2), 1.0, 3.2);
    G.hazards.push(new Sweeper({ born: G.timeW, fireW: this.at(b, Math.max(1.5, P.tele)), px: this.x, py: this.y, a0: pa - dir * lead, dir, omega, arc: lead * 2 }));
  }

  damage(n) {
    if (this.dying || this.leaving || this.dead) return;
    this.hp = Math.max(0, this.hp - n);
    this.flash = 1;
    Sfx.bossHit();
    UI.bossBar(this);
    FX.burst(this.x, this.y, 8, '#ffffff', 60, 220, 0.4, 2);
    if (this.hp <= 0) this.defeat();
  }

  defeat() {
    const R = G.run;
    this.dying = 0.0001;
    R.bosses++;
    const pts = Math.round(1000 * this.lv * R.scoreMul);
    R.score += pts;
    for (const h of G.hazards) {
      if (h === this || h.dead) continue;
      if (h.kind === 'bullet') { Game.spawnShard(h.x, h.y, { home: true, delay: 0.3 }); h.dead = true; }
      else if (h.kind === 'turret') h.dead = true;
    }
    for (let i = 0; i < 24; i++) Game.spawnShard(this.x, this.y, { burst: true, home: true, delay: rnd(0.4, 0.9) });
    FX.flash(0.6, [1, 0.85, 0.5]);
    FX.shake(0.8);
    FX.ca = 2;
    FX.wave(this.x, this.y, 0.08, 1.2);
    FX.ring(this.x, this.y, 10, 380, 1.0, '#ffffff', 8);
    FX.burst(this.x, this.y, 50, G.col.danger, 120, 520, 1.0, 4);
    Grid.impulse(this.x, this.y, 600, 1000);
    Sfx.bossDown();
    vibrate([30, 30, 60]);
    UI.bossBar(null);
    UI.banner('Boss defeated', '+' + fmtNum(pts) + ' · free upgrade', PAL.loot);
    Music.boss = false;
    G.pendingPick = G.timeR + 1.4;
  }

  retreat() {
    if (this.dying || this.leaving) return;
    this.leaving = true;
    UI.bossBar(null);
    Music.boss = false;
    if (G.state === 'play') UI.toast(this.name + ' got away', 'phase');
  }

  draw(ctx, layer, t) {
    if (layer !== 1) return;
    const x = this.x, y = this.y, r = this.r;
    if (this.dying) {
      const k = sat(this.dying / 1.3);
      ctx.globalAlpha = 1 - k;
      ctx.strokeStyle = '#ffffff';
      for (let i = 0; i < 3; i++) {
        ctx.lineWidth = 6 * (1 - k) + 1;
        ctx.beginPath(); ctx.arc(x, y, r * (1 + k * (2 + i * 1.6)), 0, TAU); ctx.stroke();
      }
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(x, y, r * 0.6 * (1 - k), 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
      return;
    }
    const hot = this.flash > 0.1, pul = this.pulse;
    const col = hot ? '#ffffff' : G.col.danger;
    Render.glowSprite(ctx, G.col.danger, x, y, r * 5, 0.55 + 0.35 * pul);
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(this.spin);
    ctx.strokeStyle = col;
    ctx.lineWidth = 3;
    polygon(ctx, 6, r * 1.45);
    ctx.stroke();
    ctx.rotate(-this.spin * 2.2);
    ctx.lineWidth = 2.2;
    polygon(ctx, 3, r * 1.05);
    ctx.stroke();
    ctx.restore();
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(x, y, r * (0.55 + 0.12 * pul), 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(x, y, r * 0.22, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#ffffff';
    ctx.globalAlpha = 0.55;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y, r * 1.9, -Math.PI / 2, -Math.PI / 2 + TAU * (this.hp / this.maxHp)); ctx.stroke();
    ctx.globalAlpha = 1;
  }
}

const Boss = {
  start(ph) {
    const b = new BossCore(ph);
    G.boss = b;
    G.hazards.push(b);
    Music.boss = true;
    UI.banner('Boss', b.name, PAL.danger);
    UI.bossBar(b);
    Sfx.bossWarn();
    FX.shake(0.35);
    if (!Save.data.seen.boss) {
      Save.data.seen.boss = true;
      UI.hint('PERFECT dodges and Bursts damage the boss.', null, 3);
    }
  },

  spark(x, y, dmg) {
    const b = G.boss;
    if (!b || b.dead || b.dying || b.leaving) return;
    const a = -Math.PI / 2 + rnd(-1.2, 1.2), s = rnd(160, 300);
    G.sparks.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, dmg, t: 0, trail: [] });
  },

  update(dt) {
    if (!G.sparks.length) return;
    const b = G.boss;
    for (const s of G.sparks) {
      s.t += dt;
      if (!b || b.dead || b.dying || b.leaving) { s.done = true; continue; }
      const dx = b.x - s.x, dy = b.y - s.y, d = Math.hypot(dx, dy) || 1;
      const acc = 1600 + s.t * 2400;
      s.vx += (dx / d) * acc * dt;
      s.vy += (dy / d) * acc * dt;
      const sp = Math.hypot(s.vx, s.vy);
      if (sp > 900) { s.vx *= 900 / sp; s.vy *= 900 / sp; }
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      s.trail.push(s.x, s.y);
      if (s.trail.length > 16) s.trail.splice(0, 2);
      if (d < b.r) { s.done = true; b.damage(s.dmg); }
      if (s.t > 3) s.done = true;
    }
    G.sparks = G.sparks.filter((s) => !s.done);
  },

  draw(ctx) {
    for (const s of G.sparks) {
      ctx.strokeStyle = PAL.core;
      ctx.lineWidth = 2.5;
      ctx.globalAlpha = 0.8;
      ctx.beginPath();
      for (let i = 0; i < s.trail.length; i += 2) {
        if (i === 0) ctx.moveTo(s.trail[i], s.trail[i + 1]); else ctx.lineTo(s.trail[i], s.trail[i + 1]);
      }
      ctx.stroke();
      ctx.globalAlpha = 1;
      Render.glowSprite(ctx, PAL.core, s.x, s.y, 26, 0.9);
    }
  },
};

// ---------------------------------------------------------------- director.js
// Schedules attacks on the beat. Its RNG stream (G.rng) is consumed a fixed
// number of times per decision, so the Daily schedule is identical for everyone.

function patLaser(b, P) {
  const p = G.player, r = G.rng;
  const snap = r.chance(0.4);
  const ang = snap ? r.int(0, 3) * (Math.PI / 4) : r.range(0, Math.PI);
  const off = r.range(-16, 16);
  const nx = -Math.sin(ang), ny = Math.cos(ang);
  G.hazards.push(new Laser({ born: G.timeW, fireW: Director.fireAt(b, P.tele), x: p.x + nx * off, y: p.y + ny * off, ang }));
}

function patLaserPair(b, P) {
  const p = G.player, r = G.rng;
  const ang = r.range(0, Math.PI), side = r.sign(), gap = r.range(88, 112);
  const nx = -Math.sin(ang), ny = Math.cos(ang);
  const f = Director.fireAt(b, P.tele);
  G.hazards.push(new Laser({ born: G.timeW, fireW: f, x: p.x, y: p.y, ang }));
  G.hazards.push(new Laser({ born: G.timeW, fireW: f + Director.beatLen * 0.5, x: p.x + nx * gap * side, y: p.y + ny * gap * side, ang }));
}

function patCross(b, P) {
  const p = G.player, r = G.rng;
  const ang = r.range(0, Math.PI / 2);
  const f = Director.fireAt(b, P.tele);
  G.hazards.push(new Laser({ born: G.timeW, fireW: f, x: p.x, y: p.y, ang }));
  G.hazards.push(new Laser({ born: G.timeW, fireW: f, x: p.x, y: p.y, ang: ang + Math.PI / 2 }));
}

function patLaserWave(b, P) {
  const p = G.player, r = G.rng;
  const ang = r.chance(0.5) ? 0 : Math.PI / 2;
  const dir = r.sign();
  const jit = [r.range(-8, 8), r.range(-8, 8), r.range(-8, 8), r.range(-8, 8), r.range(-8, 8)];
  const nx = -Math.sin(ang), ny = Math.cos(ang);
  for (let i = 0; i < 5; i++) {
    const off = (i - 2) * dir * 74 + jit[i];
    G.hazards.push(new Laser({ born: G.timeW, fireW: Director.fireAt(b, P.tele + i * 0.5, true), x: p.x + nx * off, y: p.y + ny * off, ang, w: 16 }));
  }
}

function ringSpeed(d, P, base) {
  const k = Math.max(1, Math.round((d / (base * P.speed) / Director.beatLen) * 2) / 2);
  return clamp(d / (k * Director.beatLen), 110, 430);
}

function patRing(b, P, gaps, delay) {
  const p = G.player, r = G.rng;
  const o = r.chance(0.6) ? Director.edgePoint(230) : Director.interiorPoint(210);
  const d = Math.hypot(p.x - o.x, p.y - o.y);
  const f = Director.fireAt(b, P.tele + (delay || 0), !!delay);
  let gp = null;
  if (gaps) {
    const toP = Math.atan2(p.y - o.y, p.x - o.x);
    const half = clamp(58 / Math.max(d, 60), 0.1, 0.6);
    const near = r.chance(0.5);
    const a1 = near ? toP + r.range(-0.3, 0.3) : r.range(0, TAU);
    gp = [{ a: a1, half }];
    if (r.chance(0.45)) gp.push({ a: a1 + Math.PI + r.range(-0.6, 0.6), half });
  }
  G.hazards.push(new Ring({ born: G.timeW, fireW: f, x: o.x, y: o.y, speed: ringSpeed(d, P, 180), gaps: gp }));
  return o;
}

function patRingGap(b, P) { patRing(b, P, true); }

function patRingDouble(b, P) {
  const o = patRing(b, P, false);
  const p = G.player;
  const d = Math.hypot(p.x - o.x, p.y - o.y);
  G.hazards.push(new Ring({ born: G.timeW, fireW: Director.fireAt(b, P.tele + 1, true), x: o.x, y: o.y, speed: ringSpeed(d, P, 180) }));
}

function patBomb(b, P) {
  const p = G.player, r = G.rng;
  const ox = r.range(-12, 12), oy = r.range(-12, 12), R = r.range(56, 70);
  G.hazards.push(new Bomb({ born: G.timeW, fireW: Director.fireAt(b, Math.max(1.5, P.tele)), x: p.x + ox, y: p.y + oy, R }));
}

function patBombTrio(b, P) {
  const p = G.player, r = G.rng;
  const a = r.range(0, TAU), ux = Math.cos(a), uy = Math.sin(a);
  const t = Math.max(1.5, P.tele);
  for (let i = 0; i < 3; i++) {
    const k = i - 1;
    G.hazards.push(new Bomb({ born: G.timeW, fireW: Director.fireAt(b, t + i * 0.5, true), x: clamp(p.x + ux * k * 100, 24, G.W - 24), y: clamp(p.y + uy * k * 100, G.top, G.H - 24), R: 58 }));
  }
}

function patBombLine(b, P) {
  const p = G.player, r = G.rng;
  const a = r.range(0, TAU), ux = Math.cos(a), uy = Math.sin(a), dir = r.sign();
  const t = Math.max(1.5, P.tele);
  for (let i = 0; i < 6; i++) {
    const k = (i - 2.5) * dir;
    const x = p.x + ux * k * 82, y = p.y + uy * k * 82;
    if (x < -20 || x > G.W + 20 || y < G.top - 30 || y > G.H + 20) continue;
    G.hazards.push(new Bomb({ born: G.timeW, fireW: Director.fireAt(b, t + i * 0.25, true), x, y, R: 50 }));
  }
}

function patTurret(b, P) {
  const o = Director.edgePoint(170, 18);
  const t0 = Director.fireAt(b, P.tele), bl = Director.beatLen;
  const shots = [0, 0.25, 0.5].map((k) => ({ t: t0 + k * bl, aimed: true, speed: 250 * P.speed }));
  G.hazards.push(new Turret({ born: G.timeW, x: o.x, y: o.y, shots, load: 3 }));
}

function patFan(b, P) {
  const r = G.rng;
  const o = Director.edgePoint(190, 18);
  const n = r.int(5, 7);
  const t0 = Director.fireAt(b, P.tele), bl = Director.beatLen;
  const shots = [0, 1].map((k) => ({ t: t0 + k * bl, aimed: true, n, spread: 1.05, speed: 200 * P.speed }));
  G.hazards.push(new Turret({ born: G.timeW, x: o.x, y: o.y, shots, load: 3 }));
}

function patSpiral(b, P) {
  const r = G.rng;
  const o = Director.interiorPoint(190);
  const a0 = r.range(0, TAU), dir = r.sign();
  const t0 = Director.fireAt(b, P.tele), bl = Director.beatLen;
  const shots = [];
  for (let i = 0; i < 16; i++) shots.push({ t: t0 + i * 0.25 * bl, aimed: false, ang: a0 + dir * i * 0.42, n: 3, spread: (TAU * 2) / 3, speed: 150 * P.speed });
  G.hazards.push(new Turret({ born: G.timeW, x: o.x, y: o.y, shots, load: 5, spin: dir * 3 }));
}

function patWall(b, P) {
  const r = G.rng, p = G.player;
  const axis = r.chance(0.6) ? 'y' : 'x';
  const fromStart = r.chance(0.5);
  const hasGap = r.chance(0.55);
  const gapOff = r.range(-140, 140);
  const lim = axis === 'y' ? G.H : G.W, across = axis === 'y' ? G.W : G.H;
  const p0 = fromStart ? (axis === 'y' ? G.top - 40 : -16) : lim + 16;
  const target = axis === 'y' ? p.y : p.x;
  const d = Math.max(60, Math.abs(target - p0));
  const k = Math.max(1, Math.round((d / (195 * P.speed) / Director.beatLen) * 2) / 2);
  const v = clamp(d / (k * Director.beatLen), 140, 380) * (fromStart ? 1 : -1);
  const gap = hasGap ? { c: clamp((axis === 'y' ? p.x : p.y) + gapOff, 60, across - 60), w: 104 } : null;
  G.hazards.push(new Wall({ born: G.timeW, fireW: Director.fireAt(b, Math.max(1.5, P.tele)), axis, p0, v, gap }));
  if (!G.attract) Sfx.warn();
}

function patSweeper(b, P) {
  const r = G.rng, p = G.player;
  const mid = (G.top + G.H) / 2;
  const opts = [[0, G.top], [G.W, G.top], [0, G.H], [G.W, G.H], [G.W / 2, G.top - 10], [G.W / 2, G.H], [0, mid], [G.W, mid]];
  let piv = r.pick(opts);
  const dir = r.sign(), lead = r.range(0.7, 1.3), extra = r.range(0.6, 1.4);
  if (Math.hypot(p.x - piv[0], p.y - piv[1]) < 130) piv = [G.W - piv[0], G.top + G.H - piv[1]];
  const pa = Math.atan2(p.y - piv[1], p.x - piv[0]);
  const kB = Math.max(1, Math.round((lead / (1.9 * P.speed) / Director.beatLen) * 2) / 2);
  const omega = clamp(lead / (kB * Director.beatLen), 1.0, 3.4);
  G.hazards.push(new Sweeper({ born: G.timeW, fireW: Director.fireAt(b, Math.max(1.5, P.tele)), px: piv[0], py: piv[1], a0: pa - dir * lead, dir, omega, arc: lead + extra }));
}

function patSeeker(b, P) {
  const o = Director.edgePoint(210, 14);
  const f = Director.fireAt(b, 1, true);
  G.hazards.push(new Seeker({ born: G.timeW, fireW: f, armW: f + Director.beatLen * 6, x: o.x, y: o.y, speed: 118 * P.speed }));
}

// dur: beats the pattern keeps the arena busy (for the load budget)
const PATTERNS = [
  { id: 'laser', ph: 1, w: 10, load: 2, dur: 1, fn: patLaser },
  { id: 'bomb', ph: 1, w: 9, load: 2, dur: 1, fn: patBomb },
  { id: 'ring', ph: 1, w: 8, load: 2, dur: 4, fn: patRing },
  { id: 'turret', ph: 2, w: 8, load: 3, dur: 2, fn: patTurret },
  { id: 'laser2', ph: 2, w: 6, load: 3, dur: 1.5, fn: patLaserPair },
  { id: 'ringgap', ph: 2, w: 5, load: 2, dur: 4, fn: patRingGap },
  { id: 'wall', ph: 3, w: 7, load: 3, dur: 5, fn: patWall },
  { id: 'bomb3', ph: 3, w: 6, load: 4, dur: 2, fn: patBombTrio },
  { id: 'fan', ph: 3, w: 6, load: 3, dur: 3, fn: patFan },
  { id: 'sweeper', ph: 4, w: 6, load: 4, dur: 3, fn: patSweeper },
  { id: 'cross', ph: 4, w: 5, load: 4, dur: 1, fn: patCross },
  { id: 'ring2', ph: 4, w: 5, load: 3, dur: 5, fn: patRingDouble },
  { id: 'seeker', ph: 5, w: 5, load: 4, dur: 7, fn: patSeeker },
  { id: 'wave', ph: 5, w: 5, load: 5, dur: 3, fn: patLaserWave },
  { id: 'spiral', ph: 5, w: 4, load: 5, dur: 5, fn: patSpiral },
  { id: 'bombline', ph: 6, w: 5, load: 5, dur: 3, fn: patBombLine },
];

const PHASE_NEWS = { 2: 'Turrets online', 3: 'Walls incoming', 4: 'Sweepers and crossfire', 5: 'Seekers and spirals', 6: 'Carpet bombing' };

const Director = {
  beatLen: 0.5, phaseLen: 40, startPhase: 1, nextBeat: 0, phase: 1, offset: 0,
  nextSpawn: 4, nextCapsule: 24, nextShards: 10, breather: 0, paused: false, attract: false, mut: null,
  fires: [], loads: [],

  reset(o) {
    this.beatLen = 60 / o.bpm;
    this.startPhase = o.startPhase || 1;
    this.phaseLen = (o.mut && o.mut.phaseLen) || 40;
    this.mut = o.mut || null;
    this.attract = !!o.attract;
    this.nextBeat = 0;
    this.offset = 0;
    this.phase = this.startPhase;
    this.paused = false;
    this.beginAt(0);
  },

  beginAt(b) {
    this.offset = b;
    this.paused = false;
    this.phase = this.startPhase;
    this.nextSpawn = b + 3;
    this.nextCapsule = b + 22 + G.rng.int(0, 8);
    this.nextShards = b + 8;
    this.breather = 0;
    this.fires = [];
    this.loads = [];
  },

  beatTime(b) { return b * this.beatLen; },

  fireAt(b, beats, force) {
    let fb = b + beats;
    if (!force && this.phase < 4) {
      let guard = 0;
      while (this.fires.some((f) => Math.abs(f - fb) < 0.26) && guard++ < 6) fb += 0.5;
    }
    this.fires.push(fb);
    if (this.fires.length > 24) this.fires.splice(0, this.fires.length - 24);
    return this.beatTime(fb);
  },

  params(ph) {
    const i = ph - 1;
    const intervals = [4, 3.2, 2.6, 2.2, 1.9, 1.6, 1.35, 1.15];
    const teles = [2.5, 2, 2, 1.5, 1.5, 1.5, 1, 1];
    let tele = teles[Math.min(i, teles.length - 1)];
    if (this.mut && this.mut.tele) tele = Math.max(1, Math.round(tele * this.mut.tele * 2) / 2);
    const interval = i < intervals.length ? intervals[i] : 1;
    return { interval, tele, speed: 1 + 0.06 * Math.min(i, 10), cap: Math.min(16, 4 + 2 * i) };
  },

  update() {
    let guard = 0;
    while (this.beatTime(this.nextBeat) <= G.timeW && guard++ < 8) {
      this.onBeat(this.nextBeat);
      this.nextBeat++;
    }
  },

  onBeat(b) {
    if (this.paused) return;
    if (G.state !== 'play' && !this.attract) return;
    const rb = b - this.offset;
    if (rb < 0) return;
    const ph = this.startPhase + Math.floor(rb / this.phaseLen);
    if (ph !== this.phase) {
      this.phase = ph;
      this.breather = b + 3;
      Game.onPhase(ph);
    }
    if (b >= this.nextCapsule) {
      Game.spawnCapsule(false);
      const mul = (this.mut && this.mut.capsuleMul) || 1;
      this.nextCapsule = b + Math.round(G.rng.int(18, 30) / mul);
    }
    if (b >= this.nextShards) {
      Game.spawnShardCluster();
      this.nextShards = b + G.rng.int(8, 15);
    }
    if (ph % 5 === 0 && !this.attract) {
      if (G.boss && !G.boss.dead) G.boss.onBeat(b);
      return;
    }
    if (b < this.breather || b < this.nextSpawn) return;
    const P = this.params(ph);
    this.loads = this.loads.filter((l) => l.until > b);
    const load = this.loads.reduce((s, l) => s + l.load, 0);
    const W = (this.mut && this.mut.weights) || {};
    const early = (this.mut && this.mut.early) || [];
    const avail = PATTERNS.filter((p) => (p.ph <= ph || early.includes(p.id)) && load + p.load <= P.cap);
    if (!avail.length) { this.nextSpawn = b + 1; return; }
    const pick = G.rng.weighted(avail, (q) => q.w * (W[q.id] || 1) * (q.ph === ph ? 1.4 : 1));
    pick.fn(b, P);
    this.loads.push({ load: pick.load, until: b + P.tele + pick.dur });
    this.nextSpawn = Math.max(b + 1, this.nextSpawn + P.interval);
  },

  edgePoint(minDist, inset) {
    inset = inset || 12;
    const r = G.rng, p = G.player;
    const cand = [];
    for (let i = 0; i < 10; i++) {
      const side = r.int(0, 3), u = r.next();
      let x, y;
      if (side === 0) { x = lerp(inset, G.W - inset, u); y = G.top - 22 + inset; }
      else if (side === 1) { x = G.W - inset; y = lerp(G.top, G.H - inset, u); }
      else if (side === 2) { x = lerp(inset, G.W - inset, u); y = G.H - inset; }
      else { x = inset; y = lerp(G.top, G.H - inset, u); }
      cand.push({ x, y });
    }
    let best = cand[0], bestD = -1;
    for (const c of cand) {
      const d = Math.hypot(c.x - p.x, c.y - p.y);
      if (d >= minDist) return c;
      if (d > bestD) { bestD = d; best = c; }
    }
    return best;
  },

  interiorPoint(minDist) {
    const r = G.rng, p = G.player;
    const cand = [];
    for (let i = 0; i < 10; i++) cand.push({ x: r.range(44, G.W - 44), y: r.range(G.top + 24, G.H - 44) });
    let best = cand[0], bestD = -1;
    for (const c of cand) {
      const d = Math.hypot(c.x - p.x, c.y - p.y);
      if (d >= minDist) return c;
      if (d > bestD) { bestD = d; best = c; }
    }
    return best;
  },
};

const G = {

function dashParams() {
  const R = G.run, perk = R ? R.perk : 'none';
  const oc = !!(R && R.fx.overclock > G.timeP);
  const u = (R && R.up) || {};
  const ph = (u.phase || 0) * 0.04;
  const multi = perk === 'double' || (u.twin || 0) > 0;
  return {
    dist: (perk === 'longdash' ? 140 : 112) * (1 + 0.2 * (u.stride || 0)),
    dur: 0.13,
    iframes: 0.19 + ph + (oc ? 0.03 : 0),
    blinkI: 0.17 + ph + (oc ? 0.03 : 0),
    regen: (multi ? 0.55 : 0.3) * (oc ? 0.55 : 1),
    minGap: multi ? 0.12 : 0,
    perfectWin: (perk === 'chrono' ? 0.14 : 0.1) + 0.02 * (u.trigger || 0),
    ghostWin: 0.24 + 0.02 * (u.trigger || 0),
    graze: GRAZE * (1 + 0.6 * (u.grazer || 0)),
  };
}

function makePlayer(x, y) {
  return {
    x, y, vx: 0, vy: 0, r: 11, hr: 7, alive: true,
    dash: null, charges: 1, maxCharges: 1, chargeT: 0, lastDashP: -9, invulnP: -1,
    shield: false, ghosts: [], trail: [], trailAcc: 0, squash: 0, sqAng: 0, facing: -Math.PI / 2,
    doom: null, born: G.timeR,

}

function makeRun(mode) {
  const today = todayKey();
  const mut = mode === 'daily' ? mutatorFor(today) : null;
  const perk = mode === 'attract' ? 'none' : Save.data.equipped.perk;
  return {

    skin: mode === 'attract' ? 'core' : Save.data.equipped.skin,
    seed: mode === 'daily' ? hashStr('afterimage-daily-' + today) : (Math.random() * 4294967296) >>> 0,
    bpm: mode === 'hyper' ? 150 : 120,
    score: 0, time: 0, shards: 0, perfects: 0, dodges: 0, grazes: 0,
    combo: 0, comboT: 0, mult: 1, maxMult: 1, chain: 0, lastPerfectR: -9,
    capsules: 0, rings: 0, lasers: 0, phase: 1, dashes: 0,

    fx: { overclock: -1, magnet: -1, timewarp: -1, storm: -1 },

    tutorial: null,

}

function startSlow(dur) {
  const now = G.timeR;
  if (G.slow && G.slow.end > now) G.slow.end = Math.min(now + 2.2, G.slow.end + dur * 0.55);
  else G.slow = { start: now, end: now + dur };
}

function slowScale() {
  if (!G.slow) return 1;
  const now = G.timeR;
  if (now >= G.slow.end) { G.slow = null; return 1; }
  const k = Math.min(1, (now - G.slow.start) / 0.05, (G.slow.end - now) / 0.28);
  return lerp(1, 0.22, easeOutCubic(sat(k)));
}

const Game = {
  start(mode, opts) {
    opts = opts || {};
    FX.clear();
    G.hazards = []; G.shards = []; G.capsules = [];
    G.timeW = 0; G.timeP = 0; G.hitstop = 0; G.slow = null; G.slowAmt = 0;
    G.buffer = null; G.pendingPower = null; G.stormAcc = 0; G.missionTick = 0;
    G.boss = null; G.sparks = []; G.pickCb = null; G.pendingPick = 0;
    const R = (G.run = makeRun(mode));
    G.rng = new RNG(R.seed);
    G.lrng = new RNG(mode === 'daily' ? R.seed ^ 0x9e3779b9 : (Math.random() * 4294967296) >>> 0);
    G.attract = mode === 'attract';
    const spawnY = mode === 'attract' && G.focusY ? G.focusY : clamp((G.top + G.H) / 2 + 40, G.top + 40, G.H - 40);
    G.player = makePlayer(G.W / 2, spawnY);
    const P = G.player;
    P.maxCharges = P.charges = R.perk === 'double' ? 2 : 1;
    if (R.perk === 'secondwind') P.shield = true;
    if (mode === 'normal' && !P.shield && Save.data.seen.tutorial && Save.data.best.time < 30) { P.shield = true; R.beginner = true; }
    let startPhase = mode === 'hyper' ? 2 : 1;
    if (R.mut && R.mut.startPhase) startPhase = Math.max(startPhase, R.mut.startPhase);
    if (G.attract) startPhase = 1 + Math.floor(Math.random() * 3);
    Director.reset({ bpm: R.bpm, startPhase, mut: R.mut, attract: G.attract });
    R.phase = Director.phase;
    G.gridCol = PHASE_HUES[(R.phase - 1) % PHASE_HUES.length];
    if (!G.attract && mode === 'normal' && !Save.data.seen.tutorial) {
      R.tutorial = { step: 0, tries: 0, hz: null, result: null, shown: false };
      Director.paused = true;
    }
    Music.setTrack(Save.data.equipped.track || 'neon');
    Music.boss = false;
    if (!opts.keepMusic) Music.start(0, R.bpm, G.attract ? 0 : Math.min(6, R.phase));
    else Music.resync(0);
    G.state = G.attract ? 'title' : 'play';
    const skin = SKINS[R.skin];
    FX.ring(P.x, P.y, 4, 90, 0.7, skin.glow, 3);
    Grid.impulse(P.x, P.y, 200, 300);
    if (!G.attract) {
      Sound.musicFilter(18000, 0.05);
      UI.onRunStart(R);
      if (R.beginner) UI.hint('Beginner shield: one free hit until you survive 30 seconds.', null, 3);
      if (R.mut) UI.banner(R.mut.name, R.mut.desc, PAL.loot);
      else if (mode === 'hyper') UI.banner('Hyper', '150 BPM · double score', PAL.danger);
    }
  },

  update(dtR) {
    G.timeR += dtR;
    if (G.state === 'paused' || G.state === 'boot' || G.state === 'pick') {
      if (G.state === 'pick') FX.update(0, dtR);
      return;
    }
    const R = G.run, P = G.player;
    const sl = slowScale();
    G.slowAmt = sat((1 - sl) / 0.78);
    let ws, ps;
    if (G.hitstop > 0) { G.hitstop -= dtR; ws = 0; ps = 0; }
    else {
      ws = sl; ps = sl < 1 ? 0.88 : 1;
      if (R && R.fx.timewarp > G.timeP) ws *= 0.6;
      if (G.state === 'dying') { ws = Math.min(ws, 0.28); ps = 0.28; }
      if (G.state === 'over') { ws = 0.14; ps = 0.14; }
    }
    G.ws = ws; G.ps = ps;
    Sound.detune = -420 * G.slowAmt;
    const dtW = dtR * ws, dtP = dtR * ps;
    const steps = Math.min(10, Math.max(1, Math.ceil(Math.max(dtW, dtP) / (1 / 120))));
    const hW = dtW / steps, hP = dtP / steps;
    const scoring = G.state === 'play' && R && !R.tutorial;
    for (let i = 0; i < steps; i++) {
      G.timeW += hW;
      G.timeP += hP;
      if (P.alive) this.updatePlayer(hP);
      Director.update();
      const hz = G.hazards;
      for (let k = 0; k < hz.length; k++) if (!hz[k].dead) hz[k].update(G.timeW, hW, G);
      this.updatePickups(hW, hP);
      if (P.alive && (G.state === 'play' || G.state === 'title')) this.collide();
      if (scoring && P.alive) {
        R.score += 10 * R.mult * R.scoreMul * (R.fx.storm > G.timeP ? 2 : 1) * (R.surge > G.timeP ? 2 : 1) * hW;
        R.time += hW;
      }
    }
    G.hazards = G.hazards.filter((h) => !h.dead);
    G.shards = G.shards.filter((s) => !s.dead);
    G.capsules = G.capsules.filter((c) => !c.dead);

    if (P.doom && G.timeR >= P.doom.at) { const h = P.doom.h; P.doom = null; this.die(h); }
    if (R && R.combo > 0 && P.alive && !(R.surge > G.timeP)) {
      R.comboT -= dtP;
      if (R.comboT <= 0) { R.combo = 0; this.setMult(); }
    }
    if (G.pendingPower && G.timeR >= G.pendingPower.at) { const k = G.pendingPower.kind; G.pendingPower = null; this.applyPower(k); }
    if (G.buffer) {
      if (G.timeR > G.buffer.until) G.buffer = null;
      else if (this.tryDash(G.buffer.dx, G.buffer.dy, G.buffer.blink, true)) G.buffer = null;
    }
    if (R && R.fx.storm > G.timeP && P.alive) {
      G.stormAcc += dtR;
      while (G.stormAcc > 0.07) {
        G.stormAcc -= 0.07;
        this.spawnShard(rnd(24, G.W - 24), G.top - 8, { vy: rnd(160, 260), fall: true, life: 4 });
      }
    }
    if (R && R.tutorial) this.tutorial();
    if (G.attract) {
      if (P.alive) this.ai();
      else if (G.timeR > G.respawnAt) this.start('attract', { keepMusic: true });
      if (G.timeW > 46) this.start('attract', { keepMusic: true });
    }
    if (G.state === 'dying' && G.timeR - G.deathT > 1.05) this.end();
    if (G.state === 'play' && R && !R.tutorial) {
      G.missionTick += dtR;
      if (G.missionTick > 0.2) { G.missionTick = 0; this.checkMissions(); }
    }

    Music.update(G.timeW, ws);
    if (G.state === 'play' || G.state === 'title') {
      const target = G.slowAmt > 0.05 ? lerp(18000, 700, G.slowAmt) : (R && R.fx.timewarp > G.timeP ? 2400 : (G.attract ? 2600 : 18000));
      if (Math.abs(target - (G.lpTarget || 0)) > 50) { G.lpTarget = target; Sound.musicFilter(target, 0.06); }
    }
    Grid.update(dtW > 0 ? Math.max(dtW, dtR * 0.15) : 0);
    FX.update(dtW, dtR);
    Boss.update(dtR);
    if (G.pendingPick && G.timeR > G.pendingPick && G.state === 'play') { G.pendingPick = 0; this.offerPick(null); }
    const q = Math.round(G.slowAmt * 10);
    if (G.colQ !== q) { G.colQ = q; G.col.danger = mixHex(PAL.danger, PAL.slow, q / 10 * 0.6); }
    const want = PHASE_HUES[((R ? R.phase : 1) - 1) % PHASE_HUES.length];
    if (G.gridTarget !== want) { G.gridFrom = G.gridCol; G.gridTarget = want; G.gridMix = 0; }
    if (G.gridMix < 1) { G.gridMix = Math.min(1, (G.gridMix || 0) + dtR * 1.2); G.gridCol = mixHex(G.gridFrom || want, want, G.gridMix); }
  },

  updatePlayer(h) {
    const P = G.player, dp = G.dp;
    if (P.dash) {
      const D = P.dash;
      D.t += h;
      const k = Math.min(1, D.t / D.dur), e = easeOutCubic(k);
      P.x = lerp(D.ox, D.tx, e);
      P.y = lerp(D.oy, D.ty, e);
      P.trailAcc += h;
      if (P.trailAcc > 0.011) {
        P.trailAcc = 0;
        P.trail.push({ x: P.x, y: P.y, t: G.timeR, ang: P.facing });
        if (P.trail.length > 48) P.trail.shift();
      }
      if (G.run && G.run.up.afterglow) this.afterglow();
      if (k >= 1) {
        if (!D.blink) { P.vx = D.ux * 110; P.vy = D.uy * 110; }
        P.dash = null;
      }
    } else {
      P.x += P.vx * h; P.y += P.vy * h;
      const d = Math.exp(-h * 9);
      P.vx *= d; P.vy *= d;
    }
    P.x = clamp(P.x, 16, G.W - 16);
    P.y = clamp(P.y, G.top, G.H - 16);
    if (P.charges < P.maxCharges) {
      P.chargeT += h;
      if (P.chargeT >= dp.regen) { P.charges++; P.chargeT = 0; }
    }
    P.squash = Math.max(0, P.squash - h * 5);
  },

  canControl() {
    const P = G.player;
    return P && P.alive && (G.state === 'play' || G.state === 'title') && G.hitstop <= 0.03;
  },

  tryDash(dx, dy, blink, fromBuffer) {
    const P = G.player, R = G.run, dp = G.dp || dashParams();
    if (!P || !P.alive || (G.state !== 'play' && G.state !== 'title')) return false;
    if (P.charges <= 0 || G.timeP - P.lastDashP < dp.minGap || G.hitstop > 0.03) {
      if (!fromBuffer) G.buffer = { dx, dy, blink, until: G.timeR + 0.13 };
      return false;
    }
    if (P.doom) { const h = P.doom.h; P.doom = null; this.credit(h, 'perfect'); }
    P.charges--;
    const id = ++G.dashSeq;
    let tx = P.x, ty = P.y, ux = 0, uy = 0;
    if (!blink) {
      const l = Math.hypot(dx, dy) || 1;
      ux = dx / l; uy = dy / l;
      tx = clamp(P.x + ux * dp.dist, 16, G.W - 16);
      ty = clamp(P.y + uy * dp.dist, G.top, G.H - 16);
      P.facing = Math.atan2(uy, ux);
    }
    P.dash = { id, t: 0, dur: blink ? 0.09 : dp.dur, ox: P.x, oy: P.y, tx, ty, ux, uy, blink };
    P.lastDashP = G.timeP;
    P.invulnP = Math.max(P.invulnP, G.timeP + (blink ? dp.blinkI : dp.iframes));
    P.ghosts.push({ id, ox: P.x, oy: P.y, w0: G.timeW });
    if (P.ghosts.length > 3) P.ghosts.shift();
    P.squash = blink ? 0.5 : 1;
    P.sqAng = P.facing;
    P.trail.push({ x: P.x, y: P.y, t: G.timeR, ang: P.facing });
    if (R) R.dashes++;
    const skin = SKINS[R ? R.skin : 'core'];
    if (!G.attract) { if (blink) Sfx.blink(); else Sfx.dash(); }
    FX.ring(P.x, P.y, 4, blink ? 34 : 22, 0.3, skin.glow, 2);
    if (!blink) {
      for (let i = 0; i < 6; i++) {
        const a = P.facing + Math.PI + rnd(-0.6, 0.6), s = rnd(80, 220);
        FX.part({ type: 'spark', x: P.x, y: P.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.3, size: 2.5, color: skin.glow });
      }
    }
    Grid.impulse(P.x, P.y, 90, blink ? -140 : 110);
    return true;
  },

  // swipe that started as a press, or a second arrow key: turn the fresh move into the intended dash
  redirectDash(dx, dy) {
    const P = G.player, dp = G.dp || dashParams();
    if (!P || !P.dash || G.timeP - P.lastDashP > 0.16) return false;
    const D = P.dash, l = Math.hypot(dx, dy) || 1;
    const ux = dx / l, uy = dy / l;
    const wasBlink = D.blink;
    D.ux = ux; D.uy = uy; D.blink = false; D.dur = dp.dur;
    D.tx = clamp(D.ox + ux * dp.dist, 16, G.W - 16);
    D.ty = clamp(D.oy + uy * dp.dist, G.top, G.H - 16);
    D.t = Math.min(D.t, 0.03);
    P.facing = Math.atan2(uy, ux);
    P.sqAng = P.facing;
    P.squash = 1;
    P.invulnP = Math.max(P.invulnP, P.lastDashP + dp.iframes);
    if (wasBlink && !G.attract) Sfx.dash();
    const skin = SKINS[G.run ? G.run.skin : 'core'];
    for (let i = 0; i < 5; i++) {
      const a = P.facing + Math.PI + rnd(-0.6, 0.6), s = rnd(80, 220);
      FX.part({ type: 'spark', x: P.x, y: P.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.3, size: 2.5, color: skin.glow });
    }
    return true;
  },

  collide() {
    const P = G.player, R = G.run, t = G.timeW, dp = G.dp;
    const inv = G.timeP < P.invulnP;
    const hz = G.hazards;
    for (let i = 0; i < hz.length; i++) {
      const h = hz[i];
      if (h.dead || h.kind === 'turret' || !h.canHurt(t)) continue;
      if (P.doom && P.doom.h === h) continue;
      // would this attack have hit the spot you just dashed out of?
      let tier = null;
      for (let g = P.ghosts.length - 1; g >= 0; g--) {
        const gh = P.ghosts[g];
        const dtw = t - gh.w0;
        if (dtw < 0 || dtw > dp.ghostWin) continue;
        if (h.hitsAt(gh.ox, gh.oy, P.hr, t) || (inv && h.hitsAt(P.x, P.y, P.hr, t))) {
          tier = dtw <= dp.perfectWin ? 'perfect' : 'dodge';
          break;
        }
      }
      if (tier) { this.credit(h, tier); continue; }
      if (h.hitsAt(P.x, P.y, P.hr, t)) {
        if (inv) { this.credit(h, 'dodge'); continue; }
        if (P.shield) { this.breakShield(h); continue; }
        if (R && R.tutorial) { this.tutorialHit(h); continue; }
        if (!P.doom) P.doom = { h, at: G.timeR + 0.08 };
        continue;
      }
      if (!h.grazed && h.hitsAt(P.x, P.y, P.hr + dp.graze, t)) { h.grazed = true; this.graze(h); }
    }
  },

  credit(h, tier) {
    const R = G.run, t = G.timeW;
    h.creditedBy = 1;
    h.grazed = true;
    if (h.kind === 'boss') h.harmlessUntil = t + 0.8;
    else if (h.kind === 'seeker' && !h.exploded) {
      if (tier === 'perfect') h.kill(); else h.harmlessUntil = t + 0.7;
    } else h.harmless = true;
    if (!R) return;
    if (h.kind === 'ring') R.rings++;
    if (h.kind === 'laser') R.lasers++;
    if (R.tutorial && R.tutorial.hz === h) R.tutorial.result = tier;
    if (tier === 'perfect') this.perfect(h); else this.dodge(h);
  },

  perfect(h) {
    const R = G.run, P = G.player;
    const scoring = G.state === 'play' && !R.tutorial;
    R.perfects++;
    R.chain = G.timeR - R.lastPerfectR < 2.6 ? R.chain + 1 : 0;
    R.lastPerfectR = G.timeR;
    this.addCombo(2);
    const pts = Math.round(100 * R.mult * R.scoreMul);
    if (scoring) R.score += pts;
    P.invulnP = Math.max(P.invulnP, G.timeP + 0.28 + (R.perk === 'chrono' ? 0.08 : 0));
    G.hitstop = Math.max(G.hitstop, 0.065);
    startSlow((R.perk === 'chrono' ? 1.0 : 0.75) * (1 + 0.35 * (R.up.deep || 0)));
    this.chargeBurst(0.25);
    Boss.spark(P.x, P.y, 6);
    if (R.up.shrapnel) this.shrapnel(2 + 4 * R.up.shrapnel);
    const skin = SKINS[R.skin];
    FX.flash(0.2, [1, 1, 1]);
    FX.ca = Math.min(1.5, FX.ca + 1.1);
    FX.wave(P.x, P.y, 0.035, 1.25);
    FX.shake(0.26);
    FX.ring(P.x, P.y, 8, 130, 0.55, '#ffffff', 4);
    FX.ring(P.x, P.y, 4, 86, 0.5, skin.glow, 3);
    FX.burst(P.x, P.y, 26, '#ffffff', 120, 440, 0.5, 3);
    FX.burst(P.x, P.y, 14, skin.glow, 80, 300, 0.6, 3.5);
    Grid.impulse(P.x, P.y, 230, 520);
    FX.pop('PERFECT', P.x, Math.max(G.top + 10, P.y - 36), { size: 22, big: true, life: 1.0 });
    if (scoring) FX.pop('+' + fmtNum(pts), P.x, Math.max(G.top + 30, P.y - 14), { size: 12, color: PAL.loot, life: 0.8 });
    if (!G.attract) { Sfx.perfect(R.chain); vibrate(14); }
    for (const o of G.hazards) {
      if (o.dead) continue;
      if (o.kind === 'bullet' && Math.hypot(o.x - P.x, o.y - P.y) < 95) {
        o.dead = true;
        this.spawnShard(o.x, o.y, { home: true, delay: 0.15 });
        FX.burst(o.x, o.y, 5, PAL.loot, 40, 140, 0.35, 2);
      } else if (o.kind === 'seeker' && !o.exploded && !o.killed && Math.hypot(o.x - P.x, o.y - P.y) < 95) o.kill();
    }
    const n = 1 + (G.lrng.chance(0.5) ? 1 : 0) + (G.lrng.chance(0.15) ? 1 : 0);
    for (let i = 0; i < n; i++) this.spawnShard(P.x, P.y, { burst: true, home: true });
    if (scoring && G.capsules.length === 0 && G.lrng.chance(0.07)) this.spawnCapsule(true);
  },

  dodge(h) {
    const R = G.run, P = G.player;
    R.dodges++;
    this.addCombo(1);
    this.chargeBurst(0.06);
    Boss.spark(P.x, P.y, 2);
    const pts = Math.round(25 * R.mult * R.scoreMul);
    if (G.state === 'play' && !R.tutorial) R.score += pts;
    P.invulnP = Math.max(P.invulnP, G.timeP + 0.08);
    FX.pop('DODGE', P.x, Math.max(G.top + 10, P.y - 28), { size: 12, color: '#cfd6ff', life: 0.6 });
    FX.burst(P.x, P.y, 8, '#ffffff', 80, 220, 0.35, 2);
    if (!G.attract) Sfx.dodge();
  },

  graze(h) {
    const R = G.run, P = G.player;
    if (!R) return;
    R.grazes++;
    R.grazeStreak = G.timeR - R.lastGrazeR < 1.2 ? R.grazeStreak + 1 : 0;
    R.lastGrazeR = G.timeR;
    if (R.combo > 0) R.comboT = Math.min(R.comboWindow, R.comboT + 0.6);
    this.chargeBurst(0.012 * (1 + 1.5 * (R.up.grazer || 0)));
    if (G.state === 'play' && !R.tutorial) R.score += Math.round(5 * R.mult * R.scoreMul);
    const hx = h.x !== undefined ? h.x : P.x, hy = h.y !== undefined ? h.y : P.y;
    const a = Math.atan2(hy - P.y, hx - P.x);
    FX.burst(P.x + Math.cos(a) * 12, P.y + Math.sin(a) * 12, 4, PAL.loot, 60, 180, 0.3, 2);
    FX.pop('graze', P.x + 18, P.y - 12, { size: 9, color: PAL.loot, life: 0.5, vy: -24 });
    if (!G.attract) Sfx.graze(R.grazeStreak);
  },

  addCombo(n) {
    const R = G.run;
    R.combo += n;
    R.comboT = R.comboWindow;
    this.setMult();
  },

  setMult() {
    const R = G.run, P = G.player;
    const m = Math.min(R.maxMultCap, 1 + Math.floor(R.combo / 4));
    if (m > R.mult && !G.attract) {
      FX.pop('×' + m, P.x, Math.min(G.H - 20, P.y + 32), { size: 16, color: PAL.core, life: 0.9, vy: 18 });
      Sfx.mult(m);
      UI.bumpMult();
    }
    R.mult = m;
    R.maxMult = Math.max(R.maxMult, m);
  },

  breakShield(h) {
    const P = G.player;
    P.shield = false;
    P.invulnP = G.timeP + 1.0;
    if (h.kind === 'boss' || (h.kind === 'seeker' && !h.exploded)) h.harmlessUntil = G.timeW + 1; else h.harmless = true;
    FX.ring(P.x, P.y, 14, 90, 0.5, PAL.core, 4);
    FX.burst(P.x, P.y, 22, PAL.core, 80, 320, 0.5, 3);
    FX.flash(0.25, [0.3, 0.95, 1]);
    FX.shake(0.4);
    FX.pop('SHIELD', P.x, Math.max(G.top + 10, P.y - 30), { size: 13, color: PAL.core });
    if (G.run && G.run.beginner) { G.run.beginner = false; UI.hint('Shield gone. The next hit ends the run.', null, 2.2); }
    if (!G.attract) { Sfx.shieldBreak(); vibrate(30); }
  },

  tutorialHit(h) {
    const P = G.player, T = G.run.tutorial;
    if (h.kind === 'seeker' && !h.exploded) h.harmlessUntil = G.timeW + 1; else h.harmless = true;
    P.invulnP = G.timeP + 0.6;
    FX.flash(0.2, [1, 0.2, 0.4]);
    FX.shake(0.3);
    FX.burst(P.x, P.y, 12, G.col.danger, 60, 220, 0.4, 2.5);
    Sfx.shieldBreak();
    if (T.hz === h) T.result = 'hit';
  },

  die(h) {
    const P = G.player, R = G.run;
    if (!P.alive) return;
    if (R && R.up && R.up.second && !R.secondUsed && !G.attract) {
      R.secondUsed = true;
      if (h && h.kind) {
        if (h.kind === 'boss' || (h.kind === 'seeker' && !h.exploded)) h.harmlessUntil = G.timeW + 1.2; else h.harmless = true;
      }
      P.invulnP = G.timeP + 1.3;
      startSlow(1.0);
      FX.flash(0.4, [1, 0.85, 0.4]);
      FX.ring(P.x, P.y, 10, 120, 0.6, PAL.loot, 4);
      FX.pop('SECOND CHANCE', P.x, Math.max(G.top + 10, P.y - 34), { size: 15, big: true, color: PAL.loot });
      Sfx.shieldBreak();
      UI.toast('Second Chance used', 'mission');
      return;
    }
    P.alive = false;
    P.dash = null;
    G.hitstop = 0.14;
    G.slow = null;
    const skin = SKINS[R.skin];
    FX.burst(P.x, P.y, 34, skin.glow, 100, 520, 0.9, 3.5);
    FX.burst(P.x, P.y, 20, '#ffffff', 60, 380, 0.7, 2.5);
    for (let i = 0; i < 12; i++) FX.part({ type: 'square', x: P.x, y: P.y, vx: rnd(-300, 300), vy: rnd(-300, 300), life: rnd(0.8, 1.4), size: rnd(3, 6), color: skin.glow, drag: 2, vr: rnd(-10, 10) });
    FX.ring(P.x, P.y, 6, 180, 0.8, G.col.danger, 5);
    Grid.impulse(P.x, P.y, 320, 900);
    if (G.attract) { G.respawnAt = G.timeR + 1.2; return; }
