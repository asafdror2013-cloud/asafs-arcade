    G.state = 'dying';
    G.deathT = G.timeR;
    FX.flash(0.45, [1, 0.18, 0.4]);
    FX.ca = 2;
    FX.shake(0.9);
    FX.wave(P.x, P.y, 0.06, 1.0);
    Sfx.death();
    vibrate([40, 30, 90]);
    Sound.musicFilter(200, 0.25);
    UI.onDeath();
  },

  end() {
    const R = G.run, S = Save.data;
    G.state = 'over';
    Music.stop();
    Music.boss = false;
    UI.bossBar(null);
    UI.burstReady(false);
    if (Sound.ac && Sound.musicBus) Sound.musicBus.gain.setTargetAtTime(0, Sound.ac.currentTime, 0.35);
    R.score = Math.floor(R.score);
    this.checkMissions(true);
    const scoreShards = Math.floor(R.score / 150);
    const earned = R.shards + scoreShards + R.missionShards + R.bonusShards;
    const before = S.shardsTotal;
    S.shardsTotal += earned;
    const fresh = applyUnlocks();
    let prevBest = 0;
    if (R.mode === 'hyper') prevBest = S.hyperBest;
    else if (R.mode === 'daily') prevBest = S.daily.date === R.today ? S.daily.best : 0;
    else prevBest = S.best.score;
    const isBest = R.score > prevBest && R.score > 0;
    if (R.mode === 'normal') {
      S.best.score = Math.max(S.best.score, R.score);
      S.best.time = Math.max(S.best.time, Math.round(R.time * 10) / 10);
      S.best.phase = Math.max(S.best.phase, R.phase);
      S.best.mult = Math.max(S.best.mult, R.maxMult);
      S.best.perfects = Math.max(S.best.perfects, R.perfects);
    }
    if (R.mode === 'hyper') S.hyperBest = Math.max(S.hyperBest, R.score);
    let streakUp = false;
    if (R.mode === 'daily') {
      if (S.daily.date !== R.today) { S.daily.date = R.today; S.daily.best = 0; S.daily.runs = 0; }
      S.daily.best = Math.max(S.daily.best, R.score);
      S.daily.runs++;
      const last = S.daily.lastPlayed;
      if (last !== R.today) {
        S.daily.streak = last && dayDiff(last, R.today) === 1 ? S.daily.streak + 1 : 1;
        S.daily.lastPlayed = R.today;
        streakUp = true;
      }
    }
    S.top.push({ score: R.score, time: Math.round(R.time * 10) / 10, date: R.today, perfects: R.perfects, mode: R.mode, phase: R.phase });
    S.top.sort((a, b) => b.score - a.score);
    S.top = S.top.slice(0, 5);
    const st = S.stats;
    st.runs++; st.time += R.time; st.perfects += R.perfects; st.dodges += R.dodges; st.grazes += R.grazes; st.capsules += R.capsules; st.shards += R.shards;
    st.bosses = (st.bosses || 0) + R.bosses; st.bursts = (st.bursts || 0) + R.bursts;
    const progressed = [];
    S.missions = S.missions.map((m) => {
      if (m.done) { S.mlevels[m.type] = (S.mlevels[m.type] || 0) + 1; return null; }
      const def = MISSIONS[m.type];
      const before = m.progress;
      if (def.total) m.progress += R[def.stat] || 0;
      else if (!def.special) m.progress = Math.max(m.progress, R[def.stat] || 0);
      if (m.progress > before) progressed.push(m);
      return m;
    }).filter(Boolean);
    ensureMissions();
    if (R.mode === 'normal') S.seen.tutorial = true;
    Save.persist();
    UI.showOver({ R, earned, scoreShards, before, after: S.shardsTotal, fresh, isBest, prevBest, done: R.missionsDone.slice(), streakUp });
  },

  checkMissions(final) {
    const R = G.run;
    if (!R || G.attract) return;
    for (const m of Save.data.missions) {
      if (m.done) continue;
      const def = MISSIONS[m.type];
      if (def.special && !final) continue;
      if (missionValue(m, R) >= m.target) {
        m.done = true;
        R.missionShards += m.reward;
        R.missionsDone.push(m);
        if (!final) {
          UI.toast('Mission complete · +' + m.reward, 'mission');
          Sfx.mission();
        }
      }
    }
  },

  onPhase(ph) {
    const R = G.run;
    if (!R) return;
    R.phase = ph;
    if (G.attract) return;
    Music.level = Math.min(6, ph);
    if (G.boss && !G.boss.dead) G.boss.retreat();
    if (ph > 1 && G.state === 'play' && !R.tutorial) {
      const bonus = Math.round(250 * (ph - 1) * R.scoreMul);
      R.score += bonus;
      UI.toast('Phase bonus · +' + fmtNum(bonus), 'phase');
    }
    Grid.impulse(G.W / 2, (G.top + G.H) / 2, Math.max(G.W, G.H), 380);
    const announce = () => {
      if (ph % 5 === 0) Boss.start(ph);
      else {
        UI.banner('Phase ' + ph, PHASE_NEWS[ph] || (ph > 6 ? 'Faster. Denser.' : ''));
        Sfx.phase();
      }
    };
    if (ph > 1 && G.state === 'play' && !R.tutorial) this.offerPick(announce);
    else announce();
  },

  // ---- Burst: the counter-attack your PERFECT dodges charge
  chargeBurst(a) {
    const R = G.run;
    if (!R || G.attract || R.tutorial || G.state !== 'play') return;
    const was = R.burst;
    R.burst = Math.min(1, R.burst + a * (1 + 0.4 * (R.up.capacitor || 0)));
    if (was < 1 && R.burst >= 1) {
      Sfx.ready();
      UI.burstReady(true);
      if (!Save.data.seen.burst) {
        Save.data.seen.burst = true;
        UI.hint(isTouchDevice ? 'Burst is charged. Tap BURST to wipe the screen.' : 'Burst is charged. Press E to wipe the screen.', null, 3);
      }
    }
  },

  burst() {
    const R = G.run, P = G.player;
    if (!R || G.state !== 'play' || !P.alive || R.burst < 1 || R.tutorial) return false;
    R.burst = 0;
    R.bursts++;
    UI.burstReady(false);
    R.surge = G.timeP + 6;
    P.invulnP = Math.max(P.invulnP, G.timeP + 0.5);
    G.hitstop = Math.max(G.hitstop, 0.09);
    for (const h of G.hazards) {
      if (h.dead || h.kind === 'boss') continue;
      if (h.kind === 'bullet') this.spawnShard(h.x, h.y, { home: true, delay: 0.2 });
      else if (h.kind === 'seeker' && !h.killed && !h.exploded) { h.kill(); continue; }
      if (h.x !== undefined) FX.burst(h.x, h.y, 6, G.col.danger, 60, 220, 0.4, 2);
      h.dead = true;
    }
    if (G.boss && !G.boss.dead) G.boss.damage(22);
    const skin = SKINS[R.skin];
    FX.flash(0.5, [0.75, 1, 1]);
    FX.ca = 2;
    FX.shake(0.7);
    FX.wave(P.x, P.y, 0.09, 1.5);
    FX.ring(P.x, P.y, 10, 700, 1.0, '#ffffff', 9);
    FX.ring(P.x, P.y, 6, 480, 0.8, skin.glow, 6);
    FX.burst(P.x, P.y, 40, skin.glow, 200, 700, 0.8, 4);
    Grid.impulse(P.x, P.y, 800, 1100);
    FX.pop('BURST', P.x, Math.max(G.top + 10, P.y - 36), { size: 24, big: true, color: '#ffffff' });
    UI.toast('Double score for 6 seconds', 'phase');
    Sfx.burst();
    vibrate(40);
    return true;
  },

  // ---- upgrade picks
  offerPick(cb) {
    const R = G.run;
    if (!R || G.state !== 'play' || !G.player.alive) { if (cb) cb(); return; }
    const cards = this.rollCards(3);
    if (!cards.length) { if (cb) cb(); return; }
    G.state = 'pick';
    G.pickCb = cb;
    G.buffer = null;
    Sound.musicFilter(700, 0.15);
    Sfx.pick();
    UI.showPick(cards);
  },

  rollCards(n) {
    const R = G.run, out = [];
    const pool = Object.keys(UPGRADES).filter((k) => (R.up[k] || 0) < UPGRADES[k].max);
    for (let i = 0; i < n && pool.length; i++) {
      const k = G.lrng.weighted(pool, (q) => UPGRADES[q].w);
      out.push(k);
      pool.splice(pool.indexOf(k), 1);
    }
    return out;
  },

  choose(k) {
    if (G.state !== 'pick') return;
    this.applyUpgrade(k);
    G.state = 'play';
    G.lpTarget = 0;
    Sound.musicFilter(18000, 0.1);
    G.player.invulnP = Math.max(G.player.invulnP, G.timeP + 0.6);
    UI.hidePick();
    const cb = G.pickCb;
    G.pickCb = null;
    if (cb) cb();
  },

  applyUpgrade(k) {
    const R = G.run, P = G.player, u = UPGRADES[k];
    R.up[k] = (R.up[k] || 0) + 1;
    R.upList.push(k);
    if (k === 'twin') { P.maxCharges += 1; P.charges = Math.min(P.maxCharges, P.charges + 1); }
    if (k === 'combolock') R.comboWindow += 1.2;
    if (k === 'aegis') {
      if (P.shield) for (let i = 0; i < 12; i++) this.spawnShard(P.x, P.y, { burst: true, home: true, delay: 0.35 });
      P.shield = true;
    }
    FX.pop(u.name.toUpperCase(), P.x, Math.max(G.top + 10, P.y - 34), { size: 14, big: true, color: u.rarity === 'epic' ? PAL.loot : PAL.core });
    FX.ring(P.x, P.y, 6, 70, 0.5, u.rarity === 'epic' ? PAL.loot : PAL.core, 3);
    Sfx.reveal(u.rarity === 'epic' ? 'legendary' : u.rarity);
  },

  afterglow() {
    const P = G.player;
    for (const o of G.hazards) {
      if (o.dead || o.kind !== 'bullet') continue;
      if (Math.hypot(o.x - P.x, o.y - P.y) < 18) {
        o.dead = true;
        this.spawnShard(o.x, o.y, { home: true, delay: 0.2 });
        FX.burst(o.x, o.y, 4, PAL.core, 40, 140, 0.3, 2);
      }
    }
  },

  shrapnel(n) {
    const P = G.player;
    const targets = G.hazards.filter((o) => !o.dead && (o.kind === 'bullet' || (o.kind === 'seeker' && !o.exploded && !o.killed)) && Math.hypot(o.x - P.x, o.y - P.y) < 230).slice(0, n);
    for (const o of targets) {
      FX.part({ type: 'spark', x: P.x, y: P.y, vx: (o.x - P.x) * 6, vy: (o.y - P.y) * 6, life: 0.18, size: 3, color: PAL.core });
      if (o.kind === 'bullet') { o.dead = true; this.spawnShard(o.x, o.y, { home: true, delay: 0.2 }); }
      else o.kill();
    }
  },

  onHazardFire(h) {
    const quiet = G.attract;
    switch (h.kind) {
      case 'laser': {
        if (!quiet) Sfx.laser();
        FX.shake(0.05);
        Grid.lineImpulse(h.x, h.y, h.ux, h.uy, 80, 300);
        const [x1, y1, x2, y2] = h.seg;
        for (let i = 0; i < 6; i++) {
          const k = Math.random(), s = rnd(60, 200) * (Math.random() < 0.5 ? -1 : 1);
          FX.part({ type: 'spark', x: lerp(x1, x2, k), y: lerp(y1, y2, k), vx: -h.uy * s, vy: h.ux * s, life: 0.35, size: 2.5, color: G.col.danger });
        }
        break;
      }
      case 'ring':
        if (!quiet) Sfx.ring();
        Grid.impulse(h.x, h.y, 140, 340);
        FX.ring(h.x, h.y, 4, 46, 0.3, G.col.danger, 3);
        break;
      case 'bomb':
      case 'seeker':
        if (!quiet) Sfx.bomb();
        FX.shake(0.12);
        Grid.impulse(h.x, h.y, h.R * 2.4, 560);
        FX.burst(h.x, h.y, 16, G.col.danger, 100, 360, 0.5, 3);
        break;
      case 'sweeper':
        if (!quiet) Sfx.sweep();
        break;
      case 'wall':
        Grid.impulse(G.W / 2, G.H / 2, 60, 0);
        break;
    }
  },

  // ---- pickups
  spawnShard(x, y, o) {
    o = o || {};
    if (G.shards.length > 110) return;
    const a = Math.random() * TAU, sp = o.burst ? rnd(130, 280) : 0;
    G.shards.push({
      x, y, vx: Math.cos(a) * sp + (o.vx || 0), vy: Math.sin(a) * sp + (o.vy || 0),
      born: G.timeW, bornR: G.timeR, life: o.life || 9, home: !!o.home, delay: o.delay === undefined ? 0.3 : o.delay,
      frame: Math.random() * 12, dead: false, fall: !!o.fall,
    });
  },

  spawnShardCluster() {
    const r = G.rng, P = G.player;
    const a = r.range(0, TAU), d = r.range(110, 220), n = r.int(3, 6), spread = r.range(0.4, 1);
    const cx = clamp(P.x + Math.cos(a) * d, 40, G.W - 40), cy = clamp(P.y + Math.sin(a) * d, G.top + 20, G.H - 40);
    const ang = r.range(0, TAU);
    for (let i = 0; i < n; i++) {
      const k = (i - (n - 1) / 2) * 22 * spread;
      this.spawnShard(clamp(cx + Math.cos(ang) * k, 20, G.W - 20), clamp(cy + Math.sin(ang) * k, G.top + 10, G.H - 20), { life: Director.beatLen * 18 });
    }
  },

  spawnCapsule(near) {
    const r = near ? G.lrng : G.rng, P = G.player;
    // draw every candidate first so the schedule RNG advances the same way for everyone
    const cand = [];
    for (let i = 0; i < 8; i++) cand.push([r.range(0, TAU), near ? r.range(70, 120) : r.range(120, 250)]);
    if (G.capsules.length >= 1) return;
    let best = null, bestS = -1e9;
    for (const [a, d] of cand) {
      const x = clamp(P.x + Math.cos(a) * d, 40, G.W - 40), y = clamp(P.y + Math.sin(a) * d, G.top + 24, G.H - 44);
      let s = -Math.abs(d - 170) * 0.002;
      for (const h of G.hazards) if (!h.dead && h.x !== undefined && Math.hypot(h.x - x, h.y - y) < 90) s -= 1;
      if (s > bestS) { bestS = s; best = { x, y }; }
    }
    G.capsules.push({ x: best.x, y: best.y, born: G.timeW, life: Director.beatLen * 14, dead: false });
    if (!G.attract && !Save.data.seen.capsule && G.state === 'play') {
      Save.data.seen.capsule = true;
      UI.hint('Grab the capsule for a random power-up.', null, 2.6);
    }
  },

  updatePickups(hW, hP) {
    const P = G.player, R = G.run;
    const magnet = !!(R && R.fx.magnet > G.timeP);
    let magR = magnet ? 240 : R && R.perk === 'magnet' ? 100 : 0;
    if (R && R.up && R.up.magnetism) magR = Math.max(magR, 40 + 90 * R.up.magnetism);
    const collecting = P.alive && (G.state === 'play' || G.state === 'title');
    for (const s of G.shards) {
      if (s.dead) continue;
      const dx = P.x - s.x, dy = P.y - s.y, d = Math.hypot(dx, dy) || 1;
      const pull = collecting && ((s.home && G.timeR - s.bornR > s.delay) || d < magR);
      if (pull) {
        s.vx += (dx / d) * 2600 * hP;
        s.vy += (dy / d) * 2600 * hP;
        const sp = Math.hypot(s.vx, s.vy);
        if (sp > 820) { s.vx *= 820 / sp; s.vy *= 820 / sp; }
        s.x += s.vx * hP; s.y += s.vy * hP;
      } else {
        const k = Math.exp(-(s.fall ? 0.2 : 3.2) * hW);
        s.vx *= k; s.vy *= k;
        s.x += s.vx * hW; s.y += s.vy * hW;
        if (s.fall && s.y > G.H + 20) s.dead = true;
      }
      if (collecting && d < P.r + 15) this.collectShard(s);
      else if (!pull && G.timeW - s.born > s.life) s.dead = true;
    }
    for (const c of G.capsules) {
      if (c.dead) continue;
      if (collecting && Math.hypot(P.x - c.x, P.y - c.y) < P.r + 22) this.openCapsule(c);
      else if (G.timeW - c.born > c.life) { c.dead = true; FX.burst(c.x, c.y, 10, PAL.power, 30, 120, 0.4, 2); }
    }
  },

  collectShard(s) {
    s.dead = true;
    FX.burst(s.x, s.y, 5, PAL.loot, 40, 150, 0.35, 2);
    const R = G.run;
    if (!R || G.attract) return;
    R.shards += R.up && R.up.goldrush ? 2 : 1;
    R.shardStreak = G.timeR - R.lastShardR < 0.9 ? R.shardStreak + 1 : 0;
    R.lastShardR = G.timeR;
    if (!R.tutorial) R.score += Math.round(10 * R.scoreMul);
    Sfx.shard(R.shardStreak);
    UI.bumpShards();
  },

  openCapsule(c) {
    c.dead = true;
    FX.burst(c.x, c.y, 18, PAL.power, 60, 260, 0.5, 3);
    FX.ring(c.x, c.y, 6, 64, 0.45, PAL.power, 3);
    const R = G.run;
    if (G.attract) return;
    R.capsules++;
    const keys = Object.keys(POWERS).filter((k) => !(k === 'shield' && R.mut && R.mut.noShield));
    const kind = G.lrng.weighted(keys, (k) => POWERS[k].w * (k === 'shield' && G.player.shield ? 0.3 : 1));
    G.pendingPower = { kind, at: G.timeR + 0.8 };
    UI.roulette(kind);
  },

  applyPower(kind) {
    const R = G.run, P = G.player;
    if (!R || !P.alive) return;
    const pw = POWERS[kind];
    switch (kind) {
      case 'shield':
        if (P.shield) { for (let i = 0; i < 12; i++) this.spawnShard(P.x, P.y, { burst: true, home: true, delay: 0.35 }); }
        P.shield = true;
        FX.ring(P.x, P.y, 30, 10, 0.4, PAL.core, 3);
        break;
      case 'overclock': R.fx.overclock = G.timeP + pw.dur; break;
      case 'magnet': R.fx.magnet = G.timeP + pw.dur; break;
      case 'timewarp': R.fx.timewarp = G.timeP + pw.dur; break;
      case 'storm':
        R.fx.storm = G.timeP + pw.dur;
        FX.flash(0.25, [1, 0.85, 0.4]);
        break;
      case 'jackpot': {
        const n = 25 + G.lrng.int(0, 25);
        for (let i = 0; i < n; i++) this.spawnShard(P.x, P.y, { burst: true, home: true, delay: rnd(0.3, 0.6) });
        FX.flash(0.2, [1, 0.8, 0.3]);
        break;
      }
      case 'nova': this.nova(); break;
    }
    FX.pop(pw.name.toUpperCase(), P.x, Math.max(G.top + 10, P.y - 34), { size: 14, color: pw.rarity === 'legendary' ? PAL.loot : PAL.power, big: true });
  },

  nova() {
    const P = G.player;
    for (const h of G.hazards) {
      if (h.dead) continue;
      if (h.kind === 'bullet') this.spawnShard(h.x, h.y, { home: true, delay: 0.25 });
      if (h.kind === 'seeker' && !h.killed && !h.exploded) { h.kill(); continue; }
      if (h.x !== undefined) FX.burst(h.x, h.y, 6, G.col.danger, 60, 200, 0.4, 2);
      h.dead = true;
    }
    FX.flash(0.55, [1, 0.6, 0.85]);
    FX.shake(0.7);
    FX.wave(P.x, P.y, 0.08, 1.4);
    FX.ring(P.x, P.y, 10, 620, 0.9, '#ffffff', 8);
    Grid.impulse(P.x, P.y, 640, 950);
    Sfx.nova();
    vibrate(40);
  },

  // ---- first run: three guided beats, then the real thing
  tutorial() {
    const R = G.run, T = R.tutorial, P = G.player, bl = Director.beatLen;
    const nextBeat = (Math.floor(G.timeW / bl) + 1) * bl;
    const pad = isTouchDevice ? 'Swipe anywhere to dash. Tap to blink in place.' : 'Arrow keys or WASD to dash, Space to blink. Or click where you want to go.';
    if (T.step === 0) {
      if (!T.shown) { T.shown = true; UI.hint(pad, 'swipe'); }
      if (R.dashes >= 1 && !T.wait) T.wait = G.timeR + 0.8;
      if (T.wait && G.timeR > T.wait) { T.step = 1; T.shown = false; T.wait = 0; }
      return;
    }
    if (T.step === 1) {
      if (T.retryAt && G.timeR < T.retryAt) return;
      if (!T.hz || T.hz.dead || T.retryAt) {
        T.retryAt = 0;
        let o = { x: G.W / 2, y: G.top - 30 };
        if (Math.hypot(P.x - o.x, P.y - o.y) < 220) o = { x: G.W / 2, y: G.H + 30 };
        const d = Math.hypot(P.x - o.x, P.y - o.y);
        T.hz = new Ring({ born: G.timeW, fireW: nextBeat + bl, x: o.x, y: o.y, speed: clamp(d / (bl * 4), 110, 210), th: 13 });
        G.hazards.push(T.hz);
        T.result = null;
        UI.hint('You are invincible while dashing. Dash through the ring as it reaches you.', 'ring');
      }
      if (T.result === 'perfect' || T.result === 'dodge') {
        T.step = 2; T.hz = null; T.result = null; T.tries = 0;
        T.retryAt = G.timeR + 1.1;
        UI.hint('Nice. That is the whole trick.', null, 1.1);
      } else if (T.result === 'hit') {
        T.tries++; T.result = null;
        T.retryAt = G.timeR + 1.2;
        UI.hint('Dash just as the ring touches you.', 'ring');
        if (T.tries >= 3) { T.step = 2; T.tries = 0; T.hz = null; }
      }
      return;
    }
    if (T.step === 2) {
      if (T.retryAt && G.timeR < T.retryAt) return;
      if (!T.hz || T.retryAt) {
        T.retryAt = 0;
        T.hz = new Bomb({ born: G.timeW, fireW: nextBeat + bl * 3, x: P.x, y: P.y, R: 68 });
        G.hazards.push(T.hz);
        T.result = null;
        UI.hint('Stay inside. When the circle closes, dash at the last instant.', 'bomb');
      }
      if (!T.result && G.timeW > T.hz.fireW + 0.2 && !T.hz.creditedBy) T.result = 'early';
      const r = T.result;
      if (r === 'perfect') {
        T.step = 3; T.hz = null;
        UI.hint('PERFECT. Time slows, your multiplier climbs, nearby bullets turn into shards.', null, 2.6);
        T.doneAt = G.timeR + 2.7;
      } else if (r) {
        T.tries++; T.result = null; T.hz = null;
        T.retryAt = G.timeR + 1.1;
        const msg = r === 'dodge' ? 'Close. Wait a little longer before you dash.' : r === 'early' ? 'Too early. Stay in the circle until it closes.' : 'Too late. Dash just before it explodes.';
        UI.hint(msg, 'bomb');
        if (T.tries >= 4) { T.step = 3; T.doneAt = G.timeR + 1.2; UI.hint('You will get it. Every attack lands on the beat.', null, 2); }
      }
      return;
    }
    if (T.step === 3 && G.timeR > T.doneAt) {
      R.tutorial = null;
      Save.data.seen.tutorial = true;
      Save.persist();
      Director.beginAt(Math.floor(G.timeW / bl) + 2);
      R.time = 0; R.score = 0; R.combo = 0; R.mult = 1; R.maxMult = 1;
      R.perfects = 0; R.dodges = 0; R.grazes = 0; R.rings = 0; R.lasers = 0;
      R.bonusShards += 15;
      UI.hint('Every attack lands on the beat. Survive.', null, 2.2);
      UI.toast('Tutorial complete · +15 shards', 'mission');
    }
  },

  // ---- attract mode: a ghost pilot that dodges at the last instant
  ai() {
    const P = G.player, t = G.timeW;
    if (P.dash) return;
    let threat = false;
    for (const h of G.hazards) {
      if (h.dead || h.kind === 'turret' || !h.canHurt(t)) continue;
      if (h.hitsAt(P.x, P.y, P.hr + 2, t + 0.035) || h.hitsAt(P.x, P.y, P.hr + 2, t + 0.07)) { threat = true; break; }
    }
    if (threat && P.charges > 0) {
      let best = 0, bestS = -1e9;
      const off = Math.random() * 0.5;
      for (let i = 0; i < 8; i++) {
        const a = off + (i * TAU) / 8;
        const tx = clamp(P.x + Math.cos(a) * 112, 30, G.W - 30), ty = clamp(P.y + Math.sin(a) * 112, G.top + 10, G.H - 30);
        let s = -Math.hypot(tx - G.W / 2, ty - (G.attract && G.focusY ? G.focusY : (G.top + G.H) / 2)) * (G.attract ? 0.012 : 0.004);
        for (const h of G.hazards) {
          if (h.dead || h.kind === 'turret') continue;
          for (const dt of [0.15, 0.3, 0.5]) if (h.hitsAt(tx, ty, P.hr + 10, t + dt)) s -= 3;
        }
        if (s > bestS) { bestS = s; best = a; }
      }
      this.tryDash(Math.cos(best), Math.sin(best), false);
      G.aiNext = G.timeR + rnd(0.5, 1.2);
    } else if (G.timeR > G.aiNext && P.charges > 0) {
      G.aiNext = G.timeR + rnd(1.0, 2.2);
      const tgt = G.capsules[0] || G.shards[Math.floor(Math.random() * Math.max(1, G.shards.length))];
      const cx = G.W / 2, cy = G.attract && G.focusY ? G.focusY : (G.top + G.H) / 2;
      let dx, dy;
      if (tgt && Math.hypot(tgt.x - P.x, tgt.y - P.y) < 300) { dx = tgt.x - P.x; dy = tgt.y - P.y; }
      else if (Math.hypot(cx - P.x, cy - P.y) > 120) { dx = cx - P.x; dy = cy - P.y; }
      else { const a = Math.random() * TAU; dx = Math.cos(a); dy = Math.sin(a); }
      for (const h of G.hazards) {
        if (h.dead || h.kind === 'turret') continue;
        const l = Math.hypot(dx, dy) || 1;
        const tx = P.x + (dx / l) * 112, ty = P.y + (dy / l) * 112;
        if (h.hitsAt(tx, ty, P.hr + 12, t + 0.3)) return;
      }
      this.tryDash(dx, dy, false);
    }
  },
};

// ---------------------------------------------------------------- render.js
const Assets = { shard: null, capsule: null };

const Render = {
  ctx: null, canvas: null, glows: new Map(),

  init(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d', { alpha: false });
  },

  glowSprite(ctx, color, x, y, size, alpha) {
    let c = this.glows.get(color);
    if (!c) {
      c = document.createElement('canvas');
      c.width = c.height = 64;
      const g = c.getContext('2d');
      const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
      gr.addColorStop(0, rgba(color, 1));
      gr.addColorStop(0.22, rgba(color, 0.55));
      gr.addColorStop(0.55, rgba(color, 0.14));
      gr.addColorStop(1, rgba(color, 0));
      g.fillStyle = gr;
      g.fillRect(0, 0, 64, 64);
      this.glows.set(color, c);
    }
    const op = ctx.globalCompositeOperation, a = ctx.globalAlpha;
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = a * alpha;
    ctx.drawImage(c, x - size / 2, y - size / 2, size, size);
    ctx.globalAlpha = a;
    ctx.globalCompositeOperation = op;
  },

  draw() {
    const ctx = this.ctx, cv = this.canvas;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = PAL.ink;
    ctx.fillRect(0, 0, cv.width, cv.height);
    const [sx, sy] = FX.shakeOffset(G.timeR);
    ctx.setTransform(G.s, 0, 0, G.s, G.offX + sx * G.s, G.offY + sy * G.s);
    this.background(ctx);
    this.grid(ctx);
    const t = G.timeW;
    for (const h of G.hazards) h.draw(ctx, 0, t);
    this.pickups(ctx);
    for (const h of G.hazards) h.draw(ctx, 1, t);
    if (G.player) this.player(ctx);
    this.particles(ctx);
    Boss.draw(ctx);
    this.popups(ctx);
  },

  background(ctx) {
    const cx = G.W / 2, cy = (G.top + G.H) / 2;
    const r = Math.max(G.W, G.H) * 0.75;
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
    g.addColorStop(0, rgba(G.gridCol, 0.16 + 0.08 * G.slowAmt));
    g.addColorStop(1, rgba(G.gridCol, 0));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, G.W, G.H);
  },

  grid(ctx) {
    const g = Grid;
    if (!g.x) return;
    const bl = Director.beatLen;
    const since = (G.timeW % bl) / Math.max(G.ws, 0.25);
    const live = G.state === 'play' || G.state === 'title' ? 1 : 0.35;
    const pulse = Math.exp(-since * 7) * live;
    ctx.strokeStyle = G.gridCol;
    ctx.lineWidth = 1.1;
    ctx.globalAlpha = 0.4 + 0.24 * pulse;
    ctx.beginPath();
    for (let j = 0; j < g.ny; j++) {
      for (let i = 0; i < g.nx; i++) {
        const k = j * g.nx + i;
        if (i === 0) ctx.moveTo(g.x[k], g.y[k]); else ctx.lineTo(g.x[k], g.y[k]);
      }
    }
    for (let i = 0; i < g.nx; i++) {
      for (let j = 0; j < g.ny; j++) {
        const k = j * g.nx + i;
        if (j === 0) ctx.moveTo(g.x[k], g.y[k]); else ctx.lineTo(g.x[k], g.y[k]);
      }
    }
    ctx.stroke();
    // energy: displaced vertices light up
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = mixHex(G.gridCol, '#ffffff', 0.55);
    for (let k = 0; k < g.x.length; k++) {
      const d = Math.abs(g.x[k] - g.ox[k]) + Math.abs(g.y[k] - g.oy[k]);
      if (d < 2.5) continue;
      ctx.globalAlpha = Math.min(0.9, d / 22);
      const s = Math.min(4, 1.2 + d / 10);
      ctx.fillRect(g.x[k] - s / 2, g.y[k] - s / 2, s, s);
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
  },

  pickups(ctx) {
    const sh = Assets.shard, cap = Assets.capsule;
    for (const s of G.shards) {
      const age = G.timeW - s.born;
      const fade = !s.home && !s.fall && age > s.life - 2 ? (Math.sin(G.timeR * 22) > 0 ? 1 : 0.35) : 1;
      this.glowSprite(ctx, PAL.loot, s.x, s.y, 34, 0.5 * fade);
      if (sh) {
        const f = Math.floor(G.timeR * 18 + s.frame) % 12;
        ctx.globalAlpha = fade;
        ctx.drawImage(sh, f * 64, 0, 64, 64, s.x - 11, s.y - 11, 22, 22);
        ctx.globalAlpha = 1;
      } else {
        ctx.fillStyle = PAL.loot;
        ctx.beginPath();
        ctx.moveTo(s.x, s.y - 8); ctx.lineTo(s.x + 5, s.y); ctx.lineTo(s.x, s.y + 8); ctx.lineTo(s.x - 5, s.y);
        ctx.fill();
      }
    }
    for (const c of G.capsules) {
      const age = G.timeW - c.born, left = c.life - age;
      const bob = Math.sin(G.timeR * 3.2) * 3;
      const blink = left < Director.beatLen * 4 ? (Math.sin(G.timeR * 22) > 0 ? 1 : 0.3) : 1;
      this.glowSprite(ctx, PAL.power, c.x, c.y + bob, 76, 0.6 * blink);
      ctx.strokeStyle = PAL.power;
      ctx.globalAlpha = 0.75 * blink;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(c.x, c.y + bob, 25, -Math.PI / 2, -Math.PI / 2 + TAU * sat(left / c.life));
      ctx.stroke();
      ctx.globalAlpha = blink;
      if (cap) {
        const f = Math.floor(G.timeR * 14) % 12;
        ctx.drawImage(cap, f * 80, 0, 80, 80, c.x - 18, c.y + bob - 18, 36, 36);
      } else {
        ctx.fillStyle = PAL.power;
        ctx.fillRect(c.x - 12, c.y + bob - 12, 24, 24);
      }
      ctx.globalAlpha = 1;
    }
  },

  trailColor(skin, i, now) {
    const tr = skin.trail;
    if (tr === 'rainbow') return hsl(i * 26 + now * 220, 100, 66);
    if (tr === 'glitch') return i % 2 ? '#ff3b6b' : '#43f7ff';
    if (tr === 'aurora') return mixHex('#3dffc8', '#a77bff', (Math.sin(i * 0.5 + now * 3) + 1) / 2);
    return tr;
  },

  diamond(ctx, r) {
    ctx.beginPath();
    ctx.moveTo(r, 0);
    ctx.lineTo(0, r * 0.62);
    ctx.lineTo(-r * 0.82, 0);
    ctx.lineTo(0, -r * 0.62);
    ctx.closePath();
  },

  player(ctx) {
    const P = G.player, R = G.run;
    const skin = SKINS[R ? R.skin : 'core'];
    const now = G.timeR;
    const life = 0.3 * (skin.echoes || 1);
    while (P.trail.length && now - P.trail[0].t > life) P.trail.shift();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < P.trail.length; i++) {
      const s = P.trail[i];
      const k = 1 - (now - s.t) / life;
      const col = this.trailColor(skin, i, now);
      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.rotate(s.ang);
      ctx.globalAlpha = k * 0.55;
      ctx.strokeStyle = col;
      ctx.lineWidth = 2;
      this.diamond(ctx, P.r * (0.65 + 0.35 * k));
      ctx.stroke();
      ctx.globalAlpha = k * 0.18;
      ctx.fillStyle = col;
      ctx.fill();
      ctx.restore();
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    if (!P.alive) return;
    const inv = G.timeP < P.invulnP;
    const flick = inv && !P.dash && G.timeP - P.lastDashP > 0.35 && Math.floor(now * 22) % 2 === 0 ? 0.45 : 1;
    const bl = Director.beatLen;
    const beat = Math.exp(-((G.timeW % bl) / Math.max(G.ws, 0.25)) * 8);
    this.glowSprite(ctx, skin.glow, P.x, P.y, 50 + (P.dash ? 14 : 0), 0.42 * flick);
    ctx.save();
    ctx.translate(P.x, P.y);
    ctx.rotate(P.sqAng);
    const sq = P.squash;
    ctx.scale(1 + 0.55 * sq, 1 - 0.32 * sq);
    ctx.rotate(P.facing - P.sqAng);
    const sc = 1 + 0.07 * beat;
    ctx.scale(sc, sc);
    ctx.globalAlpha = flick;
    if (P.dash && P.dash.blink) {
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(0, 0, P.r * 1.7 * (1 - P.dash.t / P.dash.dur * 0.4), 0, TAU); ctx.stroke();
    }
    const R0 = P.r * 1.2;
    ctx.fillStyle = 'rgba(7,6,26,0.72)';
    this.diamond(ctx, R0);
    ctx.fill();
    ctx.strokeStyle = skin.glow;
    ctx.lineWidth = 2.6;
    ctx.lineJoin = 'round';
    glowOn(ctx, skin.glow, 10);
    ctx.stroke();
    glowOff(ctx);
    ctx.fillStyle = skin.core;
    this.diamond(ctx, R0 * 0.5);
    ctx.fill();
    if (skin.rim) {
      ctx.strokeStyle = skin.rim;
      ctx.lineWidth = 1.2;
      ctx.stroke();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
    if (R && R.burst >= 1) {
      const k = 0.5 + 0.5 * Math.sin(now * 8);
      ctx.strokeStyle = '#ffffff';
      ctx.globalAlpha = 0.3 + 0.4 * k;
      ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.arc(P.x, P.y, 27 + 4 * k, 0, TAU); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    if (R && R.surge > G.timeP) {
      ctx.strokeStyle = hsl(now * 300, 100, 70);
      ctx.globalAlpha = 0.7;
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 6]);
      ctx.lineDashOffset = -now * 60;
      ctx.beginPath(); ctx.arc(P.x, P.y, 24, 0, TAU); ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 1;
    }
    if (P.shield) {
      ctx.save();
      ctx.translate(P.x, P.y);
      ctx.rotate(now * 0.8);
      ctx.strokeStyle = PAL.core;
      ctx.globalAlpha = 0.75;
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = (i * TAU) / 6;
        if (i === 0) ctx.moveTo(Math.cos(a) * 21, Math.sin(a) * 21); else ctx.lineTo(Math.cos(a) * 21, Math.sin(a) * 21);
      }
      ctx.closePath();
      ctx.stroke();
      ctx.globalAlpha = 0.08;
      ctx.fillStyle = PAL.core;
      ctx.fill();
      ctx.restore();
      ctx.globalAlpha = 1;
    }
    const dp = G.dp;
    if (dp && P.charges < P.maxCharges) {
      const k = sat(P.chargeT / dp.regen);
      ctx.strokeStyle = skin.glow;
      ctx.globalAlpha = 0.45;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(P.x, P.y, 17, -Math.PI / 2, -Math.PI / 2 + TAU * k);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
    if (P.maxCharges > 1) {
      for (let i = 0; i < P.maxCharges; i++) {
        ctx.fillStyle = i < P.charges ? skin.glow : 'rgba(255,255,255,0.18)';
        ctx.beginPath();
        ctx.arc(P.x - 4 + i * 8, P.y + 22, 2.2, 0, TAU);
        ctx.fill();
      }
    }
  },

  particles(ctx) {
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    for (const p of FX.pool) {
      if (!p.on) continue;
      const k = 1 - p.t / p.life;
      if (p.type === 'spark') {
        ctx.globalAlpha = k;
        ctx.strokeStyle = p.color;
        ctx.lineWidth = p.size * 0.6 * k + 0.4;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x - p.vx * 0.035, p.y - p.vy * 0.035);
        ctx.stroke();
      } else if (p.type === 'ring') {
        const r = lerp(p.r0, p.r1, easeOutCubic(p.t / p.life));
        ctx.globalAlpha = k;
        ctx.strokeStyle = p.color;
        ctx.lineWidth = p.w * k + 0.3;
        ctx.beginPath();
        ctx.arc(p.x, p.y, Math.max(0.1, r), 0, TAU);
        ctx.stroke();
      } else if (p.type === 'square') {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.globalAlpha = k;
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
        ctx.restore();
      } else {
        ctx.globalAlpha = 1;
        this.glowSprite(ctx, p.color, p.x, p.y, p.size * 6 * k, k);
      }
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
  },

  popups(ctx) {
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (const q of FX.pops) {
      const k = q.t / q.life;
      const sIn = q.big ? easeOutBack(Math.min(1, q.t / 0.2)) : 1;
      const a = k < 0.7 ? 1 : 1 - (k - 0.7) / 0.3;
      ctx.save();
      ctx.translate(q.x, q.y);
      ctx.scale(sIn, sIn);
      ctx.font = (q.big ? '' : '600 ') + q.size + 'px ' + (q.big ? 'Michroma, sans-serif' : '"Chakra Petch", sans-serif');
      ctx.globalAlpha = a;
      ctx.lineJoin = 'round';
      ctx.lineWidth = q.big ? 5 : 3;
      ctx.strokeStyle = 'rgba(7,6,26,0.8)';
      ctx.strokeText(q.text, 0, 0);
      ctx.fillStyle = q.color;
      ctx.fillText(q.text, 0, 0);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  },
};

// ---------------------------------------------------------------- ui.js
const SKIN_ORDER = ['core'].concat(UNLOCKS.filter((u) => u.kind === 'skin').map((u) => u.id));
const PERK_ORDER = ['none'].concat(UNLOCKS.filter((u) => u.kind === 'perk').map((u) => u.id));

function unlockAt(kind, id) {
  const u = UNLOCKS.find((x) => x.kind === kind && x.id === id);
  return u ? u.at : 0;
}

function skinSwatch(id, size) {
  const skin = SKINS[id];
  const c = document.createElement('canvas');
  const d = Math.min(3, window.devicePixelRatio || 1);
  c.width = c.height = size * d;
  c.className = 'sw';
  c.style.width = c.style.height = size + 'px';
  const g = c.getContext('2d');
  g.scale(d, d);
  const cx = size / 2, r = size * 0.36;
  const gr = g.createRadialGradient(cx, cx, 0, cx, cx, size / 2);
  gr.addColorStop(0, rgba(skin.glow, 0.55));
  gr.addColorStop(1, rgba(skin.glow, 0));
  g.fillStyle = gr;
  g.fillRect(0, 0, size, size);
  const path = (rr) => { g.beginPath(); g.moveTo(cx + rr, cx); g.lineTo(cx, cx + rr * 0.62); g.lineTo(cx - rr * 0.82, cx); g.lineTo(cx, cx - rr * 0.62); g.closePath(); };
  if (skin.trail === 'rainbow' || skin.trail === 'aurora' || skin.trail === 'glitch') {
    for (let i = 3; i >= 1; i--) {
      g.save();
      g.translate(-i * 4, 0);
      g.globalAlpha = 0.25 + 0.1 * (3 - i);
      g.strokeStyle = skin.trail === 'rainbow' ? hsl(i * 70, 100, 65) : skin.trail === 'glitch' ? (i % 2 ? '#ff3b6b' : '#43f7ff') : mixHex('#3dffc8', '#a77bff', i / 3);
      g.lineWidth = 1.5;
      path(r);
      g.stroke();
      g.restore();
    }
  }
  g.globalAlpha = 1;
  g.strokeStyle = skin.glow;
  g.lineWidth = 2;
  path(r);
  g.stroke();
  g.fillStyle = skin.core;
  path(r * 0.56);
  g.fill();
  return c;
}

const UI = {
  e: {}, hudCache: {}, hintTimer: 0, rouletteTimer: 0, overAnim: 0, guardUntil: 0, sheetKind: null, resetArmed: false,

  init() {
    const ids = ['hud', 'h-time', 'h-phase', 'h-best', 'h-score', 'h-mult', 'h-multbox', 'h-ring', 'h-shards', 'h-powers', 'banner', 'hint', 'toasts', 'roulette',
      'title', 'logo', 't-best', 'b-play', 'play-sub', 'b-daily', 'b-hyper', 't-unlock', 't-missions', 'b-loadout', 'b-records', 'b-help', 'b-settings',
      'over', 'o-head', 'o-score', 'o-near', 'o-time', 'o-phase', 'o-perf', 'o-mult', 'o-shards', 'o-breakdown', 'o-bar', 'o-next', 'o-count', 'o-unlock', 'o-missions',
      'b-retry', 'retry-sub', 'b-copy', 'b-menu', 'pause', 'b-resume', 'b-restart', 'b-quit', 'pause-toggles', 'sheet', 'sheet-title', 'sheet-body', 'sheet-close', 'b-pause', 'h-burst', 'b-burst', 'boss', 'pick', 'pick-cards', 'o-build'];
    for (const id of ids) this.e[id] = document.getElementById(id);
    const E = this.e;
    if (ASSET_DATA.logo) {
      E.logo.src = ASSET_DATA.logo;
      document.querySelector('.logo-wrap').style.setProperty('--logo-mask', 'url("' + ASSET_DATA.logo + '")');
    }
    const click = (el, fn) => el.addEventListener('click', (ev) => { ev.preventDefault(); Sound.ensure(); if (performance.now() < this.guardUntil) return; Sfx.ui(); fn(ev); });
    click(E['b-play'], () => this.play('normal'));
    click(E['b-daily'], () => this.play('daily'));
    click(E['b-hyper'], () => { if (isUnlocked('mode', 'hyper')) this.play('hyper'); else this.toast('Hyper unlocks at ' + fmtNum(unlockAt('mode', 'hyper')) + ' shards', 'phase'); });
    click(E['b-loadout'], () => this.openSheet('loadout'));
    click(E['b-records'], () => this.openSheet('records'));
    click(E['b-help'], () => this.openSheet('help'));
    click(E['b-settings'], () => this.openSheet('settings'));
    click(E['b-retry'], () => this.retry());
    click(E['b-menu'], () => this.toMenu());
    click(E['b-copy'], () => this.copyResult());
    click(E['b-pause'], () => this.pause());
    E['b-burst'].addEventListener('pointerdown', (ev) => { ev.preventDefault(); ev.stopPropagation(); Sound.ensure(); Game.burst(); });
    click(E['b-resume'], () => this.resume());
    click(E['b-restart'], () => { this.hide('pause'); Game.start(G.run.mode); });
    click(E['b-quit'], () => { this.hide('pause'); this.toMenu(); });
    click(E['sheet-close'], () => this.closeSheet());
    E.sheet.addEventListener('click', (ev) => { if (ev.target === E.sheet) this.closeSheet(); });
    E['retry-sub'].textContent = isTouchDevice ? 'or swipe anywhere' : 'Space or R';
    this.refreshTitle();
  },

  show(id) { this.e[id].hidden = false; },
  hide(id) { this.e[id].hidden = true; },

  play(mode) {
    Sound.ensure();
    this.closeSheet();
    Game.start(mode);
  },

  retry() {
    if (G.state !== 'over') return;
    Game.start(G.run.mode);
  },

  toMenu() {
    this.hide('over');
    this.hide('pause');
    this.hide('hud');
    this.hideHint();
    this.refreshTitle();
    this.show('title');
    App.measureFocus();
    Game.start('attract');
  },

  pause() {
    if (G.state !== 'play') return;
    G.state = 'paused';
    this.renderToggles(this.e['pause-toggles'], ['sound', 'music', 'shake']);
    this.show('pause');
  },

  resume() {
    if (G.state !== 'paused') return;
    this.hide('pause');
    G.state = 'play';
  },

  onRunStart(R) {
    this.hide('title');
    this.hide('over');
    this.hide('pause');
    this.closeSheet();
    this.show('hud');
    this.hudCache = {};
    const S = Save.data;
    this.runBest = R.mode === 'hyper' ? S.hyperBest : R.mode === 'daily' ? (S.daily.date === R.today ? S.daily.best : 0) : S.best.score;
    this.passedBest = false;
    this.e['h-best'].textContent = '';
    this.e['h-best'].className = 'num';
    this.e['h-powers'].innerHTML = '';
    this.e.toasts.innerHTML = '';
    this.hideHint();
    this.e.roulette.classList.remove('on');
    cancelAnimationFrame(this.overAnim);
    this.burstReady(false);
    this.bossBar(null);
    this.hidePick();
  },

  onDeath() {
    this.hideHint();
    this.e.roulette.classList.remove('on');
  },

  // ---------------------------------------------------------- HUD
  frame() {
    if (G.state === 'play' || G.state === 'dying' || G.state === 'paused') this.updateHud();
    if (G.state === 'title') {
      const bl = Director.beatLen;
      const beat = Math.exp(-((G.timeW % bl) / bl) * 5);
      const v = Math.round(beat * 20) / 20;
      if (v !== this.lastBeatVar) { this.lastBeatVar = v; this.e.logo.style.setProperty('--beat', v); }
    }
  },

  set(key, el, val) {
    if (this.hudCache[key] === val) return;
    this.hudCache[key] = val;
    el.textContent = val;
  },

  updateHud() {
    const R = G.run, P = G.player, E = this.e;
    if (!R) return;
    this.set('time', E['h-time'], fmtTime(R.tutorial ? 0 : R.time));
    this.set('phase', E['h-phase'], R.tutorial ? 'Tutorial' : 'Phase ' + R.phase);
    this.set('score', E['h-score'], fmtNum(R.score));
    this.set('mult', E['h-mult'], '×' + R.mult);
    this.set('shards', E['h-shards'], String(R.shards));
    if (this.runBest > 0 && !R.tutorial) {
      const k = R.score / this.runBest;
      const cls = k >= 1 ? 'won' : k > 0.85 ? 'close' : '';
      this.set('best', E['h-best'], k >= 1 ? 'New best' : 'Best ' + fmtNum(this.runBest));
      if (this.hudCache.bestCls !== cls) { this.hudCache.bestCls = cls; E['h-best'].className = 'num ' + cls; }
      if (k >= 1 && !this.passedBest && G.state === 'play') {
        this.passedBest = true;
        this.toast('New best · keep going', 'mission');
        Sfx.best();
      }
    }
    const bw = (R.burst * 100).toFixed(0) + '%';
    if (this.hudCache.burst !== bw) { this.hudCache.burst = bw; E['h-burst'].style.width = bw; }
    const ring = R.combo > 0 ? 94.25 * (1 - sat(R.comboT / R.comboWindow)) : 94.25;
    const rv = ring.toFixed(1);
    if (this.hudCache.ring !== rv) { this.hudCache.ring = rv; E['h-ring'].style.strokeDashoffset = rv; }
    const list = [];
    if (P.shield) list.push(['shield', 'Shield', '']);
    for (const k of ['overclock', 'magnet', 'timewarp', 'storm']) {
      const left = R.fx[k] - G.timeP;
      if (left > 0) list.push([k, POWERS[k].name, Math.ceil(left) + 's']);
    }
    const sig = list.map((x) => x.join(':')).join('|');
    if (this.hudCache.pw !== sig) {
      this.hudCache.pw = sig;
      E['h-powers'].innerHTML = list.map(([k, name, left]) => {
        const icon = ASSET_DATA.icons[POWERS[k].icon];
        return '<span class="pw ' + k + '">' + (icon ? '<img alt="" src="' + icon + '">' : '') + '<span>' + (left || name) + '</span></span>';
      }).join('');
    }
  },

  bumpMult() {
    const el = this.e['h-multbox'];
    el.classList.remove('bump');
    void el.offsetWidth;
    el.classList.add('bump');
  },

  bumpShards() {
    const el = this.e['h-shards'].parentElement;
    el.classList.remove('bump');
    void el.offsetWidth;
    el.classList.add('bump');
  },

  banner(main, sub, color) {
    const b = this.e.banner;
    b.querySelector('.b-main').textContent = main;
    b.querySelector('.b-sub').textContent = sub || '';
    b.style.color = color || '#ffffff';
    b.classList.remove('on');
    void b.offsetWidth;
    b.classList.add('on');
  },

  hint(text, fig, dur) {
    const h = this.e.hint;
    h.querySelector('.hint-text').textContent = text;
    h.className = 'on' + (fig ? ' fig ' + fig : '');
    clearTimeout(this.hintTimer);
    if (dur) this.hintTimer = setTimeout(() => this.hideHint(), dur * 1000);
  },

  hideHint() {
    clearTimeout(this.hintTimer);
    this.e.hint.classList.remove('on');
  },

  toast(text, kind) {
    const t = el('div', 'toast' + (kind ? ' ' + kind : ''));
    t.textContent = text;
    const box = this.e.toasts;
    box.appendChild(t);
    while (box.children.length > 3) box.removeChild(box.firstChild);
    setTimeout(() => t.remove(), 2500);
  },

  roulette(kind) {
    this.hideHint();
    const box = this.e.roulette, img = box.querySelector('img');
    const nm = box.querySelector('.r-name'), ds = box.querySelector('.r-desc');
    clearTimeout(this.rouletteTimer);
    box.className = 'on';
    nm.textContent = '';
    ds.textContent = '';
    const keys = Object.keys(POWERS);
    const steps = [45, 50, 55, 65, 75, 90, 110, 140];
    let i = 0;
    const tick = () => {
      if (i < steps.length) {
        const k = keys[(i * 3 + Math.floor(Math.random() * keys.length)) % keys.length];
        img.src = ASSET_DATA.icons[POWERS[k].icon] || '';
        nm.textContent = POWERS[k].name;
        ds.textContent = 'Capsule';
        img.classList.remove('tick');
        void img.offsetWidth;
        img.classList.add('tick');
        Sfx.tick(i);
        this.rouletteTimer = setTimeout(tick, steps[i++]);
      } else {
        const p = POWERS[kind];
        img.src = ASSET_DATA.icons[p.icon] || '';
        nm.textContent = p.name;
        ds.textContent = p.desc;
        box.className = 'on ' + p.rarity;
        Sfx.reveal(p.rarity);
        this.rouletteTimer = setTimeout(() => box.classList.remove('on'), 1500);
      }
    };
    tick();
  },

  burstReady(on) {
    const b = this.e['b-burst'];
    if (b) b.hidden = !on;
  },

  showPick(cards) {
    const box = this.e['pick-cards'];
    box.innerHTML = '';
    this.pickKeys = cards;
    cards.forEach((k, i) => {
      const u = UPGRADES[k], lvl = (G.run.up[k] || 0) + 1;
      const b = el('button', 'card ' + u.rarity);
      b.type = 'button';
      b.innerHTML = '<span class="c-key">' + (i + 1) + '</span>' + upgradeIcon(k) + '<span class="c-name"></span><span class="c-desc"></span><span class="c-lvl"></span>';
      b.querySelector('.c-name').textContent = u.name;
      b.querySelector('.c-desc').textContent = u.desc;
      b.querySelector('.c-lvl').textContent = u.max > 1 ? 'Level ' + lvl + ' of ' + u.max : u.rarity === 'epic' ? 'Epic · once per run' : 'Once per run';
      b.addEventListener('click', (ev) => { ev.preventDefault(); this.pickIndex(i); });
      box.appendChild(b);
    });
    this.e.roulette.classList.remove('on');
    this.e.toasts.innerHTML = '';
    this.e['b-burst'].hidden = true;
    this.show('pick');
    this.pickShownAt = performance.now();
  },

  pickIndex(i) {
    if (G.state !== 'pick' || !this.pickKeys || performance.now() - (this.pickShownAt || 0) < 300) return;
    const k = this.pickKeys[i];
    if (!k) return;
    Game.choose(k);
  },

  hidePick() {
    if (this.e.pick) this.e.pick.hidden = true;
    this.pickKeys = null;
    if (G.run && G.state === 'play') this.burstReady(G.run.burst >= 1);
  },

  bossBar(b) {
    const box = this.e.boss;
    if (!box) return;
    if (!b) { box.hidden = true; return; }
    box.hidden = false;
    box.querySelector('.boss-name').textContent = b.name;
    box.querySelector('.boss-bar > i').style.width = Math.max(0, (b.hp / b.maxHp) * 100).toFixed(1) + '%';
  },

  // ---------------------------------------------------------- title
  refreshTitle() {
    const E = this.e, S = Save.data;
    if (!E['t-best']) return;
    const today = todayKey();
    E['t-best'].innerHTML = S.best.score > 0
      ? 'Best <b>' + fmtNum(S.best.score) + '</b> · phase ' + S.best.phase + ' · ' + fmtTime(S.best.time)
      : 'Swipe to dash · dash at the last instant';
    const sk = S.equipped.skin !== 'core' ? SKINS[S.equipped.skin].name : '';
    const pk = S.equipped.perk !== 'none' ? PERKS[S.equipped.perk].name : '';
    E['play-sub'].textContent = sk || pk ? [sk && sk + ' skin', pk].filter(Boolean).join(' · ') : (isTouchDevice ? 'Swipe to dash · tap to blink' : 'Arrows or WASD to dash · Space to blink');
    const mut = mutatorFor(today);
    const db = S.daily.date === today ? S.daily.best : 0;
    const streak = S.daily.streak > 0 && S.daily.lastPlayed && dayDiff(S.daily.lastPlayed, today) <= 1 ? S.daily.streak : 0;
    E['b-daily'].innerHTML = '<span class="m-name">Daily #' + dailyNumber(today) + '</span><span class="m-sub">' + mut.name + '</span><span class="m-sub">' +
      (db > 0 ? 'Today ' + fmtNum(db) : 'Not played today') + (streak ? ' · <span class="streak">' + streak + '-day streak</span>' : '') + '</span>';
    const hy = isUnlocked('mode', 'hyper');
    E['b-hyper'].classList.toggle('locked', !hy);
    E['b-hyper'].innerHTML = '<span class="m-name">Hyper</span><span class="m-sub">' +
      (hy ? '150 BPM · double score' : 'Unlocks at ' + fmtNum(unlockAt('mode', 'hyper')) + ' shards') + '</span><span class="m-sub">' +
      (hy ? (S.hyperBest > 0 ? 'Best ' + fmtNum(S.hyperBest) : 'Not played yet') : 'You have ' + fmtNum(S.shardsTotal)) + '</span>';
    const up = unlockProgress(S.shardsTotal);
    if (up.next) {
      E['t-unlock'].innerHTML = '<div class="u-row"><span class="u-label">Next unlock</span><span class="u-name">' + unlockName(up.next) + '</span></div>' +
        '<div class="bar"><i style="width:' + (up.frac * 100).toFixed(1) + '%"></i></div>' +
        '<div class="u-row small"><span>' + unlockDesc(up.next) + '</span><span class="num">' + fmtNum(S.shardsTotal) + ' / ' + fmtNum(up.next.at) + '</span></div>';
    } else {
      E['t-unlock'].innerHTML = '<div class="u-row"><span class="u-label">Everything unlocked</span><span class="u-name num">' + fmtNum(S.shardsTotal) + ' shards</span></div>';
    }
    E['t-missions'].innerHTML = '';
    for (const m of S.missions) {
      const def = MISSIONS[m.type];
      const li = el('li');
      let prog = 0, sub = '';
      if (def.total) { prog = m.progress / m.target; sub = fmtNum(m.progress) + ' / ' + fmtNum(m.target); }
      else if (!def.special && m.progress > 0) { prog = Math.min(0.99, m.progress / m.target); sub = 'Best so far ' + (m.type === 'survive' ? Math.floor(m.progress) + 's' : fmtNum(m.progress)); }
      li.innerHTML = '<span class="m-text">' + missionLabel(m) + (sub ? ' <span class="m-best">· ' + sub + '</span>' : '') + '</span>' +
        '<span class="reward"><span class="gem"></span>+' + m.reward + '</span>' +
        '<div class="bar thin"><i style="width:' + (prog * 100).toFixed(1) + '%"></i></div>';
      E['t-missions'].appendChild(li);
    }
  },

  // ---------------------------------------------------------- game over
  showOver(res) {
    const E = this.e, R = res.R, S = Save.data;
    this.hide('hud');
    this.hideHint();
    this.show('over');
    this.guardUntil = performance.now() + 380;
    E['over'].scrollTop = 0;
    const modeName = R.mode === 'daily' ? 'Daily #' + dailyNumber(R.today) : R.mode === 'hyper' ? 'Hyper' : '';
    E['o-head'].textContent = res.isBest ? (modeName ? modeName + ' · new best' : 'New best') : (modeName || 'Run over');
    E['o-head'].classList.toggle('best', res.isBest);
    let near = '', hot = false;
    if (res.isBest) near = res.prevBest > 0 ? 'Beat your best by ' + fmtNum(R.score - res.prevBest) : 'Your first score on the board.';
    else if (res.prevBest > 0) {
      const pct = R.score / res.prevBest;
      if (pct >= 0.8) { near = 'Only ' + fmtNum(res.prevBest - R.score) + ' short of your best'; hot = true; }
      else near = Math.round(pct * 100) + '% of your best (' + fmtNum(res.prevBest) + ')';
      if (R.mode === 'normal' && S.best.time > R.time && S.best.time - R.time < 4) { near += ' · ' + (S.best.time - R.time).toFixed(1) + 's from your longest run'; hot = true; }
    }
    E['o-near'].textContent = near;
    E['o-near'].classList.toggle('hot', hot);
    E['o-time'].textContent = fmtTime(R.time);
    E['o-phase'].textContent = String(R.phase);
    E['o-perf'].textContent = String(R.perfects);
    E['o-mult'].textContent = '×' + R.maxMult;
    const parts = [];
    if (R.shards) parts.push(R.shards + ' collected');
    if (res.scoreShards) parts.push(res.scoreShards + ' from score');
    if (R.missionShards) parts.push(R.missionShards + ' from missions');
    if (R.bonusShards) parts.push(R.bonusShards + ' bonus');
    E['o-breakdown'].textContent = parts.join(' · ');
    const build = {};
    for (const k of R.upList || []) build[k] = (build[k] || 0) + 1;
    const bl = Object.keys(build).map((k) => UPGRADES[k].name + (build[k] > 1 ? ' ×' + build[k] : ''));
    E['o-build'].textContent = (R.bosses ? R.bosses + (R.bosses > 1 ? ' bosses' : ' boss') + ' defeated · ' : '') + (bl.length ? 'Build: ' + bl.join(' · ') : '');
    E['o-build'].hidden = !bl.length && !R.bosses;
    E['o-unlock'].hidden = true;
    E['o-unlock'].innerHTML = '';
    E['b-copy'].hidden = R.mode !== 'daily';
    E['b-copy'].textContent = 'Copy result';
    // missions: finished ones, then the closest unfinished one
    const ul = E['o-missions'];
    ul.innerHTML = '';
    for (const m of res.done) {
      const li = el('li');
      li.innerHTML = '<span class="tick">✓</span><span>' + missionLabel(m) + '</span><span class="rw">+' + m.reward + '</span>';
      ul.appendChild(li);
    }
    const open = S.missions.filter((m) => !MISSIONS[m.type].special && m.progress > 0).sort((a, b) => b.progress / b.target - a.progress / a.target)[0];
    if (open && res.done.length < 2) {
      const def = MISSIONS[open.type];
      const li = el('li');
      const val = def.total ? fmtNum(open.progress) + ' / ' + fmtNum(open.target) : 'best ' + (open.type === 'survive' ? Math.floor(open.progress) + 's' : fmtNum(open.progress));
      li.innerHTML = '<span class="tick near">›</span><span>' + missionLabel(open) + ' · ' + val + '</span><span class="rw">+' + open.reward + '</span>';
      ul.appendChild(li);
    }
    if (res.isBest) { setTimeout(() => { if (G.state === 'over') { Sfx.best(); vibrate(20); } }, 650); }
    this.animateOver(res);
  },

  animateOver(res) {
    const E = this.e, R = res.R;
    cancelAnimationFrame(this.overAnim);
    const t0 = performance.now();
    const unlockQueue = res.fresh.slice();
    let shownUnlock = null;
    const step = () => {
      const t = (performance.now() - t0) / 1000;
      const ks = easeOutCubic(sat(t / 0.75));
      E['o-score'].textContent = fmtNum(R.score * ks);
      const kb = easeOutCubic(sat((t - 0.45) / 1.1));
      const v = res.before + (res.after - res.before) * kb;
      E['o-shards'].textContent = '+' + fmtNum(res.earned * kb);
      const up = unlockProgress(Math.floor(v));
      E['o-bar'].style.width = (up.frac * 100).toFixed(1) + '%';
      E['o-next'].textContent = up.next ? 'Next: ' + unlockName(up.next) : 'Everything unlocked';
      E['o-count'].textContent = up.next ? fmtNum(Math.floor(v)) + ' / ' + fmtNum(up.next.at) : fmtNum(Math.floor(v));
      while (unlockQueue.length && v >= unlockQueue[0].at) {
        shownUnlock = unlockQueue.shift();
        this.revealUnlock(shownUnlock, res.fresh.length);
      }
      if (t < 1.7 && G.state === 'over') this.overAnim = requestAnimationFrame(step);
    };
    this.overAnim = requestAnimationFrame(step);
  },

  revealUnlock(u, total) {
    const box = this.e['o-unlock'];
    box.hidden = false;
    box.innerHTML = '';
    let fig;
    if (u.kind === 'skin') fig = skinSwatch(u.id, 40);
    else {
      fig = el('img', 'sw');
      fig.alt = '';
      fig.src = ASSET_DATA.icons[u.kind === 'mode' ? 'nova' : u.kind === 'track' ? 'prism' : 'overclock'] || '';
    }
    box.appendChild(fig);
    const txt = el('div', 'u-txt');
    txt.innerHTML = '<div class="u-title">Unlocked' + (total > 1 ? ' · ' + total + ' new' : '') + '</div><div class="u-what"></div><div class="u-desc"></div>';
    txt.querySelector('.u-what').textContent = unlockName(u);
    txt.querySelector('.u-desc').textContent = unlockDesc(u);
    box.appendChild(txt);
    const b = el('button', 'chip');
    b.type = 'button';
    if (u.kind === 'mode') {
      b.textContent = 'Play';
      b.addEventListener('click', () => this.play('hyper'));
    } else {
      b.textContent = 'Equip';
      b.addEventListener('click', () => {
        if (u.kind === 'skin') Save.data.equipped.skin = u.id;
        else if (u.kind === 'track') Save.data.equipped.track = u.id;
        else Save.data.equipped.perk = u.id;
        Save.persist();
        b.textContent = 'Equipped';
        b.disabled = true;
        Sfx.ui();
      });
    }
    box.appendChild(b);
    Sfx.unlock();
    FX.flash(0.12, [1, 0.85, 0.4]);
  },

  copyResult() {
    const R = G.run;
    if (!R) return;
    const bar = '▰'.repeat(Math.min(8, R.phase)) + '▱'.repeat(Math.max(0, 8 - R.phase));
    const text = 'AFTERIMAGE · Daily #' + dailyNumber(R.today) + ' (' + (R.mut ? R.mut.name : '') + ')\n' +
      fmtNum(R.score) + ' pts · ' + fmtTime(R.time) + ' · phase ' + R.phase + '\n' +
      R.perfects + ' PERFECT · best ×' + R.maxMult + '\n' + bar;
    const done = () => { this.e['b-copy'].textContent = 'Copied'; };
    const fallback = () => {
      try {
        const ta = el('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
        done();
      } catch (e) { this.e['b-copy'].textContent = 'Copy failed'; }
    };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
      else fallback();
    } catch (e) { fallback(); }
  },

  // ---------------------------------------------------------- sheets
  openSheet(kind) {
    const E = this.e;
    this.sheetKind = kind;
    this.resetArmed = false;
    E.sheet.hidden = false;
    const titles = { loadout: 'Loadout', records: 'Records', help: 'How to play', settings: 'Settings' };
    E['sheet-title'].textContent = titles[kind];
    const body = E['sheet-body'];
    body.innerHTML = '';
    if (kind === 'loadout') this.renderLoadout(body);
    else if (kind === 'records') this.renderRecords(body);
    else if (kind === 'help') this.renderHelp(body);
    else this.renderSettings(body);
    setTimeout(() => E['sheet-close'].focus({ preventScroll: true }), 30);
  },

  closeSheet() {
    if (!this.e.sheet || this.e.sheet.hidden) return;
    this.e.sheet.hidden = true;
    this.sheetKind = null;
    this.refreshTitle();
  },

  renderLoadout(body) {
    const S = Save.data;
    body.appendChild(el('p', 'label sec', 'Skins'));
    const grid = el('div', 'skins');
    for (const id of SKIN_ORDER) {
      const ok = isUnlocked('skin', id);
      const b = el('button', 'skin');
      b.type = 'button';
      b.disabled = !ok;
      b.setAttribute('aria-pressed', String(S.equipped.skin === id));
      b.appendChild(skinSwatch(id, 34));
      const n = el('span');
      n.textContent = SKINS[id].name;
      b.appendChild(n);
      const sm = el('small');
      sm.textContent = !ok ? fmtNum(unlockAt('skin', id)) + ' shards' : S.equipped.skin === id ? 'Equipped' : SKINS[id].legendary ? 'Legendary' : 'Ready';
      b.appendChild(sm);
      b.addEventListener('click', () => { S.equipped.skin = id; Save.persist(); Sfx.ui(); this.openSheet('loadout'); });
      grid.appendChild(b);
    }
    body.appendChild(grid);
    body.appendChild(el('p', 'label sec', 'Perk · one at a time'));
    const list = el('div', 'perks');
    for (const id of PERK_ORDER) {
      const ok = isUnlocked('perk', id);
      const b = el('button', 'perk');
      b.type = 'button';
      b.disabled = !ok;
      b.setAttribute('aria-pressed', String(S.equipped.perk === id));
      b.innerHTML = '<b></b><span></span>';
      b.querySelector('b').textContent = PERKS[id].name + (S.equipped.perk === id ? ' · equipped' : '');
      b.querySelector('span').textContent = ok ? PERKS[id].desc : PERKS[id].desc + ' Unlocks at ' + fmtNum(unlockAt('perk', id)) + ' shards.';
      b.addEventListener('click', () => { S.equipped.perk = id; Save.persist(); Sfx.ui(); this.openSheet('loadout'); });
      list.appendChild(b);
    }
    body.appendChild(list);
    body.appendChild(el('p', 'label sec', 'Soundtrack'));
    const tl = el('div', 'perks');
    for (const id of Object.keys(TRACKS)) {
      const ok = isUnlocked('track', id), on = (S.equipped.track || 'neon') === id;
      const b = el('button', 'perk');
      b.type = 'button';
      b.disabled = !ok;
      b.setAttribute('aria-pressed', String(on));
      b.innerHTML = '<b></b><span></span>';
      b.querySelector('b').textContent = TRACKS[id].name + (on ? ' · selected' : '');
      b.querySelector('span').textContent = ok ? TRACKS[id].desc : TRACKS[id].desc + ' Unlocks at ' + fmtNum(unlockAt('track', id)) + ' shards.';
      b.addEventListener('click', () => { S.equipped.track = id; Save.persist(); Music.setTrack(id); Sfx.ui(); this.openSheet('loadout'); });
      tl.appendChild(b);
    }
    body.appendChild(tl);
    body.appendChild(el('p', 'note', 'You have ' + fmtNum(S.shardsTotal) + ' shards in total. Shards come from runs, missions and capsules, and they never run out once earned.'));
  },

  renderRecords(body) {
    const S = Save.data;
    const kv = el('dl', 'kv');
    const cells = [
      ['Best score', fmtNum(S.best.score)], ['Longest run', fmtTime(S.best.time)], ['Highest phase', String(S.best.phase)],
      ['Runs', fmtNum(S.stats.runs)], ['Perfects', fmtNum(S.stats.perfects)], ['Daily streak', S.daily.streak + (S.daily.streak === 1 ? ' day' : ' days')],
      ['Best ×', '×' + S.best.mult], ['Hyper best', fmtNum(S.hyperBest)], ['Time played', Math.round(S.stats.time / 60) + ' min'],
      ['Bosses defeated', fmtNum(S.stats.bosses || 0)], ['Bursts', fmtNum(S.stats.bursts || 0)], ['Unlocks', Object.keys(S.unlocked).length + ' of ' + UNLOCKS.length],
    ];
    for (const [k, v] of cells) {
      const d = el('div');
      d.innerHTML = '<dt></dt><dd></dd>';
      d.querySelector('dt').textContent = k;
      d.querySelector('dd').textContent = v;
      kv.appendChild(d);
    }
    body.appendChild(kv);
    body.appendChild(el('p', 'label sec', 'Top runs'));
    if (!S.top.length) { body.appendChild(el('p', 'note', 'No runs yet. Your five best runs will show up here.')); return; }
    const tb = el('table', 'records');
    tb.innerHTML = '<thead><tr><th>Score</th><th>Time</th><th>Phase</th><th>Mode</th><th>Date</th></tr></thead><tbody></tbody>';
    const names = { normal: 'Classic', daily: 'Daily', hyper: 'Hyper' };
    for (const r of S.top) {
      const tr = el('tr');
      tr.innerHTML = '<td>' + fmtNum(r.score) + '</td><td>' + fmtTime(r.time) + '</td><td>' + (r.phase || '') + '</td><td>' + (names[r.mode] || '') + '</td><td>' + fmtDate(r.date) + '</td>';
      tb.querySelector('tbody').appendChild(tr);
    }
    body.appendChild(tb);
  },

  renderHelp(body) {
    const ol = el('ol', 'help');
    const items = [
      '<b>Swipe</b> anywhere to dash. On a keyboard use the arrow keys or WASD, or click where you want to go. You are invincible mid-dash, so you can dash straight through attacks.',
      '<b>Tap</b> to blink in place (Space on a keyboard). It is a dash that does not move you.',
      'Dash at the <b>last instant</b> before something hits you for a PERFECT. Time slows, your multiplier climbs and nearby bullets turn into shards.',
      'Every attack fires <b>on the beat</b>. Warning lines close in, circles shrink and rings travel so they land exactly on the music.',
      '<b>Graze</b> past attacks without touching them for bonus points. It also keeps your combo alive.',
      'PERFECT dodges charge your <b>Burst</b>. When it is full, tap BURST (E on a keyboard) to wipe the screen and double your score for 6 seconds.',
      'Every new phase lets you <b>pick an upgrade</b> for the run. Every fifth phase brings a <b>boss</b>: your PERFECT dodges and Bursts damage it.',
      '<b>Capsules</b> hold a random power-up. <b>Shards</b> unlock skins, perks and Hyper mode.',
      'The <b>Daily</b> has the same attack schedule for everyone, with a new twist each day. Play every day to build a streak.',
    ];
    for (const h of items) ol.appendChild(el('li', '', h));
    body.appendChild(ol);
  },

  renderSettings(body) {
    const box = el('div', 'toggles');
    this.renderToggles(box, ['sound', 'music', 'shake', 'flashes', 'haptics']);
    body.appendChild(box);
    const tut = el('button', 'btn ghost', 'Replay the tutorial');
    tut.type = 'button';
    tut.addEventListener('click', () => { Save.data.seen.tutorial = false; Save.persist(); tut.textContent = 'The tutorial runs at the start of your next Play'; });
    body.appendChild(tut);
    const reset = el('button', 'btn ghost danger-btn', 'Reset all progress');
    reset.type = 'button';
    reset.addEventListener('click', () => {
      if (!this.resetArmed) { this.resetArmed = true; reset.textContent = 'Tap again to erase everything'; return; }
      const settings = Save.data.settings;
      Save.data = defaultSave();
      Save.data.settings = settings;
      Save.sanitize();
      Save.persist();
      reset.textContent = 'Progress erased';
      this.resetArmed = false;
    });
    body.appendChild(reset);
    body.appendChild(el('p', 'note', Save.cloud.ready ? 'Progress saves to your account and follows you across devices.' : 'Progress saves in this browser.'));
  },

  renderToggles(box, keys) {
    const labels = { sound: 'Sound', music: 'Music', shake: 'Screen shake', flashes: 'Flashes', haptics: 'Vibration' };
    box.innerHTML = '';
    for (const k of keys) {
      const b = el('button', 'switch');
      b.type = 'button';
      b.setAttribute('role', 'switch');
      b.setAttribute('aria-checked', String(!!Save.data.settings[k]));
      b.innerHTML = '<span></span><span class="knob"></span>';
      b.firstChild.textContent = labels[k];
      b.addEventListener('click', () => {
        Save.data.settings[k] = !Save.data.settings[k];
        b.setAttribute('aria-checked', String(Save.data.settings[k]));
        Sound.ensure();
        Sound.applySettings();
        Save.persist();
        Sfx.ui();
      });
      box.appendChild(b);
    }
  },
};

  trigger: '<circle cx="12" cy="12" r="6.5"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/><circle cx="12" cy="12" r="1.2"/>',
  afterglow: '<path d="M2.5 16h7M4 12h8M2.5 8h7"/><path d="M14 6l7 6-7 6-2.5-6z"/>',
  shrapnel: '<path d="M12 2v6M12 16v6M2 12h6M16 12h6M5 5l4 4M15 15l4 4M19 5l-4 4M9 15l-4 4"/>',
  capacitor: '<path d="M13 2L5 14h6l-1 8 8-12h-6z"/>',
  combolock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  magnetism: '<path d="M6 4v8a6 6 0 0 0 12 0V4"/><path d="M6 8h4M14 8h4"/>',
  aegis: '<path d="M12 2l8 5v10l-8 5-8-5V7z"/><path d="M12 7l4 2.5v5L12 17l-4-2.5v-5z"/>',
  goldrush: '<path d="M6 4h12l3 5-9 12L3 9z"/><path d="M3 9h18M9.5 4L12 21M14.5 4L12 21"/>',
  grazer: '<circle cx="16" cy="12" r="3"/><path d="M3 20c4-10 9-14 18-15"/>',
  stride: '<path d="M3 12h17M15 7l5 5-5 5"/><path d="M3 8h5M3 16h5"/>',
  second: '<path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/><path d="M12 10v4M10 12h4"/>',
};

function upgradeIcon(k) {
  return '<svg class="c-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (UP_ICONS[k] || '') + '</svg>';
}

// ---------------------------------------------------------------- input.js
// Touch: press = blink immediately (zero latency); if the finger then moves,
// that same press becomes a dash in the swipe direction. Sharp turns chain dashes.
const DIRS = {
  arrowup: [0, -1], w: [0, -1], arrowdown: [0, 1], s: [0, 1],
  arrowleft: [-1, 0], a: [-1, 0], arrowright: [1, 0], d: [1, 0],
};

const Input = {
  pts: new Map(),
  keys: new Set(),

  init(stage) {
    this.stage = stage;
    stage.addEventListener('pointerdown', (e) => this.down(e), { passive: false });
    window.addEventListener('pointermove', (e) => this.move(e), { passive: false });
    window.addEventListener('pointerup', (e) => this.up(e));
    window.addEventListener('pointercancel', (e) => this.pts.delete(e.pointerId));
    stage.addEventListener('contextmenu', (e) => e.preventDefault());
    document.getElementById('app').addEventListener('pointerdown', () => Sound.ensure(), { capture: true });
    window.addEventListener('keydown', (e) => this.key(e, true));
    window.addEventListener('keyup', (e) => this.key(e, false));
    window.addEventListener('blur', () => this.keys.clear());
  },

  toWorld(cx, cy) {
    return { x: (cx - G.offCssX) / G.css, y: (cy - G.offCssY) / G.css };
  },

  down(e) {
    if (G.state !== 'play' && G.state !== 'over') return;
    e.preventDefault();
    try { this.stage.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    const tp = { sx: e.clientX, sy: e.clientY, ax: e.clientX, ay: e.clientY, t0: performance.now(), lastAng: null, moved: false, type: e.pointerType, dashed: false, seq: 0 };
    this.pts.set(e.pointerId, tp);
    if (G.state !== 'play') return;
    if (e.pointerType === 'mouse') {
      const p = this.toWorld(e.clientX, e.clientY), P = G.player;
      const dx = p.x - P.x, dy = p.y - P.y;
      tp.dashed = Math.hypot(dx, dy) > 30 ? Game.tryDash(dx, dy, false) : Game.tryDash(0, 0, true);
    } else {
      tp.dashed = Game.tryDash(0, 0, true);
    }
    tp.seq = G.dashSeq;
  },

  move(e) {
    const tp = this.pts.get(e.pointerId);
    if (!tp) return;
    const TH = tp.type === 'mouse' ? 24 : 15;
    const dx = e.clientX - tp.ax, dy = e.clientY - tp.ay;
    const d = Math.hypot(dx, dy);
    if (d < TH) return;
    if (e.cancelable) e.preventDefault();
    const ang = Math.atan2(dy, dx);
    if (G.state === 'over') {
      if (!tp.moved && Math.hypot(e.clientX - tp.sx, e.clientY - tp.sy) > 40) { tp.moved = true; this.pts.delete(e.pointerId); UI.retry(); }
      return;
    }
    if (G.state !== 'play') return;
    if (!tp.moved) {
      tp.moved = true;
      tp.lastAng = ang;
      tp.ax = e.clientX; tp.ay = e.clientY;
      const P = G.player;
      // the press already started a blink: steer it instead of spending a second charge
      if (tp.dashed && tp.seq === G.dashSeq && P.dash && G.timeP - P.lastDashP < 0.16) Game.redirectDash(dx, dy);
      else if (!(tp.type === 'mouse' && tp.dashed)) Game.tryDash(dx, dy, false);
      tp.seq = G.dashSeq;
      return;
    }
    if (Math.abs(angDiff(tp.lastAng, ang)) > 0.85) {
      tp.lastAng = ang;
      tp.ax = e.clientX; tp.ay = e.clientY;
      Game.tryDash(dx, dy, false);
      tp.seq = G.dashSeq;
    } else {
      tp.lastAng = ang;
      tp.ax = e.clientX; tp.ay = e.clientY;
    }
  },

  up(e) {
    this.pts.delete(e.pointerId);
  },

  key(e, down) {
    const k = (e.key || '').toLowerCase();
    if (down && e.repeat) {
      if (DIRS[k] || k === ' ') e.preventDefault();
      return;
    }
    if (UI.sheetKind) {
      if (down && k === 'escape') UI.closeSheet();
      return;
    }
    if (down) Sound.ensure();
    if (G.state === 'pick') {
      if (down && (k === '1' || k === '2' || k === '3')) { e.preventDefault(); UI.pickIndex(+k - 1); }
      return;
    }
    const tag = (document.activeElement && document.activeElement.tagName) || '';
    if (G.state === 'title') {
      if (down && (k === 'enter' || (k === ' ' && tag !== 'BUTTON'))) { e.preventDefault(); UI.play('normal'); }
      return;
    }
    if (G.state === 'over') {
      if (down && (k === 'enter' || k === 'r' || (k === ' ' && tag !== 'BUTTON'))) { e.preventDefault(); UI.retry(); }
      else if (down && k === 'escape') UI.toMenu();
      return;
    }
    if (G.state === 'paused') {
      if (down && (k === 'escape' || k === 'p' || k === ' ')) { e.preventDefault(); UI.resume(); }
      return;
    }
    if (G.state !== 'play') return;
    if (DIRS[k]) {
      e.preventDefault();
      if (down) {
        this.keys.add(k);
        let x = 0, y = 0;
        for (const kk of this.keys) { const v = DIRS[kk]; if (v) { x += v[0]; y += v[1]; } }
        if (x === 0 && y === 0) return;
        const P = G.player;
        if (P.dash && !P.dash.blink && G.timeP - P.lastDashP < 0.07) Game.redirectDash(x, y);
        else Game.tryDash(x, y, false);
      } else this.keys.delete(k);
      return;
    }
    if (down && (k === 'e' || k === 'q')) { e.preventDefault(); Game.burst(); return; }
    if (down && (k === ' ' || k === 'shift' || k === 'j' || k === 'k')) { e.preventDefault(); Game.tryDash(0, 0, true); return; }
    if (down && (k === 'escape' || k === 'p')) UI.pause();
  },
};

// ---------------------------------------------------------------- main.js
const Quality = {
  level: 0, acc: 0, n: 0, lastChange: 0,
  dprCap() { return [2, 1.6, 1.25, 1][this.level]; },
  track(dt) {
    if (G.state !== 'play' && G.state !== 'title') { this.acc = 0; this.n = 0; return; }
    this.acc += dt;
    this.n++;
    if (this.n < 90) return;
    const avg = this.acc / this.n;
    this.acc = 0; this.n = 0;
    const now = performance.now();
    if (avg > 0.024 && this.level < 3 && now - this.lastChange > 3000) {
      this.level++;
      this.lastChange = now;
      if (this.level >= 2) Post.p.lite = true;
      App.resize();
    }
  },
};

function loadImage(src) {
  return new Promise((res) => {
    if (!src) return res(null);
    const i = new Image();
    i.onload = () => res(i);
    i.onerror = () => res(null);
    i.src = src;
  });
}

const App = {
  last: 0,

  boot() {
    Save.load();
    FX.init();
    this.glCanvas = document.getElementById('gl');
    this.scene = document.getElementById('scene');
    const ok = Post.init(this.glCanvas);
    if (ok) this.scene.style.display = 'none';
    else this.glCanvas.style.display = 'none';
    Render.init(this.scene);
    UI.init();
    Input.init(document.getElementById('stage'));
    this.resize();
    window.addEventListener('resize', () => this.resize());
    window.addEventListener('orientationchange', () => setTimeout(() => this.resize(), 120));
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        if (G.state === 'play') UI.pause();
        if (Sound.ac) Sound.ac.suspend().catch(() => {});
      } else if (Sound.ac) Sound.ac.resume().catch(() => {});
    });
    loadImage(ASSET_DATA.shard).then((i) => { Assets.shard = i; });
    loadImage(ASSET_DATA.capsule).then((i) => { Assets.capsule = i; });
    Game.start('attract');
    UI.show('title');
    requestAnimationFrame((t) => this.frame(t));
    Save.cloudInit();
    try { if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({ v: 1 })); } catch (e) { /* ignore */ }
  },

  resize() {
    const app = document.getElementById('app');
    const cw = Math.max(1, app.clientWidth), ch = Math.max(1, app.clientHeight);
    const SHORT = 480;
    let W, H;
    if (ch >= cw) { W = SHORT; H = clamp((SHORT * ch) / cw, SHORT * 1.15, SHORT * 2.3); }
    else { H = SHORT; W = clamp((SHORT * cw) / ch, SHORT * 1.15, SHORT * 1.95); }
    const css = Math.min(cw / W, ch / H);
    const dpr = Math.min(window.devicePixelRatio || 1, Quality.dprCap());
    G.W = W; G.H = H; G.css = css;
    G.offCssX = (cw - W * css) / 2;
    G.offCssY = (ch - H * css) / 2;
    const pw = Math.round(cw * dpr), ph = Math.round(ch * dpr);
    for (const c of [this.glCanvas, this.scene]) {
      if (c.width !== pw) c.width = pw;
      if (c.height !== ph) c.height = ph;
    }
    G.pxW = pw; G.pxH = ph;
    G.s = css * dpr;
    G.offX = G.offCssX * dpr;
    G.offY = G.offCssY * dpr;
    const hudCss = cw >= 720 ? 74 : 66;
    G.top = Math.max(0, (hudCss - G.offCssY) / css) + 8;
    Grid.build(W, H);
    if (Post.ok) Post.resize(pw, ph);
    this.measureFocus();
    if (G.player) {
      G.player.x = clamp(G.player.x, 16, G.W - 16);
      G.player.y = clamp(G.player.y, G.top, G.H - 16);
    }
  },

  // the visible band of arena between the logo and the menu on the title screen
  measureFocus() {
    const t = document.getElementById('title'), mid = t && t.querySelector('.title-mid');
    if (!mid || t.hidden) return;
    const r = mid.getBoundingClientRect();
    if (r.height > 0) G.focusY = clamp((r.top + r.height * 0.5 - G.offCssY) / G.css, G.top + 30, G.H - 40);
  },

  frame(now) {
    requestAnimationFrame((t) => this.frame(t));
    const dt = this.last ? Math.min(0.05, Math.max(0, (now - this.last) / 1000)) : 0.016;
    this.last = now;
    G.dp = dashParams();
    try {
      Game.update(dt);
      Render.draw();
      if (Post.ok && !Post.lost) {
        const P = Post.p;
        P.ca = Math.min(2, FX.ca * 0.8 + G.slowAmt * 0.3);
        P.flash = FX.flashA;
        P.flashCol = FX.flashCol;
        P.slow = G.slowAmt;
        P.vig = 0.5 + 0.3 * G.slowAmt;
        FX.writeWaves(P.waves);
        Post.present(this.scene, G.timeR);
      }
      UI.frame(dt);
    } catch (err) {
      if (!this.errLogged) { this.errLogged = true; console.error('[afterimage]', err); }
    }
    Quality.track(dt);
  },
};

function start() {
  App.boot();
}

if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
else start();

})();
</script>
