<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#07061a">
<title>Afterimage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Michroma&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: a full-bleed live arena; menus are glass slabs pinned to the top and bottom so the fight stays visible between them */
  --ink: #07061a;
  --ink-2: #100c2b;
  --danger: #ff2d7a;
  --core: #43f7ff;
  --loot: #ffc94a;
  --power: #a77bff;
  --text: #f3f0ff;
  --muted: #a49cd6;
  --line: rgba(167, 123, 255, 0.28);
  --display: "Michroma", "Eurostile", "Microgramma", "Arial Black", sans-serif;
  --body: "Chakra Petch", "Rajdhani", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}

html, body {
  height: 100%;
  margin: 0;
  background: var(--ink);
  color: var(--text);
  font-family: var(--body);
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
}

#app {
  position: fixed;
  inset: 0;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}

#gl, #scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
canvas.sw { display: block; flex: none; }
#stage { position: absolute; inset: 0; touch-action: none; }
.num { font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }

/* ---------------------------------------------------------- buttons */
.btn {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.btn:focus-visible, .icon-btn:focus-visible, .chip:focus-visible, .switch:focus-visible { outline: 2px solid var(--core); outline-offset: 3px; }

.btn.play {
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  width: 100%;
  min-height: 66px;
  border-radius: 14px;
  border: 1.5px solid var(--core);
  background: linear-gradient(180deg, rgba(67, 247, 255, 0.18), rgba(67, 247, 255, 0.04));
  box-shadow: 0 0 26px rgba(67, 247, 255, 0.22), inset 0 0 20px rgba(67, 247, 255, 0.14);
  transition: transform 0.12s ease, box-shadow 0.2s ease;
}
.btn.play:active { transform: scale(0.98); }
.btn.play::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(100deg, transparent 30%, rgba(255, 255, 255, 0.16) 50%, transparent 70%);
  transform: translateX(-100%);
  animation: sheen 3.4s ease-in-out infinite;
  pointer-events: none;
}
@keyframes sheen { 0%, 62% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
.play-label {
  font-family: var(--display);
  font-size: 21px;
  letter-spacing: 0.34em;
  padding-left: 0.34em;
  text-transform: uppercase;
  text-shadow: 0 0 14px rgba(67, 247, 255, 0.85);
}
.play-sub { font-size: 12px; color: var(--muted); letter-spacing: 0.05em; }

.btn.ghost {
  padding: 10px 12px;
  border-radius: 10px;
  color: var(--muted);
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.02em;
}
.btn.ghost:hover { color: var(--text); background: rgba(255, 255, 255, 0.05); }

.icon-btn {
  font: inherit;
  color: var(--text);
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 10px;
  width: 36px;
  height: 36px;
  display: inline-grid;
  place-items: center;
  cursor: pointer;
  padding: 0;
}
#b-pause { display: inline-flex; gap: 4px; justify-content: center; align-items: center; pointer-events: auto; margin-left: 6px; }
#b-pause span { width: 3px; height: 12px; border-radius: 2px; background: var(--text); }
.icon-btn.close { font-size: 22px; line-height: 1; }

.gem {
  display: inline-block;
  width: 9px;
  height: 9px;
  transform: rotate(45deg);
  border-radius: 2px;
  background: linear-gradient(135deg, #fff1b8, #ffb21e 55%, #ff7a00);
  box-shadow: 0 0 8px rgba(255, 201, 74, 0.8);
  flex: none;
}

/* ---------------------------------------------------------- screens */
.screen {
  position: absolute;
  inset: 0;
  z-index: 10;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  touch-action: pan-y;
  -webkit-overflow-scrolling: touch;
}
.screen.center { align-items: center; justify-content: center; background: rgba(4, 3, 14, 0.55); }

.slab {
  box-sizing: border-box;
  width: 100%;
  max-width: 560px;
  margin: 0 auto;
  display: grid;
  gap: 14px;
  padding: 16px 16px max(18px, env(safe-area-inset-bottom));
  border-radius: 22px 22px 0 0;
  border-top: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(14, 10, 38, 0.74), rgba(8, 6, 24, 0.95));
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
}

.label, .u-label {
  margin: 0;
  font-size: 11px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted);
}

/* title */
.title-top {
  padding: max(20px, 5vh) 16px 0;
  text-align: center;
  background: linear-gradient(180deg, rgba(7, 6, 26, 0.9), rgba(7, 6, 26, 0));
}
.logo-wrap { position: relative; width: min(92vw, 560px); margin: 0 auto; }
#logo {
  display: block;
  width: 100%;
  height: auto;
  filter: drop-shadow(0 0 calc(8px + var(--beat, 0) * 12px) rgba(255, 45, 122, 0.6));
}
.logo-wrap::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(105deg, transparent 38%, rgba(255, 255, 255, 0.75) 50%, transparent 62%);
  background-size: 260% 100%;
  animation: logosweep 5s ease-in-out infinite;
  -webkit-mask-image: var(--logo-mask);
  mask-image: var(--logo-mask);
  -webkit-mask-size: 100% 100%;
  mask-size: 100% 100%;
  mix-blend-mode: overlay;
  pointer-events: none;
}
@keyframes logosweep { 0%, 55% { background-position: 120% 0; } 100% { background-position: -20% 0; } }
.tag {
  margin: 12px 0 0;
  font-size: 12px;
  letter-spacing: 0.46em;
  padding-left: 0.46em;
  text-transform: uppercase;
  color: var(--muted);
}
.title-mid { flex: 1; min-height: 96px; display: flex; align-items: flex-end; justify-content: center; padding: 0 16px 12px; }
.best-line {
  margin: 0;
  padding: 6px 12px;
  border-radius: 99px;
  background: rgba(7, 6, 26, 0.6);
  border: 1px solid rgba(255, 255, 255, 0.08);
  font-size: 13px;
  color: var(--muted);
}
.best-line b { color: var(--text); font-weight: 700; }

.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn.mode {
  text-align: left;
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-height: 60px;
  padding: 10px 12px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.035);
}
.mode .m-name { font-family: var(--display); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; }
.mode .m-sub { font-size: 13px; color: var(--muted); line-height: 1.25; }
.mode.daily { border-color: rgba(255, 201, 74, 0.45); }
.mode.daily .m-name { color: var(--loot); }
.mode.hyper .m-name { color: var(--danger); }
.mode.hyper { border-color: rgba(255, 45, 122, 0.4); }
.mode.locked { opacity: 0.6; border-style: dashed; }
.mode .streak { color: var(--loot); font-weight: 600; }

.unlock { display: grid; gap: 6px; }
.u-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 13px; }
.u-row.small { font-size: 12px; color: var(--muted); }
.u-name { font-weight: 600; color: var(--text); }
.bar { position: relative; height: 8px; border-radius: 99px; background: rgba(255, 255, 255, 0.07); overflow: hidden; }
.bar > i {
  position: absolute;
  inset: 0 auto 0 0;
  width: 0;
  border-radius: inherit;
  background: linear-gradient(90deg, #ff8a1e, var(--loot));
  box-shadow: 0 0 12px rgba(255, 201, 74, 0.6);
}
.bar.thin { height: 3px; }
.bar.thin > i { background: var(--power); box-shadow: none; }

.missions-wrap { display: grid; gap: 8px; }
.missions { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; }
.missions li { display: grid; grid-template-columns: 1fr auto; gap: 5px 12px; align-items: center; font-size: 13px; line-height: 1.3; }
.missions .m-text { min-width: 0; }
.missions .m-best { color: var(--muted); font-size: 12px; }
.missions .bar { grid-column: 1; }
.missions .reward { grid-column: 2; grid-row: 1 / span 2; display: inline-flex; align-items: center; gap: 5px; font-weight: 700; color: var(--loot); font-size: 13px; }

.foot { display: flex; justify-content: space-between; gap: 4px; flex-wrap: wrap; margin: 0 -8px; }
.foot .btn.ghost { font-size: 13px; padding: 8px; }

/* ---------------------------------------------------------- HUD */
#hud {
  position: absolute;
  top: 0; left: 0; right: 0;
  z-index: 5;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: start;
  padding: 10px 12px 0;
  pointer-events: none;
}
.hud-l { display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
#h-time { font-size: 16px; font-weight: 600; color: var(--text); letter-spacing: 0; text-transform: none; }
#h-best { font-size: 11px; letter-spacing: 0.04em; text-transform: none; }
#h-best.close { color: var(--loot); }
#h-best.won { color: var(--loot); font-weight: 700; text-shadow: 0 0 10px rgba(255, 201, 74, 0.7); }
.hud-c { display: flex; flex-direction: column; align-items: center; }
#h-score { font-size: 30px; font-weight: 700; line-height: 1; text-shadow: 0 0 18px rgba(67, 247, 255, 0.35); }
.hud-mult { position: relative; width: 38px; height: 38px; margin-top: 5px; display: grid; place-items: center; transition: transform 0.15s ease; }
.hud-mult svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.hud-mult .trk { fill: none; stroke: rgba(255, 255, 255, 0.1); stroke-width: 3; }
.hud-mult .rb { fill: none; stroke: var(--core); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 94.25; stroke-dashoffset: 94.25; }
#h-mult { font-weight: 700; font-size: 13px; }
.hud-mult.bump { animation: bump 0.35s cubic-bezier(0.2, 1.6, 0.4, 1); }
@keyframes bump { 0% { transform: scale(1.5); } 100% { transform: scale(1); } }
.hud-r { display: flex; align-items: center; justify-content: flex-end; gap: 6px; font-weight: 700; font-size: 16px; }
.hud-r.bump .gem { animation: gem 0.3s ease; }
@keyframes gem { 50% { transform: rotate(45deg) scale(1.6); } }
#h-powers { grid-column: 1 / -1; display: flex; justify-content: center; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.pw { display: inline-flex; align-items: center; gap: 4px; padding: 1px 9px 1px 1px; border-radius: 99px; background: rgba(167, 123, 255, 0.16); border: 1px solid rgba(167, 123, 255, 0.4); font-size: 12px; font-weight: 600; }
.pw img { width: 24px; height: 24px; }
.pw.shield { border-color: rgba(67, 247, 255, 0.5); background: rgba(67, 247, 255, 0.12); }

/* ---------------------------------------------------------- overlays */
#banner { position: absolute; left: 0; right: 0; top: 30%; z-index: 6; text-align: center; pointer-events: none; opacity: 0; }
#banner .b-main { font-family: var(--display); font-size: clamp(22px, 7vw, 38px); letter-spacing: 0.24em; padding-left: 0.24em; text-transform: uppercase; text-shadow: 0 0 24px currentColor; }
#banner .b-sub { margin-top: 8px; font-size: 12px; letter-spacing: 0.22em; padding-left: 0.22em; text-transform: uppercase; color: var(--muted); }
#banner.on { animation: banner 1.7s ease-out forwards; }
@keyframes banner {
  0% { opacity: 0; transform: scale(1.18); }
  12% { opacity: 1; transform: scale(1); }
  76% { opacity: 1; }
  100% { opacity: 0; transform: scale(0.98); }
}

#hint {
  position: absolute;
  left: 50%;
  top: 26%;
  z-index: 6;
  transform: translateX(-50%);
  width: max-content;
  max-width: min(86vw, 420px);
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 16px;
  border-radius: 14px;
  background: rgba(10, 8, 30, 0.8);
  border: 1px solid var(--line);
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.25s ease;
}
#hint.on { opacity: 1; }
.hint-text { margin: 0; font-size: 15px; line-height: 1.35; }
.hint-fig { display: none; position: relative; width: 34px; height: 34px; flex: none; }
#hint.fig .hint-fig { display: block; }
.hint-fig::before, .hint-fig::after { content: ""; position: absolute; }
#hint.swipe .hint-fig::before { left: 4px; top: 14px; width: 8px; height: 8px; border-radius: 50%; background: var(--core); box-shadow: 0 0 10px var(--core); animation: swipe 1.2s ease-in-out infinite; }
#hint.swipe .hint-fig::after { left: 4px; top: 17px; width: 26px; height: 2px; background: linear-gradient(90deg, rgba(67, 247, 255, 0.6), transparent); }
@keyframes swipe { 0% { transform: translateX(0); opacity: 0; } 20% { opacity: 1; } 70% { transform: translateX(20px); opacity: 1; } 100% { transform: translateX(20px); opacity: 0; } }
#hint.ring .hint-fig::before, #hint.bomb .hint-fig::before { inset: 0; border-radius: 50%; border: 2px solid var(--danger); animation: close 1.2s ease-in infinite; }
#hint.ring .hint-fig::after, #hint.bomb .hint-fig::after { left: 13px; top: 13px; width: 8px; height: 8px; border-radius: 50%; background: var(--core); }
@keyframes close { 0% { transform: scale(1.6); opacity: 0.2; } 100% { transform: scale(0.5); opacity: 1; } }

#toasts { position: absolute; top: 206px; left: 0; right: 0; z-index: 7; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
.toast { padding: 6px 13px; border-radius: 99px; background: rgba(12, 9, 34, 0.88); border: 1px solid rgba(255, 201, 74, 0.55); font-size: 13px; font-weight: 600; animation: toast 2.4s ease forwards; }
.toast.phase { border-color: rgba(67, 247, 255, 0.5); }
@keyframes toast { 0% { opacity: 0; transform: translateY(-8px); } 10%, 80% { opacity: 1; transform: none; } 100% { opacity: 0; } }

#roulette {
  position: absolute;
  left: 50%;
  top: 152px;
  z-index: 7;
  transform: translateX(-50%) scale(0.9);
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 5px 16px 5px 5px;
  border-radius: 99px;
  background: rgba(12, 9, 34, 0.9);
  border: 1px solid rgba(167, 123, 255, 0.55);
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.18s ease, transform 0.18s ease;
}
#roulette.on { opacity: 1; transform: translateX(-50%) scale(1); }
#roulette img { width: 46px; height: 46px; }
#roulette img.tick { animation: tick 0.08s ease; }
@keyframes tick { 0% { transform: translateY(-5px); } 100% { transform: none; } }
.r-name { font-family: var(--display); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; min-height: 1em; }
.r-desc { font-size: 12px; color: var(--muted); min-height: 1em; }
#roulette.rare { border-color: var(--core); box-shadow: 0 0 24px rgba(67, 247, 255, 0.35); }
#roulette.legendary { border-color: var(--loot); box-shadow: 0 0 34px rgba(255, 201, 74, 0.55); }
#roulette.legendary .r-name { color: var(--loot); }

/* ---------------------------------------------------------- game over */
#over { justify-content: flex-end; pointer-events: none; }
#over .over-slab { pointer-events: auto; }
.over-slab { gap: 12px; animation: rise 0.35s cubic-bezier(0.2, 0.9, 0.3, 1); }
@keyframes rise { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.o-head { margin: 0; text-align: center; font-family: var(--display); font-size: 12px; letter-spacing: 0.32em; padding-left: 0.32em; text-transform: uppercase; color: var(--muted); }
.o-head.best { color: var(--loot); text-shadow: 0 0 16px rgba(255, 201, 74, 0.8); }
.o-score { margin: 0; text-align: center; font-size: clamp(46px, 14vw, 66px); font-weight: 700; line-height: 1; text-shadow: 0 0 26px rgba(67, 247, 255, 0.35); }
.o-near { margin: 0; text-align: center; font-size: 14px; min-height: 1.3em; }
.o-near.hot { color: var(--loot); }
.o-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 0; }
.o-stats > div { padding: 8px 4px; border-radius: 10px; background: rgba(255, 255, 255, 0.04); text-align: center; }
.o-stats dt { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.o-stats dd { margin: 3px 0 0; font-size: 17px; font-weight: 700; }
.o-earn { display: grid; gap: 6px; }
.o-gain { display: inline-flex; align-items: center; gap: 6px; font-size: 17px; font-weight: 700; color: var(--loot); }
.o-breakdown { margin: -2px 0 0; font-size: 12px; color: var(--muted); }
.o-unlock {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px;
  border-radius: 14px;
  border: 1px solid rgba(255, 201, 74, 0.6);
  background: radial-gradient(120% 140% at 0% 0%, rgba(255, 201, 74, 0.18), rgba(255, 201, 74, 0.03));
  animation: pop 0.5s cubic-bezier(0.2, 1.5, 0.4, 1);
}
@keyframes pop { from { transform: scale(0.85); opacity: 0; } to { transform: none; opacity: 1; } }
.o-unlock .sw { width: 40px; height: 40px; flex: none; }
.o-unlock .u-txt { flex: 1; min-width: 0; }
.o-unlock .u-title { font-family: var(--display); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--loot); }
.o-unlock .u-what { font-weight: 700; font-size: 15px; }
.o-unlock .u-desc { font-size: 12px; color: var(--muted); }
.chip { font: inherit; font-size: 13px; font-weight: 700; color: var(--ink); background: var(--loot); border: 0; border-radius: 99px; padding: 7px 12px; cursor: pointer; }
.chip:disabled { background: rgba(255, 255, 255, 0.12); color: var(--muted); cursor: default; }
.o-missions { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 13px; }
.o-missions li { display: flex; align-items: center; gap: 8px; }
.o-missions .tick { width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; background: rgba(125, 255, 178, 0.18); color: #7dffb2; font-size: 11px; flex: none; }
.o-missions .tick.near { background: rgba(167, 123, 255, 0.2); color: var(--power); }
.o-missions .rw { margin-left: auto; color: var(--loot); font-weight: 700; }
.o-actions { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: stretch; }
.o-side { display: flex; flex-direction: column; justify-content: center; }

/* ---------------------------------------------------------- pause & sheets */
.card { box-sizing: border-box; width: min(92vw, 380px); display: grid; gap: 14px; padding: 20px; border-radius: 20px; background: rgba(14, 10, 38, 0.94); border: 1px solid var(--line); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.toggles { display: grid; gap: 4px; }
.switch {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  width: 100%;
  padding: 10px 2px;
  font: inherit;
  font-size: 15px;
  color: var(--text);
  background: none;
  border: 0;
  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  cursor: pointer;
  text-align: left;
}
.switch .knob { position: relative; width: 40px; height: 22px; border-radius: 99px; background: rgba(255, 255, 255, 0.14); transition: background 0.2s; flex: none; }
.switch .knob::after { content: ""; position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform 0.2s; }
.switch[aria-checked="true"] .knob { background: var(--core); }
.switch[aria-checked="true"] .knob::after { transform: translateX(18px); }

.sheet { position: absolute; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; background: rgba(4, 3, 14, 0.62); }
.sheet-card {
  box-sizing: border-box;
  width: 100%;
  max-width: 560px;
  max-height: 86%;
  overflow-y: auto;
  padding: 16px 16px max(18px, env(safe-area-inset-bottom));
  border-radius: 22px 22px 0 0;
  border: 1px solid var(--line);
  border-bottom: 0;
  background: var(--ink-2);
  touch-action: pan-y;
  animation: rise 0.28s cubic-bezier(0.2, 0.9, 0.3, 1);
}
.sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.sheet-head h2 { margin: 0; font-family: var(--display); font-size: 14px; font-weight: 400; letter-spacing: 0.2em; text-transform: uppercase; }
.sec { margin: 18px 0 8px; }
.sec:first-child { margin-top: 0; }
.skins { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.skin {
  font: inherit;
  color: var(--text);
  display: grid;
  justify-items: center;
  gap: 6px;
  padding: 12px 6px 10px;
  border-radius: 12px;
  border: 1px solid rgba(255, 255, 255, 0.1);
  background: rgba(255, 255, 255, 0.03);
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
}
.skin[aria-pressed="true"] { border-color: var(--core); box-shadow: 0 0 0 1px var(--core) inset; }
.skin:disabled { opacity: 0.45; cursor: default; }
.skin .sw { width: 34px; height: 34px; }
.skin small { font-size: 11px; color: var(--muted); font-weight: 500; }
.perks { display: grid; gap: 8px; }
.perk {
  font: inherit;
  color: var(--text);
  text-align: left;
  display: grid;
  gap: 2px;
  padding: 10px 12px;
  border-radius: 12px;
  border: 1px solid rgba(255, 255, 255, 0.1);
  background: rgba(255, 255, 255, 0.03);
  cursor: pointer;
}
.perk b { font-size: 14px; }
.perk span { font-size: 13px; color: var(--muted); }
.perk[aria-pressed="true"] { border-color: var(--power); box-shadow: 0 0 0 1px var(--power) inset; }
.perk:disabled { opacity: 0.45; cursor: default; }
.help { margin: 0; padding: 0 0 0 18px; display: grid; gap: 10px; font-size: 14px; line-height: 1.45; }
.help b { color: var(--core); }
.records { width: 100%; border-collapse: collapse; font-size: 14px; }
.records th { text-align: left; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); font-weight: 500; padding: 6px 4px; }
.records td { padding: 8px 4px; border-top: 1px solid rgba(255, 255, 255, 0.06); font-variant-numeric: tabular-nums; }
.records td:first-child { font-weight: 700; }
.kv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kv div { padding: 10px; border-radius: 12px; background: rgba(255, 255, 255, 0.04); }
.kv dt { font-size: 11px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
.kv dd { margin: 4px 0 0; font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
.danger-btn { color: var(--danger) !important; }
.note { font-size: 12px; color: var(--muted); margin: 10px 0 0; }

@media (min-width: 720px) {
  .title-top { padding-top: 6vh; }
  #hud { padding: 16px 22px 0; }
  #h-score { font-size: 36px; }
}

@media (max-height: 640px) {
  .missions-wrap { display: none; }
  .title-mid { min-height: 40px; }
}

@media (prefers-reduced-motion: reduce) {
  .btn.play::after, .logo-wrap::after { animation: none; display: none; }
  #banner.on { animation-duration: 2.2s; }
  .over-slab, .sheet-card, .o-unlock { animation: none; }
}

/* ---------------------------------------------------------- v2: burst, bosses, upgrade cards */
.burst-meter { width: 64px; height: 4px; margin-top: 6px; border-radius: 99px; background: rgba(255, 255, 255, 0.1); overflow: hidden; }
.burst-meter > i { display: block; width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--core), #ffffff); box-shadow: 0 0 8px rgba(67, 247, 255, 0.8); }
.burst-btn {
  position: absolute;
  right: 18px;
  bottom: max(26px, env(safe-area-inset-bottom));
  z-index: 6;
  width: 82px;
  height: 82px;
  border-radius: 50%;
  border: 2px solid var(--core);
  background: radial-gradient(circle, rgba(67, 247, 255, 0.4), rgba(7, 6, 26, 0.88) 70%);
  color: #fff;
  font-family: var(--display);
  font-size: 11px;
  letter-spacing: 0.18em;
  padding: 0 0 0 0.18em;
  text-transform: uppercase;
  box-shadow: 0 0 30px rgba(67, 247, 255, 0.55);
  cursor: pointer;
  touch-action: none;
  animation: burstpulse 1s ease-in-out infinite;
}
@keyframes burstpulse { 50% { transform: scale(1.08); box-shadow: 0 0 48px rgba(67, 247, 255, 0.85); } }
#boss { position: absolute; left: 50%; top: 120px; z-index: 5; transform: translateX(-50%); width: min(70vw, 320px); text-align: center; pointer-events: none; }
.boss-name { margin-bottom: 5px; font-family: var(--display); font-size: 11px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--danger); text-shadow: 0 0 10px rgba(255, 45, 122, 0.7); }
.boss-bar { height: 6px; border-radius: 99px; overflow: hidden; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 45, 122, 0.4); }
.boss-bar > i { display: block; width: 100%; height: 100%; background: linear-gradient(90deg, #ff2d7a, #ff8cba); transition: width 0.25s ease; }
.pick { z-index: 12; background: rgba(4, 3, 14, 0.72); }
.pick-wrap { box-sizing: border-box; width: min(94vw, 560px); display: grid; gap: 12px; padding: 16px; }
.pick-cards { display: grid; gap: 10px; }
.pick-note { margin: 0; text-align: center; font-size: 12px; color: var(--muted); }
.card {
  position: relative;
  display: grid;
  grid-template-columns: 44px 1fr;
  column-gap: 12px;
  align-items: center;
  padding: 12px 14px;
  border-radius: 14px;
  border: 1px solid rgba(255, 255, 255, 0.14);
  background: rgba(16, 12, 43, 0.96);
  color: var(--text);
  font: inherit;
  text-align: left;
  cursor: pointer;
  animation: pop 0.35s cubic-bezier(0.2, 1.4, 0.4, 1) backwards;
}
.card:nth-child(2) { animation-delay: 0.06s; }
.card:nth-child(3) { animation-delay: 0.12s; }
.card:active { transform: scale(0.98); }
.card .c-icon { grid-row: 1 / span 3; width: 40px; height: 40px; color: var(--power); }
.card .c-name { font-size: 16px; font-weight: 700; }
.card .c-desc { font-size: 13px; line-height: 1.35; color: var(--muted); }
.card .c-lvl { margin-top: 2px; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.card .c-key { position: absolute; top: 10px; right: 12px; font-size: 11px; color: var(--muted); opacity: 0.7; }
.card.rare { border-color: rgba(67, 247, 255, 0.5); }
.card.rare .c-icon { color: var(--core); }
.card.epic { border-color: rgba(255, 201, 74, 0.65); box-shadow: 0 0 22px rgba(255, 201, 74, 0.18); }
.card.epic .c-icon { color: var(--loot); }
.o-build { margin: 0; text-align: center; font-size: 12px; line-height: 1.4; color: var(--muted); }
@media (hover: none) { .card .c-key { display: none; } }
@media (prefers-reduced-motion: reduce) { .burst-btn, .card { animation: none; } }

</style>
</head>
<body>
<div id="app">
  <canvas id="gl" aria-hidden="true"></canvas>
  <canvas id="scene" aria-hidden="true"></canvas>
  <div id="stage" aria-label="Arena"></div>

  <div id="hud" hidden>
    <div class="hud-l">
      <span id="h-time" class="num">0:00.0</span>
      <span id="h-phase">Phase 1</span>
      <span id="h-best" class="num"></span>
    </div>
    <div class="hud-c">
      <span id="h-score" class="num">0</span>
      <div class="hud-mult" id="h-multbox">
        <svg viewBox="0 0 36 36" aria-hidden="true"><circle class="trk" cx="18" cy="18" r="15"></circle><circle id="h-ring" class="rb" cx="18" cy="18" r="15"></circle></svg>
        <span id="h-mult" class="num">×1</span>
      </div>
      <div class="burst-meter" aria-hidden="true"><i id="h-burst"></i></div>
    </div>
    <div class="hud-r">
      <span class="gem" aria-hidden="true"></span><span id="h-shards" class="num">0</span>
      <button id="b-pause" class="icon-btn" type="button" aria-label="Pause"><span></span><span></span></button>
    </div>
    <div id="h-powers"></div>
  </div>

  <button id="b-burst" class="burst-btn" type="button" hidden>Burst</button>
  <div id="boss" hidden><div class="boss-name"></div><div class="boss-bar"><i></i></div></div>
  <div id="banner" aria-live="polite"><div class="b-main"></div><div class="b-sub"></div></div>
  <div id="hint" role="status"><div class="hint-fig" aria-hidden="true"></div><p class="hint-text"></p></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="roulette" aria-live="polite"><img alt=""><div><div class="r-name"></div><div class="r-desc"></div></div></div>

  <section id="title" class="screen">
    <header class="title-top">
      <div class="logo-wrap"><img id="logo" alt="Afterimage"></div>
      <p class="tag">Dash at the last instant</p>
    </header>
    <div class="title-mid"><p id="t-best" class="best-line"></p></div>
    <div class="slab">
      <button id="b-play" class="btn play" type="button"><span class="play-label">Play</span><span id="play-sub" class="play-sub"></span></button>
      <div class="modes">
        <button id="b-daily" class="btn mode daily" type="button"></button>
        <button id="b-hyper" class="btn mode hyper" type="button"></button>
      </div>
      <div class="unlock" id="t-unlock"></div>
      <div class="missions-wrap">
        <p class="label">Missions</p>
        <ol id="t-missions" class="missions"></ol>
      </div>
      <nav class="foot">
        <button id="b-loadout" class="btn ghost" type="button">Loadout</button>
        <button id="b-records" class="btn ghost" type="button">Records</button>
        <button id="b-help" class="btn ghost" type="button">How to play</button>
        <button id="b-settings" class="btn ghost" type="button">Settings</button>
      </nav>
    </div>
  </section>

  <section id="over" class="screen" hidden>
    <div class="slab over-slab">
      <p id="o-head" class="o-head">Run over</p>
      <p id="o-score" class="o-score num">0</p>
      <p id="o-near" class="o-near"></p>
      <dl class="o-stats">
        <div><dt>Time</dt><dd id="o-time" class="num">0:00</dd></div>
        <div><dt>Phase</dt><dd id="o-phase" class="num">1</dd></div>
        <div><dt>Perfect</dt><dd id="o-perf" class="num">0</dd></div>
        <div><dt>Best ×</dt><dd id="o-mult" class="num">1</dd></div>
      </dl>
      <p id="o-build" class="o-build" hidden></p>
      <div class="o-earn">
        <div class="u-row"><span class="u-label">Shards earned</span><span class="o-gain"><span class="gem" aria-hidden="true"></span><span id="o-shards" class="num">+0</span></span></div>
        <p id="o-breakdown" class="o-breakdown"></p>
        <div class="bar gold"><i id="o-bar"></i></div>
        <div class="u-row small"><span id="o-next"></span><span id="o-count" class="num"></span></div>
      </div>
      <div id="o-unlock" class="o-unlock" hidden></div>
      <ul id="o-missions" class="o-missions"></ul>
      <div class="o-actions">
        <button id="b-retry" class="btn play" type="button"><span class="play-label">Retry</span><span id="retry-sub" class="play-sub"></span></button>
        <div class="o-side">
          <button id="b-copy" class="btn ghost" type="button" hidden>Copy result</button>
          <button id="b-menu" class="btn ghost" type="button">Menu</button>
        </div>
      </div>
    </div>
  </section>

  <section id="pick" class="screen center pick" hidden>
    <div class="pick-wrap">
      <p class="o-head">Choose an upgrade</p>
      <div id="pick-cards" class="pick-cards"></div>
      <p class="pick-note">It lasts for the rest of this run</p>
    </div>
  </section>

  <section id="pause" class="screen center" hidden>
    <div class="card">
      <p class="o-head">Paused</p>
      <button id="b-resume" class="btn play" type="button"><span class="play-label">Resume</span></button>
      <div class="row2">
        <button id="b-restart" class="btn ghost" type="button">Restart</button>
        <button id="b-quit" class="btn ghost" type="button">Quit to menu</button>
      </div>
      <div id="pause-toggles" class="toggles"></div>
    </div>
  </section>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-head"><h2 id="sheet-title"></h2><button id="sheet-close" class="icon-btn close" type="button" aria-label="Close">×</button></div>
      <div id="sheet-body"></div>
    </div>
  </div>
</div>
<script>

// ---------------------------------------------------------------- util.js
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const sat = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);
const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
const easeInCubic = (t) => t * t * t;
const easeOutQuad = (t) => 1 - (1 - t) * (1 - t);
const easeInOutSine = (t) => -(Math.cos(Math.PI * t) - 1) / 2;
const easeOutBack = (t) => {
  const c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
};
const easeOutElastic = (t) => {
  if (t <= 0) return 0;
  if (t >= 1) return 1;
  return Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (TAU / 3)) + 1;
};

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

class RNG {
  constructor(seed) { this.f = mulberry32(seed >>> 0); }
  next() { return this.f(); }
  range(a, b) { return a + (b - a) * this.f(); }
  int(a, b) { return Math.floor(a + (b - a + 1) * this.f()); }
  pick(arr) { return arr[Math.floor(this.f() * arr.length)]; }
  chance(p) { return this.f() < p; }
  sign() { return this.f() < 0.5 ? -1 : 1; }
  weighted(items, wf) {
    let total = 0;
    for (const it of items) total += Math.max(0, wf(it));
    if (total <= 0) return items[0];
    let r = this.f() * total;
    for (const it of items) {
      r -= Math.max(0, wf(it));
      if (r <= 0) return it;
    }
    return items[items.length - 1];
  }
}

const rnd = (a, b) => a + (b - a) * Math.random();
const rndi = (a, b) => Math.floor(a + (b - a + 1) * Math.random());

function dist(ax, ay, bx, by) { return Math.hypot(ax - bx, ay - by); }

function distToSegment(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  const l2 = dx * dx + dy * dy;
  let t = l2 > 0 ? ((px - ax) * dx + (py - ay) * dy) / l2 : 0;
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
}

// distance from point to infinite line through (x0,y0) with unit direction (ux,uy)
function distToLine(px, py, x0, y0, ux, uy) {
  return Math.abs((px - x0) * uy - (py - y0) * ux);
}

function angDiff(a, b) {
  let d = (b - a) % TAU;
  if (d > Math.PI) d -= TAU;
  if (d < -Math.PI) d += TAU;
  return d;
}

// clip infinite line (point + unit dir) to rectangle, returns [x1,y1,x2,y2] or null
function clipLineToRect(x0, y0, ux, uy, minX, minY, maxX, maxY) {
  let t0 = -1e9, t1 = 1e9;
  const clipAxis = (p, d, lo, hi) => {
    if (Math.abs(d) < 1e-9) return p >= lo && p <= hi;
    let a = (lo - p) / d, b = (hi - p) / d;
    if (a > b) { const t = a; a = b; b = t; }
    t0 = Math.max(t0, a);
    t1 = Math.min(t1, b);
    return t0 <= t1;
  };
  if (!clipAxis(x0, ux, minX, maxX)) return null;
  if (!clipAxis(y0, uy, minY, maxY)) return null;
  return [x0 + ux * t0, y0 + uy * t0, x0 + ux * t1, y0 + uy * t1];
}

function pad2(n) { return n < 10 ? '0' + n : '' + n; }

function todayKey(d) {
  d = d || new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}

function keyToDate(k) {
  const [y, m, d] = k.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function dayDiff(a, b) {
  // whole days from key a to key b
  return Math.round((keyToDate(b) - keyToDate(a)) / 86400000);
}

function dailyNumber(k) {
  return dayDiff('2026-11-01', k) + 1;
}

function fmtNum(n) {
  return Math.floor(n).toLocaleString('en-US');
}

function fmtTime(s) {
  s = Math.max(0, s);
  const m = Math.floor(s / 60);
  const sec = s - m * 60;
  return m + ':' + (sec < 10 ? '0' : '') + sec.toFixed(1);
}

function fmtDate(k) {
  const d = keyToDate(k);
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

// ---- colour helpers
const _rgbCache = new Map();
function hexRgb(hex) {
  let c = _rgbCache.get(hex);
  if (c) return c;
  const h = hex.replace('#', '');
  c = [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
  _rgbCache.set(hex, c);
  return c;
}
function rgba(hex, a) {
  const c = hexRgb(hex);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + (a < 0 ? 0 : a > 1 ? 1 : a).toFixed(3) + ')';
}
function mixHex(a, b, t) {
  const x = hexRgb(a), y = hexRgb(b);
  const r = Math.round(lerp(x[0], y[0], t)), g = Math.round(lerp(x[1], y[1], t)), bl = Math.round(lerp(x[2], y[2], t));
  return '#' + ((1 << 24) | (r << 16) | (g << 8) | bl).toString(16).slice(1);
}
function hsl(h, s, l, a) {
  return 'hsla(' + (((h % 360) + 360) % 360).toFixed(1) + ',' + s + '%,' + l + '%,' + (a === undefined ? 1 : a) + ')';
}

const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}

const prefersReducedMotion = (() => {

const isTouchDevice = (() => {

function vibrate(ms) {
  if (!Save.data.settings.haptics) return;
  try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) { /* ignored */ }
}

function missionStep(type, lvl) {
  const d = MISSIONS[type];
  if (lvl < d.steps.length) return { target: d.steps[lvl], reward: d.rewards[lvl] };
  const extra = lvl - d.steps.length + 1;
  const last = d.steps[d.steps.length - 1];
  const lastR = d.rewards[d.rewards.length - 1];
  const target = type === 'mult' ? Math.min(10, last + extra) : Math.round(last * Math.pow(1.35, extra));
  return { target, reward: Math.round(lastR * Math.pow(1.2, extra)) };
}

// ---------------------------------------------------------------- save.js
const SAVE_KEY = 'afterimage.save.v1';

function defaultSave() {
  return {
    v: 1,
    shardsTotal: 0,
    unlocked: {},
    equipped: { skin: 'core', perk: 'none', track: 'neon' },
    best: { score: 0, time: 0, phase: 1, mult: 1, perfects: 0 },
    hyperBest: 0,
    top: [],
    stats: { runs: 0, time: 0, perfects: 0, dodges: 0, grazes: 0, capsules: 0, shards: 0, bosses: 0, bursts: 0 },
    daily: { date: '', best: 0, runs: 0, streak: 0, lastPlayed: '' },
    missions: null,
    mlevels: {},
    seen: {},
    settings: { sound: true, music: true, shake: !prefersReducedMotion, flashes: !prefersReducedMotion, haptics: true },
    updated: 0,
  };
}

function deepFill(target, defaults) {
  for (const k in defaults) {
    const dv = defaults[k];
    if (target[k] === undefined || target[k] === null) {
      if (dv !== null) target[k] = JSON.parse(JSON.stringify(dv));
      else target[k] = null;
    } else if (dv && typeof dv === 'object' && !Array.isArray(dv) && typeof target[k] === 'object') {
      deepFill(target[k], dv);
    }
  }
  return target;
}

function mergeSaves(a, b) {
  // combine two saves without losing progress from either device
  a = deepFill(JSON.parse(JSON.stringify(a)), defaultSave());
  b = deepFill(JSON.parse(JSON.stringify(b)), defaultSave());
  const newer = (b.updated || 0) > (a.updated || 0) ? b : a;
  const out = JSON.parse(JSON.stringify(newer));
  out.shardsTotal = Math.max(a.shardsTotal, b.shardsTotal);
  out.unlocked = Object.assign({}, a.unlocked, b.unlocked);
  out.seen = Object.assign({}, a.seen, b.seen);
  for (const k in out.best) out.best[k] = Math.max(a.best[k] || 0, b.best[k] || 0);
  for (const k in out.stats) out.stats[k] = Math.max(a.stats[k] || 0, b.stats[k] || 0);
  out.hyperBest = Math.max(a.hyperBest || 0, b.hyperBest || 0);
  const seenTop = new Set();
  out.top = a.top.concat(b.top).filter((r) => {
    const key = r.score + '|' + r.date + '|' + r.time;
    if (seenTop.has(key)) return false;
    seenTop.add(key);
    return true;
  }).sort((x, y) => y.score - x.score).slice(0, 5);
  const mlv = {};
  for (const k of new Set(Object.keys(a.mlevels).concat(Object.keys(b.mlevels)))) mlv[k] = Math.max(a.mlevels[k] || 0, b.mlevels[k] || 0);
  out.mlevels = mlv;
  if (a.daily.date === b.daily.date) {
    out.daily.best = Math.max(a.daily.best, b.daily.best);
    out.daily.runs = Math.max(a.daily.runs, b.daily.runs);
  } else {
    out.daily = JSON.parse(JSON.stringify(a.daily.date > b.daily.date ? a.daily : b.daily));
  }
  const la = a.daily.lastPlayed || '', lb = b.daily.lastPlayed || '';
  if (la === lb) out.daily.streak = Math.max(a.daily.streak, b.daily.streak);
  else { const src = la > lb ? a : b; out.daily.streak = src.daily.streak; out.daily.lastPlayed = src.daily.lastPlayed; }
  out.updated = Math.max(a.updated || 0, b.updated || 0);
  return out;
}

const Save = {
  data: defaultSave(),
  cloud: { ref: null, ready: false, writing: false, pending: false, lastJson: '', failed: 0 },

  load() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (raw) this.data = deepFill(JSON.parse(raw), defaultSave());
    } catch (e) { /* storage unavailable: play on with a fresh save */ }
    this.sanitize();
  },

  sanitize() {
    const d = this.data;
    if (!isUnlocked('skin', d.equipped.skin)) d.equipped.skin = 'core';
    if (!isUnlocked('perk', d.equipped.perk)) d.equipped.perk = 'none';
    if (!d.equipped.track || !isUnlocked('track', d.equipped.track)) d.equipped.track = 'neon';
    applyUnlocks();
    ensureMissions();
  },

  persistLocal() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(this.data)); } catch (e) { /* ignore */ }
  },

  persist() {
    this.data.updated = Date.now();
    this.persistLocal();
    this.cloudWrite();
  },

  async cloudInit() {
    try {
      const cl = window.__asafClaude || window.claude;
      if (!cl || typeof cl.use !== 'function') return;
      const [db, user] = await Promise.all([cl.use('db'), cl.use('user')]);
      if (!db || !user) return;
      const id = await user.id();
      if (!id) return;
      const ref = db.doc('data/users/' + id + '/save');
      let timer = 0;
      const snap = await Promise.race([
        ref.get(),
        new Promise((_, rej) => { timer = setTimeout(() => rej(new Error('timeout')), 10000); }),
      ]);
      clearTimeout(timer);
      this.cloud.ref = ref;
      if (snap && snap.exists) {
        const body = snap.data();
        if (body && body.save && typeof body.save === 'object') {
          const remote = JSON.parse(JSON.stringify(body.save));
          this.cloud.lastJson = JSON.stringify(remote);
          this.data = mergeSaves(this.data, remote);
          this.sanitize();
          this.persistLocal();
          if (typeof UI !== 'undefined' && UI.refreshTitle) UI.refreshTitle();
        }
      }
      this.cloud.ready = true;
      this.cloudWrite();
    } catch (e) {
      console.warn('[afterimage] cloud save unavailable:', e && (e.code || e.message));
    }
  },

  cloudWrite() {
    const c = this.cloud;
    if (!c.ref || !c.ready) return;
    if (c.writing) { c.pending = true; return; }
    const json = JSON.stringify(this.data);
    if (json === c.lastJson) return;
    c.writing = true;
    c.ref.set({ save: JSON.parse(json) })
      .then(() => { c.lastJson = json; c.failed = 0; })
      .catch((e) => {
        const code = e && e.code;
        c.failed++;
        if (code === 'unavailable' && c.failed < 3) {
          setTimeout(() => this.cloudWrite(), 1500 + Math.random() * 1500);
        } else if (code && code !== 'unavailable' && code !== 'resource_exhausted') {
          c.ref = null; // no access in this view: stay local
        }
      })
      .finally(() => {
        c.writing = false;
        if (c.pending) { c.pending = false; this.cloudWrite(); }
      });
  },
};

// ---- unlocks
function isUnlocked(kind, id) {
  if (kind === 'skin' && id === 'core') return true;
  if (kind === 'perk' && id === 'none') return true;
  if (kind === 'track' && id === 'neon') return true;
  return !!Save.data.unlocked[kind + ':' + id];
}

function applyUnlocks() {
  const fresh = [];
  for (const u of UNLOCKS) {
    const key = u.kind + ':' + u.id;
    if (Save.data.shardsTotal >= u.at && !Save.data.unlocked[key]) {
      Save.data.unlocked[key] = true;
      fresh.push(u);
    }
  }
  return fresh;
}

function unlockProgress(total) {
  let prev = 0;
  for (const u of UNLOCKS) {
    if (u.at > total) return { next: u, prev, frac: (total - prev) / (u.at - prev) };
    prev = u.at;
  }
  return { next: null, prev, frac: 1 };
}

// ---- missions
function newMission(exclude) {
  const today = todayKey();
  const types = Object.keys(MISSIONS).filter((t) => {
    if (exclude.includes(t)) return false;
    if (t === 'daily' && Save.data.daily.lastPlayed === today) return false;
    return true;
  });
  const type = types[Math.floor(Math.random() * types.length)];
  const lvl = Save.data.mlevels[type] || 0;
  const st = missionStep(type, lvl);
  return { type, lvl, target: st.target, reward: st.reward, progress: 0, done: false };
}

function ensureMissions() {
  const d = Save.data;
  if (!Array.isArray(d.missions)) d.missions = [];
  d.missions = d.missions.filter((m) => m && MISSIONS[m.type]);
  const today = todayKey();
  // a stale "play today's daily" from another day becomes a fresh mission
  d.missions = d.missions.filter((m) => !(m.type === 'daily' && d.daily.lastPlayed === today && !m.done));
  while (d.missions.length < 3) d.missions.push(newMission(d.missions.map((m) => m.type)));
}

function missionValue(m, R) {
  const def = MISSIONS[m.type];
  if (def.special) return R.mode === 'daily' ? 1 : 0;
  const v = R[def.stat] || 0;
  return def.total ? m.progress + v : v;
}

function missionLabel(m) {
  return MISSIONS[m.type].label(m.target);
}

// ---------------------------------------------------------------- audio.js
const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);

const Sound = {
  ac: null, ok: false,
  master: null, musicBus: null, musicLP: null, pump: null, drums: null, sfx: null, revIn: null, delIn: null, noise: null,
  musicOn: true, sfxOn: true, detune: 0, last: {},

  ensure() {
    if (this.ac) {
      if (this.ac.state === 'suspended') this.ac.resume().catch(() => {});
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { this.ac = new AC({ latencyHint: 'interactive' }); } catch (e) {
      try { this.ac = new AC(); } catch (e2) { return; }
    }
    try { this.build(); this.ok = true; } catch (e) { console.warn('[afterimage] audio off', e); this.ok = false; }
    if (this.ac.state === 'suspended') this.ac.resume().catch(() => {});
    if (this.ok && Music.playing) {
      this.setDelayTime(60 / Music.bpm);
      this.musicFilter(Music.level === 0 ? 2600 : 18000, 0.05);
    }
  },

  build() {
    const ac = this.ac;
    this.master = ac.createGain();
    this.master.gain.value = 0.9;
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 14; comp.ratio.value = 4;
    comp.attack.value = 0.003; comp.release.value = 0.18;
    this.master.connect(comp);
    comp.connect(ac.destination);

    this.musicBus = ac.createGain();
    this.musicBus.gain.value = 0.48;
    this.musicLP = ac.createBiquadFilter();
    this.musicLP.type = 'lowpass';
    this.musicLP.frequency.value = 18000;
    this.musicLP.Q.value = 0.8;
    this.musicBus.connect(this.musicLP);
    this.musicLP.connect(this.master);
    this.pump = ac.createGain();
    this.pump.connect(this.musicBus);
    this.drums = ac.createGain();
    this.drums.connect(this.musicBus);

    this.sfx = ac.createGain();
    this.sfx.gain.value = 0.75;
    this.sfx.connect(this.master);

    const rev = ac.createConvolver();
    rev.buffer = this.impulse(2.6, 2.4);
    this.revIn = ac.createGain();
    this.revIn.connect(rev);
    const revOut = ac.createGain();
    revOut.gain.value = 0.34;
    rev.connect(revOut);
    revOut.connect(this.master);

    const dl = ac.createDelay(1.5);
    dl.delayTime.value = 0.375;
    const fb = ac.createGain();
    fb.gain.value = 0.36;
    const dlp = ac.createBiquadFilter();
    dlp.type = 'lowpass';
    dlp.frequency.value = 2400;
    this.delIn = ac.createGain();
    this.delIn.connect(dl);
    dl.connect(dlp);
    dlp.connect(fb);
    fb.connect(dl);
    const dOut = ac.createGain();
    dOut.gain.value = 0.3;
    dlp.connect(dOut);
    dOut.connect(this.musicBus);
    this.delayNode = dl;

    const len = ac.sampleRate;
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.noise = buf;
    this.applySettings();
  },

  impulse(dur, decay) {
    const ac = this.ac, rate = ac.sampleRate, len = Math.floor(rate * dur);
    const buf = ac.createBuffer(2, len, rate);
    for (let c = 0; c < 2; c++) {
      const d = buf.getChannelData(c);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
    return buf;
  },

  applySettings() {
    const s = Save.data.settings;
    this.musicOn = !!(s.music && s.sound);
    this.sfxOn = !!s.sound;
    if (!this.ac || !this.musicBus) return;
    const t = this.ac.currentTime;
    this.musicBus.gain.setTargetAtTime(this.musicOn ? 0.48 : 0, t, 0.05);
    this.sfx.gain.setTargetAtTime(this.sfxOn ? 0.75 : 0, t, 0.05);
  },

  setDelayTime(beatLen) {
    if (this.delayNode) this.delayNode.delayTime.setTargetAtTime(beatLen * 0.75, this.ac.currentTime, 0.05);
  },

  musicFilter(freq, tc) {
    if (!this.ac) return;
    this.musicLP.frequency.setTargetAtTime(freq, this.ac.currentTime, tc || 0.08);
  },

  rate(name, gap) {
    const n = performance.now();
    if ((this.last[name] || 0) + gap * 1000 > n) return false;
    this.last[name] = n;
    return true;
  },

  can() { return this.ok && this.ac && this.ac.state === 'running'; },

  tone(o) {
    const ac = this.ac;
    const t = o.t !== undefined ? o.t : ac.currentTime;
    const osc = ac.createOscillator();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.f, t);
    if (o.f2) osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.f2), t + (o.slide || o.dur));
    if (o.detune) osc.detune.setValueAtTime(o.detune, t);
    const g = ac.createGain();
    const a = o.a || 0.004, dur = o.dur, peak = o.g === undefined ? 0.3 : o.g;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t + a);
    if (o.hold) g.gain.setValueAtTime(Math.max(0.0002, peak), t + a + o.hold);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    let node = osc;
    if (o.lp) {
      const f = ac.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.setValueAtTime(o.lp, t);
      if (o.lp2) f.frequency.exponentialRampToValueAtTime(o.lp2, t + dur);
      f.Q.value = o.q || 0.9;
      node.connect(f);
      node = f;
    }
    node.connect(g);
    g.connect(o.dest || this.sfx);
    if (o.rev) { const s = ac.createGain(); s.gain.value = o.rev; g.connect(s); s.connect(this.revIn); }
    if (o.del) { const s = ac.createGain(); s.gain.value = o.del; g.connect(s); s.connect(this.delIn); }
    osc.start(t);
    osc.stop(t + dur + 0.05);
  },

  hiss(o) {
    const ac = this.ac;
    const t = o.t !== undefined ? o.t : ac.currentTime;
    const src = ac.createBufferSource();
    src.buffer = this.noise;
    const f = ac.createBiquadFilter();
    f.type = o.type || 'bandpass';
    f.frequency.setValueAtTime(o.f || 1000, t);
    if (o.f2) f.frequency.exponentialRampToValueAtTime(o.f2, t + o.dur);
    f.Q.value = o.q || 0.9;
    const g = ac.createGain();
    const a = o.a || 0.002;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, o.g === undefined ? 0.3 : o.g), t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
    src.connect(f);
    f.connect(g);
    g.connect(o.dest || this.sfx);
    if (o.rev) { const s = ac.createGain(); s.gain.value = o.rev; g.connect(s); s.connect(this.revIn); }
    src.start(t, Math.random() * 0.4, o.dur + 0.06);
  },
};

const BOSS_CHORDS = [{ bass: 45, tones: [57, 60, 64] }, { bass: 46, tones: [58, 62, 65] }, { bass: 45, tones: [57, 60, 64] }, { bass: 40, tones: [52, 56, 59] }];

const Music = {
  playing: false, bpm: 120, stepLen: 0.125, nextStep: 0, nextStepTime: 0, level: 0, track: TRACKS.neon, boss: false,

  setTrack(id) { this.track = TRACKS[id] || TRACKS.neon; },

  start(songTime, bpm, level) {
    this.bpm = bpm;
    this.stepLen = 60 / bpm / 4;
    this.level = level;
    this.playing = true;
    this.resync(songTime);
    if (Sound.ac) {
      Sound.setDelayTime(60 / bpm);
      Sound.musicFilter(level === 0 ? 2600 : 18000, 0.3);
      Sound.musicBus.gain.setTargetAtTime(Sound.musicOn ? 0.48 : 0, Sound.ac.currentTime, 0.1);
    }
  },

  stop() { this.playing = false; },

  resync(songTime) {
    this.nextStep = Math.max(0, Math.ceil(songTime / this.stepLen - 1e-6));
    this.nextStepTime = this.nextStep * this.stepLen;
  },

  update(songTime, ws) {
    if (!this.playing) return;
    if (!Sound.can() || !Sound.musicOn) { this.resync(songTime); return; }
    if (ws < 0.01) return;
    if (this.nextStepTime < songTime - 0.3) this.resync(songTime);
    const now = Sound.ac.currentTime;
    let guard = 0;
    while (this.nextStepTime < songTime + 0.11 * ws && guard++ < 16) {
      const at = now + Math.max(0, (this.nextStepTime - songTime) / ws);
      this.step(this.nextStep, at, ws);
      this.nextStep++;
      this.nextStepTime = this.nextStep * this.stepLen;
    }
  },

  step(n, t, ws) {
    const S = Sound, L = this.level, s16 = n % 16, bar = Math.floor(n / 16), T = this.track, boss = this.boss;
    const ch = (boss ? BOSS_CHORDS : T.chords)[bar % 4];
    const det = S.detune;
    const stretch = Math.min(2.5, 1 / Math.max(ws, 0.4));
    const barDur = Math.min(4, (this.stepLen * 16) / Math.max(ws, 0.25));
    const drums = boss ? 'boss' : T.drums;

    let kick = false;
    if (L >= 1) {
      if (drums === 'four') kick = s16 % 4 === 0;
      else if (drums === 'half') kick = s16 === 0 || s16 === 10 || (L >= 4 && s16 === 6);
      else if (drums === 'break') kick = s16 === 0 || s16 === 3 || s16 === 8 || s16 === 11;
      else kick = s16 % 4 === 0 || s16 === 14;
    }
    if (kick) {
      S.tone({ t, type: 'sine', f: 150, f2: 46, slide: 0.09, dur: 0.34 * stretch, g: 0.95, dest: S.drums, detune: det });
      S.hiss({ t, type: 'highpass', f: 3500, dur: 0.012, g: 0.12, dest: S.drums });
      const pg = S.pump.gain;
      pg.cancelScheduledValues(t);
      pg.setValueAtTime(0.32, t);
      pg.linearRampToValueAtTime(1, t + 0.24 * stretch);
    }
    const snare = drums === 'half' ? s16 === 8 : s16 === 4 || s16 === 12;
    if (L >= 3 && snare) {
      S.hiss({ t, type: 'bandpass', f: 1900, q: 0.7, dur: 0.18 * stretch, g: 0.32, dest: S.drums, rev: 0.25 });
      S.tone({ t, type: 'triangle', f: 200, f2: 150, dur: 0.1, g: 0.2, dest: S.drums, detune: det });
    }
    if (boss && L >= 1 && (s16 === 13 || s16 === 15)) S.tone({ t, type: 'sine', f: 130 - (s16 - 13) * 12, f2: 70, dur: 0.18, g: 0.32, dest: S.drums, detune: det });
    if (L >= 3 && bar % 8 === 7 && s16 >= 12) S.hiss({ t, type: 'bandpass', f: 2200, dur: 0.07, g: 0.12 + (s16 - 12) * 0.04, dest: S.drums });
    if (L >= 2 && (L >= 4 || s16 % 2 === 0)) S.hiss({ t, type: 'highpass', f: 8000, dur: 0.035, g: s16 % 4 === 2 ? 0.1 : 0.05, dest: S.drums });
    if (L >= 5 && s16 % 4 === 2) S.hiss({ t, type: 'highpass', f: 6500, dur: 0.2 * stretch, g: 0.06, dest: S.drums });

    if (L >= 1) {
      const bs = boss ? 'bounce' : T.bass;
      let play = false, m = ch.bass, len = 0.2;
      if (bs === 'bounce') { play = s16 % 2 === 0; if (s16 % 4 === 2) m += 12; }
      else if (bs === 'roll') { play = L >= 3 || s16 % 2 === 0; if (s16 % 8 === 6) m += 12; len = 0.12; }
      else if (bs === 'offbeat') { play = s16 % 4 === 2 || s16 === 0; if (s16 !== 0) m += 12; }
      else { play = s16 % 4 === 0 || s16 % 4 === 3; if (s16 % 4 === 3) m += 7; len = 0.14; }
      if (L >= 5 && s16 === 14) m += 7;
      if (play) {
        S.tone({ t, type: 'sawtooth', f: mtof(m), dur: len * stretch, g: 0.2, lp: 900, lp2: 260, dest: S.pump, detune: det });
        S.tone({ t, type: 'square', f: mtof(m - 12), dur: len * stretch, g: 0.09, lp: 400, dest: S.pump, detune: det });
      }
    }
    if (s16 === 0 && (L === 0 || L >= 2)) {
      for (const m of ch.tones) {
        for (const dt of [-9, 9]) {
          S.tone({ t, type: 'sawtooth', f: mtof(m), detune: dt + det, a: 0.35, hold: barDur * 0.55, dur: barDur, g: L === 0 ? 0.05 : 0.035, lp: L === 0 ? 900 : T.padCut, dest: S.pump, rev: 0.5 });
        }
      }
    }
    if (L === 0 || L >= 3) {
      const tones = ch.tones.concat(ch.tones.map((x) => x + 12));
      const m = tones[T.arp[s16]] + 12;
      S.tone({ t, type: boss ? 'sawtooth' : T.arpWave, f: mtof(m), dur: 0.11 * stretch, g: L === 0 ? 0.035 : 0.05, lp: L === 0 ? 1800 : T.arpCut, dest: S.pump, del: 0.5, detune: det });
    }
    if (L >= 4 && !boss) {
      for (const [st, m, len] of T.lead[bar % 4]) {
        if (st !== s16) continue;
        const d = (len * this.stepLen) / Math.max(ws, 0.25);
        S.tone({ t, type: 'sawtooth', f: mtof(m), detune: 6 + det, a: 0.01, dur: d * 0.95, g: 0.07, lp: 3200, dest: S.musicBus, del: 0.35, rev: 0.2 });
        S.tone({ t, type: 'square', f: mtof(m), detune: -6 + det, a: 0.01, dur: d * 0.95, g: 0.035, lp: 2400, dest: S.musicBus });
      }
    }
  },
};

const Sfx = {

  ring() {
