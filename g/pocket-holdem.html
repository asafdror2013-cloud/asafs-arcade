<script>
/*! © 2026 Asaf. All rights reserved. Free to play; not to be copied or claimed as your own. */
(function () {
  'use strict';
  var CFG = {"id": "pocket-holdem", "owner": "Asaf", "year": 2026, "mark": "bl", "dx": 0, "dy": 0, "mount": null, "hubCss": null};
  var NOTICE = '© ' + CFG.year + ' ' + CFG.owner;

  // Inside Asaf's Arcade the game runs in a frame of the arcade page: borrow its cloud saves, let it show the notice.
  var hub = null;
  try {
    var P = window.parent;
    if (P && P !== window && P.__ASAF_ARCADE__ && P.__ASAF_ARCADE__.v === 1) hub = P.__ASAF_ARCADE__;
  } catch (e) { hub = null; }
  window.__ASAF_HUB__ = !!hub;
  if (hub) {
    window.__asafClaude = makeClaude(hub, CFG.id);
    if (CFG.hubCss) {
      var hs = document.createElement('style');
      hs.textContent = CFG.hubCss;
      (document.head || document.documentElement).appendChild(hs);
    }
    return;
  }

  // ---- played on its own: a small permanent tag plus a short notice when the game opens
  var css = '' +
    '#asaf-cr{all:initial;position:fixed;z-index:2147483646;display:block;box-sizing:border-box;pointer-events:none;user-select:none;-webkit-user-select:none;' +
    'font:600 10px/1 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;letter-spacing:.04em;color:rgba(255,255,255,.88);' +
    'background:rgba(6,6,16,.52);padding:4px 8px;border-radius:999px;white-space:nowrap;opacity:.82;transition:opacity .7s ease}' +
    '#asaf-cr.asaf-busy{opacity:.14}' +
    '#asaf-cr-toast{all:initial;position:fixed;z-index:2147483647;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));display:block;box-sizing:border-box;' +
    'transform:translateX(-50%);pointer-events:none;user-select:none;-webkit-user-select:none;width:max-content;max-width:min(90vw,430px);' +
    'font:500 12.5px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#fff;text-align:center;' +
    'background:rgba(8,8,20,.9);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:9px 15px;box-shadow:0 10px 30px rgba(0,0,0,.5);' +
    'opacity:0;animation:asafCrIn .45s ease .6s forwards,asafCrOut .6s ease 5.2s forwards}' +
    '#asaf-cr-toast b{all:unset;font-weight:800}' +
    '#asaf-cr-toast i{all:unset;display:block;margin-top:2px;font-size:11.5px;opacity:.78}' +
    '@keyframes asafCrIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}' +
    '@keyframes asafCrOut{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,0)}}';
  var st = document.createElement('style');
  st.id = 'asaf-cr-style';
  st.textContent = css;
  (document.head || document.documentElement).appendChild(st);

  var dx = 6 + (CFG.dx || 0), dy = 6 + (CFG.dy || 0);
  var T = 'top:calc(' + dy + 'px + env(safe-area-inset-top,0px));';
  var B = 'bottom:calc(' + dy + 'px + env(safe-area-inset-bottom,0px));';
  var L = 'left:calc(' + dx + 'px + env(safe-area-inset-left,0px));';
  var R = 'right:calc(' + dx + 'px + env(safe-area-inset-right,0px));';
  var C = 'left:50%;transform:translateX(-50%);';
  var POS = { tl: T + L, tr: T + R, bl: B + L, br: B + R, tc: T + C, bc: B + C };

  var tag = document.createElement('div');
  tag.id = 'asaf-cr';
  tag.setAttribute('role', 'note');
  tag.setAttribute('aria-label', NOTICE + '. All rights reserved.');
  tag.textContent = NOTICE;
  tag.style.cssText = POS[CFG.mark] || POS.br;

  var toast = document.createElement('div');
  toast.id = 'asaf-cr-toast';
  toast.setAttribute('aria-hidden', 'true');
  var b = document.createElement('b'); b.textContent = NOTICE + ' · All rights reserved';
  var i = document.createElement('i'); i.textContent = 'Free to play. Please don’t copy it or claim it as your own.';
  toast.appendChild(b); toast.appendChild(i);
  setTimeout(function () { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 6200);

  function home() {
    if (CFG.mount) { var m = document.querySelector(CFG.mount); if (m) return m; }
    return document.documentElement;
  }
  function mount() {
    var h = home();
    if (tag.parentNode !== h) h.appendChild(tag);
  }
  function start() {
    mount();
    home().appendChild(toast);
    setInterval(mount, 2500);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();

  // fade the tag while someone is actively playing, bring it back when they pause
  var idle = 0;
  function busy() {
    tag.classList.add('asaf-busy');
    clearTimeout(idle);
    idle = setTimeout(function () { tag.classList.remove('asaf-busy'); }, 2600);
  }
  ['pointerdown', 'keydown', 'touchstart', 'wheel'].forEach(function (ev) {
    window.addEventListener(ev, busy, { capture: true, passive: true });
  });

  // ---- cloud saves through the arcade page (strings only cross between the two pages)
  function makeClaude(H, gid) {
    var cache = {};
    function fail(code) { var e = new Error(code || 'unavailable'); e.code = code || 'unavailable'; return e; }
    function call(fn, args) {
      return new Promise(function (res, rej) {
        var p;
        try { p = H[fn].apply(null, [gid].concat(args || [])); } catch (e) { rej(fail('unavailable')); return; }
        Promise.resolve(p).then(function (s) {
          var r;
          try { r = JSON.parse(s); } catch (e) { rej(fail('internal')); return; }
          if (r && r.ok) res(r.v); else rej(fail(r && r.code));
        }, function () { rej(fail('unavailable')); });
      });
    }
    function snap(path, v) {
      var parts = path.split('/');
      return { id: parts[parts.length - 1], exists: v !== null && v !== undefined,
        data: function () { return v === null || v === undefined ? undefined : JSON.parse(JSON.stringify(v)); } };
    }
    function doc(path) {
      return {
        id: path.split('/').pop(), path: path,
        get: function () { return call('get', [path]).then(function (v) { return snap(path, v); }); },
        set: function (data) { return call('set', [path, JSON.stringify(data)]).then(function () {}); }
      };
    }
    function query(path, lim) {
      return {
        path: path,
        limit: function (n) { return query(path, n); },
        doc: function (id) { return doc(path + '/' + id); },
        onSnapshot: function (next, error) {
          var dead = false, off = null;
          function onErr(code) { if (!dead && typeof error === 'function') error(fail(code)); }
          try {
            off = H.watch(gid, path, lim || 0, function (s) {
              if (dead) return;
              var rows; try { rows = JSON.parse(s); } catch (e) { return; }
              var docs = rows.map(function (d) { return snap(path + '/' + d.id, d.v); });
              next({ docs: docs, size: docs.length, empty: !docs.length, forEach: function (f) { docs.forEach(f); } });
            }, onErr);
          } catch (e) { setTimeout(function () { onErr('unavailable'); }, 0); }
          return function () { dead = true; try { if (off) off(); } catch (e) { /* page gone */ } };
        }
      };
    }
    var db = { doc: doc, collection: function (p) { return query(p, 0); } };
    var user = {
      id: function () { return call('uid', []); },
      me: function () { return call('uid', []).then(function (id) { return { id: id }; }); },
      can: function (n) { return call('can', [String(n)]); },
      profiles: function (ids) { return call('profiles', [JSON.stringify(ids || [])]); },
      isOwner: function () { return false; },
      canEdit: function () { return false; }
    };
    return {
      use: function (name) {
        if (!cache[name]) {
          cache[name] = call('ready', [String(name)]).then(function (ok) {
            if (!ok) return null;
            return name === 'db' ? db : name === 'user' ? user : null;
          }, function () { return null; });
        }
        return cache[name];
      }
    };
  }
})();
</script>

:root {
  --bg: #08201a; --panel: rgba(10,26,22,.94); --line: rgba(255,255,255,.13); --gold: #ffcf4a; --green: #2fd17f; --red: #ff5a5f; --blue: #3d8bff;
  --text: #fff; --dim: #a9c4ba; --head: 'Bebas Neue', Impact, 'Arial Narrow', sans-serif; --body: 'Rubik', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px); --sl: env(safe-area-inset-left, 0px); --sr: env(safe-area-inset-right, 0px);
  --bw: clamp(32px, min(10.6vw, 8.6vh), 70px); --sw: clamp(20px, min(5.6vw, 4.6vh), 38px); --lw: clamp(52px, min(15vw, 11vh), 92px);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: radial-gradient(120% 90% at 50% 30%, #12453a, #061612 70%); color: var(--text); }
body { font: 500 15px/1.4 var(--body); user-select: none; -webkit-user-select: none; overscroll-behavior: none; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
button:disabled { cursor: default; opacity: .45; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
[hidden] { display: none !important; }
input { font: inherit; }

/* ---------- cards */
.card { --w: var(--bw); position: relative; width: var(--w); height: calc(var(--w) * 1.4); border-radius: calc(var(--w) * .11); background: linear-gradient(#fff, #f1f1ec); color: #17171d; box-shadow: 0 2px 0 rgba(0,0,0,.25), 0 4px 10px rgba(0,0,0,.3); font-weight: 800; flex: none; transition: transform .25s, filter .25s, box-shadow .25s; }
.card b { position: absolute; left: 9%; top: 3%; font-size: calc(var(--w) * .4); line-height: 1; letter-spacing: -.04em; }
.card i { position: absolute; left: 10%; top: 33%; font-size: calc(var(--w) * .27); font-style: normal; line-height: 1; }
.card em { position: absolute; right: 7%; bottom: 3%; font-size: calc(var(--w) * .6); font-style: normal; line-height: 1; }
.card.h, .card.d { color: #d62b3c; }
.four .card.d { color: #1f6fe0; } .four .card.c { color: #17914a; }
.card.back { background: #fff; padding: calc(var(--w) * .07); }
.card.back i { position: static; display: block; width: 100%; height: 100%; border-radius: calc(var(--w) * .07); background: repeating-linear-gradient(45deg, #c8323c 0 calc(var(--w) * .07), #a8222b calc(var(--w) * .07) calc(var(--w) * .14)); border: 1px solid rgba(0,0,0,.15); }
.card.sm { --w: var(--sw); } .card.lg { --w: var(--lw); } .card.xs { --w: 24px; }
.card.sm.face i { display: none; } .card.sm em { font-size: calc(var(--w) * .5); }
.card.win { transform: translateY(-14%); box-shadow: 0 0 0 3px var(--gold), 0 0 18px rgba(255,207,74,.8); }
.card.lose { filter: brightness(.5) saturate(.6); }
.chip { display: inline-block; width: 16px; height: 16px; border-radius: 50%; flex: none; background: radial-gradient(circle, #e8333d 0 38%, transparent 39%), conic-gradient(#fff 0 25deg, #e8333d 25deg 65deg, #fff 65deg 90deg, #e8333d 90deg 155deg, #fff 155deg 180deg, #e8333d 180deg 245deg, #fff 245deg 270deg, #e8333d 270deg 335deg, #fff 335deg); box-shadow: 0 0 0 1.5px #7a0d14, 0 2px 3px rgba(0,0,0,.4); }
.chip.lgc { width: 30px; height: 30px; }
.av { display: grid; place-items: center; width: 100%; height: 100%; border-radius: 50%; background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--t) 60%, #fff), var(--t)); font-size: 1.35em; line-height: 1; box-shadow: inset 0 -3px 0 rgba(0,0,0,.2); }

/* ---------- buttons and modals (menus) */
.big { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; min-height: 58px; padding: 9px 16px; border-radius: 16px; background: linear-gradient(#1f4a40, #143630); border: 2px solid rgba(255,255,255,.14); box-shadow: 0 4px 0 #04110e; }
.big b { font: 400 27px/1 var(--head); letter-spacing: .05em; }
.big span { font-size: 12.5px; color: var(--dim); margin-top: 2px; }
.big.hot { background: linear-gradient(#ffd967, #f5b300); color: #2b1a00; border-color: #fff0b5; box-shadow: 0 4px 0 #9c6b00; }
.big.hot span { color: #6b4a00; }
.big:active:not(:disabled), .small:active:not(:disabled) { transform: translateY(2px); }
.small { min-height: 42px; padding: 8px 14px; border-radius: 12px; background: rgba(255,255,255,.08); border: 1.5px solid var(--line); font-weight: 700; font-size: 14px; }
.small.icon { font-size: 19px; min-width: 46px; }
.small.danger { color: #ff9a8a; width: 100%; margin-top: 12px; }
.row { display: flex; gap: 8px; } .row > * { flex: 1; }
.stack { display: flex; flex-direction: column; gap: 9px; margin-top: 12px; }
.fine { font-size: 12px; color: var(--dim); text-align: center; margin: 10px 0 0; }
.lead { color: var(--dim); font-size: 14px; margin: 4px 0 12px; } .lead b { color: #fff; } .center { text-align: center; }
.warn { background: rgba(255,90,95,.14); border: 1px solid rgba(255,90,95,.4); padding: 9px 12px; border-radius: 12px; font-size: 13.5px; }
#menu { position: fixed; inset: 0; overflow: auto; }
.title { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: calc(20px + var(--st)) calc(18px + var(--sr)) calc(18px + var(--sb)) calc(18px + var(--sl)); }
.logo { text-align: center; }
.logo h1 { margin: 8px 0 0; font: 400 clamp(50px, 15vw, 84px)/0.9 var(--head); letter-spacing: .04em; text-shadow: 0 4px 0 #021a13, 0 0 30px rgba(47,209,127,.35); }
.logo h1 span { color: var(--gold); display: block; }
.logo small { font-weight: 800; letter-spacing: .18em; font-size: 11.5px; color: var(--dim); text-transform: uppercase; }
.fan { position: relative; height: 92px; width: 170px; margin: 0 auto; }
.fan .card { --w: 58px; position: absolute; left: 50%; bottom: 0; transform-origin: 50% 120%; margin-left: -29px; }
.fan .card:nth-child(1) { transform: rotate(-24deg); } .fan .card:nth-child(2) { transform: rotate(-8deg); } .fan .card:nth-child(3) { transform: rotate(8deg); } .fan .card:nth-child(4) { transform: rotate(24deg); }
.bank { display: flex; align-items: center; gap: 10px; padding: 8px 18px 8px 10px; border-radius: 99px; background: rgba(0,0,0,.3); border: 1.5px solid rgba(255,207,74,.35); }
.bank b { display: block; font: 400 28px/1 var(--head); color: var(--gold); letter-spacing: .04em; } .bank span { font-size: 11px; color: var(--dim); }
.menuBtns { width: min(100%, 390px); display: flex; flex-direction: column; gap: 9px; }

};

// ---------------------------------------------------------------- table.js (the table on screen: seats, cards, chips, animations, your actions)

const TableUI = {

  // seat positions around the oval (percent of the table box), rotated so you sit at the bottom

  // ------------------------------------------------ flying things
  rect(node) { const r = node.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2, w: r.width, h: r.height }; },

  center() { return this.rect($('pot')); },
  // ------------------------------------------------ play a list of events, then show the final state

  async play2(evs, v) {

// ------------------------------------------------ your buttons: fold, check / call, bet / raise with a slider
const Actions = {
  L: null, onAct: null, pre: null,
  init() {
    $('acts').addEventListener('click', (e) => {
      const b = e.target.closest('button'); if (!b) return;
      const k = b.dataset.k; Snd.init();
      if (k === 'fold') this.send({ a: 'fold', force: true });
      else if (k === 'call') this.send({ a: this.L.toCall ? 'call' : 'check' });
      else if (k === 'raise') this.openRaise();
      else if (k === 'go') this.send({ a: 'raise', to: +$('rRange').value });
      else if (k === 'cancel') this.closeRaise();
      else if (k === 'preset') { $('rRange').value = b.dataset.v; this.showRaise(); }
      else if (k === 'pre') { this.pre = this.pre === b.dataset.p ? null : b.dataset.p; this.drawPre(); }
      else if (k === 'step') { const r = $('rRange'); r.value = clamp(+r.value + +b.dataset.d * +r.step, +r.min, +r.max); this.showRaise(); }
    });

      if (!this.L || e.target.tagName === 'INPUT' && e.target.type !== 'range') return;

      if (k === 'f') this.send({ a: 'fold', force: true });
      else if (k === 'c' || k === 'k') this.send({ a: this.L.toCall ? 'call' : 'check' });
      else if (k === 'r' || k === 'b') { if (this.L.canRaise) this.openRaise(); }
      else if (k === 'enter' && $('raise').classList.contains('on')) this.send({ a: 'raise', to: +$('rRange').value });
      else if (k === 'escape') this.closeRaise();

  },
  send(a) {
    if (!this.L || !this.onAct) return;
    this.L = null; this.closeRaise(); this.update(TableUI.view, true);
    Sfx.ui();
    this.onAct(a);
  },
  update(v, sent) {
    const me = v && v.me >= 0 ? v.seats[v.me] : null;
    const L = !sent && v && v.legal && v.toAct === v.me && v.live ? v.legal : null;
    this.L = L;
    const box = $('acts');
    box.classList.toggle('mine', !!L);
    $('mySeat').classList.toggle('turn', !!L);
    if (L) {
      // a pre-chosen move happens by itself
      if (this.pre) {
        const p = this.pre; this.pre = null; this.drawPre();
        if (p === 'cf') { setTimeout(() => this.send(L.canCheck ? { a: 'check' } : { a: 'fold', force: true }), 250); return; }
        if (p === 'ca') { setTimeout(() => this.send({ a: L.toCall ? 'call' : 'check' }), 250); return; }
      }

      $('bRaise').hidden = !L.canRaise;

      $('waitRow').hidden = true; $('actRow').hidden = false;

  clearPre() { this.pre = null; this.drawPre(); },
  drawPre() { document.querySelectorAll('[data-k=pre]').forEach((b) => b.classList.toggle('on', b.dataset.p === this.pre)); },

    const L = this.L; if (!L || !L.canRaise) return;

    box.classList.toggle('on', !!on);
    $('coachBtn').classList.toggle('on', !!Save.data.settings.coach);
    if (!on) { this.key = ''; return; }
    const opp = v.seats.filter((s, j) => j !== v.me && s.inHand && !s.folded).length;
    const key = me.cards.join(',') + '|' + v.board.join(',') + '|' + opp;
    const L = v.toAct === v.me ? v.legal : null;
    if (key !== this.key) {
      this.key = key; $('cName').textContent = this.name(me.cards, v.board); $('cEq').textContent = '…'; $('cBar').style.width = '0%';
      clearTimeout(this.t);

  },
  name(cards, board) {
    if (board.length >= 3) return handName(evalHand(cards.concat(board)));
    const a = cards[0] >> 2, b = cards[1] >> 2, hi = Math.max(a, b), lo = Math.min(a, b), suited = (cards[0] & 3) === (cards[1] & 3);

  },
  draw(v, eq, opp) {

    $('cBar').className = eq > 0.6 ? 'hi' : eq > 1 / (opp + 1) ? 'mid' : 'lo';
    $('cVs').textContent = 'to win vs ' + opp + (opp === 1 ? ' player' : ' players');
    const L = v.toAct === v.me && v.legal;

      const need = L.callAmt / (L.pot + L.callAmt);
      tip = 'Call ' + fmt(L.callAmt) + ' to win ' + fmt(L.pot) + ': you need ' + Math.round(need * 100) + '%. ' + (eq > need + 0.12 ? 'Calling is good.' : eq > need ? 'Close call.' : 'Folding is fine.');
    } else if (L) {
      tip = eq > Math.max(0.55, 1.6 / (opp + 1)) ? 'Strong hand: bet to grow the pot.' : eq > 1 / (opp + 1) ? 'Decent: a small bet or a check.' : 'Weak for now: checking is free.';
    }
    $('cTip').textContent = tip;
  },
};

// ---------------------------------------------------------------- game.js (runs a game: a cash table, a tournament, or an online table you host)
const Hud = {
  blinds(sb, bb) { $('hBlinds').textContent = fmt(sb) + ' / ' + fmt(bb); },
  sub(t) { $('hSub').textContent = t || ''; },
};
function buzz(ms) { if (Save.data.settings.haptics) vibrate(ms); }
function pickPersonas(n, skip) { const pool = PERSONAS.filter((p) => !(skip || []).includes(p.id)); const out = []; while (out.length < n && pool.length) out.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]); return out; }
function myAv() { const m = Save.data.me; return { e: m.av || '🙂', c: m.tint || '#2f6bff' }; }

const Host = {
  mode: null, cfg: null, t: null, meta: [], me: 0, timer: 0, chain: Promise.resolve(), gen: 0, level: 0, atLevel: 0, places: [], over: false, paused: false, pendingNext: false,
  // ------------------------------------------------ starting a game
  startCash(tid) {
    const T = TABLE_BY[tid], s = Save.data;
    if (s.chips < T.buy) { s.chips += Math.max(0, T.buy - s.chips); }
    const buy = T.buy; s.chips -= buy; s.table = { id: tid, stack: buy }; Save.persist();
    const bots = pickPersonas(5);
    const seats = [{ id: 'me', name: myNick(), av: myAv(), stack: buy }].concat(bots.map((p) => ({ id: p.id, name: p.name, av: { e: p.av, c: p.tint }, stack: buy })));
    const meta = [{ kind: 'you' }].concat(bots.map((p) => ({ kind: 'bot', persona: p, diff: T.diff })));
    this.begin({ mode: 'cash', T, sb: T.sb, bb: T.bb, title: T.name }, seats, meta);
  },
  startSng(diff) {
    const bots = pickPersonas(5);
    const seats = [{ id: 'me', name: myNick(), av: myAv(), stack: 1500 }].concat(bots.map((p) => ({ id: p.id, name: p.name, av: { e: p.av, c: p.tint }, stack: 1500 })));
    const meta = [{ kind: 'you' }].concat(bots.map((p) => ({ kind: 'bot', persona: p, diff })));
    this.begin({ mode: 'sng', diff, sb: LEVELS[0][0], bb: LEVELS[0][1], every: 6, title: 'Tournament · ' + DIFFS[diff].name }, seats, meta);
  },
  startOnline(players, cfg) {
    const seats = [], meta = [];
    for (const p of players) { seats.push({ id: p.pid, name: p.nick, av: p.av, stack: cfg.stack }); meta.push(p.host ? { kind: 'you' } : { kind: 'remote', pid: p.pid, away: false, miss: 0 }); }
    const bots = pickPersonas(Math.min(cfg.bots, 6 - seats.length));
    for (const b of bots) { seats.push({ id: b.id, name: b.name, av: { e: b.av, c: b.tint }, stack: cfg.stack }); meta.push({ kind: 'bot', persona: b, diff: 'normal' }); }
    const every = cfg.blinds === 'fast' ? 5 : cfg.blinds === 'slow' ? 9 : 0;

  },
  begin(cfg, seats, meta) {
    this.gen++; clearTimeout(this.timer);

    Actions.onAct = (a) => this.act(this.me, a);

    $('seats').classList.toggle('timed', cfg.mode === 'online');
    $('seats').style.setProperty('--tt', (cfg.timer || 30) + 's');
    const v = this.t.view(this.me); TableUI.render(v);
    Hud.blinds(cfg.sb, cfg.bb); this.levelNote();

    this.nextHand(900);
  },
  stop() { this.gen++; clearTimeout(this.timer); this.mode = null; this.t = null; },
  levelNote() {

  },
  emit(evs) {

  },
  // ------------------------------------------------ the hand loop
  nextHand(delay) {
    const g = this.gen;

  resume() { this.paused = false; if (this.pendingNext) { this.pendingNext = false; this.nextHand(300); } },
  step() {

    } else if (m.kind === 'remote' || m.kind === 'you' && this.mode === 'online') {
      const ms = m.away ? 900 : (this.cfg.timer || 30) * 1000;

        s.stats.won++;

  beforeHand() {

// ---------------------------------------------------------------- net.js (private online tables: one player hosts, friends join with a code or an invite)

  opts() {

        if (k >= 0) { Host.meta[k].away = false; Host.meta[k].miss = 0; t.seats[k].away = false; this.sendState(k, [], t, Host.meta); Toast.show(t.seats[k].name + ' is back'); return; }
        if (t.seats.length >= 6) { c.send({ t: 'full' }); return; }
        const i = t.addSeat({ id: pid, name: nick, av, stack: this.cfg.stack });
        Host.meta.push({ kind: 'remote', pid, away: false, miss: 0 });
        TableUI.build(t.seats.length, Host.me, t.seats.map((s) => ({ tint: s.av && s.av.c })));
        TableUI.mirror = null; TableUI.render(t.view(Host.me));
        Toast.show(nick + ' sits down. They play from the next hand.');
        this.broadcastState([], t, Host.meta);
        void i; return;
      }
      if (!this.lobby.some((p) => p.pid === pid)) {
        if (this.lobby.length >= 6) { c.send({ t: 'full' }); return; }
        this.lobby.push({ pid, nick, av });
        Sfx.join();
      }
      this.sendLobby(); Screen.lobby();
      return;
    }
    if (m.t === 'act' && this.playing && Host.t) {
      const i = Host.meta.findIndex((x) => x.kind === 'remote' && x.pid === pid);
      if (i >= 0 && m.a && typeof m.a === 'object') Host.act(i, { a: String(m.a.a), to: +m.a.to || 0, force: !!m.a.force });
      return;
    }
    if (m.t === 'say') { const k = +m.k; if (QUICK[k] === undefined) return; this.relaySay(pid, k); return; }
    if (m.t === 'bye') { this.lost(pid, true); }
  },
  lost(pid, left) {
    if (this.role !== 'host') return;
    delete this.conns[pid];
    if (!this.playing) { const n = this.lobby.length; this.lobby = this.lobby.filter((p) => p.pid !== pid || p.host); if (this.lobby.length !== n) { this.sendLobby(); Screen.lobby(); } return; }
    const i = Host.meta.findIndex((x) => x.kind === 'remote' && x.pid === pid);
    if (i >= 0 && Host.t) { Host.meta[i].away = true; Host.t.seats[i].away = true; Toast.show(Host.t.seats[i].name + (left ? ' left the table' : ' lost connection')); if (Host.t.live && Host.t.toAct === i) Host.step(); TableUI.render(Host.t.view(Host.me)); }
  },
  sendLobby() { const msg = { t: 'lobby', players: this.lobby.map((p) => ({ nick: p.nick, av: p.av, host: !!p.host })), cfg: this.cfg }; for (const k in this.conns) this.sendTo(k, msg); },
  sendTo(pid, m) { const c = this.conns[pid]; if (c && c.open) { try { c.send(m); } catch (e) { /* gone */ } } },
  setCfg(k, v) { this.cfg[k] = v; this.sendLobby(); Screen.lobby(); },
  startGame() {
    if (this.role !== 'host') return;
    const n = this.lobby.length + Math.min(this.cfg.bots, 6 - this.lobby.length);
    if (n < 2) { Toast.show('You need at least one friend or bot'); return; }
    this.playing = true;
    Host.startOnline(this.lobby, this.cfg);
  },
  sendState(i, evs, t, meta) { const m = meta[i]; if (!m || m.kind !== 'remote') return; this.sendTo(m.pid, { t: 'st', evs: eventsFor(evs, i, t), view: t.view(i), level: $('hSub').textContent }); },
  broadcastState(evs, t, meta) { if (this.role !== 'host') return; meta.forEach((m, i) => { if (m.kind === 'remote') this.sendState(i, evs, t, meta); }); },
  gameOver(standings) { for (const k in this.conns) this.sendTo(k, { t: 'over', standings }); this.playing = false; },
  relaySay(pid, k) {
    const i = Host.t ? Host.t.seats.findIndex((s) => s.id === pid) : -1;
    if (i >= 0) TableUI.say(i, QUICK[k]);
    for (const c in this.conns) this.sendTo(c, { t: 'say', id: pid, k });
  },
  say(k) {
    if (this.role === 'host') this.relaySay(this.pid(this.myCode()), k);
    else this.send({ t: 'say', k });
  },
  invite(code) { const H = this.hubApi(); if (H) H.invite(code, 'pocket-holdem'); },
  // ------------------------------------------------ joining a friend's table
  join(raw) {
    const code = parseCode(raw);
    if (code.length !== 6) { Toast.show('A table code has 6 letters and numbers'); return; }
    if (code === this.myCode()) { Toast.show('That’s your own table code'); return; }
    this.role = 'guest'; this.hostCode = code; this.hostConn = null; this.tries = 0; this.beat();
    Screen.joining(code);
    this.start(() => this.dialHost());
  },
  dialHost() {
    if (this.role !== 'guest' || !this.peer) return;
    let c;
    try { c = this.peer.connect(this.pid(this.hostCode), { reliable: true, label: 'ph' }); } catch (e) { this.joinFailed(); return; }
    clearTimeout(this.joinT);
    this.joinT = setTimeout(() => { if (!this.hostConn) this.joinFailed(); }, 9000);
    c.on('open', () => { this.hostConn = c; this.hostSeen = Date.now(); clearTimeout(this.joinT); const me = this.profile(); c.send({ t: 'hi', nick: me.nick, av: me.av, v: 1 }); });
    c.on('data', (m) => this.guestMsg(m));
    c.on('close', () => { if (this.hostConn === c) { this.hostConn = null; if (this.role === 'guest') this.hostGone(); } });
  },
  joinFailed() {
    if (this.role !== 'guest') return;
    if (this.tries++ < 4) { setTimeout(() => this.dialHost(), 2000); return; }
    this.role = null; Screen.joinFailed();
  },
  hostGone() {
    if (Screen.cur === 'table' && this.playing) {
      Toast.show('Lost the host. Trying again…');
      this.tries = 0; setTimeout(() => this.dialHost(), 1500);
      return;
    }
    Screen.joinFailed('The host closed the table.');
  },
  guestMsg(m) {
    if (!m || typeof m !== 'object') return;
    this.hostSeen = Date.now();
    switch (m.t) {
      case 'ping': this.send({ t: 'pong' }); break;
      case 'lobby': this.lobby = m.players; this.cfg = m.cfg; this.playing = false; Screen.lobby(); break;
      case 'st': if (!this.playing || Screen.cur !== 'table') { this.playing = true; Guest.begin('Friends table'); } Guest.state(m); break;
      case 'over': Screen.results({ mode: 'online', standings: m.standings, guest: true }); this.playing = false; break;
      case 'say': { const v = TableUI.view; const i = v ? v.seats.findIndex((s) => s.id === m.id) : -1; if (i >= 0 && QUICK[m.k] !== undefined) TableUI.say(i, QUICK[m.k]); break; }
      case 'full': this.role = null; Screen.joinFailed('That table is full (6 players).'); break;
      case 'notable': this.role = null; Screen.joinFailed('Your friend isn’t hosting a table right now.'); break;
      case 'closed': this.role = null; this.playing = false; Screen.joinFailed('The host closed the table.'); break;
    }
  },
  send(m) { const c = this.hostConn; if (c && c.open) { try { c.send(m); } catch (e) { /* gone */ } } },
  leaveGame() {
    if (this.role === 'guest') { this.send({ t: 'bye' }); }
    if (this.role === 'host') { for (const k in this.conns) this.sendTo(k, { t: 'closed' }); }
    setTimeout(() => this.stop(), 300);
  },
};

// ---------------------------------------------------------------- main.js (boot, buttons, sounds)
const Sfx = {
  deal() { Snd.play('deal', 0.03, (m, t) => { m.nz(t, 0.06, 'highpass', 2500, 0.7, 0.16, 0.002, m.sfx, 5000); }); },
  flip() { Snd.play('flip', 0.04, (m, t) => { m.nz(t, 0.05, 'bandpass', 3200, 0.8, 0.2, 0.002, m.sfx); m.nz(t + 0.03, 0.05, 'bandpass', 2400, 0.8, 0.12, 0.002, m.sfx); }); },
  chip() { Snd.play('chip', 0.04, (m, t) => { for (let i = 0; i < 2; i++) { m.osc(t + i * 0.035, 'sine', 3100 + i * 400, 0.04, 0.09, 0.001, m.sfx); m.nz(t + i * 0.035, 0.03, 'highpass', 5000, 0.6, 0.1, 0.001, m.sfx); } }); },
  collect() { Snd.play('col', 0.1, (m, t) => { for (let i = 0; i < 5; i++) { m.osc(t + i * 0.04, 'sine', 2800 + Math.random() * 900, 0.04, 0.06, 0.001, m.sfx); } }); },
  check() { Snd.play('chk', 0.1, (m, t) => { for (let i = 0; i < 2; i++) { m.osc(t + i * 0.11, 'sine', 160, 0.07, 0.3, 0.001, m.sfx, 90); m.nz(t + i * 0.11, 0.03, 'lowpass', 800, 0.7, 0.15, 0.001, m.sfx); } }); },
  fold() { Snd.play('fold', 0.08, (m, t) => { m.nz(t, 0.18, 'bandpass', 1400, 0.7, 0.12, 0.02, m.sfx, 600); }); },
  allin() { Snd.play('all', 0.3, (m, t) => { m.nz(t, 0.5, 'bandpass', 300, 0.8, 0.2, 0.05, m.sfx, 2200); m.kick(t + 0.05, 0.8); this.collect(); }); },
  turn() { Snd.play('turn', 0.4, (m, t) => { m.bell(t, mtof(84), 0.4, 0.8, m.sfx); m.bell(t + 0.09, mtof(91), 0.5, 0.6, m.sfx); }); },
  win() { Snd.play('win', 0.6, (m, t) => { [72, 76, 79, 84].forEach((n, i) => m.bell(t + i * 0.08, mtof(n), 0.5, 0.9, m.sfx)); }); this.collect(); },
  over() { Snd.play('over', 0.6, (m, t) => { [67, 64, 60].forEach((n, i) => m.osc(t + i * 0.18, 'triangle', mtof(n), 0.25, 0.12, 0.01, m.sfx)); }); },
  level() { Snd.play('lvl', 0.5, (m, t) => { m.bell(t, mtof(79), 0.4, 0.8, m.sfx); m.bell(t + 0.12, mtof(83), 0.5, 0.8, m.sfx); }); },
  join() { Snd.play('join', 0.3, (m, t) => { m.bell(t, mtof(76), 0.3, 0.7, m.sfx); m.bell(t + 0.08, mtof(83), 0.4, 0.7, m.sfx); }); },
  ui() { Snd.play('ui', 0.04, (m, t) => { m.osc(t, 'triangle', 900, 0.04, 0.06, 0.002, m.sfx, 1200); }, true); },
};
// a slow lounge loop: soft kick, brushed hats, warm chords
const LOUNGE = {
  bpm: 84, div: 4, reset() {},
  play(m, t, step, spb) {
    const s = step % 16, bar = Math.floor(step / 16) % 4, ch = [[50, 62, 65, 69, 72], [43, 62, 65, 67, 71], [48, 60, 64, 67, 71], [45, 60, 64, 67, 69]][bar];
    if (s % 2 === 1) t += spb * 0.16;
    if (s === 0 || s === 10) m.kick(t, 0.45);
    if (s === 4 || s === 12) m.nz(t, 0.12, 'bandpass', 2600, 0.5, 0.06, 0.01, m.drums);
    if (s % 2 === 0) m.hat(t, s % 4 === 2 ? 0.35 : 0.2);
    if (s === 0) { m.pad(t, ch.slice(1).map(mtof), spb * 15, 0.65); m.bass(t, mtof(ch[0]), spb * 6, 0.45, 500); }
    if (s === 8) m.bass(t, mtof(ch[0] + 7), spb * 4, 0.35, 500);
    if (bar % 2 === 1 && [2, 6, 7, 11].includes(s)) m.bell(t, mtof(ch[1 + (s % 4)] + 12), spb * 2, 0.35);
  },
};
const Main = {
  boot() {
    Save.load();
    Snd.onInit = () => this.music();
    Save.onRemote = () => { if (Screen.cur === 'menu') Screen.menu(); };
    Save.cloudInit();
    addEventListener('pointerdown', () => Snd.init(), true);
    // a table left without leaving (closed tab): its chips come back
    const s = Save.data;
    if (s.table) { s.chips += s.table.stack || 0; delete s.table; Save.persist(); setTimeout(() => Toast.show('Your chips from the last table are back in your bank'), 600); }
    const a = Net.hubAccount();
    if (a && a.nick && !s.me.nick) { s.me.nick = a.nick; if (a.av) { s.me.av = a.av.e || s.me.av; s.me.tint = a.av.c || s.me.tint; } Save.persist(); }
    Actions.init();
    this.applySettings();
    document.addEventListener('click', (e) => this.click(e));
    Screen.menu();
    const p = Net.takePending();
    if (p && p.host) setTimeout(() => Net.host(), 200);
    else if (p && p.join) setTimeout(() => Net.join(p.join), 200);
    // a quick check that the table still fits after the screen turns
    addEventListener('resize', () => { if (Screen.cur === 'table') TableUI.place(); });
    setInterval(() => Music.pump(), 120);
    // closing the page tells the table right away
    addEventListener('pagehide', () => { if (Net.role === 'guest') Net.send({ t: 'bye' }); else if (Net.role === 'host') { for (const k in Net.conns) Net.sendTo(k, { t: 'closed' }); } });
  },
  applySettings() { document.body.classList.toggle('four', !!Save.data.settings.fourColor); this.music(); },
  music() { if (!Snd.mx) return; Music.start(LOUNGE); Snd.apply(); },
  click(e) {
    const b = e.target.closest('[data-go]');
    if (!b || b.disabled) return;
    Snd.init(); Sfx.ui();
    const go = b.dataset.go, s = Save.data;
    switch (go) {
      case 'cash': Screen.pickCash(); break;
      case 'sit': Host.startCash(b.dataset.t); break;
      case 'refill': s.chips += REFILL; s.refills++; Save.persist(); Toast.show('+' + fmt(REFILL) + ' free play chips'); Screen.pickCash(); break;
      case 'sng': Screen.pickSng(); break;
      case 'sngGo': Host.startSng(b.dataset.d); break;
      case 'online': Screen.online(); break;
      case 'host': Net.host(); break;
      case 'join': Net.join($('joinCode').value); break;
      case 'cfg': Net.setCfg(b.dataset.k, isNaN(+b.dataset.v) ? b.dataset.v : +b.dataset.v); break;
      case 'startGame': Net.startGame(); break;
      case 'copyCode': copyText(fmtCode(Net.hostCode)).then((ok) => Toast.show(ok ? 'Table code copied' : fmtCode(Net.hostCode))); break;
      case 'invite': Net.invite(b.dataset.c); b.disabled = true; b.textContent = 'Invited ✓'; break;
      case 'rename': Screen.rename(); break;
      case 'pickAv': s.me.av = b.dataset.e; document.querySelectorAll('.avs button').forEach((x) => x.classList.toggle('on', x === b)); break;
      case 'saveNick': { const n = ($('nickIn').value || '').replace(/[<>]/g, '').trim().slice(0, 14); if (n) s.me.nick = n; Save.persist(); Screen.online(); break; }
      case 'howto': Screen.howto(); break;
      case 'stats': Screen.stats(); break;
      case 'settings': Screen.settings(); break;
      case 'coach': s.settings.coach = !s.settings.coach; Save.persist(); if (TableUI.view) Coach.update(TableUI.view); Toast.show(s.settings.coach ? 'Coach on' : 'Coach off'); break;
      case 'close': Screen.close(); if (Screen.cur === 'online') Screen.cur = 'menu'; break;
      case 'leave': if (Screen.cur === 'table') { if (Host.over || Net.role === 'guest' && !Net.playing) this.quit(); else Screen.leaveAsk(); } break;
      case 'rebuy': Screen.close(); Host.rebuy(); break;
      case 'quit': this.quit(); break;
      case 'lobbyBack': Host.stop(); Net.playing = false; Net.sendLobby(); Screen.lobby(); break;
      case 'say': Net.say(+b.dataset.k); Screen.close(); break;
      case 'sayOpen': Screen.says(); break;
    }
  },
  quit() {
    let diff = 0;
    if (Host.mode) diff = Host.leave();
    if (Net.role) Net.leaveGame();
    Screen.menu();
    if (diff) Toast.show(diff > 0 ? 'You left up ' + fmt(diff) + ' chips' : 'You left down ' + fmt(-diff) + ' chips');
  },
};
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => Main.boot());
else Main.boot();

})();</script>
