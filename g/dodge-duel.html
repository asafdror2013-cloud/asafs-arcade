#assist{position:absolute;left:0;right:0;top:36%;text-align:center;font-size:9em;color:#fff;text-shadow:0 0 .3em var(--cy);opacity:.9;pointer-events:none}
#ring{position:absolute;display:none;width:0;height:0;pointer-events:none}#ring b,#ring i{position:absolute;left:-3.2em;top:-3.2em;width:6.4em;height:6.4em;border-radius:50%;box-sizing:border-box}#ring b{border:.35em solid #fff;box-shadow:0 0 1em #fff}#ring i{border:.3em solid var(--gold);opacity:.9}
#ring.perfect b{border-color:var(--gold);box-shadow:0 0 2em var(--gold)}#ring.good b{border-color:var(--cy)}#ring.weak b{border-color:#666}
.pad{display:none;pointer-events:none}.pad.on{display:block}
#btnL,#btnR{width:11em;height:11em;bottom:3.4em;--c:var(--cy)}#btnL{left:2em}#btnR{left:auto;right:2em}#btnL em,#btnR em{font-size:4.4em}
#btnB{width:9em;height:9em;bottom:3.4em;left:50%;margin-left:-4.5em;--c:#fff}#btnB em{font-style:normal;font-size:3.6em}
#btnHit{width:13em;height:13em;right:2.4em;bottom:3.4em;--c:var(--gold)}#btnHit b{font-size:2.6em}
#plan{position:absolute;left:0;right:0;bottom:3.6em;display:none;flex-direction:column;align-items:center;gap:.6em;pointer-events:none}#plan.on{display:flex}
#queue{display:flex;align-items:center;gap:.4em;min-height:2.8em;background:var(--glass);border:1px solid var(--line);padding:.3em 1em;transform:skewX(-10deg)}#queue span{font-size:1.3em;color:#8fa3c8}#queue u{text-decoration:none;color:#8fa3c8;font-size:1.6em}
#queue b{font-size:1.5em;padding:.1em .5em;border-bottom:.2em solid var(--cy)}#queue b.q-hook{border-color:#ff8a1a}#queue b.q-upper{border-color:#fff}#queue b.q-feint{border-color:#c050ff;color:#e0a8ff}
#energy{display:flex;gap:.4em;align-items:center}#energy:before{content:"ENERGY";font-size:1.1em;color:#8fa3c8;margin-right:.5em;letter-spacing:.2em}#energy i{width:1.5em;height:1.5em;transform:skewX(-14deg);background:#1c2338;border:1px solid var(--line)}#energy i.on{background:var(--gold);box-shadow:0 0 .8em var(--gold)}
#mvRow{display:flex;gap:.5em;pointer-events:auto;align-items:stretch}
.mv,.pb{font:inherit;color:#fff;background:var(--glass);border:2px solid var(--c,var(--cy));min-width:7em;padding:.5em .6em;display:flex;flex-direction:column;align-items:center;gap:.1em;cursor:pointer;box-shadow:0 0 1em -.3em var(--c);touch-action:none}
.mv b,.pb b{font-size:1.5em;white-space:nowrap}.mv em{font-style:normal;font-size:1em;color:var(--gold)}.mv small{font-size:.85em;color:#8fa3c8;font-style:normal;font-weight:500;text-transform:none;letter-spacing:0}.mv.off{opacity:.35}
.mv:active,.pb:active{background:var(--c)}#btnGo{--c:var(--mg);background:linear-gradient(90deg,var(--mg),#ff5a8a);min-width:8em;justify-content:center}#btnGo b{font-size:2.4em}#btnGo.off{filter:grayscale(1);opacity:.5}
#btnUndo{--c:#66708a;min-width:4.5em;justify-content:center}#btnUlt{--c:#3a4a6a;justify-content:center;opacity:.45}#btnUlt b{font-size:1.1em;white-space:normal;max-width:6em;text-align:center}#btnUlt.ready{--c:var(--cy);opacity:1;animation:rdy .4s infinite alternate;background:linear-gradient(#0a7a90,#12324a)}
#menu{flex-direction:column;justify-content:space-between;padding:1.2em 2em;background:linear-gradient(rgba(3,4,10,.75),transparent 30%,transparent 55%,rgba(3,4,10,.92))}
#mTop{display:flex;justify-content:space-between;align-items:flex-start}#mTitle{width:30em}#best{font-size:1.15em;color:var(--cy);letter-spacing:.15em;margin-top:.8em}
#mR{width:30em;gap:.35em}#mR .ab{font-size:.95em}#chBox{display:flex;align-items:center;gap:.5em}#chBox button{font:inherit;font-size:2.4em;color:#fff;background:var(--glass);border:1px solid var(--line);width:1.4em;cursor:pointer}#chName{font-size:3em;line-height:1;text-align:center}#chRole{font-size:1.05em;color:#8fa3c8;text-align:center;letter-spacing:.2em}
.bars{flex-shrink:0;display:grid;grid-template-columns:5.4em 1fr;gap:.45em .6em;font-size:1em;line-height:1;align-items:center;color:#8fa3c8}.bars u{display:block;height:.6em;background:rgba(0,0,0,.6)}.bars u i{display:block;height:100%;background:var(--cy)}
.ab{font-size:1.05em;font-style:normal;font-weight:500;text-transform:none;letter-spacing:0;color:#c8d6f5;background:var(--glass);border-left:.25em solid var(--gold);padding:.3em .6em}.ab b{display:block;font-style:italic;text-transform:uppercase;color:#fff}
#events{display:flex;gap:.7em;overflow-x:auto;padding:.4em 0 .6em;touch-action:pan-x;scrollbar-width:none}
.ev{font:inherit;color:#fff;flex:0 0 15.5em;text-align:left;background:var(--glass);border:1px solid var(--line);border-top:.35em solid var(--c);padding:.6em .8em;display:flex;flex-direction:column;gap:.15em;cursor:pointer}.ev.sel{background:linear-gradient(color-mix(in srgb,var(--c) 35%,transparent),var(--glass));border-color:var(--c);box-shadow:0 0 1.2em -.3em var(--c)}.ev.lk{opacity:.45}
.ev .en{font-size:1.6em}.ev .eo{font-size:1em;color:var(--c);letter-spacing:.1em}.ev .ed{font-size:1em;font-style:normal;font-weight:500;text-transform:none;letter-spacing:0;color:#aebde0;min-height:2.4em}.ev .st{font-size:.9em;color:var(--gold)}
#btnPlay{align-self:flex-end;margin-top:.2em}#btnPlay small{font-size:.5em}#btnPlay.locked{filter:grayscale(1);opacity:.6}#btnPlay.buy{background:linear-gradient(90deg,#d9a800,var(--gold));color:#000}
#rStats{grid-template-columns:repeat(3,1fr)}#rStats div{font-size:2em}#rNote{font-size:1.3em;text-align:center;max-width:46em}
#result{background:rgba(3,4,10,.8)}
#btnSwitch{position:absolute;left:50%;top:1em;transform:translateX(-50%) skewX(-10deg);font-size:1.4em;color:#fff;text-decoration:none;background:linear-gradient(90deg,#7a2bff,var(--cy));padding:.3em 1em;box-shadow:0 0 1em -.2em var(--cy);z-index:5;pointer-events:auto}
#shop{align-items:center;justify-content:flex-end;padding:2em;background:linear-gradient(90deg,transparent 20%,rgba(3,4,10,.85) 55%);z-index:6}#shopBox{width:40em;display:flex;flex-direction:column;gap:.6em}#shop h2{margin:0;font-size:3em}
#sTabs{display:flex;gap:.3em}#sTabs button{flex:1;font:inherit;font-size:1.05em;color:#fff;background:#141a2e;border:1px solid var(--line);padding:.5em;cursor:pointer}#sTabs button.sel{background:var(--cy);color:#000}
#sList{display:grid;gap:.4em}.it{font:inherit;color:#fff;text-align:left;background:rgba(10,14,30,.85);border:1px solid var(--line);border-left:.3em solid var(--cy);padding:.5em .8em;display:flex;align-items:center;gap:.8em;cursor:pointer}.it i{width:2.4em;height:2.4em;border-radius:50%;flex:none}.it span{flex:1}.it b{font-size:1.5em;display:block}.it small{font-size:1em;color:#aebde0;font-style:normal;font-weight:500;text-transform:none;letter-spacing:0}.it em{font-style:normal;font-size:1.1em;color:var(--gold)}.it.sel{background:linear-gradient(90deg,rgba(34,230,255,.25),rgba(10,14,30,.85));border-color:var(--cy)}
#btnPlay{align-self:auto}

<div id="app">
<div id="stage"></div><div id="frame"></div>
<div id="dL" class="danger"></div><div id="dR" class="danger"></div><div id="dT" class="danger"></div>
<div id="dim"></div><div id="lines"></div><div id="vig"></div><div id="imp"></div>
<div id="fx"></div><div id="ring"><i id="ringIn"></i><b></b></div>
<div id="hud" class="pad">

  <div id="pName" class="nm"></div><div id="eName" class="nm"></div>
  <button id="btnQuit">✕</button><button id="btnMute">🔊</button>
  <div id="track"></div><div id="assist"></div><div id="combo"></div><div id="hint"></div><div id="banner"></div>

  <div id="atkPad" class="pad"><button id="btnHit" class="btn"><b>STRIKE</b><kbd>SPACE</kbd></button></div>
  <div id="plan"><div id="queue"></div><div id="energy"></div>
    <div id="mvRow">
      <button class="mv" data-k="jab" data-s="-1"><b>JAB</b><em></em><small>fast · side-step</small></button>
      <button class="mv" data-k="hook" data-s="-1" style="--c:#ff8a1a"><b>◀ HOOK</b><em></em><small>heavy · one side</small></button>
      <button class="mv" data-k="hook" data-s="1" style="--c:#ff8a1a"><b>HOOK ▶</b><em></em><small>heavy · one side</small></button>
      <button class="mv" data-k="upper" data-s="0" style="--c:#fff"><b>SMASH</b><em></em><small>must back away</small></button>
      <button class="mv" data-k="feint" data-s="-1" style="--c:#c050ff"><b>◀ FEINT</b><em></em><small>fake · bait a dodge</small></button>
      <button class="mv" data-k="feint" data-s="1" style="--c:#c050ff"><b>FEINT ▶</b><em></em><small>fake · bait a dodge</small></button>
      <button id="btnUlt" class="pb"><small style="font-size:.9em;color:var(--cy)">ULT</small><b></b></button>
      <button id="btnUndo" class="pb"><b>⌫</b></button><button id="btnGo" class="pb"><b>GO</b></button>
    </div></div>
</div>
<div id="menu" class="screen on">
  <a id="btnSwitch" href="fight.html">⇄ SWITCH TO DODGEFIGHT</a><div id="mTop"><div id="mTitle"><h1>DODGE<em>DUEL</em></h1><div id="best"></div></div>
    <div id="mR" style="display:flex;flex-direction:column"><div id="credBox">◈ <span id="credits">0</span></div>
      <div id="chBox"><button id="chPrev">◀</button><div style="flex:1"><div id="chName"></div><div id="chRole"></div></div><button id="chNext">▶</button></div>
      <div class="bars"><span>HEALTH</span><u><i id="bHp"></i></u><span>POWER</span><u><i id="bPow"></i></u><span>SPEED</span><u><i id="bSpd"></i></u><span>COUNTER</span><u><i id="bRead"></i></u></div>
      <div id="chPas" class="ab"></div><div id="chUlt" class="ab"></div><div style="display:flex;gap:.8em;justify-content:flex-end;align-items:center"><button id="btnShop" class="go alt" style="font-size:1.8em">SHOP</button><button id="btnPlay" class="go">FIGHT</button></div></div></div>
  <div><div class="sec">CHOOSE AN EVENT</div><div id="events"></div></div>
</div>
<div id="shop" class="screen"><div id="shopBox"><div style="display:flex;justify-content:space-between;align-items:center"><h2>SHOP</h2><div style="font-size:2em;color:var(--gold)">◈ <span id="sCred"></span></div><button id="btnShopX" class="go alt" style="font-size:1.6em">✕ CLOSE</button></div><div id="sTabs"></div><div id="sList"></div><div style="font-size:1em;color:#8fa3c8;font-style:normal;font-weight:500;text-transform:none;letter-spacing:0">Everything here is cosmetic and bought only with credits you earn by fighting.</div></div></div>
<div id="result" class="screen">
  <div id="rTitle"></div><div id="rStars"></div><div id="rStats"></div><div id="rNote"></div>
  <div class="row"><button id="btnMenu" class="go alt">MENU</button><button id="btnAgain" class="go cy">REMATCH</button><button id="btnNext" class="go">NEXT EVENT</button></div>
</div>
