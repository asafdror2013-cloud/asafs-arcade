<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: #14151c; color: #ddd; font: 12px/1.2 sans-serif; }
  #labels { position: absolute; left: 0; top: 0; pointer-events: none; }
  .lbl { position: absolute; padding: 3px 6px; background: rgba(0,0,0,.55); border-radius: 3px; }
  h1 { position: absolute; right: 8px; top: 4px; margin: 0; font-size: 14px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>
<h1 id="title"></h1>
<script src="three.min.js"></script>
<script>
(async function () {
  const q = new URLSearchParams(location.search);
  const sheetIdx = parseInt(q.get('sheet') || '0', 10);
  const view = q.get('view') || 'front';
  const cols = parseInt(q.get('cols') || '4', 10);
  const cell = parseInt(q.get('cell') || '320', 10);
  const sheets = await (await fetch('frames.json')).json();
  const sheet = sheets[sheetIdx];
  document.getElementById('title').textContent = sheet.title + ' (' + view + ')';
  const isArena = sheet.title === 'Arena';
  const n = sheet.frames.length;
  const c = isArena ? 1 : Math.min(cols, n);
  const rows = Math.ceil(n / c);
  const W = isArena ? 1400 : c * cell, H = isArena ? 900 : rows * cell;
  const canvas = document.getElementById('c');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
  renderer.setSize(W, H);
  renderer.setScissorTest(true);
  renderer.setClearColor(0x1a1c26);

  function wedgeGeo(w, h, d) {
    const x0 = -w / 2, x1 = w / 2, y0 = -h / 2, y1 = h / 2, z0 = -d / 2, z1 = d / 2;
    // cross-section: front-bottom (y0,z0), back-bottom (y0,z1), back-top (y1,z1)
    const P = [[x0,y0,z0],[x0,y0,z1],[x0,y1,z1],[x1,y0,z0],[x1,y0,z1],[x1,y1,z1]];
    const tris = [[0,2,1],[3,4,5],[0,1,4],[0,4,3],[1,2,5],[1,5,4],[0,3,5],[0,5,2]];
    const pos = [];
    tris.forEach(t => t.forEach(i => pos.push(...P[i])));
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.computeVertexNormals();
    return g;
  }

  function buildScene(frame) {
    const scene = new THREE.Scene();
    scene.add(new THREE.HemisphereLight(0x8890b0, 0x202028, 0.9));
    const sun = new THREE.DirectionalLight(0xffffff, 1.4);
    sun.position.set(6, 12, -8);
    scene.add(sun);
    const fill = new THREE.DirectionalLight(0x6688ff, 0.5);
    fill.position.set(-8, 4, 6);
    scene.add(fill);
    if (!isArena) {
      const grid = new THREE.GridHelper(24, 24, 0x555566, 0x333344);
      scene.add(grid);
    }
    for (const p of frame.parts) {
      const [sx, sy, sz] = p.z;
      let g;
      if (p.s === 'Wedge') g = wedgeGeo(sx, sy, sz);
      else if (p.s === 'Cylinder') { g = new THREE.CylinderGeometry(Math.min(sy, sz) / 2, Math.min(sy, sz) / 2, sx, 32); g.rotateZ(Math.PI / 2); }
      else if (p.s === 'Ball') g = new THREE.SphereGeometry(Math.min(sx, sy, sz) / 2, 20, 14);
      else g = new THREE.BoxGeometry(sx, sy, sz);
      const col = new THREE.Color(p.c[0], p.c[1], p.c[2]);
      let mat;
      if (p.t === 'Neon') mat = new THREE.MeshBasicMaterial({ color: col.clone().multiplyScalar(1.25) });
      else if (p.t === 'Metal' || p.t === 'DiamondPlate') mat = new THREE.MeshStandardMaterial({ color: col, metalness: 0.35, roughness: 0.45 });
      else mat = new THREE.MeshStandardMaterial({ color: col, roughness: 0.85 });
      if (p.a > 0) { mat.transparent = true; mat.opacity = 1 - p.a; if (p.a >= 0.99) continue; }
      const mesh = new THREE.Mesh(g, mat);
      const m = p.m;
      mesh.matrixAutoUpdate = false;
      mesh.matrix.set(m[3], m[4], m[5], m[0], m[6], m[7], m[8], m[1], m[9], m[10], m[11], m[2], 0, 0, 0, 1);
      scene.add(mesh);
      if (p.t !== 'Neon' && !isArena) {
        const e = new THREE.LineSegments(new THREE.EdgesGeometry(g), new THREE.LineBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.35 }));
        e.matrixAutoUpdate = false; e.matrix.copy(mesh.matrix); scene.add(e);
      }
    }
    return scene;
  }

  const views = {
    front: [7.5, 5.5, -11], game: [0, 19, 15], game2: [-14, 19, 6], side: [13, 4.5, 0], back: [-6, 6, 11], top: [0.01, 16, 0.01], threeq: [-9, 7, -9],
    arena: [0, 95, 120], arenalow: [0, 40, 75]
  };
  const labels = document.getElementById('labels');
  sheet.frames.forEach((frame, i) => {
    const col = i % c, row = Math.floor(i / c);
    const w = isArena ? W : cell, h = isArena ? H : cell;
    const x = col * w, y = H - (row + 1) * h;
    renderer.setViewport(x, y, w, h);
    renderer.setScissor(x, y, w, h);
    const cam = new THREE.PerspectiveCamera(isArena ? 50 : 40, w / h, 0.1, 2000);
    const v = views[isArena ? (q.get('view') === 'arenalow' ? 'arenalow' : 'arena') : view] || views.front;
    const target = isArena ? new THREE.Vector3(0, -8, 0) : new THREE.Vector3(0, sheet.title.startsWith('Brute') ? 3.6 : 3, 0);
    const k = sheet.title.startsWith('Brute') ? 1.5 : 1;
    cam.position.set(target.x + v[0] * k, v[1] * k, target.z + v[2] * k);
    cam.lookAt(target);
    renderer.render(buildScene(frame), cam);
    const d = document.createElement('div');
    d.className = 'lbl'; d.textContent = frame.label;
    d.style.left = (x + 4) + 'px'; d.style.top = (row * h + 4) + 'px';
    labels.appendChild(d);
  });
  window.__done = true;
})().catch(e => { document.body.textContent = 'ERR ' + e; window.__done = true; });
</script>
</body>
</html>
